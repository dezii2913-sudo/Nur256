{topic:'drugs',hot:false,q:'A client with type 1 diabetes asks why they cannot take metformin instead of insulin injections. What is the nurse\'s best response?',o:['Metformin would drop the blood glucose too low','Metformin is only approved for clients over the age of 65','Oral agents cause too much weight gain in type 1 diabetes','Oral agents require working beta cells, and type 1 diabetes destroys them'],c:3,t:'single',r:'<b>Type 1 is INSULIN ONLY.</b> Oral agents work by stimulating insulin release or reducing resistance, and a type 1 patient has <b>no beta cells left to stimulate</b>. There is nothing for the drug to act on.'},
{topic:'drugs',hot:false,q:'A client taking repaglinide before meals states they plan to skip lunch to attend an appointment. What should the nurse instruct?',o:['Take the dose at the usual time regardless of eating','Double the evening dose to compensate','Skip the dose scheduled for that meal','Take half the dose and eat a small snack'],c:2,t:'single',r:'<b>Meglitinides force insulin release and are taken 15 to 30 minutes before each meal.</b> Taking one without eating causes <b>hypoglycemia</b>. <b>No meal, no dose.</b>'},
{topic:'drugs',hot:true,q:'A client is receiving liraglutide for type 2 diabetes. Which item in the health history requires the nurse to contact the provider?',o:['A history of seasonal allergies','A history of hypertension controlled with lisinopril','A family history of medullary thyroid carcinoma','A body mass index of 34'],c:2,t:'single',r:'<b>GLP-1 agonists carry a BLACK BOX warning for thyroid C-cell tumors</b> and are contraindicated with a personal or family history of <b>medullary thyroid carcinoma or MEN 2</b>. Obesity and hypertension are typical of the population it treats.'},
{topic:'drugs',hot:false,q:'A client with end-stage renal disease is prescribed calcium carbonate as a phosphate binder. When should it be administered?',o:['At bedtime with a full glass of water','With meals','Between meals on an empty stomach','One hour before meals'],c:1,t:'single',r:'<b>Phosphate binders bind the phosphorus IN FOOD</b>, so they must be given <b>with meals</b>. Taken between meals there is nothing to bind and the drug does nothing.'},
{topic:'drugs',hot:true,q:'A nurse is reviewing medications for a client with type 2 diabetes. Which drugs can cause hypoglycemia when used as the only agent? Select all that apply.',o:['Metformin','Repaglinide','Glipizide','Sitagliptin','Glyburide','Glimepiride'],c:[1,2,4,5],t:'multi',r:'<b>Only drugs that FORCE insulin release cause hypoglycemia alone</b> \\u2014 the <b>sulfonylureas</b> (glipizide, glyburide, glimepiride) and the <b>meglitinides</b> (repaglinide). <b>Metformin</b> reduces hepatic glucose production and <b>sitagliptin</b> works on incretins; neither forces release.'},
{topic:'skin',hot:true,q:'A client scores 11 on the Braden Scale. How should the nurse interpret this result?',o:['High risk for pressure injury, requiring an aggressive prevention plan','No risk, since scores below 12 indicate intact protective mechanisms','Moderate risk, requiring repositioning every 4 hours','Low risk, requiring only routine skin assessment'],c:0,t:'single',r:'<b>The LOWER the Braden score, the HIGHER the risk.</b> 10 to 12 is <b>HIGH risk</b>. 19 to 23 is no risk, 15 to 18 mild, 13 to 14 moderate, and 9 or below severe. Students reverse this because a low number feels like a low problem.'},
{topic:'skin',hot:true,q:'A nurse assesses a client who has been supine for several hours and finds a 3 cm area of deep purple discoloration over the sacrum. The skin is intact and the area feels boggy. How should this be documented?',o:['Stage 2 pressure injury','Deep tissue pressure injury','Stage 1 pressure injury','Unstageable pressure injury'],c:1,t:'single',r:'<b>Intact skin with purple or maroon discoloration that feels BOGGY is a deep tissue injury</b> \\u2014 the damage started in the tissue <b>underneath</b>, because <b>muscle dies before skin does</b>. A <b>Stage 1</b> is intact skin with <b>nonblanchable RED</b> discoloration. <b>Unstageable</b> means the base is obscured by eschar or slough.'},
{topic:'skin',hot:true,q:'A client sits in a wheelchair for most of the day. Which instruction is most important for pressure injury prevention?',o:['Use a donut-shaped cushion to relieve pressure on the sacrum','Reposition every 2 hours as with a bedbound client','Remain seated for no more than 8 hours per day','Shift weight or reposition every 15 minutes while seated'],c:3,t:'single',r:'<b>Sitting concentrates the entire body weight on the ischial tuberosities</b>, so the tolerance window is far shorter \\u2014 <b>every 15 minutes in a chair</b> versus <b>every 2 hours in bed</b>. <b>Donut cushions are contraindicated</b>; they create a ring of ischemia around the area.'},
{topic:'skin',hot:false,q:'A nursing assistant asks why a reddened area over a client\'s heel should not be massaged. What is the nurse\'s best response?',o:['Massage is effective but too time-consuming on a busy unit','Massage is reserved for areas that have already broken open','Massage further damages capillaries that are already compromised','Massage should only be done with a lubricating lotion'],c:2,t:'single',r:'<b>Never massage over a bony prominence or a reddened area.</b> The capillaries there are already ischemic, and friction and pressure from massage cause <b>further tissue trauma</b>. Offload the area instead.'},
{topic:'skin',hot:false,q:'A nurse is caring for a client with limited mobility. Which intervention best addresses the FRICTION AND SHEAR subscale of the Braden Scale?',o:['Using a slide sheet and lift to move the client up in bed','Turning the client every 2 hours','Applying a moisture barrier cream after each incontinence episode','Providing a high-protein supplement between meals'],c:0,t:'single',r:'<b>Friction and shear come from DRAGGING.</b> A <b>friction-reducing device</b> lets you lift rather than drag. Barrier cream addresses <b>moisture</b>, the supplement addresses <b>nutrition</b>, and turning addresses <b>mobility and activity</b> \\u2014 all different subscales.'},
{topic:'skin',hot:true,q:'Which factors increase a client\'s risk for pressure injury? Select all that apply.',o:['Urinary and fecal incontinence','Diabetic peripheral neuropathy','Advanced age with reduced subcutaneous fat','Intact sensory perception','Dehydration and poor protein intake','Ability to reposition independently'],c:[0,1,2,4],t:'multi',r:'<b>Incontinence</b> macerates skin, <b>neuropathy</b> removes the discomfort that would prompt repositioning, <b>aging</b> thins the padding over bone, and <b>dehydration and poor nutrition</b> impair healing. Independent repositioning and intact sensation are <b>protective</b>.'},
{topic:'eye',hot:true,q:'A client is diagnosed with primary open-angle glaucoma. Which statement indicates the client needs further teaching?',o:['I should avoid lifting heavy objects and straining','I will wait 5 minutes before instilling my second medication','Once my pressure comes down I can stop using the drops','I will press the inner corner of my eye after each drop'],c:2,t:'single',r:'<b>Glaucoma drops are for LIFE.</b> The disease is controlled, never cured, and <b>vision already lost does not return</b>. Stopping when pressure normalizes is the most common cause of preventable blindness in these clients. The other three statements are all correct.'},
{topic:'eye',hot:true,q:'A client arrives reporting sudden severe eye pain, blurred vision, halos around lights, and nausea. Assessment reveals a fixed mid-dilated pupil and a red eye. What is the priority action?',o:['Apply a cool compress and reassess in 30 minutes','Notify the provider immediately, as this is an ocular emergency','Instill a mydriatic drop to improve visualization','Administer an antiemetic and darken the room'],c:1,t:'single',r:'<b>Acute angle-closure glaucoma.</b> Sudden pain, halos, nausea, and a <b>fixed mid-dilated pupil</b> mean intraocular pressure is rising fast and <b>blindness can occur within hours</b>. <b>A mydriatic would dilate the pupil further and worsen the obstruction</b> \\u2014 it is contraindicated.'},
{topic:'eye',hot:true,q:'A client\'s visual acuity is documented as 20/200 in the better eye with corrective lenses. How does the nurse interpret this?',o:['The client sees at 200 feet what a normal eye sees at 20 feet','The client has mildly reduced vision requiring stronger lenses','The client meets the criteria for legal blindness','The client has better than average distance vision'],c:2,t:'single',r:'<b>20/200 or worse in the BETTER eye with BEST correction is legal blindness</b>, as is a visual field of <b>20 degrees or less</b>. Read the fraction as: what a normal eye sees at <b>200 feet</b>, this client must be at <b>20 feet</b> to see. <b>A bigger bottom number means worse vision.</b>'},
{topic:'eye',hot:true,q:'A construction worker presents with a metal fragment embedded in the right eye. What is the appropriate nursing action?',o:['Apply direct pressure over the eye to control bleeding','Stabilize the object in place, shield both eyes, and arrange urgent referral','Gently remove the fragment with sterile forceps and irrigate','Irrigate the eye with saline until the fragment dislodges'],c:1,t:'single',r:'<b>NEVER remove an impaled object</b> \\u2014 removal can allow the eye to lose its contents. <b>Stabilize it, cover with a rigid shield rather than pressure</b>, and <b>patch BOTH eyes</b> because the eyes track together. Keep the client <b>NPO</b> in case of surgery.'},
{topic:'eye',hot:true,q:'A client splashes an alkaline cleaning solution into the eye. What should the nurse do FIRST?',o:['Instill an anesthetic drop to relieve pain before irrigating','Apply an eye patch and transport to the emergency department','Identify the exact chemical before starting treatment','Begin copious irrigation with water or saline immediately'],c:3,t:'single',r:'<b>Chemical exposure is the one eye emergency where you act before anything else.</b> Irrigate <b>immediately</b>, at least 15 to 20 minutes, from the <b>inner canthus outward</b> so it does not wash into the other eye. <b>Do not delay to identify the chemical.</b> <b>Alkali burns are worse than acid</b> because they keep penetrating.'},
{topic:'eye',hot:false,q:'A client is scheduled for photodynamic therapy with verteporfin for wet macular degeneration. Which instruction is essential?',o:['Instill antibiotic drops four times daily for 5 days','Avoid reading for 5 days after treatment','Avoid direct sunlight and bright light for 5 days after treatment','Sleep with the head of the bed elevated for 5 days'],c:2,t:'single',r:'<b>Verteporfin is a light-activated dye.</b> Exposure to strong light within <b>5 days</b> can activate it near the skin surface and cause burns. That includes <b>bright sunlight, tanning booths, halogen lights, dental office lights, and operating room lights</b>. Protective clothing and sunglasses outdoors.'},
{topic:'eye',hot:false,q:'A client reports gradual central vision loss, describing a blurred spot in the middle of the visual field while still able to navigate a room. Which condition is most consistent?',o:['Retinal detachment','Cataract','Age-related macular degeneration','Primary open-angle glaucoma'],c:2,t:'single',r:'<b>AMD takes the CENTER; glaucoma takes the PERIPHERY.</b> An AMD client cannot read or recognize faces but <b>can still walk around a room</b>. Glaucoma is the reverse. <b>Retinal detachment</b> is sudden with a curtain, floaters, and flashes.'},
{topic:'eye',hot:true,q:'Which activities should a client with glaucoma be taught to avoid? Select all that apply.',o:['Reading in a well-lit room','Straining during bowel movements','Wearing a tight necktie or collar','Lifting heavy objects','Walking for exercise','Bending at the waist to pick something up'],c:[1,2,3,5],t:'multi',r:'All four raise <b>intraocular pressure</b>. Straining, lifting, and tight clothing are <b>Valsalva or venous obstruction</b>; bending at the waist puts the <b>head below the heart</b>. <b>Bend at the knees instead.</b> Walking and reading are fine and encouraged.'},
{topic:'ear',hot:true,q:'An older adult states, \'I can hear that you are talking, I just can\'t understand the words.\' Which type of hearing loss does this describe?',o:['Conductive loss from cerumen impaction','Temporary loss from middle ear effusion','Sensorineural loss from presbycusis affecting high-frequency sounds','Mixed hearing loss from otosclerosis'],c:2,t:'single',r:'<b>Presbycusis kills the high-frequency hair cells at the base of the cochlea first.</b> Consonants like <b>s, f, th, sh, and k</b> are high-frequency, so speech is <b>audible but not intelligible</b>. <b>Shouting does not help</b> \\u2014 volume was never the problem. Lower your pitch, speak slowly, face them, and reduce background noise.'},
{topic:'ear',hot:true,q:'A client with Ménière\'s disease asks what dietary change will help most. What should the nurse teach?',o:['Follow a high-protein, low-carbohydrate diet','Restrict fluid intake to 1 liter per day','Limit sodium to 1,000 to 1,500 mg per day','Increase potassium-rich foods'],c:2,t:'single',r:'Ménière\'s is caused by <b>overproduction or decreased absorption of ENDOLYMPH</b> \\u2014 too much fluid in the inner ear. <b>Low sodium (1,000 to 1,500 mg) reduces fluid retention.</b> Also avoid <b>caffeine, alcohol, and nicotine</b>.'},
{topic:'ear',hot:true,q:'A nurse is preparing to instill antibiotic ear drops in an adult. Which action should be taken first?',o:['Warm the drops by rolling the bottle between the hands','Assess for a perforated tympanic membrane','Pull the pinna up and back','Position the client side-lying with the affected ear up'],c:1,t:'single',r:'<b>Assess for perforation BEFORE instilling anything.</b> Drops entering through a perforated drum can reach the middle ear and cause damage or infection. Everything else follows: <b>remove cerumen, warm the drops</b> (cold causes a vestibular reaction), <b>pull the pinna up and back in adults</b>, remain side-lying about <b>5 minutes</b>, and <b>massage the tragus</b>.'},
{topic:'ear',hot:false,q:'A parent asks why their toddler keeps getting ear infections. What is the nurse\'s best explanation?',o:['Children\'s immune systems cannot fight ear bacteria until age 5','Children produce more cerumen, which traps bacteria','Children have larger tonsils that block the ear canal','A young child\'s eustachian tube is shorter, wider, and more horizontal, so fluid drains into the middle ear'],c:3,t:'single',r:'<b>The eustachian tube connects the middle ear to the throat.</b> In young children it is <b>shorter, wider, and more HORIZONTAL</b>, so throat secretions drain <b>into</b> the middle ear rather than away. It becomes more vertical with growth, which is why most children outgrow them.'},
{topic:'ear',hot:false,q:'A client with Ménière\'s disease is experiencing an acute attack. What is the priority nursing action?',o:['Assist the client to lie still in a darkened room with the side rails up','Encourage ambulation to help the client regain balance','Provide a full meal to prevent weakness','Perform the Romberg test to document the severity'],c:0,t:'single',r:'<b>Safety is the priority.</b> Severe whirling vertigo means the client <b>cannot stand or walk</b> and is a serious <b>fall risk</b>. Lie still, minimize head movement, darken the room, side rails up, call light within reach. Testing balance during an attack would cause a fall.'},
{topic:'ear',hot:false,q:'A nurse performs the Romberg test. The client sways significantly when the eyes are closed. What does this indicate?',o:['Impaired vestibular or proprioceptive function','Impaired visual acuity','Normal balance compensation','Cerebellar hemorrhage requiring immediate imaging'],c:0,t:'single',r:'<b>Closing the eyes removes VISION</b>, one of the three systems that maintain balance. If the client sways, they were relying on vision to compensate for impaired <b>vestibular or proprioceptive</b> input. <b>Stand beside the client</b> \\u2014 a positive Romberg means a fall risk.'},
{topic:'insulin',hot:true,q:'A client receives NPH insulin at 0700. Based on its peak, when should the nurse monitor most closely for hypoglycemia?',o:['Between 0715 and 0730','Between 2200 and 0600','Between 1300 and 2100','Between 0800 and 0900'],c:2,t:'single',r:'<b>NPH peaks in 6 to 14 hours.</b> Given at 0700, the peak window falls between <b>1300 and 2100</b> \\u2014 mid-afternoon into evening. <b>Hypoglycemia happens at PEAK</b>, so find the insulin, find the peak, and add it to the administration time.'},
{topic:'insulin',hot:true,q:'A nurse is preparing to mix NPH and regular insulin in one syringe. Which step sequence is correct?',o:['Inject air into both vials, then draw up NPH followed by regular','Inject air into NPH, inject air into regular, draw up regular, draw up NPH','Draw up NPH first, then regular, without injecting air','Inject air into regular, inject air into NPH, draw up NPH, draw up regular'],c:1,t:'single',r:'<b>Air cloudy, air clear, draw clear, draw cloudy.</b> Drawing the cloudy NPH first would carry residue back into the <b>regular</b> vial and alter the fast-acting insulin. <b>Clear before cloudy</b> \\u2014 and <b>roll NPH, never shake it</b>.'},
{topic:'insulin',hot:true,q:'A nurse finds that a client\'s vial of glargine appears cloudy. What is the appropriate action?',o:['Shake the vial vigorously and then administer','Discard the vial, since only NPH should appear cloudy','Administer it, since cloudiness is expected in long-acting insulin','Roll the vial gently between the palms to resuspend it'],c:1,t:'single',r:'<b>NPH is the ONLY insulin that should be cloudy.</b> A cloudy regular, lispro, aspart, glulisine, glargine, or detemir vial has <b>degraded or is contaminated \\u2014 discard it</b>. Rolling applies only to NPH, and <b>no insulin is ever shaken</b>.'},
{topic:'insulin',hot:false,q:'A client on high-dose insulin reports muscle cramps. Which electrolyte abnormality should the nurse suspect?',o:['Hyperkalemia','Hypokalemia','Hypercalcemia','Hypernatremia'],c:1,t:'single',r:'<b>Insulin drives potassium INTO cells along with glucose</b>, lowering the serum level. On large doses, watch for <b>hypokalemia</b> \\u2014 <b>muscle cramps and cardiac dysrhythmias</b>. This is the same mechanism that makes insulin a treatment for <b>hyperkalemia</b>.'},
{topic:'diabetes',hot:true,q:'A client with type 1 diabetes has influenza with vomiting and is eating very little. The client asks whether to hold the insulin. What should the nurse advise?',o:['Hold the insulin until able to eat a full meal','Take the insulin, eat small carbohydrate-containing meals, drink fluids, and check glucose every 4 hours','Take half the usual dose and recheck in the morning','Hold the insulin and take an oral agent instead'],c:1,t:'single',r:'<b>NEVER hold insulin during illness.</b> <b>Cortisol and other stress hormones raise glucose</b>, so the requirement often <b>increases</b> even when eating less. His sick day rules: <b>take your insulin, eat small meals including carbs, drink fluids frequently, check glucose every 4 hours.</b> Holding it is how a type 1 client arrives in DKA.'},
{topic:'diabetes',hot:true,q:'A 42-year-old adult diagnosed with type 2 diabetes has not responded to metformin and a sulfonylurea, and the A1C continues to climb. Antibodies to pancreatic beta cells are found. What does the nurse suspect?',o:['Poor medication adherence','Latent autoimmune diabetes of adults (LADA)','Gestational diabetes','Metabolic syndrome'],c:1,t:'single',r:'<b>LADA is a slow-forming type 1 that appears in adulthood</b>, so it is frequently misdiagnosed as type 2. The giveaway is an adult who <b>looks like a type 2 but does not respond to oral agents</b> and keeps declining. <b>They will need insulin eventually</b> because the beta cells are being destroyed.'},
{topic:'diabetes',hot:false,q:'Which findings are components of metabolic syndrome? Select all that apply.',o:['Hypertension','Elevated triglycerides','Low white blood cell count','Low HDL with elevated LDL','Waist circumference over 40 inches in a man','Elevated serum creatinine'],c:[0,1,3,4],t:'multi',r:'The five components are <b>central obesity</b> (men over 40 inches, women over 35), <b>dyslipidemia</b> (low HDL, high LDL), <b>elevated triglycerides</b>, <b>hypertension</b>, and <b>hyperinsulinemia with hyperglycemia</b>. <b>Three of five</b> makes the diagnosis. Creatinine and white count are not criteria.'},
{topic:'dka',hot:true,q:'A client with HHS has a glucose of 890 mg/dL, is severely dehydrated, and is lethargic. Which prescription should the nurse question?',o:['Obtain serum potassium before starting the insulin drip','Begin 0.9% sodium chloride at 500 mL/hr','Begin lactated Ringer\'s at 500 mL/hr','Monitor neurologic status every hour'],c:2,t:'single',r:'<b>Avoid lactated solutions in acidosis and in these hyperglycemic emergencies.</b> LR contains <b>lactate</b>, which a poorly perfused client may not clear, and <b>potassium</b>, which is already unpredictable. <b>Isotonic 0.9% normal saline is the fluid for both DKA and HHS.</b> Fluids come before insulin in HHS.'},
{topic:'complications',hot:true,q:'A client with a 15-year history of type 2 diabetes reports new fatigue, shortness of breath climbing stairs, and nausea for two days. The client denies chest pain. What should the nurse suspect?',o:['Hypoglycemia from an excessive medication dose','Myocardial infarction, since diabetic neuropathy can blunt chest pain','Influenza, given the nausea and fatigue','Normal deconditioning from inactivity'],c:1,t:'single',r:'<b>Diabetics have SILENT myocardial infarctions.</b> Autonomic neuropathy blunts the pain pathway, so they present with <b>fatigue, dyspnea, nausea, or confusion instead of chest pain</b>. Coronary artery disease is the <b>leading cause of death in diabetes</b>. Dismissing symptoms because there is no chest pain is the trap.'},
{topic:'complications',hot:true,q:'A client with type 2 diabetes has a urine microalbumin of 90 mg/g with a normal serum creatinine. Which prescription does the nurse anticipate?',o:['An ACE inhibitor for renal protection','Protein supplementation to replace urinary losses','Immediate hemodialysis','A loop diuretic to increase urine output'],c:0,t:'single',r:'<b>Microalbuminuria is the EARLIEST sign of diabetic nephropathy</b> \\u2014 protein appears in the urine long before creatinine rises. <b>ACE inhibitors and ARBs are renal-protective and are prescribed even with a normal blood pressure.</b> Diabetes is the <b>leading cause of end-stage renal disease</b>.'},
{topic:'complications',hot:true,q:'A client with diabetic peripheral neuropathy asks why the provider insists on daily foot inspection when the feet do not hurt. What is the nurse\'s best response?',o:['Inspection is mainly to check for swelling from heart failure','The absence of pain means an injury can go unnoticed until it becomes serious','Daily inspection is only necessary once an ulcer has formed','Pain always develops before any tissue damage occurs'],c:1,t:'single',r:'<b>Pain is protective.</b> A client who cannot feel a pebble, a blister, or hot bathwater will injure the foot and <b>not know it</b>, and poor circulation means it will not heal. <b>Neuropathy plus peripheral artery disease is how diabetics lose limbs.</b>'},
{topic:'complications',hot:false,q:'A client with diabetes reports early satiety, bloating, and unpredictable blood glucose readings despite consistent insulin dosing. What complication does this suggest?',o:['Hypoglycemia unawareness','Diabetic nephropathy','Gastroparesis from autonomic neuropathy','Retinopathy'],c:2,t:'single',r:'<b>Gastroparesis</b> is autonomic neuropathy of the stomach. Food absorption becomes <b>erratic and unpredictable</b>, so insulin timed to a meal no longer matches when the glucose actually rises. Teach <b>small, frequent, low-fat meals</b>.'},
{topic:'complications',hot:true,q:'Which client statement indicates correct understanding of diabetic foot care?',o:['I trim my toenails in a rounded shape to match my toes','I apply lotion between my toes to keep the skin from cracking','I use a heating pad on my feet at night when they feel cold','I test the bathwater with my elbow before putting my feet in'],c:3,t:'single',r:'<b>Test water with the elbow or a thermometer \\u2014 never the feet</b>, which cannot sense a burn. The three wrong options are the <b>three NEVERs</b>: <b>never a heating pad</b>, <b>never lotion between the toes</b> (traps moisture, causes fungal breakdown), and <b>nails are cut STRAIGHT ACROSS</b>, never rounded into the corners.'},
{topic:'complications',hot:false,q:'A client with diabetes has not had an eye examination in four years and reports no vision problems. What should the nurse advise?',o:['Schedule a dilated eye exam now, since retinopathy is asymptomatic until vision is lost','An annual vision screening at a pharmacy is sufficient','Wait until vision changes occur before scheduling','Eye exams are only needed for clients using insulin'],c:0,t:'single',r:'<b>Diabetic retinopathy is asymptomatic until damage is already done</b> and is the <b>leading cause of new blindness in adults</b>. An <b>annual DILATED eye exam</b> is required regardless of symptoms \\u2014 a vision screening does not visualize the retina.'},
{topic:'complications',hot:false,q:'A client with long-standing diabetes reports dizziness and near-fainting when standing from a chair. Which complication explains this?',o:['Autonomic neuropathy causing orthostatic hypotension','Retinopathy affecting depth perception','Hypoglycemia from a missed meal','Nephropathy causing fluid overload'],c:0,t:'single',r:'<b>Cardiac autonomic neuropathy</b> impairs the reflex that constricts vessels on standing, causing <b>orthostatic hypotension</b>. It also causes <b>resting tachycardia</b> and <b>silent MI</b>. Teach <b>slow position changes</b> and dangling before standing.'},
{topic:'complications',hot:true,q:'Which findings would the nurse expect in a client with peripheral artery disease related to diabetes? Select all that apply.',o:['Hair loss on the lower legs','Diminished pedal pulses','Warm reddened extremities with bounding pulses','Shiny taut skin','Brisk capillary refill under 2 seconds','Cool extremities'],c:[0,1,3,5],t:'multi',r:'<b>PAD means inadequate arterial inflow</b> \\u2014 <b>diminished pulses, cool skin, hair loss, shiny taut skin</b>, and delayed capillary refill. Warm reddened extremities with bounding pulses describe <b>adequate or increased</b> flow, not PAD.'},
{topic:'insulin',hot:true,q:'A client is to receive lispro insulin before breakfast. When should the nurse administer it?',o:['One hour after the meal is finished','At bedtime regardless of meals','Immediately before the meal, once the food tray is present','Thirty to sixty minutes before the meal'],c:2,t:'single',r:'<b>Rapid-acting insulin has an onset of 15 to 30 minutes</b>, so it is given <b>immediately before eating with the tray in front of the client</b>. Giving it early risks hypoglycemia if the meal is delayed. <b>Regular insulin</b> is the one given <b>30 to 60 minutes before</b>.'},
{topic:'insulin',hot:true,q:'A nurse is caring for four clients. Which one requires the most immediate attention?',o:['A client on glargine reporting mild injection site discomfort','A client who received rapid-acting insulin 90 minutes ago and is now diaphoretic and confused','A client with an A1C of 8.2% scheduled for teaching','A client with a fasting glucose of 148 mg/dL'],c:1,t:'single',r:'<b>Rapid-acting insulin peaks in 0.5 to 2.5 hours</b>, so 90 minutes is squarely in the peak window \\u2014 and <b>diaphoresis with confusion is hypoglycemia</b>, which is immediately life-threatening. The others are important but stable. <b>Acute beats chronic.</b>'},
{topic:'insulin',hot:false,q:'A client asks why they gained weight after starting insulin. What is the nurse\'s best explanation?',o:['Insulin causes fluid retention that will resolve within a week','Weight gain means the insulin is not working properly','Insulin is a growth hormone that promotes storage of glucose as fat','The weight gain indicates the dose is too high and must be reduced'],c:2,t:'single',r:'<b>Insulin is a storage hormone</b> \\u2014 it drives glucose into cells, stores it, and <b>blocks fat breakdown (lipolysis)</b>. Weight gain is an <b>expected effect</b>, not a sign of failure, and is never a reason to skip doses. Address it with diet and activity.'},
{topic:'insulin',hot:true,q:'A client rotates insulin injections within a two-inch area of the abdomen and now has a raised, thickened, rubbery area at the site. What has developed, and what is the concern?',o:['Lipohypertrophy, which makes absorption from that site unreliable','A hematoma, which will resolve without intervention','Lipoatrophy, which indicates an allergic reaction','Cellulitis, which requires systemic antibiotics'],c:0,t:'single',r:'<b>Repeated injection in one spot causes lipohypertrophy</b> \\u2014 fatty thickening. Insulin absorbed from that tissue is <b>erratic</b>, causing unexplained glucose swings. <b>Rotate 1 inch from the previous site</b> and stay <b>2 inches from the umbilicus</b>. <b>Lipoatrophy</b> is the opposite \\u2014 loss of subcutaneous fat.'},
{topic:'insulin',hot:false,q:'A client\'s morning glucose is consistently elevated. The 3 AM glucose is 52 mg/dL. What does the nurse anticipate?',o:['Decreasing the evening insulin dose','Increasing the evening insulin dose','Adding a rapid-acting insulin at bedtime','Withholding the morning dose'],c:0,t:'single',r:'<b>A LOW 3 AM glucose with a high morning glucose is the SOMOGYI effect</b> \\u2014 nighttime hypoglycemia triggers counterregulatory hormones and rebound hyperglycemia. The fix is <b>LESS evening insulin</b> or a bedtime snack. If the 3 AM had been <b>high</b>, that would be <b>DAWN phenomenon</b>, needing <b>more</b> evening insulin. Same morning number, opposite fixes.'},
{topic:'dka',hot:true,q:'A client with DKA has a serum potassium of 3.2 mEq/L. The provider prescribes an insulin drip. What should the nurse do?',o:['Start the insulin drip and recheck potassium in 4 hours','Hold the insulin, notify the provider, and anticipate potassium replacement first','Start the insulin drip at half the prescribed rate','Administer the insulin and give oral potassium with it'],c:1,t:'single',r:'<b>Insulin drives potassium INTO cells</b>, so starting a drip on a client who is <b>already hypokalemic</b> can drop the level into a lethal range and cause dysrhythmias. <b>Replace potassium first.</b> In DKA the serum potassium often reads normal or high on arrival while <b>total body potassium is depleted</b>.'},
{topic:'dka',hot:true,q:'A client being treated for DKA has a glucose that has fallen from 620 to 240 mg/dL on an insulin drip. Which change does the nurse anticipate?',o:['Switching to subcutaneous long-acting insulin only','Increasing the insulin drip rate','Adding dextrose to the IV fluids while continuing the insulin drip','Stopping the insulin drip immediately'],c:2,t:'single',r:'<b>Dextrose is added once glucose reaches about 250</b> so the <b>insulin can keep running to clear the ketones and close the anion gap</b> without dropping the glucose too low. <b>Stopping the insulin stops ketone clearance</b> and the acidosis returns.'},
{topic:'dka',hot:false,q:'Which assessment finding distinguishes DKA from HHS?',o:['Blood glucose above 600 mg/dL','Profound dehydration','Kussmaul respirations with fruity breath','Altered level of consciousness'],c:2,t:'single',r:'<b>Kussmaul respirations and fruity breath mean KETOSIS AND ACIDOSIS \\u2014 DKA only.</b> Both conditions have <b>high glucose and dehydration</b>, and HHS often has the <b>higher</b> glucose and <b>more profound</b> mental status change. <b>The question is always: is there acidosis?</b>'},
{topic:'diabetes',hot:true,q:'A client with type 2 diabetes asks whether exercise is safe when the morning glucose is 280 mg/dL and urine ketones are positive. What should the nurse advise?',o:['Exercise vigorously to bring the glucose down faster','Exercise is safe at any glucose level for type 2 diabetes','Exercise only after taking an extra dose of oral medication','Do not exercise until the glucose is lower and ketones have cleared'],c:3,t:'single',r:'<b>Restrict exercise when glucose is above 250, especially with ketones.</b> Without enough insulin the exercising cells <b>cannot use the glucose</b>, so the body burns fat instead and <b>produces MORE ketones</b>, worsening acidosis. Exercise is also a <b>physiologic stressor that raises cortisol and glucose</b>.'},
{topic:'diabetes',hot:true,q:'A client newly diagnosed with type 2 diabetes has an A1C of 6.1%. How should the nurse interpret this value?',o:['It confirms poorly controlled diabetes','It is a normal result requiring no follow-up','It falls in the prediabetes range and is below the diabetes threshold','It indicates the client has type 1 diabetes'],c:2,t:'single',r:'<b>Under 5.7% is normal, 5.7 to 6.4% is PREDIABETES, and 6.5% or higher confirms diabetes.</b> An A1C of 6.1% is in the prediabetes range \\u2014 which is the stage where <b>lifestyle change can still reverse the trajectory</b>.'},
{topic:'diabetes',hot:false,q:'A client had gestational diabetes during pregnancy that resolved after delivery. What teaching is most important?',o:['Ongoing screening is needed because the lifetime risk of type 2 diabetes is significantly increased','No further follow-up is needed since the condition resolved','Insulin will be required with every future pregnancy','The child is guaranteed to develop type 1 diabetes'],c:0,t:'single',r:'<b>Gestational diabetes usually resolves after delivery but greatly raises the lifetime risk of type 2.</b> These clients need <b>ongoing screening</b> and lifestyle counseling. It also raised risks during the pregnancy for <b>macrosomia, birth injury, and neonatal hypoglycemia</b>.'},
{topic:'diabetes',hot:true,q:'A client is admitted with pneumonia and started on high-dose prednisone. The nurse notes the blood glucose has risen from 110 to 260 mg/dL. What is the most likely explanation?',o:['The client has developed type 1 diabetes','The rise indicates the pneumonia is resolving','Corticosteroids raise blood glucose and often require temporary insulin coverage','The glucometer is malfunctioning and should be recalibrated'],c:2,t:'single',r:'<b>Corticosteroids raise blood glucose</b> by increasing hepatic glucose production and insulin resistance \\u2014 the same pathway as <b>cortisol</b>, the stress hormone. This is <b>expected</b>, not an error, and is why steroid-treated clients get <b>glucose monitoring and often temporary insulin</b>.'},
{topic:'hypo',hot:true,q:'A client is found unresponsive with a blood glucose of 38 mg/dL. There is no IV access. What is the priority action?',o:['Administer glucagon intramuscularly and position the client on their side','Give 4 ounces of orange juice through a straw','Place glucose gel inside the cheek and monitor','Start an IV and administer 50% dextrose'],c:0,t:'single',r:'<b>Nothing by mouth in an unresponsive client \\u2014 they will aspirate.</b> With no IV access the answer is <b>glucagon IM or subcutaneously</b>, and the client is placed <b>on their side because glucagon commonly causes vomiting</b>. <b>Repeat in 10 minutes if still unconscious.</b> With IV access available, <b>D50</b> would be the choice.'},
{topic:'hypo',hot:true,q:'A conscious client reports shakiness and has a glucose of 62 mg/dL. After giving 15 grams of carbohydrate, what should the nurse do next?',o:['Give an additional 30 grams of carbohydrate immediately','Recheck the blood glucose in 15 minutes and repeat if still low','Recheck the glucose in 1 hour','Administer the client\'s next insulin dose as scheduled'],c:1,t:'single',r:'<b>15 x 15 x 15: 15 grams of carbohydrate, recheck in 15 minutes, repeat 15 grams if still low.</b> Once it is back up, follow with a <b>protein and complex carbohydrate snack</b> if the next meal is more than an hour away.'},
{topic:'hypo',hot:false,q:'A client taking a beta blocker for hypertension also uses insulin. What should the nurse emphasize in teaching?',o:['Beta blockers increase the risk of hyperglycemia','Beta blockers can mask the early warning signs of hypoglycemia','Beta blockers eliminate the need for glucose monitoring','Insulin should be stopped while taking a beta blocker'],c:1,t:'single',r:'<b>Beta blockers blunt the adrenergic warning signs</b> \\u2014 tachycardia, tremor, palpitations. The client may drop into hypoglycemia and <b>go straight to confusion or unconsciousness</b> with no warning. <b>Diaphoresis usually persists.</b> Emphasize <b>frequent glucose monitoring</b>.'},
{topic:'derm',hot:true,q:'A client has a painful unilateral vesicular rash along a single dermatome on the right chest that does not cross midline. What does the nurse suspect?',o:['Cellulitis','Herpes zoster (shingles)','Impetigo','Contact dermatitis'],c:1,t:'single',r:'<b>Unilateral vesicles following ONE dermatome and not crossing midline is shingles.</b> Burning pain often precedes the rash. Antivirals work best <b>within 72 hours</b> of rash onset.'},
{topic:'derm',hot:true,q:'A client is diagnosed with herpes zoster. Which precaution is correct?',o:['Contagious for 6 weeks after the rash resolves','Contagious only through respiratory droplets','Not contagious at any stage','Contagious as chickenpox to anyone never infected, until lesions crust'],c:3,t:'single',r:'You cannot \'catch shingles\' from someone, but the vesicle fluid <b>transmits varicella to anyone who has never had chickenpox or been vaccinated</b>. Contagious <b>until lesions crust over</b>. Keep away from <b>pregnant women, newborns, and the immunocompromised</b>. Contact precautions, airborne if disseminated.'},
{topic:'derm',hot:true,q:'A child has honey-colored crusted lesions around the nose and mouth. What is the priority teaching?',o:['It is highly contagious; keep the child home until 24 hours of antibiotic therapy','Share towels only with immediate family','The lesions are not contagious once crusted','Apply a heating pad to speed healing'],c:0,t:'single',r:'<b>Honey-colored crust is impetigo</b> — highly contagious. <b>Stay home until 24 hours of treatment</b>, no sharing towels or linens, wash hands, keep nails short to prevent spread by scratching.'},
{topic:'derm',hot:true,q:'Which lesion description matches psoriasis?',o:['Thick silvery-white scales on raised red plaques over elbows and knees','Grouped vesicles on an erythematous base','Honey-colored crusts around the mouth','A ring-shaped scaly patch with a clear center'],c:0,t:'single',r:'<b>Psoriasis: thick silvery-white scale on red plaques</b>, classically elbows, knees, scalp, and sacrum. It is <b>chronic, autoimmune, and NOT contagious</b>. Ring with a clear center is <b>tinea</b>; grouped vesicles are <b>herpes simplex</b>.'},
{topic:'derm',hot:true,q:'A client with atopic dermatitis asks when to apply moisturizer. What is the nurse\'s response?',o:['Only when the skin feels dry and tight','Within 3 minutes of bathing, on damp skin','Just before showering','At bedtime on completely dry skin'],c:1,t:'single',r:'<b>Moisturize within 3 minutes of bathing while the skin is still damp</b> — that traps water in. Use <b>lukewarm</b> water and mild soap, <b>pat</b> dry rather than rub, keep nails short, and wear cotton. <b>Controlling the itch breaks the itch-scratch cycle</b> that causes lichenification and infection.'},
{topic:'derm',hot:true,q:'A client develops a widespread painful rash with blistering and mouth and eye involvement 5 days after starting a sulfonamide antibiotic. What is the priority action?',o:['Apply a topical corticosteroid and reassess in 24 hours','Encourage fluids and monitor the rash','Stop the medication immediately and notify the provider','Administer diphenhydramine and continue the antibiotic'],c:2,t:'single',r:'<b>Rash plus MUCOUS MEMBRANE involvement plus blistering after a new drug is Stevens-Johnson syndrome</b> until proven otherwise. <b>Stop the causative drug immediately.</b> The patient is managed like a burn — fluids, pain control, wound care, ophthalmology. Common triggers: <b>sulfonamides, anticonvulsants, allopurinol, NSAIDs</b>.'},
{topic:'derm',hot:true,q:'Which mole finding is most concerning for melanoma?',o:['A mole that has changed in size and recently began to itch','A uniformly brown mole present since childhood','A mole 3 mm in diameter with regular borders','A flat freckle that darkens slightly in summer'],c:0,t:'single',r:'<b>ABCDE: Asymmetry, Border irregular, Color varied, Diameter over 6 mm, EVOLVING.</b> <b>Evolving is the most important single sign</b> — any change in size, shape, or color, or a mole that itches or bleeds, warrants evaluation regardless of the other letters.'},
{topic:'derm',hot:true,q:'Which type of skin cancer is the most common?',o:['Kaposi sarcoma','Basal cell carcinoma','Melanoma','Squamous cell carcinoma'],c:1,t:'single',r:'<b>Basal cell is the MOST COMMON and least dangerous</b> — pearly waxy papule with rolled borders, rarely metastasizes but locally destructive. <b>Melanoma is the MOST DEADLY.</b> Squamous cell is scaly and crusted and <b>can</b> metastasize.'},
{topic:'derm',hot:true,q:'When assessing for skin cancer in a client with darker skin, which areas require particular attention?',o:['Palms, soles, nail beds, and mucous membranes','The scalp and hairline exclusively','The trunk and upper back only','Only sun-exposed areas of the face and arms'],c:0,t:'single',r:'Melanoma is less common in darker skin but is <b>diagnosed later and has worse outcomes</b>. The characteristic sites are <b>palms, soles, nail beds, and mucous membranes</b>, which are easy to overlook on a routine exam.'},
{topic:'derm',hot:true,q:'A client has a red, warm, swollen, tender area on the lower leg with poorly defined borders and a fever. What is the priority nursing action?',o:['Mark the border with a pen and note the time, and anticipate systemic antibiotics','Scrub the area vigorously with antiseptic','Apply an occlusive dressing to trap moisture','Apply ice and elevate the limb'],c:0,t:'single',r:'<b>Cellulitis.</b> <b>Marking the border and timing it</b> lets you objectively track spread. Systemic antibiotics, elevation, warm compresses, and watching for sepsis. Common in <b>diabetics</b> and after any break in the skin.'},
{topic:'derm',hot:true,q:'A client with tinea pedis asks how to prevent recurrence. What should the nurse teach?',o:['Soak the feet in warm water several times daily','Wear the same shoes daily to limit exposure','Apply a thick occlusive ointment and cover with plastic wrap','Keep the feet clean and completely dry, and change socks when damp'],c:3,t:'single',r:'<b>Fungus needs moisture.</b> Keep the area <b>clean and DRY</b>, dry thoroughly between the toes, change damp socks, alternate shoes, and use antifungal powder. Occlusive dressings and repeated soaking make it worse.'},
{topic:'derm',hot:true,q:'A client is diagnosed with scabies. Which instruction is essential?',o:['All household members must be treated at the same time','Linens may be washed in cold water','Only the client requires treatment','Itching that persists after treatment means it failed'],c:0,t:'single',r:'<b>Treat all household contacts simultaneously</b>, symptomatic or not. Permethrin from <b>neck to toe</b> left on 8–14 hours. Wash linens in <b>hot</b> water and bag what cannot be washed for 72 hours. <b>Itching can persist for weeks after successful treatment</b> — that is not failure.'},
{topic:'derm',hot:true,q:'How should the nurse document a raised, fluid-filled lesion measuring 0.5 cm?',o:['Vesicle','Pustule','Papule','Bulla'],c:0,t:'single',r:'<b>Fluid-filled under 1 cm is a VESICLE</b>; over 1 cm is a <b>bulla</b>. <b>Pus</b>-filled is a pustule. <b>Raised and solid</b> is a papule. The 1 cm line splits most of these pairs.'},
{topic:'derm',hot:true,q:'A client has a raised, flat-topped lesion larger than 1 cm. How is this documented?',o:['Nodule','Plaque','Macule','Wheal'],c:1,t:'single',r:'<b>Plaque — raised, flat-topped, over 1 cm</b>, classic in psoriasis. A <b>macule</b> is flat with color change only. A <b>nodule</b> is deeper and solid. A <b>wheal</b> is raised, irregular, and transient, as in hives.'},
{topic:'derm',hot:true,q:'Which teaching about sun protection is correct?',o:['A single morning application of SPF 15 lasts all day','Tanning beds are a safe alternative to sun exposure','Sunscreen is only needed on cloudy-free days','Use broad-spectrum SPF 30 or higher and reapply every 2 hours and after swimming'],c:3,t:'single',r:'<b>Broad-spectrum SPF 30+, reapplied every 2 hours and after swimming or sweating.</b> Avoid sun <b>10 AM to 4 PM</b>, wear protective clothing and a wide-brim hat, <b>no tanning beds</b>, and do monthly self-examinations. UV penetrates clouds.'},
{topic:'derm',hot:true,q:'Which findings would make the nurse suspect Stevens-Johnson syndrome? Select all that apply.',o:['Painful rash with blistering and skin sloughing','Localized rash in the shape of a watchband','Involvement of the oral and conjunctival mucosa','Positive Nikolsky sign','Recent start of a new sulfonamide antibiotic','Honey-colored crusting around the nares'],c:[0,2,3,4],t:'multi',r:'SJS follows a <b>new drug</b> (sulfonamides, anticonvulsants, allopurinol, NSAIDs), with a <b>painful blistering rash, MUCOUS MEMBRANE involvement, and a positive Nikolsky sign</b>. A watchband-shaped rash is <b>contact dermatitis</b>; honey crusting is <b>impetigo</b>.'},
{topic:'derm',hot:true,q:'Which are components of the ABCDE melanoma assessment? Select all that apply.',o:['Color variation','Bleeding on palpation','Diameter greater than 6 mm','Asymmetry','Border irregularity','Central clearing'],c:[0,2,3,4],t:'multi',r:'<b>A</b>symmetry, <b>B</b>order irregular, <b>C</b>olor varied, <b>D</b>iameter over 6 mm, <b>E</b>volving. <b>Central clearing describes tinea</b>, not melanoma. Bleeding is concerning and falls under <b>Evolving</b>, but it is not one of the five letters.'},
];

<script>
/* ===== EXAM ENGINE (Study Mode + Test Mode 50-scramble + persistence) ===== */
let examState={}, examIdx=0, examSubmitted=false, examMode='study', examChecked={};
let quizSet=[], examShuffleMap={};
function getExamQ(qi){
  const base=EXAM[qi];
  if(base.t==='match'){
    if(!examShuffleMap[qi]){
      const order=shuffleAnswers?shuffle(base.items.map((_,i)=>i)):base.items.map((_,i)=>i);
      examShuffleMap[qi]=order;
    }
    const defOrder=examShuffleMap[qi];
    const defs=defOrder.map(i=>base.items[i].def);
    return {q:base.q, r:base.r, t:'match', items:base.items, defs, defOrder};
  }
  if(base.t==='order'){
    if(!examShuffleMap[qi]){
      const order=shuffleAnswers?shuffle(base.steps.map((_,i)=>i)):base.steps.map((_,i)=>i);
      examShuffleMap[qi]=order;
    }
    const order=examShuffleMap[qi];
    const steps=order.map(i=>base.steps[i]);
    return {q:base.q, r:base.r, t:'order', steps, displayOrder:order};
  }
  if(!examShuffleMap[qi]){
    const order=shuffleAnswers?shuffle(base.o.map((_,i)=>i)):base.o.map((_,i)=>i);
    examShuffleMap[qi]=order;
  }
  const order=examShuffleMap[qi];
  const opts=relabel(order.map(i=>base.o[i]));
  let correct;
  if(base.t==='multi'){
    const cset=new Set(base.c);
    correct=order.map((origIdx,newIdx)=>cset.has(origIdx)?newIdx:null).filter(x=>x!==null);
  } else {
    correct=order.indexOf(base.c);
  }
  return {q:base.q, r:base.r, t:base.t, o:opts, c:correct};
}
function saveExam(){ try{ localStorage.setItem('nur256u3_exam', JSON.stringify({mode:examMode,set:quizSet,state:examState,checked:examChecked,idx:examIdx,submitted:examSubmitted,shuffle:examShuffleMap})); }catch(e){} }
function loadExam(){ try{ const r=localStorage.getItem('nur256u3_exam'); return r?JSON.parse(r):null; }catch(e){ return null; } }
function clearExamSave(){ try{ localStorage.removeItem('nur256u3_exam'); }catch(e){} }
function shuffleArr(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);}
function renderExam(){
  const c=document.getElementById('sec-exam');
  c.innerHTML=`
    <h2 class="sec-title"><span class="sec-emoji">📝</span> Practice Exam <span style="font-size:.6em;opacity:.7">(${EXAM.length}-question bank)</span></h2>
    <p class="intro-line">NextGen NCLEX style — multiple choice + Select All That Apply.</p>
    <div class="exam-mode-toggle">
      <button class="mode-btn" id="modeStudyBtn" onclick="setExamMode('study')">📖 Study Mode</button>
      <button class="mode-btn" id="modeTestBtn" onclick="setExamMode('test')">📝 Test Mode</button>
    </div>
    <div class="center" style="margin:8px 0">
      <button class="btn vision-toggle-btn" onclick="toggleHotOnly()" style="background:var(--purple)">🔥 High-Yield Only: OFF</button>
    </div>
    <div id="examPicker"></div>
    <div class="tipbar" id="examModeTip"></div>

function applyModeUI(m){

function setExamMode(m){

function drawExamQ(){
  if(!quizSet.length)buildQuizSet(examMode);

  if(q.t==='order'){ drawExamOrderQ(qi,q,body); drawDots(); return; }
  const typeLabel=q.t==='multi'?'Select All That Apply':'Multiple Choice';
  const checked = examMode==='study' && examChecked[qi];
  let html=`<div class="exam-q"><div><span class="qnum">QUESTION ${examIdx+1} of ${quizSet.length}</span><span class="qtype">${typeLabel}</span></div><div class="qtext">${q.q}</div>`;
  q.o.forEach((opt,i)=>{
    const letter=String.fromCharCode(65+i);
    let cls='opt'; const cur=examState[qi];
    const isSel = q.t==='multi' ? (cur&&cur.includes(i)) : (cur===i);
    if(isSel)cls+=' sel-multi';
    if(checked){ const isCorrectOpt = q.t==='multi'?q.c.includes(i):q.c===i; if(isCorrectOpt)cls+=' correct'; else if(isSel)cls+=' wrong'; }
    html+=`<button class="${cls}" ${checked?'disabled':''} onclick="examPick(${i})">${opt}</button>`;
  });
  html+=`</div>`;
  if(examMode==='study'){
    if(q.t==='multi' && !checked){ html+=`<div class="center"><button class="btn" onclick="checkExamQ()" style="background:linear-gradient(90deg,var(--teal),var(--green))">✓ Check Answer</button></div>`; }
    if(checked){
      const ans=examState[qi]; const isCorrect = q.t==='multi'?arrEq(ans,q.c):ans===q.c;
      const correctTxt = q.t==='multi'?q.c.map(x=>String.fromCharCode(65+x)).sort().join(', '):String.fromCharCode(65+q.c);
      html+=`<div class="rationale show" style="border-color:${isCorrect?'var(--green)':'var(--red)'}">${isCorrect?'✅ <b>Correct!</b>':'❌ <b>Not quite.</b> Correct: <b>'+correctTxt+'</b>'}<br><b>Rationale:</b> ${q.r}</div>`;
    }
  }
  body.innerHTML=html; drawDots();
}
function drawExamMatchQ(qi,q,body){
  const checked = examMode==='study' && examChecked[qi];
  const cur = examState[qi] || [];
  let html=`<div class="exam-q"><div><span class="qnum">QUESTION ${examIdx+1} of ${quizSet.length}</span><span class="qtype">Dropdown Match</span></div><div class="qtext">${q.q}</div>`;
  q.items.forEach((item,itemIdx)=>{
    const selectedPos = cur[itemIdx];
    let rowCls='dm-row';
    if(checked){
      const isCorrect = selectedPos!==undefined && q.defOrder[selectedPos]===itemIdx;
      rowCls += isCorrect ? ' dm-correct' : ' dm-wrong';
    }
    html+=`<div class="${rowCls}"><div class="dm-term">${item.term}</div><select class="dm-select" ${checked?'disabled':''} onchange="examMatchPick(${itemIdx}, this.value)">`;
    html+=`<option value="" ${selectedPos===undefined?'selected':''}>— choose a definition —</option>`;
    q.defs.forEach((d,pos)=>{ html+=`<option value="${pos}" ${selectedPos===pos?'selected':''}>${d}</option>`; });
    html+=`</select></div>`;
  });
  html+=`</div>`;
  if(examMode==='study'){
    const allAnswered = q.items.every((_,i)=>cur[i]!==undefined);
    if(!checked){ html+=`<div class="center"><button class="btn" onclick="checkExamMatch()" style="background:linear-gradient(90deg,var(--teal),var(--green))" ${allAnswered?'':'disabled'}>✓ Check Answers</button></div>`; }
    if(checked){
      const isCorrect = q.items.every((_,i)=>cur[i]!==undefined && q.defOrder[cur[i]]===i);
      html+=`<div class="rationale show" style="border-color:${isCorrect?'var(--green)':'var(--red)'}">${isCorrect?'✅ <b>All correct!</b>':'❌ <b>Some matches were off</b> — check the highlighted rows above.'}<br><b>Rationale:</b> ${q.r}</div>`;
    }
  }
  body.innerHTML=html;
}
function examMatchPick(itemIdx, val){
  const qi=quizSet[examIdx];
  if(examMode==='study' && examChecked[qi])return;
  if(!examState[qi])examState[qi]=[];
  examState[qi][itemIdx] = val===''? undefined : parseInt(val,10);
  saveExam(); drawExamQ();
}
function checkExamMatch(){
  const qi=quizSet[examIdx];
  examChecked[qi]=true; bumpProgress('exam-'+qi); drawExamQ(); saveExam();
}
function drawExamOrderQ(qi,q,body){
  const checked = examMode==='study' && examChecked[qi];
  const cur = examState[qi] || [];
  let html=`<div class="exam-q"><div><span class="qnum">QUESTION ${examIdx+1} of ${quizSet.length}</span><span class="qtype">Ordered Response (Drag &amp; Drop style)</span></div><div class="qtext">${q.q}</div>`;
  html+=`<p style="font-size:.82rem;color:var(--muted);margin:4px 0 10px">Tap each step below in the correct order — it will move into your answer list.</p>`;
  html+=`<div class="order-answer" id="orderAnswerList">`;

    let itemCls='order-answer-item';

    html+=`<div class="${itemCls}"><span class="num">${pos+1}</span><span>${q.steps[q.displayOrder.indexOf(origIdx)]}</span></div>`;
  });

    html+=`<div class="order-pool">`;
    q.steps.forEach((step,displayPos)=>{
      const origIdx=q.displayOrder[displayPos];

    });
    html+=`</div>`;
    html+=`<div class="center" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">`;
    html+=`<button class="btn ghost" onclick="examOrderUndo()">↺ Undo Last</button>`;
    if(examMode==='study' && cur.length===q.steps.length){ html+=`<button class="btn" onclick="checkExamOrder()" style="background:linear-gradient(90deg,var(--teal),var(--green))">✓ Check Order</button>`; }
    html+=`</div>`;
  }
  html+=`</div>`;
  if(examMode==='study' && checked){
    const isCorrect = cur.length===q.steps.length && cur.every((v,i)=>v===i);
    html+=`<div class="rationale show" style="border-color:${isCorrect?'var(--green)':'var(--red)'}">${isCorrect?'✅ <b>Correct order!</b>':'❌ <b>Not quite the right order</b> — see highlighted steps above.'}<br><b>Rationale:</b> ${q.r}</div>`;
  }
  body.innerHTML=html;
}
function examOrderPick(origIdx){
  const qi=quizSet[examIdx];
  if(examMode==='study' && examChecked[qi])return;
  if(!examState[qi])examState[qi]=[];
  if(!examState[qi].includes(origIdx)) examState[qi].push(origIdx);

function examOrderUndo(){
  const qi=quizSet[examIdx];

function checkExamOrder(){

}
function isExamCorrect(q, ans){
  if(q.t==='multi') return arrEq(ans,q.c);
  if(q.t==='match') return q.items.every((_,i)=>ans && ans[i]!==undefined && q.defOrder[ans[i]]===i);
  if(q.t==='order') return ans && ans.length===q.steps.length && ans.every((v,i)=>v===i);
  return ans===q.c;
}
function isExamAnswered(qi){
  const ans=examState[qi];
  if(ans===undefined)return false;
  if(Array.isArray(ans))return ans.length>0 && !ans.includes(undefined);

}
function drawDots(){
  const d=document.getElementById('examDots'); d.innerHTML='';
  quizSet.forEach((qi,pos)=>{
    const dot=document.createElement('div'); dot.className='dot';
    const answered = isExamAnswered(qi);
    if(examMode==='study'){ if(examChecked[qi]){ const eq=getExamQ(qi); dot.classList.add(isExamCorrect(eq,examState[qi])?'dot-correct':'dot-wrong'); } }
    else { if(answered)dot.classList.add('answered'); }
    if(pos===examIdx)dot.classList.add('current');
    dot.onclick=()=>{examIdx=pos;drawExamQ();saveExam();};
    d.appendChild(dot);
  });
}
function examPick(i){
  const qi=quizSet[examIdx]; const q=getExamQ(qi);
  if(examMode==='study' && examChecked[qi]) return;
  if(q.t==='multi'){
    if(!examState[qi])examState[qi]=[]; const arr=examState[qi]; const idx=arr.indexOf(i);
    if(idx>-1)arr.splice(idx,1); else arr.push(i); drawExamQ();
  } else { examState[qi]=i; if(examMode==='study'){ examChecked[qi]=true; bumpProgress('exam-'+qi); } drawExamQ(); }

}
function checkExamQ(){
  const qi=quizSet[examIdx]; const ans=examState[qi];
  if(ans===undefined||(Array.isArray(ans)&&ans.length===0))return;
  examChecked[qi]=true; bumpProgress('exam-'+qi); drawExamQ(); saveExam();
}
function examNext(){ if(examIdx<quizSet.length-1){examIdx++;drawExamQ();saveExam();window.scrollTo({top:0,behavior:'smooth'});} }
function examPrev(){ if(examIdx>0){examIdx--;drawExamQ();saveExam();window.scrollTo({top:0,behavior:'smooth'});} }
function arrEq(a,b){if(!a||!b)return false;a=[...a].sort();b=[...b].sort();return a.length===b.length&&a.every((v,i)=>v===b[i]);}
function examAnswerSummary(q, ans){
  if(ans===undefined||(Array.isArray(ans)&&ans.length===0))return {your:'(no answer)', correct:'—'};
  if(q.t==='multi') return {your:ans.map(x=>String.fromCharCode(65+x)).sort().join(', '), correct:q.c.map(x=>String.fromCharCode(65+x)).sort().join(', ')};
  if(q.t==='match') return {your:q.items.map((it,i)=>it.term+'→'+(ans[i]!==undefined?q.defs[ans[i]]:'(blank)')).join('; '), correct:q.items.map(it=>it.term+'→'+it.def).join('; ')};
  if(q.t==='order'){
    const yourTxt = ans.map(origIdx=>q.steps[q.displayOrder.indexOf(origIdx)]).join(' → ');
    const correctTxt = q.steps.map((_,i)=>q.steps[q.displayOrder.indexOf(i)]).join(' → ');
    return {your:yourTxt, correct:correctTxt};
  }

}
function submitExam(){
  let correct=0;

  let html=`<div class="quiz-score">You scored ${correct} / ${total} (${pct}%)<br>${msg}</div><h3 style="color:var(--pink)">📖 Full Review</h3>`;
  quizSet.forEach((qi,pos)=>{
    const q=getExamQ(qi); const ans=examState[qi]; const isCorrect=isExamCorrect(q,ans);
    const sum=examAnswerSummary(q,ans);
    html+=`<div class="exam-q" style="border-color:${isCorrect?'var(--green)':'var(--red)'}"><div class="qnum">Q${pos+1} ${isCorrect?'✅':'❌'}</div><div class="qtext" style="font-size:.92rem">${q.q}</div><div style="font-size:.85rem"><b>Your answer:</b> ${sum.your} &nbsp;|&nbsp; <b>Correct:</b> ${sum.correct}</div><div class="rationale show" style="margin-top:8px"><b>Rationale:</b> ${q.r}</div></div>`;
  });
  html+=`<div class="center"><button class="btn" onclick="resetExam()">🔄 New Test (fresh 50)</button></div>`;
  document.getElementById('examResult').innerHTML=html;
  const _er=document.getElementById('examResult'); if(_er.scrollIntoView)_er.scrollIntoView({behavior:'smooth'});
}

    <p style="font-size:.86rem;color:var(--muted);margin-top:0">${hint}</p>
    <textarea id="notesOut" class="noteinput" rows="7" readonly>${content.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</textarea>
    <div class="chiprow" style="margin-top:10px">
      <button class="mini" onclick="copyBoxText()">Copy to clipboard</button>
      <button class="mini" onclick="document.getElementById('notesBox').innerHTML=''">Close</button>
    </div>
  </div>`;
  const ta=document.getElementById('notesOut'); if(ta){ ta.focus(); ta.select(); ta.scrollIntoView({behavior:'smooth',block:'center'}); }
}
function copyBoxText(){
  const ta=document.getElementById('notesOut'); if(!ta)return;
  const done=()=>toast('Copied');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();try{document.execCommand('copy');done();}catch(e){toast('Select and copy manually');}}); }
  else { ta.select(); try{document.execCommand('copy'); done();}catch(e){ toast('Select and copy manually'); } }
}
function openImport(){
  const host=document.getElementById('notesBox'); if(!host)return;
  host.innerHTML=`<div class="card" style="border-color:var(--teal)">
    <h3>\u{1F4E5} Import notes</h3>
    <p style="font-size:.86rem;color:var(--muted);margin-top:0">Paste a backup code below. Existing notes are <b>kept</b> \u2014 this merges rather than replacing, and skips anything already here.</p>
    <textarea id="notesIn" class="noteinput" rows="6" placeholder="Paste your backup code here"></textarea>
    <div class="chiprow" style="margin-top:10px">
      <button class="mini on" onclick="doImport()">Import</button>
      <button class="mini" onclick="document.getElementById('notesBox').innerHTML=''">Cancel</button>
    </div>
  </div>`;
  const ta=document.getElementById('notesIn'); if(ta){ ta.focus(); ta.scrollIntoView({behavior:'smooth',block:'center'}); }
}
function doImport(){
  const ta=document.getElementById('notesIn'); if(!ta)return;
  const raw=(ta.value||'').trim();
  if(!raw){ toast('Paste a backup code first'); return; }
  let data;
  try{ data=JSON.parse(raw); }catch(e){ toast('That does not look like a backup code'); return; }
  const incoming = Array.isArray(data)?data:(data&&Array.isArray(data.notes)?data.notes:null);
  if(!incoming){ toast('No notes found in that code'); return; }
  const have=new Set(notesList.map(n=>n.id));
  const seen=new Set(notesList.map(n=>(n.t||'').trim()));
  let added=0, skipped=0;
  incoming.forEach(n=>{
    if(!n||typeof n.t!=='string'||!n.t.trim()) return;
    if(have.has(n.id) || seen.has(n.t.trim())){ skipped++; return; }
    notesList.push({ id: n.id || (Date.now()+''+Math.floor(Math.random()*999)),
      t: n.t, topic: (NOTE_LABEL[n.topic]?n.topic:'other'), star: !!n.star, ts: n.ts || Date.now() });
    have.add(n.id); seen.add(n.t.trim()); added++;
  });
  notesList.sort((a,b)=>(b.ts||0)-(a.ts||0));
  saveNotes();
  document.getElementById('notesBox').innerHTML='';
  renderNotes();
  toast(added+' note'+(added===1?'':'s')+' imported'+(skipped?', '+skipped+' already here':''));
}
function renderNotes(){
  const host=document.getElementById('sec-notes'); if(!host)return;
  const keep=notesList.filter(n=>n.star), inbox=notesList.filter(n=>!n.star);
  const shown = noteFilter==='keep'?keep:inbox;
  const chips=NOTE_TOPICS.map(t=>`<button class="chip ${noteTopic===t?'on':''}" onclick="setNoteTopic('${t}')">${NOTE_LABEL[t]}</button>`).join('');
  const rows = shown.length ? shown.map(n=>`
    <div class="notecard">
      <div class="noterow">
        <span class="notetag">${NOTE_LABEL[n.topic]}</span><span class="notespacer"></span>
        <button class="mini ${n.star?'on':''}" onclick="toggleStar('${n.id}')">${n.star?'★ Keep':'☆ Keep'}</button>
        <button class="mini danger" onclick="delNote('${n.id}')">Delete</button>
      </div>
      <div class="notetext">${escN(n.t)}</div>
    </div>`).join('')
    : `<div class="card" style="text-align:center;color:var(--muted)">${noteFilter==='keep'?'Nothing starred yet. Star a note when Casteel signals it is testable.':'Inbox is empty. Everything you wrote has been sorted or cleared.'}</div>`;
  host.innerHTML=`
  <h2 class="sec-title"><span class="sec-emoji">✍️</span> Class Notes</h2>
  <p class="intro-line">Type fast during lecture. Sort later. Saves on this device only.</p>
  <div class="card">
    <textarea id="noteInput" class="noteinput" rows="3" placeholder="Type a keyword, a phrase he repeated, a question he asked the room...">${escN(noteDraft)}</textarea>
    <div class="chiprow">${chips}</div>
    <label class="starline"><input type="checkbox" id="noteStar" ${noteDraftStar?'checked':''}> <b>Star it</b> — he signaled this is on the test</label>
    <button class="btn wide" onclick="addNote()">Save note</button>
  </div>
  <div class="hy"><span class="tag">Keep this small on purpose</span>Not everything said in class is testable, and a page of notes you never reread is just extra weight. Star only what he flags, questions he asks out loud, and anything that contradicts what you already believed. Everything else drops to <b>Inbox</b>, and you clear the inbox at the end of the week without guilt.</div>
  <div class="card">
    <div class="chiprow">
      <button class="chip ${noteFilter==='keep'?'on':''}" onclick="setNoteFilter('keep')">★ Keep (${keep.length})</button>
      <button class="chip ${noteFilter==='inbox'?'on':''}" onclick="setNoteFilter('inbox')">Inbox (${inbox.length})</button>
    </div>
    ${keep.length>25&&noteFilter==='keep'?`<div class="trap"><span class="tag">Getting heavy</span>You have ${keep.length} starred notes. Past about 25 you are collecting, not studying. Reread them and unstar anything you already know cold.</div>`:''}
    ${rows}
    <div class="hy"><span class="tag">Keeping your notes safe</span>
  Notes are stored by your <b>browser, for this website address</b>. Replacing the file at the same GitHub Pages URL <b>keeps them</b>. They will NOT follow you to a different browser, a different device, a private/incognito window, or a copy opened from your Downloads folder. Use <b>📦 Export backup</b> to move them anywhere — or to send them to Claude.</div>
  <div id="notesBox"></div>
    <div class="chiprow" style="margin-top:12px">
      <button class="mini" onclick="copyNotes()">Copy starred</button>
      <button class="mini" onclick="copyAllNotes()">Copy all as text</button>
      <button class="mini" onclick="exportNotes()">\u{1F4E6} Export backup</button>
      <button class="mini" onclick="openImport()">\u{1F4E5} Import</button>
      <button class="mini danger" onclick="clearInbox()">Clear inbox</button>
    </div>
  </div>`;
}
renderNotes();

</script>
<script>
/* back to top visibility */
(function(){
  const btn=document.getElementById('backToTopBtn');
  if(!btn)return;
  const sync=()=>{ if(window.scrollY>400) btn.classList.add('show'); else btn.classList.remove('show'); };
  window.addEventListener('scroll', sync, {passive:true});
  sync();
})();
</script>
<script>
/* ===== LISTEN MODE — hands-free audio study ===== */
(function(){
if(!('speechSynthesis' in window)) return;

let lsQueue=[], lsIdx=0, lsPlaying=false, lsRate=1, lsVoice=null, lsWake=null, lsUtter=null, lsAuto=true;
try{ lsRate=parseFloat(localStorage.getItem('listen_rate')||'1')||1; }catch(e){}
try{ lsAuto=localStorage.getItem('listen_auto')!=='0'; }catch(e){}

/* ---- turn a card into speakable prose ---- */
function speakable(el){
  const parts=[];
  const walk=(node)=>{
    if(node.nodeType===3){ const t=node.textContent.replace(/\s+/g,' '); if(t.trim()) parts.push(t); return; }
    if(node.nodeType!==1) return;
    const tag=node.tagName;
    if(tag==='BUTTON'||tag==='INPUT'||tag==='TEXTAREA'||tag==='SCRIPT'||tag==='STYLE') return;
    if(node.classList && node.classList.contains('listen-skip')) return;
    if(tag==='TABLE'){
      const rows=[...node.querySelectorAll('tr')];
      let heads=[];
      rows.forEach((r,ri)=>{
        const th=[...r.querySelectorAll('th')];
        if(th.length){ heads=th.map(c=>clean(c.textContent)); return; }
        const tds=[...r.querySelectorAll('td')].map(c=>clean(c.textContent));
        if(!tds.length) return;
        if(tds.length===1){ parts.push(tds[0]+'. '); return; }
        if(heads.length>=2 && tds.length===heads.length){
          parts.push(tds[0]+'. ');
          for(let i=1;i<tds.length;i++) if(tds[i]) parts.push(heads[i]+': '+tds[i]+'. ');
        } else {
          parts.push(tds[0]+'. ');
          for(let i=1;i<tds.length;i++) if(tds[i]) parts.push(tds[i]+'. ');
        }
      });
      parts.push(' ');
      return;
    }
    if(tag==='LI'){ [...node.childNodes].forEach(walk); parts.push('. '); return; }
    if(tag==='H2'||tag==='H3'||tag==='H4'||tag==='P'||tag==='DIV'){
      [...node.childNodes].forEach(walk); parts.push('. '); return;
    }
    [...node.childNodes].forEach(walk);
  };
  walk(el);
  return clean(parts.join(' '));
}
function clean(s){
  return s
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}]/gu,' ')
    .replace(/\u2192/g,' leads to ')
    .replace(/\u2191/g,' increased ').replace(/\u2193/g,' decreased ')
    .replace(/\u2265/g,' greater than or equal to ').replace(/\u2264/g,' less than or equal to ')
    .replace(/&gt;|>/g,' greater than ').replace(/&lt;|</g,' less than ')
    .replace(/\u00b7/g,'. ').replace(/\u2014|\u2013/g,', ')
    .replace(/(\s*\.){2,}/g,'.').replace(/\(\s+/g,'(').replace(/\s+\)/g,')')
    .replace(/\s+/g,' ')
    .replace(/\s+([.,;:])/g,'$1')
    .trim();
}

/* ---- build the playlist from the visible section ---- */
function buildQueue(){
  const sec=document.querySelector('.section.active') || document.querySelector('[id^="sec-"]:not([style*="none"])');
  if(!sec) return [];
  const out=[];
  const title=sec.querySelector('.sec-title');
  const intro=sec.querySelector('.intro-line');
  let opener='';
  if(title) opener+=clean(title.textContent)+'. ';
  if(intro) opener+=clean(intro.textContent);
  if(opener.trim()) out.push({el:title||sec, text:opener, label:'Introduction'});
  sec.querySelectorAll(':scope > .card, :scope > .tipbar, :scope > .hy, :scope > .mnem').forEach(c=>{
    const t=speakable(c);
    if(t && t.length>25){
      const h=c.querySelector('h3');
      out.push({el:c, text:t, label:h?clean(h.textContent).slice(0,44):'Note'});
    }
  });
  return out;
}

/* ---- speech ---- */
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  if(!vs.length) return null;
  let saved=null; try{ saved=localStorage.getItem('listen_voice'); }catch(e){}
  return vs.find(v=>v.name===saved)
      || vs.find(v=>/Samantha|Karen|Moira|Google US English|Microsoft Aria/i.test(v.name))
      || vs.find(v=>v.localService) || vs[0];
}
function chunk(text){
  const out=[]; let buf='';
  text.split(/(?<=[.!?])\s+/).forEach(s=>{
    if((buf+' '+s).length>190){ if(buf) out.push(buf.trim()); buf=s; } else buf+=' '+s;
  });
  if(buf.trim()) out.push(buf.trim());
  return out.length?out:[text];
}
function speakItem(i){
  speechSynthesis.cancel();
  if(i<0||i>=lsQueue.length){ stop(); return; }
  lsIdx=i;
  highlight();
  renderBar();
  const pieces=chunk(lsQueue[i].text);
  let p=0;
  const next=()=>{
    if(!lsPlaying) return;
    if(p>=pieces.length){
      if(lsAuto && lsIdx+1<lsQueue.length) return speakItem(lsIdx+1);
      stop(true); return;
    }
    const u=new SpeechSynthesisUtterance(pieces[p++]);
    try{ u.rate=lsRate; }catch(e){}
    try{ if(lsVoice) u.voice=lsVoice; }catch(e){ lsVoice=null; }
    u.onend=next;
    u.onerror=()=>{ if(lsPlaying) next(); };
    lsUtter=u;
    try{ speechSynthesis.speak(u); }catch(e){ next(); }
  };
  next();
}
function highlight(){
  document.querySelectorAll('.listen-now').forEach(e=>e.classList.remove('listen-now'));
  const el=lsQueue[lsIdx] && lsQueue[lsIdx].el;
  if(el){ el.classList.add('listen-now'); el.scrollIntoView({behavior:'smooth',block:'center'}); }
}
async function wakeOn(){
  try{ if('wakeLock' in navigator && !lsWake) lsWake=await navigator.wakeLock.request('screen'); }catch(e){}
}
function wakeOff(){ try{ if(lsWake){ lsWake.release(); lsWake=null; } }catch(e){} }

function start(){
  lsQueue=buildQueue();
  if(!lsQueue.length){ if(typeof toast==='function') toast('Nothing to read in this section'); return; }
  lsVoice=pickVoice();
  lsPlaying=true; wakeOn(); openBar(); speakItem(0);
}
function stop(finished){
  lsPlaying=false; speechSynthesis.cancel(); wakeOff();
  document.querySelectorAll('.listen-now').forEach(e=>e.classList.remove('listen-now'));
  if(finished && typeof toast==='function') toast('Section finished');
  renderBar();
}
function toggle(){
  if(!lsPlaying){
    if(!lsQueue.length) return start();
    lsPlaying=true; wakeOn(); speakItem(lsIdx);
  } else stop();
}
function jump(d){
  const n=lsIdx+d;
  if(n<0||n>=lsQueue.length) return;
  if(!lsPlaying){ lsPlaying=true; wakeOn(); }
  speakItem(n);
}
function setRate(r){
  lsRate=r; try{ localStorage.setItem('listen_rate',String(r)); }catch(e){}
  if(lsPlaying) speakItem(lsIdx); else renderBar();
}
function toggleAuto(){
  lsAuto=!lsAuto; try{ localStorage.setItem('listen_auto', lsAuto?'1':'0'); }catch(e){}
  renderBar();
}

/* ---- UI ---- */
function openBar(){
  if(document.getElementById('listenBar')) return renderBar();
  const bar=document.createElement('div');
  bar.id='listenBar';
  document.body.appendChild(bar);
  renderBar();
}
function closeBar(){ stop(); const b=document.getElementById('listenBar'); if(b) b.remove(); lsQueue=[]; lsIdx=0; }
function renderBar(){
  const bar=document.getElementById('listenBar'); if(!bar) return;
  const cur=lsQueue[lsIdx];
  bar.innerHTML=
    '<div class="lb-top"><span class="lb-lab">'+(cur?('<b>'+(lsIdx+1)+' of '+lsQueue.length+'</b> \u00b7 '+cur.label):'Ready')+'</span>'
    +'<button class="lb-x" onclick="listenClose()" aria-label="Close listen mode">\u2715</button></div>'
    +'<div class="lb-row">'
    +'<button class="lb-btn" onclick="listenJump(-1)" aria-label="Previous">\u23ee</button>'
    +'<button class="lb-btn lb-main" onclick="listenToggle()" aria-label="Play or pause">'+(lsPlaying?'\u23f8':'\u25b6')+'</button>'
    +'<button class="lb-btn" onclick="listenJump(1)" aria-label="Next">\u23ed</button>'
    +'<span class="lb-sp">'
      +[0.8,1,1.25,1.5].map(r=>'<button class="lb-rate'+(Math.abs(lsRate-r)<0.01?' on':'')+'" onclick="listenRate('+r+')">'+r+'\u00d7</button>').join('')
    +'</span>'
    +'<button class="lb-rate'+(lsAuto?' on':'')+'" onclick="listenAuto()" title="Continue to the next card automatically">Auto</button>'
    +'</div>';
}
window.listenStart=start; window.listenToggle=toggle; window.listenJump=jump;
window.listenRate=setRate; window.listenClose=closeBar; window.listenAuto=toggleAuto;

if(speechSynthesis.onvoiceschanged!==undefined)
  speechSynthesis.onvoiceschanged=()=>{ lsVoice=pickVoice(); };

/* stop cleanly when the section changes */
const origShow=window.showSection;
if(typeof origShow==='function'){
  window.showSection=function(id){ if(lsPlaying) stop(); origShow(id); };
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden && lsPlaying) speechSynthesis.pause(); else if(!document.hidden && lsPlaying) speechSynthesis.resume(); });
})();

</script>
</body>
