<script>
document.getElementById('sec-ear').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">👂</span> Ear & Hearing</h2>
<p class="intro-line">Ménière's disease is the star here. Also know conductive vs sensorineural hearing loss and basic ear safety.</p>
<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Hearing loss — WHY each type happens</h3>
  <table class="lab">
    <tr><th>Type</th><th>Where the failure is</th><th>Why it happens</th></tr>
    <tr><td><b>CONDUCTIVE</b></td><td><b>Outer or middle ear</b> — the sound wave physically <b>cannot get IN</b> to the inner ear</td><td><b>Cerumen impaction</b> · <b>fluid behind the eardrum</b> (otitis media with effusion) · <b>perforated tympanic membrane</b> · <b>otosclerosis</b> (the stapes fuses and can no longer vibrate) · foreign body · external otitis swelling the canal shut</td></tr>
    <tr><td><b>SENSORINEURAL</b></td><td><b>Cochlea or the vestibulocochlear nerve (CN VIII)</b> — the sound arrives but <b>cannot be converted or transmitted</b></td><td><b>Hair cell death in the cochlea</b> from <b>cumulative noise exposure</b> · <b>aging</b> · <b>ototoxic drugs</b> (aminoglycosides, loop diuretics, high-dose aspirin, cisplatin) · Ménière's · acoustic neuroma · infection</td></tr>
    <tr><td><b>MIXED</b></td><td>Both at once</td><td>For example, an older adult with <b>presbycusis plus a wax impaction</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The key difference in one line</div><div class="big">Conductive is a PLUMBING problem. Sensorineural is a WIRING problem.</div><div class="exp"><b>Conductive is often fixable</b> — remove the wax, drain the fluid, repair the drum. <b>Sensorineural hair cells do not regenerate</b>, so that loss is usually <b>permanent</b> and managed with amplification or a cochlear implant.</div></div>
  <div class="hy"><span class="tag">⭐ Presbycusis — why aging takes the high notes first</span><b>The hair cells at the base of the cochlea detect HIGH frequencies, and they are the first to die</b> from a lifetime of sound exposure. Consonants like <b>s, f, th, sh, and k</b> are high-frequency, so speech becomes <b>audible but not intelligible</b>. The patient says <b>"I can hear you, I just can't understand you"</b> — and shouting does not help, because volume was never the problem. <b>Speak slowly, lower your pitch, face them, reduce background noise.</b></div>
  <div class="hy"><span class="tag">Air vs bone conduction</span><b>Air conduction</b> travels the normal route — canal, drum, ossicles, cochlea. <b>Bone conduction</b> bypasses the outer and middle ear entirely by vibrating the skull straight to the cochlea. Comparing them is how you separate the two losses: <b>if bone conduction is better than air, the problem is in the conducting path (conductive)</b>. If both are equally reduced, the <b>cochlea or nerve</b> is the problem.</div>
  <div class="hy"><span class="tag">Early signs he named</span><b>Tinnitus</b> · <b>turning up the volume</b> · <b>difficulty hearing in large groups</b> or restaurants, where background noise competes. The consequence: <b>social withdrawal and isolation</b>, and in older adults that isolation is linked to depression and cognitive decline.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>👂 Ear infections and the eustachian tube</h3>
  <div class="why-chain"><b>The eustachian tube connects the middle ear to the throat</b> and exists to <b>equalize pressure</b> and drain fluid. When it is blocked, fluid collects behind the eardrum and bacteria grow in it.</div>
  <ul class="clean">
    <li><b>⭐ Why children get more ear infections:</b> a child's eustachian tube is <b>shorter, wider, and more HORIZONTAL</b>, so secretions from the throat drain into the middle ear instead of away from it. <b>It becomes more vertical with growth</b>, which is why most children outgrow them.</li>
    <li><b>Bacterial otitis media signs:</b> <b>ear pain, fever, a red bulging immobile tympanic membrane</b>, decreased hearing, irritability, pulling at the ear in a young child, and sometimes <b>drainage if the drum perforates</b> — which typically <b>relieves the pain suddenly</b>.</li>
    <li><b>Management:</b> analgesics, <b>warm compress</b> to aid comfort and drainage, antibiotics when bacterial, and <b>pressure-equalizing techniques</b> — swallowing, yawning, chewing gum, or gentle autoinflation.</li>
    <li><b>⭐ Never put foreign objects in the ear</b> — no cotton swabs, bobby pins, or ear candles. Swabs <b>push cerumen deeper</b>, cause impaction, and can perforate the drum. <b>The ear is self-cleaning</b>; clean only the outer pinna with a washcloth.</li>
    <li><b>External otitis (swimmer's ear):</b> pain <b>on movement of the pinna or tragus</b>, itching, drainage. Keep the ear <b>DRY</b>, topical drops, warm compress.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ Balance — the three systems and the Romberg test</h3>
  <div class="why-chain">Equilibrium depends on <b>three sensory inputs working together</b>. Lose one and the other two usually compensate. Lose two and the patient falls.</div>
  <ol class="chainlist">
    <li><b>1. VESTIBULAR</b> — the inner ear tells the brain where the head is in space.</li>
    <li><b>2. PROPRIOCEPTION</b> — receptors in muscles and joints report where the body is.</li>
    <li><b>3. VISION</b> — the eyes confirm position against the surroundings.</li>
  </ol>
  <div class="mnem"><div class="tag">⭐ The Romberg test</div><div class="big">Stand with feet together, then CLOSE the eyes. Swaying or drift = positive.</div><div class="exp">Closing the eyes <b>removes the visual input</b>, forcing the patient to rely on <b>vestibular and proprioceptive</b> function alone. If they sway or drift, one of those two is impaired. <b>Stand beside the patient — a positive Romberg means they may fall.</b></div></div>
  <div class="hy"><span class="tag">Why this matters for Ménière's</span>Their <b>vestibular input is unreliable and unpredictable</b>. They are compensating with <b>vision and proprioception</b>, which is why an attack in the <b>dark</b>, on an <b>uneven surface</b>, or with the <b>eyes closed in the shower</b> is far more dangerous. <b>Safety teaching targets the two remaining systems.</b></div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Hearing loss — types and the early signs</h3>
  <table class="lab">
    <tr><th>Type</th><th>Where the problem is</th></tr>
    <tr><td><b>Conductive</b></td><td>Sound <b>cannot get IN</b> — outer or middle ear. Cerumen, effusion, perforation, otosclerosis</td></tr>
    <tr><td><b>Sensorineural</b></td><td><b>Damage to the cochlea or the vestibulocochlear nerve (CN VIII)</b> — the signal cannot be processed</td></tr>
    <tr><td><b>Mixed</b></td><td>Both at once</td></tr>
    <tr><td><b>Presbycusis</b></td><td><b>Age-related</b> sensorineural loss. High-frequency sounds go first, which is why consonants blur</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Early signs from his handout</div><div class="big">Tinnitus · decreased hearing in large groups · turning up the volume</div><div class="exp">And the consequence he named: <b>isolation and withdrawal</b>. Hearing loss is a <b>psychosocial</b> problem as much as a sensory one, and that is a testable nursing focus.</div></div>
  <div class="hy"><span class="tag">External otitis</span>Pain with movement of the pinna or tragus, drainage, itching. <b>Treatment includes a warm compress</b>, analgesics, and topical antibiotic drops. Keep the ear <b>dry</b> — it is often called swimmer's ear.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ Ménière's Disease</h3>
  <p class="why-chain"><b>Overproduction or decreased absorption of ENDOLYMPH</b>, causing degeneration of the <b>vestibular and cochlear hair cells</b>. Too much fluid in the inner ear.</p>
  <table class="lab">
    <tr><th>Sign</th><th>Detail</th></tr>
    <tr><td><b>Vertigo</b></td><td><b>Sudden episodes of severe WHIRLING vertigo with an inability to stand or walk.</b> May last <b>up to several hours</b></td></tr>
    <tr><td><b>Tinnitus</b></td><td><b>BUZZING</b> — and it <b>worsens before and during</b> an episode, so it warns of an attack</td></tr>
    <tr><td><b>Autonomic</b></td><td><b>Nausea, vomiting, and diaphoresis</b></td></tr>
    <tr><td><b>Neuro</b></td><td>Possibly <b>brief loss of consciousness with nystagmus</b></td></tr>
    <tr><td><b>Aural</b></td><td><b>Feeling of pressure</b> or fullness in the ear</td></tr>
    <tr><td><b>Testing</b></td><td><b>Audiometric testing reveals SENSORINEURAL hearing loss</b></td></tr>
  </table>
  <h4 style="margin:12px 0 4px">Treatment</h4>
  <ul class="clean">
    <li><b>⭐ LOW SODIUM diet — 1,000 to 1,500 mg per day.</b> Less sodium means less fluid retention in the inner ear.</li>
    <li><b>Avoid caffeine, alcohol, and nicotine.</b></li>
    <li><b>Meclizine</b> — a <b>vestibular suppressant</b> for the vertigo. Also <b>diazepam</b>, and <b>promethazine</b> for nausea and vomiting.</li>
    <li><b>Diuretics</b> in some patients, to reduce endolymph volume.</li>
    <li><b>Avoid sudden head movements</b>, bright lights, and quick position changes.</li>
    <li><b>Surgical options:</b> <b>endolymphatic sac decompression or shunt</b> · middle and inner ear perfusion through <b>intratympanic catheters</b> · <b>labyrinthectomy</b> (destruction of the inner ear) · <b>vestibular nerve section (cranial nerve VIII)</b>.</li>
  </ul>
  <div class="trap"><span class="tag">⭐ Surgery costs hearing</span>His handout states it plainly: <b>there is always some degree of hearing loss with surgical removal.</b> A <b>labyrinthectomy destroys the inner ear</b> — it stops the vertigo and <b>sacrifices the hearing on that side</b>. That trade-off is the consent conversation.</div>
  <div class="hy"><span class="tag">Nursing diagnoses he listed</span><b>Risk for injury</b> related to gait disturbance and vertigo · impaired adjustment from the <b>unpredictability</b> of attacks · <b>risk for fluid volume deficit</b> from vomiting and diuretics · anxiety · ineffective coping · <b>self-care deficits</b> during episodes. <b>Safety during an attack is the priority</b> — lie still in a darkened room, side rails up, call light in reach, no driving.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ Ear drop administration — his checklist</h3>
  <ol class="chainlist">
    <li><b>1. ⭐ Assess for a PERFORATED EARDRUM before instilling anything.</b> Drops into a perforated drum can reach the middle ear and cause damage or infection.</li>
    <li><b>2. Remove cerumen first.</b> Drops cannot reach the canal through a wax plug.</li>
    <li><b>3. ⭐ Warm the drops to body temperature by rolling the bottle in your hands.</b> <b>Cold drops cause a vestibular reaction</b> — vertigo, nausea, dizziness.</li>
    <li><b>4. Position:</b> <b>ADULTS — pull the pinna UP and BACK.</b> Children under 3 — <b>down and back</b>.</li>
    <li><b>5. Allow time for the drops to flow down the canal</b> — have the patient <b>stay side-lying with that ear up for about 5 minutes</b>.</li>
    <li><b>6. ⭐ Massage the TRAGUS</b> to help the drops move down the canal.</li>
  </ol>
  <div class="trap"><span class="tag">The two that get missed</span><b>Warming the drops</b> and <b>checking for perforation</b>. Both are easy to skip in real life and both are the kind of single-step detail he builds a question around.</div>
</div>


<div class="card" style="border-color:var(--amber);background:var(--amber-soft)">
  <h3>⏸️ Lower priority right now</h3>
  <p>Casteel's announcement covers <b>Diabetes + Skin on Mon 7/13</b> and <b>Vision on Wed 7/15</b> — Ear isn't mentioned on either. This section is still here in case it gets assigned later, but there's no need to spend time on it before either upcoming exam. Focus on 🩸 Diabetes, 🧴 Skin, and 👁️ Eye first.</p>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🌀 Ménière's Disease — the triad</h3>
  <p class="why-chain"><b>Mechanism:</b> too much fluid (endolymph) builds up in the inner ear → pressure disrupts the balance and hearing organs.</p>
  <p><b>The classic TRIAD (know these three):</b></p>
  <ul class="clean">
    <li><b>1. Episodic vertigo</b> — severe spinning (the worst symptom); lasts minutes to hours, often with nausea/vomiting.</li>
    <li><b>2. Tinnitus</b> — ringing/roaring in the ear.</li>
    <li><b>3. Fluctuating sensorineural hearing loss</b> — comes and goes.</li>
    <li>Plus a feeling of <b>fullness/pressure</b> in the ear.</li>
  </ul>
  <p><b>Management:</b></p>
  <ul class="clean">
    <li><b>Low-sodium diet (&lt;2000 mg/day) + diuretics</b> — reduce the fluid/pressure (this is the mechanism-based key).</li>
    <li>Meds for attacks: antihistamines (meclizine) and antiemetics for nausea/vertigo; diazepam for severe vertigo.</li>
    <li><b>Safety during an attack:</b> lie still in a quiet, dark room; help prevent falls; move slowly.</li>
  </ul>
  <div class="mnem"><div class="tag">Mnemonic</div><div class="big">"Ménière's = the spinning Triad: Vertigo + Tinnitus + Hearing loss. Fix it with LOW SALT."</div></div>
</div>

<div class="card">
  <h3>🔊 Conductive vs Sensorineural hearing loss</h3>
  <table class="lab">
    <tr><th></th><th>Conductive</th><th>Sensorineural</th></tr>
    <tr><td><b>Problem</b></td><td>Sound can't get IN (outer/middle ear)</td><td>Nerve/cochlea damage (inner ear)</td></tr>
    <tr><td><b>Causes</b></td><td>Earwax, fluid, otitis media, perforated drum</td><td>Aging (presbycusis), noise, ototoxic drugs, Ménière's</td></tr>
    <tr><td><b>Reversible?</b></td><td>Often (remove the blockage)</td><td>Usually permanent</td></tr>
  </table>
  <ul class="clean">
    <li><b>Presbycusis</b> — age-related sensorineural loss; high-frequency sounds go first.</li>
    <li><b>Ototoxic drugs</b> (can damage hearing): aminoglycosides, loop diuretics (furosemide), high-dose aspirin, some chemo — monitor for tinnitus/hearing changes.</li>
  </ul>
</div>

<div class="card">
  <h3>👂 Otitis & ear safety basics</h3>
  <ul class="clean">
    <li><b>Otitis externa</b> ("swimmer's ear") — infection of the ear canal from trapped water/trauma → pain (worse with tug on the ear), discharge, itching.</li>
    <li><b>Communication with hearing loss:</b> face the person, speak clearly at normal-to-slightly-slower pace, reduce background noise, don't shout (distorts sound), use gestures/writing.</li>
    <li>Never insert objects (or cotton swabs) into the ear canal.</li>
  </ul>
</div>


<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — conductive vs sensorineural</span><b>Conductive</b> is a blockage and is often treatable. <b>Sensorineural</b> is nerve or cochlear damage and is usually permanent. Options claiming sensorineural is "cured by irrigation" or "always reversible" are the giveaways to reject.</div>
  <div class="trap"><span class="tag">Trap 2 — the Ménière's triad</span><b>Episodic vertigo, tinnitus, and fluctuating sensorineural hearing loss.</b> Fever, pain, and discharge belong to otitis, not Ménière's.</div>
  <div class="trap"><span class="tag">Trap 3 — during an attack</span>The priority is <b>fall safety</b>: lie still in a quiet, dark room. "Encourage walking" and "bright lights" are actively harmful.</div>
  <div class="trap"><span class="tag">Trap 4 — new tinnitus on a known drug</span>Furosemide, aminoglycosides, and high-dose aspirin are <b>ototoxic</b>. "Normal," "anxiety," and "a cold" are all offered to make you dismiss it.</div>
  <div class="trap"><span class="tag">Trap 5 — communication technique</span>Face the patient, speak clearly, cut background noise. <b>Shouting distorts</b> the sounds a hard-of-hearing patient already struggles with.</div>
</div>
<div id="quiz-ear"></div>
`;

renderQuiz('quiz-ear',[
  {q:'A patient describes recurrent episodes of severe spinning sensations lasting up to an hour, accompanied by ringing in the ear and hearing that seems to worsen during attacks then partially improve afterward. Which condition does this presentation MOST likely represent?',type:'single',
   opts:['Acute otitis media, given the ear-related symptoms and fluctuating hearing','Benign paroxysmal positional vertigo, since vertigo is the dominant symptom','Meniere disease — episodic vertigo with tinnitus and fluctuating hearing loss','Presbycusis, since hearing changes are the primary feature described'],correct:2,
   rat:'The trap: A isolates just the hearing component (presbycusis is a different, purely age-related process), C assumes an infectious cause without supporting findings (fever, discharge, pain), and D describes brief positional vertigo rather than the longer episodic attacks with tinnitus and hearing changes described here. The full triad together is specific to Ménière\'s disease.'},

  {q:'A patient with Ménière\'s disease asks why the provider recommended a low-sodium diet and a diuretic rather than a medication that works directly on the ear. What is the correct explanation?',type:'single',
   opts:['Low sodium is prescribed to protect the kidneys from the diuretic\'s side effects','Sodium and fluid retention raise endolymphatic volume in the inner ear','These interventions target the tinnitus specifically and have no effect on vertigo or hearing loss','These medications are given only to manage the anxiety associated with vertigo attacks'],correct:1,
   rat:'The trap: A and D both attribute the treatment to something other than its actual target, and C reverses the relationship between the diuretic and the diet. The actual mechanism is systemic: reducing sodium and total body fluid lowers the excess endolymphatic pressure driving ALL THREE symptoms of the triad, not just one.'},

  {q:'During an acute Ménière\'s vertigo attack, which nursing priority is MOST important?',type:'single',
   opts:['Administering a full meal to prevent hypoglycemia from the stress response','Turning on bright lighting to help the patient reorient visually','Ensuring patient safety by helping them lie still in a quiet, dark room to prevent falls','Encouraging the patient to walk slowly to maintain mobility during the episode'],correct:2,
   rat:'The trap: A directly contradicts the safety need — walking during severe vertigo significantly increases fall risk. C and D address unrelated concerns not supported by the scenario. Because severe vertigo makes falls the primary danger, keeping the patient still and safe in a low-stimulation environment is the priority during an acute attack.'},

  {q:'A patient reports hearing loss that developed gradually after several ear infections and improved significantly once the underlying fluid was treated. Which type of hearing loss does this describe, and why does it typically improve?',type:'single',
   opts:['Conductive, since the infection blocked the outer or middle ear and then resolved','Central, because auditory processing centers in the brain were temporarily affected by the infection','Mixed, because both the inner and outer ear were permanently affected','Sensorineural, because infections commonly damage the cochlear hair cells directly'],correct:0,
   rat:'The trap: A and D both assume permanent inner-ear damage when the scenario specifically describes improvement after treatment — a hallmark of conductive, not sensorineural, hearing loss. Since the mechanism was a treatable blockage (fluid from infection) rather than nerve/hair-cell damage, the hearing loss resolving after treatment fits conductive hearing loss precisely.'},

  {q:'A nurse is communicating with a patient who has significant hearing loss. Which of the following approaches are appropriate? (Select all that apply)',type:'multi',
   opts:['Reduce background noise (turn off the TV, close the door) before starting the conversation','Raise your voice significantly to ensure the words are loud enough to hear','Face the patient directly so they can see your lips and facial expressions','Use written notes or gestures to reinforce key information as needed','Speak at a normal-to-slightly-slower pace with clear enunciation'],correct:[0,2,3,4],
   rat:'The trap: shouting (B) seems like the obvious solution to hearing loss, but it actually distorts speech sounds and can make comprehension harder, not easier — this is a frequently tested misconception. Facing the patient, reducing background noise, speaking clearly at a measured pace, and supplementing with writing/gestures are all evidence-based communication strategies.'},

  {q:'A client is 3 days post-op following a stapedectomy for otosclerosis. Which client statement indicates a need for further teaching?',type:'single',
   opts:['"I\'ll avoid blowing my nose forcefully and will sneeze with my mouth open if needed."','"I plan to go swimming this weekend since I\'m feeling much better."','"I\'ll report any sudden severe vertigo or hearing changes right away."','"I\'ll avoid air travel until my surgeon clears me to fly."'],correct:1,
   rat:'The trap: this question asks which statement is INCORRECT, and B is the one reflecting a misunderstanding — swimming (and getting water in the ear) is restricted for weeks after ear surgery due to infection and healing risk. A, C, and D all reflect correct post-stapedectomy precautions (avoiding pressure changes from nose-blowing or air travel, and monitoring for complications).'},

document.getElementById('sec-decoder').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🩺</span> Disorder Decoder</h2>
<p class="intro-line">Casteel's framework — every Unit 3 disorder in Cause → Manifests → Treatment. Quick reference before the exam.</p>

<div class="card" style="border-color:var(--purple)">
  <h3>🗝️ The 3-question key (use it on every disorder)</h3>
  <ul class="clean">
    <li><b>1. Cause / pathophysiology</b> — what's physically going wrong? (This explains everything else.)</li>
    <li><b>2. Manifestations</b> — what will you SEE, HEAR, and what will the patient FEEL/REPORT? (signs + symptoms)</li>
    <li><b>3. Treatment</b> — meds, nursing interventions, priorities, and patient teaching.</li>
  </ul>
  <div class="mnem"><div class="tag">🧠 Mnemonic</div><div class="big">"Cause → Clues → Cure"</div><div class="exp">Why it happens → how it shows up → what we do about it.</div></div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🩸 Type 1 Diabetes</h3>
  <p><b>Cause:</b> <b>autoimmune T-cell attack destroys the pancreatic beta cells</b> that make insulin. Genetic predisposition + a triggering event (often viral) is suspected. By the time symptoms appear, <b>~80-90% of beta cells are already gone</b>. Absolute insulin deficiency — the pancreas makes essentially <b>ZERO insulin</b>.</p>
  <p><b>Manifests:</b> rapid onset, often in childhood/young adulthood. Classic <b>3 P's (polyuria, polydipsia, polyphagia)</b> PLUS <b>unexplained weight loss despite eating more</b> (cells can't use the glucose, so the body breaks down fat/muscle instead). Fatigue, blurred vision. Diagnostic: <b>fasting glucose ≥126 mg/dL, random ≥200 mg/dL with symptoms, A1C ≥6.5%</b>. May present in <b>DKA as the FIRST sign of diagnosis</b>.</p>
  <p><b>Treatment:</b> <b>lifelong exogenous insulin</b> — no oral agents work (there's no residual insulin production to stimulate). Typically <b>basal-bolus regimen</b>: long-acting (glargine) once daily + rapid-acting (lispro/aspart) with meals, or an insulin pump. Carb counting, frequent glucose monitoring (4+ times/day), rotate injection sites to prevent lipohypertrophy.</p>
</div>
<div class="card" style="border-color:var(--teal)">
  <h3>🩸 Type 2 Diabetes</h3>
  <p><b>Cause:</b> two-part mechanism — (1) <b>insulin resistance</b>: cells (especially muscle/fat/liver) stop responding normally to insulin, so glucose can't get in despite insulin being present; (2) the pancreas compensates by secreting MORE insulin, but <b>beta-cell function gradually declines over years</b> until it can no longer keep up. Strongly linked to <b>obesity, sedentary lifestyle, age >45, family history, and metabolic syndrome</b>.</p>
  <p><b>Manifests:</b> <b>gradual onset over years</b> — often asymptomatic or mild (fatigue, blurred vision, slow-healing cuts, recurrent yeast/UTI infections) until caught on routine labs or a complication appears. Same diagnostic numbers as Type 1 (FPG ≥126, A1C ≥6.5%, random ≥200 with symptoms). Because onset is silent, <b>many patients already have microvascular damage AT diagnosis</b>.</p>
  <p><b>Treatment:</b> stepwise — lifestyle changes (weight loss, diet, exercise) first; <b>metformin is first-line pharmacologic therapy</b> (decreases hepatic glucose production, improves insulin sensitivity, does NOT cause hypoglycemia alone). If A1C goal not met, add a second agent: SGLT-2 inhibitor, GLP-1 agonist, sulfonylurea, or DPP-4 inhibitor. Insulin may eventually be needed as beta-cell function declines further. <b>Hold metformin 24-48 hrs around IV contrast</b> (lactic acidosis risk with reduced renal clearance).</p>
</div>
<div class="card" style="border-color:var(--red)">
  <h3>🚨 DKA (Diabetic Ketoacidosis)</h3>
  <p><b>Cause:</b> <b>near-total insulin deficiency (classically Type 1 diabetes)</b> — usually precipitated by missed insulin doses, new-onset undiagnosed Type 1, infection/illness, or physiologic stress (surgery, MI). Without insulin, cells can't use glucose, so the body shifts to breaking down fat for fuel → free fatty acids converted to <b>ketone bodies</b> (acetone, acetoacetate, beta-hydroxybutyrate) → these are ACIDS → <b>metabolic acidosis with an elevated anion gap</b>.</p>
  <p><b>Manifests:</b> glucose typically <b>>250 mg/dL</b> (can be higher), arterial <b>pH <7.3</b>, serum <b>bicarbonate <18 mEq/L</b>, positive serum/urine ketones. <b>Kussmaul respirations</b> (deep, rapid — blowing off CO₂ to compensate for the acidosis), <b>fruity/acetone breath odor</b>. Severe dehydration from osmotic diuresis: dry mucous membranes, poor skin turgor, tachycardia, hypotension. N/V, abdominal pain (can mimic an acute abdomen), altered mental status as it progresses. Onset over hours to ~1 day.</p>
  <p><b>Treatment:</b> (1) <b>IV isotonic fluids (0.9% NS) FIRST</b> to correct volume depletion; (2) <b>IV regular insulin drip (the ONLY insulin given IV)</b> to stop ketone production and lower glucose; (3) monitor potassium closely — acidosis pushes K⁺ out of cells so serum levels look falsely normal/high initially, but total body K⁺ is depleted, and insulin therapy will drive it back into cells, dropping serum levels fast — replace once urine output is confirmed and K⁺ is <5.0-5.2; (4) <b>add dextrose once glucose reaches ~200-250 mg/dL</b> so insulin can keep running (clearing ketones) without causing hypoglycemia. Continuous ECG and hourly glucose checks.</p>
</div>
<div class="card" style="border-color:var(--red)">
  <h3>💧 HHS (Hyperosmolar Hyperglycemic Syndrome)</h3>
  <p><b>Cause:</b> <b>occurs almost exclusively in Type 2 diabetes</b> — these patients are still <b>producing insulin</b>, but their cells are <b>resistant to it</b>, so glucose can't be pulled into cells and instead stays/builds up in the blood. That same circulating insulin, however, usually only needs to be present in small amounts to keep the liver from breaking down fat — so it's <b>enough to suppress fat breakdown/ketone production, but not enough to overcome the resistance and control glucose</b>. Usually triggered by infection (especially pneumonia/UTI), inadequate fluid intake (common in older adults with impaired thirst response), or a new medication (steroids, diuretics). Develops <b>much more slowly than DKA — over days</b>.</p>
  <p><b>Manifests:</b> glucose extremely high, often <b>>600 mg/dL</b> and sometimes >1000. Serum <b>osmolality markedly elevated (>320 mOsm/kg)</b>. Blood <b>pH stays near-normal (>7.3)</b>, bicarbonate near-normal, <b>ketones absent or minimal — NO Kussmaul breathing, NO fruity breath</b> (this is the key differentiator from DKA). Profound dehydration is the dominant feature: severe hypotension, tachycardia, and neurologic changes ranging from confusion to seizures to coma (from the extreme hyperosmolality itself, not from acidosis).</p>
  <p><b>Treatment:</b> <b>aggressive IV fluid replacement is the TOP priority</b> (fluid deficits are often larger than in DKA) — typically starts with 0.9% NS, may switch to 0.45% NS once hemodynamically stable, then add dextrose once glucose approaches ~250-300. Lower-dose insulin drip than DKA (fluids alone often drop glucose significantly). Correct electrolytes. Watch closely for fluid overload in older patients with cardiac/renal history. <b>Mortality is HIGHER than DKA</b> due to the degree of dehydration and comorbidities in the typical (older, Type 2) patient.</p>
</div>
<div class="card" style="border-color:var(--amber)">
  <h3>📉 Hypoglycemia</h3>
  <p><b>Cause:</b> <b>glucose <70 mg/dL</b> — from too much insulin/sulfonylurea relative to intake, a skipped or delayed meal after rapid-acting insulin, increased/unplanned exercise, alcohol without food (blocks gluconeogenesis), or insulin peak-timing errors.</p>
  <p><b>Manifests in 2 stages:</b> <b>Adrenergic (mild, glucose ~54-70):</b> the sympathetic nervous system fires first — diaphoresis, tremor, tachycardia, palpitations, hunger, anxiety. <b>Neuroglycopenic (worse, <54):</b> the brain itself is starved of fuel — confusion, headache, slurred speech, visual disturbance, irritability, poor coordination, progressing to seizures and loss of consciousness if untreated. <b>Autonomic neuropathy can blunt/eliminate the adrenergic warning stage</b> ("hypoglycemia unawareness"), so the patient goes straight to neuro symptoms.</p>
  <p><b>Treatment:</b> conscious + able to swallow → <b>Rule of 15</b>: 15 g fast-acting carbohydrate (4 oz juice, glucose tablets), recheck glucose in 15 minutes, repeat if still <70, then follow with a protein/complex-carb snack. <b>Unconscious or unable to swallow → NEVER give anything by mouth</b> (aspiration risk) — give <b>glucagon 1 mg IM/SubQ/intranasal</b> (mobilizes stored liver glycogen) or, with IV access in a facility, IV dextrose (D50). May take up to 20 minutes to regain consciousness after glucagon.</p>
</div>
<div class="card" style="border-color:var(--teal)">
  <h3>🛏️ Pressure Injury</h3>
  <p><b>Cause:</b> unrelieved external pressure (usually over a bony prominence) compresses capillaries against the underlying bone → local blood flow stops → <b>tissue hypoxia and cell death</b>. Shear (tissue layers sliding, e.g., sliding down in bed) and friction accelerate damage; moisture (incontinence) and poor nutrition (low albumin) impair skin integrity and healing.</p>
  <p><b>Manifests (staged by depth):</b> <b>Stage 1</b> — intact skin, non-blanchable redness. <b>Stage 2</b> — partial-thickness loss, shallow open ulcer or intact/ruptured blister, no slough. <b>Stage 3</b> — full-thickness loss, subcutaneous fat visible, no bone/tendon/muscle exposed. <b>Stage 4</b> — full-thickness with bone, tendon, or muscle exposed. <b>Unstageable</b> — base obscured by slough/eschar (depth can't be determined until debrided). <b>Deep tissue injury</b> — intact or non-intact skin with a localized area of persistent, non-blanchable deep red/maroon/purple discoloration or blood-filled blister (damage is happening below the surface).</p>
  <p><b>Treatment:</b> <b>reposition at least every 2 hours in bed (every 15 minutes if in a wheelchair)</b>, use pressure-redistribution surfaces, keep skin clean/dry, optimize protein/caloric intake (<b>albumin <3 g/dL impairs healing</b>), <b>NEVER massage a reddened area</b> (ruptures already-fragile capillaries). Moist wound healing environment for open wounds; autolytic, mechanical, sharp, or surgical debridement to remove dead tissue as appropriate. Braden Scale used to assess and score ongoing risk.</p>
</div>
<div class="card" style="border-color:var(--teal)">
  <h3>👓 Glaucoma</h3>
  <p><b>Cause:</b> aqueous humor is continuously produced inside the eye and must drain through the trabecular meshwork/canal of Schlemm. <b>Open-angle (most common, ~90%):</b> the drainage angle is anatomically open but drains too slowly — pressure builds gradually over years. <b>Angle-closure:</b> the iris physically blocks the drainage angle — pressure spikes suddenly and severely.</p>
  <p><b>Manifests:</b> normal <b>IOP = 10-21 mmHg</b>. <b>Open-angle</b> — gradual, <b>PAINLESS peripheral (tunnel) vision loss</b> as the optic nerve is compressed from the outside in; often not noticed until significant loss has occurred, sometimes found incidentally on routine eye exam. <b>Angle-closure</b> — <b>sudden severe eye pain, blurred vision, halos around lights, nausea/vomiting, a red eye, and a firm/hard globe</b> on palpation — a true ophthalmic EMERGENCY.</p>
  <p><b>Treatment:</b> open-angle — lifelong topical drops to lower IOP (prostaglandin analogs like latanoprost increase outflow; beta-blockers like timolol decrease production), sometimes laser trabeculoplasty or surgery; <b>lost vision is PERMANENT</b>, so the goal is preventing further loss. Angle-closure — <b>emergency IOP-lowering medications</b> (IV/oral) followed by laser iridotomy; treat as a same-day emergency, not a routine follow-up.</p>
</div>
<div class="card" style="border-color:var(--teal)">
  <h3>🌫️ Cataracts</h3>
  <p><b>Cause:</b> progressive clouding/opacification of the normally clear crystalline lens — from <b>aging (most common)</b>, UV exposure, <b>diabetes</b> (glucose alters lens proteins), steroid use, <b>beta-blocker use</b>, or <b>eye trauma/injury</b>. Light can no longer pass through and focus cleanly on the retina.</p>
  <p><b>Manifests:</b> <b>painless</b>, progressive blurry/hazy vision, increased glare and halos around lights (worse at night with a dilated pupil letting in more scattered light), difficulty with night driving, and colors appearing faded/yellowed. <b>No sudden pain, no redness</b> — a purely gradual, mechanical lens problem.</p>
  <p><b>Treatment:</b> the <b>ONLY definitive treatment is surgical removal of the cloudy lens with intraocular lens implant</b> (typically outpatient). Post-op teaching: <b>avoid bending, heavy lifting, and straining</b> (raises IOP and risks disrupting the healing incision), don't rub the eye, use prescribed antibiotic/steroid drops, wear the protective shield at night, and <b>report sudden pain, vision loss, or increased redness immediately</b> (signs of infection or hemorrhage).</p>
</div>
<div class="card" style="border-color:var(--teal)">
  <h3>🌀 Ménière's Disease</h3>
  <p><b>Cause:</b> <b>excess endolymphatic fluid</b> builds up within the inner ear's membranous labyrinth (endolymphatic hydrops), distorting both the balance (vestibular) and hearing (cochlear) structures. Exact cause often unclear; linked to fluid/sodium retention.</p>
  <p><b>Manifests as a classic triad</b> occurring in unpredictable episodic attacks: <b>episodic vertigo</b> (severe spinning, can last 20 min-several hours — the most disabling symptom), <b>tinnitus</b> (ringing/roaring), and <b>fluctuating sensorineural hearing loss</b> (often low-frequency, may partially recover between attacks then worsen permanently over years); plus a sensation of aural fullness/pressure. Attacks can be triggered by high sodium intake, caffeine, alcohol, or stress.</p>
  <p><b>Treatment:</b> <b>low-sodium diet (major cornerstone) + diuretics</b> to reduce endolymph volume/pressure; antiemetics and antihistamines/anticholinergics (e.g., meclizine) for acute attack symptoms. During an attack — priority is <b>FALL SAFETY</b>: have the patient lie still in a quiet, dark room and avoid sudden head movement. Severe/refractory cases may need intratympanic injections or surgical intervention (labyrinthectomy = last resort, sacrifices hearing in that ear).</p>
</div>
<div class="card" style="border-color:var(--amber)">
  <h3>⚠️ Metabolic Syndrome</h3>
  <p><b>Cause:</b> chronic insulin resistance and hyperinsulinemia driven by visceral (central) obesity and sedentary lifestyle — a <b>cluster of risk factors, NOT a disease or diabetes complication itself</b>. Diagnosed when a patient has <b>3 or more</b> of the specific criteria below.</p>
  <p><b>Manifests (diagnostic criteria — need ≥3):</b> <b>central/abdominal obesity (waist circumference >40 in men, >35 in women)</b>; <b>blood pressure ≥130/85 mmHg</b>; <b>fasting triglycerides ≥150 mg/dL</b>; <b>HDL <40 mg/dL (men) or <50 mg/dL (women)</b>; <b>fasting glucose ≥100 mg/dL</b>. The combination dramatically raises risk for both Type 2 diabetes AND cardiovascular disease/stroke — more than any single factor alone.</p>
  <p><b>Treatment:</b> <b>lifestyle modification is first-line and can fully reverse it</b> — weight loss (even 5-10% of body weight helps significantly), regular exercise, reduced saturated fat/sodium/refined sugar intake. Pharmacologic treatment of individual components (antihypertensives, statins, metformin for prediabetes) if lifestyle changes alone aren't sufficient.</p>
</div>
<div class="card" style="border-color:var(--teal)">
  <h3>🧬 LADA & Gestational Diabetes</h3>
  <p><b>Cause — LADA ("Type 1.5"):</b> <b>autoimmune beta-cell destruction</b> identical in mechanism to Type 1, but progressing much more slowly, so it presents in adulthood and initially spares enough insulin production to respond to oral agents. <b>Cause — Gestational:</b> <b>placental hormones</b> (human placental lactogen, cortisol, progesterone) cause insulin resistance that the mother's pancreas can't fully overcome, usually appearing in the 2nd-3rd trimester.</p>
  <p><b>Manifests — LADA:</b> initially resembles Type 2 (adult onset, responds to metformin) but <b>confirmed by positive islet cell/GAD antibodies</b>; typically progresses to insulin dependence within a few years — faster than typical Type 2. <b>Manifests — Gestational:</b> usually asymptomatic, caught on routine <b>24-28 week glucose screening</b> (1-hr glucose tolerance test); risk factors include obesity, prior gestational diabetes, and a larger-than-average fetus (macrosomia) on ultrasound.</p>
  <p><b>Treatment — LADA:</b> <b>insulin is typically started earlier</b> than in classic Type 2, since oral agents lose effectiveness faster as beta-cell function keeps declining. <b>Treatment — Gestational:</b> diet/exercise first-line; <b>insulin if glucose targets aren't met</b> (oral agents like metformin/glyburide used more selectively — insulin is preferred in pregnancy); usually resolves after delivery but the mother needs <b>postpartum glucose testing</b> and carries a significantly elevated lifetime risk of developing Type 2 diabetes.</p>
</div>
<div class="card" style="border-color:var(--red)">
  <h3>🦶 Diabetic Foot Ulcer</h3>
  <p><b>Cause:</b> a <b>three-hit combination</b> unique to diabetes — (1) <b>peripheral neuropathy</b> removes protective sensation so injury goes unfelt, (2) <b>peripheral vascular disease</b>/microvascular damage impairs blood flow so wounds can't heal normally, (3) <b>chronic hyperglycemia</b> impairs white blood cell function and feeds bacterial growth. A minor unnoticed injury (blister, cut, ingrown nail) becomes a chronic non-healing wound.</p>
  <p><b>Manifests:</b> typically <b>painless</b> (due to neuropathy) despite significant tissue damage — often first noticed as drainage, odor, or a family member spotting it. Poor granulation tissue, slow/absent healing, surrounding redness/warmth/swelling if infected, possible exposed deeper tissue in advanced cases. Often located over pressure points (plantar surface, under the great toe, heel).</p>
  <p><b>Treatment:</b> <b>daily self-inspection (mirror for soles)</b> to catch injuries before they progress; <b>strict glucose control</b> (the root cause enabler); offloading pressure from the wound (special footwear, total contact casting); wound debridement and moisture-balanced dressings; treat any infection promptly (may require IV antibiotics or surgical debridement); vascular referral if circulation is severely impaired. <b>Untreated, progresses to osteomyelitis and risks amputation</b>.</p>
</div>
<div class="card" style="border-color:var(--teal)">
  <h3>🎯 Macular Degeneration</h3>
  <p><b>Cause:</b> degeneration specifically of the <b>macula</b> — the small central portion of the retina responsible for sharp, detailed vision (reading, faces, fine detail). <b>Dry form (~90%):</b> gradual thinning/atrophy of macular tissue with drusen (yellow deposits) accumulation. <b>Wet form (~10%, more severe/rapid):</b> abnormal, fragile blood vessels grow under the retina and leak fluid/blood.</p>
  <p><b>Manifests:</b> <b>painless loss of CENTRAL vision specifically</b> — straight lines appear wavy or distorted (a hallmark early sign, tested with an Amsler grid), a blurry or blank spot develops in the center of the visual field, faces become hard to recognize. <b>Peripheral vision is preserved</b> — the EXACT OPPOSITE pattern from glaucoma, which is a frequent exam contrast point.</p>
  <p><b>Treatment:</b> dry form — no cure; AREDS2 vitamin formulations (vitamin C/E, zinc, copper, lutein/zeaxanthin) may slow progression; low-vision aids and adaptive devices. Wet form — <b>anti-VEGF intravitreal injections</b> (e.g., bevacizumab, ranibizumab) can slow or partially reverse vision loss by stopping the abnormal vessel growth; needs ongoing periodic injections. <b>Amsler grid used at home for self-monitoring</b> between visits.</p>
</div>
<div class="card" style="border-color:var(--red)">
  <h3>💥 Retinal Detachment</h3>
  <p><b>Cause:</b> the retina (light-sensing layer) <b>tears and separates from the underlying choroid</b>, which supplies its blood and oxygen. Risk factors: severe myopia, previous eye surgery/trauma, aging (vitreous shrinkage pulls on the retina).</p>
  <p><b>Manifests:</b> <b>sudden onset of flashes of light (photopsia) and a shower of new floaters</b> as the vitreous tugs on the retina during the tear, followed by a <b>dark curtain or shadow progressively covering part of the visual field</b> as more retina detaches. Painless. This progression (<b>flashes → floaters → curtain</b>) is the classic symptom sequence tested on exams.</p>
  <p><b>Treatment:</b> true ophthalmic <b>surgical EMERGENCY</b> — options include pneumatic retinopexy, scleral buckle, or vitrectomy to reattach the retina, ideally within hours to a few days. Because detached retinal tissue without blood supply will die and vision loss becomes <b>PERMANENT</b>, patient teaching emphasizes <b>seeking care IMMEDIATELY</b> for these symptoms rather than waiting for a routine appointment.</p>
</div>
<div class="card" style="border-color:var(--teal)">
  <h3>👂 Conductive vs. Sensorineural Hearing Loss</h3>
  <p><b>Cause — Conductive:</b> a <b>mechanical blockage</b> prevents sound from traveling through the outer or middle ear to reach the inner ear — cerumen impaction, otitis media with effusion, perforated tympanic membrane, otosclerosis. <b>Cause — Sensorineural:</b> <b>damage to the cochlea's hair cells or the auditory (CN VIII) nerve</b> itself — presbycusis (age-related, high frequencies first), prolonged noise exposure, ototoxic medications (aminoglycosides, loop diuretics like furosemide, high-dose aspirin/salicylates, some chemotherapy agents), or acoustic neuroma.</p>
  <p><b>Manifests:</b> conductive loss often affects all frequencies more uniformly and may include a sensation of ear fullness/blockage; <b>typically reversible once the obstruction is treated</b>. Sensorineural loss classically affects <b>HIGH frequencies first</b> (difficulty with consonants/speech clarity in noisy environments), often accompanied by tinnitus, and <b>does NOT reverse once the hair cells/nerve are damaged</b>.</p>
  <p><b>Treatment — Conductive:</b> treat the underlying cause — cerumen removal/irrigation, antibiotics or myringotomy tubes for otitis media, surgical repair for otosclerosis/perforation. <b>Treatment — Sensorineural:</b> hearing aids (amplify sound to the damaged system) or cochlear implants for severe loss (bypass the damaged cochlea entirely) — <b>neither restores normal hearing</b>, they compensate for it. Nursing priority: <b>discontinue/report any ototoxic drug immediately</b> if new tinnitus or hearing changes are noticed, since that damage is preventable if caught early but permanent if not.</p>
</div>

  {q:'A nurse provided sick-day teaching to a Type 1 diabetic before discharge. Which statement by the patient indicates the teaching was UNSUCCESSFUL?',type:'single',

  {q:'A nurse is caring for a patient with both diabetic retinopathy and peripheral neuropathy. Which nursing actions are appropriate? (Select all that apply)',type:'multi',

  {q:'A client with Type 2 diabetes for 10 years presents with a resting heart rate of 110 bpm that does not vary with position change or the Valsalva maneuver, along with early satiety and bloating after meals. What underlying process explains BOTH findings together?',type:'single',

],'Decode It — Cause, Manifests, Treatment & Clinical Reasoning');

<script>
document.getElementById('sec-studymode').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🧩</span> Study Mode: Breaking Down a Question</h2>
<p class="intro-line">Before you can pick the right answer, you have to know what's actually being asked. Most wrong answers on his exams come from answering the WRONG question, not from not knowing the content. This is the 5-step process to slow down and read correctly.</p>

<div class="card" style="border-color:var(--purple)">
  <h3>🪜 The 5 steps, every time</h3>
  <ol style="padding-left:20px;line-height:1.9">
    <li><b>Read the STEM alone first</b> — cover the answer choices with your hand/finger. What TYPE of question is this: assessment, priority, teaching, intervention, or evaluation? Answer it in your own words before you ever look at A/B/C/D.</li>
    <li><b>Circle the keyword.</b> FIRST, BEST, PRIORITY, MOST, INITIAL, EXCEPT, NOT, ONLY. These words change what "correct" even means — a "first" question and a "best long-term" question can have different right answers from the exact same scenario.</li>
    <li><b>Identify the framework the question is testing.</b> Is this an ABC (airway/breathing/circulation) question? A Maslow's hierarchy question (physiologic safety beats psychosocial)? A nursing-process question (assessment before intervention, intervention before evaluation)? Naming the framework tells you HOW to rank the options.</li>
    <li><b>Eliminate anything absolute or unsafe FIRST.</b> Options with "always," "never," "only if," or that skip a safety step are usually wrong before you even compare them to the "good" options.</li>
    <li><b>Compare what's left against your OWN answer from step 1</b> — not against each other. Pick the option that matches what you already decided the question was asking, not the option that just "sounds most detailed."</li>
  </ol>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🔍 Worked example #1 — a straightforward-looking question that isn't</h3>
  <p><b>Stem:</b> "A nurse is caring for a patient with DKA who has an order for an insulin drip, IV fluids, and potassium replacement once levels are known. The initial potassium is 5.5 mEq/L. What should the nurse do FIRST?"</p>
  <p><b>Step 1 — what type of question is this?</b> This is a PRIORITY/sequencing question — it's asking what happens first among several correct-sounding orders, not "which of these is ever appropriate."</p>
  <p><b>Step 2 — keyword:</b> "FIRST." That means more than one option might eventually be correct — the question is about the correct ORDER, not about eliminating three "wrong" treatments.</p>
  <p><b>Step 3 — framework:</b> this is a sequencing/prioritization question built on the DKA mechanism — fluids before insulin, because the patient is profoundly dehydrated first.</p>
  <p><b>Step 4 — eliminate the absolute/unsafe option:</b> giving potassium replacement immediately, just because 5.5 "looks high," ignores that acidosis is artificially inflating that number — an unsafe assumption to act on first.</p>
  <p><b>Step 5 — match to your own answer:</b> you already know from the mechanism that fluids come first in DKA. The option that says "begin IV fluids" matches that — not the option that sounds like it's "doing the most" by treating the potassium right away.</p>
  <div class="hy">⭐ Notice: knowing the DKA mechanism (fluids → insulin → potassium) made step 5 almost automatic. That's the whole point of the Why Engine — mechanism does the sorting for you.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🔍 Worked example #2 — a keyword that flips the entire answer</h3>
  <p><b>Stem:</b> "Which of the following is NOT an appropriate discharge goal for a patient recovering from a first DKA episode caused by missed insulin doses during a stomach virus?"</p>
  <p><b>Step 1 — what type of question is this?</b> This is a PLANNING/goal-setting question from the nursing process — but phrased backwards from how these questions usually read.</p>
  <p><b>Step 2 — keyword:</b> "NOT." This is the single most important word in the whole stem. Skip it, and you'll instinctively pick the BEST goal instead of the ONE THAT DOESN'T BELONG — which is the exact opposite of what's being asked.</p>
  <p><b>Step 3 — framework:</b> realistic vs. unsafe discharge goals — a good goal should target the actual root cause of this admission (the missed insulin doses).</p>
  <p><b>Step 4 — eliminate the absolute/unsafe option:</b> a goal like "stop checking blood glucose once the illness resolves" is the unsafe one — glucose monitoring is permanent, not tied to one illness episode.</p>
  <p><b>Step 5 — match to your own answer:</b> because the keyword is NOT, the "wrong-sounding" goal is actually the CORRECT answer to select. This is where most points get lost — not from lack of knowledge, but from answering as if the keyword wasn't there.</p>
  <div class="hy">⭐ Whenever you see NOT or EXCEPT, physically say "which one is the ODD ONE OUT" in your head before reading the options — it resets your brain to look for the wrong-fitting choice instead of the best-sounding one.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⚠️ The most common ways students misread a question</h3>
  <ul class="clean">
    <li><b>Missing the keyword</b> (NOT/EXCEPT/FIRST) and answering the opposite question.</li>
    <li><b>Picking the longest, most detailed-sounding option</b> instead of the one that actually fits the stem — length is not a reliability signal.</li>
    <li><b>Answering with outside knowledge instead of the stem's own data</b> — if the stem gives you a pH of 7.34, use THAT number, don't assume "DKA" just because ketones were mentioned earlier in the unit.</li>
    <li><b>Confusing "what's abnormal" with "what's most urgent."</b> A stem can list three abnormal findings and one truly urgent one — the urgent one wins, not the "most abnormal-looking" one.</li>
    <li><b>Forgetting what TYPE of question it is.</b> An assessment question wants data-gathering; an intervention question wants action; mixing these up leads to picking "monitor" when the question wanted "act," or vice versa.</li>
  </ul>
</div>

<div id="quiz-studymode"></div>
`;

renderQuiz('quiz-studymode',[
  {q:'PRACTICE — "A nurse is caring for four patients. Which patient should the nurse assess FIRST?" What TYPE of question is this, and what does the keyword tell you?',type:'single',
   opts:['A teaching question; the keyword tells you to focus on patient education needs','An evaluation question; the keyword tells you to check if a prior intervention worked','This keyword has no real effect on how the question should be answered','A priority question; several patients need attention but one comes first'],correct:3,
   rat:'This is a classic priority/triage stem. "FIRST" doesn\'t mean the other three patients are fine — it means you\'re ranking urgency among several legitimate needs, which is exactly why skimming past this word leads people to just pick "the sickest-sounding" patient without actually comparing all four.'},

  {q:'PRACTICE — "All of the following are expected findings in DKA EXCEPT:" Before reading the options, what should you tell yourself about how to approach this question?',type:'single',
   opts:['Look for the BEST expected finding among the four options','Assume all four options are correct and pick the most severe one','This phrasing means the question has no single correct answer','Look for the one finding that does NOT belong with the others — the odd one out'],correct:3,
   rat:'The EXCEPT keyword flips the entire task: instead of finding the best/most correct option, you\'re hunting for the ONE that doesn\'t fit the pattern the other three share. Missing this word is one of the single most common ways students lose easy points on well-known content.'},

  {q:'PRACTICE — A question describes a patient with glucose 640, pH 7.34, and no ketones, then asks "which condition does this represent?" A classmate assumes DKA because the glucose is so high. What did they do wrong?',type:'single',
   opts:['Nothing — DKA is the correct pattern-match for very high glucose','They should have assumed HHS instead, since HHS always has lower glucose than DKA','They pattern-matched on glucose severity instead of reading the pH and ketone data','The question is unanswerable without additional labs'],correct:2,
   rat:'This mirrors a very common mistake: reacting to the most dramatic-sounding number (640) instead of using the data that actually differentiates the two conditions. The stem GIVES you the deciding information — normal pH, no ketones — which points to HHS regardless of how high the glucose climbs.'}
],'Practice: Spot the Question Type');
</script>

<h2 class="sec-title"><span class="sec-emoji">🎯</span> Trick Questions</h2>
<p class="intro-line">Casteel loves NOT / EXCEPT / BEST / FIRST / ONLY. Circle the key word before you read the answers. With mechanism knowledge, the trap answer looks wrong.</p>

renderFilteredQuiz('quiz-tricks',[
  {topic:'general',q:'All of the following are expected findings in DKA EXCEPT:',type:'single',
   opts:['A. Kussmaul respirations from metabolic acidosis','B. Fruity/acetone breath odor from ketones','C. Positive serum and urine ketones','D. Blood pH within the normal range'],correct:3,
   rat:'EXCEPT = the odd one out. Kussmaul breathing, fruity breath, and positive ketones are all core DKA findings. A normal pH is the impostor — DKA is defined by metabolic ACIDosis, so pH must be LOW, not normal.'},

  {topic:'general',q:'Which of the following is NOT an appropriate nursing action for a reddened, intact area over a bony prominence?',type:'single',
   opts:['A. Reposition the patient to relieve pressure on the area','B. Massage the area firmly to stimulate local blood flow','C. Keep the surrounding skin clean and dry','D. Document and continue monitoring the area closely'],correct:1,
   rat:'NOT = the incorrect action. Repositioning, keeping skin clean/dry, and monitoring are all appropriate. Massaging is contraindicated — the tissue is already compromised by pressure, and massage can rupture fragile capillaries and worsen the damage.'},

  {topic:'general',q:'The ONLY insulin formulation approved for intravenous administration is:',type:'single',

   rat:'This is a true absolute — don\'t second-guess it just because the stem says "only." Regular insulin is the sole formulation given IV (used in DKA drips); NPH, glargine, and lispro are never administered intravenously.'},

  {topic:'general',q:'A patient with Type 2 diabetes taking metformin is scheduled for a contrast CT scan tomorrow. Which nursing action is BEST?',type:'single',
   opts:['A. Administer an extra metformin dose tonight to preemptively protect the kidneys','B. Hold the metformin before and after the contrast per facility protocol','C. Replace the metformin with an equivalent insulin dose for the day of the scan','D. Cancel the scan until the patient is no longer taking metformin'],correct:1,
   rat:'BEST = the safest, evidence-based action. Metformin plus contrast dye raises lactic acidosis/kidney injury risk, so it\'s held around the procedure. Giving an extra dose (A) is dangerous, an insulin swap (C) is unnecessary, and cancelling the scan (D) is an overreaction.'},

  {topic:'general',q:'A nurse is assigned four patients at the start of the shift. Which patient should the nurse assess FIRST?',type:'single',
   opts:['A. A Type 2 diabetic with a fingerstick glucose of 180 mg/dL and no symptoms','B. A Type 1 diabetic who is confused, diaphoretic, and visibly shaking','C. A patient with a healing Stage 2 pressure injury scheduled for a dressing change','D. A glaucoma patient due for a routine dose of eye drops'],correct:1,
   rat:'FIRST = the acute, rapidly evolving threat. Confusion + diaphoresis + shaking in a diabetic is the classic hypoglycemia pattern — a brain emergency in progress. A glucose of 180 is mildly elevated but stable, and the other two patients have routine, non-urgent care needs.'},

  {topic:'general',q:'All of the following increase a patient\'s risk for pressure injury EXCEPT:',type:'single',
   opts:['A. Immobility','B. Urinary or fecal incontinence','C. Being repositioned on a strict every-2-hour schedule','D. Serum albumin of 2.5 g/dL'],correct:2,
   rat:'EXCEPT = the one that doesn\'t belong. Immobility, incontinence (moisture), and low albumin (poor nutrition) all raise risk. Scheduled repositioning is the PROTECTIVE intervention that lowers risk — it\'s the impostor precisely because it sounds like it belongs on a "risk factor" list.'},

  {topic:'general',q:'A conscious patient reports feeling shaky with a fingerstick glucose of 55 mg/dL. Which is the BEST first action?',type:'single',
   opts:['A. Administer glucagon intramuscularly','B. Give 15 g of fast-acting carbohydrate and recheck glucose in 15 minutes','C. Provide a large meal containing protein and fat','D. Administer the patient\'s scheduled insulin dose as ordered'],correct:1,
   rat:'BEST/FIRST for a conscious, swallowing-capable hypoglycemic patient is the Rule of 15. Glucagon (A) is reserved for patients who cannot safely swallow; a large fatty meal (C) slows carbohydrate absorption; and giving insulin (D) would dangerously worsen the hypoglycemia.'},

  {topic:'eye',q:'A patient with glaucoma asks which type of vision loss occurs FIRST in their condition. Which is the ONLY correct answer?',type:'single',
   opts:['A. Central vision, affecting reading and face recognition first','B. Peripheral (side) vision, producing a gradual tunnel-vision effect','C. Color vision, causing colors to appear faded','D. Near vision, similar to normal age-related presbyopia'],correct:1,
   rat:'ONLY correct = peripheral vision loss, since glaucoma damages the optic nerve from the outer edge inward. Central vision loss (A) describes macular degeneration instead — a frequently tested trap pairing between these two conditions.'},

  {topic:'general',q:'Which statement about HHS is NOT true?',type:'single',
   opts:['A. It occurs almost exclusively in patients with Type 2 diabetes','B. It involves severe hyperglycemia and profound dehydration','C. It typically causes significant ketoacidosis with Kussmaul respirations','D. Blood glucose levels are often above 600 mg/dL'],correct:2,
   rat:'NOT true = the false statement to identify. HHS does NOT cause significant ketoacidosis or Kussmaul breathing — that combination belongs to DKA. HHS patients retain just enough insulin to prevent ketone production, which is the entire mechanism distinguishing the two conditions.'},

  {topic:'eye',q:'Which of the following findings is the ONLY true medical emergency requiring immediate same-day treatment?',type:'single',
   opts:['A. Gradual peripheral vision loss occurring over several months','B. Sudden severe eye pain with halos, nausea, and a firm, hard globe','C. Painless, slowly progressive blurry vision from cataracts','D. Mild eye dryness and occasional irritation'],correct:1,
   rat:'ONLY emergency = acute angle-closure glaucoma. The sudden severe pain, halos, nausea, and firm globe together signal a rapid IOP spike threatening permanent vision loss within hours — the other three findings are all chronic and non-urgent by comparison.'},

  {topic:'eye',q:'All of the following are TRUE about macular degeneration EXCEPT:',type:'single',
   opts:['A. It causes loss of central vision','B. Peripheral vision is generally preserved','C. It typically presents with sudden, severe eye pain','D. Straight lines may appear wavy or distorted'],correct:2,
   rat:'EXCEPT = the false statement. Macular degeneration is painless and gradual — sudden severe pain belongs to angle-closure glaucoma, not this condition. Central loss, spared periphery, and wavy-line distortion are all true hallmarks of macular degeneration.'},

  {topic:'eye',q:'A nurse is teaching a client the difference between conductive and sensorineural hearing loss, and separately reviewing why open-angle glaucoma is dangerous. Which statement reflects a correct understanding of BOTH topics?',type:'single',

   rat:'B is a much better fit for angle-closure glaucoma\'s presentation, not open-angle glaucoma or gradual hearing loss — both of which are notably painless. C overstates reversibility for both (glaucoma damage is permanent, sensorineural loss usually is too). D is simply false, since both have detectable patterns/signs even if subtle. The one true shared feature is that BOTH can progress quietly, painlessly, without the person noticing until real damage has occurred.'},

  {topic:'eye',q:'The ONLY definitive treatment for a cataract is:',type:'single',

   rat:'This is a genuine absolute — don\'t talk yourself out of it just because the stem says "only." Glasses can help manage symptoms temporarily, drops don\'t address the cloudy lens itself, and anti-VEGF injections are for macular degeneration, not cataracts. Surgical removal/replacement is the only true fix.'},

  {topic:'eye',q:'Which of the following statements about pupil terminology is NOT correct?',type:'single',

   rat:'NOT correct = the false statement. A consensual response is specifically about the OTHER eye reacting, not the same one — that description actually belongs to the direct response (D), which IS correctly stated. A and B are both accurate as written.'},

  {topic:'eye',q:'All of the following describe myopia EXCEPT:',type:'single',
   opts:['A. Close objects appear clear','B. Distant objects appear blurry','C. Light focuses behind the retina','D. The eyeball may be longer than average'],correct:2,
   rat:'EXCEPT = the false statement. Light focusing behind the retina describes hyperopia, the opposite condition — a classic reversed-mechanism trap. Myopia\'s actual mechanism is light focusing IN FRONT of the retina, which is why A, B, and D are all accurate for myopia.'},

  {topic:'eye',q:'A patient asks which vision loss pattern happens FIRST in open-angle glaucoma. Which is the ONLY correct answer?',type:'single',
   opts:['A. Central vision','B. Peripheral (side) vision','C. Both central and peripheral vision equally','D. Color perception'],correct:1,
   rat:'ONLY correct = peripheral vision loss. Open-angle glaucoma damages the optic nerve from the outside in, so peripheral (side) vision goes first — central vision (A) is the pattern for macular degeneration instead, a frequently tested contrast.'},

  {topic:'eye',q:'Which statement about cataracts is NOT true?',type:'single',
   opts:['A. Cataracts cause painless, gradual vision changes','B. Cataracts are treated with surgical lens removal and implant','C. Cataracts typically cause sudden, severe eye pain as an early symptom','D. Diabetes is a recognized risk factor for cataracts'],correct:2,
   rat:'NOT true = the false statement. Cataracts are painless and gradual — sudden severe pain belongs to a completely different condition (angle-closure glaucoma). A, B, and D are all accurate statements about cataracts.'},

  {topic:'eye',q:'Which of the following is the BEST initial nursing action for a patient reporting sudden flashes of light and new floaters in one eye, without pain?',type:'single',
   opts:['A. Reassure the patient this is a normal part of aging and no action is needed','B. Advise the patient to rest the eyes and follow up at their next scheduled visit','C. Refer the patient for prompt ophthalmologic evaluation the same day','D. Apply a warm compress and recheck in 24 hours'],correct:2,
   rat:'BEST = the safest, most appropriate action given what these symptoms could represent. A dismisses a potential emergency as normal, B and D both delay care for a time-sensitive presentation. Flashes and new floaters can be an early sign of retinal detachment, which warrants prompt same-day evaluation rather than routine follow-up.'},

  {topic:'eye',q:'All of the following are appropriate teaching points for a patient recovering from cataract surgery EXCEPT:',type:'single',
   opts:['A. Avoid bending, lifting, or straining','B. Report sudden pain or vision changes immediately','C. Resume vigorous exercise and heavy lifting the next day to stay active','D. Wear the protective eye shield as instructed, especially at night'],correct:2,
   rat:'EXCEPT = the unsafe teaching point. Resuming vigorous exercise/heavy lifting the day after eye surgery directly contradicts the activity restrictions needed to protect the healing eye — raising IOP too soon risks complications. A, B, and D are all correct post-op teaching.'},

  {topic:'eye',q:'The ONLY finding below that describes the classic presentation of retinal detachment is:',type:'single',
   opts:['A. Gradual, painless loss of peripheral vision over months','B. Sudden flashes of light and floaters followed by a curtain or shadow over part of the vision','C. Slowly progressive blurry vision with glare, worse at night','D. A blank or wavy spot in the center of the visual field'],correct:1,
   rat:'A describes glaucoma, C describes cataracts, and D describes macular degeneration — three real, frequently confused conditions. Retinal detachment\'s classic and distinct presentation is the flashes → floaters → curtain sequence.'},

  {topic:'eye',q:'Which of the following statements about intraocular pressure (IOP) is NOT correct?',type:'single',
   opts:['A. Normal IOP is roughly 10-21 mmHg','B. Angle-closure glaucoma can cause a rapid, severe IOP spike','C. Open-angle glaucoma causes IOP to rise gradually over years','D. IOP has no relationship to optic nerve damage in glaucoma'],correct:3,

  {topic:'eye',q:'A nurse is caring for a patient with a known history of angle-closure glaucoma. Which order should the nurse question BEST before it is carried out?',type:'single',

   rat:'A, C, and D are all routine, safe orders with no specific concern for this diagnosis. A dilating/mydriatic drop, however, is the one order that directly conflicts with this patient\'s condition — dilating the pupil can push the iris into the already-narrow drainage angle and trigger an acute attack, making this the order worth questioning.'},

  {topic:'eye',q:'Which of the following statements about visual acuity is NOT correct?',type:'single',
   opts:['A. A larger bottom number in the Snellen fraction indicates worse vision','B. 20/20 is considered normal visual acuity','C. A patient with 20/40 vision sees better than a patient with 20/20 vision','D. The top number represents the standard testing distance of 20 feet'],correct:2,
   rat:'NOT correct = the false statement. This reverses the actual relationship — 20/40 vision is WORSE than 20/20, not better, since the patient needs to be closer (or the line larger) to see what a normal eye sees from farther away. A, B, and D are all accurate.'},

  {topic:'eye',q:'All of the following are TRUE regarding retinal detachment EXCEPT:',type:'single',
   opts:['A. It typically presents with flashes of light and new floaters','B. It is considered a true surgical emergency','C. Vision loss from a delayed repair is usually reversible once surgery is finally performed','D. A curtain or shadow may progress across the visual field'],correct:2,
   rat:'EXCEPT = the false statement. Once retinal tissue has died from lost blood supply, that vision loss is typically PERMANENT — surgery afterward cannot reverse tissue that has already died, which is exactly why speed matters so much. A, B, and D are all accurate.'}
],'Spot-the-Trap Practice');
