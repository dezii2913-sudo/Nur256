<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>NUR 256 — Unit 3 Study Lab</title>
<style>
:root{
  color-scheme: light;
  --bg:#e4edff; --bg2:#fff;
  --ink:#0f1f3d; --muted:#4a5f8a;
  --card:#ffffff; --card-border:#bcd3ff;
  --pink:#2563eb; --pink-soft:#dbe8ff;
  --purple:#0284c7; --purple-soft:#dcf3ff;
  --teal:#0891b2; --teal-soft:#cffafe;
  --green:#22c55e; --green-soft:#dcfce7;
  --red:#ef4444; --red-soft:#fee2e2;
  --amber:#f59e0b; --amber-soft:#fef3c7;
  --blue:#1d4ed8; --blue-soft:#dbeafe;
}
[data-theme="night"]{
  color-scheme: dark;
  --bg:#0a0f1e; --bg2:#0f1830;
  --ink:#eef3ff; --muted:#9ab0d9;
  --card:#141d38; --card-border:#2a3a63;
  --pink:#5b9bf5; --pink-soft:#16233f;
  --purple:#4dc8f0; --purple-soft:#122333;
  --teal:#2dd9e8; --teal-soft:#0d2a30;
  --green-soft:#123321; --red-soft:#3a1f1f; --amber-soft:#3a2f12;
  --blue:#7fb4ff; --blue-soft:#16233f;
}
html{background:var(--bg)}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  transition:background .3s,color .3s;padding-bottom:80px;
}
/* BIG TEXT mode */
body.mobile-mode{font-size:1.18rem;line-height:1.7}
body.mobile-mode .grid2,body.mobile-mode .grid3{grid-template-columns:1fr!important;gap:18px}
body.mobile-mode .content{padding:16px}
body.mobile-mode .card{padding:20px 18px;margin-bottom:18px}
body.mobile-mode .card h3{font-size:1.3rem;line-height:1.4}
body.mobile-mode .sec-title{font-size:1.55rem;line-height:1.35}
body.mobile-mode p,body.mobile-mode li,body.mobile-mode td,body.mobile-mode th{font-size:1.12rem;line-height:1.7}
body.mobile-mode .clean li{margin-bottom:12px}
body.mobile-mode .opt{font-size:1.12rem;padding:16px;min-height:54px;line-height:1.5}
body.mobile-mode .q-text{font-size:1.18rem;line-height:1.55}
body.mobile-mode .btn,body.mobile-mode .tbtn{font-size:1.1rem;padding:14px 18px}
body.mobile-mode .nav button{font-size:1.05rem;padding:12px 14px}
body.mobile-mode .rationale{font-size:1.08rem;line-height:1.6}
body.mobile-mode .mnem .big{font-size:1.15rem}
body.mobile-mode .hy{font-size:1.1rem;line-height:1.6;padding:16px}
body.mobile-mode table.lab{font-size:.9rem}
body.mobile-mode .lab td,body.mobile-mode .lab th{padding:9px 7px;font-size:.92rem!important}

/* TOP BAR */
.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(90deg,var(--pink),var(--purple));
  color:#fff;padding:12px 16px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex-wrap:wrap;
  box-shadow:0 2px 14px rgba(0,0,0,.18);
}
.topbar h1{font-size:1.2rem;margin:0;font-weight:800;letter-spacing:.3px}
.topbar .sub{font-size:.72rem;opacity:.9;font-weight:500;display:block}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{border:none;background:rgba(255,255,255,.25);color:#fff;padding:9px 14px;border-radius:30px;font-weight:700;font-size:.85rem;cursor:pointer;backdrop-filter:blur(4px)}
.tbtn:active{transform:scale(.95)}

.progwrap{padding:10px 16px;background:var(--bg2)}
.progbar-bg{background:var(--card-border);border-radius:20px;height:14px;overflow:hidden}
.progbar{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:20px;transition:width .5s}
.progtext{font-size:.72rem;color:var(--muted);text-align:center;margin-top:4px;font-weight:600}

/* NAV TABS */
.nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;-webkit-overflow-scrolling:touch;background:var(--bg)}
.nav button{flex:0 0 auto;border:2px solid var(--card-border);background:var(--card);color:var(--ink);padding:9px 15px;border-radius:30px;font-weight:700;font-size:.82rem;cursor:pointer;transition:.2s;white-space:nowrap}
.nav button.active{background:var(--purple);color:#fff;border-color:var(--purple);transform:scale(1.04)}

.content{max-width:920px;margin:0 auto;padding:18px;background:var(--bg)}
.section{display:none;animation:fade .4s;scroll-margin-top:12px}
.section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.sec-title{font-size:1.5rem;font-weight:800;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.sec-emoji{font-size:1.6rem}
.intro-line{color:var(--muted);margin:0 0 16px;font-size:.95rem}

.card{background:var(--card);border:2px solid var(--card-border);border-radius:16px;padding:16px 18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card h3{margin:0 0 10px;font-size:1.15rem}
.clean{list-style:none;padding:0;margin:8px 0}
.clean li{padding:6px 0 6px 22px;position:relative}
.clean li:before{content:"▸";position:absolute;left:0;color:var(--purple);font-weight:800}
.pill{display:inline-block;background:var(--purple-soft);color:var(--purple);padding:2px 10px;border-radius:20px;font-size:.7rem;font-weight:800;margin-left:6px}

.hy{background:var(--amber-soft);border-left:5px solid var(--amber);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.9rem}
.why-chain{background:var(--teal-soft);border-left:4px solid var(--teal);border-radius:10px;padding:12px 14px;margin:10px 0;line-height:1.7}
.mnem{background:var(--purple-soft);border-radius:12px;padding:10px 14px;margin:10px 0}
.mnem .tag{font-size:.68rem;font-weight:800;color:var(--purple);text-transform:uppercase;letter-spacing:.5px}
.mnem .big{font-size:1.05rem;font-weight:800;margin:3px 0}
.mnem .exp{font-size:.85rem;color:var(--muted)}
.profnote{background:var(--teal-soft);border-left:5px solid var(--teal);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.9rem}
.profnote .tag{font-size:.68rem;font-weight:800;color:var(--teal);text-transform:uppercase;letter-spacing:.5px}

table.lab{width:100%;border-collapse:collapse;margin:10px 0;font-size:.88rem;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(min-width:640px){table.lab{display:table}}
table.lab th{background:var(--purple);color:#fff;padding:8px;text-align:left;font-size:.8rem}
table.lab td{padding:8px;border-bottom:1px solid var(--card-border);min-width:80px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}

/* QUIZ */
.quiz-card{background:var(--card);border:2px solid var(--card-border);border-radius:14px;padding:16px;margin:12px 0}
.q-text{font-weight:700;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--card-border);background:var(--bg2);color:var(--ink);padding:11px 14px;border-radius:10px;cursor:pointer;font-size:.92rem;transition:.15s}
.opt:hover{border-color:var(--purple)}
.opt.correct{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.opt.sel-multi{border-color:var(--purple);background:var(--purple-soft)}
.opt.disabled{pointer-events:none;opacity:.85}
.rationale{margin-top:10px;padding:10px 12px;background:var(--blue-soft);border-radius:10px;font-size:.86rem;display:none}
.rationale.show{display:block}
.submit-multi{margin-top:8px;background:linear-gradient(90deg,var(--teal),var(--green));color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:800;cursor:pointer}
.center{text-align:center}
.btn{background:var(--purple);color:#fff;border:none;padding:11px 20px;border-radius:12px;font-weight:800;cursor:pointer;font-size:.95rem}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--card-border)}
.tipbar{background:var(--teal-soft);border-radius:12px;padding:10px 14px;font-size:.85rem;margin:10px 0}
.kbd{background:var(--card);border:1px solid var(--card-border);border-radius:6px;padding:1px 7px;font-weight:700;font-size:.8rem}
.quiz-score{font-size:1.15rem;font-weight:800;text-align:center;padding:16px;background:var(--purple-soft);border-radius:14px;margin:12px 0}

/* flash game */
.flash-progress{text-align:center;font-size:.85rem;color:var(--muted);margin-bottom:10px;font-weight:700}
.flash-card{background:var(--card);border:3px solid var(--purple);border-radius:20px;padding:34px 22px;min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.12rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow,0 4px 18px rgba(0,0,0,.12));transition:transform .15s,background .2s,border-color .2s}
.flash-card:active{transform:scale(.97)}
.flash-card.flipped{border-color:var(--teal);background:var(--teal-soft)}
.flash-label{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px;display:block}
.flash-btns{display:flex;gap:10px;margin-top:14px}
.flash-btn{flex:1;padding:14px;border-radius:14px;border:none;font-weight:800;cursor:pointer;font-size:.92rem}
.flash-btn.learning{background:var(--amber-soft);color:var(--amber);border:2px solid var(--amber)}
.flash-btn.gotit{background:var(--green-soft);color:var(--green);border:2px solid var(--green)}

/* wrong answer vault */
.vault-empty{text-align:center;padding:30px 16px;font-size:1rem}
.vault-tag{display:inline-block;background:var(--purple-soft);color:var(--purple);font-size:.72rem;font-weight:800;border-radius:20px;padding:2px 10px;margin-bottom:8px}
.vault-solved{background:var(--green-soft);border:2px solid var(--green);color:var(--green);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:.85rem;font-weight:700;text-align:center}

/* match game */
.match-stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-weight:800;font-size:.88rem;margin:10px 0;color:var(--ink)}
.match-wrap{position:relative}
.match-svg{display:block;position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.match-columns{display:flex;gap:10px;position:relative;z-index:2}
.match-col{flex:1 1 0;display:flex;flex-direction:column;gap:9px;min-width:0}
.match-item{width:100%;box-sizing:border-box;background:var(--card);border:2px solid var(--card-border);border-radius:12px;padding:11px 8px;font-size:.74rem;font-weight:700;cursor:pointer;text-align:left;transition:border-color .15s,background .15s,transform .1s;line-height:1.3;word-break:break-word;overflow-wrap:anywhere;white-space:normal}
.match-item:active{transform:scale(.98)}
.match-item.selected{border-color:var(--purple);background:var(--purple-soft)}
.match-item.matched{border-color:var(--green);background:var(--green-soft);color:var(--green);cursor:default;opacity:.75}
.match-item.shake{border-color:var(--red);background:var(--red-soft);animation:matchshake .35s}
@keyframes matchshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
body.mobile-mode .match-item{font-size:.95rem}
body.mobile-mode .match-stats{font-size:1rem}

/* exam: dropdown-match type */
.dm-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card);border:2px solid var(--card-border);border-radius:12px;margin-bottom:8px;flex-wrap:wrap}
.dm-term{font-weight:800;flex:1 1 140px;min-width:120px}
.dm-select{flex:1 1 200px;padding:9px;border-radius:10px;border:2px solid var(--card-border);background:var(--bg2);color:var(--ink);font-size:.85rem}
.dm-row.dm-correct{border-color:var(--green);background:var(--green-soft)}
.dm-row.dm-wrong{border-color:var(--red);background:var(--red-soft)}

/* exam: order/sequence type (NCLEX-style drag-and-drop, tap-to-sequence) */
.order-pool{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.order-chip{background:var(--card);border:2px solid var(--card-border);border-radius:12px;padding:11px 12px;font-size:.85rem;font-weight:700;cursor:pointer;text-align:left}
.order-chip:disabled{opacity:.35;cursor:default}
.order-answer{display:flex;flex-direction:column;gap:6px;margin:10px 0;min-height:40px;padding:8px;border:2px dashed var(--card-border);border-radius:12px}
.order-answer-item{display:flex;align-items:center;gap:8px;background:var(--purple-soft);border:2px solid var(--purple);border-radius:10px;padding:8px 10px;font-size:.82rem;font-weight:700}
.order-answer-item .num{background:var(--purple);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0}
.order-answer-item.order-correct{background:var(--green-soft);border-color:var(--green)}
.order-answer-item.order-wrong{background:var(--red-soft);border-color:var(--red)}

/* drill */
.drill-top{display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;margin-bottom:6px}
.drill-bar{height:8px;background:var(--card-border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.drill-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));transition:.3s}
.drill-final{font-size:1.6rem;font-weight:800;color:var(--purple);margin:10px 0}

/* exam */
.exam-mode-toggle{display:flex;gap:10px;margin:12px 0;justify-content:center}
.mode-btn{flex:1;max-width:220px;padding:12px 16px;border-radius:14px;border:2px solid var(--card-border);background:var(--card);color:var(--ink);font-weight:800;font-size:.95rem;cursor:pointer}
.mode-btn.active{background:linear-gradient(90deg,var(--purple),var(--pink));color:#fff;border-color:transparent}
.exam-q{background:var(--card);border:2px solid var(--card-border);border-radius:14px;padding:16px;margin:10px 0}
.qnum{font-size:.7rem;font-weight:800;color:var(--purple);text-transform:uppercase}
.qtype{font-size:.64rem;font-weight:800;padding:2px 8px;border-radius:20px;background:var(--blue-soft);color:var(--blue);margin-left:6px}
.qtext{font-weight:700;margin:8px 0 12px}
.exam-nav{position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--card-border);padding:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:14px 14px 0 0;margin-top:10px}
.exam-dots{display:flex;flex-wrap:wrap;gap:4px;max-width:60%}
.dot{width:13px;height:13px;border-radius:50%;background:var(--card-border);cursor:pointer}
.dot.answered{background:var(--teal)}
.dot.current{background:var(--pink);transform:scale(1.3)}
.dot.dot-correct{background:var(--green)}
.dot.dot-wrong{background:var(--red)}

/* ---- retake build additions ---- */
.trap{background:var(--red-soft);border-left:5px solid var(--red);border-radius:10px;padding:11px 14px;margin:10px 0;font-size:.9rem}
.trap .tag{font-size:.68rem;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px}
.hy .tag{font-size:.68rem;font-weight:800;color:var(--amber);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px}
.noteinput{width:100%;font-family:inherit;font-size:1rem;padding:13px;border-radius:12px;border:2px solid var(--card-border);background:var(--bg2);color:var(--ink);resize:vertical;line-height:1.5}
.noteinput:focus{outline:none;border-color:var(--purple)}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.chip{font-family:inherit;font-size:.8rem;font-weight:700;padding:8px 13px;border-radius:999px;border:2px solid var(--card-border);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
.starline{display:flex;align-items:center;gap:9px;margin:10px 0 14px;font-size:.93rem}
.starline input{width:20px;height:20px;accent-color:var(--purple)}
.notecard{border:2px solid var(--card-border);border-radius:12px;padding:11px 13px;margin:9px 0;background:var(--bg2)}
.noterow{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.notespacer{flex:1}
.notetag{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--purple);background:var(--purple-soft);padding:3px 9px;border-radius:999px}
.notetext{white-space:pre-wrap;line-height:1.55;font-size:.96rem}
.mini{font-family:inherit;font-size:.76rem;font-weight:700;padding:6px 12px;border-radius:999px;border:2px solid var(--card-border);background:var(--card);color:var(--ink);cursor:pointer}
.mini.on{background:var(--amber);border-color:var(--amber);color:#fff}
.mini.danger{color:var(--red);border-color:var(--red-soft)}
.btn.wide{width:100%}
.opt:focus{outline:none}
.opt:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.exam-dots{max-height:56px;overflow-y:auto;align-content:flex-start;padding:2px}
.dot{width:11px;height:11px;flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg2);padding:11px 20px;border-radius:30px;font-weight:700;font-size:.88rem;opacity:0;pointer-events:none;transition:.25s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#backToTopBtn{position:fixed;bottom:84px;right:16px;z-index:999;width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-size:1.25rem;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .25s,transform .15s;padding:0}
#backToTopBtn.show{display:flex;opacity:1}
#backToTopBtn:active{transform:scale(.9)}
#backToTopBtn:focus{outline:none}
#backToTopBtn:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
@media(min-width:940px){#backToTopBtn{right:calc(50vw - 470px)}}
#listenFab{position:fixed;bottom:140px;right:16px;z-index:999;width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--teal),var(--purple));color:#fff;font-size:1.2rem;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#listenFab:active{transform:scale(.9)}
#listenFab:focus{outline:none}
#listenFab:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
@media(min-width:940px){#listenFab{right:calc(50vw - 470px)}}
#listenBar{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--card);border-top:3px solid var(--purple);box-shadow:0 -4px 20px rgba(0,0,0,.18);padding:10px 12px calc(10px + env(safe-area-inset-bottom));font-family:inherit}
.lb-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lb-lab{flex:1;font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-x{background:none;border:none;color:var(--muted);font-size:1.05rem;cursor:pointer;padding:4px 8px;font-family:inherit}
.lb-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lb-btn{font-family:inherit;font-size:1.05rem;padding:9px 14px;border-radius:12px;border:2px solid var(--card-border);background:var(--bg2);color:var(--ink);cursor:pointer;line-height:1}
.lb-main{background:var(--purple);border-color:var(--purple);color:#fff;min-width:62px}
.lb-sp{display:flex;gap:5px}
.lb-rate{font-family:inherit;font-size:.75rem;font-weight:700;padding:7px 10px;border-radius:999px;border:2px solid var(--card-border);background:var(--card);color:var(--ink);cursor:pointer}
.lb-rate.on{background:var(--teal);border-color:var(--teal);color:#fff}
.listen-now{outline:3px solid var(--purple);outline-offset:4px;border-radius:14px}
body:has(#listenBar) footer{padding-bottom:120px}
.chainlist{list-style:none;padding:0;margin:8px 0}
.chainlist li{margin-bottom:7px;line-height:1.5}
</style>
</head>
<body data-theme="day">

<div class="topbar">
  <div>
    <h1>🧪 NUR 256 — Unit 3 Study Lab</h1>
    <span class="sub">Diabetes • Skin/Wounds • Eye • Ear</span>
  </div>
  <div class="toggles">
    <button class="tbtn" id="themeBtn" onclick="toggleTheme()">🌙 Night</button>
    <button class="tbtn" id="mobileBtn" onclick="toggleMobile()">🔍 Big Text</button>
    <button class="tbtn" id="shuffleBtn" onclick="toggleShuffle()">🔀 Shuffle: ON</button>
  </div>
</div>

<div class="progwrap">
  <div class="progbar-bg"><div class="progbar" id="progbar"></div></div>
  <div class="progtext" id="progtext">0 quiz questions answered • Let's go! 💪</div>
  <div style="text-align:center;margin-top:6px"><button onclick="resetAllProgress()" style="background:none;border:none;color:var(--muted);font-size:.68rem;text-decoration:underline;cursor:pointer">↺ reset my saved progress</button></div>
</div>

<div class="nav" id="nav"></div>
<div class="content" id="content"></div>

let answeredQs=new Set(); let totalTrackable=0;
(function restoreProgress(){ try{ const r=localStorage.getItem('nur256u3_progress'); if(r){ JSON.parse(r).forEach(id=>answeredQs.add(id)); } }catch(e){} })();
function saveProgress(){ try{ localStorage.setItem('nur256u3_progress', JSON.stringify([...answeredQs])); }catch(e){} }
function resetAllProgress(){ if(!confirm('Reset all saved progress (quiz progress + saved exam + vault + flash game + match games)? This cannot be undone.'))return; answeredQs=new Set(); try{ localStorage.removeItem('nur256u3_progress'); }catch(e){} updateProg(); try{ localStorage.removeItem('nur256u3_exam'); }catch(e){} examState={};examIdx=0;examChecked={};examSubmitted=false;examMode='study';quizSet=[]; if(typeof setExamMode==='function'){ try{ setExamMode('study'); localStorage.removeItem('nur256u3_exam'); }catch(e){} } try{ wrongVault=[]; localStorage.removeItem('nur256u3_vault'); const b=document.getElementById('vaultCount'); if(b)b.textContent='0'; if(typeof renderVaultSection==='function') renderVaultSection(); }catch(e){} try{ flashMastered=new Set(); localStorage.removeItem('nur256u3_flashmastered'); if(typeof buildFlashQueue==='function'){ buildFlashQueue(); drawFlashCard(); } }catch(e){} try{ matchProgress={}; localStorage.removeItem('nur256u3_matchprogress'); localStorage.removeItem('nur256u3_matchbest_insulin'); localStorage.removeItem('nur256u3_matchbest_eye'); }catch(e){} alert('Progress reset. Fresh start! 💜'); }
function bumpProgress(id){ if(!answeredQs.has(id)){answeredQs.add(id);saveProgress();updateProg();} }
function updateProg(){
  const pct=totalTrackable?Math.round(answeredQs.size/totalTrackable*100):0;
  const pb=document.getElementById('progbar'); if(pb)pb.style.width=Math.min(100,pct)+'%';
  const msgs=["Let's go! 💪","Warming up! 🔥","Nice momentum! ⭐","Crushing it! 🚀","Almost there! 🎯","NCLEX-ready! 👑"];
  const m=msgs[Math.min(msgs.length-1,Math.floor(pct/20))];
  const pt=document.getElementById('progtext'); if(pt)pt.textContent=`${answeredQs.size} quiz questions answered • ${m}`;
}

  {id:'home',label:'🏠 Start'},
  {id:'howto',label:'\uD83D\uDD0E How to Answer'},
  {id:'cram',label:'\uD83C\uDFAF Final Cram'},

const nav=document.getElementById('nav'), content=document.getElementById('content');
SECTIONS.forEach((s,i)=>{
  const btn=document.createElement('button'); btn.id='nav-'+s.id;
  if(s.id==='vault'){ btn.innerHTML=s.label+' <span id="vaultCount" style="background:var(--red);color:#fff;border-radius:20px;padding:1px 8px;font-size:.72rem;margin-left:2px">0</span>'; }

/* ===== WRONG ANSWER VAULT ===== */
let wrongVault=[];
(function restoreVault(){ try{ const r=localStorage.getItem('nur256u3_vault'); if(r) wrongVault=JSON.parse(r); }catch(e){} })();
(function initVaultBadge(){ const b=document.getElementById('vaultCount'); if(b) b.textContent=wrongVault.length; })();
function saveVault(){ try{ localStorage.setItem('nur256u3_vault', JSON.stringify(wrongVault)); }catch(e){} }
function addToVault(entry){
  const idx=wrongVault.findIndex(v=>v.id===entry.id);
  if(idx>=0) wrongVault[idx]=entry; else wrongVault.push(entry);
  saveVault();
  const badge=document.getElementById('vaultCount'); if(badge) badge.textContent=wrongVault.length;
}
function removeFromVault(id){
  wrongVault=wrongVault.filter(v=>v.id!==id);
  saveVault();
  const badge=document.getElementById('vaultCount'); if(badge) badge.textContent=wrongVault.length;
}

function stripLabel(text){ return text.replace(/^[A-Za-z]\.\s*/,''); }
function relabel(optsArr){
  const L=['A','B','C','D','E','F'];
  return optsArr.map((o,i)=>L[i]+'. '+stripLabel(o));
}
function prepareQuestion(qOrig){
  let opts=qOrig.opts.slice();
  let correct=qOrig.type==='multi'?qOrig.correct.slice():qOrig.correct;
  if(shuffleAnswers){
    const order=shuffle(opts.map((_,i)=>i));
    const newOpts=order.map(i=>opts[i]);
    if(qOrig.type==='multi'){
      const correctSet=new Set(correct);
      correct=order.map((origIdx,newIdx)=>correctSet.has(origIdx)?newIdx:null).filter(x=>x!==null);
    } else {
      correct=order.indexOf(correct);
    }
    opts=newOpts;
  }
  return {...qOrig, opts:relabel(opts), correct};
}
let quizTotalCounted=new Set();
const DIRECT_QUIZ_CAP = 18;
const DIRECT_FULL = {};
function directSample(pool, cap){
  if(pool.length <= cap) return pool.map((q,i)=>i);
  const idx = pool.map((q,i)=>i);
  const hot  = shuffle(idx.filter(i=>pool[i] && pool[i].hot));
  const rest = shuffle(idx.filter(i=>!(pool[i] && pool[i].hot)));
  const hotWant = Math.min(hot.length, Math.max(1, Math.round(cap*0.6)));
  let out = hot.slice(0, hotWant).concat(rest.slice(0, cap - hotWant));
  if(out.length < cap){
    const used = new Set(out);
    out = out.concat(hot.concat(rest).filter(i=>!used.has(i)).slice(0, cap-out.length));
  }
  return shuffle(out);
}
function refreshDirectQuiz(id){
  const p = DIRECT_FULL[id];
  if(!p) return;
  const note=document.getElementById(id+'-poolnote');
  if(note) note.remove();
  renderQuiz(id, p.questions, p.title, p.source, p.indexMap);
  const host=document.getElementById(id);
  if(host) host.scrollIntoView({behavior:'smooth', block:'start'});
  if(typeof toast==='function') toast('Fresh set of '+Math.min(DIRECT_QUIZ_CAP, p.questions.length));
}
function renderQuiz(containerId, questions, title, source, indexMap){
  if(!DIRECT_FULL[containerId]){
    DIRECT_FULL[containerId] = {questions: questions, title: title, source: source, indexMap: indexMap};
  }
  const full = DIRECT_FULL[containerId].questions;
  const fullMap = DIRECT_FULL[containerId].indexMap;
  const old = document.getElementById(containerId+'-poolnote');
  if(old) old.remove();
  if(full.length > DIRECT_QUIZ_CAP){
    const pick = directSample(full, DIRECT_QUIZ_CAP);
    questions = pick.map(i=>full[i]);
    indexMap  = fullMap ? pick.map(i=>fullMap[i]) : pick;
    const host0=document.getElementById(containerId);
    if(host0 && host0.parentNode){
      const note=document.createElement('div');
      note.className='tipbar'; note.id=containerId+'-poolnote';
      note.innerHTML='\uD83D\uDCDD <b>'+questions.length+' questions</b>, freshly drawn from a pool of <b>'+full.length+'</b> on this topic. '
        + '<button class="mini" style="margin-left:6px" onclick="refreshDirectQuiz(\''+containerId+'\')">\uD83D\uDD04 New '+questions.length+'</button>'
        + '<br><span style="font-size:.85em">Each draw mixes high-yield items with ones you may not have seen yet.</span>';
      host0.parentNode.insertBefore(note, host0);
    }
  }
  const host=document.getElementById(containerId);
  if(!host)return;
  host.innerHTML='';
  const wrap=document.createElement('div');
  if(title){ const h=document.createElement('h3'); h.textContent='📝 '+title; h.style.color='var(--pink)'; wrap.appendChild(h); }
  questions.forEach((qOrig,localIdx)=>{
    const qi = indexMap ? indexMap[localIdx] : localIdx;
    const q=prepareQuestion(qOrig);
    const qid=containerId+'-'+qi;
    if(!quizTotalCounted.has(qid)){ quizTotalCounted.add(qid); totalTrackable++; }
    const card=document.createElement('div'); card.className='quiz-card';
    const qt=document.createElement('div'); qt.className='q-text'; qt.textContent=(qi+1)+'. '+q.q; card.appendChild(qt);
    const opts=document.createElement('div'); opts.className='opts'; card.appendChild(opts);
    const rat=document.createElement('div'); rat.className='rationale'; rat.innerHTML='<b>Rationale:</b> '+q.rat;
    if(q.type==='multi'){
      const chosen=new Set();
      q.opts.forEach((o,i)=>{
        const btn=document.createElement('button'); btn.className='opt'; btn.innerHTML=o;
        btn.onclick=()=>{ if(chosen.has(i)){chosen.delete(i);btn.classList.remove('sel-multi');}else{chosen.add(i);btn.classList.add('sel-multi');} };
        opts.appendChild(btn);
      });
      const sub=document.createElement('button'); sub.className='submit-multi'; sub.textContent='Check Answer';
      sub.onclick=()=>{
        const correct=new Set(q.correct);
        let allRight=chosen.size===correct.size;
        opts.querySelectorAll('.opt').forEach((b,i)=>{
          b.classList.add('disabled');
          if(correct.has(i))b.classList.add('correct');
          else if(chosen.has(i)){b.classList.add('wrong');allRight=false;}
        });
        if(!allRight){ addToVault({id:qid,q:q.q,opts:q.opts,type:'multi',correct:q.correct,rat:q.rat,source:source||title||''}); }
        rat.classList.add('show'); sub.style.display='none'; bumpProgress(qid);
      };
      card.appendChild(sub);
    } else {
      q.opts.forEach((o,i)=>{
        const btn=document.createElement('button'); btn.className='opt'; btn.innerHTML=o;
        btn.onclick=()=>{
          opts.querySelectorAll('.opt').forEach(b=>b.classList.add('disabled'));
          if(i===q.correct)btn.classList.add('correct');
          else{
            btn.classList.add('wrong'); opts.querySelectorAll('.opt')[q.correct].classList.add('correct');
            addToVault({id:qid,q:q.q,opts:q.opts,type:'single',correct:q.correct,rat:q.rat,source:source||title||''});
          }
          rat.classList.add('show'); bumpProgress(qid);
        };
        opts.appendChild(btn);
      });
    }
    card.appendChild(rat);
    wrap.appendChild(card);
  });
  host.appendChild(wrap);
}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);}

/* ===== VISION-ONLY FILTER ENGINE ===== */
let hotOnlyGlobal=false;
let quizFilterState={};
(function restoreVisionOnly(){ try{ if(localStorage.getItem('nur256u3_hotonly')==='1') hotOnlyGlobal=true; }catch(e){} })();
const SECTION_QUIZ_CAP = 18;
const SEC_FULL = {};
function secSampleCap(pool, cap){
  if(pool.length <= cap) return pool.slice();
  const hot  = shuffle(pool.filter(q=>q.hot));
  const rest = shuffle(pool.filter(q=>!q.hot));
  const hotWant = Math.min(hot.length, Math.max(1, Math.round(cap*0.6)));
  let out = hot.slice(0, hotWant).concat(rest.slice(0, cap - hotWant));
  if(out.length < cap){
    const used = new Set(out);
    out = out.concat(hot.concat(rest).filter(q=>!used.has(q)).slice(0, cap-out.length));
  }
  return shuffle(out);
}
function refreshSecQuiz(id){
  const p = SEC_FULL[id];
  if(!p) return;
  const note = document.getElementById(id+'-poolnote');
  if(note) note.remove();
  renderFilteredQuiz(id, p.pool, p.title, p.source);
  const host = document.getElementById(id);
  if(host) host.scrollIntoView({behavior:'smooth', block:'start'});
  if(typeof toast==='function') toast('Fresh set of '+Math.min(SECTION_QUIZ_CAP, p.pool.length));
}
function renderFilteredQuiz(containerId, allQuestions, title, source){
  SEC_FULL[containerId] = {pool: allQuestions, title: title, source: source};
  const total = allQuestions.length;
  const shown = secSampleCap(allQuestions, SECTION_QUIZ_CAP);
  const host0 = document.getElementById(containerId);
  const old = document.getElementById(containerId+'-poolnote');
  if(old) old.remove();
  if(host0 && total > shown.length){
    const note=document.createElement('div');
    note.className='tipbar'; note.id=containerId+'-poolnote';
    note.innerHTML='\uD83D\uDCDD <b>'+shown.length+' questions</b>, freshly drawn from a pool of <b>'+total+'</b> on this topic. '
      + '<button class="mini" style="margin-left:6px" onclick="refreshSecQuiz(\''+containerId+'\')">\uD83D\uDD04 New '+shown.length+'</button>'
      + '<br><span style="font-size:.85em">Each draw mixes high-yield items with ones you may not have seen yet.</span>';
    host0.parentNode.insertBefore(note, host0);
  }
  allQuestions = shown;
  quizFilterState[containerId]={allQuestions,title,source};
  applyQuizFilter(containerId);
}
function applyQuizFilter(containerId){
  const state=quizFilterState[containerId];
  if(!state)return;
  const filtered=[], indices=[];
  state.allQuestions.forEach((q,i)=>{
    if(!hotOnlyGlobal || q.hot){ filtered.push(q); indices.push(i); }
  });
  if(filtered.length===0){
    const host=document.getElementById(containerId);
    if(host) host.innerHTML='<div class="card" style="text-align:center;color:var(--muted)">No high-yield questions in this set yet.</div>';
    return;
  }
  renderQuiz(containerId, filtered, state.title, state.source, indices);
}
function toggleHotOnly(){
  hotOnlyGlobal=!hotOnlyGlobal;
  try{ localStorage.setItem('nur256u3_hotonly', hotOnlyGlobal?'1':'0'); }catch(e){}
  Object.keys(quizFilterState).forEach(applyQuizFilter);
  updateVisionToggleButtons();
  if(typeof examMode!=='undefined' && typeof buildQuizSet==='function'){ buildQuizSet(examMode); examIdx=0; saveExam(); drawExamQ(); }
  if(typeof startDrill==='function' && document.getElementById('drillBody')) startDrill();
}
function updateVisionToggleButtons(){
  document.querySelectorAll('.vision-toggle-btn').forEach(b=>{ b.textContent = hotOnlyGlobal ? '🔥 High-Yield Only: ON' : '🔥 High-Yield Only: OFF'; });
}
</script>

<script>
document.getElementById('sec-howto').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🔎</span> How to Answer His Questions</h2>
<p class="intro-line">Not content. Method. Read this before the exam — it is what carried Units 1 and 2.</p>

<div class="tipbar">🧠 <b>Most wrong answers are reading errors, not knowledge errors.</b> You knew it. You answered a different question than the one on the screen.</div>

<div class="card" style="border-color:var(--purple)">
  <h3>The 5-step read</h3>
  <ol class="chainlist">
    <li><b>1. Find the actual question.</b> Cover the options. Read the last sentence first — that is what is being asked. Everything above it is setup.</li>
    <li><b>2. Answer it in your head</b> before looking at the options. If you already have an answer, the distractors cannot pull you.</li>
    <li><b>3. Circle the qualifier.</b> <b>First · Best · Priority · Most · Initial · Except · NOT</b>. These flip the whole question.</li>
    <li><b>4. Eliminate on principle.</b> Cross off anything unsafe, out of nursing scope, or factually wrong — no matter how good it sounds.</li>
    <li><b>5. Between the last two, ask what makes them different.</b> There is exactly one difference. That difference is the question.</li>
  </ol>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ The question inside the question — Unit 3 edition</h3>
  <table class="lab">
    <tr><th>What it looks like</th><th>What he is actually asking</th></tr>
    <tr><td>A glucose value plus symptoms</td><td><b>Hyper or hypo?</b> And then: <b>conscious or not?</b> That decides the whole intervention</td></tr>
    <tr><td>"When is this patient most likely to become hypoglycemic?"</td><td><b>What is this insulin's PEAK?</b> Add it to the administration time</td></tr>
    <tr><td>Two insulins in one syringe</td><td><b>What is the ORDER?</b> Air cloudy, air clear, draw clear, draw cloudy</td></tr>
    <tr><td>DKA vs HHS lab set</td><td><b>Is there acidosis?</b> Acidosis and ketones = DKA. No acidosis = HHS</td></tr>
    <tr><td>"Which order should the nurse question?"</td><td><b>Which drug fights THIS patient's problem?</b> Oral agent in a Type 1, metformin before contrast, a beta blocker masking hypoglycemia</td></tr>
    <tr><td>A described lesion</td><td><b>Name the lesion first</b> — flat, raised, fluid, pus — then the diagnosis follows</td></tr>
    <tr><td>A wound described by depth</td><td><b>What stage?</b> Intact skin, partial thickness, full thickness, or bone visible</td></tr>
    <tr><td>Eye drops, two kinds</td><td><b>How long between them?</b> And which one gets punctal occlusion</td></tr>
    <tr><td>"Which statement indicates understanding?"</td><td><b>Which one is the correct teaching?</b> Three are wrong</td></tr>
    <tr><td>"Which requires further teaching?"</td><td><b>Which one is WRONG?</b> Three are right</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>Wording that changes the answer</h3>
  <table class="lab">
    <tr><th>Word</th><th>What it demands</th></tr>
    <tr><td><b>FIRST / INITIAL</b></td><td>Something you can do <b>immediately and independently</b></td></tr>
    <tr><td><b>BEST</b></td><td>The most complete option, even if others are partly right</td></tr>
    <tr><td><b>PRIORITY</b></td><td>What kills soonest. <b>Airway, breathing, circulation</b> — then safety</td></tr>
    <tr><td><b>EXCEPT / NOT</b></td><td>Hunt the <b>ONE WRONG</b> answer. Three are correct</td></tr>
    <tr><td><b>FURTHER TEACHING</b></td><td>Find the <b>wrong</b> statement</td></tr>
    <tr><td><b>INDICATES UNDERSTANDING</b></td><td>Find the <b>right</b> statement</td></tr>
    <tr><td><b>EARLIEST SIGN</b></td><td>The subtle one. Microalbuminuria before creatinine. Nonblanchable redness before an open wound</td></tr>
    <tr><td><b>EXPECTED</b></td><td>He wants you to <b>leave it alone</b>. Weight gain on insulin, a cloudy NPH vial, orange urine on rifampin</td></tr>
    <tr><td><b>SELECT ALL THAT APPLY</b></td><td>Judge each option <b>independently</b> true or false. No partial credit, no guessing a count</td></tr>
  </table>
  <div class="trap"><span class="tag">The one that gets everyone</span><b>Missing a NOT or EXCEPT.</b> You reason perfectly and score zero. Mark the qualifier before reading a single option.</div>
</div>

<div class="card">
  <h3>Ranking when everything looks wrong</h3>
  <ol class="chainlist">
    <li><b>1. Airway</b> — an unconscious hypoglycemic patient, anything given by mouth to someone who cannot swallow</li>
    <li><b>2. Breathing</b> — Kussmaul respirations, a patient tiring out</li>
    <li><b>3. Circulation</b> — potassium out of range in DKA, dehydration with hypotension</li>
    <li><b>4. Neuro change</b> — new confusion, decreasing LOC, sudden vision loss</li>
    <li><b>5. Safety</b> — falls, a burn risk in a neuropathic foot, wrong insulin</li>
    <li><b>6. Comfort and teaching</b> — real, rarely the "first" answer in an unstable patient</li>
  </ol>
  <div class="hy"><span class="tag">Tiebreaker</span><b>Acute beats chronic. Unexpected beats expected. Unstable beats stable.</b> A new unexplained finding outranks a severe one that is known and being treated.</div>
</div>

<div class="card">
  <h3>Assess or act?</h3>
  <table class="lab">
    <tr><th>Situation</th><th>Do this</th></tr>
    <tr><td>Stable patient, incomplete data</td><td><b>ASSESS.</b> Check the glucose, inspect the wound, look at the eye</td></tr>
    <tr><td>Unstable or in danger</td><td><b>ACT.</b> Give the glucose, hold the drug, position the patient</td></tr>
    <tr><td>The stem already gave you the assessment</td><td><b>ACT.</b> Rechecking what you were just told is stalling</td></tr>
    <tr><td>A drug order is unsafe for this patient</td><td><b>Hold it and clarify</b>, do not give it and monitor</td></tr>
  </table>
  <div class="trap"><span class="tag">The stalling answers</span><b>"Notify the provider," "document," "continue to monitor," "recheck in an hour."</b> Sometimes right, usually the safe-sounding option that does nothing. Ask: <i>is there something I can do right now that helps?</i></div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🧠 Exam-day plan</h3>
  <ul class="clean">
    <li><b>Night before:</b> <b>🪝 Memory Hooks</b> and <b>🎯 Trick Questions</b>. One 25-question set. No new content.</li>
    <li><b>Before you start:</b> two slow breaths. You are decoding questions, not recalling everything you know.</li>

    <li><b>Reset ritual:</b> if focus scatters — pen down, one exhale, read the next stem's last sentence first.</li>
    <li><b>You have done this twice now.</b> Same method, different content.</li>
  </ul>
</div>

document.getElementById('sec-asepsis').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🧼</span> Asepsis &amp; Sterile Technique</h2>
<p class="intro-line">Medical vs surgical asepsis, handling soiled linen, the sterile field rules, gowning and PPE, and the procedures that require sterile technique.</p>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Medical vs Surgical Asepsis — the core split</h3>
  <table class="lab">
    <tr><th></th><th>MEDICAL ASEPSIS (clean technique)</th><th>SURGICAL ASEPSIS (sterile technique)</th></tr>
    <tr><td><b>Goal</b></td><td><b>REDUCE the number</b> of organisms</td><td><b>ELIMINATE ALL</b> organisms and their spores</td></tr>
    <tr><td><b>Gloves</b></td><td><b>Clean</b> gloves</td><td><b>Sterile</b> gloves</td></tr>
    <tr><td><b>Used for</b></td><td>Hand hygiene · bathing · bed making · <b>incontinence care</b> · handling linens · oral care · most med administration · vital signs</td><td><b>Foley catheter insertion</b> · <b>IV insertion</b> · <b>central line insertion and dressing changes</b> · surgery · <b>sterile dressing changes</b> · injections · tracheostomy care · anything entering a <b>sterile body cavity</b></td></tr>
    <tr><td><b>Core principle</b></td><td><b>Clean to dirty, never dirty to clean</b></td><td><b>Only sterile touches sterile.</b> If in doubt, it is contaminated</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The one-line test</div><div class="big">Does it break the skin or enter a sterile cavity? → STERILE.</div><div class="exp">Bladder, bloodstream, and any break in the skin are <b>sterile territory</b>. That is why Foleys, IVs, and central lines are sterile procedures while bathing and bed changes are not.</div></div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🧼 Medical asepsis in practice</h3>
  <h4 style="margin:12px 0 4px">Cleaning up a large incontinence episode</h4>
  <ol class="chainlist">
    <li><b>1. Gather EVERYTHING first</b> — wipes, barrier cream, clean linens, a clean gown, and the <b>linen bag or hamper brought right to the bedside</b>. You cannot leave a patient mid-task to fetch supplies.</li>
    <li><b>2. Hand hygiene, then clean gloves.</b> Gown if soiling is likely.</li>
    <li><b>3. Provide privacy</b> and explain what you are doing.</li>
    <li><b>4. ⭐ Clean from CLEANEST to DIRTIEST</b> — front to back in a female patient, and from the center of the perineum outward. <b>Never wipe back to front</b>, which drags rectal flora toward the urethra and causes UTIs.</li>
    <li><b>5. Use a clean section of the cloth or a new wipe with every stroke.</b> Never re-dip a used cloth into clean water.</li>
    <li><b>6. ⭐ Roll soiled linen INWARD</b> so the dirty surface is contained, and place it <b>directly into the bag</b>.</li>
    <li><b>7. Change gloves and perform hand hygiene</b> between the dirty portion and applying clean linens or barrier cream.</li>
    <li><b>8. Dry thoroughly</b>, apply a moisture barrier, and reposition. <b>Assess the skin while you are there</b> — this is your chance to catch a Stage 1 injury.</li>
  </ol>
  <h4 style="margin:14px 0 4px">⭐ Handling soiled linen — his examples</h4>
  <ul class="clean">
    <li><b>NEVER place soiled linen on the floor.</b> The floor is considered grossly contaminated, and anything touching it is contaminated.</li>
    <li><b>NEVER place soiled linen on another patient's bed, an over-bed table, or any clean surface.</b></li>
    <li><b>Bring the linen bag or hamper into the room before you start</b> so it is <b>right next to you</b> at the point of use. Bagging at the bedside prevents carrying contamination down the hall.</li>
    <li><b>Hold soiled linen AWAY from your uniform.</b> Your scrubs become a vehicle the moment they touch it.</li>
    <li><b>⭐ NEVER shake or fan linens</b> — clean or dirty. Shaking <b>aerosolizes organisms and skin cells</b> into the air and onto every surface in the room.</li>
    <li><b>Do not overfill the bag</b>, and close it before transport. Double-bag only if the outside is soiled or the bag is leaking.</li>
    <li>Carry clean linen <b>away from the body too</b>, and only bring into the room what you will actually use — <b>anything taken into a room cannot go back to the clean supply</b>.</li>
  </ul>
  <div class="trap"><span class="tag">⭐ The three that show up as wrong answers</span><b>Linen on the floor</b> · <b>shaking out the sheet</b> · <b>holding linen against the uniform</b>. All three are medical asepsis violations, and any option containing one is wrong regardless of how reasonable the rest sounds.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Sterile field — the rules he can test</h3>
  <table class="lab">
    <tr><th>Rule</th><th>Detail</th></tr>
    <tr><td><b>The 1-inch border</b></td><td>The outer <b>1 inch (2.5 cm)</b> of a sterile field is <b>considered contaminated</b>. Nothing sterile is placed there</td></tr>
    <tr><td><b>Below the waist</b></td><td><b>Anything below waist level is contaminated.</b> Keep sterile items <b>above the waist and in front of you</b></td></tr>
    <tr><td><b>Out of sight</b></td><td><b>Never turn your back on a sterile field</b> and never leave it unattended. If you cannot see it, it is contaminated</td></tr>
    <tr><td><b>Never reach across</b></td><td>Reaching over a sterile field contaminates it. Move <b>around</b> the field instead</td></tr>
    <tr><td><b>Moisture wicks</b></td><td><b>A wet field is a contaminated field.</b> Moisture draws organisms up through the drape from the surface below — called <b>strikethrough</b></td></tr>
    <tr><td><b>Only sterile touches sterile</b></td><td>The moment anything unsterile contacts it, the field is done</td></tr>
    <tr><td><b>Air currents</b></td><td><b>No talking, coughing, sneezing, or reaching over</b> the field. Keep movement to a minimum. Close the door</td></tr>
    <tr><td><b>When in doubt</b></td><td><b>Consider it CONTAMINATED and start over.</b> There is no "probably fine"</td></tr>
  </table>
  <h4 style="margin:12px 0 4px">Opening a sterile package</h4>
  <ol class="chainlist">
    <li><b>1.</b> Open the <b>outermost flap AWAY from you</b> first.</li>
    <li><b>2.</b> Open the <b>side flaps</b> next, one at a time.</li>
    <li><b>3.</b> Open the <b>last flap TOWARD you</b>.</li>
    <li>Touch only the <b>outside</b> of the wrapper, and do not let your arm pass over the exposed contents.</li>
  </ol>
  <div class="hy"><span class="tag">Pouring sterile liquid</span><b>The lip of the bottle is contaminated once opened</b> — pour off a small amount into a waste container first. Then pour from <b>6 inches above</b> the receptacle without touching it, and avoid splashing, which causes <b>strikethrough</b>.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>🧤 Gowning and PPE — the order</h3>
  <div class="mnem"><div class="tag">⭐ DONNING (putting on)</div><div class="big">GOWN → MASK → GOGGLES → GLOVES</div><div class="exp">Gloves go on <b>last</b> and pull <b>over the gown cuffs</b>, so no skin is exposed at the wrist.</div></div>
  <div class="mnem"><div class="tag">⭐ DOFFING (taking off)</div><div class="big">GLOVES → GOGGLES → GOWN → MASK</div><div class="exp"><b>Gloves come off first because they are the dirtiest.</b> The <b>mask comes off LAST and OUTSIDE the room</b>, since the air in the room is the hazard. Hand hygiene after every step and again at the end.</div></div>
  <table class="lab">
    <tr><th>Item</th><th>Key points</th></tr>
    <tr><td><b>Isolation gown</b></td><td>Covers the torso <b>from neck to knees</b> and arms <b>to the wrist</b>, wraps around the back, and <b>ties at the neck and waist</b>. The <b>front and sleeves are considered contaminated</b> after use. Remove by <b>peeling away from the neck and shoulders, turning it INSIDE OUT</b>, rolling it into a bundle, and discarding</td></tr>
    <tr><td><b>Gloves</b></td><td>Pull <b>over the gown cuff</b>. Remove <b>glove-to-glove, then skin-to-skin</b> — grasp the outside of one glove with the other gloved hand, peel it off, then slide a bare finger under the remaining cuff and peel it off over the first</td></tr>
    <tr><td><b>Mask / N95</b></td><td>Secure ties or elastic, mold the nosepiece, cover the nose and mouth <b>and</b> the chin. N95 must be <b>fit-tested</b>. Remove by the <b>ties or elastic only — never touch the front</b></td></tr>
    <tr><td><b>Goggles / face shield</b></td><td>Remove by the <b>headband or earpieces</b>; the front is contaminated</td></tr>
  </table>
  <div class="hy"><span class="tag">Sterile gown in the OR</span>Only the <b>front from chest to the level of the sterile field</b>, and the <b>sleeves from 2 inches above the elbow to the cuff</b>, are considered sterile. <b>The back is never sterile</b>, which is why sterile personnel never turn their backs to the field and pass each other <b>front to front or back to back</b>.</div>
</div>

<div class="card">
  <h3>🩺 The sterile procedures he named</h3>
  <table class="lab">
    <tr><th>Procedure</th><th>Key sterile points</th></tr>
    <tr><td><b>Foley catheter insertion</b></td><td><b>Sterile procedure.</b> Two sets of gloves are in the kit. <b>Your NON-dominant hand holds the labia or penis and becomes CONTAMINATED — it never leaves that position.</b> The <b>dominant hand stays sterile</b> and does the work. Clean <b>front to back</b>, one swab per stroke. <b>Inflate the balloon only after urine returns</b>, and in a male <b>advance to the bifurcation</b> first. Secure the tubing, keep the <b>bag below bladder level</b> and off the floor, and <b>maintain a closed system</b></td></tr>
    <tr><td><b>Peripheral IV insertion</b></td><td><b>Sterile</b> to the insertion site. Clean with <b>chlorhexidine in a back-and-forth scrub and let it DRY completely</b> — drying is what kills. <b>Do not re-palpate the site after prepping</b> unless you re-prep. Transparent dressing, date it</td></tr>
    <tr><td><b>Central line insertion</b></td><td><b>MAXIMAL sterile barrier precautions</b> — cap, mask, sterile gown, sterile gloves, and a <b>full-body sterile drape</b>. Chlorhexidine prep. <b>Everyone in the room wears a mask.</b> A checklist is used and <b>anyone may stop the procedure for a break in sterility</b>. Confirm tip placement by <b>x-ray before use</b></td></tr>
    <tr><td><b>Central line dressing change</b></td><td><b>Sterile</b>, using a kit. Mask on the nurse <b>and</b> the patient (or have the patient turn their head away). Chlorhexidine, allow to dry, transparent dressing, <b>date and initial</b>. Change per protocol or whenever it is <b>damp, loose, or soiled</b></td></tr>
    <tr><td><b>Sterile dressing change</b></td><td>Remove the old dressing with <b>clean</b> gloves, discard, <b>hand hygiene</b>, then don <b>sterile</b> gloves for the new one. Clean <b>from the incision outward</b> — center to periphery, never back over a cleaned area</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The Foley rule that gets missed</div><div class="big">Once your non-dominant hand is in place, it does NOT move</div><div class="exp">It is contaminated the moment it touches the patient. If it lets go to grab something, you have to <b>re-prep and start over</b>. Everything else is done one-handed with the sterile dominant hand.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on asepsis</h3>
  <div class="trap"><span class="tag">Trap 1 — soiled linen on the floor</span>The floor is <b>grossly contaminated</b>. Any option that sets linen, equipment, or supplies on it is wrong. <b>Bring the hamper to the bedside instead.</b></div>
  <div class="trap"><span class="tag">Trap 2 — shaking the linens</span><b>Never shake or fan linen</b>, clean or dirty. It aerosolizes organisms across the entire room.</div>
  <div class="trap"><span class="tag">Trap 3 — wiping back to front</span>Perineal care is <b>front to back, clean to dirty</b>, with a fresh surface every stroke. Back to front causes UTIs.</div>
  <div class="trap"><span class="tag">Trap 4 — the wrong technique for the procedure</span>Clean gloves for a <b>Foley insertion</b> or an <b>IV start</b> is wrong. Those enter <b>sterile territory</b>. Conversely, sterile gloves for routine bathing is a waste, not an error of safety</div>
  <div class="trap"><span class="tag">Trap 5 — the 1-inch border</span>Placing a sterile item on the <b>outer inch</b> of the field contaminates it. That border is not usable space.</div>
  <div class="trap"><span class="tag">Trap 6 — turning away from the field</span><b>Out of sight is contaminated.</b> Options where the nurse steps away, turns around, or leaves the field unattended are wrong.</div>
  <div class="trap"><span class="tag">Trap 7 — the doffing order</span><b>Gloves come off FIRST, mask comes off LAST and outside the room.</b> Any sequence removing the mask inside the room is wrong.</div>
  <div class="trap"><span class="tag">Trap 8 — reaching across the field</span>Move <b>around</b> the field. Reaching over it contaminates everything beneath your arm.</div>
  <div class="trap"><span class="tag">Trap 9 — the wet field called usable</span><b>Moisture wicks organisms up through the drape.</b> A damp field is contaminated even if nothing visibly touched it.</div>
  <div class="trap"><span class="tag">Trap 10 — moving the non-dominant hand during a Foley</span>It is contaminated and it <b>stays put</b>. Letting go means re-prepping and starting over.</div>
</div>

<h2 class="sec-title"><span class="sec-emoji">💊</span> Drug Match</h2>
<p class="intro-line">Every Unit 3 medication tied to its class, its mechanism, and the disease process it treats — insulin is in its own tab.</p>

<div class="tipbar">🧠 <b>Learn the class and the mechanism, not the list.</b> If you know what the drug does to the body, you can answer a question about a drug you have never seen.</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Suffix decoder — diabetes</h3>
  <table class="lab">
    <tr><th>Ending</th><th>Class</th><th>Example</th><th>Hypoglycemia risk alone?</th></tr>
    <tr><td><b>-formin</b></td><td>Biguanide</td><td>met<b>formin</b></td><td><b>NO</b></td></tr>
    <tr><td><b>-ide</b></td><td>Sulfonylurea</td><td>glipiz<b>ide</b>, glybur<b>ide</b>, glimepir<b>ide</b></td><td><b>YES — the big one</b></td></tr>
    <tr><td><b>-glinide</b></td><td>Meglitinide</td><td>repa<b>glinide</b>, nate<b>glinide</b></td><td><b>YES</b></td></tr>
    <tr><td><b>-glitazone</b></td><td>Thiazolidinedione (TZD)</td><td>pio<b>glitazone</b></td><td>NO</td></tr>
    <tr><td><b>-gliptin</b></td><td>DPP-4 inhibitor</td><td>sita<b>gliptin</b></td><td>NO</td></tr>
    <tr><td><b>-flozin</b></td><td>SGLT2 inhibitor</td><td>canagli<b>flozin</b>, empagli<b>flozin</b></td><td>NO</td></tr>
    <tr><td><b>-tide</b></td><td>GLP-1 agonist (injectable, <b>not insulin</b>)</td><td>lirag<b>lutide</b>, semag<b>lutide</b>, exena<b>tide</b></td><td>NO</td></tr>
    <tr><td><b>-ose</b></td><td>Alpha-glucosidase inhibitor</td><td>acarb<b>ose</b>, migli<b>tol</b></td><td>NO</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Which ones can bottom out the sugar</div><div class="big">Only the ones that MAKE the pancreas release insulin</div><div class="exp"><b>Sulfonylureas and meglitinides</b> squeeze insulin out of the pancreas whether or not the patient ate, so <b>they cause hypoglycemia</b>. Everything else works a different way and does not — unless combined with insulin.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ METFORMIN — know this one cold</h3>
  <table class="lab">
    <tr><td><b>Class</b></td><td>Biguanide. <b>FIRST-LINE drug for Type 2 diabetes</b></td></tr>
    <tr><td><b>How it works</b></td><td><b>Decreases glucose production by the liver</b> · decreases intestinal absorption · <b>increases insulin sensitivity</b> in the tissues. <b>It does NOT make the pancreas release insulin</b></td></tr>
    <tr><td><b>⭐ Hypoglycemia</b></td><td><b>Does NOT cause hypoglycemia when used alone</b> — because it never forces insulin release. That is the single biggest distinction from sulfonylureas</td></tr>
    <tr><td><b>⭐ Black box warning</b></td><td><b>LACTIC ACIDOSIS.</b> Rare but potentially fatal. Signs: <b>muscle pain, weakness, unusual fatigue, trouble breathing, abdominal pain, feeling cold, dizziness, slow or irregular heartbeat</b>. Report immediately</td></tr>
    <tr><td><b>⭐ IV CONTRAST</b></td><td><b>HOLD metformin 48 hours BEFORE and AFTER any procedure using iodinated contrast.</b> Contrast can injure the kidneys; if metformin cannot be cleared it accumulates and causes <b>lactic acidosis</b>. <b>Confirm renal function before restarting</b></td></tr>
    <tr><td><b>Contraindications</b></td><td><b>Renal impairment</b> (the main one) · liver disease · <b>heart failure with hypoperfusion</b> · <b>excessive alcohol use</b> · acute illness with dehydration or hypoxia — all raise lactic acidosis risk</td></tr>
    <tr><td><b>Side effects</b></td><td><b>GI is most common</b> — diarrhea, nausea, cramping, <b>metallic taste</b>. <b>Take WITH food</b> to reduce it, and it usually improves over weeks</td></tr>
    <tr><td><b>Long-term</b></td><td><b>Vitamin B12 deficiency</b> — monitor levels; watch for neuropathy that could be mistaken for diabetic neuropathy</td></tr>
    <tr><td><b>Weight</b></td><td><b>Weight neutral or causes modest weight LOSS</b> — unlike insulin and sulfonylureas, which cause weight gain</td></tr>
  </table>
  <div class="trap"><span class="tag">⭐ The three metformin questions he can write</span>
  <b>1.</b> A patient scheduled for a <b>CT with contrast</b> or a <b>cardiac cath</b> — <b>hold the metformin 48 hours before and after</b>.<br>
  <b>2.</b> A patient reporting <b>muscle pain, weakness, and unusual fatigue</b> — that is <b>lactic acidosis</b>, not just a virus.<br>
  <b>3.</b> A patient worried about <b>hypoglycemia</b> on metformin — reassure that <b>it does not cause it alone</b>, because it does not force insulin release.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>💊 The other oral agents</h3>
  <table class="lab">
    <tr><th>Class</th><th>How it works</th><th>Must know</th></tr>
    <tr><td><b>Sulfonylureas</b><br>glipizide, glyburide, glimepiride</td><td><b>Stimulate the pancreas to RELEASE insulin</b></td><td><b>⭐ CAUSES HYPOGLYCEMIA</b> — take with a meal, never skip meals. <b>Weight gain.</b> <b>Requires working beta cells, so useless in Type 1.</b> <b>Disulfiram-like reaction with alcohol</b> — flushing, nausea. Higher hypoglycemia risk in <b>older adults</b>, especially glyburide</td></tr>
    <tr><td><b>Meglitinides</b><br>repaglinide, nateglinide</td><td>Same idea, <b>faster and shorter</b></td><td><b>Take 15–30 min before each meal.</b> <b>⭐ SKIP THE DOSE IF SKIPPING THE MEAL</b> — otherwise hypoglycemia</td></tr>
    <tr><td><b>Thiazolidinediones (TZDs)</b><br>pioglitazone</td><td><b>Increase insulin sensitivity</b> in muscle and fat</td><td><b>⭐ FLUID RETENTION → contraindicated in heart failure.</b> Watch for <b>edema, sudden weight gain, dyspnea</b>. Also <b>hepatotoxic</b> (monitor LFTs) and raises <b>fracture</b> risk. Takes weeks for full effect</td></tr>
    <tr><td><b>DPP-4 inhibitors</b><br>sitagliptin</td><td>Prolong incretin hormones → more insulin, less glucagon <b>after meals</b></td><td><b>Weight neutral</b>, low hypoglycemia risk. Watch for <b>pancreatitis</b> — severe persistent abdominal pain radiating to the back. Well tolerated</td></tr>
    <tr><td><b>SGLT2 inhibitors</b><br>canagliflozin, empagliflozin</td><td><b>Block glucose reabsorption in the kidney</b> so glucose is peed out</td><td><b>⭐ GENITAL YEAST INFECTIONS and UTIs</b> — sugar in the urine feeds organisms. Teach <b>perineal hygiene and fluids</b>. Also <b>dehydration, hypotension, dizziness</b>, and rare <b>euglycemic DKA</b> (ketoacidosis with a near-normal glucose). Causes weight loss and has cardiac and renal benefit</td></tr>
    <tr><td><b>Alpha-glucosidase inhibitors</b><br>acarbose, miglitol</td><td><b>Slow carbohydrate breakdown in the gut</b></td><td><b>⭐ If hypoglycemia occurs, treat with GLUCOSE (dextrose) tablets — NOT table sugar, juice, or candy.</b> The drug blocks the breakdown of sucrose, so ordinary sugar will not raise the glucose. Take with the <b>first bite</b> of each meal. Expect <b>flatulence, bloating, diarrhea</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The acarbose trap is a gift if you know it</div><div class="big">Acarbose + hypoglycemia = GLUCOSE TABLETS ONLY</div><div class="exp">Juice, soda, honey, and candy are <b>sucrose</b>, and acarbose blocks the enzyme that breaks sucrose into glucose. Only <b>dextrose/glucose</b> works. This is a favorite NCLEX item and an easy point.</div></div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>💉 Injectable non-insulin agents</h3>
  <table class="lab">
    <tr><th>Drug</th><th>What it does</th><th>Must know</th></tr>
    <tr><td><b>GLP-1 agonists</b><br>liraglutide, semaglutide, exenatide, dulaglutide</td><td><b>Slow gastric emptying</b>, increase insulin after meals, decrease glucagon, <b>increase satiety</b></td><td><b>Injectable but NOT insulin</b> — a common mix-up. Causes <b>WEIGHT LOSS</b>. <b>Nausea is the most common side effect</b> and usually improves. <b>Black box: thyroid C-cell tumors</b> — contraindicated with personal or family history of medullary thyroid cancer or MEN 2. Watch for <b>pancreatitis</b></td></tr>
    <tr><td><b>Pramlintide</b> (amylin analog)</td><td>Slows gastric emptying, suppresses glucagon, increases satiety</td><td>Given <b>with</b> mealtime insulin but in a <b>separate syringe</b>. <b>Insulin dose is reduced when starting it</b> to avoid severe hypoglycemia</td></tr>
    <tr><td><b>⭐ GLUCAGON</b></td><td><b>Raises blood glucose by mobilizing liver glycogen</b></td><td>For <b>severe hypoglycemia when the patient cannot take anything by mouth</b>. Given <b>subcut or IM</b>. <b>Repeat in 10 minutes if still unconscious.</b> <b>Place the patient on their side — it commonly causes vomiting.</b> <b>Will not work if the liver has no glycogen</b> (starvation, alcohol use, liver failure). Give carbohydrate once awake</td></tr>
  </table>
  <div class="trap"><span class="tag">Why glucagon can fail</span>It works by <b>releasing stored glycogen from the liver</b>. A malnourished patient, someone with liver disease, or a patient who has been drinking may have <b>no stores to release</b>. In those patients and in any acute care setting with IV access, <b>D50 is the answer</b>.</div>
</div>

<div class="card">
  <h3>👁️ Eye medications</h3>
  <table class="lab">
    <tr><th>Drug</th><th>Use</th><th>Must know</th></tr>
    <tr><td><b>Timolol</b> (beta blocker)</td><td>Glaucoma — <b>decreases aqueous production</b></td><td><b>⭐ Systemically absorbed</b> — can cause <b>bradycardia, hypotension, and BRONCHOSPASM</b>. Caution in <b>asthma, COPD, heart block</b>. <b>Use punctal occlusion</b> (press the inner corner 1–2 min) to limit systemic absorption</td></tr>
    <tr><td><b>Latanoprost</b> (prostaglandin)</td><td>Glaucoma — <b>increases outflow</b></td><td>Given <b>at night</b>. Expect <b>permanent brown iris darkening</b>, longer darker lashes, and possible eyelid darkening. Harmless but teach it so they do not stop the drug</td></tr>
    <tr><td><b>Pilocarpine</b> (miotic)</td><td>Glaucoma, especially acute angle-closure</td><td><b>Constricts the pupil</b> to open the drainage angle. Causes <b>blurred vision and poor night vision</b> — safety teaching</td></tr>
    <tr><td><b>Acetazolamide</b> (carbonic anhydrase inhibitor)</td><td>Lowers intraocular pressure</td><td>A <b>sulfa</b> drug — ask about sulfa allergy. Diuretic effect; monitor potassium</td></tr>
    <tr><td><b>Atropine / cyclopentolate</b> (mydriatic/cycloplegic)</td><td>Dilate for exam or after surgery</td><td><b>⭐ CONTRAINDICATED in angle-closure glaucoma</b> — dilating the pupil closes the drainage angle further. Causes photophobia; sunglasses</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Eye drop technique</div><div class="big">Pull down the lower lid · drop in the conjunctival sac · never touch the eye · punctal occlusion 1–2 min · WAIT 5 MINUTES between different drops</div><div class="exp">Without the wait, the second drop simply <b>washes the first one out</b>. If an ointment is also ordered, <b>drops first, ointment last</b>.</div></div>
</div>

<div class="card">
  <h3>🧴 Skin and ear medications</h3>
  <table class="lab">
    <tr><th>Drug</th><th>Use</th><th>Must know</th></tr>
    <tr><td><b>Topical corticosteroids</b></td><td>Psoriasis, eczema, contact dermatitis</td><td>Apply <b>thinly</b>. Long-term use causes <b>skin thinning, striae, and systemic absorption</b> — worse on the face, in skin folds, and under occlusive dressings. Use the <b>lowest potency that works</b></td></tr>

    <tr><td><b>Topical antifungals</b><br>clotrimazole, nystatin</td><td>Tinea, candidiasis</td><td><b>Keep the area DRY.</b> Continue for the <b>full course</b> even after it looks better, or it recurs</td></tr>
    <tr><td><b>Permethrin</b></td><td>Scabies, lice</td><td>Scabies: <b>neck to toe, leave on 8–14 hours</b>. <b>Treat all household contacts</b>. Itching persisting for weeks is expected</td></tr>

  </table>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on Unit 3 drugs</h3>
  <div class="trap"><span class="tag">Trap 1 — metformin before contrast</span><b>Hold 48 hours before and after.</b> Any option that continues metformin through a CT with contrast or a cardiac cath is wrong.</div>
  <div class="trap"><span class="tag">Trap 2 — assuming all diabetes drugs cause hypoglycemia</span><b>Only sulfonylureas and meglitinides do</b>, because only they force insulin release. Metformin alone does not.</div>
  <div class="trap"><span class="tag">Trap 3 — oral agents in Type 1</span>They need <b>functioning beta cells</b>. A Type 1 patient has none. <b>Insulin only.</b></div>
  <div class="trap"><span class="tag">Trap 4 — juice for acarbose hypoglycemia</span>Acarbose blocks sucrose breakdown, so <b>only glucose/dextrose tablets work</b>. Juice, candy, and honey will not.</div>
  <div class="trap"><span class="tag">Trap 5 — a TZD in heart failure</span><b>Pioglitazone causes fluid retention.</b> New edema, weight gain, or dyspnea on a TZD is the drug, not the diabetes.</div>
  <div class="trap"><span class="tag">Trap 6 — yeast infection on an SGLT2 called unrelated</span>Sugar in the urine <b>feeds organisms</b>. Genital yeast infections and UTIs are expected effects and a teaching point.</div>
  <div class="trap"><span class="tag">Trap 7 — calling a GLP-1 agonist insulin</span><b>It is injectable but NOT insulin.</b> It causes weight loss, and it carries a <b>thyroid tumor</b> black box.</div>
  <div class="trap"><span class="tag">Trap 8 — timolol in an asthmatic</span>Eye drops are <b>systemically absorbed</b>. A beta blocker drop can cause <b>bronchospasm and bradycardia</b>. Teach <b>punctal occlusion</b>.</div>
  <div class="trap"><span class="tag">Trap 9 — dilating drops in angle-closure glaucoma</span><b>Contraindicated.</b> Dilation closes the drainage angle further and can precipitate an attack.</div>
  <div class="trap"><span class="tag">Trap 10 — glucagon in a malnourished patient</span>It needs <b>liver glycogen</b> to work. With IV access available, <b>D50</b> is the answer.</div>
  <div class="trap"><span class="tag">Trap 11 — meglitinide taken without eating</span><b>Skip the dose if skipping the meal.</b> Taking it without food causes hypoglycemia.</div>
  <div class="trap"><span class="tag">Trap 12 — latanoprost stopped over eye color change</span><b>Iris darkening is permanent but harmless.</b> Teach it up front so the patient does not discontinue a sight-saving drug.</div>
</div>

<h2 class="sec-title"><span class="sec-emoji">🎯</span> Final Cram</h2>
<p class="intro-line">Everything memorizable, on one page. Read this last, and again before you walk in.</p>

<div class="tipbar">⏱️ <b>If you have 20 minutes, read only this page.</b> If you have an hour, read this then do a 30-question even-chapter draw.</div>

<div class="card" style="border-color:var(--purple)">
  <h3>🔢 The numbers</h3>
  <table class="lab">
    <tr><td><b>Glucose goal</b></td><td><b>70–110</b></td><td><b>A1C</b></td><td><b>&lt;5.7 normal · 5.7–6.4 pre · ≥6.5 DM</b></td></tr>
    <tr><td><b>Hypoglycemia</b></td><td><b>&lt;70</b></td><td><b>Fasting glucose</b></td><td><b>≥126 = diabetes</b></td></tr>
    <tr><td><b>Hyperglycemia</b></td><td><b>&gt;200</b></td><td><b>Restrict exercise</b></td><td><b>&gt;250 (check ketones)</b></td></tr>
    <tr><td><b>Normal IOP</b></td><td><b>10–20 mmHg</b></td><td><b>Elevated IOP</b></td><td><b>&gt;21 mmHg</b></td></tr>
    <tr><td><b>Legal blindness</b></td><td><b>20/200</b> or field ≤20°</td><td><b>Normal vision</b></td><td><b>20/20</b></td></tr>
    <tr><td><b>Ménière's sodium</b></td><td><b>1,000–1,500 mg/day</b></td><td><b>Ischemia begins</b></td><td><b>20 minutes of pressure</b></td></tr>
    <tr><td><b>Turn in bed</b></td><td><b>every 2 hr</b></td><td><b>Reposition in chair</b></td><td><b>every 15 MIN</b></td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>💉 Insulin — his handout</h3>
  <table class="lab">
    <tr><th></th><th>Onset</th><th>Peak</th><th>Duration</th></tr>
    <tr><td><b>Rapid</b> lispro·aspart·glulisine</td><td><b>15–30 min</b></td><td><b>0.5–2.5 hr</b></td><td><b>3–6 hr</b></td></tr>
    <tr><td><b>Short</b> Regular</td><td><b>0.5–1 hr</b></td><td><b>1–5 hr</b></td><td><b>6–14 hr</b></td></tr>

  <div class="mnem"><div class="tag">The rules</div><div class="big">Only REGULAR goes IV · LONG-acting has NO peak and is NEVER mixed · hypoglycemia happens at PEAK</div><div class="exp"><b>Mixing: air cloudy → air clear → draw clear → draw cloudy.</b> Only NPH should be cloudy — <b>any other cloudy insulin gets discarded</b>. Rotate 1 inch, stay 2 inches from the umbilicus. <b>Insulin lowers potassium.</b></div></div>

<div class="card" style="border-color:var(--teal)">
  <h3>🩸 Diabetes</h3>
  <ul class="clean">
    <li><b>Hot and dry, sugar high · cold and clammy, need some candy.</b> <b>Hyper is GRADUAL, hypo is SUDDEN.</b></li>
