<h2 class="sec-title"><span class="sec-emoji">🧠</span> The Why Engine</h2>
<p class="intro-line">Casteel's method: know the WHY behind each disease. If you understand the mechanism, his trick wording can't fool you — the wrong answer just looks wrong. Every Unit 3 topic below traces the chain: cause → <b>because this happens</b> → so you see these signs → <b>which is why</b> we treat it this way.</p>

<div class="card" style="border-color:var(--purple)">
  <h3>🔑 The whole trick</h3>
  <ul class="clean">
    <li>Don't memorize separate lists. <b>Derive</b> the signs and treatment from the mechanism.</li>
    <li>Every sign: ask <b>"WHY does this happen?"</b> Every treatment: <b>"WHY does this fix it?"</b></li>
    <li>On the test, ask <b>"what is physically happening in this patient?"</b> The answer that matches the physiology is right.</li>
  </ul>
  <div class="mnem"><div class="tag">The rule</div><div class="big">"If I can say the BECAUSE out loud, it's trap-proof."</div></div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🩸 Diabetes — the master mechanism</h3>
  <p><b>The one idea everything flows from:</b> insulin is the KEY that lets glucose INTO cells. No insulin (Type 1) or insulin that doesn't work (Type 2) → glucose is stuck in the blood, and the cells are starving even though sugar is everywhere.</p>
  <p class="why-chain"><b>Reason the classic "3 P's" forward:</b><br>
  Glucose piles up in the blood → spills into the urine → drags water with it (osmotic diuresis) → <b>polyuria</b> (peeing a lot).<br>
  All that water loss → dehydration → <b>polydipsia</b> (extreme thirst).<br>
  Cells are starving (glucose can't get in) → the body screams for fuel → <b>polyphagia</b> (hunger) + weight loss + fatigue.<br>
  High blood sugar damages tiny vessels and nerves over time and feeds bacteria → <b>slow healing, infections, blurred vision, numbness</b>.</p>
  <div class="hy">⭐ You never memorize the symptom list — you ask "what happens when sugar is stuck in the blood and cells are starving?" and reason it all out.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🚨 DKA — why it's an acid emergency (Type 1)</h3>
  <p><b>Root cause:</b> NO insulin at all → cells can't use glucose → the body thinks it's starving and burns FAT for fuel instead.</p>
  <p class="why-chain"><b>Reason it forward:</b><br>
  Burning fat produces <b>ketones</b>, which are ACIDS → blood pH drops → <b>metabolic acidosis</b>.<br>
  The lungs try to blow off the acid (CO₂) → <b>deep rapid Kussmaul breathing + fruity/acetone breath</b>.<br>
  Sky-high glucose → massive osmotic diuresis → <b>severe dehydration, polyuria, weak rapid pulse, hypotension</b>.<br>
  <b>The potassium trap:</b> acidosis pushes K⁺ OUT of cells into the blood → serum K⁺ looks HIGH at first — but total body K⁺ is actually LOW, and when you give insulin, K⁺ rushes back into cells and can crash dangerously.</p>
  <p><b>So the treatment makes sense:</b> <b>fluids first</b> (they're profoundly dehydrated) → <b>insulin</b> (stops fat-burning, ends ketone production) → <b>watch K⁺ like a hawk</b> because it will drop as insulin works.</p>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>💧 HHS — why it's dehydration without the acid (Type 2)</h3>
  <p><b>Root cause:</b> Type 2 patients <b>ARE producing insulin</b> — the problem is <b>insulin resistance</b>: their cells don't respond to it well, so glucose can't get pulled out of the blood and into cells the way it should. That glucose just <b>stays stuck/hanging around in the blood</b>, piling higher and higher.</p>
  <p class="why-chain"><b>Reason it forward:</b> here's the key detail — <b>it takes very little insulin to tell the liver "stop burning fat," but a LOT of working insulin to actually move glucose into cells.</b> So even though the cells are resistant enough to let glucose pile up sky-high (often >600), that same circulating insulin is usually still enough to reach the liver and <b>block fat breakdown/ketone production</b>. <b>Because</b> fat is never broken down, there are no ketones and no acid — which is why glucose climbs insanely high → enormous osmotic diuresis → <b>profound dehydration, hyperosmolality, altered mental status/seizures</b> — but there's <b>no Kussmaul breathing, no fruity breath, no acidosis</b>. That's the whole difference from DKA.</p>
  <div class="hy">⭐ <b>DKA vs HHS in one line:</b> DKA (Type 1) = ZERO insulin, so fat-burning is completely unblocked → ketones/acid. HHS (Type 2) = insulin is present but the cells are resistant to its glucose effect — glucose stays in the blood — while that same insulin is often still enough to keep fat-burning/ketone production shut off. Same hormone, two different jobs, two different thresholds.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>📉 Hypoglycemia — why the brain panics</h3>
  <p><b>Root cause:</b> too much insulin / too little food / too much exercise → blood sugar drops below 70. The <b>brain runs on glucose</b> and has no backup.</p>
  <p class="why-chain"><b>Reason it forward:</b> first the body dumps adrenaline to fix it → <b>shaky, sweaty, fast heart, hungry, anxious</b> (adrenergic signs). If it keeps dropping, the brain starves → <b>confusion, slurred speech, seizures, LOC</b> (neuro signs). <b>Because</b> the brain is starving fast, hypoglycemia is a more immediate emergency than high sugar.</p>
  <p><b>So the treatment makes sense:</b> conscious → <b>15 g fast carbs, recheck in 15 min (Rule of 15)</b>. Unconscious/can't swallow → <b>glucagon</b> (tells the liver to dump stored glucose) — never put food in the mouth of someone who can't swallow.</p>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🦶 Diabetic complications — why "sugar wrecks pipes & wires"</h3>
  <p><b>The unifying why:</b> chronic high glucose damages <b>blood vessels (pipes)</b> and <b>nerves (wires)</b> everywhere. Every long-term complication is just "which pipes or wires got wrecked."</p>
  <p class="why-chain">
  <b>Tiny vessels (microvascular):</b> eyes → <b>retinopathy</b> (blindness); kidneys → <b>nephropathy</b> (kidney failure).<br>
  <b>Big vessels (macrovascular):</b> heart/brain/legs → <b>heart attack, stroke, peripheral vascular disease</b>.<br>
  <b>Nerves (neuropathy):</b> can't feel the feet → <b>injuries go unnoticed</b> + poor circulation won't heal them + high sugar feeds bacteria → <b>foot ulcers → amputation</b>.</p>
  <p><b>So foot care makes sense:</b> daily inspection (<b>because</b> they can't FEEL an injury), never barefoot, no heating pads (<b>because</b> they can't feel a burn), glucose control (<b>because</b> it's the root of all of it).</p>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🛏️ Pressure injuries — why tissue dies</h3>
  <p><b>Root cause:</b> unrelieved pressure (usually over a bony prominence) squeezes the tiny vessels shut → that skin gets no blood → <b>no oxygen → the tissue dies</b>.</p>
  <p class="why-chain"><b>Reason it forward:</b> pressure over the sacrum, heels, hips → capillaries collapse → skin breaks down from the pressure point. <b>Because</b> the cause is unrelieved pressure, the #1 prevention is <b>relieving it — reposition every 2 hours</b>. <b>Because</b> friction and moisture and poor nutrition (low albumin) all speed breakdown, you keep skin clean/dry and feed protein.</p>
  <div class="hy">⭐ <b>Why you NEVER massage a reddened area:</b> the tissue underneath is already damaged and fragile — massaging can rupture those tiny vessels and make it worse. The mechanism tells you the rule.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>👁️ Glaucoma — why you lose vision from the edges in</h3>
  <p><b>Root cause:</b> fluid (aqueous humor) is made inside the eye and must drain out. If it can't drain → it backs up → <b>pressure builds inside the eye (high IOP)</b>.</p>
  <p class="why-chain"><b>Reason it forward:</b> that pressure squeezes the <b>optic nerve</b> → the nerve fibers die from the outside in → <b>peripheral vision goes first (tunnel vision)</b>, painless and gradual in open-angle. <b>Because</b> the damage is from pressure on the nerve, treatment = <b>lower the IOP</b> (drops that reduce fluid or improve drainage). <b>Because</b> dead optic nerve doesn't come back, lost vision is permanent — so it's about <b>preventing further loss</b>.</p>
  <div class="hy">⭐ <b>Angle-closure = emergency:</b> sudden total blockage → <b>sudden severe eye pain, halos, nausea, rock-hard eye</b>. This one is acute and needs immediate treatment to save the eye.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>👂 Ménière's disease — why the room spins</h3>
  <p><b>Root cause:</b> too much fluid (endolymph) builds up in the inner ear → the pressure disrupts the balance and hearing organs.</p>
  <p class="why-chain"><b>Reason the triad forward:</b> fluid pressure on the <b>balance organ</b> → <b>episodic vertigo</b> (spinning, the worst symptom); on the <b>hearing organ</b> → <b>fluctuating sensorineural hearing loss</b> + <b>tinnitus</b> (ringing) + ear fullness. <b>Because</b> the problem is fluid/sodium retention, the treatment is a <b>low-sodium diet + diuretics</b> to reduce the fluid. <b>Because</b> vertigo attacks cause falls, safety is the priority during an attack.</p>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🌫️ Cataracts — why everything looks cloudy and glary</h3>
  <p><b>Root cause:</b> the lens (normally clear, so light passes straight through to the retina) slowly turns cloudy/opaque with age, UV exposure, or diabetes.</p>
  <p class="why-chain"><b>Reason it forward:</b> light hits the cloudy lens and <b>scatters instead of focusing</b> → <b>blurry vision, glare and halos around lights</b> (worse at night when the pupil is wide and more scattered light gets in), and <b>faded/yellowed colors</b> (the clouded lens filters color). <b>Because</b> the lens itself is the problem — not the retina or the nerve — there's no pain, and <b>vision is fully restored once the cloudy lens is surgically removed and replaced</b> with a clear implant.</p>
  <p><b>So post-op teaching makes sense:</b> avoid bending/lifting/straining (<b>because</b> it raises IOP and can dislodge the healing incision/implant); don't rub the eye; report sudden pain (<b>because</b> that's not a normal part of healing).</p>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🎯 Macular degeneration — why straight lines go wavy, center-out</h3>
  <p><b>Root cause:</b> the macula (the tiny central part of the retina responsible for sharp, detailed central vision) degenerates with age — from abnormal blood vessels (wet) or gradual tissue thinning (dry).</p>
  <p class="why-chain"><b>Reason it forward:</b> the macula sits at the very CENTER of the retina, so damage there → <b>loss of CENTRAL vision first</b> — straight lines look wavy or distorted, there's a blurry/blank spot right in the middle of what they're looking at, while <b>peripheral (side) vision stays intact</b>. <b>Because</b> this is the opposite structure from glaucoma (which damages the optic nerve from the outside in), the vision-loss pattern is the exact opposite: macular degeneration = center out, glaucoma = edges in.</p>
  <div class="hy">⭐ <b>Trap answer alert:</b> if a question describes losing central vision, that's macular degeneration. Losing peripheral (tunnel) vision = glaucoma. Casteel loves testing this exact contrast.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>💥 Retinal detachment — why it's flashes, floaters, and a curtain</h3>
  <p><b>Root cause:</b> the retina (the light-sensing layer lining the back of the eye) tears and peels away from the tissue behind it that feeds it blood and oxygen.</p>
  <p class="why-chain"><b>Reason it forward:</b> as the retina tears and pulls away, it tugs on the vitreous gel and nerve fibers → <b>sudden flashes of light and floaters</b>. As more of the retina peels off, the part of vision it used to send goes dark → a <b>curtain or shadow moving across the visual field</b>. <b>Because</b> the detached retina is no longer getting blood supply, it will die — and that vision loss is <b>permanent</b> — if it isn't surgically reattached quickly. This is a <b>true ophthalmic emergency</b>, not a "wait and see."</p>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>👂 Conductive vs. sensorineural hearing loss — why one comes back and the other doesn't</h3>
  <p><b>The one idea everything flows from:</b> sound has to travel two ways — first mechanically THROUGH the outer/middle ear, then as a nerve signal FROM the inner ear/cochlea to the brain. Ask: which part is blocked, or which part is damaged?</p>
  <p class="why-chain"><b>Conductive (a blockage in the pathway):</b> earwax, fluid, otitis media, or a perforated eardrum physically <b>blocks sound from getting through</b> to the inner ear. <b>Because</b> the inner ear and nerve are fine — the sound just can't get in — removing the blockage (irrigation, treating the infection) <b>restores hearing</b>.</p>
  <p class="why-chain"><b>Sensorineural (damage to the receiver itself):</b> the cochlea's tiny hair cells or the auditory nerve are damaged — by aging (<b>presbycusis</b>), loud noise, or ototoxic drugs. <b>Because</b> the damaged hair cells/nerve don't regenerate, this hearing loss is <b>usually permanent</b> — hearing aids amplify sound, but they can't fix a broken receiver.</p>
  <div class="hy">⭐ <b>Ototoxic drugs</b> (aminoglycosides, loop diuretics like furosemide, high-dose aspirin, some chemo agents) damage the cochlea's hair cells directly → sensorineural loss + tinnitus. <b>Because</b> this damage doesn't reverse, the nursing priority is prevention: report new tinnitus or hearing changes immediately so the drug can be stopped before permanent damage sets in.</div>
</div>

<h2 class="sec-title"><span class="sec-emoji">🩸</span> Diabetes — Core</h2>
<p class="intro-line">The biggest, most-tested topic in Unit 3. Master the mechanism (insulin = the key that lets glucose into cells) and the rest follows.</p>
<div class="card" style="border-color:var(--purple)">
  <h3>⭐ The sugar math — from his handout</h3>
  <div class="mnem"><div class="tag">⭐ What the body is actually defending</div><div class="big">1 teaspoon of sugar per 1.5 gallons of blood</div><div class="exp">That is roughly <b>7 sugar cubes, or about 30 g</b>, circulating in an entire adult blood volume at any moment. One regular soda is about 39 g. <b>A single drink exceeds the body's entire circulating sugar budget</b>, which is why the pancreas is under constant pressure in a high-sugar diet.</div></div>
  <div class="hy"><span class="tag">Why this reframes the disease</span>Once you see how small the target is, <b>hyperglycemia stops being an abstract number</b>. A glucose of 400 is not "four times too high on a lab" — it is several teaspoons of sugar dissolved in blood that was built to carry one.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ What insulin and glucagon actually do</h3>
  <table class="lab">
    <tr><th>INSULIN — the storage hormone</th></tr>
    <tr><td>Secreted to help the <b>LIVER, MUSCLE, and FAT cells absorb glucose out of the blood</b></td></tr>
    <tr><td><b>Stores glucose in muscle and fat</b> to be used later as energy</td></tr>
    <tr><td><b>Excess glucose is stored as FAT</b> — lipogenesis</td></tr>
    <tr><td><b>INHIBITS LIPOLYSIS — it blocks fat burning</b></td></tr>
    <tr><td><b>Helps potassium shift INTO cells</b></td></tr>
  </table>
  <table class="lab">
    <tr><th>GLUCAGON — the release hormone</th></tr>
    <tr><td><b>Stimulates the liver into GLYCOGENOLYSIS when hypoglycemic</b> — breaking stored glycogen back down into glucose</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ They are exact opposites</div><div class="big">Insulin STORES and blocks fat burning · Glucagon RELEASES from storage</div><div class="exp">Which is why <b>glucagon is the drug for severe hypoglycemia</b> — you are telling the liver to dump its reserves. And why it <b>fails in a patient with no glycogen left</b>: starvation, alcohol use, or liver disease.</div></div>
  <table class="lab">
    <tr><th>⭐ What STIMULATES insulin release</th><th>⭐ What INHIBITS it</th></tr>
    <tr><td><b>Eating anything</b> · <b>CORTISOL</b></td><td><b>Fasting</b> · <b>consuming fat</b></td></tr>
  </table>
  <div class="hy"><span class="tag">Why cortisol matters clinically</span><b>Cortisol is the stress hormone</b> — it rises with illness, infection, surgery, pain, and <b>exercise</b>. It raises blood glucose and drives insulin release. That is why <b>sick days, surgery, and steroid therapy all send glucose up</b>, and why a stressed diabetic needs <b>more</b> insulin, not less, even when eating less.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ Insulin resistance — the chain he drew</h3>
  <ol class="chainlist">
    <li><b>1.</b> Glucose enters the blood.</li>
    <li><b>2.</b> Insulin is released.</li>
    <li><b>3.</b> Glucose moves into the cells.</li>
    <li><b>4.</b> But if glucose <b>stays high</b> — from chronically overeating sugar — the <b>cells become LESS SENSITIVE to insulin</b>.</li>
    <li><b>5.</b> The <b>pancreas releases MORE</b> insulin to force the same effect.</li>
    <li><b>6.</b> More insulin means <b>more glucose stored as FAT</b>.</li>
    <li><b>7.</b> Meanwhile <b>less glucose is actually getting into the cell</b> — so the cell is starving in the middle of plenty.</li>
  </ol>
  <div class="mnem"><div class="tag">⭐ What the starving cell causes</div><div class="big">Cravings for sweets · starved cells · poor amino acid absorption</div><div class="exp">The <b>cravings are physiologic, not a willpower failure</b>. The cell is signaling hunger because glucose is not reaching it, which drives more eating and tightens the cycle. Poor amino acid uptake is part of why <b>wounds heal badly</b> and muscle is lost.</div></div>
  <div class="trap"><span class="tag">Why this explains Type 2 treatment</span>The problem is <b>resistance</b>, not absence. That is why <b>lifestyle change and metformin (which improves sensitivity) come first</b>, and why simply adding more insulin early can <b>worsen weight gain and resistance</b>.</div>
</div>

<div class="card">
  <h3>⭐ Metabolic syndrome — his five</h3>
  <table class="lab">
    <tr><th>Component</th><th>Detail</th></tr>
    <tr><td><b>1. Hyperinsulinemia with hyperglycemia</b></td><td><b>Insulin resistance</b> — high insulin AND high glucose at the same time</td></tr>
    <tr><td><b>2. Dyslipidemia</b></td><td><b>LOW HDL</b> (the good one) and <b>HIGH LDL</b> (the bad one)</td></tr>

    <tr><td><b>4. Central obesity</b></td><td><b>Large waist circumference — "apple-shaped."</b> Thresholds: <b>men over 40 inches, women over 35 inches</b></td></tr>
    <tr><td><b>5. Hypertension</b></td><td>Elevated blood pressure</td></tr>
  </table>
  <div class="hy"><span class="tag">Diagnosis</span><b>Three of the five</b> makes the diagnosis. It is the cluster that <b>precedes and predicts Type 2 diabetes</b> and cardiovascular disease.</div>
  <div class="trap"><span class="tag">Why waist beats weight</span><b>Apple-shaped central fat is metabolically active</b> and drives insulin resistance in a way that fat on the hips and thighs does not. That is why <b>waist circumference is a criterion and BMI is not</b>.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ The five types — his table</h3>
  <table class="lab">
    <tr><th></th><th>TYPE 1</th><th>TYPE 2</th><th>LADA</th><th>GESTATIONAL</th><th>PREDIABETES</th></tr>

    <tr><td><b>Insulin production</b></td><td><b>Almost none</b></td><td><b>Produced but ineffective</b></td><td>Declining over time</td><td>Present, resisted</td><td>Present</td></tr>

  </table>
  <div class="mnem"><div class="tag">⭐ LADA — the one most people have not heard of</div><div class="big">Latent Autoimmune Diabetes of Adults — a slow-forming Type 1</div><div class="exp">It is <b>autoimmune like Type 1</b> but appears in adulthood, so it is <b>frequently misdiagnosed as Type 2</b>. The giveaway: an adult who looks like a Type 2 but <b>does not respond to oral agents</b> and keeps declining. <b>They will need insulin eventually.</b></div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Diagnostic numbers and treatment guidelines</h3>
  <table class="lab">
    <tr><th>Test</th><th>Value</th></tr>

    <tr><td><b>Hyperglycemia</b></td><td><b>Over 200 mg/dL</b></td></tr>
  </table>
  <div class="hy"><span class="tag">⭐ This settles the prediabetes range</span>This handout states <b>5.7 to 6.4%</b>, which matches the standard. Use <b>5.7</b> as the lower bound.</div>
  <h4 style="margin:12px 0 4px">Treatment pathway</h4>
  <table class="lab">
    <tr><td><b>TYPE 1</b></td><td><b>Insulin — basal and bolus, or an insulin pump.</b> There is no step 1 lifestyle phase; they need insulin from diagnosis</td></tr>
    <tr><td><b>TYPE 2 — step 1</b></td><td><b>Lifestyle interventions PLUS metformin</b></td></tr>

  <h4 style="margin:12px 0 4px">⭐ Sick day rules — his four</h4>
  <ol class="chainlist">
    <li><b>1. TAKE YOUR INSULIN</b> — even if you are not eating normally. Illness raises glucose.</li>
    <li><b>2. Eat small meals INCLUDING CARBS.</b></li>
    <li><b>3. Drink fluids frequently.</b></li>

  <div class="trap"><span class="tag">⭐ The sick day trap</span>"I was vomiting so I held my insulin" is <b>always wrong</b>. <b>Cortisol and other stress hormones push glucose UP during illness</b>, so the insulin requirement often <b>increases</b>. Skipping it is how a Type 1 patient arrives in DKA.</div>

<div class="card">
  <h3>🔢 The 3 P's and classic signs</h3>
  <table class="lab">
    <tr><th>Sign</th><th>What it means</th><th>Why it happens</th></tr>
    <tr><td><b>Polyuria</b></td><td>Excessive <b>peeing</b></td><td>Glucose spills into the urine and <b>drags water with it</b> — osmotic diuresis</td></tr>

    <tr><td><b>Polyphagia</b></td><td>Excessive <b>hunger</b></td><td>The cells are <b>starving</b> — glucose is in the blood but cannot get in without insulin</td></tr>

  <ul class="clean">
    <li><b>Also:</b> unexplained <b>weight loss</b> (Type 1, from fat and protein breakdown), fatigue, <b>blurred vision</b>, <b>slow wound healing</b>, recurrent infections (especially yeast), <b>numbness and tingling</b>, dry itchy skin.</li>
    <li><b>Type 2 is often silent for years</b> and is frequently found on a routine lab or after a complication has already developed.</li>
  </ul>
  <div class="mnem"><div class="tag">The one-line explanation</div><div class="big">Sugar in the blood, starvation in the cells</div><div class="exp">Every classic symptom comes from that single sentence. The blood is sweet and thick, the cells are starving, and the kidneys are dumping sugar and water.</div></div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🔬 Diagnostic numbers — know these cold</h3>
  <table class="lab">
    <tr><th>Test</th><th>Normal</th><th>Prediabetes</th><th>Diabetes</th></tr>
    <tr><td><b>Fasting plasma glucose</b></td><td>under 100</td><td><b>100 – 125</b></td><td><b>126 or higher</b></td></tr>
    <tr><td><b>A1C</b></td><td>under 5.7%</td><td><b>5.7 – 6.4%</b></td><td><b>6.5% or higher</b></td></tr>
    <tr><td><b>Oral glucose tolerance (2 hr)</b></td><td>under 140</td><td><b>140 – 199</b></td><td><b>200 or higher</b></td></tr>
    <tr><td><b>Random glucose</b></td><td>—</td><td>—</td><td><b>200 or higher WITH symptoms</b></td></tr>
  </table>
  <div class="hy"><span class="tag">⭐ What A1C actually measures</span>The <b>percentage of hemoglobin with glucose attached</b>, which reflects the average blood glucose over the <b>past 2 to 3 months</b> — the lifespan of a red cell. <b>A patient cannot fast their way to a good A1C</b>, which is exactly why it is used to judge long-term control. <b>Target for most diabetics is under 7%.</b></div>
  <div class="hy"><span class="tag">His goal number</span>He wrote the blood glucose goal as <b>70 – 110 mg/dL</b>. Use his number.</div>
</div>

<div class="card">
  <h3>💉 What insulin actually does — 4 jobs</h3>
  <ol class="chainlist">
    <li><b>1. Moves glucose INTO cells</b> — the main job. Without it, glucose stays in the blood and the cells starve.</li>
    <li><b>2. Stores glucose as glycogen</b> in the liver and muscle for later.</li>
    <li><b>3. Stops fat breakdown.</b> This is the one that matters for DKA — <b>no insulin means fat breakdown runs unchecked, producing ketones</b>.</li>
    <li><b>4. Promotes protein synthesis and growth.</b> <b>Insulin is a growth hormone</b>, which is why insulin therapy causes weight gain.</li>
  </ol>
  <div class="mnem"><div class="tag">⭐ Jobs 1 and 3 explain almost everything</div><div class="big">Insulin lets glucose IN and keeps fat breakdown OFF</div><div class="exp">Remove insulin and you get both problems at once: <b>hyperglycemia</b> (glucose cannot get in) and <b>ketoacidosis</b> (fat breakdown has no brakes). That is Type 1 and that is DKA.</div></div>
  <div class="hy"><span class="tag">And potassium</span><b>Insulin also drives potassium INTO cells</b> alongside glucose. That is why insulin treats hyperkalemia, and why treating DKA with insulin makes the serum potassium <b>fall</b>.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>🧬 Other types you'll see tested</h3>
  <table class="lab">
    <tr><th>Type</th><th>Key points</th></tr>
    <tr><td><b>Gestational diabetes</b></td><td>Develops in pregnancy from placental hormones causing insulin resistance. <b>Screened at 24–28 weeks.</b> Raises risk of a <b>large baby (macrosomia)</b>, birth injury, and <b>neonatal hypoglycemia</b> after delivery. Usually resolves after birth, but <b>greatly raises lifetime risk of Type 2</b> — she needs ongoing screening</td></tr>
    <tr><td><b>Prediabetes</b></td><td>Fasting 100–125 or A1C 5.7–6.4%. <b>Reversible</b> with weight loss, diet, and activity — this is where teaching changes outcomes most</td></tr>
    <tr><td><b>Secondary diabetes</b></td><td>Caused by something else: <b>corticosteroids</b>, pancreatitis, Cushing syndrome, cystic fibrosis, some antipsychotics. May resolve if the cause is removed</td></tr>
    <tr><td><b>Metabolic syndrome</b></td><td>The cluster that precedes Type 2: <b>central obesity, hypertension, high triglycerides, low HDL, elevated fasting glucose</b>. <b>Three of five makes the diagnosis</b></td></tr>
  </table>
  <div class="trap"><span class="tag">The steroid connection</span>Any patient on <b>corticosteroids</b> — prednisone for COPD, an asthma exacerbation, a transplant — will have <b>rising blood glucose</b>. That is expected, not an error, and it is why steroid-treated patients get glucose monitoring.</div>
</div>

<div class="card">
  <h3>💊 Oral agents & Glucagon — the ones he's tested you on</h3>
  <ul class="clean">
    <li><b>Metformin</b> (biguanide, first-line for Type 2) — decreases hepatic glucose production, improves insulin sensitivity, does NOT stimulate insulin release (low hypoglycemia risk alone). <b>Hold 48 hrs before/after IV contrast</b> and check eGFR before starting; contraindicated if eGFR &lt;30. Watch for lactic acidosis (rare but serious): unexplained muscle pain, malaise, unusual fatigue.</li>
    <li><b>Glimepiride</b> (2nd-gen sulfonylurea) — stimulates insulin release by closing ATP-sensitive K⁺ channels on beta cells. <b>Glucose-INDEPENDENT</b> — works even when glucose is already low, which is exactly why it can cause hypoglycemia. Give with the first meal of the day; skip the dose if the meal is skipped.</li>
    <li><b>Glyburide</b> (2nd-gen sulfonylurea) — same mechanism as glimepiride, but a <b>longer duration and higher hypoglycemia risk</b>, especially in older adults. <b>On the Beers Criteria list — avoid in elderly patients</b> and use extreme caution with renal impairment (prolonged, severe hypoglycemia risk).</li>
    <li><b>SGLT-2 inhibitors</b> ("-flozin") — cause glucose to be excreted in the urine; watch for UTIs/yeast infections from the glucose-rich urine.</li>
    <li><b>GLP-1 agonists</b> ("-tide," e.g. semaglutide) — incretin-based mechanism, slows gastric emptying and increases satiety (weight-loss benefit); low hypoglycemia risk alone, and it is a scheduled therapy, not a rescue medication.</li>
    <li><b>Glucagon</b> — the antidote for severe hypoglycemia when a patient can't safely take anything by mouth. Stimulates the liver to break down stored glycogen (glycogenolysis) and make new glucose (gluconeogenesis) — <b>requires adequate liver glycogen stores to work</b> (may be ineffective in starvation, chronic alcohol use, or adrenal insufficiency). Position an unconscious patient on their SIDE after giving it (vomiting/aspiration risk during recovery), and give oral carbohydrates as soon as the patient is awake enough to prevent the glucose from dropping again.</li>
  </ul>
  <div class="hy">⭐ <b>Metformin + contrast dye = HOLD.</b> High-yield: hold metformin before/after IV contrast to protect the kidneys and prevent lactic acidosis.</div>
  <div class="hy">⭐ <b>Sulfonylurea safety pattern:</b> both glimepiride and glyburide work whether or not the patient has actually eaten — that's why "never skip a meal on this medication" is core teaching, and why glyburide specifically gets avoided in the elderly and renally impaired.</div>
</div>


<div class="card" style="border-color:var(--red)">

</div>

<h2 class="sec-title"><span class="sec-emoji">💉</span> Insulin Lab</h2>
<p class="intro-line">Onset, peak, and duration for every insulin — the single most-tested detail in this unit, since it's WHY hypoglycemia timing makes sense. Built from your own ALT drug cards.</p>
<div class="card" style="border-color:var(--teal)">
  <h3>⭐ Nursing considerations — from the new handout</h3>
  <ul class="clean">
    <li><b>Monitor for hypoglycemia (under 70)</b> — tachycardia, diaphoresis, shakiness, weakness, lethargy. <b>This confirms the 70 threshold he gave in class.</b></li>
    <li><b>⭐ Insulin can LOWER potassium.</b> Monitor for <b>hypokalemia</b> in patients taking large doses — watch for <b>muscle cramps and cardiac dysrhythmias</b>.</li>
    <li><b>Rotate injection sites</b> to prevent <b>lipohypertrophy</b>.</li>
    <li><b>Clear before cloudy</b> when drawing up.</li>
    <li><b>⭐ NPH is the ONLY insulin that should be cloudy. If any other insulin is cloudy, throw it out.</b></li>
  </ul>
  <div class="mnem"><div class="tag">⭐ Why insulin drops potassium</div><div class="big">Insulin pushes potassium INTO cells along with glucose</div><div class="exp">That is the same mechanism used to <b>treat hyperkalemia</b>, and it is why <b>potassium crashes when you start an insulin drip in DKA</b>. On a large standing dose, it shows up as <b>muscle cramps and dysrhythmias</b>.</div></div>
  <div class="trap"><span class="tag">The cloudy rule is a free point</span>A cloudy <b>Regular, lispro, aspart, glulisine, glargine, or detemir</b> vial has <b>degraded or is contaminated — discard it</b>. Only <b>NPH</b> is supposed to look cloudy, and it should be <b>rolled, not shaken</b>, to resuspend.</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Making the numbers stick</h3>
  <p class="why-chain">Four insulins, three numbers each. The trick is that they form a <b>ladder</b> — each step is roughly double the one before it.</p>
  <table class="lab">
    <tr><th></th><th>ONSET</th><th>PEAK</th><th>DURATION</th></tr>
    <tr><td><b>Rapid</b><br>lispro · aspart · glulisine</td><td><b>5–30 min</b></td><td><b>30 min – 3 hr</b></td><td><b>3–5 hr</b></td></tr>

    <tr><td><b>Intermediate</b><br>NPH</td><td><b>1–2 hr</b></td><td><b>4–12 hr</b></td><td><b>18–24 hr</b></td></tr>
    <tr><td><b>Long</b><br>glargine · detemir</td><td><b>1–2 hr</b></td><td><b>NONE</b></td><td><b>24 hr</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The onset chain</div><div class="big">5–30 min → 30–60 min → 1–2 hr → 1–2 hr</div><div class="exp">Read down the onset column and the end of one is the start of the next. <b>30 links rapid to short.</b> Then both of the slow ones are 1–2 hours.</div></div>
  <div class="mnem"><div class="tag">⭐ The duration chain</div><div class="big">3–5 → 5–7 → 18–24 → 24</div><div class="exp">Same trick: <b>5 links rapid to short.</b> Then it jumps to nearly a full day for both long-acting types.</div></div>

</div>

<div class="card" style="border-color:var(--teal)">

  </table>
  <div class="mnem"><div class="tag">⭐ Two facts that answer most insulin questions</div><div class="big">REGULAR is the only one given IV · LONG-ACTING has NO PEAK and is NEVER mixed</div><div class="exp">Regular is the <b>standard insulin given IV</b> — in DKA, that is the one hanging. <b>Glargine and detemir have no peak</b>, so they provide flat basal coverage and <b>must not be mixed with any other insulin</b> in the same syringe.</div></div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ Mixing insulins — the order and the mnemonic</h3>
  <ol class="chainlist">
    <li><b>1. Air into the CLOUDY vial</b> (NPH). Do not withdraw.</li>
    <li><b>2. Air into the CLEAR vial</b> (Regular). Do not withdraw.</li>

  <div class="hy"><span class="tag">What can and cannot be mixed</span><b>Regular can be mixed with NPH.</b> <b>Glargine and detemir are NEVER mixed with anything</b> — they are given in a separate syringe at a separate site.</div>
</div>

<div class="card">
  <h3>💉 Administration — the details he listed</h3>
  <ul class="clean">
    <li><b>Route: subcutaneous or IV.</b> Only <b>Regular</b> may be given <b>IV</b>.</li>

    <li><b>Roll NPH gently between the palms</b> to resuspend — <b>do not shake</b>, which causes bubbles and inaccurate dosing.</li>
    <li><b>Only an insulin syringe</b> is used for insulin, and doses are <b>verified by a second nurse</b> per policy.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⚠️ Complications of insulin therapy</h3>
  <table class="lab">
    <tr><th>Complication</th><th>Why it happens</th></tr>
    <tr><td><b>Hypoglycemia</b></td><td>Too much insulin, too little food, or unplanned exercise. Occurs <b>at the peak</b></td></tr>

<h2 class="sec-title"><span class="sec-emoji">🚨</span> DKA vs HHS</h2>
<p class="intro-line">Casteel loves comparing these two. Both = hyperglycemia + dehydration. The difference is the ACID. Know it cold.</p>
<div class="card" style="border-color:var(--teal)">
  <h3>⭐ Fluid resuscitation in DKA and HHS — what he stressed</h3>

  </table>

</div>


<div class="card" style="border-color:var(--red)">

  <h3>⭐ DKA vs HHS — the way he framed it</h3>
  <table class="lab">
    <tr><th></th><th>DKA</th><th>HHS</th></tr>
    <tr><td><b>Usually which type</b></td><td><b>Type 1</b></td><td><b>Type 2</b></td></tr>

  <div class="trap"><span class="tag">⭐ Potassium in DKA — the reversal</span>The serum potassium often reads <b>normal or HIGH on arrival</b> because acidosis pushes potassium out of the cells. But <b>total body potassium is depleted</b>. The moment you give <b>insulin, potassium is driven back INTO the cells and the level CRASHES.</b> That is why potassium is monitored closely and often replaced <b>before or alongside</b> the insulin drip. <b>Never start insulin if the potassium is already low.</b></div>
</div>


<div class="card" style="border-color:var(--red)">
  <h3>⚖️ Side by side</h3>
  <table class="lab">
    <tr><th></th><th>DKA</th><th>HHS</th></tr>

  </table>
  <div class="mnem"><div class="tag">Mnemonic</div><div class="big">"DKA has the Acid & Ketones. HHS is Hyperosmolar (super dehydrated) without the acid."</div></div>

<div class="card">
  <h3>🔧 Treatment — same 3 goals, same order</h3>
  <p>Both DKA and HHS are treated by fixing three things, roughly in this order:</p>
  <ul class="clean">
    <li><b>1. Fluids FIRST</b> — 0.9% NS (isotonic) to rehydrate; switch to 0.45% NS later. They are profoundly dehydrated.</li>
    <li><b>2. Insulin</b> — IV regular insulin drip to bring glucose down (and in DKA, to stop ketone production).</li>
    <li><b>3. Potassium</b> — watch and replace K⁺ closely (see below).</li>
    <li>When glucose reaches ~250–300, <b>add dextrose (D5W)</b> to the fluids so glucose doesn't crash while insulin keeps running to clear ketones.</li>
  </ul>
  <div class="hy">⭐ <b>Fluids come before insulin.</b> If you give insulin to a severely dehydrated patient first, you can drop their blood pressure and shift fluid dangerously. Rehydrate, then bring the sugar down.</div>
  <div class="hy">⭐ <b>Why we DON'T drop glucose too fast:</b> the brain adapts to a hyperosmolar (very concentrated) blood environment during prolonged hyperglycemia. If glucose/osmolality is corrected too quickly, water shifts rapidly into brain cells and can cause <b>cerebral edema</b> — a real, feared complication. This is exactly why dextrose is added once glucose nears ~250–300 (so insulin can keep clearing ketones/lowering glucose slowly and safely) rather than letting the glucose crash all at once.</div>
</div>

<div class="card" style="border-color:var(--amber)">

  <h3>⚡ The potassium trap (classic exam question)</h3>
  <p class="why-chain">In DKA, acidosis pushes K⁺ OUT of cells → <b>serum K⁺ looks HIGH or normal at first</b>, but total body potassium is actually LOW. When you give insulin, K⁺ moves back INTO cells → serum K⁺ <b>drops fast</b> and can become dangerously low.</p>
  <ul class="clean">
    <li>Monitor K⁺ frequently and get ECGs.</li>
    <li>Replace potassium as it falls — <b>but hold K⁺ if the patient isn't urinating</b> (no kidney output = K⁺ can build to dangerous levels) or if K⁺ is high.</li>
    <li><b>Avoid bicarbonate</b> in DKA — it can drop potassium suddenly.</li>
  </ul>
</div>

<div class="card">
  <h3>🛡️ Preventing DKA — sick day rules</h3>
  <p class="why-chain"><b>Why illness raises glucose even without eating:</b> stress/illness triggers cortisol and adrenaline (fight-or-flight) — and cortisol is a steroid that stimulates insulin release AND raises blood glucose on its own. Fasting and high-fat intake do the opposite (they inhibit insulin release). This is why a sick patient's sugar climbs even when they haven't eaten a thing.</p>
  <ul class="clean">
    <li><b>NEVER stop insulin during illness</b> — even if not eating (illness raises glucose). This is the #1 cause of DKA.</li>
    <li>Check glucose and ketones every 3–4 hours.</li>
    <li>Sip fluids hourly to prevent dehydration; take small carb portions.</li>
    <li>Call the provider if unable to keep fluids down or glucose/ketones stay high.</li>
  </ul>
  <div class="hy">⭐ Same logic applies in the hospital: surgery and acute illness are physical stressors → cortisol rises → glucose rises. This is why hospitalized diabetics often need MORE frequent monitoring, not less, even when NPO.</div>
</div>


<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>

  <div class="trap"><span class="tag">Trap 2 — the potassium that falls</span>Initial K looks high because <b>acidosis shifted it out of cells</b>. Insulin drives it back in and the serum level crashes. That is why potassium is monitored and replaced even when the first lab is elevated.</div>

  <div class="trap"><span class="tag">Trap 4 — glucose 250 during treatment</span>The answer is <b>add dextrose</b>, not stop the insulin. The insulin drip is still clearing the ketones; you add sugar so it can keep running safely.</div>
</div>

<script>

<h2 class="sec-title"><span class="sec-emoji">📉</span> Hypoglycemia</h2>
<p class="intro-line">Blood sugar &lt;70 mg/dL. More immediately dangerous than high sugar — the brain runs on glucose and starves fast.</p>
<div class="card" style="border-color:var(--purple)">
  <h3>⭐ The numbers from his sheet</h3>
  <table class="lab">
    <tr><th>Value</th><th>Number</th></tr>
    <tr><td><b>Blood glucose GOAL</b></td><td><b>70 – 110 mg/dL</b></td></tr>
    <tr><td><b>Hyperglycemia</b></td><td><b>over 200 mg/dL</b> · onset <b>GRADUAL</b> (hours to days)</td></tr>
    <tr><td><b>⭐ Hypoglycemia</b></td><td><b>under 70 mg/dL</b> · onset <b>SUDDEN</b></td></tr>
    <tr><td><b>Restrict exercise when glucose is</b></td><td><b>over 250 mg/dL</b></td></tr>
  </table>
  <div class="hy"><span class="tag">⭐ Use 70, not 60</span>His printed info sheet lists hypoglycemia as <b>under 60 mg/dL</b>, but <b>he said in class to use under 70</b>. <b>70 is also the standard clinical definition</b> — the ADA threshold and what NCLEX uses. <b>Go with 70 on his exam.</b></div>
  <div class="mnem"><div class="tag">⭐ The timing difference is the tell</div><div class="big">Hyperglycemia is GRADUAL. Hypoglycemia is SUDDEN.</div><div class="exp">If a stem says a patient "suddenly" became confused, shaky, and diaphoretic, that is <b>hypo</b> before you ever see a number. Gradual thirst, urination, and blurred vision over days is <b>hyper</b>.</div></div>
  <div class="trap"><span class="tag">⭐ Why exercise is restricted above 250</span>It feels backwards — exercise normally lowers glucose. But <b>without enough insulin, exercising cells cannot use the glucose</b>, so the body breaks down fat instead, <b>producing more ketones and worsening acidosis</b>. Above 250, <b>check urine for ketones</b>; if ketones are present, do not exercise.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🔥 Hyperglycemia — signs and care</h3>
  <table class="lab">
    <tr><th>Signs</th><th>Nursing care</th></tr>
    <tr><td><b>Polyuria · Polydipsia · Polyphagia</b><br><b>Hot and dry skin</b><br>Dry mouth (dehydration)<br><b>Fruity breath</b><br><b>Deep rapid breaths (air hunger)</b> — Kussmaul<br>Numbness and tingling<br>Slow wound healing<br>Vision changes</td><td><b>Administer insulin as needed</b><br><b>Restrict exercise when glucose is over 250</b><br><b>Test urine for ketones</b><br>Encourage fluids, monitor I&amp;O<br>Monitor electrolytes, especially potassium</td></tr>
  </table>
  <div class="mnem"><div class="tag">Hot and dry vs cold and clammy</div><div class="big">HOT and DRY — sugar HIGH · COLD and CLAMMY — need some CANDY</div><div class="exp">The single fastest way to sort the two at the bedside, and it rhymes for a reason.</div></div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>🍬 Hypoglycemia — 15 × 15 × 15</h3>
  <table class="lab">
    <tr><th>Signs</th><th>Why</th></tr>
    <tr><td><b>Cool and clammy skin · Diaphoresis · Palpitations · Shakiness</b></td><td><b>Adrenergic</b> — the body dumping catecholamines to raise the glucose</td></tr>
    <tr><td><b>Fatigue and weakness · Confusion · Headache · Inability to arouse from sleep</b></td><td><b>Neuroglycopenic</b> — the brain running out of fuel</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ 15 × 15 × 15 — conscious patient</div><div class="big">15 g carbs → recheck in 15 min → another 15 g if still low</div><div class="exp"><b>15 g examples:</b> 4 oz juice or regular soda, 3–4 glucose tablets, 1 tablespoon honey, 8 oz milk. Once the glucose is back up, follow with a <b>protein and complex carbohydrate snack</b> if the next meal is more than an hour away.</div></div>
  <div class="card" style="border-color:var(--red);margin-top:10px">
    <h3 style="font-size:1rem">🚑 Unconscious patient</h3>
    <ul class="clean">
      <li><b>⭐ Do NOT put anything in an unconscious patient's mouth — they can aspirate.</b></li>
      <li><b>Administer glucagon subcutaneously or IM.</b></li>
      <li><b>Repeat in 10 minutes if still unconscious.</b></li>
      <li><b>Place the client in a lateral (side-lying) position</b> — glucagon commonly causes vomiting.</li>
      <li><b>Notify the health care provider.</b></li>
      <li><b>Acute care setting: administer 50% dextrose if IV access is available.</b></li>
    </ul>
  </div>
  <div class="trap"><span class="tag">The trap</span>Any option that gives juice, glucose gel, or "a small sip of soda" to an <b>unconscious or unresponsive</b> patient is wrong. <b>No IV? Glucagon. IV available? D50.</b></div>
</div>

<div class="card">
  <h3>🥗 Diabetic diet</h3>
  <table class="lab">
    <tr><th>✅ Encourage</th><th>❌ Limit</th></tr>
    <tr><td><b>Complex carbohydrates</b><br><b>Fiber-rich foods</b><br><b>Heart-healthy fish</b><br><b>"Good fats"</b> (unsaturated)<br><b>Sugar-free fluids</b></td><td><b>Saturated fats</b><br><b>Trans fats</b><br><b>Cholesterol</b><br><b>Sodium</b></td></tr>
  </table>
  <div class="hy"><span class="tag">Why complex over simple</span>Complex carbohydrates and fiber <b>slow absorption</b>, so glucose rises gradually instead of spiking. The goal is a <b>steady</b> curve, not the elimination of carbohydrate.</div>
  <div class="hy"><span class="tag">Sick day rules</span><b>Never skip insulin when ill</b>, even if not eating — illness raises glucose. Check glucose <b>every 3–4 hours</b>, test <b>urine ketones</b>, drink <b>8 oz of sugar-free fluid hourly</b>, and call the provider for vomiting over 4 hours, glucose over 240 with ketones, or altered mental status.</div>
</div>


<div class="card">
  <h3>Causes & the two symptom stages</h3>
  <p><b>Causes:</b> too much insulin/oral agent, too little food, skipped meal, too much exercise.</p>
  <ul class="clean">
    <li><b>Stage 1 — Adrenergic (mild, &lt;70):</b> the body dumps adrenaline → <b>shaky, sweaty, tachycardic, palpitations, anxious, hungry</b>. These are the early warning signs.</li>
    <li><b>Stage 2 — Neuroglycopenic (worse, &lt;54):</b> the brain starves → <b>confusion, headache, slurred speech, blurred/double vision, poor coordination, irritability</b>.</li>
    <li><b>Stage 3 — Severe:</b> seizures, loss of consciousness, can't self-treat.</li>
  </ul>
  <div class="mnem"><div class="tag">Mnemonic</div><div class="big">"Cold & Clammy = need some CANDY (low sugar). Hot & Dry = sugar HIGH."</div><div class="exp">Sweaty/shaky = hypoglycemia. Dehydrated/flushed = hyperglycemia.</div></div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🍬 The Rule of 15 (conscious patient)</h3>
  <ul class="clean">
    <li>Give <b>15 grams of fast-acting carbs</b>: 4 oz juice, 3–4 glucose tablets, 1 tbsp sugar/honey, or hard candy.</li>
    <li><b>Wait 15 minutes, recheck</b> blood glucose.</li>
    <li>Still &lt;70? <b>Repeat another 15 g.</b></li>
    <li>Once stable, give a <b>snack with protein/complex carb</b> to prevent it from dropping again.</li>
  </ul>
  <div class="hy">⭐ <b>Don't over-treat.</b> Give 15 g, wait, recheck — don't dump a huge amount of sugar in at once (causes a rebound high). Fast carbs, not a candy bar with fat that slows absorption.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🚑 Unconscious / can't swallow</h3>
  <ul class="clean">
    <li><b>NEVER put food or drink in the mouth</b> of someone who can't swallow — aspiration risk.</li>
    <li>Give <b>glucagon</b> 1 mg IM/SubQ (or intranasal) — it tells the liver to release stored glucose.</li>
    <li>In the hospital with IV access → <b>IV dextrose (D50)</b>.</li>
    <li>May take up to 20 min to wake; follow with carbs + snack. Monitor closely.</li>
  </ul>
</div>

<div class="card">
  <h3>⚠️ Hypoglycemia unawareness</h3>
  <p>Some long-term diabetics lose the early adrenergic warning signs (from autonomic neuropathy) — they go straight to confusion without feeling shaky first. These patients need <b>frequent glucose checks</b> and slightly higher glucose targets, and family should be taught to give glucagon.</p>
</div>


<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — glucagon for a conscious patient</span>IM glucagon is for the patient who <b>cannot swallow</b>. A conscious alert patient gets <b>15 g of fast carbs, recheck in 15 minutes</b>.</div>
  <div class="trap"><span class="tag">Trap 2 — fat slows the fix</span>"A full meal with protein and fat" sounds nutritionally sensible. Fat <b>delays gastric emptying</b> and slows the glucose rise. Fast carbs first, then a protein snack.</div>
  <div class="trap"><span class="tag">Trap 3 — waiting to recheck</span>"Recheck in one hour" appears. The rule is <b>15 minutes</b>.</div>
  <div class="trap"><span class="tag">Trap 4 — hypoglycemia unawareness</span>The answer is <b>more</b> monitoring plus family taught to give glucagon, not less. Losing the adrenergic warning signs makes the patient more dangerous to themselves, not safer.</div>
</div>

document.getElementById('sec-complications').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🔗</span> Long-Term Complications</h2>
<p class="intro-line">One mechanism: chronic high glucose wrecks blood vessels (pipes) and nerves (wires). Every complication is "which pipes or wires got damaged."</p>

<div class="card" style="border-color:var(--red)">
  <h3>🩸 Macrovascular — the big vessels</h3>
  <p class="why-chain">Chronic hyperglycemia damages large arteries and accelerates atherosclerosis. These complications are what most diabetics ultimately die from.</p>
  <table class="lab">
    <tr><th>Complication</th><th>What to know</th></tr>
    <tr><td><b>Coronary artery disease</b></td><td><b>The leading cause of death in diabetes.</b> ⭐ <b>Diabetics often have SILENT myocardial infarctions</b> — neuropathy blunts the chest pain, so they present with <b>fatigue, shortness of breath, nausea, or confusion instead</b></td></tr>
    <tr><td><b>Cerebrovascular disease</b></td><td>Two to four times the stroke risk</td></tr>
    <tr><td><b>Peripheral artery disease</b></td><td>Claudication, <b>cool</b> extremities, <b>diminished pulses</b>, hair loss on the legs, shiny skin. Combines with neuropathy to cause <b>foot ulcers and amputation</b></td></tr>
  </table>
  <div class="trap"><span class="tag">⭐ The silent MI</span>A diabetic with <b>new fatigue, dyspnea, or unexplained nausea</b> may be having an MI with <b>no chest pain at all</b>. Options that dismiss those symptoms because "there is no chest pain" are wrong.</div>
  <div class="hy"><span class="tag">Prevention targets</span>Tight <b>glucose</b>, <b>blood pressure</b>, and <b>lipid</b> control, plus <b>smoking cessation</b>. Most diabetics are on a statin and often an ACE inhibitor regardless of their numbers.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>🔬 Microvascular — the tiny vessels</h3>
  <table class="lab">
    <tr><th>Complication</th><th>Detail</th><th>Nursing</th></tr>
    <tr><td><b>Retinopathy</b></td><td>Damaged retinal capillaries leak and new fragile vessels grow. <b>The leading cause of new blindness in adults.</b> Often <b>asymptomatic until vision is already lost</b></td><td><b>Annual dilated eye exam</b> — not optional. Control glucose and blood pressure. Report floaters, sudden vision changes, or a curtain across the field immediately</td></tr>
    <tr><td><b>Nephropathy</b></td><td><b>The leading cause of end-stage renal disease.</b> <b>Earliest sign is microalbuminuria</b> — small amounts of protein in the urine before creatinine ever rises</td><td><b>Annual urine microalbumin</b> and creatinine. <b>ACE inhibitors or ARBs are renal-protective</b> and given even with normal blood pressure. Limit protein and sodium. Avoid nephrotoxic drugs and IV contrast where possible</td></tr>
    <tr><td><b>Neuropathy</b></td><td>See the card below</td><td>—</td></tr>
  </table>
  <div class="mnem"><div class="tag">The three that share one cause</div><div class="big">Retina · Kidney · Nerves — all tiny vessels, all silent early</div><div class="exp">All three are <b>asymptomatic until damage is done</b>, which is why diabetic care is built on <b>scheduled screening</b> rather than waiting for symptoms.</div></div>
</div>

<div class="card">
  <h3>🦵 Neuropathy — damaged nerves</h3>
  <table class="lab">
    <tr><th>Type</th><th>Presentation</th></tr>
    <tr><td><b>Peripheral (most common)</b></td><td><b>Stocking-glove</b> numbness, tingling, burning, or shooting pain. Often <b>worse at night</b>. Progresses to <b>loss of protective sensation</b> — the patient cannot feel injury</td></tr>
    <tr><td><b>Autonomic — GI</b></td><td><b>Gastroparesis</b>: early satiety, bloating, nausea, <b>unpredictable glucose</b> because food absorption is erratic. Small frequent low-fat meals</td></tr>
    <tr><td><b>Autonomic — cardiac</b></td><td><b>Silent MI</b>, resting tachycardia, <b>orthostatic hypotension</b>. Teach slow position changes</td></tr>
    <tr><td><b>Autonomic — GU</b></td><td>Neurogenic bladder with <b>retention and recurrent UTIs</b>; erectile dysfunction</td></tr>
    <tr><td><b>Autonomic — other</b></td><td><b>Hypoglycemia unawareness</b> — the adrenergic warning signs are blunted, so the first sign is confusion or unconsciousness</td></tr>
  </table>
  <div class="trap"><span class="tag">Why loss of sensation is the dangerous part</span>Pain is protective. A patient who <b>cannot feel</b> a pebble in the shoe, a blister, or hot bathwater will injure the foot and <b>not know it</b> — and poor circulation means it will not heal. <b>Neuropathy plus PAD is how diabetics lose limbs.</b></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🦶 Diabetic foot care — very high yield</h3>
  <ul class="clean">
    <li><b>⭐ Inspect the feet EVERY DAY</b>, including between the toes and the soles. <b>Use a mirror</b> or have someone else look if vision or mobility is limited.</li>
    <li><b>Wash daily in LUKEWARM water</b> — <b>test the temperature with a thermometer or the elbow, never the feet</b>. Pat dry, especially between the toes.</li>
    <li><b>Lotion on the tops and bottoms, NEVER between the toes</b> — trapped moisture there causes fungal infection and maceration.</li>
    <li><b>⭐ NEVER go barefoot</b>, even indoors. Shoes at all times, and <b>check inside the shoe before putting it on</b>.</li>
    <li><b>Cut toenails STRAIGHT ACROSS</b>, never rounded or into the corners. A podiatrist handles thick nails, corns, and calluses.</li>
    <li><b>NEVER use over-the-counter corn or callus removers</b> — they are chemical burns waiting to happen on insensate skin.</li>
    <li><b>No heating pads, hot water bottles, or soaking the feet.</b> Neuropathy means they cannot feel a burn.</li>
    <li><b>Well-fitting shoes</b>, break new shoes in gradually. Cotton socks, changed daily, no tight elastic bands.</li>
    <li><b>Report immediately:</b> any break in the skin, redness, warmth, drainage, a change in color or temperature, or a wound that is not healing.</li>
    <li><b>Smoking cessation</b> — it constricts the very vessels the foot depends on.</li>
  </ul>
  <div class="mnem"><div class="tag">⭐ The three NEVERs</div><div class="big">NEVER barefoot · NEVER lotion between the toes · NEVER a heating pad</div><div class="exp">Those three cover most of the wrong answers he can write for a foot care question.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>💊 Renal-impairment drug alerts — what to question</h3>
  <p class="why-chain"><b>The mechanism behind ALL of these:</b> failing kidneys can't clear/filter drugs normally, so anything that is (1) cleared by the kidneys, (2) directly toxic to kidney tissue, or (3) risks a dangerous electrolyte shift becomes a bigger problem in renal disease. Ask "does this drug rely on the kidneys, hurt the kidneys, or raise potassium?"</p>
  <ul class="clean">
    <li><b>NSAIDs</b> (ibuprofen, ketorolac, naproxen) — nephrotoxic; reduce blood flow to the kidneys. <b>Question/avoid</b> in CKD, especially with other nephrotoxic drugs.</li>
    <li><b>Aminoglycosides</b> (gentamicin, tobramycin) — directly nephrotoxic AND ototoxic; requires trough level monitoring in renal impairment.</li>
    <li><b>IV contrast dye</b> — nephrotoxic on its own; combined with metformin raises lactic acidosis risk too.</li>
    <li><b>Metformin</b> — reduced renal clearance → lactic acidosis risk; held around contrast and in significant renal impairment (low eGFR).</li>
    <li><b>Sulfonylureas</b>, especially <b>glyburide</b> — cleared by the kidneys; renal impairment → drug accumulates → prolonged, dangerous hypoglycemia. Glipizide is the safer choice if a sulfonylurea is still needed.</li>
    <li><b>Insulin</b> — the kidneys help clear/break down insulin. In renal failure, insulin sticks around LONGER than expected → higher hypoglycemia risk even at a "normal" dose. Doses are often reduced, not increased.</li>
    <li><b>Potassium-sparing diuretics</b> (spironolactone) — risk of dangerous hyperkalemia in renal impairment, especially combined with an ACE inhibitor/ARB.</li>
    <li><b>Magnesium- or aluminum-containing antacids</b> — normally excreted renally; accumulate and can cause toxicity in renal failure.</li>
    <li><b>Meperidine (Demerol)</b> — its toxic metabolite accumulates in renal failure and can cause seizures; generally avoided in this population.</li>
    <li><b>Digoxin</b> — renally cleared; needs a lower dose and closer monitoring for toxicity.</li>
    <li><b>Vancomycin</b> — nephrotoxic; requires trough level monitoring, dosed by renal function.</li>
  </ul>
  <div class="hy">⭐ <b>The ACE inhibitor/ARB nuance he'll test:</b> these are the PROTECTIVE drugs for chronic diabetic nephropathy (they lower pressure inside the glomerulus and slow progression) — but they're not automatically safe in every renal scenario. <b>Question/hold</b> if: the patient develops acute kidney injury, potassium becomes significantly elevated, there's known bilateral renal artery stenosis, or creatinine rises more than about 30% after starting (a small initial rise is expected and not itself a reason to stop).</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>💊 Eye medication alerts — what to question</h3>
  <ul class="clean">
    <li><b>Anticholinergic/mydriatic drops</b> (atropine, cyclopentolate) — dilate the pupil. <b>Contraindicated/use extreme caution</b> in a patient with (or at risk for) <b>angle-closure glaucoma</b> — dilating the pupil can push the iris into the drainage angle and trigger an acute attack.</li>
    <li><b>Beta-blocker drops</b> (timolol) — can be absorbed systemically. <b>Question/use caution</b> in patients with asthma/COPD (bronchospasm risk) or bradycardia/heart block (can worsen it), even though it's just an eye drop.</li>
    <li><b>Steroid eye drops</b> (long-term use) — can raise IOP (glaucoma risk) and contribute to cataract formation — ties directly back to why steroid use is a recognized cataract cause.</li>
    <li><b>Prostaglandin analogs</b> (latanoprost) — generally safe/first-line for glaucoma, but can permanently darken iris color and lengthen/darken eyelashes — a cosmetic effect worth mentioning in patient teaching, not a safety contraindication.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the silent MI</span>A diabetic with an MI and no chest pain. "They're faking" and "diabetics don't get MIs" are there to be dismissed, but so is "the heart isn't involved." <b>Autonomic neuropathy blunts the pain signal.</b></div>
  <div class="trap"><span class="tag">Trap 2 — peripheral vs autonomic neuropathy</span><b>Peripheral</b> is stocking-glove numbness and burning. <b>Autonomic</b> is orthostatic hypotension, gastroparesis, and silent MI. He hands you the wrong list.</div>
  <div class="trap"><span class="tag">Trap 3 — heating pads and hot water</span>The reason is not that the pad is "too warm." It is that <b>neuropathy means the patient cannot feel a burn</b>.</div>
  <div class="trap"><span class="tag">Trap 4 — questioning the dilating drop</span>A patient with angle-closure glaucoma history offered mydriatics. Three options administer it in some modified way. <b>Question the order</b> — dilation can push the iris into the drainage angle.</div>
</div>
<div id="quiz-complications"></div>

  {q:'Which combination of findings in a client with long-standing diabetes is MOST consistent with early diabetic nephropathy?',type:'single',
