   rat:'A, C, and D all describe findings that could plausibly appear somewhere in a diabetic patient\'s chart, which is what makes them tempting. Microalbuminuria — small amounts of protein leaking into the urine before creatinine even rises — is specifically the earliest detectable marker of nephropathy, often preceding any creatinine change at all.'},

  {q:'A client with diabetic nephropathy and an eGFR of 25 mL/min is newly prescribed glyburide for glucose control. What is the nurse\'s BEST action?',type:'single',
   opts:['Hold the medication indefinitely and notify the pharmacy to discontinue all diabetes medications','Question the order, since glyburide is renally cleared and can accumulate','Administer the medication but double the ordered dose to compensate for reduced absorption','Administer the medication as ordered without further action'],correct:1,
   rat:'A treats the order as routine, which is reasonable UNLESS you know the renal-clearance issue with this specific drug. C invents a compensation strategy with no basis, and D overcorrects by stopping all diabetes treatment rather than questioning the one problematic order. Glyburide specifically accumulates in renal impairment; glipizide is the safer sulfonylurea choice if one is still needed.'},

  {q:'A client with CKD is ordered ibuprofen for musculoskeletal pain. What is the nurse\'s BEST action?',type:'single',
   opts:['Administer the medication as ordered since it is available over-the-counter','Administer the medication with a full glass of water to protect the kidneys','Question the order, since NSAIDs are nephrotoxic and can further reduce renal blood flow','Give the medication only at bedtime to minimize its effect on the kidneys'],correct:2,
   rat:'A reasons from availability rather than safety, which is an easy trap since ibuprofen is so commonly used without a prescription. C and D both invent workarounds that don\'t address the actual mechanism. NSAIDs reduce renal blood flow and are nephrotoxic — this order should be questioned in a patient with CKD regardless of timing or hydration.'},

  {q:'A patient with a history of angle-closure glaucoma is about to receive dilating drops (a mydriatic/anticholinergic agent) before a routine eye exam. What is the nurse\'s BEST action?',type:'single',
   opts:['Administer the drops but patch the eye immediately afterward to prevent complications','Administer the drops as ordered, since dilating drops are routine for eye exams','Question the order, since dilation can push the iris into the drainage angle','Administer only half the ordered dose to reduce the risk'],correct:2,
   rat:'A treats this as routine, which is true for most patients — but a history of angle-closure glaucoma is the specific exception, since dilating the pupil can precipitate the exact mechanism (angle blockage) that causes an acute attack. C and D both invent workarounds rather than actually questioning the order.'},

  {q:'Diabetic retinopathy and nephropathy are both classified as which type of complication?',type:'single',
   opts:['Macrovascular','Neuropathic','Autoimmune','Microvascular'],correct:3,
   rat:'Straight recall — retinopathy and nephropathy are both microvascular complications, damage to small vessels from chronic hyperglycemia.'},

  {q:'A client with a 15-year history of Type 2 diabetes has the following findings at a routine visit: BP 148/92, urine microalbumin elevated, eGFR 52, and a new complaint of feeling full quickly after small meals with occasional bloating. Which single underlying process connects ALL of these findings?',type:'single',
   opts:['Diabetic microvascular and autonomic nerve damage across kidneys, GI motility, and vessels','Four separate, unrelated age-related changes that happen to occur together','Medication side effects unrelated to the underlying diabetes','An acute infectious process affecting multiple organ systems simultaneously'],correct:0,
   rat:'A treats these as coincidental, separate findings, which is tempting given how different they seem (kidney labs vs. GI symptoms). C and D both look for a cause outside the diabetes itself. All of these findings — elevated BP, microalbuminuria, reduced eGFR, and early satiety/bloating — trace back to the SAME long-term hyperglycemia damaging small vessels (nephropathy) and autonomic nerves (gastroparesis) simultaneously; recognizing one underlying process instead of four separate problems is the actual clinical reasoning skill being tested.'}
],'Complications Check');
</script>
<script>
document.getElementById('sec-derm').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🩹</span> Dermatologic Conditions</h2>
<p class="intro-line">Chapter 57. Lesion vocabulary, inflammatory conditions, infections, and skin cancer.</p>
<div class="card" style="border-color:var(--amber)">
  <h3>⭐ Skin cancer — risk and treatment from his lecture</h3>
  <table class="lab">
    <tr><th>Point</th><th>Detail</th></tr>
    <tr><td><b>⭐ Melanin is protective</b></td><td><b>The more melanin, the lower the risk</b> of skin cancer — melanin absorbs UV radiation. <b>Fair skin, light eyes, and red or blond hair carry the highest risk.</b> But darker skin is <b>not immune</b>, and those cancers are <b>found later and have worse outcomes</b> — check <b>palms, soles, nail beds, and mucous membranes</b></td></tr>
    <tr><td><b>Environmental risks</b></td><td><b>Solar (UV) exposure</b> — cumulative sun and <b>blistering sunburns</b> · <b>tanning beds</b> · <b>SMOKING</b> · radiation and chemical exposure · immunosuppression</td></tr>
    <tr><td><b>⭐ Primary treatment</b></td><td><b>SURGICAL EXCISION is the primary treatment for localized malignancy.</b> Mohs, wide excision, or shave excision depending on type and location. Chemotherapy, radiation, and immunotherapy are for <b>advanced or metastatic</b> disease</td></tr>
    <tr><td><b>Severity ladder</b></td><td><b>Basal cell → squamous cell → melanoma</b>, in increasing order of <b>metastatic potential</b></td></tr>
  </table>
  <div class="hy"><span class="tag">Prevention teaching</span><b>Broad-spectrum SPF 30+</b>, reapplied every <b>2 hours</b> and after swimming · avoid sun <b>10 AM to 4 PM</b> · protective clothing and wide-brim hat · <b>no tanning beds</b> · <b>monthly self-examination</b> using a mirror for the back and scalp · annual professional skin check · <b>report any changing lesion</b>.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ What he said about squamous cell carcinoma</h3>
  <p><b>His statement: squamous cell carcinoma is usually benign but it can become malignant.</b> Answer it his way on his exam.</p>
  <div class="hy"><span class="tag">The nuance worth understanding</span>In standard oncology terms, <b>squamous cell carcinoma is a malignancy by definition</b> — "carcinoma" means cancer. What is true, and almost certainly what he means, is that <b>SCC usually behaves in a localized way and is highly curable when caught early</b>, but it <b>CAN become invasive and metastasize</b> — unlike basal cell, which almost never spreads.</div>
  <div class="hy"><span class="tag">Where the "benign" idea fits cleanly</span><b>Actinic keratoses are the truly precancerous lesions</b> — scaly patches that are not yet cancer but <b>can progress into squamous cell carcinoma</b>. If a question offers a "precancerous" option, <b>actinic keratosis</b> is the safest fit.</div>
  <div class="mnem"><div class="tag">The behavior ladder</div><div class="big">Actinic keratosis → precancerous · Basal cell → rarely spreads · Squamous cell → CAN spread · Melanoma → spreads early</div><div class="exp">Ranked by how dangerous the behavior is, not by how common they are. <b>Basal cell is most common, melanoma is most deadly, and squamous cell sits in between.</b></div></div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ Skin cancer — his descriptions and treatments</h3>
  <table class="lab">
    <tr><th>Type</th><th>His description</th></tr>
    <tr><td><b>Basal cell carcinoma</b></td><td><b>The most common.</b> A <b>flesh-colored round growth, a pearl-like bump, or a pinkish patch of skin</b></td></tr>
    <tr><td><b>Squamous cell carcinoma</b></td><td><b>Second most common.</b> A <b>red firm bump, a scaly patch, or a sore that heals and then re-opens</b></td></tr>
    <tr><td><b>⭐ Actinic keratoses (AKs)</b></td><td><b>Scaly patches or spots</b> on the skin. <b>PRECANCEROUS</b> — they can progress to squamous cell carcinoma, so they are treated rather than watched</td></tr>
    <tr><td><b>Melanoma</b></td><td><b>The deadliest.</b> Frequently develops <b>in a mole</b> or <b>suddenly appears as a new dark spot</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ ABCDE, worded his way</div><div class="big">A asymmetry · B border (poorly defined) · C color · D diameter over 6 mm · E evolving</div></div>
  <h4 style="margin:12px 0 4px">Treatment options</h4>
  <table class="lab">
    <tr><td><b>⭐ Mohs surgery</b></td><td><b>Removes the cancerous skin LAYER BY LAYER</b>, checking each layer, so it ensures complete removal <b>while preserving healthy tissue</b>. Used where tissue conservation matters — face, ears, hands</td></tr>
    <tr><td><b>Cryosurgery</b></td><td><b>Freezes the cancer cells with liquid nitrogen</b></td></tr>
    <tr><td><b>Wide excision</b></td><td>Removes the tumor <b>plus a margin of healthy tissue</b></td></tr>
    <tr><td><b>Shave excision</b></td><td><b>Shaves the tumor off with a razor-like device</b></td></tr>
    <tr><td><b>Chemotherapy · radiation · immunotherapy</b></td><td>For advanced or metastatic disease</td></tr>
  </table>
  <div class="hy"><span class="tag">Why Mohs is the one to know</span>It has the <b>highest cure rate</b> and <b>spares the most healthy tissue</b>, because the surgeon checks each layer under the microscope before taking the next. That is why it is chosen for <b>cosmetically and functionally sensitive areas</b>.</div>
  <div class="hy"><span class="tag">Nursing priorities from his handout</span>Perform assessments and administer treatments · <b>manage treatment-related side effects</b> · supportive care and education · <b>coordinate interdisciplinary care</b> · emotional support and counseling · <b>advocate for patient needs</b> · facilitate access to resources.</div>
  <div class="hy"><span class="tag">Nursing diagnoses he listed</span><b>Acute pain</b> related to tissue inflammation and treatment side effects · <b>impaired skin integrity</b> related to radiation exposure · <b>risk for infection</b> from a weakened immune system secondary to chemotherapy · <b>imbalanced nutrition, less than body requirements</b> related to nausea and altered taste · <b>fatigue</b> · <b>anxiety</b> related to fear of prognosis · <b>deficient knowledge</b>.</div>
</div>


<div class="card" style="border-color:var(--purple)">
  <h3>🔤 Describing a lesion — the vocabulary he grades</h3>
  <p class="why-chain">Dermatology questions almost always start by describing a lesion. If you can name what is being described, the diagnosis usually follows.</p>
  <table class="lab">
    <tr><th>Term</th><th>What it is</th><th>Example</th></tr>
    <tr><td><b>Macule</b></td><td><b>Flat</b>, color change only, under 1 cm</td><td>Freckle, petechiae</td></tr>
    <tr><td><b>Papule</b></td><td><b>Raised</b>, solid, under 1 cm</td><td>Wart, elevated mole</td></tr>
    <tr><td><b>Plaque</b></td><td>Raised, flat-topped, <b>over 1 cm</b></td><td><b>Psoriasis</b></td></tr>
    <tr><td><b>Vesicle</b></td><td><b>Fluid-filled</b>, under 1 cm</td><td><b>Herpes, chickenpox</b></td></tr>
    <tr><td><b>Bulla</b></td><td>Fluid-filled, <b>over 1 cm</b></td><td>Blister, burn</td></tr>
    <tr><td><b>Pustule</b></td><td><b>Pus</b>-filled</td><td>Acne, impetigo</td></tr>
    <tr><td><b>Wheal</b></td><td>Raised, irregular, transient</td><td><b>Hives, allergic reaction</b></td></tr>
    <tr><td><b>Nodule</b></td><td>Raised, solid, <b>deeper</b> than a papule</td><td>Lipoma</td></tr>
    <tr><td><b>Ulcer</b></td><td>Loss of epidermis <b>and</b> dermis</td><td>Pressure injury, venous ulcer</td></tr>
    <tr><td><b>Fissure</b></td><td>Linear crack</td><td>Athlete's foot, cheilitis</td></tr>
    <tr><td><b>Scale / crust</b></td><td>Flaking / dried exudate</td><td>Psoriasis / impetigo</td></tr>
    <tr><td><b>Lichenification</b></td><td>Thickened leathery skin from chronic scratching</td><td><b>Chronic eczema</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">The size rule</div><div class="big">Under 1 cm vs over 1 cm is what splits most pairs</div><div class="exp">Macule→patch · papule→plaque · vesicle→bulla. Same lesion, bigger. <b>Flat = macule/patch. Raised solid = papule/plaque. Fluid = vesicle/bulla. Pus = pustule.</b></div></div>
</div>

<div class="card">
  <h3>🔴 Inflammatory conditions</h3>
  <table class="lab">
    <tr><th>Condition</th><th>Looks like</th><th>Management</th></tr>
    <tr><td><b>Psoriasis</b></td><td><b>Thick silvery-white scales on red plaques</b>, typically elbows, knees, scalp, sacrum. <b>Auerspitz sign</b> — pinpoint bleeding if scale is removed. Chronic, autoimmune, <b>not contagious</b></td><td><b>Topical corticosteroids</b>, vitamin D analogs, coal tar, <b>UVB phototherapy</b>, methotrexate or biologics if severe. Moisturize. Manage stress — it triggers flares</td></tr>
    <tr><td><b>Atopic dermatitis (eczema)</b></td><td><b>Intensely itchy</b>, dry, red, weeping then crusting. Flexor surfaces in adults. Chronic scratching causes <b>lichenification</b>. Part of the <b>atopic triad</b> with asthma and allergic rhinitis</td><td><b>Moisturize within 3 minutes of bathing</b> \u2014 lukewarm water, mild soap, pat dry. Topical steroids, antihistamines for itch, <b>keep nails short</b>, cotton clothing, identify triggers</td></tr>
    <tr><td><b>Contact dermatitis</b></td><td>Redness and vesicles in the <b>exact shape of the exposure</b> — a watchband, a glove line, poison ivy streaks</td><td><b>Identify and remove the allergen</b>. Wash the area, topical steroids, cool compresses</td></tr>
    <tr><td><b>Urticaria (hives)</b></td><td><b>Wheals</b> — raised, itchy, transient, migrating</td><td>Antihistamines, remove the trigger. <b>Watch for airway involvement</b> — hives plus swelling of the lips or tongue is heading toward anaphylaxis</td></tr>
    <tr><td><b>Acne vulgaris</b></td><td>Comedones, papules, pustules on the face, chest, back</td><td>Benzoyl peroxide, topical retinoids, antibiotics. <b>Isotretinoin is highly teratogenic</b> \u2014 two forms of contraception and monthly pregnancy tests</td></tr>
  </table>
  <div class="trap"><span class="tag">The itch-scratch cycle</span>Scratching damages skin \u2192 more inflammation \u2192 more itch \u2192 more scratching \u2192 <b>lichenification and infection</b>. That is why <b>controlling the itch</b> is the nursing priority in eczema, not just treating the rash.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🦠 Infections and infestations</h3>
  <table class="lab">
    <tr><th>Condition</th><th>Key feature</th><th>Management</th></tr>
    <tr><td><b>Cellulitis</b></td><td><b>Bacterial infection of the dermis and subcutaneous tissue.</b> Red, <b>warm</b>, swollen, tender, poorly defined borders. Often fever. <b>Common in diabetics</b> and after a break in the skin</td><td><b>Systemic antibiotics</b>, elevate the limb, warm compresses, <b>mark the border with a pen and time it</b> to track spread. Watch for sepsis</td></tr>
    <tr><td><b>Impetigo</b></td><td><b>Honey-colored crusts</b>, usually around the nose and mouth. <b>Highly contagious</b>, common in children</td><td>Topical or oral antibiotics. <b>Keep the child home until 24 hours of treatment</b>. No sharing towels or linens</td></tr>
    <tr><td><b>Herpes zoster (shingles)</b></td><td><b>Painful unilateral vesicles along ONE DERMATOME that does not cross midline.</b> Burning pain often precedes the rash. Reactivation of chickenpox</td><td>Antivirals <b>within 72 hours</b>. <b>Contact precautions</b>; airborne too if disseminated. <b>Contagious to anyone who never had chickenpox</b> until lesions crust. Keep away from pregnant women and the immunocompromised. <b>Postherpetic neuralgia</b> is the feared complication. Shingrix vaccine prevents it</td></tr>
    <tr><td><b>Herpes simplex</b></td><td>Grouped vesicles on an erythematous base, recur in the same place. Triggered by stress, illness, sun</td><td>Antivirals. Avoid contact with lesions</td></tr>
    <tr><td><b>Tinea</b> (fungal)</td><td><b>Ring-shaped, scaly, clear center.</b> <b>Corporis</b> body \u00b7 <b>pedis</b> athlete's foot \u00b7 <b>cruris</b> jock itch \u00b7 <b>capitis</b> scalp</td><td>Topical antifungals; oral for scalp or nails. <b>Keep the area clean and DRY</b> \u2014 fungus needs moisture</td></tr>
    <tr><td><b>Candidiasis</b></td><td><b>Beefy red with satellite lesions</b> in warm moist skin folds. Common in diabetics, obesity, antibiotic use</td><td>Antifungal, <b>keep folds dry</b>, barrier products, control blood glucose</td></tr>
    <tr><td><b>Scabies</b></td><td><b>Intense itching, worse at night.</b> Burrows in web spaces, wrists, waistline</td><td><b>Permethrin</b> neck to toe, left on 8\u201314 hours. <b>Treat all household contacts</b>. Wash all linens in hot water; bag what cannot be washed for 72 hours. <b>Itching can persist weeks after successful treatment</b></td></tr>
    <tr><td><b>Pediculosis (lice)</b></td><td>Nits firmly attached to hair shafts, itching</td><td>Permethrin, fine-tooth nit comb, hot-wash linens, no sharing hats or brushes</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The two that give themselves away</div><div class="big">Honey-colored crust = IMPETIGO · One dermatome, doesn't cross midline = SHINGLES</div></div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ Skin cancer — ABCDE</h3>
  <table class="lab">
    <tr><th>Type</th><th>Appearance</th><th>Behavior</th></tr>
    <tr><td><b>Basal cell carcinoma</b></td><td><b>Pearly or waxy papule</b> with rolled borders, may ulcerate in the center</td><td><b>MOST COMMON</b>, least dangerous. Rarely metastasizes but is locally destructive</td></tr>
    <tr><td><b>Squamous cell carcinoma</b></td><td>Scaly, crusted, firm red nodule, may ulcerate. Often on sun-exposed areas and lower lip</td><td><b>CAN metastasize.</b> Faster growing</td></tr>
    <tr><td><b>Melanoma</b></td><td><b>Irregular, multicolored, changing</b> mole</td><td><b>MOST DEADLY.</b> Metastasizes early and widely. Prognosis depends on <b>depth</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ ABCDE of melanoma</div><div class="big">A symmetry · B order irregular · C olor varied · D iameter over 6 mm · E volving</div><div class="exp"><b>Evolving \u2014 any change in size, shape, color, or a mole that itches or bleeds \u2014 is the most important single sign.</b> A pencil eraser is about 6 mm.</div></div>
  <ul class="clean">
    <li><b>Risk factors:</b> fair skin, light eyes, history of <b>blistering sunburns</b>, tanning bed use, many moles, family history, immunosuppression, chronic sun exposure.</li>
    <li><b>Prevention teaching:</b> <b>broad-spectrum SPF 30+ reapplied every 2 hours</b> and after swimming \u00b7 avoid sun <b>10 AM to 4 PM</b> \u00b7 protective clothing and wide-brim hat \u00b7 <b>no tanning beds</b> \u00b7 monthly self-examination \u00b7 annual skin check.</li>
    <li><b>Darker skin tones:</b> melanoma is less common but <b>diagnosed later and has worse outcomes</b>. Check <b>palms, soles, nail beds, and mucous membranes</b> \u2014 those are the common sites.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⚠️ The dermatologic emergency</h3>
  <p class="why-chain"><b>Stevens-Johnson syndrome and toxic epidermal necrolysis</b> are severe drug reactions where the epidermis detaches in sheets. The patient is managed like a <b>burn</b>.</p>
  <ul class="clean">
    <li><b>Presentation:</b> flu-like prodrome, then painful red or purple rash that <b>blisters and sloughs</b>. <b>Mucous membranes are involved</b> \u2014 mouth, eyes, genitals. <b>Positive Nikolsky sign</b> (skin shears off with light lateral pressure).</li>
    <li><b>Common triggers:</b> <b>sulfonamides, anticonvulsants, allopurinol, NSAIDs</b>, some antibiotics.</li>
    <li><b>Priority: STOP the causative drug immediately.</b> Then fluid and electrolyte replacement, pain control, wound care, infection prevention, ophthalmology consult, often burn-unit transfer.</li>
  </ul>
  <div class="trap"><span class="tag">Why it matters for any drug question</span>A patient who develops a <b>rash with mucous membrane involvement and blistering</b> after starting a new medication is not having a simple allergy. <b>Stop the drug and escalate.</b> "Give diphenhydramine and continue" is the wrong answer.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on dermatologic conditions</h3>
  <div class="trap"><span class="tag">Trap 1 — shingles contagion</span>Shingles is <b>not</b> "caught" from another person's shingles, but it <b>IS contagious as chickenpox</b> to anyone never infected or vaccinated, until the lesions <b>crust over</b>. Keep away from pregnant women, newborns, and the immunocompromised.</div>
  <div class="trap"><span class="tag">Trap 2 — the 72-hour window</span>Antivirals for shingles work best <b>within 72 hours of rash onset</b>. Options that delay treatment to "see if it spreads" lose the window.</div>
  <div class="trap"><span class="tag">Trap 3 — most common vs most deadly</span><b>Basal cell is MOST COMMON. Melanoma is MOST DEADLY.</b> He will ask for one and offer the other.</div>
  <div class="trap"><span class="tag">Trap 4 — the E in ABCDE</span>A patient describing a mole that has <b>changed, itches, or bleeds</b> needs evaluation even if it looks small and regular. <b>Evolving outranks the other four letters.</b></div>
  <div class="trap"><span class="tag">Trap 5 — keeping fungal areas moist</span>Fungus thrives in moisture. Any teaching option that involves occlusive dressings, staying in damp socks, or heavy ointment on a fungal rash is wrong. <b>Clean and DRY.</b></div>
  <div class="trap"><span class="tag">Trap 6 — treating only the patient for scabies</span><b>All household contacts are treated simultaneously</b>, symptomatic or not. And <b>itching persisting for weeks afterward is expected</b>, not treatment failure.</div>
  <div class="trap"><span class="tag">Trap 7 — antihistamine for a drug rash with mucosal involvement</span>That is <b>Stevens-Johnson</b> until proven otherwise. <b>Stop the drug.</b></div>
  <div class="trap"><span class="tag">Trap 8 — moisturizing at the wrong time</span>In eczema, moisturizer goes on <b>within 3 minutes of bathing</b> on damp skin to trap the water in. Applying it to dry skin hours later does far less.</div>
</div>

<div id="quiz-derm"></div>`;

  {q:'A child has honey-colored crusted lesions around the nose and mouth. What is the priority teaching?',type:'single',

  {q:'A client with atopic dermatitis asks when to apply moisturizer. What is the nurse\'s response?',type:'single',

  {q:'A client develops a widespread painful rash with blistering and mouth and eye involvement 5 days after starting a sulfonamide antibiotic. What is the priority action?',type:'single',

document.getElementById('sec-skin').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🧴</span> Skin, Wounds & Pressure Injuries</h2>
<p class="intro-line">Pressure injuries are the classic NCLEX topic here. Know the staging, prevention, and the mechanism (pressure → no blood → tissue death).</p>
<div class="card" style="border-color:var(--red)">
  <h3>⭐ The 20-minute rule — from his lecture</h3>
  <div class="mnem"><div class="tag">⭐ The number he emphasized</div><div class="big">Circulation is compromised in as little as 20 MINUTES of compression</div><div class="exp">That is why the standard is <b>every 2 hours in bed and every 15 minutes in a chair</b> — sitting concentrates the entire body weight onto the <b>ischial tuberosities</b>, so the tolerance window is far shorter.</div></div>
  <div class="why-chain"><b>The mechanism:</b> external pressure exceeds <b>capillary closing pressure</b> → blood flow stops → tissue becomes <b>ischemic</b> → cells run out of oxygen and cannot clear waste → cell death begins. <b>Muscle dies before skin does</b>, which is exactly why a <b>deep tissue injury</b> shows intact purple skin over damage that started underneath.</div>
  <div class="hy"><span class="tag">Why elderly skin fails faster</span><b>Reduced subcutaneous fat</b> means less padding over bone, <b>thinner dermis</b>, <b>flattened dermal-epidermal junction</b> so layers shear apart more easily, <b>decreased elasticity and collagen</b>, and <b>slower healing</b> from reduced perfusion. Same pressure, far less reserve.</div>
  <div class="hy"><span class="tag">⭐ Why the Braden Scale exists at all</span>He made this point directly: a standardized scale <b>reduces subjective variance between nurses</b>. Without it, "looks high risk" means something different to every nurse on the unit. <b>A number produces a consistent, targeted intervention plan</b> and lets any nurse pick up where the last one left off.</div>
  <div class="hy"><span class="tag">Hourly rounding</span>Purposeful hourly rounding addresses the <b>4 Ps</b> — <b>pain, position, potty, and possessions</b>. It catches the incontinent patient before moisture damages skin, repositions before ischemia sets in, and <b>reduces falls and call-light use</b>.</div>
</div>



<div class="card">
  <h3>🔍 Assessing skin color (esp. dark skin tones)</h3>
  <table class="lab">
    <tr><th>Finding</th><th>What it means</th><th>Where to check in dark skin</th></tr>
    <tr><td><b>Cyanosis</b></td><td>Low oxygen (bluish)</td><td>Appears grayish; check lips, nail beds, conjunctivae</td></tr>
    <tr><td><b>Jaundice</b></td><td>High bilirubin (yellow)</td><td>Check sclerae, hard palate, mucous membranes</td></tr>
    <tr><td><b>Pallor</b></td><td>Low blood flow/anemia</td><td>Check conjunctivae, oral mucosa</td></tr>
    <tr><td><b>Erythema</b></td><td>Redness/inflammation</td><td>May look purple-gray; palpate for warmth</td></tr>
  </table>
  <div class="hy">⭐ In darker skin tones, color changes are harder to see — <b>check mucous membranes, sclerae, nail beds, and conjunctivae</b>, and palpate for warmth/temperature changes.</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>🗣️ Skin assessment — the actual questions to ask (Casteel's own examples)</h3>
  <p><b>If you see a RASH,</b> ask open-ended questions: How long has it been there? Does it itch? Any new soaps, detergents, lotions, or products? Any known allergies?</p>
  <p><b>If you see ECCHYMOSIS (bruising)</b> on a hospitalized patient, ask: How did you get this? Was there an injury or bump? What medications are you taking (anticoagulants, aspirin, and steroids all increase bruising)?</p>
  <div class="hy">⭐ <b>Pattern recognition matters:</b> bruising in typical locations (shins, forearms, from a bump) is usually explainable. Bruising that is widespread, in unusual/protected locations, or inconsistent with the story given should raise concern and prompt further assessment — this applies to any patient, but is a especially important safety consideration in elderly or dependent patients.</div>
  <div class="mnem"><div class="tag">Mnemonic</div><div class="big">"Duration, itch, and what touched it" for a rash. "How, when, and what meds" for a bruise.</div></div>
</div>

<div class="card">
  <h3>✋ Quick fact: thickest &amp; thinnest skin on the body</h3>
  <p><b>Thickest skin:</b> the palms of the hands and the soles of the feet.</p>
  <p><b>Thinnest skin:</b> the eyelids and the genital/perineal area.</p>
  <div class="hy">⭐ Flagged directly by the instructor as a testable detail — easy to overlook because it seems trivial, but it's exactly the kind of small fact that shows up as a distractor or a direct question.</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Pressure points BY POSITION — from his slides</h3>
  <table class="lab">
    <tr><th>Position</th><th>Where the pressure lands</th></tr>
    <tr><td><b>SUPINE</b><br>(on the back)</td><td><b>Heels · Sacrum · Elbows · Shoulders · Back of the head · Spine</b></td></tr>
    <tr><td><b>PRONE</b><br>(face down)</td><td><b>Toes · Knees · Genitalia (men) · Breasts (women) · Cheek and ear · Hips · Collar bone</b></td></tr>
    <tr><td><b>SIDE-LYING</b><br>(lateral)</td><td><b>Toes · Knee · Hip · Iliac crest · Ribs · Collar bone · Ear</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The rule behind all three lists</div><div class="big">Pressure injuries form over BONY PROMINENCES</div><div class="exp">You never have to memorize three lists. Picture the position and ask <b>where is bone closest to the skin with the body's weight on it</b>. Supine puts weight on the <b>sacrum and heels</b> — which is why those are the two most common sites overall.</div></div>
  <div class="hy"><span class="tag">Don't forget the ear</span><b>The ear appears in both prone and side-lying.</b> It is easy to miss on an assessment and it is a favorite exam detail, along with the <b>occiput</b> in a supine patient.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>Risk factors — his list</h3>
  <table class="lab">
    <tr><td><b>Immobility</b></td><td><b>Spinal cord injury</b></td></tr>
    <tr><td><b>Poor nutrition and dehydration</b></td><td><b>Altered level of consciousness</b></td></tr>
    <tr><td><b>Elderly</b></td><td><b>Neuropathy</b> (patients with diabetes)</td></tr>
    <tr><td><b>Fecal or urinary incontinence</b></td><td><b>Infection</b></td></tr>
  </table>
  <div class="hy"><span class="tag">The diabetic overlap</span><b>Neuropathy is on this list for a reason.</b> A diabetic patient cannot feel the pressure that would normally make them shift position, and poor perfusion means the injury will not heal. <b>Diabetes ties the skin chapter to the diabetes chapter</b>, and he can write a question that crosses both.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Staging — by tissue layer</h3>
  <table class="lab">
    <tr><th>Stage</th><th>Definition</th><th>How deep</th></tr>
    <tr><td><b>Stage 1</b></td><td><b>Intact skin with erythema.</b> <b>NONBLANCHABLE</b> — it does not whiten under pressure. <b>No open wound, break, or tear</b></td><td>Epidermis only, unbroken</td></tr>
    <tr><td><b>Stage 2</b></td><td><b>Skin is NOT intact.</b> <b>Partial-thickness</b> loss of the epidermis and <b>some dermis</b>. <b>Has NOT reached the subcutaneous layer</b></td><td>Through epidermis, into dermis</td></tr>
    <tr><td><b>Stage 3</b></td><td><b>Full-thickness</b> loss <b>down to the subcutaneous layer</b>. May have <b>undermining or tunneling</b>. <b>Has NOT reached muscle, tendon, or bone</b></td><td>Into subcutaneous fat</td></tr>
    <tr><td><b>Stage 4</b></td><td><b>Full-thickness</b> loss of epidermis, dermis, and subcutaneous tissue. <b>Muscle, tendon, and bone may be exposed</b></td><td>Down to muscle or bone</td></tr>
    <tr><td><b>Deep tissue injury</b></td><td><b>Skin is INTACT with purplish or deep red discoloration.</b> <b>NONBLANCHABLE.</b> <b>Skin can feel BOGGY</b></td><td>Damage started underneath</td></tr>
    <tr><td><b>Unstageable</b></td><td><b>Cannot be staged until the eschar or necrotic tissue is removed</b> to determine the depth</td><td>Unknown — that is the point</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Stage by asking two questions</div><div class="big">1. Is the skin intact? · 2. How far down does it go?</div><div class="exp"><b>Intact + nonblanchable red = Stage 1.</b> <b>Intact + purple and boggy = deep tissue injury.</b> Open and shallow = 2. Into the fat = 3. Muscle or bone showing = 4. <b>Covered so you cannot see the bottom = unstageable.</b></div></div>
  <div class="trap"><span class="tag">⭐ The two intact-skin ones</span><b>Stage 1 and deep tissue injury BOTH have intact, nonblanchable skin.</b> The difference is the <b>color and feel</b>: Stage 1 is <b>red</b>, deep tissue injury is <b>purple or deep red and feels boggy</b>. DTI means the damage began in the tissue <b>underneath</b> and will likely open up later.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ The goal, and the three nursing responsibilities</h3>
  <div class="mnem"><div class="tag">⭐ His stated main goal</div><div class="big">OFFLOAD the area to improve circulation and healing</div><div class="exp">Everything else is a method of offloading. If an option does not <b>take pressure off the tissue</b>, it is not treating the root problem.</div></div>
  <ol class="chainlist">
    <li><b>1. ASSESSMENT OF RISK</b> — screen every patient with a validated tool on admission and per policy.</li>
    <li><b>2. PREVENTION</b> — <b>restoring circulation</b> · <b>promoting mobility</b> · <b>treating underlying conditions</b> · <b>promoting nutrition</b>.</li>
    <li><b>3. TREATMENT</b> — decrease pressure, turn frequently, use pressure-reducing devices, wound care.</li>
  </ol>
  <div class="hy"><span class="tag">Risk screening tools</span>They score risk as <b>severe, high, moderate, or mild</b>. The domains are <b>Sensory · Moisture · Activity · Mobility · Nutrition · Friction</b> — <b>the lower the total score, the HIGHER the risk</b>, which is the part students reverse.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ The BRADEN SCALE — all six subscales</h3>
  <p class="why-chain">The most widely used pressure injury risk tool. Six subscales, each scored <b>1 to 4</b> except friction and shear which is <b>1 to 3</b>.</p>
  <table class="lab">
    <tr><th>Subscale</th><th>What it measures</th><th>Score 1 (worst)</th><th>Score 4 (best)</th></tr>
    <tr><td><b>1. Sensory perception</b></td><td>Ability to <b>feel and respond to pressure discomfort</b></td><td>Completely limited — unresponsive to painful stimuli</td><td>No impairment</td></tr>
    <tr><td><b>2. Moisture</b></td><td>Degree of skin <b>exposure to moisture</b></td><td>Constantly moist — perspiration, urine</td><td>Rarely moist</td></tr>
    <tr><td><b>3. Activity</b></td><td>Degree of <b>physical activity</b></td><td>Bedfast</td><td>Walks frequently</td></tr>
    <tr><td><b>4. Mobility</b></td><td>Ability to <b>change and control body position</b></td><td>Completely immobile</td><td>No limitations</td></tr>
    <tr><td><b>5. Nutrition</b></td><td>Usual <b>food intake pattern</b></td><td>Very poor — NPO, clear liquids, or eats less than a third of most meals</td><td>Excellent</td></tr>
    <tr><td><b>6. Friction and shear</b><br><span class="stem">scored 1–3 only</span></td><td>Whether the patient is <b>dragged across surfaces</b> or slides down in bed</td><td>Problem — requires maximum assistance, slides constantly</td><td>3 = No apparent problem</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The scoring direction students reverse</div><div class="big">Total 6 to 23 — the LOWER the score, the HIGHER the risk</div><div class="exp">It feels backwards. A 6 is a completely immobile, unresponsive, constantly moist, NPO patient. A 23 is fully independent. <b>Low number equals high danger.</b></div></div>
  <table class="lab">
    <tr><th>Total score</th><th>Risk level</th></tr>
    <tr><td><b>19 – 23</b></td><td>No risk</td></tr>
    <tr><td><b>15 – 18</b></td><td><b>MILD risk</b></td></tr>
    <tr><td><b>13 – 14</b></td><td><b>MODERATE risk</b></td></tr>
    <tr><td><b>10 – 12</b></td><td><b>HIGH risk</b></td></tr>
    <tr><td><b>9 or below</b></td><td><b>SEVERE risk</b></td></tr>
  </table>
  <div class="hy"><span class="tag">When it is done</span><b>On admission, then per facility policy</b> — commonly every 24 hours in acute care, with any change in condition, and on transfer. The score drives the intervention plan, so a falling score means the plan escalates.</div>
  <div class="trap"><span class="tag">⭐ Two ways he can write this</span>
  <b>1.</b> Give you a score and ask the risk level — remember <b>low number, high risk</b>.<br>
  <b>2.</b> Describe a patient and ask which subscale is most affected — an incontinent patient scores low on <b>moisture</b>, a sedated patient on <b>sensory perception</b>, a patient who <b>slides down in bed</b> on <b>friction and shear</b>.</div>
  <div class="hy"><span class="tag">Other tools you may see named</span><b>Norton Scale</b> — physical condition, mental condition, activity, mobility, incontinence. <b>Waterlow Scale</b> — used more in the UK. All work the same way: <b>domains scored, total predicts risk</b>.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ PREVENTION — the actual interventions</h3>
  <p class="why-chain">His four prevention headings are <b>restoring circulation, promoting mobility, treating underlying conditions, and promoting nutrition</b>. Here is what each one actually means at the bedside.</p>
  <table class="lab">
    <tr><th>Heading</th><th>What you actually do</th></tr>
    <tr><td><b>1. Restoring circulation</b></td><td><b>Reposition on a schedule</b> — every 2 hours in bed, <b>every 15 minutes in a chair</b> · <b>30-degree lateral tilt</b> rather than a full 90-degree side-lying · <b>float the heels off the bed entirely</b> · keep the <b>head of bed at or below 30 degrees</b> unless contraindicated, to limit sliding · <b>DO NOT massage over a bony prominence or reddened area</b> — it damages already-compromised capillaries</td></tr>
    <tr><td><b>2. Promoting mobility</b></td><td>Out of bed as tolerated · ambulate · <b>physical and occupational therapy</b> consults · active and passive range of motion · teach <b>wheelchair pushups or weight shifts every 15 minutes</b> · <b>trapeze bar</b> so the patient can lift rather than drag themselves</td></tr>
    <tr><td><b>3. Treating underlying conditions</b></td><td><b>Glycemic control</b> in diabetes · manage <b>incontinence</b> with a toileting schedule and barrier products · treat <b>infection</b> · optimize <b>perfusion and oxygenation</b> · address <b>anemia</b> · review drugs that impair healing such as <b>corticosteroids</b></td></tr>
    <tr><td><b>4. Promoting nutrition</b></td><td><b>High-protein, high-calorie</b> intake · <b>vitamin C and zinc</b> for collagen synthesis and wound healing · <b>adequate hydration</b> · <b>dietitian consult</b> · monitor <b>albumin and prealbumin</b> · supplements between meals · weigh regularly</td></tr>
  </table>
  <h4 style="margin:12px 0 4px">Skin care and moisture management</h4>
  <ul class="clean">
    <li><b>Inspect the skin at least daily</b>, and with every turn in high-risk patients — especially <b>sacrum, heels, and under devices</b>.</li>
    <li><b>Cleanse promptly after every incontinence episode</b> with a <b>pH-balanced no-rinse cleanser</b>, not soap and water repeatedly.</li>
    <li><b>Apply a moisture barrier</b> — zinc oxide or dimethicone — to protect from urine and stool.</li>
    <li><b>Use absorbent underpads that wick moisture AWAY</b> from the skin rather than trapping it.</li>
    <li><b>Do not use donut or ring cushions.</b> They concentrate pressure in a circle around the area and cause ischemia.</li>
    <li><b>Lift, never drag.</b> Use a slide sheet or mechanical lift to eliminate friction and shear.</li>
    <li>Keep skin <b>clean and dry but not over-dried</b> — moisturize dry skin, since cracked skin breaks down faster.</li>
  </ul>
  <div class="trap"><span class="tag">⭐ The two "helpful" actions that are wrong</span><b>Massaging a reddened bony prominence</b> and <b>using a donut cushion</b> both sound caring and both cause harm. Massage traumatizes compromised capillaries; donuts create a ring of ischemia.</div>
</div>

<div class="card">
  <h3>🛏️ Decreasing pressure — his four</h3>
  <table class="lab">
    <tr><th>Action</th><th>Why</th></tr>
    <tr><td><b>Remove lines and drains from under the patient</b></td><td>A tube under a hip creates a concentrated pressure point and can cause a <b>device-related injury</b> in hours</td></tr>
    <tr><td><b>Limit the use of briefs</b></td><td>They <b>trap moisture and heat</b>, which macerates skin and multiplies the damage pressure does</td></tr>
    <tr><td><b>Limit the layers of linens</b></td><td>Every added layer <b>reduces the effectiveness of a pressure-redistributing mattress</b> — the surface can no longer conform to the body</td></tr>
    <tr><td><b>Ensure linens are smooth and free from wrinkles</b></td><td>A wrinkle is a <b>line of concentrated pressure</b> pressed into the skin</td></tr>
  </table>
  <div class="hy"><span class="tag">⭐ Turning schedule</span><b>Turn every 2 hours in bed.</b> <b>Reposition every 15 MINUTES when sitting in a chair or wheelchair.</b> <b>Have the patient stand every hour</b> if able. Sitting concentrates the entire body weight on the <b>ischial tuberosities</b>, which is why the chair interval is so much shorter than the bed interval.</div>
  <div class="trap"><span class="tag">The interval he can test</span>Students answer "every 2 hours" for everything. <b>In a chair it is every 15 minutes.</b> That gap is exactly the kind of detail he builds a distractor from.</div>
</div>

<div class="card">
  <h3>🛠️ Pressure-reducing devices — the proper names</h3>
  <table class="lab">
    <tr><th>His slide said</th><th>Medical name</th><th>What it does</th></tr>
    <tr><td><b>Draw sheets</b></td><td><b>Friction-reducing device</b> — slide sheet, transfer sheet, or low-friction glide sheet</td><td>Lets you <b>LIFT rather than DRAG</b>, eliminating <b>friction and shear</b>. Shear is what tears the deeper tissue while the skin stays put</td></tr>
    <tr><td><b>Oxygen tubing padding</b></td><td><b>Medical device-related pressure injury (MDRPI) prophylaxis</b> — foam or hydrocolloid <b>prophylactic dressing</b></td><td>Cushions tubing, cannulas, masks, collars, and lines. <b>Device-related injuries are among the most common and most preventable</b></td></tr>
    <tr><td><b>Float boots</b></td><td><b>Heel suspension / offloading boots</b> — heel protector boots</td><td><b>Lift the heels completely OFF the mattress</b>, transferring the weight to the calf. Pillows under the calves do the same thing. <b>Heels have almost no tissue over bone</b>, which is why they are second only to the sacrum</td></tr>
    <tr><td><b>Positioning wedge</b></td><td><b>30-degree lateral positioning wedge</b> or turning wedge</td><td>Holds a <b>30-degree tilt</b> instead of a full 90-degree side-lying, which would put the entire body weight on the <b>greater trochanter</b></td></tr>
    <tr><td><b>Air mattress</b></td><td><b>Support surface</b> — <b>alternating pressure mattress</b>, <b>low-air-loss mattress</b>, or <b>air-fluidized bed</b></td><td><b>Alternating pressure</b> cycles inflation to shift the pressure points. <b>Low-air-loss</b> also manages moisture and heat. <b>Air-fluidized</b> is the highest level, used for multiple or non-healing full-thickness wounds</td></tr>

  <div class="mnem"><div class="tag">⭐ Two terms worth knowing by name</div><div class="big">Pressure REDISTRIBUTION vs pressure RELIEF</div><div class="exp"><b>Redistribution</b> spreads the load over a larger area — a standard foam or air mattress. <b>Relief</b> removes pressure from a site entirely — heel suspension boots, or turning. <b>Only relief truly offloads</b>, which is why devices never replace repositioning.</div></div>

</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>

<h2 class="sec-title"><span class="sec-emoji">👁️</span> Eye & Vision</h2>
<p class="intro-line">Glaucoma and cataracts are the big two. Know the mechanism: glaucoma = pressure damages the nerve (peripheral loss); cataract = cloudy lens (blurry, glare). But first — the foundational eye basics he explicitly said to know cold.</p>
<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Intraocular pressure — the numbers he gave</h3>
  <table class="lab">
    <tr><td><b>NORMAL IOP</b></td><td><b>10 – 20 mmHg</b></td></tr>
    <tr><td><b>Elevated</b></td><td><b>Greater than 21 mmHg</b></td></tr>
  </table>
  <div class="why-chain"><b>The mechanism:</b> aqueous humor is produced continuously and must drain. If the <b>drainage is obstructed</b>, fluid backs up and pressure rises. That pressure <b>compresses the blood supply to the optic nerve</b>, and the nerve dies from ischemia. <b>The damage is IRREVERSIBLE</b> — treatment protects what is left, it does not restore what is gone.</div>
  <div class="mnem"><div class="tag">⭐ Why glaucoma is called the silent thief</div><div class="big">Painless · gradual · peripheral first · permanent</div><div class="exp">Open-angle glaucoma destroys vision from the <b>outside edges inward</b>, and the brain fills in the missing field. Patients often do not notice until <b>substantial permanent loss</b> has happened. That is why <b>screening</b>, not symptoms, drives diagnosis.</div></div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ Where the drops actually go</h3>
  <ol class="chainlist">
    <li><b>1. Wash hands.</b> Have the patient <b>tilt the head back and look UP</b>.</li>
    <li><b>2. Pull the LOWER LID DOWN</b> to form a pouch — the <b>conjunctival sac</b>.</li>
    <li><b>3. ⭐ Place the drop INTO THE CONJUNCTIVAL SAC</b>, never directly onto the cornea. The cornea is exquisitely sensitive and a drop landing there triggers blinking that squeezes the medication out.</li>
    <li><b>4. Do NOT let the dropper tip touch the eye, lashes, or any surface</b> — that contaminates the bottle.</li>
    <li><b>5. Have the patient close the eye GENTLY.</b> <b>Do not squeeze shut</b> and do not rub — both pump the drug out.</li>
    <li><b>6. ⭐ PUNCTAL OCCLUSION — press the INNER CANTHUS (the corner nearest the nose) for 1 to 2 minutes.</b> This blocks the tear duct so the drug stays in the eye instead of draining into the nose and being <b>absorbed systemically</b>.</li>
    <li><b>7. Wait 5 MINUTES between different drops</b>, or the second washes out the first.</li>
    <li><b>8. Drops before ointment</b> if both are ordered.</li>
  </ol>
  <div class="trap"><span class="tag">⭐ Why punctal occlusion matters most with glaucoma drops</span><b>Timolol and the other beta blockers are systemically absorbed through the tear duct.</b> That is how an eye drop causes <b>bradycardia, hypotension, or bronchospasm</b>. Punctal occlusion is not a comfort measure — it is a safety intervention in patients with <b>asthma, COPD, heart block, or heart failure</b>.</div>
  <div class="hy"><span class="tag">Expected effect</span><b>Drops cause temporary blurred vision when first instilled.</b> Warn the patient, and have them <b>avoid driving</b> until it clears. Blurring is not a reason to stop a sight-saving drug.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ What raises IOP — the full list to avoid</h3>
  <table class="lab">
    <tr><th>Avoid</th><th>Why</th></tr>
    <tr><td><b>Heavy lifting · pushing · snow shoveling</b></td><td>All are <b>Valsalva</b> — straining against a closed glottis raises intrathoracic and intra-abdominal pressure, which backs up venous return and raises IOP</td></tr>
    <tr><td><b>Straining with a bowel movement</b></td><td>Same mechanism. This is why the diet emphasizes <b>adequate fluid, bulk, and fiber</b> — <b>preventing constipation is glaucoma care</b></td></tr>
    <tr><td><b>Bending at the waist · head below heart</b></td><td>Gravity increases venous congestion in the head. <b>Bend at the knees instead</b></td></tr>
    <tr><td><b>Tight or constricting clothing</b></td><td>Tight collars, ties, and belts impede venous drainage from the head</td></tr>
    <tr><td><b>Coughing, sneezing, vomiting, blowing the nose forcefully</b></td><td>All Valsalva. Treat a cough and control nausea</td></tr>
    <tr><td><b>⭐ Mydriatic and cycloplegic drops</b> (atropine, cyclopentolate)</td><td><b>Dilating the pupil closes the drainage angle</b> and can precipitate an acute attack. <b>Contraindicated in angle-closure glaucoma</b></td></tr>
    <tr><td><b>Anticholinergics and some antihistamines</b></td><td>They dilate the pupil as a side effect — the same problem by another route</td></tr>
    <tr><td><b>Prolonged corticosteroid use</b></td><td>A known <b>risk factor</b> for developing glaucoma, not just a trigger</td></tr>
  </table>
  <div class="hy"><span class="tag">Home safety for low vision</span>He raised this directly: <b>remove trip hazards</b> — throw rugs, cords, clutter in walkways. <b>Improve lighting</b>, especially stairways and at night. <b>Mark stair edges</b> with contrasting tape. Keep furniture in <b>consistent places</b>. Use <b>contrast</b> — dark plate on a light placemat. Hand rails, non-slip mats, and a clear path to the bathroom.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>👁️ Eye trauma — expanded</h3>
  <table class="lab">
    <tr><th>Injury</th><th>Presentation</th><th>Management</th></tr>
    <tr><td><b>Corneal abrasion</b><br><span class="stem">non-penetrating</span></td><td><b>Severe pain, tearing, photophobia, foreign-body sensation</b>, redness. Vision may blur</td><td>Fluorescein stain to visualize. Antibiotic drops or ointment, analgesia. <b>Do NOT patch routinely</b> in a contact-lens wearer. <b>No contacts until healed.</b> Most heal in 24–72 hours</td></tr>
    <tr><td><b>Superficial foreign body</b></td><td>Sensation of something in the eye, tearing, redness</td><td><b>Irrigate</b> to try to float it out. <b>Do not rub.</b> Evert the upper lid to inspect. If it does not irrigate out, <b>refer</b> — do not dig at it</td></tr>
    <tr><td><b>⭐ PENETRATING / impaled object</b></td><td>Visible object, irregular pupil, obvious globe disruption, vision loss</td><td><b>DO NOT REMOVE the object.</b> Removing it can let the eye lose its contents. <b>Stabilize it in place</b>, cover with a <b>rigid shield — never pressure</b>. <b>Patch BOTH eyes</b> to stop tracking movement. <b>NPO</b> in case of surgery. <b>Urgent referral</b></td></tr>
    <tr><td><b>⭐ CHEMICAL burn</b></td><td>Immediate severe pain, tearing, redness. <b>Alkali burns are worse than acid</b> — they keep penetrating</td><td><b>IRRIGATE IMMEDIATELY — this is the one true eye emergency where you act before anything else.</b> Copious water or saline, <b>15–20 minutes minimum</b>, from the <b>inner canthus OUTWARD</b> so you do not wash it into the other eye. <b>Do not delay to identify the chemical or find an antidote.</b> Remove contacts. Then refer</td></tr>
    <tr><td><b>Blunt trauma / hyphema</b></td><td><b>Blood visible in the anterior chamber</b>, pain, blurred vision</td><td><b>Elevate the head of bed 30–45 degrees</b> so the blood settles. <b>Rest, limit eye movement, no NSAIDs or aspirin</b> (bleeding risk). Watch for a <b>rise in IOP</b></td></tr>
    <tr><td><b>Orbital fracture</b></td><td><b>Diplopia</b>, restricted eye movement, sunken eye, numbness of the cheek, periorbital bruising</td><td>Ice, head elevated, <b>no nose blowing</b> — it forces air into the orbit. Imaging and referral</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The rule that covers all of them</div><div class="big">Chemical → FLUSH FIRST. Object → DO NOT REMOVE. Everything else → shield and refer.</div><div class="exp">Patching <b>both</b> eyes matters because the eyes <b>track together</b> — moving the good eye moves the injured one.</div></div>
</div>

<div class="card" style="border-color:var(--blue)">
  <h3>⭐ Snellen chart and visual acuity</h3>
  <div class="mnem"><div class="tag">⭐ How to read the fraction</div><div class="big">Top number = YOUR distance · Bottom number = the NORMAL eye's distance</div><div class="exp">Both numbers are in feet, and <b>the top is always 20</b> because that is how far you stand from the chart.</div></div>
  <table class="lab">
    <tr><th>Reading</th><th>What it means</th></tr>
    <tr><td><b>20/20</b></td><td><b>NORMAL vision.</b> You see at 20 feet what a normal eye sees at 20 feet</td></tr>
    <tr><td><b>20/80</b></td><td><b>What a person with normal vision can see at 80 feet, you can barely see at 20 feet.</b> Significantly reduced</td></tr>
    <tr><td><b>⭐ 20/200</b></td><td><b>LEGALLY BLIND</b> — in the better eye <b>with best correction</b>. What a normal eye sees at 200 feet, this person must be at 20 feet to see</td></tr>
    <tr><td><b>20/15</b></td><td><b>BETTER than normal.</b> You see at 20 feet what a normal eye must be at 15 feet to see</td></tr>
  </table>
  <div class="trap"><span class="tag">⭐ The direction that confuses people</span><b>A BIGGER bottom number means WORSE vision.</b> 20/200 is far worse than 20/40. It feels backwards because the number is getting bigger — but the bottom number is how close a <b>normal</b> eye could stand and still see it, so a big number means the normal eye had a huge advantage over you.</div>
  <div class="hy"><span class="tag">Legal blindness</span><b>20/200 or worse in the better eye with best correction</b>, OR a <b>visual field of 20 degrees or less</b> — severe tunnel vision counts even with sharp central acuity. It is the threshold for <b>disability eligibility</b> and services.</div>
  <div class="hy"><span class="tag">⭐ Presbyopia</span><b>Age-related stiffening of the lens.</b> The lens loses flexibility and can no longer change shape to focus up close, so reading material gets held <b>farther away</b>. Universal with aging, corrected with reading glasses or bifocals. <b>Not a disease</b> — distinguish it from cataract (clouding) and from <b>hyperopia</b> (farsightedness from eyeball shape).</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Glaucoma — from his handout</h3>
  <table class="lab">
    <tr><th></th><th>OPEN-ANGLE (chronic)</th><th>NARROW / ANGLE-CLOSURE</th></tr>
    <tr><td><b>How common</b></td><td><b>90% of all glaucoma cases</b></td><td>Much less common</td></tr>
    <tr><td><b>Onset</b></td><td><b>Develops slowly</b>, painless</td><td><b>SUDDEN</b> rise in IOP — an emergency</td></tr>
    <tr><td><b>Associated with</b></td><td><b>Diabetes</b> and <b>myopia</b></td><td><b>Eye trauma</b>, inflammatory processes, and <b>pupillary dilation after mydriatic drops</b></td></tr>
    <tr><td><b>Pain</b></td><td>None</td><td><b>Eye pain and pressure, headache, nausea and vomiting</b></td></tr>
    <tr><td><b>Pupil</b></td><td>Normal</td><td><b>FIXED, MID-DILATED</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The number from his handout</div><div class="big">Increased intraocular pressure = greater than 21 mmHg</div></div>
  <h4 style="margin:12px 0 4px">What the patient reports (subjective)</h4>
  <ul class="clean">
    <li><b>Gradual loss of PERIPHERAL vision</b> · blurred vision · <b>halos around lights</b> · headaches · <b>difficulty adjusting to dark rooms</b> · eye fatigue · <b>eye pain or pressure and nausea/vomiting in acute closed-angle</b></li>
  </ul>
  <h4 style="margin:12px 0 4px">What you assess (objective)</h4>
  <ul class="clean">
    <li><b>IOP over 21 mmHg</b> · decreased visual acuity · <b>reduced peripheral vision</b> · redness · <b>fixed mid-dilated pupil</b> in acute cases · <b>corneal cloudiness</b> · optic nerve changes · impaired night vision</li>
  </ul>
  <div class="hy"><span class="tag">Risk factors he listed</span>IOP elevation · family history · <b>age over 60</b> · <b>diabetes, hypertension, heart disease, sickle cell anemia</b> · <b>prolonged corticosteroid use</b> · previous eye injury or surgery · <b>thin corneas</b> · <b>African American or Asian ancestry</b></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Glaucoma teaching — the activity restrictions</h3>
  <div class="mnem"><div class="tag">⭐ Anything that raises intra-abdominal or intrathoracic pressure raises IOP</div><div class="big">Avoid heavy lifting · pushing · snow shoveling · tight or constricting clothing</div><div class="exp">All of those are <b>Valsalva</b>. Straining pushes pressure back into the eye. That is also why his handout pairs this with <b>adequate fluid, bulk, and fiber</b> — <b>to prevent constipation and straining on the toilet</b>.</div></div>
  <ul class="clean">
    <li><b>⭐ Eye drops are FOR LIFE.</b> Glaucoma is controlled, never cured, and <b>vision already lost does not come back</b>. Non-adherence is the main reason people go blind from it.</li>
    <li><b>Drops may cause blurred vision when first placed in the eye</b> — expected, and a safety issue for driving right afterward.</li>
    <li>Goals: stable IOP · correct self-administration · <b>no further vision loss</b> · independence in daily activities · <b>attends regular follow-up</b>.</li>
  </ul>
  <div class="trap"><span class="tag">⭐ Drops that make it worse</span><b>Any drug that DILATES the pupil raises IOP</b> and can trigger an angle-closure attack. That includes <b>mydriatics and cycloplegics like atropine</b>, and it is why his handout names <b>"pupillary dilation after the instillation of mydriatic drops"</b> as a cause of narrow-angle glaucoma.</div>
</div>

<div class="card">
  <h3>💊 Glaucoma drug classes — from his handout</h3>
  <table class="lab">
    <tr><th>Class</th><th>Drugs</th><th>What it does / cautions</th></tr>
    <tr><td><b>Beta blockers</b></td><td><b>Timolol</b> (Timoptic), betaxolol (Betoptic), carteolol (Ocupress), metipranolol, levobunolol (Betagan)</td><td><b>Decrease formation of aqueous humor</b> without changing pupil size, vision, or accommodation. <b>⭐ CONTRAINDICATED in greater than first-degree heart block, cardiogenic shock, or overt heart failure.</b> Monitor closely with <b>bradycardia or asthma</b></td></tr>
    <tr><td><b>Carbonic anhydrase inhibitors</b></td><td><b>Acetazolamide</b> (Diamox), dichlorphenamide (Daranide), methazolamide (Neptazane)</td><td><b>Decrease the RATE of aqueous humor production.</b> <b>Systemic effects are common</b> — mood disturbances, GI upset, fatigue</td></tr>
    <tr><td><b>Miotics</b></td><td><b>Pilocarpine</b> (Isopto Carpine, Ocusert disc, Pilopine HS gel)</td><td><b>Constrict the pupil</b> to open the drainage angle. Used in chronic open-angle and <b>in angle-closure until the pupil is constricted</b></td></tr>
    <tr><td><b>Sympathomimetics / adrenergics</b></td><td>Dipivefrin (Propine), <b>brimonidine</b> (Alphagan), epinephrine (Epifrin), apraclonidine (Iopidine), <b>latanoprost</b> (Xalatan)</td><td>Also <b>decrease formation of aqueous humor</b>; useful when other drugs fail. Free of miosis and night blindness, but can have <b>additive cardiovascular effects</b> with other cardiac drugs. <b>Light-colored eyes respond more strongly</b>, so dosing differs</td></tr>
  </table>
  <div class="trap"><span class="tag">The beta blocker trap</span>They are <b>eye drops</b>, but they are <b>systemically absorbed</b>. A patient with <b>asthma, bradycardia, heart block, or heart failure</b> can decompensate from a drop. Teach <b>punctal occlusion</b> and screen the cardiac and respiratory history before the first dose.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ Age-related Macular Degeneration (AMD)</h3>
  <p class="why-chain"><b>An age-related process in which CENTRAL vision gradually deteriorates.</b> The opposite field from glaucoma, and he can pair them in one question.</p>
  <table class="lab">
    <tr><th>Type</th><th>What happens</th></tr>
    <tr><td><b>DRY</b> (more common)</td><td><b>Macular drusen may coalesce</b> — yellow deposits build up and merge under the retina. Slow and gradual</td></tr>
    <tr><td><b>WET</b></td><td><b>Neovascular</b> — fragile new vessels grow and leak. Faster and more damaging. <b>More common in Caucasians than African Americans</b></td></tr>
  </table>
  <ul class="clean">
    <li><b>Signs:</b> <b>blurred vision</b> · <b>a blind spot in the MIDDLE of the visual field</b> · central vision loss beginning as a small blind spot that grows.</li>
    <li><b>Risk factors from his handout:</b> <b>increasing age</b> · <b>smoking history</b> · <b>hypertension</b> · overweight · <b>hyperopia</b> · familial incidence · <b>use of thyroid hormones and hydrochlorothiazide</b> · arthritis.</li>
  </ul>
  <div class="trap"><span class="tag">⭐ Verteporfin — the 5-day rule</span>After photodynamic therapy with <b>verteporfin</b>, the patient must <b>avoid direct sunlight and bright light for 5 DAYS</b>. The dye circulating near the skin surface <b>can be activated by strong light</b> and burn them. That includes <b>bright sunlight, tanning booths, halogen lights, dental office lights, and operating room lights</b>. This is the most testable single fact in the AMD section.</div>
  <div class="mnem"><div class="tag">⭐ Central vs peripheral</div><div class="big">AMD takes the CENTER. Glaucoma takes the PERIPHERY.</div><div class="exp">AMD patients cannot read or recognize faces but can navigate a room. Glaucoma patients see straight ahead but walk into things. He offers both fields as options.</div></div>
</div>

<div class="card">
  <h3>👁️ Cataract — from his handout</h3>
  <p class="why-chain"><b>A clouding of the eye's lens caused by a buildup of proteins.</b></p>
  <table class="lab">
    <tr><td><b>Causes</b></td><td><b>Older age</b> · <b>heavy alcohol use</b> · <b>smoking</b> · obesity · hypertension · <b>previous eye injuries</b> · history · <b>sun exposure</b> · <b>diabetes</b> · <b>exposure to x-rays</b></td></tr>
    <tr><td><b>Signs</b></td><td><b>Cloudy or dim vision</b> · <b>increasing difficulty with night vision</b> · <b>sensitivity to light</b> · <b>halos around lights</b> · <b>frequent prescription changes</b> · <b>fading of colors</b> · <b>double vision in ONE eye</b></td></tr>
    <tr><td><b>Diagnostics</b></td><td><b>Visual acuity</b> · <b>slit lamp exam</b> · <b>retinal exam</b></td></tr>
    <tr><td><b>Prevention / management</b></td><td>Protect from <b>UV rays</b> · regular eye exams · <b>smoking cessation</b> · antioxidants · healthy weight · <b>keep diabetes controlled</b></td></tr>
    <tr><td><b>⭐ Surgery</b></td><td><b>Phacoemulsification</b> — <b>sound waves break the lens up, then it is suctioned out</b>. <b>Extracapsular cataract extraction (ECCE)</b> — removal of the lens</td></tr>
    <tr><td><b>Nursing diagnoses</b></td><td><b>Risk for injury</b> · <b>disturbed visual sensory perception</b> · anxiety · knowledge deficit</td></tr>
  </table>
  <div class="trap"><span class="tag">⭐ Halos belong to two conditions</span><b>Both cataracts and glaucoma cause halos around lights.</b> The difference: cataract is <b>cloudy, painless, gradual, with fading colors and frequent prescription changes</b>. Acute glaucoma brings <b>PAIN, nausea, and a fixed mid-dilated pupil</b>. Double vision <b>in one eye</b> is cataract-specific.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🚨 Eye trauma — his three rules</h3>
  <ol class="chainlist">
    <li><b>1. FLUSH chemical exposures</b> immediately — copious water or saline, from the inner canthus outward so you do not wash it into the other eye. Continue for 15–20 minutes and do not delay to find an antidote.</li>
    <li><b>2. DO NOT REMOVE impaled objects.</b> Removing one can cause the eye to lose its contents. <b>Stabilize it in place.</b></li>
    <li><b>3. USE AN EYE PATCH</b> — and for a penetrating injury, a <b>rigid shield rather than pressure</b>. Patching <b>both</b> eyes limits movement, since the eyes track together.</li>
  </ol>
  <div class="trap"><span class="tag">The instinct to fix it</span>Any option that <b>removes the object</b>, <b>applies pressure to a penetrating injury</b>, or <b>delays flushing a chemical to look up what it was</b> is wrong. Flush first, stabilize, shield, transport.</div>
</div>


<div class="card" style="border-color:var(--purple)">
  <h3>👁️ What the lens actually does (3 jobs)</h3>
  <ul class="clean">
    <li><b>UV filter</b> — blocks damaging ultraviolet light from reaching the retina.</li>
    <li><b>Accommodation</b> — the lens changes SHAPE (gets rounder for near objects, flatter for distance) to keep the image in focus.</li>
    <li><b>Refraction</b> — the lens bends incoming light so it focuses precisely on the retina.</li>
  </ul>
  <div class="hy">⭐ <b>Why this matters:</b> as we age, the lens gradually thickens and stiffens, which directly limits its ability to accommodate — that's the mechanism behind presbyopia (below). Everything downstream starts here.</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>🔍 Refractive errors — where does the light actually focus?</h3>
  <table class="lab">
    <tr><th>Term</th><th>What's happening</th></tr>
    <tr><td><b>Emmetropia</b></td><td>Normal — light focuses directly ON the retina without correction. This is 20/20.</td></tr>
    <tr><td><b>Myopia</b></td><td>Nearsighted — light focuses IN FRONT of the retina (eyeball too long / cornea too curved). Close objects clear, distance blurry.</td></tr>
    <tr><td><b>Hyperopia</b></td><td>Farsighted — light focuses BEHIND the retina (eyeball too short). Distance clear, close objects blurry.</td></tr>
    <tr><td><b>Astigmatism</b></td><td>Irregular curvature of the cornea/lens — causes blurred or distorted vision at ANY distance, near or far.</td></tr>
    <tr><td><b>Presbyopia</b></td><td>Age-related loss of accommodation (usually >40) — the lens has stiffened and can no longer focus up close. This is why reading glasses become necessary with age even in people who never needed correction before.</td></tr>
  </table>
  <div class="mnem"><div class="tag">Mnemonic</div><div class="big">"Myopia = can't see the MOUNTAIN (far). Hyperopia = can't see what's HANDHELD (near)."</div></div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>👀 Pupil response &amp; pupil size — the terms he wants you to distinguish</h3>
  <ul class="clean">
    <li><b>Direct response:</b> shine light in ONE eye → THAT SAME eye's pupil constricts.</li>
    <li><b>Consensual response:</b> shine light in ONE eye → the OTHER eye's pupil ALSO constricts, even though no light was shone into it directly (the two sides are neurologically linked).</li>
    <li><b>Miosis</b> = pupil CONSTRICTION (gets smaller). Caused by opioids, pilocarpine, bright light, parasympathetic response.</li>
    <li><b>Mydriasis</b> = pupil DILATION (gets bigger). Caused by anticholinergics, dim light, sympathetic ("fight or flight") response, some abnormal neuro findings.</li>
  </ul>
  <div class="hy">⭐ <b>Don't mix these two pairs up</b> — direct/consensual describes HOW you're testing (which eye reacts), while miosis/mydriasis describes WHICH DIRECTION the pupil is changing. A question can test either pairing separately.</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>📏 Visual acuity — how to actually read the fraction</h3>
  <p class="why-chain">The Snellen fraction is <b>[distance the patient stands from the chart] / [distance a person with NORMAL vision could read that same line from]</b>. The patient always stands 20 feet away — it's the BOTTOM number that changes and tells you how good or bad their vision is.</p>
  <div class="hy">⭐ <b>Worked example:</b> a person with <b>20/40</b> vision can see from 20 feet what a person with normal (20/20) vision could see from <b>40 feet</b> away. In other words, they have to be CLOSER to see what someone with normal vision can see from farther back — so a LARGER bottom number always means WORSE vision, not better.</div>
</div>

<div class="card">
  <h3>👓 Glaucoma — pressure kills the optic nerve</h3>
  <p class="why-chain"><b>Mechanism:</b> aqueous humor can't drain → intraocular pressure (IOP) rises → pressure damages the <b>optic nerve</b> → vision lost from the <b>periphery inward</b> (tunnel vision). Normal IOP = <b>10–21 mmHg</b>.</p>
  <table class="lab">
    <tr><th></th><th>Open-angle (common)</th><th>Angle-closure (emergency)</th></tr>
    <tr><td><b>Onset</b></td><td>Gradual, painless</td><td>SUDDEN</td></tr>
    <tr><td><b>Symptoms</b></td><td>Peripheral vision loss (tunnel vision), halos; often silent early</td><td>Severe eye pain, headache, halos, nausea/vomiting, blurred vision, rock-hard eye, fixed pupil</td></tr>
    <tr><td><b>Priority</b></td><td>Lifelong drops to lower IOP</td><td><b>MEDICAL EMERGENCY</b> — treat immediately to save sight</td></tr>
  </table>
  <ul class="clean">
    <li><b>Treatment:</b> eye drops that lower IOP (reduce fluid production or improve drainage) — e.g., beta-blockers (timolol), prostaglandins, miotics.</li>
    <li><b>Lost vision is permanent</b> — treatment prevents further loss, doesn't restore it. So adherence to drops is critical.</li>
  </ul>
  <div class="hy">⭐ <b>Glaucoma = peripheral loss first (tunnel vision).</b> Contrast with macular degeneration = <b>central</b> vision loss. Casteel loves this contrast.</div>
</div>

<div class="card">
  <h3>🌫️ Cataracts — cloudy lens</h3>
  <ul class="clean">
    <li><b>Mechanism:</b> the lens becomes opaque/cloudy → light can't pass through clearly.</li>
    <li><b>Key causes to know:</b> <b>aging (#1 cause)</b>, <b>eye injury/trauma</b>, <b>diabetes</b> (glucose alters lens proteins), and <b>beta-blocker use</b>.</li>
    <li><b>Symptoms:</b> painless, gradual <b>blurred/hazy vision, glare, halos around lights, difficulty at night</b>, faded colors.</li>
    <li><b>Treatment:</b> surgical lens removal + intraocular lens implant (only real fix).</li>
    <li><b>Post-op teaching:</b> avoid bending, lifting, straining, coughing (raises IOP); wear eye shield especially at night; report sudden pain or vision changes (could signal complication).</li>
  </ul>
</div>

<div class="card">
  <h3>👁️ Two more to know</h3>
  <ul class="clean">
    <li><b>Macular degeneration (AMD):</b> loss of <b>CENTRAL</b> vision (opposite of glaucoma); peripheral stays. Uses the <b>Amsler grid</b> to monitor (report wavy/distorted lines). Leading cause of vision loss in older adults.</li>
    <li><b>Retinal detachment:</b> the retina peels away → <b>sudden floaters, flashes of light, "curtain" coming down over vision</b>. This is an <b>emergency</b> — needs prompt surgery to save vision.</li>
  </ul>
  <div class="mnem"><div class="tag">Mnemonic</div><div class="big">"Glaucoma = Gone from the sides. Macular = Missing the middle."</div></div>
</div>


<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — which vision goes first</span><b>Glaucoma takes peripheral vision first. Macular degeneration takes central vision first.</b> He reverses them in at least one option every time.</div>
  <div class="trap"><span class="tag">Trap 2 — lens vs optic nerve</span><b>Cataract is a cloudy lens</b> causing painless blur and glare. <b>Glaucoma is a pressure problem</b> damaging the optic nerve. Swapping the two structures is his most common eye distractor.</div>
  <div class="trap"><span class="tag">Trap 3 — permanence</span>Vision lost to glaucoma is <b>permanent</b>. Drops prevent further loss; they do not restore it. Any option promising restoration is wrong.</div>
  <div class="trap"><span class="tag">Trap 4 — the emergency triad</span>Sudden severe pain, colored halos, nausea, and a rock-hard globe is <b>acute angle-closure glaucoma</b>. Flashes and floaters with a curtain is <b>retinal detachment</b>. Both are emergencies and both get offered for the other's stem.</div>
  <div class="trap"><span class="tag">Trap 5 — timolol is systemic</span>It is a beta-blocker in a bottle. Teach <b>punctal occlusion</b> after instilling, and watch for bradycardia and bronchospasm. "It cannot cause side effects outside the eye" is written to sound reassuring.</div>
</div>

  {q:'Which term matches this definition: "Light focuses in front of the retina because the eyeball is too long or the cornea too curved"?',type:'single',
   opts:['Myopia','Astigmatism','Presbyopia','Hyperopia'],correct:0,
   rat:'This is the classic matching trap — four real terms, only one fits this exact mechanism. Hyperopia is the opposite (focuses behind), astigmatism is an irregular-curvature problem (not a focal-point-location problem), and presbyopia is an age-related accommodation problem, not a focal-length problem. This description is myopia specifically.'},

  {q:'Which definition correctly matches "presbyopia"?',type:'single',
   opts:['Age-related loss of accommodation, usually after 40','Blurred vision at all distances from an irregular cornea','Sudden loss of central vision in older adults','Farsightedness present since childhood'],correct:0,
   rat:'A describes hyperopia (though presbyopia is often confused with it), C describes astigmatism, and D describes macular degeneration — all real conditions affecting similar age groups, which is exactly what makes this pairing tricky. Presbyopia specifically is the age-related STIFFENING of the lens itself limiting near focus.'},

  {q:'Which term matches this definition: "The SAME eye that received the light constricts"?',type:'single',
   opts:['Mydriasis','Consensual response','Accommodation','Direct response'],correct:3,
   rat:'Consensual response describes the OTHER eye reacting, not the same one — an easy swap. Mydriasis and accommodation are real pupil/lens terms but describe something different entirely (dilation, and lens shape-changing). "Same eye reacts" is specifically the direct response.'},

  {q:'Which term matches this definition: "Pupil dilation, often triggered by dim light, anticholinergic drugs, or a sympathetic response"?',type:'single',
   opts:['Miosis','Mydriasis','Presbyopia','Direct response'],correct:1,
   rat:'Miosis is the direct opposite (constriction) — the most common mix-up on this pair since the words sound so similar. Direct response is about WHICH eye reacts, not which direction the pupil moves. Mydriasis is dilation specifically.'},

  {q:'Which definition correctly matches "open-angle glaucoma"?',type:'single',
   opts:['A cloudy lens that scatters light and causes glare','Sudden severe pain, halos, and nausea from a rapid IOP spike','The iris physically blocks the drainage angle, causing a sudden pressure spike','The drainage angle is anatomically open but drains too slowly'],correct:3,
   rat:'A and C both describe angle-closure glaucoma\'s mechanism and presentation — the most classic trap on this topic, since both are still technically "glaucoma." D describes cataracts, an entirely different eye structure. Open-angle glaucoma is specifically the SLOW, anatomically-open-but-inefficient drainage pattern.'},

  {q:'Which definition correctly matches "acute angle-closure glaucoma"?',type:'single',
   opts:['Gradual, painless peripheral vision loss discovered incidentally on a routine exam','Sudden severe eye pain, halos around lights, nausea, and a firm globe — a true emergency','Painless, progressive blurry vision with glare that is worse at night','A blank or wavy spot in the center of the visual field'],correct:1,
   rat:'A describes open-angle glaucoma\'s presentation, C describes cataracts, and D describes macular degeneration — three real, testable conditions that all get compared against glaucoma. Angle-closure is the SUDDEN, PAINFUL, emergency version.'},

  {q:'Which term matches this definition: "Central vision loss with peripheral vision preserved"?',type:'single',
   opts:['Presbyopia','Open-angle glaucoma','Macular degeneration','Angle-closure glaucoma'],correct:2,
   rat:'Both glaucoma types are the classic wrong-answer trap here, since glaucoma causes the OPPOSITE pattern (peripheral loss, central preserved). Presbyopia affects near-focus ability, not a specific visual field location. Central loss with peripheral sparing specifically describes macular degeneration.'},

  {q:'Which term matches this definition: "Flashes of light and floaters followed by a curtain or shadow moving across part of the vision"?',type:'single',
   opts:['Acute angle-closure glaucoma','Retinal detachment','Macular degeneration','Cataracts'],correct:1,
   rat:'Angle-closure glaucoma is painful with halos (not flashes/floaters/curtain), macular degeneration is a gradual central blur (not a sudden curtain), and cataracts are gradual glare/haziness with no curtain at all. The flashes → floaters → curtain sequence specifically describes retinal detachment.'},

  {q:'Which definition correctly matches "cataracts"?',type:'single',
   opts:['Increased pressure inside the eye damaging the optic nerve','Progressive clouding of the normally clear lens, causing glare and gradual blurry vision','A tear in the retina separating it from its blood supply','Central retinal tissue thinning causing a blank spot in the middle of vision'],correct:1,
   rat:'A describes glaucoma\'s mechanism, C describes macular degeneration, and D describes retinal detachment — again, four real conditions the exam wants you to correctly sort. Cataracts are specifically a LENS clouding problem, not a pressure, retina, or macula problem.'},

  {q:'Which term matches this definition: "Sees at 20 feet what a person with normal vision sees at 40 feet"?',type:'single',
   opts:['Presbyopia','20/20 vision','20/40 visual acuity','Legally blind'],correct:2,
   rat:'20/20 is the normal baseline this description is being compared AGAINST, not the answer itself — an easy mix-up if you read too fast. "Legally blind" is a much more severe, specific classification not indicated by this description alone. This description is the definition of 20/40 visual acuity.'}
],'Eye & Vision Check');
