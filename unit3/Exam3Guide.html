<h2 class="sec-title"><span class="sec-emoji">🎓</span> Med-Surg 1 Challenge</h2>
<p class="intro-line">Written at true Med-Surg 1 / NCLEX difficulty — multi-value lab vignettes, prioritization across several patients, sequencing, and delegation. This is the level his exam actually operates at.</p>

<div class="card" style="border-color:var(--purple)">
  <h3>🧭 What makes these harder</h3>
  <ul class="clean">
    <li><b>Recognize cues</b> — pull the relevant data out of a longer vignette (some details are distractors).</li>
    <li><b>Analyze &amp; prioritize</b> — decide which finding matters MOST, not just which ones are abnormal.</li>
    <li><b>Sequence &amp; delegate</b> — decide WHAT to do first, and WHO can safely do it (RN vs. LPN vs. UAP).</li>
  </ul>
</div>

<div class="card" style="border-color:var(--purple);text-align:center">
  <button class="btn vision-toggle-btn" onclick="toggleHotOnly()" style="background:var(--purple)">🔥 High-Yield Only: OFF</button>
</div>

<div id="quiz-challenge"></div>
`;

renderFilteredQuiz('quiz-challenge',[
  {topic:'general',q:'The nurse reviews morning labs for four clinic patients. Which result meets the diagnostic criteria for diabetes and requires provider follow-up today?',type:'single',
   opts:['A. A 48-year-old with a hemoglobin A1C of 6.1%','B. A 58-year-old with a fasting blood glucose of 111 mg/dL','C. A 62-year-old with a hemoglobin A1C of 8.4%','D. A 40-year-old with a random glucose of 150 mg/dL and no symptoms'],correct:2,
   rat:'The trap: B (111) and A (6.1%) both fall in the PREDIABETES range, not diagnostic — easy to overreact to. D is an isolated random glucose without symptoms, which doesn\'t meet criteria alone. An A1C of 8.4% is well above the ≥6.5% diagnostic threshold and reflects sustained hyperglycemia — this is the one that needs same-day follow-up.'},

  {topic:'general',q:'A client asks how their insulin pump works. Which explanation is correct?',type:'single',
   opts:['A. It releases programmed doses of NPH insulin into the bloodstream at set intervals throughout the day','B. It delivers a small continuous dose of rapid- or short-acting insulin subcutaneously, with the client able to self-administer a bolus before meals','C. It is surgically attached to the pancreas and delivers regular insulin directly into pancreatic tissue','D. It continuously infuses NPH insulin while automatically adjusting the rate based on continuous glucose readings'],correct:1,
   rat:'The trap: A and D both insert NPH into the answer — NPH is never used in insulin pumps because pumps require a rapid- or short-acting insulin for the basal/bolus model to work safely. C invents a surgical attachment that doesn\'t exist. Pumps deliver continuous subcutaneous basal insulin with patient-triggered mealtime boluses.'},

  {topic:'general',q:'A client with DKA has an initial glucose of 950 mg/dL. After several hours on an IV insulin drip with 0.9% NS, the glucose is now 240 mg/dL. What should the nurse prepare to administer next?',type:'single',
   opts:['A. An ampule of 50% dextrose to prevent further glucose drop','B. NPH insulin subcutaneously to transition off the drip','C. IV fluids containing dextrose so the insulin drip can safely continue','D. Phenytoin to prevent seizures from the rapid glucose change'],correct:2,
   rat:'The trap: A treats the glucose drop as an emergency requiring a large dextrose bolus, when the correct move is a controlled addition of dextrose-containing fluids so the drip can keep running. B introduces the wrong insulin type at the wrong time (NPH is never used to "transition off" an active DKA drip). D is an unrelated and unsupported intervention. Once glucose approaches ~200-250, dextrose is added to the IV fluids so the insulin can keep clearing ketones without causing hypoglycemia.'},

  {topic:'general',q:'An older adult with type 2 diabetes is admitted with pneumonia, glucose 620 mg/dL, and serum osmolality 330 mOsm/kg. Which nursing action is the PRIORITY?',type:'single',
   opts:['A. Continuous cardiac monitoring, since fluid and insulin therapy will shift potassium significantly','B. Administering sodium bicarbonate to correct the expected acidosis','C. Encouraging light exercise to help lower the blood glucose','D. Preparing for likely endotracheal intubation given the severity of the hyperglycemia'],correct:0,
   rat:'The trap: B assumes DKA-style acidosis is present, but this vignette is HHS — no acidosis to correct. C is actively dangerous in a profoundly dehydrated, hyperosmolar patient. D isn\'t indicated by anything in the vignette. Cardiac monitoring is the priority because HHS treatment (fluids + insulin) causes major potassium shifts, and this patient is older with likely cardiac vulnerability.'},

  {topic:'general',q:'The nurse is caring for four patients on a medical-surgical floor. Which patient should the nurse assess FIRST?',type:'single',
   opts:['A. A patient with a Braden Scale score of 18 who was just repositioned','B. A patient with type 2 diabetes and a glucose of 180 mg/dL after breakfast','C. A patient with a healing Stage 2 pressure injury due for a scheduled dressing change','D. A patient with a Braden Scale score of 9 who has not been repositioned in 3 hours'],correct:3,
   rat:'The trap: A Braden score of 18 sounds low-risk-adjacent but is actually the cutoff for "at risk" — not the most urgent finding here. B is a mildly elevated, expected postprandial glucose. C is routine, scheduled care. A Braden score of 9 indicates SEVERE risk, and combined with 3 hours without repositioning, this patient has the highest immediate risk for a new pressure injury — assess and reposition first.'},

  {topic:'general',q:'A patient is positioned in the right lateral recumbent position for an extended period. Which sites are at HIGHEST risk for pressure injury in this position? (Select all that apply)',type:'multi',
   opts:['A. Right hip (greater trochanter)','B. Right ear','C. Sacrum','D. Right shoulder','E. Right ankle/malleolus'],correct:[0,1,3,4],
   rat:'The trap: sacrum (C) is a SUPINE pressure point, not a side-lying one — a common mix-up. In right lateral recumbent, weight bears on the right-side structures: ear, shoulder, hip/greater trochanter, and ankle/malleolus (plus ribs and knee) — not the sacrum, which only bears weight when lying on the back.'},

  {topic:'eye',q:'A client is scheduled for cataract surgery in 5 days. Which instruction should the nurse reinforce for the pre-operative period?',type:'single',
   opts:['A. Continue all home medications, including aspirin, exactly as prescribed until the day of surgery','B. Avoid lifting or straining with objects heavier than approximately 10-15 pounds even before surgery','C. Plan for a 2-3 day inpatient hospital stay following the procedure','D. Begin using an eye patch continuously starting 3 days before surgery'],correct:1,
   rat:'The trap: A ignores that medications increasing bleeding risk (like aspirin) are typically addressed before eye surgery per provider instruction, C wildly overstates the length of stay (cataract surgery is same-day outpatient), and D describes a post-op measure, not a pre-op one. Avoiding heavy lifting/straining (which raises IOP) is reinforced both before and especially after surgery.'},

  {topic:'eye',q:'A client had retinal detachment surgery with gas tamponade placed to help flatten the retina. Which nursing action is the PRIORITY immediately post-op?',type:'single',
   opts:['A. Encourage ambulation to promote circulation','B. Position the client\'s head as specifically prescribed by the surgeon','C. Apply a warm compress to reduce swelling','D. Remove the eye shield to assess visual acuity hourly'],correct:1,
   rat:'The trap: A, C, and D all sound like generic post-surgical care but miss what\'s unique here — with a gas bubble in place, HEAD POSITIONING is what keeps the bubble pressed against the detached area to help it heal. Positioning per the surgeon\'s specific instructions (often face-down or a particular tilt) is the priority, and the shield stays on per protocol rather than being removed for frequent checks.'},

  {topic:'eye',q:'A client with early dry age-related macular degeneration asks what single lifestyle change would MOST slow disease progression. What is the BEST response?',type:'single',
   opts:['A. "Quitting smoking has been shown to significantly slow the progression of macular degeneration."','B. "Wearing dark sunglasses indoors will prevent further vision loss."','C. "Avoiding all screen time will protect your remaining central vision."','D. "Taking a daily multivitamin will reverse the damage already done."'],correct:0,
   rat:'The trap: B, C, and D all sound like reasonable protective habits but aren\'t supported — indoor sunglasses and screen avoidance don\'t meaningfully change progression, and no supplement reverses existing damage (AREDS2-type formulations may slow, not reverse, progression). Smoking cessation has the strongest evidence for slowing dry AMD progression specifically.'},

  {topic:'eye',q:'A client with chronic open-angle glaucoma, well-controlled on topical drops, reports subtle, gradual changes in their vision over the past month. What should the nurse recognize this finding as requiring?',type:'single',
   opts:['A. Reassurance, since gradual changes are expected and not clinically significant in treated glaucoma','B. Reassessment of intraocular pressure, since gradual vision changes can indicate the current regimen is no longer adequately controlling IOP','C. An urgent same-day emergency evaluation for angle-closure glaucoma','D. Discontinuation of the current eye drops due to treatment failure'],correct:1,
   rat:'The trap: A dismisses a finding that actually warrants follow-up, C escalates to the WRONG type of glaucoma emergency (angle-closure presents with sudden severe pain, not gradual change), and D jumps straight to stopping treatment without reassessment first. Gradual vision change in a previously stable glaucoma patient signals the IOP may no longer be adequately controlled and needs to be checked — not ignored, and not treated as the acute angle-closure emergency.'},

  {topic:'general',q:'Which task related to a diabetic client\'s foot care can the RN safely delegate to unlicensed assistive personnel (UAP)?',type:'single',
   opts:['A. Assessing a new client\'s feet for the first time and documenting baseline neuropathy findings','B. Teaching the client how to perform daily foot inspections at home','C. Reporting to the RN if the UAP notices redness, drainage, or a new wound while helping with morning hygiene care','D. Determining whether a callus should be trimmed by the client or referred to a podiatrist'],correct:2,
   rat:'The trap: A, B, and D all involve assessment, teaching, or clinical decision-making, which remain RN responsibilities and cannot be delegated. Reporting an observation the UAP happens to notice during routine hygiene care (not performing a clinical assessment) is within their scope — they observe and report, the RN assesses and decides.'},

  {topic:'general',q:'A nurse reviews four sets of vital signs and glucose values at the start of a shift. Which combination of findings requires the MOST immediate action?',type:'single',
   opts:['A. Glucose 68 mg/dL, patient asymptomatic, due for breakfast in 10 minutes','B. Glucose 250 mg/dL, patient asymptomatic, scheduled insulin due in 30 minutes','C. Glucose 48 mg/dL, patient diaphoretic and confused, last rapid-acting insulin given 40 minutes ago','D. Glucose 190 mg/dL, patient reports mild thirst'],correct:2,
   rat:'The trap: A looks low but is asymptomatic with food imminent — reasonable to monitor rather than treat aggressively. B and D are both mild-to-moderate hyperglycemia findings that can wait for scheduled care. C combines a genuinely low glucose WITH active neuroglycopenic symptoms (confusion) during the insulin\'s likely peak action window — this patient needs treatment now, not after rounds.'},

  {topic:'general',q:'A client recovering from DKA has a repeat potassium of 3.0 mEq/L six hours after starting the insulin drip, down from an initial 5.3 mEq/L. What does the nurse recognize about this trend?',type:'single',
   opts:['A. This is an unexpected and dangerous lab error that should be immediately repeated before any action is taken','B. This is the expected effect of insulin therapy driving potassium back into cells, and it requires close monitoring with likely potassium replacement','C. This indicates the insulin drip should be discontinued immediately due to overcorrection','D. This indicates the patient is developing a new, unrelated renal problem'],correct:1,
   rat:'The trap: A dismisses a real and anticipated trend as an error, C jumps to stopping a needed treatment, and D invents an unrelated diagnosis. Insulin therapy is EXPECTED to drive serum potassium down as it shifts back into cells — this drop from 5.3 to 3.0 is the anticipated trend that requires close monitoring and replacement, not alarm or treatment cessation.'},

  {topic:'general',q:'A 68-year-old with Type 2 diabetes (on glyburide and lisinopril), stage 3 CKD (eGFR 42), and a Braden score of 15 is admitted for a scheduled cardiac catheterization requiring IV contrast. Pre-procedure labs show potassium 5.2 mEq/L. Which combination of actions should the nurse anticipate or question?',type:'single',
   opts:['A. Continue all home medications unchanged and proceed with the procedure as scheduled','B. Question continuing the glyburide given the renal function, anticipate holding the lisinopril given the potassium level, and confirm a plan for post-procedure renal monitoring given the contrast exposure','C. Discontinue all diabetes and blood pressure medications permanently in preparation for the procedure','D. Proceed as scheduled, since none of these findings are related to each other'],correct:1,
   rat:'A treats every home medication as automatically safe to continue despite three separate red flags in this vignette. C overcorrects with a permanent discontinuation instead of a procedure-specific hold. D misses that all three findings — reduced renal clearance, an ACE/ARB-related hyperkalemia risk, and contrast exposure — connect through the same kidney-function thread. The correct synthesis questions glyburide (renal clearance risk), anticipates holding lisinopril (potassium already elevated), and flags the contrast\'s added renal burden — three related concerns from one underlying issue, not three coincidences.'},

  {topic:'general',q:'A client with Type 1 diabetes and a Braden score of 16 is recovering from a DKA admission. On day 2, the nurse notes the client has been NPO since midnight for a procedure, the sliding-scale insulin order is still active, and the client\'s heel appears intact but slightly duskier than surrounding skin under a pressure-relief boot. Which of the following reflects the BEST synthesis of priorities for this shift?',type:'single',
   opts:['A. Hold all insulin since the client is NPO, and address the heel finding at the end of the shift once the procedure is complete','B. Clarify the insulin order given the NPO status (basal needs still exist even without meals), and reassess the heel finding now given the client\'s combined diabetes/pressure-injury risk factors','C. Administer the full scheduled insulin dose as if the client were eating normally, and remove the pressure-relief boot until after the procedure','D. Defer both issues until the primary provider is available, since neither is an emergency'],correct:1,
   rat:'A treats "NPO" as synonymous with "no insulin needed," which ignores that basal insulin needs continue independent of eating — a common and dangerous assumption. C makes the opposite error by ignoring the NPO status entirely, and also removes a protective device without justification. D defers two findings that both warrant action within the shift, not at end-of-shift or by a provider not yet available. The correct synthesis: clarify/adjust the insulin plan for NPO status without stopping it outright, AND address the early skin finding promptly given this client\'s combined risk factors (diabetes impairs perfusion/healing, Braden 16 is at-risk) — two related, same-shift priorities, not one deferred to later and one handled incorrectly.'},

  {topic:'eye',q:'A client with diabetes, hypertension, and a recent diagnosis of early diabetic retinopathy is being evaluated for a new medication regimen. The provider is considering a beta-blocker for blood pressure control. Which additional client history detail would be MOST important for the nurse to clarify before this medication is started?',type:'single',
   opts:['A. Whether the client has a personal or family history of cataracts, since beta-blockers are a recognized cataract risk factor and this adds relevant information to the client\'s overall eye-health picture','B. Whether the client prefers tablets or liquid formulations','C. Whether the client has ever had a seasonal allergy','D. Whether the client\'s last eye exam was more than 5 years ago, since retinopathy findings expire after that time'],correct:0,
   rat:'B and C are both reasonable-sounding routine intake questions but have no particular relevance to this specific clinical decision. D invents a rule about retinopathy findings "expiring" that isn\'t how monitoring for a progressive condition works. Since beta-blocker use is a recognized cataract risk factor, and this client already has documented early retinopathy (indicating active diabetic eye disease), clarifying cataract history adds relevant context to the overall risk-benefit picture for this specific medication choice — connecting a systemic medication decision back to this client\'s existing eye findings is the actual clinical reasoning skill being tested.'},

  {topic:'eye',q:'Match each finding to the condition it belongs to. A client reports: (1) a blank spot in the center of their vision with wavy lines when reading, (2) sudden flashes with a shadow creeping across one side of vision, (3) gradual loss of side vision with normal reading vision, (4) painless glare and haziness that\'s worse driving at night. Which condition pairs correctly with finding (2)?',type:'single',
   opts:['A. Macular degeneration','B. Retinal detachment','C. Open-angle glaucoma','D. Cataracts'],correct:1,
   rat:'Finding (1) is macular degeneration, (3) is glaucoma, and (4) is cataracts — all real matches embedded in the same vignette, which is exactly the multi-item matching format to expect. Finding (2), the sudden flashes with a shadow/curtain crossing the vision, is the classic retinal detachment sequence.'},

  {topic:'eye',q:'Which of the following are TRUE statements about intraocular pressure and glaucoma? (Select all that apply)',type:'multi',
   opts:['A. Normal IOP is roughly 10-21 mmHg','B. Open-angle glaucoma typically presents with a sudden, severely painful eye','C. Angle-closure glaucoma can cause the globe to feel firm or hard on palpation','D. Vision already lost from glaucoma can be restored with consistent drop use','E. Glaucoma medications are generally a lifelong treatment, not a cure'],correct:[0,2,4],
   rat:'B describes angle-closure\'s presentation, not open-angle (which is gradual and painless) — a reversed-pairing trap. D is a dangerous misconception: glaucoma damage is permanent, drops only prevent further loss. A, C, and E are all accurate.'},

  {topic:'eye',q:'A client is 2 hours post-op from cataract surgery and reports mild itching around the eye shield and a scratchy sensation, rated 1/10. Vital signs are stable. What is the nurse\'s BEST action?',type:'single',
   opts:['A. Remove the shield to inspect the eye and relieve the itching','B. Reassure the client that mild itching/scratchiness is expected post-op and reinforce not to rub the eye','C. Notify the surgeon immediately for a possible complication','D. Apply ice directly to the surgical eye'],correct:1,
   rat:'A removes a protective device over a mild, expected finding — the shield stays on per protocol regardless of minor discomfort. C escalates a benign, expected sensation to an urgent report, which could cause "alarm fatigue" if overused for non-concerning findings. Mild itching/scratchiness after eye surgery is expected; the teaching point is reassurance plus reinforcing not to rub, not to remove protective equipment or escalate unnecessarily.'},

  {topic:'eye',q:'Place the following in the correct order a nurse should suspect and respond to sudden flashes of light with new floaters in one eye, progressing over an hour to a shadow across part of the visual field: (1) recognize this as a possible retinal detachment, (2) notify the ophthalmology provider urgently, (3) obtain a focused history of onset and progression, (4) prepare the client for likely urgent surgical evaluation. Which comes FIRST?',type:'single',
   opts:['A. Notify the ophthalmology provider urgently','B. Obtain a focused history of onset and progression','C. Prepare the client for likely urgent surgical evaluation','D. Recognize this as a possible retinal detachment'],correct:3,
   rat:'This is a sequencing/ordered-response style item — several of these steps DO need to happen quickly, which is what makes picking the very first one tricky. Before you can gather focused history, notify the provider, or prepare for surgery, you first have to RECOGNIZE the pattern (flashes → floaters → curtain) as a possible retinal detachment — recognition drives everything that follows.'},

  {topic:'eye',q:'A 55-year-old with Type 2 diabetes for 12 years is due for their annual eye exam. Which finding, if present, would be MOST important for the nurse to ensure gets communicated to the ophthalmologist before the visit?',type:'single',
   opts:['A. The client has needed reading glasses for the past several years','B. The client reports new-onset floaters and a sensation of a curtain over part of one eye\'s vision','C. The client\'s vision has been stable and unchanged for the past year','D. The client wears sunglasses regularly when outdoors'],correct:1,
   rat:'A, C, and D all describe routine, non-urgent history that could reasonably come up at any eye visit. B describes symptoms consistent with a possible retinal detachment — a time-sensitive finding that shouldn\'t simply wait for a routine annual visit; it needs to be flagged and addressed urgently, not mentioned in passing during a scheduled appointment.'},

  {topic:'eye',q:'A client asks the nurse to explain why their new diagnosis of open-angle glaucoma requires eye drops "for the rest of my life" rather than a one-time treatment. Which explanation is correct?',type:'single',
   opts:['A. The eye drops cure the underlying drainage problem within a few months of consistent use','B. The eye drops control eye pressure, but the optic nerve damage already present cannot be reversed, and unmanaged pressure will cause further damage','C. Lifelong drops are only a precaution and could be stopped once vision feels normal again','D. The eye drops are only needed until cataract surgery can be performed'],correct:1,
   rat:'A promises a cure that doesn\'t exist for this disease process. C dangerously suggests self-discontinuation based on subjective feeling rather than objective pressure control. D conflates glaucoma treatment with an unrelated procedure. The accurate explanation is that damage already done is permanent, but ongoing pressure control prevents further loss — treatment is lifelong because the disease process is ongoing, not because of an arbitrary precaution.'},

  {topic:'eye',q:'Which of the following clients should the nurse recognize as having risk factors for cataract development? (Select all that apply)',type:'multi',
   opts:['A. A client with Type 2 diabetes','B. A client on long-term oral corticosteroids','C. A client with a history of blunt eye trauma','D. A client with a family history of hearing loss','E. A client on long-term beta-blocker therapy'],correct:[0,1,2,4],
   rat:'D introduces a family history of a completely different sensory system (hearing) with no established cataract link, making it the odd one out. Diabetes, steroid use, eye trauma, and beta-blocker use are all recognized cataract risk factors.'},

  {topic:'eye',q:'A client with diagnosed macular degeneration asks why their peripheral vision still lets them navigate a room independently despite significant reading difficulty. What is the BEST explanation?',type:'single',
   opts:['A. Macular degeneration is currently in remission','B. The macula (central retina) is affected, but the peripheral retina — responsible for peripheral vision — remains intact','C. The client\'s brain has fully compensated for total vision loss','D. This finding is unusual and suggests a misdiagnosis'],correct:1,
   rat:'A invents a remission concept that doesn\'t apply here, C overstates brain compensation as if vision were fully restored, and D wrongly treats an expected, textbook finding as a diagnostic red flag. This preserved-periphery-with-lost-center pattern is exactly what defines macular degeneration — it\'s expected, not unusual.'},

  {topic:'eye',q:'A client with a history of angle-closure glaucoma in one eye is being evaluated for a bowel prep procedure that includes an anticholinergic medication for sedation. Which assessment finding would be MOST important to obtain before this medication is given?',type:'single',
   opts:['A. The client\'s usual bowel movement pattern','B. Current eye pain, redness, or vision changes that could indicate the glaucoma is active or unstable','C. Whether the client has ever worn contact lenses','D. The client\'s preferred position for the procedure'],correct:1,
   rat:'A, C, and D are all reasonable pre-procedure questions in general, but none address the SPECIFIC interaction being tested. Since anticholinergics can dilate the pupil and risk triggering an angle-closure attack, assessing current eye status before administering one is the clinically relevant priority for this particular client.'},

  {topic:'eye',q:'A client recovering from cataract surgery in the left eye reports sudden, severe pain and a noticeable decrease in vision on post-op day 1. Which is the nurse\'s PRIORITY action?',type:'single',
   opts:['A. Document the finding and reassess at the next scheduled visit','B. Notify the surgeon immediately, since this combination suggests a possible post-op complication','C. Apply a warm compress and administer the prescribed pain medication only','D. Remove the eye shield to visually inspect the surgical site'],correct:1,
   rat:'A delays action on a finding that doesn\'t fit the expected mild post-op course. C treats the pain in isolation without addressing the vision change, and D risks disturbing the healing eye without provider guidance. Sudden severe pain WITH a vision decrease is not an expected post-op finding — it can signal hemorrhage or infection and needs prompt surgeon notification.'},

  {topic:'eye',q:'A client with diabetes asks why their ophthalmologist recommends an annual dilated eye exam even though their vision "feels fine." What is the BEST explanation?',type:'single',
   opts:['A. Diabetic retinopathy can progress significantly before the client notices any vision changes, so screening catches damage early','B. The exam is simply a routine formality with no real diagnostic value if vision feels normal','C. Annual exams are only necessary once vision changes have already been noticed','D. Feeling fine means retinopathy is very unlikely and the exam could reasonably be skipped'],correct:0,
   rat:'B, C, and D all treat the absence of symptoms as reassurance that screening is unnecessary — exactly the mindset the exam exists to overcome. Diabetic retinopathy can cause significant, sometimes irreversible damage before the client notices any change in vision, which is precisely why proactive annual screening (not waiting for symptoms) is recommended.'}
],'Med-Surg 1 Level Challenge');
</script>

<script>
/* ===== WRONG ANSWER VAULT SECTION ===== */
function renderVaultSection(){
  const host=document.getElementById('sec-vault');
  if(!host)return;
  if(wrongVault.length===0){
    host.innerHTML=`
    <h2 class="sec-title"><span class="sec-emoji">🗄️</span> Wrong Answer Vault</h2>
    <p class="intro-line">Every question you miss anywhere in this guide — Why Engine, Decoder, Diabetes, DKA/HHS, all of it — automatically lands here so you can drill your actual weak spots instead of re-reviewing everything.</p>
    <div class="card"><div class="vault-empty">🎉<br><b>Your vault is empty!</b><br>Either you haven't missed anything yet, or you've already cleared it out. Go answer some questions — anything you get wrong will show up here automatically.</div></div>`;
    return;
  }
  let html=`
    <h2 class="sec-title"><span class="sec-emoji">🗄️</span> Wrong Answer Vault</h2>
    <p class="intro-line">These are the exact questions you've missed, pulled from every section. Re-answer them here — get one right and it clears itself out of the vault.</p>
    <div class="card" style="border-color:var(--red)">
      <h3>📋 ${wrongVault.length} question${wrongVault.length===1?'':'s'} to review</h3>
      <button class="btn" style="background:var(--red)" onclick="if(confirm('Clear the entire vault? This cannot be undone.')){wrongVault=[];saveVault();document.getElementById('vaultCount').textContent='0';renderVaultSection();}">🗑️ Clear entire vault</button>
    </div>
  `;
  wrongVault.forEach(entry=>{
    html+=`<div class="card" id="vaultcard-${entry.id.replace(/[^a-zA-Z0-9-]/g,'')}">
      <span class="vault-tag">${entry.source||'Review'}</span>
      <div class="q-text">${entry.q}</div>
      <div class="opts" id="vopts-${entry.id.replace(/[^a-zA-Z0-9-]/g,'')}"></div>
      <div class="rationale" id="vrat-${entry.id.replace(/[^a-zA-Z0-9-]/g,'')}"><b>Rationale:</b> ${entry.rat}</div>
    </div>`;
  });
  host.innerHTML=html;
  wrongVault.forEach(rawEntry=>{
    const entry=prepareQuestion(rawEntry);
    const safeId=rawEntry.id.replace(/[^a-zA-Z0-9-]/g,'');
    const optsHost=document.getElementById('vopts-'+safeId);
    const ratHost=document.getElementById('vrat-'+safeId);
    if(entry.type==='multi'){
      const chosen=new Set();
      entry.opts.forEach((o,i)=>{
        const btn=document.createElement('button'); btn.className='opt'; btn.innerHTML=o;
        btn.onclick=()=>{ if(chosen.has(i)){chosen.delete(i);btn.classList.remove('sel-multi');}else{chosen.add(i);btn.classList.add('sel-multi');} };
        optsHost.appendChild(btn);
      });
      const sub=document.createElement('button'); sub.className='submit-multi'; sub.textContent='Check Answer';
      sub.onclick=()=>{
        const correct=new Set(entry.correct);
        let allRight=chosen.size===correct.size;
        optsHost.querySelectorAll('.opt').forEach((b,i)=>{
          b.classList.add('disabled');
          if(correct.has(i))b.classList.add('correct');
          else if(chosen.has(i)){b.classList.add('wrong');allRight=false;}
        });
        ratHost.classList.add('show'); sub.style.display='none';
        if(allRight){
          const solved=document.createElement('div'); solved.className='vault-solved'; solved.textContent='✅ Correct! Removing from vault...';
          optsHost.parentElement.appendChild(solved);
          setTimeout(()=>{ removeFromVault(rawEntry.id); const el=document.getElementById('vaultcard-'+safeId); if(el)el.remove(); if(wrongVault.length===0)renderVaultSection(); },900);
        }
      };
      optsHost.appendChild(sub);
    } else {
      entry.opts.forEach((o,i)=>{
        const btn=document.createElement('button'); btn.className='opt'; btn.innerHTML=o;
        btn.onclick=()=>{
          optsHost.querySelectorAll('.opt').forEach(b=>b.classList.add('disabled'));
          const gotItRight = i===entry.correct;
          if(gotItRight)btn.classList.add('correct');
          else{ btn.classList.add('wrong'); optsHost.querySelectorAll('.opt')[entry.correct].classList.add('correct'); }
          ratHost.classList.add('show');
          if(gotItRight){
            const solved=document.createElement('div'); solved.className='vault-solved'; solved.textContent='✅ Correct! Removing from vault...';
            optsHost.parentElement.appendChild(solved);
            setTimeout(()=>{ removeFromVault(entry.id); const el=document.getElementById('vaultcard-'+safeId); if(el)el.remove(); if(wrongVault.length===0)renderVaultSection(); },900);
          }
        };
        optsHost.appendChild(btn);
      });
    }
  });
}
</script>

  {topic:'monday',front:'What are Kussmaul respirations, and why do they happen?',back:'Deep, rapid breathing — the body blows off CO₂ to compensate for the metabolic acidosis of DKA.'},
  {topic:'monday',front:'What is the treatment order for DKA/HHS?',back:'1) IV fluids first, 2) IV regular insulin, 3) monitor/replace potassium, 4) add dextrose once glucose nears 200-250.'},
  {topic:'monday',front:'Why give fluids before insulin in DKA/HHS?',back:'The patient is severely dehydrated — insulin first can worsen hypotension and cause dangerous fluid shifts.'},

  {topic:'monday',front:'Why never give oral treatment to an unconscious patient?',back:'Aspiration risk — they cannot safely protect their airway or swallow.'},
  {topic:'monday',front:'Adrenergic (early) signs of hypoglycemia?',back:'Shaky, sweaty, tachycardic, hungry, anxious.'},
  {topic:'monday',front:'Neuroglycopenic (late) signs of hypoglycemia?',back:'Confusion, slurred speech, seizures, loss of consciousness.'},

  {topic:'monday',front:'What is LADA?',back:'"Type 1.5" — slow-onset autoimmune beta-cell destruction that presents in adulthood, often mistaken for Type 2 at first.'},

  {topic:'monday',front:'What is the "three-hit combo" behind diabetic foot ulcers?',back:'Neuropathy (can\'t feel injury) + peripheral vascular disease (can\'t heal) + hyperglycemia (feeds infection).'},
  {topic:'monday',front:'Describe a Stage 1 pressure injury.',back:'Intact skin with non-blanchable redness.'},

  {topic:'monday',front:'What makes a pressure injury "unstageable"?',back:'The base is covered by slough/eschar, so the true depth can\'t be determined until it\'s removed.'},

  {topic:'monday',front:'Why should you NEVER massage a reddened area over a bony prominence?',back:'The tissue is already damaged — massage can rupture fragile capillaries and worsen the injury.'},
  {topic:'eye',front:'What vision loss pattern does open-angle glaucoma cause?',back:'Gradual, painless peripheral (tunnel) vision loss.'},
  {topic:'eye',front:'What does acute angle-closure glaucoma look like?',back:'Sudden severe eye pain, halos, nausea, a firm/hard globe — a true emergency.'},
  {topic:'eye',front:'Normal intraocular pressure (IOP) range?',back:'10–21 mmHg.'},
  {topic:'eye',front:'What causes cataracts?',back:'Progressive clouding/opacification of the normally clear lens.'},
  {topic:'eye',front:'Classic cataract symptoms?',back:'Painless blurry/hazy vision, glare and halos, worse at night, faded colors.'},
  {topic:'eye',front:'What vision loss pattern does macular degeneration cause?',back:'Central vision loss with peripheral vision preserved — the opposite pattern from glaucoma.'},
  {topic:'eye',front:'What is the classic symptom sequence of retinal detachment?',back:'Flashes of light → floaters → a curtain or shadow over part of the vision.'},
  {topic:'eye',front:'Why is retinal detachment a surgical emergency?',back:'Detached retina loses its blood supply and will die — vision loss becomes permanent the longer it\'s delayed.'},
  {topic:'ear',front:'What causes conductive hearing loss?',back:'A physical blockage in the outer/middle ear — wax, fluid, infection, perforated eardrum — often reversible.'},
  {topic:'ear',front:'What causes sensorineural hearing loss?',back:'Damage to the cochlea\'s hair cells or auditory nerve — usually permanent.'},
  {topic:'ear',front:'Name common ototoxic drug classes.',back:'Aminoglycosides, loop diuretics (furosemide), high-dose aspirin/salicylates, some chemotherapy agents.'},
  {topic:'ear',front:'What is the classic triad of Ménière\'s disease?',back:'Episodic vertigo + tinnitus + fluctuating sensorineural hearing loss.'},
  {topic:'ear',front:'What diet/medication is the cornerstone of Ménière\'s treatment?',back:'Low-sodium diet plus diuretics, to reduce inner-ear fluid pressure.'},
  {topic:'ear',front:'What is the nursing priority during an acute Ménière\'s attack?',back:'Fall safety — have the patient lie still in a quiet, dark room.'},
  {topic:'eye',front:'What are the 3 functions of the eye\'s lens?',back:'UV filter, accommodation (changing shape to focus), and refraction (bending light onto the retina).'},
  {topic:'eye',front:'What is myopia and what causes it?',back:'Nearsightedness — light focuses IN FRONT of the retina (eyeball too long or cornea too curved). Near is clear, distance is blurry.'},
  {topic:'eye',front:'What is hyperopia and what causes it?',back:'Farsightedness — light focuses BEHIND the retina (eyeball too short). Distance is clear, near objects are blurry.'},
  {topic:'eye',front:'What is astigmatism?',back:'Irregular curvature of the cornea/lens causing blurred or distorted vision at ANY distance.'},
  {topic:'eye',front:'What is presbyopia and who does it affect?',back:'Age-related loss of accommodation (usually >40) from a stiffening lens — makes it hard to focus up close.'},
  {topic:'eye',front:'What is emmetropia?',back:'Normal vision — light focuses directly on the retina without correction. This is 20/20.'},
  {topic:'eye',front:'What is the difference between a direct and a consensual pupillary response?',back:'Direct = the SAME eye that got the light constricts. Consensual = the OTHER eye (not directly lit) also constricts.'},

  {topic:'eye',front:'What does a visual acuity of 20/40 actually mean?',back:'The patient sees at 20 feet what a person with normal vision sees at 40 feet — their vision is WORSE than normal (bigger bottom number = worse vision).'},

let drillList=[], drillIdx=0, drillScore=0, drillStreak=0, drillBest=0, drillAnswered=false;
const DRILL_ROUND=20;
function startDrill(){
  const pool = hotOnlyGlobal ? DRILL_POOL.filter(q=>['eye','dka','diabetes'].includes(q.topic)) : DRILL_POOL;
  drillList=shuffle(pool.slice()).slice(0,Math.min(DRILL_ROUND,pool.length));
  drillIdx=0; drillScore=0; drillStreak=0; drillAnswered=false;
  renderDrillQ();
}
function renderDrillQ(){
  const host=document.getElementById('drillBody');
  if(drillIdx>=drillList.length){ return drillFinish(); }
  const qRaw=drillList[drillIdx];
  let q=qRaw;
  if(shuffleAnswers){
    const order=shuffle(qRaw.o.map((_,i)=>i));
    q={...qRaw, o:order.map(i=>qRaw.o[i]), c:order.indexOf(qRaw.c)};
  }
  drillList[drillIdx]=q;
  drillAnswered=false;
  let opts=q.o.map((o,i)=>`<button class="opt" onclick="answerDrill(${i})">${o}</button>`).join('');
  host.innerHTML=`
    <div class="drill-top"><span>Q ${drillIdx+1} / ${drillList.length}</span><span>✅ ${drillScore} 🔥 ${drillStreak}</span></div>
    <div class="drill-bar"><div class="drill-bar-fill" style="width:${(drillIdx/drillList.length)*100}%"></div></div>
    <div class="quiz-card"><div class="q-text">${q.q}</div><div class="opts" id="drillOpts">${opts}</div><div class="rationale" id="drillRat"></div></div>
    <div class="center"><button class="btn ghost" id="drillNextBtn" style="display:none" onclick="nextDrill()">Next ➡️</button></div>`;
}
function answerDrill(i){
  if(drillAnswered)return; drillAnswered=true;
  const q=drillList[drillIdx];
  document.querySelectorAll('#drillOpts .opt').forEach((b,idx)=>{
    b.classList.add('disabled');
    if(idx===q.c)b.classList.add('correct');
    if(idx===i&&i!==q.c)b.classList.add('wrong');
  });
  const rat=document.getElementById('drillRat');
  if(i===q.c){drillScore++;drillStreak++;if(drillStreak>drillBest)drillBest=drillStreak;rat.innerHTML='✅ <b>Correct!</b> '+q.r;}
  else{drillStreak=0;rat.innerHTML='❌ <b>Not quite.</b> '+q.r;}
  rat.classList.add('show'); bumpProgress('drill-'+drillIdx);
  document.getElementById('drillNextBtn').style.display='inline-block';
}
function nextDrill(){ drillIdx++; renderDrillQ(); }
function drillFinish(){
  const pct=Math.round(drillScore/drillList.length*100);
  let msg=pct>=90?'🌟 Outstanding!':pct>=75?'💪 Test-ready zone!':pct>=60?'📈 Getting there — run it again.':'🌱 Keep drilling.';
  document.getElementById('drillBody').innerHTML=`
    <div class="card center" style="border-color:var(--teal)">
      <h2 style="margin-top:0">Round Complete!</h2>
      <div class="drill-final">${drillScore} / ${drillList.length} (${pct}%)</div>
      <p>Best streak: 🔥 ${drillBest}</p><p>${msg}</p>
      <button class="btn" onclick="startDrill()" style="background:linear-gradient(90deg,var(--teal),var(--green))">🔀 New Shuffled Round</button>
    </div>`;
}
document.getElementById('sec-drill').innerHTML=`
  <h2 class="sec-title"><span class="sec-emoji">⚡</span> Rapid Drill</h2>
  <p class="intro-line">A fresh, reshuffled ${DRILL_ROUND}-question round every time — instant feedback, score, and streak. Quick reps between study blocks.</p>

  <div class="center" style="margin:10px 0"><button class="btn vision-toggle-btn" onclick="toggleHotOnly()" style="background:var(--purple)">🔥 High-Yield Only: OFF</button></div>
  <div id="drillBody"></div>`;
startDrill();
</script>

{topic:'dka',q:'The nurse is teaching about metformin. Which side effect is common?',o:['GI upset with nausea and diarrhea','Hypoglycemia when used alone','Progressive loss of vision','Hyperkalemia from renal effects'],c:0,t:'single',r:'Metformin commonly causes GI upset; it does not cause hypoglycemia by itself.'},
{topic:'diabetes',q:'Which insulins can be mixed in the same syringe?',o:['Regular and NPH','NPH and detemir','Glargine and regular','No insulins can be mixed'],c:0,t:'single',r:'Regular and NPH can be mixed (clear before cloudy). Long-acting insulins are never mixed.'},
{topic:'dka',q:'A key difference in HHS management vs DKA is:',o:['No IV fluids are needed in HHS management','No glucose monitoring is required during treatment','Insulin is not needed to reverse acidosis, there is none','Bicarbonate is given routinely instead of insulin'],c:2,t:'single',r:'HHS has no acidosis, so insulin is for glucose, not acid reversal; fluids are even more central.'},
{topic:'complications',q:'Which statement about A1C is correct?',o:['It changes hour to hour with intake','It shows the glucose value from today','It measures circulating insulin levels','It reflects average glucose over about 3 months'],c:3,t:'single',r:'A1C = ~3-month average glucose.'},
{topic:'ear',q:'A patient with peripheral neuropathy describes their symptoms as:',o:['Sharp central chest pain with exertion','Sudden painless loss of vision in one eye','Numbness and burning in a stocking-glove pattern','A constant high-pitched ringing in the ears'],c:2,t:'single',r:'Peripheral neuropathy = stocking-glove numbness/burning starting in toes/fingers.'},
{topic:'dka',hot:true,q:'Which is the priority teaching to prevent DKA?',o:['Reduce protein intake to lower ketone load','Never omit insulin, especially when ill','Cut back on exercise to conserve glucose','Avoid all carbohydrates in the daily diet'],c:1,t:'single',r:'Omitting insulin during illness is the top DKA cause — never stop it.'},
{topic:'eye',q:'A patient with glaucoma must understand that eye drops:',o:['Cure the disease within a few months','Will restore the vision already lost','Must be used lifelong to control the pressure','Are optional once pressure normalizes'],c:2,t:'single',r:'Drops control IOP for life; they prevent further loss but don\'t restore vision.'},
{topic:'dka',q:'Which are signs of hypoglycemia? (SATA)',o:['Sweating','Tachycardia','Confusion','Fruity breath','Shakiness'],c:[0,1,2,4],t:'multi',r:'Sweating, shakiness, tachycardia (adrenergic) and confusion (neuro) are hypoglycemia. Fruity breath is DKA.'},
{topic:'skin',q:'A patient with a Stage 4 pressure injury needs which nutrition focus?',o:['Low protein to reduce the metabolic burden','Fluid restriction to reduce wound drainage','High protein with adequate calories for healing','Low calorie intake to prevent extra weight'],c:2,t:'single',r:'Wound healing needs protein and calories; correct albumin/protein deficits.'},
{topic:'skin',q:'Which describes proper diabetic foot washing?',o:['Use very hot water to improve circulation','Wash and dry daily, especially between the toes','Soak the feet for an hour to soften the skin','Avoid washing the feet to keep skin intact'],c:1,t:'single',r:'Wash and dry daily (dry between toes); avoid hot water (burn risk) and long soaking.'},
{topic:'eye',q:'A patient reports halos around lights and gradual peripheral vision loss. This suggests:',o:['Conjunctivitis','Retinal detachment','Open-angle glaucoma','Cataract only'],c:2,t:'single',r:'Gradual peripheral loss + halos = open-angle glaucoma.'},
{topic:'ear',q:'Which is TRUE of sensorineural hearing loss?',o:['Reliably cured by ear irrigation','Almost always reversible with time','Most often caused by impacted earwax','Usually permanent, from nerve or cochlear damage'],c:3,t:'single',r:'Sensorineural = permanent inner-ear/nerve damage. Conductive is often reversible.'},
{topic:'dka',q:'The nurse should question a potassium order in DKA if:',o:['Insulin is running','The patient is urinating well','Potassium is low','The patient has no urine output'],c:3,t:'single',r:'Hold K⁺ if the patient isn\'t urinating (K⁺ can build to dangerous levels) or if K⁺ is high.'},
{topic:'diabetes',q:'Which is the earliest sign the body gives during a drop in blood sugar?',o:['Fruity breath odor with deep rapid respirations','Loss of consciousness progressing to coma','Generalized tonic-clonic seizure activity','Adrenergic symptoms: shaky, sweaty, fast heart rate'],c:3,t:'single',r:'Adrenaline release causes early shaky/sweaty/tachycardic symptoms before neuro signs.'},
{topic:'complications',q:'A patient with diabetic gastroparesis (autonomic neuropathy) should:',o:['Fast all day','Only drink liquids forever','Eat large fatty meals','Eat small, low-fat meals'],c:3,t:'single',r:'Gastroparesis (delayed emptying) → small, low-fat meals help.'},
{topic:'ear',hot:true,q:'Which is the priority during an acute vertigo attack in Ménière\'s?',o:['Offer a large meal for strength','Ambulate the patient down the hall','Turn on bright overhead lights','Ensure safety and prevent falls'],c:3,t:'single',r:'Fall prevention is the priority; keep the patient still in a calm environment.'},
{topic:'eye',q:'What is the mechanism behind diabetic retinopathy?',o:['Elevated intraocular pressure from poor drainage','Clouding of the lens from protein denaturation','Damage to tiny retinal vessels from chronic hyperglycemia','Compression of the optic nerve by orbital swelling'],c:2,t:'single',r:'Chronic high glucose damages the retina\'s microvessels → retinopathy.'},
{topic:'diabetes',q:'A patient asks how to prevent Type 2 diabetes complications. Best answer:',o:['Taking daily vitamins is the main strategy','Nothing can be done to change the outcome','Tight glucose, BP, and lipid control plus lifestyle','Avoiding medical follow-up reduces the stress'],c:2,t:'single',r:'Controlling glucose, BP, and lipids plus lifestyle changes prevents/slows complications.'},
{topic:'diabetes',q:'Which insulin is rapid-acting and given right with meals?',o:['Lispro','Glargine','Regular','NPH'],c:0,t:'single',r:'Lispro (rapid) is given with food (~15 min onset).'},
{topic:'skin',q:'A patient with a new Stage 2 pressure injury needs a dressing that:',o:['Keeps the wound dry and open to air','Maintains a moist wound environment','Applies heat','Uses no dressing'],c:1,t:'single',r:'Wounds heal best in a moist (not wet/dry) environment.'},
{topic:'eye',q:'The nurse notes a diabetic patient\'s breath smells fruity. This suggests:',o:['Cataracts','Hypoglycemia','DKA (ketones)','Good control'],c:2,t:'single',r:'Fruity/acetone breath = ketones = DKA.'},
{topic:'complications',q:'Which action helps prevent diabetic retinopathy progression?',o:['Regular dilated eye exams with glucose and BP control','Avoiding eye exams to reduce dilation exposure','Nothing changes the course once it begins','Wearing sunglasses outdoors as the main measure'],c:0,t:'single',r:'Early detection (regular exams) plus glucose and BP control slows progression.'},
{topic:'diabetes',q:'Which findings make up metabolic syndrome? (SATA)',o:['Low HDL / high LDL or triglycerides','Hypertension','Hyperinsulinemia with insulin resistance','Polycythemia','Central obesity (waist >40 in men, >35 in women)'],c:[0,1,2,4],t:'multi',r:'Metabolic syndrome = central obesity + HTN + dyslipidemia + hyperinsulinemia/insulin resistance. It\'s a risk cluster, not a complication.'},
{topic:'dka',hot:true,q:'A slow-onset autoimmune diabetes discovered in adulthood, initially mistaken for Type 2, is called:',o:['Gestational diabetes','HHS','Prediabetes','LADA (\"Type 1.5\")'],c:3,t:'single',r:'LADA = autoimmune beta-cell destruction like Type 1, but slower and in adults — often misdiagnosed as Type 2 at first.'},
{topic:'dka',hot:true,q:'Which is a function of insulin besides moving glucose into cells? (SATA)',o:['Helps move potassium into cells','Stimulates glucagon release','Stores excess glucose as fat','Blocks fat breakdown (lipolysis)','Produces ketones'],c:[0,2,3],t:'multi',r:'Insulin stores glucose as fat, blocks lipolysis, and pushes K⁺ into cells. It does NOT stimulate glucagon or produce ketones — ketones happen when insulin is missing/ineffective.'},
{topic:'diabetes',q:'Why does an ill diabetic patient\'s glucose rise even without eating?',o:['Glucose does not actually rise without food','Insulin stops working permanently once ill','Glucose only rises after eating a meal','Cortisol and stress hormones rise during illness'],c:3,t:'single',r:'Illness/stress triggers cortisol and adrenaline release, which raises blood glucose independent of food intake — why sick-day monitoring must continue even if the patient isn\'t eating.'},
{topic:'diabetes',q:'Approximately how much sugar should be circulating in the entire blood volume at one time?',o:['Close to 1 pound throughout the body','Around 5 tablespoons at any given time','About 1 teaspoon, roughly 7 sugar cubes','Approximately 1 cup circulating at once'],c:2,t:'single',r:'Roughly 1 tsp (~30g) across the whole blood volume — a small homeostatic target that insulin works constantly to maintain.'},
{topic:'diabetes',q:'A pregnant patient develops diabetes only during pregnancy, with a larger-than-average baby. This is:',o:['Gestational diabetes','LADA','Type 1 diabetes','Prediabetes'],c:0,t:'single',r:'Gestational diabetes develops during pregnancy (more common with larger babies), usually resolves after delivery, but raises future Type 2 risk.'},
{topic:'eye',q:'Which pupil finding describes miosis?',o:['Pupil dilation','No pupil reaction','Pupil constriction','Unequal pupils'],c:2,t:'single',r:'Miosis = pupil constriction (opioids, pilocarpine, bright light).'},
{topic:'eye',q:'A patient with a family history of angle-closure glaucoma should avoid which class of medication without provider guidance?',o:['Beta-blockers for heart rate','Statins for cholesterol control','Anticholinergics and mydriatics','ACE inhibitors for blood pressure'],c:2,t:'single',r:'Anticholinergic/mydriatic drugs dilate the pupil, which can trigger an acute angle-closure attack.'},
{topic:'eye',q:'What is the correct explanation for why cataract surgery patients are told to avoid bending and heavy lifting?',o:['They raise intraocular pressure and disrupt healing','It has no real effect on the operated eye','It only affects comfort rather than actual healing','It is a precaution unrelated to eye pressure at all'],c:0,t:'single',r:'Bending, lifting, and straining raise IOP, which can disrupt the healing post-surgical eye.'},
{topic:'eye',t:'match',hot:true,q:'Match each eye condition to its defining feature.',
 items:[
   {term:'Glaucoma', def:'Gradual optic nerve damage from elevated intraocular pressure'},
   {term:'Cataracts', def:'Progressive clouding of the lens causing glare and haziness'},
   {term:'Macular degeneration', def:'Central vision loss with peripheral vision spared'},
   {term:'Retinal detachment', def:'The retina separates from its blood supply — a surgical emergency'}
 ],
 r:'Each condition has a distinct mechanism: glaucoma = pressure damaging the nerve, cataracts = a clouded lens, macular degeneration = central retina damage, retinal detachment = the retina physically pulling away from its blood supply. Mixing up which mechanism belongs to which name is the classic trap on this content.'},
{topic:'eye',t:'match',q:'Match each refractive error to its correct description.',
 items:[
   {term:'Myopia', def:'Nearsighted — light focuses in front of the retina'},
   {term:'Hyperopia', def:'Farsighted — light focuses behind the retina'},
   {term:'Astigmatism', def:'Irregular corneal curvature causing blur at any distance'},
   {term:'Presbyopia', def:'Age-related loss of near focus from a stiffening lens'}
 ],
 r:'Myopia and hyperopia are opposite focal-point problems; astigmatism is a curvature problem affecting all distances; presbyopia is an age-related accommodation problem. All four are frequently swapped with each other on exams.'},
{topic:'diabetes',t:'match',q:'Match each term to its correct definition.',
 items:[
   {term:'Mydriasis', def:'Pupil dilation'},
   {term:'Miosis', def:'Pupil constriction'},
   {term:'Direct pupillary response', def:'The same eye that received light constricts'},
   {term:'Consensual pupillary response', def:'The opposite eye also constricts'}
 ],
 r:'Two separate pairs are being tested here: mydriasis/miosis describe the DIRECTION a pupil moves, while direct/consensual describe WHICH eye is reacting. Confusing these two different pairings is the most common error.'},
{topic:'eye',t:'match',q:'Match each eye medication to its key nursing consideration.',
 items:[
   {term:'Anticholinergic/mydriatic drops', def:'Can trigger an acute attack in angle-closure glaucoma'},
   {term:'Beta-blocker eye drops', def:'Can be absorbed systemically — caution in asthma/COPD or bradycardia'},
   {term:'Prostaglandin analogs', def:'Can permanently darken iris color and lengthen eyelashes'},
   {term:'Steroid eye drops', def:'Long-term use can raise IOP and contribute to cataract formation'}
 ],
 r:'Each drug class carries a distinct nursing consideration tied to its own mechanism — dilation risk, systemic absorption, a cosmetic side effect, and a long-term IOP/cataract risk, respectively.'},
{topic:'eye',t:'match',hot:true,q:'Match each disease process to its correct treatment approach.',
 items:[
   {term:'Open-angle glaucoma', def:'Lifelong topical drops to lower IOP; lost vision does not return'},
   {term:'Acute angle-closure glaucoma', def:'Emergency IOP-lowering treatment followed by laser iridotomy'},
   {term:'Cataracts', def:'Surgical lens removal with an intraocular lens implant'},
   {term:'Wet macular degeneration', def:'Anti-VEGF intravitreal injections to slow abnormal vessel growth'}
 ],
 r:'Treatment approach follows directly from mechanism: chronic pressure control for open-angle, true emergency intervention for angle-closure, surgical replacement for a clouded lens, and injections targeting abnormal vessels for wet AMD.'},
{topic:'eye',t:'match',hot:true,q:'Match each clinical finding to the disease process it MOST indicates.',
 items:[
   {term:'Central blank spot, wavy lines, peripheral vision intact', def:'Macular degeneration'},
   {term:'Gradual peripheral vision loss, painless, central vision preserved', def:'Open-angle glaucoma'},
   {term:'Sudden flashes, floaters, then a curtain crossing the vision', def:'Retinal detachment'},
   {term:'Painless glare and haze, worse driving at night', def:'Cataracts'}
 ],
 r:'Each of these presentations is the classic, textbook pattern for its condition — matching pattern to diagnosis (not just naming facts) is exactly what NCLEX-style questions test.'},
{topic:'eye',t:'order',q:'A patient reports sudden flashes of light and new floaters in one eye, progressing over an hour to a shadow crossing part of the vision. Place the nurse\'s actions in the correct order.',
 steps:[
   'Recognize this symptom pattern as a possible retinal detachment',
   'Obtain a focused history of onset and progression',
   'Notify the ophthalmology provider urgently',
   'Prepare the client for likely urgent surgical evaluation'
 ],
 r:'Recognition of the pattern has to come first — everything else (history-taking, notification, surgical prep) flows from correctly identifying what this presentation likely represents.'},
{topic:'eye',t:'order',hot:true,q:'Place the following steps of open-angle glaucoma\'s damage process in the correct order, from initial cause to final consequence.',
 steps:[
   'Aqueous humor drainage becomes impaired',
   'Intraocular pressure gradually rises',
   'Pressure compresses and damages optic nerve fibers',
   'Peripheral vision is lost first, with central vision affected only later if untreated'
 ],
 r:'This is the cause-and-effect chain that explains WHY glaucoma looks the way it does: impaired drainage leads to pressure buildup, which damages the nerve from the outside in, which is why peripheral vision goes first.'},
{topic:'eye',t:'order',hot:true,q:'A client is diagnosed with acute angle-closure glaucoma. Place the following interventions in the correct priority order.',
 steps:[
   'Recognize the emergency presentation (sudden severe pain, halos, nausea, firm globe)',
   'Notify the provider immediately for emergency IOP-lowering treatment',
   'Administer ordered IOP-lowering medications',
   'Prepare the client for laser iridotomy'
 ],
 r:'Just like any emergency, recognizing the pattern comes first, followed by escalating to the provider, then treating, then moving toward the definitive procedure.'},
{topic:'eye',t:'order',q:'Place the classic cataract symptom progression in the order a patient would typically notice these changes.',
 steps:[
   'Mild glare and difficulty with night driving',
   'Progressive blurring and haziness of vision',
   'Colors appear faded or yellowed',
   'Vision impairment becomes significant enough to affect daily activities'
 ],
 r:'Cataracts progress gradually — early glare/night-driving trouble is typically noticed first, with color changes and functional impairment developing later as the lens continues to cloud.'},
{topic:'complications',hot:true,q:'A client with diabetes and a new diagnosis of nonproliferative diabetic retinopathy asks if their vision loss can be reversed with better glucose control. What is the BEST response?',type:'single',o:['"Retinopathy has no relationship to glucose control"','"Vision loss from retinopathy is always temporary"','"Control slows progression, but existing damage stays"','"Tight control will fully restore any vision lost"'],c:2,t:'single',r:'A promises a reversal that isn\'t realistic, C denies a well-established relationship, and D incorrectly assumes all retinopathy vision loss is temporary. Glucose control is protective against further progression, but existing microvascular damage is generally not reversible — an important, honest distinction for patient teaching.'},
{topic:'eye',hot:true,q:'A nurse is assessing a client 1 day after retinal detachment repair surgery with gas tamponade. Which finding requires the MOST immediate follow-up?',o:['Sudden increase in eye pain with new nausea and vomiting','Blurry vision immediately after surgery','Mild eye irritation','The client reports the gas bubble is “shrinking”, which was expected as part of healing'],c:0,t:'single',r:'Mild irritation, an expected gradually-resolving gas bubble, and immediate post-op blurriness are all anticipated findings. Sudden worsening pain with nausea/vomiting can indicate a dangerous rise in intraocular pressure and needs urgent evaluation, unlike the other expected findings.'},
{topic:'eye',hot:true,q:'Which teaching point is MOST important for a client newly started on timolol (a beta-blocker) eye drops for glaucoma?',o:['"Press the inner corner after instilling to limit absorption"','"Stop the medication if your vision feels normal again"','"This medication should be swallowed rather than dropped"','"This medication cannot cause side effects outside the eye"'],c:0,t:'single',r:'A denies a real systemic absorption risk. C encourages dangerous self-discontinuation of a lifelong glaucoma treatment. D misstates the route entirely. Applying pressure to the inner corner (nasolacrimal occlusion) after instilling the drop reduces how much medication drains into the nasal mucosa and gets absorbed systemically — genuinely useful teaching for a systemically-absorbable eye drop.'},
{topic:'eye',hot:true,q:'A client asks why their ophthalmologist recommends AREDS2 vitamins for their dry macular degeneration. What is the BEST explanation?',o:['"These vitamins replace the need for regular eye exams"','"These vitamins are for cataracts, not macular degeneration"','"These vitamins will cure your macular degeneration"','"They may slow progression of dry macular degeneration"'],c:3,t:'single',r:'A overstates the benefit as a cure, C misassigns the treatment to the wrong condition, and D dangerously suggests skipping monitoring. AREDS2 formulations are specifically studied for their potential to slow (not reverse or cure) dry AMD progression in certain patients — accurate, honest framing matters here.'},
{topic:'eye',q:'A client with well-controlled open-angle glaucoma on timolol eye drops also has a history of asthma. Which finding should prompt the nurse to notify the provider?',o:['New-onset wheezing and shortness of breath','Mild redness at the eye drop instillation site','Stable IOP on routine follow-up','Occasional mild eye dryness'],c:0,t:'single',r:'Mild dryness, stable IOP, and mild local redness are all unremarkable, expected findings. New wheezing/shortness of breath in an asthmatic client on a beta-blocker eye drop is significant, since these drops can be systemically absorbed and potentially trigger bronchospasm — a genuine safety concern worth reporting.'},
{topic:'eye',hot:true,q:'Which combination of findings would the nurse recognize as MOST consistent with acute angle-closure glaucoma rather than a migraine with visual aura?',o:['Brief flashes of light with no pain or headache after','Sudden severe pain, colored halos, nausea, firm globe','Gradual blurriness present over several months','Zigzag shimmering lights for 20 min, then mild headache'],c:1,t:'single',r:'A describes a classic migraine aura, C describes a chronic process (like cataracts), and D under-describes a presentation that could fit several benign causes. The combination of sudden severe pain, halos, nausea, AND a firm globe together is the specific pattern that distinguishes a true ophthalmic emergency from a migraine aura, which typically lacks eye pain and a hard globe.'},
{topic:'eye',q:'Which statement by a client recovering from cataract surgery indicates a need for further teaching?',o:['"I\'ll wear my eye shield at night for about a week."','"I can resume heavy weightlifting tomorrow since I feel fine."','"I\'ll call the office if I notice sudden pain or vision changes."','"I\'ll avoid swimming pools until my surgeon clears me."'],c:1,t:'single',r:'This question asks which statement is INCORRECT. Resuming heavy weightlifting the day after eye surgery, regardless of how the client feels, risks raising IOP and disrupting the healing eye — the other three statements all reflect correct post-op teaching.'},
{topic:'eye',hot:true,q:'Which of the following are appropriate nursing actions for a client with newly diagnosed open-angle glaucoma? (Select all that apply)',type:'multi',o:['Reinforce that eye drops must be used consistently for life','Tell the client that surgery will be needed within the first year regardless of drop effectiveness','Teach the client that lost peripheral vision is expected to return with treatment','Teach the client to report any new, gradual vision changes even while on treatment','Encourage regular follow-up IOP checks'],c:[0,3,4],t:'multi',r:'Option 2 is a dangerous misconception — vision already lost from glaucoma does NOT return, drops only prevent further loss. Option 5 overstates the need for surgery, which isn\'t automatically required if drops are effectively controlling pressure. Lifelong drop adherence, regular IOP monitoring, and reporting new changes are all correct.'},
{topic:'eye',q:'Which of the following are recognized risk factors for retinal detachment? (Select all that apply)',type:'multi',o:['Severe myopia (nearsightedness)','Previous eye surgery or trauma','Age-related vitreous shrinkage','A family history of retinal detachment','Regular use of reading glasses'],c:[0,1,2,3],t:'multi',r:'Reading glasses correction has no established link to retinal detachment risk — a plausible-sounding but incorrect distractor. Severe myopia, prior eye surgery/trauma, vitreous shrinkage with age, and family history are all recognized risk factors.'},
{topic:'eye',q:'A client asks how a cataract is different from glaucoma, since both cause blurry vision. Which explanation is correct?',o:['"They are the same condition under two different names"','"Glaucoma affects the lens; cataracts affect the optic nerve"','"A cataract always causes sudden pain; glaucoma never does"','"Cataract is a cloudy lens causing painless blur and glare"'],c:3,t:'single',r:'A denies a real and important distinction. C reverses which condition is typically painless (both are usually painless, though angle-closure glaucoma is the painful exception). D swaps which structure each condition actually affects. The accurate distinction is mechanism-based: lens clouding vs. nerve damage from pressure.'},
{topic:'eye',hot:true,q:'A client with diabetic retinopathy asks why their eye doctor mentioned it\'s a "microvascular" complication, the same category as their kidney disease. What is the BEST explanation?',o:['"Microvascular means only the eyes are affected, not kidneys"','"Both come from high sugar damaging small blood vessels"','"Your diabetes has definitely progressed to Type 1 disease"','"They are unrelated and the term is just a coincidence"'],c:1,t:'single',r:'A dismisses a real, clinically important shared mechanism. C misdefines the term entirely. D draws an unsupported conclusion about diabetes type. Retinopathy and nephropathy are both classic microvascular complications — the SAME small-vessel damage mechanism from chronic hyperglycemia, just affecting two different organs.'},
{topic:'eye',hot:true,q:'A client asks why their provider is checking both eyes even though only one eye has symptoms of macular degeneration. What is the BEST response?',o:['"Checking both eyes is only done for billing purposes"','"This means the diagnosis is most likely incorrect"','"It often starts in one eye, so the other needs watching"','"There is no medical reason to check the unaffected eye"'],c:2,t:'single',r:'A, C, and D all dismiss a legitimate clinical practice. Macular degeneration frequently starts asymmetrically, and the unaffected eye carries a meaningfully increased risk of later involvement — ongoing monitoring of the "good" eye is standard, evidence-based practice, not a formality.'},
{topic:'eye',q:'Which of the following statements accurately reflects a difference between conductive and sensorineural hearing loss, when compared to how glaucoma is diagnosed and monitored?',o:['"Glaucoma uses an objective pressure reading; hearing loss does not"','"Both share an identical objective diagnostic number"','"Both are diagnosed only through patient-reported symptoms alone"','"Neither condition can be objectively measured in a clinic setting"'],c:0,t:'single',r:'A and C both dismiss real objective testing methods that exist for these conditions. D invents a shared number that doesn\'t exist. Glaucoma has a specific objective measurement (IOP, with a defined normal range), while hearing loss type is characterized more through audiometric patterns and history — different diagnostic approaches for different sensory systems, which is a reasonable cross-topic distinction to understand.'},
{topic:'asepsis',hot:true,q:'A nurse is preparing to insert an indwelling urinary catheter. After opening the sterile kit and donning sterile gloves, the nurse separates the labia with the non-dominant hand and begins cleansing. Midway through, the nurse realizes the antiseptic swabs are out of reach. What is the appropriate action?',o:['Continue the insertion without further cleansing to avoid contaminating the field','Release the labia briefly, reach for the swabs, and resume cleansing','Discontinue the procedure, obtain new sterile supplies, and begin again with a fresh field','Have an assistant place the swabs directly into the nurse\'s non-dominant hand'],c:2,t:'single',r:'<b>Once the non-dominant hand separates the labia it is CONTAMINATED and must not move.</b> If it releases, the area is no longer prepped and the procedure restarts with new supplies. Having someone place items in that hand is equally wrong \\u2014 that hand cannot handle sterile equipment. Skipping cleansing guarantees a <b>CAUTI</b>.'},
{topic:'asepsis',hot:true,q:'A charge nurse observes a newly hired nurse providing care to a client who has had a large incontinent stool. Which observed action requires the charge nurse to intervene?',o:['The nurse cleanses the perineum from front to back using a clean area of the cloth with each stroke','The nurse changes gloves and performs hand hygiene before applying the barrier cream','The nurse places the soiled linens on the floor while repositioning the client','The nurse brings the linen hamper to the bedside before beginning'],c:2,t:'single',r:'<b>The floor is considered grossly contaminated.</b> Linen placed there contaminates the floor further and anything it touches afterward. <b>Bag at the point of use</b> \\u2014 which is exactly why bringing the hamper to the bedside first is correct. The other three actions are all proper medical asepsis.'},
{topic:'asepsis',hot:true,q:'A nurse is setting up a sterile field for a central line dressing change. Which action contaminates the field?',o:['Opening the outermost flap of the package away from the body first','Pouring sterile saline after discarding the first small amount from the bottle','Holding the sterile dressing above waist level while moving to the bedside','Placing sterile gauze within one inch of the edge of the drape'],c:3,t:'single',r:'<b>The outer 1 inch of a sterile field is considered CONTAMINATED.</b> Nothing sterile is placed there. The other three are correct technique: outermost flap away first, sterile items held <b>above the waist and in front</b>, and the <b>lip of the bottle is contaminated once opened</b> so a small amount is discarded before pouring.'},
{topic:'asepsis',hot:true,q:'A nurse is leaving the room of a client on contact and droplet precautions. In which order should personal protective equipment be removed?',o:['Gloves, goggles, gown, then mask after leaving the room','Goggles, mask, gloves, then gown','Mask, gloves, goggles, then gown','Gown, gloves, mask, then goggles'],c:0,t:'single',r:'<b>Gloves come off FIRST because they are the most contaminated.</b> Then goggles by the headband, then the gown peeled inside out, and the <b>mask LAST and OUTSIDE the room</b> \\u2014 the air in the room is the hazard, so the mask protects until you are out of it. Hand hygiene between steps and again at the end.'},
{topic:'asepsis',hot:false,q:'A nurse is caring for a client with a stage 3 pressure injury requiring a sterile dressing change. Which technique is correct?',o:['Remove the old dressing with sterile gloves and apply the new dressing with clean gloves','Remove the old dressing with clean gloves, perform hand hygiene, then apply sterile gloves for the new dressing','Use clean gloves for the entire procedure since the wound is already colonized','Use the same sterile gloves to remove the old dressing and apply the new one'],c:1,t:'single',r:'The old dressing is <b>contaminated</b>, so it comes off with <b>clean</b> gloves. After hand hygiene, <b>sterile</b> gloves go on for the new dressing. Cleanse <b>from the wound outward</b> \\u2014 center to periphery \\u2014 and never bring a used swab back over cleaned tissue.'},
{topic:'asepsis',hot:false,q:'A nurse is preparing to start a peripheral IV. After cleansing the site with chlorhexidine using a back-and-forth motion, what should the nurse do next?',o:['Palpate the vein once more to confirm placement, then insert','Blot the site dry with sterile gauze to speed the process','Insert the catheter immediately while the site is still wet','Allow the antiseptic to air dry completely before inserting the catheter'],c:3,t:'single',r:'<b>Chlorhexidine kills organisms as it DRIES.</b> Inserting while wet or blotting it dry defeats the antisepsis. And <b>do not re-palpate after prepping</b> \\u2014 that recontaminates the site and would require a re-prep.'},
{topic:'asepsis',hot:true,q:'A nurse is assisting with a central line insertion. Which observation indicates a break in maximal sterile barrier precautions?',o:['The physician uses a small fenestrated drape covering only the insertion site','All personnel in the room are wearing masks','The physician wears a cap, mask, sterile gown, and sterile gloves','Chlorhexidine is applied and allowed to dry before draping'],c:0,t:'single',r:'<b>Maximal sterile barrier precautions require a FULL-BODY sterile drape</b>, not a small fenestrated one, along with cap, mask, sterile gown, and sterile gloves. <b>Everyone in the room masks.</b> Any staff member may <b>stop the procedure</b> for a break in sterility.'},
{topic:'asepsis',hot:false,q:'A nurse is making an occupied bed. Which action demonstrates correct medical asepsis?',o:['Returning unused linen from the room to the clean linen cart','Shaking the clean linen to unfold it quickly over the bed','Rolling the soiled linen inward with the dirty surface contained and holding it away from the uniform','Placing the soiled top sheet over the bedside chair while working'],c:2,t:'single',r:'<b>Roll soiled linen inward</b> so the contaminated surface is contained, and <b>hold it away from your uniform</b>. <b>Never shake linen</b> \\u2014 it aerosolizes organisms and skin cells throughout the room. Chairs are clean surfaces, and <b>anything taken into a room cannot return to the clean supply</b>.'},
{topic:'asepsis',hot:true,q:'A nurse is maintaining a sterile field. Which actions would contaminate it? Select all that apply.',o:['Reaching across the field to retrieve an instrument','Turning away from the field to answer a question','Holding sterile forceps above waist level','Placing a sterile item on the outer inch of the drape','Opening the side flaps of a package after the top flap','Allowing sterile saline to soak through the drape onto the table'],c:[0,1,3,5],t:'multi',r:'<b>Out of sight is contaminated</b> \\u2014 never turn your back. <b>Reaching across</b> contaminates everything beneath the arm. <b>Moisture wicks organisms up through the drape (strikethrough)</b>. The <b>outer inch</b> is not usable. Holding items <b>above the waist</b> and opening flaps <b>top, sides, then toward you</b> are both correct.'},
{topic:'asepsis',hot:false,q:'Which procedure requires SURGICAL asepsis rather than medical asepsis?',o:['Administration of an oral medication','Insertion of an indwelling urinary catheter','Emptying a urinary drainage bag','Providing a bed bath to a client with an intact skin'],c:1,t:'single',r:'<b>Does it break the skin or enter a sterile cavity?</b> The <b>bladder is sterile territory</b>, so catheter insertion is a <b>sterile</b> procedure. Bathing, oral meds, and emptying a drainage bag are all <b>clean</b> technique with standard precautions.'},
{topic:'drugs',hot:true,q:'A client with type 2 diabetes taking metformin is scheduled for a cardiac catheterization with contrast dye tomorrow. Which prescription should the nurse question?',o:['Continue metformin as scheduled through the morning of the procedure','Obtain a serum creatinine before resuming metformin','Hold metformin for 48 hours following the procedure','Provide clear liquids until 4 hours before the procedure'],c:0,t:'single',r:'<b>Metformin is held 48 hours BEFORE and AFTER iodinated contrast.</b> Contrast can injure the kidneys; if metformin cannot be cleared it accumulates and causes <b>LACTIC ACIDOSIS</b>, the black box warning. <b>Renal function is confirmed before restarting.</b> The other three prescriptions are appropriate.'},
{topic:'drugs',hot:true,q:'A client taking acarbose with meals becomes shaky and diaphoretic. The blood glucose reads 58 mg/dL. Which action is correct?',o:['Offer several pieces of hard candy','Administer glucose tablets','Provide 8 ounces of regular soda','Give 4 ounces of orange juice'],c:1,t:'single',r:'<b>Acarbose blocks the enzyme that breaks SUCROSE into glucose</b>, so juice, candy, and soda \\u2014 all sucrose \\u2014 will not raise the blood glucose. <b>Only dextrose/glucose tablets work.</b> This is a favorite item and an easy point once you have seen it.'},
{topic:'drugs',hot:true,q:'A client with type 2 diabetes who was started on pioglitazone 3 weeks ago reports new ankle swelling, a 6-pound weight gain, and shortness of breath when lying flat. What does the nurse suspect?',o:['Fluid retention from the thiazolidinedione, which can precipitate heart failure','Hypoglycemia from excessive drug effect','Lactic acidosis related to the medication','Expected weight gain from improved glucose control'],c:0,t:'single',r:'<b>TZDs cause FLUID RETENTION</b> and are <b>contraindicated in heart failure</b>. New <b>edema, rapid weight gain, and orthopnea</b> point to the drug, not the diabetes. Lactic acidosis belongs to <b>metformin</b>, and TZDs do not cause hypoglycemia alone.'},
{topic:'drugs',hot:true,q:'A client newly prescribed empagliflozin asks why the provider warned about yeast infections. What is the nurse\'s best explanation?',o:['The medication causes glucose to be excreted in the urine, which feeds organisms','The medication alters vaginal pH directly','The medication causes urinary retention','The medication suppresses the immune system'],c:0,t:'single',r:'<b>SGLT2 inhibitors block glucose reabsorption in the kidney</b>, so glucose is deliberately excreted in the urine \\u2014 and <b>sugar in the urine is a growth medium</b>. Teach <b>perineal hygiene and adequate fluids</b>. Also watch for <b>dehydration, hypotension, and rare euglycemic DKA</b>.'},
{topic:'drugs',hot:true,q:'A client with a history of asthma is prescribed timolol ophthalmic drops for glaucoma. Which teaching is the priority?',o:['Expect the drop to permanently darken the iris','Instill the drop directly onto the center of the cornea','Press the inner corner of the eye for 1 to 2 minutes after instilling the drop','Store the medication in the refrigerator between doses'],c:2,t:'single',r:'<b>Timolol is a beta blocker and is systemically absorbed through the tear duct</b>, where it can cause <b>bronchospasm and bradycardia</b>. <b>Punctal occlusion</b> blocks that drainage. Iris darkening belongs to <b>latanoprost</b>, and drops go into the <b>conjunctival sac</b>, never onto the cornea.'},
