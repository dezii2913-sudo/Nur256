{v:2,topic:'acs',hot:false,q:'A client has an elevated troponin but no ST elevation on the ECG. What does this indicate?',o:['Unstable angina without damage','NSTEMI from a partial blockage','A normal cardiac workup','STEMI from a complete blockage'],c:1,t:'single',r:'<b>Elevated troponin means muscle damage; no ST elevation means the artery is partially or intermittently blocked. That is an NSTEMI.</b> <b>Why not the others:</b> STEMI shows ST elevation. Unstable angina has a normal troponin. An elevated troponin is never a normal result. <b>His angle:</b> His handout defines NSTEMI as partial or intermittent blockage causing damage.'},
{v:2,topic:'vascular',hot:true,q:'A 28-year-old man who smokes heavily has pain in his hands and feet with activity, and his fingers turn pale. What is the most important teaching?',o:['Take an aspirin daily and continue smoking','Stopping all tobacco is the treatment','Apply heating pads to the hands','Avoid exercise to prevent the pain'],c:1,t:'single',r:'<b>Buerger\'s disease is an inflammatory thrombus in small and medium arteries caused by tobacco.</b> Quitting all tobacco is the treatment; nothing else works while smoking continues. <b>Why not the others:</b> Aspirin does not address the cause. Avoiding all activity is not the answer. Heating pads risk burns in a limb with poor circulation and sensation. <b>His angle:</b> Buerger\'s equals smoking.'},
{v:2,topic:'vascular',hot:true,q:'A client\'s fingers suddenly turn white, then blue, with numbness and tingling when she goes outside in winter. What should the nurse teach?',o:['Smoke only outdoors to limit exposure','Keep the hands warm and manage stress','Massage the fingers with ice','Increase caffeine to improve circulation'],c:1,t:'single',r:'<b>Raynaud\'s is vasospasm triggered by cold or stress.</b> Warm gloves and socks, avoiding cold, and stress management (meditation, yoga) are the mainstays, with a calcium channel blocker in severe cases. <b>Why not the others:</b> Ice worsens vasospasm. Caffeine and nicotine both constrict vessels. <b>His angle:</b> Buerger\'s is smoking; Raynaud\'s is cold and stress.'},
{v:2,topic:'vascular',hot:false,q:'Which feature separates Buerger\'s disease from Raynaud\'s?',o:['Raynaud\'s never affects the toes','Raynaud\'s is caused by plaque buildup','Buerger\'s is caused by tobacco use','Buerger\'s only affects women'],c:2,t:'single',r:'<b>Buerger\'s comes from tobacco smoke causing inflammatory thrombus; Raynaud\'s comes from cold or stress causing vasospasm.</b> <b>Why not the others:</b> Buerger\'s typically affects younger men who smoke. Neither is caused by plaque, which is PAD. Raynaud\'s affects fingers and toes. <b>His angle:</b> Both cause color changes, so the trigger in the stem decides.'},
{v:2,topic:'cardio',hot:true,q:'A client in heart failure receives a large IV fluid bolus and develops crackles and dyspnea. Which change explains this?',o:['Increased preload the ventricle cannot handle','Decreased afterload from vasodilation','Decreased preload from fluid shifting','Increased afterload from vessel constriction'],c:0,t:'single',r:'<b>Preload is the volume stretching the ventricle before it contracts.</b> Extra fluid raises it, and a failing ventricle cannot eject the added volume, so pressure backs up into the lungs. <b>Why not the others:</b> Afterload is the resistance it pushes against, not the volume. Preload went up, not down, and nothing here dilates vessels. <b>His angle:</b> Preload is how FULL; afterload is how HARD to get it out.'},
{v:2,topic:'cardio',hot:true,q:'A client with severe hypertension has left ventricular hypertrophy. Which change caused the thickening?',o:['Slow heart rate over time','Chronically increased afterload','Chronically decreased preload','Long-term dehydration'],c:1,t:'single',r:'<b>Afterload is the resistance the ventricle pushes against, and hypertension raises it.</b> Pushing against high pressure for years makes the muscle thicken, the same way a muscle grows with heavy lifting. <b>Why not the others:</b> Low preload and dehydration reduce workload. Bradycardia does not cause hypertrophy. <b>His angle:</b> LVH leads to diastolic heart failure: stiff and thick, cannot fill.'},
{v:2,topic:'cardio',hot:true,q:'Why does nitroglycerin relieve chest pain?',o:['It speeds the heart to deliver more oxygen','It raises afterload and pushes blood forward','It thickens blood to prevent clotting','It dilates veins and lowers preload'],c:3,t:'single',r:'<b>Nitrates dilate veins, so less blood returns to the heart.</b> Lower preload means less work and less oxygen demand, and it also dilates coronary arteries. Together, the pain eases. <b>Why not the others:</b> Raising afterload would increase work. A faster heart rate raises demand and shortens filling. Nitrates do not affect blood thickness. <b>His angle:</b> Dilate veins, less comes back. Dilate arteries, less to push against.'},
{v:2,topic:'cardio',hot:true,q:'A client reports chest pain that started at rest 40 minutes ago, is not relieved by three nitroglycerin tablets, and comes with nausea and diaphoresis. What does the nurse suspect?',o:['Myocardial infarction','Anxiety attack','Stable angina','Heartburn from reflux'],c:0,t:'single',r:'<b>Pain at rest lasting over 20 to 30 minutes and NOT relieved by rest or nitroglycerin, with diaphoresis and nausea, points to an MI.</b> Muscle is dying. <b>Why not the others:</b> Stable angina is brief, comes with exertion, and is relieved by rest and nitro. Anxiety and reflux are never assumed until cardiac causes are ruled out. <b>His angle:</b> If rest and nitro fix it the muscle is alive; if not, it is dying.'},
{v:2,topic:'cardio',hot:false,q:'Which finding best distinguishes stable angina from a myocardial infarction?',o:['Occurring in a client over 60','Pain located in the chest','Relief with rest and nitroglycerin','Radiation of pain to the arm'],c:2,t:'single',r:'<b>Stable angina is ischemia that resolves when demand drops, so rest and nitroglycerin relieve it and troponin stays normal.</b> <b>Why not the others:</b> Chest location, age, and radiation occur in both. <b>His angle:</b> Unstable angina sits between them: pain at rest but troponin still normal.'},
{v:2,topic:'htn',hot:true,q:'A client in hypertensive emergency is on an IV nitroprusside drip. Which assessment is the priority?',o:['Monthly INR levels','Continuous blood pressure monitoring','Bowel sounds every shift','Daily weight measurement and trend review'],c:1,t:'single',r:'<b>Nitroprusside dilates both arteries and veins and works within seconds</b>, so pressure can fall dangerously fast. It is titrated in an ICU with <b>continuous BP monitoring</b>, usually an arterial line, keeping the drop to no more than 25% in the first hour. <b>Why not the others:</b> Weights, bowel sounds, and INR do not guide a drip that works in seconds. <b>His angle:</b> Nitroprusside lowers afterload and preload.'},
{v:2,topic:'htn',hot:false,q:'A client has been on nitroprusside for two days and now has confusion, tinnitus, and blurred vision. What should the nurse suspect?',o:['Cyanide or thiocyanate toxicity','An allergic reaction','An expected effect of the drug infusion','A hypertensive rebound'],c:0,t:'single',r:'<b>Nitroprusside breaks down into cyanide and thiocyanate</b>, which accumulate with high doses, prolonged use, or kidney and liver impairment. Confusion, tinnitus, blurred vision, and metabolic acidosis are warning signs. <b>Why not the others:</b> These are not expected effects, a rebound would show as high BP, and allergy presents differently. <b>His angle:</b> Protect the bag and tubing from light and limit the duration.'},
{v:2,topic:'vascular',hot:true,q:'A client with PAD has an ABI of 0.38 and reports burning foot pain at night that eases when the foot hangs down. How should the nurse interpret this?',o:['Normal arterial flow','Chronic venous insufficiency','Critical limb ischemia','Intermittent claudication'],c:2,t:'single',r:'<b>An ABI of 0.40 or less with rest pain relieved by dangling is critical limb ischemia</b>, the end stage of PAD. The limb is at risk for ulcers, gangrene, and amputation without revascularization. <b>Why not the others:</b> Claudication happens with walking and eases with rest. Venous problems improve with elevation. An ABI of 0.38 is far from normal. <b>His angle:</b> Rest pain is the turning point from chronic disease to a limb at risk.'},
{v:2,topic:'vascular',hot:true,q:'A client with diabetes has an ABI of 1.5 but has absent pedal pulses and a nonhealing toe ulcer. How should the nurse interpret the ABI?',o:['Falsely high from calcified vessels','A sign of excellent circulation','Normal, so PAD is ruled out','Evidence of venous insufficiency'],c:0,t:'single',r:'<b>An ABI above 1.4 usually means the vessels are calcified and cannot be compressed</b>, which is common in diabetes and kidney disease. The number is <b>falsely high</b> and does not rule out PAD; a toe-brachial index is used instead. <b>Why not the others:</b> Absent pulses and a nonhealing ulcer contradict normal or excellent flow, and this is an arterial picture, not venous. <b>His angle:</b> Normal ABI is 1.0 to 1.4.'},
{v:2,topic:'vascular',hot:false,q:'A nurse is caring for a client with critical limb ischemia. Which action is appropriate?',o:['Wrap the leg in compression bandages','Apply a heating pad for comfort','Keep the affected leg dependent','Elevate the leg on two pillows'],c:2,t:'single',r:'<b>Keep the limb dependent</b> so gravity helps the little arterial flow that remains. Protect it from injury, cold, and pressure, and use a bed cradle to keep linens off the foot. <b>Why not the others:</b> Elevation and compression further reduce arterial inflow. A heating pad can burn a limb with poor sensation and circulation. <b>His angle:</b> Arterial dangle, venous elevate.'},
{v:2,topic:'repro',hot:true,q:'A client recovering from a myocardial infarction seems uneasy and mentions being unsure about intimacy. Using the PLISSIT model, what should the nurse do first?',o:['Suggest specific positions to try','Give permission to discuss the concern','Refer to a sex therapist','Provide a pamphlet and move on'],c:1,t:'single',r:'<b>P is Permission, the first level.</b> Open the door with a nonjudgmental statement such as \'Many people have questions about sex after a heart attack. Do you?\' <b>Why not the others:</b> Referral is Intensive Therapy, the <b>last</b> level. Specific suggestions come later. Handing over a pamphlet without conversation skips the opening. <b>His angle:</b> Permission, Limited Information, Specific Suggestions, Intensive Therapy.'},
{v:2,topic:'repro',hot:false,q:'A nurse explains when intercourse can safely resume after a procedure. Which PLISSIT level is this?',o:['Permission','Intensive Therapy','Specific Suggestions','Limited Information'],c:3,t:'single',r:'<b>Giving basic factual information related to the concern is Limited Information</b>, the second level. <b>Why not the others:</b> Permission is opening the topic. Specific Suggestions are tailored strategies such as positions or timing. Intensive Therapy is referral. <b>His angle:</b> Most nurses work at the first two levels.'},
{v:2,topic:'repro',hot:true,q:'A 68-year-old man with BPH has a BUN of 38 and creatinine of 2.4. What does the nurse understand about this?',o:['He is dehydrated from drinking too little','This is expected with normal aging','The labs are unrelated to his prostate problem','Retained urine has backed up into the kidneys'],c:3,t:'single',r:'<b>This is azotemia.</b> An enlarged prostate blocks outflow, urine stays in the bladder, pressure backs up the ureters into the kidneys (<b>hydronephrosis</b>), and kidney function falls. <b>Why not the others:</b> The labs are directly related to the obstruction. Dehydration and aging do not explain this pattern with known BPH. <b>His angle:</b> Incomplete emptying leads to UTI, stones, reflux, hydronephrosis, then azotemia.'},
{v:2,topic:'repro',hot:true,q:'Which findings are manifestations of BPH? Select all that apply.',o:['Increased force of the stream','Decreased force of the urinary stream','Urinary frequency and urgency','Nocturia','Painless hematuria as the first sign','Feeling of incomplete emptying'],c:[1,2,3,5],t:'multi',r:'<b>BPH causes obstructive and irritative symptoms</b>: frequency, urgency, nocturia, hesitancy, weak stream, straining, dribbling, and incomplete emptying, along with pelvic discomfort, anorexia, and azotemia when it advances. <b>Why not the others:</b> The stream weakens rather than strengthens, and painless hematuria as a first sign points toward bladder cancer. <b>His angle:</b> His list: azotemia, frequency, urgency, nocturia, decreased stream, pelvic discomfort, anorexia.'},
{v:2,topic:'repro',hot:true,q:'Which findings on digital rectal exam suggest BPH rather than prostate cancer?',o:['Smooth, firm, symmetrically enlarged','Hard, fixed, irregular nodule','Tender and boggy with fever','Absent prostate on palpation'],c:0,t:'single',r:'<b>BPH feels smooth, firm, and symmetrically enlarged. Cancer feels hard, fixed, irregular, and nodular.</b> <b>Why not the others:</b> Tender and boggy with fever suggests prostatitis. <b>His angle:</b> Draw the PSA BEFORE the DRE, since the exam itself can raise the level.'},
{v:2,topic:'repro',hot:false,q:'A client is prescribed tamsulosin for BPH. Which teaching is a priority?',o:['Rise slowly; it can cause dizziness','Take it only when symptoms are severe','Stop it if urine flow improves','Expect it to shrink the prostate in a week'],c:0,t:'single',r:'<b>Alpha-adrenergic blockers relax smooth muscle in the prostate and bladder neck</b>, which improves flow within days but also causes <b>orthostatic hypotension and dizziness</b>. Teach slow position changes and fall precautions; the first dose is often given at bedtime. <b>Why not the others:</b> Shrinking the prostate is what 5-alpha reductase inhibitors do, over 3 to 6 months. It is taken daily, not as needed, and stopping when better lets symptoms return. <b>His angle:</b> Alpha blockers relax; finasteride shrinks.'},
{v:2,topic:'repro',hot:true,q:'A 24-year-old finds a firm, painless lump in one testicle. What should the nurse advise?',o:['Watch it for three months','It is normal in young men','Apply warm soaks and rest','Be evaluated promptly'],c:3,t:'single',r:'<b>A painless, hard lump is the classic sign of testicular cancer</b>, the most common cancer in men 15 to 35, and it is highly curable when found early. <b>Why not the others:</b> Waiting, self-treating, or calling it normal delays diagnosis. Painless is exactly why men delay. <b>His angle:</b> Diagnosis is scrotal ultrasound plus tumor markers AFP, beta-hCG, and LDH.'},
{v:2,topic:'repro',hot:false,q:'Which history finding is the strongest risk factor for testicular cancer?',o:['History of a sports injury','Undescended testicle as an infant','A vasectomy performed about five years ago','Frequent bike riding'],c:1,t:'single',r:'<b>Cryptorchidism, an undescended testicle, is the biggest risk factor</b>, and the risk remains even after surgical correction. <b>Why not the others:</b> Vasectomy, injury, and cycling are not established risk factors. <b>His angle:</b> Testicles sit outside the body because sperm need a cooler temperature; an undescended testicle is both infertile and higher risk.'},
{v:2,topic:'repro',hot:false,q:'A client is starting chemotherapy for testicular cancer. Which discussion should occur before treatment begins?',o:['Prostate screening','Sperm banking','Scheduling a vasectomy','Starting testosterone'],c:1,t:'single',r:'<b>Chemotherapy and radiation can cause infertility</b>, so sperm banking is discussed <b>before</b> treatment starts. <b>Why not the others:</b> Prostate screening, testosterone, and vasectomy are not the priority here and do not preserve fertility. <b>His angle:</b> One healthy testicle usually maintains fertility and hormones, and a prosthesis is available.'},
{v:2,topic:'repro',hot:true,q:'After catheterizing an uncircumcised male client, which action prevents paraphimosis?',o:['Return the foreskin to its normal position','Apply a tight dressing around the glans','Leave the foreskin retracted to keep it clean','Tape the foreskin back for easy inspection'],c:0,t:'single',r:'<b>A retracted foreskin that is not returned constricts the glans</b>, causing swelling and impaired blood flow. That is <b>paraphimosis</b>, a urologic emergency. <b>Why not the others:</b> Leaving it retracted or taped causes the problem, and a tight dressing worsens constriction. <b>His angle:</b> Phimosis is a foreskin too tight to retract; paraphimosis is one stuck retracted.'},
{v:2,topic:'female',hot:true,q:'A client asks why ibuprofen helps her menstrual cramps. What is the best explanation?',o:['It reduces the amount of blood lost','It blocks prostaglandins that cause contractions','It replaces the estrogen lost during bleeding','It relaxes the cervix so flow is easier'],c:1,t:'single',r:'<b>Prostaglandins released by the shedding uterine lining cause the contractions that produce cramps.</b> NSAIDs block prostaglandin production, so they work best when <b>started at the first sign</b> rather than after pain peaks. <b>Why not the others:</b> NSAIDs do not replace estrogen or relax the cervix, and reducing flow is not how they relieve cramps. <b>His angle:</b> Severe or worsening pain, especially with painful intercourse, suggests endometriosis.'},
{v:2,topic:'female',hot:false,q:'Which findings commonly accompany the menstrual cycle? Select all that apply.',o:['Fatigue','Cramping','Mood swings','Breast tenderness','Foul-smelling discharge','Bloating','Fever over 101 F'],c:[0,1,2,3,5],t:'multi',r:'<b>Cramps, bloating, food cravings, mood swings, headache, fatigue, and breast tenderness</b> are expected cyclic symptoms driven by hormone shifts and prostaglandins. <b>Why not the others:</b> Fever and foul-smelling discharge are signs of <b>infection</b>, such as PID, and are never normal cycle symptoms. <b>His angle:</b> Know which symptoms are expected and which mean something is wrong.'},
{v:2,topic:'female',hot:true,q:'A 49-year-old has irregular periods, hot flashes, and had a period 5 months ago. How should the nurse describe her stage?',o:['Menopause; contraception is no longer needed','Postmenopause; symptoms should be gone','Premenopause; no changes are occurring','Perimenopause; she can still get pregnant'],c:3,t:'single',r:'<b>Menopause is confirmed only after 12 consecutive months without a period.</b> At 5 months with irregular cycles and hot flashes she is in <b>perimenopause</b>, and ovulation can still occur, so <b>contraception is still needed</b>. <b>Why not the others:</b> She has not reached the 12-month mark, postmenopause comes after that, and her cycles are clearly changing. <b>His angle:</b> Perimenopause often lasts 4 to 8 years, with menopause averaging about age 51.'},
{v:2,topic:'female',hot:false,q:'Why does osteoporosis risk rise sharply after menopause?',o:['Progesterone builds bone and rises','Calcium absorption doubles with age','Estrogen protects bone, and it falls','Bone stops remodeling after age 50'],c:2,t:'single',r:'<b>Estrogen slows bone breakdown</b>, so when it drops after menopause, bone loss speeds up. Cardiovascular risk rises for the same reason. <b>Why not the others:</b> Calcium absorption decreases with age, progesterone falls rather than rises, and bone continues remodeling throughout life. <b>His angle:</b> Weight-bearing exercise, calcium, and vitamin D are the teaching points.'},
{v:2,topic:'female',hot:false,q:'A postmenopausal client reports vaginal bleeding. What should the nurse do?',o:['Reassure her this is common','Recommend an over-the-counter remedy','Suggest tracking it for 6 months','Arrange prompt evaluation'],c:3,t:'single',r:'<b>Any bleeding after menopause is abnormal</b> and must be evaluated for endometrial cancer and other causes. <b>Why not the others:</b> Reassurance, watchful waiting, and self-treatment all delay diagnosis of a potentially serious condition. <b>His angle:</b> Menopause means 12 months with no bleeding, so new bleeding is a red flag.'},
{v:2,topic:'repro',hot:true,q:'A 22-year-old has lower abdominal pain, fever, foul-smelling discharge, and severe pain when the cervix is moved during exam. What does the nurse suspect?',o:['Endometriosis','Pelvic inflammatory disease','Ovarian cyst rupture','Urinary tract infection'],c:1,t:'single',r:'<b>Cervical motion tenderness with lower abdominal pain, fever, and foul discharge is classic PID</b>, usually from untreated chlamydia or gonorrhea traveling upward. <b>Why not the others:</b> Endometriosis causes cyclic pain without fever or foul discharge. A ruptured cyst causes sudden one-sided pain. A UTI causes urinary symptoms without cervical motion tenderness. <b>His angle:</b> A pregnancy test is done to rule out ectopic pregnancy.'},
{v:2,topic:'repro',hot:true,q:'Which complications can untreated PID cause? Select all that apply.',o:['Resolution without any scarring','Improved fertility','Tubo-ovarian abscess','Ectopic pregnancy','Chronic pelvic pain','Infertility'],c:[2,3,4,5],t:'multi',r:'<b>Infection scars the fallopian tubes.</b> A blocked tube causes <b>infertility</b>; a partly blocked tube can trap a fertilized egg, causing a life-threatening <b>ectopic pregnancy</b>. Adhesions cause <b>chronic pelvic pain</b>, and infection can wall off into a <b>tubo-ovarian abscess</b>. <b>Why not the others:</b> Untreated PID does not improve fertility, and scarring is the usual result. <b>His angle:</b> Treat promptly, treat partners, and no intercourse until treatment is complete.'},
{v:2,topic:'repro',hot:false,q:'How does endometriosis differ from pelvic inflammatory disease?',o:['It is always caused by a chlamydia infection','It never causes infertility','It is diagnosed by cervical culture','It is tissue outside the uterus, not infection'],c:3,t:'single',r:'<b>Endometriosis is endometrial tissue growing outside the uterus</b> that bleeds with each cycle, causing inflammation and scarring. <b>PID is an infection</b>, usually from chlamydia or gonorrhea. <b>Why not the others:</b> Endometriosis is not infectious and is a leading cause of infertility. It is confirmed by <b>laparoscopy</b>, not culture. <b>His angle:</b> Both end in pelvic pain, adhesions, and infertility, which is why they get confused.'},
{v:2,topic:'sti',hot:true,q:'A client has a rash on the palms of the hands and soles of the feet, with fever and swollen lymph nodes. Which infection should the nurse suspect?',o:['Genital herpes outbreak','Trichomoniasis infection','Untreated gonorrhea','Secondary syphilis'],c:3,t:'single',r:'<b>A rash on the palms and soles is the classic sign of secondary syphilis</b>, and almost no other rash appears there. The client is highly contagious at this stage. <b>Why not the others:</b> Herpes causes painful vesicles, gonorrhea causes purulent discharge, and trichomoniasis causes frothy discharge and itching. <b>His angle:</b> Primary syphilis is a single painless chancre that heals on its own, which is why it goes untreated.'},
{v:2,topic:'sti',hot:true,q:'A client is being treated for an STI and asks what else is needed. What is the priority teaching?',o:['Only you need treatment if symptoms are gone','Partners must be treated and no sex until done','Sex is fine if a condom is used during treatment','Retesting replaces the need to tell partners'],c:1,t:'single',r:'<b>Treat the partner, not just the client, and no intercourse during treatment.</b> Treating only the client leads to <b>reinfection</b> from an untreated partner, called ping-pong infection. <b>Why not the others:</b> Symptom relief does not mean cure, condoms do not make intercourse during treatment safe, and retesting does not replace partner notification. <b>His angle:</b> Most STIs are reportable, and partner notification is part of care.'},
{v:2,topic:'sti',hot:false,q:'A client treated for syphilis develops fever, chills, headache, and muscle aches within hours of the penicillin injection. What does this indicate?',o:['A penicillin allergy requiring epinephrine','Treatment failure needing a new antibiotic','A new infection acquired during treatment','An expected reaction as organisms die off'],c:3,t:'single',r:'<b>This is the Jarisch-Herxheimer reaction</b>, caused by the release of substances as the organisms are killed. It appears in the first 24 hours and is treated supportively with rest, fluids, and antipyretics. <b>Why not the others:</b> Allergy causes rash, wheezing, and swelling rather than this pattern. It is not failure or a new infection. <b>His angle:</b> Penicillin G is the treatment, and pregnant clients with an allergy are desensitized rather than switched.'},
{v:2,topic:'acs',hot:true,q:'A client reports chest pain that wakes them at 3 a.m. several nights in a row, with no pain during the day or with activity. What type of angina does this suggest?',o:['Prinzmetal angina','Silent ischemia','Unstable angina','Stable angina'],c:0,t:'single',r:'<b>Prinzmetal (variant) angina comes from coronary vasospasm</b>, often at rest and in the early morning hours, in a repeating pattern, and frequently with little plaque. It responds to <b>nitrates and calcium channel blockers</b>. <b>Why not the others:</b> Stable angina comes with exertion and is relieved by rest. Unstable angina is a new or worsening pattern from a ruptured plaque and clot. Silent ischemia has no pain at all. <b>His angle:</b> Triggers to teach: smoking, cocaine, stress, cold exposure.'},
{v:2,topic:'acs',hot:true,q:'Why is unstable angina considered a medical emergency?',o:['It only occurs after a previous MI','The heart muscle has already died','A ruptured plaque and clot may block it fully','It always means the troponin level is elevated'],c:2,t:'single',r:'<b>In unstable angina the plaque has ruptured and a clot is forming.</b> Nothing has died yet, which is exactly why it is urgent: treat now and the MI can be prevented. <b>Why not the others:</b> Muscle death defines an MI, not unstable angina, and the troponin is still normal. It can occur without any prior MI. <b>His angle:</b> Chest pain at rest always outranks chest pain with exertion.'},
{v:2,topic:'vascular',hot:true,q:'He compared critical limb ischemia to unstable angina. What do they have in common?',o:['Tissue is starving at rest, not just on exertion','Both are caused by venous pooling','Both are treated with compression','Both are fully relieved by rest and nitroglycerin'],c:0,t:'single',r:'<b>Both mean perfusion is inadequate at REST.</b> Angina with exertion matches claudication with walking; chest pain at rest matches rest pain in the foot. Both need urgent action: reperfusion for the heart, <b>revascularization</b> for the limb. <b>Why not the others:</b> Neither is reliably relieved by rest. Both are arterial, not venous, so compression would make the limb worse. <b>His angle:</b> Rest pain is the turning point in both.'},
{v:2,topic:'htn',hot:true,q:'A nurse takes vital signs on a postoperative client: BP 190/100, HR 100, temperature 100.5 F, SpO2 88%. Which finding is the priority?',o:['The blood pressure','The oxygen saturation','The heart rate','The temperature'],c:1,t:'single',r:'<b>Work the ABCs.</b> A saturation of 88% is a breathing and oxygenation problem, which outranks pressure, fever, and rate. <b>Why not the others:</b> The BP, temperature, and heart rate all need attention, but none of them will harm the client as fast as hypoxia. <b>His angle:</b> His rule: when several options look right, ask which one will kill or hurt them the most.'},
{v:2,topic:'htn',hot:false,q:'According to his prioritization rule, what comes before the ABCs?',o:['A blood pressure of 188/96','Catastrophic active bleeding','A pain rating of 9 out of 10','A temperature of 101.8 F'],c:1,t:'single',r:'<b>He named one exception: catastrophic active bleeding</b>, because a client can bleed out faster than an airway problem kills. <b>Why not the others:</b> Severe pain, high blood pressure, and fever are all important but come after airway, breathing, and circulation. <b>His angle:</b> Otherwise, start at A and work down.'},
{v:2,topic:'meds',hot:true,q:'A client on hydrochlorothiazide reports muscle cramps and palpitations. Which lab should the nurse check first?',o:['Potassium','Sodium','Magnesium','Calcium'],c:0,t:'single',r:'<b>Thiazide and loop diuretics cause the kidneys to lose potassium</b>, and hypokalemia shows up as muscle cramps, weakness, and dysrhythmias. <b>Why not the others:</b> Other electrolytes can cause cramping, but thiazides specifically waste potassium. <b>His angle:</b> Thiazides and loops lose it; spironolactone, ACE inhibitors, and ARBs keep it.'},
{v:2,topic:'meds',hot:true,q:'A client takes spironolactone and lisinopril. Which teaching is most important?',o:['Take both drugs with grapefruit juice','Avoid salt substitutes and potassium supplements','Increase potassium-rich foods daily','Expect a dry cough from the spironolactone'],c:1,t:'single',r:'<b>Both drugs cause the body to KEEP potassium</b>, so together they raise the risk of hyperkalemia. Salt substitutes are potassium chloride and would add to it. <b>Why not the others:</b> Adding potassium-rich foods compounds the risk. Grapefruit interacts with calcium channel blockers. The dry cough belongs to the <b>ACE inhibitor</b>, not spironolactone, which can cause gynecomastia. <b>His angle:</b> Know which drugs lose potassium and which keep it.'},
{v:2,topic:'meds',hot:true,q:'How do beta blockers lower blood pressure and protect the heart?',o:['They make the kidneys excrete potassium','They dilate veins to reduce preload','They block the fight-or-flight response','They block calcium entry into vessels'],c:2,t:'single',r:'<b>Beta blockers block beta receptors, suppressing the sympathetic fight-or-flight response.</b> Heart rate, contractility, and oxygen demand all fall, which is why they help angina and heart failure as well as hypertension. <b>Why not the others:</b> Potassium loss is a diuretic effect, calcium blockade is a CCB effect, and venous dilation is a nitrate effect. <b>His angle:</b> Hold for a heart rate under 60, never stop abruptly, and remember they mask hypoglycemia.'},
{v:2,topic:'meds',hot:false,q:'A client on amlodipine asks about food or drink to avoid. What should the nurse say?',o:['Avoid all dairy products','Avoid grapefruit juice','Avoid green leafy vegetables','Avoid foods high in protein'],c:1,t:'single',r:'<b>Grapefruit juice raises calcium channel blocker levels</b> and can cause excessive hypotension. Also expect ankle edema, headache, and constipation. <b>Why not the others:</b> Dairy and protein are not restricted. Leafy greens matter for <b>warfarin</b>, not amlodipine. <b>His angle:</b> Match the food rule to the drug; he likes to swap them.'},
{v:2,topic:'breast',hot:true,q:'When should a premenopausal client perform a breast self-exam?',o:['During the heaviest day of her period','Right after her period ends','Any random day of the month','Right before her period starts'],c:1,t:'single',r:'<b>Do it monthly, about 5 to 7 days after the period starts, once bleeding ends</b>, when the breasts are least tender and lumpy from hormones. Postmenopausal clients pick the same date each month. <b>Why not the others:</b> During or right before the period the tissue is swollen and tender, making changes harder to judge. A random day gives no consistency for comparison. <b>His angle:</b> Use the pads of the three middle fingers with light, medium, and deep pressure, and include the axilla.'},
{v:2,topic:'breast',hot:false,q:'Which breast findings should a client report? Select all that apply.',o:['Mild tenderness before her period','Breasts that feel fuller during pregnancy','Skin dimpling or puckering','A new lump or thickening','A nipple that turns inward','Nipple discharge'],c:[2,3,4,5],t:'multi',r:'<b>New lumps, discharge, dimpling, retraction, and orange-peel skin are reportable.</b> <b>Why not the others:</b> Cyclic tenderness before a period and fullness in pregnancy are normal hormonal changes. <b>His angle:</b> Examine standing and lying down, and look in the mirror for skin and contour changes.'},
{v:2,topic:'repro',hot:true,q:'A client had a total hysterectomy with bilateral oophorectomy. What should the nurse anticipate?',o:['Immediate menopause symptoms','Periods continuing for several months','No hormonal change at all','Menopause beginning in about a year'],c:0,t:'single',r:'<b>Removing both ovaries removes the body\'s estrogen source at once, causing surgical menopause immediately.</b> Symptoms start abruptly and are often more intense than natural menopause because there is no gradual decline. <b>Why not the others:</b> There is no delay, hormones do change, and periods stop with the uterus removed. <b>His angle:</b> A hysterectomy alone, with ovaries left in place, does not cause menopause.'},
{v:2,topic:'repro',hot:false,q:'What should the nurse teach a client after a hysterectomy about resuming intimacy?',o:['Nothing in the vagina for about 6 weeks','Intercourse is safe after 3 days','Use tampons instead of pads for bleeding','Resume once the incision stops hurting'],c:0,t:'single',r:'<b>The vaginal cuff needs about 6 weeks to heal</b>, so nothing goes in the vagina, including tampons, and no intercourse until cleared. <b>Why not the others:</b> Three days is far too soon, tampons carry infection risk, and pain is not a reliable measure of internal healing. <b>His angle:</b> Also teach about vaginal dryness and pH changes from low estrogen, and use PLISSIT to open the conversation.'},
{v:2,topic:'repro',hot:true,q:'A nurse teaches an uncircumcised client about hygiene. Which instruction is essential?',o:['Use alcohol wipes to remove smegma','Return the foreskin after cleaning','Leave the foreskin retracted to air dry','Clean only the outside of the foreskin'],c:1,t:'single',r:'<b>Retract, clean with warm water, dry, and always return the foreskin to its normal position.</b> Leaving it retracted causes <b>paraphimosis</b>, a urologic emergency. <b>Why not the others:</b> Alcohol irritates delicate tissue, and cleaning only the outside lets smegma build up under the foreskin, causing odor, irritation, and infection. <b>His angle:</b> He mentioned this directly, and it is also the classic catheter-care trap.'},
{v:2,topic:'sti',hot:true,q:'A client asks why herpes keeps spreading when people know they have it. What is the best explanation?',o:['It can spread even when no sores are present','It is only contagious during treatment','It spreads only through shared towels','It is cured after the first outbreak'],c:0,t:'single',r:'<b>Herpes sheds asymptomatically</b>, so it can be transmitted with no visible sores, which is a major reason it spreads. It is also <b>not a reportable infection</b> in most places. Antivirals reduce outbreaks and transmission but do not cure it. <b>Why not the others:</b> It is contagious outside of treatment, is never cured, and is spread by skin-to-skin and sexual contact rather than towels. <b>His angle:</b> Teach condoms, disclosure to partners, and suppressive therapy options.'},
{v:2,topic:'sti',hot:false,q:'Why does the nurse emphasize retesting and current treatment guidelines for gonorrhea?',o:['It always clears without antibiotics','Gonorrhea is not treatable anymore','Testing is only needed if symptoms return','Antibiotic-resistant strains are increasing'],c:3,t:'single',r:'<b>Resistant strains of gonorrhea are rising</b>, so treatment follows current CDC regimens and clients are retested to confirm cure. <b>Why not the others:</b> It is still treatable, it does not clear on its own, and many infections are <b>asymptomatic</b>, so symptom-based testing misses them. <b>His angle:</b> Treat partners and no intercourse during treatment.'},
{v:2,topic:'female',hot:true,q:'A client asks what a normal menstrual cycle length is. Using his handout, what should the nurse say?',o:['28 days, normal range 24 to 38','14 days, with variation of 10 to 20','35 days, with variation of 30 to 45','21 days, with a normal variation of 14 to 21'],c:0,t:'single',r:'<b>His handout: the cycle averages 28 days, with a normal range of 24 to 38 days.</b> Ovulation is the periodic discharge of a matured ovum and begins at puberty, around ages <b>11 to 13</b>. <b>Why not the others:</b> The other ranges fall outside what is considered normal; 14 days is the length of the luteal phase, not the cycle. <b>His angle:</b> Cycles shorter than 24 or longer than 38 days are reported.'},
{v:2,topic:'female',hot:true,q:'A 47-year-old reports irregular periods, trouble sleeping, brain fog, joint aches, and hot flashes. How should the nurse describe this stage?',o:['Menopause, since symptoms have started','Perimenopause, lasting about 4 to 10 years','Postmenopause, since her periods are irregular','Premenopause, since she still has periods'],c:1,t:'single',r:'<b>Perimenopause is the transition, about 4 to 10 years per his handout</b>, when symptoms fluctuate and periods become irregular and farther apart. <b>Why not the others:</b> Menopause requires <b>12 consecutive months</b> with no period. Postmenopause comes after that. Premenopause means normal, regular cycles. <b>His angle:</b> His symptom list: trouble sleeping, fatigue, brain fog, anxiety, mood swings, vaginal dryness, urinary changes, joint and muscle aches, hot flashes, weight gain.'},
{v:2,topic:'female',hot:false,q:'Which teaching helps a client manage menopausal symptoms and long-term risks, per his handout?',o:['Wear heavier clothing to regulate temperature','Increase caffeine to fight the fatigue','Cool the bedroom with a fan; calcium and vitamin D','Avoid exercise until the hot flashes settle down'],c:2,t:'single',r:'<b>His list: keep the bedroom cool with a fan, reduce stress, avoid caffeine and alcohol, exercise regularly, wear light clothing, maintain a healthy weight, stop smoking, and take calcium and vitamin D</b> to reduce the risk of coronary syndrome and osteoporosis. <b>Why not the others:</b> Caffeine and alcohol are triggers, heavier clothing worsens hot flashes, and exercise protects bone and heart. <b>His angle:</b> Estrogen loss raises both bone and cardiovascular risk.'},
{v:2,topic:'repro',hot:true,q:'A client is 3 weeks post hysterectomy and asks when she can resume intercourse. What should the nurse say?',o:['Wait a full 6 months before any intercourse','It is safe now that the pain has stopped','Wait 4 to 6 weeks and until cleared','Only after her first menstrual period has returned'],c:2,t:'single',r:'<b>His handout: refrain from sex for 4 to 6 weeks</b> while the vaginal cuff heals, and recovery overall can take <b>months</b>. <b>Why not the others:</b> Pain relief does not mean internal healing. Six months is longer than needed. Periods do not return after the uterus is removed. <b>His angle:</b> Also expect possible grief or depression and effects on sexuality; ask about them.'},
{v:2,topic:'repro',hot:false,q:'Which teaching reduces a client\'s risk of cervical cancer, per his handout?',o:['Take a daily multivitamin with extra calcium','Limit red meat and increase dietary fiber','Stop smoking, safe sex, and the HPV vaccine','Have a mammogram every year after 40'],c:2,t:'single',r:'<b>His three: stop smoking, safe sex (his wording is to delay intercourse), and the HPV vaccine.</b> Cervical cancer is driven by <b>HPV</b>, so lowering exposure and vaccinating prevent it, and smoking impairs local immunity. <b>Why not the others:</b> Vitamins and diet do not prevent cervical cancer. Mammograms screen for breast cancer. <b>His angle:</b> Pap tests detect cervical changes early; the vaccine prevents the infection in the first place.'},
{v:2,topic:'sti',hot:true,q:'A client has a single painless, round sore at the site of infection about 3 weeks after exposure. Which stage of syphilis is this?',o:['Primary','Latent','Tertiary','Secondary'],c:0,t:'single',r:'<b>The primary stage is a painless, round sore (chancre) at the site of infection, usually 10 to 90 days after exposure.</b> It heals on its own, which is why it goes untreated. <b>Why not the others:</b> Secondary is the body-wide rash including the palms and soles, about 3 to 6 months after infection. Latent has no symptoms. Tertiary brings heart disease, brain damage, and blindness. <b>His angle:</b> Syphilis is curable if caught early.'},
{v:2,topic:'sti',hot:false,q:'A client with no visible lesions asks how herpes can be diagnosed. What should the nurse explain?',o:['A urine sample confirms the diagnosis','Only a biopsy can confirm herpes','A blood test is used with no lesion','Diagnosis requires waiting for the next outbreak'],c:2,t:'single',r:'<b>His handout: swab the vesicle when a lesion is present; if there is no lesion, a blood test is used.</b> <b>Why not the others:</b> Waiting for an outbreak delays diagnosis, and urine testing and biopsy are not the standard methods. <b>His angle:</b> HSV-1 is usually oral and HSV-2 usually genital, but either can infect either area, and it spreads with no visible symptoms.'},
{v:2,topic:'htn',hot:true,q:'A nurse receives these vital signs on a client 1 day after surgery: BP 176/94, HR 112, RR 28, temperature 101.2 F, SpO2 86% on room air. Which finding does the nurse address first?',o:['Temperature 101.2 F','SpO2 86%','HR 112','BP 176/94'],c:1,t:'single',r:'<b>Work the ABCs.</b> A saturation of 86% with a respiratory rate of 28 is a breathing and oxygenation problem, and hypoxia harms the brain and heart within minutes. <b>Why not the others:</b> The fever, blood pressure, and heart rate all need treatment, but none kills as fast as hypoxia, and the tachycardia and elevated BP are partly the body <b>compensating</b> for the low oxygen. <b>His angle:</b> When more than one value is abnormal, ask which one will kill or hurt them the most.'},
{v:2,topic:'vascular',hot:true,q:'Four clients need attention. Which one should the nurse see first?',o:['A swollen calf awaiting a duplex ultrasound scan','A client with claudication after walking a block','A leg that is cold, mottled, and pulseless','A client with a healing venous ulcer and edema'],c:2,t:'single',r:'<b>Cold, mottled, and pulseless is acute arterial occlusion</b>, one of the 6 Ps, and the limb can be lost within hours without immediate intervention. <b>Why not the others:</b> A swollen calf awaiting imaging is a possible DVT that needs attention soon, not first. Claudication and a healing ulcer are chronic problems. <b>His angle:</b> The 6 Ps: pain, pallor, pulselessness, paresthesia, paralysis, poikilothermia.'},
{v:2,topic:'acs',hot:true,q:'A nurse has four clients. All need something. Who is seen first?',o:['Chest pain at rest for 30 minutes, unrelieved by nitro','Scheduled for discharge teaching after an MI','Chest pain with stairs, relieved by rest','Troponin drawn 2 hours ago, awaiting results'],c:0,t:'single',r:'<b>Pain at rest lasting 30 minutes that nitroglycerin does not relieve means muscle is dying.</b> <b>Why not the others:</b> Exertional pain relieved by rest is stable angina. A pending troponin means the client is being worked up but is not the most urgent. Discharge teaching can wait. <b>His angle:</b> His rule: when all of the options are real, pick the most lethal one.'},
{v:2,topic:'htn',hot:true,q:'A nurse enters the room of a client with a hypertensive emergency. Which finding requires immediate action?',o:['Urine output of 40 mL in the last hour','The client cannot move the right arm','BP 198/118 unchanged from an hour ago','Headache rated 6 out of 10'],c:1,t:'single',r:'<b>New one-sided weakness is a stroke sign</b>, an acute change in a target organ, and stroke treatment is time-dependent. <b>Why not the others:</b> The BP is expected to come down gradually, not suddenly. A headache matters but ranks below focal neurologic deficit. A urine output of 40 mL per hour is adequate. <b>His angle:</b> BE FAST: balance, eyes, face, arms, speech, time.'},
{v:2,topic:'repro',hot:true,q:'A nurse is assigned four clients. Which one is seen first?',o:['A client due for teaching on breast self-exam','A postmenopausal client with vaginal dryness','A man with BPH reporting nocturia three times','A man with BPH who has not voided in 10 hours'],c:3,t:'single',r:'<b>Not voiding for 10 hours with BPH suggests acute urinary retention</b>, which causes severe pain and can back pressure up into the kidneys. <b>Why not the others:</b> Nocturia, dryness, and a teaching session are not urgent. <b>His angle:</b> Retained urine leads to UTI, stones, hydronephrosis, and azotemia.'},
{v:2,topic:'vascular',hot:true,q:'Four clients on anticoagulants report new findings. Which one needs attention first?',o:['Pink-tinged urine noted once today','New bruising on both forearms','Sudden severe headache with confusion','Bleeding gums after brushing'],c:2,t:'single',r:'<b>A sudden severe headache with confusion on an anticoagulant suggests intracranial bleeding</b>, which is rapidly fatal. <b>Why not the others:</b> Bruising, one episode of pink urine, and bleeding gums are all reportable, but they are not immediately life-threatening. <b>His angle:</b> When every option is a real bleeding sign, pick the one in the brain.'},
{v:2,topic:'htn',hot:false,q:'A client has BP 184/112, a headache, and blurred vision. Which assessment finding would change this from urgency to emergency?',o:['Anxiety about the reading','A heart rate of 96','Creatinine rising from 1.0 to 2.3','A reported missed dose yesterday'],c:2,t:'single',r:'<b>A rising creatinine means the kidneys are being damaged, which is target organ damage and makes it an emergency.</b> <b>Why not the others:</b> A heart rate of 96, anxiety, and a missed dose do not show organ damage; a missed dose is a common cause of <b>urgency</b>. <b>His angle:</b> The number never decides it. Organ damage does.'},
{v:2,topic:'cardio',hot:true,q:'A client with heart failure has these findings: weight up 5 pounds in 2 days, crackles in both lung bases, SpO2 89%, BP 148/88. Which is the priority?',o:['The blood pressure','The saturation with the crackles','The 5-pound weight gain','The client\'s reported thirst'],c:1,t:'single',r:'<b>Crackles with a saturation of 89% mean fluid is in the lungs now and gas exchange is impaired.</b> That is a breathing problem, so it comes first. <b>Why not the others:</b> The weight gain explains <b>why</b> it happened and matters for treatment, but the airway and breathing problem is the emergency. The BP is elevated but not a crisis, and thirst is a symptom. <b>His angle:</b> The findings are linked: rising preload backed fluid into the lungs.'},
{v:2,topic:'acs',hot:true,q:'A client who received nitroglycerin 5 minutes ago for chest pain now has a BP of 78/44 and is dizzy. What should the nurse do first?',o:['Give the second nitroglycerin dose','Recheck the blood pressure again in 15 minutes','Lower the head of bed and raise the legs','Ambulate the client to improve circulation'],c:2,t:'single',r:'<b>Nitrates dilate vessels and can drop blood pressure sharply.</b> Positioning to improve venous return and perfusion comes first, then notify the provider and hold further nitrates for a systolic under 90. <b>Why not the others:</b> A second dose deepens the hypotension. Ambulating a dizzy, hypotensive client risks a fall. Waiting 15 minutes leaves them underperfused. <b>His angle:</b> Check BP before and after every nitrate dose.'},
{v:2,topic:'vascular',hot:true,q:'A client 2 days after hip surgery suddenly has a heart rate of 126, respiratory rate of 30, SpO2 of 87%, and sharp chest pain with breathing. What should the nurse suspect?',o:['Incisional pain flare','Expected postoperative fever','Pulmonary embolism','Anxiety from the surgery'],c:2,t:'single',r:'<b>Sudden dyspnea, tachycardia, hypoxia, and pleuritic chest pain after orthopedic surgery point to a pulmonary embolism</b> from a DVT. Surgery and immobility are two corners of Virchow\'s triad. <b>Why not the others:</b> Anxiety and incisional pain do not cause hypoxia, and no fever is described. Assuming anxiety in a hypoxic postoperative client is the trap. <b>His angle:</b> Stay with the client, raise the head of the bed, give oxygen, and call for help.'},
{v:2,topic:'htn',hot:false,q:'A client on a nitroprusside drip for hypertensive emergency has a BP that falls from 220/120 to 130/70 within 30 minutes. What is the nurse\'s priority action?',o:['Document the improvement and recheck later','Slow the drip and notify the provider','Continue at the same rate','Increase the rate to reach 120/80'],c:1,t:'single',r:'<b>Dropping the pressure too fast causes cerebral, cardiac, and renal ischemia</b>, because the brain has adapted to the high pressure. The first-hour limit is <b>no more than a 25% reduction</b>, and this fell about 40%. <b>Why not the others:</b> Continuing or increasing the rate worsens it, and documenting without acting ignores a dangerous drop. <b>His angle:</b> Fast is not better; controlled is better.'},
{v:2,topic:'repro',hot:true,q:'A client 6 hours after a TURP has bright red urine with clots and reports bladder spasms and a feeling of fullness. What should the nurse do first?',o:['Check the catheter and irrigation for blockage','Encourage the client to drink more fluids','Give the ordered antispasmodic medication','Reposition the client and reassess in an hour'],c:0,t:'single',r:'<b>Bright red urine with clots and a feeling of fullness suggests the catheter is obstructed</b>, so urine and blood are not draining and the bladder is distending. Check the tubing and the continuous bladder irrigation first. <b>Why not the others:</b> An antispasmodic treats a symptom whose cause is the obstruction. Oral fluids do not clear a blocked catheter. Waiting an hour risks bladder distention and more bleeding. <b>His angle:</b> Pink-tinged is expected after a TURP; bright red with clots is reported.'},

function getExamQ(qi){
  const base=EXAM[qi];
  if(base.t==='match'){
    if(!examShuffleMap[qi]){
      const order=shuffleAnswers?shuffle(base.items.map((_,i)=>i)):base.items.map((_,i)=>i);
      examShuffleMap[qi]=order;
    }
    const defOrder=examShuffleMap[qi];
    const defs=defOrder.map(i=>base.items[i].def);
    return {q:base.q, r:base.r, t:'match', items:base.items, defs, defOrder};
  }
  if(base.t==='order'){
    if(!examShuffleMap[qi]){
      const order=shuffleAnswers?shuffle(base.steps.map((_,i)=>i)):base.steps.map((_,i)=>i);
      examShuffleMap[qi]=order;
    }
    const order=examShuffleMap[qi];
    const steps=order.map(i=>base.steps[i]);
    return {q:base.q, r:base.r, t:'order', steps, displayOrder:order};
  }
  if(!examShuffleMap[qi]){
    const order=shuffleAnswers?shuffle(base.o.map((_,i)=>i)):base.o.map((_,i)=>i);
    examShuffleMap[qi]=order;
  }
  const order=examShuffleMap[qi];
  const opts=relabel(order.map(i=>base.o[i]));
  let correct;
  if(base.t==='multi'){
    const cset=new Set(base.c);
    correct=order.map((origIdx,newIdx)=>cset.has(origIdx)?newIdx:null).filter(x=>x!==null);
  } else {
    correct=order.indexOf(base.c);
  }
  return {q:base.q, r:base.r, t:base.t, o:opts, c:correct};
}

function isExamCorrect(q, ans){

  if(q.t==='match') return q.items.every((_,i)=>ans && ans[i]!==undefined && q.defOrder[ans[i]]===i);

}

function examAnswerSummary(q, ans){

<script>
/* back to top visibility */
(function(){
  const btn=document.getElementById('backToTopBtn');
