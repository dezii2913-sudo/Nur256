document.getElementById('sec-vascular').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🦵</span> PAD / PVD / DVT</h2>
<p class="intro-line">Arterial vs. venous disease — different mechanisms, different symptoms, different treatments. Confusing the two is the classic trap.</p>
<div class="card" style="border-color:var(--amber)">
  <h3>⭐ From tonight's lecture: vascular points he clarified</h3>
  <table class="lab">
    <tr><th>Point</th><th>Detail</th></tr>
    <tr><td><b>⭐ ABI is the PAD test</b></td><td>He corrected where ABI is documented: it is the main <b>noninvasive test for peripheral ARTERIAL disease</b>, comparing ankle to brachial systolic pressure. <b>Normal 1.0 to 1.4.</b> Ultrasound and angiography visualize the flow directly</td></tr>
    <tr><td><b>Arteriosclerosis and atherosclerosis</b></td><td>Hardening of the arteries and plaque buildup nearly always occur together, and PAD shares its risk factors with <b>coronary artery disease</b>. <b>Smoking and diabetes</b> have the biggest impact. Inflammatory and genetic factors can't be changed</td></tr>
    <tr><td><b>Arteries vs veins</b></td><td><b>Arteries are high-pressure</b> vessels with thick muscular walls. <b>Veins are low-pressure</b> and depend on one-way valves and the calf muscle pump. When valves fail, pressure backs up, fluid leaks out, and <b>edema and ulcers</b> form</td></tr>
    <tr><td><b>How clots start</b></td><td>Irregular or damaged vessel walls create <b>turbulent flow</b>, and inflammation and metabolic conditions make the blood <b>hypercoagulable</b>. Together with stasis, that is Virchow's triad, the primary risk for DVT</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ His advanced question: why PAD vs venous matters for positioning</div><div class="big">The wrong position makes the disease worse</div><div class="exp">In PAD the problem is <b>blood getting IN</b>, so you <b>dangle</b> the legs and let gravity help arterial flow; elevating or compressing starves the tissue further. In venous disease the problem is <b>blood getting OUT</b>, so you <b>elevate</b> and use compression; dangling adds to the pooling. Treatment follows the same logic: <b>antiplatelets and statins</b> for arterial plaque, <b>anticoagulants</b> for venous clots.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ PVD is the umbrella term</h3>
  <p class="why-chain"><b>Peripheral vascular disease (PVD) covers all three peripheral systems, and destruction can occur in any of them.</b> Ch 27: peripheral vascular diseases are categorized as <b>arterial, venous, or lymphatic</b>.</p>
  <table class="lab">
    <tr><th>Under the PVD umbrella</th><th>What's damaged</th><th>Main result</th></tr>
    <tr><td><b>Peripheral ARTERIAL disease (PAD)</b></td><td>Arteries carrying blood <b>away from</b> the heart</td><td><b>Not enough oxygen gets in</b> → ischemia, claudication, critical limb ischemia</td></tr>
    <tr><td><b>Peripheral VENOUS disease</b></td><td>Veins returning blood <b>to</b> the heart</td><td><b>Blood can't get out</b> → pooling, edema, DVT, venous ulcers</td></tr>
    <tr><td><b>Peripheral LYMPHATIC disease</b></td><td>Lymph vessels draining fluid from the tissues</td><td><b>Lymph can't drain</b> → lymphedema, lymphangitis</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ How to answer a PVD question</div><div class="big">PVD = arterial + venous + lymphatic. PAD is only one part of it.</div><div class="exp">If a question says <b>PVD</b>, don't assume veins or arteries. Read the signs to tell which system is damaged. (The NCLEX hack chart on his handout labels the venous column "PVD"; for his exam, PVD is the umbrella.)</div></div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Buerger's disease vs Raynaud's, from his handout</h3>
  <table class="lab">
    <tr><th></th><th>BUERGER'S DISEASE</th><th>RAYNAUD'S</th></tr>
    <tr><td><b>Cause</b></td><td><b>Tobacco smoke</b> causes an <b>inflammatory thrombus in small and medium arteries</b></td><td><b>Cold or stress</b> narrows the vessels (vasospasm)</td></tr>
    <tr><td><b>Symptoms</b></td><td><b>Pain in the hands and feet, especially with vigorous activity.</b> Fingers and toes may turn <b>pale or blue</b> from restricted flow</td><td><b>Sudden color change in the fingers and toes with paresthesia</b> (numbness and tingling). Classically white, then blue, then red as flow returns</td></tr>
    <tr><td><b>⭐ Treatment</b></td><td><b>STOP SMOKING.</b> Quitting all tobacco is the treatment; nothing else works if smoking continues</td><td><b>Keep warm and manage stress.</b> Warm gloves and socks, meditation or yoga. Medication (often a calcium channel blocker) in severe cases</td></tr>
    <tr><td><b>Who</b></td><td>Typically younger men who smoke heavily</td><td>More common in women; can be primary or secondary to another disease</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ One word each</div><div class="big">Buerger's = SMOKING. Raynaud's = COLD and STRESS.</div><div class="exp">Both cause color changes in fingers and toes, so the <b>trigger in the stem</b> tells you which one it is. Both are <b>vasospastic or inflammatory</b> problems of the small vessels, not plaque like PAD.</div></div>
  <div class="hy"><span class="tag">Teaching for both</span><b>No tobacco or nicotine in any form</b> (it constricts vessels), avoid cold exposure, wear gloves even to handle frozen food, avoid caffeine and stimulants, protect the hands and feet from injury, and <b>inspect for sores that are not healing</b>.</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ PAD vs venous disease, his NCLEX hack</h3>
  <p class="why-chain">This chart compares the two most tested members of the PVD umbrella: <b>peripheral arterial disease</b> and <b>peripheral venous disease</b>. (The chart labels the venous column "PVD"; in his framework PVD is the umbrella over arterial, venous, and lymphatic.)</p>
  <table class="lab">
    <tr><th></th><th>PAD (arterial)</th><th>Venous disease</th></tr>
    <tr><td><b>Problem</b></td><td>Narrowed <b>ARTERIES</b> that carry blood <b>away from</b> the heart → <b>no oxygen to the legs</b></td><td>Narrowed or incompetent <b>VEINS</b> that return blood <b>to</b> the heart → <b>blood POOLS</b></td></tr>
    <tr><td><b>⭐ Mnemonic</b></td><td><b>PAINS</b></td><td><b>WIPED</b></td></tr>
    <tr><td><b>Signs</b></td><td><b>P</b>ressure (BP) up · <b>A</b>bsence of hair · <b>I</b>ntermittent claudication · <b>N</b>o palpable pulse · <b>S</b>kin cool</td><td><b>W</b>arm and brown extremities · <b>I</b>tching skin · <b>P</b>rolonged standing or sitting pain · <b>E</b>dema · <b>D</b>ull ache</td></tr>
    <tr><td><b>Ulcer</b></td><td><b>"Punched out"</b>, round, defined edges, pale deep base, very painful, on toes and feet</td><td><b>Irregular edges</b>, drainage, pink wound bed, <b>brown periwound</b>, usually inner ankle</td></tr>
    <tr><td><b>⭐ Leg position</b></td><td><b>DANGLE the legs</b> — gravity helps arterial blood reach the feet</td><td><b>ELEVATE the legs</b> — gravity helps venous blood return</td></tr>
    <tr><td><b>Color with position</b></td><td><b>Dependent RUBOR</b> when dangled, <b>PALLOR</b> when elevated</td><td>Brownish discoloration from pooled blood</td></tr>
    <tr><td><b>Treatment</b></td><td><b>Antiplatelets</b>, statins, ACE inhibitors or ARBs, low-fat diet and exercise, <b>smoking cessation</b></td><td><b>Anticoagulants</b>, statins, thrombolytics for clots, <b>compression stockings</b>, elevate legs regularly</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The NCLEX tip on his chart</div><div class="big">PAD: "DR. EP" — Dangle = Rubor, Elevate = Pale</div><div class="exp">And the positioning rule: <b>venous, elevate. Arterial, dangle.</b> Compression stockings help venous disease but can <b>worsen</b> arterial disease by squeezing already-poor inflow.</div></div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ Why veins pool: the valve figure</h3>
  <p>Leg veins carry blood <b>uphill against gravity</b>. One-way valves let blood move toward the heart and snap shut to stop it falling back.</p>
  <table class="lab">
    <tr><td><b>Competent valve, open</b></td><td>Blood moves up toward the heart, pushed by the calf muscle pump</td></tr>
    <tr><td><b>Competent valve, closed</b></td><td>Blocks backflow between muscle contractions</td></tr>
    <tr><td><b>Incompetent valve</b></td><td>Leaflets no longer meet, so <b>blood falls back and pools</b>. Pressure builds, veins stretch (varicose veins), fluid leaks out (edema), and iron from red cells stains the skin brown</td></tr>
  </table>
  <div class="hy"><span class="tag">Why walking helps venous disease</span>Contracting calf muscles squeeze the veins and push blood up through the valves. <b>Prolonged standing or sitting</b> removes that pump, which is the P in WIPED.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ PAD, the full picture from his handout</h3>
  <table class="lab">
    <tr><th>Area</th><th>Detail</th></tr>
    <tr><td><b>Causes</b></td><td>⭐ <b>Main causes: hypertension and atherosclerosis.</b> Also: <b>Atherosclerosis</b> (fatty plaque) · <b>smoking</b> (the major risk) · <b>diabetes</b> · <b>hypertension</b> · <b>hyperlipidemia</b> (high LDL, low HDL) · <b>stress</b> · <b>sedentary lifestyle</b> · <b>inflammation</b>. Nonmodifiable: <b>age and genetics</b></td></tr>
    <tr><td><b>Symptoms</b></td><td><b>Intermittent claudication</b> (leg pain or cramping with exercise, relieved by rest) · numbness or weakness · <b>coldness</b>, especially compared with the other leg · <b>sores that won't heal</b> · pale or bluish color</td></tr>
    <tr><td><b>⭐ Diagnosis</b></td><td><b>Ankle-brachial index (ABI): normal 1 to 1.4.</b> Under 0.9 indicates PAD. Also ultrasound, <b>angiography</b> with dye, and blood tests for diabetes and cholesterol</td></tr>
    <tr><td><b>Treatment</b></td><td>Lifestyle (quit smoking, exercise, diet) · meds to lower cholesterol, control BP, and manage pain · <b>cilostazol</b> for claudication · <b>angioplasty</b> to open arteries · <b>bypass surgery</b> to reroute flow</td></tr>
    <tr><td><b>His goals</b></td><td><b>Improve mobilization and circulation</b></td></tr>
    <tr><td><b>Nursing</b></td><td>Teaching on lifestyle and adherence · monitor vitals and symptoms · wound care · pain management · <b>supervised exercise programs</b></td></tr>
    <tr><td><b>Complications</b></td><td><b>Critical limb ischemia</b> (pain at rest, non-healing sores, gangrene) · <b>stroke</b> · <b>heart attack</b> — the same atherosclerosis affects every artery</td></tr>
  </table>
  <div class="hy"><span class="tag">ABI in plain terms</span>Ankle systolic pressure divided by arm systolic pressure. Normally the ankle is equal to or a bit higher than the arm, so the ratio is <b>1 to 1.4</b>. If plaque blocks the leg arteries, the ankle pressure drops and so does the ratio.</div>
  <div class="hy"><span class="tag">Nursing diagnoses he listed</span>Ineffective peripheral tissue perfusion · chronic pain · impaired skin integrity · activity intolerance · risk for infection · knowledge deficit · risk for ineffective therapeutic regimen management.</div>
  <div class="trap"><span class="tag">Walking is the treatment, not the enemy</span>Claudication hurts, but a <b>supervised walking program</b> (walk until pain, rest, repeat) builds collateral circulation. Telling a PAD client to avoid walking is wrong.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ PAD: main causes, intermittent claudication, and critical limb ischemia</h3>
  <div class="mnem"><div class="tag">⭐ His main causes</div><div class="big">Hypertension and atherosclerosis</div><div class="exp"><b>Atherosclerosis</b> builds plaque that narrows the arteries. <b>Hypertension</b> damages the vessel lining and <b>speeds up plaque formation</b> (Ch 27: a major risk factor that accelerates atherosclerotic lesions). Smoking, diabetes, and hyperlipidemia add to it. Atherosclerosis is a <b>whole-body</b> disease, so PAD in the legs means plaque is likely in the heart and brain too.</div></div>
  <table class="lab">
    <tr><th></th><th>INTERMITTENT CLAUDICATION</th><th>CRITICAL LIMB ISCHEMIA</th></tr>
    <tr><td><b>What it is</b></td><td>Cramping, aching, or fatigue in the muscles <b>during activity</b>, from not enough blood flow when demand rises</td><td>The <b>most severe</b> stage of PAD: flow is too low even <b>at rest</b></td></tr>
    <tr><td><b>When it hurts</b></td><td><b>With walking or exercise</b></td><td><b>At rest</b>, often <b>worse at night</b> in bed</td></tr>
    <tr><td><b>What relieves it</b></td><td><b>Rest</b>, within a few minutes</td><td><b>Dangling the leg</b> (dependent position) so gravity helps flow; many clients sleep sitting up</td></tr>
    <tr><td><b>Other findings</b></td><td>Weak pulses, cool skin, hair loss</td><td><b>Non-healing ulcers</b>, <b>gangrene</b>, pallor on elevation and dependent rubor, very low ABI</td></tr>
    <tr><td><b>Risk</b></td><td>Marker of generalized atherosclerosis</td><td><b>Limb loss</b> without revascularization; also high risk of MI and stroke</td></tr>
  </table>
  <div class="hy"><span class="tag">⭐ The location of the pain points to the blockage (Ch 27)</span>The pain occurs <b>below</b> the narrowed artery. <b>Calf pain → superficial femoral or popliteal artery. Hip or buttock pain → abdominal aorta or iliac arteries.</b> Document the <b>distance walked before pain starts</b>; a shrinking distance means the disease is progressing.</div>
  <div class="trap"><span class="tag">⭐ Rest pain is a red flag</span>Pain that <b>wakes the client at night</b> and eases when the foot hangs over the edge of the bed is no longer claudication. It is <b>critical limb ischemia</b> and needs urgent evaluation. Older adults may show limb ischemia or gangrene as the <b>first</b> sign of PAD.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ Other risk markers: CRP and homocysteine (Ch 27)</h3>
  <table class="lab">
    <tr><th>Marker</th><th>What it means</th></tr>
    <tr><td><b>C-reactive protein (CRP)</b></td><td>A marker of <b>inflammation</b> in the vessels. Elevated levels raise cardiovascular and PAD risk. The <b>high-sensitivity CRP (hs-CRP)</b> test is recommended</td></tr>
    <tr><td><b>Homocysteine</b></td><td>An amino acid that <b>promotes coagulation</b> and damages the vessel lining. <b>Hyperhomocysteinemia</b> is a risk factor for atherosclerosis. But lowering it (for example with B vitamins) has <b>not been shown to prevent</b> heart attacks or strokes</td></tr>
  </table>
  <div class="hy"><span class="tag">Other atherosclerosis risk factors on the slide</span><b>Nicotine</b> (vasoconstriction, higher HR and BP, more clotting, lower HDL) · <b>diabetes</b> (raises PAD risk two to four times) · obesity · stress · lack of exercise.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ Peripheral lymphatic disease</h3>
  <p class="why-chain">Lymph vessels carry excess tissue fluid back to the veins. When they are blocked or damaged, <b>fluid collects in the tissues</b>.</p>
  <table class="lab">
    <tr><th>Disorder</th><th>What it is</th><th>Signs and management</th></tr>
    <tr><td><b>Lymphedema</b></td><td>Swelling from <b>obstructed lymph vessels</b>. <b>Primary</b> (congenital) or <b>secondary</b> (acquired, such as <b>after axillary lymph node removal for breast cancer</b>, or with chronic venous disease)</td><td>Edema starts <b>soft and pitting</b> and becomes <b>firm and nonpitting</b>. Manage with <b>elevation, exercise, custom compression garments, manual lymphatic drainage</b>, skin care. <b>Diuretics are not used.</b> High infection risk</td></tr>
    <tr><td><b>Lymphangitis</b></td><td>Acute inflammation of the lymph channels, usually from <b>streptococcus</b> spreading from a skin infection</td><td><b>Red streaks running up the arm or leg</b> from the infection site, fever. Antibiotics</td></tr>
    <tr><td><b>Lymphadenitis</b></td><td>Inflamed lymph nodes</td><td><b>Enlarged, red, tender nodes</b> in the groin, axilla, or neck</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Tell the three swellings apart</div><div class="big">Venous edema pits and brown-stains. Lymphedema turns firm and nonpitting. Arterial disease rarely swells.</div></div>
  <div class="hy"><span class="tag">Cross-unit link</span>Arm lymphedema after breast cancer surgery connects this to the breast chapter: <b>no BPs, IVs, or blood draws on the affected arm</b>, and protect it from injury and burns.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ Peripheral vascular disease (the umbrella), his definition</h3>
  <p><b>Long-term damage to vessels causes plaque buildup that makes it hard for oxygen, nutrients, and waste to move through the venous and arterial system. This leads to necrosis and tissue death.</b></p>
  <table class="lab">
    <tr><td><b>Risks</b></td><td>Everything on the PAD list <b>plus a history of DVT and immobility</b></td></tr>
    <tr><td><b>Signs</b></td><td><b>Rubor or paleness</b> · <b>pain with elevation or hanging the feet</b> · <b>poor capillary refill</b> · <b>weak peripheral pulses</b> · pain, tingling, numbness</td></tr>
    <tr><td><b>Tests</b></td><td>History and physical · <b>ABI</b> · <b>Doppler ultrasound</b> · <b>angiography</b> · <b>duplex Doppler</b></td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Anticoagulants, from his handout</h3>
  <table class="lab">
    <tr><th>Drug</th><th>Monitor</th><th>Key points</th></tr>
    <tr><td><b>Heparin</b><br>(indirect thrombin inhibitor)</td><td><b>aPTT</b> · <b>platelets</b> · <b>weight</b> · signs of bleeding</td><td>IV or subcut. Weight-based dosing. Platelets are watched for <b>heparin-induced thrombocytopenia (HIT)</b>. Antidote: <b>protamine sulfate</b></td></tr>
    <tr><td><b>Warfarin (Coumadin)</b><br>(vitamin K antagonist)</td><td><b>INR, goal 2 to 3</b> · bleeding</td><td><b>Eat a CONSISTENT amount of leafy greens</b>, don't avoid them. <b>Missed dose: take it as soon as possible the same day; never double up.</b> Antidote: <b>vitamin K</b></td></tr>
    <tr><td><b>Argatroban</b><br>(direct thrombin inhibitor)</td><td>aPTT · bleeding</td><td>IV. Used when heparin can't be, such as <b>HIT</b></td></tr>
    <tr><td><b>Apixaban</b><br>(factor Xa inhibitor)</td><td>Bleeding, renal function</td><td>Oral, fixed dosing, <b>no routine INR</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Match the lab to the drug</div><div class="big">Heparin = aPTT · Warfarin = PT/INR</div><div class="exp">A common memory aid: <b>"War on the PT boat"</b> (warfarin goes with PT/INR), so heparin is the aPTT drug. Heparin works immediately; warfarin takes several days, which is why the two overlap until the INR is therapeutic.</div></div>
  <div class="trap"><span class="tag">The leafy green trap</span>Clients often think they must avoid vitamin K foods. The teaching is <b>consistency</b>. A sudden increase lowers the INR; a sudden stop raises it.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ DVT, from his handout</h3>
  <div class="mnem"><div class="tag">⭐ Virchow's triad</div><div class="big">Endothelial damage · abnormal blood flow (stasis) · hypercoagulability</div><div class="exp">Any one raises risk; together they make a clot likely. <b>Damage:</b> surgery, trauma, IV lines. <b>Stasis:</b> immobility, long travel, heart failure. <b>Hypercoagulability:</b> cancer, pregnancy, estrogen, smoking, dehydration, factor V Leiden.</div></div>
  <table class="lab">
    <tr><td><b>Diagnostics</b></td><td>CBC · PT · aPTT · INR · CRP · <b>factor V Leiden</b> (inherited clotting disorder) · <b>D-dimer</b> (a clot-breakdown product; normal helps rule DVT out, high means look further) · duplex ultrasound confirms</td></tr>
    <tr><td><b>Treatment choice depends on</b></td><td>Severity of the clot · overall health · <b>bleeding risk</b> · available resources</td></tr>
    <tr><td><b>Drugs</b></td><td>Heparin · warfarin (a vitamin K antagonist) · <b>direct thrombin inhibitors</b> (argatroban) · <b>factor Xa inhibitors</b> (apixaban)</td></tr>
    <tr><td><b>If anticoagulation fails or is contraindicated</b></td><td>Interventional procedures, such as an IVC filter or thrombectomy</td></tr>
    <tr><td><b>Supportive care</b></td><td><b>Compression stockings</b> to improve flow and reduce swelling · <b>elevate the affected leg</b> · pain relief</td></tr>
  </table>
  <div class="trap"><span class="tag">Never massage the leg</span>Massaging a suspected DVT can dislodge the clot and send it to the lungs as a pulmonary embolism. <b>Sudden dyspnea, chest pain, and tachycardia</b> in a DVT client is a PE until proven otherwise.</div>
</div>


<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Risk factors: PAD and PVD share the same list, and PVD adds DVT</h3>
  <table class="lab">
    <tr><th>Shared by PAD and PVD</th><th>PVD adds</th></tr>
    <tr><td><b>Hypertension · atherosclerosis · smoking · diabetes · hyperlipidemia (high LDL, low HDL) · stress · sedentary lifestyle · inflammation · obesity</b>. Nonmodifiable: <b>age and genetics</b></td><td><b>History of DVT</b> and <b>immobility</b>, the venous side, explained by <b>Virchow's triad</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Virchow's triad, the three ways a clot forms</div><div class="big">Endothelial damage · abnormal flow (stasis) · hypercoagulability</div><div class="exp"><b>Damage:</b> surgery (especially hip and knee), trauma, IV catheters, prior DVT. <b>Stasis:</b> <b>immobility</b>, bed rest, long flights or car rides, paralysis, heart failure, incompetent valves. <b>Hypercoagulability:</b> cancer, pregnancy, <b>estrogen and oral contraceptives</b>, smoking, dehydration, <b>factor V Leiden</b>. Place any risk factor into one of the three.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Estrogen and oral contraceptives: a clot and BP risk</h3>
  <p class="why-chain">Estrogen increases clotting factors, which puts it in the <b>hypercoagulability</b> corner of Virchow's triad. It can also <b>raise blood pressure</b> and is a known cause of secondary hypertension.</p>
  <table class="lab">
    <tr><th>Combined (estrogen) oral contraceptives are generally avoided with</th></tr>
    <tr><td>A <b>history of DVT, PE, or a known clotting disorder</b> (such as factor V Leiden)</td></tr>
    <tr><td><b>Smoking at age 35 or older</b></td></tr>
    <tr><td><b>Uncontrolled hypertension</b></td></tr>
    <tr><td>A history of <b>stroke, MI, or coronary artery disease</b></td></tr>
    <tr><td><b>Migraine with aura</b></td></tr>
    <tr><td><b>Breast cancer</b>, active liver disease, or pregnancy</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Warning signs to teach: ACHES</div><div class="big">Abdominal pain · Chest pain · Headache · Eye problems · Severe leg pain</div><div class="exp">Each points to a clot somewhere: abdomen or liver, lungs or heart, brain, eyes, or a DVT in the leg. Stop and seek care right away.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ DVT to PE: what happens when the clot breaks off</h3>
  <table class="lab">
    <tr><th>DVT signs (often subtle)</th><th>How it's diagnosed</th></tr>
    <tr><td><b>ONE leg</b>: swelling, pain or tenderness in the calf or thigh, <b>warmth</b>, redness, a difference in calf circumference compared with the other leg. <b>Many DVTs have no symptoms</b></td><td>His list: CBC, PT, aPTT, INR, CRP, factor V Leiden, <b>D-dimer</b> (normal helps rule DVT out; high means look further). <b>Duplex/Doppler ultrasound confirms it.</b></td></tr>
  </table>
  <ol class="chainlist">
    <li><b>1.</b> A piece of the clot breaks loose in a deep leg vein. It is now an <b>embolus</b>.</li>
    <li><b>2.</b> It travels up the <b>inferior vena cava</b> to the <b>right atrium</b>.</li>
    <li><b>3.</b> Through the tricuspid valve into the <b>right ventricle</b>.</li>
    <li><b>4.</b> Out the pulmonic valve into the <b>pulmonary artery</b>, where it lodges and blocks flow to part of the lung. <b>That is a pulmonary embolism.</b></li>
  </ol>
  <div class="mnem"><div class="tag">⭐ Follow the blood flow you already know</div><div class="big">Leg vein → vena cava → right heart → pulmonary artery → PE</div><div class="exp">A venous clot goes to the <b>lungs</b>, not the brain, because the right side of the heart pumps to the lungs. The lungs act as a filter.</div></div>
  <table class="lab">
    <tr><th>PE signs</th><th>Priority nursing actions</th></tr>
    <tr><td><b>Sudden dyspnea</b> (most common) · <b>sudden sharp chest pain</b>, worse with breathing · <b>tachycardia</b> and <b>tachypnea</b> · <b>anxiety or sense of doom</b> · low oxygen saturation · cough, possibly <b>blood-streaked sputum</b> · hypotension if large</td><td><b>Stay with the client</b> and call the rapid response team · <b>raise the head of the bed</b> · <b>apply oxygen</b> · assess vitals and SpO₂ · prepare for anticoagulation and a <b>CT pulmonary angiogram</b> (the test that confirms PE)</td></tr>
  </table>
  <div class="trap"><span class="tag">⭐ The DVT client who suddenly can't breathe</span>A client being treated for DVT who develops <b>sudden shortness of breath, chest pain, and a racing heart</b> has a PE until proven otherwise. That is why you <b>never massage the leg</b>, and why a new DVT client often starts on <b>bed rest with the leg elevated</b> until anticoagulation is working, per orders.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ Heparin vs Coumadin: what to monitor</h3>
  <table class="lab">
    <tr><th></th><th>HEPARIN</th><th>COUMADIN (warfarin)</th></tr>
    <tr><td><b>Route and onset</b></td><td>IV or subcut, works <b>immediately</b></td><td>Oral, takes <b>several days</b> to reach effect</td></tr>
    <tr><td><b>⭐ Lab</b></td><td><b>aPTT</b>, usually kept about <b>1.5 to 2.5 times the control</b> value</td><td><b>PT/INR</b>, goal <b>INR 2 to 3</b></td></tr>
    <tr><td><b>⭐ Also monitor</b></td><td><b>Platelets</b> (a big drop means <b>HIT</b>) · <b>weight</b> (dosing is weight-based) · signs of bleeding</td><td>Signs of bleeding · <b>diet</b> · drug interactions</td></tr>
    <tr><td><b>Antidote</b></td><td><b>Protamine sulfate</b></td><td><b>Vitamin K</b></td></tr>
    <tr><td><b>⭐ Teaching</b></td><td>Given in the hospital; report bleeding or bruising</td><td><b>Eat a CONSISTENT amount of leafy greens</b> (don't avoid, don't binge) · take a <b>missed dose as soon as possible the same day, never double up</b> · keep INR appointments · medical alert ID</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Why they overlap</div><div class="big">Heparin covers the gap while Coumadin kicks in</div><div class="exp">Heparin works now; Coumadin takes days. They are given together until the <b>INR is therapeutic</b>, then heparin is stopped.</div></div>
  <div class="hy"><span class="tag">⭐ Leafy greens, the reason</span>Leafy greens (spinach, kale, broccoli, lettuce) are high in <b>vitamin K</b>, which is Coumadin's antidote. Eating <b>a lot more</b> suddenly makes the INR <b>drop</b> (clot risk); cutting them out suddenly makes it <b>rise</b> (bleeding risk). <b>Consistency keeps the INR steady.</b></div>
  <div class="trap"><span class="tag">⭐ Bleeding precautions for both</span><b>Soft toothbrush · electric razor · no contact sports · avoid aspirin and NSAIDs</b> unless ordered · no IM injections when possible · hold pressure longer after needle sticks · report black or tarry stools, blood in urine, nosebleeds, bleeding gums, unusual bruising, severe headache.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ Treatment: anticoagulants, compression, and positioning</h3>
  <table class="lab">
    <tr><th>Treatment</th><th>Venous side (PVD, DVT)</th><th>Arterial side (PAD)</th></tr>
    <tr><td><b>Drugs</b></td><td><b>Anticoagulants</b>: heparin, Coumadin, argatroban, apixaban</td><td>Antiplatelets, statins, BP control, cilostazol</td></tr>
    <tr><td><b>⭐ Position</b></td><td><b>ELEVATE</b> the legs to help blood return</td><td><b>DANGLE</b> the legs so gravity helps blood reach the feet</td></tr>
    <tr><td><b>Compression stockings</b></td><td><b>Yes</b>: improve venous return and reduce swelling</td><td><b>No</b>: squeezing worsens already poor arterial inflow</td></tr>
  </table>
  <div class="hy"><span class="tag">Applying compression stockings</span>Put them on <b>in the morning before getting out of bed</b>, before the legs swell. Smooth, no wrinkles or rolled tops (a rolled band acts like a tourniquet). Measure for correct size. Remove daily to inspect the skin.</div>
  <div class="hy"><span class="tag">His four factors for choosing DVT treatment</span><b>Severity of the clot · the client's overall health · risk of bleeding · availability of resources.</b> If anticoagulation is contraindicated or not working, an interventional procedure (such as an IVC filter) is considered.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🦵 Peripheral Arterial Disease (PAD)</h3>
  <ul class="clean">
    <li><b>Cause:</b> atherosclerosis narrowing arteries. Nonmodifiable: age, genetics. Modifiable: smoking (major risk factor), diabetes, HTN, hyperlipidemia, stress, sedentary lifestyle, inflammation.</li>
    <li><b>Symptoms:</b> <b>intermittent claudication</b> (pain/cramping with exercise, relieved by rest), numbness/weakness, coldness of the limb, non-healing sores on toes/feet/legs, pale or bluish skin color.</li>
    <li><b>Critical Limb Ischemia (CLI)</b> — the escalation beyond claudication: pain occurs AT REST, not just with activity. This represents severely inadequate blood flow even at baseline demand and is considered a medical emergency, since it threatens limb viability.</li>
    <li><b>Diagnosis:</b> <b>ABI (ankle-brachial index)</b> — normal range 1.0-1.4; below that indicates arterial narrowing (lower = worse); <b>above 1.4 indicates arterial calcification</b>, which itself correlates with heart disease risk. Also: ultrasound, angiography, blood tests (diabetes, cholesterol).</li>
    <li><b>Treatment:</b> lifestyle changes (smoking cessation, exercise, diet), medications (cholesterol/BP control, pain management, <b>cilostazol</b> specifically for claudication), angioplasty, bypass surgery.</li>
    <li><b>Nursing goals:</b> improve mobilization and circulation. Interventions: patient education, monitoring, wound care, pain management, supervised exercise programs.</li>
    <li><b>Complications:</b> critical limb ischemia, stroke, heart attack (same atherosclerotic process affects other vessels too).</li>
  </ul>
  <div class="hy">⭐ <b>Nursing diagnoses for PAD:</b> ineffective peripheral tissue perfusion, chronic pain, impaired skin integrity, activity intolerance, risk for infection.</div>
  <p class="why-chain"><b>Why claudication progresses to critical limb ischemia:</b> as atherosclerotic narrowing worsens over time, the artery eventually can't supply enough oxygen even for the tissue's RESTING demand, not just its exercise demand. <b>Because</b> there's no longer a "lower demand" state where the narrowed vessel can keep up, the pain becomes constant rather than activity-triggered — and without urgent revascularization, the tissue is at real risk of necrosis and limb loss, which is exactly why CLI is treated as a medical emergency rather than a more severe version of routine claudication management.</p>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🩸 Deep Vein Thrombosis (DVT) & Anticoagulation</h3>
  <p><b>Cause: Virchow's Triad</b> — endothelial damage, abnormal/stagnant blood flow (venous stasis), and hypercoagulability. Only one usually needs to be significantly present.</p>
  <ul class="clean">
    <li><b>Diagnostics:</b> duplex Doppler/ultrasound imaging, <b>D-dimer</b> (elevated with clot breakdown products), <b>PT/INR</b> for baseline coagulation status.</li>
    <li><b>Treatment choice depends on:</b> severity of the clot, patient's overall health, bleeding risk, and resource availability.</li>
    <li><b>Heparin</b> — IV/subcutaneous, fast-acting, used acutely; monitor <b>PTT</b>, platelets. <b>Antidote: Protamine Sulfate.</b> <b>Heparin-induced thrombocytopenia (HIT)</b> is a serious potential complication — watch platelet counts.</li>
    <li><b>Warfarin (Coumadin)</b> — oral, used for longer-term/maintenance therapy (historically common after orthopedic surgery); monitor <b>PT/INR</b> (therapeutic range 2-3), consistent dietary vitamin K intake, watch for bleeding, missed dose taken ASAP but <b>never double up</b>. <b>Antidote: Vitamin K</b> (given to reverse excessive anticoagulation/bleeding — distinct from the DIETARY vitamin K consistency teaching above). Typical hospital pattern: start a heparin drip acutely, then transition/bridge to oral warfarin for maintenance.</li>
    <li><b>DOACs (direct oral anticoagulants, e.g., Apixaban)</b> — increasingly preferred over warfarin due to a better safety profile and no routine INR monitoring requirement, though heparin and warfarin remain in common hospital use for acute care.</li>
    <li>If anticoagulation is contraindicated or ineffective, interventional procedures may be considered (e.g., IVC filter).</li>
    <li><b>Supportive care:</b> leg elevation, pain relievers, and <b>compression stockings — but NOT immediately during acute hospitalization.</b> Compression is typically held until the client is therapeutically anticoagulated (roughly a 3-7 day acute treatment window), and is usually introduced once they've transitioned to oral anticoagulation for the maintenance phase at home — not started the moment an active DVT is diagnosed.</li>
  </ul>
  <div class="mnem"><div class="tag">Monitoring + Antidote pairs — high yield</div><div class="big">Heparin → PTT → Protamine Sulfate. Coumadin/Warfarin → PT/INR → Vitamin K.</div></div>
</div>

<div class="mnem"><div class="tag">Quick contrast</div><div class="big">PAD/arterial = pale, cold, hair loss, brittle nails, pain WORSE with elevation. PVD/venous = rubor, itchy, edema, pain WORSE with dependent position (hanging down).</div></div>


<div class="card" style="border-color:var(--muted)">
  <h3>📚 More from the Ch 27 slides</h3>
  <table class="lab">
    <tr><th>Topic</th><th>Key points</th></tr>
    <tr><td><b>Capillaries</b></td><td>Walls are a <b>single layer of endothelial cells</b>, so nutrients and wastes move across quickly. About 5 to 10 microns wide; red cells change shape to squeeze through. The <b>precapillary sphincter</b> at the arteriolar end controls flow into the bed</td></tr>
    <tr><td><b>⭐ Why edema forms</b></td><td><b>Hydrostatic pressure pushes fluid OUT at the arterial end; osmotic (protein) pressure pulls it BACK at the venous end</b>, and extra fluid drains into the lymphatics. Edema happens with <b>increased capillary permeability, lymphatic obstruction, elevated venous pressure, or low plasma protein</b> (such as low albumin)</td></tr>
    <tr><td><b>CT scanning / CT angiography</b></td><td>Cross-sectional images; useful for the <b>aorta</b> (aneurysm, dissection). Uses x-rays and <b>contrast dye</b>, so it is <b>contraindicated or used with caution in impaired kidney function</b>. Check creatinine, ask about contrast allergy, hydrate after</td></tr>
    <tr><td><b>Other kinds of emboli</b></td><td>A PE is usually a clot from the leg veins or the right side of the heart, but emboli can also be <b>air, fat</b> (after long-bone fractures), <b>amniotic fluid</b>, or <b>septic</b> material</td></tr>
    <tr><td><b>Chronic venous insufficiency</b></td><td>Blocked or damaged valves let blood flow backward (reflux), causing <b>venous hypertension</b>. <b>20 to 50% of DVT patients</b> develop valve damage afterward, called <b>postthrombotic syndrome</b>. Duplex ultrasound confirms it</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Cellulitis (Ch 27)</h3>
  <p class="why-chain"><b>The most common infectious cause of limb swelling.</b> A break in the skin lets bacteria in, most often <b>Streptococcus or Staphylococcus aureus</b>, and their toxins inflame the subcutaneous tissue.</p>
  <table class="lab">
    <tr><td><b>Signs</b></td><td>Sudden <b>swelling, localized redness, warmth, and pain</b>. Fever, chills, sweating. Redness may take on a pitting <b>orange-peel</b> look. Tender, enlarged regional lymph nodes</td></tr>
    <tr><td><b>Often mistaken for</b></td><td>Recurrent thrombophlebitis or chronic venous insufficiency</td></tr>
    <tr><td><b>Treatment</b></td><td>Mild: <b>oral antibiotics</b> as an outpatient. Severe: <b>IV antibiotics</b>. Find and treat the entry point: cracks or ulcers between the toes, injection sites, abrasions, ingrown toenails, hammer toes</td></tr>
    <tr><td><b>⭐ Nursing</b></td><td><b>Elevate the area 3 to 6 inches above heart level.</b> <b>Cool packs every 2 to 4 hours</b> until the inflammation settles, <b>then warm packs</b>. Use warmth carefully in clients with poor sensation or circulation to avoid burns. Mark the border to track spread</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — arterial vs venous, reversed</span>This is the whole topic. <b>Arterial (PAD):</b> cool, pale, hairless, absent pulses, pain <i>worse with elevation</i>, "punched out" ulcers on toes and pressure points. <b>Venous:</b> warm, ruddy, edematous, pulses present, pain <i>worse when dependent</i>, irregular ulcers at the medial ankle. He always offers you the opposite set.</div>
  <div class="trap"><span class="tag">Trap 2 — positioning the leg</span><b>Arterial: dangle.</b> <b>Venous: elevate.</b> Doing the reverse makes each condition worse, and both options always appear.</div>
  <div class="trap"><span class="tag">Trap 3 — D-dimer treated as proof</span>D-dimer is a <b>nonspecific marker of clot breakdown</b>. Elevated means image it, not diagnose it. "Definitive confirmation of a clot" is the trap.</div>
  <div class="trap"><span class="tag">Trap 4 — compression on the wrong patient</span>Compression stockings help <b>venous</b> disease. Applied to a patient with significant arterial disease they further reduce an already poor blood supply.</div>
  <div class="trap"><span class="tag">Trap 5 — exercise for PAD</span>It sounds counterintuitive because walking hurts, but supervised exercise <b>builds collateral circulation</b>. "Avoid exercise in any vascular disease" is written to sound cautious and safe.</div>
</div>

    <tr><td><b>ACE inhibitors / ARBs</b></td><td>Block angiotensin II being made or working; <b>protect the kidneys</b></td><td><b>KEEPS potassium.</b> ACE also causes the dry cough</td></tr>
    <tr><td><b>Calcium channel blockers</b><br>amlodipine, diltiazem</td><td>Keep calcium out of vessel smooth muscle so vessels relax; some also slow the heart</td><td>Neutral. Watch for <b>ankle edema, headache, constipation</b>, and avoid <b>grapefruit juice</b></td></tr>
    <tr><td><b>Beta blockers</b><br>metoprolol, atenolol</td><td><b>Block beta receptors, so the fight-or-flight response is suppressed.</b> Heart rate, contractility, and oxygen demand all drop</td><td>Neutral. <b>Hold for HR under 60 or low BP.</b> Never stop abruptly (rebound). Mask hypoglycemia. Caution in asthma</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The potassium split</div><div class="big">Thiazides and loops LOSE it. Spironolactone, ACE inhibitors, and ARBs KEEP it.</div><div class="exp">That is why a client on spironolactone <b>plus</b> an ACE inhibitor needs careful potassium monitoring: both hold onto it.</div></div>
</div>



<div class="card">
  <h3>💊 ACE Inhibitors & ARBs</h3>
  <ul class="clean">
    <li><b>Mechanism:</b> block the RAAS (renin-angiotensin-aldosterone system) → less vasoconstriction, less sodium/water retention → lower BP, reduced cardiac workload.</li>
    <li><b>ACE inhibitors ("-prils")</b> — first choice; classic side effect is a dry cough and angioedema ("prils puff the tongue").</li>
    <li><b>ARBs ("-sartans")</b> — second choice, generally used when ACE inhibitors cause cough; potassium-sparing effect similar to ACE inhibitors.</li>
    <li>Never combine an ACE inhibitor with an ARB (redundant RAAS block, higher hyperkalemia/renal risk).</li>
  </ul>
</div>

<div class="card">
  <h3>💊 Beta-Blockers — Propranolol (nonselective) vs. Metoprolol (cardioselective)</h3>
  <ul class="clean">
    <li><b>Mechanism:</b> block catecholamine (sympathetic) stimulation of the heart → decreased HR, decreased contractility, lower BP, lower myocardial oxygen demand. Also decreases renin secretion.</li>
    <li><b>Propranolol</b> — <b>nonselective</b> (blocks both beta-1 AND beta-2). Blocking beta-2 in the lungs is exactly why it carries a real bronchospasm risk in asthma/COPD.</li>
    <li><b>Metoprolol</b> — <b>cardioselective</b> (beta-1 preferring) at therapeutic doses — safer in reactive airway disease, but "cardioselective" is not "cardiospecific": at higher doses it can lose selectivity and still cause bronchospasm.</li>
    <li><b>Therapeutic uses (both):</b> hypertension, angina, dysrhythmias (SVT, afib/flutter), post-MI cardioprotection, migraine prophylaxis. Metoprolol succinate (Toprol XL) is also used in stable HF.</li>
    <li><b>Contraindications/precautions:</b> cardiogenic shock, decompensated HF, sinus bradycardia, 2nd/3rd degree heart block, asthma/COPD (relative), Raynaud's.</li>
    <li><b>Adverse effects:</b> bradycardia, hypotension, heart block, HF exacerbation, bronchospasm, fatigue, depression, sexual dysfunction, <b>masks hypoglycemia symptoms in diabetics</b>, cold extremities.</li>
    <li><b>Nursing:</b> hold if HR &lt;60 (metoprolol: hold if HR&lt;60 OR SBP&lt;90). <b>Never stop abruptly</b> — taper to prevent rebound hypertension/angina/MI. Monitor glucose in diabetics. Assess lung sounds.</li>
  </ul>
  <div class="hy">⭐ <b>Which order should you question?</b> IV beta-blocker ordered together with IV diltiazem/verapamil — this combination risks fatal bradycardia/heart block and is a genuine contraindication, not just a caution.</div>
</div>

<div class="card">
  <h3>💊 Calcium Channel Blockers — Diltiazem</h3>
  <ul class="clean">
    <li><b>Mechanism:</b> blocks L-type calcium channels in cardiac and vascular smooth muscle. In the heart: decreases SA node automaticity and AV nodal conduction. In vessels: vasodilation, reducing afterload.</li>
    <li><b>Therapeutic uses:</b> angina (vasospastic and chronic stable), hypertension, rate control in afib/flutter, SVT (IV form).</li>
    <li><b>Contraindications/precautions:</b> sick sinus syndrome (without pacemaker), 2nd/3rd degree AV block, severe hypotension, acute MI with pulmonary congestion, WPW with accessory pathway, <b>concurrent IV beta-blocker</b> (fatal bradycardia/AV block risk).</li>
    <li><b>Adverse effects:</b> bradycardia, AV block, hypotension, peripheral edema, constipation, dizziness, worsening HF.</li>
    <li><b>Interactions:</b> increases digoxin levels; simvastatin/lovastatin myopathy risk (CYP3A4 inhibition); grapefruit juice increases drug levels.</li>
    <li><b>Nursing:</b> monitor HR/BP before and after dosing; ER tablets swallowed whole, never crushed; never stop suddenly.</li>
  </ul>
  <div class="hy">⭐ <b>Which order should you question?</b> IV diltiazem ordered for a client already on an IV beta-blocker — same fatal bradycardia/AV block risk as above, from the opposite direction. Also question diltiazem in a client with acute MI and pulmonary congestion (worsens HF).</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>💊 Digoxin</h3>
  <ul class="clean">
    <li><b>Mechanism:</b> inhibits the Na+/K+ ATPase pump → increased intracellular Na+ → increased intracellular Ca2+ → increased myocardial contractility (<b>positive inotrope</b>). Also increases vagal tone → decreased HR and AV conduction (<b>negative chronotrope/dromotrope</b>).</li>
    <li><b>Therapeutic uses:</b> heart failure with reduced ejection fraction (HFrEF), rate control in afib/flutter. <b>Narrow therapeutic index</b> — therapeutic serum level 0.5-2 ng/mL.</li>
    <li><b>Contraindications/precautions:</b> ventricular fibrillation, <b>WPW syndrome</b> (can accelerate accessory pathway conduction), 2nd/3rd degree heart block (without pacemaker), hypertrophic obstructive cardiomyopathy.</li>
    <li><b>Toxicity signs:</b> <b>nausea/vomiting is classically the FIRST sign</b>, anorexia, bradycardia, visual disturbances (yellow-green halos, blurred vision), any new dysrhythmia, confusion. <b>Hypokalemia GREATLY increases toxicity risk</b> (shared Na-K pump binding site).</li>
    <li><b>Antidote for severe toxicity: Digibind/DigiFab.</b></li>
    <li><b>Nursing:</b> <b>check apical pulse for 1 full minute before every dose — hold if &lt;60 bpm.</b> Monitor digoxin level, potassium, magnesium. Never double a missed dose.</li>
  </ul>
  <div class="hy">⭐ <b>Which order should you question?</b> Digoxin ordered for a client with WPW syndrome or ventricular fibrillation — both are genuine contraindications. Also question if the apical pulse is &lt;60 or if serum potassium is low (raises toxicity risk before the dose is even given).</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>💊 Atropine</h3>
  <ul class="clean">
    <li><b>Mechanism:</b> anticholinergic — competitively blocks muscarinic receptors. In the heart, blocks vagal tone on the SA/AV nodes → increased HR and AV conduction. Also reduces secretions, causes bronchodilation and mydriasis (pupil dilation).</li>
    <li><b>Therapeutic uses:</b> <b>first-line for symptomatic bradycardia</b>, AV block (nodal level), organophosphate/nerve agent antidote, preop secretion reduction.</li>
    <li><b>Dosing rule:</b> 0.5-1 mg IV q3-5 min, max 3 mg. <b>NEVER give less than 0.5 mg</b> — a dose that low can cause <i>paradoxical bradycardia</i> instead of the intended effect.</li>
    <li><b>Contraindications/precautions:</b> <b>narrow-angle glaucoma</b>, tachycardia, myasthenia gravis, GI/GU obstruction. Extreme caution in BPH and the elderly (confusion/delirium risk).</li>
    <li><b>Adverse effects:</b> tachycardia, urinary retention, constipation, dry mouth, blurred vision, confusion/delirium (especially elderly), <b>paradoxical bradycardia with doses &lt;0.5 mg.</b></li>
    <li><b>Antidote for anticholinergic toxicity: Physostigmine.</b></li>
  </ul>
  <div class="hy">⭐ <b>Which order should you question?</b> An atropine dose ordered below 0.5 mg IV — this specific under-dosing risk (paradoxical bradycardia) is exactly opposite of the intended effect. Also question atropine in a client with narrow-angle glaucoma — same dilating-pupil mechanism concern from the Eye unit, now showing up in a cardiac drug.</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>💊 Adenosine</h3>
  <ul class="clean">
    <li><b>Mechanism:</b> activates adenosine A1 receptors, slowing conduction through the AV node, causing a brief, transient AV block that terminates AV-node-dependent reentry circuits. Extremely short half-life (~10 seconds).</li>
    <li><b>Therapeutic use:</b> <b>first-line treatment for PSVT/SVT.</b></li>
    <li><b>Administration:</b> IV ONLY — 6 mg rapid IV push over 1-2 seconds into a large vein, immediately followed by a 20 mL NS flush. If no response in 1-2 min, may repeat at 12 mg (max single dose 12 mg).</li>
    <li><b>Contraindications/precautions:</b> 2nd/3rd degree heart block, sick sinus syndrome (without pacemaker), <b>WPW with atrial flutter/fib</b> (may accelerate conduction), asthma/severe COPD.</li>
    <li><b>Interactions:</b> caffeine/theophylline (methylxanthines) BLOCK its effect — larger doses may be needed; dipyridamole POTENTIATES it — reduce dose.</li>
    <li><b>Expected/therapeutic effect:</b> a brief period of <b>transient asystole</b> is expected and therapeutic, not a complication to panic over — along with brief flushing, chest pressure, and a feeling of impending doom.</li>
    <li><b>Nursing:</b> continuous cardiac monitoring required, crash cart at bedside, document rhythm strip before/during/after, warn the patient about the brief sensation beforehand.</li>
  </ul>
  <div class="hy">⭐ <b>Which order should you question?</b> Adenosine ordered for a client with WPW who is currently in atrial fibrillation/flutter (not simple SVT) — this specific combination can accelerate conduction through the accessory pathway rather than terminate the arrhythmia.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>💊 Heparin (Unfractionated) — expanded</h3>
  <ul class="clean">
    <li><b>Mechanism:</b> binds antithrombin III, potentiating its inhibition of thrombin and factor Xa. Prevents fibrinogen→fibrin and prothrombin→thrombin conversion. <b>Does NOT dissolve existing clots</b> — prevents new clot formation/extension only.</li>
    <li><b>Administration:</b> weight-based IV protocol; bolus ~60-80 units/kg, infusion 12-18 units/kg/hr, adjusted to aPTT (therapeutic goal typically 60-100 sec, or 1.5-2.5× normal). <b>Never give IM</b> (hematoma risk).</li>
    <li><b>Contraindications/precautions:</b> active uncontrolled bleeding, HIT (Type II), severe thrombocytopenia, intracranial hemorrhage.</li>
    <li><b>Adverse effects:</b> bleeding (major risk, any site), <b>HIT</b> — platelet count drop &gt;50% from baseline typically on days 4-10 (paradoxically causes CLOTTING, not just bleeding risk), osteoporosis with long-term use.</li>
    <li><b>Antidote: Protamine Sulfate.</b></li>
    <li><b>Nursing:</b> monitor aPTT q6h, check platelets every 2-3 days, two-nurse verification of dose, infusion pump only.</li>
  </ul>
  <div class="hy">⭐ <b>Which order should you question?</b> Heparin ordered for a client with active uncontrolled bleeding or a history of HIT — both genuine contraindications. Also question an IM heparin order specifically (should never be given IM regardless of the reason stated).</div>
</div>

<div class="card">
  <h3>💊 Diuretics</h3>
  <ul class="clean">
    <li><b>First-line treatment for hypertension</b>, and usually the #1 medication for heart failure — directly reduces fluid volume/preload, lowering cardiac workload.</li>
    <li><b>Potency ranking (strongest to weakest): Loop &gt; Thiazide &gt; Potassium-sparing.</b> Loop diuretics (e.g., Lasix/furosemide) are the STRONGEST; potassium-sparing diuretics (e.g., spironolactone) are the WEAKEST of the three.</li>
    <li><b>Loop diuretic-specific concerns (explicitly flagged as testable):</b> significant potassium WASTING (hypokalemia — monitor levels, watch for arrhythmia/digoxin interaction risk) and <b>ototoxicity</b>, especially with high doses or rapid IV push — watch for tinnitus/hearing changes.</li>
    <li><b>Teach slow position changes</b> — diuretics increase orthostatic hypotension risk.</li>
  </ul>
  <div class="hy">⭐ Potency ranking matters clinically: a client needing aggressive fluid removal (like acute pulmonary edema) needs a LOOP diuretic, not a potassium-sparing one — the weakest option wouldn't be enough for that level of overload. But that same potency is exactly why loop diuretics carry the bigger potassium-wasting and ototoxicity risk of the three.</div>
</div>

<div class="card">
  <h3>💊 Vasodilators</h3>
  <p>Common side effects: headache, hypotension, hot flushing/flushed skin — all direct consequences of the vasodilation mechanism itself (more blood flow to vessels near the skin/head surface, and a drop in resistance lowering BP).</p>
</div>


<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the ACE cough</span>It is <b>bradykinin accumulation</b> from the same enzyme blockade that lowers the BP, not lung irritation and not an allergy. The fix is switching to an ARB.</div>
  <div class="trap"><span class="tag">Trap 2 — beta-blockers in asthma</span><b>Non-selective</b> agents block beta-2 in the lungs and cause bronchospasm. "Beta-blockers have no pulmonary effects" is offered every time.</div>
  <div class="trap"><span class="tag">Trap 3 — what statins actually do</span>They <b>lower LDL and cardiovascular risk</b>. They do not dissolve existing plaque and they are not antihypertensives.</div>
  <div class="trap"><span class="tag">Trap 4 — holds before a stress test</span><b>Beta-blockers are held</b> because they blunt the heart rate response the test depends on. Vitamins and antacids are there as filler.</div>
  <div class="trap"><span class="tag">Trap 5 — nitrates and sildenafil</span>Both are vasodilators. Together they cause <b>profound, potentially fatal hypotension</b>. Any stem mentioning erectile dysfunction drugs plus nitroglycerin is testing this.</div>
  <div class="trap"><span class="tag">Trap 6 — potassium direction by drug</span>ACE inhibitors, ARBs, and spironolactone <b>raise</b> potassium. Loop and thiazide diuretics <b>lower</b> it. He swaps them.</div>
</div>

  {q:'A client with newly diagnosed Wolff-Parkinson-White (WPW) syndrome, currently in atrial fibrillation, has a STAT order for adenosine. What should the nurse do?',type:'single',
   opts:['Administer the adenosine immediately as ordered without any further clarification or hesitation','Give a double dose of the ordered adenosine right away to ensure a stronger, more reliable effect','Substitute an equivalent dose of digoxin instead, without first contacting the ordering provider','Question the order — adenosine in WPW with atrial fib/flutter can accelerate conduction through the accessory pathway'],correct:3,
   rat:'A gives a medication that carries a specific, serious contraindication in this exact combination, and D independently substitutes a different drug without provider involvement (also inappropriate — and digoxin carries its own WPW contraindication). This combination should be questioned before administration.'},

  {q:'A nurse prepares to administer atropine 0.3 mg IV for a client with symptomatic bradycardia. What should the nurse do?',type:'single',
   opts:['Administer the dose exactly as ordered without any further clarification or hesitation needed here','Independently double the dose to 0.6 mg on your own, without first checking back with the ordering provider','Give the same dose via the IM route instead of IV, believing this would meaningfully reduce the risk involved','Question the order — doses below 0.5 mg IV can cause paradoxical bradycardia, opposite of the intended effect'],correct:3,
   rat:'A administers a dose below the safe threshold, and C and D both independently alter the order without provider communication. Atropine doses under 0.5 mg IV are specifically associated with paradoxical bradycardia — this order should be questioned and clarified before giving.'},

  {q:'A client\'s digoxin level returns at 2.8 ng/mL. How should the nurse interpret this result?',type:'single',
   opts:['Digoxin levels are not clinically monitored, so this value has no meaning','This is within the normal therapeutic range and requires no further action','This level is too low to have any therapeutic effect and the dose should be increased','This is above the therapeutic range (0.5-2 ng/mL) and should be reported'],correct:3,
   rat:'A misreads the result as normal when it exceeds the range, C reverses the actual concern (this is too HIGH, not too low), and D dismisses a genuinely monitored lab value. The therapeutic digoxin range is 0.5-2 ng/mL — a level of 2.8 ng/mL exceeds that range and should be reported for possible toxicity.'},

  {q:'A client reports nausea, loss of appetite, and seeing yellow-green halos around lights while taking digoxin. What should the nurse recognize?',type:'single',
   opts:['An unrelated viral illness that happens to be occurring at the same time as the digoxin therapy','Possible digoxin toxicity — nausea/vomiting is classically first, and visual disturbances are a hallmark sign','A common, mild side effect that typically resolves within the first week of starting digoxin therapy','A clear sign that the client\'s current digoxin dose should actually be increased going forward'],correct:1,
   rat:'A dangerously dismisses classic toxicity signs, and D suggests the opposite of the safe response. Nausea/vomiting as an early sign plus visual disturbances (yellow-green halos) together are the hallmark presentation of digoxin toxicity, requiring prompt evaluation.'},

  {q:'A client with heparin-induced thrombocytopenia (HIT) has a new order for a heparin infusion to treat a DVT. What should the nurse do?',type:'single',
   opts:['Administer the heparin infusion exactly as ordered without any further clarification needed here','Administer this same ordered heparin dose via the IM route instead of the IV route as ordered','Question the order — a history of HIT is a contraindication to further heparin use','Independently give only half of the ordered dose as a way to help reduce the overall risk involved'],correct:2,
   rat:'A proceeds despite a genuine contraindication, and C and D both invent unsafe workarounds rather than questioning the order (heparin should never be given IM regardless). A HIT history contraindicates further heparin — this order should be questioned and an alternative anticoagulant discussed.'},

  {q:'A client is ordered propranolol for migraine prophylaxis but has a history of asthma with recent exacerbations. What should the nurse do?',type:'single',
   opts:['Switch the client to a notably higher dose of this exact same nonselective beta-blocker medication instead','Question the order — propranolol\'s nonselective beta-2 blockade carries real bronchospasm risk in reactive airway disease','Administer the propranolol exactly as ordered without any further concern or clarification needed here','Give the medication only during an active asthma attack itself, rather than as ongoing prophylaxis'],correct:1,
   rat:'A overlooks a genuine respiratory risk specific to this NONselective beta-blocker, and C and D both fail to address the actual concern. Propranolol\'s beta-2 blockade (unlike cardioselective metoprolol) carries real bronchospasm risk in a client with active reactive airway disease — worth questioning/clarifying.'},

  {q:'A client taking metoprolol for hypertension asks why they should never stop the medication abruptly. What is the correct explanation?',type:'single',
   opts:['Abruptly stopping can cause rebound hypertension, angina, or even MI due to unmasking upregulated beta receptors','Abrupt discontinuation mainly causes a temporary drop in blood pressure that resolves within a day','This specific warning about abrupt discontinuation only applies to clients also diagnosed with diabetes','This medication requires tapering only if the client has been on it for longer than five consecutive years'],correct:0,
   rat:'A dismisses a genuine, dangerous rebound phenomenon, and D limits it to a subgroup when it applies broadly. Abrupt beta-blocker discontinuation can cause rebound hypertension, angina, or MI — tapering is required precisely to avoid this.'},

  {q:'Which of the following are appropriate nursing actions before administering IV adenosine? (Select all that apply)',type:'multi',
   opts:['Administer the dose slowly over 5 minutes','Warn the client about brief chest pressure/flushing sensations','Document the rhythm strip before, during, and after administration','Ensure continuous cardiac monitoring is in place','Have a crash cart readily available'],correct:[1,2,3,4],
   rat:'Adenosine is specifically given as a RAPID IV push (1-2 seconds) followed by a flush — giving it slowly over 5 minutes would defeat its mechanism given its ~10-second half-life. Continuous monitoring, crash cart availability, client warning, and rhythm documentation are all correct.'},

  {q:'A client on diltiazem for rate control in atrial fibrillation is also newly prescribed simvastatin. What is the nurse\'s priority consideration?',type:'single',
   opts:['Diltiazem increases the effectiveness of simvastatin with no added risk','These medications have no interaction of concern','This combination is only a concern in pediatric patients','Diltiazem inhibits CYP3A4 metabolism of simvastatin, increasing myopathy risk'],correct:3,
   rat:'A dismisses a genuine, clinically relevant interaction. Diltiazem\'s CYP3A4 inhibition can raise simvastatin levels, increasing myopathy risk — a combination worth flagging for the provider\'s awareness, not administering without a second thought.'},

  {q:'Which of the following are appropriate nursing actions when administering digoxin? (Select all that apply)',type:'multi',
   opts:['Check apical pulse for one full minute before each dose','Monitor for visual disturbances as a possible toxicity sign','Never double a missed dose','Hold the dose and notify the provider if the apical pulse is less than 60 bpm','Administer regardless of potassium level since digoxin dosing is independent of electrolytes'],correct:[0,1,2,3],
   rat:'Potassium level is NOT independent of digoxin dosing — hypokalemia significantly raises toxicity risk, making that statement false. Checking the apical pulse, holding for bradycardia, monitoring for visual disturbances, and never doubling a missed dose are all correct practices.'},

  {q:'A client is started on IV furosemide (a loop diuretic) for acute fluid overload. Which of the following should the nurse specifically monitor for, given this drug class? (Select all that apply)',type:'multi',
   opts:['Hypokalemia','Hyperkalemia','Ototoxicity, especially with high doses or rapid IV push','Tinnitus or hearing changes','Improved blood glucose control'],correct:[0,2,3],
   rat:'Loop diuretics cause potassium WASTING (hypokalemia), not hyperkalemia, and have no established glucose-improving effect. Hypokalemia and ototoxicity (with associated tinnitus/hearing changes) are the two specific concerns tied to this drug class\'s potency.'}
],'Cardiac Meds Check');
