<h2 class="sec-title"><span class="sec-emoji">📈</span> Hypertension</h2>
<p class="intro-line">The most common cardiovascular diagnosis you'll see clinically — and one of the most heavily tested.</p>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ His advanced question: SNS, afterload, and oxygen demand</h3>
  <ol class="chainlist">
    <li><b>1.</b> Stress or low perfusion activates the <b>sympathetic nervous system</b> (fight or flight).</li>
    <li><b>2.</b> Catecholamines <b>constrict arterioles</b>, so systemic vascular resistance rises. <b>That resistance is afterload:</b> the force the ventricle has to overcome to eject.</li>
    <li><b>3.</b> The same catecholamines <b>raise heart rate and contractility</b>.</li>
    <li><b>4.</b> Working faster and harder against more resistance means the myocardium <b>demands more oxygen</b>.</li>
    <li><b>5.</b> But a faster rate <b>shortens diastole</b>, and the coronary arteries fill during diastole, so <b>supply drops just as demand rises</b>.</li>
    <li><b>6.</b> If the coronaries are already narrowed by plaque, that gap becomes <b>ischemia</b>: angina, and then infarction.</li>
  </ol>
  <div class="hy"><span class="tag">Why the drugs make sense now</span><b>Beta blockers</b> cut demand by slowing the heart and softening contraction. <b>Nitrates</b> cut preload and dilate coronaries. <b>ACE inhibitors, ARBs, and calcium channel blockers</b> cut afterload. Every one of them is closing the gap between supply and demand.</div>
</div>

<div class="tipbar">🎯 <b>His guideline is ACC/AHA.</b> Every number in this tab uses it. Other societies (ESC/ESH, ISH) draw the lines at 140/90, which is a common distractor.</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ The stages, ACC/AHA (Table 28-1)</h3>
  <table class="lab">
    <tr><th>Category</th><th>Systolic</th><th></th><th>Diastolic</th></tr>
    <tr><td><b>Normal</b></td><td>under 120</td><td><b>and</b></td><td>under 80</td></tr>
    <tr><td><b>Elevated</b></td><td>120 to 129</td><td><b>and</b></td><td>under 80</td></tr>
    <tr><td><b>Stage 1 hypertension</b></td><td>130 to 139</td><td><b>or</b></td><td>80 to 89</td></tr>
    <tr><td><b>Stage 2 hypertension</b></td><td>140 or higher</td><td><b>or</b></td><td>90 or higher</td></tr>
    <tr><td><b>Hypertensive crisis</b></td><td>over 180</td><td><b>and/or</b></td><td>over 120</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Read the AND vs OR</div><div class="big">Normal and Elevated need BOTH numbers. Stage 1 and 2 need only ONE.</div><div class="exp"><b>The higher number decides the stage.</b> 128/84 is not "elevated," because the diastolic of 84 already meets stage 1. 142/78 is stage 2 on the systolic alone. Elevated requires a diastolic <b>under 80</b>.</div></div>
  <div class="hy"><span class="tag">Hypertension diagnosis threshold</span>ACC/AHA: <b>SBP 130 or higher, or DBP 80 or higher</b>, based on the <b>average of two or more readings on two or more occasions</b>. The slide question on this is a favorite: the answer is <b>130</b>, not 140.</div>
  <div class="trap"><span class="tag">Classify these</span>118/82 → <b>Stage 1</b> (diastolic) · 126/78 → <b>Elevated</b> · 134/76 → <b>Stage 1</b> · 138/92 → <b>Stage 2</b> (diastolic) · 184/100 → <b>crisis range</b>. Always check both numbers and let the worse one win.</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ The hemodynamics he started lecture with</h3>
  <p class="why-chain">Think of the heart as a <b>pump</b> pushing fluid through a set of <b>tubes</b>. Blood pressure depends on how hard the pump pushes and how tight the tubes are.</p>
  <table class="lab">
    <tr><th>Formula</th><th>What it means</th></tr>
    <tr><td><b>BP = Cardiac output × Systemic vascular resistance</b></td><td>Pump output times how much the vessels resist flow</td></tr>
    <tr><td><b>Cardiac output = Heart rate × Stroke volume</b></td><td>Beats per minute times how much blood leaves the ventricle with each beat. Normal CO is about 4 to 8 L/min</td></tr>
    <tr><td><b>Ejection fraction</b></td><td>The <b>percentage</b> of blood in the left ventricle pumped out with each beat. <b>Normal is about 50 to 70%.</b> It is the key number for judging how well the heart pumps and for sorting heart failure types</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Why a little constriction matters so much</div><div class="big">Halve the vessel radius and resistance rises about 16 times</div><div class="exp">Ch 27: <b>vessel radius is the most important factor in resistance</b>, and small reductions cause large changes. That is why even a slight, constant vasoconstriction from the SNS or angiotensin II drives blood pressure up so sharply, and why a baseline of tight vessels keeps it high.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ His advanced question: how a fast heart rate makes heart failure worse</h3>
  <p class="why-chain">When stroke volume falls, the body keeps cardiac output up by <b>raising the heart rate</b> (CO = HR × SV). It works at first, then turns against the heart.</p>
  <ol class="chainlist">
    <li><b>1.</b> The failing ventricle pumps out less with each beat, so stroke volume drops.</li>
    <li><b>2.</b> The SNS and RAAS kick in: <b>heart rate rises</b>, vessels tighten, and the kidneys hold sodium and water.</li>
    <li><b>3.</b> A faster rate <b>shortens diastole</b>, so the ventricle has less time to <b>fill</b>, and the <b>coronary arteries</b>, which fill during diastole, deliver less oxygen to the heart muscle.</li>
    <li><b>4.</b> Meanwhile the heart's <b>oxygen demand rises</b> from working faster against tighter vessels and a bigger fluid load.</li>
    <li><b>5.</b> Less supply plus more demand damages more muscle, the heart weakens further, and the cycle repeats. The compensation becomes the <b>progression</b>.</li>
  </ol>
  <div class="hy"><span class="tag">Why this matters for treatment</span>It explains why HF drugs block the compensation: beta blockers slow the rate, ACE inhibitors and ARBs turn down RAAS, and diuretics remove the extra fluid.</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ What drives blood pressure up, the pathophysiology</h3>
  <div class="mnem"><div class="tag">The equation everything hangs on</div><div class="big">BP = cardiac output × peripheral resistance</div><div class="exp">Cardiac output is heart rate × stroke volume. Anything that <b>raises output or tightens the vessels</b> raises pressure. Every cause below does one or both.</div></div>
  <table class="lab">
    <tr><th>Precedent (Ch 28)</th><th>What it does</th></tr>
    <tr><td><b>1. Increased SNS activity</b></td><td>Epinephrine and norepinephrine raise heart rate and contractility and <b>constrict arterioles</b>. ⭐ <b>Chronic stress keeps the SNS switched on</b>, so the pressure never comes back down</td></tr>
    <tr><td><b>2. Renal reabsorption of sodium, chloride, and water</b></td><td>The kidneys hold on to more salt, <b>water follows sodium</b>, blood volume rises, and so does cardiac output</td></tr>
    <tr><td><b>3. RAAS activity</b></td><td>Expands extracellular fluid volume <b>and</b> raises systemic vascular resistance (see the next card)</td></tr>
    <tr><td><b>4. Decreased vasodilation</b></td><td>A damaged <b>endothelium</b> makes less nitric oxide, so vessels cannot relax</td></tr>
    <tr><td><b>5. Insulin resistance</b></td><td>High insulin drives sodium retention and SNS activity, and high glucose <b>thickens the blood (viscosity)</b>. Linked with type 2 diabetes, high triglycerides, and obesity, the metabolic syndrome cluster</td></tr>
    <tr><td><b>6. Immune response activation</b></td><td><b>Vascular inflammation</b> stiffens and damages vessel walls</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ RAAS, and how ACE inhibitors and ARBs work</h3>
  <p class="why-chain"><b>Purpose of RAAS:</b> protect blood pressure and kidney perfusion when the body senses low volume or low pressure. In hypertension it stays switched on when it isn't needed.</p>
  <ol class="chainlist">
    <li><b>1.</b> Kidneys sense low perfusion → release <b>renin</b>.</li>
    <li><b>2.</b> Renin converts angiotensinogen (from the liver) into <b>angiotensin I</b>.</li>
    <li><b>3.</b> <b>ACE</b> (angiotensin-converting enzyme, mostly in the lungs) converts it into <b>angiotensin II</b>.</li>
    <li><b>4. Angiotensin II does two things:</b> it is a <b>powerful vasoconstrictor</b>, and it tells the adrenal glands to release <b>aldosterone</b>.</li>
    <li><b>5. ⭐ Aldosterone tells the kidneys to hold sodium and water</b> (and excrete potassium). Volume rises.</li>
    <li><b>Result:</b> tighter vessels + more volume = <b>higher blood pressure</b>.</li>
  </ol>
  <table class="lab">
    <tr><th></th><th>ACE INHIBITORS (-pril)</th><th>ARBs (-sartan)</th></tr>
    <tr><td><b>Where they act</b></td><td><b>Block the ENZYME</b>, so angiotensin I is never converted to angiotensin II</td><td>Angiotensin II is still made, but they <b>block its RECEPTOR</b> so it can't act</td></tr>
    <tr><td><b>Result</b></td><td>Less vasoconstriction, less aldosterone → vessels relax, kidneys release sodium and water</td><td>Same end result</td></tr>
    <tr><td><b>Key difference</b></td><td>ACE also breaks down <b>bradykinin</b>. Blocking it lets bradykinin build up → <b>dry, persistent cough</b> and rarely <b>angioedema</b></td><td>No bradykinin buildup, so <b>no cough</b>. The usual switch for a client who can't tolerate the cough</td></tr>
    <tr><td><b>Shared cautions</b></td><td colspan="2">Less aldosterone means the body keeps <b>potassium → hyperkalemia</b>. Watch kidney function. <b>Contraindicated in pregnancy.</b> Angioedema (swelling of lips, tongue, throat) is an airway emergency</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ One line to hold</div><div class="big">ACE inhibitors stop angiotensin II from being MADE. ARBs stop it from WORKING.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Clinical manifestations: the silent killer and target organ damage</h3>
  <p class="why-chain">Hypertension is usually <b>silent for years</b>, with no warning signs. It shows itself through the organs it damages, because constant high pressure injures blood vessels everywhere.</p>
  <table class="lab">
    <tr><th>Organ</th><th>What the damage looks like</th></tr>
    <tr><td><b>🫘 Kidneys</b></td><td><b>Increased BUN and creatinine</b> · <b>low urine output</b> · protein in the urine → chronic kidney disease</td></tr>
    <tr><td><b>🫀 Heart</b></td><td><b>Angina</b>, coronary artery disease, <b>MI</b> · <b>left ventricular hypertrophy</b> (the heart muscle thickens pushing against high pressure) · <b>heart failure</b></td></tr>
    <tr><td><b>🧠 Brain</b></td><td><b>Stroke</b> and TIA · <b>headache</b> · <b>dizziness</b> · confusion in severe cases (hypertensive encephalopathy)</td></tr>
    <tr><td><b>👁️ Eyes</b></td><td><b>Retinopathy</b>: hemorrhages, exudates, arteriolar narrowing, <b>cotton-wool spots</b> · <b>papilledema</b> in severe hypertension · blurred vision</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The four target organs</div><div class="big">Kidneys · Heart · Brain · Eyes</div><div class="exp">When a stem gives you a hypertensive client, check all four. <b>A rising BUN and creatinine, new angina, falling urine output, visual changes, headache, or dizziness</b> means the pressure is already doing damage.</div></div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ Added from tonight's lecture</h3>
  <table class="lab">
    <tr><th>Point</th><th>Detail</th></tr>
    <tr><td><b>SNS redirects blood</b></td><td>Under stress the SNS shunts blood toward the vital organs by constricting vessels elsewhere, raising SVR. <b>Constant stress means constant SNS activation</b></td></tr>
    <tr><td><b>Insulin resistance</b></td><td>High glucose <b>increases blood viscosity</b> (thicker blood is harder to push) and promotes <b>inflammation</b> that narrows the vessel lumen</td></tr>
    <tr><td><b>ACE inhibitors and ARBs</b></td><td>Block conversion to angiotensin II (ACE) or its receptor (ARB), causing vasodilation, which also <b>protects the kidneys</b></td></tr>
    <tr><td><b>Kidney damage signs</b></td><td><b>Decreased urine output, edema</b>, rising BUN and creatinine</td></tr>
    <tr><td><b>Heart damage signs</b></td><td>Heart failure, <b>tachycardia</b>, chest pain (angina), and pain that <b>radiates</b> to the arm, jaw, or back</td></tr>
    <tr><td><b>⭐ Start with lifestyle</b></td><td><b>The first three months focus on lifestyle changes and exercise.</b> If BP is not at goal, medication starts with a <b>thiazide diuretic</b>, then ACE inhibitors or calcium channel blockers are considered</td></tr>
  </table>
  <div class="trap"><span class="tag">⭐ Alcohol: two versions of the limit</span>His lecture described <b>daily limits by gender</b>: the AHA guideline is <b>no more than 2 drinks a day for men and 1 a day for women</b>. His handout slide showed the <b>14 units a week</b> guideline for both. If a question asks about daily limits by gender, use 2 and 1.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ Assessment and diagnosis</h3>
  <table class="lab">
    <tr><th>Step</th><th>Detail</th></tr>
    <tr><td><b>⭐ Confirming the diagnosis</b></td><td><b>Average of at least two readings on at least two separate occasions.</b> <b>Exception: BP of 160/100 or higher confirmed by two readings on ONE occasion</b> is enough</td></tr>
    <tr><td><b>Home and ambulatory monitoring</b></td><td>More accurate picture than office readings; used to confirm the diagnosis and to judge whether treatment is working (rules out white-coat readings)</td></tr>
    <tr><td><b>History and physical</b></td><td>Decide <b>primary vs secondary</b> · look for <b>target organ damage</b> · palpate peripheral pulses · examine neck and abdomen (bruits) · cardiac exam · screen for sleep apnea</td></tr>
    <tr><td><b>⭐ Labs and tests</b></td><td><b>Urinalysis</b> (protein, blood → kidney damage) · <b>blood chemistry</b> (BUN, creatinine, electrolytes, glucose, lipids) · <b>12-lead ECG</b> (LVH, ischemia) · <b>echocardiogram</b> (wall thickness, function)</td></tr>
    <tr><td><b>BNP</b></td><td>Released by the ventricles when they are <b>stretched by too much volume and pressure</b>. It rises with fluid overload and heart failure, so it tells you how much strain the fluid load is putting on the heart</td></tr>
  </table>
  <div class="trap"><span class="tag">One high reading is not a diagnosis</span>A single reading of 142/88 does not diagnose hypertension. It must be confirmed across occasions, unless it is <b>160/100 or higher on two readings at one visit</b>.</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Primary vs secondary hypertension</h3>
  <table class="lab">
    <tr><th></th><th>PRIMARY (essential, idiopathic)</th><th>SECONDARY</th></tr>
    <tr><td><b>Cause</b></td><td><b>No single identifiable cause</b>; genetics, age, and lifestyle combine</td><td><b>Caused by another condition</b> that can often be treated</td></tr>
    <tr><td><b>How common</b></td><td>About 90 to 95% of cases</td><td>About 5 to 10%</td></tr>
    <tr><td><b>Examples</b></td><td>—</td><td>Kidney disease, renal artery stenosis, hyperaldosteronism, Cushing syndrome, pheochromocytoma, thyroid disease, sleep apnea, coarctation of the aorta, drugs (NSAIDs, steroids, decongestants, oral contraceptives, stimulants)</td></tr>
    <tr><td><b>Clue</b></td><td>Gradual onset, middle age and older</td><td><b>Sudden onset, very young or very severe, or resistant to three drugs</b></td></tr>
  </table>
  <div class="hy"><span class="tag">Why it matters</span>Secondary hypertension can <b>resolve when the cause is treated</b>. A young client with sudden severe hypertension should prompt a search for the cause, not just another pill.</div>
</div>
<div class="card" style="border-color:var(--red)">
  <h3>⭐ Hypertensive crisis: emergency vs urgency</h3>
  <p class="why-chain">Both are <b>SBP over 180 and/or DBP over 120</b>. Both need immediate attention. <b>Target organ damage is the only thing that separates them.</b></p>
  <table class="lab">
    <tr><th></th><th>EMERGENCY</th><th>URGENCY</th></tr>
    <tr><td><b>Organ damage</b></td><td><b>New or worsening target organ damage</b></td><td><b>None</b>, on exam and labs</td></tr>
    <tr><td><b>Examples</b></td><td>Hypertensive encephalopathy · stroke · <b>MI</b> · <b>heart failure with pulmonary edema</b> · <b>dissecting aortic aneurysm</b> · kidney failure</td><td>Stable client, often from <b>not taking their medication</b></td></tr>
    <tr><td><b>⭐ How fast to lower it</b></td><td><b>No more than 25% in the first hour</b> → about <b>160/100 within 2 to 6 hours</b> → <b>normal over 24 to 48 hours</b></td><td><b>Controlled over 24 to 48 hours</b></td></tr>
    <tr><td><b>Exception</b></td><td><b>SBP under 140 within the first hour</b> only for <b>aortic dissection, severe preeclampsia/eclampsia, or pheochromocytoma crisis</b></td><td>—</td></tr>
    <tr><td><b>Setting and drugs</b></td><td>ICU, continuous monitoring, <b>IV</b> drugs with immediate onset (nicardipine, clevidipine, labetalol, esmolol, nitroglycerin, nitroprusside)</td><td>Restart or increase <b>oral</b> antihypertensives; find out <b>why</b> they stopped (cost, side effects, misunderstanding)</td></tr>
    <tr><td><b>Mortality</b></td><td><b>79% within 1 year if untreated</b></td><td>Lower, but still needs close follow-up</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Why "no more than 25%"</div><div class="big">The brain has adapted to the high pressure. Drop it too fast and it starves.</div><div class="exp">Chronic hypertension resets autoregulation, so the brain, heart, and kidneys now depend on a higher pressure to stay perfused. A rapid drop causes <b>stroke, MI, and kidney injury</b>. <b>Slow and controlled is the safe answer.</b></div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Hypertensive emergency: look at EVERY target organ, not just the heart</h3>
  <p class="why-chain">A crisis-level BP becomes an emergency the moment any organ shows damage. <b>Check all of them.</b> The heart is only one.</p>
  <table class="lab">
    <tr><th>Organ</th><th>Emergency signs</th><th>What it is</th></tr>
    <tr><td><b>🧠 Brain</b></td><td><b>Severe headache</b>, <b>confusion</b>, <b>dizziness</b>, blurred vision, nausea and vomiting, <b>seizures</b>, decreasing level of consciousness, <b>one-sided weakness or facial droop, slurred speech</b></td><td>Hypertensive encephalopathy, ischemic or hemorrhagic <b>stroke</b>, TIA</td></tr>
    <tr><td><b>🫀 Heart</b></td><td><b>Chest pain</b> (angina), dyspnea, <b>crackles</b>, pink frothy sputum, new dysrhythmia</td><td>MI, acute heart failure with pulmonary edema</td></tr>
    <tr><td><b>🩸 Aorta</b></td><td><b>Sudden tearing or ripping chest or back pain</b>, a big difference in BP between the arms</td><td><b>Aortic dissection</b> (the exception where SBP is dropped below 140 in the first hour)</td></tr>
    <tr><td><b>🫘 Kidneys</b></td><td><b>Low urine output</b>, <b>rising BUN and creatinine</b>, blood or protein in the urine</td><td>Acute kidney injury</td></tr>
    <tr><td><b>👁️ Eyes</b></td><td><b>Blurred vision or vision loss</b>, <b>papilledema</b>, retinal hemorrhages and exudates</td><td>Hypertensive retinopathy</td></tr>
  </table>
  <div class="trap"><span class="tag">⭐ The trap he warned about</span>Stems often lead with the heart. A client at 214/126 with <b>no chest pain</b> but <b>new confusion</b>, <b>blurred vision</b>, or <b>scant urine</b> is still an emergency. <b>Any one organ is enough.</b></div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Know the signs of a stroke</h3>
  <div class="mnem"><div class="tag">⭐ BE FAST</div><div class="big">Balance · Eyes · Face · Arms · Speech · Time</div><div class="exp"><b>B</b>alance: sudden dizziness, loss of coordination, trouble walking. <b>E</b>yes: sudden blurred, double, or lost vision. <b>F</b>ace: drooping on one side, uneven smile. <b>A</b>rms: one arm drifts down or is weak or numb. <b>S</b>peech: slurred, garbled, or unable to find words or understand. <b>T</b>ime: note the time symptoms started (last known well) and call for help immediately.</div></div>
  <table class="lab">
    <tr><th>Also watch for</th><th>Why it matters</th></tr>
    <tr><td><b>Sudden severe "worst headache of my life"</b></td><td>Suggests a <b>hemorrhagic</b> stroke, which uncontrolled hypertension makes more likely</td></tr>
    <tr><td><b>Sudden numbness or weakness on one side</b> of the body</td><td>The side affected is <b>opposite</b> the side of the brain injury</td></tr>
    <tr><td><b>Sudden confusion</b> or decreased level of consciousness</td><td>Can be the only sign in older adults</td></tr>
    <tr><td><b>Symptoms that resolve within minutes</b></td><td>A <b>TIA</b>: a warning sign of a coming stroke, never "no big deal"</td></tr>
  </table>
  <div class="hy"><span class="tag">Why time matters</span>Clot-dissolving treatment for an ischemic stroke has a narrow window from when the client was <b>last known well</b>. The nurse's job is to recognize it, note the time, and escalate immediately. <b>Hypertension is the single biggest risk factor for stroke.</b></div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ Measuring blood pressure correctly, his infographic</h3>
  <table class="lab">
    <tr><th>Rule</th><th>Why</th></tr>
    <tr><td><b>Measure before eating, taking medication, or vigorous exercise</b></td><td>All three change the reading</td></tr>
    <tr><td><b>No caffeine or smoking for 30 minutes before</b></td><td>Both raise blood pressure temporarily</td></tr>
    <tr><td><b>Not when stressed or in pain; sit quietly for 5 minutes first</b></td><td>Sympathetic stimulation falsely raises the number</td></tr>
    <tr><td><b>Feet flat on the floor, back and arm supported, upper arm bare</b></td><td>Crossed legs and an unsupported back or arm raise the reading. Measuring over clothing is inaccurate</td></tr>
    <tr><td><b>Cuff at HEART level</b></td><td>Below the heart reads falsely high; above reads falsely low</td></tr>
    <tr><td><b>Correct cuff size for the upper arm</b></td><td><b>Too small reads falsely HIGH; too large reads falsely LOW</b></td></tr>
    <tr><td><b>Upper-arm, validated device only; no finger or wrist devices</b></td><td>Wrist and finger devices are unreliable</td></tr>
    <tr><td><b>At least 4 days in a row, morning and evening, about the same time</b></td><td>One reading is a snapshot; a pattern diagnoses</td></tr>
    <tr><td><b>Two readings each time, 1 minute apart</b></td><td>Confirms the value and averages out error</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The cuff-size trap</div><div class="big">Small cuff, big number. Big cuff, small number.</div></div>
</div>
<div class="card" style="border-color:var(--blue)">
  <h3>⭐ Taking a manual BP, and what is actually happening</h3>
  <ol class="chainlist">
    <li><b>1. Prepare:</b> client seated 5 minutes, feet flat, back supported, arm bare and supported at <b>heart level</b>, correct cuff size.</li>
    <li><b>2. Estimate:</b> palpate the brachial or radial pulse and inflate until it disappears. That is the rough systolic.</li>
    <li><b>3. Inflate</b> 20 to 30 mmHg above that point, with the stethoscope over the brachial artery.</li>
    <li><b>4. Deflate slowly</b>, about 2 to 3 mmHg per second.</li>
    <li><b>5. First clear tapping sound = SYSTOLIC.</b> The cuff pressure has just dropped below the pressure of the heart's squeeze, so blood spurts through the partly closed artery. These are the <b>Korotkoff sounds</b>.</li>
    <li><b>6. Sounds disappear = DIASTOLIC.</b> The artery is fully open and blood flows smoothly and silently, even while the heart rests.</li>
  </ol>
  <div class="mnem"><div class="tag">⭐ What the two numbers mean</div><div class="big">Systolic = pressure while the heart SQUEEZES. Diastolic = pressure while it RESTS.</div><div class="exp"><b>Pulse pressure</b> is the difference, normally about <b>40</b>. Narrow means low stroke volume (shock, heart failure); wide means high stroke volume or dilated vessels (exercise, fever, septic shock).</div></div>
  <div class="trap"><span class="tag">Errors that change the number</span><b>Cuff too small or arm below heart → falsely HIGH.</b> Cuff too large or arm above heart → falsely LOW. Deflating too fast → misses the true systolic and reads it low.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ Orthostatic blood pressure</h3>
  <ol class="chainlist">
    <li><b>1. LYING</b> — have the client lie flat for several minutes, then take BP and pulse.</li>
    <li><b>2. SITTING</b> — measure again.</li>
    <li><b>3. STANDING</b> — measure again <b>within 3 minutes of standing</b>. Stay beside the client; they may faint.</li>
  </ol>
  <div class="mnem"><div class="tag">⭐ The definition from his handout</div><div class="big">A drop of 20 or more systolic, or 10 or more diastolic, within 3 minutes of standing</div><div class="exp">Usually with dizziness or lightheadedness, and often a compensatory rise in heart rate. Common causes: <b>dehydration, blood loss, antihypertensives and diuretics, autonomic neuropathy</b> (diabetes), prolonged bed rest, and aging.</div></div>
  <div class="trap"><span class="tag">Safety first</span>If the client becomes dizzy or pale while standing, <b>return them to lying or sitting before finishing the measurement</b>. The data is not worth a fall.</div>
</div>
<div class="card" style="border-color:var(--teal)">
  <h3>⭐ Medical management</h3>
  <div class="mnem"><div class="tag">⭐ The goal (ACC/AHA)</div><div class="big">Keep BP under 130/80, for ALL adults, including older adults</div><div class="exp">The purpose is to <b>prevent complications and death</b>. The slide true/false on this is true: the target does not loosen for older adults.</div></div>
  <table class="lab">
    <tr><th>Lifestyle change</th><th>Detail</th></tr>
    <tr><td><b>Weight loss</b></td><td>Among the most effective single changes</td></tr>
    <tr><td><b>Diet</b></td><td><b>DASH</b> (Dietary Approaches to Stop Hypertension) or a <b>Mediterranean</b> pattern: vegetables, fruit, whole grains, low-fat dairy, lean protein, nuts, and olive oil. <b>Low sodium and high potassium</b>, <b>except in chronic kidney disease</b> (they can't clear potassium)</td></tr>
    <tr><td><b>Sodium</b></td><td>DASH limit <b>2,300 mg a day</b>; <b>1,500 mg lowers BP even further</b></td></tr>
    <tr><td><b>Exercise</b></td><td>Regular aerobic activity most days</td></tr>
    <tr><td><b>Alcohol and tobacco</b></td><td>Limit alcohol; stop smoking and nicotine</td></tr>
  </table>
  <table class="lab">
    <tr><th colspan="2">DASH daily portions (Table 28-3, 2,000-calorie diet)</th></tr>
    <tr><td>Grains</td><td>6 to 7</td></tr><tr><td>Vegetables</td><td>4 to 5</td></tr><tr><td>Fruits</td><td>4 to 5</td></tr>
    <tr><td>Low-fat or fat-free dairy</td><td>2 to 3</td></tr><tr><td>Lean meat, fish, poultry</td><td>6 or fewer</td></tr>
    <tr><td>Fats and oils</td><td>2 to 3</td></tr><tr><td>Nuts, seeds, beans</td><td>4 to 5 per <b>week</b></td></tr><tr><td>Sweets</td><td>5 or fewer per <b>week</b></td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ First-line medications</h3>
  <table class="lab">
    <tr><th>Order you gave</th><th>Class</th><th>How it lowers BP</th></tr>
    <tr><td><b>1</b></td><td><b>Thiazide diuretics</b> (hydrochlorothiazide)</td><td>Make the kidneys excrete sodium and water → less volume</td></tr>
    <tr><td><b>2</b></td><td><b>ACE inhibitors / ARBs</b></td><td>Block angiotensin II being made (ACE) or working (ARB) → vessels relax, less aldosterone, less fluid</td></tr>
    <tr><td><b>3</b></td><td><b>Calcium channel blockers</b> (amlodipine, diltiazem)</td><td>Keep calcium out of vessel smooth muscle → vessels relax</td></tr>
  </table>
  <div class="hy"><span class="tag">Black clients (Ch 28)</span><b>Thiazides or CCBs are preferred</b>; ACE inhibitors and ARBs tend to be less effective as the first choice.</div>
  <div class="hy"><span class="tag">Resistant hypertension</span>Before adding more drugs: <b>check adherence</b>, then <b>look for a secondary cause</b>.</div>
  <div class="mnem"><div class="tag">⭐ Older adults</div><div class="big">Start low, go slow · simplify the regimen</div><div class="exp">Begin at low doses and increase gradually. <b>Use a single medication if possible</b> and check for interactions; complicated regimens and cost are the main adherence problems. Watch for <b>falls, orthostatic hypotension, and acute kidney injury</b>, and track urine output and weight.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Where uncontrolled hypertension leads: heart failure</h3>
  <p class="why-chain">Pushing against high pressure for years makes the left ventricle <b>thicken</b> (hypertrophy). That is the start of the road to heart failure.</p>
  <table class="lab">
    <tr><th></th><th>DIASTOLIC heart failure</th><th>SYSTOLIC heart failure</th></tr>
    <tr><td><b>What happens</b></td><td>Chambers are <b>STIFF and THICK</b>, so the heart <b>can't FILL</b></td><td>Chambers are <b>STRETCHED and THIN</b>, the stretch is gone, so the heart <b>can't PUMP</b></td></tr>
    <tr><td><b>Phase affected</b></td><td>Diastole (relaxing and filling)</td><td>Systole (squeezing)</td></tr>
    <tr><td><b>Ejection fraction</b></td><td>Preserved (normal, about 50% or more)</td><td>Reduced (about 40% or less)</td></tr>
    <tr><td><b>Classic cause</b></td><td><b>Long-standing hypertension</b> with LVH, aging</td><td>MI, dilated cardiomyopathy, end-stage of chronic overload</td></tr>
    <tr><td><b>Severity</b></td><td>Serious</td><td><b>More lethal</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Match the word to the phase</div><div class="big">DIAstolic = can't fill (thick). SYStolic = can't squeeze (thin).</div></div>
</div>

<div class="card">
  <h3>🍷 Alcohol limits, his infographic</h3>
  <p>The lower-risk guideline on his slide is <b>14 units of alcohol a week</b> for both men and women, which equals roughly:</p>
  <table class="lab">
    <tr><td><b>6 pints of beer</b></td><td>at 4% strength</td></tr>
    <tr><td><b>6 glasses of wine</b></td><td>175 mL at 13%</td></tr>
    <tr><td><b>14 single shots of spirits</b></td><td>at 40%</td></tr>
  </table>

<h2 class="sec-title"><span class="sec-emoji">💔</span> ACS & Cardiac Assessment</h2>
<p class="intro-line">Acute coronary syndrome, diagnostics, and the physical assessment findings that tell the story.</p>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ The three anginas, including Prinzmetal</h3>
  <table class="lab">
    <tr><th></th><th>STABLE</th><th>UNSTABLE</th><th>PRINZMETAL (variant)</th></tr>
    <tr><td><b>Cause</b></td><td><b>Temporary blockage</b> when demand rises; plaque narrows the artery</td><td><b>Plaque ruptures</b>; a clot partly blocks the artery</td><td><b>VASOSPASM</b> of a coronary artery, often with little or no plaque</td></tr>
    <tr><td><b>When</b></td><td><b>With exertion</b>, emotion, cold, heavy meals</td><td><b>At REST</b>, or with less and less activity</td><td>Often <b>at rest and at night or early morning</b>, in a cycle</td></tr>
    <tr><td><b>Relief</b></td><td><b>Rest and nitroglycerin</b></td><td><b>Not reliably relieved</b>; it is an emergency</td><td>Responds to <b>nitrates and calcium channel blockers</b></td></tr>
    <tr><td><b>Troponin</b></td><td>Normal</td><td><b>Normal</b> (no death yet) but high risk of MI</td><td>Usually normal</td></tr>
    <tr><td><b>Triggers to teach</b></td><td>Pace activity, pretreat with nitro before exertion</td><td>Call 911</td><td><b>Smoking, cocaine, stress, cold exposure</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ How he framed unstable angina</div><div class="big">Unstable angina is a medical emergency, not a worse version of stable angina</div><div class="exp">The plaque has ruptured and a clot is forming. <b>Nothing has died yet, which is the whole point:</b> treat now and you can prevent the MI. That is why chest pain <b>at rest</b> always outranks chest pain with exertion.</div></div>
  <div class="mnem"><div class="tag">⭐ His comparison worth memorizing</div><div class="big">Critical limb ischemia is the peripheral version of unstable angina</div><div class="exp">Both mean the tissue is starving <b>at rest</b>, not just under load. Angina with exertion matches <b>claudication</b> with walking; chest pain at rest matches <b>rest pain</b> in the foot. Both mean the clock is running: the heart needs reperfusion, the limb needs <b>revascularization before it is lost</b>.</div></div>
</div>


<div class="card" style="border-color:var(--red)">
  <h3>⭐ Acute coronary syndrome, from his handout</h3>
  <p class="why-chain"><b>ACS: blood flow to the heart muscle is suddenly reduced or stopped</b>, causing chest pain (angina) or a heart attack (myocardial infarction).</p>
  <table class="lab">
    <tr><th>Diagnostic</th><th>What it shows</th></tr>
    <tr><td><b>Troponin I</b></td><td>The <b>most specific</b> marker of heart muscle damage. Rises within a few hours, stays elevated for days, so it catches a late-presenting MI. Drawn serially</td></tr>
    <tr><td><b>CK-MB</b></td><td>Cardiac enzyme that rises and falls faster than troponin, useful for detecting a <b>re-infarction</b></td></tr>
    <tr><td><b>Lipid panel</b></td><td>Identifies the atherosclerosis risk behind the event (high LDL, low HDL, high triglycerides)</td></tr>
    <tr><td><b>12-lead ECG</b></td><td>Should be done <b>within 10 minutes of arrival</b>. ST elevation identifies a STEMI that needs immediate reperfusion</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ His stated goals</div><div class="big">Prevent future myocardial infarctions, through medications and lifestyle changes</div><div class="exp">Long-term that means antiplatelets, statins, beta blockers, and ACE inhibitors, plus smoking cessation, heart-healthy diet, activity, weight, BP, and glucose control, and cardiac rehab.</div></div>
  <div class="trap"><span class="tag">A normal first troponin does not rule out MI</span>It takes hours to rise. That is why it is <b>repeated</b>. A normal ECG does not rule it out either.</div>
</div>


<div class="card" style="border-color:var(--red)">
  <h3>⭐ ST elevation and the ACS spectrum</h3>
  <table class="lab">
    <tr><th>Type</th><th>ECG</th><th>Troponin</th><th>What it means</th></tr>
    <tr><td><b>Unstable angina</b></td><td>May show ST depression or be normal</td><td><b>Normal</b></td><td>Ischemia without muscle death</td></tr>
    <tr><td><b>NSTEMI</b></td><td>ST depression or T-wave inversion, <b>no ST elevation</b></td><td><b>Elevated</b></td><td>Partial blockage, some muscle death</td></tr>
    <tr><td><b>⭐ STEMI</b></td><td><b>ST ELEVATION</b></td><td><b>Elevated</b></td><td><b>A coronary artery is completely blocked</b>; the full thickness of the heart wall is dying</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ STEMI means time is muscle</div><div class="big">ECG within 10 minutes · open the artery fast</div><div class="exp">A STEMI needs <b>immediate reperfusion</b>, ideally a cardiac catheterization with PCI (a door-to-balloon time of 90 minutes or less), or thrombolytics if PCI isn't available.</div></div>
  <table class="lab">
    <tr><th>⭐ His diagnostics</th><th>Why</th></tr>
    <tr><td><b>Troponin I</b></td><td><b>Most specific</b> marker of heart muscle damage; high-sensitivity troponin is preferred. Rises in a few hours, stays up for days. <b>Drawn serially</b></td></tr>
    <tr><td><b>CK-MB</b></td><td>Heart-specific enzyme; rises and falls faster than troponin, so it helps detect a <b>new re-infarction</b></td></tr>
    <tr><td><b>Lipid panel</b></td><td>Cholesterol, triglycerides, LDL, HDL; drawn after a <b>12-hour fast</b>. Shows the atherosclerosis risk behind the event</td></tr>
    <tr><td><b>12-lead ECG</b></td><td>Shows ischemia, injury, and infarction, and whether it is a STEMI</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ ACS treatment, from the new handout</h3>
  <div class="mnem"><div class="tag">⭐ Emergent treatment: M.O.N.A.</div><div class="big">Morphine · Oxygen · Nitrates · Aspirin</div><div class="exp">A memory aid for the immediate measures, not the order they are given. In practice <b>aspirin and nitroglycerin come first</b>, oxygen is given if the client is hypoxic, and <b>morphine is used when the pain continues despite nitrates</b>.</div></div>
  <table class="lab">
    <tr><th>Drug</th><th>What it does</th><th>Nursing points</th></tr>
    <tr><td><b>Aspirin</b></td><td><b>Antiplatelet</b>: stops the clot from growing</td><td>Chewed, non-enteric coated, for faster absorption. Check for allergy and active bleeding</td></tr>
    <tr><td><b>Nitrates</b> (nitroglycerin)</td><td><b>Vasodilator</b>: opens coronary arteries and lowers preload, easing chest pain</td><td><b>Check BP before and after each dose</b>; it drops blood pressure. Hold for <b>SBP under 90</b>. <b>Never give with erectile dysfunction drugs</b> (sildenafil) because of severe hypotension. Headache is expected</td></tr>
    <tr><td><b>Oxygen</b></td><td>Raises oxygen delivery to the injured muscle</td><td>Given if saturation is low or the client is short of breath</td></tr>
    <tr><td><b>Morphine</b></td><td>Relieves pain, reduces anxiety, and lowers the heart's oxygen demand</td><td>Monitor <b>respirations and blood pressure</b>. Used when pain persists after nitrates</td></tr>
  </table>
  <table class="lab">
    <tr><th>Reperfusion</th><th>Detail</th></tr>
    <tr><td><b>⭐ PCI (percutaneous coronary intervention)</b></td><td><b>First choice.</b> A catheter opens the blocked artery, usually with a stent. Goal is <b>door to balloon within 90 minutes</b></td></tr>
    <tr><td><b>⭐ Thrombolytics</b></td><td><b>Used if PCI is not available.</b> <b>Alteplase</b> or <b>streptokinase</b> dissolve the clot. <b>Bleeding is the major risk</b>: screen for recent surgery, trauma, stroke, or active bleeding, minimize needle sticks, and watch for a change in level of consciousness or sudden headache</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ His goals</div><div class="big">Restore perfusion and prevent future MIs, with medications and lifestyle changes</div></div>
  <div class="trap"><span class="tag">Anticoagulant vs thrombolytic</span><b>Heparin prevents the clot from growing. Thrombolytics dissolve the clot that is already there.</b> Same distinction as in DVT and PE.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ The three ACS types, his wording</h3>
  <table class="lab">
    <tr><th>Type</th><th>Blockage</th><th>ECG and troponin</th></tr>
    <tr><td><b>Unstable angina</b></td><td><b>Partial blockage</b>; chest pain <b>at rest</b></td><td>ECG may show depression or be normal; <b>troponin normal</b> (no muscle death yet)</td></tr>
    <tr><td><b>NSTEMI</b></td><td><b>Partial or intermittent blockage</b> that causes damage</td><td><b>No ST elevation</b>; <b>troponin elevated</b></td></tr>
    <tr><td><b>STEMI</b></td><td><b>Complete blockage</b> of a coronary artery</td><td><b>ST elevation</b>; <b>troponin elevated</b>. Needs immediate reperfusion</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Two questions sort all three</div><div class="big">Is the troponin up? Is there ST elevation?</div><div class="exp">Troponin normal means <b>unstable angina</b>. Troponin up without ST elevation means <b>NSTEMI</b>. Troponin up with ST elevation means <b>STEMI</b>.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>💔 ACS — angina vs. MI</h3>
  <ul class="clean">
    <li><b>ACS (acute coronary syndrome)</b> = blood flow to heart muscle is suddenly reduced or stopped (ischemia), producing chest pain (angina) or a full heart attack (MI).</li>
    <li><b>Stable angina</b> — predictable, triggered by exertion, resolves with rest/nitroglycerin.</li>
    <li><b>Unstable angina</b> — new, worsening, or occurring at rest. A warning sign the plaque may be unstable — treat as a medical emergency, not "just angina."</li>
    <li><b>MI</b> — sustained ischemia causes actual tissue necrosis (cell death), not just reversible oxygen debt.</li>
  </ul>
</div>

<div class="card">
  <h3>🧪 Diagnosing ACS/MI</h3>
  <ul class="clean">
    <li><b>Troponin I</b> — most sensitive/specific cardiac biomarker; released from necrotic myocardial cells.</li>
    <li><b>CK-MB</b> — another cardiac enzyme marker, less specific than troponin but still used.</li>
    <li><b>Lipid panel</b> — assesses CAD risk factors (cholesterol, triglycerides, LDL/HDL); requires fasting.</li>
    <li><b>12-lead ECG</b> — should be obtained within 10 minutes of ED arrival for suspected ACS; identifies ischemia, injury, infarction location through changes in EKG morphology.</li>
    <li><b>High-sensitivity CRP</b> — inflammatory biomarker, additional CV risk indicator.</li>
    <li><b>BNP (B-type natriuretic peptide)</b> — elevates specifically with fluid retention/ventricular strain; primary indicator used for heart failure, not ACS itself, but often drawn in the same cardiac workup.</li>
  </ul>
  <div class="hy">⭐ Goals of treatment: prevent a FUTURE MI and improve overall heart health through both medications and lifestyle change — not just treat the current event in isolation.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>💊 Acute MI medication management</h3>
  <ul class="clean">
    <li><b>Thrombolytics</b> — dissolve the clot causing the arterial blockage; time-critical, used in acute cases to salvage as much myocardium as possible.</li>
    <li><b>Antiplatelets</b> — inhibit the clotting cascade to prevent further clot formation/extension.</li>
    <li><b>Antihypertensives, nitroglycerin</b> — reduce cardiac workload and oxygen demand (nitro specifically via preload reduction, see the Why Engine).</li>
    <li><b>Nitroglycerin dosing for ischemic chest pain:</b> if pain persists despite nitroglycerin per protocol, this is an emergency requiring immediate escalation — persistent ischemic pain at rest is a red flag distinguishing it from stable, exertional angina.</li>
  </ul>
</div>

<div class="card">
  <h3>📏 Pulse pressure — what it tells you</h3>
  <p>Pulse pressure = systolic − diastolic. <b>Normal ≈ 40 mmHg.</b></p>
  <ul class="clean">
    <li><b>Narrow pulse pressure</b> — vasoconstriction compensating for low stroke volume (shock, HF, hypovolemia) or obstruction to flow (mitral/aortic stenosis).</li>
    <li><b>Wide pulse pressure</b> — conditions raising stroke volume (anxiety, exercise, bradycardia) or vasodilation (fever, septic shock).</li>
  </ul>
</div>


<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — time is muscle</span>The reason thrombolytic timing matters is that <b>ischemic myocardium dies</b> and cannot be recovered once it is gone. Options about cost or "works better after 24 hours" are there for anyone who never learned the mechanism.</div>
  <div class="trap"><span class="tag">Trap 2 — why tachycardia is dangerous in ACS</span>Coronaries perfuse during <b>diastole</b>, and a fast heart rate shortens diastole. So tachycardia both raises demand and cuts supply. "Tachycardia increases coronary blood flow" is the near-miss.</div>
  <div class="trap"><span class="tag">Trap 3 — the atypical presentation</span>Women, older adults, and diabetics may present with <b>fatigue, jaw or back pain, nausea, or dyspnea instead of chest pain</b>. A stem with no chest pain is not a stem without an MI.</div>
  <div class="trap"><span class="tag">Trap 4 — troponin timing</span>Troponin is the most specific marker but it <b>takes hours to rise</b>. A normal early troponin does not rule out an MI, and options treating it as definitive are wrong.</div>
  <div class="trap"><span class="tag">Trap 5 — nitroglycerin's mechanism</span>It works by <b>venodilation that reduces preload</b>, lowering the heart's workload. It does not dissolve clots and does not increase afterload.</div>
</div>
