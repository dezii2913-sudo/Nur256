<h2 class="sec-title"><span class="sec-emoji">🩺</span> Reproductive Health & STIs</h2>
<p class="intro-line">The specific reproductive-health slice confirmed testable: testicular cancer, PID, hysterectomy, menopause/HRT, BPH, ED, oral contraceptive contraindications, and every STI on your review sheet.</p>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ More from his revised handout</h3>
  <table class="lab">
    <tr><th>Topic</th><th>His version</th></tr>
    <tr><td><b>⭐ Hysterectomy recovery</b></td><td><b>Prolonged recovery, measured in MONTHS</b> · possible <b>grief and depression</b> · impact on sexuality · <b>refrain from sex for 4 to 6 weeks</b> · <b>early removal of the ovaries means you immediately enter menopause</b></td></tr>
    <tr><td><b>⭐ Cervical cancer risk reduction</b></td><td><b>Stop smoking · safe sex (his wording: delay intercourse until marriage) · HPV vaccine.</b> The underlying reason: cervical cancer is driven by <b>HPV</b>, so anything that lowers HPV exposure or prevents infection lowers risk, and <b>smoking doubles it</b> by impairing local immunity</td></tr>
    <tr><td><b>⭐ Syphilis timing</b></td><td><b>Primary:</b> a <b>painless, round sore (chancre)</b> at the site of infection, usually <b>10 to 90 days</b> after exposure · <b>Secondary:</b> a <b>rash covering the body</b>, classically including the <b>palms and soles</b>, with fever, swollen lymph nodes, and flu-like symptoms, about <b>3 to 6 months</b> after infection · <b>Latent:</b> no symptoms for years · <b>Tertiary:</b> heart disease, <b>brain damage</b>, and <b>blindness</b>. <b>Curable if caught early</b></td></tr>
    <tr><td><b>Herpes</b></td><td><b>HSV-1</b> is usually oral (cold sores around the mouth); <b>HSV-2</b> is usually genital, but <b>either type can infect either area</b>. Spread by <b>direct contact with lesions, semen, vaginal secretions, and saliva</b>. Genital lesions can appear on the <b>genitals, buttocks, or thighs</b>. Diagnosis: <b>swab the vesicle; if there is no lesion, a blood test</b>. <b>Can be passed with no visible symptoms</b></td></tr>
    <tr><td><b>Testicular cancer</b></td><td>Highly treatable, most common cancer in males <b>15 to 35</b> · <b>painless lump, swelling, heaviness, dull ache, or discomfort</b> · diagnosis by <b>tumor markers (AFP, hCG, LDH) and ultrasound</b> · treatment is <b>orchiectomy</b>, sometimes radiation afterward, with <b>sperm harvesting</b> discussed first</td></tr>
  </table>
</div>


<div class="card" style="border-color:var(--amber)">
  <h3>⭐ STI trends and uncircumcised hygiene he mentioned</h3>
  <table class="lab">
    <tr><td><b>Herpes simplex</b></td><td><b>Not a reportable infection</b> in most places, and it is <b>spread even without symptoms</b> (asymptomatic shedding), which is why it keeps spreading. Lifelong; antivirals reduce outbreaks and transmission but do not cure</td></tr>
    <tr><td><b>Syphilis</b></td><td><b>Resurging.</b> Screen, treat with penicillin G, <b>treat partners</b>, and remember the <b>palms and soles</b> rash of the secondary stage</td></tr>
    <tr><td><b>Gonorrhea</b></td><td><b>Antibiotic-resistant strains are increasing</b>, so treatment follows current CDC regimens and <b>test-of-cure or retesting</b> matters</td></tr>
    <tr><td><b>Partner notification</b></td><td>Required for reportable infections and part of care for all. It creates real <b>privacy and disclosure tension</b>, so the nurse encourages disclosure, explains why reinfection happens without it, and offers health department help with anonymous notification</td></tr>
  </table>
  <div class="hy"><span class="tag">⭐ Uncircumcised hygiene</span><b>Retract the foreskin, clean with warm water (mild soap if tolerated), dry, and ALWAYS return the foreskin to its normal position.</b> Smegma (skin cells and oils) collects under the foreskin and causes odor, irritation, and infection if it is not cleaned. Teach it as a daily habit. <b>Wipe front to back</b> after toileting to avoid moving bacteria toward the urethra. Failing to replace the foreskin causes <b>paraphimosis</b>.</div>
</div>


<div class="card" style="border-color:var(--red)">
  <h3>⭐ Hysterectomy, oophorectomy, and recovery</h3>
  <table class="lab">
    <tr><td><b>Hysterectomy</b></td><td>Removal of the <b>uterus</b>. Periods stop and pregnancy is no longer possible, but <b>if the ovaries remain, hormones continue and menopause does not start</b></td></tr>
    <tr><td><b>⭐ Oophorectomy</b></td><td>Removal of the <b>ovaries</b>. <b>Bilateral removal causes IMMEDIATE (surgical) menopause</b>, with symptoms that come on abruptly and are often more intense than natural menopause, because there is no gradual decline</td></tr>
    <tr><td><b>Recovery teaching</b></td><td><b>Nothing in the vagina and no intercourse for about 6 weeks</b> while the vaginal cuff heals · no heavy lifting or straining · report <b>heavy bleeding, foul discharge, fever, or calf pain</b> (DVT risk after pelvic surgery) · early ambulation</td></tr>
    <tr><td><b>Sexuality and body image</b></td><td>Grief about fertility, femininity, or body image is common; ask about it. <b>Low estrogen causes vaginal dryness and a pH shift</b> (less acidic), so there is more dryness, painful intercourse, and infection risk. Teach <b>water-based lubricant</b>, vaginal moisturizers, or topical estrogen, and use <b>PLISSIT</b> to open the conversation</td></tr>
  </table>
</div>



<div class="card" style="border-color:var(--purple)">
  <h3>⭐ PLISSIT model for sexual health care</h3>
  <p class="why-chain">A stepwise way to talk about sexual health. <b>Each level takes more training, and most nurses work at the first two.</b></p>
  <ol class="chainlist">
    <li><b>P = Permission.</b> Give the client permission to raise the topic. Ask an open, nonjudgmental question such as "Many people have questions about sex after this surgery. Do you?" <b>Every nurse can do this, and it is where most of the value is.</b></li>
    <li><b>LI = Limited Information.</b> Give basic, factual information related to their concern, such as when intercourse can resume or how a medication affects function.</li>
    <li><b>SS = Specific Suggestions.</b> Offer concrete strategies: positions after hip surgery, timing around fatigue or pain, using lubricant after menopause. Requires more knowledge of the client's situation.</li>
    <li><b>IT = Intensive Therapy.</b> <b>Referral</b> to a specialist such as a sex therapist or counselor for complex or long-standing problems.</li>
  </ol>
  <div class="mnem"><div class="tag">⭐ How he can test it</div><div class="big">Start at Permission, refer at Intensive Therapy</div><div class="exp">If an option has the nurse <b>opening the door</b> to the conversation, that is <b>Permission</b>. If it has the nurse <b>sending the client to a specialist</b>, that is <b>Intensive Therapy</b>. Giving facts is <b>Limited Information</b>; giving tailored strategies is <b>Specific Suggestions</b>.</div></div>
  <div class="hy"><span class="tag">Why the model exists</span>Clients rarely bring up sexual concerns on their own, and providers rarely ask. <b>Permission-giving removes the burden from the client</b> and is nonjudgmental, private, and free of assumptions about a partner's gender or the client's activity.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Benign prostatic hyperplasia (BPH) in depth</h3>
  <p class="why-chain"><b>Pathophysiology:</b> with aging and hormonal change (testosterone converting to DHT), the prostate cells <b>multiply</b>. The prostate surrounds the urethra, so as it enlarges it <b>squeezes the urethra shut</b>. The bladder has to push harder, its wall thickens, and eventually it cannot empty.</p>
  <table class="lab">
    <tr><td><b>⭐ Risk factors</b></td><td><b>Aging</b> · <b>smoking</b> · <b>heavy alcohol consumption</b> · <b>obesity</b> · a <b>Western diet</b> (high fat, low fiber, red meat) · diabetes · inactivity · family history</td></tr>
    <tr><td><b>⭐ Manifestations</b></td><td><b>Urinary frequency · urgency · nocturia · decreased force of the stream</b> · hesitancy, straining, dribbling, incomplete emptying · <b>pelvic discomfort</b> · <b>anorexia</b> · nausea · <b>azotemia</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The why behind the why: incomplete emptying</div><div class="big">Urine that stays behind is urine that causes trouble</div><div class="exp">Retained urine leads, in order, to: <b>1. Urinary tract infection</b> (stagnant urine grows bacteria) · <b>2. Bladder stones</b> (minerals settle out) · <b>3. Bladder wall thickening and diverticula</b> from constant straining · <b>4. Backflow up the ureters (reflux) → HYDRONEPHROSIS</b>, the kidney swelling with trapped urine · <b>5. Kidney damage → AZOTEMIA</b> (rising BUN and creatinine) and eventually renal failure. <b>Acute urinary retention</b> can happen suddenly and is an emergency.</div></div>
  <table class="lab">
    <tr><th>Diagnosis</th><th>Detail</th></tr>
    <tr><td><b>⭐ Digital rectal exam (DRE)</b></td><td>Feels the prostate. <b>BPH: smooth, firm, symmetrically enlarged.</b> <b>Cancer: hard, fixed, irregular, nodular</b></td></tr>
    <tr><td><b>⭐ PSA (prostate-specific antigen)</b></td><td>Screens for prostate cancer. <b>PSA can also rise with BPH, prostatitis, recent ejaculation, catheterization, or a DRE</b>, so it is not specific. <b>Draw PSA BEFORE the DRE</b> when both are done</td></tr>
    <tr><td><b>Other</b></td><td>Urinalysis (infection, blood) · BUN and creatinine (azotemia) · <b>post-void residual</b> · uroflowmetry · ultrasound</td></tr>
  </table>
  <table class="lab">
    <tr><th>Medical management</th><th>How it works</th></tr>
    <tr><td><b>⭐ Alpha-adrenergic blockers</b><br>tamsulosin, doxazosin, terazosin (-osin)</td><td><b>Relax the smooth muscle</b> of the prostate and bladder neck so urine flows. <b>Work within days.</b> Watch for <b>orthostatic hypotension and dizziness</b>, so the first dose is often at bedtime; teach slow position changes and fall precautions</td></tr>
    <tr><td><b>5-alpha reductase inhibitors</b><br>finasteride, dutasteride</td><td><b>Shrink</b> the prostate by blocking testosterone conversion to DHT. <b>Take 3 to 6 months to work.</b> Can <b>lower the PSA</b>, which may mask cancer. <b>Pregnant women should not handle crushed or broken tablets</b> (birth defect risk)</td></tr>
    <tr><td><b>Surgery</b></td><td><b>TURP</b> (transurethral resection of the prostate) when symptoms are severe or retention persists. Expect <b>continuous bladder irrigation</b> and <b>pink-tinged urine</b> after; bright red with clots is reported</td></tr>
  </table>
  <div class="trap"><span class="tag">Drugs that make BPH worse</span><b>Anticholinergics, antihistamines, and decongestants</b> reduce bladder contraction or tighten the bladder neck and can cause <b>acute urinary retention</b>. Check before giving them to a man with BPH.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ The testicles and the ovaries: what they are for</h3>
  <table class="lab">
    <tr><th></th><th>TESTICLES</th><th>OVARIES</th></tr>
    <tr><td><b>Two jobs</b></td><td><b>1. Produce sperm</b> (spermatogenesis) · <b>2. Produce testosterone</b></td><td><b>1. Produce and release ova (eggs)</b> · <b>2. Produce estrogen and progesterone</b></td></tr>
    <tr><td><b>Why the location matters</b></td><td>They sit <b>outside the body in the scrotum because sperm need a temperature about 2 to 3 degrees below body temperature.</b> That is why <b>undescended testicles (cryptorchidism)</b> damage sperm production and raise cancer risk</td></tr>
    <tr><td><b>What the hormones do</b></td><td><b>Testosterone</b>: male characteristics, muscle and bone mass, libido, sperm production</td><td><b>Estrogen</b>: female characteristics, uterine lining growth, <b>bone density</b>, cardiovascular protection. <b>Progesterone</b>: prepares and maintains the uterine lining for pregnancy</td></tr>
    <tr><td><b>When they stop</b></td><td>Testosterone declines gradually with age</td><td><b>Menopause</b>: estrogen falls sharply, which is why <b>osteoporosis and cardiovascular risk rise</b> afterward</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ Testicular cancer in depth</h3>
  <table class="lab">
    <tr><td><b>Who</b></td><td><b>The most common cancer in men aged 15 to 35.</b> Highly curable, even with spread, when found early</td></tr>
    <tr><td><b>⭐ Risk factors</b></td><td><b>Cryptorchidism (undescended testicle) is the biggest</b>, even after surgical correction · family or personal history · white race · HIV · testicular atrophy</td></tr>
    <tr><td><b>⭐ Signs</b></td><td><b>A PAINLESS, hard lump or swelling in one testicle</b> · heaviness or a dull ache in the scrotum, lower abdomen, or groin · a change in size or firmness · sometimes breast tenderness or enlargement from hormone production. <b>Pain is usually absent, which is why men delay</b></td></tr>
    <tr><td><b>Diagnosis</b></td><td><b>Scrotal ultrasound</b> first · <b>tumor markers: AFP, beta-hCG, LDH</b> (also used to track response) · CT for staging. <b>Biopsy through the scrotum is avoided</b> because it can seed cancer cells</td></tr>
    <tr><td><b>Treatment</b></td><td><b>Radical inguinal orchiectomy</b> (removal through the groin), then radiation or chemotherapy by stage. <b>Discuss SPERM BANKING before treatment</b>, since chemo and radiation can cause infertility</td></tr>
    <tr><td><b>Nursing</b></td><td>Body image and fertility concerns · a <b>prosthesis</b> is available · one healthy testicle usually maintains fertility and hormones · lifelong follow-up with markers and imaging</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Testicular self-exam (TSE)</div><div class="big">Monthly, after a warm shower, when the scrotum is relaxed</div><div class="exp">Roll each testicle between the thumb and fingers. Feel for a <b>hard painless lump</b> or change in size. The <b>epididymis</b> is a normal soft, comma-shaped structure on the back and top; don't mistake it for a lump. <b>Report any change.</b></div></div>
</div>

<div class="card">
  <h3>⭐ Phimosis and paraphimosis</h3>
  <table class="lab">
    <tr><th></th><th>PHIMOSIS</th><th>PARAPHIMOSIS</th></tr>
    <tr><td><b>What it is</b></td><td>The foreskin is <b>too tight to retract</b> back over the glans</td><td>The retracted foreskin <b>cannot be returned</b> to its normal position and constricts the glans</td></tr>
    <tr><td><b>Why it happens</b></td><td>Normal in young boys and usually resolves; in adults from <b>scarring, repeated infection, poor hygiene, or diabetes</b></td><td>Often after the foreskin is retracted for cleaning or catheterization and <b>not replaced</b></td></tr>
    <tr><td><b>Problems</b></td><td>Painful urination or erection, trapped smegma, <b>recurrent infection (balanitis)</b>, difficulty with hygiene and catheter insertion</td><td><b>Swelling, pain, and impaired blood flow to the glans. This is a urologic EMERGENCY</b> and can cause tissue death</td></tr>
    <tr><td><b>Management</b></td><td>Gentle hygiene, topical steroid, <b>circumcision</b> if persistent</td><td><b>Manual reduction right away</b>, sometimes a dorsal slit or circumcision</td></tr>
  </table>
  <div class="trap"><span class="tag">⭐ The nursing action that prevents it</span>After retracting the foreskin to clean or to insert a catheter, <b>always return it to its normal position</b>. Forgetting is the classic cause of paraphimosis.</div>
</div>


<div class="card" style="border-color:var(--purple)">
  <h3>🌸 Female Reproductive Basics</h3>
  <ul class="clean">
    <li><b>Vaginal pH</b> acts as a protective mechanism against infection. It can be disrupted by hormones, hygiene products, soaps, douching, semen, antibiotics, aging, and poor hygiene practices.</li>
    <li><b>Menarche (first period):</b> average onset around age 11-12. <b>Menopause:</b> average onset around age 50.</li>
    <li><b>Menstrual cycle:</b> average 28 days; ovulation occurs approximately 2 weeks BEFORE the next expected period (not 2 weeks after the last one — a common point of confusion).</li>
    <li><b>Key terminology:</b>
      <ul class="clean">
        <li><b>Dyspareunia</b> — painful intercourse.</li>
        <li><b>Amenorrhea</b> — absence of menstruation.</li>
        <li><b>Menorrhagia</b> — excessive menstrual bleeding <i>during</i> a period.</li>
        <li><b>Metrorrhagia</b> — bleeding that occurs <i>between</i> periods (irregular, not tied to the expected menstrual cycle) — easy to confuse with menorrhagia, but a distinct pattern.</li>
      </ul>
    </li>
    <li><b>Menstrual hygiene:</b> frequent tampon changes reduce infection risk, including <b>toxic shock syndrome (TSS)</b> — a rare but serious complication historically linked to prolonged tampon use.</li>
    <li><b>PMS (premenstrual syndrome)</b> — the same hormonal shifting that drives perimenopausal symptoms (mood changes, occasional hot flashes) can also cause similar symptoms tied to the normal menstrual cycle itself, not just the menopausal transition. Don't confuse a PMS symptom pattern with perimenopause just because the symptoms look similar.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🧬 Testicular Cancer</h3>
  <ul class="clean">
    <li><b>Highly treatable</b> — most common cancer in males age 15-35.</li>
    <li><b>Presentation:</b> painless lump, swelling, heaviness, dull ache, pain or discomfort in the testicle.</li>
    <li><b>Diagnosis:</b> tumor markers — <b>alpha-fetoprotein (AFP), hCG, LDH</b> — plus ultrasound.</li>
    <li><b>Treatment:</b> standard is surgery (<b>orchiectomy</b>), sometimes followed by radiation. <b>Sperm harvesting</b> offered before treatment to preserve fertility.</li>
  </ul>
</div>

<div class="card">
  <h3>🩺 Pelvic Inflammatory Disease (PID)</h3>
  <p>An infection of the female reproductive organs — uterus, fallopian tubes, and ovaries. Often a complication of an untreated STI (like chlamydia or gonorrhea) ascending into the upper reproductive tract.</p>
</div>

<div class="card">
  <h3>🏥 Hysterectomy</h3>
  <ul class="clean">
    <li><b>Hysterectomy</b> = removal of the uterus. If the <b>ovaries are also removed (oophorectomy)</b>, this induces <b>immediate surgical menopause</b> — hormone production stops right away rather than declining gradually, so the patient experiences the full symptom profile (hot flashes, vaginal dryness, etc.) immediately post-op, not over years.</li>
    <li><b>Post-op monitoring:</b> watch for active bleeding — <b>changing pads more than 2-3 times per hour is a concerning finding</b> requiring prompt notification.</li>
    <li><b>Recovery:</b> typically <b>6-8 weeks</b> with restricted activity and travel; overall psychological recovery and adjustment can take longer (months), with possible grief, depression, and body image effects — particularly given the loss of reproductive organs and its impact on identity and sexuality.</li>
    <li><b>Nursing approach:</b> sensitive, open-ended questioning about how the patient is coping; involve the partner in recovery support when appropriate; explore alternative ways to maintain emotional/physical intimacy during the recovery window; offer support groups.</li>
  </ul>
  <div class="hy">⭐ <b>Cervical cancer risk reduction:</b> smoking cessation, safe sex practices, and the HPV vaccine (now approved for an expanded age range in BOTH genders — roughly age 9 through the mid-40s, not just adolescents). Additional cervical cancer risk factors: early onset of sexual activity and multiple sexual partners/STI history.</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>🌡️ Menopause & Perimenopause</h3>
  <ul class="clean">
    <li><b>Menopause</b> — defined by 12 consecutive months WITHOUT a menstrual period.</li>
    <li><b>Perimenopause</b> — the transition time leading up to menopause; periods become irregular and further apart before stopping permanently. Same symptom profile as menopause, just before periods have fully stopped.</li>
    <li><b>Symptoms:</b> hot flashes, night sweats, irregular periods, vaginal dryness, joint/muscle aches, weight gain.</li>
    <li><b>Non-hormonal management:</b> keep the bedroom cool (fan), reduce stress, avoid caffeine/alcohol, exercise regularly, wear light clothing, maintain a healthy weight. Also: smoking cessation, exercise, calcium & vitamin D (reduces coronary and osteoporosis risk, both of which rise after estrogen loss).</li>
  </ul>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>💊 Hormone Replacement Therapy (HRT) & Oral Contraceptive Contraindications</h3>
  <ul class="clean">
    <li><b>HRT benefits:</b> relieves menopausal symptoms, protects bone health, reduces some cardiovascular risks.</li>
    <li><b>HRT cautions/contraindications:</b> history of breast cancer, blood clotting issues, HTN, smoking. Alternatives: vitamin/herbal supplements.</li>
    <li><b>Combination therapy vs. estrogen-only — a key nuance:</b> the increased cancer risk historically associated with HRT is specifically tied to <b>combination estrogen-progesterone therapy</b>. Research has shown that <b>estrogen-only therapy carries a notably lower risk</b> — this distinction matters for counseling and is easy to over-generalize if you only remember "HRT raises cancer risk" without the nuance of which formulation.</li>
    <li><b>Oral contraceptive contraindications:</b> HTN, history of DVT/stroke/PE, smoking, breast cancer, liver disease.</li>
  </ul>
  <div class="hy">⭐ Notice the overlap: HTN, clotting history, and smoking disqualify BOTH HRT and oral contraceptives — because both involve exogenous estrogen, which raises clotting risk and interacts with the same cardiovascular risk factors.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>👨 Benign Prostatic Hyperplasia (BPH)</h3>
  <p><b>Anatomy:</b> the prostate gland sits at the base of the bladder, wrapping around the urethra. It (along with Cowper's/bulbourethral glands) contributes secretions to the ejaculate. As the prostate enlarges with age (very common in older males), it constricts/compresses the urethra and impairs urinary flow.</p>
  <ul class="clean">
    <li><b>Prevalence:</b> some degree of prostate enlargement is extremely common with age — a large majority of men over 70 have it.</li>
    <li><b>Clinical signs from urethral constriction:</b> post-void dribbling, incomplete bladder emptying, urinary frequency, frequent NOCTURNAL urination (nocturia) from chronic retention — the bladder never fully empties, so it refills faster.</li>
    <li><b>Diagnosis:</b> digital rectal exam (DRE) to assess prostate size/shape; PSA may be checked but can be elevated in BOTH BPH and prostate cancer, so it isn't diagnostic on its own for distinguishing the two.</li>
    <li><b>Two DIFFERENT drug classes, two different jobs:</b>
      <ul class="clean">
        <li><b>Alpha-blockers</b> (e.g., tamsulosin) — relax smooth muscle right away; symptom relief within days to weeks, but don't shrink the gland.</li>
        <li><b>5-alpha reductase inhibitors</b> (e.g., finasteride) — actually shrink prostate tissue over time by blocking the hormone conversion driving its growth; much slower onset (months), sometimes combined with an alpha-blocker for a faster-then-lasting effect.</li>
      </ul>
    </li>
    <li><b>Untreated/severe BPH complications:</b> acute urinary retention, recurrent UTIs from incomplete emptying, bladder stones, and — over time — possible kidney damage from chronic backflow/retention.</li>
    <li><b>Surgical option for severe or medication-refractory cases:</b> TURP (transurethral resection of the prostate) — removes excess tissue to relieve obstruction.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>💊 Erectile Dysfunction (ED) & the Nitrate Danger</h3>
  <ul class="clean">
    <li><b>Multifactorial causes:</b> psychosomatic/psychological stress, vascular disease, hormonal factors (natural age-related testosterone decline). (See the Why Engine card connecting ED to early vascular disease detection.)</li>
    <li><b>Vascular contributors:</b> atherosclerosis, hypertension, and diabetes can all impair the (highly vascular) blood flow needed for erectile function — the same disease processes covered throughout this unit.</li>
    <li><b>Treatment options:</b> addressing the specific broken component matters — psychological support for psychosomatic causes, hormone therapy for a hormonal component (same increased-cancer-risk caveat as other hormone therapy), <b>vacuum erection devices (pumps)</b>, and medication.</li>
    <li><b>ED medications (PDE5 inhibitors, e.g., sildenafil/Viagra)</b> — work via a nitric oxide-based mechanism causing vasodilation.</li>
    <li><b style="color:var(--red)">CONTRAINDICATED with nitrates</b> (like nitroglycerin) — combining the two causes profound, dangerous vasodilation and hypotension, risking severe blood pressure drops, fainting, and cardiac events. This is a critical medication safety teaching point.</li>
  </ul>
</div>

<div class="card">
  <h3>👨 Phimosis & Male Hygiene</h3>
  <ul class="clean">
    <li><b>Definition:</b> inflammation/tightening of the foreskin that prevents normal retraction.</li>
    <li><b>Cause:</b> often related to inadequate hygiene, allowing bacteria/debris accumulation, or improper retraction technique causing swelling/constriction.</li>
    <li><b>Critical teaching point:</b> after retracting the foreskin for cleaning, it must always be <b>returned to its original (unretracted) position</b> — leaving it retracted can cause painful constriction and swelling (paraphimosis), a genuine complication.</li>
    <li><b>Male hygiene technique:</b> clean the shaft moving AWAY from the meatus (urinary opening), not toward it — the parallel teaching point to "wipe front to back" for females. Introducing bacteria toward the meatus raises UTI risk.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🦠 STIs — every one on your review sheet is confirmed testable</h3>
  <div class="hy">⭐ <b>STI reporting status — high-yield fact:</b> gonorrhea, chlamydia, and syphilis are <b>mandatory state-reportable</b> diseases. <b>Herpes is NOT reportable.</b> Partner notification and treatment are essential regardless of reporting status, to actually cure the infection and stop transmission.</div>
  <ul class="clean">
    <li><b>Herpes:</b> HSV-1 typically causes oral herpes (cold sores around the mouth); HSV-2 typically causes genital herpes (blisters/ulcers on the genitals, buttocks, or thighs) — but either type can infect either location, making the classic split less absolute in practice. Spread by direct contact with lesions, semen, vaginal secretions, saliva. <b>Diagnosis:</b> swab of the vesicle; if no active lesion, blood test.</li>
    <li><b>Syphilis</b> (curable if caught early) — 4 stages:
      <ul class="clean">
        <li><b>Primary:</b> a painless, round sore (chancre) at the infection site, 10-90 days after exposure.</li>
        <li><b>Secondary:</b> body rash, fever, swollen lymph nodes, flu-like symptoms, 3-6 months after infection.</li>
        <li><b>Latent:</b> no symptoms, can last years.</li>
        <li><b>Tertiary:</b> serious complications if untreated for years — heart disease, brain damage, blindness.</li>
      </ul>
    </li>
    <li><b>Chlamydia:</b> ranges from no symptoms to dysuria, thick white/yellow discharge, abdominal pain, pain during intercourse.</li>
    <li><b>Gonorrhea:</b> increased vaginal discharge — can be white, yellow, or green. <b>Newer, more virulent/antibiotic-resistant strains</b> are an emerging concern — in severe or disseminated cases, gonorrhea can spread beyond the genital tract to distant sites (eyes, joints, kidneys, even the meninges/CNS), a significantly more dangerous presentation than the classic localized infection.</li>
    <li><b>Trichomoniasis:</b> frothy yellow-white or yellow-green discharge; treated with <b>metronidazole</b>.</li>
    <li><b>Candidiasis:</b> white, cottage cheese-like discharge.</li>
  </ul>
  <div class="hy">⭐ Newer STI strains are becoming more virulent and antibiotic-resistant in some cases — reinforcing why prompt treatment, partner notification, and prevention (HPV vaccination, safe sex) matter as much as ever.</div>
  <div class="mnem"><div class="tag">Discharge color/texture memory hook</div><div class="big">Chlamydia = thick white/yellow • Gonorrhea = white/yellow/GREEN • Trichomoniasis = FROTHY yellow-green • Candidiasis = COTTAGE CHEESE white</div></div>
</div>


<div class="card" style="border-color:var(--red)">

</div>

  <p><b>Cause:</b> the heart fails to pump forward effectively, so blood backs up into whatever is upstream of the failing side.</p>
  <p><b>Manifests — Right:</b> peripheral edema, JVD, weight gain, ascites (backs up into the systemic venous system). <b>Manifests — Left:</b> pulmonary congestion, crackles, dyspnea (backs up into the lungs).</p>

<h2 class="sec-title"><span class="sec-emoji">🧩</span> Study Mode: Breaking Down a Question</h2>

    <li><b>Confusing "what's abnormal" with "what's most urgent."</b> A stem can list several abnormal findings and one truly urgent one — the urgent one wins.</li>
    <li><b>Treating a drug fact in isolation</b> instead of connecting it back to the disease process it's being used for — this instructor consistently ties medications to WHY they matter for a specific condition, not just what they do.</li>
    <li><b>Forgetting what TYPE of question it is</b> — mixing up an assessment question (gather data) with an intervention question (take action).</li>
  </ul>
</div>

<div id="quiz-studymode"></div>
`;
renderQuiz('quiz-studymode',[
  {q:'PRACTICE — "Which patient should the nurse assess FIRST?" What does the keyword tell you about this question?',type:'single',
   opts:['It is a priority question — multiple patients may have real needs, but one needs attention before the others','This particular keyword mainly signals a documentation question rather than an assessment decision','It is primarily a teaching question focused on assessing patient education needs across the group','It is an evaluation question specifically checking whether a prior intervention worked as intended'],correct:0,
   rat:'This is a classic priority/triage stem. "FIRST" doesn\'t mean the other patients are fine — it means ranking urgency among several legitimate needs.'},

  {q:'PRACTICE — A question describes a wound with irregular borders, a ruddy wound bed, and warm, discolored surrounding skin, then asks what type of ulcer this is. A classmate assumes "arterial" because ulcers sound serious either way. What did they do wrong?',type:'single',
   opts:['They should have assumed venous automatically instead, since it happens to be the more common ulcer type overall','They ignored the specific descriptive data in the stem that actually points to VENOUS, not arterial','The question is unanswerable as written since ulcer type requires a biopsy result to confirm definitively','Nothing — arterial and venous ulcers actually present with identical wound characteristics in most cases'],correct:1,
   rat:'This mirrors a common mistake: reacting to a general impression ("this sounds bad, must be arterial") instead of using the specific data given. Irregular borders, a ruddy/exudative bed, and warm discolored skin are the classic VENOUS pattern, not arterial.'},

  {q:'PRACTICE — "All of the following are TRUE about right-sided heart failure EXCEPT:" How should you approach the four options?',type:'single',
   opts:['Skip over the word EXCEPT entirely, since this particular keyword rarely changes the actual correct answer','Look for the one option that does NOT belong — the odd one out among otherwise-true statements','Assume that all four of the listed options are actually false statements about right-sided heart failure','Simply pick whichever option happens to sound the most clinically severe out of the four choices given'],correct:1,
   rat:'D is exactly the trap — EXCEPT changes everything about how you should scan the options. You\'re hunting for the single FALSE statement hiding among three true ones, not ranking by severity or assuming a blanket outcome.'},

  {q:'PRACTICE — A question gives a client\'s CVP of 8 mmHg, reported dyspnea, and an elevated BNP, then asks how the nurse should interpret these findings TOGETHER. A classmate treats each value as a separate, unrelated finding to analyze one at a time. What\'s the better approach?',type:'single',
   opts:['The classmate\'s approach is correct — labs should be memorized as isolated normal/abnormal values without cross-referencing','Only the BNP value matters for grading purposes, since it is the most recently covered topic in lecture','These three particular findings typically appear only on separate exam questions rather than combined into one scenario','Recognize that all three findings likely reflect ONE underlying process rather than three coincidental problems'],correct:3,
   rat:'This is a synthesis-question trap — treating connected findings as separate facts to memorize misses the actual skill being tested. When a question presents multiple findings together, look for the ONE mechanism that explains all of them at once before assuming they\'re unrelated.'},

  {q:'PRACTICE — A stem asks "which order should the nurse question?" listing four medication orders. What is this question actually testing?',type:'single',
   opts:['Whether you can connect a drug to a specific disease-process contraindication making THIS order unsafe here','Whether you can simply recall the drug\'s general side effects in isolation, without any other context','Whether you happen to know the medication\'s brand name versus its generic name off the top of your head','Whether the medication in question happens to be considered expensive from a cost perspective'],correct:0,
   rat:'"Which order should you question" is never really about the drug in isolation — it\'s testing whether you can connect the medication to the PATIENT\'S specific condition (like WPW, heart block, active bleeding, or HIT) that makes this particular order unsafe.'}
],'Practice: Spot the Question Type');
</script>

document.getElementById('sec-tricks').innerHTML=`

renderFilteredQuiz('quiz-tricks',[
  {topic:'cardio',q:'All of the following are components of Virchow\'s Triad EXCEPT:',type:'single',
   opts:['A. Endothelial damage','B. Venous stasis','C. Arterial calcification','D. Hypercoagulability'],correct:2,
   rat:'EXCEPT = the odd one out. Arterial calcification is a real vascular finding but not one of the three specific Virchow\'s Triad components — endothelial damage, venous stasis, and hypercoagulability are.'},

  {topic:'cardio',q:'Which of the following is NOT an expected finding in right-sided heart failure?',type:'single',
   opts:['A. Peripheral edema','B. Jugular venous distention','C. Pulmonary crackles','D. Weight gain'],correct:2,
   rat:'NOT = the false statement. Pulmonary crackles are a LEFT-sided heart failure finding (blood backs up into the lungs), not right-sided (which backs up into the systemic venous system, causing edema, JVD, and weight gain).'},

  {topic:'cardio',q:'A client\'s blood pressure is 185/122 mmHg with no evidence of target organ damage. Which of the following is the BEST classification?',type:'single',
   opts:['A. Hypertensive emergency','B. Hypertensive urgency','C. Normal variant requiring no action','D. Orthostatic hypotension'],correct:1,
   rat:'Both emergency and urgency can share the same severe numbers — the deciding factor is target organ damage. Without it, this is urgency, treated over 24-48 hours rather than as an immediate crisis.'},

  {topic:'cardio',q:'All of the following are TRUE about arterial (PAD) findings EXCEPT:',type:'single',
   opts:['A. Pain typically worsens with leg elevation','B. Skin is cool and pale','C. Pain typically worsens with the leg in a dependent (hanging) position','D. Hair loss and brittle nails are common'],correct:2,
   rat:'EXCEPT = the false statement. Pain worsening with a DEPENDENT position is the VENOUS pattern, not arterial. Arterial pain classically worsens with elevation — the opposite direction.'},

  {topic:'cardio',q:'Which of the following is the ONLY insulin-unrelated true absolute regarding digoxin and potassium?',type:'single',
   opts:['A. Hyperkalemia specifically is what increases this client\'s overall digoxin toxicity risk in this scenario','B. Hypokalemia increases digoxin toxicity risk, since both compete for the same pump binding site','C. Potassium levels affect digoxin absorption in the GI tract rather than its action at the cellular level','D. Digoxin primarily affects sodium levels directly, with any potassium interaction being a secondary effect'],correct:1,
   rat:'A reverses the actual relationship, and C and D both deny a genuine, testable mechanism. Hypokalemia specifically increases digoxin toxicity risk due to the shared Na-K pump binding site.'},

  {topic:'cardio',q:'All of the following are TRUE about pulse pressure EXCEPT:',type:'single',
   opts:['A. Normal pulse pressure is approximately 40 mmHg','B. It is calculated as systolic minus diastolic pressure','C. A narrow pulse pressure can indicate shock','D. A narrow pulse pressure is always a normal finding'],correct:3,
   rat:'EXCEPT = the false statement. A narrow pulse pressure is NOT always normal — it can indicate shock, heart failure, or valve stenosis, among other things. A, B, and C are all accurate.'},

  {topic:'cardio',q:'Which of the following is the BEST FIRST action for a client with a sudden cold, pulseless, painful foot?',type:'single',
   opts:['A. Apply a warm compress and reassess in an hour','B. Notify the provider immediately given the limb-threatening nature of this presentation','C. Encourage ambulation to improve circulation','D. Document the finding for the next scheduled assessment'],correct:1,
   rat:'A, C, and D all delay care for a time-critical presentation — warming or walking a compromised limb could actually worsen ischemic injury. Acute arterial obstruction requires prompt provider notification.'},

  {topic:'cardio',q:'All of the following are recognized effects of beta-blockers EXCEPT:',type:'single',
   opts:['A. Decreased heart rate','B. Decreased myocardial oxygen demand','C. Increased contractility','D. Lower blood pressure'],correct:2,
   rat:'EXCEPT = the false statement. Beta-blockers DECREASE contractility, not increase it. Decreased heart rate, decreased oxygen demand, and lower BP are all correct.'},

  {topic:'cardio',q:'Which of the following is the ONLY true statement about ACE inhibitors and ARBs used together?',type:'single',
   opts:['A. Combining these two medications is recommended specifically for clients with resistant hypertension on three drugs','B. Combining them provides redundant RAAS blockade with increased hyperkalemia/renal risk without added benefit','C. Combining these two medications together mainly increases the risk of a dry, persistent cough rather than hyperkalemia','D. Combining these two medications together is required specifically for clients with diabetic nephropathy'],correct:1,
   rat:'A and D both incorrectly encourage this combination. Combining ACE inhibitors and ARBs provides redundant blockade of the same pathway, raising risk without added benefit — this is a genuine absolute to avoid.'},

  {topic:'cardio',q:'All of the following are TRUE regarding thrombolytic therapy timing in acute MI EXCEPT:',type:'single',
   opts:['A. Earlier administration generally saves more myocardial tissue','B. Delayed administration has no effect on outcomes','C. Thrombolytics dissolve the clot causing the blockage','D. Time-to-treatment is a critical factor in effectiveness'],correct:1,
   rat:'EXCEPT = the false statement. Delayed administration DOES worsen outcomes, since more tissue dies the longer flow is blocked — the opposite of "no effect." A, C, and D are all accurate.'},

  {topic:'cardio',q:'Which of the following is the BEST explanation for why ABI above 1.4 is NOT a reassuring finding?',type:'single',
   opts:['A. It indicates the blood pressure cuff was applied too loosely during the measurement, producing a falsely high reading','B. It suggests arterial calcification, which correlates with increased cardiac risk','C. It indicates unusually excellent circulation and blood flow within the affected limb overall','D. It reflects venous rather than arterial pressure, since the measurement technique captured the wrong vessel'],correct:1,
   rat:'C treats an abnormal finding as a positive one, and A and D both dismiss real clinical significance. An ABI above 1.4 indicates vessel calcification, itself a marker of increased cardiovascular risk.'},

  {topic:'cardio',q:'All of the following are appropriate for a client on warfarin EXCEPT:',type:'single',
   opts:['A. Eliminating all vitamin K-containing foods from the diet','B. Regular INR monitoring','C. Taking a missed dose as soon as remembered without doubling up','D. Reporting unusual bleeding or bruising'],correct:0,
   rat:'EXCEPT = the incorrect instruction. The goal is CONSISTENT vitamin K intake, not elimination — suddenly stopping leafy greens can swing INR unpredictably. B, C, and D are all correct warfarin management points.'},

  {topic:'repro',q:'Which of the following STIs is the ONLY one that is NOT subject to mandatory state reporting?',type:'single',
   opts:['A. Gonorrhea','B. Chlamydia','C. Herpes','D. Syphilis'],correct:2,
   rat:'This is a genuine absolute worth knowing cold. Gonorrhea, chlamydia, and syphilis are all mandatory-reportable; herpes specifically is not.'},

  {topic:'repro',q:'A client asks which medication combination is the ONLY one that poses a severe hypotension risk from this list. Which is correct?',type:'single',
   opts:['A. Metronidazole with an antihistamine','B. A PDE5 inhibitor (e.g., sildenafil) with a nitrate','C. Metformin with a statin','D. An antibiotic with a multivitamin'],correct:1,
   rat:'This is a genuine, dangerous absolute. Combining a PDE5 inhibitor with a nitrate causes profound vasodilation and severe hypotension — the other combinations listed don\'t carry this specific severe interaction.'},

  {topic:'repro',q:'All of the following are TRUE about syphilis staging EXCEPT:',type:'single',
   opts:['A. Primary syphilis presents with a painless chancre','B. Secondary syphilis can present with a body rash and flu-like symptoms','C. Latent syphilis always presents with severe pain','D. Tertiary syphilis can cause heart disease and blindness'],correct:2,
   rat:'EXCEPT = the false statement. Latent syphilis is specifically defined by the ABSENCE of symptoms, not severe pain — the opposite of what\'s stated. A, B, and D are all accurate.'},

  {topic:'repro',q:'Which of the following is the ONLY correct definition of dyspareunia?',type:'single',
   opts:['A. Absence of menstruation','B. Excessive menstrual bleeding','C. Painful intercourse','D. Painful urination'],correct:2,
   rat:'A describes amenorrhea, B describes menorrhagia, and D describes dysuria — three real but different terms. Dyspareunia specifically means painful intercourse.'},

  {topic:'repro',q:'All of the following are appropriate teaching points after a hysterectomy with oophorectomy EXCEPT:',type:'single',
   opts:['A. Expect immediate onset of menopausal symptoms','B. Report bleeding that requires changing pads more than 2-3 times per hour','C. Menopause will occur gradually over several years','D. Recovery typically involves 6-8 weeks of restricted activity'],correct:2,
   rat:'EXCEPT = the false statement. With BOTH ovaries removed, menopause is IMMEDIATE, not gradual — hormone production stops right away. A, B, and D are all correct teaching points.'},

  {topic:'repro',q:'Which of the following is the BEST teaching point regarding foreskin care to prevent phimosis-related complications?',type:'single',
   opts:['A. Leave the foreskin retracted after cleaning for better airflow','B. Return the foreskin to its original position after retracting for cleaning','C. Avoid ever retracting the foreskin at any age','D. Retraction is only necessary after puberty'],correct:1,
   rat:'A risks paraphimosis (painful constriction), and C and D both provide inaccurate hygiene guidance. Returning the foreskin to its original position after cleaning is the correct, safe practice.'},

  {topic:'repro',q:'All of the following are recognized contraindications to oral contraceptive use EXCEPT:',type:'single',
   opts:['A. History of DVT/stroke/PE','B. Current smoking','C. Well-controlled seasonal allergies','D. Liver disease'],correct:2,
   rat:'EXCEPT = the one that doesn\'t belong. Well-controlled seasonal allergies have no established contraindication link. DVT/stroke/PE history, smoking, and liver disease are all genuine contraindications.'},

  {topic:'repro',q:'Which of the following is the ONLY accurate statement about testicular cancer tumor markers?',type:'single',
   opts:['A. PSA is the primary marker used','B. AFP, hCG, and LDH are the classic tumor markers used','C. Tumor markers are never used for testicular cancer','D. CA-125 is the primary marker used'],correct:1,
   rat:'PSA and CA-125 are markers for different cancers entirely (prostate and ovarian, respectively). AFP, hCG, and LDH are the classic testicular cancer tumor markers.'},

  {topic:'repro',q:'All of the following are appropriate management strategies for menopausal symptoms EXCEPT:',type:'single',
   opts:['A. Keeping the environment cool','B. Regular weight-bearing exercise','C. Discontinuing calcium and vitamin D intake','D. Reducing caffeine and alcohol intake'],correct:2,
   rat:'EXCEPT = the harmful recommendation. Discontinuing calcium/vitamin D would actually increase osteoporosis risk, which already rises after estrogen loss — the opposite of appropriate guidance.'},

  {topic:'repro',q:'Which of the following are recognized complications of untreated or poorly managed BPH? (Select all that apply)',type:'multi',
   opts:['A. Acute urinary retention','B. Recurrent urinary tract infections from incomplete bladder emptying','C. Bladder stones','D. Improved renal function over time','E. Possible kidney damage from chronic urinary backflow'],correct:[0,1,2,4],
   rat:'Improved renal function is the opposite of what actually happens — chronic incomplete emptying and backflow can gradually harm kidney function, not improve it. Acute retention, recurrent UTIs, bladder stones, and possible kidney damage are all recognized complications of untreated or poorly managed BPH.'},

  {topic:'cardio',q:'All of the following are TRUE about DOACs compared to warfarin EXCEPT:',type:'single',
   opts:['A. DOACs generally have a more favorable safety profile','B. DOACs require routine INR monitoring, just like warfarin','C. DOACs are increasingly preferred in many clinical situations','D. Warfarin remains common in certain hospital settings'],correct:1,
   rat:'EXCEPT = the false statement. DOACs specifically do NOT require routine INR monitoring — that\'s one of their key practical advantages over warfarin. A, C, and D are all accurate.'},

  {topic:'cardio',q:'Which of the following is the ONLY correct description of preload?',type:'single',
   opts:['A. Resistance the ventricles overcome to eject blood','B. The volume of blood filling the atria/ventricles before contraction','C. The heart\'s intrinsic electrical rate','D. The force generated during ventricular contraction'],correct:1,
   rat:'A describes afterload, C describes the conduction system\'s intrinsic rate, and D describes contractility — three different, real cardiac concepts. Preload specifically refers to the filling volume before contraction.'},

  {topic:'cardio',q:'All of the following are appropriate for a client with PAD EXCEPT:',type:'single',
   opts:['A. Smoking cessation counseling','B. Supervised exercise programs','C. Application of a heating pad to cold extremities','D. Cilostazol for claudication symptoms'],correct:2,
   rat:'EXCEPT = the unsafe recommendation. A heating pad on a limb with compromised circulation and possibly reduced sensation risks an unfelt burn. A, B, and D are all appropriate PAD management strategies.'},

  {topic:'repro',q:'All of the following are TRUE about vaginal pH EXCEPT:',type:'single',
   opts:['A. It serves a protective function against infection','B. It can be disrupted by douching','C. It is completely unaffected by antibiotic use','D. It can be disrupted by certain soaps'],correct:2,
   rat:'EXCEPT = the false statement. Antibiotics CAN disrupt vaginal pH and the protective microbial balance — the opposite of "completely unaffected." A, B, and D are all accurate.'},

  {topic:'repro',q:'Which of the following is the ONLY accurate statement about ovulation timing in an average 28-day cycle?',type:'single',
   opts:['A. Ovulation occurs on the first day of menstrual bleeding','B. Ovulation occurs approximately 2 weeks before the NEXT expected period','C. Ovulation occurs immediately after the period ends','D. Ovulation timing cannot be estimated in any cycle'],correct:1,
   rat:'A and C both misplace ovulation timing relative to the cycle, and D denies a reasonably reliable estimation method. Ovulation is best estimated backward from the next expected period, about 2 weeks prior.'},

  {topic:'repro',q:'All of the following are TRUE about PDE5 inhibitors (e.g., sildenafil) EXCEPT:',type:'single',
   opts:['A. They work through a nitric oxide-based vasodilation mechanism','B. They are safe to combine with nitrates in all cases','C. They are used to treat erectile dysfunction','D. Combining them with nitrates risks severe hypotension'],correct:1,
   rat:'EXCEPT = the dangerous false statement. PDE5 inhibitors are NEVER safe to combine with nitrates — this is a genuine, serious contraindication. A, C, and D are all accurate.'},

  {topic:'repro',q:'Which of the following is the BEST explanation for why menorrhagia and amenorrhea are NOT the same condition?',type:'single',
   opts:['A. They are actually two different names for the same clinical finding, used interchangeably in most textbooks','B. Menorrhagia is excessive bleeding, while amenorrhea is absence of menstruation — opposite ends of a spectrum','C. Both of these particular terms are used to describe painful intercourse rather than any bleeding pattern','D. Both terms describe fluctuations in vaginal pH rather than any change in the menstrual bleeding pattern itself'],correct:1,
   rat:'A incorrectly equates two distinct terms, and C and D both misattribute their meaning entirely (that\'s dyspareunia, and both terms ARE menstruation-related). Menorrhagia and amenorrhea represent opposite ends of a menstrual-bleeding spectrum — excessive vs. absent.'},

  {topic:'repro',q:'All of the following are appropriate considerations regarding HRT EXCEPT:',type:'single',
   opts:['A. History of breast cancer is a recognized caution','B. History of blood clotting issues is a recognized caution','C. HRT carries zero risk for any patient regardless of history','D. Smoking history is a relevant consideration'],correct:2,
   rat:'EXCEPT = the false, oversimplified statement. HRT does carry real risks that vary by patient history — claiming zero risk for anyone ignores the individualized risk-benefit assessment that\'s actually required. A, B, and D are all genuine considerations.'}
],'Spot-the-Trap Practice');

<p class="intro-line">True Med-Surg/NCLEX difficulty — multi-clue vignettes, prioritization, and synthesis across cardiac, vascular, and reproductive content.</p>

renderFilteredQuiz('quiz-challenge',[
  {topic:'cardio',q:'A 68-year-old with a history of PAD, hypertension, and new erectile dysfunction is being evaluated. Which piece of history should the nurse recognize as MOST clinically connected to the other three findings?',type:'single',
   opts:['A. The client\'s age alone, considered independently and without connection to any of the other findings present','B. The erectile dysfunction, since smaller penile vessels often show atherosclerotic changes before coronary arteries do','C. The client\'s marital status, which has no established clinical connection to any of these findings','D. The client\'s preferred exercise routine, which similarly has no direct bearing on this particular pattern'],correct:1,
   rat:'A isolates a factor without connecting it to the actual shared mechanism, and C/D are not clinically relevant to this pattern. PAD, hypertension, and new ED are all downstream of the same atherosclerotic process — the ED specifically can be an EARLY warning sign of that shared vascular disease.'},

  {topic:'cardio',q:'A nurse is caring for four patients. Which patient should be assessed FIRST?',type:'single',
   opts:['A. A client with stable, chronic intermittent claudication managed on cilostazol','B. A client with sudden onset of a cold, pulseless, painful foot with new numbness','C. A client scheduled for a routine hysterectomy follow-up','D. A client with well-controlled hypertension due for a medication refill'],correct:1,
   rat:'A, C, and D are all stable, non-urgent situations. A sudden cold, pulseless, painful, numb foot describes acute arterial obstruction in progress (the 6 Ps) — a time-critical, limb-threatening emergency requiring immediate assessment.'},

  {topic:'cardio',q:'A client with right-sided heart failure and a client with left-sided heart failure are both being assessed. Which finding would the nurse expect ONLY in the client with LEFT-sided failure?',type:'single',
   opts:['A. Peripheral edema','B. Jugular venous distention','C. Pulmonary crackles and dyspnea','D. Weight gain'],correct:2,
   rat:'Peripheral edema, JVD, and weight gain are all RIGHT-sided findings (systemic venous backup). Pulmonary crackles and dyspnea specifically reflect blood backing up into the lungs — the LEFT-sided pattern.'},

  {topic:'cardio',q:'A client in a hypertensive emergency has a blood pressure of 210/130 mmHg. The provider orders a target reduction of the systolic pressure by approximately 25% within the first hour. Why is a MORE aggressive, faster reduction avoided?',type:'single',
   opts:['A. A faster reduction approach requires a more expensive class of IV medication not typically stocked on the floor','B. The body has adapted to the elevated pressure, and dropping it too fast risks under-perfusing major organs','C. A rapid reduction approach is preferred specifically whenever the client also has a diagnosed anxiety disorder','D. The gradual approach is chosen mainly to reduce the total volume of IV fluid the client receives overall'],correct:1,
   rat:'A is irrelevant to the clinical reasoning, and C and D both dismiss a genuine safety principle. Organs that have adapted to a high baseline pressure can be under-perfused if the pressure drops too fast — the same logic applies here as with severe hyperglycemia correction.'},

  {topic:'cardio',q:'A client taking warfarin for a DVT reports a missed dose from the previous evening. What is the BEST guidance?',type:'single',
   opts:['A. Take a double dose today to make up for the missed one','B. Take the missed dose as soon as remembered, but never double up','C. Skip the missed dose entirely and resume the regular schedule in 3 days','D. Discontinue the medication and contact the provider only if bleeding occurs'],correct:1,
   rat:'A risks dangerous over-anticoagulation, C leaves a gap in therapeutic coverage without reason, and D abandons a needed medication unnecessarily. The standard, safe guidance is to take the missed dose as soon as remembered without doubling up.'},

  {topic:'cardio',q:'A client with diabetes, hypertension, and early kidney disease is being evaluated for a new BP medication. Which class offers the MOST clinically synergistic benefit?',type:'single',
   opts:['A. Beta-blockers, for their unique renal-protective properties','B. ACE inhibitors or ARBs, offering both BP control and kidney protection','C. Thiazide diuretics exclusively, since they reverse kidney damage','D. Calcium channel blockers, which are contraindicated in this population'],correct:1,
   rat:'A invents a renal-protective property beta-blockers don\'t have, and C and D both misstate other classes\' effects. ACE inhibitors/ARBs offer the specific dual benefit of BP control plus kidney protection relevant to this exact combination of conditions.'},

  {topic:'cardio',q:'A client on a heparin infusion for DVT develops a sudden drop in platelet count from 220,000 to 90,000. Which nursing action is the PRIORITY?',type:'single',
   opts:['A. Continue the infusion at the same rate and recheck in 24 hours','B. Notify the provider promptly given the possibility of heparin-induced thrombocytopenia (HIT)','C. Increase the heparin rate to compensate','D. Administer a platelet transfusion immediately without further assessment'],correct:1,
   rat:'A delays action on a significant, sudden platelet drop, C is dangerous and backwards, and D jumps to an intervention before proper assessment/notification. A significant platelet drop during heparin therapy is the hallmark of HIT and requires prompt provider notification.'},

  {topic:'cardio',q:'A nurse assesses a lower extremity wound with irregular borders, a ruddy wound bed, and warm, discolored surrounding skin at the medial ankle. Which nursing action is MOST appropriate?',type:'single',
   opts:['A. Apply firm compression as tolerated and elevate the extremity, consistent with venous ulcer management','B. Avoid compression and instead keep the affected limb lowered below heart level throughout the day','C. Apply a heating pad directly onto the open wound itself in order to help promote overall wound healing','D. Restrict this client\'s overall fluid intake significantly as a way to help reduce the visible swelling'],correct:0,
   rat:'B, C, and D all either contradict appropriate venous ulcer care or introduce unrelated/harmful interventions. This wound pattern (irregular borders, ruddy bed, medial ankle) is classic venous, appropriately managed with compression and elevation.'},

  {topic:'cardio',q:'A client asks why her cardiologist ordered a BNP level when her chief complaint is shortness of breath and leg swelling, not chest pain. What is the BEST explanation?',type:'single',
   opts:['A. BNP is ordered mainly to rule out a pulmonary embolism given the combination of dyspnea and leg swelling','B. BNP rises with fluid retention and ventricular strain, making it useful for evaluating heart failure presenting this way','C. BNP is used exclusively to diagnose an acute MI and has no other clinical application beyond that','D. BNP is a test that primarily measures kidney function rather than any cardiac-strain-related marker'],correct:1,
   rat:'A dismisses a clinically appropriate test, and C and D both misattribute BNP\'s actual purpose. Shortness of breath and leg swelling are classic heart failure symptoms, and BNP is specifically useful for that evaluation, not just MI or cholesterol assessment.'},

  {topic:'cardio',q:'A client with a history of tachyarrhythmias and known coronary artery disease asks why their provider is concerned about episodes of rapid heart rate specifically. What is the BEST explanation?',type:'single',
   opts:['A. Rapid heart rate mainly increases the workload on the kidneys rather than affecting coronary blood flow directly','B. Coronary arteries are perfused during diastole, and a faster rate shortens diastole, reducing blood supply','C. Rapid heart rate mainly affects overall blood pressure and has little independent bearing on coronary perfusion','D. This particular concern mainly applies to patients with valve disease rather than coronary artery disease'],correct:1,
   rat:'A and C both deny the genuine physiological connection, and D reverses which patients are actually MORE at risk (those WITH CAD, not without). Coronary perfusion during diastole means tachycardia directly threatens the heart\'s own blood supply, especially with existing CAD.'},

  {topic:'repro',q:'A client asks why her provider recommends against combining her erectile dysfunction medication history (from her partner\'s perspective) with her own nitroglycerin prescription for angina. Which teaching point addresses this couple\'s situation?',type:'single',
   opts:['A. There is no interaction risk since the two medications are prescribed to two different people in the household','B. Sharing medications, or her partner taking nitrates while using a PDE5 inhibitor, still carries a severe hypotension risk','C. This particular interaction only matters if both partners happen to take both medications at the same time','D. PDE5 inhibitors and nitrates work through opposite mechanisms that would cancel each other\'s effects out'],correct:1,
   rat:'A dangerously assumes sharing medications isn\'t a real risk, and D denies the shared vasodilation mechanism entirely. The critical teaching point is that ANYONE combining these two drug classes — regardless of the relationship dynamic — faces the same severe hypotension risk.'},

  {topic:'repro',q:'A client is 3 hours post-hysterectomy with oophorectomy and reports needing to change her perineal pad every 20 minutes. Which nursing action is the PRIORITY?',type:'single',
   opts:['A. Document as an expected finding and continue routine monitoring','B. Notify the provider promptly, since this exceeds the concerning bleeding threshold','C. Reassure the client this is expected since her ovaries were removed','D. Wait until the next scheduled assessment'],correct:1,
   rat:'A, C, and D all treat a genuinely concerning finding as routine. Changing pads every 20 minutes (more than 2-3 times per hour) exceeds the specific threshold for concerning post-op bleeding, unrelated to which organs were removed.'},

  {topic:'repro',q:'A client with severe menopausal hot flashes wants to avoid hormone therapy entirely. Which non-hormonal strategies should the nurse suggest?',type:'single',
   opts:['A. Keeping the environment cool, reducing stress, avoiding caffeine/alcohol, and regular exercise','B. Increasing caffeine intake to help offset fatigue caused by night sweats','C. There are no effective non-hormonal options for managing menopausal hot flashes','D. Strict bed rest until the hot flashes resolve completely on their own'],correct:0,

let jepScore=0, jepUsed=new Set();
function renderJeopardy(){
  const host=document.getElementById('sec-jeopardy');
  let boardHtml='<div class="jep-board">';
  JEOPARDY_BOARD.categories.forEach(cat=>{ boardHtml+=`<div class="jep-cat">${cat}</div>`; });
  for(let row=0; row<5; row++){
    JEOPARDY_BOARD.categories.forEach((cat,catIdx)=>{
      const clue=JEOPARDY_BOARD.clues[catIdx][row];
      const key=catIdx+'-'+row;
      const used=jepUsed.has(key);
      boardHtml+=`<button class="jep-tile" ${used?'disabled':''} onclick="openJeopardyClue(${catIdx},${row})">${used?'':'$'+clue.value}</button>`;
    });
  }
  boardHtml+='</div>';
  host.innerHTML=`
    <h2 class="sec-title"><span class="sec-emoji">🏆</span> Jeopardy</h2>
    <p class="intro-line">Pick a category and point value, then choose your answer from the options — just like a real quiz.</p>
    <div class="jep-score">💰 Score: $${jepScore}</div>
    ${boardHtml}
    <div id="jepModalHost"></div>
    <div class="center" style="margin-top:14px"><button class="btn" style="background:var(--red)" onclick="resetJeopardy()">🔄 New Game</button></div>
  `;
}
function openJeopardyClue(catIdx,row){
  const key=catIdx+'-'+row;
  if(jepUsed.has(key))return;
  const clue=JEOPARDY_BOARD.clues[catIdx][row];
  const order=shuffleAnswers?shuffle(clue.opts.map((_,i)=>i)):clue.opts.map((_,i)=>i);
  const shuffledOpts=order.map(i=>clue.opts[i]);
  const shuffledCorrect=order.indexOf(clue.c);
  document.getElementById('jepModalHost').innerHTML=`
    <div class="jep-modal">
      <div style="font-size:.75rem;font-weight:800;color:var(--muted);text-transform:uppercase">${JEOPARDY_BOARD.categories[catIdx]} — $${clue.value}</div>
      <div class="jep-clue">${clue.clue}</div>
      <div class="opts" id="jepOpts"></div>
      <div class="rationale" id="jepRat"></div>
    </div>`;
  const optsHost=document.getElementById('jepOpts');
  shuffledOpts.forEach((opt,i)=>{
    const btn=document.createElement('button'); btn.className='opt'; btn.textContent=String.fromCharCode(65+i)+'. '+opt;
    btn.onclick=()=>jepAnswer(catIdx,row,i,shuffledCorrect);
    optsHost.appendChild(btn);
  });
}
function jepAnswer(catIdx,row,pickedIdx,correctIdx){
  const clue=JEOPARDY_BOARD.clues[catIdx][row];
  const btns=document.querySelectorAll('#jepOpts .opt');
  btns.forEach(b=>b.classList.add('disabled'));
  const gotIt = pickedIdx===correctIdx;
  if(gotIt){ btns[pickedIdx].classList.add('correct'); }
  else{ btns[pickedIdx].classList.add('wrong'); btns[correctIdx].classList.add('correct'); }
  jepScore += gotIt ? clue.value : -clue.value;
  jepUsed.add(catIdx+'-'+row);
  const ratHost=document.getElementById('jepRat');
  ratHost.innerHTML=(gotIt?'✅ <b>Correct! +$'+clue.value+'</b>':'❌ <b>Not quite. −$'+clue.value+'</b>')+'<br><b>Rationale:</b> '+clue.r;
  ratHost.classList.add('show');
  document.querySelector('.jep-score').textContent='💰 Score: $'+jepScore;
  const tileEls=document.querySelectorAll('.jep-tile');
  const tileIdx=row*5+catIdx;
  if(tileEls[tileIdx]){ tileEls[tileIdx].disabled=true; tileEls[tileIdx].textContent=''; }
}
function resetJeopardy(){ jepScore=0; jepUsed=new Set(); renderJeopardy(); }
renderJeopardy();

{"v": 2, "topic": "htn", "hot": true, "q": "A client's BP is 218/128. The client reports a severe headache and new blurred vision. What is the priority goal for the first hour of treatment?", "o": ["Return the pressure to 120/80 within the hour", "Lower diastolic pressure below 80 immediately", "Lower systolic pressure by no more than 25%", "Hold treatment until the headache resolves"], "c": 2, "t": "single", "r": "<b>Headache with new visual changes means target organ damage, so this is a hypertensive emergency.</b> His handout: reduce SBP by <b>no more than 25% in the first hour</b>, then toward normal over 24 to 48 hours. <b>Why not the others:</b> Normalizing within an hour or dropping the diastolic sharply can cause <b>stroke or cerebral ischemia</b>, because the brain has adapted to high pressure. Waiting on the headache delays treatment of an emergency. <b>His angle:</b> Slow is the safe answer even when the number is frightening."},
{"v": 2, "topic": "htn", "hot": true, "q": "Two clients have a BP of 196/122. Which finding makes one of them a hypertensive EMERGENCY rather than urgency?", "o": ["New chest pain and crackles in the lungs", "A history of hypertension for ten years", "Mild anxiety about the reading", "A heart rate of 92 beats per minute"], "c": 0, "t": "single", "r": "<b>The difference is target organ damage.</b> Chest pain with crackles points to cardiac strain and pulmonary edema, which makes it an emergency. Urgency is the same pressure <b>without</b> organ damage. <b>Why not the others:</b> A long history, a heart rate of 92, and anxiety do not indicate organ damage. <b>His angle:</b> The number alone never decides emergency vs urgency; assess the brain, heart, kidneys, and eyes."},
{"v": 2, "topic": "htn", "hot": true, "q": "A client with hypertensive urgency asks how quickly the pressure will be brought down. What is the best response?", "o": ["Down to normal within 1 hour", "Gradually, over 24 to 48 hours", "Only after it causes symptoms", "Within the next 15 minutes"], "c": 1, "t": "single", "r": "<b>His handout: urgency has no target organ effects, and the pressure is controlled within 24 to 48 hours</b>, usually with oral medication. <b>Why not the others:</b> Rapid lowering risks hypoperfusion of the brain, heart, and kidneys. Waiting for symptoms means waiting for organ damage. <b>His angle:</b> Urgency is gradual; emergency is controlled but still limited to a 25% drop in the first hour."},
{"v": 2, "topic": "htn", "hot": true, "q": "A nurse is teaching home blood pressure monitoring. Which client statement needs correction?", "o": ["I take two readings about a minute apart", "I check it right after my morning coffee", "I keep my feet flat and my arm supported", "I sit quietly for 5 minutes before I start"], "c": 1, "t": "single", "r": "<b>No caffeine or smoking for 30 minutes before a reading</b>, because both temporarily raise the pressure. <b>Why not the others:</b> Resting 5 minutes, feet flat with arm supported, and two readings 1 minute apart are all on his infographic. <b>His angle:</b> Also measure before eating, medications, or exercise, and not when stressed or in pain."},
{"v": 2, "topic": "htn", "hot": false, "q": "A nurse uses a cuff that is too small for a client's arm. How will this affect the reading?", "o": ["It will read low only in the diastolic", "It will read falsely high", "It will read falsely low", "It will not change the reading"], "c": 1, "t": "single", "r": "<b>A cuff that is too small needs extra pressure to compress the artery, so it reads falsely high.</b> Too large reads falsely low. <b>Why not the others:</b> Cuff size always affects the reading, and the error affects both systolic and diastolic. <b>His angle:</b> Small cuff, big number. Big cuff, small number."},
{"v": 2, "topic": "htn", "hot": false, "q": "Which home blood pressure device should the nurse recommend?", "o": ["A finger monitor for accuracy", "Any device from the pharmacy", "A validated upper-arm cuff", "A wrist cuff for convenience"], "c": 2, "t": "single", "r": "<b>His infographic: use only an upper-arm, validated machine. Finger and wrist devices are not recommended.</b> <b>Why not the others:</b> Wrist and finger monitors are less accurate, and an unvalidated device may be off. <b>His angle:</b> Pair the device with technique: cuff at heart level, arm bare, correct size."},
{"v": 2, "topic": "htn", "hot": false, "q": "How should home readings be scheduled to give the provider an accurate picture?", "o": ["Once, whenever symptoms appear", "Morning and evening for at least 4 days", "Only right after taking medications", "Every hour for one full day"], "c": 1, "t": "single", "r": "<b>At least 4 days in a row, morning and evening, at about the same time, with two readings 1 minute apart.</b> A pattern diagnoses; one reading is a snapshot. <b>Why not the others:</b> Symptom-triggered readings miss silent hypertension. Hourly readings for one day do not show a pattern across days. Readings right after medication skew low. <b>His angle:</b> Consistency of timing is the point."},
{"v": 2, "topic": "htn", "hot": true, "q": "A nurse checks orthostatic vital signs. Lying: 138/82, HR 78. Standing at 2 minutes: 112/70, HR 104. How should this be interpreted?", "o": ["Positive orthostatic hypotension", "A normal response to standing", "Positive only if symptoms occur", "Inconclusive until 10 minutes pass"], "c": 0, "t": "single", "r": "<b>His handout: a drop of 20 or more systolic or 10 or more diastolic within 3 minutes of standing is orthostatic hypotension.</b> Here the systolic fell 26 and the heart rate rose to compensate. <b>Why not the others:</b> A 26-point drop is not normal. The definition is numeric, not symptom-dependent. The window is 3 minutes, not 10. <b>His angle:</b> Order is lying, sitting, standing, and stay with the client."},
{"v": 2, "topic": "htn", "hot": false, "q": "During orthostatic checks the client becomes dizzy and pale after standing. What should the nurse do first?", "o": ["Document it and recheck in an hour", "Ask the client to walk to steady themselves", "Finish the standing measurement quickly", "Help the client sit or lie back down"], "c": 3, "t": "single", "r": "<b>Safety first.</b> Return the client to sitting or lying to prevent a fall, then complete the assessment. <b>Why not the others:</b> Finishing the reading or walking risks a fall. Documenting and waiting leaves a symptomatic client standing. <b>His angle:</b> The data is never worth a fall."},
{"v": 2, "topic": "htn", "hot": false, "q": "Which finding most suggests secondary rather than primary hypertension?", "o": ["Gradual rise in BP over several years", "Hypertension in a 60-year-old smoker", "Sudden severe hypertension at age 24", "BP controlled with one medication"], "c": 2, "t": "single", "r": "<b>Secondary hypertension has an identifiable cause</b>, and clues include sudden onset, a very young client, very high readings, or resistance to multiple drugs. Kidney disease and endocrine disorders are common causes. <b>Why not the others:</b> A gradual rise, older age with risk factors, and good control on one drug all fit primary hypertension. <b>His angle:</b> Secondary hypertension can resolve when the cause is treated."},
{"v": 2, "topic": "htn", "hot": false, "q": "Per his handout, which weekly amount matches the lower-risk drinking guideline?", "o": ["7 units, such as 7 shots of spirits", "14 units, such as 6 glasses of wine", "28 units, such as 12 glasses of wine", "21 units, such as 10 pints of beer"], "c": 1, "t": "single", "r": "<b>His infographic: 14 units a week</b>, which is about 6 pints of 4% beer, 6 glasses of 13% wine, or 14 single shots of spirits. <b>Why not the others:</b> The other amounts do not match the guideline shown. <b>His angle:</b> Heavy drinking raises BP and blunts antihypertensive drugs."},
{"v": 2, "topic": "acs", "hot": true, "q": "A client arrives with chest pain. Which action should happen within 10 minutes of arrival?", "o": ["A 12-lead ECG", "A cardiac catheterization", "A stress test", "A lipid panel"], "c": 0, "t": "single", "r": "<b>A 12-lead ECG within 10 minutes</b> identifies a STEMI that needs immediate reperfusion. <b>Why not the others:</b> A lipid panel is on his diagnostic list but guides long-term risk, not the emergency. Catheterization follows the ECG and troponin. A stress test is never done during active chest pain. <b>His angle:</b> His diagnostics for ACS: troponin I, CK-MB, lipid panel, 12-lead ECG."},
{"v": 2, "topic": "acs", "hot": true, "q": "A client with 2 hours of chest pain has a normal first troponin. What does the nurse anticipate?", "o": ["Repeating the troponin in a few hours", "Stopping all cardiac monitoring", "Discharge since MI is ruled out", "A lipid panel to confirm the MI"], "c": 0, "t": "single", "r": "<b>Troponin takes hours to rise</b>, so a normal early value does not rule out MI. It is drawn <b>serially</b>. <b>Why not the others:</b> Discharging or stopping monitoring after one normal value misses evolving MIs. A lipid panel does not diagnose an MI. <b>His angle:</b> Troponin I is the most specific marker of heart muscle damage."},
{"v": 2, "topic": "acs", "hot": false, "q": "Which statement reflects his goals for a client recovering from ACS?", "o": ["Avoid all physical activity for the rest of life", "Prevent another MI with medications and lifestyle change", "Stop medications once the chest pain is gone", "Rely on nitroglycerin alone to prevent another event"], "c": 1, "t": "single", "r": "<b>His handout: goals are to prevent future MI and improve heart health through medications and lifestyle changes.</b> That includes antiplatelets, statins, beta blockers, ACE inhibitors, smoking cessation, diet, and cardiac rehab. <b>Why not the others:</b> Complete inactivity is harmful; supervised activity is part of recovery. Nitroglycerin treats angina but does not prevent MI. Stopping meds when pain is gone raises the risk of another event. <b>His angle:</b> Prevention is the long game after ACS."},
{"v": 2, "topic": "vascular", "hot": true, "q": "A client has leg cramping when walking a block that goes away with rest. Pedal pulses are weak and the skin is cool and hairless. Which position helps this client's pain?", "o": ["Legs flat with compression wraps", "Legs crossed while seated", "Legs elevated above heart level", "Legs dangling below heart level"], "c": 3, "t": "single", "r": "<b>This is PAD: claudication, weak pulses, cool hairless skin.</b> Dangling uses gravity to help arterial blood reach the feet. <b>Why not the others:</b> Elevation reduces arterial flow and worsens pain and pallor. Compression squeezes already-poor inflow. Crossing the legs compresses vessels. <b>His angle:</b> Arterial, dangle. Venous, elevate."},
{"v": 2, "topic": "vascular", "hot": true, "q": "A client's legs are warm, brown, swollen, and itchy, with a dull ache after standing all day. Which intervention is appropriate?", "o": ["Dangle the legs to improve blood flow", "Avoid walking to reduce swelling", "Apply heat to the calves overnight", "Elevate the legs and use compression stockings"], "c": 3, "t": "single", "r": "<b>This is venous disease: WIPED (warm and brown, itching, prolonged standing pain, edema, dull ache).</b> Elevation and compression help blood return to the heart. <b>Why not the others:</b> Dangling worsens pooling. Walking helps, because the calf muscle pump pushes blood upward. Heat increases swelling. <b>His angle:</b> Venous, elevate. Arterial, dangle."},
{"v": 2, "topic": "vascular", "hot": true, "q": "A nurse notes a small, round ulcer on a client's toe with defined, punched-out edges and a pale base. What does this suggest?", "o": ["Arterial ulcer", "Pressure injury", "Venous ulcer", "Diabetic blister"], "c": 0, "t": "single", "r": "<b>Punched-out, round, well-defined edges on the toes or feet point to an arterial ulcer</b> from inadequate blood flow. They are typically very painful. <b>Why not the others:</b> Venous ulcers have irregular edges, drainage, a pink bed, and brown skin around them, usually at the inner ankle. A pressure injury forms over a bony prominence from pressure. A blister is not described. <b>His angle:</b> His NCLEX hack contrasts the two ulcers side by side."},
{"v": 2, "topic": "vascular", "hot": true, "q": "A client's ankle-brachial index is 0.6. How should the nurse interpret this?", "o": ["It rules out circulation problems", "It indicates venous insufficiency", "It indicates peripheral arterial disease", "It is within the normal range"], "c": 2, "t": "single", "r": "<b>Normal ABI is 1 to 1.4 per his handout.</b> A value under 0.9 means the ankle pressure is lower than the arm, which indicates arterial narrowing. 0.6 is significant PAD. <b>Why not the others:</b> 0.6 is well below normal. ABI measures arterial pressure, not venous function. A low ABI indicates a problem rather than ruling one out. <b>His angle:</b> ABI is ankle systolic divided by arm systolic."},
{"v": 2, "topic": "vascular", "hot": false, "q": "A client with PAD asks whether walking will make things worse because it hurts. What should the nurse say?", "o": ["Walk until it hurts, rest, then walk again", "Avoid walking until the pain stops", "Walk only with compression stockings", "Walking will damage the leg arteries"], "c": 0, "t": "single", "r": "<b>A supervised walking program builds collateral circulation</b> and improves how far the client can walk. Walk to the point of pain, rest until it eases, and repeat. <b>Why not the others:</b> Avoiding walking worsens the disease. Compression can worsen arterial flow. Walking does not damage the arteries. <b>His angle:</b> His goals for PAD: improve mobilization and circulation."},
