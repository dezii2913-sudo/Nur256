{"v": 2, "topic": "vascular", "hot": false, "q": "A client with PAD is prescribed cilostazol. What is it used for?", "o": ["Reversing an elevated INR", "Dissolving clots in the deep veins", "Reducing claudication so walking improves", "Replacing lost vitamin K"], "c": 2, "t": "single", "r": "<b>Cilostazol reduces intermittent claudication</b> by improving blood flow, so the client can walk farther. It is on his handout under PAD medications. <b>Why not the others:</b> Clot dissolution is thrombolytic therapy. Vitamin K reverses warfarin. None describe cilostazol. <b>His angle:</b> Cilostazol is contraindicated in heart failure."},
{"v": 2, "topic": "vascular", "hot": true, "q": "Which statement by a client on warfarin needs correction?", "o": ["If I miss a dose I take it later that same day", "I will get my INR checked as scheduled", "I will keep my greens about the same each week", "I stopped eating spinach and salads"], "c": 3, "t": "single", "r": "<b>The teaching is to keep vitamin K intake CONSISTENT, not to avoid it.</b> A sudden change shifts the INR. <b>Why not the others:</b> Consistent greens, taking a missed dose as soon as possible the same day, and scheduled INR checks are all correct. <b>His angle:</b> His handout: consistent leafy greens, INR 2 to 3, never double up."},
{"v": 2, "topic": "vascular", "hot": true, "q": "A client on warfarin forgot yesterday's dose and remembers it the next morning. What should the nurse teach?", "o": ["Take today's dose only; do not double up", "Take an extra dose at bedtime tonight", "Take both doses now to catch up", "Skip warfarin for the next two days"], "c": 0, "t": "single", "r": "<b>Never double up.</b> A missed dose is taken as soon as possible <b>the same day</b>; once the next day arrives, skip it and continue the schedule. <b>Why not the others:</b> Doubling or adding extra doses raises bleeding risk. Skipping two days lowers the INR. <b>His angle:</b> His handout: take missed dose as soon as possible, do not double up."},
{"v": 2, "topic": "vascular", "hot": true, "q": "A client on a heparin infusion has a platelet count that dropped from 240,000 to 96,000. What should the nurse suspect?", "o": ["Heparin-induced thrombocytopenia", "A therapeutic heparin response", "An expected lab variation", "Vitamin K deficiency"], "c": 0, "t": "single", "r": "<b>A drop of about 50% in platelets on heparin suggests heparin-induced thrombocytopenia (HIT).</b> Stop heparin and notify the provider; a direct thrombin inhibitor such as <b>argatroban</b> is often used instead. <b>Why not the others:</b> Heparin is monitored by aPTT, not platelets, for effect. Vitamin K relates to warfarin. A 50% drop is not normal variation. <b>His angle:</b> His handout: monitor weight, aPTT, platelets, and signs of bleeding on heparin."},
{"v": 2, "topic": "vascular", "hot": false, "q": "Which lab is used to monitor warfarin therapy, and what is the goal?", "o": ["aPTT, 2 to 3", "INR, 2 to 3", "D-dimer, 2 to 3", "Platelets, 2 to 3"], "c": 1, "t": "single", "r": "<b>Warfarin is monitored by INR, usual goal 2 to 3</b> per his handout. <b>Why not the others:</b> aPTT monitors heparin. Platelets are watched on heparin for HIT. D-dimer helps screen for a clot but does not guide warfarin dosing. <b>His angle:</b> Heparin, aPTT. Warfarin, PT/INR."},
{"v": 2, "topic": "vascular", "hot": true, "q": "Which are part of Virchow's triad? Select all that apply.", "o": ["Abnormal blood flow", "Increased cardiac output", "Hypercoagulability", "Elevated HDL", "Endothelial damage", "Low platelet count"], "c": [0, 2, 4], "t": "multi", "r": "<b>Virchow's triad: endothelial (vessel wall) damage, abnormal flow or stasis, and hypercoagulability.</b> Surgery, immobility, cancer, pregnancy, estrogen, and smoking fit into these. <b>Why not the others:</b> High HDL is protective. Low platelets reduce clotting. Higher cardiac output does not cause stasis. <b>His angle:</b> Name the triad, then place a risk factor into it."},
{"v": 2, "topic": "vascular", "hot": true, "q": "A client with a suspected DVT asks the nurse to rub the sore calf. What is the best response?", "o": ["Rubbing helps break up the clot so it heals faster", "Only rub it if the swelling increases", "I will rub it gently with warm lotion to ease it", "Rubbing could loosen the clot; I will elevate it"], "c": 3, "t": "single", "r": "<b>Never massage a suspected DVT.</b> It can dislodge the clot and cause a pulmonary embolism. Elevation, compression as ordered, and pain relief are the supportive measures on his handout. <b>Why not the others:</b> Rubbing, even gently or conditionally, risks embolism. <b>His angle:</b> Sudden dyspnea, chest pain, and tachycardia in a DVT client is a PE until proven otherwise."},
{"v": 2, "topic": "vascular", "hot": false, "q": "Which diagnostic on his list is a clot breakdown product that helps rule out DVT when normal?", "o": ["Factor V Leiden", "D-dimer", "CRP", "Lipid panel"], "c": 1, "t": "single", "r": "<b>D-dimer rises when a clot is being broken down.</b> A normal D-dimer makes DVT unlikely; an elevated one means further testing, usually duplex ultrasound. <b>Why not the others:</b> Factor V Leiden is an inherited clotting disorder test. CRP measures inflammation. A lipid panel measures cholesterol. <b>His angle:</b> His DVT diagnostics: CBC, PT, aPTT, INR, CRP, factor V Leiden, D-dimer."},
{"v": 2, "topic": "vascular", "hot": false, "q": "A client with heparin-induced thrombocytopenia needs anticoagulation. Which drug does the nurse anticipate?", "o": ["Enoxaparin", "Vitamin K", "Heparin at a lower dose", "Argatroban"], "c": 3, "t": "single", "r": "<b>Argatroban is a direct thrombin inhibitor used when heparin cannot be</b>, as in HIT. <b>Why not the others:</b> Any heparin product, including lower doses and enoxaparin, is avoided in HIT. Vitamin K reverses warfarin and is not an anticoagulant. <b>His angle:</b> His handout lists indirect (heparin) and direct (argatroban) thrombin inhibitors and factor Xa inhibitors (apixaban)."},
{"v": 2, "topic": "vascular", "hot": false, "q": "A client asks how apixaban differs from warfarin. Which answer is accurate?", "o": ["It does not need routine INR checks", "It is given only by IV infusion", "It requires a strict low-greens diet", "It is reversed with vitamin K"], "c": 0, "t": "single", "r": "<b>Apixaban is an oral factor Xa inhibitor with fixed dosing and no routine INR monitoring.</b> Bleeding and kidney function are still watched. <b>Why not the others:</b> Vitamin K reverses warfarin. Apixaban is oral. Diet does not change its effect the way it does warfarin. <b>His angle:</b> Know which lab goes with which drug."},
{"v": 2, "topic": "htn", "hot": true, "q": "Using ACC/AHA guidelines, how is a BP of 128/84 classified?", "o": ["Normal", "Stage 2 hypertension", "Stage 1 hypertension", "Elevated"], "c": 2, "t": "single", "r": "<b>Stage 1 is 130 to 139 systolic OR 80 to 89 diastolic.</b> The diastolic of 84 meets stage 1 even though the systolic is only in the elevated range. The worse number decides. <b>Why not the others:</b> Elevated requires a diastolic <b>under 80</b>. Normal requires under 120 and under 80. Stage 2 starts at 140 or 90. <b>His angle:</b> Normal and Elevated use AND; Stage 1 and 2 use OR."},
{"v": 2, "topic": "htn", "hot": true, "q": "Using ACC/AHA guidelines, how is a BP of 124/76 classified?", "o": ["Normal", "Elevated", "Stage 1 hypertension", "Stage 2 hypertension"], "c": 1, "t": "single", "r": "<b>Elevated is 120 to 129 systolic AND under 80 diastolic.</b> Both conditions are met. <b>Why not the others:</b> Normal needs a systolic under 120. Stage 1 needs 130 or higher systolic or 80 or higher diastolic. Stage 2 needs 140 or 90. <b>His angle:</b> Elevated is not hypertension yet, but it is the warning zone for lifestyle change."},
{"v": 2, "topic": "htn", "hot": true, "q": "Using ACC/AHA guidelines, how is a BP of 136/92 classified?", "o": ["Stage 2 hypertension", "Stage 1 hypertension", "Elevated", "Hypertensive crisis"], "c": 0, "t": "single", "r": "<b>Stage 2 is 140 or higher systolic OR 90 or higher diastolic.</b> The diastolic of 92 puts it in stage 2 even though the systolic alone would be stage 1. <b>Why not the others:</b> Classifying by the systolic alone gives stage 1, which is the trap. Crisis is over 180 and/or over 120. <b>His angle:</b> Always check both numbers and let the higher category win."},
{"v": 2, "topic": "htn", "hot": true, "q": "According to ACC/AHA, which systolic pressure is consistent with a diagnosis of hypertension?", "o": ["130 mm Hg or higher", "140 mm Hg or higher", "120 mm Hg or higher", "150 mm Hg or higher"], "c": 0, "t": "single", "r": "<b>ACC/AHA defines hypertension as SBP 130 or higher or DBP 80 or higher.</b> <b>Why not the others:</b> 120 to 129 is elevated. 140 is the threshold used by ESC/ESH and ISH, not ACC/AHA. 150 is not a threshold in any of the guidelines shown. <b>His angle:</b> This is the Ch 28 slide question word for word."},
{"v": 2, "topic": "htn", "hot": true, "q": "A client's BP is 164/104 on two readings during one clinic visit, with no prior history. What does the nurse understand about diagnosis?", "o": ["One reading over 160 alone confirms it", "It cannot be diagnosed without home readings", "It needs readings on two more occasions", "These two readings are enough to confirm it"], "c": 3, "t": "single", "r": "<b>The Ch 28 exception: a BP of 160/100 or higher confirmed by two readings on one occasion is enough to diagnose.</b> Otherwise the rule is the average of at least two readings on at least two occasions. <b>Why not the others:</b> Two more occasions are only needed below 160/100. Home monitoring helps confirm but is not required here. One reading alone is never enough. <b>His angle:</b> Know both the rule and the exception."},
{"v": 2, "topic": "htn", "hot": true, "q": "A client with chronic stress asks how stress raises blood pressure. Which explanation is accurate?", "o": ["Nonstop SNS activity tightens vessels and speeds the heart", "Stress makes the heart pump less, which raises vessel resistance", "Stress lowers blood sodium so the kidneys hold on to more water", "Stress lowers aldosterone, which raises blood volume"], "c": 0, "t": "single", "r": "<b>Chronic stress keeps the sympathetic nervous system switched on.</b> Epinephrine and norepinephrine raise heart rate and contractility and constrict arterioles, so both cardiac output and resistance stay high. <b>Why not the others:</b> Stress does not lower sodium or aldosterone; RAAS activation raises aldosterone. Stress increases, not decreases, the heart's output. <b>His angle:</b> BP = cardiac output × resistance. SNS raises both."},
{"v": 2, "topic": "htn", "hot": true, "q": "What does angiotensin II do that raises blood pressure?", "o": ["Dilates vessels and releases renin", "Blocks aldosterone so potassium is kept in the blood", "Constricts vessels, triggers aldosterone", "Breaks down bradykinin in the lungs"], "c": 2, "t": "single", "r": "<b>Angiotensin II is a powerful vasoconstrictor and stimulates aldosterone release.</b> Aldosterone tells the kidneys to hold sodium and water, so volume rises. Tighter vessels plus more volume means higher pressure. <b>Why not the others:</b> Renin comes before angiotensin II, from the kidney. Aldosterone is increased, not blocked. Breaking down bradykinin is a job of ACE, not angiotensin II. <b>His angle:</b> Angiotensin II tells the kidneys to hold fluid through aldosterone."},
{"v": 2, "topic": "htn", "hot": true, "q": "How does an ACE inhibitor lower blood pressure?", "o": ["It makes the kidneys waste potassium and water", "It stops angiotensin I from becoming angiotensin II", "It blocks angiotensin II from binding its receptor", "It keeps calcium out of vessel smooth muscle"], "c": 1, "t": "single", "r": "<b>ACE inhibitors block the angiotensin-converting enzyme</b>, so angiotensin II is not made. Vessels relax and aldosterone falls, so the kidneys release sodium and water. <b>Why not the others:</b> Blocking the receptor is how <b>ARBs</b> work. ACE inhibitors cause potassium to be <b>kept</b>, not wasted. Blocking calcium entry is how calcium channel blockers work. <b>His angle:</b> ACE stops it being made; ARB stops it working."},
{"v": 2, "topic": "htn", "hot": true, "q": "A client on lisinopril has a persistent dry cough. Which switch does the nurse anticipate, and why?", "o": ["A thiazide, because ACE drugs dry the airway", "An ARB, since bradykinin won't build up", "A higher ACE dose, because the cough fades", "A beta blocker, because it prevents the cough reflex"], "c": 1, "t": "single", "r": "<b>ACE inhibitors block the breakdown of bradykinin</b>, which builds up and causes the dry cough. <b>ARBs block the angiotensin II receptor instead</b>, so bradykinin is not affected and the cough resolves. <b>Why not the others:</b> A higher ACE dose worsens it. A thiazide works a different way, and the cough is not from airway drying. Beta blockers do not prevent the cough. <b>His angle:</b> Swelling of the lips, tongue, or throat on an ACE inhibitor is angioedema, an airway emergency."},
{"v": 2, "topic": "htn", "hot": false, "q": "Which lab value should the nurse monitor closely in a client started on an ACE inhibitor?", "o": ["Potassium", "Glucose", "Calcium", "Sodium"], "c": 0, "t": "single", "r": "<b>ACE inhibitors and ARBs lower aldosterone, and aldosterone normally makes the kidneys excrete potassium.</b> With less aldosterone, potassium builds up, so watch for <b>hyperkalemia</b> and kidney function. <b>Why not the others:</b> Sodium, calcium, and glucose are not the expected problem. <b>His angle:</b> Avoid potassium supplements and salt substitutes unless ordered."},
{"v": 2, "topic": "htn", "hot": true, "q": "A client has had hypertension for years. Which findings suggest target organ damage? Select all that apply.", "o": ["Retinal hemorrhages", "Clear breath sounds", "New onset angina", "Decreased urine output", "Rising BUN and creatinine", "Headache and dizziness"], "c": [0, 2, 3, 4, 5], "t": "multi", "r": "<b>His target organs: kidneys, heart, brain, and eyes.</b> Rising BUN and creatinine and low urine output are kidney damage, angina is heart, headache and dizziness are brain, and retinal hemorrhages are retinopathy. <b>Why not the others:</b> Clear breath sounds are a normal finding. <b>His angle:</b> Hypertension is silent until it damages an organ, so these are the signs you look for."},
{"v": 2, "topic": "htn", "hot": false, "q": "Which eye findings reflect hypertensive retinopathy?", "o": ["Loss of central vision with drusen", "Cloudy lens with glare around bright lights", "A painless curtain across the vision", "Hemorrhages and cotton-wool spots"], "c": 3, "t": "single", "r": "<b>Ch 28: retinal hemorrhages, exudates, arteriolar narrowing, and cotton-wool spots, with papilledema in severe hypertension.</b> <b>Why not the others:</b> A cloudy lens is a cataract. Drusen with central loss is macular degeneration. A curtain is retinal detachment. <b>His angle:</b> The eyes are the one place you can see vessel damage directly."},
{"v": 2, "topic": "htn", "hot": true, "q": "Which set of tests does Ch 28 list for assessing target organ damage in hypertension?", "o": ["Troponin, CK-MB, and a chest x-ray only", "D-dimer, PT, aPTT, and a platelet count", "UA, chemistry panel, 12-lead ECG, echo", "Arterial blood gas and sputum culture"], "c": 2, "t": "single", "r": "<b>Urinalysis</b> (protein and blood for kidney damage), <b>blood chemistry</b> (BUN, creatinine, electrolytes, glucose, lipids), <b>12-lead ECG</b> (LVH, ischemia), and <b>echocardiography</b> (wall thickness and function). <b>Why not the others:</b> Troponin and CK-MB diagnose MI. D-dimer and clotting studies relate to thrombosis. ABGs and sputum are respiratory tests. <b>His angle:</b> These tests look for damage to the kidneys and heart."},
{"v": 2, "topic": "htn", "hot": false, "q": "A client's BNP is elevated. What does this indicate?", "o": ["The liver is producing less albumin", "The kidneys are losing far too much sodium", "The coronary arteries are fully blocked", "The ventricles are stretched by volume"], "c": 3, "t": "single", "r": "<b>BNP is released by the ventricles when they are stretched by too much volume and pressure.</b> It rises with fluid overload and heart failure. <b>Why not the others:</b> It does not measure sodium loss, liver function, or coronary blockage. Elevated troponin, not BNP, points to muscle damage. <b>His angle:</b> BNP tells you how much strain the fluid load is putting on the heart."},
{"v": 2, "topic": "htn", "hot": true, "q": "What is the ACC/AHA blood pressure goal for a 78-year-old client with hypertension?", "o": ["Under 150/90", "Under 140/90", "Under 160/100", "Under 130/80"], "c": 3, "t": "single", "r": "<b>The goal is under 130/80 for all adults, including older adults.</b> The purpose is preventing complications and death. <b>Why not the others:</b> The other targets come from older or different guidelines. <b>His angle:</b> What changes for older adults is the approach: start low, go slow, simplify, and watch for falls and orthostatic hypotension."},
{"v": 2, "topic": "htn", "hot": false, "q": "Which approach to medications is recommended for an older adult with hypertension?", "o": ["Start low, go slow, and use one drug if possible", "Increase the dose weekly regardless of symptoms", "Avoid treatment because of fall risk", "Start with three drugs at full doses"], "c": 0, "t": "single", "r": "<b>Ch 28: start low and go slow, simplify to a single antihypertensive if possible, and check for interactions.</b> Monitor for falls, orthostatic hypotension, and acute kidney injury. <b>Why not the others:</b> Multiple drugs at full doses cause hypotension and falls. Increasing without regard to response is unsafe. Leaving hypertension untreated raises stroke and MI risk. <b>His angle:</b> Complexity and cost are the main adherence problems."},
{"v": 2, "topic": "htn", "hot": true, "q": "Which lifestyle teaching lowers blood pressure most in line with Ch 28?", "o": ["Increase potassium even with kidney disease", "Replace exercise with extra sleep", "Eat a high-sodium, high-protein diet daily", "Lose weight and follow a DASH diet"], "c": 3, "t": "single", "r": "<b>Weight loss, a DASH or Mediterranean diet, exercise, limiting alcohol, and stopping smoking.</b> DASH is low sodium and high potassium, with sodium under 2,300 mg and 1,500 mg lowering BP further. <b>Why not the others:</b> High sodium raises BP. High potassium is <b>avoided in chronic kidney disease</b>. Sleep does not replace exercise. <b>His angle:</b> Lifestyle is part of treatment at every stage."},
{"v": 2, "topic": "htn", "hot": true, "q": "A client with stage 2 hypertension is starting medication. Which class is first-line?", "o": ["A thiazide diuretic", "A loop diuretic", "A potassium supplement", "An anticoagulant"], "c": 0, "t": "single", "r": "<b>First-line antihypertensives are thiazide diuretics, ACE inhibitors, ARBs, and calcium channel blockers.</b> Thiazides lower volume by making the kidneys excrete sodium and water. <b>Why not the others:</b> Loop diuretics are for fluid overload, not first-line hypertension. Potassium supplements and anticoagulants do not treat hypertension. <b>His angle:</b> For Black clients, thiazides or calcium channel blockers are preferred."},
{"v": 2, "topic": "htn", "hot": true, "q": "A client has BP 210/130, new confusion, and a severe headache. What is the goal for the first hour?", "o": ["Lower it to 120/80 as fast as possible", "Lower systolic by no more than 25%", "Wait for labs before lowering it", "Lower systolic below 140 for every client"], "c": 1, "t": "single", "r": "<b>Confusion and headache mean target organ damage, so this is an emergency.</b> Lower the SBP by no more than 25% in the first hour, then to about 160/100 in 2 to 6 hours, and normal over 24 to 48 hours. <b>Why not the others:</b> Rapid normalization causes stroke. The under-140 target applies only to aortic dissection, severe preeclampsia, or pheochromocytoma crisis. Waiting delays emergency treatment. <b>His angle:</b> Emergency drugs are IV with immediate onset, such as nicardipine or labetalol."},
{"v": 2, "topic": "htn", "hot": true, "q": "A client with BP 196/118 feels well, has normal labs, and admits stopping medications a week ago. How is this classified and managed?", "o": ["Emergency; admit to the ICU for IV medication", "Urgency; restart oral meds over 24 to 48 hours", "Stage 2; recheck at the next yearly visit", "Crisis; lower it to normal within one hour"], "c": 1, "t": "single", "r": "<b>Severe elevation without target organ damage is hypertensive urgency</b>, often caused by nonadherence. Restart or increase oral medication, control over 24 to 48 hours, and find out why they stopped. <b>Why not the others:</b> Without organ damage it is not an emergency. Waiting a year ignores a crisis-level reading. Lowering to normal in an hour is unsafe. <b>His angle:</b> Ask about cost, side effects, and misunderstanding."},
{"v": 2, "topic": "htn", "hot": true, "q": "Which description matches diastolic heart failure?", "o": ["A leaking mitral valve with backflow", "A blocked coronary artery with ST elevation", "Stiff, thick walls that cannot fill properly", "Thin, stretched walls that cannot pump"], "c": 2, "t": "single", "r": "<b>Diastolic heart failure: the walls are stiff and thick, so the heart can't relax and fill.</b> Long-standing hypertension with left ventricular hypertrophy is the classic cause. Ejection fraction is preserved. <b>Why not the others:</b> Thin, stretched walls that can't pump is <b>systolic</b> failure, the more lethal type. A leaking valve and ST elevation describe other conditions. <b>His angle:</b> DIAstolic can't fill; SYStolic can't squeeze."},
{"v": 2, "topic": "htn", "hot": false, "q": "Why is systolic heart failure considered more dangerous?", "o": ["The heart rate always drops below 50", "The stretched heart can no longer pump", "The thick walls simply fill a little slower", "It only affects the right side of the heart"], "c": 1, "t": "single", "r": "<b>In systolic failure the chambers are stretched and thin, the stretch is gone, and the heart can't pump.</b> Ejection fraction falls and output to the body drops. <b>Why not the others:</b> Slower filling with thick walls is diastolic failure. Heart rate and side are not what define it. <b>His angle:</b> Hypertension causes LVH first; years later the ventricle can dilate and fail to pump."},
{"v": 2, "topic": "htn", "hot": true, "q": "While taking a manual BP, what does the first clear tapping sound represent?", "o": ["Pulse pressure", "Diastolic pressure", "Mean arterial pressure", "Systolic pressure"], "c": 3, "t": "single", "r": "<b>The first Korotkoff sound is systolic.</b> Cuff pressure has just dropped below the pressure of the heart's squeeze, so blood spurts through the partly open artery. <b>Why not the others:</b> The point where sounds <b>disappear</b> is diastolic. Mean arterial pressure and pulse pressure are calculated, not heard. <b>His angle:</b> Systolic is the squeeze; diastolic is the rest."},
{"v": 2, "topic": "htn", "hot": false, "q": "Why does a nurse palpate the pulse while inflating the cuff before listening?", "o": ["To check that the cuff is the right size", "To estimate the systolic first", "To count the heart rate for the chart before listening", "To warm the arm before auscultation"], "c": 1, "t": "single", "r": "<b>Palpating until the pulse disappears estimates systolic</b>, so the cuff is inflated 20 to 30 mm Hg above it. This prevents missing the true systolic, especially with an auscultatory gap. <b>Why not the others:</b> Counting rate, checking cuff size, and warming the arm are not the reason. <b>His angle:</b> Deflate slowly, about 2 to 3 mm Hg per second."},
{"v": 2, "topic": "cardio", "hot": true, "q": "Which sequence shows blood flow from the body through the heart?", "o": ["Right atrium, left atrium, lungs, right ventricle, left ventricle", "Right atrium, right ventricle, lungs, left atrium, left ventricle", "Right ventricle, right atrium, lungs, left ventricle, left atrium", "Left atrium, left ventricle, lungs, right atrium, right ventricle"], "c": 1, "t": "single", "r": "<b>Body → vena cava → right atrium → tricuspid → right ventricle → pulmonic valve → pulmonary artery → lungs → pulmonary veins → left atrium → mitral → left ventricle → aortic valve → aorta → body.</b> <b>Why not the others:</b> The other sequences start on the wrong side, reverse atrium and ventricle, or skip the lungs. <b>His angle:</b> Atrium before ventricle, right side to the lungs, left side to the body."},
{"v": 2, "topic": "cardio", "hot": true, "q": "Which vessel carries deoxygenated blood?", "o": ["Pulmonary artery", "Pulmonary vein", "Aorta", "Coronary artery"], "c": 0, "t": "single", "r": "<b>The pulmonary artery carries deoxygenated blood from the right ventricle to the lungs.</b> It is an artery because it carries blood away from the heart, not because of its oxygen. <b>Why not the others:</b> Pulmonary veins return oxygenated blood to the left atrium. The aorta and coronary arteries carry oxygenated blood. <b>His angle:</b> Arteries go away from the heart; veins go toward it."},
{"v": 2, "topic": "cardio", "hot": false, "q": "In what order does blood pass the heart valves?", "o": ["Tricuspid, pulmonic, mitral, aortic", "Mitral, aortic, tricuspid, pulmonic", "Pulmonic, tricuspid, aortic, mitral", "Aortic, mitral, pulmonic, tricuspid"], "c": 0, "t": "single", "r": "<b>Tricuspid, pulmonic, mitral, aortic: \"Try Pulling My Aorta.\"</b> Right side first, then left. <b>Why not the others:</b> The other orders start on the left side or reverse the valves within a side. <b>His angle:</b> AV valves (tricuspid, mitral) open in diastole; semilunar valves (pulmonic, aortic) open in systole."},
{"v": 2, "topic": "cardio", "hot": false, "q": "A client has left-sided heart failure. Where does blood back up first?", "o": ["Into the lungs", "Into the liver only", "Into the legs and abdomen", "Into the jugular veins only"], "c": 0, "t": "single", "r": "<b>The left ventricle receives blood from the lungs</b>, so when it fails, blood backs up into the pulmonary circulation: crackles, dyspnea, and pink frothy sputum. <b>Why not the others:</b> Leg edema, JVD, and liver enlargement are <b>right-sided</b> failure, where blood backs up into the body. <b>His angle:</b> Follow the flow backward from the failing chamber."},
{"v": 2, "topic": "acs", "hot": true, "q": "A 12-lead ECG shows ST elevation in a client with crushing chest pain. What does this indicate?", "o": ["A normal variant needing no action", "The heart muscle is well perfused", "A coronary artery is fully blocked", "Unstable angina without muscle damage"], "c": 2, "t": "single", "r": "<b>ST elevation means a STEMI: a coronary artery is completely blocked and the full thickness of the wall is being injured.</b> It needs immediate reperfusion, ideally PCI within 90 minutes of arrival. <b>Why not the others:</b> Unstable angina has no muscle death and no ST elevation. ST elevation with chest pain is never a variant to ignore. <b>His angle:</b> ECG within 10 minutes of arrival; time is muscle."},
{"v": 2, "topic": "acs", "hot": true, "q": "Which cardiac marker is most specific for myocardial damage?", "o": ["BNP", "Lipid panel", "CK-MB", "Troponin I"], "c": 3, "t": "single", "r": "<b>Troponin I is the most specific marker of heart muscle damage</b>, and high-sensitivity troponin is preferred. It rises within hours and stays up for days. <b>Why not the others:</b> CK-MB is heart-related but rises and falls faster, so it is more useful for re-infarction. A lipid panel shows risk, not damage. BNP reflects ventricular stretch. <b>His angle:</b> His diagnostics: troponin I, CK-MB, lipid panel, 12-lead ECG."},
{"v": 2, "topic": "acs", "hot": false, "q": "Why might CK-MB be useful when troponin is already elevated from an MI 3 days ago?", "o": ["It is more specific than troponin for damage", "It shows how stretched the ventricles are", "It measures cholesterol risk after the MI", "It falls faster, so a new rise shows a new MI"], "c": 3, "t": "single", "r": "<b>CK-MB returns to normal within a few days</b>, while troponin stays elevated much longer. A new rise in CK-MB suggests a <b>re-infarction</b>. <b>Why not the others:</b> Troponin is the more specific marker. Cholesterol is the lipid panel. Ventricular stretch is BNP. <b>His angle:</b> Troponin for diagnosis; CK-MB for timing."},
{"v": 2, "topic": "acs", "hot": false, "q": "What preparation is needed for an accurate lipid panel?", "o": ["Drinking extra water for 24 hours", "A 12-hour fast before the blood draw", "Eating a high-fat meal the night before", "Holding all medications for a week"], "c": 1, "t": "single", "r": "<b>Ch 22: the lipid profile is drawn after a 12-hour fast</b> so recent food does not raise the triglycerides. <b>Why not the others:</b> Extra water, holding all medications, or a fatty meal are not the preparation. <b>His angle:</b> Lipids show the atherosclerosis risk behind ACS and hypertension."},
{"v": 2, "topic": "htn", "hot": true, "q": "A client's BP is 214/128. The client denies chest pain but has new confusion and blurred vision. How should the nurse classify this?", "o": ["Hypertensive urgency", "Hypertensive emergency", "White-coat hypertension", "Stage 2 hypertension"], "c": 1, "t": "single", "r": "<b>Confusion is brain damage and blurred vision is eye damage, so target organ damage is present: an emergency.</b> <b>Why not the others:</b> Urgency has no organ damage. Stage 2 describes chronic readings, not a crisis with symptoms. White-coat hypertension is anxiety-related and would not cause neuro or visual changes. <b>His angle:</b> Don't just look at the heart. Any one target organ is enough."},
{"v": 2, "topic": "htn", "hot": true, "q": "A client in hypertensive crisis has a urine output of 15 mL/hr for the last 3 hours and a rising creatinine. What does this indicate?", "o": ["An expected response to the high BP", "Target organ damage to the kidneys", "A lab error that should be redrawn", "Dehydration that needs a fluid bolus"], "c": 1, "t": "single", "r": "<b>Low urine output and a rising creatinine mean the kidneys are being damaged</b>, which makes this a hypertensive emergency. <b>Why not the others:</b> Kidney injury is not an expected response. A fluid bolus in a crisis could worsen pressure and overload. Assuming lab error delays treatment. <b>His angle:</b> Kidney signs: low urine output, rising BUN and creatinine."},
{"v": 2, "topic": "htn", "hot": true, "q": "During a hypertensive crisis, which finding requires the nurse to act immediately as a sign of stroke?", "o": ["A headache rated 3 out of 10", "Sudden facial droop and slurred speech", "Mild anxiety about the diagnosis", "A heart rate of 96 beats per minute"], "c": 1, "t": "single", "r": "<b>BE FAST: facial droop and slurred speech are stroke signs.</b> Note the time last known well and escalate immediately. <b>Why not the others:</b> A mild headache, anxiety, and a heart rate of 96 do not indicate a stroke by themselves. <b>His angle:</b> Hypertension is the biggest risk factor for stroke."},
{"v": 2, "topic": "htn", "hot": true, "q": "Which findings are signs of a stroke? Select all that apply.", "o": ["Bilateral leg cramps after walking", "Sudden blurred or double vision", "One arm drifts downward", "Sudden loss of balance", "Garbled or slurred speech", "One-sided facial droop"], "c": [1, 2, 3, 4, 5], "t": "multi", "r": "<b>BE FAST: Balance, Eyes, Face, Arms, Speech, Time.</b> Each of these is sudden and neurological. <b>Why not the others:</b> Cramping in both legs with walking is claudication from PAD, not a stroke. <b>His angle:</b> Always note when symptoms started."},
{"v": 2, "topic": "htn", "hot": false, "q": "A client's stroke symptoms resolved completely within 20 minutes. What should the nurse understand?", "o": ["It was harmless since the symptoms resolved", "It means the client is now immune to stroke", "It was most likely caused by low blood sugar only", "It was likely a TIA, a warning of a future stroke"], "c": 3, "t": "single", "r": "<b>A transient ischemic attack has stroke symptoms that resolve</b>, but it is a <b>warning</b> that a stroke may follow. It needs urgent evaluation. <b>Why not the others:</b> Resolution does not make it harmless or protective. Hypoglycemia can mimic a stroke, but it should not be assumed. <b>His angle:</b> A TIA is never 'no big deal.'"},
{"v": 2, "topic": "htn", "hot": false, "q": "A client in hypertensive crisis reports sudden tearing pain between the shoulder blades. What should the nurse suspect?", "o": ["Aortic dissection", "Stable angina", "Pleurisy", "Muscle strain from coughing"], "c": 0, "t": "single", "r": "<b>Sudden tearing or ripping chest or back pain in a hypertensive crisis suggests aortic dissection</b>, a target organ emergency. It is one of the exceptions where the SBP is lowered below 140 within the first hour. <b>Why not the others:</b> Muscle strain, stable angina, and pleurisy do not present as sudden tearing pain in this setting. <b>His angle:</b> The aorta is a target organ too."},
{"v": 2, "topic": "acs", "hot": true, "q": "A client recovering from an MI asks about the purpose of the medications and lifestyle changes. What is the best response?", "o": ["To prevent another heart attack", "To reverse the damage already done", "To lower the pulse to below 50", "To replace the need for follow-up visits"], "c": 0, "t": "single", "r": "<b>His stated goal after ACS: prevent future myocardial infarctions</b> and improve heart health through medications and lifestyle changes. <b>Why not the others:</b> Dead heart muscle does not regenerate. Follow-up visits remain essential. A pulse below 50 is not the goal. <b>His angle:</b> Prevention of the next MI is the whole point of long-term therapy."},
{"v": 2, "topic": "vascular", "hot": true, "q": "Which statement about peripheral vascular disease is accurate?", "o": ["It affects only the lymph nodes of the groin", "It refers only to disease of the leg veins", "It includes arterial, venous, and lymphatic disease", "It refers only to disease of the leg arteries"], "c": 2, "t": "single", "r": "<b>PVD is the umbrella term</b> covering peripheral arterial disease, peripheral venous disease, and peripheral lymphatic disease. Destruction can occur in any of the three. <b>Why not the others:</b> Each other option names only one part of the umbrella. <b>His angle:</b> PAD is one member of PVD, not the same thing."},
{"v": 2, "topic": "vascular", "hot": true, "q": "What are the main causes of peripheral arterial disease?", "o": ["Hypertension and atherosclerosis", "Lymph node removal and infection", "Prolonged standing and obesity", "Varicose veins and pregnancy"], "c": 0, "t": "single", "r": "<b>His main causes of PAD: hypertension and atherosclerosis.</b> Hypertension damages vessel walls and accelerates plaque buildup. Smoking, diabetes, and hyperlipidemia add risk. <b>Why not the others:</b> Varicose veins and prolonged standing relate to venous disease. Lymph node removal relates to lymphedema. <b>His angle:</b> PAD in the legs signals atherosclerosis elsewhere, including the heart and brain."},
{"v": 2, "topic": "vascular", "hot": true, "q": "A client reports calf pain after walking two blocks that goes away after resting a few minutes. What does the nurse document?", "o": ["Venous insufficiency", "Intermittent claudication", "Critical limb ischemia", "Deep vein thrombosis"], "c": 1, "t": "single", "r": "<b>Pain with activity that is relieved by rest is intermittent claudication</b>, the classic PAD symptom. Document the <b>distance walked before pain starts</b>. <b>Why not the others:</b> Critical limb ischemia causes pain <b>at rest</b>. DVT causes constant swelling and pain, not activity-related pain. Venous insufficiency causes a dull ache with prolonged standing. <b>His angle:</b> Calf pain points to the femoral or popliteal artery."},
{"v": 2, "topic": "vascular", "hot": true, "q": "A client with PAD reports foot pain that wakes them at night and improves when they hang the foot over the side of the bed. What does this indicate?", "o": ["Peripheral venous disease", "Stable intermittent claudication", "Critical limb ischemia", "Expected nighttime muscle cramps"], "c": 2, "t": "single", "r": "<b>Pain at rest, worse at night, relieved by dangling is critical limb ischemia</b>, the most severe stage of PAD. Blood flow is inadequate even at rest, and the client is at risk for ulcers, gangrene, and limb loss. <b>Why not the others:</b> Claudication only occurs with activity. Venous pain improves with <b>elevation</b>, not dangling. This is not an ordinary cramp. <b>His angle:</b> Rest pain is a red flag that needs urgent evaluation."},
{"v": 2, "topic": "vascular", "hot": false, "q": "A client with PAD has pain in the buttocks and hips when walking. Where is the blockage most likely located?", "o": ["Popliteal artery behind the knee", "Abdominal aorta or iliac arteries", "Superficial femoral artery in the thigh", "Dorsalis pedis artery on the foot"], "c": 1, "t": "single", "r": "<b>Ch 27: claudication occurs below the blockage.</b> Hip or buttock pain points to the aorta or iliac arteries. Calf pain points to the superficial femoral or popliteal artery. <b>Why not the others:</b> Femoral and popliteal blockages cause calf pain. A dorsalis pedis blockage would affect the foot. <b>His angle:</b> Use the pain location to find the narrowed artery."},
{"v": 2, "topic": "vascular", "hot": false, "q": "Which finding is most consistent with critical limb ischemia rather than intermittent claudication?", "o": ["Itching and brown skin on the shins", "Mild ankle swelling after standing", "A nonhealing ulcer with pain at rest", "Leg cramps that stop with rest"], "c": 2, "t": "single", "r": "<b>Critical limb ischemia shows rest pain, nonhealing ulcers, and possible gangrene.</b> <b>Why not the others:</b> Cramps relieved by rest are claudication. Ankle swelling after standing and brown, itchy skin point to venous disease. <b>His angle:</b> Claudication hurts with activity; CLI hurts at rest."},
{"v": 2, "topic": "vascular", "hot": true, "q": "A client had axillary lymph nodes removed during breast cancer surgery and now has a swollen arm. What should the nurse teach?", "o": ["Apply a heating pad to reduce the edema", "Take a diuretic to remove the swelling", "Keep the arm hanging down as much as possible", "Avoid BPs and blood draws in that arm"], "c": 3, "t": "single", "r": "<b>This is secondary lymphedema.</b> Protect the arm: no BPs, IVs, or blood draws on that side, prevent injury, elevate, use compression garments, and watch for infection. <b>Why not the others:</b> Hanging the arm worsens swelling. Ch 27: diuretics are no longer used for lymphedema. Heating pads risk burns in tissue at high infection risk. <b>His angle:</b> Lymphatic damage is part of the PVD umbrella."},
{"v": 2, "topic": "vascular", "hot": false, "q": "A client has red streaks running up the forearm from an infected finger, with fever. What does the nurse suspect?", "o": ["Lymphangitis", "Arterial occlusion", "Varicose veins", "Deep vein thrombosis"], "c": 0, "t": "single", "r": "<b>Red streaks extending up a limb from an infection are lymphangitis</b>, usually streptococcal, and need antibiotics. <b>Why not the others:</b> DVT causes swelling and calf pain without streaks. Arterial occlusion causes a pale, cold, painful limb. Varicose veins are dilated superficial veins. <b>His angle:</b> Lymphatic disease belongs under the PVD umbrella."},
{"v": 2, "topic": "vascular", "hot": false, "q": "How does lymphedema edema typically change over time?", "o": ["Firm early, becoming soft and pitting later", "Always pitting and always responsive to diuretics", "Present only in the morning, gone by evening", "Soft and pitting early, firm and nonpitting later"], "c": 3, "t": "single", "r": "<b>Ch 27: lymphedema starts soft and pitting and progresses to firm, nonpitting swelling</b> that responds poorly to treatment. <b>Why not the others:</b> The progression runs the other way. Diuretics are not used. It does not come and go daily like simple dependent edema. <b>His angle:</b> Early treatment with elevation, compression, and drainage matters most."},
{"v": 2, "topic": "vascular", "hot": true, "q": "A client being treated for a left leg DVT suddenly reports shortness of breath and sharp chest pain. HR is 124 and SpO2 is 88%. What should the nurse do first?", "o": ["Lower the head of the bed and elevate both legs", "Stay, raise the HOB, give O2, call for help", "Massage the left calf to restore its circulation", "Recheck vital signs in 30 minutes"], "c": 1, "t": "single", "r": "<b>Sudden dyspnea, chest pain, tachycardia, and hypoxia in a DVT client is a pulmonary embolism until proven otherwise.</b> Stay with the client, raise the head of the bed, give oxygen, and call for help. <b>Why not the others:</b> Massaging the leg can dislodge more clot. Lowering the head of the bed worsens breathing. Waiting 30 minutes delays emergency care. <b>His angle:</b> A DVT that breaks off travels to the lungs."},
{"v": 2, "topic": "vascular", "hot": true, "q": "A clot breaks off from a deep vein in the calf. Where will it most likely lodge?", "o": ["Carotid artery", "Pulmonary artery", "Femoral artery", "Coronary artery"], "c": 1, "t": "single", "r": "<b>A venous clot travels up the vena cava to the right atrium and right ventricle, then out the pulmonary artery</b>, where it lodges: a pulmonary embolism. <b>Why not the others:</b> The carotid, coronary, and femoral arteries are on the arterial side, reached from the left heart, not from the veins. <b>His angle:</b> Follow the blood flow: leg vein, vena cava, right heart, lungs."},
{"v": 2, "topic": "vascular", "hot": true, "q": "Which assessment finding is most consistent with a DVT?", "o": ["One swollen, warm, tender calf", "Pain in both calves while walking", "Both legs cool with weak pulses", "Red streaks moving up the arm"], "c": 0, "t": "single", "r": "<b>DVT usually affects ONE leg with swelling, warmth, tenderness, and redness.</b> Many DVTs are silent, so risk factors matter too. <b>Why not the others:</b> Cool legs with weak pulses and walking pain are arterial (PAD). Red streaks are lymphangitis. <b>His angle:</b> Compare calf circumference between the legs."},
{"v": 2, "topic": "vascular", "hot": false, "q": "Which test confirms a suspected DVT?", "o": ["Duplex ultrasound", "Ankle-brachial index", "12-lead ECG", "Fasting lipid panel"], "c": 0, "t": "single", "r": "<b>Duplex (Doppler) ultrasound visualizes the clot and confirms DVT.</b> A D-dimer helps rule it out when normal but cannot confirm it. <b>Why not the others:</b> ABI tests arterial disease. A lipid panel checks cholesterol. An ECG checks the heart. <b>His angle:</b> His DVT workup also includes CBC, PT, aPTT, INR, CRP, and factor V Leiden."},
{"v": 2, "topic": "vascular", "hot": false, "q": "Which test confirms a pulmonary embolism?", "o": ["Ankle-brachial index", "Urinalysis", "Lipid panel", "CT pulmonary angiogram"], "c": 3, "t": "single", "r": "<b>A CT pulmonary angiogram shows the clot in the pulmonary arteries</b> and confirms PE. <b>Why not the others:</b> ABI, urinalysis, and a lipid panel do not image the lungs. <b>His angle:</b> Suspect PE from symptoms first; imaging confirms it."},
{"v": 2, "topic": "vascular", "hot": true, "q": "A client on a heparin infusion has an aPTT of 110 seconds (control 30). What should the nurse do?", "o": ["Continue it unchanged and recheck the aPTT tomorrow", "Hold or adjust per protocol; assess for bleeding", "Increase the rate since the goal is not reached", "Give vitamin K to reverse the heparin"], "c": 1, "t": "single", "r": "<b>The usual heparin goal is about 1.5 to 2.5 times the control</b>, here about 45 to 75 seconds. 110 is well above that, so bleeding risk is high. Follow the protocol, assess for bleeding, and notify the provider. The antidote is <b>protamine sulfate</b>. <b>Why not the others:</b> Increasing the rate worsens it. Vitamin K reverses warfarin, not heparin. Waiting until tomorrow ignores a dangerous value. <b>His angle:</b> Heparin: aPTT, platelets, weight, bleeding."},
{"v": 2, "topic": "vascular", "hot": true, "q": "A client on Coumadin has an INR of 5.2. What does this indicate?", "o": ["Clot risk is high", "Bleeding risk is high", "The client is not at goal yet", "The dose is too low"], "c": 1, "t": "single", "r": "<b>The goal INR is 2 to 3.</b> An INR of 5.2 means the blood is taking far too long to clot, so bleeding risk is high. Hold as ordered, assess for bleeding, and notify the provider; the antidote is vitamin K. <b>Why not the others:</b> A high INR means too much effect, not too little. Clot risk is high when the INR is <b>below</b> 2. <b>His angle:</b> Higher INR, thinner blood."},
{"v": 2, "topic": "vascular", "hot": true, "q": "A client on Coumadin plans to start eating large spinach salads every day. What should the nurse teach?", "o": ["Greens will make the Coumadin work better", "Stop Coumadin on days a salad is eaten", "A sudden increase in greens lowers the INR", "Leafy greens have no real effect on Coumadin at all"], "c": 2, "t": "single", "r": "<b>Leafy greens are high in vitamin K, Coumadin's antidote.</b> A sudden increase makes the INR drop and raises clot risk. The teaching is <b>consistency</b>, not avoidance. <b>Why not the others:</b> Greens counteract Coumadin rather than helping it. Stopping Coumadin on salad days would make the INR unstable. <b>His angle:</b> Keep the amount of leafy greens about the same every week."},
{"v": 2, "topic": "vascular", "hot": false, "q": "A client on heparin has a platelet count that falls from 250,000 to 110,000. What does the nurse suspect?", "o": ["A normal lab variation", "Heparin-induced thrombocytopenia", "Vitamin K deficiency", "A therapeutic heparin effect"], "c": 1, "t": "single", "r": "<b>A drop of about 50% in platelets on heparin suggests HIT.</b> Stop heparin and notify the provider; argatroban is often used instead. <b>Why not the others:</b> Heparin's effect is measured by aPTT, not platelets. A 50% drop is not normal variation. Vitamin K relates to Coumadin. <b>His angle:</b> Platelets are one of the three things he says to monitor on heparin."},
{"v": 2, "topic": "vascular", "hot": false, "q": "Why are heparin and Coumadin given together at the start of DVT treatment?", "o": ["Heparin works now; Coumadin takes days", "Coumadin makes heparin work faster", "Heparin reverses Coumadin's bleeding side effects", "Both are needed to prevent a stroke"], "c": 0, "t": "single", "r": "<b>Heparin works immediately; Coumadin takes several days to reach a therapeutic INR.</b> They overlap until the INR is 2 to 3, then heparin stops. <b>Why not the others:</b> Coumadin does not speed heparin, neither reverses the other, and stroke prevention is not the reason for the overlap. <b>His angle:</b> Heparin bridges the gap."},
{"v": 2, "topic": "vascular", "hot": true, "q": "Which bleeding precautions should the nurse teach a client on anticoagulants? Select all that apply.", "o": ["Use a straight razor for a closer shave", "Take ibuprofen for leg pain", "Report black, tarry stools", "Avoid aspirin and NSAIDs unless ordered", "Shave with an electric razor", "Use a soft toothbrush"], "c": [2, 3, 4, 5], "t": "multi", "r": "<b>Protect against bleeding and report signs of it:</b> soft toothbrush, electric razor, avoid aspirin and NSAIDs, and report tarry stools, blood in urine, nosebleeds, bleeding gums, or a severe headache. <b>Why not the others:</b> A straight razor risks cuts. Ibuprofen is an NSAID that increases bleeding. <b>His angle:</b> Same precautions apply to heparin and Coumadin."},
{"v": 2, "topic": "vascular", "hot": true, "q": "Which intervention is appropriate for venous disease but harmful in PAD?", "o": ["Daily foot inspection", "Compression stockings", "A walking program", "Smoking cessation"], "c": 1, "t": "single", "r": "<b>Compression stockings help venous return but squeeze already poor arterial inflow in PAD.</b> <b>Why not the others:</b> Quitting smoking, walking, and daily foot inspection help both conditions. <b>His angle:</b> Venous: elevate and compress. Arterial: dangle and don't compress."},
{"v": 2, "topic": "vascular", "hot": false, "q": "When should a client apply compression stockings?", "o": ["At bedtime after the legs have swollen", "After standing for several hours", "In the morning before getting out of bed", "Only when the legs feel painful"], "c": 2, "t": "single", "r": "<b>Apply them in the morning before getting up, before the legs swell.</b> Keep them smooth with no rolled tops, which act like a tourniquet. <b>Why not the others:</b> Applying after swelling traps fluid. Symptom-only use and waiting until after standing miss the point of prevention. <b>His angle:</b> Remove daily to inspect the skin."},
{"v": 2, "topic": "vascular", "hot": false, "q": "Which client has a risk factor for PVD that is not on the PAD list?", "o": ["A client with a prior DVT on bed rest", "A client with high LDL cholesterol", "A client with type 2 diabetes", "A client who smokes a pack of cigarettes a day"], "c": 0, "t": "single", "r": "<b>PAD and PVD share the same risk factors, but PVD adds a history of DVT and immobility</b>, the venous side explained by Virchow's triad. <b>Why not the others:</b> Smoking, diabetes, and high LDL are shared by both. <b>His angle:</b> Virchow's triad: endothelial damage, stasis, hypercoagulability."},
{"v": 2, "topic": "vascular", "hot": false, "q": "Which factor does his handout list as guiding the choice of DVT treatment?", "o": ["The client's cholesterol level", "The client's current BMI", "The client's bleeding risk", "The client's ankle-brachial index"], "c": 2, "t": "single", "r": "<b>His four factors: severity of the clot, the client's overall health, risk of bleeding, and availability of resources.</b> <b>Why not the others:</b> Cholesterol, ABI, and BMI matter for vascular risk but do not guide the choice of DVT treatment. <b>His angle:</b> If anticoagulation is contraindicated or fails, an interventional procedure is considered."},
{v:2,topic:'cardio',hot:true,q:'A client\'s heart rate is 80 and stroke volume is 60 mL. What is the cardiac output?',o:['140 mL/min','6.0 L/min','1.3 L/min','4.8 L/min'],c:3,t:'single',r:'<b>Cardiac output = heart rate × stroke volume.</b> 80 × 60 mL = 4,800 mL/min, or <b>4.8 L/min</b>, within the normal range of about 4 to 8. <b>Why not the others:</b> 140 adds the numbers instead of multiplying. 1.3 divides them. 6.0 does not come from these values. <b>His angle:</b> Then BP = cardiac output × systemic vascular resistance.'},
{v:2,topic:'cardio',hot:true,q:'Which change would raise blood pressure the most, according to the physiology he taught?',o:['A slight decrease in blood volume','A mild drop in heart rate','A small widening of the arteries','A small narrowing of the arterioles'],c:3,t:'single',r:'<b>Vessel radius is the most important factor in resistance.</b> A small narrowing raises resistance sharply, and since BP = CO × SVR, pressure rises with it. <b>Why not the others:</b> A lower heart rate, less volume, and wider vessels would all lower BP. <b>His angle:</b> This is why constant SNS and angiotensin II constriction drive hypertension.'},
{v:2,topic:'cardio',hot:false,q:'A client\'s echocardiogram shows an ejection fraction of 30%. What does this indicate?',o:['Normal pumping function','Too much blood is being ejected','The chambers are stiff but pump normally','The ventricle is pumping out too little blood'],c:3,t:'single',r:'<b>Normal ejection fraction is about 50 to 70%.</b> An EF of 30% means the left ventricle pumps out only a small share of its blood with each beat, which fits <b>systolic heart failure</b> (reduced EF). <b>Why not the others:</b> 30% is well below normal. Stiff chambers with normal pumping is diastolic failure with preserved EF. Too much ejection is not the problem. <b>His angle:</b> Thin and stretched can\'t pump; thick and stiff can\'t fill.'},
{v:2,topic:'cardio',hot:true,q:'A client with heart failure has a resting heart rate of 118. Why does this compensation worsen the heart failure over time?',o:['Less filling time and coronary flow, more oxygen demand','It makes the kidneys release excess sodium','It lowers vessel resistance and the heart\'s workload','It raises stroke volume until the heart recovers'],c:0,t:'single',r:'<b>A faster rate shortens diastole</b>, so the ventricle fills less and the coronary arteries, which fill during diastole, deliver less oxygen. At the same time the heart\'s <b>oxygen demand rises</b>. Less supply and more demand damage more muscle, and the heart weakens further. <b>Why not the others:</b> Tachycardia does not restore stroke volume or lower resistance, and the SNS makes the kidneys <b>hold</b> sodium, not release it. <b>His angle:</b> His advanced question: the compensation becomes the progression.'},
{v:2,topic:'cardio',hot:false,q:'When assessing pedal pulses, what is the most important technique?',o:['Check only the side with symptoms','Compare the right and left sides','Use the thumb to feel the pulse','Press as firmly as possible'],c:1,t:'single',r:'<b>Always compare pulses bilaterally.</b> A weaker pulse on one side suggests an arterial blockage on that side. <b>Why not the others:</b> The thumb has its own pulse and can mislead you. Pressing too hard obliterates a weak pulse. Checking only one side removes the comparison. <b>His angle:</b> A 2+ pulse is normal; 1+ is weak; 0 is absent. Use a Doppler if you can\'t feel it.'},
{v:2,topic:'htn',hot:true,q:'A client is newly diagnosed with stage 1 hypertension and has no other risk factors. What does the nurse expect as the first step?',o:['Starting three medications right away','About three months of lifestyle changes','Hospital admission for IV medication','Starting a calcium channel blocker only'],c:1,t:'single',r:'<b>His lecture: the first three months focus on lifestyle modifications and exercise.</b> If BP is still above goal, a <b>thiazide diuretic</b> is started, then ACE inhibitors or calcium channel blockers are considered. <b>Why not the others:</b> Three drugs at once and IV admission are not appropriate for uncomplicated stage 1. A CCB alone skips the lifestyle trial and the usual first choice. <b>His angle:</b> Lifestyle stays part of treatment even after medications start.'},
{v:2,topic:'htn',hot:true,q:'Why does insulin resistance contribute to hypertension?',o:['It lowers blood sugar and dilates the arteries','It makes the kidneys excrete more sodium','It slows the heart and lowers cardiac output','High glucose thickens the blood and inflames vessels'],c:3,t:'single',r:'<b>His lecture: high glucose increases blood viscosity</b>, so the heart must push harder, and it promotes <b>inflammation</b> that narrows the vessel lumen. High insulin also drives sodium retention and SNS activity. <b>Why not the others:</b> Insulin resistance raises, not lowers, glucose. It causes sodium <b>retention</b>. It does not slow the heart. <b>His angle:</b> Thicker blood through narrower tubes means higher pressure.'},
{v:2,topic:'htn',hot:false,q:'Besides lowering BP, what additional benefit do ACE inhibitors and ARBs provide?',o:['They protect the kidneys','They cure heart failure','They prevent all strokes','They raise HDL cholesterol'],c:0,t:'single',r:'<b>By causing vasodilation and lowering pressure inside the kidney, ACE inhibitors and ARBs are renal-protective.</b> That is why they are chosen for clients with diabetes or kidney disease. <b>Why not the others:</b> No drug prevents all strokes, they don\'t raise HDL, and heart failure is managed, not cured. <b>His angle:</b> ACE stops angiotensin II from being made; ARBs stop it from working.'},
{v:2,topic:'htn',hot:false,q:'Which kidney findings suggest target organ damage from hypertension?',o:['Increased urine output with thirst','Clear urine with low specific gravity','Edema with decreased urine output','Normal BUN with rising hemoglobin'],c:2,t:'single',r:'<b>His lecture: kidney damage shows as decreased urine output, edema, and altered labs (rising BUN and creatinine).</b> A damaged kidney can\'t clear fluid or waste. <b>Why not the others:</b> High output with thirst suggests diabetes insipidus or hyperglycemia. Dilute urine and a rising hemoglobin do not indicate hypertensive kidney damage. <b>His angle:</b> Kidneys, heart, brain, and eyes are the four target organs.'},
{v:2,topic:'htn',hot:false,q:'Using the AHA daily guideline he described, what is the alcohol limit for a woman with hypertension?',o:['No limit if BP is controlled','No more than 3 drinks per day','No more than 2 drinks per day','No more than 1 drink per day'],c:3,t:'single',r:'<b>AHA: no more than 1 drink a day for women and 2 a day for men.</b> His handout slide also showed a weekly limit of 14 units. <b>Why not the others:</b> Two a day is the male limit. Three exceeds both. There is still a limit when BP is controlled, since alcohol raises BP and blunts medications. <b>His angle:</b> Watch for daily vs weekly wording in the stem.'},
{v:2,topic:'vascular',hot:true,q:'Which test is the primary noninvasive tool for diagnosing peripheral arterial disease?',o:['D-dimer','Lymphoscintigraphy','Venous duplex scan','Ankle-brachial index'],c:3,t:'single',r:'<b>His lecture: the ABI is the primary noninvasive diagnostic for PAD</b>, comparing ankle and brachial systolic pressures. Normal is 1.0 to 1.4. <b>Why not the others:</b> D-dimer screens for clotting. A venous duplex looks for DVT. Lymphoscintigraphy images the lymphatics. <b>His angle:</b> He corrected this: ABI belongs with PAD.'},
{v:2,topic:'vascular',hot:true,q:'Why does a client with PAD dangle the legs while a client with venous disease elevates them?',o:['Elevation raises arterial blood flow to the feet','PAD needs flow in; venous disease needs flow out','Both conditions need the same exact position','Dangling lowers venous pooling in the calves'],c:1,t:'single',r:'<b>PAD is a problem of blood getting IN</b>, so dangling lets gravity help arterial flow. <b>Venous disease is a problem of blood getting OUT</b>, so elevation helps it return to the heart. The wrong position worsens each disease. <b>Why not the others:</b> They need opposite positions. Elevation reduces arterial flow, and dangling increases venous pooling. <b>His angle:</b> His advanced question: this is why telling them apart matters.'},
{v:2,topic:'vascular',hot:false,q:'Why are veins more prone to edema when their valves fail?',o:['Veins carry blood away from the heart','Veins are low-pressure and rely on valves','Veins have no connection to the lymphatics','Veins have thicker walls than arteries'],c:1,t:'single',r:'<b>Veins are low-pressure vessels that depend on one-way valves and the calf muscle pump</b> to return blood uphill. When valves fail, blood backs up, pressure rises, and fluid leaks into the tissues. <b>Why not the others:</b> Arteries are the thick-walled, high-pressure vessels. Veins carry blood toward the heart. Lymphatics also drain into the venous system. <b>His angle:</b> Valve failure leads to pooling, edema, and ulcers.'},
{"v": 2, "topic": "htn", "t": "match", "hot": true, "q": "Using ACC/AHA guidelines, match each reading to its category.", "items": [{"term": "118/76", "def": "Normal"}, {"term": "124/78", "def": "Elevated"}, {"term": "134/84", "def": "Stage 1 hypertension"}, {"term": "146/88", "def": "Stage 2 hypertension"}, {"term": "196/124 with new confusion", "def": "Hypertensive emergency"}, {"term": "196/124, feels fine, stopped meds", "def": "Hypertensive urgency"}], "r": "<b>Normal and Elevated need both numbers in range; Stage 1 and 2 need only one.</b> 134/84 is Stage 1 on both counts, 146/88 is Stage 2 on the systolic. Both crisis readings are over 180/120, and <b>target organ damage</b> (new confusion) is what makes one an emergency."},
{"v": 2, "topic": "htn", "t": "match", "hot": true, "q": "Match each finding to the target organ it shows damage in.", "items": [{"term": "Rising BUN and creatinine with edema", "def": "Kidneys"}, {"term": "Angina and tachycardia", "def": "Heart"}, {"term": "Facial droop and slurred speech", "def": "Brain"}, {"term": "Retinal hemorrhages and blurred vision", "def": "Eyes"}, {"term": "Sudden tearing pain between the shoulder blades", "def": "Aorta"}], "r": "His target organs are the <b>kidneys, heart, brain, and eyes</b>, and the aorta is at risk in a crisis. In an emergency, <b>any one organ</b> showing damage is enough."},
{"v": 2, "topic": "htn", "t": "match", "hot": true, "q": "Match each part of RAAS or its medications to its role.", "items": [{"term": "Released by the kidneys when perfusion is low", "def": "Renin"}, {"term": "Potent vasoconstrictor that triggers aldosterone", "def": "Angiotensin II"}, {"term": "Tells the kidneys to hold sodium and water", "def": "Aldosterone"}, {"term": "Blocks the converting enzyme and can cause a cough", "def": "ACE inhibitor"}, {"term": "Blocks the angiotensin II receptor with no cough", "def": "ARB"}, {"term": "First-line drug that makes the kidneys excrete sodium and water", "def": "Thiazide diuretic"}], "r": "Renin starts it, ACE converts angiotensin I to <b>angiotensin II</b>, which tightens vessels and releases <b>aldosterone</b> to hold fluid. <b>ACE inhibitors stop angiotensin II from being made; ARBs stop it from working.</b>"},
{"v": 2, "topic": "cardio", "t": "match", "hot": true, "q": "Match each description to the structure of the heart.", "items": [{"term": "Receives deoxygenated blood from the vena cava", "def": "Right atrium"}, {"term": "Pumps blood out to the lungs", "def": "Right ventricle"}, {"term": "Carries deoxygenated blood to the lungs", "def": "Pulmonary artery"}, {"term": "Returns oxygenated blood to the heart", "def": "Pulmonary veins"}, {"term": "Thickest chamber; pumps blood to the body", "def": "Left ventricle"}, {"term": "Valve between the left atrium and left ventricle", "def": "Mitral valve"}], "r": "Right side to the lungs, left side to the body. The <b>pulmonary artery</b> is the artery that carries deoxygenated blood, and the <b>left ventricle</b> is thickest because it pumps against the whole body."},
{"v": 2, "topic": "vascular", "t": "match", "hot": true, "q": "Match each finding to the condition.", "items": [{"term": "Small round toe ulcer with punched-out edges", "def": "Arterial ulcer"}, {"term": "Irregular ankle ulcer with brown skin around it", "def": "Venous ulcer"}, {"term": "Calf pain with walking, relieved by rest", "def": "Intermittent claudication"}, {"term": "Foot pain at night, relieved by dangling", "def": "Critical limb ischemia"}, {"term": "One warm, swollen, tender calf", "def": "Deep vein thrombosis"}, {"term": "Red streaks up the arm from an infected finger", "def": "Lymphangitis"}], "r": "Sort by system first: <b>arterial</b> problems are about blood getting in (punched-out ulcer, claudication, rest pain), <b>venous</b> problems are blood getting out (irregular ulcer, DVT), and <b>lymphatic</b> problems are drainage (lymphangitis)."},
{"v": 2, "topic": "vascular", "t": "match", "hot": true, "q": "Match each description to the medication or antidote.", "items": [{"term": "Monitored with aPTT, platelets, and weight", "def": "Heparin"}, {"term": "INR goal 2 to 3; keep leafy greens consistent", "def": "Coumadin (warfarin)"}, {"term": "Direct thrombin inhibitor used in HIT", "def": "Argatroban"}, {"term": "Oral factor Xa inhibitor with no routine INR", "def": "Apixaban"}, {"term": "Reverses heparin", "def": "Protamine sulfate"}, {"term": "Reverses Coumadin", "def": "Vitamin K"}], "r": "<b>Heparin goes with aPTT; Coumadin goes with INR.</b> Leafy greens are vitamin K, the Coumadin antidote, which is why intake must stay consistent."},
{"v": 2, "topic": "vascular", "t": "match", "hot": true, "q": "Match each test to what it is used for.", "items": [{"term": "Clot breakdown product; a normal result helps rule out DVT", "def": "D-dimer"}, {"term": "Confirms a DVT", "def": "Duplex ultrasound"}, {"term": "Confirms a pulmonary embolism", "def": "CT pulmonary angiogram"}, {"term": "Primary noninvasive test for PAD", "def": "Ankle-brachial index"}, {"term": "Tests for an inherited clotting disorder", "def": "Factor V Leiden"}], "r": "D-dimer screens, duplex confirms DVT, CT pulmonary angiogram confirms PE. He corrected this in lecture: <b>ABI is the PAD test.</b>"},
{"v": 2, "topic": "acs", "t": "match", "hot": true, "q": "Match each diagnostic to what it tells you.", "items": [{"term": "Most specific marker of heart muscle damage", "def": "Troponin I"}, {"term": "Rises and falls quickly, useful for reinfarction", "def": "CK-MB"}, {"term": "Drawn after a 12-hour fast to assess risk", "def": "Lipid panel"}, {"term": "Done within 10 minutes to look for ST elevation", "def": "12-lead ECG"}, {"term": "Rises when the ventricles are stretched by volume", "def": "BNP"}], "r": "His ACS diagnostics are <b>troponin I, CK-MB, lipid panel, and 12-lead ECG</b>. BNP reflects ventricular stretch from fluid, as in heart failure."},
{v:2,topic:'cardio',hot:true,q:'An 80-year-old reports chest pain with exertion, fainting while climbing stairs, and shortness of breath. A systolic murmur is heard at the right second intercostal space. What does the nurse suspect?',o:['Mitral valve prolapse','Right-sided heart failure','Acute pericarditis','Aortic stenosis'],c:3,t:'single',r:'<b>Angina, syncope, and dyspnea are the classic triad of aortic stenosis</b>, and a systolic murmur at the right second intercostal space (the aortic area) fits. <b>Why not the others:</b> Mitral prolapse causes a midsystolic click at the apex. Pericarditis causes sharp pain relieved by leaning forward and a friction rub. Right-sided failure causes edema and JVD. <b>His angle:</b> The narrowed valve forces the LV to push against high resistance, like hypertension does.'},
{v:2,topic:'cardio',hot:false,q:'A client with aortic stenosis faints during exercise. What explains this?',o:['The heart rate drops below 40 with activity','Cardiac output can\'t rise to meet demand','The client is having a stroke','Blood pools in the legs from bad valves'],c:1,t:'single',r:'<b>The narrowed valve limits how much blood the LV can push out</b>, so during exertion cardiac output can\'t rise and the brain is briefly underperfused. <b>Why not the others:</b> Bradycardia, venous pooling, and stroke are not the mechanism. <b>His angle:</b> Fall precautions and rest periods are part of nursing care.'},
{v:2,topic:'vascular',hot:true,q:'A 38-year-old who smokes a pack a day asks to start a combined oral contraceptive. What is the nurse\'s priority concern?',o:['Increased risk of blood clots and stroke','Increased risk of forming kidney stones','Increased risk of low blood sugar','Decreased effectiveness of her inhaler'],c:0,t:'single',r:'<b>Estrogen raises clotting factors, and smoking at age 35 or older multiplies the risk</b> of DVT, PE, stroke, and MI. Combined oral contraceptives are generally avoided. <b>Why not the others:</b> Hypoglycemia, inhaler effectiveness, and kidney stones are not the concern. <b>His angle:</b> Estrogen belongs in the hypercoagulability corner of Virchow\'s triad.'},
{v:2,topic:'vascular',hot:true,q:'Which findings would make combined oral contraceptives inappropriate? Select all that apply.',o:['Smoking at age 36','History of DVT','Migraine with aura','Uncontrolled hypertension','Seasonal allergies','Regular menstrual cycles'],c:[0,1,2,3],t:'multi',r:'<b>Clot risk and BP risk</b>: prior DVT or clotting disorder, uncontrolled hypertension, smoking at 35 or older, migraine with aura, stroke or MI history, breast cancer, and liver disease. <b>Why not the others:</b> Seasonal allergies and regular cycles are not contraindications. <b>His angle:</b> Teach ACHES as the warning signs.'},
{v:2,topic:'vascular',hot:false,q:'A client on an oral contraceptive reports sudden severe calf pain and swelling. What should the nurse do?',o:['Massage the calf to improve circulation','Advise a double dose of her pill tonight','Tell her to walk it off to ease the cramp','Treat it as a possible DVT and notify'],c:3,t:'single',r:'<b>Severe leg pain is the S in ACHES</b>, a warning sign of a clot. Treat it as a possible DVT: no massage, keep the leg still, and notify the provider. <b>Why not the others:</b> Walking or massaging risks dislodging a clot. Extra estrogen increases the risk. <b>His angle:</b> ACHES: abdominal pain, chest pain, headache, eye problems, severe leg pain.'},
{v:2,topic:'vascular',hot:false,q:'A client\'s labs show an elevated homocysteine level. Which statement about homocysteine is accurate?',o:['It promotes clotting and is an atherosclerosis risk factor','It measures inflammation inside blood vessels','It is the main test used to diagnose PAD','Lowering it has been proven to prevent heart attacks'],c:0,t:'single',r:'<b>Ch 27: homocysteine promotes coagulation and is a risk factor for atherosclerosis</b>, but there is <b>no evidence that lowering it prevents</b> cardiovascular events. <b>Why not the others:</b> Lowering it has not been proven protective. Inflammation is measured by CRP. The ABI is the main PAD test. <b>His angle:</b> Know what the marker means and what the evidence does and doesn\'t show.'},
{v:2,topic:'vascular',hot:false,q:'Which lab is a marker of inflammation that raises cardiovascular and PAD risk?',o:['Serum homocysteine level','Serum potassium level','Hemoglobin A1C percentage','High-sensitivity C-reactive protein'],c:3,t:'single',r:'<b>CRP is a marker of vascular inflammation</b>, and the <b>high-sensitivity CRP</b> test is recommended. <b>Why not the others:</b> Homocysteine promotes clotting. A1C reflects glucose control. Potassium is an electrolyte. <b>His angle:</b> Inflammation is one of his hypertension causes too.'},
{v:2,topic:'vascular',hot:true,q:'A client has a red, warm, swollen, painful lower leg with fever and an orange-peel texture to the skin. Which nursing action is correct?',o:['Elevate the leg 3 to 6 inches above the heart','Keep the leg dependent below the heart','Wrap the leg tightly with an elastic bandage','Apply warm packs first, then cool packs'],c:0,t:'single',r:'<b>This is cellulitis.</b> Ch 27: elevate 3 to 6 inches above heart level, use <b>cool packs</b> every 2 to 4 hours until inflammation resolves, <b>then warm packs</b>, and give antibiotics as ordered. <b>Why not the others:</b> Dependent positioning worsens swelling. The order is cool first, then warm. Tight wrapping can impair circulation in an infected limb. <b>His angle:</b> Cellulitis is often mistaken for thrombophlebitis or venous insufficiency.'},
{v:2,topic:'vascular',hot:false,q:'Which organism most commonly causes cellulitis?',o:['Streptococcus or Staphylococcus aureus','Escherichia coli bacteria','Candida albicans yeast','Herpes zoster virus'],c:0,t:'single',r:'<b>Streptococcus species and Staphylococcus aureus</b> enter through a break in the skin and release toxins into the subcutaneous tissue. <b>Why not the others:</b> Candida is a yeast, herpes zoster causes shingles, and E. coli is not the usual cause. <b>His angle:</b> Find the entry point: cracks between the toes, abrasions, injection sites, ingrown nails.'},
{v:2,topic:'vascular',hot:true,q:'A client with low serum albumin has generalized edema. What explains the swelling?',o:['Less protein pulling fluid back in','Damaged valves in the leg veins','Blocked lymph nodes in the groin','Too much hydrostatic pressure in the arteries'],c:0,t:'single',r:'<b>Plasma proteins like albumin create the osmotic pull that draws fluid back into the capillary at the venous end.</b> With low albumin, fluid stays in the tissues. <b>Why not the others:</b> High hydrostatic pressure, lymph blockage, and valve damage are other causes of edema, but they are not what low albumin does. <b>His angle:</b> Four edema causes: permeability, lymph obstruction, high venous pressure, low protein.'},
{v:2,topic:'vascular',hot:false,q:'A client with chronic kidney disease is scheduled for CT angiography of the aorta. What is the priority concern?',o:['The scan requires stopping all anticoagulants','The client will need general anesthesia','The contrast dye can further damage the kidneys','The x-rays can cause a DVT'],c:2,t:'single',r:'<b>CT angiography uses iodinated contrast, which can injure the kidneys</b>, so it is contraindicated or used cautiously with impaired kidney function. Check creatinine, ask about contrast allergy, and hydrate afterward. <b>Why not the others:</b> X-rays don\'t cause DVT, anticoagulants aren\'t routinely stopped, and anesthesia isn\'t needed. <b>His angle:</b> The same contrast rule is why metformin is held in Unit 3.'},
{v:2,topic:'vascular',hot:false,q:'A client had a DVT last year and now has chronic leg swelling, aching, and skin darkening. What does the nurse suspect?',o:['Lymphangitis from a skin infection','A new arterial blockage in the thigh','Normal healing after a treated DVT','Postthrombotic syndrome from damaged valves'],c:3,t:'single',r:'<b>Ch 27: 20 to 50% of DVT patients develop valve damage afterward, called postthrombotic syndrome</b>, a form of chronic venous insufficiency with swelling, aching, and brown skin. <b>Why not the others:</b> Arterial blockage causes cool pale skin and claudication. Lymphangitis causes red streaks. Chronic swelling is not normal healing. <b>His angle:</b> Compression and elevation are the mainstays.'},
{v:2,topic:'vascular',hot:false,q:'A client with a long-bone fracture suddenly becomes short of breath. Besides a blood clot, which type of embolus should the nurse consider?',o:['Amniotic fluid embolus','Air embolus','Septic embolus','Fat embolus'],c:3,t:'single',r:'<b>Fat emboli classically follow long-bone fractures.</b> Ch 27 lists other emboli types: air, fat, amniotic fluid, and septic. <b>Why not the others:</b> Air emboli relate to IV lines, amniotic fluid emboli to childbirth, and septic emboli to infection. <b>His angle:</b> Match the embolus to the situation.'},
{v:2,topic:'cardio',hot:false,q:'Which finding can a 12-lead ECG identify in a client with long-standing hypertension?',o:['Retinal hemorrhages','A rising serum creatinine','Left ventricular hypertrophy','Peripheral pitting edema'],c:2,t:'single',r:'<b>A 12-lead ECG shows chamber enlargement</b>, such as LVH from pushing against high pressure, along with ischemia, infarction, dysrhythmias, and electrolyte effects. <b>Why not the others:</b> Retinal changes are seen on eye exam, creatinine on labs, and edema on physical exam. <b>His angle:</b> The ECG is on his hypertension workup list.'},
{v:2,topic:'htn',hot:false,q:'Which teaching strategy from Ch 28 best supports hypertension self-care at home?',o:['Rely on a finger BP monitor for convenience','Involve family and give written med information','Stop medications once BP is normal for a week','Tell the client to check BP only at clinic visits'],c:1,t:'single',r:'<b>Ch 28: involve family members, give written information about medication effects and side effects, and encourage home BP measurement</b> with a validated device. <b>Why not the others:</b> Clinic-only checks, stopping meds when BP normalizes, and finger monitors all undermine control. <b>His angle:</b> Self-care is shared between the client and the provider.'},
{v:2,topic:'acs',hot:true,q:'A client arrives with crushing chest pain and ST elevation. Which measure does the nurse expect first?',o:['IV morphine','A stress test','Chewable aspirin','A lipid panel'],c:2,t:'single',r:'<b>MONA covers the emergent measures, but aspirin and nitroglycerin come first.</b> Chewed non-enteric aspirin is absorbed fast and stops the clot from growing. <b>Why not the others:</b> Morphine is used when pain continues after nitrates. A stress test is never done during active chest pain. A lipid panel guides long-term risk, not the emergency. <b>His angle:</b> M.O.N.A. is morphine, oxygen, nitrates, aspirin.'},
{v:2,topic:'acs',hot:true,q:'Before giving nitroglycerin for chest pain, which assessment is essential?',o:['Urine output','Capillary refill','Bowel sounds','Blood pressure'],c:3,t:'single',r:'<b>Nitrates dilate vessels and drop blood pressure</b>, so BP is checked before and after each dose and the drug is held for a systolic under 90. <b>Why not the others:</b> Bowel sounds, urine output, and capillary refill do not guide nitrate dosing. <b>His angle:</b> Headache is an expected effect, and nitrates are never given with erectile dysfunction drugs.'},
{v:2,topic:'acs',hot:true,q:'A client with chest pain reports taking sildenafil last night. What should the nurse do about the prescribed nitroglycerin?',o:['Give it with extra IV fluids','Hold it and notify the provider','Give half the ordered dose','Give it and recheck BP in an hour'],c:1,t:'single',r:'<b>Nitrates plus erectile dysfunction drugs cause severe, life-threatening hypotension.</b> Hold the nitrate and notify the provider. <b>Why not the others:</b> Fluids, a half dose, or delayed rechecks do not remove the interaction risk. <b>His angle:</b> Always ask about these drugs before giving a nitrate.'},
{v:2,topic:'acs',hot:true,q:'A client with a STEMI is at a hospital without a cath lab. What does the nurse anticipate?',o:['Waiting for an outpatient stress test','Oral beta blockers only','Thrombolytics such as alteplase','Discharge with nitroglycerin'],c:2,t:'single',r:'<b>PCI is first choice, with a door-to-balloon goal of 90 minutes. If PCI is not available, thrombolytics (alteplase, streptokinase) are given</b> to dissolve the clot. <b>Why not the others:</b> Waiting, oral drugs alone, or discharge would let the muscle die. <b>His angle:</b> Time is muscle.'},
{v:2,topic:'acs',hot:false,q:'Which finding would make the nurse question giving a thrombolytic?',o:['A headache that resolved last month','Blood pressure of 128/76','Surgery two weeks ago','A history of seasonal allergies'],c:2,t:'single',r:'<b>Bleeding is the major thrombolytic risk</b>, so recent surgery, trauma, stroke, or active bleeding are screened for. <b>Why not the others:</b> A resolved headache, a normal BP, and allergies are not bleeding risks. Uncontrolled hypertension would be. <b>His angle:</b> Minimize needle sticks and watch for a change in LOC or sudden severe headache.'},
{v:2,topic:'acs',hot:false,q:'A client has chest pain at rest, a normal troponin, and no ST elevation. How is this classified?',o:['STEMI','NSTEMI','Stable angina','Unstable angina'],c:3,t:'single',r:'<b>Troponin normal means no muscle death yet, which is unstable angina</b> from a partial blockage. <b>Why not the others:</b> NSTEMI has an elevated troponin without ST elevation. STEMI has ST elevation and a complete blockage. Stable angina happens with exertion and is relieved by rest, not at rest. <b>His angle:</b> Two questions sort them: is the troponin up, and is there ST elevation?'},
