<script>
function toast(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800)}
/* ===== CLASS NOTES ===== */
let notesList=[], noteTopic='other', noteFilter='keep', noteDraft='', noteDraftStar=false;
const NOTE_TOPICS=['cardio','vascular','htn','meds','female','repro','breast','lgbtq','other'];
const NOTE_LABEL={cardio:'Cardiac Assess',vascular:'Vascular/PAD',htn:'Hypertension',meds:'Cardiac Meds',female:'Female Physio',repro:'Repro/STI',breast:'Breast',lgbtq:'LGBTQ+ Care',other:'Other'};
(function restoreNotes(){ try{ const r=localStorage.getItem('nur256u4_notes'); if(r) notesList=JSON.parse(r); }catch(e){} })();
const NOTES_STORAGE_KEY='nur256u4_notes';
function saveNotes(){ try{ localStorage.setItem('nur256u4_notes', JSON.stringify(notesList)); }catch(e){} }
function escN(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function captureDraft(){ const el=document.getElementById('noteInput'); if(el) noteDraft=el.value; const c=document.getElementById('noteStar'); if(c) noteDraftStar=c.checked; }
function setNoteTopic(t){ captureDraft(); noteTopic=t; renderNotes(); }
function setNoteFilter(f){ captureDraft(); noteFilter=f; renderNotes(); }
function addNote(){
  const el=document.getElementById('noteInput'); if(!el)return;
  const t=el.value.trim(); if(!t){ toast('Nothing to save'); return; }
  const star=document.getElementById('noteStar').checked;
  notesList.unshift({id:Date.now()+''+Math.floor(Math.random()*999),t,topic:noteTopic,star,ts:Date.now()});
  saveNotes(); noteDraft=''; noteDraftStar=false; noteFilter = star?'keep':'inbox'; renderNotes();
  toast(star?'Saved to Keep':'Saved to Inbox');
}
function toggleStar(id){ captureDraft(); const n=notesList.find(x=>x.id===id); if(n){ n.star=!n.star; saveNotes(); renderNotes(); } }
function delNote(id){ captureDraft(); notesList=notesList.filter(x=>x.id!==id); saveNotes(); renderNotes(); toast('Deleted'); }
function clearInbox(){
  const n=notesList.filter(x=>!x.star).length;
  if(!n){ toast('Inbox already empty'); return; }
  if(confirm('Delete '+n+' unsorted note'+(n===1?'':'s')+'? Anything starred stays.')){
    notesList=notesList.filter(x=>x.star); saveNotes(); renderNotes(); toast('Inbox cleared');
  }
}
function copyNotes(){
  const list=notesList.filter(x=>x.star);
  if(!list.length){ toast('Nothing starred yet'); return; }
  const txt=list.map(n=>'['+NOTE_LABEL[n.topic]+'] '+n.t).join('\n');
  const done=()=>toast('Copied '+list.length+' notes');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,cb){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast('Copy failed'); }
  document.body.removeChild(ta);
}
/* ---- notes backup: export / import / copy-all ---- */
function notesKey(){ return NOTES_STORAGE_KEY; }
function exportNotes(){
  if(!notesList.length){ toast('No notes to export'); return; }
  const payload=JSON.stringify({v:1,key:notesKey(),saved:new Date().toISOString(),notes:notesList});
  showNotesBox('\u{1F4E6} Backup code', payload,
    'Copy this whole block and keep it somewhere safe \u2014 a note on your phone, an email to yourself, or paste it to Claude. Paste it into Import on any device to restore.');
}
function copyAllNotes(){
  if(!notesList.length){ toast('No notes yet'); return; }
  const txt=notesList.map(n=>(n.star?'\u2605 ':'\u25CB ')+'['+(NOTE_LABEL[n.topic]||n.topic)+'] '+n.t).join('\n');
  showNotesBox('\u{1F4CB} All notes as text', txt,
    'Readable format \u2014 good for pasting to Claude or into a document. \u2605 means starred.');
}
function showNotesBox(title, content, hint){
  const host=document.getElementById('notesBox'); if(!host)return;
  host.innerHTML=`<div class="card" style="border-color:var(--purple)">
    <h3>${title}</h3>
    <p style="font-size:.86rem;color:var(--muted);margin-top:0">${hint}</p>
    <textarea id="notesOut" class="noteinput" rows="7" readonly>${content.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</textarea>
    <div class="chiprow" style="margin-top:10px">
      <button class="mini" onclick="copyBoxText()">Copy to clipboard</button>
      <button class="mini" onclick="document.getElementById('notesBox').innerHTML=''">Close</button>
    </div>
  </div>`;
  const ta=document.getElementById('notesOut'); if(ta){ ta.focus(); ta.select(); ta.scrollIntoView({behavior:'smooth',block:'center'}); }
}
function copyBoxText(){
  const ta=document.getElementById('notesOut'); if(!ta)return;
  const done=()=>toast('Copied');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();try{document.execCommand('copy');done();}catch(e){toast('Select and copy manually');}}); }
  else { ta.select(); try{document.execCommand('copy'); done();}catch(e){ toast('Select and copy manually'); } }
}
function openImport(){
  const host=document.getElementById('notesBox'); if(!host)return;
  host.innerHTML=`<div class="card" style="border-color:var(--teal)">
    <h3>\u{1F4E5} Import notes</h3>
    <p style="font-size:.86rem;color:var(--muted);margin-top:0">Paste a backup code below. Existing notes are <b>kept</b> \u2014 this merges rather than replacing, and skips anything already here.</p>
    <textarea id="notesIn" class="noteinput" rows="6" placeholder="Paste your backup code here"></textarea>
    <div class="chiprow" style="margin-top:10px">
      <button class="mini on" onclick="doImport()">Import</button>
      <button class="mini" onclick="document.getElementById('notesBox').innerHTML=''">Cancel</button>
    </div>
  </div>`;
  const ta=document.getElementById('notesIn'); if(ta){ ta.focus(); ta.scrollIntoView({behavior:'smooth',block:'center'}); }
}
function doImport(){
  const ta=document.getElementById('notesIn'); if(!ta)return;
  const raw=(ta.value||'').trim();
  if(!raw){ toast('Paste a backup code first'); return; }
  let data;
  try{ data=JSON.parse(raw); }catch(e){ toast('That does not look like a backup code'); return; }
  const incoming = Array.isArray(data)?data:(data&&Array.isArray(data.notes)?data.notes:null);
  if(!incoming){ toast('No notes found in that code'); return; }
  const have=new Set(notesList.map(n=>n.id));
  const seen=new Set(notesList.map(n=>(n.t||'').trim()));
  let added=0, skipped=0;
  incoming.forEach(n=>{
    if(!n||typeof n.t!=='string'||!n.t.trim()) return;
    if(have.has(n.id) || seen.has(n.t.trim())){ skipped++; return; }
    notesList.push({ id: n.id || (Date.now()+''+Math.floor(Math.random()*999)),
      t: n.t, topic: (NOTE_LABEL[n.topic]?n.topic:'other'), star: !!n.star, ts: n.ts || Date.now() });
    have.add(n.id); seen.add(n.t.trim()); added++;
  });
  notesList.sort((a,b)=>(b.ts||0)-(a.ts||0));
  saveNotes();
  document.getElementById('notesBox').innerHTML='';
  renderNotes();
  toast(added+' note'+(added===1?'':'s')+' imported'+(skipped?', '+skipped+' already here':''));
}
function renderNotes(){
  const host=document.getElementById('sec-notes'); if(!host)return;
  const keep=notesList.filter(n=>n.star), inbox=notesList.filter(n=>!n.star);
  const shown = noteFilter==='keep'?keep:inbox;
  const chips=NOTE_TOPICS.map(t=>`<button class="chip ${noteTopic===t?'on':''}" onclick="setNoteTopic('${t}')">${NOTE_LABEL[t]}</button>`).join('');
  const rows = shown.length ? shown.map(n=>`
    <div class="notecard">
      <div class="noterow">
        <span class="notetag">${NOTE_LABEL[n.topic]}</span><span class="notespacer"></span>
        <button class="mini ${n.star?'on':''}" onclick="toggleStar('${n.id}')">${n.star?'★ Keep':'☆ Keep'}</button>
        <button class="mini danger" onclick="delNote('${n.id}')">Delete</button>
      </div>
      <div class="notetext">${escN(n.t)}</div>
    </div>`).join('')
    : `<div class="card" style="text-align:center;color:var(--muted)">${noteFilter==='keep'?'Nothing starred yet. Star a note when Casteel signals it is testable.':'Inbox is empty. Everything you wrote has been sorted or cleared.'}</div>`;
  host.innerHTML=`
  <h2 class="sec-title"><span class="sec-emoji">✍️</span> Class Notes</h2>
  <p class="intro-line">Type fast during lecture. Sort later. Saves on this device only.</p>
  <div class="card">
    <textarea id="noteInput" class="noteinput" rows="3" placeholder="Type a keyword, a phrase he repeated, a question he asked the room...">${escN(noteDraft)}</textarea>
    <div class="chiprow">${chips}</div>
    <label class="starline"><input type="checkbox" id="noteStar" ${noteDraftStar?'checked':''}> <b>Star it</b> — he signaled this is on the test</label>
    <button class="btn wide" onclick="addNote()">Save note</button>
  </div>
  <div class="hy"><span class="tag">Keep this small on purpose</span>Not everything said in class is testable, and a page of notes you never reread is just extra weight. Star only what he flags, questions he asks out loud, and anything that contradicts what you already believed. Everything else drops to <b>Inbox</b>, and you clear the inbox at the end of the week without guilt.</div>
  <div class="card">
    <div class="chiprow">
      <button class="chip ${noteFilter==='keep'?'on':''}" onclick="setNoteFilter('keep')">★ Keep (${keep.length})</button>
      <button class="chip ${noteFilter==='inbox'?'on':''}" onclick="setNoteFilter('inbox')">Inbox (${inbox.length})</button>
    </div>
    ${keep.length>25&&noteFilter==='keep'?`<div class="trap"><span class="tag">Getting heavy</span>You have ${keep.length} starred notes. Past about 25 you are collecting, not studying. Reread them and unstar anything you already know cold.</div>`:''}
    ${rows}
    <div class="hy"><span class="tag">Keeping your notes safe</span>
  Notes are stored by your <b>browser, for this website address</b>. Replacing the file at the same GitHub Pages URL <b>keeps them</b>. They will NOT follow you to a different browser, a different device, a private/incognito window, or a copy opened from your Downloads folder. Use <b>📦 Export backup</b> to move them anywhere — or to send them to Claude.</div>
  <div id="notesBox"></div>
    <div class="chiprow" style="margin-top:12px">
      <button class="mini" onclick="copyNotes()">Copy starred</button>
      <button class="mini" onclick="copyAllNotes()">Copy all as text</button>
      <button class="mini" onclick="exportNotes()">\u{1F4E6} Export backup</button>
      <button class="mini" onclick="openImport()">\u{1F4E5} Import</button>
      <button class="mini danger" onclick="clearInbox()">Clear inbox</button>
    </div>
  </div>`;
}
renderNotes();

</script>
<script>
document.getElementById('sec-cardiac').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🫀</span> Assessment of Cardiac Function</h2>
<p class="intro-line">Chapter 22. Anatomy, output, heart sounds, and the labs. This chapter was missing from the old guide entirely.</p>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Preload and afterload, and the why behind the why</h3>
  <table class="lab">
    <tr><th></th><th>PRELOAD</th><th>AFTERLOAD</th></tr>
    <tr><td><b>Definition</b></td><td>The <b>volume stretching the ventricle at the end of diastole</b>, just before it contracts</td><td>The <b>resistance the ventricle must push against</b> to eject blood</td></tr>
    <tr><td><b>Think of it as</b></td><td>How <b>FULL</b> the ventricle is</td><td>How <b>HARD</b> it is to get the blood out</td></tr>
    <tr><td><b>Raised by</b></td><td><b>Fluid overload</b>, IV fluids, sodium and water retention, heart failure, kidney failure</td><td><b>Hypertension</b>, vasoconstriction (SNS, angiotensin II), <b>aortic stenosis</b></td></tr>
    <tr><td><b>Lowered by</b></td><td><b>Diuretics</b>, bleeding, dehydration, <b>nitrates</b> (venous dilation)</td><td><b>Vasodilators</b> (nitroprusside, hydralazine), ACE inhibitors and ARBs, calcium channel blockers</td></tr>
    <tr><td><b>Measured by</b></td><td>Central venous pressure, JVD, lung sounds, weight</td><td>Systemic vascular resistance, blood pressure</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The why behind the why</div><div class="big">Preload is the load BEFORE the squeeze. Afterload is what it squeezes AGAINST.</div><div class="exp">Up to a point, <b>more stretch means a stronger squeeze</b> (Frank-Starling), the way a rubber band snaps back harder the more you pull it. <b>Past that point the fibers are overstretched and the squeeze gets weaker</b>, which is exactly what happens in systolic heart failure: the chamber is stretched and thin, so the stretch is gone.</div></div>
  <div class="hy"><span class="tag">Why this explains the drugs</span><b>Nitrates dilate veins → less blood returns → lower preload → the heart does less work and chest pain eases.</b> <b>ACE inhibitors, ARBs, and nitroprusside dilate arteries → lower afterload → the ventricle ejects more easily.</b> Diuretics pull off fluid and lower preload. That is why a failing heart gets both a diuretic and a vasodilator.</div>
  <div class="trap"><span class="tag">⭐ How he can turn it</span>A client in heart failure who gets a <b>large fluid bolus</b> has <b>rising preload</b> the failing ventricle can't handle, so the fluid backs up into the lungs. A client with severe <b>hypertension</b> has <b>high afterload</b>, so the ventricle thickens over time. <b>Match the problem to the word.</b></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Angina vs MI: the difference that decides the answer</h3>
  <table class="lab">
    <tr><th></th><th>ANGINA (stable)</th><th>MYOCARDIAL INFARCTION</th></tr>
    <tr><td><b>What is happening</b></td><td><b>Ischemia:</b> temporary lack of oxygen when demand rises. <b>The muscle is starving but alive</b></td><td><b>Infarction: the artery is blocked and muscle is DYING.</b> The damage is permanent</td></tr>
    <tr><td><b>Trigger</b></td><td>Exertion, emotion, heavy meal, cold</td><td>Often at <b>rest</b>, sudden, no trigger needed</td></tr>
    <tr><td><b>Duration</b></td><td><b>Brief</b>, usually under 5 to 15 minutes</td><td><b>Longer than 20 to 30 minutes</b> and does not stop</td></tr>
    <tr><td><b>Relief</b></td><td><b>Rest and nitroglycerin relieve it</b></td><td><b>NOT relieved</b> by rest or nitroglycerin</td></tr>
    <tr><td><b>Other signs</b></td><td>Usually few</td><td><b>Diaphoresis, nausea and vomiting, dyspnea, anxiety or sense of doom</b>, pain radiating to the jaw, back, or left arm</td></tr>
    <tr><td><b>Troponin</b></td><td><b>Normal</b></td><td><b>Elevated</b></td></tr>
    <tr><td><b>ECG</b></td><td>May be normal or show transient changes</td><td><b>ST elevation (STEMI)</b> or ST depression / T inversion (NSTEMI)</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The one-line test</div><div class="big">If rest and nitro fix it, the muscle is still alive. If they don't, it is dying.</div><div class="exp">That is why the classic teaching is to call for help if chest pain is <b>not relieved after nitroglycerin</b>. <b>Unstable angina</b> sits in between: pain <b>at rest</b>, but troponin still normal.</div></div>
  <div class="hy"><span class="tag">Women, older adults, and diabetics</span>They often have <b>atypical symptoms</b>: fatigue, shortness of breath, indigestion, jaw or back pain, nausea, or no chest pain at all. Diabetics can have a <b>silent MI</b> because neuropathy blunts the pain.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ Nitrates and nitroprusside</h3>
  <table class="lab">
    <tr><th></th><th>NITROGLYCERIN (nitrate)</th><th>NITROPRUSSIDE</th></tr>
    <tr><td><b>Used for</b></td><td><b>Angina and ACS</b>; also acute heart failure</td><td><b>Hypertensive emergency</b> (IV, in the ICU)</td></tr>
    <tr><td><b>What it dilates</b></td><td>Mostly <b>VEINS → lowers PRELOAD</b>, and dilates coronary arteries</td><td><b>Both arteries and veins → lowers AFTERLOAD and preload</b>, fast</td></tr>
    <tr><td><b>Onset</b></td><td>Sublingual works in minutes</td><td><b>Immediate</b>, and stops working within minutes when turned off</td></tr>
    <tr><td><b>Monitoring</b></td><td><b>BP before and after every dose.</b> Hold for SBP under 90</td><td><b>Continuous BP monitoring</b>, usually an arterial line, in an ICU. Titrated to the target, never a rapid drop</td></tr>
    <tr><td><b>⭐ Key cautions</b></td><td><b>Never with erectile dysfunction drugs</b> (sildenafil): severe hypotension. Headache is expected. Sublingual: one dose every 5 minutes up to 3, and call 911 if pain persists</td><td><b>⭐ Cyanide and thiocyanate toxicity</b> with high doses or prolonged use, especially with kidney or liver impairment. Watch for confusion, tinnitus, blurred vision, metabolic acidosis. <b>Protect the bag and tubing from light</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The why behind the why</div><div class="big">Dilate veins, less blood comes back (preload). Dilate arteries, less to push against (afterload).</div><div class="exp">Nitroglycerin mainly unloads the <b>front end</b>, so the heart has less to pump and needs less oxygen, which is why chest pain eases. Nitroprusside opens <b>both ends</b>, which is why it can drop a hypertensive emergency fast, and why it needs second-by-second monitoring.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Anticoagulant vs thrombolytic: an important correction</h3>
  <div class="mnem"><div class="tag">⭐ They are not the same class</div><div class="big">Heparin and Coumadin PREVENT clots. Alteplase and streptokinase DISSOLVE them.</div><div class="exp"><b>Heparin and warfarin (Coumadin) are ANTICOAGULANTS.</b> They stop an existing clot from growing and stop new ones forming, while the body slowly breaks the clot down itself. <b>Thrombolytics (alteplase, streptokinase) are clot busters</b> given for a STEMI, a massive PE, or an ischemic stroke.</div></div>
  <table class="lab">
    <tr><th>Class</th><th>Drugs</th><th>What it does</th></tr>
    <tr><td><b>Anticoagulants</b></td><td>Heparin, enoxaparin, <b>warfarin (Coumadin)</b>, argatroban, apixaban</td><td><b>Prevent</b> clot growth and new clots</td></tr>
    <tr><td><b>Antiplatelets</b></td><td>Aspirin, clopidogrel</td><td><b>Keep platelets from clumping</b>; used in arterial disease such as PAD and ACS</td></tr>
    <tr><td><b>Thrombolytics</b></td><td><b>Alteplase (tPA), streptokinase</b></td><td><b>Dissolve</b> a clot that has already formed</td></tr>
  </table>
  <div class="trap"><span class="tag">If a question calls heparin a thrombolytic</span>Answer by what the drug <b>does</b>. Heparin prevents; it does not dissolve. If the stem asks what is given to <b>dissolve</b> a clot when PCI is unavailable, the answer is <b>alteplase or streptokinase</b>.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>💊 Coumadin (warfarin) med card</h3>
  <table class="lab">
    <tr><td><b>Class</b></td><td><b>Anticoagulant, vitamin K antagonist</b></td></tr>
    <tr><td><b>Action</b></td><td>Blocks vitamin K, so the liver cannot make clotting factors <b>II, VII, IX, and X</b>. <b>Takes 3 to 5 days</b> to reach full effect, which is why heparin overlaps at the start</td></tr>
    <tr><td><b>Uses</b></td><td>DVT and PE treatment and prevention, atrial fibrillation, mechanical heart valves</td></tr>
    <tr><td><b>⭐ Monitor</b></td><td><b>PT/INR, goal 2 to 3</b> (higher for some mechanical valves). Watch for bleeding: bruising, gums, nosebleeds, blood in urine or stool, severe headache</td></tr>
    <tr><td><b>⭐ Antidote</b></td><td><b>Vitamin K (phytonadione).</b> Fresh frozen plasma for serious bleeding</td></tr>
    <tr><td><b>⭐ Diet</b></td><td><b>Keep leafy green (vitamin K) intake CONSISTENT.</b> A sudden increase lowers the INR (clot risk); stopping suddenly raises it (bleeding risk)</td></tr>
    <tr><td><b>Missed dose</b></td><td><b>Take it as soon as possible the same day. Never double up.</b> If it is the next day, skip it and continue the schedule</td></tr>
    <tr><td><b>Interactions</b></td><td>Many. <b>Aspirin and NSAIDs</b> raise bleeding risk; antibiotics raise the INR; alcohol and some herbals interfere. <b>Check before adding any new drug or supplement</b></td></tr>
    <tr><td><b>Contraindications</b></td><td><b>Pregnancy</b> (teratogenic), active bleeding, severe liver disease, high fall risk needs careful review</td></tr>
    <tr><td><b>Teaching</b></td><td>Keep INR appointments · soft toothbrush and electric razor · medical alert ID · take at the <b>same time each day</b> · report unusual bleeding</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ ABI and PAD: what the number actually means</h3>
  <p class="why-chain"><b>ABI = the highest ankle systolic pressure divided by the highest brachial (arm) systolic pressure.</b> Normally the ankle pressure equals or slightly exceeds the arm, so the ratio is 1 or a little above. <b>If plaque narrows the leg arteries, the ankle pressure falls and so does the ratio.</b></p>
  <table class="lab">
    <tr><th>ABI</th><th>Meaning</th></tr>
    <tr><td><b>1.0 to 1.4</b></td><td><b>Normal</b> (his handout)</td></tr>
    <tr><td><b>0.91 to 0.99</b></td><td>Borderline</td></tr>
    <tr><td><b>0.90 or less</b></td><td><b>PAD</b></td></tr>
    <tr><td><b>0.41 to 0.90</b></td><td>Mild to moderate PAD, usually the claudication range</td></tr>
    <tr><td><b>0.40 or less</b></td><td><b>Severe PAD: rest pain, ulcers, critical limb ischemia</b></td></tr>
    <tr><td><b>Over 1.4</b></td><td><b>Falsely high</b> from calcified, non-compressible vessels, common in <b>diabetes</b> and kidney disease. Needs a different test, such as a toe-brachial index</td></tr>
  </table>
  <div class="trap"><span class="tag">⭐ The diabetic trap</span>A diabetic with stiff, calcified arteries can have an ABI <b>above 1.4 and still have severe PAD</b>, because the cuff cannot compress the vessel. <b>A high number is not reassurance in that client.</b></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Critical limb ischemia in depth</h3>
  <p class="why-chain"><b>The end stage of PAD: blood flow is so low that the tissue cannot meet its needs even at rest.</b> The limb is starving around the clock, not just during activity.</p>
  <table class="lab">
    <tr><th>Feature</th><th>Detail</th></tr>
    <tr><td><b>Rest pain</b></td><td>Burning pain in the <b>forefoot and toes</b>, <b>worse at night</b> when the legs are level with the heart and there is no muscle pump. <b>Relieved by dangling</b> the foot; many clients sleep in a chair</td></tr>
    <tr><td><b>Skin</b></td><td><b>Pallor on elevation, dependent rubor</b> when hanging down, cool and shiny skin, hair loss, thick nails</td></tr>
    <tr><td><b>Wounds</b></td><td><b>Nonhealing ulcers</b> on the toes and pressure points, <b>gangrene</b> (dry, black, mummified tissue)</td></tr>
    <tr><td><b>Pulses and ABI</b></td><td>Absent or very weak pulses; <b>ABI 0.40 or less</b></td></tr>
    <tr><td><b>Treatment</b></td><td><b>Revascularization</b>: angioplasty with stent or bypass surgery. Wound care, pain control, infection treatment, risk factor management. <b>Amputation</b> if the limb cannot be saved</td></tr>
    <tr><td><b>Nursing</b></td><td>Keep the limb <b>dependent, never elevated</b>. Protect from injury, cold, and pressure. <b>No heating pads.</b> Bed cradle to keep linens off the foot. Inspect daily and report new ulcers, color, or temperature changes. Urgent referral</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The progression in one line</div><div class="big">Claudication with walking → rest pain at night → ulcers → gangrene → limb loss</div><div class="exp">Each step means less flow. <b>Rest pain is the turning point</b> from a chronic problem to a limb at risk. Acute arterial occlusion is different and sudden: the <b>6 Ps</b> of pain, pallor, pulselessness, paresthesia, paralysis, poikilothermia (coldness), and it is an emergency.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Blood flow through the heart</h3>
  <p class="why-chain">The <b>right side</b> sends deoxygenated blood to the <b>lungs</b>. The <b>left side</b> sends oxygenated blood to the <b>body</b>. Two pumps, working at the same time.</p>
  <ol class="chainlist">
    <li><b>1. Body</b> → deoxygenated blood returns through the <b>superior and inferior vena cava</b></li>
    <li><b>2. Right atrium</b></li>
    <li><b>3. Tricuspid valve</b></li>
    <li><b>4. Right ventricle</b></li>
    <li><b>5. Pulmonic valve</b></li>
    <li><b>6. Pulmonary artery</b> → <b>lungs</b> (picks up oxygen, drops CO₂)</li>
    <li><b>7. Pulmonary veins</b> → oxygenated blood back to the heart</li>
    <li><b>8. Left atrium</b></li>
    <li><b>9. Mitral valve</b></li>
    <li><b>10. Left ventricle</b> (the thickest, most muscular chamber)</li>
    <li><b>11. Aortic valve</b></li>
    <li><b>12. Aorta</b> → <b>body</b></li>
  </ol>
  <div class="mnem"><div class="tag">⭐ Valve order</div><div class="big">"Try Pulling My Aorta" — Tricuspid, Pulmonic, Mitral, Aortic</div><div class="exp">And the chamber order: <b>right atrium, right ventricle, lungs, left atrium, left ventricle</b>. Atrium before ventricle every time.</div></div>
  <div class="trap"><span class="tag">⭐ The exception he can test</span>Arteries normally carry oxygenated blood, but the <b>pulmonary ARTERY carries DEOXYGENATED blood</b> to the lungs, and the <b>pulmonary VEINS carry OXYGENATED blood</b> back. Arteries go <b>away</b> from the heart; veins go <b>toward</b> it, whatever their oxygen.</div>
  <table class="lab">
    <tr><th>Valve type</th><th>Valves</th><th>Open during</th></tr>
    <tr><td><b>Atrioventricular (AV)</b></td><td>Tricuspid, mitral</td><td><b>Diastole</b> (ventricles filling); close in systole</td></tr>
    <tr><td><b>Semilunar</b></td><td>Pulmonic, aortic</td><td><b>Systole</b> (ventricles ejecting); close in diastole</td></tr>
  </table>
  <div class="hy"><span class="tag">Why the left ventricle is thickest</span>It pumps against the high pressure of the whole body. <b>Hypertension makes it work even harder</b>, which is why it thickens (LVH). The coronary arteries fill during <b>diastole</b>, so a fast heart rate shortens diastole and cuts the heart's own blood supply.</div>
  <div class="hy"><span class="tag">Where failure backs up</span><b>Left-sided failure</b> backs blood into the <b>lungs</b> (crackles, dyspnea, pink frothy sputum). <b>Right-sided failure</b> backs blood into the <b>body</b> (JVD, peripheral edema, liver enlargement, ascites). Follow the flow backward from the failing chamber.</div>
</div>


<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Aortic stenosis</h3>
  <p class="why-chain">The <b>aortic valve narrows and stiffens</b>, so the left ventricle must push much harder to get blood into the aorta. Common with aging and calcification. Over time the LV thickens (hypertrophy) and eventually fails.</p>
  <div class="mnem"><div class="tag">⭐ The classic triad</div><div class="big">Angina · Syncope · Dyspnea (heart failure)</div><div class="exp"><b>Angina</b>: the thick muscle needs more oxygen than the coronaries deliver. <b>Syncope</b>, often with exertion: output can't rise to meet demand. <b>Dyspnea</b>: pressure backs up into the lungs as the LV fails.</div></div>
  <table class="lab">
    <tr><td><b>Murmur</b></td><td><b>Systolic</b> crescendo-decrescendo murmur heard best at the <b>right second intercostal space</b> (aortic area), often <b>radiating to the carotids</b></td></tr>
    <tr><td><b>Other findings</b></td><td>Narrow pulse pressure, weak and delayed carotid pulse, fatigue, activity intolerance</td></tr>
    <tr><td><b>Nursing</b></td><td>Activity as tolerated with rest periods, fall precautions for syncope, report chest pain or fainting. Definitive treatment is <b>valve replacement</b></td></tr>
  </table>
  <div class="trap"><span class="tag">Why it connects to hypertension</span>Both make the <b>left ventricle push against high resistance</b>, so both cause LV hypertrophy and can lead to heart failure.</div>
</div>

<div class="card" style="border-color:var(--blue)">
  <h3>⭐ Pulse assessment: compare both sides</h3>
  <p class="why-chain"><b>Always compare pulses bilaterally.</b> A pulse that is weaker on one side points to a blockage on that side, which is how PAD and arterial occlusion are picked up at the bedside.</p>
  <table class="lab">
    <tr><th>Grade</th><th>Meaning</th></tr>
    <tr><td><b>0</b></td><td>Absent, not palpable</td></tr>
    <tr><td><b>1+</b></td><td>Weak, diminished, easily obliterated</td></tr>
    <tr><td><b>2+</b></td><td><b>Normal</b></td></tr>
    <tr><td><b>3+</b></td><td>Increased, full</td></tr>
    <tr><td><b>4+</b></td><td>Bounding</td></tr>
  </table>
  <ul class="clean">
    <li>Use the <b>pads of two or three fingers</b>, not the thumb, which has its own pulse.</li>
    <li>Check <b>radial, brachial, femoral, popliteal, dorsalis pedis, and posterior tibial</b> as indicated, left against right.</li>
    <li><b>Never palpate both carotids at once</b>, which can drop the heart rate and blood flow to the brain.</li>
    <li>If a pulse can't be felt, use a <b>Doppler</b> and mark the spot for the next assessment.</li>
    <li>Pair pulses with <b>color, temperature, capillary refill, and sensation</b>.</li>
  </ul>
</div>

<div class="card">
  <h3>Hemodynamics</h3>
  <table class="lab">
    <tr><th>Term</th><th>Definition</th></tr>
    <tr><td><b>Cardiac output</b></td><td><b>Heart rate × stroke volume.</b> Normal 4–8 L/min</td></tr>
    <tr><td><b>Stroke volume</b></td><td>Blood ejected per beat. Determined by preload, afterload, and contractility</td></tr>
    <tr><td><b>Preload</b></td><td>Volume returning to the heart — the stretch before contraction</td></tr>
    <tr><td><b>Afterload</b></td><td>The <b>resistance the ventricle must overcome</b> to eject</td></tr>
    <tr><td><b>Contractility</b></td><td>The force of the squeeze, independent of stretch</td></tr>
    <tr><td><b>Ejection fraction</b></td><td>Percent of ventricular volume ejected. Normal 55–70%</td></tr>
  </table>
  <div class="hy"><span class="tag">Connect it to drugs</span><b>Nitroglycerin lowers preload</b> (venodilation). <b>ACE inhibitors and ARBs lower afterload</b> (arterial dilation). <b>Digoxin raises contractility.</b> <b>Beta blockers lower rate and contractility.</b></div>
</div>

<div class="card">
  <h3>Assessment findings</h3>
  <table class="lab">
    <tr><th>Finding</th><th>Meaning</th></tr>
    <tr><td><b>S3</b></td><td>Early diastolic gallop. Normal in the young; in adults suggests <b>heart failure / volume overload</b></td></tr>
    <tr><td><b>S4</b></td><td>Late diastolic. Stiff, noncompliant ventricle — hypertension, ischemia</td></tr>
    <tr><td><b>Murmur</b></td><td>Turbulent flow through a narrowed or leaking valve</td></tr>
    <tr><td><b>Pericardial friction rub</b></td><td>Pericarditis. Scratchy, best heard leaning forward</td></tr>
    <tr><td><b>Pulse pressure</b></td><td>Systolic minus diastolic. Normal 30–40. Narrow suggests low output</td></tr>
    <tr><td><b>Orthostatic hypotension</b></td><td>Systolic drop ≥20 or diastolic drop ≥10 on standing, often with a rise in heart rate</td></tr>
    <tr><td><b>Clubbing</b></td><td>Chronic hypoxia</td></tr>
    <tr><td><b>Capillary refill</b></td><td>Under 3 seconds is adequate perfusion</td></tr>
  </table>
</div>

<div class="card">
  <h3>Labs and diagnostics</h3>
  <table class="lab">
    <tr><th>Test</th><th>What it tells you</th></tr>
    <tr><td><b>Troponin</b></td><td>Most specific marker of myocardial injury. Rises in hours, stays elevated for days. <b>A normal early troponin does not rule out an MI</b></td></tr>
    <tr><td><b>BNP</b></td><td>Released when the ventricle stretches. Elevated in <b>heart failure and volume overload</b></td></tr>
    <tr><td><b>Lipid panel</b></td><td>Fasting preferred — recent fat intake transiently raises triglycerides. Want LDL low, HDL high</td></tr>
    <tr><td><b>Homocysteine</b></td><td>Damages the endothelial lining and promotes thrombus formation</td></tr>
    <tr><td><b>Cardiac catheterization</b></td><td>Check <b>iodine and shellfish allergy</b>, renal function. Contrast is <b>nephrotoxic</b> — hydrate, hold metformin. After: bed rest, keep the leg straight, monitor the site and distal pulses</td></tr>
    <tr><td><b>Exercise stress test</b></td><td><b>Hold beta blockers</b> — they blunt the heart rate response the test depends on</td></tr>
    <tr><td><b>TEE</b></td><td>Transducer sits in the esophagus, closer to the heart, avoiding chest wall and lung interference. NPO, sedation, gag reflex must return before eating</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--muted)">
  <h3>📚 ECG and cardiac monitoring (Ch 22)</h3>
  <table class="lab">
    <tr><td><b>What an ECG is</b></td><td>A recording of the heart's <b>electrical activity</b> from electrodes on the chest and limbs</td></tr>
    <tr><td><b>What a 12-lead shows</b></td><td><b>Dysrhythmias</b>, conduction problems, <b>chamber enlargement</b> (such as LVH from hypertension), and <b>ischemia, injury, and infarction</b>. It can also suggest effects of <b>electrolyte imbalances</b> and antiarrhythmic drugs. 15- and 18-lead ECGs help detect specific infarctions earlier</td></tr>
    <tr><td><b>Continuous monitoring</b></td><td>Standard for clients at high risk for dysrhythmias. Hardwire monitoring or <b>telemetry</b> tracks rate, rhythm, and <b>ST segments</b> for ischemia, with alarms and rhythm strips</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — afterload vs preload</span><b>Preload is the volume coming in. Afterload is the resistance going out.</b> He offers each as the other's definition.</div>
  <div class="trap"><span class="tag">Trap 2 — tachycardia framed as helpful</span>"A faster rate increases coronary blood flow" sounds reasonable. It does the opposite — <b>coronaries fill in diastole</b>, which tachycardia shortens.</div>
  <div class="trap"><span class="tag">Trap 3 — the normal early troponin</span>It takes hours to rise. A normal value drawn early <b>does not rule out</b> an MI.</div>
  <div class="trap"><span class="tag">Trap 4 — contrast in renal impairment</span>Contrast is nephrotoxic. Hydrate, check creatinine, and <b>hold metformin for 48 hours</b>.</div>
  <div class="trap"><span class="tag">Trap 5 — S3 dismissed</span>An S3 in an adult suggests <b>volume overload and heart failure</b>, not a benign variant.</div>
</div>

<div id="q-cardiac"></div>
`;

document.getElementById('sec-female').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🌸</span> Female Physiologic Processes</h2>
<p class="intro-line">Chapter 51. The cycle, menopause, screening, and the sensitive-history topics he tests as therapeutic communication.</p>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ Numbers and wording from his revised handout</h3>
  <table class="lab">
    <tr><th>Item</th><th>His version</th></tr>
    <tr><td><b>Ovulation</b></td><td>The <b>periodic discharge of a matured ovum</b>. Begins at puberty, about <b>ages 11 to 13</b></td></tr>
    <tr><td><b>Menstrual cycle length</b></td><td><b>28 days</b>, with a normal variation of <b>24 to 38 days</b></td></tr>
    <tr><td><b>Cycle signs</b></td><td><b>Cramps, bloating, headache, fatigue, mood swings, breast tenderness</b></td></tr>
    <tr><td><b>⭐ Perimenopause</b></td><td><b>About 4 to 10 years</b> of fluctuating symptoms leading up to menopause, with periods becoming irregular and spaced farther apart</td></tr>
    <tr><td><b>Menopause</b></td><td><b>12 consecutive months without a menstrual period</b>; marks the end of reproductive capacity</td></tr>
    <tr><td><b>⭐ Menopause signs</b></td><td><b>Trouble sleeping · fatigue · BRAIN FOG · anxiety · mood swings · vaginal dryness · urinary changes · JOINT AND MUSCLE ACHES · hot flashes and night sweats · irregular periods · weight gain</b></td></tr>
    <tr><td><b>Treatment</b></td><td>Keep the bedroom <b>cool with a fan</b> · reduce stress · <b>avoid caffeine and alcohol</b> · exercise regularly · <b>light clothing</b> · maintain a healthy weight · <b>stop smoking</b> · <b>calcium and vitamin D</b> to reduce the risk of coronary syndrome and osteoporosis</td></tr>
    <tr><td><b>⭐ Breast self-exam</b></td><td>His wording: <b>begin after the first menses</b>. Monthly, right after the period ends</td></tr>
  </table>
  <div class="trap"><span class="tag">⭐ Note on his HRT wording</span>His handout says hormone replacement <b>helps symptoms, protects bone health, and reduces cardiovascular risks</b>, with <b>cautions in women with a history of breast cancer, clotting problems, hypertension, or smoking</b>, and lists <b>vitamin and herbal supplements</b> as alternatives. <b>Answer it his way.</b> Worth knowing: current evidence is mixed on the cardiovascular part, since starting HRT late after menopause can <b>raise</b> clot and stroke risk, which is why it is given at the lowest dose for the shortest time.</div>
</div>


<div class="card" style="border-color:var(--teal)">
  <h3>⭐ His advanced question: estrogen loss and cardiovascular risk</h3>
  <p class="why-chain">Before menopause, estrogen <b>protects the heart</b>: it keeps HDL up and LDL down, helps vessels dilate, and keeps vessel walls flexible. When estrogen falls, all three protections go.</p>
  <ol class="chainlist">
    <li><b>1. Lipids shift:</b> LDL and triglycerides rise, HDL falls, so plaque builds faster.</li>
    <li><b>2. Vessels stiffen</b> and dilate less, so <b>blood pressure rises</b>.</li>
    <li><b>3. Fat redistributes</b> to the abdomen, raising insulin resistance and metabolic syndrome risk.</li>
    <li><b>4. Bone loss accelerates</b> at the same time, because estrogen also slows bone breakdown.</li>
    <li><b>Result:</b> after menopause a woman's cardiovascular risk climbs toward a man's, and <b>heart disease becomes the leading cause of death in women</b>.</li>
  </ol>
  <div class="hy"><span class="tag">Nursing interventions for the transition</span><b>Screen</b> blood pressure, lipids, and glucose · <b>weight-bearing exercise</b> plus <b>calcium and vitamin D</b> and a bone density scan as recommended · heart-healthy diet · <b>smoking cessation</b>, which matters even more now · manage symptoms (layered clothing, cooling, avoid caffeine, alcohol, and spicy triggers) · discuss <b>HRT</b> honestly: it helps bone and symptoms, but raises <b>breast cancer and clot risk</b>, so it is the lowest dose for the shortest time · teach that <b>women's MI symptoms are often atypical</b>: fatigue, nausea, jaw or back pain, shortness of breath.</div>
</div>



<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Signs that go with the menstrual cycle</h3>
  <table class="lab">
    <tr><th>Sign</th><th>The why behind it</th></tr>
    <tr><td><b>Cramps (dysmenorrhea)</b></td><td><b>Prostaglandins</b> released by the shedding lining make the uterus contract to expel it. More prostaglandin means stronger cramps. That is why <b>NSAIDs work</b>: they block prostaglandin production, and work best <b>started at the first sign</b></td></tr>
    <tr><td><b>Bloating</b></td><td>Hormone shifts cause <b>sodium and water retention</b></td></tr>
    <tr><td><b>Food cravings</b></td><td>Shifts in estrogen and progesterone affect serotonin and appetite</td></tr>
    <tr><td><b>Mood swings and irritability</b></td><td>Falling estrogen and progesterone affect <b>serotonin</b>. Severe forms are PMS and PMDD</td></tr>
    <tr><td><b>Headache</b></td><td>The <b>drop in estrogen</b> before menses triggers migraines in some women</td></tr>
    <tr><td><b>Fatigue</b></td><td>Hormone changes plus <b>blood loss</b>; heavy bleeding can cause iron deficiency anemia</td></tr>
    <tr><td><b>Breast tenderness</b></td><td>Hormones cause fluid retention and swelling of breast tissue, usually in the <b>second half</b> of the cycle</td></tr>
  </table>
  <div class="hy"><span class="tag">Self-care to teach</span>Heat to the abdomen · <b>NSAIDs at the first sign</b> of cramping · regular exercise · limit salt and caffeine · adequate sleep · track the cycle. <b>Report</b> bleeding that soaks a pad an hour, cycles under 21 or over 35 days, severe pain that stops daily activity, or bleeding between periods.</div>
  <div class="trap"><span class="tag">When cramps are not normal</span>Pain that is <b>severe, worsening, or comes with pain during intercourse or bowel movements</b> suggests <b>endometriosis</b> rather than ordinary dysmenorrhea.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ Perimenopause and menopause: the stages</h3>
  <table class="lab">
    <tr><th>Stage</th><th>What is happening</th></tr>
    <tr><td><b>1. Premenopause</b></td><td>Regular cycles, normal ovarian function</td></tr>
    <tr><td><b>2. Perimenopause</b></td><td><b>The transition, about 4 to 10 years per his handout, usually starting in the 40s.</b> Estrogen fluctuates and falls, cycles become <b>irregular</b>, and symptoms begin. <b>Pregnancy is still possible</b>, so contraception is still needed</td></tr>
    <tr><td><b>3. Menopause</b></td><td><b>Defined looking backward: 12 consecutive months without a period</b>, with no other cause. Average age is about <b>51</b></td></tr>
    <tr><td><b>4. Postmenopause</b></td><td>All the years after. Symptoms often ease, but the <b>long-term effects of low estrogen</b> continue</td></tr>
  </table>
  <table class="lab">
    <tr><th>Symptoms</th><th>Long-term risks of low estrogen</th></tr>
    <tr><td><b>Hot flashes and night sweats</b> (vasomotor) · <b>irregular then absent periods</b> · <b>vaginal dryness</b> and painful intercourse · sleep problems · mood changes · decreased libido · urinary urgency and more UTIs · thinning hair and skin</td><td><b>OSTEOPOROSIS</b> (estrogen protects bone, so loss speeds up) · <b>cardiovascular disease</b> (risk rises toward that of men) · genitourinary changes</td></tr>
  </table>
  <div class="hy"><span class="tag">Management</span>Layered clothing and fans, avoid triggers (caffeine, alcohol, spicy food, heat) · <b>weight-bearing exercise, calcium, and vitamin D</b> for bone · vaginal moisturizers or lubricants, topical estrogen · <b>HRT</b> at the lowest dose for the shortest time, weighing clot, stroke, and breast cancer risk. <b>Any bleeding after menopause is abnormal and must be evaluated</b> for endometrial cancer.</div>
  <div class="mnem"><div class="tag">⭐ The rule he can test</div><div class="big">Menopause is confirmed only after 12 months with no period</div><div class="exp">Before that it is <b>perimenopause</b>, and she can still get pregnant.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Pelvic inflammatory disease in depth</h3>
  <p class="why-chain"><b>Infection that travels UP from the vagina and cervix into the uterus, fallopian tubes, and ovaries.</b> Usually from untreated <b>chlamydia or gonorrhea</b>, sometimes after a procedure that opens the cervix.</p>
  <table class="lab">
    <tr><td><b>Risk factors</b></td><td>Untreated STI · multiple partners or a new partner · unprotected sex · age under 25 · <b>douching</b> (pushes bacteria upward) · IUD insertion (small, short-term risk) · previous PID</td></tr>
    <tr><td><b>Signs</b></td><td><b>Lower abdominal and pelvic pain</b> (the most common) · <b>foul-smelling discharge</b> · fever and chills · <b>pain with intercourse</b> · painful urination · irregular bleeding · <b>cervical motion tenderness</b> ("chandelier sign") on exam · nausea</td></tr>
    <tr><td><b>Diagnosis</b></td><td>Pelvic exam with cervical motion tenderness · cultures or NAAT for chlamydia and gonorrhea · elevated <b>WBC, ESR, CRP</b> · pelvic ultrasound · <b>pregnancy test</b> to rule out ectopic</td></tr>
    <tr><td><b>Treatment</b></td><td><b>Broad-spectrum antibiotics covering both organisms</b>, started promptly · pain control · <b>semi-Fowler position</b> to keep drainage dependent · no intercourse until treatment is complete · <b>treat all partners</b> · remove tampons and avoid douching · hospitalize for severe illness, pregnancy, abscess, or failure to improve</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ What untreated PID leads to</div><div class="big">Scarring of the tubes: infertility, ectopic pregnancy, chronic pelvic pain</div><div class="exp">Infection inflames the tubes, and healing leaves <b>scar tissue and adhesions</b>. A scarred tube can block an egg entirely (<b>infertility</b>) or trap a fertilized egg on the way down (<b>ectopic pregnancy</b>, which is life-threatening). Adhesions cause <b>chronic pelvic pain</b>, and infection can wall off into a <b>tubo-ovarian abscess</b> or spread to the peritoneum.</div></div>
  <div class="trap"><span class="tag">⭐ PID and endometriosis are not the same thing</span>These sound alike and get mixed up. <b>PID is an INFECTION</b> that can cause <b>endometritis</b> (infection of the uterine lining) and adhesions. <b>ENDOMETRIOSIS is not an infection</b>: it is <b>endometrial tissue growing OUTSIDE the uterus</b>, which bleeds with each cycle and causes scarring. <b>Both end in the same three complications: chronic pelvic pain, adhesions, and infertility</b>, which is why they are easy to confuse.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ Endometriosis</h3>
  <table class="lab">
    <tr><td><b>What it is</b></td><td><b>Endometrial tissue growing outside the uterus</b>, on the ovaries, tubes, ligaments, bowel, or bladder. It <b>responds to the same hormones</b>, so it thickens and bleeds every cycle with nowhere for the blood to go, causing inflammation, scarring, and adhesions</td></tr>
    <tr><td><b>Classic signs</b></td><td><b>Pain that worsens with the cycle</b> · <b>severe dysmenorrhea</b> · <b>deep pain with intercourse (dyspareunia)</b> · painful bowel movements or urination during menses · <b>infertility</b> · heavy or irregular bleeding. <b>Symptom severity does not match the amount of tissue</b></td></tr>
    <tr><td><b>Diagnosis</b></td><td>History and pelvic exam, ultrasound. <b>Laparoscopy with visualization is the definitive diagnosis</b></td></tr>
    <tr><td><b>Treatment</b></td><td><b>NSAIDs</b> for pain · hormonal suppression (combined contraceptives, progestins, GnRH agonists) to stop the cycling · <b>laparoscopic removal</b> of lesions · hysterectomy with oophorectomy as a last resort. Fertility counseling</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Syphilis: the signs and the rules he emphasized</h3>
  <table class="lab">
    <tr><th>Stage</th><th>What it looks like</th></tr>
    <tr><td><b>Primary</b></td><td>A <b>single, PAINLESS chancre</b> (ulcer) at the site of entry, about 3 weeks after exposure. <b>It heals on its own</b>, which is why people think they are better and never get treated</td></tr>
    <tr><td><b>⭐ Secondary</b></td><td><b>A widespread rash that classically appears on the PALMS OF THE HANDS AND SOLES OF THE FEET</b>, which almost no other rash does. Also fever, sore throat, swollen lymph nodes, patchy hair loss, and wart-like lesions in moist areas. <b>Highly contagious at this stage</b></td></tr>
    <tr><td><b>Latent</b></td><td>No symptoms, but the infection is still present and can still be passed to a fetus</td></tr>
    <tr><td><b>Tertiary</b></td><td>Years later: damage to the <b>heart, blood vessels, brain, nerves, bones</b>. Neurosyphilis can occur at any stage</td></tr>
  </table>
  <table class="lab">
    <tr><td><b>Diagnosis</b></td><td>Screening with <b>RPR or VDRL</b>, confirmed with a treponemal test (FTA-ABS)</td></tr>
    <tr><td><b>Treatment</b></td><td><b>Penicillin G</b> (benzathine, IM). Penicillin allergy in pregnancy means <b>desensitization</b>, because penicillin is the only reliable treatment. Watch for the <b>Jarisch-Herxheimer reaction</b> in the first 24 hours: fever, chills, headache, muscle aches as organisms die off. It is expected and treated supportively</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The three rules he stressed for every STI</div><div class="big">1. Rash on palms and soles means syphilis · 2. TREAT THE PARTNER, not just the client · 3. NO intercourse during treatment</div><div class="exp">Treating only the client guarantees <b>reinfection</b> when they go back to an untreated partner, a cycle called <b>ping-pong infection</b>. Abstaining during treatment protects the partner and prevents reinfection. Most STIs are also <b>reportable to public health</b>, and partner notification is part of care.</div></div>
  <div class="hy"><span class="tag">Why syphilis is called the great imitator</span>It can mimic many diseases at different stages. <b>A painless sore or a rash on the palms and soles in a sexually active client should always raise the question.</b> Screening in pregnancy matters because untreated syphilis crosses the placenta and causes <b>congenital syphilis</b>.</div>
</div>


<div class="card">
  <h3>The menstrual cycle</h3>
  <ul class="clean">
    <li><b>Follicular phase</b> (day 1 to ovulation): FSH matures a follicle, estrogen rises and rebuilds the endometrium.</li>
    <li><b>Ovulation:</b> an LH surge releases the ovum. Occurs about <b>14 days before the NEXT period</b>, not 14 days after the last one.</li>
    <li><b>Luteal phase:</b> the corpus luteum makes progesterone, which maintains the endometrium. Without fertilization it degenerates, hormones fall, and menses begins.</li>
    <li><b>Menopause:</b> 12 consecutive months without a period. Estrogen decline brings hot flashes, vaginal dryness, sleep disturbance, and — long term — <b>osteoporosis and rising cardiovascular risk</b>.</li>
    <li><b>Weight-bearing exercise, calcium, and vitamin D</b> protect bone density once estrogen falls.</li>
  </ul>
  <div class="trap"><span class="tag">The counting trap</span>Ovulation is estimated <b>backward from the next expected period</b>. "Always day 14 regardless of cycle length" fails the moment he gives a 35-day cycle.</div>
</div>

<div class="card">
  <h3>Screening and diagnostics</h3>
  <table class="lab">
    <tr><th>Test</th><th>What it does</th></tr>
    <tr><td><b>Pap smear</b></td><td><b>Screens</b> for cervical cellular changes. Not an STI test and not an ovarian test</td></tr>
    <tr><td><b>Colposcopy</b></td><td>Direct visualization of the cervix, usually <b>after an abnormal Pap</b>, to identify biopsy sites</td></tr>
    <tr><td><b>LEEP / cone biopsy</b></td><td>Removes abnormal cervical tissue for diagnosis and treatment</td></tr>
    <tr><td><b>Endometrial biopsy</b></td><td>Evaluates abnormal uterine bleeding</td></tr>
    <tr><td><b>Laparoscopy</b></td><td>Direct pelvic visualization. Expect <b>shoulder pain</b> afterward from residual CO₂</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>Sensitive history topics — how the questions are written</h3>
  <ul class="clean">
    <li><b>Intimate partner violence screening</b> is a <b>routine part of comprehensive assessment</b>, done privately and without the partner present. Not reserved for visibly injured patients.</li>
    <li><b>Patients with disabilities</b> get <b>individualized positioning and accommodation</b>. Skipping the exam or assuming a standard position is never correct.</li>
    <li><b>Sexual history</b> is taken with open-ended, non-assuming questions. Do not assume orientation, partners, or practices.</li>
    <li><b>Female genital cutting</b> requires a nonjudgmental approach with attention to physical findings and cultural context.</li>
    <li>The right answer in this whole category <b>asks openly, individualizes, and avoids assumptions.</b></li>
  </ul>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — counting ovulation forward</span>Backward from the <b>next</b> expected period, about 14 days prior.</div>
  <div class="trap"><span class="tag">Trap 2 — the Pap as an STI test</span>A Pap screens for <b>cervical cellular changes</b>. It does not diagnose STIs or evaluate the ovaries.</div>
  <div class="trap"><span class="tag">Trap 3 — screening called optional</span>Options that call IPV screening unnecessary, inappropriate, or only for injured patients are all wrong.</div>
  <div class="trap"><span class="tag">Trap 4 — skipping care because of disability</span>Declining the exam or skipping the sexual health assessment is never the answer. Individualize instead.</div>
</div>

<div id="q-female"></div>`;

<script>
/* ===== LISTEN MODE — hands-free audio study ===== */
(function(){
if(!('speechSynthesis' in window)) return;

let lsQueue=[], lsIdx=0, lsPlaying=false, lsRate=1, lsVoice=null, lsWake=null, lsUtter=null, lsAuto=true;
try{ lsRate=parseFloat(localStorage.getItem('listen_rate')||'1')||1; }catch(e){}
try{ lsAuto=localStorage.getItem('listen_auto')!=='0'; }catch(e){}

/* ---- turn a card into speakable prose ---- */
function speakable(el){
  const parts=[];
  const walk=(node)=>{
    if(node.nodeType===3){ const t=node.textContent.replace(/\s+/g,' '); if(t.trim()) parts.push(t); return; }
    if(node.nodeType!==1) return;
    const tag=node.tagName;
    if(tag==='BUTTON'||tag==='INPUT'||tag==='TEXTAREA'||tag==='SCRIPT'||tag==='STYLE') return;
    if(node.classList && node.classList.contains('listen-skip')) return;
    if(tag==='TABLE'){
      const rows=[...node.querySelectorAll('tr')];
      let heads=[];
      rows.forEach((r,ri)=>{
        const th=[...r.querySelectorAll('th')];
        if(th.length){ heads=th.map(c=>clean(c.textContent)); return; }
        const tds=[...r.querySelectorAll('td')].map(c=>clean(c.textContent));
        if(!tds.length) return;
        if(tds.length===1){ parts.push(tds[0]+'. '); return; }
        if(heads.length>=2 && tds.length===heads.length){
          parts.push(tds[0]+'. ');
          for(let i=1;i<tds.length;i++) if(tds[i]) parts.push(heads[i]+': '+tds[i]+'. ');
        } else {
          parts.push(tds[0]+'. ');
          for(let i=1;i<tds.length;i++) if(tds[i]) parts.push(tds[i]+'. ');
        }
      });
      parts.push(' ');
      return;
    }
    if(tag==='LI'){ [...node.childNodes].forEach(walk); parts.push('. '); return; }
    if(tag==='H2'||tag==='H3'||tag==='H4'||tag==='P'||tag==='DIV'){
      [...node.childNodes].forEach(walk); parts.push('. '); return;
    }
    [...node.childNodes].forEach(walk);
  };
  walk(el);
  return clean(parts.join(' '));
}
function clean(s){
  return s
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}]/gu,' ')
    .replace(/\u2192/g,' leads to ')
    .replace(/\u2191/g,' increased ').replace(/\u2193/g,' decreased ')
    .replace(/\u2265/g,' greater than or equal to ').replace(/\u2264/g,' less than or equal to ')
    .replace(/&gt;|>/g,' greater than ').replace(/&lt;|</g,' less than ')
    .replace(/\u00b7/g,'. ').replace(/\u2014|\u2013/g,', ')
    .replace(/(\s*\.){2,}/g,'.').replace(/\(\s+/g,'(').replace(/\s+\)/g,')')
    .replace(/\s+/g,' ')
    .replace(/\s+([.,;:])/g,'$1')
    .trim();
}

/* ---- build the playlist from the visible section ---- */
function buildQueue(){
  const sec=document.querySelector('.section.active') || document.querySelector('[id^="sec-"]:not([style*="none"])');
  if(!sec) return [];
  const out=[];
  const title=sec.querySelector('.sec-title');
  const intro=sec.querySelector('.intro-line');
  let opener='';
  if(title) opener+=clean(title.textContent)+'. ';
  if(intro) opener+=clean(intro.textContent);
  if(opener.trim()) out.push({el:title||sec, text:opener, label:'Introduction'});
  sec.querySelectorAll(':scope > .card, :scope > .tipbar, :scope > .hy, :scope > .mnem').forEach(c=>{
    const t=speakable(c);
    if(t && t.length>25){
      const h=c.querySelector('h3');
      out.push({el:c, text:t, label:h?clean(h.textContent).slice(0,44):'Note'});
    }
  });
  return out;
}

/* ---- speech ---- */
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  if(!vs.length) return null;
  let saved=null; try{ saved=localStorage.getItem('listen_voice'); }catch(e){}
  return vs.find(v=>v.name===saved)
      || vs.find(v=>/Samantha|Karen|Moira|Google US English|Microsoft Aria/i.test(v.name))
      || vs.find(v=>v.localService) || vs[0];
}
function chunk(text){
  const out=[]; let buf='';
  text.split(/(?<=[.!?])\s+/).forEach(s=>{
    if((buf+' '+s).length>190){ if(buf) out.push(buf.trim()); buf=s; } else buf+=' '+s;
  });
  if(buf.trim()) out.push(buf.trim());
  return out.length?out:[text];
}
function speakItem(i){
  speechSynthesis.cancel();
  if(i<0||i>=lsQueue.length){ stop(); return; }
  lsIdx=i;
  highlight();
  renderBar();
  const pieces=chunk(lsQueue[i].text);
  let p=0;
  const next=()=>{
    if(!lsPlaying) return;
    if(p>=pieces.length){
      if(lsAuto && lsIdx+1<lsQueue.length) return speakItem(lsIdx+1);
      stop(true); return;
    }
    const u=new SpeechSynthesisUtterance(pieces[p++]);
    try{ u.rate=lsRate; }catch(e){}
    try{ if(lsVoice) u.voice=lsVoice; }catch(e){ lsVoice=null; }
    u.onend=next;
    u.onerror=()=>{ if(lsPlaying) next(); };
    lsUtter=u;
    try{ speechSynthesis.speak(u); }catch(e){ next(); }
  };
  next();
}
function highlight(){
  document.querySelectorAll('.listen-now').forEach(e=>e.classList.remove('listen-now'));
  const el=lsQueue[lsIdx] && lsQueue[lsIdx].el;
  if(el){ el.classList.add('listen-now'); el.scrollIntoView({behavior:'smooth',block:'center'}); }
}
async function wakeOn(){
  try{ if('wakeLock' in navigator && !lsWake) lsWake=await navigator.wakeLock.request('screen'); }catch(e){}
}
function wakeOff(){ try{ if(lsWake){ lsWake.release(); lsWake=null; } }catch(e){} }

function start(){
  lsQueue=buildQueue();
  if(!lsQueue.length){ if(typeof toast==='function') toast('Nothing to read in this section'); return; }
  lsVoice=pickVoice();
  lsPlaying=true; wakeOn(); openBar(); speakItem(0);
}
function stop(finished){
  lsPlaying=false; speechSynthesis.cancel(); wakeOff();
  document.querySelectorAll('.listen-now').forEach(e=>e.classList.remove('listen-now'));
  if(finished && typeof toast==='function') toast('Section finished');
  renderBar();
}
function toggle(){
  if(!lsPlaying){
    if(!lsQueue.length) return start();
    lsPlaying=true; wakeOn(); speakItem(lsIdx);
  } else stop();
}
function jump(d){
  const n=lsIdx+d;
  if(n<0||n>=lsQueue.length) return;
  if(!lsPlaying){ lsPlaying=true; wakeOn(); }
  speakItem(n);
}
function setRate(r){
  lsRate=r; try{ localStorage.setItem('listen_rate',String(r)); }catch(e){}
  if(lsPlaying) speakItem(lsIdx); else renderBar();
}
function toggleAuto(){
  lsAuto=!lsAuto; try{ localStorage.setItem('listen_auto', lsAuto?'1':'0'); }catch(e){}
  renderBar();
}

/* ---- UI ---- */
function openBar(){
  if(document.getElementById('listenBar')) return renderBar();
  const bar=document.createElement('div');
  bar.id='listenBar';
  document.body.appendChild(bar);
  renderBar();
}
function closeBar(){ stop(); const b=document.getElementById('listenBar'); if(b) b.remove(); lsQueue=[]; lsIdx=0; }
function renderBar(){
  const bar=document.getElementById('listenBar'); if(!bar) return;
  const cur=lsQueue[lsIdx];
  bar.innerHTML=
    '<div class="lb-top"><span class="lb-lab">'+(cur?('<b>'+(lsIdx+1)+' of '+lsQueue.length+'</b> \u00b7 '+cur.label):'Ready')+'</span>'
    +'<button class="lb-x" onclick="listenClose()" aria-label="Close listen mode">\u2715</button></div>'
    +'<div class="lb-row">'
    +'<button class="lb-btn" onclick="listenJump(-1)" aria-label="Previous">\u23ee</button>'
    +'<button class="lb-btn lb-main" onclick="listenToggle()" aria-label="Play or pause">'+(lsPlaying?'\u23f8':'\u25b6')+'</button>'
    +'<button class="lb-btn" onclick="listenJump(1)" aria-label="Next">\u23ed</button>'
    +'<span class="lb-sp">'
      +[0.8,1,1.25,1.5].map(r=>'<button class="lb-rate'+(Math.abs(lsRate-r)<0.01?' on':'')+'" onclick="listenRate('+r+')">'+r+'\u00d7</button>').join('')
    +'</span>'
    +'<button class="lb-rate'+(lsAuto?' on':'')+'" onclick="listenAuto()" title="Continue to the next card automatically">Auto</button>'
    +'</div>';
}
window.listenStart=start; window.listenToggle=toggle; window.listenJump=jump;

<p class="intro-line">Everything memorizable for Exam 4 on one page. <b>He weights it about 60% hypertension and PVD, 40% reproductive</b>, and the quiz below is drawn the same way.</p>

<div class="card" style="border-color:var(--purple)">

<div class="card" style="border-color:var(--red)">
  <h3>🫀 Blood flow and the heart</h3>
  <ul class="clean">
    <li><b>Vena cava → RA → tricuspid → RV → pulmonic → pulmonary artery → lungs → pulmonary veins → LA → mitral → LV → aortic → aorta → body.</b> Valves: <b>Try Pulling My Aorta.</b></li>
    <li><b>Pulmonary artery carries DEOXYGENATED blood.</b> Arteries go away from the heart, veins toward it.</li>
    <li><b>Left failure backs into the lungs</b> (crackles, dyspnea). <b>Right failure backs into the body</b> (JVD, edema).</li>
    <li><b>Small vessel narrowing = big pressure rise.</b> Halve the radius, resistance rises about 16×.</li>
    <li><b>Fast HR in HF makes it worse</b>: shorter diastole, less filling and coronary flow, more O₂ demand.</li>
    <li><b>Diastolic HF: stiff and thick, can't fill</b> (preserved EF). <b>Systolic HF: thin and stretched, can't pump</b> (low EF, more lethal).</li>
    <li><b>Pulses: compare both sides.</b> 2+ normal, 1+ weak, 0 absent.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>📈 Hypertension</h3>
  <table class="lab">
    <tr><td><b>Normal</b></td><td>&lt;120 <b>and</b> &lt;80</td><td><b>Stage 1</b></td><td>130–139 <b>or</b> 80–89</td></tr>
    <tr><td><b>Elevated</b></td><td>120–129 <b>and</b> &lt;80</td><td><b>Stage 2</b></td><td>≥140 <b>or</b> ≥90</td></tr>
  </table>
  <ul class="clean">
    <li><b>The worse number decides the stage.</b> 128/84 = Stage 1.</li>
    <li><b>Primary</b> = no known cause, 90 to 95%. <b>Secondary</b> = caused by another disease; sudden, young, severe, or resistant.</li>
    <li><b>Causes:</b> SNS (stress keeps it on) · renal Na/Cl/water retention · RAAS · less vasodilation · insulin resistance (thick blood) · immune inflammation.</li>
    <li><b>RAAS:</b> renin → angiotensin I → ACE → <b>angiotensin II</b> (vasoconstricts, triggers <b>aldosterone</b> → kidneys hold Na and water).</li>
    <li><b>ACE-I (-pril) stops angiotensin II being MADE</b>, causes cough. <b>ARB (-sartan) stops it WORKING</b>, no cough. Both: ↑K⁺, protect kidneys, no pregnancy.</li>
    <li><b>Target organs:</b> kidneys (↓urine, edema, ↑BUN/Cr) · heart (angina, tachycardia, HF) · brain (stroke, headache, dizziness) · eyes (retinopathy).</li>
    <li><b>Workup:</b> UA, blood chemistry, 12-lead ECG, echo, BNP (ventricular stretch from volume).</li>
    <li><b>Treatment:</b> <b>3 months lifestyle first</b> (weight loss, DASH/Mediterranean, exercise, less alcohol, no smoking) → <b>thiazide</b> → ACE/ARB → CCB. Black clients: thiazide or CCB. <b>Older adults: start low, go slow, simplify.</b></li>
    <li><b>Emergency = target organ damage. Urgency = none</b>, often missed meds, controlled over 24 to 48 hr.</li>
    <li><b>Stroke: BE FAST</b> — Balance, Eyes, Face, Arms, Speech, Time.</li>
    <li><b>BP technique:</b> cuff at heart level, arm supported, feet flat, rest 5 min, no caffeine or smoking 30 min. <b>Small cuff reads high.</b> First sound systolic, sounds stop diastolic.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>💔 ACS</h3>
  <ul class="clean">
    <li><b>Goal: prevent future MIs</b> with meds and lifestyle.</li>
    <li><b>ST elevation = fully blocked artery (STEMI)</b>, reperfuse fast. NSTEMI: troponin up, no ST elevation. Unstable angina: troponin normal.</li>
    <li><b>Troponin I</b> most specific, repeat it. <b>CK-MB</b> rises and falls fast (reinfarction). <b>Lipid panel</b> after 12-hr fast. <b>12-lead ECG</b> within 10 min.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🦵 Peripheral vascular disease</h3>
  <ul class="clean">
    <li><b>PVD is the umbrella: arterial + venous + lymphatic.</b> Damage can occur in all three.</li>
    <li><b>PAD main causes: hypertension and atherosclerosis.</b> Same risk factors as PVD; <b>PVD adds DVT and immobility.</b></li>
    <li><b>PAD = PAINS:</b> Pressure up, Absent hair, Intermittent claudication, No pulse, Skin cool. <b>Punched-out</b> toe ulcer. <b>DANGLE</b> (DR. EP: dangle rubor, elevate pale). No compression. ABI is the PAD test.</li>
    <li><b>Claudication</b> = pain with walking, relieved by rest. <b>Critical limb ischemia</b> = pain at rest, worse at night, relieved by dangling, ulcers, gangrene.</li>
    <li><b>Calf pain → femoral/popliteal. Hip/buttock → aorta/iliac.</b></li>
    <li><b>Venous = WIPED:</b> Warm/brown, Itching, Prolonged standing pain, Edema, Dull ache. <b>Irregular</b> ankle ulcer. <b>ELEVATE</b>, compression stockings (on in the morning).</li>
    <li><b>Lymphedema:</b> pitting early, firm later, no diuretics. <b>Lymphangitis:</b> red streaks up the limb.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>🩸 DVT, PE, and anticoagulants</h3>
  <ul class="clean">
    <li><b>Virchow's triad:</b> endothelial damage · stasis · hypercoagulability.</li>
    <li><b>DVT:</b> one swollen, warm, tender leg. <b>D-dimer</b> rules out; <b>duplex</b> confirms. <b>Never massage.</b></li>
    <li><b>PE path:</b> leg vein → vena cava → right heart → pulmonary artery. <b>Sudden dyspnea, chest pain, tachycardia, low SpO₂</b> → stay, HOB up, O₂, call for help. CT pulmonary angiogram confirms.</li>
    <li><b>Treatment choice:</b> clot severity · overall health · bleeding risk · resources.</li>
    <li><b>Heparin:</b> aPTT, <b>platelets (HIT)</b>, weight, bleeding; antidote protamine. <b>Argatroban</b> if HIT.</li>
    <li><b>Coumadin:</b> INR 2 to 3; antidote vitamin K; <b>consistent leafy greens</b>; missed dose same day, <b>never double</b>. Overlaps with heparin until INR therapeutic.</li>
    <li><b>Apixaban:</b> oral factor Xa inhibitor, no routine INR.</li>
    <li><b>Bleeding precautions:</b> soft toothbrush, electric razor, no NSAIDs, report tarry stools.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>🚹 Male reproductive</h3>
  <ul class="clean">
    <li><b>BPH:</b> the prostate surrounds the urethra, enlarges, and squeezes it shut. Risks: aging, <b>smoking, heavy alcohol, obesity, Western diet</b>.</li>
    <li><b>Signs:</b> frequency, urgency, <b>nocturia</b>, decreased stream, hesitancy, dribbling, incomplete emptying, pelvic discomfort, anorexia, <b>azotemia</b>.</li>
    <li><b>⭐ The chain:</b> incomplete emptying → <b>UTI → stones → reflux → hydronephrosis → azotemia</b> → renal failure.</li>
    <li><b>DRE:</b> BPH is <b>smooth, firm, symmetric</b>. Cancer is <b>hard, fixed, irregular</b>. <b>Draw the PSA BEFORE the DRE.</b></li>
    <li><b>Alpha blockers (-osin)</b> relax smooth muscle, work in days, cause <b>orthostatic hypotension</b>. <b>Finasteride</b> shrinks the prostate, takes 3 to 6 months, <b>lowers PSA</b>, and pregnant women must not handle it. <b>TURP</b> for severe cases: pink-tinged urine is expected, <b>bright red with clots is reported</b>.</li>
    <li><b>Testicles</b> make <b>sperm and testosterone</b>, and sit outside the body because sperm need a cooler temperature.</li>

    <li><b>Phimosis</b> is a foreskin too tight to retract. <b>Paraphimosis</b> is one stuck retracted, a <b>urologic emergency</b>. <b>Always return the foreskin</b> after cleaning or catheterizing.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🚺 Female reproductive</h3>
  <ul class="clean">
    <li><b>Ovulation</b> is the release of a matured ovum, beginning at puberty (<b>11 to 13</b>). Cycle <b>28 days, normal 24 to 38</b>.</li>
    <li><b>Cycle signs:</b> cramps, bloating, headache, fatigue, mood swings, breast tenderness, cravings. <b>Cramps are prostaglandins</b>, so NSAIDs at the <b>first sign</b>.</li>
    <li><b>Ovaries</b> make <b>ova plus estrogen and progesterone</b>.</li>
    <li><b>Perimenopause</b> about <b>4 to 10 years</b>, irregular periods, and she <b>can still get pregnant</b>. <b>Menopause = 12 consecutive months with no period.</b> Signs: hot flashes, night sweats, trouble sleeping, <b>brain fog</b>, anxiety, vaginal dryness, urinary changes, <b>joint and muscle aches</b>, weight gain.</li>
    <li><b>After menopause</b> low estrogen raises <b>osteoporosis and cardiovascular risk</b>. Stop smoking, exercise, <b>calcium and vitamin D</b>. <b>Any bleeding after menopause is abnormal.</b></li>
    <li><b>HRT</b> in his wording: helps symptoms, protects bone, reduces cardiovascular risk. <b>Caution with a history of breast cancer, clotting problems, hypertension, or smoking.</b></li>
    <li><b>Hysterectomy:</b> recovery takes <b>months</b>, <b>no sex for 4 to 6 weeks</b>, grief and body image are real. <b>Oophorectomy causes immediate menopause.</b></li>

    <li><b>Cervical cancer prevention:</b> stop smoking, safe sex, <b>HPV vaccine</b>.</li>

  </ul>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>🦠 PID, endometriosis, and STIs</h3>
  <ul class="clean">
    <li><b>PID</b> is infection traveling <b>up</b> from the cervix, usually untreated <b>chlamydia or gonorrhea</b>. Pain, foul discharge, fever, <b>cervical motion tenderness</b>. It leads to <b>infertility, ectopic pregnancy, chronic pelvic pain, and tubo-ovarian abscess</b>.</li>

    <li><b>Chlamydia</b> is often silent with dysuria and thick white-yellow discharge. <b>Gonorrhea</b> causes white, yellow, or green discharge, with <b>resistant strains rising</b>. <b>Trichomoniasis</b> is frothy yellow-green, treated with <b>metronidazole</b>. <b>Candidiasis</b> is white and <b>cottage cheese</b> like.</li>
    <li><b>⭐ Every STI:</b> <b>treat the partner</b>, <b>no intercourse during treatment</b>, and most are <b>reportable</b>.</li>
  </ul>
</div>

  <ul class="clean">
    <li><b>PLISSIT:</b> <b>P</b>ermission (open the topic) → <b>LI</b>mited Information (facts) → <b>SS</b>pecific Suggestions (strategies) → <b>I</b>ntensive <b>T</b>herapy (<b>refer</b>). Most nurses work at the first two.</li>

    <li><b>Clinical judgment:</b> recognize cues → analyze cues → prioritize hypotheses → generate solutions → take action → evaluate outcomes.</li>
    <li><b>Prioritize with ABCs.</b> When every option looks right, pick <b>the one that kills or harms fastest</b>. His exception: <b>catastrophic bleeding first</b>.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--teal)">
