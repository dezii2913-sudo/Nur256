<h2 class="sec-title"><span class="sec-emoji">🚨</span> Acute Respiratory</h2>
<p class="intro-line">Chapters 19 and 20 — pneumonia, PE, ARDS, pleural problems, airway management and chest tubes. The emergencies.</p>

<div class="jumpbar">In this section: <a href="#respacute-pneumonia" onclick="jumpTo(event,'respacute-pneumonia')">Pneumonia</a> <a href="#respacute-acutepeard" onclick="jumpTo(event,'respacute-acutepeard')">Acute / PE / ARDS</a> <a href="#respacute-airway" onclick="jumpTo(event,'respacute-airway')">Airway</a> <a href="#respacute-chesttubes" onclick="jumpTo(event,'respacute-chesttubes')">Chest Tubes</a></div>

<div class="grphead" id="respacute-pneumonia"><h3>Pneumonia</h3><p class="grp-sub">Your professor flagged "pneumonia assessment findings" as a guaranteed test point. Plus the VAP bundle.</p></div>
<div class="card">
  <h3>📚 Pneumonia — the four types and the 48-hour rule</h3>
  <p class="why-chain">Infection and inflammation of the lung parenchyma. Exudate fills the alveoli, so the affected area is <b>consolidated</b> — solid rather than air-filled. That is a <b>shunt</b>: blood flows past alveoli that hold no air, which is why oxygen alone doesn't fully correct it.</p>
  <table class="lab">
    <tr><th>Type</th><th>Definition</th><th>Why it matters</th></tr>
    <tr><td><b>CAP</b> (community-acquired)</td><td>Onset in the community <b>OR within the first 48 hours</b> of admission</td><td>Usually <i>Streptococcus pneumoniae</i>. Generally susceptible organisms</td></tr>
    <tr><td><b>HCAP</b> (healthcare-associated)</td><td>Recent healthcare contact — dialysis, infusion center, long-term care</td><td>Often <b>multidrug-resistant organisms</b></td></tr>
    <tr><td><b>HAP</b> (hospital-acquired)</td><td><b>≥48 hours AFTER admission</b>, not incubating at admit</td><td>Higher mortality. Resistant organisms including MRSA and <i>Pseudomonas</i></td></tr>
    <tr><td><b>VAP</b> (ventilator-associated)</td><td><b>≥48 hours after intubation</b></td><td>Largely <b>preventable</b> — which is why the bundle exists</td></tr>
  </table>
  <div class="mnem"><div class="tag">The rule that sorts them</div><div class="big">48 HOURS is the dividing line</div><div class="exp">Before 48 hours after admission it came from the community. After 48 hours the hospital gave it to them.</div></div>
</div>

<div class="card">
  <h3>🔎 Assessment findings — high yield</h3>
  <table class="lab">
    <tr><th>Finding</th><th>Why</th></tr>
    <tr><td><b>Fever, chills, rigors</b></td><td>Systemic infection response</td></tr>
    <tr><td><b>Productive cough</b> — rust-colored, purulent, or blood-tinged</td><td>Exudate in the alveoli. Rust-colored classically suggests pneumococcus</td></tr>
    <tr><td><b>Pleuritic chest pain</b></td><td>Inflammation extending to the pleura. Worse on inspiration</td></tr>
    <tr><td><b>Dyspnea, tachypnea, tachycardia</b></td><td>Impaired gas exchange plus fever driving demand</td></tr>
    <tr><td><b>⭐ Crackles</b> over the affected area</td><td>Air moving through fluid-filled alveoli</td></tr>
    <tr><td><b>⭐ Dull percussion</b></td><td><b>Consolidation</b> — solid tissue rather than air</td></tr>
    <tr><td><b>⭐ INCREASED tactile fremitus</b></td><td>Solid tissue transmits vibration <b>better</b> than air. This is what separates consolidation from an effusion</td></tr>
    <tr><td><b>⭐ Egophony</b> — "E" sounds like "A"</td><td>Consolidation changes sound transmission</td></tr>
    <tr><td><b>Bronchial breath sounds</b> over the periphery</td><td>Consolidation conducts central airway sounds outward</td></tr>
    <tr><td><b>Whispered pectoriloquy</b></td><td>Whispered words heard unusually clearly</td></tr>
    <tr><td>Use of accessory muscles, low O₂ saturation</td><td>Increased work of breathing</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Consolidation vs effusion</div><div class="big">BOTH dull. Consolidation RAISES fremitus. Effusion LOWERS it.</div><div class="exp">Fremitus is the discriminator, and he builds questions on exactly that.</div></div>
</div>

<div class="card">
  <h3>🩺 Diagnosis and treatment</h3>
  <ul class="clean">
    <li><b>Chest x-ray</b> confirms — infiltrates or consolidation. <b>CBC</b> shows leukocytosis. <b>Sputum culture and blood cultures BEFORE antibiotics.</b> ABG or pulse oximetry for gas exchange.</li>
    <li><b>⭐ Cultures first, then antibiotics.</b> Once the first dose is in, the culture may not grow the organism and you lose the ability to narrow therapy.</li>
    <li><b>Antibiotics</b> — empiric broad-spectrum initially, narrowed once the culture returns. <b>Complete the full course</b> even after feeling better.</li>
    <li><b>Oxygen</b> titrated to saturation. <b>Hydration 2–3 L/day</b> unless contraindicated — thins secretions so they can be cleared.</li>
    <li><b>Incentive spirometry, turn-cough-deep-breathe, early ambulation.</b> Position with the <b>good lung down</b> to optimize perfusion to the better-ventilated side.</li>
    <li><b>Antipyretics and analgesics</b> — pain control matters because splinting prevents the deep breathing that clears the infection.</li>
    <li><b>Nutrition:</b> small frequent high-calorie meals. Fever and the work of breathing raise caloric demand substantially.</li>
    <li><b>Prevention:</b> pneumococcal and annual influenza vaccination, smoking cessation, hand hygiene, oral care, mobility.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🛡️ The VAP bundle — he said know this</h3>
  <ol class="chainlist">
    <li><b>1. Head of bed elevated 30–45°</b> — gravity keeps gastric contents and secretions out of the airway.</li>
    <li><b>2. Daily sedation interruption and daily assessment of extubation readiness</b> — the fastest way to prevent VAP is to remove the tube sooner.</li>
    <li><b>3. Oral care with chlorhexidine</b> — the mouth is the reservoir that seeds the lungs.</li>
    <li><b>4. Peptic ulcer disease prophylaxis.</b></li>
    <li><b>5. DVT prophylaxis.</b></li>
    <li><b>6.</b> Subglottic suctioning and maintaining <b>cuff pressure</b> where available.</li>
  </ol>
  <div class="hy"><span class="tag">Why the last two are in a lung bundle</span>They aren't about the lungs — they're about <b>the whole ventilated patient</b>. The bundle is scored as all-or-nothing, which is why they travel together.</div>
</div>

<div class="card">
  <h3>🫗 Aspiration pneumonia</h3>
  <table class="lab">
    <tr><th>Risk factors</th><th>Prevention</th></tr>
    <tr><td><b>Impaired swallow</b> (stroke, neuromuscular disease) · <b>decreased level of consciousness</b> · sedation · <b>tube feeding</b> · GERD · intubation or recent extubation · absent gag reflex</td><td><b>Head of bed 30–45° during and 30–60 minutes after feeding</b> · <b>swallow evaluation before oral intake</b> in at-risk patients · thickened liquids if ordered · small bites, chin-tuck · <b>check residuals and tube placement</b> · oral care · avoid oversedation</td></tr>
  </table>
  <ul class="clean">
    <li><b>Chemical pneumonitis</b> from acidic gastric contents can occur within hours, before any infection develops.</li>
    <li>Classically affects the <b>right lower lobe</b> — the right mainstem bronchus is wider and more vertical.</li>
    <li><b>Signs of aspiration:</b> sudden coughing or choking during feeding, wet or gurgly voice, drooling, food pocketing, unexplained fever, new crackles.</li>
  </ul>
  <div class="trap"><span class="tag">The silent one</span><b>Silent aspiration</b> produces no cough at all — common after stroke. A patient who "tolerates" feeding without coughing is not proof of a safe swallow. That is why the <b>formal swallow evaluation</b> is the answer, not observation.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ Enteral feeding and gastric residuals — the practice has changed</h3>
  <p class="why-chain">He spent time on this because the evidence moved and older textbooks still teach the old way.</p>
  <table class="lab">
    <tr><th>Old practice</th><th>Current practice</th></tr>
    <tr><td>Check residual volumes <b>frequently</b>, often every 1–2 hours</td><td><b>Check about every 4 hours</b></td></tr>
    <tr><td><b>Discard</b> what you aspirate</td><td><b>Return the aspirated contents</b> — discarding throws away <b>electrolytes and nutrition</b></td></tr>
    <tr><td><b>Hold the feeding</b> at a set residual threshold</td><td>A high residual alone is <b>not automatically a reason to stop</b>. Assess the patient — distention, nausea, vomiting, discomfort. Much of a high residual is simply <b>absorbed physiologically</b></td></tr>
  </table>
  <ul class="clean">
    <li><b>⭐ Bolus feeding carries a higher aspiration risk</b> than continuous feeding — a large volume delivered fast.</li>
    <li><b>Head of bed 30–45°</b> during feeding and for <b>30–60 minutes after</b>.</li>
    <li><b>Verify tube placement</b> before each feeding or medication.</li>
    <li><b>Swallow study before oral intake</b> in stroke patients, and <b>reassess swallowing after extubation</b> — the tube leaves the throat swollen and desensitized.</li>
  </ul>
  <div class="trap"><span class="tag">Why airway protection is the whole point</span>Aspiration of a large volume can obstruct the airway and cause <b>cardiac arrest</b>. Highest risk: <b>stroke, decreased level of consciousness, alcohol or drug intoxication, severe asthma, sedation, recent extubation</b>. <b>Silent aspiration produces no cough at all</b> — which is why a formal swallow evaluation beats watching the patient eat.</div>
</div>

<div class="card">
  <h3>⚠️ Complications of pneumonia</h3>
  <table class="lab">
    <tr><th>Complication</th><th>What to watch for</th></tr>
    <tr><td><b>Pleural effusion</b></td><td>Dyspnea, dull percussion, <b>decreased</b> fremitus and breath sounds</td></tr>
    <tr><td><b>Empyema</b></td><td>Pus in the pleural space. <b>Persistent fever despite antibiotics</b> — needs drainage, not just more antibiotics</td></tr>
    <tr><td><b>Sepsis and septic shock</b></td><td>Hypotension, tachycardia, altered mental status, rising lactate, falling urine output</td></tr>
    <tr><td><b>Acute respiratory failure / ARDS</b></td><td><b>Refractory hypoxemia</b> — saturation that will not improve with oxygen</td></tr>
    <tr><td><b>Atelectasis</b></td><td>From splinting, secretions, and immobility</td></tr>
    <tr><td><b>Lung abscess</b></td><td><b>Foul-smelling sputum</b>, often after aspiration</td></tr>
  </table>
  <div class="trap"><span class="tag">The fever that won't break</span>A pneumonia patient on appropriate antibiotics whose <b>fever persists past 48–72 hours</b> is not simply "slow to respond." Suspect <b>empyema, abscess, resistant organism, or a complication</b> — the answer involves reimaging and reassessment, not waiting.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the afebrile older adult</span>New confusion with no fever. "Normal aging," "sundowning," and "anxiety" are all offered and all sound like something a nurse would say. Mental status change <b>is</b> the presentation.</div>
  <div class="trap"><span class="tag">Trap 2 — pain relief withheld</span>A post-op patient who will not cough because of pain, with an option to hold the opioid. Pain is what is <b>causing</b> the atelectasis. Medicate first, then do pulmonary hygiene.</div>
  <div class="trap"><span class="tag">Trap 3 — sputum color as the whole answer</span><b>Rust-colored</b> points to strep pneumoniae, <b>foul-smelling</b> to anaerobes or abscess. He mixes the two.</div>
  <div class="trap"><span class="tag">Trap 4 — which finding to report</span>Yellow sputum and a 100.6 temp are expected in pneumonia. A <b>weak thready pulse with a falling BP</b> is sepsis. Rank by what kills fastest.</div>
</div>
<div class="card" style="border-color:var(--red)">
  <h3>⭐ Gerontologic considerations in pneumonia</h3>
  <ul class="clean">
    <li>An older adult may present with <b>confusion and NO fever</b>. Aging blunts the febrile response, so a normal temperature proves nothing.</li>
    <li>Other atypical presentations: <b>new falls, decreased appetite, generalized weakness, worsening of a chronic condition</b>.</li>
    <li>Higher risk from <b>reduced cough and gag reflexes, decreased lung elasticity, poor nutrition, and comorbidities</b>.</li>
    <li><b>Prevention:</b> pneumococcal and influenza vaccination, oral care, upright positioning for meals, mobility, swallow evaluation when indicated.</li>
  </ul>
  <div class="trap"><span class="tag">The classic stem</span>An 80-year-old brought in for <b>"new confusion"</b> with a normal temperature. <b>Suspect pneumonia or a UTI</b>, not dementia. Options that attribute it to age or dementia are the trap.</div>
</div>


<div class="grphead" id="respacute-acutepeard"><h3>Acute Chest &amp; Lower Respiratory Disorders</h3><p class="grp-sub">Atelectasis, Acute Tracheobronchitis, Acute Respiratory Failure & ARDS.</p></div>
<div class="card">
  <h3>🎈 Atelectasis — collapsed alveoli</h3>
  <p class="why-chain">Alveoli collapse when they aren't inflated, when secretions plug the airway feeding them, or when something compresses them from outside. Collapsed alveoli hold no air but still receive blood — another <b>shunt</b>.</p>
  <table class="lab">
    <tr><th>Type</th><th>Cause</th></tr>
    <tr><td><b>Obstructive</b> (most common)</td><td>A mucus plug or tumor blocks the airway; the trapped air is absorbed and the alveoli collapse</td></tr>
    <tr><td><b>Compressive</b></td><td>Pleural effusion, pneumothorax, tumor, or abdominal distention pressing on lung tissue</td></tr>
    <tr><td><b>Hypoventilation</b></td><td>Shallow breathing from pain, sedation, immobility, or obesity</td></tr>
  </table>
  <ul class="clean">
    <li><b>⭐ The most common cause of fever in the first 24–48 hours after surgery.</b> Infection-related fevers arrive <b>after day 3</b> — that timing is how he separates them.</li>
    <li><b>Signs:</b> ↑respiratory rate and heart rate, dyspnea, cough, <b>diminished breath sounds and crackles</b> over the area, <b>dull percussion</b>, falling oxygen saturation. A large area shifts the trachea <b>toward</b> the collapse.</li>
    <li><b>Prevention IS the treatment:</b> <b>incentive spirometer</b> every hour while awake, turn-cough-deep-breathe, <b>early ambulation</b>, splinting the incision, and <b>adequate pain control so they will actually do it</b>.</li>
    <li>Also: hydration to thin secretions, position changes, chest physiotherapy, suctioning if needed, and treating the underlying cause.</li>
  </ul>
  <div class="trap"><span class="tag">The trap</span>A postop patient who won't deep breathe because of pain, with an option to <b>hold the opioid</b>. <b>Pain is what is causing the atelectasis.</b> Medicate first, then do the pulmonary hygiene.</div>
  <div class="hy"><span class="tag">Trachea direction</span><b>Atelectasis pulls the trachea TOWARD</b> the affected side (lost volume). <b>Tension pneumothorax pushes it AWAY</b> (added pressure). One word separates two very different emergencies.</div>
</div>

<div class="card">
  <h3>🗣️ Acute tracheobronchitis</h3>
  <ul class="clean">
    <li><b>Inflammation of the trachea and bronchi</b>, usually following an upper respiratory infection. Often viral, sometimes bacterial.</li>
    <li><b>Signs:</b> dry irritating cough progressing to <b>mucopurulent sputum</b>, low-grade fever, sternal soreness, fatigue, and <b>wheezes or rhonchi</b> on auscultation.</li>
    <li><b>Treatment:</b> largely supportive — <b>increased fluids</b>, humidification, rest, antipyretics, expectorants. Antibiotics only if bacterial.</li>
    <li><b>Why it matters:</b> it can <b>progress to pneumonia</b>, especially in older adults and those with COPD. Suctioning may be needed if secretions can't be cleared.</li>
  </ul>
  <div class="hy"><span class="tag">Nursing focus</span>Secretion clearance. <b>Hydration is the intervention</b> — you cannot expectorate what you cannot thin. Encourage fluids, humidify, and reposition frequently.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🆘 Acute Respiratory Failure</h3>
  <div class="mnem"><div class="tag">⭐ The defining numbers</div><div class="big">PaO₂ under 60 · PaCO₂ over 50 with acidosis · SpO₂ below 90%</div><div class="exp">Sometimes called the 50/50 rule. <b>Hypoxemia = PaO₂ under 60. Hypercapnia = PaCO₂ over 50 WITH acidosis (pH under 7.35).</b> Patients describe it as <b>air hunger — "like a fish out of water"</b>, and you will see <b>gasping</b>. Failure means the lungs can no longer maintain gas exchange.</div></div>
  <table class="lab">
    <tr><th>Type</th><th>Problem</th><th>Causes</th></tr>
    <tr><td><b>Hypoxemic (Type I)</b></td><td><b>Oxygenation</b> fails. Low PaO₂ with normal or low CO₂</td><td>Pneumonia, ARDS, pulmonary edema, PE, atelectasis</td></tr>
    <tr><td><b>Hypercapnic (Type II)</b></td><td><b>Ventilation</b> fails. Rising CO₂ with acidosis</td><td>COPD exacerbation, oversedation or opioid overdose, neuromuscular disease, chest wall injury</td></tr>
  </table>
  <ul class="clean">
    <li><b>Early signs:</b> <b>restlessness, agitation, anxiety</b>, tachypnea, tachycardia, hypertension, use of accessory muscles.</li>
    <li><b>Late signs:</b> <b>confusion, somnolence, bradycardia, hypotension, cyanosis</b> — and a <b>slowing respiratory rate</b> in a struggling patient is ominous, not reassuring.</li>
    <li><b>Management:</b> oxygen, treat the underlying cause, <b>BiPAP or CPAP</b> for many, <b>intubation and mechanical ventilation</b> if noninvasive support fails, bronchodilators, and correcting the acidosis.</li>
  </ul>
  <div class="trap"><span class="tag">⭐ The two that look like calm</span>A patient who becomes <b>quiet, drowsy, or whose respiratory rate falls</b> after being agitated and tachypneic is <b>decompensating</b>, not settling. Sedating them is how you lose them.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>💥 ARDS — Acute Respiratory Distress Syndrome</h3>
  <p class="why-chain">A severe inflammatory injury to the <b>alveolar-capillary membrane</b>. The membrane becomes leaky, protein-rich fluid floods the alveoli, and <b>surfactant is destroyed</b> — so alveoli collapse and will not reinflate.</p>
  <ol class="chainlist">
    <li><b>1.</b> An insult — <b>sepsis (most common)</b>, aspiration, trauma, pancreatitis, massive transfusion, near-drowning, inhalation injury.</li>
    <li><b>2.</b> Systemic inflammation damages the <b>alveolar-capillary membrane</b>.</li>
    <li><b>3.</b> Fluid and protein leak into the alveoli — <b>noncardiogenic pulmonary edema</b>.</li>
    <li><b>4.</b> Surfactant is destroyed, so alveoli collapse and <b>compliance falls</b> — stiff lungs, hard to inflate.</li>
    <li><b>5.</b> Blood flows past flooded, collapsed alveoli — a massive <b>shunt</b>.</li>
    <li><b>6.</b> <b>⭐ Because it is a shunt, oxygen cannot fix it. That is REFRACTORY HYPOXEMIA — the hallmark.</b></li>
  </ol>
  <table class="lab">
    <tr><th>Feature</th><th>Detail</th></tr>
    <tr><td><b>Hallmark</b></td><td><b>Refractory hypoxemia</b> — saturation stays low despite increasing FiO₂</td></tr>
    <tr><td><b>Timing</b></td><td>Within <b>1 week</b> of a known insult</td></tr>
    <tr><td><b>Chest x-ray</b></td><td><b>Bilateral infiltrates — "white-out"</b></td></tr>
    <tr><td><b>Not cardiac</b></td><td>Not explained by heart failure or volume overload. That is what makes the edema <b>noncardiogenic</b></td></tr>
    <tr><td><b>Compliance</b></td><td><b>DECREASED</b> — stiff lungs. Opposite of emphysema</td></tr>
    <tr><td><b>Management</b></td><td>Mechanical ventilation with <b>low tidal volume</b> and <b>PEEP</b> to hold alveoli open · <b>prone positioning</b> · treat the underlying cause · sedation, sometimes paralytics · conservative fluids · nutrition</td></tr>
  </table>
  <div class="hy"><span class="tag">Why PEEP and prone positioning</span><b>PEEP</b> holds alveoli open at the end of expiration so they don't collapse and have to be reopened with every breath. <b>Prone positioning</b> redistributes blood flow and lung inflation to better-ventilated areas, improving the V/Q match.</div>
  <div class="trap"><span class="tag">The give-away</span>If a stem says the saturation <b>did not improve on 100% oxygen</b>, that is a <b>shunt</b> — think ARDS. And do not call the infiltrates heart failure: <b>ARDS edema is noncardiogenic</b>.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — ARDS defined by the wrong feature</span>The hallmark is <b>refractory hypoxemia</b> — it does not improve with oxygen. "Hypoxemia that improves with oxygen" is offered as the near-miss.</div>
  <div class="trap"><span class="tag">Trap 2 — the direction of tracheal deviation</span>In a <b>tension</b> pneumothorax the trachea deviates <b>AWAY</b> from the affected side. Both directions appear as options.</div>
  <div class="trap"><span class="tag">Trap 3 — first action versus first finding</span>Suspected PE: "obtain a CT" and "assess the calf" are both correct eventually. The <b>first action</b> is the independent one you can do now — raise the head of the bed and oxygenate.</div>
  <div class="trap"><span class="tag">Trap 4 — post-op fever timing</span>Fever in the first 24 to 48 hours is <b>atelectasis</b>. Infection fevers arrive after day 3.</div>
</div>
<div class="card" style="border-color:var(--amber)">
  <h3>⭐ BNP — telling ARDS apart from heart failure</h3>
  <p class="why-chain">ARDS and cardiogenic pulmonary edema look nearly identical: dyspnea, hypoxemia, crackles, bilateral infiltrates on the chest x-ray. <b>BNP is how you separate them.</b></p>
  <table class="lab">
    <tr><th></th><th>ARDS</th><th>Heart failure / fluid overload</th></tr>
    <tr><td><b>BNP</b></td><td><b>LOW or normal</b></td><td><b>ELEVATED</b></td></tr>
    <tr><td><b>Why</b></td><td>The heart is not the problem — the <b>alveolar-capillary membrane</b> is leaking. <b>Noncardiogenic</b> edema</td><td>Stretched ventricles release BNP. <b>Cardiogenic</b> edema</td></tr>
    <tr><td><b>Response to oxygen</b></td><td><b>Refractory hypoxemia</b> — does not improve</td><td>Improves with oxygen and diuresis</td></tr>
    <tr><td><b>Treatment</b></td><td>Low tidal volume ventilation, <b>PEEP</b>, <b>prone positioning</b>, treat the trigger</td><td><b>Diuretics</b>, upright position, oxygen, afterload reduction</td></tr>
  </table>
  <div class="mnem"><div class="tag">The one-liner</div><div class="big">LOW BNP + refractory hypoxemia = ARDS. HIGH BNP = the heart.</div><div class="exp">Diuresing an ARDS patient because you assumed heart failure does not fix the leak — and a fluid-overloaded patient does not need prone positioning.</div></div>
  <div class="hy"><span class="tag">⭐ Why prone positioning works in ARDS</span>The <b>posterior lung</b> holds more alveoli and, lying supine, is compressed by the weight of the heart and abdominal contents while still receiving most of the blood flow. Turning the patient <b>prone</b> lets those alveoli reopen and <b>matches ventilation to perfusion</b>. Done in scheduled blocks, often around <b>12 hours</b> at a time, sometimes with paralytics so the patient does not fight the ventilator.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>💥 Chest trauma</h3>
  <table class="lab">
    <tr><th>Injury</th><th>Why it matters</th><th>Nursing focus</th></tr>
    <tr><td><b>⭐ Upper rib fractures (top 3) · penetrating trauma</b></td><td><b>High mortality — they bleed out quickly.</b> It takes enormous force to break them, and the <b>subclavian vessels and aorta</b> sit right there. A severed major vessel <b>exsanguinates rapidly</b></td><td>Suspect major vascular injury. Watch for signs of <b>hemorrhagic shock</b></td></tr>
    <tr><td><b>Lower rib fractures</b></td><td>Risk of <b>liver and spleen</b> injury underneath</td><td>Abdominal assessment, watch for internal bleeding</td></tr>
    <tr><td><b>Flail chest</b></td><td>Two or more ribs broken in two or more places → that segment moves <b>paradoxically</b> (in on inspiration, out on expiration)</td><td>Oxygen, pain control so they will breathe, positioning, often ventilation</td></tr>
    <tr><td><b>Pulmonary contusion</b></td><td><b>Bruised lung</b> from blunt trauma. Damaged vessels leak into alveoli and <b>gas exchange fails</b>. Often worsens over 24–48 hours</td><td>Monitor closely even if initially stable. Oxygen, careful fluids, pain control</td></tr>
    <tr><td><b>Hemothorax</b></td><td><b>Blood</b> in the pleural space. Compresses the lung and represents lost circulating volume</td><td><b>Chest tube placed LOW</b>, monitor output. <b>Over 100 mL/hr — notify immediately</b></td></tr>
    <tr><td><b>Tension pneumothorax</b></td><td>Air enters and cannot escape; pressure compresses heart and vessels</td><td><b>Tracheal deviation AWAY</b>, absent sounds, hypotension. <b>Needle decompression, then chest tube</b></td></tr>
  </table>
  <div class="trap"><span class="tag">Pain control is the intervention</span>A patient with rib fractures who splints because it hurts develops <b>atelectasis and pneumonia</b>. <b>Medicate, then do pulmonary hygiene.</b> Never strap or bind the chest — it restricts expansion.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🩸 Shock and MODS</h3>
  <ul class="clean">
    <li><b>MODS = Multiple Organ Dysfunction Syndrome</b> — the end stage of untreated shock, where organ systems fail in sequence.</li>
    <li><b>⭐ Mortality climbs with each organ that fails.</b> That is why he emphasized <b>preventing complications</b> rather than treating them — once the second and third organ go, survival drops sharply.</li>
    <li><b>Hemorrhagic shock signs:</b> <b>hypotension, tachycardia</b>, narrowing pulse pressure, cool clammy skin, <b>restlessness then confusion</b>, falling urine output.</li>
  </ul>
  <table class="lab">
    <tr><th>Resuscitation</th><th>Detail</th></tr>
    <tr><td><b>⭐ Blood loss is replaced with BLOOD</b></td><td>Crystalloids are a <b>temporary stabilizing measure</b> — they carry no oxygen and only about a third stays in the vessel. For hemorrhagic volume loss, <b>blood products are the priority</b></td></tr>
    <tr><td><b>Crystalloids</b></td><td>0.9% NS or LR while blood is being prepared. Remember the <b>3:1 rule</b></td></tr>
    <tr><td><b>Colloids</b></td><td>Stay in the vessel and pull fluid in. Less volume for the same effect</td></tr>
  </table>
  <div class="hy"><span class="tag">The link back to acid-base</span>Shock means tissues are perfusing poorly → anaerobic metabolism → <b>lactic acid</b> → <b>metabolic acidosis</b> with a low pH and low bicarbonate. A falling pH in a trauma patient is a <b>perfusion</b> problem until proven otherwise.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ VTE, DVT, and thrombolytics <span class="pill">he flagged this</span></h3>
  <p class="why-chain"><b>VTE = venous thromboembolism</b>, the umbrella term. A <b>DVT</b> is the clot in the leg; a <b>PE</b> is that clot after it breaks loose and travels to the lung. Same disease, two locations.</p>
  <table class="lab">
    <tr><th>Topic</th><th>Detail</th></tr>
    <tr><td><b>DVT signs</b></td><td>Unilateral <b>calf pain, swelling, warmth, redness</b>, a palpable cord. Often <b>silent</b> — the first sign can be the PE itself</td></tr>
    <tr><td><b>Virchow's triad</b></td><td><b>Venous stasis</b> (immobility, surgery, long travel) · <b>hypercoagulability</b> (cancer, pregnancy, oral contraceptives, dehydration) · <b>endothelial injury</b> (trauma, central lines, surgery)</td></tr>
    <tr><td><b>Prevention</b></td><td><b>Early ambulation</b> · leg exercises, ankle dorsiflexion and rotation · <b>SCDs</b> · prophylactic anticoagulation · hydration. <b>Never massage a suspected DVT</b> — it can dislodge the clot</td></tr>
    <tr><td><b>PE signs</b></td><td><b>SUDDEN</b> dyspnea, pleuritic chest pain, tachycardia, anxiety and a sense of doom, hypoxemia, sometimes hemoptysis</td></tr>
    <tr><td><b>⭐ Anticoagulants</b></td><td><b>Heparin, enoxaparin, warfarin, DOACs.</b> They <b>PREVENT the clot from growing</b> and stop new ones. They do <b>NOT</b> dissolve the existing clot — the body does that over time</td></tr>
    <tr><td><b>⭐ Thrombolytics</b></td><td><b>Alteplase (tPA).</b> These <b>DISSOLVE the clot that is already there.</b> Reserved for <b>massive PE with hemodynamic instability</b> — hypotension, shock, right heart strain</td></tr>
    <tr><td><b>Thrombolytic risk</b></td><td><b>BLEEDING</b> is the major complication. Contraindicated with <b>active bleeding, recent surgery or trauma, recent stroke, intracranial pathology, or uncontrolled hypertension</b>. Monitor neuro status closely — <b>intracranial hemorrhage</b> is the feared event</td></tr>
    <tr><td><b>Nursing during thrombolytics</b></td><td>Minimize needle sticks · no IM injections · hold pressure longer · <b>watch for bleeding from any site, change in LOC, or sudden headache</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The distinction he can build on</div><div class="big">Anticoagulants PREVENT. Thrombolytics DISSOLVE.</div><div class="exp">Heparin will not break up an existing clot. If the stem describes a <b>massive PE with hypotension</b> and asks what dissolves it, the answer is a <b>thrombolytic</b>, not more heparin.</div></div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>Pulmonary embolism — the diagnostics</h3>
  <table class="lab">
    <tr><th>Test</th><th>What it tells you</th></tr>
    <tr><td><b>D-dimer</b></td><td><b>Nonspecific marker of clot breakdown.</b> A normal value helps <b>rule PE out</b> in a low-risk patient. An elevated value means <b>image it</b>, not diagnose it — it rises with surgery, infection, pregnancy, cancer, and age</td></tr>
    <tr><td><b>CT pulmonary angiography</b></td><td>The <b>confirmatory</b> study. Check renal function and contrast allergy</td></tr>
    <tr><td><b>V/Q scan</b></td><td>Used when contrast is contraindicated. Shows the <b>ventilation-perfusion mismatch</b></td></tr>
    <tr><td><b>ABG</b></td><td>Early PE often shows <b>respiratory alkalosis</b> from hyperventilation, with hypoxemia</td></tr>
  </table>
  <div class="trap"><span class="tag">The D-dimer trap</span>Any option that treats an elevated D-dimer as <b>proof</b> of a PE is wrong. It is a screening marker — it earns imaging, nothing more.</div>
  <div class="hy"><span class="tag">Why PE is dead space</span>The clot blocks <b>blood</b>, not air. The alveoli are ventilated but not perfused — <b>air with no blood</b>. That is the mirror image of pneumonia, which is <b>blood with no air</b>.</div>
</div>


<div class="card" style="border-color:var(--purple)">
  <h3>⭐ The pleural space — what's in there names the disease</h3>
  <p class="why-chain">The pleural space is a <b>potential space</b> holding only a few mL of lubricating fluid at <b>negative pressure</b>, which is what keeps the lung expanded. Put anything else in there and the lung is compressed. <b>What fills it decides the diagnosis.</b></p>
  <table class="lab">
    <tr><th>What's in the space</th><th>Name</th><th>Typical cause</th></tr>
    <tr><td><b>Air</b></td><td><b>Pneumothorax</b></td><td>Trauma, spontaneous rupture of a bleb, central line placement, positive-pressure ventilation</td></tr>
    <tr><td><b>Serous fluid</b></td><td><b>Pleural effusion</b> (hydrothorax)</td><td>Heart failure, low albumin, infection, malignancy</td></tr>
    <tr><td><b>Pus</b></td><td><b>Empyema</b></td><td>Pneumonia, lung abscess, chest trauma or surgery</td></tr>
    <tr><td><b>Blood</b></td><td><b>Hemothorax</b></td><td>Trauma, surgery, ruptured vessel</td></tr>
    <tr><td><b>Lymph / chyle</b></td><td><b>Chylothorax</b></td><td>Thoracic duct injury, malignancy</td></tr>
    <tr><td><b>Air under pressure</b></td><td><b>Tension pneumothorax</b></td><td>One-way valve effect — <b>the emergency</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">Shared physical findings</div><div class="big">Anything in the space → ↓breath sounds, ↓fremitus on that side</div><div class="exp"><b>Fluid, pus, or blood percuss DULL. Air percusses HYPERRESONANT.</b> That is how you separate them at the bedside.</div></div>
  <div class="trap"><span class="tag">Tension pneumothorax — the one that kills</span><b>Tracheal deviation AWAY from the affected side</b>, absent breath sounds, hyperresonance, distended neck veins, hypotension, severe respiratory distress. Air enters and cannot leave, pressure builds, and it compresses the heart and great vessels. <b>Needle decompression, then a chest tube.</b> This is not a "notify and wait" answer.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Pleural effusion vs. Empyema — the distinction he asked about</h3>
  <table class="lab">
    <tr><th></th><th>PLEURAL EFFUSION</th><th>EMPYEMA</th></tr>
    <tr><td><b>What it is</b></td><td><b>Fluid</b> in the pleural space. May be sterile</td><td><b>PUS</b> in the pleural space. Always <b>infected</b></td></tr>
    <tr><td><b>Fluid character</b></td><td>Thin, clear to straw-colored</td><td><b>Thick, cloudy, purulent</b>, often <b>loculated</b> into pockets</td></tr>
    <tr><td><b>Cause</b></td><td><b>Transudate:</b> heart failure, cirrhosis, low albumin — a <b>pressure</b> problem, protein-poor and clear.<br><b>Exudate:</b> infection, malignancy, inflammation — a <b>permeability</b> problem, protein-rich and cloudy</td><td>Complication of <b>pneumonia</b>, lung abscess, chest trauma or surgery</td></tr>
    <tr><td><b>Systemic signs</b></td><td>Often <b>none</b> — just dyspnea and pleuritic pain</td><td><b>Fever, chills, night sweats, weight loss, elevated WBC</b>. It behaves like the infection it is</td></tr>
    <tr><td><b>Shared findings</b></td><td colspan="2">Dyspnea, pleuritic chest pain, <b>dull percussion</b>, <b>decreased or absent breath sounds</b>, <b>decreased fremitus</b>. A large one shifts the trachea <b>away</b></td></tr>
    <tr><td><b>Diagnosis</b></td><td>Chest x-ray, ultrasound, CT, <b>thoracentesis</b> to sample and classify</td><td>Same, plus <b>culture of the fluid</b></td></tr>
    <tr><td><b>Management</b></td><td><b>Treat the underlying cause.</b> Thoracentesis for symptom relief; chest tube if large or recurrent; <b>pleurodesis</b> for recurrent malignant effusion</td><td><b>Antibiotics PLUS drainage</b> — usually a <b>large-bore chest tube</b>. Fibrinolytics for loculations. <b>Decortication</b> (surgical peeling of the fibrous peel) if it does not resolve</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The one-line difference</div><div class="big">Effusion is FLUID. Empyema is INFECTED fluid — pus.</div><div class="exp">Which is why empyema comes with <b>fever, chills, and a high WBC</b>, needs <b>antibiotics</b> on top of drainage, and takes far longer to resolve.</div></div>
  <div class="hy"><span class="tag">Transudate vs exudate in one line</span><b>Transudate = pressure pushed it out</b> (heart failure, low albumin) — clear and protein-poor. <b>Exudate = the membrane got leaky</b> (infection, cancer, inflammation) — cloudy and protein-rich. Thoracentesis tells you which, and that tells you the cause.</div>
  <div class="trap"><span class="tag">Nursing after thoracentesis</span><b>Position upright leaning over a bedside table</b>, arms supported. <b>Do not remove more than about 1,000–1,500 mL at once</b> — rapid removal risks re-expansion pulmonary edema and hypotension. Afterward: <b>chest x-ray to rule out pneumothorax</b>, monitor for sudden dyspnea, chest pain, or absent breath sounds.</div>
</div>

<div class="grphead" id="respacute-airway"><h3>Airway Management</h3><p class="grp-sub">Cuff pressures, positioning, and what to keep at the bedside.</p></div>
<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Oxygen Delivery — devices, flow rates, and FiO₂</h3>
  <p class="why-chain"><b>Oxygen is a drug.</b> It needs an order specifying device, flow rate, and target saturation. Devices split into two families, and knowing which family a device belongs to answers most questions about it.</p>
  <div class="mnem"><div class="tag">The split that governs everything</div><div class="big">LOW-FLOW = variable FiO₂ · HIGH-FLOW = fixed, precise FiO₂</div><div class="exp">A <b>low-flow</b> device doesn't supply all the air the patient breathes, so they entrain room air around it. Breathe fast and shallow and the FiO₂ <b>drops</b>. A <b>high-flow</b> device supplies the entire inspired volume, so the FiO₂ is <b>exact regardless of how the patient breathes</b>.</div></div>
</div>

<div class="card">
  <h3>🌬️ Low-flow devices — FiO₂ varies with the patient</h3>
  <table class="lab">
    <tr><th>Device</th><th>Flow rate</th><th>FiO₂ delivered</th><th>Key nursing points</th></tr>
    <tr><td><b>Nasal cannula</b></td><td><b>1–6 L/min</b></td><td><b>24–44%</b></td><td>Most comfortable. Patient can <b>eat, drink, and talk</b>. <b>Humidify above 4 L/min</b> — it dries and cracks the nares. Pad behind the ears. Works even if mouth-breathing</td></tr>
    <tr><td><b>Simple face mask</b></td><td><b>5–8 L/min</b></td><td><b>40–60%</b></td><td><b>⭐ Never below 5 L/min</b> — lower flow lets exhaled <b>CO₂ accumulate</b> in the mask and be rebreathed. Must remove to eat. Watch for skin breakdown and aspiration risk if vomiting</td></tr>
    <tr><td><b>Partial rebreather</b></td><td><b>6–11 L/min</b></td><td><b>60–75%</b></td><td>Has a reservoir bag with <b>no valve between bag and mask</b>, so the first third of exhaled air (which is still oxygen-rich) re-enters the bag. <b>Keep the bag at least ⅓ to ½ inflated</b> on inspiration</td></tr>
    <tr><td><b>Non-rebreather</b></td><td><b>10–15 L/min</b></td><td><b>60–100%</b> (realistically 80–95%)</td><td><b>⭐ Highest concentration available without intubation.</b> <b>One-way valves</b> prevent rebreathing. <b>The bag must NOT collapse on inspiration</b> — if it does, raise the flow. For emergencies and severe hypoxemia</td></tr>
  </table>
  <div class="hy"><span class="tag">The nasal cannula estimate</span><b>Roughly 4% per liter, starting from room air's 21%.</b> So 1 L ≈ 24%, 2 L ≈ 28%, 3 L ≈ 32%, 4 L ≈ 36%, 5 L ≈ 40%, 6 L ≈ 44%. Beyond 6 L you gain almost nothing and just dry the nose.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ High-flow devices — precise, fixed FiO₂</h3>
  <table class="lab">
    <tr><th>Device</th><th>Flow rate</th><th>FiO₂</th><th>Key nursing points</th></tr>
    <tr><td><b>⭐ VENTURI MASK</b><br>(Venti mask)</td><td><b>4–12 L/min</b></td><td><b>24–50%, EXACT</b></td><td><b>The most precise and specific oxygen delivery device.</b> Uses <b>color-coded adaptors</b>, each set to a specific FiO₂ and its required flow rate. <b>Do not block the entrainment ports.</b> Match the adaptor to the ordered FiO₂ and the flow to the adaptor</td></tr>
    <tr><td><b>High-flow nasal cannula</b></td><td>Up to <b>60 L/min</b></td><td><b>21–100%</b></td><td><b>Heated and humidified</b>, so high flows are tolerated. Provides some positive pressure. Used to avoid intubation</td></tr>
    <tr><td><b>Aerosol mask, face tent, T-piece, tracheostomy collar</b></td><td><b>At least 10 L/min</b></td><td><b>24–100%</b></td><td>Paired with a nebulizer for <b>humidification</b>. Face tent for facial trauma or claustrophobia. Trach collar and T-piece for artificial airways. <b>Drain condensation away from the patient</b>, never back into the airway</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ If he asks for the MOST SPECIFIC route</div><div class="big">The VENTURI MASK delivers the most precise FiO₂</div><div class="exp">Because it's high-flow, the concentration doesn't change with the patient's rate or depth. That is exactly why it's <b>preferred in COPD</b> — you can hold them at a controlled 24–28% and hit the <b>88–92%</b> target without overshooting.</div></div>
  <div class="mnem"><div class="tag">If he asks for the HIGHEST concentration</div><div class="big">The NON-REBREATHER delivers the most oxygen</div><div class="exp">Most <b>precise</b> and most <b>concentrated</b> are two different questions with two different answers. Read which one he's asking.</div></div>
</div>

<div class="card">
  <h3>Beyond the mask — positive pressure</h3>
  <table class="lab">
    <tr><th>Modality</th><th>What it does</th><th>Used for</th></tr>
    <tr><td><b>CPAP</b></td><td><b>Continuous</b> pressure throughout the cycle. Holds airways and alveoli open</td><td><b>Obstructive sleep apnea</b>, cardiogenic pulmonary edema</td></tr>
    <tr><td><b>BiPAP</b></td><td><b>Two</b> pressures — higher on inspiration, lower on expiration. Assists ventilation as well as oxygenation</td><td><b>COPD exacerbation</b> with hypercapnia, acute respiratory failure — often <b>prevents intubation</b></td></tr>
    <tr><td><b>Mechanical ventilation</b></td><td>Full support via an endotracheal tube</td><td>When noninvasive support fails, or the patient can't protect the airway</td></tr>
  </table>
  <div class="trap"><span class="tag">When noninvasive isn't appropriate</span>CPAP and BiPAP require a patient who can <b>protect their own airway and cooperate</b>. <b>Decreased level of consciousness, vomiting, facial trauma, or an inability to clear secretions</b> makes them unsafe — those patients need intubation.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⚠️ Oxygen hazards and safety</h3>
  <table class="lab">
    <tr><th>Hazard</th><th>Detail</th></tr>
    <tr><td><b>⭐ Oxygen toxicity</b></td><td>From <b>FiO₂ above 50% for more than 24–48 hours</b>. Early: <b>substernal chest pain, dry cough, dyspnea, paresthesias, restlessness, nausea</b>. Late: it damages the alveolar-capillary membrane and produces an <b>ARDS-like picture</b>. <b>Use the lowest FiO₂ that achieves the target saturation</b></td></tr>
    <tr><td><b>Absorption atelectasis</b></td><td>High FiO₂ washes out the <b>nitrogen</b> that normally splints alveoli open, so they collapse</td></tr>
    <tr><td><b>CO₂ retention in COPD</b></td><td>Uncontrolled high-flow oxygen can blunt the hypoxic drive in a chronic retainer. <b>Target 88–92% with a controlled device</b> — but this <b>never</b> means withholding oxygen from someone in real distress</td></tr>
    <tr><td><b>Drying and skin breakdown</b></td><td>Humidify above 4 L/min. Check <b>nares, behind the ears, and over the cheekbones</b>. Pad pressure points</td></tr>
    <tr><td><b>🔥 Fire risk</b></td><td>Oxygen <b>supports combustion</b>. <b>No smoking</b> and post signs · no open flames · <b>no petroleum-based products</b> (use water-soluble lubricant instead of petroleum jelly) · avoid wool and synthetic fabrics that generate static — <b>cotton</b> is preferred · keep cylinders secured and away from heat · no electric razors near the source</td></tr>
  </table>
  <div class="hy"><span class="tag">Home oxygen teaching</span>Keep tubing free of kinks and out of walkways. Have a <b>backup supply and a plan for power outages</b> if using a concentrator. Notify the fire department and the electric company. <b>Never adjust the flow rate without an order.</b> Check the nares daily and use water-soluble lubricant.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on oxygen therapy</h3>
  <div class="trap"><span class="tag">Trap 1 — most precise vs most oxygen</span><b>Venturi = most precise FiO₂. Non-rebreather = highest concentration.</b> Two different questions, two different answers, and he offers both options in both stems.</div>
  <div class="trap"><span class="tag">Trap 2 — simple mask run too low</span>A simple face mask below <b>5 L/min</b> lets <b>CO₂ build up inside the mask</b> and get rebreathed. "Reduce the simple mask to 3 L" is always wrong — switch devices instead.</div>
  <div class="trap"><span class="tag">Trap 3 — the collapsing reservoir bag</span>On a <b>non-rebreather</b>, a bag that <b>deflates completely</b> on inspiration means the flow is too low. <b>Increase the flow rate.</b> Options that remove the mask or leave it alone are wrong.</div>
  <div class="trap"><span class="tag">Trap 4 — blocking the entrainment ports</span>The <b>Venturi mask's side ports must stay open</b> — that's how it entrains a fixed ratio of room air. Covering them with bedding or a hand destroys the accuracy.</div>
  <div class="trap"><span class="tag">Trap 5 — the nurse titrating oxygen</span>Oxygen is a <b>medication</b>. The nurse may raise it in an emergency per protocol, but routinely changing the ordered flow rate without an order is outside scope.</div>
  <div class="trap"><span class="tag">Trap 6 — no humidification above 4 L</span>Dry high-flow oxygen cracks the nares, causes epistaxis, and <b>thickens secretions</b> in a patient who needs to clear them.</div>
  <div class="trap"><span class="tag">Trap 7 — petroleum jelly for dry nares</span>Petroleum products are <b>flammable</b> around oxygen. Use a <b>water-soluble</b> lubricant.</div>
  <div class="trap"><span class="tag">Trap 8 — chest pain on high FiO₂ read as cardiac</span><b>Substernal chest pain with a dry cough</b> in a patient on prolonged high-concentration oxygen is <b>oxygen toxicity</b>. The answer is to reduce the FiO₂ to the lowest effective level, not to order a troponin first.</div>
</div>

<div class="card">
  <h3>🫁 Endotracheal tube and mechanical ventilation</h3>
  <table class="lab">
    <tr><th>Point</th><th>Detail</th></tr>
    <tr><td><b>Placement confirmed by</b></td><td><b>End-tidal CO₂ detector</b> plus <b>bilateral breath sounds</b>, then <b>chest x-ray for definitive tip position</b>. Watch for absent left-sided sounds — the tube slipped into the right mainstem</td></tr>
    <tr><td><b>Cuff pressure</b></td><td><b>20–30 cm H₂O.</b> Too low allows aspiration around the cuff; too high causes <b>tracheal necrosis</b></td></tr>
    <tr><td><b>Securing</b></td><td>Mark the tube at the lip or teeth and <b>document the number</b>. Verify it every shift — migration is common</td></tr>
    <tr><td><b>Oral care</b></td><td><b>Chlorhexidine</b> per protocol. The mouth is the reservoir that seeds VAP</td></tr>
    <tr><td><b>Communication</b></td><td>The patient <b>cannot speak</b>. Provide a board, paper, or yes/no questions. Do not talk over them</td></tr>
    <tr><td><b>Always at the bedside</b></td><td><b>Bag-valve mask</b> and suction equipment</td></tr>
  </table>
  <div class="trap"><span class="tag">Ventilator alarms</span><b>HIGH pressure alarm</b> = something is obstructing — secretions, biting, kinked tubing, coughing, bronchospasm, or a pneumothorax. <b>LOW pressure alarm</b> = a leak or disconnection. <b>High = blocked, low = leaking.</b></div>
</div>

<div class="card">
  <h3>🔵 Tracheostomy</h3>
  <ul class="clean">
    <li><b>Always at the bedside:</b> <b>obturator</b> (to reinsert the tube), a <b>spare trach tube of the same size and one size smaller</b>, and suction equipment.</li>
    <li><b>If the tube is dislodged:</b> stay with the patient, call for help, <b>hyperextend the neck and use the obturator to reinsert</b>. If you cannot, <b>ventilate with a bag-valve mask over the stoma or the mouth and nose</b> while covering the stoma.</li>
    <li><b>Site care:</b> sterile technique, clean the inner cannula per protocol, keep the area dry, use <b>tracheostomy ties that admit one finger</b>, and use a <b>pre-cut or manufactured</b> dressing — never cut gauze, because loose fibers can be aspirated.</li>
    <li><b>Two people</b> change the ties, so the tube is never unsecured.</li>
    <li><b>Humidification is required</b> — the nose no longer warms or moistens the air. Dry air thickens secretions and crusts the tube.</li>
    <li><b>Cuffed vs uncuffed:</b> a cuff protects against aspiration and allows positive-pressure ventilation but prevents speech. Deflating the cuff or using a speaking valve allows phonation.</li>
  </ul>
  <div class="hy"><span class="tag">⭐ Suction when NEEDED, not on a schedule</span>Suction based on <b>assessment</b> — visible or audible secretions, coarse crackles, a rising peak pressure on the ventilator, falling saturation, or the patient requesting it. <b>Routine scheduled suctioning is not evidence-based</b> and causes unnecessary hypoxia and airway trauma.</div>
  <div class="hy"><span class="tag">Suctioning technique</span><b>Hyperoxygenate first.</b> Insert <b>without suction applied</b>, apply suction <b>only on withdrawal</b> while rotating, and limit each pass to <b>10–15 seconds</b>. Allow recovery between passes. Suctioning removes oxygen along with secretions, and prolonged passes cause <b>hypoxia, bradycardia, and dysrhythmias</b>.</div>
  <div class="trap"><span class="tag">The trap</span>Any option that applies suction <b>on insertion</b>, suctions for <b>longer than 15 seconds</b>, or instills saline before suctioning is wrong. Saline instillation does not thin secretions and pushes bacteria into the lower airway.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the desaturating vent patient</span>"Increase the tube feeding," "lower the head of the bed," and "document and wait" all appear. <b>Assess the patient and the airway</b> first — DOPE: Displacement, Obstruction, Pneumothorax, Equipment.</div>
  <div class="trap"><span class="tag">Trap 2 — suction technique</span>Suction only on <b>withdrawal</b>, 10 to 15 seconds max, hyperoxygenate before and after. Options that suction on insertion or for 30 seconds are the near-misses.</div>
  <div class="trap"><span class="tag">Trap 3 — trach bedside equipment</span>The obturator and a spare tube of the <b>same size and one size smaller</b>. Options listing only one of those are incomplete.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ Pulmonary Hypertension — what happens and where the backup goes</h3>
  <p class="why-chain">Elevated pressure in the <b>pulmonary arteries</b>. The right ventricle is a thin-walled, low-pressure pump. It was never built to push against high resistance, so when pulmonary pressure rises, the right heart is what fails.</p>
  <ol class="chainlist">
    <li><b>1.</b> Pulmonary vessels <b>constrict, stiffen, and remodel</b> — from hypoxia (COPD), chronic clots (PE), left heart disease, interstitial lung disease, sleep apnea, or idiopathic causes.</li>
    <li><b>2.</b> <b>Pulmonary vascular resistance rises.</b> Chronic hypoxia is itself a potent pulmonary vasoconstrictor, so lung disease feeds the cycle.</li>
    <li><b>3.</b> The <b>right ventricle</b> must generate higher pressure to push blood through → it <b>hypertrophies</b>.</li>
    <li><b>4.</b> Eventually it cannot keep up and <b>fails</b>. Right heart failure caused by lung disease is <b>cor pulmonale</b>.</li>
    <li><b>5.</b> <b>⭐ The backup goes BACKWARD from the right heart into the systemic venous circulation</b> — because the right side receives from the body.</li>
  </ol>
  <div class="mnem"><div class="tag">⭐ Where the fluid ends up</div><div class="big">RIGHT-sided failure backs up into the BODY. LEFT-sided failure backs up into the LUNGS.</div><div class="exp">So pulmonary hypertension → right heart failure → <b>JVD, hepatomegaly, ascites, peripheral edema, weight gain</b>. Crackles and pink frothy sputum are <b>left</b>-sided findings.</div></div>
  <table class="lab">
    <tr><th>Clinical manifestations</th><th>Why</th></tr>
    <tr><td><b>Dyspnea on exertion — the earliest and most common</b></td><td>Output cannot rise to meet demand</td></tr>
    <tr><td><b>Fatigue and weakness</b></td><td>Low cardiac output</td></tr>
    <tr><td><b>Exertional chest pain</b></td><td>Right ventricular ischemia</td></tr>
    <tr><td><b>Syncope or near-syncope with exertion</b></td><td>Fixed output cannot increase — an <b>ominous</b> sign</td></tr>
    <tr><td><b>Loud P2</b>, right-sided S3 or S4</td><td>Pulmonic valve closing against high pressure</td></tr>
    <tr><td><b>JVD</b></td><td>Backup into the jugular veins</td></tr>
    <tr><td><b>Hepatomegaly, right upper quadrant tenderness, ascites</b></td><td>Backup into the liver and abdomen</td></tr>
    <tr><td><b>Dependent peripheral edema, rapid weight gain</b></td><td>Backup into the systemic veins</td></tr>
    <tr><td>Cyanosis, clubbing</td><td>Chronic hypoxemia</td></tr>
  </table>
  <ul class="clean">
    <li><b>Diagnosis:</b> <b>echocardiogram</b> screens and estimates pressure. <b>Right heart catheterization is definitive.</b></li>
    <li><b>Management:</b> <b>oxygen</b> (correcting hypoxia relieves the vasoconstriction driving it), pulmonary vasodilators (<b>sildenafil</b>, bosentan/ambrisentan, epoprostenol/treprostinil), <b>diuretics</b> for volume, anticoagulation in some, treat the underlying cause, transplant in end-stage disease.</li>
    <li><b>Nursing:</b> oxygen as ordered, <b>pace activity and cluster care</b>, <b>daily weights and I&amp;O</b>, low-sodium diet, avoid heavy lifting and straining, <b>avoid decongestants and NSAIDs</b>, teach that <b>pregnancy is high risk</b>, monitor for worsening edema or syncope.</li>
  </ul>
  <div class="trap"><span class="tag">Where he turns the screw</span>
  • Offering <b>crackles and pink frothy sputum</b> as the finding — those are <b>left</b>-sided. Pulmonary hypertension fails the <b>right</b> side, so look for <b>JVD, hepatomegaly, ascites, edema</b>.<br>
  • Treating <b>syncope on exertion</b> as benign. In pulmonary hypertension it means the output cannot rise — a late and serious sign.<br>
  • Withholding oxygen. <b>Hypoxia is the vasoconstrictor driving the disease</b>, so oxygen is treatment, not just comfort.</div>
</div>

<div class="grphead" id="respacute-chesttubes"><h3>Chest Tubes</h3><p class="grp-sub">Your professor's speaker notes went DEEP here — that means it's coming. This is "easy points" if you know the chambers.</p></div>
<div class="card">
  <h3>🫧 The three chambers — the whole game</h3>
  <p class="why-chain">A chest tube restores the <b>negative pressure</b> the pleural space needs so the lung can stay expanded. The drainage system does three jobs, and each chamber does one.</p>
  <table class="lab">
    <tr><th>Chamber</th><th>Job</th><th>What you should see</th><th>What's wrong</th></tr>
    <tr><td><b>1. Collection</b></td><td>Holds drainage</td><td>Measure and mark the level with the <b>time and date</b>. Note color and character</td><td><b>More than 100 mL/hr</b> or sudden bright red bleeding — notify immediately</td></tr>
    <tr><td><b>2. Water seal</b></td><td>One-way valve — lets air <b>out</b>, never back in</td><td><b>TIDALING</b> — the level rises and falls with breathing. This is <b>normal and expected</b>. Intermittent bubbling as a pneumothorax resolves</td><td><b>⭐ CONTINUOUS bubbling = AIR LEAK.</b> No tidaling at all = the tube is <b>blocked</b> or the lung has re-expanded</td></tr>
    <tr><td><b>3. Suction control</b></td><td>Regulates how much suction is applied</td><td><b>GENTLE CONTINUOUS BUBBLING is NORMAL</b> — that is what wall suction does here</td><td>No bubbling = suction isn't connected or is set too low</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The single most-tested distinction</div><div class="big">Water seal bubbling = PROBLEM. Suction chamber bubbling = NORMAL.</div><div class="exp">Same observation, opposite meaning, decided entirely by <b>which chamber</b>. He will describe the bubbling and make you identify the chamber.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🛏️ Chest tube safety rules</h3>
  <table class="lab">
    <tr><th>Situation</th><th>Action</th></tr>
    <tr><td><b>⭐ Tube DISLODGES from the patient</b></td><td><b>Cover with sterile occlusive gauze taped on THREE SIDES.</b> That makes a <b>one-way flutter valve</b> so trapped air can escape but none is drawn in. Notify immediately</td></tr>
    <tr><td><b>⭐ Tube DISCONNECTS from the drainage system</b></td><td><b>Submerge the end in sterile water or saline</b> to re-establish a water seal, then get a new system</td></tr>
    <tr><td><b>Clamping</b></td><td><b>Almost never.</b> Clamping traps air with no escape route and can cause a <b>tension pneumothorax</b>. Brief clamping only to change the system or assess for a leak, per order</td></tr>
    <tr><td><b>Milking or stripping</b></td><td><b>Not routine</b> — generates dangerously high negative pressure and damages tissue</td></tr>
    <tr><td><b>System position</b></td><td><b>Always below chest level</b> so drainage cannot flow back. Keep upright, never lay it on its side</td></tr>
    <tr><td><b>Tubing</b></td><td>Keep <b>free of kinks and dependent loops</b> — coiled loops trap fluid and block drainage</td></tr>
    <tr><td><b>Bedside equipment</b></td><td><b>Sterile water/saline, occlusive gauze, and clamps</b> within reach at all times</td></tr>
    <tr><td><b>Ambulation</b></td><td>Encouraged. Keep the system below the chest and <b>do not disconnect from suction unless ordered</b></td></tr>
    <tr><td><b>Removal</b></td><td>Patient takes a deep breath and <b>bears down (Valsalva)</b> or holds at end-inspiration while the tube is pulled. Apply an <b>airtight occlusive dressing</b>. Chest x-ray afterward</td></tr>
  </table>
  <div class="trap"><span class="tag">Why three sides and not four</span>Four sides seals it completely. Air keeps entering the pleural space from the lung with no way out, pressure builds, and you have created a <b>tension pneumothorax</b>. The open fourth side is the escape route.</div>
</div>

<div class="card">
  <h3>❓ Assessment and finer points</h3>
  <ul class="clean">
    <li><b>Assess</b> breath sounds bilaterally, respiratory status, the insertion site for <b>subcutaneous emphysema</b> (a crackling feel under the skin — report it), drainage amount and character, and the water seal for tidaling.</li>
    <li><b>Subcutaneous emphysema</b> means air is escaping into the tissue. Small amounts are common; a rapidly expanding area involving the neck or face is an emergency.</li>
    <li><b>Pain control matters</b> — a chest tube hurts, and splinting causes atelectasis. Medicate, then encourage deep breathing and incentive spirometry.</li>
    <li><b>Signs the lung has re-expanded:</b> tidaling stops, drainage decreases, breath sounds return, and the chest x-ray confirms it.</li>
    <li><b>Where the tube goes:</b> <b>air rises</b>, so a pneumothorax tube goes in <b>high — around the 2nd intercostal space</b>. <b>Fluid settles</b>, so an effusion or hemothorax tube goes <b>low — around the 5th or 6th</b>.</li>
  </ul>
  <div class="hy"><span class="tag">How to find a leak</span>Briefly clamp <b>near the insertion site</b> and work outward. If the bubbling <b>stops</b> when you clamp close to the patient, the leak is <b>in the patient or at the insertion site</b>. If it continues, the leak is <b>in the tubing or system</b>.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — which chamber is bubbling</span>The whole question is the <b>chamber</b>. Water-seal bubbling = air leak. Suction-control bubbling on wall suction = normal. He writes both versions.</div>
  <div class="trap"><span class="tag">Trap 2 — the four-sided dressing</span>A dislodged tube gets gauze on <b>three</b> sides so air can escape. Taping all four sides seals the leak in and <b>causes</b> a tension pneumothorax.</div>
  <div class="trap"><span class="tag">Trap 3 — clamping as a reflex</span>"Clamp the tube" appears in almost every chest tube stem. You almost never clamp, because it traps air.</div>
  <div class="trap"><span class="tag">Trap 4 — tidaling read as a problem</span>Tidaling is <b>normal</b>. Absent tidaling means the lung re-expanded or the tube is obstructed.</div>
</div>

<div id="q-respacute"></div>`;
