{topic:'drugs',hot:true,q:'A patient taking rifampin reports orange-colored urine. What is the nurse\'s response?',o:['This suggests dehydration; increase fluid intake','This is an expected harmless effect, but it permanently stains soft contact lenses','Stop the medication and notify the provider','This indicates liver toxicity requiring immediate labs'],c:1,t:'single',r:'<b>Rifampin turns urine, sweat, and tears orange-red</b> \\u2014 harmless and expected. Teach that it <b>permanently stains soft contacts</b> and <b>reduces oral contraceptive effectiveness</b>. Jaundice and dark urine would be different \\u2014 those suggest <b>hepatotoxicity</b>, which all four RIPE drugs can cause.'},
{topic:'drugs',hot:true,q:'Which vitamin is given with isoniazid and why?',o:['Vitamin C, to improve absorption','Vitamin B6, to prevent peripheral neuropathy','Vitamin D, to protect bone density','Vitamin K, to prevent bleeding'],c:1,t:'single',r:'<b>INH causes peripheral neuropathy</b>, and <b>vitamin B6 (pyridoxine)</b> prevents it. Teach the patient to report numbness and tingling. INH is also <b>hepatotoxic</b> \\u2014 no alcohol, monitor LFTs.'},
{topic:'drugs',hot:false,q:'A patient on ethambutol should report which symptom immediately?',o:['Any change in vision or color discrimination','Orange discoloration of urine','Metallic taste in the mouth','Mild joint aching'],c:0,t:'single',r:'<b>Ethambutol causes optic neuritis</b> \\u2014 decreased acuity and loss of red-green discrimination. Baseline and periodic <b>vision testing</b> is required, and any vision change is reported immediately. Orange urine is rifampin; raised uric acid and joint pain is pyrazinamide.'},
{topic:'drugs',hot:false,q:'A patient using oxymetazoline nasal spray reports it no longer works and they are using it more often. What has happened?',o:['The dose was too low from the start','Rebound congestion from use beyond 3 days','An allergic reaction to the preservative','Development of a bacterial sinus infection'],c:1,t:'single',r:'<b>Topical decongestants cause rebound congestion when used more than 3 days.</b> The patient uses more, the congestion worsens, and the cycle continues. Teach the 3-day limit and switch to saline or an oral agent.'},
{topic:'drugs',hot:false,q:'A patient with a productive cough asks for a cough suppressant. What is the nurse\'s best response?',o:['Combine it with an expectorant for a stronger effect','Take it only at night when the cough is worse','Suppressing a productive cough traps secretions that need to be cleared','Cough suppressants are appropriate for any type of cough'],c:2,t:'single',r:'<b>Antitussives are for a DRY, nonproductive cough.</b> A productive cough is <b>clearing the airway</b>. For thick secretions the answer is an <b>expectorant plus hydration</b>, not suppression.'},
{topic:'drugs',hot:true,q:'A patient receiving IV magnesium sulfate for severe asthma loses their deep tendon reflexes. What does this indicate and what is the antidote?',o:['Hypocalcemia; give magnesium','An expected therapeutic response; continue','Magnesium toxicity; give calcium gluconate','Hypokalemia; give potassium chloride'],c:2,t:'single',r:'<b>Loss of deep tendon reflexes is the FIRST sign of magnesium toxicity</b> \\u2014 the R in the RENAL mnemonic. The antidote is <b>calcium gluconate</b>. Stop the magnesium, assess respirations and blood pressure, and notify the provider.'},
{topic:'drugs',hot:false,q:'A patient on vancomycin develops flushing and redness of the upper body during infusion. What is the cause?',o:['An expected effect requiring no change','A true penicillin cross-allergy','The infusion is running too rapidly','Contamination of the IV solution'],c:2,t:'single',r:'Rapid vancomycin infusion causes a <b>flushing reaction</b>. <b>Slow the infusion.</b> Also monitor the <b>trough level and renal function</b> \\u2014 vancomycin is nephrotoxic and ototoxic.'},
{topic:'drugs',hot:false,q:'Which antihistamine is preferred for an older adult with allergic rhinitis?',o:['Loratadine, because it is non-sedating','Either is equally appropriate','Diphenhydramine, because it works faster','Diphenhydramine, because it also dries secretions'],c:0,t:'single',r:'<b>First-generation antihistamines like diphenhydramine are sedating and anticholinergic</b> \\u2014 confusion, urinary retention, and <b>fall risk</b> in older adults. <b>Second-generation agents (loratadine, cetirizine) are non-sedating</b> and preferred.'},
{topic:'drugs',hot:true,q:'A patient with third spacing and a low albumin receives IV albumin. What should the nurse monitor for?',o:['Hypoglycemia','Metabolic acidosis','Fluid overload with crackles and dyspnea','Hyperkalemia'],c:2,t:'single',r:'<b>Albumin is a colloid that pulls fluid from the interstitium INTO the vessel.</b> That is the therapeutic goal, and it is also why the patient can go into <b>fluid overload and pulmonary edema</b>. Monitor <b>lung sounds, blood pressure, and urine output</b>.'},
{topic:'drugs',hot:false,q:'Which drugs can raise a patient\'s serum potassium? Select all that apply.',o:['Salt substitutes','Furosemide','ARBs','ACE inhibitors','Spironolactone','Hydrochlorothiazide'],c:[0,2,3,4],t:'multi',r:'<b>Spironolactone, ACE inhibitors, and ARBs all block aldosterone</b>, and aldosterone is what excretes potassium \\u2014 so all three raise it. <b>Salt substitutes are potassium chloride.</b> <b>Loop and thiazide diuretics WASTE potassium</b> and lower it instead.'},
{topic:'drugs',hot:true,q:'Which statements about inhaler use indicate correct understanding? Select all that apply.',o:['The albuterol is for when I cannot catch my breath','I use the albuterol first, then wait, then the steroid','I use salmeterol when an attack starts','I rinse my mouth after the steroid inhaler','I skip the steroid on days I feel fine','My salmeterol is taken every day whether or not I have symptoms'],c:[0,1,3,5],t:'multi',r:'<b>Bronchodilator first, steroid second, rinse after.</b> Albuterol is <b>rescue</b>; salmeterol and inhaled steroids are <b>daily maintenance</b> taken whether or not symptoms are present. <b>Salmeterol during an attack</b> and <b>skipping the controller</b> are both wrong.'},
{topic:'resp',hot:true,q:'A patient in respiratory distress has a Glasgow Coma Scale score of 7. What does this indicate?',o:['Severe CNS depression \u2014 the patient cannot protect their airway','Mild confusion requiring reorientation','A normal score for a sedated patient','The patient is fully alert and oriented'],c:0,t:'single',r:'<b>A GCS below 9 indicates severe CNS depression.</b> At that level the patient <b>cannot protect their own airway</b>, which is the threshold where intubation is considered. The scale runs <b>3 to 15</b> \u2014 3 is the lowest possible score, not zero. A falling GCS in respiratory distress means <b>rising CO2 or worsening hypoxia</b>.'},
{topic:'resp',hot:true,q:'A patient has bilateral infiltrates, crackles, and hypoxemia. The BNP is low. What does this suggest?',o:['ARDS \u2014 noncardiogenic pulmonary edema','Congestive heart failure exacerbation','Fluid volume overload from IV therapy','Cardiogenic shock'],c:0,t:'single',r:'<b>ARDS and cardiogenic pulmonary edema look nearly identical.</b> BNP separates them: <b>a LOW BNP means the heart is not the problem</b> \u2014 the alveolar-capillary membrane is leaking, so the edema is <b>noncardiogenic</b>. An <b>elevated BNP</b> points to heart failure. ARDS also shows <b>refractory hypoxemia</b> that does not improve with oxygen.'},
{topic:'resp',hot:true,q:'Why is prone positioning used in ARDS?',o:['It reopens posterior alveoli and improves ventilation-perfusion matching','It reduces cardiac workload by shifting the heart forward','It prevents aspiration of gastric contents','It allows easier access for suctioning'],c:0,t:'single',r:'The <b>posterior lung holds more alveoli</b> but is compressed by the weight of the heart and abdomen when supine, while still receiving most of the blood flow. <b>Turning prone reopens those alveoli and matches ventilation to perfusion.</b> Done in scheduled blocks around 12 hours, sometimes with paralytics.'},
{topic:'resp',hot:true,q:'A trauma patient has fractures of the first three ribs. Why is this significant?',o:['High mortality \u2014 the force required suggests major vascular injury','Upper ribs heal more slowly than lower ribs','It indicates the spleen is likely lacerated','Upper rib fractures rarely cause complications'],c:0,t:'single',r:'<b>It takes enormous force to fracture the upper ribs</b>, and the <b>subclavian vessels and aorta</b> sit directly beneath them. A severed major vessel causes <b>rapid exsanguination</b>. Watch for hemorrhagic shock. <b>Lower</b> rib fractures raise concern for <b>liver and spleen</b> injury instead.'},
{topic:'resp',hot:false,q:'A patient with blunt chest trauma is stable on admission. Why does the nurse continue close monitoring for pulmonary contusion?',o:['A contusion often worsens over 24 to 48 hours as damaged vessels leak into the alveoli','Contusions resolve within a few hours without intervention','A contusion is only significant if a rib is also fractured','Symptoms always appear immediately at the time of injury'],c:0,t:'single',r:'A <b>pulmonary contusion is a bruised lung</b>. Damaged vessels leak into the alveoli and <b>gas exchange progressively fails</b>, so the patient often looks stable at first and <b>deteriorates over 24 to 48 hours</b>. Monitor oxygenation closely, give careful fluids, and control pain so they can breathe deeply.'},
{topic:'resp',hot:true,q:'A patient in hemorrhagic shock from chest trauma is receiving normal saline. What does the nurse anticipate as the priority?',o:['Blood product transfusion, since crystalloids are only a temporary measure','Continuing crystalloids alone until the blood pressure normalizes','Switching to a hypotonic solution to restore cellular volume','Administering a diuretic to reduce cardiac workload'],c:0,t:'single',r:'<b>Blood loss is replaced with blood.</b> Crystalloids <b>carry no oxygen</b> and only about a third stays intravascular \u2014 remember the <b>3:1 rule</b>. They stabilize temporarily while blood is prepared. <b>MODS mortality rises with each organ that fails</b>, which is why early adequate resuscitation matters.'},
{topic:'resp',hot:true,q:'A patient receiving continuous enteral feeding has a high gastric residual volume but no distention, nausea, or vomiting. What is the current evidence-based action?',o:['Return the aspirate and continue feeding while assessing the patient','Discard the aspirate and hold the feeding for 4 hours','Discard the aspirate and switch to bolus feeding','Stop enteral feeding permanently and request parenteral nutrition'],c:0,t:'single',r:'Practice has changed. <b>Return the aspirated contents</b> \u2014 discarding throws away electrolytes and nutrition. <b>Check residuals about every 4 hours</b>, and a high residual alone is <b>not automatically a reason to stop</b>. Assess the patient for distention, nausea, and vomiting. <b>Bolus feeding carries a HIGHER aspiration risk</b> than continuous.'},
{topic:'resp',hot:false,q:'Which patient is at highest risk for aspiration?',o:['A patient with a recent stroke and an unevaluated swallow','A patient with well-controlled asthma','A patient ambulating after knee surgery','A patient with a healed rib fracture'],c:0,t:'single',r:'Highest risk: <b>stroke, decreased level of consciousness, alcohol or drug intoxication, sedation, severe asthma, and recent extubation</b>. <b>Silent aspiration produces no cough at all</b>, which is why a <b>formal swallow study before oral intake</b> beats observing the patient eat. Large-volume aspiration can obstruct the airway and cause cardiac arrest.'},
{topic:'upper',hot:true,q:'A patient reports facial pain and pressure that worsens when bending forward, with purulent nasal drainage for 5 days. What does the nurse anticipate?',o:['A CT scan of the sinuses today','Urgent sinus surgery','Immediate antibiotic therapy','Supportive care, since most acute rhinosinusitis is viral'],c:3,t:'single',r:'<b>Most acute rhinosinusitis is VIRAL.</b> Antibiotics are reserved for symptoms lasting <b>beyond 10 days</b>, symptoms that <b>worsen after initially improving</b>, or severe presentation. <b>Pain worse when bending forward</b> is the classic positional clue.'},
{topic:'upper',hot:false,q:'Which finding distinguishes streptococcal pharyngitis from viral pharyngitis?',o:['Clear watery nasal drainage with itchy eyes','Gradual onset with cough and runny nose','Hoarseness lasting several weeks','Sudden sore throat with fever and exudate and NO cough'],c:3,t:'single',r:'<b>Strep: sudden onset, fever, tonsillar exudate, tender nodes, and NO cough.</b> Viral pharyngitis comes on gradually <b>with</b> cough and coryza. Untreated strep risks <b>rheumatic fever and glomerulonephritis</b>, so the full antibiotic course must be completed.'},
{topic:'upper',hot:true,q:'A patient 6 days post-tonsillectomy calls reporting bright red bleeding. What does the nurse tell them?',o:['Come in to be evaluated now, since bleeding risk peaks again at 5 to 10 days','Apply an ice pack and recheck in 24 hours','Gargle with warm salt water and rest the voice','This is expected and will stop on its own'],c:0,t:'single',r:'Bleeding risk is highest in the <b>first 24 hours</b> and again at <b>5 to 10 days</b> when the scab sloughs off. Bright red bleeding at day 6 needs evaluation. <b>No gargling</b> after tonsillectomy, and avoid coughing or throat clearing.'},
{topic:'upper',hot:true,q:'Which fluids are appropriate for a child recovering from a tonsillectomy?',o:['Cool clear liquids such as apple juice or water','Citrus juice for vitamin C','Red gelatin and fruit punch','Warm milk and ice cream'],c:0,t:'single',r:'<b>Cool clear liquids.</b> <b>Avoid red or brown fluids</b> because they mimic blood and make bleeding hard to assess. Avoid <b>milk products early</b> since they thicken secretions and prompt throat clearing, and avoid citrus because acid burns the surgical site. <b>No straws.</b>'},
{topic:'upper',hot:false,q:'A patient with allergic rhinitis has pale boggy nasal turbinates and clear watery drainage. Which is the appropriate treatment?',o:['Antitussive medication at bedtime','Oral decongestants used continuously for 2 weeks','Antihistamines and intranasal corticosteroids','A 10-day course of amoxicillin'],c:2,t:'single',r:'<b>Allergic rhinitis is an allergy, not an infection</b> \\u2014 antibiotics do nothing. Treat with <b>antihistamines, intranasal steroids, and allergen avoidance</b>. Second-generation antihistamines are preferred for daytime because they are non-sedating.'},
{topic:'upper',hot:true,q:'A patient with epistaxis has been pinching the bridge of the nose with the head tilted back. What should the nurse correct?',o:['Tilt the head further back and swallow the blood','Continue the current technique for 20 minutes','Lie flat and pinch the bony bridge','Sit upright leaning forward and pinch the soft part of the nose'],c:3,t:'single',r:'Two errors. <b>Head tilted BACK</b> lets blood run down the throat \\u2014 hiding the volume lost, causing nausea and vomiting, and risking <b>aspiration</b>. And pressure goes on the <b>SOFT part</b>, not the bony bridge. Upright, leaning forward, firm pressure for <b>5 to 10 minutes without releasing</b>.'},
{topic:'upper',hot:false,q:'A patient has posterior nasal packing in place. Which assessment is the priority?',o:['Nutritional intake','Respiratory status and oxygen saturation','Level of nasal discomfort','Skin integrity around the nares'],c:1,t:'single',r:'<b>Posterior packing risks airway obstruction, hypoxia, and a vagal response.</b> These patients need <b>close respiratory monitoring</b>. Comfort and skin care matter but do not outrank airway and breathing.'},
{topic:'upper',hot:true,q:'Which patient statement about obstructive sleep apnea indicates a need for further teaching?',o:['I am working on losing weight','I sleep on my side instead of my back','I have a glass of wine before bed to help me fall asleep','I use my CPAP every night'],c:2,t:'single',r:'<b>Alcohol and sedatives relax the airway further and worsen apneic episodes.</b> The other three are all correct: <b>CPAP is first-line</b>, weight loss reduces severity, and <b>side-sleeping</b> is better than supine.'},
{topic:'upper',hot:true,q:'A patient with OSA is scheduled for surgery. Which postoperative concern is greatest?',o:['Heightened sensitivity to opioids and sedatives','Postoperative nausea and vomiting','Increased risk of surgical site infection','Delayed wound healing'],c:0,t:'single',r:'<b>OSA patients are highly sensitive to opioids and sedatives</b> and can obstruct after receiving them. They need <b>close respiratory monitoring</b> and should have <b>their own CPAP brought in and used</b> postoperatively.'},
{topic:'upper',hot:false,q:'Which condition is diagnosed definitively by polysomnography?',o:['Chronic sinusitis','Allergic rhinitis','Laryngeal cancer','Obstructive sleep apnea'],c:3,t:'single',r:'<b>Polysomnography (a sleep study)</b> is definitive for OSA. It documents apneic episodes of <b>10 seconds or longer</b> with desaturation and arousal. Untreated OSA leads to <b>hypertension, dysrhythmias, right heart failure, stroke, and type 2 diabetes</b>.'},
{topic:'upper',hot:true,q:'A 58-year-old smoker who drinks daily reports hoarseness for 4 weeks. What is the priority?',o:['Antibiotics for suspected laryngitis','Reassurance that hoarseness is common in smokers','Referral for laryngoscopy with biopsy','Voice rest and humidification for 2 more weeks'],c:2,t:'single',r:'<b>Hoarseness over 2 weeks is the hallmark of laryngeal cancer.</b> <b>Smoking and alcohol together are synergistic</b>, raising risk far beyond either alone. Reassurance or symptomatic treatment delays diagnosis. Definitive workup is <b>laryngoscopy with biopsy</b>.'},
{topic:'upper',hot:true,q:'A patient has had a total laryngectomy. Which teaching point is essential?',o:['Blow the nose gently to clear secretions','Bathe by fully submerging in a tub','Resume normal speech within a few days','Cover the stoma when coughing and never swim'],c:3,t:'single',r:'After a total laryngectomy the patient <b>breathes through a permanent stoma with no connection between the nose or mouth and the lungs</b>. So no nose-blowing, <b>no swimming</b>, shower with care, cover the stoma when coughing, and <b>humidify</b> since the nose no longer warms or filters air. <b>CPR is given through the stoma.</b> Speech requires therapy.'},
{topic:'upper',hot:false,q:'Which is the correct teaching for a patient using oxymetazoline nasal spray?',o:['Limit use to 3 days to avoid rebound congestion','It may be used indefinitely if it works','Use it daily for the entire allergy season','Use it twice as often if congestion returns'],c:0,t:'single',r:'<b>Topical decongestants cause rebound congestion beyond 3 days.</b> The patient reports it stopped working and uses more, worsening the cycle. Switch to saline or an oral agent.'},
{topic:'upper',hot:false,q:'A patient with laryngitis asks how to rest their voice. What is the best advice?',o:['Clear the throat frequently to loosen the cords','Whisper instead of speaking','Avoid all communication for a week','Speak softly rather than whispering'],c:3,t:'single',r:'<b>Whispering strains the vocal cords MORE than speaking softly.</b> Rest the voice, humidify, increase fluids, and avoid throat clearing, which traumatizes the cords further.'},
{topic:'upper',hot:true,q:'Which instructions are appropriate after a tonsillectomy? Select all that apply.',o:['Position side-lying or prone to allow drainage','Report frequent swallowing immediately','Encourage gargling with salt water','Use a straw to reduce throat contact','Offer cool clear liquids','Apply an ice collar for comfort'],c:[0,1,4,5],t:'multi',r:'<b>Side-lying or prone</b> lets secretions drain, an <b>ice collar</b> reduces swelling, <b>cool clear liquids</b> are tolerated, and <b>frequent swallowing signals bleeding</b>. <b>No gargling, no straws, no coughing or throat clearing</b> \\u2014 all disturb the surgical site.'},
{topic:'upper',hot:false,q:'Which findings suggest obstructive sleep apnea? Select all that apply.',o:['Productive cough with purulent sputum','Gasping or choking arousals during sleep','Hoarseness lasting over 2 weeks','Excessive daytime sleepiness','Morning headache','Loud snoring with witnessed apneic episodes'],c:[1,3,4,5],t:'multi',r:'OSA presents with <b>loud snoring, witnessed apnea, gasping arousals, unrefreshing sleep, daytime sleepiness, morning headache, and irritability</b>. Purulent sputum suggests infection, and prolonged hoarseness points to <b>laryngeal cancer</b>.'},
{topic:'pneumonia',hot:true,q:'A patient develops pneumonia 3 days after admission for a hip fracture. How is this classified?',o:['Ventilator-associated pneumonia','Healthcare-associated pneumonia','Hospital-acquired pneumonia','Community-acquired pneumonia'],c:2,t:'single',r:'<b>The 48-hour rule.</b> Onset <b>48 hours or more AFTER admission</b>, not incubating at admit, is <b>HAP</b>. It carries higher mortality and more resistant organisms including MRSA and <i>Pseudomonas</i>.'},
{topic:'pneumonia',hot:true,q:'Which nursing action should be completed before the first dose of antibiotics for pneumonia?',o:['Obtain sputum and blood cultures','Complete a swallow evaluation','Administer an antipyretic','Obtain a repeat chest x-ray'],c:0,t:'single',r:'<b>Cultures BEFORE antibiotics.</b> Once the first dose is given the culture may not grow the organism, and you lose the ability to narrow therapy from broad-spectrum coverage.'},
{topic:'pneumonia',hot:false,q:'A patient with pneumonia in the right lower lobe should be positioned how to optimize oxygenation?',o:['In Trendelenburg position','With the good lung down','Flat on the back','With the affected lung down'],c:1,t:'single',r:'<b>Good lung down.</b> Gravity increases perfusion to the dependent lung, so placing the <b>healthy</b> lung down matches blood flow to the better-ventilated side and improves the <b>V/Q match</b>.'},
{topic:'pneumonia',hot:true,q:'A patient with pneumonia has been on appropriate antibiotics for 72 hours but remains febrile. What should the nurse suspect?',o:['A complication such as empyema, abscess, or a resistant organism','An allergic reaction to the antibiotic','Inadequate fluid intake','A normal response requiring more time'],c:0,t:'single',r:'Response is expected within <b>24 to 48 hours</b>. A fever persisting past 72 hours suggests <b>empyema, lung abscess, a resistant organism, or another complication</b>. This calls for reimaging and reassessment, not waiting.'},
{topic:'pneumonia',hot:false,q:'Which patient is at greatest risk for aspiration pneumonia?',o:['A patient recovering from a wrist fracture','A patient ambulating on postoperative day 2','A patient receiving bolus tube feedings after a stroke','A patient with well-controlled asthma'],c:2,t:'single',r:'<b>Stroke plus tube feeding is a high-risk combination</b>, and <b>bolus feeding carries higher aspiration risk</b> than continuous. Keep the head of bed at <b>30 to 45 degrees during and 30 to 60 minutes after</b> feeding, and complete a <b>swallow study before oral intake</b>.'},
{topic:'pneumonia',hot:true,q:'Which assessment finding indicates consolidation rather than pleural effusion?',o:['Decreased tactile fremitus','Hyperresonance on percussion','Increased tactile fremitus with egophony','Absent breath sounds with tracheal deviation away'],c:2,t:'single',r:'<b>Both percuss dull \\u2014 fremitus decides.</b> Consolidation is solid tissue that <b>conducts vibration better</b>, so fremitus <b>increases</b> and <b>egophony</b> appears. Effusion is fluid that blocks transmission, so fremitus <b>decreases</b>.'},
{topic:'pneumonia',hot:false,q:'Which are components of the VAP prevention bundle? Select all that apply.',o:['Changing the ventilator circuit every 8 hours','Routine saline instillation before suctioning','Daily sedation interruption with extubation readiness assessment','Head of bed elevated 30 to 45 degrees','Oral care with chlorhexidine','Peptic ulcer and DVT prophylaxis'],c:[2,3,4,5],t:'multi',r:'The bundle is <b>head of bed 30 to 45 degrees, daily sedation interruption with extubation readiness, chlorhexidine oral care, and ulcer plus DVT prophylaxis</b>. <b>Saline instillation is contraindicated</b> \\u2014 it does not thin secretions and pushes bacteria into the lower airway.'},
{topic:'copd',hot:true,q:'Which patient presentation is most consistent with chronic bronchitis rather than emphysema?',o:['Early dyspnea with pursed-lip breathing','Cyanotic, overweight, with copious sputum and early peripheral edema','Thin, pink, barrel-chested with minimal cough','Normal blood gases until late in the disease'],c:1,t:'single',r:'<b>Blue bloater:</b> mucus obstruction causes poor oxygenation and <b>cyanosis</b>, plus <b>early right heart failure</b> and edema. <b>Pink puffer</b> (emphysema) is thin and barrel-chested, hyperventilates to stay pink, and develops right heart failure <b>late</b>.'},
{topic:'copd',hot:false,q:'Which spirometry result confirms COPD?',o:['Post-bronchodilator FEV1/FVC below 0.70','FEV1 improvement of 12% after a bronchodilator','Increased vital capacity with normal residual volume','A normal FEV1/FVC with reduced total lung capacity'],c:0,t:'single',r:'<b>A post-bronchodilator FEV1/FVC below 0.70</b> confirms persistent, not-fully-reversible airflow limitation. <b>Improvement of 12% or more after a bronchodilator indicates reversibility \\u2014 that is ASTHMA.</b> A normal ratio with reduced volumes is a <b>restrictive</b> pattern.'},
{topic:'copd',hot:true,q:'A COPD patient reports increased dyspnea with thicker, darker sputum. What does this suggest?',o:['An exacerbation, usually triggered by infection','Oxygen toxicity','Improved secretion clearance','Normal disease progression requiring no change'],c:0,t:'single',r:'The three markers of an exacerbation are <b>increased dyspnea, increased sputum volume, and a change in sputum color or thickness</b>. Exacerbations are usually <b>infection-triggered</b>, which is why <b>annual influenza and pneumococcal vaccination</b> are core teaching.'},
{topic:'copd',hot:false,q:'Why should a COPD patient avoid gas-forming foods and large meals?',o:['Abdominal distention pushes on an already flattened diaphragm','They raise the risk of aspiration','They interfere with bronchodilator absorption','They increase mucus production'],c:0,t:'single',r:'Air trapping <b>flattens the diaphragm</b>, and abdominal distention pushes up against it, further reducing an already inefficient breathing mechanism. Teach <b>small, frequent, high-calorie high-protein meals with rest beforehand</b>.'},
{topic:'copd',hot:true,q:'Which finding in a COPD patient requires immediate intervention?',o:['Pursed-lip breathing','Increasing somnolence and confusion','Prolonged expiratory phase','A barrel-shaped chest'],c:1,t:'single',r:'<b>Somnolence and confusion signal rising CO2</b>, not comfort or rest. The other three are <b>chronic, expected</b> findings in COPD. A drowsy COPD patient is decompensating.'},
{topic:'copd',hot:false,q:'A patient asks whether COPD will improve with treatment. What is the nurse\'s best response?',o:['Symptoms resolve completely once oxygen therapy begins','Pulmonary rehabilitation restores normal lung function','Treatment slows progression and manages symptoms, and quitting smoking helps most','With consistent inhaler use the lung damage will reverse'],c:2,t:'single',r:'<b>COPD is not fully reversible.</b> The goals are to <b>slow progression and manage symptoms</b>. <b>Smoking cessation is the only intervention shown to slow the decline in lung function</b>, at any stage. Pulmonary rehab improves tolerance and quality of life but does not reverse damage.'},
{topic:'copd',hot:true,q:'An asthmatic patient who was wheezing loudly now has a quiet chest and is drowsy. What does the nurse do?',o:['Encourage rest since the attack is resolving','Prepare for emergency intervention, as this indicates impending respiratory arrest','Reduce the oxygen and continue monitoring','Document improvement in air movement'],c:1,t:'single',r:'<b>A silent chest means air is no longer moving</b> \\u2014 worse, not better. Combined with <b>drowsiness (CO2 narcosis)</b>, this is <b>impending respiratory arrest</b>. Treatment is continuous beta-2 agonist, ipratropium, systemic steroids, oxygen, IV magnesium, and <b>preparation for intubation</b>.'},
{topic:'abg',hot:true,q:'An ABG shows pH 7.30, PaCO2 52, HCO3 24. What is the compensation status?',o:['Uncompensated','Partially compensated','Fully compensated','No acid-base disturbance'],c:0,t:'single',r:'<b>Count the abnormal values.</b> pH is abnormal and <b>only ONE</b> of PaCO2/HCO3 is abnormal (the CO2), so the kidneys have not started helping. That is <b>UNcompensated</b>. Partial would need <b>both</b> abnormal with an abnormal pH; full would need both abnormal with a <b>normal</b> pH.'},
{topic:'abg',hot:true,q:'An ABG shows pH 7.31, PaCO2 55, HCO3 30. What is the compensation status?',o:['Partially compensated','Uncompensated','Fully compensated','Normal'],c:0,t:'single',r:'<b>pH is still abnormal AND both PaCO2 and HCO3 are abnormal</b> \u2014 that is <b>partial compensation</b>. The kidneys have started retaining bicarbonate but have not brought the pH back into range yet. Once the pH normalizes with both values still abnormal, it is <b>fully</b> compensated.'},
{topic:'abg',hot:true,q:'Which mnemonic describes the assessment findings of respiratory acidosis?',o:['CAN\'T BREATHE \u2014 breathless, restless, elevated CO2, altered mental status, tachy, headache, exhausted','LIGHT + A \u2014 lightheaded, increased respiration, giddiness, hand tingling, tetany, anxiety','BASIC \u2014 breathing depressed, arrhythmias, seizures, irritability, confusion','FRIED \u2014 fever, restlessness, increased fluid retention, extreme thirst'],c:0,t:'single',r:'<b>CAN\'T BREATHE</b> is respiratory acidosis \u2014 they are not moving air and CO2 is climbing. <b>LIGHT + A</b> is respiratory <b>alkalosis</b> (breathing too much), <b>BASIC</b> is metabolic <b>alkalosis</b>, and <b>FRIED</b> is <b>hypernatremia</b>.'},
{topic:'abg',hot:true,q:'A patient with metabolic alkalosis from prolonged NG suction needs which electrolytes replaced?',o:['Potassium and chloride','Sodium and magnesium','Calcium and phosphorus','Magnesium and bicarbonate'],c:0,t:'single',r:'Vomiting and NG suction lose <b>hydrogen, potassium, and chloride together</b>. The alkalosis will not fully correct until the <b>chloride</b> is replaced, and the <b>hypokalemia</b> perpetuates it. Adding more bicarbonate would worsen the alkalosis.'},
{topic:'abg',hot:false,q:'What are the normal values for PaO2 and SaO2?',o:['PaO2 80 to 100 mmHg and SaO2 95 to 100%','PaO2 35 to 45 mmHg and SaO2 80 to 100%','PaO2 22 to 26 mmHg and SaO2 90 to 95%','PaO2 7.35 to 7.45 and SaO2 88 to 92%'],c:0,t:'single',r:'<b>PaO2 80 to 100 mmHg</b> (oxygenation) and <b>SaO2 95 to 100%</b> (oxygen saturation). Neither is part of the <b>acid-base</b> call \u2014 that is decided by pH, PaCO2 (35 to 45), and HCO3 (22 to 26).'},
{topic:'abg',hot:false,q:'A patient in metabolic acidosis develops deep rapid Kussmaul respirations. What does this represent?',o:['Respiratory compensation \u2014 the lungs blowing off CO2, which is acid','A separate respiratory complication requiring intubation','Anxiety-driven hyperventilation','Worsening of the acidosis'],c:0,t:'single',r:'<b>Kussmaul respirations ARE the compensation.</b> The lungs increase rate and depth to <b>blow off CO2</b>, which is acid, raising the pH back toward normal. That is why the CO2 comes back <b>low</b> in a metabolic acidosis gas even with healthy lungs. Lungs compensate in <b>minutes</b>; kidneys take <b>days</b>.'},
{topic:'hisquiz',hot:true,q:'A 24-year-old client presents to the emergency department experiencing an acute asthma attack. The client is tachypneic, using accessory muscles to breathe, and audible wheezes are present. Which prescribed medication should the nurse administer immediately?',o:['Salmeterol inhaler','Albuterol nebulizer treatment','Montelukast oral tablet','Budesonide inhaled corticosteroid'],c:1,t:'single',r:'<b>Albuterol is the RESCUE drug</b> — a short-acting beta-2 agonist with onset in minutes. <b>Salmeterol is long-acting maintenance and is never used during an attack.</b> Montelukast and budesonide are controllers that take days to weeks.'},
{topic:'hisquiz',hot:true,q:'The nurse is caring for a client in severe status asthmaticus. Upon assessment, the nurse notes that the client\'s wheezing has suddenly stopped, and the chest is silent. What is the priority nursing action?',o:['Document the finding as a sign that the acute asthma attack has resolved','Reassure the client and administer a dose of oral corticosteroids','Place the client in a supine position and prepare for a chest X-ray','Notify the rapid response team and prepare for emergency endotracheal intubation'],c:3,t:'single',r:'<b>A silent chest means air is no longer moving</b> — impending respiratory arrest, not improvement. This is the classic trap where the finding reads as better and means worse.'},
{topic:'hisquiz',hot:true,q:'A client with COPD and chronic hypercapnia is admitted with an exacerbation. The client\'s baseline oxygen saturation is 88% on room air. Which prescribed oxygen delivery order should the nurse question or clarify?',o:['Oxygen at 5 L/min via simple face mask','Oxygen at 2 L/min via nasal cannula','Venturi mask delivering 28% oxygen','Continuous pulse oximetry monitoring targeting 88%-92% saturation'],c:0,t:'single',r:'⚠️ <b>HIS ANSWER KEY SAYS B. Work it through and A appears correct.</b> A simple face mask at 5 L/min delivers about <b>40%</b>, too high for chronic hypercapnia. <b>2 L nasal cannula is exactly what he taught for COPD</b>, a <b>Venturi at 28%</b> is the precise low-dose device, and <b>88–92%</b> is the correct target. Three are appropriate and one is not. <b>Ask him about this one before the exam.</b>'},
{topic:'hisquiz',hot:true,q:'A client with severe COPD complains of extreme shortness of breath and fatigue while eating meals, leading to significant weight loss. Which dietary modification should the nurse recommend?',o:['Eat three large, high-calorie meals daily, resting for 1 hour after each meal','Eat small, frequent meals that are high in calories and protein','Drink high-volume liquids with meals to help clear respiratory secretions','Consume a high-carbohydrate diet to maximize energy production'],c:1,t:'single',r:'<b>Small, frequent, high-calorie high-protein meals</b> with <b>rest BEFORE</b> eating. Large meals and high fluid volume cause <b>abdominal distention that pushes on an already flattened diaphragm</b>. High carbohydrate loads also increase CO₂ production.'},
{topic:'hisquiz',hot:true,q:'A client arrives following a motor vehicle collision with severe respiratory distress, absent breath sounds on the right side, tracheal deviation to the left, and jugular venous distension. What is the immediate priority intervention?',o:['Assist with emergent needle decompression of the right chest','Administer high-flow oxygen via non-rebreather mask and monitor vital signs','Prepare the client for an emergent chest X-ray','Place a non-porous occlusive dressing taped on all four sides over the wound'],c:0,t:'single',r:'<b>Tension pneumothorax.</b> Tracheal deviation <b>AWAY</b> from the affected side plus JVD and absent sounds is the emergency. <b>Needle decompression, then chest tube.</b> Do not wait for imaging, and <b>never tape all four sides</b> — that traps air and creates the tension.'},
{topic:'hisquiz',hot:true,q:'A client with blunt chest trauma from a steering wheel impact is diagnosed with a flail chest. Which assessment finding is most characteristic of this condition?',o:['Symmetrical chest wall expansion during inspiration','Tracheal deviation toward the unaffected side during exhalation','Muffled heart sounds and a narrowed pulse pressure','Paradoxical chest wall movement during respiration'],c:3,t:'single',r:'<b>Paradoxical movement</b> — the flail segment moves <b>IN on inspiration and OUT on expiration</b>, opposite the rest of the chest. Muffled heart sounds with narrowed pulse pressure is <b>cardiac tamponade</b>.'},
{topic:'hisquiz',hot:true,q:'While assessing a client with a closed chest tube drainage system connected to suction, the nurse notices continuous bubbling in the water-seal chamber. What does this finding indicate?',o:['Normal operation of the chest drainage system','An air leak within the chest tube system','Re-expansion of the lung tissue and healing of the pleural space','Obstruction or kinking of the chest tube catheter'],c:1,t:'single',r:'<b>CONTINUOUS bubbling in the WATER SEAL chamber is an AIR LEAK.</b> Gentle continuous bubbling in the <b>suction control</b> chamber is normal. Same observation, opposite meaning, decided by <b>which chamber</b>.'},
{topic:'hisquiz',hot:true,q:'The nurse receives shift report for four clients. Which client should the nurse assess first?',o:['A client with stable COPD producing thick green sputum','A client post-thoracotomy with 150 mL of dark red drainage in the first hour','A client with COPD who appears increasingly restless and confused','A client with asthma who used a rescue inhaler 2 hours ago and reports feeling better'],c:2,t:'single',r:'<b>Restlessness and confusion are the earliest signs of hypoxia</b> and in COPD signal rising CO₂. That is an airway and breathing problem. The 150 mL drainage is concerning and worth a call, but the <b>neurologic change in a COPD patient outranks it</b>.'},
{topic:'hisquiz',hot:true,q:'The nurse is assessing a client who had a chest tube inserted 4 hours ago for a traumatic pneumothorax. Upon palpation around the insertion site, the nurse feels a crackling sensation under the skin. What is the appropriate initial nursing action?',o:['Outline the area of subcutaneous emphysema with a marking pen, document the finding, and continue to monitor','Immediately clamp the chest tube and notify the healthcare provider','Apply suction up to -40 cm H2O to eliminate the trapped air','Remove the chest tube dressing and massage the air out of the tissue pockets'],c:0,t:'single',r:'<b>Subcutaneous emphysema.</b> A small amount is common after chest tube insertion. <b>Outline it with a marking pen and time it</b> so you can tell whether it is spreading, document, and monitor. <b>Never clamp</b> a chest tube — that risks tension pneumothorax. Massaging and extreme suction are both wrong.'},
{topic:'hisquiz',hot:true,q:'A client is admitted with a serum potassium level of 6.8 mEq/L and exhibits peaked T waves on the EKG. Which prescribed intervention is the priority to rapidly shift potassium into the cells?',o:['Administer sodium polystyrene sulfonate orally','Administer regular insulin and 50% dextrose intravenously','Administer furosemide 40 mg IV push','Administer calcium gluconate IV push over 2 minutes'],c:1,t:'single',r:'Read the stem: it asks what <b>SHIFTS</b> potassium into the cells. That is <b>insulin with dextrose</b>. <b>Calcium gluconate PROTECTS the heart</b> but does not move potassium. <b>Kayexalate REMOVES</b> it, slowly. Sequence is <b>protect → shift → remove</b>.'},
{topic:'hisquiz',hot:true,q:'A client receiving high-dose loop diuretic therapy reports generalized muscle weakness and cramping. The nurse reviews the EKG and notes flattened T waves and prominent U waves. Which nursing action is the top priority?',o:['Prepare the client for emergency hemodialysis','Administer a dose of IV regular insulin','Place the client on continuous cardiac telemetry monitoring','Insert an indwelling urinary catheter to measure strict output'],c:2,t:'single',r:'<b>Flattened T waves with U waves is hypokalemia</b> — loop diuretics waste potassium. The danger is <b>lethal dysrhythmia</b>, so <b>continuous telemetry</b> is the priority. Dialysis and insulin treat <b>hyper</b>kalemia and would make this worse.'},
{topic:'hisquiz',hot:true,q:'A client with severe hyponatremia (serum sodium 118 mEq/L) is admitted experiencing acute confusion, lethargy, and muscle twitching. Which safety precaution is essential for this client?',o:['Restrict the client to a soft-food diet to prevent aspiration','Pad the bedside rails and keep suction equipment ready for sudden hyperthermia','Maintain the room in complete darkness to prevent photophobia','Implement seizure precautions, including padded side rails and low bed position'],c:3,t:'single',r:'<b>Low sodium swells the brain.</b> At 118 with confusion and twitching, <b>seizure precautions</b> are essential. The <b>S in SALT LOSS is Seizures.</b> Correct the sodium <b>slowly</b> — rapid correction causes osmotic demyelination.'},
{topic:'hisquiz',hot:true,q:'A client presents with a serum sodium level of 154 mEq/L, intense thirst, dry sticky mucous membranes, and a slightly elevated temperature. Which initial nursing intervention is most appropriate?',o:['Administer oral free water replacement or hypotonic IV fluids as prescribed','Administer 3% hypertonic saline solution via infusion pump','Implement strict fluid restriction to 500 mL per 24 hours','Administer large doses of intravenous potassium chloride'],c:0,t:'single',r:'<b>Hypernatremia — FRIED:</b> Fever, Restlessness, Increased fluid retention, Extreme thirst, Decreased urine output. Treatment is <b>gradual free water replacement</b>. <b>3% saline would raise the sodium further.</b> Do not correct faster than <b>12 mEq/L in 24 hours</b> — cerebral edema risk.'},
{topic:'hisquiz',hot:true,q:'The nurse is monitoring a client following a total thyroidectomy. When the nurse inflates the blood pressure cuff on the client\'s upper arm, the client\'s hand goes into carpal spasm. How should the nurse document and interpret this finding?',o:['Positive Chvostek\'s sign, indicating hypercalcemia and neuromuscular irritability','Positive Trousseau\'s sign, indicating hypocalcemia and neuromuscular hyperexcitability','Negative Trousseau\'s sign, indicating normal parathyroid function','Positive Homan\'s sign, indicating deep vein thrombosis'],c:1,t:'single',r:'<b>Trousseau = Tourniquet.</b> BP cuff → carpal spasm. <b>Chvostek = CHeek</b> — tap the facial nerve, get a twitch. Both indicate <b>HYPOcalcemia</b>. After a <b>thyroidectomy the parathyroids may be injured or removed</b>, so hypocalcemia is the expected complication — watch for it in the first 24 to 48 hours.'},
{topic:'hisquiz',hot:true,q:'A client with metastatic bone cancer develops a serum calcium level of 12.0 mg/dL, reporting muscle weakness, lethargy, and constipation. Which collaborative intervention should the nurse anticipate implementing first?',o:['Administer oral calcium carbonate supplements with meals','Apply continuous cold compresses to the lower extremities','Administer large volumes of IV normal saline followed by a loop diuretic','Initiate strict bed rest to prevent pathological bone fractures'],c:2,t:'single',r:'<b>Hypercalcemia: Bones, Stones, Groans, Moans.</b> Treatment is <b>isotonic saline hydration FIRST, then a loop diuretic</b>, then a bisphosphonate. Giving calcium worsens it, and <b>bed rest worsens it too</b> — immobility releases more calcium from bone, so you <b>encourage mobility</b>.'},
{topic:'hisquiz',hot:true,q:'A client is admitted with an acute exacerbation of heart failure and severe fluid volume excess. Which specific assessment finding indicates that the client\'s condition is worsening and fluid is accumulating in the pulmonary interstitial spaces?',o:['Increased skin turgor over the sternum','Flattened neck veins when lying flat','Clear and vesicular breath sounds bilaterally','Presence of bibasilar crackles and an audible S3 heart sound'],c:3,t:'single',r:'<b>Bibasilar crackles plus an S3</b> means fluid is backing into the lungs. The <b>S3 is the sound of a ventricle receiving volume it cannot handle</b> and is a hallmark of fluid overload in heart failure. Flattened neck veins indicate <b>deficit</b>, not excess.'},
{topic:'hisquiz',hot:true,q:'A client presents with severe vomiting and diarrhea for 3 days. BP 86/52, heart rate 118, respiratory rate 22. The client appears dizzy when standing. What is the priority nursing intervention?',o:['Initiate rapid isotonic IV fluid replacement, such as 0.9% Normal Saline','Place the client in a high-Fowler\'s position with legs dependent','Administer a potent loop diuretic to manage the orthostatic hypotension','Encourage oral fluid restriction to reduce third-spacing'],c:0,t:'single',r:'<b>Fluid volume deficit with hypotension and orthostatic changes.</b> Treatment is <b>isotonic fluid replacement</b>. A diuretic and fluid restriction would both worsen it, and high-Fowler with legs dependent drops cerebral perfusion further.'},
{topic:'hisquiz',hot:true,q:'A newly graduated nurse is preparing medications. The charge nurse must intervene immediately when observing the novice nurse perform which action?',o:['Diluting oral potassium elixir in 120 mL of juice before administration','Preparing an IV piggyback of potassium chloride for direct intravenous push administration','Checking the client\'s urine output prior to administering IV potassium','Using a dedicated infusion pump to deliver IV potassium chloride at 10 mEq/hr'],c:1,t:'single',r:'<b>NEVER IV push potassium — it is fatal.</b> Always dilute, always on a pump, never exceed the ordered rate, and confirm <b>urine output</b> first. The other three actions are all correct practice.'},
{topic:'hisquiz',hot:true,q:'An adult client is admitted following a severe motor vehicle crash with active hemorrhage and signs of hypovolemic shock (BP 78/44, HR 125). Which initial intravenous fluid prescription should the nurse anticipate implementing first?',o:['0.45% Sodium Chloride','0.9% Sodium Chloride','3% Sodium Chloride','5% Dextrose in Water'],c:1,t:'single',r:'<b>Isotonic 0.9% NS</b> for initial resuscitation while blood products are prepared. Hypotonic fluids would shift water into cells rather than expand the vascular space, and hypertonic saline is for symptomatic hyponatremia and cerebral edema. Remember <b>blood loss is ultimately replaced with blood</b>.'},
{topic:'hisquiz',hot:true,q:'A client is prescribed 0.45% Sodium Chloride intravenous infusion. What is the primary physiological mechanism and fluid shift associated with the administration of this hypotonic solution?',o:['Fluid is drawn out of the cells and into the intravascular space, shrinking the cells','Fluid remains strictly in the extracellular space with no net movement into or out of cells','Fluid is pulled from the interstitial spaces directly into the lymphatic channels','Fluid shifts from the intravascular space into the interstitial spaces and cells, causing the cells to swell'],c:3,t:'single',r:'<b>Hypotonic means fewer solutes than the cell, so water follows the solutes INTO the cell and it swells.</b> Option A describes <b>hypertonic</b>, option B describes <b>isotonic</b>. Remember: <b>hypO makes cells swell like an O.</b>'},
{topic:'hisquiz',hot:true,q:'The nurse is caring for a client with severe head trauma who is developing cerebral edema and increased intracranial pressure. Which intravenous solution is most appropriate to reduce this cellular swelling?',o:['3% Sodium Chloride','Lactated Ringer\'s Solution','0.45% Sodium Chloride','5% Dextrose in 0.225% Sodium Chloride'],c:0,t:'single',r:'<b>3% NS is hypertonic and pulls water OUT of swollen brain cells.</b> Hypotonic solutions and D5W are <b>contraindicated</b> in cerebral edema because they drive more water in. Correct the sodium <b>slowly</b> and monitor closely.'},
{topic:'hisquiz',hot:true,q:'A nurse is reviewing new intravenous fluid prescriptions. For which client condition should the nurse immediately question a prescription for a hypotonic intravenous solution such as 0.45% Normal Saline?',o:['Diabetic ketoacidosis with severe hyperosmolar hyperglycemia','Hypernatremia due to excessive water loss','Acute stroke with suspected cerebral edema and elevated intracranial pressure','Severe dehydration from prolonged loop diuretic therapy'],c:2,t:'single',r:'<b>Hypotonic fluids are contraindicated with increased ICP, head injury, burns, liver dysfunction, and hypotension</b> because water shifts into cells and worsens cerebral edema. Hypotonic fluid is actually <b>appropriate</b> for hypernatremia and is used in DKA after initial resuscitation.'},
{topic:'hisquiz',hot:true,q:'The nurse is monitoring a client receiving a continuous infusion of 3% Sodium Chloride for profound symptomatic hyponatremia. Which clinical assessment finding requires the most immediate intervention?',o:['Serum sodium level rising from 116 mEq/L to 121 mEq/L over 12 hours','Development of bounding peripheral pulses, neck vein distension, and crackles in lung bases','Mild thirst and dry lips reported by the alert client','Urine output measuring 55 mL/hour over the last two hours'],c:1,t:'single',r:'<b>Bounding pulses, JVD, and crackles are FLUID OVERLOAD.</b> 3% NS pulls water into the vascular space, so overload is the danger. A rise of 5 mEq over 12 hours is within the safe correction rate, and the urine output is adequate.'},
{topic:'hisquiz',hot:true,q:'A newly admitted client has end-stage renal disease, severe hyperkalemia, and lactic acidosis. Which intravenous crystalloid solution should the nurse question if prescribed?',o:['0.9% Sodium Chloride','5% Dextrose in Water','0.45% Sodium Chloride','Lactated Ringer\'s Solution'],c:3,t:'single',r:'<b>Lactated Ringer\'s contains POTASSIUM and LACTATE.</b> In ESRD the potassium cannot be excreted, worsening the hyperkalemia, and a patient already in lactic acidosis cannot clear more lactate. LR is avoided in <b>renal and liver dysfunction, hyperkalemia, and hyperlactatemia</b>.'},
{topic:'hisquiz',hot:true,q:'A nurse is explaining the properties of 5% Dextrose in Water to a nursing student. Which statement accurately describes how D5W behaves once infused into the vascular system?',o:['It is isotonic in the IV bag, but acts as a hypotonic solution in the body after dextrose is metabolized','It remains an isotonic solution permanently within the extracellular compartment','It functions as a hypertonic fluid that permanently pulls fluid out of the interstitial spaces','It contains large protein molecules that exert colloidal oncotic pressure'],c:0,t:'single',r:'<b>Dextrose metabolizes quickly and disappears</b>, leaving free water. So D5W is <b>isotonic in the bag and hypotonic in the patient</b>. That is why it is contraindicated in cerebral edema. Large protein molecules describes a <b>colloid</b> such as albumin.'},
{topic:'hisquiz',hot:true,q:'A prescription is written to infuse 5% Dextrose in 0.45% Sodium Chloride. How is this specific intravenous solution classified regarding its tonicity?',o:['Isotonic','Hypotonic','Hypertonic','Colloidal'],c:2,t:'single',r:'<b>D5½NS is HYPERTONIC</b> at about 406 mOsm. Adding dextrose to half-normal saline raises the osmolarity above plasma. It is used for maintenance, fluid volume deficits, and in DKA <b>once glucose falls below 250</b>.'},
{topic:'hisquiz',hot:true,q:'A client with Diabetic Ketoacidosis is admitted with severe dehydration, high blood glucose, and profound volume depletion. Which fluid is the standard first-line choice for initial resuscitation?',o:['5% Dextrose in Water','0.9% Sodium Chloride','3% Sodium Chloride','0.225% Sodium Chloride'],c:1,t:'single',r:'<b>0.9% NS first</b> to expand intravascular volume. Later fluid choice depends on the <b>sodium level and glucose</b>, and <b>dextrose is added once glucose falls to about 250</b> so insulin can keep clearing ketones without dropping the glucose too fast.'},

<h2 class="sec-title"><span class="sec-emoji">🩺</span> Priority Decoder</h2>
<p class="intro-line">His priority stems hand you four real problems. This is the table that ranks them.</p>

<div class="card" style="border-color:var(--teal)">
  <h3>The ranking rule</h3>
  <p class="why-chain">Do not rank by how abnormal a value looks. Rank by <b>how fast it kills</b>. Airway beats breathing, breathing beats circulation, and an acute change beats a stable abnormal number every time.</p>
  <ul class="clean">
    <li><b>Minutes:</b> airway obstruction, stridor, silent chest, tension pneumothorax, acute hemolytic transfusion reaction, hyperkalemia with a widening QRS, laryngospasm from hypocalcemia.</li>
    <li><b>Hours:</b> new confusion, refractory hypoxemia, a rising CO2 in a tiring asthmatic, urine output under 30 mL/hr, an air leak in the water seal.</li>
    <li><b>Days:</b> wound infection, poor intake, deconditioning, mild electrolyte drift.</li>
    <li><b>Not a priority now:</b> expected findings, stable chronic values, a patient asking about discharge.</li>
  </ul>
</div>

<div class="card">
  <h3>Finding → what it actually means</h3>
  <table class="lab">
    <tr><th>Finding in the stem</th><th>What he wants you to name</th><th>Rank</th></tr>

    <tr><td>Stridor</td><td><b>Upper airway obstruction</b></td><td>Minutes</td></tr>
    <tr><td>Silent chest in an asthma attack</td><td><b>Impending respiratory failure</b></td><td>Minutes</td></tr>
    <tr><td>PaCO₂ rising from 28 toward normal in asthma</td><td>The patient is <b>tiring</b>, not improving</td><td>Minutes</td></tr>

    <tr><td>Continuous bubbling in the water-seal chamber</td><td><b>Air leak</b> that can become a tension pneumo</td><td>Minutes to hours</td></tr>
    <tr><td>Fever, chills, back pain 10 min into a transfusion</td><td><b>Acute hemolytic reaction</b> — stop the blood</td><td>Minutes</td></tr>
    <tr><td>Peaked T waves with a widening QRS</td><td><b>Hyperkalemia</b> — calcium gluconate first</td><td>Minutes</td></tr>
    <tr><td>Perioral tingling with a positive Trousseau</td><td><b>Hypocalcemia</b> — laryngospasm risk</td><td>Minutes</td></tr>

    <tr><td>Low-grade fever 24-48 hours post-op</td><td><b>Atelectasis</b>, not infection</td><td>Days</td></tr>
    <tr><td>Tidaling in the water seal</td><td><b>Normal</b> — the system is patent</td><td>None</td></tr>
    <tr><td>Bubbling in the suction-control chamber</td><td><b>Normal</b> on wall suction</td><td>None</td></tr>

  </table>

<div class="card" style="border-color:var(--amber)">
  <h3>Assess or act?</h3>
  <ul class="clean">
    <li><b>Act first</b> when the patient is unstable or the cause is already obvious — stop the blood, stop the infusion, cover the chest tube, open the airway.</li>
    <li><b>Assess first</b> when the finding is new and the cause is unknown — new confusion, a changed breath sound, a first complaint of pain at an IV site.</li>

<h2 class="sec-title"><span class="sec-emoji">🎯</span> Trick Questions</h2>

  </ul>
  <div class="mnem"><div class="tag">🧠 Mnemonic</div><div class="big">"Read it twice, key word slice."</div></div>
</div>

<div class="card" style="border-color:var(--red)"><h3>1. The comfort option that delays the emergency</h3>
<p>A transfusion reaction with "give acetaminophen" or "slow the rate" offered.</p>
<div class="trap"><span class="tag">Why it is wrong</span><b>Stop the blood first.</b> Everything else happens after the infusion is off and saline is running through new tubing.</div></div>

<div class="card" style="border-color:var(--red)"><h3>2. The normal number that is not reassuring</h3>
<p>An asthmatic whose PaCO₂ climbed from 28 to 41.</p>
<div class="trap"><span class="tag">Why it is wrong</span>A normalizing CO₂ in a hyperventilating patient means the muscles are <b>failing</b>. Next stop is respiratory acidosis.</div></div>

<div class="card" style="border-color:var(--red)"><h3>3. Silence read as improvement</h3>
<p>Wheezing disappears during a severe asthma attack.</p>
<div class="trap"><span class="tag">Why it is wrong</span>A wheeze needs airflow to exist. No sound means <b>almost no air is moving</b>.</div></div>

<div class="card" style="border-color:var(--red)"><h3>4. Sealing the leak you need open</h3>
<p>A dislodged chest tube with "tape on all four sides" offered.</p>
<div class="trap"><span class="tag">Why it is wrong</span>Three sides makes a <b>flutter valve</b>. Four sides traps air and causes a tension pneumothorax.</div></div>

<div class="card" style="border-color:var(--red)"><h3>5. The right finding in the wrong chamber</h3>
<p>Continuous bubbling in a chest drainage system.</p>
<div class="trap"><span class="tag">Why it is wrong</span>The <b>chamber</b> is the question. Water-seal = air leak. Suction-control on wall suction = normal.</div></div>

<div class="card" style="border-color:var(--red)"><h3>6. Hypotonic fluid to "replace water"</h3>
<p>A hypotensive dehydrated patient with 0.45% saline as an option.</p>
<div class="trap"><span class="tag">Why it is wrong</span>Hypotonic fluid moves water <b>into cells</b> and drops the BP further. Volume problem = isotonic.</div></div>

<div class="card" style="border-color:var(--red)"><h3>7. Edema read as overload</h3>
<p>A swollen patient with a BP of 90/56 and a heart rate of 118.</p>
<div class="trap"><span class="tag">Why it is wrong</span><b>Third spacing.</b> Fluid left the vessel. Swollen outside, empty inside.</div></div>

<div class="card" style="border-color:var(--red)"><h3>8. The calcium lists swapped</h3>
<p>Hypocalcemia with "constipation, kidney stones, lethargy" offered.</p>
<div class="trap"><span class="tag">Why it is wrong</span>That is the <b>hyper</b>calcemia list. Low calcium makes things <b>fire</b>: tetany, tingling, laryngospasm, seizures.</div></div>

<div class="card" style="border-color:var(--red)"><h3>9. Hyperkalemia treatments in the wrong order</h3>
<p>All four options are real hyperkalemia drugs.</p>
<div class="trap"><span class="tag">Why it is wrong</span>Sequence is the question: <b>protect</b> (calcium gluconate) → <b>shift</b> (insulin/dextrose, albuterol) → <b>remove</b> (kayexalate, dialysis).</div></div>

<div class="card" style="border-color:var(--red)"><h3>10. Confusion attributed to age</h3>
<p>An 82-year-old, newly confused, afebrile.</p>
<div class="trap"><span class="tag">Why it is wrong</span>"Normal aging," "sundowning," and "anxiety" all appear. Acute mental status change <b>is</b> the infection presentation.</div></div>

<div class="card" style="border-color:var(--red)"><h3>11. Withholding the thing that fixes the mechanism</h3>
<p>A post-op patient who will not cough because of pain, with an option to hold the opioid.</p>
<div class="trap"><span class="tag">Why it is wrong</span>Pain is what is <b>causing</b> the atelectasis. Medicate first, then pulmonary hygiene.</div></div>

<div class="card" style="border-color:var(--red)"><h3>12. Droplet where airborne belongs</h3>
<p>"All of the following require airborne precautions EXCEPT..."</p>
<div class="trap"><span class="tag">Why it is wrong</span>TB, measles, and varicella are <b>airborne</b>. Bacterial pneumonia is <b>droplet</b>. The EXCEPT wording means the odd one out is the answer.</div></div>

<div id="q-tricks"></div>`;
renderFilteredQuiz('q-tricks', secQ(EXAM.filter(q=>q.topic==='clinical'||q.hot)), 'Trap practice', 'Trick Questions');

</script>

<h2 class="sec-title"><span class="sec-emoji">🎯</span> Final Cram</h2>
<p class="intro-line">Everything that must be memorized, on one page. Read this last, and again in the parking lot.</p>

<div class="tipbar">⏱️ <b>If you have 20 minutes, read only this page.</b> If you have an hour, read this page then do his 27 questions.</div>

<div class="card" style="border-color:var(--purple)">
  <h3>🔢 The numbers</h3>
  <table class="lab">
    <tr><td><b>pH</b></td><td>7.35–7.45 · <b>7.35–7.39 = acid side</b></td><td><b>Na⁺</b></td><td>135–145</td></tr>
    <tr><td><b>PaCO₂</b></td><td>35–45 · lungs · acid</td><td><b>K⁺</b></td><td>3.5–5.0</td></tr>
    <tr><td><b>HCO₃</b></td><td>22–26 · kidneys · base</td><td><b>Ca²⁺</b></td><td>8.5–10.5</td></tr>
    <tr><td><b>PaO₂</b></td><td>80–100</td><td><b>Mg²⁺</b></td><td>1.5–2.5</td></tr>
    <tr><td><b>SaO₂</b></td><td>95–100%</td><td><b>PO₄</b></td><td>2.5–4.5</td></tr>
    <tr><td><b>Osmolality</b></td><td>270–300</td><td><b>Cl⁻</b></td><td>96–106</td></tr>
    <tr><td colspan="4"><b>Respiratory failure:</b> PaO₂ <b>under 60</b> · PaCO₂ <b>over 50 WITH acidosis</b> · SpO₂ <b>under 90%</b> · <b>COPD target 88–92%, no more than 2 L</b></td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🩸 ABG in 15 seconds</h3>
  <div class="mnem"><div class="tag">Step 1</div><div class="big">ROME — Respiratory OPPOSITE, Metabolic EQUAL</div></div>
  <div class="mnem"><div class="tag">Step 2 — compensation: just count</div><div class="big">ONE abnormal = none · BOTH + bad pH = partial · BOTH + normal pH = FULL</div></div>
  <table class="lab">
    <tr><th>Condition</th><th>Gas</th></tr>
    <tr><td>COPD · opioid OD · hypoventilation · neuromuscular</td><td><b>↓pH ↑CO₂</b> — resp acidosis</td></tr>
    <tr><td>Anxiety · pain · fever · early PE · over-ventilation</td><td><b>↑pH ↓CO₂</b> — resp alkalosis</td></tr>
    <tr><td>DKA · shock/lactate · renal failure · <b>DIARRHEA</b></td><td><b>↓pH ↓HCO₃</b> — metabolic acidosis</td></tr>
    <tr><td><b>VOMITING</b> · NG suction · diuretics · antacids</td><td><b>↑pH ↑HCO₃</b> — metabolic alkalosis</td></tr>
  </table>
  <div class="mnem"><div class="tag">The GI pair</div><div class="big">VOMIT acid → ALKALOSIS · POOP base → ACIDOSIS</div><div class="exp"><b>Kidney problem = automatically METABOLIC. Lung problem = automatically RESPIRATORY.</b> Kussmaul IS the compensation.</div></div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>💧 Fluids — the whole topic</h3>
  <div class="mnem"><div class="tag">Tonicity</div><div class="big">hypO swells cells like an O · hypER shrivels them</div></div>
  <table class="lab">
    <tr><th>Situation</th><th>Fluid</th></tr>
    <tr><td>Most things — head injury, vomiting, diarrhea, DKA start, dehydration</td><td><b>0.9% NS</b></td></tr>
    <tr><td><b>Blood transfusion</b></td><td><b>0.9% NS ONLY</b> (dextrose lyses, LR clots)</td></tr>
    <tr><td><b>Burns</b></td><td><b>LR</b> (Parkland)</td></tr>
    <tr><td><b>Liver failure</b></td><td><b>D5W</b> (LR is contraindicated)</td></tr>
    <tr><td><b>Severe symptomatic hyponatremia · cerebral edema</b></td><td><b>3% NS</b> — correct SLOWLY</td></tr>
    <tr><td><b>Hypoglycemia</b></td><td>D50W / D5W</td></tr>
  </table>
  <ul class="clean">
    <li><b>Crystalloids LEAK OUT</b> (3:1 for blood loss). <b>Colloids STAY IN and PULL</b> (albumin, ~1:1).</li>
    <li><b>Hypotonic contraindicated:</b> ↑ICP, head injury, burns, liver dysfunction, hypotension.</li>
    <li><b>D5W:</b> isotonic in the bag, <b>hypotonic in the body</b>. <b>D5½NS is HYPERTONIC.</b></li>
    <li><b>LR avoid:</b> renal/liver dysfunction, <b>hyperkalemia</b>, lactic acidosis, burns for maintenance.</li>
    <li><b>Daily weight is the best fluid indicator.</b> 1 kg = 1 L. <b>Deficit concentrates labs, overload dilutes them.</b></li>
    <li><b>Nurse cannot change rate or fluid type without an order.</b> Slow or stop for safety, then notify.</li>
    <li><b>Third spacing:</b> swollen AND intravascularly dry at the same time.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⚡ Electrolytes</h3>
  <table class="lab">
    <tr><th></th><th>LOW</th><th>HIGH</th><th>ECG</th></tr>
    <tr><td><b>Na</b></td><td><b>SALT LOSS</b> · brain swells, seizures</td><td><b>FRIED</b> · thirst, fever, restless</td><td>—</td></tr>
    <tr><td><b>K</b></td><td><b>6 L's</b> · <b>constipation</b></td><td><b>MURDER</b> · <b>diarrhea</b></td><td>Low <b>flat T + U</b> · High <b>peaked T</b></td></tr>
    <tr><td><b>Ca</b></td><td><b>CATS go numb</b> · Trousseau/Chvostek</td><td><b>Bones Stones Groans Moans</b></td><td>Low <b>long QT</b> · High <b>short QT</b></td></tr>
    <tr><td><b>Mg</b></td><td><b>STARVED</b> · reflexes <b>UP</b></td><td><b>RENAL</b> · reflexes <b>GONE</b> (1st sign)</td><td>Low <b>torsades</b> · High <b>long PR</b></td></tr>
  </table>
  <ul class="clean">
    <li><b>Replace MAGNESIUM first</b> or potassium will not correct.</li>
    <li><b>Hyperkalemia order: PROTECT (calcium gluconate) → SHIFT (insulin+D50, albuterol) → REMOVE (Kayexalate, dialysis).</b></li>
    <li><b>NEVER IV push potassium.</b> Dilute, pump, check urine output.</li>
    <li><b>Correct sodium slowly</b> — max 12 mEq/L per 24 hr. Too fast = <b>demyelination</b> or <b>cerebral edema</b>.</li>
    <li><b>Hypercalcemia: saline FIRST, then loop diuretic, then bisphosphonate.</b> Encourage mobility, not bed rest.</li>
    <li><b>Low Cl = alkalosis. High Cl = acidosis.</b> Phosphorus is <b>inverse to calcium</b>.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--blue)">
  <h3>🫁 Oxygen · the devices</h3>
  <table class="lab">
    <tr><th>Device</th><th>Flow</th><th>FiO₂</th></tr>
    <tr><td>Nasal cannula</td><td>1–6 L</td><td>24–44% (~4%/L)</td></tr>
    <tr><td>Simple mask</td><td><b>5</b>–8 L (never under 5)</td><td>40–60%</td></tr>
    <tr><td>Partial rebreather</td><td>6–11 L</td><td>60–75%</td></tr>
    <tr><td><b>Non-rebreather</b></td><td>10–15 L</td><td><b>60–100% — MOST oxygen</b></td></tr>
    <tr><td><b>⭐ VENTURI</b></td><td>4–12 L</td><td><b>24–50% EXACT — MOST PRECISE</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">Two different questions</div><div class="big">Most PRECISE = Venturi · Most OXYGEN = non-rebreather</div><div class="exp"><b>Oxygen toxicity:</b> FiO₂ over 50% for 24–48 hr → substernal chest pain, dry cough. Keep entrainment ports uncovered. Reservoir bag must not collapse.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>❗ The findings that mean WORSE</h3>
  <ul class="clean">
    <li><b>Silent chest</b> in asthma — no air moving. Prepare to intubate.</li>
    <li><b>CO₂ normalizing</b> in a hyperventilating asthmatic — they are tiring out.</li>
    <li><b>Restlessness and confusion</b> — <b>earliest</b> hypoxia. Cyanosis is <b>last</b>.</li>
    <li><b>Somnolence</b> in COPD — rising CO₂, not rest.</li>
    <li><b>Frequent swallowing</b> post-tonsillectomy — bleeding.</li>
    <li><b>Back or flank pain</b> during transfusion — acute hemolytic reaction.</li>
    <li><b>Pain disappearing</b> in pleurisy — an effusion may have formed.</li>
    <li><b>Falling respiratory rate</b> in a struggling patient — failure, not calm.</li>
  </ul>
</div>

<div class="card">
  <h3>🩹 Chest tubes · 🩸 Transfusion · 🧫 TB</h3>
  <ul class="clean">
    <li><b>Tidaling = good. WATER SEAL bubbling = LEAK. SUCTION chamber bubbling = normal.</b></li>
    <li><b>Dislodged → gauze taped THREE sides. Disconnected → sterile water.</b> Almost never clamp. Over <b>100 mL/hr</b> = notify.</li>
    <li><b>Transfusion:</b> 18–20 g · NS only · start within 30 min · <b>stay first 15 min</b> · finish in 4 hr · reaction → <b>STOP first</b>, NS with <b>new tubing</b>.</li>
    <li><b>TACO = HYPERtension + JVD. TRALI = HYPOtension + fever.</b></li>
    <li><b>RIPE:</b> Rifampin orange · INH needs B6 · Pyrazinamide uric acid · Ethambutol eyes. <b>All hepatotoxic.</b> <b>N95 on staff, surgical mask on patient.</b> Skin test = <b>exposure</b>; sputum confirms.</li>
    <li><b>Anticoagulants PREVENT. Thrombolytics DISSOLVE.</b> Never massage a suspected DVT.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>💊 Drugs</h3>
  <div class="mnem"><div class="tag">The rule</div><div class="big">SHORT-acting = RESCUE · LONG-acting = MAINTENANCE</div><div class="exp"><b>Albuterol rescues. Salmeterol never during an attack.</b> Inhaler order: <b>bronchodilator → steroid → RINSE.</b></div></div>
  <ul class="clean">
    <li><b>Loop and thiazide WASTE potassium. Spironolactone KEEPS it</b> (so do ACE/ARBs).</li>
    <li><b>Calcium gluconate has 3 jobs:</b> hypocalcemia, hyperkalemia cardiac protection, hypermagnesemia antidote.</li>
    <li><b>Insulin/albuterol SHIFT potassium. Kayexalate REMOVES it.</b></li>
    <li><b>Phosphate binders WITH meals.</b> Oxymetazoline <b>max 3 days</b> (rebound). Taper prednisone.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🧠 In the room</h3>
  <ul class="clean">
    <li><b>Cover the options.</b> Read the last sentence first. Circle <b>FIRST / BEST / EXCEPT / NOT / further teaching</b>.</li>
    <li><b>Answer in your head</b> before looking at the choices.</li>
    <li><b>Four sick patients?</b> Rank by what kills fastest — airway, breathing, circulation, neuro change.</li>
    <li><b>Stalling answers</b> — notify, document, continue to monitor, recheck in an hour — are usually wrong if there is something you can do now.</li>
    <li><b>Do not change answers</b> unless you misread a qualifier.</li>
    <li><b>You passed Unit 1 with this method.</b> Same method, different content.</li>
  </ul>
</div>

<h2 class="sec-title"><span class="sec-emoji">🔎</span> How to Answer His Questions</h2>
<p class="intro-line">Not content. Method. Read this before the exam — it is the same moves every time, and it is what carried Unit 1.</p>

<div class="tipbar">🧠 <b>Most wrong answers are reading errors, not knowledge errors.</b> You knew it. You answered a different question than the one on the screen.</div>

<div class="card" style="border-color:var(--purple)">
  <h3>The 5-step read</h3>
  <ol class="chainlist">
    <li><b>1. Find the actual question.</b> Cover the options. Read the last sentence first — that is what is being asked. Everything above it is setup.</li>
    <li><b>2. Answer it in your head</b> before looking at the options. If you already have an answer, the distractors cannot pull you.</li>
    <li><b>3. Circle the qualifier.</b> <b>First · Best · Priority · Most · Initial · Except · NOT</b>. These flip the whole question.</li>
    <li><b>4. Eliminate on principle.</b> Cross off anything unsafe, out of nursing scope, or factually wrong — no matter how good it sounds.</li>
    <li><b>5. Between the last two, ask what makes them different.</b> There is exactly one difference. That difference is the question.</li>
  </ol>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ The question inside the question — Unit 2 edition</h3>
  <table class="lab">
    <tr><th>What it looks like</th><th>What he is actually asking</th></tr>
    <tr><td>Four patients, all with something wrong</td><td><b>Whose airway or breathing fails first?</b></td></tr>
    <tr><td>A set of labs with one value off</td><td><b>Deficit or overload?</b> Concentrated = deficit. Diluted = overload</td></tr>
    <tr><td>An ABG with four numbers</td><td><b>Which system moved with the pH, and did the other one try to fix it?</b></td></tr>
    <tr><td>"Which IV fluid does the nurse anticipate?"</td><td><b>Which compartment needs the water?</b> Vessel = isotonic. Cells = hypotonic. Pull it out = hypertonic</td></tr>
    <tr><td>"Which order should the nurse question?"</td><td><b>Which fluid or drug fights this patient's problem?</b> Hypotonic in a head injury, K with no urine output, LR in liver failure</td></tr>
    <tr><td>A chest tube with something happening in a chamber</td><td><b>Which chamber?</b> Water seal = leak. Suction = normal</td></tr>
    <tr><td>A patient who suddenly got quieter or whose numbers "improved"</td><td><b>Is this actually deterioration?</b> Silent chest, normalizing CO₂</td></tr>
    <tr><td>"Which finding requires immediate follow-up?"</td><td><b>Which one is NOT expected here?</b> Three are normal for the situation</td></tr>
    <tr><td>An older adult with vague symptoms</td><td><b>Is this pneumonia or a UTI presenting atypically?</b></td></tr>
  </table>
  <div class="hy"><span class="tag">Do this out loud</span>Before you pick, say the hidden question in one sentence. If you cannot, reread the <b>stem</b>, not the options.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>Wording that changes the answer</h3>
  <table class="lab">
    <tr><th>Word</th><th>What it demands</th></tr>
    <tr><td><b>FIRST / INITIAL</b></td><td>Something you can do <b>immediately and independently</b>. Reposition, oxygen, stop the infusion</td></tr>
    <tr><td><b>BEST</b></td><td>The most complete option, even if others are partly right</td></tr>
    <tr><td><b>PRIORITY</b></td><td>What kills soonest. <b>Airway, breathing, circulation</b></td></tr>
    <tr><td><b>EXCEPT / NOT</b></td><td>Hunt the <b>ONE WRONG</b> answer. Three are correct</td></tr>
    <tr><td><b>FURTHER TEACHING</b></td><td>Find the <b>wrong</b> statement</td></tr>
    <tr><td><b>INDICATES UNDERSTANDING</b></td><td>Find the <b>right</b> statement</td></tr>
    <tr><td><b>EARLIEST SIGN</b></td><td>The subtle one. <b>Restlessness</b>, not cyanosis</td></tr>
    <tr><td><b>EXPECTED</b></td><td>He wants you to <b>leave it alone</b>. Tidaling, suction bubbling, orange urine on rifampin</td></tr>
    <tr><td><b>SELECT ALL THAT APPLY</b></td><td>Judge each option <b>independently</b> true or false. Do not guess a count</td></tr>
  </table>
  <div class="trap"><span class="tag">The one that gets everyone</span><b>Missing a NOT or EXCEPT.</b> You reason perfectly and score zero. Mark the qualifier before reading a single option.</div>
</div>

<div class="card">
  <h3>Ranking when everything looks wrong</h3>
  <ol class="chainlist">
    <li><b>1. Airway</b> — stridor, swelling, laryngospasm from low calcium, no gag</li>
    <li><b>2. Breathing</b> — <b>restlessness</b>, silent chest, RR under 12 or over 30, falling saturation</li>
    <li><b>3. Circulation</b> — potassium out of range, dysrhythmia, hemorrhage, shock</li>
    <li><b>4. Neuro change</b> — new confusion, decreasing LOC, seizure risk from sodium</li>
    <li><b>5. Safety</b> — falls, wrong fluid, infection risk</li>
    <li><b>6. Comfort and teaching</b> — real, rarely the "first" answer in an unstable patient</li>
  </ol>
  <div class="hy"><span class="tag">Tiebreaker</span><b>Acute beats chronic. Unexpected beats expected. Unstable beats stable.</b> A new unexplained finding outranks a severe one that is known and being treated.</div>
</div>

<div class="card">
  <h3>Assess or act?</h3>
  <table class="lab">
    <tr><th>Situation</th><th>Do this</th></tr>
    <tr><td>Stable patient, incomplete data</td><td><b>ASSESS</b></td></tr>
    <tr><td>Unstable or in danger</td><td><b>ACT.</b> Raise the head of the bed, oxygen, stop the infusion, hold the drug</td></tr>
    <tr><td>The stem already gave you the assessment</td><td><b>ACT.</b> Reassessing what you were just told is stalling</td></tr>
    <tr><td>An IV rate or fluid type is wrong</td><td><b>Slow or stop for safety, then notify.</b> You cannot re-prescribe</td></tr>
  </table>
  <div class="trap"><span class="tag">The stalling answers</span><b>"Notify the provider," "document," "continue to monitor," "recheck in an hour."</b> Sometimes right, usually the safe-sounding option that does nothing. Ask: <i>is there something I can do right now that helps?</i></div>
</div>

<div class="card" style="border-color:var(--teal)">
