{topic:'resp',hot:false,q:'Which are diagnostic criteria/hallmarks of acute respiratory failure? (Select all that apply)',o:['PaCO₂ greater than 50 mmHg','pH greater than 7.50','PaO₂ less than 60 mmHg','pH less than 7.35','SpO₂ of 99%'],c:[0,2,3],t:'multi',r:'ARF: PaO₂ under 60, PaCO₂ over 50, and pH under 7.35. SpO₂ 99% and alkalotic pH do not fit.'},
{topic:'resp',hot:false,q:'Clubbing of the fingers is a sign of:',o:['Dehydration','Acute infection','Hyperkalemia','Chronic hypoxia'],c:3,t:'single',r:'Clubbing reflects chronic hypoxia (lung/cardiac disease).'},
{topic:'abg',hot:false,q:'ABG: pH 7.50, PaCO₂ 30, HCO₃ 24. This represents:',o:['Respiratory acidosis','Respiratory alkalosis','Metabolic alkalosis','Metabolic acidosis'],c:1,t:'single',r:'High pH, low CO₂ (opposite) = respiratory alkalosis (hyperventilation/anxiety).'},
{topic:'pneumonia',hot:false,q:'The nurse plans care for a patient with pneumonia and lists "improved airway clearance" as a goal. Prioritizing this goal is part of which step?',o:['Assessment','Evaluation','Implementation','Planning'],c:3,t:'single',r:'Setting and prioritizing goals/outcomes is PLANNING. The interventions chosen to reach the goal (suction, CPT, fluids) are implementation.'},
{topic:'resp',hot:true,q:'All of the following are EARLY signs of hypoxia EXCEPT:',o:['Anxiety','Restlessness','Tachycardia','Cyanosis'],c:3,t:'single',r:'Trap: cyanosis "looks like" hypoxia so it feels right. But cyanosis is a LATE sign — the early ones are restlessness, anxiety, and tachycardia. The EXCEPT is asking for the one that doesn\'t fit "early."'},
{topic:'clinical',hot:true,q:'A post-op patient is restless and anxious with an O₂ sat of 93%. What should the nurse do FIRST?',o:['Document the anxiety as a normal post-op finding and continue','Call the provider to request a psychiatric consultation now','Reposition, encourage deep breathing, and reassess oxygenation','Administer the PRN sedative that is ordered for anxiety'],c:2,t:'single',r:'Restlessness and anxiety are EARLY signs of hypoxia — treat the oxygenation, not the "anxiety." Sedating a hypoxic patient is dangerous. Reposition, promote lung expansion, and reassess.'},
{topic:'pneumonia',hot:true,q:'TREATMENT — Which is the priority nursing intervention to prevent and treat atelectasis?',o:['Chest physiotherapy postponed until the fever resolves','Incentive spirometry, coughing, and early ambulation','Fluid restriction with humidified oxygen by face mask','Strict bed rest with the head of the bed kept flat'],c:1,t:'single',r:'Lung-expansion measures (IS with a 3-second hold, coughing/deep breathing, ambulation) reopen alveoli. Pain control matters so the patient CAN breathe deeply.'},
{topic:'airway',hot:true,q:'A nurse must give morning meds, hang a new IV bag, ambulate a patient, and respond to a vent alarm. Which does the nurse address FIRST?',o:['Ambulation','Hanging the IV bag','Morning meds','The ventilator alarm'],c:3,t:'single',r:'A ventilator alarm is an airway/breathing issue and takes priority over routine tasks. ABCs first — always rule out a true emergency (disconnection, obstruction, distress) before scheduled care.'},
{topic:'lytes',hot:true,q:'Which food choice is BEST for a patient who needs to increase potassium?',o:['Banana and spinach','Egg whites and toast','White rice and pasta','Cheese and yogurt'],c:0,t:'single',r:'Bananas and leafy greens are potassium-rich. Useful for patients on potassium-wasting diuretics.'},
{topic:'abg',hot:false,q:'After teaching, the nurse asks the patient to demonstrate using the incentive spirometer correctly. This "teach-back" is which step?',o:['Assessment','Planning','Evaluation','Implementation'],c:2,t:'single',r:'Checking whether teaching was effective (can the patient do it right?) is EVALUATION. The teaching itself was implementation; the return-demonstration evaluates the outcome.'},
{topic:'blood',hot:true,q:'Which is the BEST nursing response when a transfusion reaction is suspected?',o:['Stop the blood, keep NS running, and notify the provider','Document the findings and reassess in about 30 minutes','Slow the transfusion and keep watching for more symptoms','Give acetaminophen and continue the unit as prescribed'],c:0,t:'single',r:'Slowing it down (A) is the tempting "partial" answer, but the BEST/safest action is to STOP the blood entirely while maintaining IV access with NS, then notify. Don\'t keep infusing a possible reaction.'},
{topic:'copd',hot:false,q:'A patient using an inhaled corticosteroid should be taught to:',o:['Use it before the bronchodilator','Rinse the mouth after use','Hold breath for 30 seconds','Use it for acute attacks'],c:1,t:'single',r:'Rinse the mouth to prevent oral candidiasis (thrush). Bronchodilator goes first, steroid second.'},
{topic:'fluids',hot:true,q:'A patient with severe hyponatremia (Na 118) and seizure activity is prescribed 3% saline. Which is the priority nursing assessment during infusion?',o:['Pupil size and reactivity to light every hour','Lung sounds for signs of fluid overload','Blood glucose before and after the infusion','Bowel sounds in all four abdominal quadrants'],c:1,t:'single',r:'3% saline is <b>hypertonic</b> — it pulls water into the vasculature and can rapidly cause <b>fluid overload and pulmonary edema</b>. Monitor lung sounds closely and infuse slowly.'},
{topic:'resp',hot:false,q:'Which finding is a LATE sign of hypoxia?',o:['Anxiety','Restlessness','Tachycardia','Central cyanosis'],c:3,t:'single',r:'<b>Cyanosis is a LATE sign.</b> The earliest signs of hypoxia are restlessness, anxiety, and tachycardia — those come first and are your chance to intervene early.'},
{topic:'lytes',hot:false,q:'A nurse reassesses a patient\'s potassium level after treating hyperkalemia to see if it dropped. This is which step?',o:['Assessment','Planning','Evaluation','Implementation'],c:2,t:'single',r:'Checking a result against the expected outcome after an intervention is EVALUATION. The trap is that it "looks like" assessment — but its purpose is judging effectiveness.'},
{topic:'lytes',hot:false,q:'Which interventions are correct for hyperkalemia? (Select all that apply)',o:['Sodium bicarbonate','Calcium gluconate','Salt substitutes','Insulin with dextrose','Dialysis if severe'],c:[0,1,3,4],t:'multi',r:'Insulin+dextrose drives K into cells, calcium protects the heart, bicarb shifts K, dialysis removes it. Salt substitutes CONTAIN potassium — avoid.'},
{topic:'copd',hot:false,q:'The target oxygen saturation for most patients with COPD is:',o:['100%','95-100%','Below 85%','88-92%'],c:3,t:'single',r:'In COPD, aim for 88-92% to avoid blunting the hypoxic drive while still oxygenating.'},
{topic:'tb',hot:false,q:'A positive PPD (Mantoux) is read by measuring?',o:['Induration','Redness','The wheal size','Warmth'],c:0,t:'single',r:'Measure induration (raised hardened area) at 48-72 hours.'},
{topic:'fluids',hot:true,q:'What is the normal range for serum osmolality?',o:['270 to 300 mOsm/kg','3.5 to 5.0 mOsm/kg','350 to 400 mOsm/kg','135 to 145 mOsm/kg'],c:0,t:'single',r:'<b>270 to 300 mOsm/kg.</b> Below 270 is hypo-osmolar and suggests <b>fluid overload with dilution</b>. Above 300 is hyper-osmolar and suggests <b>fluid volume deficit with concentration</b>.'},
{topic:'lytes',hot:false,q:'A nurse is about to hang blood and sees the only available IV fluid running is D5½NS. What should the nurse do?',o:['Use lactated Ringer\'s instead','Use the D5½NS to prime the line','Obtain 0.9% normal saline','Run the blood without any priming fluid'],c:2,t:'single',r:'Only 0.9% normal saline is hung with blood. Dextrose solutions hemolyze RBCs and LR\'s calcium can promote clotting. Get NS before proceeding.'},
{topic:'upper',hot:true,q:'Which findings in a patient with obstructive sleep apnea should the nurse expect? Select all that apply.',o:['Bradycardia during the day','Excessive daytime sleepiness','Weight loss over recent months','Loud snoring with witnessed apneic periods','Morning headache','Difficulty staying asleep at night'],c:[1,3,4,5],t:'multi',r:'Repeated airway collapse causes <b>snoring, apnea, fragmented sleep, morning headache from CO2 retention, and daytime sleepiness</b>. Untreated OSA leads to hypertension and dysrhythmias, not daytime bradycardia. Obesity is a risk factor, so weight gain is more typical than loss.'},
{topic:'pneumonia',hot:false,q:'Which interventions are part of the ventilator-associated pneumonia (VAP) bundle? (Select all that apply)',o:['Keep the patient flat','DVT and peptic ulcer prophylaxis','Daily sedation interruption/readiness to wean','Oral care with chlorhexidine','Elevate head of bed 30-45 degrees'],c:[1,2,3,4],t:'multi',r:'VAP bundle: HOB elevated, daily sedation vacation/wean assessment, oral chlorhexidine care, and DVT/PUD prophylaxis. Keeping flat increases aspiration risk.'},
{topic:'lytes',hot:false,q:'Which assessment finding indicates hypernatremia?',o:['Seizures caused by cerebral swelling','Peaked T waves on the cardiac monitor','Carpopedal spasm on cuff inflation','Intense thirst with dry mucous membranes'],c:3,t:'single',r:'Hypernatremia draws water out of cells → thirst, dry membranes, agitation.'},
{topic:'resp',hot:true,q:'Which breath sound is considered a medical EMERGENCY requiring immediate attention?',o:['Crackles','Stridor','Rhonchi','Wheezes'],c:1,t:'single',r:'<b>Stridor</b> signals upper-airway obstruction — a true emergency (anaphylaxis, foreign body, severe croup). Act on the airway immediately.'},
{topic:'lytes',hot:false,q:'Which signs are associated with HYPOcalcemia? (Select all that apply)',o:['Positive Trousseau sign','Positive Chvostek sign','Muscle twitching','Numbness/tingling around the mouth','Constipation and kidney stones'],c:[0,1,2,3],t:'multi',r:'Hypocalcemia = increased excitability: Trousseau, Chvostek, perioral tingling, twitching, tetany. Stones/constipation are HYPERcalcemia.'},
{topic:'pneumonia',hot:false,q:'Which assessment finding in a patient with pneumonia would the nurse report to the provider IMMEDIATELY?',o:['A productive cough bringing up thick yellow-green sputum','A weak, thready, rapid pulse with a falling blood pressure','Fatigue and mild dyspnea after ambulating in the hallway','A temperature of 100.6 degrees on the second hospital day'],c:1,t:'single',r:'A weak, thready, fast pulse with hypotension signals septic shock — a life-threatening complication of pneumonia. Report immediately. The other findings are expected with pneumonia.'},
{topic:'upper',hot:true,q:'A patient has an active nosebleed. Which position should the nurse use?',o:['Lying flat with the head turned to one side','Sitting upright leaning forward','Trendelenburg with the head lowered','Sitting upright with the head tilted back'],c:1,t:'single',r:'<b>Upright and leaning forward</b> lets blood drain out of the nose rather than down the throat. Tilting back causes swallowing of blood, nausea, aspiration risk, and hides how much has been lost.'},
{topic:'fluids',hot:true,q:'CAUSE — Fluid volume deficit is BEST described as resulting from:',o:['Excess dietary sodium pulling water into the vascular space','Too much IV fluid infused faster than the kidneys clear it','Fluid retention from heart failure backing up into tissue','Loss of fluid from vomiting, diarrhea, or poor intake'],c:3,t:'single',r:'Deficit = loss or inadequate intake. That cause explains the manifestations (↑HR, ↓BP, concentrated urine) and the treatment (isotonic fluids).'},
{topic:'airway',hot:false,q:'Which nursing actions are appropriate for a patient on a ventilator to prevent VAP? (Select all that apply)',o:['Keep the patient flat to promote rest','Keep the head of the bed at 30–45 degrees','Daily "sedation vacation" / readiness-to-wean assessment','Provide DVT and peptic ulcer prophylaxis','Perform oral care with chlorhexidine'],c:[1,2,3,4],t:'multi',r:'The VAP bundle: HOB elevated, chlorhexidine oral care, daily sedation interruption with wean assessment, and DVT/PUD prophylaxis. Lying flat raises aspiration risk and is wrong.'},
{topic:'copd',hot:false,q:'A patient in status asthmaticus suddenly has a "silent chest" with no audible wheezing. This indicates:',o:['A good response to the bronchodilator that was just given','The attack is resolving and the airways are opening up','Severe airway obstruction and impending respiratory failure','A developing pneumothorax on the affected side of the chest'],c:2,t:'single',r:'A silent chest means almost no air movement — an emergency sign of impending respiratory failure, not improvement.'},
{topic:'lytes',hot:false,q:'Which is the only IV fluid compatible with blood?',o:['D5W','0.9% NS','LR','0.45% NS'],c:1,t:'single',r:'Only 0.9% Normal Saline — LR has calcium (clots), dextrose hemolyzes RBCs.'},
{topic:'tb',hot:false,q:'Which precautions are required for a patient with active pulmonary TB? (Select all that apply)',o:['N95 respirator for staff','Door kept open for ventilation','Standard precautions only','Negative-pressure room','Surgical mask on patient during transport'],c:[0,3,4],t:'multi',r:'TB requires <b>airborne precautions</b>: negative-pressure room (door CLOSED), N95 for staff, and a surgical mask on the patient if transported. Standard precautions alone are insufficient.'},
{topic:'lytes',hot:true,q:'Which is the priority for a patient with potassium of 6.9?',o:['Restrict fluids','Prepare calcium gluconate','Encourage bananas','Give a potassium supplement'],c:1,t:'single',r:'Calcium gluconate protects the heart in hyperkalemia. Never add more potassium.'},
{topic:'abg',hot:false,q:'PUTTING IT TOGETHER — A patient with COPD is admitted with increased dyspnea. Using cause→manifest→treatment, which ABG and O₂ plan fit?',o:['Metabolic acidosis; give sodium bicarbonate and recheck the gas','Compensated respiratory acidosis; controlled O2 to keep SpO2 88-92%','Respiratory alkalosis; apply 100% oxygen by non-rebreather mask','Metabolic alkalosis; restrict fluids and hold the diuretic dose'],c:1,t:'single',r:'COPD cause = chronic CO₂ retention → compensated respiratory acidosis. Treatment = controlled O₂ (88–92%), not 100%. The framework links the three together.'},
{topic:'lytes',hot:false,q:'A patient on a loop diuretic reports muscle weakness and leg cramps. The nurse notes a flattened T wave and a U wave on the ECG. Which electrolyte imbalance is most likely?',o:['Hypermagnesemia','Hypocalcemia','Hyperkalemia','Hypokalemia'],c:3,t:'single',r:'Loop diuretics waste potassium. <b>Hypokalemia</b> classically shows weakness, cramps, a <b>flat T wave and a U wave</b>. Peaked T waves would indicate hyperkalemia.'},
{topic:'copd',hot:false,q:'Which precautions and teaching apply to a patient on RIPE therapy for TB? (Select all that apply)',o:['Report vision changes with ethambutol','Stop meds once feeling better','Airborne isolation with N95','Rifampin turns body fluids orange','Adherence for the full 6-12 months'],c:[0,2,3,4],t:'multi',r:'Airborne precautions, expect orange fluids (rifampin), report visual changes (ethambutol = optic neuritis), and complete the full course. Stopping early causes resistance.'},
{topic:'upper',hot:false,q:'A patient with acute rhinosinusitis asks why antibiotics were not prescribed. What is the best response?',o:['The infection is too advanced for antibiotics to help','Most cases are viral and improve with supportive care','Antibiotics are never used for sinus infections','Antibiotics would worsen the nasal congestion'],c:1,t:'single',r:'The majority of acute rhinosinusitis is <b>viral</b>. Antibiotics are reserved for symptoms that persist beyond about 10 days, worsen after initial improvement, or are severe. Supportive care is humidification, fluids, saline irrigation, and warm compresses.'},
{topic:'lytes',hot:false,q:'A hypotonic solution such as 0.45% NS causes water to move:',o:['Into cells','Out of the body','Into the vasculature only','Out of cells'],c:0,t:'single',r:'Hypotonic fluids shift water INTO cells (raisins → grapes). Watch for cerebral edema.'},
{topic:'abg',hot:false,q:'A patient with COPD also has advanced kidney disease. Compared with a COPD patient who has normal kidneys, what should the nurse expect on the arterial blood gas?',o:['Less compensation, because the kidneys cannot retain bicarbonate','Faster compensation, because two systems are now involved','Complete compensation within a few hours instead of days','No difference, since compensation is entirely a lung function'],c:0,t:'single',r:'The <b>kidneys are the compensator for a respiratory problem</b>, retaining bicarbonate over hours to days. If they are failing they cannot do that job, so the gas reads <b>uncompensated or only partially compensated</b> rather than the fully compensated picture a stable COPD patient usually shows.'},
{topic:'fluids',hot:true,q:'A patient with a suspected head injury has an order for 0.45% NS. What should the nurse do?',o:['Administer it as ordered on a pump','Administer it slowly over 8 hours','Question the order because hypotonic fluid can raise intracranial pressure','Change it to D5W instead'],c:2,t:'single',r:'<b>Hypotonic fluids are contraindicated with increased ICP, suspected head injury, hypotension, burns, and liver dysfunction.</b> Water moves into cells and worsens cerebral edema. D5W behaves hypotonically in the body, so it is no better.'},
{topic:'lytes',hot:false,q:'Which signs indicate fluid volume EXCESS? (Select all that apply)',o:['Poor skin turgor','Crackles','JVD','Bounding pulse','Weight gain'],c:[1,2,3,4],t:'multi',r:'Crackles, JVD, bounding pulse, and weight gain are "WET" signs. Poor turgor = deficit.'},
{topic:'resp',hot:false,q:'Which finding is the EARLIEST sign of hypoxia?',o:['Restlessness/anxiety','Clubbing of fingers','Bradycardia','Cyanosis'],c:0,t:'single',r:'Restlessness and anxiety are early hypoxia signs. Cyanosis is late; clubbing reflects chronic hypoxia.'},
{topic:'fluids',hot:true,q:'An IV of 0.9% NS is infusing at 125 mL/hr. The patient develops crackles and dyspnea. What should the nurse do?',o:['Discontinue the IV and remove the catheter','Slow the infusion to a keep-open rate and notify the provider','Increase the rate to improve perfusion','Change the fluid to 0.45% NS'],c:1,t:'single',r:'IV fluids are a <b>medication</b>. The nurse may <b>slow or stop an infusion for patient safety</b>, but <b>cannot adjust the rate or change the fluid type without an order</b>. Raise the head of the bed, assess, and notify the provider.'},
{topic:'copd',hot:true,q:'A patient develops chills, fever, and back pain 10 minutes into a transfusion. The nurse\'s FIRST action is to:',o:['Administer acetaminophen and keep infusing','Slow the infusion rate and continue to watch','Document the reaction and finish the unit','Stop the blood and keep the NS line open'],c:3,t:'single',r:'STOP the blood immediately and maintain IV access with NS, then notify the provider.'},
{topic:'lytes',hot:true,q:'All of the following are signs of hypocalcemia EXCEPT:',o:['Positive Trousseau sign','Constipation and kidney stones','Tingling around the mouth','Positive Chvostek sign'],c:1,t:'single',r:'Chvostek, Trousseau, and perioral tingling are hypoCALCEMIA (excitable). "Stones, bones, groans" (constipation, stones) is HYPERcalcemia — the EXCEPT impostor.'},
{topic:'lytes',hot:true,q:'A patient with chronic kidney disease has a potassium of 6.8 mEq/L and peaked T waves on the monitor. Which medication should the nurse prepare FIRST?',o:['Sodium bicarbonate','Potassium chloride','Calcium gluconate','Furosemide (Lasix)'],c:2,t:'single',r:'<b>Calcium gluconate</b> is given first to stabilize/protect the cardiac membrane from the dysrhythmia risk. It does NOT lower potassium — insulin+D50, bicarb, and dialysis do that — but protecting the heart is the immediate priority.'},
{topic:'abg',hot:false,q:'Which conditions cause metabolic acidosis? (Select all that apply)',o:['Vomiting','Renal failure','Diarrhea','NG suction','Diabetic ketoacidosis'],c:[1,2,4],t:'multi',r:'DKA, diarrhea, and renal failure cause metabolic acidosis. Vomiting and NG suction cause metabolic ALKalosis.'},
{topic:'fluids',hot:true,q:'A post-op patient has BP 88/56, HR 118, dry mucous membranes, and urine output of 18 mL/hr. Which IV fluid does the nurse anticipate FIRST?',o:['0.45% Normal Saline','3% Saline','D5W','0.9% Normal Saline'],c:3,t:'single',r:'This is hypovolemia/hypotension. The first-line fluid is an <b>isotonic crystalloid (0.9% NS or LR)</b> to expand intravascular volume. Hypotonic (0.45%, D5W) would worsen low BP; 3% is hypertonic and reserved for severe hyponatremia.'},
{topic:'clinical',hot:false,q:'A nurse notes a patient\'s urine output rose from 15 mL/hr to 40 mL/hr after fluid resuscitation. Documenting that the fluid-deficit goal was MET is which step?',o:['Implementation','Diagnosis','Assessment','Evaluation'],c:3,t:'single',r:'Comparing the result to the goal and judging it "met" is EVALUATION. (Note: the urine rose because of the fluid resuscitation — deficit alone lowers urine; the treatment is what brought it back up.) This closes the loop — if the goal were not met, the nurse would revise the plan.'},
{topic:'lytes',hot:false,q:'A high BNP level most likely indicates:',o:['Respiratory alkalosis from anxiety','Dehydration with hemoconcentration','Fluid overload or heart failure','Hypokalemia from diuretic use'],c:2,t:'single',r:'BNP rises when the heart is stretched by excess volume (CHF).'},
{topic:'copd',hot:false,q:'Of the following, which is the LEAST likely to indicate that a patient is deteriorating?',o:['A sudden silent chest','An SpO₂ of 90% in a COPD patient','A rising/"normalizing" CO₂ in a tiring asthmatic','New restlessness and confusion'],c:1,t:'single',r:'"LEAST likely" flips the search — three are red flags, one is acceptable. 88–92% is the GOAL in COPD, so 90% is fine. Negative-direction words like LEAST work just like NOT/EXCEPT.'},
{topic:'abg',hot:false,q:'In the body, PaCO₂ is regulated by the ____ and HCO₃ is regulated by the ____.',o:['heart / liver','lungs / kidneys','brain / spleen','kidneys / lungs'],c:1,t:'single',r:'Lungs control CO₂ (acid); kidneys control bicarbonate.'},
{topic:'lytes',hot:false,q:'Which statement about potassium administration is correct?',o:['Potassium is NEVER given by IV push','Oral potassium should be given on an empty stomach','Potassium may be given by rapid IV push in an emergency','Potassium-sparing diuretics are safe in hyperkalemia'],c:0,t:'single',r:'"Never" is a true absolute here: IV-push potassium can cause fatal arrhythmias. The trap is that absolutes are often false — but this one is a hard safety rule. A, C, and D are all dangerous/false.'},
{topic:'copd',hot:false,q:'During a severe asthma attack, the sudden ABSENCE of wheezing indicates:',o:['Impending respiratory failure','Less oxygen is now needed','The attack has fully resolved','Improvement in air movement'],c:0,t:'single',r:'A silent chest = no air moving = impending respiratory failure.'},
{topic:'blood',hot:true,q:'A nurse picks up a unit of blood from the blood bank but the patient is in the bathroom and the IV has infiltrated. The nurse cannot start the infusion. What is the BEST action?',o:['Start the blood slowly through the infiltrated IV and watch it','Return the blood to the bank since it cannot start in 30 min','Keep the blood at the bedside until a new IV can be placed','Put the blood in the unit refrigerator until the IV is restarted'],c:1,t:'single',r:'Blood must be started within 30 minutes of leaving the blood bank and must never sit warming at the bedside or be stored in a regular unit fridge. If you can\'t start it in time, return it to the blood bank.'},
{topic:'pneumonia',hot:false,q:'Aspiration pneumonia most commonly affects which area of the lungs?',o:['Both apices affected about equally','The left upper lobe most commonly','The pleural space rather than lung','Right lung, via the right main bronchus'],c:3,t:'single',r:'The right main bronchus is wider and more vertical, so aspirated material tends to go right.'},
{topic:'airway',hot:true,q:'A nurse is caring for four patients. Who should the nurse assess FIRST?',o:['A pneumonia patient with a temp of 100.8°F','A patient with a chest tube and gentle tidaling in the water seal','An asthma patient whose wheezing has suddenly become a \'silent chest\'','A COPD patient with an O₂ sat of 90% on 2 L'],c:2,t:'single',r:'A silent chest = no air movement = impending respiratory failure. The COPD sat of 90% is acceptable (goal 88–92%), the low-grade fever is expected with pneumonia, and tidaling is normal. B is acute, unstable, and unexpected.'},
{topic:'airway',hot:true,q:'Which finding in a chest-tube patient is the ONLY one that signals an emergency requiring you to notify the provider?',o:['Continuous bubbling in the water-seal chamber','Gentle tidaling in the water seal','50 mL of serosanguineous drainage over a shift','Continuous bubbling in the suction chamber on wall suction'],c:0,t:'single',r:'Tidaling is normal, suction-chamber bubbling on wall suction is expected, and modest drainage is fine. Continuous WATER-SEAL bubbling = air leak / possible tension pneumothorax — the one true emergency here.'},
{topic:'clinical',hot:true,q:'A patient reports new shortness of breath. There is no emergency apparent yet. What should the nurse do FIRST?',o:['Assess the patient (lung sounds, vitals, SpO₂)','Call respiratory therapy','Raise the head of the bed and leave the room','Administer a PRN bronchodilator'],c:0,t:'single',r:'When it is not an obvious emergency, ASSESS before acting. You gather data (lung sounds, vitals, SpO₂) before choosing an intervention. "Assess before act" is the most-tested ADPIE rule.'},
{topic:'fluids',hot:false,q:'Why is lactated Ringer avoided as an everyday maintenance fluid?',o:['It cannot be given through a peripheral line','It is reserved for trauma, surgery, and acute blood loss','It is hypotonic and causes cell swelling','It contains no electrolytes'],c:1,t:'single',r:'LR closely matches plasma electrolytes and is used <b>following trauma or surgery and in acute blood loss</b>, but <b>not for everyday maintenance</b>. Avoid it with renal or liver dysfunction, burns, metabolic alkalosis, hyperkalemia, and hyperlactemia.'},
{topic:'resp',hot:true,q:'A post-op patient refuses to deep breathe due to pain and develops diminished breath sounds at the right base. The priority is to prevent:',o:['Pneumothorax','Pleural effusion','Pulmonary embolism','Atelectasis'],c:3,t:'single',r:'Shallow breathing collapses alveoli → atelectasis. Encourage incentive spirometry, coughing, deep breathing.'},
{topic:'lytes',hot:false,q:'A patient with a sodium of 121 mEq/L is at greatest risk for:',o:['Hypertension','Constipation','Kidney stones','Seizures'],c:3,t:'single',r:',o:['},
{topic:'lytes',hot:false,q:'A patient is admitted with severe dehydration. Which IV fluid does the nurse anticipate administering first?',o:['D5W with 20 mEq KCl','0.45% Normal Saline','0.9% Normal Saline','D10W by slow infusion'],c:2,t:'single',r:'Isotonic 0.9% NS expands intravascular volume first-line for hypovolemia.'},
{topic:'upper',hot:false,q:'A patient has used an over-the-counter nasal decongestant spray daily for two weeks and reports worsening congestion. What does the nurse recognize?',o:['Rebound congestion from prolonged use','An allergic reaction to the spray','A developing bacterial sinus infection','Normal seasonal worsening of symptoms'],c:0,t:'single',r:'Topical decongestants used beyond <b>3 days</b> cause <b>rhinitis medicamentosa</b> — rebound congestion. The patient uses more, gets worse, and the cycle continues. The spray must be stopped.'},
{topic:'lytes',hot:true,q:'A patient is admitted with a sodium level of 122 mEq/L. Which is the priority nursing intervention?',o:['Encourage extra free water','Restrict potassium intake','Apply warm compresses','Institute seizure precautions'],c:3,t:'single',r:'Severe hyponatremia causes the brain to swell, leading to confusion and <b>seizures</b>. Seizure precautions and neuro checks are the priority. Adding free water would dilute sodium further and worsen it.'},
{topic:'copd',hot:false,q:'Which manifestations are characteristic of COPD? (Select all that apply)',o:['Chronic productive cough','Pursed-lip breathing','Barrel chest','Reversible airway obstruction','Hypercapnia'],c:[0,1,2,4],t:'multi',r:'COPD = barrel chest, pursed-lip breathing, chronic cough, hypercapnia. Obstruction in COPD is <b>irreversible</b> — reversible obstruction describes asthma.'},
{topic:'clinical',hot:false,q:'The nurse asks the patient to rate their dyspnea and records it. Which step is this?',o:['Implementation of the plan','Evaluation of the response','Planning the expected outcomes','Assessment, gathering subjective data'],c:3,t:'single',r:'Collecting the patient\'s reported experience is ASSESSMENT — specifically subjective data. Assessment includes BOTH what you observe (objective) and what the patient tells you (subjective).'},
{topic:'resp',hot:false,q:'Crackles heard on auscultation most often indicate:',o:['Narrowed airways','Upper airway obstruction','Fluid in the alveoli','Pleural friction'],c:2,t:'single',r:'Crackles = fluid in alveoli (CHF, pneumonia).'},
{topic:'airway',hot:false,q:'CAUSE — What is the underlying problem in asthma?',o:['Infectious fluid filling and consolidating the alveoli','Air trapped in the pleural space compressing the lung','Irreversible destruction of the alveolar walls','Reversible airway inflammation and bronchoconstriction'],c:3,t:'single',r:'Asthma = REVERSIBLE inflammation + bronchoconstriction + mucus in hyperreactive airways. (Irreversible destruction = emphysema; alveolar fluid = pneumonia/ARDS; pleural air = pneumothorax.)'},
{topic:'airway',hot:false,q:'Which actions are correct for chest tube management? (Select all that apply)',o:['Routinely clamp the tube during transport','Tape connections securely','Keep an occlusive dressing and clamp at the bedside','Keep the drainage system below chest level','If the tube is dislodged, cover with petroleum gauze taped on 3 sides'],c:[1,2,3,4],t:'multi',r:'System below chest, secure taped connections, 3-sided dressing if dislodged (lets air escape, prevents tension pneumo), and emergency supplies at bedside. Routine clamping is dangerous — it can cause tension pneumothorax.'},
{topic:'abg',hot:true,q:'A patient with chronic kidney disease has a pH of 7.28. Which additional laboratory value should the nurse check first?',o:['Potassium','Magnesium','Total calcium','Serum albumin'],c:0,t:'single',r:'Renal metabolic acidosis travels with <b>hyperkalemia</b> from two causes stacking: acidosis shifts potassium out of the cells, and the failing kidney cannot excrete it. Potassium is the value that can produce a fatal dysrhythmia, so it is checked first. The others matter but none of them kills in minutes.'},
{topic:'resp',hot:false,q:'Which ventilator strategy is used in ARDS?',o:['No humidification','Low FiO₂ only','Routine extubation','PEEP'],c:3,t:'single',r:'PEEP keeps alveoli open to improve oxygenation in ARDS.'},
{topic:'pneumonia',hot:false,q:'A late complication of tracheostomy is:',o:['Tracheal stenosis','Pneumothorax','Tube dislodgement','Bleeding'],c:0,t:'single',r:'Tracheal stenosis is a late complication; bleeding and pneumothorax are early.'},
{topic:'fluids',hot:true,q:'Which IV solution may be hung with a blood transfusion?',o:['0.9% normal saline only','D5W','Lactated Ringer','0.45% normal saline'],c:0,t:'single',r:'<b>Only 0.9% NS.</b> Dextrose solutions cause <b>hemolysis</b> of the red cells, and <b>lactated Ringer contains calcium</b>, which promotes clotting in the tubing.'},
{topic:'blood',hot:false,q:'How long should the nurse remain with the patient after starting a blood transfusion?',o:['No need to stay','The entire 4 hours','The first 15 minutes','The first 60 minutes'],c:2,t:'single',r:'Stay for the <b>first 15 minutes</b> and run slowly — most serious (hemolytic) reactions occur early. After that, monitor per protocol.'},
{topic:'pneumonia',hot:false,q:'The most common bacterial cause of community-acquired pneumonia is:',o:['MRSA colonization','Streptococcus pneumoniae','Pseudomonas species','Klebsiella pneumoniae'],c:1,t:'single',r:'S. pneumoniae is the leading CAP organism.'},
{topic:'resp',hot:false,q:'Cyanosis is best described as:',o:['An early sign of hypoxia','A late sign of hypoxia','Normal in older adults','A sign of fluid overload'],c:1,t:'single',r:'Cyanosis is a LATE indicator of hypoxia.'},
{topic:'clinical',hot:false,q:'Which sequence correctly reflects the nursing process for a patient with new hypoxia?',o:['Apply O₂ → assess lung sounds → set a goal → evaluate','Set a goal → apply O₂ → assess → diagnose','Assess','Diagnose → evaluate → assess → implement'],c:2,t:'single',r:'Correct ADPIE flow: Assess → Diagnose → Plan → Implement → Evaluate. The other sequences scramble the order, which is the trap in process-order questions.'},
{topic:'tb',hot:false,q:'A patient on RIPE therapy for TB reports their urine has turned orange. What is the nurse\'s best response?',o:['Stop the medication immediately and call the provider','This indicates the kidneys are beginning to fail','This is an expected, harmless effect of rifampin','Reduce fluid intake until the color returns to normal'],c:2,t:'single',r:'<b>Rifampin causes harmless orange/red discoloration of body fluids</b> (urine, sweat, tears). Reassure the patient and warn it can stain contact lenses.'},
{topic:'airway',hot:false,q:'The nurse notes continuous bubbling in the WATER SEAL chamber of a chest drainage system. This indicates:',o:['The lung has re-expanded','Normal functioning','An air leak in the system','The suction is too low'],c:2,t:'single',r:'Continuous bubbling in the water-seal chamber signals an air leak — assess connections; persistent leak with worsening status can mean tension pneumothorax.'},
{topic:'resp',hot:true,q:'Which is NOT a true statement about ARDS?',o:['PEEP is used to keep alveoli open','High-flow oxygen alone usually corrects the hypoxemia','Chest x-ray shows bilateral infiltrates','The hallmark is hypoxemia refractory to oxygen'],c:1,t:'single',r:'The whole point of ARDS is that oxygen does NOT fix it — so B is the false statement the "NOT" wants. A, C, and D are all true.'},
{topic:'pneumonia',hot:false,q:'The recommended fluid intake for a patient with pneumonia (no contraindication) is:',o:['500 mL/day','Restrict to 1 L/day','2-3 L/day','NPO'],c:2,t:'single',r:'2-3 L/day thins and mobilizes secretions.'},
{topic:'fluids',hot:false,q:'A patient with major burns requires fluid resuscitation. Which solution is used with the Parkland formula?',o:['Lactated Ringer','0.9% normal saline','D5W','3% saline'],c:0,t:'single',r:'<b>Lactated Ringer</b> is the burn resuscitation fluid. It restores perfusion and its lactate helps correct the <b>metabolic acidosis</b> of major burns.'},
{topic:'upper',hot:false,q:'Which statement about a permanent tracheostomy after total laryngectomy is accurate?',o:['Swimming is safe as long as the head stays above water','The patient can still breathe normally through the nose','The stoma will close on its own within several months','Air no longer passes through the nose, so it must be humidified'],c:3,t:'single',r:'The airway is <b>permanently rerouted to the neck stoma</b>. The nose no longer warms, filters, or humidifies air, so external humidification and stoma protection are essential. <b>These patients can never swim.</b>'},
{topic:'clinical',hot:true,q:'A patient has all of these orders. Which one should the nurse QUESTION (i.e., which is NOT appropriate)?',o:['For a fluid-overloaded HF patient: infuse 1 L NS over 1 hour','For hypovolemia: give an isotonic IV fluid bolus as ordered','For hyperkalemia: administer IV calcium gluconate as ordered','For suspected TB: place the patient on airborne precautions'],c:0,t:'single',r:'A rapid saline bolus in a fluid-overloaded heart-failure patient would worsen the overload — that\'s the inappropriate order to question. The other three are all correct. "Which to question" = find the wrong one.'},
{topic:'copd',hot:false,q:'A Mantoux (PPD) test is read in 48-72 hours by measuring:',o:['The wheal','Warmth','Redness','Induration'],c:3,t:'single',r:'Measure the induration (raised firm area), not redness.'},
{topic:'lytes',hot:true,q:'A nurse identifies which finding as the BEST indicator of fluid balance?',o:['Daily weight','Urine color','Blood pressure','Skin turgor'],c:0,t:'single',r:'Daily weight is most reliable; 1 kg ≈ 1 L of fluid.'},
{topic:'fluids',hot:false,q:'Which fluid is appropriate for a patient in liver failure needing free water replacement?',o:['D5W','Lactated Ringer','3% saline','0.45% NS with potassium'],c:0,t:'single',r:'<b>D5W</b> provides calories, prevents hypoglycemia, and supplies free water. <b>Lactated Ringer is avoided in liver failure</b> because the failing liver cannot metabolize lactate.'},
{topic:'clinical',hot:false,q:'Which nursing action during ADPIE can be DELEGATED to assistive personnel, leaving the nurse to handle the steps that require judgment?',o:['Evaluating whether the expected outcomes were met','Formulating the nursing diagnosis from the assessment','Recording intake and output and reporting the values','Performing the admission assessment on a new patient'],c:2,t:'single',r:'Assessment, diagnosis, and evaluation require nursing judgment and cannot be delegated. Routine data-collection tasks like measuring/recording I&O can be delegated to AP.'},
{topic:'abg',hot:false,q:'The ROME mnemonic stands for:',o:['Respiratory Only, Metabolic Even','Reverse Oxygen, Match Electrolytes','Renal Opposite, Metabolic Equal','Respiratory Opposite, Metabolic Equal'],c:3,t:'single',r:',o:['},
{topic:'abg',hot:false,q:'A patient\'s ABG: pH 7.34, PaCO₂ 60, HCO₃ 31. The nurse recognizes this as which state, and what does it tell you about the patient?',o:['Fully compensated respiratory acidosis, likely chronic COPD','Metabolic alkalosis from vomiting or diuretic therapy','Respiratory alkalosis from anxiety-driven hyperventilation','Uncompensated respiratory acidosis from an acute event'],c:0,t:'single',r:'pH is near-normal but on the acidic side, with BOTH CO₂ and HCO₃ elevated — the kidneys have retained bicarb to compensate. This pattern fits a chronic CO₂ retainer (COPD) rather than an acute crisis.'},
{topic:'pneumonia',hot:false,q:'Which of the following is an IMPLEMENTATION action for a patient with pneumonia? (Select all that apply)',o:['Reposition and assist with incentive spirometry','Auscultate breath sounds to gather data','Set a goal of "clear breath sounds by discharge"','Administer the prescribed antibiotic','Encourage 2–3 L of fluid per day'],c:[0,3,4],t:'multi',r:'Implementation = actions you perform: giving the antibiotic, encouraging fluids, repositioning/IS coaching. Auscultating is assessment; setting a goal is planning.'},
{topic:'lytes',hot:false,q:'A patient with a BUN:creatinine ratio of 25:1, increased hematocrit, and dry mucous membranes most likely has:',o:['Metabolic alkalosis','Fluid volume deficit','Hyperkalemia','Fluid volume excess'],c:1,t:'single',r:'A ratio >20:1 with hemoconcentration indicates fluid volume deficit.'},

<h2 class="sec-title"><span class="sec-emoji">🩺</span> Priority Decoder</h2>

document.getElementById('sec-tricks').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🎯</span> Trick Questions</h2>
<p class="intro-line">First the keyword patterns, then the twelve specific traps he sets in this unit. Read this the night before.</p>

<div class="card" style="border-color:var(--red)">
  <h3>⚠️ Rule zero: find the key word before you read the options</h3>
  <ul class="clean">
    <li>Underline the word that controls the question: <b>NOT • EXCEPT • BEST • FIRST • ONLY • MOST • LEAST • INITIAL • PRIORITY</b>.</li>
    <li>Negative words flip the task. Now three options are TRUE and one is false, and the true ones feel correct. That is the trap.</li>
    <li>Cover the options, answer in your head, then look. Much harder to be led.</li>
  </ul>
  <div class="mnem"><div class="tag">🧠 Mnemonic</div><div class="big">"Read it twice, key word slice."</div></div>
</div>

<div class="card" style="border-color:var(--red)"><h3>1. The comfort option that delays the emergency</h3>
<p>A transfusion reaction with "give acetaminophen" or "slow the rate" offered.</p>
<div class="trap"><span class="tag">Why it is wrong</span><b>Stop the blood first.</b> Everything else happens after the infusion is off and saline is running through new tubing.</div></div>

<div class="card" style="border-color:var(--red)"><h3>2. The normal number that is not reassuring</h3>
<p>An asthmatic whose PaCO₂ climbed from 28 to 41.</p>
<div class="trap"><span class="tag">Why it is wrong</span>A normalizing CO₂ in a hyperventilating patient means the muscles are <b>failing</b>. Next stop is respiratory acidosis.</div></div>

<div class="card" style="border-color:var(--red)"><h3>3. Silence read as improvement</h3>
<p>Wheezing disappears during a severe asthma attack.</p>
<div class="trap"><span class="tag">Why it is wrong</span>A wheeze needs airflow to exist. No sound means <b>almost no air is moving</b>.</div></div>

<div class="card" style="border-color:var(--red)"><h3>4. Sealing the leak you need open</h3>
<p>A dislodged chest tube with "tape on all four sides" offered.</p>
<div class="trap"><span class="tag">Why it is wrong</span>Three sides makes a <b>flutter valve</b>. Four sides traps air and causes a tension pneumothorax.</div></div>

<div class="card" style="border-color:var(--red)"><h3>5. The right finding in the wrong chamber</h3>
<p>Continuous bubbling in a chest drainage system.</p>
<div class="trap"><span class="tag">Why it is wrong</span>The <b>chamber</b> is the question. Water-seal = air leak. Suction-control on wall suction = normal.</div></div>

<div class="card" style="border-color:var(--red)"><h3>6. Hypotonic fluid to "replace water"</h3>
<p>A hypotensive dehydrated patient with 0.45% saline as an option.</p>
<div class="trap"><span class="tag">Why it is wrong</span>Hypotonic fluid moves water <b>into cells</b> and drops the BP further. Volume problem = isotonic.</div></div>

<div class="card" style="border-color:var(--red)"><h3>7. Edema read as overload</h3>
<p>A swollen patient with a BP of 90/56 and a heart rate of 118.</p>
<div class="trap"><span class="tag">Why it is wrong</span><b>Third spacing.</b> Fluid left the vessel. Swollen outside, empty inside.</div></div>

<div class="card" style="border-color:var(--red)"><h3>8. The calcium lists swapped</h3>
<p>Hypocalcemia with "constipation, kidney stones, lethargy" offered.</p>
<div class="trap"><span class="tag">Why it is wrong</span>That is the <b>hyper</b>calcemia list. Low calcium makes things <b>fire</b>: tetany, tingling, laryngospasm, seizures.</div></div>

<div class="card" style="border-color:var(--red)"><h3>9. Hyperkalemia treatments in the wrong order</h3>
<p>All four options are real hyperkalemia drugs.</p>
<div class="trap"><span class="tag">Why it is wrong</span>Sequence is the question: <b>protect</b> (calcium gluconate) → <b>shift</b> (insulin/dextrose, albuterol) → <b>remove</b> (kayexalate, dialysis).</div></div>

<div class="card" style="border-color:var(--red)"><h3>10. Confusion attributed to age</h3>
<p>An 82-year-old, newly confused, afebrile.</p>
<div class="trap"><span class="tag">Why it is wrong</span>"Normal aging," "sundowning," and "anxiety" all appear. Acute mental status change <b>is</b> the infection presentation.</div></div>

<div class="card" style="border-color:var(--red)"><h3>11. Withholding the thing that fixes the mechanism</h3>
<p>A post-op patient who will not cough because of pain, with an option to hold the opioid.</p>
<div class="trap"><span class="tag">Why it is wrong</span>Pain is what is <b>causing</b> the atelectasis. Medicate first, then pulmonary hygiene.</div></div>

<div class="card" style="border-color:var(--red)"><h3>12. Droplet where airborne belongs</h3>
<p>"All of the following require airborne precautions EXCEPT..."</p>
<div class="trap"><span class="tag">Why it is wrong</span>TB, measles, and varicella are <b>airborne</b>. Bacterial pneumonia is <b>droplet</b>. The EXCEPT wording means the odd one out is the answer.</div></div>

<div id="q-tricks"></div>`;
renderFilteredQuiz('q-tricks', secQ(EXAM.filter(q=>q.topic==='clinical'||q.hot)), 'Trap practice', 'Trick Questions');

<h2 class="sec-title"><span class="sec-emoji">🔎</span> How to Answer His Questions</h2>
<p class="intro-line">Not content. Method. Read this before the exam — it is the same moves every time, and it is what carried Unit 1.</p>

<div class="tipbar">🧠 <b>Most wrong answers are reading errors, not knowledge errors.</b> You knew it. You answered a different question than the one on the screen.</div>

<div class="card" style="border-color:var(--purple)">
  <h3>The 5-step read</h3>
  <ol class="chainlist">
    <li><b>1. Find the actual question.</b> Cover the options. Read the last sentence first — that is what is being asked. Everything above it is setup.</li>
    <li><b>2. Answer it in your head</b> before looking at the options. If you already have an answer, the distractors cannot pull you.</li>
    <li><b>3. Circle the qualifier.</b> <b>First · Best · Priority · Most · Initial · Except · NOT</b>. These flip the whole question.</li>
    <li><b>4. Eliminate on principle.</b> Cross off anything unsafe, out of nursing scope, or factually wrong — no matter how good it sounds.</li>
    <li><b>5. Between the last two, ask what makes them different.</b> There is exactly one difference. That difference is the question.</li>
  </ol>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ The question inside the question — Unit 2 edition</h3>
  <table class="lab">
    <tr><th>What it looks like</th><th>What he is actually asking</th></tr>
    <tr><td>Four patients, all with something wrong</td><td><b>Whose airway or breathing fails first?</b></td></tr>
    <tr><td>A set of labs with one value off</td><td><b>Deficit or overload?</b> Concentrated = deficit. Diluted = overload</td></tr>
    <tr><td>An ABG with four numbers</td><td><b>Which system moved with the pH, and did the other one try to fix it?</b></td></tr>
    <tr><td>"Which IV fluid does the nurse anticipate?"</td><td><b>Which compartment needs the water?</b> Vessel = isotonic. Cells = hypotonic. Pull it out = hypertonic</td></tr>

  <table class="lab">

    <tr><td><b>BEST</b></td><td>The most complete option, even if others are partly right</td></tr>
    <tr><td><b>PRIORITY</b></td><td>What kills soonest. <b>Airway, breathing, circulation</b></td></tr>

    <tr><td><b>INDICATES UNDERSTANDING</b></td><td>Find the <b>right</b> statement</td></tr>

<div class="card">
  <h3>Ranking when everything looks wrong</h3>
  <ol class="chainlist">
    <li><b>1. Airway</b> — stridor, swelling, laryngospasm from low calcium, no gag</li>

    <tr><td>Stable patient, incomplete data</td><td><b>ASSESS</b></td></tr>

    <tr><td>The stem already gave you the assessment</td><td><b>ACT.</b> Reassessing what you were just told is stalling</td></tr>
    <tr><td>An IV rate or fluid type is wrong</td><td><b>Slow or stop for safety, then notify.</b> You cannot re-prescribe</td></tr>
  </table>
  <div class="trap"><span class="tag">The stalling answers</span><b>"Notify the provider," "document," "continue to monitor," "recheck in an hour."</b> Sometimes right, usually the safe-sounding option that does nothing. Ask: <i>is there something I can do right now that helps?</i></div>
</div>

<script>
document.getElementById('sec-why').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🧠</span> Why Engine</h2>
<p class="intro-line">Casteel does not test the fact. He tests the <b>because</b>. Walk the chain forward and you can derive the sign, the priority, and the intervention even when the stem is worded in a way you have never seen.</p>

<div class="tipbar">📖 Read a chain, then say it out loud without looking. If you can only say step 1 and the last step, you memorized the fact and skipped the mechanism, which is exactly the gap his distractors are built to catch.</div>











<div class="card">
  <h3>😮‍💨 Why a rising CO2 in an asthma attack is the worst sign in the room</h3>
  <ol class="chainlist">
    <li><b>1.</b> An asthmatic in distress hyperventilates, blowing off CO2 → the early gas shows a <b>LOW</b> PaCO2 (respiratory alkalosis).</li>
    <li><b>2.</b> As the attack continues, the respiratory muscles <b>fatigue</b>.</li>
    <li><b>3.</b> Ventilation falls, so CO2 stops being blown off and starts climbing back toward normal.</li>
    <li><b>4.</b> A "normal" PaCO2 of 41 in a patient who was at 28 does not mean improvement. It means the patient <b>can no longer keep up</b>.</li>
    <li><b>5.</b> The next step is respiratory acidosis, then arrest. This patient needs intervention <b>now</b>.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>"The CO2 is normalizing — the patient is improving" is written to sound reassuring and reasonable. In a tiring asthmatic it is the wrong reading of a normal number.</div>
</div>

<div class="card">
  <h3>🌬️ Why a silent chest is worse than loud wheezing</h3>
  <ol class="chainlist">
    <li><b>1.</b> A wheeze is made by <b>air moving turbulently through a narrowed airway</b>.</li>
    <li><b>2.</b> Making that sound requires enough airflow to vibrate the airway walls.</li>
    <li><b>3.</b> As obstruction worsens, airflow drops below the amount needed to make any sound.</li>
    <li><b>4.</b> So the chest goes <b>silent</b> — not because the airways opened, but because almost nothing is moving.</li>
    <li><b>5.</b> Silent chest = <b>impending respiratory failure</b>. It is an emergency, not a sign of resolution.</li>
  </ol>
</div>

<div class="card">
  <h3>🦠 Why pneumonia looks like confusion in an older adult</h3>
  <ol class="chainlist">
    <li><b>1.</b> Alveoli fill with <b>inflammatory exudate</b>, so the gas exchange surface is blocked.</li>
    <li><b>2.</b> Hypoxia develops, and the aging brain has the <b>least physiologic reserve</b> of any organ.</li>
    <li><b>3.</b> The aging hypothalamus also mounts a <b>blunted febrile response</b>, so the temperature may stay normal.</li>
    <li><b>4.</b> The first system to visibly fail is therefore the brain → <b>acute confusion, weakness, falling appetite</b>.</li>
    <li><b>5.</b> So in an older adult, <b>mental status change IS the pneumonia presentation</b>, and "afebrile" rules out nothing.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>The distractors are "normal aging," "sundowning," and "anxiety." All three are things a real nurse might say, and all three delay the workup.</div>
</div>

<div class="card">
  <h3>🧯 Why a chest tube is taped on only three sides</h3>
  <ol class="chainlist">
    <li><b>1.</b> The pleural space is normally a <b>closed system at negative pressure</b>, which is what keeps the lung expanded.</li>
    <li><b>2.</b> When the tube comes out, that space is open to the atmosphere and air rushes IN.</li>
    <li><b>3.</b> Air accumulating with no way out builds pressure → the lung collapses → the mediastinum shifts → <b>tension pneumothorax</b>.</li>
    <li><b>4.</b> Gauze taped on <b>three sides</b> makes a <b>one-way flutter valve</b>: air can escape on expiration but cannot enter on inspiration.</li>
    <li><b>5.</b> Taping all four sides seals it completely, which is exactly how you <b>cause</b> the tension pneumothorax.</li>
  </ol>
  <div class="hy"><span class="tag">Same logic</span>This is also why you almost never clamp a chest tube. Clamping traps air with no escape route.</div>
</div>

<div class="card">
  <h3>💨 Why bubbling means different things in different chambers</h3>
  <ol class="chainlist">
    <li><b>1.</b> The <b>water-seal chamber</b> is a one-way valve. Air only passes through it if air is <b>escaping the patient's chest</b>.</li>
    <li><b>2.</b> So continuous bubbling there means <b>air is leaking</b> — from the lung, the tubing, or a loose connection.</li>
    <li><b>3.</b> The <b>suction-control chamber</b> bubbles because <b>wall suction is pulling room air through it</b>. That has nothing to do with the patient.</li>
    <li><b>4.</b> So bubbling there is <b>expected and normal</b> whenever suction is running.</li>
    <li><b>5.</b> <b>Tidaling</b> (fluid rising and falling with breathing) in the water seal is normal and shows the system is patent. It stopping means the lung re-expanded OR the tube is blocked.</li>
  </ol>
</div>

<div class="card">
  <h3>🩸 Why only normal saline hangs with blood</h3>
  <ol class="chainlist">
    <li><b>1.</b> <b>Dextrose solutions are hypotonic once the sugar is metabolized</b>, so water rushes into the red cells and <b>lyses</b> them.</li>
    <li><b>2.</b> <b>Lactated Ringer contains calcium</b>, and calcium is a clotting factor — it reverses the citrate anticoagulant in the bag and causes <b>clot formation</b>.</li>
    <li><b>3.</b> Only <b>0.9% normal saline</b> is isotonic and calcium-free.</li>
    <li><b>4.</b> The same logic drives the timing rules: start within <b>30 minutes</b> of leaving the bank (uncontrolled temperature) and finish within <b>4 hours</b> (bacterial growth).</li>
    <li><b>5.</b> And it is why you stay for the <b>first 15 minutes</b> running slowly — a hemolytic reaction shows up while very little blood has been given.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>In a reaction question, "give acetaminophen," "slow the rate," and "notify the provider" all appear. <b>Stop the blood first.</b> Everything else happens after the infusion is off and the saline is running through new tubing.</div>
</div>

<div class="card">
  <h3>🫁 Why oxygen is capped in some COPD patients</h3>
  <ol class="chainlist">
    <li><b>1.</b> Normally the drive to breathe comes from <b>rising CO2</b>.</li>
    <li><b>2.</b> A chronic retainer has lived with a high CO2 for years, so the central chemoreceptors have <b>reset</b> and stopped responding to it.</li>
    <li><b>3.</b> Their remaining stimulus is a <b>low oxygen level</b> sensed by peripheral chemoreceptors.</li>
    <li><b>4.</b> Flooding them with high-flow oxygen removes that stimulus and <b>ventilation falls</b>, so CO2 climbs further.</li>
    <li><b>5.</b> So the target is <b>SpO2 88 to 92%</b> with a controlled device like a <b>Venturi mask</b> — enough oxygen to perfuse, not enough to erase the drive.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>This never means withholding oxygen from a hypoxic patient. If a COPD patient is in true respiratory distress, you oxygenate. The rule is about <b>controlled</b> delivery and monitoring, not rationing.</div>
</div>

<div class="card">
  <h3>💧 Why tonicity decides where the water goes</h3>
  <ol class="chainlist">
    <li><b>1.</b> Water always moves toward the <b>higher solute concentration</b>. That is the only rule.</li>
    <li><b>2.</b> <b>Isotonic</b> fluid matches serum, so no gradient forms and it <b>stays in the vessel</b> → expands volume.</li>
    <li><b>3.</b> <b>Hypotonic</b> fluid is more dilute, so water moves <b>into cells</b> → cells swell → danger is <b>cerebral edema</b>.</li>
    <li><b>4.</b> <b>Hypertonic</b> fluid is more concentrated, so water is pulled <b>out of cells</b> → danger is <b>overload and phlebitis</b>.</li>
    <li><b>5.</b> So the fluid you pick is decided by <b>where the patient needs water to go</b>, not by the diagnosis label.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>He gives you a hypotensive dehydrated patient and offers 0.45% saline, which sounds like "replacing water." It pulls water into cells and drops the BP further. Isotonic is the answer any time the problem is <b>intravascular volume</b>.</div>
</div>

<div class="card">
  <h3>🫧 Why a third-spacing patient is swollen and dry at the same time</h3>
  <ol class="chainlist">
    <li><b>1.</b> The liver makes <b>albumin</b>, which generates <b>plasma oncotic pressure</b> — the force holding water inside the vessel.</li>
    <li><b>2.</b> Liver disease, malnutrition, burns, or sepsis drops albumin or damages the capillary wall.</li>
    <li><b>3.</b> Oncotic pressure falls, hydrostatic pressure wins, and water leaves the vessel for the interstitium.</li>
    <li><b>4.</b> The visible result is <b>edema and ascites</b>. The invisible result is <b>falling intravascular volume</b>.</li>
    <li><b>5.</b> So the patient is <b>edematous outside and hypovolemic inside</b>, and diuresing the swelling worsens the shock.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>A swollen patient with a BP of 90/56 and a heart rate of 118. Every instinct says diurese. Look at the perfusion numbers, not the ankles.</div>
</div>

<div class="card">
  <h3>⚡ Why potassium is the electrolyte that kills</h3>
  <ol class="chainlist">
    <li><b>1.</b> Potassium sets the <b>resting membrane potential</b> of every excitable cell, including cardiac muscle.</li>
    <li><b>2.</b> The normal range is narrow — <b>3.5 to 5.0</b> — because small shifts change how easily the heart depolarizes.</li>
    <li><b>3.</b> <b>High</b> K makes the membrane easier to depolarize but harder to reset → <b>peaked T waves → wide QRS → asystole</b>.</li>
    <li><b>4.</b> <b>Low</b> K makes it harder to depolarize → <b>flat T waves, U wave</b>, muscle weakness, ileus.</li>
    <li><b>5.</b> Because the effect is on the myocardium, treatment order is <b>protect (calcium gluconate) → shift (insulin/dextrose, albuterol) → remove (kayexalate, dialysis)</b>.</li>
    <li><b>6.</b> IV push is fatal <b>because</b> a sudden bolus reaches the heart before it can distribute.</li>
  </ol>
  <div class="hy"><span class="tag">Connect it</span>You cannot fix hypokalemia until magnesium is replaced, because magnesium is required for the cell to hold onto potassium. That is why he pairs the two.</div>
</div>

<div class="card">
  <h3>🦴 Why hypocalcemia is an airway problem</h3>
  <ol class="chainlist">
    <li><b>1.</b> Calcium <b>stabilizes the nerve membrane</b>, raising the threshold a nerve needs to fire.</li>
    <li><b>2.</b> Low calcium lowers that threshold, so nerves fire on their own.</li>
    <li><b>3.</b> Spontaneous firing produces <b>tingling, twitching, and tetany</b> — hence Chvostek and Trousseau.</li>
    <li><b>4.</b> If the muscle that spasms is the <b>larynx</b>, the airway closes.</li>
    <li><b>5.</b> So the priority in symptomatic hypocalcemia is <b>airway and seizure precautions</b>, not the constipation-and-bones list.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>He hands you the hypercalcemia symptom list as distractors. <b>Low calcium = things fire. High calcium = things slow down.</b></div>
</div>

<div class="card">
  <h3>🫁 Why ROME works</h3>
  <ol class="chainlist">
    <li><b>1.</b> <b>CO₂ is an acid</b> controlled by the <b>lungs</b>. <b>Bicarbonate is a base</b> controlled by the <b>kidneys</b>.</li>
    <li><b>2.</b> If the lungs cause the problem, CO₂ rises and pH falls — <b>opposite</b> directions. Respiratory Opposite.</li>
    <li><b>3.</b> If the kidneys cause it, bicarb falls and pH falls — the <b>same</b> direction. Metabolic Equal.</li>
    <li><b>4.</b> The system that is NOT the cause tries to correct it, which is <b>compensation</b>.</li>
    <li><b>5.</b> Lungs compensate in <b>minutes</b> by changing the rate; kidneys in <b>hours to days</b> by retaining or dumping bicarb.</li>
    <li><b>6.</b> So the pH names it, the matching value locates it, and the third value tells you how long it has been going on.</li>
  </ol>
  <div class="hy"><span class="tag">Compensation shortcut</span>pH abnormal + one system abnormal = <b>uncompensated</b>. pH abnormal + both abnormal = <b>partially</b>. pH <b>normal</b> + both abnormal = <b>fully compensated</b>, which almost always means chronic.</div>
  <div class="mnem" style="border-color:var(--gold)"><div class="tag">⭐ He asks this out loud</div><div class="big">Kidney problem → automatically METABOLIC. Lung problem → automatically RESPIRATORY.</div><div class="exp">Kidneys own bicarbonate, lungs own CO₂. And a failing kidney cannot compensate for a lung problem, so expect an uncompensated gas when both are involved.</div></div>
</div>

<div class="hy">🧠 <b>Self-test:</b> pick a question you missed and ask which link in the chain you did not know. If you cannot name the link, you were guessing from recognition. Go back to that chain before answering more questions.</div>

<div id="whyQuiz"></div>`;

<script>
document.getElementById('sec-hooks').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🪝</span> Memory Hooks</h2>
<p class="intro-line">Unit 2 is dense. These are the hooks that collapse it into a handful of things you can actually hold onto under pressure.</p>

<div class="tipbar">🧠 Don't memorize the hooks. Memorize <b>one</b> per topic, then derive the rest from it. That is the whole point.</div>

<div class="card" style="border-color:var(--purple)">
  <h3>💧 Fluids — one rule runs everything</h3>
  <div class="mnem"><div class="tag">The master rule</div><div class="big">WATER FOLLOWS SOLUTES</div></div>
  <table class="lab">
    <tr><th>Hook</th><th>What it unlocks</th></tr>
    <tr><td><b>Potassium INside, Sodium Outside</b></td><td>K problems hit the heart cell. Na problems move water and hit the brain</td></tr>
    <tr><td><b>hypO makes cells swell like an O</b></td><td>Hypotonic → water INTO cells → swelling → <b>cerebral edema</b></td></tr>
    <tr><td><b>hyPER = shrivelED</b></td><td>Hypertonic → water OUT of cells → shrinking</td></tr>
    <tr><td><b>Push out, pull back</b></td><td>Hydrostatic pushes out at the arterial end. Oncotic pulls back at the venous end</td></tr>
    <tr><td><b>Blood + saline. Nothing else.</b></td><td>Dextrose lyses cells, LR's calcium clots. <b>Only 0.9% NS</b></td></tr>
    <tr><td><b>The scale doesn't lie</b></td><td><b>Daily weight is the best indicator.</b> 1 kg = 1 L</td></tr>
    <tr><td><b>Deficit concentrates, overload dilutes</b></td><td>Deficit: ↑Hct, ↑BUN, osm &gt;300. Overload: ↓Hct, ↓BUN, osm &lt;270</td></tr>
  </table>
  <div class="hy"><span class="tag">Osmolality anchor</span><b>270–300.</b> Under 270 = too much water. Over 300 = not enough. One number sorts every fluid stem.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⚡ Electrolytes — learn the direction, not the list</h3>
  <table class="lab">
    <tr><th>Hook</th><th>Meaning</th></tr>
    <tr><td><b>Low Ca and low Mg → things FIRE</b></td><td>Tetany, tingling, <b>Chvostek and Trousseau</b>, hyperreflexia, seizures</td></tr>
    <tr><td><b>High Ca and high Mg → things SLOW</b></td><td>Lethargy, constipation, weakness, <b>absent reflexes</b></td></tr>
    <tr><td><b>Chvostek = CHeek. Trousseau = Tourniquet.</b></td><td>Tap the cheek → twitch. BP cuff → hand spasm</td></tr>
    <tr><td><b>Low K = flat and Ushaped. High K = peaked.</b></td><td>Flat T with a U wave vs peaked T → wide QRS → asystole</td></tr>
    <tr><td><b>Low K constipates, high K evacuates</b></td><td>The GI clue that separates two near-identical pictures</td></tr>
    <tr><td><b>Can't fix K until you fix Mg</b></td><td>The stubborn-potassium stem. Magnesium first</td></tr>
    <tr><td><b>Protect → Shift → Remove</b></td><td>Hyperkalemia: calcium gluconate, then insulin/D50 and albuterol, then kayexalate or dialysis</td></tr>
    <tr><td><b>Low Na = brain swells</b></td><td>Confusion, headache, seizures. Correct <b>slowly</b> either direction</td></tr>
  </table>
  <div class="mnem"><div class="tag">If you remember one thing</div><div class="big">Potassium kills the heart. Sodium swells the brain. Calcium and magnesium run the nerves.</div></div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🫁 ABGs — three steps, one mnemonic</h3>
  <div class="mnem"><div class="tag">The method</div><div class="big">ROME — Respiratory Opposite, Metabolic Equal</div></div>
  <table class="lab">
    <tr><th>Hook</th><th>Meaning</th></tr>
    <tr><td><b>Kidney = metabolic. Lung = respiratory.</b></td><td>Name the broken organ, you've named half the gas</td></tr>
    <tr><td><b>CO₂ is the acid. Bicarb is the base.</b></td><td>Lungs own CO₂ (minutes). Kidneys own bicarb (days)</td></tr>
    <tr><td><b>7.35–7.39 is the acid side of normal</b></td><td>How you name a fully compensated gas</td></tr>
    <tr><td><b>Vomit acid, poop base</b></td><td>Vomiting/NG loses acid → alkalosis. Diarrhea loses bicarb → acidosis</td></tr>
    <tr><td><b>One abnormal = un. Both = partial. pH normal + both = full.</b></td><td>The compensation ladder in one line</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--blue)">
  <h3>🫁 Respiratory — the signs that lie</h3>
  <table class="lab">
    <tr><th>Hook</th><th>Meaning</th></tr>
    <tr><td><b>Restless first, blue last</b></td><td><b>Restlessness is the earliest hypoxia sign.</b> Cyanosis is very late</td></tr>
    <tr><td><b>A quiet chest is a dying chest</b></td><td>Silent chest in asthma = no air moving. Worse, not better</td></tr>
    <tr><td><b>A normal CO₂ in a hyperventilating asthmatic = they're tiring</b></td><td>The number improving while the patient deteriorates</td></tr>
    <tr><td><b>SHUNT = blood, no air. DEAD SPACE = air, no blood.</b></td><td>Pneumonia is shunt. PE is dead space</td></tr>
    <tr><td><b>O₂ can't fix a shunt</b></td><td>Which is what <b>refractory hypoxemia = ARDS</b> means</td></tr>
    <tr><td><b>88 to 92</b></td><td>COPD saturation target with controlled delivery</td></tr>
    <tr><td><b>Both dull — fremitus decides</b></td><td>Consolidation ↑fremitus + egophony. Effusion ↓fremitus</td></tr>
    <tr><td><b>Bronchodilator, then steroid, then rinse</b></td><td>Open the road before sending the traffic</td></tr>
    <tr><td><b>Old + confused + no fever = pneumonia or UTI</b></td><td>Aging blunts the febrile response</td></tr>
  </table>
</div>

<div class="card">
  <h3>🩹 Chest tubes — three sounds, three meanings</h3>
  <table class="lab">
    <tr><th>Hook</th><th>Meaning</th></tr>
    <tr><td><b>Tidaling = good</b></td><td>Fluid rises and falls with breathing. The system is patent</td></tr>
    <tr><td><b>Water seal bubbling = LEAK</b></td><td>Continuous bubbling there is a problem</td></tr>
    <tr><td><b>Suction chamber bubbling = normal</b></td><td>That is what wall suction is supposed to do</td></tr>
    <tr><td><b>Tape three sides, not four</b></td><td>Makes a one-way flutter valve so air escapes instead of building a tension pneumothorax</td></tr>
    <tr><td><b>Disconnected → sterile water. Dislodged → three-sided gauze.</b></td><td>Two different emergencies, two different answers</td></tr>
    <tr><td><b>Almost never clamp</b></td><td>Clamping traps air with no way out</td></tr>
  </table>
</div>

<div class="card">
  <h3>🦠 TB and infection control</h3>
  <table class="lab">
    <tr><th>Hook</th><th>Meaning</th></tr>
    <tr><td><b>RIPE</b></td><td>Rifampin (orange), Isoniazid (B6, liver), Pyrazinamide (liver), Ethambutol (eyes)</td></tr>
    <tr><td><b>N95 on the nurse, surgical mask on the patient</b></td><td>The direction students reverse</td></tr>
    <tr><td><b>Measure the bump, not the red</b></td><td>Mantoux: <b>induration</b> at 48–72 hours</td></tr>
    <tr><td><b>A positive skin test = exposure, not disease</b></td><td>Sputum culture confirms active TB</td></tr>
    <tr><td><b>CASEating = TB. NONcaseating = sarcoid.</b></td><td>One word, two diseases</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ If you only hold ten things</h3>
  <ol class="chainlist">
    <li><b>1.</b> Water follows solutes.</li>
    <li><b>2.</b> Potassium inside, sodium outside. K kills the heart, Na swells the brain.</li>
    <li><b>3.</b> Daily weight is the best fluid indicator. 1 kg = 1 L.</li>

    <li><b>8.</b> Restlessness is the first hypoxia sign; cyanosis is the last.</li>
    <li><b>9.</b> A silent chest and a normalizing CO₂ both mean worse.</li>
    <li><b>10.</b> Water seal bubbling = leak. Suction bubbling = fine.</li>
  </ol>
</div>
