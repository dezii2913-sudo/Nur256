(function restoreNotes(){ try{ const r=localStorage.getItem('nur256u2_notes'); if(r) notesList=JSON.parse(r); }catch(e){} })();
const NOTES_STORAGE_KEY='nur256u2_notes';
function saveNotes(){ try{ localStorage.setItem('nur256u2_notes', JSON.stringify(notesList)); }catch(e){} }
function escN(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
let noteDraft='', noteDraftStar=false;
function captureDraft(){ const el=document.getElementById('noteInput'); if(el) noteDraft=el.value; const c=document.getElementById('noteStar'); if(c) noteDraftStar=c.checked; }
function setNoteTopic(t){ captureDraft(); noteTopic=t; renderNotes(); }
function setNoteFilter(f){ captureDraft(); noteFilter=f; renderNotes(); }
function addNote(){
  const el=document.getElementById('noteInput'); if(!el)return;
  const t=el.value.trim(); if(!t){ toast('Nothing to save'); return; }
  const star=document.getElementById('noteStar').checked;
  notesList.unshift({id:Date.now()+''+Math.floor(Math.random()*999),t,topic:noteTopic,star,ts:Date.now()});
  saveNotes(); noteDraft=''; noteDraftStar=false; noteFilter = star?'keep':'inbox'; renderNotes();
  toast(star?'Saved to Keep':'Saved to Inbox');
}
function toggleStar(id){ captureDraft(); const n=notesList.find(x=>x.id===id); if(n){ n.star=!n.star; saveNotes(); renderNotes(); } }
function delNote(id){ captureDraft(); notesList=notesList.filter(x=>x.id!==id); saveNotes(); renderNotes(); toast('Deleted'); }
function clearInbox(){
  const n=notesList.filter(x=>!x.star).length;
  if(!n){ toast('Inbox already empty'); return; }
  if(confirm('Delete '+n+' unsorted note'+(n===1?'':'s')+'? Anything starred stays.')){
    notesList=notesList.filter(x=>x.star); saveNotes(); renderNotes(); toast('Inbox cleared');
  }
}
function copyNotes(){
  const list=notesList.filter(x=>x.star);
  if(!list.length){ toast('Nothing starred yet'); return; }
  const txt=list.map(n=>'['+NOTE_LABEL[n.topic]+'] '+n.t).join('\n');
  const done=()=>toast('Copied '+list.length+' notes');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,cb){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast('Copy failed'); }
  document.body.removeChild(ta);
}
/* ---- notes backup: export / import / copy-all ---- */
function notesKey(){ return NOTES_STORAGE_KEY; }
function exportNotes(){
  if(!notesList.length){ toast('No notes to export'); return; }
  const payload=JSON.stringify({v:1,key:notesKey(),saved:new Date().toISOString(),notes:notesList});
  showNotesBox('\u{1F4E6} Backup code', payload,
    'Copy this whole block and keep it somewhere safe \u2014 a note on your phone, an email to yourself, or paste it to Claude. Paste it into Import on any device to restore.');
}
function copyAllNotes(){
  if(!notesList.length){ toast('No notes yet'); return; }
  const txt=notesList.map(n=>(n.star?'\u2605 ':'\u25CB ')+'['+(NOTE_LABEL[n.topic]||n.topic)+'] '+n.t).join('\n');
  showNotesBox('\u{1F4CB} All notes as text', txt,
    'Readable format \u2014 good for pasting to Claude or into a document. \u2605 means starred.');
}
function showNotesBox(title, content, hint){
  const host=document.getElementById('notesBox'); if(!host)return;
  host.innerHTML=`<div class="card" style="border-color:var(--purple)">
    <h3>${title}</h3>
    <p style="font-size:.86rem;color:var(--muted);margin-top:0">${hint}</p>
    <textarea id="notesOut" class="noteinput" rows="7" readonly>${content.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</textarea>
    <div class="chiprow" style="margin-top:10px">
      <button class="mini" onclick="copyBoxText()">Copy to clipboard</button>
      <button class="mini" onclick="document.getElementById('notesBox').innerHTML=''">Close</button>
    </div>
  </div>`;
  const ta=document.getElementById('notesOut'); if(ta){ ta.focus(); ta.select(); ta.scrollIntoView({behavior:'smooth',block:'center'}); }
}
function copyBoxText(){
  const ta=document.getElementById('notesOut'); if(!ta)return;
  const done=()=>toast('Copied');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();try{document.execCommand('copy');done();}catch(e){toast('Select and copy manually');}}); }
  else { ta.select(); try{document.execCommand('copy'); done();}catch(e){ toast('Select and copy manually'); } }
}
function openImport(){
  const host=document.getElementById('notesBox'); if(!host)return;
  host.innerHTML=`<div class="card" style="border-color:var(--teal)">
    <h3>\u{1F4E5} Import notes</h3>
    <p style="font-size:.86rem;color:var(--muted);margin-top:0">Paste a backup code below. Existing notes are <b>kept</b> \u2014 this merges rather than replacing, and skips anything already here.</p>
    <textarea id="notesIn" class="noteinput" rows="6" placeholder="Paste your backup code here"></textarea>
    <div class="chiprow" style="margin-top:10px">
      <button class="mini on" onclick="doImport()">Import</button>
      <button class="mini" onclick="document.getElementById('notesBox').innerHTML=''">Cancel</button>
    </div>
  </div>`;
  const ta=document.getElementById('notesIn'); if(ta){ ta.focus(); ta.scrollIntoView({behavior:'smooth',block:'center'}); }
}
function doImport(){
  const ta=document.getElementById('notesIn'); if(!ta)return;
  const raw=(ta.value||'').trim();
  if(!raw){ toast('Paste a backup code first'); return; }
  let data;
  try{ data=JSON.parse(raw); }catch(e){ toast('That does not look like a backup code'); return; }
  const incoming = Array.isArray(data)?data:(data&&Array.isArray(data.notes)?data.notes:null);
  if(!incoming){ toast('No notes found in that code'); return; }
  const have=new Set(notesList.map(n=>n.id));
  const seen=new Set(notesList.map(n=>(n.t||'').trim()));
  let added=0, skipped=0;
  incoming.forEach(n=>{
    if(!n||typeof n.t!=='string'||!n.t.trim()) return;
    if(have.has(n.id) || seen.has(n.t.trim())){ skipped++; return; }
    notesList.push({ id: n.id || (Date.now()+''+Math.floor(Math.random()*999)),
      t: n.t, topic: (NOTE_LABEL[n.topic]?n.topic:'other'), star: !!n.star, ts: n.ts || Date.now() });
    have.add(n.id); seen.add(n.t.trim()); added++;
  });
  notesList.sort((a,b)=>(b.ts||0)-(a.ts||0));
  saveNotes();
  document.getElementById('notesBox').innerHTML='';
  renderNotes();
  toast(added+' note'+(added===1?'':'s')+' imported'+(skipped?', '+skipped+' already here':''));
}
function renderNotes(){
  const host=document.getElementById('sec-notes'); if(!host)return;
  const keep=notesList.filter(n=>n.star), inbox=notesList.filter(n=>!n.star);
  const shown = noteFilter==='keep'?keep:inbox;
  const chips=NOTE_TOPICS.map(t=>`<button class="chip ${noteTopic===t?'on':''}" onclick="setNoteTopic('${t}')">${NOTE_LABEL[t]}</button>`).join('');
  const rows = shown.length ? shown.map(n=>`
    <div class="notecard">
      <div class="noterow">
        <span class="notetag">${NOTE_LABEL[n.topic]}</span><span class="notespacer"></span>
        <button class="mini ${n.star?'on':''}" onclick="toggleStar('${n.id}')">${n.star?'★ Keep':'☆ Keep'}</button>
        <button class="mini danger" onclick="delNote('${n.id}')">Delete</button>
      </div>
      <div class="notetext">${escN(n.t)}</div>
    </div>`).join('')
    : `<div class="card" style="text-align:center;color:var(--muted)">${noteFilter==='keep'?'Nothing starred yet. Star a note when Casteel signals it is testable.':'Inbox is empty. Everything you wrote has been sorted or cleared.'}</div>`;
  host.innerHTML=`
  <h2 class="sec-title"><span class="sec-emoji">✍️</span> Class Notes</h2>
  <p class="intro-line">Type fast during lecture. Sort later. Saves on this device only.</p>

  <div class="card">
    <textarea id="noteInput" class="noteinput" rows="3" placeholder="Type a keyword, a phrase he repeated, a question he asked the room...">${escN(noteDraft)}</textarea>
    <div class="chiprow">${chips}</div>
    <label class="starline"><input type="checkbox" id="noteStar" ${noteDraftStar?"checked":""}> <b>Star it</b> — he signaled this is on the test</label>
    <button class="btn wide" onclick="addNote()">Save note</button>
  </div>

  <div class="hy"><span class="tag">Keep this small on purpose</span>Not everything said in class is testable, and a page of notes you never reread is just extra weight. Star only what he flags, questions he asks out loud, and anything that contradicts what you already believed. Everything else drops to <b>Inbox</b>, and you clear the inbox at the end of the week without guilt.</div>

  <div class="card">
    <div class="chiprow">
      <button class="chip ${noteFilter==='keep'?'on':''}" onclick="setNoteFilter('keep')">★ Keep (${keep.length})</button>
      <button class="chip ${noteFilter==='inbox'?'on':''}" onclick="setNoteFilter('inbox')">Inbox (${inbox.length})</button>
    </div>
    ${keep.length>25&&noteFilter==='keep'?`<div class="trap"><span class="tag">Getting heavy</span>You have ${keep.length} starred notes. Past about 25 you are collecting, not studying. Reread them and unstar anything you already know cold.</div>`:''}
    ${rows}
    <div class="hy"><span class="tag">Keeping your notes safe</span>
  Notes are stored by your <b>browser, for this website address</b>. Replacing the file at the same GitHub Pages URL <b>keeps them</b>. They will NOT follow you to a different browser, a different device, a private/incognito window, or a copy opened from your Downloads folder. Use <b>📦 Export backup</b> to move them anywhere — or to send them to Claude.</div>
  <div id="notesBox"></div>
    <div class="chiprow" style="margin-top:12px">
      <button class="mini" onclick="copyNotes()">Copy starred</button>
      <button class="mini" onclick="copyAllNotes()">Copy all as text</button>
      <button class="mini" onclick="exportNotes()">\u{1F4E6} Export backup</button>
      <button class="mini" onclick="openImport()">\u{1F4E5} Import</button>
      <button class="mini danger" onclick="clearInbox()">Clear inbox</button>
    </div>
  </div>`;
}
renderNotes();

</script>
<script>
document.getElementById('sec-fluids').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">💧</span> Fluid Balance & IV Therapy</h2>
<p class="intro-line">Chapter 10, first half. Water follows solute. Every fluid answer on this exam traces back to that one sentence.</p>

<div class="card" style="border-color:var(--purple)">
  <h3>Why fluid matters at all — the three essential functions</h3>
  <ul class="clean">
    <li><b>Cellular metabolism</b></li>
    <li><b>Temperature regulation</b></li>
    <li><b>Delivery of oxygen and nutrients to cells</b></li>
  </ul>
  <div class="hy"><span class="tag">Why he starts here</span>Every fluid complication traces to one of these three failing. Dehydration → poor delivery. Overload → cells sit in excess water and metabolism suffers. It is the "so what" behind the whole chapter.</div>
</div>

<div class="card">
  <h3>The three fluid compartments</h3>
  <table class="lab">
    <tr><th>Compartment</th><th>Where</th><th>Main cation</th></tr>
    <tr><td><b>Intracellular (ICF)</b></td><td><b>Inside the cells</b> — about two thirds of body water</td><td><b>POTASSIUM</b></td></tr>
    <tr><td><b>Extracellular (ECF)</b></td><td><b>Outside the cells</b> — intravascular (in the vessels) and interstitial</td><td><b>SODIUM</b></td></tr>
    <tr><td><b>Transcellular</b></td><td><b>Pericardial</b> (around the heart), <b>cerebrospinal</b>, and <b>synovial</b> (between joints)</td><td>Small specialized volumes</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Two words, whole chapter</div><div class="big">Potassium is INSIDE. Sodium is OUTSIDE.</div><div class="exp">Which is why a <b>potassium</b> problem hits the <b>heart muscle cell</b>, and a <b>sodium</b> problem moves <b>water between compartments</b> and hits the <b>brain</b>.</div></div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ The three spaces — and what "third spacing" means</h3>
  <ol class="chainlist">
    <li><b>First space</b> — the <b>vascular space</b>. Inside the blood vessels, where fluid belongs.</li>
    <li><b>Second space</b> — the <b>interstitium</b>. Between the cells. Fluid pooling here is <b>edema</b>.</li>
    <li><b>Third space</b> — <b>outside both</b>, in a body cavity where it does no work. <b>Ascites in the abdomen is third-spaced fluid.</b></li>
  </ol>
  <div class="hy"><span class="tag">Albumin's job</span><b>Albumin is a protein made by the liver</b> that holds water inside the vessel by generating <b>oncotic pressure</b>. Liver failure or malnutrition drops albumin → the pull weakens → water leaks into the second and third spaces.</div>
  <div class="trap"><span class="tag">The clinical picture</span>Third-spaced fluid is <b>in the body but not in the circulation</b>. So the patient is <b>swollen and intravascularly dry at the same time</b> — edema with a falling BP and rising heart rate. Diuresing the swelling makes the shock worse.</div>
</div>

<div class="card">
  <h3>How fluid actually moves</h3>
  <div class="mnem"><div class="tag">⭐ The master rule</div><div class="big">WATER FOLLOWS SOLUTES</div><div class="exp">Electrolytes, colloids, glucose — anything dissolved. The more solutes, the higher the osmotic pressure, the harder water is pulled toward them.</div></div>
  <table class="lab">
    <tr><th>Process</th><th>What it is</th></tr>
    <tr><td><b>Osmosis</b></td><td>Movement of <b>water</b> through a semipermeable membrane from <b>low solute concentration to high</b>, until equal. Water follows the solutes</td></tr>
    <tr><td><b>Diffusion</b></td><td>Movement of <b>solute</b> from high concentration to low — the opposite direction from the water</td></tr>
    <tr><td><b>Filtration</b></td><td>Fluid movement driven by <b>hydrostatic and oncotic pressure</b> at the capillary</td></tr>
    <tr><td><b>Active transport</b></td><td>Movement <b>against</b> a gradient — requires energy (the sodium-potassium pump)</td></tr>
  </table>
  <div class="hy"><span class="tag">⭐ Filtration at the capillary</span>
  <b>Hydrostatic pressure is higher at the ARTERIAL end</b> — it <b>PUSHES</b> fluid OUT of the capillary into the tissue.<br>
  <b>Oncotic pressure is higher at the VENOUS end</b> — it <b>PULLS</b> fluid BACK into the capillary.<br>
  Push out at the start, pull back at the end. When the pull fails (low albumin) or the push is too strong (heart failure, venous congestion), fluid stays out — and that is <b>edema</b>.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>The compartments</h3>
  <ul class="clean">
    <li>Total body water is about <b>60% of body weight</b> in an adult, lower in older adults and in obesity.</li>
    <li><b>Intracellular (ICF)</b> ≈ two thirds. Principal cation is <b>potassium</b>.</li>
    <li><b>Extracellular (ECF)</b> ≈ one third, split into interstitial and intravascular. Principal cation is <b>sodium</b>.</li>
    <li><b>Osmosis</b> moves water toward the higher solute concentration. <b>Diffusion</b> moves solute from high to low. <b>Filtration</b> is driven by hydrostatic pressure.</li>
    <li><b>Oncotic pressure</b> comes from albumin and holds water inside the vessel. <b>Hydrostatic pressure</b> pushes it out.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Osmolality — the number everything is measured against</h3>
  <ul class="clean">
    <li><b>Osmolality</b> = milliosmoles per <b>kilogram of water</b>. Determined by dissolved particles — sodium, urea, glucose. Focused on concentration <b>in the body</b>.</li>
    <li><b>Osmolarity</b> = milliosmoles per <b>liter of solution</b>. Focused on water concentration <b>in a solution, such as IV fluids</b>.</li>
    <li><b>Osmosis:</b> water moves through a semipermeable membrane from <b>low particle concentration (hypotonic) to high particle concentration (hypertonic)</b> until concentrations equalize.</li>
  </ul>
  <table class="lab">
    <tr><th>Hypo-osmolar</th><th>Iso-osmolar</th><th>Hyper-osmolar</th></tr>
    <tr><td><b>&lt; 270 mOsm/kg</b></td><td><b>270–300 mOsm/kg</b></td><td><b>&gt; 300 mOsm/kg</b></td></tr>
    <tr><td>Lower solute than plasma · <b>more water than solutes</b></td><td>Solute equals plasma · equal parts water and solutes</td><td>Higher solute than plasma · <b>more solutes than water</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Memorize this range</div><div class="big">Normal serum osmolality = 270 to 300 mOsm/kg</div><div class="exp"><b>Fluid overload dilutes → osmolality falls below 270.</b> <b>Fluid deficit concentrates → osmolality rises above 300.</b> One number tells you which imbalance you are looking at.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ The RN's role with IV fluids</h3>
  <ul class="clean">
    <li><b>IV fluids are a medication.</b> You need a provider order for <b>both the type of fluid and the rate</b>.</li>
    <li><b>You cannot adjust the rate without obtaining an order.</b></li>
    <li><b>It is not your role to determine which fluid type a patient receives.</b> <b>Rate (mL/hr) is calculated by the physician based on BMI and diagnosis.</b></li>
    <li><b>Maintenance therapy:</b> roughly <b>60–80 mL/hr</b>. <b>Replacement therapy:</b> roughly <b>80–125 mL/hr</b>.</li>
    <li><b>Assessment: changes in weight are the best indicator of fluid volume change.</b> Consider I&amp;O and clinical signs alongside it.</li>
  </ul>
  <div class="trap"><span class="tag">⭐ The scope-of-practice trap</span>He offers options where the nurse <b>slows, speeds up, or switches</b> the fluid independently. Even when the clinical judgment is right, the <b>action is outside nursing scope</b>. The correct answer is to <b>stop or slow for safety and notify the provider for a new order</b> — not to re-prescribe.</div>
</div>

<div class="card">
  <h3>Who regulates fluid — organs</h3>
  <table class="lab">
    <tr><th>Organ</th><th>Job</th></tr>
    <tr><td><b>Kidneys</b></td><td>Regulate ECF volume and osmolality, excrete waste, activate vitamin D, balance acid-base</td></tr>
    <tr><td><b>Heart and vessels</b></td><td>Pump blood to the kidney so filtration can happen; baroreceptors sense pressure</td></tr>
    <tr><td><b>Lungs</b></td><td>Remove about 300 mL of water daily as vapor; regulate CO₂</td></tr>
    <tr><td><b>Osmoreceptors</b></td><td><b>Detect osmolality</b> — the amount of solutes in the blood — and trigger thirst and ADH release</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ Hormones assisting in fluid regulation</h3>
  <table class="lab">
    <tr><th>Hormone</th><th>What it does</th></tr>
    <tr><td><b>Aldosterone</b><br><i>Decreases loss of water</i></td><td>
      • Secreted from the <b>adrenal cortex</b> in response to <b>↓serum Na⁺ in the ECF</b> or <b>↑Na⁺ in the urine</b><br>
      • Acts on the <b>kidney nephrons</b><br>
      • Promotes <b>Na⁺ and water reabsorption</b><br>
      • Promotes <b>K⁺ excretion</b> from the renal tubules</td></tr>
    <tr><td><b>Antidiuretic hormone (ADH)</b><br><i>Regulates water retention and excretion</i></td><td>
      • <b>Produced by the hypothalamus, stored in the posterior pituitary</b><br>
      • Secreted in response to changes in blood osmolarity — <b>ECF volume deficit or ↑osmolality</b><br>
      • Promotes <b>water reabsorption from the distal tubules</b></td></tr>
    <tr><td><b>Natriuretic peptides</b><br><i>Induce excretion of sodium by the kidneys</i></td><td>
      • Triggered by <b>increased blood pressure and/or blood volume</b><br>
      • <b>Secreted by cardiac cells</b><br>
      • Kidney reabsorption of Na⁺ is <b>inhibited</b> with release<br>
      • <b>Urine output increases</b></td></tr>
    <tr><td><b>RAAS</b><br><i>Renin-Angiotensin-Aldosterone System</i></td><td>Low BP or low perfusion → <b>renin</b> → angiotensin I → <b>angiotensin II</b> (vasoconstriction) → <b>aldosterone</b> → sodium and water retained → volume and pressure rise</td></tr>
    <tr><td><b>PTH</b></td><td>Raises serum calcium, lowers phosphorus</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Three hormones, one line each</div><div class="big">Aldosterone holds SALT and water. ADH holds WATER. Natriuretic peptides DUMP both.</div><div class="exp">And notice the potassium: <b>aldosterone excretes K⁺</b>. That is exactly why <b>blocking aldosterone — with spironolactone, an ACE inhibitor, or an ARB — raises potassium</b>.</div></div>
  <div class="hy"><span class="tag">Where ADH starts</span><b>Osmoreceptors</b> detect rising osmolality and trigger <b>thirst</b> and <b>ADH release</b>. So ADH going up means the body is trying to <b>hold onto water</b> — anti-diuretic, less urine.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>Fluid Volume Deficit — by severity</h3>
  <p class="why-chain"><b>Hypertonic in the plasma.</b> No water, no salt, or both. Fluid leaves faster than it is replaced, so what remains is concentrated.</p>
  <ul class="clean">
    <li><b>Causes:</b> vomiting and diarrhea (fluid <i>and</i> electrolytes), insufficient sodium intake, <b>diabetes insipidus</b>, lack of water intake, diuretics, hemorrhage, laxative abuse.</li>
    <li><b>Older adults are the most susceptible.</b></li>
  </ul>
  <table class="lab">
    <tr><th>Severity</th><th>Findings</th></tr>
    <tr><td><b>Mild — 2% weight loss</b></td><td><b>Thirst</b></td></tr>
    <tr><td><b>Marked — 5% weight loss</b></td><td>Extreme thirst, ↑temp, ↑HR and RR, ↓BP, dry mucous membranes, poor turgor, <b>urine under 25 mL/hr</b>, <b>specific gravity over 1.030</b>, <b>↑Hct, Hgb, BUN, and sodium</b></td></tr>
    <tr><td><b>Severe — 8% weight loss</b></td><td>All of the above <b>plus</b> flushed skin, <b>systolic BP under 60</b>, <b>restlessness, irritability, disorientation</b>, metabolic acidosis</td></tr>
    <tr><td><b>Fatal — 20–30% weight loss</b></td><td>Anuria, lethargy progressing to coma, <b>absence of tearing or sweating</b>, hemoconcentration</td></tr>
  </table>
  <div class="hy"><span class="tag">Labs and treatment</span><b>Serum osmolality over 300</b>, specific gravity over 1.030, ↑Hct/Hgb/BUN, ↑Na. <b>0.9% NS or D5NS are the most common fluids for replacement</b> — may also see LR, but <b>not as an everyday maintenance fluid</b>. <b>Priority nursing diagnosis: deficient fluid volume.</b></div>
</div>

<div class="card" style="border-color:var(--blue)">
  <h3>Fluid Volume Overload</h3>
  <p class="why-chain"><b>Hypotonic in the plasma</b> — excess fluid dilutes the solute concentration.</p>
  <ul class="clean">
    <li><b>Causes:</b> <b>congestive heart failure</b>, too much IV fluid, excessive water intake, <b>kidney injury or failure</b>.</li>
    <li><b>Manifestations:</b> <b>pulmonary edema</b> (increased work of breathing, SOB, moist cough, moist crackles), <b>JVD</b>, bounding pulse, tachycardia, ↑BP, lethargy, cerebral edema, muscular cramping, <b>rapid weight gain — the best indication of fluid retention</b>, ↑CVP.</li>
    <li><b>Labs:</b> <b>serum osmolality under 270</b>, <b>↓sodium (dilutional hyponatremia)</b>, <b>↓serum protein, albumin, BUN, Hgb, and Hct from hemodilution</b>.</li>
    <li><b>Management:</b> <b>daily weight and strict I&amp;O</b>, fluid restriction, <b>low-sodium diet</b>, assess IV rate and whether it should be stopped, diuretics, safety.</li>
    <li><b>Albumin</b> may be given to replace protein and <b>pull volume back into the intravascular space</b>.</li>
  </ul>
  <div class="mnem"><div class="tag">The lab mirror</div><div class="big">Deficit CONCENTRATES the labs. Overload DILUTES them.</div><div class="exp">Deficit: ↑Hct, ↑BUN, ↑Na, osmolality over 300. Overload: ↓Hct, ↓BUN, ↓Na, osmolality under 270. Same labs, opposite directions.</div></div>
</div>

<div class="card">
  <h3>Fluid volume deficit vs. excess</h3>
  <table class="lab">
    <tr><th></th><th>Deficit (hypovolemia)</th><th>Excess (hypervolemia)</th></tr>
    <tr><td><b>Cause</b></td><td>Vomiting, diarrhea, hemorrhage, diuresis, third spacing, poor intake</td><td>Heart failure, kidney failure, cirrhosis, excess sodium or IV fluid</td></tr>
    <tr><td><b>Vitals</b></td><td>↑HR, ↓BP, orthostatic drop, weak thready pulse</td><td>Bounding pulse, ↑BP, ↑CVP</td></tr>
    <tr><td><b>Exam</b></td><td>Poor turgor, dry mucous membranes, flat neck veins, ↓urine output</td><td>Crackles, edema, JVD, dyspnea</td></tr>
    <tr><td><b>Labs</b></td><td>↑BUN:creatinine ratio, ↑hematocrit, ↑urine specific gravity</td><td>↓hematocrit and ↓BUN from dilution, ↓urine specific gravity</td></tr>
    <tr><td><b>Weight</b></td><td>Rapid loss</td><td>Rapid gain</td></tr>
    <tr><td><b>Treatment</b></td><td>Isotonic IV fluid, treat the cause, oral rehydration if tolerated</td><td>Diuretics, sodium and fluid restriction, daily weights, semi-Fowler</td></tr>
  </table>
  <div class="hy"><span class="tag">Best indicator</span><b>Daily weight on the same scale, same time, same clothing.</b> 1 kg ≈ 1 L. It beats intake and output because I&O misses insensible losses and charting gaps.</div>
</div>

<div class="card">
  <h3>Third spacing</h3>
  <p class="why-chain">Low albumin or a damaged capillary wall drops oncotic pressure → hydrostatic pressure wins → fluid leaves the vessel for the interstitium or a body cavity. The patient looks <b>edematous</b> and is simultaneously <b>intravascularly dry</b>.</p>
  <ul class="clean">
    <li>Seen in burns, sepsis, liver failure, hypoalbuminemia, major surgery, ascites.</li>
    <li>Watch the perfusion numbers, not the ankles: falling BP, rising heart rate, falling urine output.</li>
    <li>The fluid returns to the vasculature later — watch for <b>overload during the mobilization phase</b>.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>IV solutions by tonicity</h3>
  <table class="lab">
    <tr><th>Type</th><th>Examples</th><th>Where water goes</th><th>Used for / risk</th></tr>
    <tr><td><b>Isotonic</b></td><td>0.9% NS, lactated Ringer, D5W (in the bag)</td><td>Stays in the vessel</td><td>Hypovolemia, blood loss. Risk: fluid overload</td></tr>
    <tr><td><b>Hypotonic</b></td><td>0.45% NS, 0.33% NS, D5W (once dextrose is metabolized)</td><td>Moves INTO cells</td><td>Cellular dehydration, hypernatremia. Risk: <b>cerebral edema</b>, ↓BP</td></tr>
    <tr><td><b>Hypertonic</b></td><td>3% NS, 5% NS, D10W, D5NS, D5LR</td><td>Pulls water OUT of cells</td><td>Severe symptomatic hyponatremia, cerebral edema. Risk: overload, phlebitis</td></tr>
  </table>
  <ul class="clean">
    <li><b>D5W is isotonic in the bag and hypotonic in the patient.</b> Both descriptions are true and both appear as options.</li>
    <li><b>Lactated Ringer contains calcium and potassium.</b> Avoid in liver failure (can't metabolize lactate) and never hang it with blood.</li>
    <li><b>3% saline is high-alert.</b> Correct sodium slowly — too fast causes osmotic demyelination. Monitor lung sounds and neuro status.</li>
  </ul>
</div>

<div class="card">
  <h3>IV complications</h3>
  <table class="lab">
    <tr><th>Complication</th><th>Signs</th><th>Action</th></tr>
    <tr><td><b>Infiltration</b></td><td><b>Cool</b>, swollen, pale, taut; slowed rate</td><td>Stop, remove catheter, elevate, warm or cool compress per policy</td></tr>
    <tr><td><b>Extravasation</b></td><td>Same, but with a <b>vesicant</b> — tissue necrosis risk</td><td>Stop, leave catheter, aspirate residual, notify provider</td></tr>
    <tr><td><b>Phlebitis</b></td><td><b>Warm</b>, red, tender, palpable cord</td><td>Discontinue, restart in a new site, warm compress</td></tr>
    <tr><td><b>Fluid overload</b></td><td>Crackles, dyspnea, cough, JVD, ↑BP</td><td><b>Slow or stop</b>, raise the head of the bed, oxygen, notify provider</td></tr>
    <tr><td><b>Air embolism</b></td><td>Sudden dyspnea, chest pain, hypotension, altered LOC</td><td>Clamp the line, <b>left side with head down</b>, oxygen, notify provider</td></tr>
    <tr><td><b>Infection</b></td><td>Redness and drainage at the site, fever, chills</td><td>Discontinue, culture, aseptic technique on restart</td></tr>
  </table>
  <div class="mnem"><div class="tag">Cool vs warm</div><div class="big">Infiltration is COOL. Phlebitis is WARM.</div><div class="exp">That one word separates them in almost every stem he writes.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — hypotonic fluid to "replace water"</span>A hypotensive dehydrated patient with <b>0.45% saline</b> offered. It sounds like replacing water. It moves water into cells and drops the BP further. An <b>intravascular volume</b> problem takes <b>isotonic</b> fluid.</div>
  <div class="trap"><span class="tag">Trap 2 — edema read as overload</span>A swollen patient with a falling BP and rising heart rate. That is <b>third spacing</b>, so the vessel is dry. Diuresing them makes it worse.</div>
  <div class="trap"><span class="tag">Trap 3 — the "best indicator" question</span>Blood pressure, skin turgor, and urine color all appear and all are real assessments. <b>Daily weight</b> wins because it is the most reliable and quantifiable.</div>
  <div class="trap"><span class="tag">Trap 4 — the burning or aching IV site</span>"Slow the rate and continue" and "apply a warm compress" both sound caring. <b>Stop the infusion</b> and assess first.</div>
  <div class="trap"><span class="tag">Trap 5 — turgor in an older adult</span>Age-related loss of skin elasticity makes forearm turgor unreliable. Check the <b>sternum or forehead</b>, plus mucous membranes and urine concentration.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>Tonicity — and when NOT to use each</h3>
  <table class="lab">
    <tr><th>Type</th><th>Osmolality</th><th>Key points</th></tr>
    <tr><td><b>Hypotonic</b></td><td><b>&lt; 270</b></td><td>Seen in <b>NPO or post-surgical patients to help replace intracellular fluid losses</b> that occur during surgery or with malnutrition. <b>Do NOT give if hypotensive, ↑ICP, burn patient, liver dysfunction, or suspected head injury.</b> Continuous use causes <b>water intoxication</b>. Short-term, <b>on a pump</b></td></tr>
    <tr><td><b>Isotonic</b></td><td><b>270–300</b></td><td><b>Rehydration or replacement</b> — similar to plasma. <b>Normal saline contains Na⁺ and Cl⁻ and is the most similar to human plasma</b>; it <b>restores ECF volume and replaces sodium and chloride deficits</b>. <b>Lactated Ringer's is similar to the electrolyte concentration of plasma, secondary to NS</b>, and is given <b>following trauma or surgery</b></td></tr>
    <tr><td><b>Hypertonic</b></td><td><b>&gt; 300</b></td><td>Pulls water out of cells. <b>Constant use leads to dehydration.</b> <b>Most hypertonic fluids become hypotonic in the body</b> once the dextrose is metabolized — but <b>3% and 5% NS do not</b>, because there is no dextrose to metabolize. They stay hypertonic, which is why they are the ones used to pull water out of a swollen brain</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Why dextrose confuses everyone</div><div class="big">Dextrose provides calories, then metabolizes and disappears.</div><div class="exp"><b>Why use it?</b> It <b>provides energy (calories) and assists with protein breakdown</b>. When part of an IV solution it <b>metabolizes quickly and disappears</b>. So a dextrose solution starts <b>hypertonic in the bag</b> and ends up <b>isotonic or hypotonic in the patient</b>. Both descriptions are true, and he offers both.</div></div>
</div>

<div class="card">
  <h3>The solutions, one by one</h3>
  <table class="lab">
    <tr><th>Solution</th><th>Type</th><th>Uses</th><th>Nursing implications</th></tr>
    <tr><td><b>½NS (0.45% NS)</b></td><td>Hypotonic</td><td>Establishing renal function, replacement therapy</td><td>Use with caution. May cause <b>cardiovascular collapse or ↑ICP</b>. <b>Not with liver disease, trauma, or burns</b></td></tr>
    <tr><td><b>D5W</b></td><td>Hypotonic <i>(in the body)</i></td><td>Free water source, fluid loss and dehydration, <b>hypernatremia</b></td><td>Caution in renal and cardiac patients. Monitor for <b>fluid overload</b> — crackles, edema</td></tr>
    <tr><td><b>0.9% NS</b></td><td>Isotonic</td><td>Rehydration or replacement, <b>blood transfusions</b></td><td>Monitor for fluid overload</td></tr>
    <tr><td><b>LR</b></td><td>Isotonic</td><td>Following <b>trauma or surgery</b>, acute blood loss</td><td><b>Not for everyday maintenance.</b> Avoid with renal or liver dysfunction, burns, metabolic alkalosis, hyperkalemia, hyperlactemia</td></tr>
    <tr><td><b>3% NS</b> <span class="pill">high alert</span></td><td>Hypertonic</td><td><b>Severe symptomatic hyponatremia</b> and <b>cerebral edema / ↑ICP</b>. Pulls water out of swollen cells and back into the vessel</td><td><b>Correct the sodium SLOWLY</b> — too fast causes <b>osmotic demyelination</b>. On a <b>pump</b>, in a monitored setting. Recheck <b>sodium every 4–6 hours</b>, monitor <b>neuro status and lung sounds</b>. Watch for fluid overload and phlebitis</td></tr>
    <tr><td><b>D5½NS</b></td><td>Hypertonic</td><td>Hydration, fluid volume deficits, pre/post-surgical, NPO, <b>DKA once glucose hits a certain range</b></td><td>Avoid in hypotension. In DKA, <b>use only when blood glucose falls below 250 mg/dL</b> to avoid rapid overcorrection</td></tr>
    <tr><td><b>D5NS</b></td><td>Hypertonic</td><td>Replacement of fluid and calories</td><td><b>Avoid in cardiac or renal patients</b></td></tr>
    <tr><td><b>D10W</b></td><td>Hypertonic</td><td>Water replacement — pulls water out of cells into the intravascular space</td><td><b>Monitor blood glucose</b></td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>💧 Fluid of choice by situation</h3>
  <table class="lab">
    <tr><th>Situation</th><th>Fluid</th><th>Why</th></tr>
    <tr><td><b>Head injury</b></td><td><b>0.9% NS</b></td><td>Prevents increased ICP and maintains cerebral perfusion. <b>Never hypotonic</b> — water into brain cells worsens edema</td></tr>
    <tr><td><b>Vomiting</b></td><td><b>0.9% NS</b></td><td>Maintains hydration and electrolyte balance, replaces losses</td></tr>
    <tr><td><b>Diarrhea</b></td><td><b>0.9% NS</b></td><td>Replaces fluid and electrolytes; restores sodium, chloride, and fluid balance</td></tr>
    <tr><td><b>Dehydration</b></td><td><b>0.9% NS or lactated Ringer</b></td><td>Replaces fluids and electrolytes, restores circulating volume</td></tr>
    <tr><td><b>Burns</b></td><td><b>Lactated Ringer</b></td><td>Fluid resuscitation by the <b>Parkland formula</b>; helps restore perfusion and correct metabolic acidosis</td></tr>
    <tr><td><b>DKA</b></td><td><b>0.9% NS initially</b></td><td>Expands intravascular volume first. Later fluids depend on the <b>sodium level and glucose</b></td></tr>
    <tr><td><b>Blood transfusion</b></td><td><b>ONLY 0.9% NS</b></td><td>Given with blood to <b>prevent hemolysis</b>. <b>Never dextrose</b> — it lyses red cells. Never LR — its calcium promotes clotting</td></tr>
    <tr><td><b>Severe symptomatic hyponatremia / cerebral edema</b></td><td><b>3% NS</b></td><td>Hypertonic saline pulls water <b>out of swollen cells</b>. <b>Raise the sodium slowly</b> — rapid correction causes osmotic demyelination</td></tr>
    <tr><td><b>Liver failure</b></td><td><b>D5W</b></td><td>Provides calories and prevents hypoglycemia; used for free water replacement</td></tr>
    <tr><td><b>Hypoglycemia</b></td><td><b>D50W or D5W</b></td><td>Rapidly raises glucose. <b>D50W for severe</b> hypoglycemia</td></tr>
  </table>
  <div class="mnem"><div class="tag">The pattern</div><div class="big">When in doubt for volume loss — isotonic. 0.9% NS covers most of this table.</div><div class="exp">The exceptions worth memorizing: <b>burns → LR</b>, <b>liver failure → D5W</b>, <b>hypoglycemia → dextrose</b>, and <b>blood → NS only</b>.</div></div>
  <div class="trap"><span class="tag">Three traps in this table</span><b>0.</b> <b>3% NS is the one hypertonic that is NOT a dextrose solution</b> — so it does not become hypotonic in the body. It is also <b>high alert</b>: correct the sodium slowly or you cause osmotic demyelination. <b>1.</b> Hypotonic fluid in a head injury — water enters brain cells and raises ICP. <b>2.</b> Any dextrose solution hung with blood — hemolysis. <b>3.</b> LR in <b>liver failure</b>, because a failing liver cannot metabolize lactate. LR is the burn answer, not the liver answer.</div>
</div>

<div id="q-fluids"></div>`;
renderFilteredQuiz('q-fluids', secQ(EXAM.filter(q=>q.topic==='fluids')), 'Fluids & IV practice', 'Fluids');


document.getElementById('sec-lytes').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">⚡</span> Electrolytes</h2>
<p class="intro-line">Chapter 10, second half. Learn the normal range, the ECG or neuro sign, and the one intervention that kills if you get it wrong.</p>

<div class="card" style="border-color:var(--teal)">
  <h3>Normal ranges — memorize these cold</h3>
  <table class="lab">
    <tr><th>Electrolyte</th><th>Normal range</th></tr>
    <tr><td><b>Sodium</b></td><td>135 – 145 mEq/L</td></tr>
    <tr><td><b>Potassium</b></td><td>3.5 – 5.0 mEq/L</td></tr>
    <tr><td><b>Calcium (total)</b></td><td>8.6 – 10.2 mg/dL</td></tr>
    <tr><td><b>Magnesium</b></td><td>1.3 – 2.3 mg/dL</td></tr>
    <tr><td><b>Phosphorus</b></td><td>2.5 – 4.5 mg/dL</td></tr>
    <tr><td><b>Chloride</b></td><td>97 – 107 mEq/L</td></tr>
  </table>
</div>

<div class="card">
  <h3>Sodium — the water electrolyte</h3>
  <table class="lab">
    <tr><th></th><th>Hyponatremia (&lt;135)</th><th>Hypernatremia (&gt;145)</th></tr>
    <tr><td><b>Causes</b></td><td>Vomiting, diarrhea, diuretics, SIADH, excess water intake, adrenal insufficiency</td><td>Water loss, poor intake, diabetes insipidus, hypertonic feeds, excess sodium</td></tr>
    <tr><td><b>Cells</b></td><td>Water moves IN → cells <b>swell</b></td><td>Water moves OUT → cells <b>shrink</b></td></tr>
    <tr><td><b>Signs</b></td><td>Headache, confusion, lethargy, muscle cramps, <b>seizures from cerebral edema</b></td><td><b>Intense thirst</b>, dry sticky mucous membranes, restlessness, weakness, seizures if severe</td></tr>
    <tr><td><b>Treatment</b></td><td>Fluid restriction; hypertonic saline only if severe and symptomatic, corrected <b>slowly</b></td><td>Hypotonic fluid or D5W slowly, free water, treat the cause</td></tr>
  </table>
  <div class="trap"><span class="tag">Why "slowly" matters both ways</span>Correcting sodium too fast causes <b>osmotic demyelination</b> going up and <b>cerebral edema</b> coming down. "Rapidly normalize the sodium" is never the answer.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>Potassium — the one that kills</h3>
  <table class="lab">
    <tr><th></th><th>Hypokalemia (&lt;3.5)</th><th>Hyperkalemia (&gt;5.0)</th></tr>
    <tr><td><b>Causes</b></td><td>Diuretics, vomiting, NG suction, diarrhea, insulin, alkalosis, poor intake</td><td>Kidney failure, ACE inhibitors/ARBs, spironolactone, acidosis, cell lysis, over-replacement</td></tr>
    <tr><td><b>ECG</b></td><td><b>Flat T waves, U wave</b>, ST depression</td><td><b>Peaked narrow T waves</b> → widened QRS → asystole</td></tr>
    <tr><td><b>Other signs</b></td><td>Muscle weakness, leg cramps, <b>ileus</b>, shallow respirations, digoxin toxicity risk</td><td>Muscle weakness, paresthesias, <b>abdominal cramping and diarrhea</b>, dysrhythmias</td></tr>
    <tr><td><b>Treatment</b></td><td>Oral or diluted IV potassium <b>on a pump</b>; replace <b>magnesium</b> too; potassium-rich foods</td><td><b>Calcium gluconate</b> → insulin+dextrose and albuterol → kayexalate or dialysis</td></tr>
  </table>
  <div class="mnem"><div class="tag">Hyperkalemia sequence</div><div class="big">PROTECT → SHIFT → REMOVE</div><div class="exp">Calcium gluconate protects the myocardium. Insulin/dextrose and albuterol shift K into cells. Kayexalate or dialysis actually removes it.</div></div>
  <div class="trap"><span class="tag">Never</span><b>IV push potassium is fatal.</b> Always dilute and infuse on a pump. Never give it to a patient with no urine output. Never exceed the ordered rate to "catch up."</div>
  <div class="hy"><span class="tag">Potassium-rich foods</span>Banana, spinach, potato, avocado, orange, tomato, cantaloupe, dried fruit, legumes.</div>
</div>

<div class="card">
  <h3>Calcium — the nerve stabilizer</h3>
  <table class="lab">
    <tr><th></th><th>Hypocalcemia (&lt;8.6)</th><th>Hypercalcemia (&gt;10.2)</th></tr>
    <tr><td><b>Causes</b></td><td>Thyroid/parathyroid surgery, vitamin D deficiency, pancreatitis, massive transfusion, alkalosis</td><td>Malignancy with bone metastasis, hyperparathyroidism, immobility, thiazides, excess vitamin D</td></tr>
    <tr><td><b>Direction</b></td><td>Things <b>FIRE</b></td><td>Things <b>SLOW DOWN</b></td></tr>
    <tr><td><b>Signs</b></td><td><b>Chvostek</b> (tap the facial nerve, cheek twitches), <b>Trousseau</b> (BP cuff, hand spasms), perioral tingling, tetany, <b>laryngospasm</b>, seizures</td><td>Lethargy, confusion, <b>constipation</b>, muscle weakness, bone pain, kidney stones, polyuria</td></tr>
    <tr><td><b>Treatment</b></td><td>Calcium gluconate IV for severe; oral calcium with vitamin D; <b>seizure and airway precautions</b></td><td><b>Isotonic saline</b> to promote urinary excretion, then a <b>bisphosphonate</b>; mobilize; increase fluids</td></tr>
  </table>
  <div class="mnem"><div class="tag">Keep them straight</div><div class="big">LOW calcium = things fire. HIGH calcium = things slow.</div><div class="exp">"Stones, bones, groans, and psychiatric overtones" is the HIGH side.</div></div>
</div>

<div class="card">
  <h3>Magnesium and phosphorus</h3>
  <table class="lab">
    <tr><th></th><th>Low</th><th>High</th></tr>
    <tr><td><b>Magnesium</b></td><td>Alcohol use, malabsorption, diuretics. Signs mirror <b>hypocalcemia</b>: tremor, tetany, positive Chvostek/Trousseau, dysrhythmias. Give IV magnesium slowly.</td><td>Kidney failure, magnesium-containing antacids/laxatives. <b>Loss of deep tendon reflexes</b>, hypotension, bradycardia, respiratory depression. Antidote: <b>calcium gluconate</b>.</td></tr>
    <tr><td><b>Phosphorus</b></td><td>Refeeding syndrome, alcohol use, antacids. Muscle weakness, confusion, respiratory failure.</td><td>Kidney failure, tumor lysis. Symptoms are mostly from the resulting <b>hypocalcemia</b>. Phosphate binders with meals.</td></tr>
  </table>
  <div class="hy"><span class="tag">The pairings that get tested</span><b>Calcium and phosphorus move opposite.</b> <b>Magnesium and calcium move together</b> in their signs. And <b>you cannot correct hypokalemia until magnesium is replaced</b>, because magnesium is required for the cell to hold potassium.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the hyperkalemia order</span>All four options are real hyperkalemia treatments. The question is the <b>sequence</b>. Calcium gluconate first, because it protects the heart while the other drugs take time to work.</div>
  <div class="trap"><span class="tag">Trap 2 — the calcium lists swapped</span>Hypocalcemia stems offered with "constipation, kidney stones, lethargy." That is the <b>hyper</b> list. Low calcium fires: tetany, tingling, laryngospasm, seizures.</div>
  <div class="trap"><span class="tag">Trap 3 — the stubborn potassium</span>A hypokalemia that will not correct despite replacement. The answer is not more potassium, it is <b>replacing magnesium first</b>.</div>
  <div class="trap"><span class="tag">Trap 4 — potassium and urine output</span>Any option giving potassium to a patient with poor urine output is wrong, no matter how low the level is. Check the output first.</div>
  <div class="trap"><span class="tag">Trap 5 — priority among four abnormal labs</span>He gives you four out-of-range electrolytes. Rank by <b>what kills fastest</b>: potassium (dysrhythmia) and calcium (laryngospasm) beat sodium drift and phosphorus every time.</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⚡ Electrolyte imbalance symptoms at a glance</h3>
  <table class="lab">
    <tr><th>Electrolyte</th><th>HYPO ↓</th><th>HYPER ↑</th></tr>
    <tr><td><b>Na⁺</b></td><td>Headaches, confusion, nausea · disrupted attention, disordered speech, <b>hallucinations</b> · <b>osmotic demyelination and cerebral edema</b></td><td><b>Agitation, unable to rest or sleep</b> · tachycardia or tachypnea</td></tr>
    <tr><td><b>K⁺</b></td><td>Weakness and cramping · <b>arrhythmias</b> · <b>constipation</b></td><td>Weakness and cramping · <b>arrhythmias</b> · <b>abdominal pain or diarrhea</b></td></tr>
    <tr><td><b>Ca²⁺</b></td><td>Weakness, nausea, cramping · <b>Trousseau sign</b> (BP cuff → hand spasm) · <b>Chvostek sign</b> (tap the cheek → twitch)</td><td>Weakness, nausea, <b>cramping</b></td></tr>
    <tr><td><b>Mg²⁺</b></td><td><b>Tremor or personality changes</b></td><td>Decreased consciousness, confusion, muscle weakness, <b>ABSENCE of reflexes</b></td></tr>
    <tr><td><b>PO₄³⁻</b></td><td>Muscle cramps, weakness, numbness · <b>↓bone density</b></td><td>Muscle cramps, weakness, numbness · <b>↓bone density</b></td></tr>
    <tr><td><b>Cl⁻</b></td><td><b>Lack of symptoms</b> · extreme: confusion and swelling</td><td><b>Lack of symptoms</b> · extreme: confusion and swelling</td></tr>
    <tr><td><b>HCO₃⁻</b></td><td>Headaches, fatigue, acid-base imbalance symptoms</td><td>Headaches, fatigue, acid-base imbalance symptoms</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The pairing he tests</div><div class="big">Hypomagnesemia is associated with hypokalemia.</div><div class="exp">A potassium that will not correct despite replacement usually means the <b>magnesium is low</b>. Magnesium is required for the cell to hold onto potassium — replace it first.</div></div>
  <div class="trap"><span class="tag">⭐ Magnesium and reflexes — get the direction right</span><b>LOW magnesium → HYPERreflexia.</b> Nerves fire too easily: tremor, tetany, positive Chvostek and Trousseau, seizures — the same picture as low calcium. <b>HIGH magnesium → LOSS of deep tendon reflexes</b>, and that absence is the <b>first sign</b>, followed by hypotension, bradycardia, and respiratory depression. Antidote for magnesium toxicity is <b>calcium gluconate</b>.</div>
  <div class="trap"><span class="tag">Two directions worth noticing</span><b>Potassium looks similar high and low</b> — weakness, cramping, arrhythmias either way. The GI clue separates them: <b>low K constipates, high K causes abdominal pain and diarrhea</b>. And <b>hypermagnesemia is defined by the ABSENCE of reflexes</b>, which is the first thing you check.</div>
</div>

<div id="q-lytes"></div>`;

document.getElementById('sec-abg').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🫁</span> Acid-Base & ABGs</h2>
<p class="intro-line">Chapter 10, final section. Three numbers, one rule, and you can name any gas he writes.</p>

<div class="card" style="border-color:var(--teal)">
  <h3>The three numbers</h3>
  <table class="lab">
    <tr><th>Value</th><th>Normal</th><th>Controlled by</th></tr>
    <tr><td><b>pH</b></td><td>7.35 – 7.45</td><td>The net result</td></tr>
    <tr><td><b>PaCO₂</b> (the acid)</td><td>35 – 45 mmHg</td><td><b>Lungs</b> — minutes</td></tr>
    <tr><td><b>HCO₃</b> (the base)</td><td>22 – 26 mEq/L</td><td><b>Kidneys</b> — hours to days</td></tr>
    <tr><td>PaO₂</td><td>80 – 100 mmHg</td><td>Oxygenation, not acid-base</td></tr>
  </table>
  <div class="mnem"><div class="tag">The whole method</div><div class="big">ROME — Respiratory Opposite, Metabolic Equal</div><div class="exp">pH and CO₂ moving in <b>opposite</b> directions = respiratory. pH and bicarb moving in the <b>same</b> direction = metabolic.</div></div>
  <div class="mnem" style="border-color:var(--gold)"><div class="tag">⭐ He asks this out loud</div><div class="big">Kidney problem → automatically METABOLIC. Lung problem → automatically RESPIRATORY.</div><div class="exp">The kidneys own bicarbonate and the lungs own CO₂. Name the broken organ and you have already named half the gas.</div></div>
</div>

<div class="card" style="border-color:var(--gold)">
  <h3>⭐ The organ shortcut</h3>
  <p class="why-chain">If the stem tells you which organ is failing, you do not have to derive the type — the organ names it. <b>Kidneys regulate bicarbonate (the base), so a kidney problem is metabolic. Lungs regulate CO₂ (the acid), so a lung problem is respiratory.</b></p>
  <ol class="chainlist">
    <li><b>1.</b> Healthy kidneys excrete hydrogen ions and regenerate bicarbonate, which is how the body dumps fixed acid.</li>
    <li><b>2.</b> In kidney failure both jobs stop. Acid accumulates and bicarbonate falls.</li>
    <li><b>3.</b> pH down + bicarb down = same direction = <b>metabolic acidosis</b>. That is the default gas for a renal patient.</li>
    <li><b>4.</b> The kidneys are also the <b>compensator</b> for respiratory problems. If they are failing, they cannot compensate — so expect an <b>uncompensated or only partially compensated</b> respiratory gas in a patient with renal disease.</li>
    <li><b>5.</b> And renal metabolic acidosis travels with <b>hyperkalemia</b>: acidosis shifts potassium out of cells, and the failing kidney cannot excrete it either. Low pH in a renal patient → check the potassium and the ECG.</li>
  </ol>
  <div class="hy"><span class="tag">Same logic, other direction</span>Chronic <b>lung</b> disease → respiratory acidosis, and the healthy kidney compensates by retaining bicarbonate over days. That is why a stable COPD gas reads <b>fully compensated respiratory acidosis</b> — pH normal on the acid side, CO₂ high, bicarb high.</div>
  <div class="trap"><span class="tag">Where he turns the screw</span>A dialysis or CKD patient with a low pH and options offering respiratory causes. The organ already told you the answer. Equally, do not force "metabolic" onto a patient whose only problem is hypoventilation — the shortcut runs organ → type, not backwards.</div>
</div>

<div class="card">
  <h3>Read it in three steps</h3>
  <ul class="clean">
    <li><b>0. Check whether the stem names a failing organ.</b> Kidneys = metabolic. Lungs = respiratory. If it does, you already know the type.</li>
    <li><b>1. Look at the pH.</b> Below 7.35 = acidosis. Above 7.45 = alkalosis. If it is 7.35–7.45, it is normal or fully compensated.</li>
    <li><b>2. Find the culprit.</b> Which value moved the way that explains the pH? CO₂ opposite = respiratory. Bicarb same = metabolic.</li>
    <li><b>3. Check compensation.</b> pH abnormal + one value abnormal = <b>uncompensated</b>. pH abnormal + both abnormal = <b>partially compensated</b>. pH <b>normal</b> + both abnormal = <b>fully compensated</b>.</li>
  </ul>
  <div class="hy"><span class="tag">Which side of normal</span>In full compensation the pH tells you the original problem. <b>7.35–7.39 = the acid side.</b> <b>7.41–7.45 = the alkalotic side.</b> That is how you name a gas whose pH looks normal.</div>
</div>

<div class="card">
  <h3>Causes by type</h3>
  <table class="lab">
    <tr><th>Disorder</th><th>Causes</th><th>Signs</th></tr>
    <tr><td><b>Respiratory acidosis</b><br>↓pH ↑CO₂</td><td>Anything that retains CO₂: COPD, oversedation, opioid overdose, atelectasis, pneumonia, chest trauma, neuromuscular weakness</td><td>Drowsiness, headache, confusion, ↑HR, dysrhythmias</td></tr>
    <tr><td><b>Respiratory alkalosis</b><br>↑pH ↓CO₂</td><td>Hyperventilation: anxiety, pain, fever, early PE, high altitude, over-ventilation</td><td>Lightheaded, <b>tingling of fingers and around the mouth</b>, dizziness, tetany</td></tr>
    <tr><td><b>Metabolic acidosis</b><br>↓pH ↓HCO₃</td><td>DKA, kidney failure, lactic acidosis from shock, prolonged diarrhea (loses bicarbonate)</td><td><b>Kussmaul respirations</b> (deep and rapid to blow off acid), headache, confusion, hyperkalemia</td></tr>
    <tr><td><b>Metabolic alkalosis</b><br>↑pH ↑HCO₃</td><td>Vomiting or NG suction (loses acid), excess antacids, diuretics, hypokalemia</td><td>Tingling, dizziness, <b>hypoventilation</b> to retain CO₂, hypokalemia</td></tr>
  </table>
</div>

<div class="card">
  <h3>Practice reading</h3>
  <table class="lab">
    <tr><th>pH</th><th>PaCO₂</th><th>HCO₃</th><th>Interpretation</th></tr>
    <tr><td>7.30</td><td>52</td><td>24</td><td>Uncompensated <b>respiratory acidosis</b></td></tr>
    <tr><td>7.49</td><td>40</td><td>30</td><td>Uncompensated <b>metabolic alkalosis</b></td></tr>
    <tr><td>7.25</td><td>36</td><td>16</td><td>Uncompensated <b>metabolic acidosis</b></td></tr>
    <tr><td>7.52</td><td>28</td><td>23</td><td>Uncompensated <b>respiratory alkalosis</b></td></tr>
    <tr><td>7.32</td><td>58</td><td>30</td><td>Partially compensated <b>respiratory acidosis</b></td></tr>
    <tr><td>7.37</td><td>58</td><td>32</td><td><b>Fully compensated respiratory acidosis</b> — classic chronic COPD</td></tr>
    <tr><td>7.43</td><td>30</td><td>20</td><td><b>Fully compensated respiratory alkalosis</b></td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — a normal pH that is not normal</span>Fully compensated means <b>pH normal, both systems abnormal</b>. Stop at the pH and you will call a chronic COPD gas "normal."</div>
  <div class="trap"><span class="tag">Trap 2 — which side of 7.40</span>In full compensation, 7.37 is the <b>acid</b> side and 7.43 is the <b>alkalotic</b> side. That single digit names the disorder.</div>
  <div class="trap"><span class="tag">Trap 3 — treating the number</span>"Give sodium bicarbonate" and "apply 100% oxygen" get offered as fixes. Treat the <b>cause</b>: ventilation, perfusion, or the metabolic problem driving it.</div>
  <div class="trap"><span class="tag">Trap 4 — vomiting vs diarrhea</span><b>Vomiting and NG suction lose acid</b> → metabolic <b>alkalosis</b>. <b>Diarrhea loses bicarbonate</b> → metabolic <b>acidosis</b>. He puts both in the same question.</div>
  <div class="trap"><span class="tag">Trap 5 — ignoring the organ he handed you</span>A renal failure or dialysis patient with an abnormal pH, and respiratory options mixed in. <b>Kidneys = metabolic.</b> He tells you the organ precisely so he can see who uses it.</div>
  <div class="trap"><span class="tag">Trap 6 — hyperventilation assumed to be anxiety</span>Respiratory alkalosis from hyperventilation can be anxiety, but it can also be an early <b>PE</b>, sepsis, or fever. Sedating that patient is how you miss the emergency.</div>
</div>

<div id="q-abg"></div>`;
renderFilteredQuiz('q-abg', secQ(EXAM.filter(q=>q.topic==='abg')), 'ABG practice', 'Acid-Base');

</script>
<script>
document.getElementById('sec-upper').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">👃</span> Upper Respiratory Tract Disorders</h2>
<p class="intro-line">Chapter 18. Everything above the trachea. This is the section that was missing from the old guide entirely.</p>

<div class="card">
  <h3>Infections and inflammation</h3>
  <table class="lab">
    <tr><th>Condition</th><th>Key features</th><th>Nursing focus</th></tr>
    <tr><td><b>Rhinitis</b></td><td>Allergic or viral. Sneezing, congestion, clear drainage, itchy eyes</td><td>Antihistamines, nasal steroids, allergen avoidance. <b>Rebound congestion</b> from decongestant sprays used over 3 days</td></tr>
    <tr><td><b>Acute rhinosinusitis</b></td><td>Facial pain and pressure, purulent drainage, congestion over 7-10 days</td><td>Most are viral. Antibiotics only if symptoms persist or worsen. Humidification, fluids, warm compresses</td></tr>
    <tr><td><b>Pharyngitis</b></td><td>Sore throat. Strep: sudden onset, fever, exudate, tender nodes, <b>no cough</b></td><td>Rapid strep test. Full antibiotic course prevents <b>rheumatic fever and glomerulonephritis</b>. Warm saline gargles</td></tr>
    <tr><td><b>Tonsillitis / adenoiditis</b></td><td>Sore throat, dysphagia, mouth breathing, snoring</td><td>Post-tonsillectomy: watch for <b>frequent swallowing</b> — the earliest sign of bleeding</td></tr>
    <tr><td><b>Peritonsillar abscess</b></td><td>Severe unilateral pain, "hot potato" voice, trismus, deviated uvula</td><td>Airway threat. Drainage plus antibiotics</td></tr>
    <tr><td><b>Laryngitis</b></td><td>Hoarseness or voice loss</td><td><b>Voice rest</b>, humidification, no whispering (it strains more than speaking)</td></tr>
  </table>
  <div class="hy"><span class="tag">Post-tonsillectomy priority</span><b>Frequent swallowing</b> is the earliest hemorrhage sign — blood trickling down the throat. Also restlessness and tachycardia. Avoid coughing, clearing the throat, straws, and red or brown fluids that mask blood.</div>
</div>

<div class="card">
  <h3>Epistaxis</h3>
  <ul class="clean">
    <li><b>Position:</b> sit up and lean <b>forward</b>, not back. Leaning back sends blood down the throat, causing aspiration and hiding the amount lost.</li>
    <li><b>Pressure:</b> pinch the <b>soft part of the nose</b> continuously for 5 to 10 minutes. Ice to the bridge.</li>
    <li>Persistent bleeding may need cautery or nasal packing. With packing, monitor for <b>airway obstruction and infection</b>.</li>
    <li>Afterward: no nose blowing, no straining, humidify the air, avoid aspirin and NSAIDs.</li>
  </ul>
  <div class="trap"><span class="tag">The classic wrong answer</span>"Tilt the head back." It is intuitive, it is what everyone was taught as a child, and it is the option he offers.</div>
</div>

<div class="card">
  <h3>Obstructive sleep apnea</h3>
  <ul class="clean">
    <li><b>Mechanism:</b> the pharyngeal muscles relax during sleep and the airway collapses repeatedly, causing apneic periods and desaturation.</li>
    <li><b>Signs:</b> loud snoring, witnessed apnea, morning headache, daytime sleepiness, irritability. Long term: hypertension, dysrhythmias, right heart failure.</li>
    <li><b>Risk factors:</b> obesity, thick neck, male sex, age, alcohol and sedatives at bedtime.</li>
    <li><b>Treatment:</b> weight loss, side-lying position, <b>CPAP</b> (the mainstay — adherence is the nursing issue), oral appliances, surgery.</li>
    <li><b>Perioperative red flag:</b> these patients are exquisitely sensitive to opioids and sedatives. Monitor closely after surgery.</li>
  </ul>
</div>

<div class="card">
  <h3>Laryngeal cancer</h3>
  <ul class="clean">
    <li><b>Earliest sign: hoarseness lasting more than 2 weeks.</b> That is the tested fact.</li>
    <li>Later: persistent sore throat, dysphagia, a lump in the neck, a change in voice quality.</li>
    <li><b>Risk factors:</b> smoking and alcohol, which are synergistic. Also HPV and chronic reflux.</li>
    <li><b>Post-laryngectomy:</b> the patient now breathes through a <b>permanent stoma</b> — no nose to warm, filter, or humidify air. Humidify, protect the stoma from water, and teach that they cannot swim.</li>
    <li>Communication plan is established <b>before</b> surgery: writing, board, electrolarynx, esophageal speech, or a tracheoesophageal puncture.</li>
    <li>Nutrition, body image, and smoking cessation are all core to the plan.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — head back for a nosebleed</span>Lean <b>forward</b>. Tilting back causes aspiration and hides blood loss.</div>
  <div class="trap"><span class="tag">Trap 2 — the quiet post-tonsillectomy child</span>Frequent <b>swallowing</b> is the earliest bleeding sign, not vomiting blood. A quiet swallowing patient is the emergency.</div>
  <div class="trap"><span class="tag">Trap 3 — hoarseness dismissed</span>Hoarseness over <b>2 weeks</b> is a laryngeal cancer warning, not laryngitis. "Rest the voice and recheck in a month" is the trap.</div>
  <div class="trap"><span class="tag">Trap 4 — the decongestant spray</span>Over 3 days causes <b>rebound congestion</b>, so the patient uses more and gets worse. Any teaching option allowing prolonged use is wrong.</div>
  <div class="trap"><span class="tag">Trap 5 — whispering to rest the voice</span>Whispering strains the vocal cords <b>more</b> than normal speech. True voice rest means not speaking.</div>
  <div class="trap"><span class="tag">Trap 6 — stopping strep antibiotics early</span>The full course prevents <b>rheumatic fever and glomerulonephritis</b>, not just symptom return.</div>
</div>

<div id="q-upper"></div>`;
