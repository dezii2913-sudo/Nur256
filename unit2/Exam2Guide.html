{topic:'lytes',hot:false,q:'A patient with chronic alcohol use disorder is admitted. The nurse anticipates a deficiency of which electrolyte that can cause torsades de pointes?',o:['Phosphorus','Magnesium','Chloride','Sodium'],c:1,t:'single',r:'Hypomagnesemia is common in alcohol use and predisposes to torsades de pointes.'},
{topic:'abg',hot:true,q:'A patient with metabolic alkalosis from vomiting is breathing slowly. Which statement BEST explains this?',o:['The lungs are slowing to RETAIN CO₂ and lower the pH','This is an abnormal, dangerous response that must be stopped','The patient is having a respiratory arrest','The kidneys are dumping bicarb'],c:0,t:'single',r:'Slow breathing here is compensation — retaining CO₂ (acid) to pull the alkalotic pH back down. The "BEST explains" framing rewards understanding the mechanism, not memorizing a fact.'},
{topic:'fluids',hot:true,q:'A patient with a traumatic head injury requires IV fluid. Which solution is appropriate?',o:['0.9% normal saline','0.45% normal saline','D5W','Sterile water'],c:0,t:'single',r:'<b>Isotonic 0.9% NS</b> maintains cerebral perfusion without shifting water into brain cells. <b>Hypotonic fluids and D5W (hypotonic once the dextrose is metabolized) worsen cerebral edema and raise ICP</b> \u2014 they are contraindicated in head injury.'},
{topic:'resp',hot:false,q:'Which are diagnostic criteria/hallmarks of acute respiratory failure? (Select all that apply)',o:['PaCO₂ greater than 50 mmHg','pH greater than 7.50','PaO₂ less than 60 mmHg','pH less than 7.35','SpO₂ of 99%'],c:[0,2,3],t:'multi',r:'ARF: PaO₂ under 60, PaCO₂ over 50, and pH under 7.35. SpO₂ 99% and alkalotic pH do not fit.'},
{topic:'resp',hot:false,q:'Clubbing of the fingers is a sign of:',o:['Dehydration','Acute infection','Hyperkalemia','Chronic hypoxia'],c:3,t:'single',r:'Clubbing reflects chronic hypoxia (lung/cardiac disease).'},
{topic:'abg',hot:false,q:'ABG: pH 7.50, PaCO₂ 30, HCO₃ 24. This represents:',o:['Respiratory acidosis','Respiratory alkalosis','Metabolic alkalosis','Metabolic acidosis'],c:1,t:'single',r:'High pH, low CO₂ (opposite) = respiratory alkalosis (hyperventilation/anxiety).'},
{topic:'pneumonia',hot:false,q:'The nurse plans care for a patient with pneumonia and lists "improved airway clearance" as a goal. Prioritizing this goal is part of which step?',o:['Assessment','Evaluation','Implementation','Planning'],c:3,t:'single',r:'Setting and prioritizing goals/outcomes is PLANNING. The interventions chosen to reach the goal (suction, CPT, fluids) are implementation.'},
{topic:'resp',hot:true,q:'All of the following are EARLY signs of hypoxia EXCEPT:',o:['Anxiety','Restlessness','Tachycardia','Cyanosis'],c:3,t:'single',r:'Trap: cyanosis "looks like" hypoxia so it feels right. But cyanosis is a LATE sign — the early ones are restlessness, anxiety, and tachycardia. The EXCEPT is asking for the one that doesn\'t fit "early."'},
{topic:'clinical',hot:true,q:'A post-op patient is restless and anxious with an O₂ sat of 93%. What should the nurse do FIRST?',o:['Document the anxiety as a normal post-op finding and continue','Call the provider to request a psychiatric consultation now','Reposition, encourage deep breathing, and reassess oxygenation','Administer the PRN sedative that is ordered for anxiety'],c:2,t:'single',r:'Restlessness and anxiety are EARLY signs of hypoxia — treat the oxygenation, not the "anxiety." Sedating a hypoxic patient is dangerous. Reposition, promote lung expansion, and reassess.'},
{topic:'pneumonia',hot:true,q:'TREATMENT — Which is the priority nursing intervention to prevent and treat atelectasis?',o:['Chest physiotherapy postponed until the fever resolves','Incentive spirometry, coughing, and early ambulation','Fluid restriction with humidified oxygen by face mask','Strict bed rest with the head of the bed kept flat'],c:1,t:'single',r:'Lung-expansion measures (IS with a 3-second hold, coughing/deep breathing, ambulation) reopen alveoli. Pain control matters so the patient CAN breathe deeply.'},
{topic:'airway',hot:true,q:'A nurse must give morning meds, hang a new IV bag, ambulate a patient, and respond to a vent alarm. Which does the nurse address FIRST?',o:['Ambulation','Hanging the IV bag','Morning meds','The ventilator alarm'],c:3,t:'single',r:'A ventilator alarm is an airway/breathing issue and takes priority over routine tasks. ABCs first — always rule out a true emergency (disconnection, obstruction, distress) before scheduled care.'},
{topic:'lytes',hot:true,q:'Which food choice is BEST for a patient who needs to increase potassium?',o:['Banana and spinach','Egg whites and toast','White rice and pasta','Cheese and yogurt'],c:0,t:'single',r:'Bananas and leafy greens are potassium-rich. Useful for patients on potassium-wasting diuretics.'},
{topic:'abg',hot:false,q:'After teaching, the nurse asks the patient to demonstrate using the incentive spirometer correctly. This "teach-back" is which step?',o:['Assessment','Planning','Evaluation','Implementation'],c:2,t:'single',r:'Checking whether teaching was effective (can the patient do it right?) is EVALUATION. The teaching itself was implementation; the return-demonstration evaluates the outcome.'},
{topic:'blood',hot:true,q:'Which is the BEST nursing response when a transfusion reaction is suspected?',o:['Stop the blood, keep NS running, and notify the provider','Document the findings and reassess in about 30 minutes','Slow the transfusion and keep watching for more symptoms','Give acetaminophen and continue the unit as prescribed'],c:0,t:'single',r:'Slowing it down (A) is the tempting "partial" answer, but the BEST/safest action is to STOP the blood entirely while maintaining IV access with NS, then notify. Don\'t keep infusing a possible reaction.'},
{topic:'copd',hot:false,q:'A patient using an inhaled corticosteroid should be taught to:',o:['Use it before the bronchodilator','Rinse the mouth after use','Hold breath for 30 seconds','Use it for acute attacks'],c:1,t:'single',r:'Rinse the mouth to prevent oral candidiasis (thrush). Bronchodilator goes first, steroid second.'},
{topic:'fluids',hot:true,q:'A patient with severe hyponatremia (Na 118) and seizure activity is prescribed 3% saline. Which is the priority nursing assessment during infusion?',o:['Pupil size and reactivity to light every hour','Lung sounds for signs of fluid overload','Blood glucose before and after the infusion','Bowel sounds in all four abdominal quadrants'],c:1,t:'single',r:'3% saline is <b>hypertonic</b> — it pulls water into the vasculature and can rapidly cause <b>fluid overload and pulmonary edema</b>. Monitor lung sounds closely and infuse slowly.'},
{topic:'resp',hot:false,q:'Which finding is a LATE sign of hypoxia?',o:['Anxiety','Restlessness','Tachycardia','Central cyanosis'],c:3,t:'single',r:'<b>Cyanosis is a LATE sign.</b> The earliest signs of hypoxia are restlessness, anxiety, and tachycardia — those come first and are your chance to intervene early.'},
{topic:'lytes',hot:false,q:'A nurse reassesses a patient\'s potassium level after treating hyperkalemia to see if it dropped. This is which step?',o:['Assessment','Planning','Evaluation','Implementation'],c:2,t:'single',r:'Checking a result against the expected outcome after an intervention is EVALUATION. The trap is that it "looks like" assessment — but its purpose is judging effectiveness.'},
{topic:'lytes',hot:false,q:'Which interventions are correct for hyperkalemia? (Select all that apply)',o:['Sodium bicarbonate','Calcium gluconate','Salt substitutes','Insulin with dextrose','Dialysis if severe'],c:[0,1,3,4],t:'multi',r:'Insulin+dextrose drives K into cells, calcium protects the heart, bicarb shifts K, dialysis removes it. Salt substitutes CONTAIN potassium — avoid.'},
{topic:'copd',hot:false,q:'The target oxygen saturation for most patients with COPD is:',o:['100%','95-100%','Below 85%','88-92%'],c:3,t:'single',r:'In COPD, aim for 88-92% to avoid blunting the hypoxic drive while still oxygenating.'},
{topic:'tb',hot:false,q:'A positive PPD (Mantoux) is read by measuring?',o:['Induration','Redness','The wheal size','Warmth'],c:0,t:'single',r:'Measure induration (raised hardened area) at 48-72 hours.'},
{topic:'fluids',hot:true,q:'What is the normal range for serum osmolality?',o:['270 to 300 mOsm/kg','3.5 to 5.0 mOsm/kg','350 to 400 mOsm/kg','135 to 145 mOsm/kg'],c:0,t:'single',r:'<b>270 to 300 mOsm/kg.</b> Below 270 is hypo-osmolar and suggests <b>fluid overload with dilution</b>. Above 300 is hyper-osmolar and suggests <b>fluid volume deficit with concentration</b>.'},
{topic:'lytes',hot:false,q:'A nurse is about to hang blood and sees the only available IV fluid running is D5½NS. What should the nurse do?',o:['Use lactated Ringer\'s instead','Use the D5½NS to prime the line','Obtain 0.9% normal saline','Run the blood without any priming fluid'],c:2,t:'single',r:'Only 0.9% normal saline is hung with blood. Dextrose solutions hemolyze RBCs and LR\'s calcium can promote clotting. Get NS before proceeding.'},
{topic:'upper',hot:true,q:'Which findings in a patient with obstructive sleep apnea should the nurse expect? Select all that apply.',o:['Bradycardia during the day','Excessive daytime sleepiness','Weight loss over recent months','Loud snoring with witnessed apneic periods','Morning headache','Difficulty staying asleep at night'],c:[1,3,4,5],t:'multi',r:'Repeated airway collapse causes <b>snoring, apnea, fragmented sleep, morning headache from CO2 retention, and daytime sleepiness</b>. Untreated OSA leads to hypertension and dysrhythmias, not daytime bradycardia. Obesity is a risk factor, so weight gain is more typical than loss.'},
{topic:'pneumonia',hot:false,q:'Which interventions are part of the ventilator-associated pneumonia (VAP) bundle? (Select all that apply)',o:['Keep the patient flat','DVT and peptic ulcer prophylaxis','Daily sedation interruption/readiness to wean','Oral care with chlorhexidine','Elevate head of bed 30-45 degrees'],c:[1,2,3,4],t:'multi',r:'VAP bundle: HOB elevated, daily sedation vacation/wean assessment, oral chlorhexidine care, and DVT/PUD prophylaxis. Keeping flat increases aspiration risk.'},
{topic:'lytes',hot:false,q:'Which assessment finding indicates hypernatremia?',o:['Seizures caused by cerebral swelling','Peaked T waves on the cardiac monitor','Carpopedal spasm on cuff inflation','Intense thirst with dry mucous membranes'],c:3,t:'single',r:'Hypernatremia draws water out of cells → thirst, dry membranes, agitation.'},
{topic:'resp',hot:true,q:'Which breath sound is considered a medical EMERGENCY requiring immediate attention?',o:['Crackles','Stridor','Rhonchi','Wheezes'],c:1,t:'single',r:'<b>Stridor</b> signals upper-airway obstruction — a true emergency (anaphylaxis, foreign body, severe croup). Act on the airway immediately.'},
{topic:'lytes',hot:false,q:'Which signs are associated with HYPOcalcemia? (Select all that apply)',o:['Positive Trousseau sign','Positive Chvostek sign','Muscle twitching','Numbness/tingling around the mouth','Constipation and kidney stones'],c:[0,1,2,3],t:'multi',r:'Hypocalcemia = increased excitability: Trousseau, Chvostek, perioral tingling, twitching, tetany. Stones/constipation are HYPERcalcemia.'},
{topic:'pneumonia',hot:false,q:'Which assessment finding in a patient with pneumonia would the nurse report to the provider IMMEDIATELY?',o:['A productive cough bringing up thick yellow-green sputum','A weak, thready, rapid pulse with a falling blood pressure','Fatigue and mild dyspnea after ambulating in the hallway','A temperature of 100.6 degrees on the second hospital day'],c:1,t:'single',r:'A weak, thready, fast pulse with hypotension signals septic shock — a life-threatening complication of pneumonia. Report immediately. The other findings are expected with pneumonia.'},
{topic:'upper',hot:true,q:'A patient has an active nosebleed. Which position should the nurse use?',o:['Lying flat with the head turned to one side','Sitting upright leaning forward','Trendelenburg with the head lowered','Sitting upright with the head tilted back'],c:1,t:'single',r:'<b>Upright and leaning forward</b> lets blood drain out of the nose rather than down the throat. Tilting back causes swallowing of blood, nausea, aspiration risk, and hides how much has been lost.'},
{topic:'fluids',hot:true,q:'CAUSE — Fluid volume deficit is BEST described as resulting from:',o:['Excess dietary sodium pulling water into the vascular space','Too much IV fluid infused faster than the kidneys clear it','Fluid retention from heart failure backing up into tissue','Loss of fluid from vomiting, diarrhea, or poor intake'],c:3,t:'single',r:'Deficit = loss or inadequate intake. That cause explains the manifestations (↑HR, ↓BP, concentrated urine) and the treatment (isotonic fluids).'},
{topic:'airway',hot:false,q:'Which nursing actions are appropriate for a patient on a ventilator to prevent VAP? (Select all that apply)',o:['Keep the patient flat to promote rest','Keep the head of the bed at 30–45 degrees','Daily "sedation vacation" / readiness-to-wean assessment','Provide DVT and peptic ulcer prophylaxis','Perform oral care with chlorhexidine'],c:[1,2,3,4],t:'multi',r:'The VAP bundle: HOB elevated, chlorhexidine oral care, daily sedation interruption with wean assessment, and DVT/PUD prophylaxis. Lying flat raises aspiration risk and is wrong.'},
{topic:'copd',hot:false,q:'A patient in status asthmaticus suddenly has a "silent chest" with no audible wheezing. This indicates:',o:['A good response to the bronchodilator that was just given','The attack is resolving and the airways are opening up','Severe airway obstruction and impending respiratory failure','A developing pneumothorax on the affected side of the chest'],c:2,t:'single',r:'A silent chest means almost no air movement — an emergency sign of impending respiratory failure, not improvement.'},
{topic:'lytes',hot:false,q:'Which is the only IV fluid compatible with blood?',o:['D5W','0.9% NS','LR','0.45% NS'],c:1,t:'single',r:'Only 0.9% Normal Saline — LR has calcium (clots), dextrose hemolyzes RBCs.'},
{topic:'tb',hot:false,q:'Which precautions are required for a patient with active pulmonary TB? (Select all that apply)',o:['N95 respirator for staff','Door kept open for ventilation','Standard precautions only','Negative-pressure room','Surgical mask on patient during transport'],c:[0,3,4],t:'multi',r:'TB requires <b>airborne precautions</b>: negative-pressure room (door CLOSED), N95 for staff, and a surgical mask on the patient if transported. Standard precautions alone are insufficient.'},
{topic:'lytes',hot:true,q:'Which is the priority for a patient with potassium of 6.9?',o:['Restrict fluids','Prepare calcium gluconate','Encourage bananas','Give a potassium supplement'],c:1,t:'single',r:'Calcium gluconate protects the heart in hyperkalemia. Never add more potassium.'},
{topic:'abg',hot:false,q:'PUTTING IT TOGETHER — A patient with COPD is admitted with increased dyspnea. Using cause→manifest→treatment, which ABG and O₂ plan fit?',o:['Metabolic acidosis; give sodium bicarbonate and recheck the gas','Compensated respiratory acidosis; controlled O2 to keep SpO2 88-92%','Respiratory alkalosis; apply 100% oxygen by non-rebreather mask','Metabolic alkalosis; restrict fluids and hold the diuretic dose'],c:1,t:'single',r:'COPD cause = chronic CO₂ retention → compensated respiratory acidosis. Treatment = controlled O₂ (88–92%), not 100%. The framework links the three together.'},
{topic:'lytes',hot:false,q:'A patient on a loop diuretic reports muscle weakness and leg cramps. The nurse notes a flattened T wave and a U wave on the ECG. Which electrolyte imbalance is most likely?',o:['Hypermagnesemia','Hypocalcemia','Hyperkalemia','Hypokalemia'],c:3,t:'single',r:'Loop diuretics waste potassium. <b>Hypokalemia</b> classically shows weakness, cramps, a <b>flat T wave and a U wave</b>. Peaked T waves would indicate hyperkalemia.'},
{topic:'copd',hot:false,q:'Which precautions and teaching apply to a patient on RIPE therapy for TB? (Select all that apply)',o:['Report vision changes with ethambutol','Stop meds once feeling better','Airborne isolation with N95','Rifampin turns body fluids orange','Adherence for the full 6-12 months'],c:[0,2,3,4],t:'multi',r:'Airborne precautions, expect orange fluids (rifampin), report visual changes (ethambutol = optic neuritis), and complete the full course. Stopping early causes resistance.'},
{topic:'upper',hot:false,q:'A patient with acute rhinosinusitis asks why antibiotics were not prescribed. What is the best response?',o:['The infection is too advanced for antibiotics to help','Most cases are viral and improve with supportive care','Antibiotics are never used for sinus infections','Antibiotics would worsen the nasal congestion'],c:1,t:'single',r:'The majority of acute rhinosinusitis is <b>viral</b>. Antibiotics are reserved for symptoms that persist beyond about 10 days, worsen after initial improvement, or are severe. Supportive care is humidification, fluids, saline irrigation, and warm compresses.'},
{topic:'lytes',hot:false,q:'A hypotonic solution such as 0.45% NS causes water to move:',o:['Into cells','Out of the body','Into the vasculature only','Out of cells'],c:0,t:'single',r:'Hypotonic fluids shift water INTO cells (raisins → grapes). Watch for cerebral edema.'},
{topic:'abg',hot:false,q:'A patient with COPD also has advanced kidney disease. Compared with a COPD patient who has normal kidneys, what should the nurse expect on the arterial blood gas?',o:['Less compensation, because the kidneys cannot retain bicarbonate','Faster compensation, because two systems are now involved','Complete compensation within a few hours instead of days','No difference, since compensation is entirely a lung function'],c:0,t:'single',r:'The <b>kidneys are the compensator for a respiratory problem</b>, retaining bicarbonate over hours to days. If they are failing they cannot do that job, so the gas reads <b>uncompensated or only partially compensated</b> rather than the fully compensated picture a stable COPD patient usually shows.'},
{topic:'fluids',hot:true,q:'A patient with a suspected head injury has an order for 0.45% NS. What should the nurse do?',o:['Administer it as ordered on a pump','Administer it slowly over 8 hours','Question the order because hypotonic fluid can raise intracranial pressure','Change it to D5W instead'],c:2,t:'single',r:'<b>Hypotonic fluids are contraindicated with increased ICP, suspected head injury, hypotension, burns, and liver dysfunction.</b> Water moves into cells and worsens cerebral edema. D5W behaves hypotonically in the body, so it is no better.'},
{topic:'lytes',hot:false,q:'Which signs indicate fluid volume EXCESS? (Select all that apply)',o:['Poor skin turgor','Crackles','JVD','Bounding pulse','Weight gain'],c:[1,2,3,4],t:'multi',r:'Crackles, JVD, bounding pulse, and weight gain are "WET" signs. Poor turgor = deficit.'},
{topic:'resp',hot:false,q:'Which finding is the EARLIEST sign of hypoxia?',o:['Restlessness/anxiety','Clubbing of fingers','Bradycardia','Cyanosis'],c:0,t:'single',r:'Restlessness and anxiety are early hypoxia signs. Cyanosis is late; clubbing reflects chronic hypoxia.'},
{topic:'fluids',hot:true,q:'An IV of 0.9% NS is infusing at 125 mL/hr. The patient develops crackles and dyspnea. What should the nurse do?',o:['Discontinue the IV and remove the catheter','Slow the infusion to a keep-open rate and notify the provider','Increase the rate to improve perfusion','Change the fluid to 0.45% NS'],c:1,t:'single',r:'IV fluids are a <b>medication</b>. The nurse may <b>slow or stop an infusion for patient safety</b>, but <b>cannot adjust the rate or change the fluid type without an order</b>. Raise the head of the bed, assess, and notify the provider.'},
{topic:'copd',hot:true,q:'A patient develops chills, fever, and back pain 10 minutes into a transfusion. The nurse\'s FIRST action is to:',o:['Administer acetaminophen and keep infusing','Slow the infusion rate and continue to watch','Document the reaction and finish the unit','Stop the blood and keep the NS line open'],c:3,t:'single',r:'STOP the blood immediately and maintain IV access with NS, then notify the provider.'},
{topic:'lytes',hot:true,q:'All of the following are signs of hypocalcemia EXCEPT:',o:['Positive Trousseau sign','Constipation and kidney stones','Tingling around the mouth','Positive Chvostek sign'],c:1,t:'single',r:'Chvostek, Trousseau, and perioral tingling are hypoCALCEMIA (excitable). "Stones, bones, groans" (constipation, stones) is HYPERcalcemia — the EXCEPT impostor.'},
{topic:'lytes',hot:true,q:'A patient with chronic kidney disease has a potassium of 6.8 mEq/L and peaked T waves on the monitor. Which medication should the nurse prepare FIRST?',o:['Sodium bicarbonate','Potassium chloride','Calcium gluconate','Furosemide (Lasix)'],c:2,t:'single',r:'<b>Calcium gluconate</b> is given first to stabilize/protect the cardiac membrane from the dysrhythmia risk. It does NOT lower potassium — insulin+D50, bicarb, and dialysis do that — but protecting the heart is the immediate priority.'},
{topic:'abg',hot:false,q:'Which conditions cause metabolic acidosis? (Select all that apply)',o:['Vomiting','Renal failure','Diarrhea','NG suction','Diabetic ketoacidosis'],c:[1,2,4],t:'multi',r:'DKA, diarrhea, and renal failure cause metabolic acidosis. Vomiting and NG suction cause metabolic ALKalosis.'},
{topic:'fluids',hot:true,q:'A post-op patient has BP 88/56, HR 118, dry mucous membranes, and urine output of 18 mL/hr. Which IV fluid does the nurse anticipate FIRST?',o:['0.45% Normal Saline','3% Saline','D5W','0.9% Normal Saline'],c:3,t:'single',r:'This is hypovolemia/hypotension. The first-line fluid is an <b>isotonic crystalloid (0.9% NS or LR)</b> to expand intravascular volume. Hypotonic (0.45%, D5W) would worsen low BP; 3% is hypertonic and reserved for severe hyponatremia.'},
{topic:'clinical',hot:false,q:'A nurse notes a patient\'s urine output rose from 15 mL/hr to 40 mL/hr after fluid resuscitation. Documenting that the fluid-deficit goal was MET is which step?',o:['Implementation','Diagnosis','Assessment','Evaluation'],c:3,t:'single',r:'Comparing the result to the goal and judging it "met" is EVALUATION. (Note: the urine rose because of the fluid resuscitation — deficit alone lowers urine; the treatment is what brought it back up.) This closes the loop — if the goal were not met, the nurse would revise the plan.'},
{topic:'lytes',hot:false,q:'A high BNP level most likely indicates:',o:['Respiratory alkalosis from anxiety','Dehydration with hemoconcentration','Fluid overload or heart failure','Hypokalemia from diuretic use'],c:2,t:'single',r:'BNP rises when the heart is stretched by excess volume (CHF).'},
{topic:'copd',hot:false,q:'Of the following, which is the LEAST likely to indicate that a patient is deteriorating?',o:['A sudden silent chest','An SpO₂ of 90% in a COPD patient','A rising/"normalizing" CO₂ in a tiring asthmatic','New restlessness and confusion'],c:1,t:'single',r:'"LEAST likely" flips the search — three are red flags, one is acceptable. 88–92% is the GOAL in COPD, so 90% is fine. Negative-direction words like LEAST work just like NOT/EXCEPT.'},
{topic:'abg',hot:false,q:'In the body, PaCO₂ is regulated by the ____ and HCO₃ is regulated by the ____.',o:['heart / liver','lungs / kidneys','brain / spleen','kidneys / lungs'],c:1,t:'single',r:'Lungs control CO₂ (acid); kidneys control bicarbonate.'},
{topic:'lytes',hot:false,q:'Which statement about potassium administration is correct?',o:['Potassium is NEVER given by IV push','Oral potassium should be given on an empty stomach','Potassium may be given by rapid IV push in an emergency','Potassium-sparing diuretics are safe in hyperkalemia'],c:0,t:'single',r:'"Never" is a true absolute here: IV-push potassium can cause fatal arrhythmias. The trap is that absolutes are often false — but this one is a hard safety rule. A, C, and D are all dangerous/false.'},
{topic:'copd',hot:false,q:'During a severe asthma attack, the sudden ABSENCE of wheezing indicates:',o:['Impending respiratory failure','Less oxygen is now needed','The attack has fully resolved','Improvement in air movement'],c:0,t:'single',r:'A silent chest = no air moving = impending respiratory failure.'},
{topic:'blood',hot:true,q:'A nurse picks up a unit of blood from the blood bank but the patient is in the bathroom and the IV has infiltrated. The nurse cannot start the infusion. What is the BEST action?',o:['Start the blood slowly through the infiltrated IV and watch it','Return the blood to the bank since it cannot start in 30 min','Keep the blood at the bedside until a new IV can be placed','Put the blood in the unit refrigerator until the IV is restarted'],c:1,t:'single',r:'Blood must be started within 30 minutes of leaving the blood bank and must never sit warming at the bedside or be stored in a regular unit fridge. If you can\'t start it in time, return it to the blood bank.'},
{topic:'pneumonia',hot:false,q:'Aspiration pneumonia most commonly affects which area of the lungs?',o:['Both apices affected about equally','The left upper lobe most commonly','The pleural space rather than lung','Right lung, via the right main bronchus'],c:3,t:'single',r:'The right main bronchus is wider and more vertical, so aspirated material tends to go right.'},
{topic:'airway',hot:true,q:'A nurse is caring for four patients. Who should the nurse assess FIRST?',o:['A pneumonia patient with a temp of 100.8°F','A patient with a chest tube and gentle tidaling in the water seal','An asthma patient whose wheezing has suddenly become a \'silent chest\'','A COPD patient with an O₂ sat of 90% on 2 L'],c:2,t:'single',r:'A silent chest = no air movement = impending respiratory failure. The COPD sat of 90% is acceptable (goal 88–92%), the low-grade fever is expected with pneumonia, and tidaling is normal. B is acute, unstable, and unexpected.'},
{topic:'airway',hot:true,q:'Which finding in a chest-tube patient is the ONLY one that signals an emergency requiring you to notify the provider?',o:['Continuous bubbling in the water-seal chamber','Gentle tidaling in the water seal','50 mL of serosanguineous drainage over a shift','Continuous bubbling in the suction chamber on wall suction'],c:0,t:'single',r:'Tidaling is normal, suction-chamber bubbling on wall suction is expected, and modest drainage is fine. Continuous WATER-SEAL bubbling = air leak / possible tension pneumothorax — the one true emergency here.'},
{topic:'clinical',hot:true,q:'A patient reports new shortness of breath. There is no emergency apparent yet. What should the nurse do FIRST?',o:['Assess the patient (lung sounds, vitals, SpO₂)','Call respiratory therapy','Raise the head of the bed and leave the room','Administer a PRN bronchodilator'],c:0,t:'single',r:'When it is not an obvious emergency, ASSESS before acting. You gather data (lung sounds, vitals, SpO₂) before choosing an intervention. "Assess before act" is the most-tested ADPIE rule.'},
{topic:'fluids',hot:false,q:'Why is lactated Ringer avoided as an everyday maintenance fluid?',o:['It cannot be given through a peripheral line','It is reserved for trauma, surgery, and acute blood loss','It is hypotonic and causes cell swelling','It contains no electrolytes'],c:1,t:'single',r:'LR closely matches plasma electrolytes and is used <b>following trauma or surgery and in acute blood loss</b>, but <b>not for everyday maintenance</b>. Avoid it with renal or liver dysfunction, burns, metabolic alkalosis, hyperkalemia, and hyperlactemia.'},
{topic:'resp',hot:true,q:'A post-op patient refuses to deep breathe due to pain and develops diminished breath sounds at the right base. The priority is to prevent:',o:['Pneumothorax','Pleural effusion','Pulmonary embolism','Atelectasis'],c:3,t:'single',r:'Shallow breathing collapses alveoli → atelectasis. Encourage incentive spirometry, coughing, deep breathing.'},
{topic:'lytes',hot:false,q:'A patient with a sodium of 121 mEq/L is at greatest risk for:',o:['Hypertension','Constipation','Kidney stones','Seizures'],c:3,t:'single',r:',o:['},
{topic:'lytes',hot:false,q:'A patient is admitted with severe dehydration. Which IV fluid does the nurse anticipate administering first?',o:['D5W with 20 mEq KCl','0.45% Normal Saline','0.9% Normal Saline','D10W by slow infusion'],c:2,t:'single',r:'Isotonic 0.9% NS expands intravascular volume first-line for hypovolemia.'},
{topic:'upper',hot:false,q:'A patient has used an over-the-counter nasal decongestant spray daily for two weeks and reports worsening congestion. What does the nurse recognize?',o:['Rebound congestion from prolonged use','An allergic reaction to the spray','A developing bacterial sinus infection','Normal seasonal worsening of symptoms'],c:0,t:'single',r:'Topical decongestants used beyond <b>3 days</b> cause <b>rhinitis medicamentosa</b> — rebound congestion. The patient uses more, gets worse, and the cycle continues. The spray must be stopped.'},
{topic:'lytes',hot:true,q:'A patient is admitted with a sodium level of 122 mEq/L. Which is the priority nursing intervention?',o:['Encourage extra free water','Restrict potassium intake','Apply warm compresses','Institute seizure precautions'],c:3,t:'single',r:'Severe hyponatremia causes the brain to swell, leading to confusion and <b>seizures</b>. Seizure precautions and neuro checks are the priority. Adding free water would dilute sodium further and worsen it.'},
{topic:'copd',hot:false,q:'Which manifestations are characteristic of COPD? (Select all that apply)',o:['Chronic productive cough','Pursed-lip breathing','Barrel chest','Reversible airway obstruction','Hypercapnia'],c:[0,1,2,4],t:'multi',r:'COPD = barrel chest, pursed-lip breathing, chronic cough, hypercapnia. Obstruction in COPD is <b>irreversible</b> — reversible obstruction describes asthma.'},
{topic:'clinical',hot:false,q:'The nurse asks the patient to rate their dyspnea and records it. Which step is this?',o:['Implementation of the plan','Evaluation of the response','Planning the expected outcomes','Assessment, gathering subjective data'],c:3,t:'single',r:'Collecting the patient\'s reported experience is ASSESSMENT — specifically subjective data. Assessment includes BOTH what you observe (objective) and what the patient tells you (subjective).'},
{topic:'resp',hot:false,q:'Crackles heard on auscultation most often indicate:',o:['Narrowed airways','Upper airway obstruction','Fluid in the alveoli','Pleural friction'],c:2,t:'single',r:'Crackles = fluid in alveoli (CHF, pneumonia).'},
{topic:'airway',hot:false,q:'CAUSE — What is the underlying problem in asthma?',o:['Infectious fluid filling and consolidating the alveoli','Air trapped in the pleural space compressing the lung','Irreversible destruction of the alveolar walls','Reversible airway inflammation and bronchoconstriction'],c:3,t:'single',r:'Asthma = REVERSIBLE inflammation + bronchoconstriction + mucus in hyperreactive airways. (Irreversible destruction = emphysema; alveolar fluid = pneumonia/ARDS; pleural air = pneumothorax.)'},
{topic:'airway',hot:false,q:'Which actions are correct for chest tube management? (Select all that apply)',o:['Routinely clamp the tube during transport','Tape connections securely','Keep an occlusive dressing and clamp at the bedside','Keep the drainage system below chest level','If the tube is dislodged, cover with petroleum gauze taped on 3 sides'],c:[1,2,3,4],t:'multi',r:'System below chest, secure taped connections, 3-sided dressing if dislodged (lets air escape, prevents tension pneumo), and emergency supplies at bedside. Routine clamping is dangerous — it can cause tension pneumothorax.'},
{topic:'abg',hot:true,q:'A patient with chronic kidney disease has a pH of 7.28. Which additional laboratory value should the nurse check first?',o:['Potassium','Magnesium','Total calcium','Serum albumin'],c:0,t:'single',r:'Renal metabolic acidosis travels with <b>hyperkalemia</b> from two causes stacking: acidosis shifts potassium out of the cells, and the failing kidney cannot excrete it. Potassium is the value that can produce a fatal dysrhythmia, so it is checked first. The others matter but none of them kills in minutes.'},
{topic:'resp',hot:false,q:'Which ventilator strategy is used in ARDS?',o:['No humidification','Low FiO₂ only','Routine extubation','PEEP'],c:3,t:'single',r:'PEEP keeps alveoli open to improve oxygenation in ARDS.'},
{topic:'pneumonia',hot:false,q:'A late complication of tracheostomy is:',o:['Tracheal stenosis','Pneumothorax','Tube dislodgement','Bleeding'],c:0,t:'single',r:'Tracheal stenosis is a late complication; bleeding and pneumothorax are early.'},
{topic:'fluids',hot:true,q:'Which IV solution may be hung with a blood transfusion?',o:['0.9% normal saline only','D5W','Lactated Ringer','0.45% normal saline'],c:0,t:'single',r:'<b>Only 0.9% NS.</b> Dextrose solutions cause <b>hemolysis</b> of the red cells, and <b>lactated Ringer contains calcium</b>, which promotes clotting in the tubing.'},
{topic:'blood',hot:false,q:'How long should the nurse remain with the patient after starting a blood transfusion?',o:['No need to stay','The entire 4 hours','The first 15 minutes','The first 60 minutes'],c:2,t:'single',r:'Stay for the <b>first 15 minutes</b> and run slowly — most serious (hemolytic) reactions occur early. After that, monitor per protocol.'},
{topic:'pneumonia',hot:false,q:'The most common bacterial cause of community-acquired pneumonia is:',o:['MRSA colonization','Streptococcus pneumoniae','Pseudomonas species','Klebsiella pneumoniae'],c:1,t:'single',r:'S. pneumoniae is the leading CAP organism.'},
{topic:'resp',hot:false,q:'Cyanosis is best described as:',o:['An early sign of hypoxia','A late sign of hypoxia','Normal in older adults','A sign of fluid overload'],c:1,t:'single',r:'Cyanosis is a LATE indicator of hypoxia.'},
{topic:'clinical',hot:false,q:'Which sequence correctly reflects the nursing process for a patient with new hypoxia?',o:['Apply O₂ → assess lung sounds → set a goal → evaluate','Set a goal → apply O₂ → assess → diagnose','Assess','Diagnose → evaluate → assess → implement'],c:2,t:'single',r:'Correct ADPIE flow: Assess → Diagnose → Plan → Implement → Evaluate. The other sequences scramble the order, which is the trap in process-order questions.'},
{topic:'tb',hot:false,q:'A patient on RIPE therapy for TB reports their urine has turned orange. What is the nurse\'s best response?',o:['Stop the medication immediately and call the provider','This indicates the kidneys are beginning to fail','This is an expected, harmless effect of rifampin','Reduce fluid intake until the color returns to normal'],c:2,t:'single',r:'<b>Rifampin causes harmless orange/red discoloration of body fluids</b> (urine, sweat, tears). Reassure the patient and warn it can stain contact lenses.'},
{topic:'airway',hot:false,q:'The nurse notes continuous bubbling in the WATER SEAL chamber of a chest drainage system. This indicates:',o:['The lung has re-expanded','Normal functioning','An air leak in the system','The suction is too low'],c:2,t:'single',r:'Continuous bubbling in the water-seal chamber signals an air leak — assess connections; persistent leak with worsening status can mean tension pneumothorax.'},
{topic:'resp',hot:true,q:'Which is NOT a true statement about ARDS?',o:['PEEP is used to keep alveoli open','High-flow oxygen alone usually corrects the hypoxemia','Chest x-ray shows bilateral infiltrates','The hallmark is hypoxemia refractory to oxygen'],c:1,t:'single',r:'The whole point of ARDS is that oxygen does NOT fix it — so B is the false statement the "NOT" wants. A, C, and D are all true.'},
{topic:'pneumonia',hot:false,q:'The recommended fluid intake for a patient with pneumonia (no contraindication) is:',o:['500 mL/day','Restrict to 1 L/day','2-3 L/day','NPO'],c:2,t:'single',r:'2-3 L/day thins and mobilizes secretions.'},
{topic:'fluids',hot:false,q:'A patient with major burns requires fluid resuscitation. Which solution is used with the Parkland formula?',o:['Lactated Ringer','0.9% normal saline','D5W','3% saline'],c:0,t:'single',r:'<b>Lactated Ringer</b> is the burn resuscitation fluid. It restores perfusion and its lactate helps correct the <b>metabolic acidosis</b> of major burns.'},
{topic:'upper',hot:false,q:'Which statement about a permanent tracheostomy after total laryngectomy is accurate?',o:['Swimming is safe as long as the head stays above water','The patient can still breathe normally through the nose','The stoma will close on its own within several months','Air no longer passes through the nose, so it must be humidified'],c:3,t:'single',r:'The airway is <b>permanently rerouted to the neck stoma</b>. The nose no longer warms, filters, or humidifies air, so external humidification and stoma protection are essential. <b>These patients can never swim.</b>'},
{topic:'clinical',hot:true,q:'A patient has all of these orders. Which one should the nurse QUESTION (i.e., which is NOT appropriate)?',o:['For a fluid-overloaded HF patient: infuse 1 L NS over 1 hour','For hypovolemia: give an isotonic IV fluid bolus as ordered','For hyperkalemia: administer IV calcium gluconate as ordered','For suspected TB: place the patient on airborne precautions'],c:0,t:'single',r:'A rapid saline bolus in a fluid-overloaded heart-failure patient would worsen the overload — that\'s the inappropriate order to question. The other three are all correct. "Which to question" = find the wrong one.'},
{topic:'copd',hot:false,q:'A Mantoux (PPD) test is read in 48-72 hours by measuring:',o:['The wheal','Warmth','Redness','Induration'],c:3,t:'single',r:'Measure the induration (raised firm area), not redness.'},
{topic:'lytes',hot:true,q:'A nurse identifies which finding as the BEST indicator of fluid balance?',o:['Daily weight','Urine color','Blood pressure','Skin turgor'],c:0,t:'single',r:'Daily weight is most reliable; 1 kg ≈ 1 L of fluid.'},
{topic:'fluids',hot:false,q:'Which fluid is appropriate for a patient in liver failure needing free water replacement?',o:['D5W','Lactated Ringer','3% saline','0.45% NS with potassium'],c:0,t:'single',r:'<b>D5W</b> provides calories, prevents hypoglycemia, and supplies free water. <b>Lactated Ringer is avoided in liver failure</b> because the failing liver cannot metabolize lactate.'},
{topic:'clinical',hot:false,q:'Which nursing action during ADPIE can be DELEGATED to assistive personnel, leaving the nurse to handle the steps that require judgment?',o:['Evaluating whether the expected outcomes were met','Formulating the nursing diagnosis from the assessment','Recording intake and output and reporting the values','Performing the admission assessment on a new patient'],c:2,t:'single',r:'Assessment, diagnosis, and evaluation require nursing judgment and cannot be delegated. Routine data-collection tasks like measuring/recording I&O can be delegated to AP.'},
{topic:'abg',hot:false,q:'The ROME mnemonic stands for:',o:['Respiratory Only, Metabolic Even','Reverse Oxygen, Match Electrolytes','Renal Opposite, Metabolic Equal','Respiratory Opposite, Metabolic Equal'],c:3,t:'single',r:',o:['},
{topic:'abg',hot:false,q:'A patient\'s ABG: pH 7.34, PaCO₂ 60, HCO₃ 31. The nurse recognizes this as which state, and what does it tell you about the patient?',o:['Fully compensated respiratory acidosis, likely chronic COPD','Metabolic alkalosis from vomiting or diuretic therapy','Respiratory alkalosis from anxiety-driven hyperventilation','Uncompensated respiratory acidosis from an acute event'],c:0,t:'single',r:'pH is near-normal but on the acidic side, with BOTH CO₂ and HCO₃ elevated — the kidneys have retained bicarb to compensate. This pattern fits a chronic CO₂ retainer (COPD) rather than an acute crisis.'},
{topic:'pneumonia',hot:false,q:'Which of the following is an IMPLEMENTATION action for a patient with pneumonia? (Select all that apply)',o:['Reposition and assist with incentive spirometry','Auscultate breath sounds to gather data','Set a goal of "clear breath sounds by discharge"','Administer the prescribed antibiotic','Encourage 2–3 L of fluid per day'],c:[0,3,4],t:'multi',r:'Implementation = actions you perform: giving the antibiotic, encouraging fluids, repositioning/IS coaching. Auscultating is assessment; setting a goal is planning.'},
{topic:'lytes',hot:false,q:'A patient with a BUN:creatinine ratio of 25:1, increased hematocrit, and dry mucous membranes most likely has:',o:['Metabolic alkalosis','Fluid volume deficit','Hyperkalemia','Fluid volume excess'],c:1,t:'single',r:'A ratio >20:1 with hemoconcentration indicates fluid volume deficit.'},
{topic:'tb',hot:false,q:'A patient on rifampin should be taught that the medication may:',o:['Cause blue-gray skin','Stain teeth permanently','Cause hearing loss','Turn body fluids orange'],c:3,t:'single',r:'Rifampin harmlessly turns urine, sweat, and tears orange and can stain soft contact lenses.'},
{topic:'copd',hot:false,q:'A COPD patient\'s SpO₂ is 90%. The nurse\'s plan targets 88–92%. The nurse documents the target is being met and continues monitoring. This is which step?',o:['Evaluation','Implementation','Diagnosis','Assessment'],c:0,t:'single',r:'Comparing the current value (90%) against the goal (88–92%) and judging it met is EVALUATION. Note: don\'t "fix" a 90% in COPD — it\'s within the target.'},
{topic:'pneumonia',hot:false,q:'Rust-colored sputum is most classically associated with:',o:['A viral pneumonia syndrome','Streptococcus pneumoniae','Mycobacterium tuberculosis','Pseudomonas aeruginosa'],c:1,t:'single',r:'Rust-colored sputum classically suggests pneumococcal (Strep pneumoniae) pneumonia.'},
{topic:'pneumonia',hot:true,q:'Which of the following is NOT part of the VAP bundle?',o:['Daily oral care with chlorhexidine','Elevate the head of the bed 30–45°','Keep the patient flat to promote rest','Daily sedation interruption / readiness-to-wean'],c:2,t:'single',r:'Three are real VAP-bundle elements. The impostor is B — keeping the patient flat INCREASES aspiration risk and is the opposite of the bundle. "NOT" questions hide one false action among true ones.'},
{topic:'copd',hot:true,q:'MANIFESTS — During a severe asthma attack, which finding is the MOST alarming?',o:['Loud expiratory wheezing','Prolonged expiration','A sudden silent chest','Coughing'],c:2,t:'single',r:'A silent chest means almost no air is moving — impending respiratory failure. Loud wheezing at least means air movement. Knowing how it MANIFESTS tells you which sign is the emergency.'},
{topic:'clinical',hot:true,q:'Which patient should the nurse assess FIRST?',o:['Suddenly confused and restless with new-onset dyspnea','COPD patient with an oxygen saturation of 90 percent','Asking about discharge instructions for later today','Pneumonia patient with a temperature of 100.6 degrees'],c:0,t:'single',r:'Three are stable/expected; one is acute, unstable, unexpected. New confusion + restlessness + dyspnea = possible hypoxia/sepsis = see first. "First" questions reward acute-over-chronic thinking.'},
{topic:'resp',hot:false,q:'Incentive spirometry technique should instruct the patient to:',o:['Use it once daily','Breathe rapidly and shallowly','Inhale slowly and hold for 3 seconds','Exhale forcefully into the device'],c:2,t:'single',r:'Slow deep inhalation with a 3-second hold maximizes alveolar expansion.'},
{topic:'resp',hot:true,q:'A patient has an elevated D-dimer. What does this indicate?',o:['Further imaging is needed to confirm or exclude a clot','A pulmonary embolism is confirmed','No clot is present','Anticoagulation should be stopped immediately'],c:0,t:'single',r:'<b>D-dimer is a nonspecific marker of clot breakdown.</b> It rises with surgery, infection, pregnancy, cancer, and age. A normal value helps <b>rule out</b> PE in a low-risk patient; an elevated value earns <b>imaging</b>, not a diagnosis. <b>CT pulmonary angiography confirms.</b>'},
{topic:'copd',hot:false,q:'A 38-year-old who has never smoked is diagnosed with emphysema. Which cause should the nurse suspect?',o:['Alpha-1 antitrypsin deficiency','Long-term secondhand smoke only','Occupational asbestos exposure','Untreated asthma in childhood'],c:0,t:'single',r:'<b>Alpha-1 antitrypsin deficiency</b> is an inherited cause of emphysema. Suspect it in a patient who is <b>young, a nonsmoker, or has a strong family history</b>. The protein normally protects lung tissue from enzymes that destroy it.'},
{topic:'pneumonia',hot:true,q:'An 82-year-old is brought in for new confusion with a temperature of 98.9F. What should the nurse suspect?',o:['Pneumonia or a urinary tract infection','Progression of dementia','Normal age-related cognitive change','Dehydration from poor intake alone'],c:0,t:'single',r:'<b>Aging blunts the febrile response</b>, so an older adult with pneumonia may present with <b>confusion and no fever</b>. Other atypical presentations include new falls, decreased appetite, weakness, or worsening of a chronic condition. Attributing new confusion to age or dementia is the trap.'},
{topic:'fluids',hot:true,q:'What is the primary difference between crystalloid and colloid solutions?',o:['Crystalloid particles cross the capillary membrane; colloid particles are too large and stay in the vessel','Colloids contain electrolytes and crystalloids do not','Crystalloids are given only by central line','Colloids are always hypotonic'],c:0,t:'single',r:'<b>Particle size is the whole difference.</b> Crystalloids (NS, LR, D5W) contain small solutes that <b>cross freely</b>, so only about a third stays intravascular. Colloids (albumin, hetastarch, dextran) contain <b>large molecules that stay in the vessel and pull fluid in</b> by oncotic pressure.'},
{topic:'fluids',hot:true,q:'A patient has lost approximately 1 liter of blood. If crystalloid is used for resuscitation, how much is generally required?',o:['About 3 liters','About 1 liter','About 500 mL','About 5 liters'],c:0,t:'single',r:'The <b>3:1 rule</b>. Because only about <b>one third of a crystalloid stays intravascular</b>, roughly <b>3 mL are needed for every 1 mL of blood lost</b>. Colloids replace closer to <b>1:1</b> because they remain in the vascular space.'},
{topic:'fluids',hot:true,q:'A patient with ascites and a low serum albumin is ordered 25% albumin. What should the nurse monitor for afterward?',o:['Fluid overload with crackles and dyspnea','Hypoglycemia','Hyperkalemia','Metabolic acidosis'],c:0,t:'single',r:'<b>25% albumin is hyperoncotic</b> and pulls a large volume of fluid out of the tissues into the vessel. That is the therapeutic goal in third spacing, and it is also why the patient can go into <b>fluid overload and pulmonary edema</b>. Monitor <b>lung sounds, blood pressure, and urine output</b>.'},
{topic:'fluids',hot:false,q:'Which colloid carries an increased risk of bleeding?',o:['Hetastarch','5% albumin','0.9% normal saline','Lactated Ringer'],c:0,t:'single',r:'<b>Hetastarch and dextran impair coagulation</b> and increase bleeding risk; starches also carry renal injury risk. Albumin does not have that effect. NS and LR are <b>crystalloids</b>, not colloids.'},
{topic:'fluids',hot:false,q:'Which is an advantage of crystalloids over colloids?',o:['No risk of allergic or anaphylactic reaction','Less total volume is required','They stay in the vascular space longer','They pull fluid out of the interstitium'],c:0,t:'single',r:'Crystalloids are <b>inexpensive, widely available, and carry no allergic or transfusion reaction risk</b>. The trade-off is that they <b>leak into the interstitium</b>, so more volume is needed and edema is more likely. Staying in the vessel and pulling fluid in are <b>colloid</b> properties.'},
{topic:'airway',hot:true,q:'What is the difference between a pleural effusion and an empyema?',o:['An empyema is infected fluid \u2014 pus \u2014 in the pleural space','A pleural effusion is always caused by infection','An empyema contains air rather than fluid','They are different names for the same condition'],c:0,t:'single',r:'<b>Effusion is fluid. Empyema is PUS.</b> Empyema is always infected, so it comes with <b>fever, chills, night sweats, and an elevated WBC</b>, the fluid is <b>thick and often loculated</b>, and it needs <b>antibiotics PLUS drainage</b> \u2014 usually a large-bore chest tube, sometimes decortication.'},
{topic:'airway',hot:true,q:'A pleural effusion caused by heart failure would be classified as which type of fluid?',o:['Transudate','Exudate','Purulent','Chylous'],c:0,t:'single',r:'<b>Transudate = a pressure problem</b> \u2014 heart failure, cirrhosis, low albumin push fluid out. It is <b>clear and protein-poor</b>. <b>Exudate = a permeability problem</b> \u2014 infection, malignancy, inflammation make the membrane leaky, producing <b>cloudy, protein-rich</b> fluid.'},
{topic:'airway',hot:false,q:'Blood in the pleural space is called what?',o:['Hemothorax','Empyema','Chylothorax','Pneumothorax'],c:0,t:'single',r:'What fills the pleural space names the condition: <b>air = pneumothorax, serous fluid = pleural effusion, pus = empyema, blood = hemothorax, lymph = chylothorax</b>. Fluid, pus, and blood all percuss <b>dull</b>; air is <b>hyperresonant</b>.'},
{topic:'airway',hot:true,q:'Following a thoracentesis the patient suddenly reports dyspnea and chest pain with absent breath sounds on that side. What does the nurse suspect?',o:['Pneumothorax','Expected post-procedure discomfort','Reaccumulation of the effusion','An allergic reaction to the local anesthetic'],c:0,t:'single',r:'<b>Pneumothorax is the main complication of thoracentesis</b>, which is why a <b>chest x-ray is obtained afterward</b>. Sudden dyspnea, chest pain, and absent breath sounds require immediate assessment. Also do not remove more than about <b>1,000 to 1,500 mL at once</b> \u2014 rapid removal risks re-expansion pulmonary edema.'},
{topic:'copd',hot:true,q:'A patient with pulmonary hypertension develops right-sided heart failure. Which findings does the nurse expect?',o:['JVD, hepatomegaly, ascites, and peripheral edema','Crackles and pink frothy sputum','Orthopnea with bilateral rales','Bounding pulse with a widened pulse pressure'],c:0,t:'single',r:'<b>Right-sided failure backs up into the BODY</b>, because the right heart receives from the systemic circulation: <b>JVD, hepatomegaly with RUQ tenderness, ascites, dependent edema, and rapid weight gain</b>. <b>Crackles and pink frothy sputum are LEFT-sided</b> findings. Right heart failure from lung disease is <b>cor pulmonale</b>.'},
{topic:'copd',hot:true,q:'What is the earliest and most common symptom of pulmonary hypertension?',o:['Dyspnea on exertion','Peripheral edema','Hemoptysis','Chest wall deformity'],c:0,t:'single',r:'<b>Dyspnea on exertion</b> comes first, because cardiac output cannot rise to meet demand. Fatigue, exertional chest pain, and eventually <b>syncope with exertion</b> follow. <b>Syncope is an ominous sign</b> \u2014 it means output is fixed and cannot increase.'},
{topic:'copd',hot:false,q:'Which test is definitive for diagnosing pulmonary hypertension?',o:['Right heart catheterization','Echocardiogram','Chest x-ray','Pulmonary function testing'],c:0,t:'single',r:'<b>Echocardiography screens</b> and estimates pulmonary pressure noninvasively, but <b>right heart catheterization is definitive</b> because it measures pulmonary artery pressure directly.'},
{topic:'tb',hot:true,q:'A patient with active TB stopped taking their medications after two months because they felt better. What is the most appropriate nursing action?',o:['Explore the barriers to adherence and arrange directly observed therapy','Document noncompliance and notify the provider only','Restart the medications and repeat the original teaching','Advise the patient that treatment can be shortened if symptoms resolve'],c:0,t:'single',r:'<b>Directly observed therapy (DOT)</b> \u2014 a health worker watches each dose \u2014 is the standard when adherence is a concern, and stopping early breeds <b>multidrug-resistant TB</b>. Repeating the same teaching does not address <b>why</b> it failed: cost, transport, housing, side effects, or stigma. Treatment runs the full <b>6 to 12 months</b>.'},
{topic:'tb',hot:false,q:'Which finding is most characteristic of active pulmonary tuberculosis?',o:['Drenching night sweats with a cough lasting over 3 weeks','Sudden high fever with rigors','Acute pleuritic pain with a friction rub','Wheezing relieved by a bronchodilator'],c:0,t:'single',r:'TB is <b>insidious</b>. The characteristic pattern is a <b>cough over 3 weeks</b>, <b>drenching night sweats</b>, <b>low-grade afternoon fever</b>, <b>unintentional weight loss</b>, fatigue, and later <b>hemoptysis</b>. Sudden high fever with rigors suggests bacterial pneumonia instead.'},
{topic:'tb',hot:false,q:'Which statement about latent tuberculosis is accurate?',o:['The person has no symptoms and is not infectious','The person is infectious and requires airborne precautions','The sputum culture will be positive','A chest x-ray will show active cavitary lesions'],c:0,t:'single',r:'<b>Latent TB:</b> positive skin test or IGRA, <b>no symptoms, normal chest x-ray, negative sputum, NOT infectious</b>. It is treated to prevent reactivation. <b>Active TB</b> has symptoms, an abnormal x-ray, a positive sputum culture, and <b>is infectious</b>.'},
{topic:'resp',hot:true,q:'Which oxygen delivery device provides the most precise and specific FiO2?',o:['Venturi mask','Non-rebreather mask','Nasal cannula','Simple face mask'],c:0,t:'single',r:'The <b>Venturi mask</b> is a <b>high-flow</b> device \u2014 it supplies the entire inspired volume, so the FiO2 is <b>exact regardless of the patient breathing rate or depth</b>. Color-coded adaptors set a specific FiO2 from 24 to 50%. That precision is why it is preferred in <b>COPD</b>, where the target is 88 to 92%.'},
{topic:'resp',hot:true,q:'Which device delivers the HIGHEST oxygen concentration without intubation?',o:['Non-rebreather mask at 10 to 15 L/min','Venturi mask at 12 L/min','Nasal cannula at 6 L/min','Simple face mask at 8 L/min'],c:0,t:'single',r:'A <b>non-rebreather at 10 to 15 L/min delivers 60 to 100%</b> \u2014 the highest available short of intubation. Its <b>one-way valves</b> prevent rebreathing. Note the distinction: <b>Venturi is the most PRECISE, non-rebreather is the most CONCENTRATED.</b> Two different questions.'},
{topic:'resp',hot:true,q:'A patient on a non-rebreather mask has a reservoir bag that fully collapses with each breath. What should the nurse do?',o:['Increase the oxygen flow rate','Remove the mask and switch to a nasal cannula','Document as an expected finding','Deflate the bag completely before reapplying'],c:0,t:'single',r:'<b>The reservoir bag must not collapse on inspiration.</b> Full deflation means the flow rate is too low to keep the bag filled, so the patient is entraining room air and getting less oxygen than ordered. <b>Increase the flow.</b>'},
{topic:'resp',hot:true,q:'A simple face mask is ordered. Which flow rate should the nurse question?',o:['3 L/min','5 L/min','6 L/min','8 L/min'],c:0,t:'single',r:'A simple face mask runs at <b>5 to 8 L/min</b>. <b>Below 5 L/min, exhaled CO2 accumulates inside the mask and is rebreathed.</b> If a lower concentration is needed, change the device to a nasal cannula rather than lowering the mask flow.'},
{topic:'resp',hot:false,q:'A patient is on a nasal cannula at 5 L/min. What is the approximate FiO2?',o:['About 40%','About 24%','About 60%','About 80%'],c:0,t:'single',r:'Nasal cannula runs <b>1 to 6 L/min</b> delivering <b>24 to 44%</b>, roughly <b>4% per liter above room air 21%</b>. So 5 L is about 40%. <b>Humidify above 4 L/min</b> to prevent drying and cracking of the nares.'},
{topic:'resp',hot:true,q:'A patient on 80% oxygen for 36 hours reports substernal chest pain and a dry cough. What does the nurse suspect?',o:['Oxygen toxicity','Myocardial infarction','Pulmonary embolism','Pneumothorax'],c:0,t:'single',r:'<b>Oxygen toxicity</b> occurs with FiO2 above 50% for more than 24 to 48 hours. Early signs are <b>substernal chest pain, dry cough, dyspnea, paresthesias, and restlessness</b>. It damages the alveolar-capillary membrane and can progress to an ARDS-like picture. Use the <b>lowest FiO2 that meets the saturation target</b>.'},
{topic:'resp',hot:false,q:'Which action is essential when a patient is using a Venturi mask?',o:['Keep the entrainment ports uncovered','Keep the reservoir bag inflated','Run the flow at 2 L/min','Remove the mask during meals and leave oxygen off'],c:0,t:'single',r:'The Venturi mask works by <b>entraining a fixed ratio of room air through side ports</b>. <b>Covering them with bedding, a gown, or a hand destroys the accuracy</b> of the delivered FiO2. Match the color-coded adaptor to the ordered FiO2 and set the flow the adaptor requires.'},
{topic:'resp',hot:false,q:'A patient with a COPD exacerbation and rising CO2 is becoming somnolent. Which noninvasive support is most appropriate?',o:['BiPAP','CPAP','Simple face mask','Room air with pursed-lip coaching'],c:0,t:'single',r:'<b>BiPAP delivers two pressures</b> \u2014 higher on inspiration, lower on expiration \u2014 so it assists <b>ventilation</b>, not just oxygenation. That is what a hypercapnic COPD patient needs, and it often <b>prevents intubation</b>. CPAP provides one continuous pressure and is used for sleep apnea and cardiogenic pulmonary edema. Noninvasive support requires a patient who can <b>protect the airway</b>.'},
{topic:'blood',hot:true,q:'Fifteen minutes into a transfusion the patient reports low back pain, chills, and a feeling that something is wrong. What is the nurse\'s FIRST action?',o:['Stop the transfusion','Notify the provider','Slow the rate and continue monitoring','Administer an antipyretic'],c:0,t:'single',r:'<b>STOP the transfusion first.</b> Back or flank pain with chills and a sense of impending doom is an <b>acute hemolytic reaction</b> from ABO incompatibility. Then keep the line open with <b>NS through NEW tubing</b>, assess, notify provider and blood bank, return the bag and tubing, and obtain blood and first-voided urine samples.'},
{topic:'blood',hot:true,q:'A patient develops dyspnea and bilateral infiltrates during transfusion. Blood pressure is 88/50 with a fever. Which reaction is most likely?',o:['TRALI','TACO','Acute hemolytic reaction','Mild allergic reaction'],c:0,t:'single',r:'<b>TRALI presents with HYPOtension and fever</b>; <b>TACO presents with HYPERtension and JVD</b>. Both cause sudden dyspnea with infiltrates, so the <b>blood pressure direction is the discriminator</b>. TRALI is the leading cause of transfusion-related death.'},
{topic:'blood',hot:true,q:'Which IV solution may be used with a blood transfusion?',o:['0.9% normal saline only','D5W','Lactated Ringer','0.45% normal saline'],c:0,t:'single',r:'<b>0.9% NS only.</b> <b>Dextrose lyses red cells</b>, and <b>lactated Ringer contains calcium that promotes clotting</b> in the tubing. No medication is ever added to blood or run through the same line.'},
{topic:'blood',hot:false,q:'Which gauge IV catheter is appropriate for a packed red blood cell transfusion?',o:['18 to 20 gauge','22 gauge','24 gauge','Any gauge is acceptable'],c:0,t:'single',r:'Blood requires <b>18 to 20 gauge</b>. Forcing red cells through a smaller catheter causes <b>hemolysis</b>. Remember the numbering is inverted \u2014 a larger number is a smaller catheter.'},
{topic:'blood',hot:true,q:'How long may the nurse take to infuse one unit of packed red blood cells?',o:['No more than 4 hours','Up to 8 hours','Up to 6 hours','As long as needed for tolerance'],c:0,t:'single',r:'<b>Complete within 4 hours</b> \u2014 beyond that, bacterial growth risk rises at room temperature. It must also be <b>started within 30 minutes of release</b> from the blood bank. If the patient cannot tolerate that rate, request a <b>split unit</b> rather than slowing a single unit past 4 hours.'},
{topic:'blood',hot:false,q:'A patient develops sudden dyspnea, chest pain, and hypotension when an IV line is disconnected. What is the priority nursing action?',o:['Clamp the line and place the patient on the left side in Trendelenburg','Sit the patient upright and apply oxygen','Flush the line with saline','Restart the infusion at a slower rate'],c:0,t:'single',r:'This is an <b>air embolism</b>. <b>Clamp the line and position left side-lying in Trendelenburg</b>, which traps the air in the right atrium and apex of the right ventricle away from the pulmonary outflow tract so it can be absorbed. Then oxygen and notify.'},
{topic:'resp',hot:true,q:'Which finding differentiates consolidation from a pleural effusion, since both produce dull percussion?',o:['Tactile fremitus is increased in consolidation and decreased in effusion','Breath sounds are absent only in consolidation','Percussion is hyperresonant in effusion','Egophony occurs only with effusion'],c:0,t:'single',r:'<b>Both percuss dull \u2014 fremitus is the discriminator.</b> Consolidation is <b>solid tissue that conducts vibration better</b>, so fremitus <b>increases</b> and egophony is present. An effusion is <b>fluid that blocks transmission</b>, so fremitus <b>decreases</b>.'},
{topic:'resp',hot:true,q:'A patient has a loud high-pitched inspiratory sound audible without a stethoscope. What does this indicate?',o:['Stridor from upper airway obstruction','Expiratory wheezing from asthma','Coarse crackles from secretions','A pleural friction rub'],c:0,t:'single',r:'<b>Stridor is inspiratory and signals UPPER airway obstruction</b> \u2014 laryngeal edema, croup, epiglottitis, foreign body, post-extubation swelling. It is an <b>emergency</b> and always outranks wheezing, which is <b>expiratory and lower airway</b>.'},
{topic:'upper',hot:true,q:'A child returns from a tonsillectomy and is swallowing frequently. What does this indicate?',o:['Bleeding at the surgical site','Normal postoperative recovery','Dehydration from NPO status','An adverse reaction to anesthesia'],c:0,t:'single',r:'<b>Frequent swallowing is the earliest sign of bleeding</b> \u2014 the patient is swallowing blood trickling down the throat. Also watch for restlessness and rising pulse. Position <b>side-lying or prone</b>, ice collar, <b>no straws, coughing, or throat clearing</b>, and avoid red or brown liquids. Risk peaks in the first 24 hours and again at <b>5 to 10 days</b> when the scab sloughs.'},
{topic:'upper',hot:false,q:'What is the correct positioning for a patient with epistaxis?',o:['Sit upright leaning forward, pinching the soft part of the nose','Lie flat with the head turned to the side','Sit upright with the head tilted back','Lie prone with an ice pack under the chest'],c:0,t:'single',r:'<b>Upright and leaning FORWARD</b>, pinching the <b>soft part</b> of the nose for 5 to 10 minutes without releasing. Tilting the head <b>back</b> lets blood run down the throat \u2014 it hides the amount lost, causes nausea and vomiting, and risks <b>aspiration</b>.'},
{topic:'upper',hot:true,q:'A patient reports hoarseness lasting 3 weeks. What is the priority nursing action?',o:['Facilitate evaluation for laryngeal cancer','Recommend voice rest and humidification','Suggest an over-the-counter throat lozenge','Reassure that hoarseness resolves on its own'],c:0,t:'single',r:'<b>Hoarseness lasting more than 2 weeks is the hallmark of laryngeal cancer</b> and requires laryngoscopy with biopsy. Risk rises sharply when <b>smoking and alcohol</b> are combined. Reassurance or symptomatic treatment delays diagnosis.'},
{topic:'abg',hot:true,q:'A patient has acute kidney failure. Any acid-base disturbance they develop is automatically classified as what?',o:['Metabolic','Respiratory','Mixed','Compensated respiratory'],c:0,t:'single',r:'<b>Kidneys regulate BICARBONATE, so a kidney problem is automatically METABOLIC.</b> Lungs regulate CO2, so a lung problem is automatically RESPIRATORY. Name the failing organ and you have named half the gas before reading a single number. Renal failure defaults to <b>metabolic acidosis</b> \u2014 acid accumulates, bicarbonate falls, pH and bicarb move together.'},
{topic:'abg',hot:true,q:'A patient with COPD has pH 7.36, PaCO2 58, HCO3 32. How does the nurse interpret this?',o:['Fully compensated respiratory acidosis','Uncompensated metabolic alkalosis','Partially compensated respiratory alkalosis','Normal arterial blood gas'],c:0,t:'single',r:'pH is <b>normal but on the ACID side (7.35-7.39)</b>, so the original problem was acidosis. CO2 is high \u2014 the lung is the culprit, so <b>respiratory</b>. Bicarbonate is also high, meaning the kidneys compensated. <b>Both abnormal with a normal pH = FULLY COMPENSATED.</b> This is the classic stable COPD gas.'},
{topic:'abg',hot:false,q:'A patient in chronic kidney disease develops respiratory acidosis. Why should the nurse expect little or no compensation?',o:['The kidneys are the compensator for respiratory problems and they are failing','The lungs cannot compensate for themselves','Compensation only occurs in metabolic disorders','Respiratory acidosis never triggers compensation'],c:0,t:'single',r:'<b>The kidneys compensate for respiratory problems by retaining bicarbonate over days.</b> A failing kidney cannot do that, so expect an <b>uncompensated or only partially compensated</b> gas. The same patient is also prone to <b>hyperkalemia</b>, since acidosis shifts potassium out of cells and the failing kidney cannot excrete it.'},
{topic:'abg',hot:true,q:'A patient with a COPD exacerbation is drowsy with shallow respirations. Which arterial blood gas values does the nurse expect?',o:['pH 7.52, PaCO2 28, HCO3 24','pH 7.28, PaCO2 62, HCO3 25','pH 7.22, PaCO2 34, HCO3 14','pH 7.50, PaCO2 44, HCO3 34'],c:1,t:'single',r:'<b>Lung problem \\u2192 RESPIRATORY.</b> Air is trapped so CO2 cannot leave \\u2192 CO2 rises \\u2192 <b>acidosis</b>. Look for a <b>low pH with a HIGH CO2</b>. The others: low pH with low CO2 is impossible for retention, and the two alkalotic sets have the pH going the wrong way entirely.'},
{topic:'abg',hot:true,q:'A patient is found unresponsive after an opioid overdose with a respiratory rate of 6. Which ABG values are expected?',o:['pH 7.48, PaCO2 30, HCO3 23','pH 7.30, PaCO2 32, HCO3 16','pH 7.49, PaCO2 46, HCO3 33','pH 7.21, PaCO2 68, HCO3 26'],c:3,t:'single',r:'<b>Respiratory drive suppressed \\u2192 hypoventilation \\u2192 CO2 accumulates.</b> Respiratory acidosis: <b>low pH, HIGH CO2</b>. Because this is <b>acute</b>, the bicarbonate is still <b>normal</b> \\u2014 the kidneys need days to compensate.'},
{topic:'abg',hot:true,q:'A patient having a panic attack is breathing 36 times per minute and reports tingling around the mouth and in the fingertips. Which ABG values are expected?',o:['pH 7.52, PaCO2 48, HCO3 35','pH 7.26, PaCO2 58, HCO3 25','pH 7.54, PaCO2 26, HCO3 23','pH 7.20, PaCO2 30, HCO3 12'],c:2,t:'single',r:'<b>Hyperventilation blows CO2 off \\u2192 RESPIRATORY ALKALOSIS: high pH, LOW CO2.</b> The tingling and carpal spasm are the giveaway \\u2014 alkalosis lowers <b>ionized calcium</b>, producing the same neuromuscular signs as hypocalcemia.'},
{topic:'abg',hot:true,q:'A patient in diabetic ketoacidosis has deep rapid Kussmaul respirations and fruity breath. Which ABG values are expected?',o:['pH 7.48, PaCO2 46, HCO3 32','pH 7.28, PaCO2 58, HCO3 26','pH 7.18, PaCO2 30, HCO3 12','pH 7.50, PaCO2 30, HCO3 24'],c:2,t:'single',r:'<b>Ketones are acid \\u2192 METABOLIC ACIDOSIS: low pH, LOW bicarbonate.</b> The <b>CO2 is also low</b> because Kussmaul breathing is the <b>respiratory compensation</b> \\u2014 blowing off CO2 to raise the pH. pH and bicarb move together, which is what makes it metabolic.'},
{topic:'abg',hot:true,q:'A patient has had persistent vomiting for three days. Which ABG values does the nurse expect?',o:['pH 7.52, PaCO2 45, HCO3 34','pH 7.30, PaCO2 60, HCO3 26','pH 7.50, PaCO2 28, HCO3 22','pH 7.24, PaCO2 32, HCO3 15'],c:0,t:'single',r:'<b>Vomiting loses stomach ACID \\u2192 METABOLIC ALKALOSIS: high pH, HIGH bicarbonate.</b> Remember the pair: <b>vomit acid \\u2192 alkalosis, poop base \\u2192 acidosis.</b> Expect low potassium and low chloride alongside it.'},
{topic:'abg',hot:true,q:'A patient has had severe watery diarrhea for two days. Which ABG values are expected?',o:['pH 7.49, PaCO2 29, HCO3 23','pH 7.25, PaCO2 33, HCO3 15','pH 7.29, PaCO2 60, HCO3 27','pH 7.51, PaCO2 44, HCO3 33'],c:1,t:'single',r:'<b>Intestinal contents are alkaline \\u2014 losing them loses BICARBONATE \\u2192 METABOLIC ACIDOSIS: low pH, LOW bicarb.</b> This is the mirror of vomiting, and he pairs the two on purpose. <b>Top of the gut = alkalosis. Bottom of the gut = acidosis.</b>'},
{topic:'abg',hot:true,q:'A patient in septic shock has a lactate of 6 mmol/L and mottled cool extremities. Which ABG values are expected?',o:['pH 7.19, PaCO2 31, HCO3 13','pH 7.53, PaCO2 27, HCO3 24','pH 7.27, PaCO2 59, HCO3 26','pH 7.47, PaCO2 45, HCO3 31'],c:0,t:'single',r:'<b>Anaerobic metabolism produces LACTIC ACID \\u2192 METABOLIC ACIDOSIS: low pH, LOW bicarbonate.</b> The CO2 is also low from compensatory tachypnea. Not a lung problem, so not respiratory \\u2014 the acid is coming from the tissues.'},
{topic:'abg',hot:true,q:'A patient with end-stage kidney disease missed two dialysis sessions. Which ABG values are expected?',o:['pH 7.50, PaCO2 30, HCO3 23','pH 7.48, PaCO2 44, HCO3 32','pH 7.23, PaCO2 34, HCO3 14','pH 7.31, PaCO2 58, HCO3 27'],c:2,t:'single',r:'<b>Kidney problem is automatically METABOLIC.</b> The failing kidney cannot excrete acid or regenerate bicarbonate \\u2192 <b>metabolic acidosis: low pH, LOW bicarb</b>. Expect <b>hyperkalemia</b> too \\u2014 acidosis shifts potassium out of cells and the kidney cannot excrete it.'},
{topic:'abg',hot:false,q:'A patient with continuous nasogastric suction for 48 hours has which expected ABG values?',o:['pH 7.32, PaCO2 58, HCO3 28','pH 7.26, PaCO2 34, HCO3 16','pH 7.47, PaCO2 30, HCO3 22','pH 7.51, PaCO2 46, HCO3 33'],c:3,t:'single',r:'<b>NG suction removes stomach ACID</b>, exactly like vomiting \\u2192 <b>METABOLIC ALKALOSIS: high pH, HIGH bicarbonate</b>. Monitor potassium and chloride, which are lost with it.'},
{topic:'abg',hot:false,q:'A patient develops a sudden pulmonary embolism and is breathing 34 times per minute with acute anxiety. Which ABG values are expected early?',o:['pH 7.26, PaCO2 60, HCO3 26','pH 7.50, PaCO2 28, HCO3 23','pH 7.49, PaCO2 47, HCO3 34','pH 7.21, PaCO2 32, HCO3 13'],c:1,t:'single',r:'<b>PE causes tachypnea early \\u2192 CO2 is blown off \\u2192 RESPIRATORY ALKALOSIS: high pH, LOW CO2</b>, with hypoxemia. Students expect acidosis because the patient looks critical, but the acid-base picture early on comes from <b>overbreathing</b>.'},
{topic:'abg',hot:true,q:'A patient with long-standing COPD is at their baseline and comfortable. Which ABG values are expected?',o:['pH 7.24, PaCO2 60, HCO3 24','pH 7.50, PaCO2 44, HCO3 34','pH 7.36, PaCO2 58, HCO3 32','pH 7.44, PaCO2 30, HCO3 22'],c:2,t:'single',r:'<b>Fully compensated respiratory acidosis.</b> pH is <b>normal but on the ACID side (7.35\\u20137.39)</b>, CO2 is high, and the kidneys have retained bicarbonate over time so it is high too. <b>Both values abnormal with a normal pH = fully compensated</b> \\u2014 the classic stable COPD gas.'},
{topic:'abg',hot:true,q:'A patient in status asthmaticus who was hyperventilating now has a rising CO2 and is becoming somnolent. Which ABG values are expected?',o:['pH 7.51, PaCO2 27, HCO3 23','pH 7.29, PaCO2 52, HCO3 25','pH 7.25, PaCO2 30, HCO3 14','pH 7.42, PaCO2 40, HCO3 24'],c:1,t:'single',r:'<b>They are tiring out.</b> Early in an attack the gas shows respiratory <b>alkalosis</b> from hyperventilating. As the patient fatigues, ventilation fails and CO2 <b>rises</b> \\u2192 <b>respiratory acidosis: low pH, high CO2</b>. A normal gas here would be equally ominous \\u2014 it means the CO2 is on its way up.'},
{topic:'abg',hot:false,q:'A patient on a mechanical ventilator is being ventilated at a rate that is too high. Which ABG values are expected?',o:['pH 7.53, PaCO2 26, HCO3 24','pH 7.50, PaCO2 45, HCO3 34','pH 7.25, PaCO2 58, HCO3 25','pH 7.28, PaCO2 33, HCO3 16'],c:0,t:'single',r:'<b>Over-ventilation removes too much CO2 \\u2192 RESPIRATORY ALKALOSIS: high pH, LOW CO2.</b> The nursing action is to reduce the rate or tidal volume, not to add sedation.'},
{topic:'abg',hot:false,q:'A patient taking large amounts of furosemide has which expected ABG values?',o:['pH 7.49, PaCO2 44, HCO3 32','pH 7.51, PaCO2 28, HCO3 23','pH 7.27, PaCO2 33, HCO3 16','pH 7.30, PaCO2 59, HCO3 27'],c:0,t:'single',r:'<b>Loop diuretics cause loss of hydrogen ion and potassium in the urine \\u2192 METABOLIC ALKALOSIS: high pH, HIGH bicarbonate</b>, with <b>hypokalemia</b>. Not a lung problem, so the CO2 is not the culprit value.'},
{topic:'abg',hot:false,q:'A patient with Guillain-Barre syndrome has progressive weakness and a falling vital capacity. Which ABG values would most concern the nurse?',o:['pH 7.32, PaCO2 30, HCO3 16','pH 7.41, PaCO2 38, HCO3 24','pH 7.47, PaCO2 32, HCO3 23','pH 7.30, PaCO2 54, HCO3 26'],c:3,t:'single',r:'<b>Neuromuscular weakness means they cannot move air mechanically \\u2192 CO2 accumulates \\u2192 RESPIRATORY ACIDOSIS: low pH, HIGH CO2.</b> A rising CO2 in this patient signals impending respiratory failure and the need for ventilatory support.'},
{topic:'abg',hot:false,q:'A postoperative patient is somnolent from anesthesia with a respiratory rate of 8 and shallow depth. Which ABG values are expected?',o:['pH 7.46, PaCO2 45, HCO3 33','pH 7.29, PaCO2 57, HCO3 26','pH 7.24, PaCO2 32, HCO3 14','pH 7.50, PaCO2 29, HCO3 23'],c:1,t:'single',r:'<b>Anesthesia and opioids suppress ventilation \\u2192 CO2 retention \\u2192 RESPIRATORY ACIDOSIS: low pH, HIGH CO2</b>, with a <b>normal bicarbonate</b> because it is acute. This is why postoperative respiratory monitoring matters.'},
{topic:'abg',hot:false,q:'A patient is admitted after prolonged fasting and severe malnutrition. Which ABG values are expected?',o:['pH 7.28, PaCO2 32, HCO3 16','pH 7.48, PaCO2 29, HCO3 22','pH 7.50, PaCO2 45, HCO3 33','pH 7.26, PaCO2 59, HCO3 26'],c:0,t:'single',r:'<b>Starvation produces ketoacids \\u2192 METABOLIC ACIDOSIS: low pH, LOW bicarbonate</b>, with a compensating low CO2. Same mechanism as DKA \\u2014 the body burns fat and generates acid.'},
{topic:'abg',hot:true,q:'A patient\'s ABG shows pH 7.34, PaCO2 36, HCO3 19 after several days of diarrhea. What does the nurse expect the CO2 to do next?',o:['Stay the same, since lungs do not compensate for metabolic problems','Rise, as the lungs retain CO2 to raise the pH','Rise sharply, causing respiratory acidosis','Fall, as the lungs compensate by blowing off CO2'],c:3,t:'single',r:'This is <b>metabolic acidosis</b> (pH and bicarb both low). The <b>lungs compensate within minutes</b> by increasing rate and depth to <b>blow off CO2</b>, which is acid \\u2014 lowering CO2 raises the pH back toward normal. That is exactly what <b>Kussmaul respirations</b> are.'},
{topic:'drugs',hot:true,q:'A patient in an acute asthma attack has orders for albuterol and fluticasone inhalers. Which does the nurse give first and why?',o:['Either order, since both are inhaled','Fluticasone, because inflammation must be treated before bronchospasm','Fluticasone, because it has the longer duration','Albuterol, because the bronchodilator opens the airway so the steroid can reach the small airways'],c:3,t:'single',r:'<b>Bronchodilator FIRST, wait, then the steroid, then RINSE.</b> Albuterol opens the road so the steroid can travel it. Steroid left in the mouth grows <b>Candida</b>. Fluticasone is <b>maintenance</b> and does nothing for an acute attack.'},
{topic:'drugs',hot:true,q:'A patient having an asthma attack asks to use their salmeterol inhaler. What is the nurse\'s response?',o:['Salmeterol should be doubled during an attack','Salmeterol works faster than albuterol in an attack','Use both inhalers together for a stronger effect','Salmeterol is long-acting maintenance and will not work fast enough; use the albuterol'],c:3,t:'single',r:'Same <b>-terol</b> ending, opposite job. <b>Short-acting = RESCUE (albuterol). Long-acting = MAINTENANCE (salmeterol).</b> Salmeterol is never used during an attack and is always paired with an inhaled steroid.'},
{topic:'drugs',hot:true,q:'A patient with hyperkalemia receives calcium gluconate. What is its purpose?',o:['To shift potassium into the cells','To stabilize the cardiac membrane against dysrhythmias','To remove potassium from the body','To correct the associated hypocalcemia'],c:1,t:'single',r:'In hyperkalemia the sequence is <b>PROTECT \\u2192 SHIFT \\u2192 REMOVE</b>. <b>Calcium gluconate protects the myocardium</b> while the other drugs work. <b>Insulin+D50 and albuterol SHIFT</b> potassium into cells. <b>Kayexalate and dialysis REMOVE</b> it.'},
{topic:'drugs',hot:true,q:'Which drug actually lowers total body potassium rather than shifting it?',o:['Regular insulin with dextrose','Sodium polystyrene sulfonate (Kayexalate)','Calcium gluconate','Nebulized albuterol'],c:1,t:'single',r:'<b>Only Kayexalate and dialysis REMOVE potassium.</b> Insulin and albuterol <b>shift</b> it into cells temporarily, and calcium gluconate <b>protects the heart</b> without changing the level at all. If the question asks what actually lowers the potassium, shifting agents are wrong.'},
{topic:'drugs',hot:true,q:'A patient taking spironolactone has a potassium of 5.8 mEq/L. What explains this?',o:['The result is a laboratory error','Spironolactone has no effect on potassium','Spironolactone is potassium-sparing and causes potassium retention','Spironolactone wastes potassium like other diuretics'],c:2,t:'single',r:'<b>Loop and thiazide diuretics WASTE potassium. Spironolactone KEEPS it.</b> It blocks aldosterone, and aldosterone is what normally excretes potassium. <b>ACE inhibitors and ARBs raise potassium for the same reason.</b> Teach the patient to avoid salt substitutes, which are potassium chloride.'},
{topic:'drugs',hot:true,q:'A patient with hypokalemia has an order for potassium chloride. Which action is correct?',o:['Dilute it and infuse on a pump after confirming urine output','Increase the rate to correct the level faster','Give it undiluted through a peripheral line','Give it IV push over 2 minutes'],c:0,t:'single',r:'<b>NEVER IV push potassium \\u2014 it is fatal.</b> Always dilute, always on a pump, never exceed the ordered rate, and never give it to a patient without adequate <b>urine output</b>. Also check the <b>magnesium</b> \\u2014 hypokalemia will not correct until magnesium is replaced.'},
{topic:'drugs',hot:false,q:'A patient on furosemide should be monitored for which electrolyte abnormality?',o:['Hypernatremia','Hyperkalemia','Hypokalemia','Hyperphosphatemia'],c:2,t:'single',r:'<b>Loop diuretics waste potassium</b>, along with magnesium and calcium. Monitor K\\u207a, teach potassium-rich foods, and watch for <b>digoxin toxicity</b> \\u2014 low potassium increases digoxin binding. Furosemide is also <b>ototoxic if pushed rapidly</b>.'},
{topic:'drugs',hot:false,q:'A patient is prescribed phosphate binders for hyperphosphatemia. When should they be taken?',o:['Only when phosphorus is above 6','One hour before meals','At bedtime on an empty stomach','With meals'],c:3,t:'single',r:'<b>Phosphate binders bind the phosphorus in FOOD</b>, so they must be taken <b>with meals</b>. Between meals there is nothing for them to bind and they do nothing.'},
