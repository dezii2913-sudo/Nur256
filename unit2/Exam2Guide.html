{topic:'airway',hot:true,q:'A nurse is caring for four patients. Who should the nurse assess FIRST?',o:['A pneumonia patient with a temp of 100.8°F','A patient with a chest tube and gentle tidaling in the water seal','An asthma patient whose wheezing has suddenly become a \'silent chest\'','A COPD patient with an O₂ sat of 90% on 2 L'],c:2,t:'single',r:'A silent chest = no air movement = impending respiratory failure. The COPD sat of 90% is acceptable (goal 88–92%), the low-grade fever is expected with pneumonia, and tidaling is normal. B is acute, unstable, and unexpected.'},
{topic:'blood',hot:true,q:'A patient receiving a unit of packed RBCs reports chills and low back pain 10 minutes into the transfusion. What is the nurse\'s FIRST action?',o:['Notify the provider while the transfusion continues','Slow the transfusion rate and recheck vital signs','Take a full set of vital signs before doing anything','Stop the blood and keep the normal saline line open'],c:3,t:'single',r:'These are signs of an acute hemolytic reaction. The FIRST action is to STOP the blood immediately while maintaining IV access with NS. Vitals, provider notification, and documentation come right after — but stopping the blood protects the patient now.'},
{topic:'blood',hot:true,q:'A nurse picks up a unit of blood from the blood bank but the patient is in the bathroom and the IV has infiltrated. The nurse cannot start the infusion. What is the BEST action?',o:['Start the blood slowly through the infiltrated IV and watch it','Return the blood to the bank since it cannot start in 30 min','Keep the blood at the bedside until a new IV can be placed','Put the blood in the unit refrigerator until the IV is restarted'],c:1,t:'single',r:'Blood must be started within 30 minutes of leaving the blood bank and must never sit warming at the bedside or be stored in a regular unit fridge. If you can\'t start it in time, return it to the blood bank.'},
{topic:'clinical',hot:true,q:'A post-op patient is restless and anxious with an O₂ sat of 93%. What should the nurse do FIRST?',o:['Document the anxiety as a normal post-op finding and continue','Call the provider to request a psychiatric consultation now','Reposition, encourage deep breathing, and reassess oxygenation','Administer the PRN sedative that is ordered for anxiety'],c:2,t:'single',r:'Restlessness and anxiety are EARLY signs of hypoxia — treat the oxygenation, not the "anxiety." Sedating a hypoxic patient is dangerous. Reposition, promote lung expansion, and reassess.'},
{topic:'airway',hot:true,q:'A nurse notes CONTINUOUS bubbling in the water-seal chamber of a patient\'s chest drainage system. The patient\'s breathing is becoming labored. What is the priority concern?',o:['The lung has fully re-expanded and the tube can be removed','The wall suction is set too low for the ordered pressure','An air leak that could progress to a tension pneumothorax','Normal functioning of the water-seal chamber during breathing'],c:2,t:'single',r:'Continuous water-seal bubbling = air leak. Combined with worsening respiratory status, suspect a developing tension pneumothorax — assess connections and the patient, and notify the provider.'},
{topic:'blood',hot:true,q:'Which patient finding during a transfusion is the MOST concerning and requires immediate action?',o:['The patient feels a little cold and asks for a blanket','The patient is anxious about needles','New crackles, dyspnea, and a jump in blood pressure','The IV site is slightly cool to touch'],c:2,t:'single',r:'New crackles + dyspnea + rising BP signal circulatory/fluid overload (TACO). Slow or stop the infusion and sit the patient up. The other findings are minor or non-urgent.'},
{topic:'pneumonia',hot:true,q:'A patient with pneumonia who was alert this morning is now confused and pulling at the sheets. The family says "that\'s not like him." What is the nurse\'s priority interpretation?',o:['Sundowning that can safely be ignored overnight','Normal aging that explains the change in behavior','A possible sign of worsening hypoxia or sepsis','Boredom from being confined to the room all day'],c:2,t:'single',r:'A NEW change in mental status — especially in an older adult with pneumonia — is a red flag for hypoxia, sepsis, or deterioration. Assess oxygenation and perfusion; don\'t dismiss it as expected.'},
{topic:'airway',hot:true,q:'A patient with a chest tube accidentally pulls the tube out of their chest. What should the nurse do FIRST?',o:['Reinsert the chest tube','Lay the patient flat and call radiology','Clamp the drainage tubing','Cover the site with sterile occlusive'],c:3,t:'single',r:'For a dislodged chest tube, immediately cover the insertion site with petroleum/occlusive gauze taped on THREE sides — this lets air escape but prevents air from re-entering and causing a tension pneumothorax. Then notify the provider.'},
{topic:'airway',hot:true,q:'A nurse must give morning meds, hang a new IV bag, ambulate a patient, and respond to a vent alarm. Which does the nurse address FIRST?',o:['Ambulation','Hanging the IV bag','Morning meds','The ventilator alarm'],c:3,t:'single',r:'A ventilator alarm is an airway/breathing issue and takes priority over routine tasks. ABCs first — always rule out a true emergency (disconnection, obstruction, distress) before scheduled care.'},
{topic:'airway',hot:false,q:'Which nursing actions are appropriate for a patient on a ventilator to prevent VAP? (Select all that apply)',o:['Keep the patient flat to promote rest','Keep the head of the bed at 30–45 degrees','Daily "sedation vacation" / readiness-to-wean assessment','Provide DVT and peptic ulcer prophylaxis','Perform oral care with chlorhexidine'],c:[1,2,3,4],t:'multi',r:'The VAP bundle: HOB elevated, chlorhexidine oral care, daily sedation interruption with wean assessment, and DVT/PUD prophylaxis. Lying flat raises aspiration risk and is wrong.'},
{topic:'clinical',hot:false,q:'A nurse delegates to assistive personnel (AP). Which task is appropriate to delegate?',o:['Teaching pursed-lip breathing to a new COPD patient','Interpreting an ABG result','Recording intake and output and reporting the values','Assessing a new transfusion reaction'],c:2,t:'single',r:'Measuring and recording I&O is within AP scope. Assessment, teaching, and interpretation require a nurse\'s judgment and cannot be delegated.'},
{topic:'clinical',hot:true,q:'Four patients need attention. Based on priority, who does the nurse see FIRST?',o:['Stable post-op patient requesting pain medication for a 6 of 10','Asking detailed questions about discharge teaching and follow-up','Due for scheduled oral antibiotics that are now 20 minutes late','Pulse oximetry just dropped to 84% with increased work of breathing'],c:3,t:'single',r:'A falling O₂ sat with increased work of breathing is an airway/breathing emergency — see this patient first. The others are important but stable and non-urgent.'},
{topic:'airway',hot:true,q:'A patient with a new tracheostomy suddenly has difficulty breathing and the tube appears dislodged. Which items at the bedside are MOST important right now? (Select all that apply)',o:['A box of oral medications','Spare trach tube (same size and one size smaller)','Obturator','Suction equipment','A manual resuscitation bag'],c:[1,2,3,4],t:'multi',r:'For an airway emergency you need the obturator, spare trach tubes (same + smaller), a resuscitation bag, and suction. Oral meds are irrelevant to the immediate airway threat.'},
{topic:'tb',hot:true,q:'A patient is admitted with suspected TB. Which action is the priority?',o:['Private room on airborne precautions with negative pressure','Draw blood cultures from two sites before any isolation','Standard precautions with a surgical mask for all visitors','Semi-private room with the door kept closed at all times'],c:0,t:'single',r:'TB is airborne — the FIRST priority is protecting others by placing the patient in a negative-pressure room with airborne precautions (staff in N95s). Diagnostics and care follow once isolation is set.'},
{topic:'pneumonia',hot:false,q:'Which assessment finding in a patient with pneumonia would the nurse report to the provider IMMEDIATELY?',o:['A productive cough bringing up thick yellow-green sputum','A weak, thready, rapid pulse with a falling blood pressure','Fatigue and mild dyspnea after ambulating in the hallway','A temperature of 100.6 degrees on the second hospital day'],c:1,t:'single',r:'A weak, thready, fast pulse with hypotension signals septic shock — a life-threatening complication of pneumonia. Report immediately. The other findings are expected with pneumonia.'},
{topic:'blood',hot:false,q:'The ONLY IV fluid that can be hung with a blood transfusion is:',o:['D5W','0.45% Normal Saline','Lactated Ringer\'s','0.9% Normal Saline'],c:3,t:'single',r:'This is a TRUE absolute — don\'t eliminate just because it says "only." Dextrose hemolyzes RBCs and LR\'s calcium promotes clotting. NS is genuinely the only compatible fluid.'},
{topic:'pneumonia',hot:true,q:'Which of the following is NOT part of the VAP bundle?',o:['Daily oral care with chlorhexidine','Elevate the head of the bed 30–45°','Keep the patient flat to promote rest','Daily sedation interruption / readiness-to-wean'],c:2,t:'single',r:'Three are real VAP-bundle elements. The impostor is B — keeping the patient flat INCREASES aspiration risk and is the opposite of the bundle. "NOT" questions hide one false action among true ones.'},
{topic:'resp',hot:true,q:'All of the following are EARLY signs of hypoxia EXCEPT:',o:['Anxiety','Restlessness','Tachycardia','Cyanosis'],c:3,t:'single',r:'Trap: cyanosis "looks like" hypoxia so it feels right. But cyanosis is a LATE sign — the early ones are restlessness, anxiety, and tachycardia. The EXCEPT is asking for the one that doesn\'t fit "early."'},
{topic:'airway',hot:true,q:'Which finding in a chest-tube patient is the ONLY one that signals an emergency requiring you to notify the provider?',o:['Continuous bubbling in the water-seal chamber','Gentle tidaling in the water seal','50 mL of serosanguineous drainage over a shift','Continuous bubbling in the suction chamber on wall suction'],c:0,t:'single',r:'Tidaling is normal, suction-chamber bubbling on wall suction is expected, and modest drainage is fine. Continuous WATER-SEAL bubbling = air leak / possible tension pneumothorax — the one true emergency here.'},
{topic:'tb',hot:false,q:'The TB skin test (Mantoux) is read by measuring which of the following — and which is the WRONG thing to measure?',o:['Measure the wheal size at injection','Measure induration; redness is the wrong thing to measure','Measure redness; induration is the wrong thing to measure','Measure warmth'],c:1,t:'single',r:'You measure INDURATION (the raised firm area), not redness — measuring redness is the classic trap. This is a "what\'s right vs. what\'s wrong" combo he likes.'},
{topic:'blood',hot:true,q:'Which action should the nurse take FIRST before starting a blood transfusion?',o:['Take a full set of baseline vital signs on the patient','Verify informed consent and the type and cross-match','Retrieve the unit of blood from the blood bank','Prime the transfusion tubing with normal saline'],c:1,t:'single',r:'All four happen — but "first" matters. Confirm consent and type & cross BEFORE retrieving blood (you don\'t pull blood you\'re not cleared to give). Order traps reward knowing the sequence, not just the steps.'},
{topic:'airway',hot:true,q:'Which is NOT an appropriate action for a dislodged chest tube?',o:['Tape an occlusive dressing on all 4 sides','Monitor for signs of tension pneumothorax','Notify the provider','Cover the site with petroleum gauze taped on 3 sides'],c:0,t:'single',r:'Taping all 4 sides traps air and can cause a tension pneumothorax — that\'s the wrong action the "NOT" is fishing for. Three sides lets air escape. The other options are all correct.'},
{topic:'copd',hot:true,q:'Which statement about oxygen in COPD is the BEST guidance?',o:['Keep SpO₂ at 100% at all times','Always give 100% oxygen to maximize saturation','Oxygen is never given to COPD patients','Target an SpO₂ of 88–92%'],c:3,t:'single',r:'Absolute-word traps: "always 100%," "never," and "100% at all times" are all false. The BEST guidance is the controlled target of 88–92% to avoid blunting the hypoxic drive.'},
{topic:'clinical',hot:true,q:'A patient has all of these orders. Which one should the nurse QUESTION (i.e., which is NOT appropriate)?',o:['For a fluid-overloaded HF patient: infuse 1 L NS over 1 hour','For hypovolemia: give an isotonic IV fluid bolus as ordered','For hyperkalemia: administer IV calcium gluconate as ordered','For suspected TB: place the patient on airborne precautions'],c:0,t:'single',r:'A rapid saline bolus in a fluid-overloaded heart-failure patient would worsen the overload — that\'s the inappropriate order to question. The other three are all correct. "Which to question" = find the wrong one.'},
{topic:'copd',hot:true,q:'In a severe asthma attack, which assessment finding is the MOST concerning?',o:['Audible wheezing throughout expiration','A sudden "silent chest" with no wheezing','Use of the rescue inhaler twice today','A respiratory rate of 24 breaths a minute'],c:1,t:'single',r:'Trap: wheezing "sounds worse," so people pick A. But a silent chest = no air movement = impending respiratory failure, the MOST concerning. Loud wheezing at least means air is moving.'},
{topic:'tb',hot:false,q:'Which is the ONLY confirmatory test for active TB?',o:['Mantoux skin test','Chest x-ray','Sputum culture (acid-fast bacilli)','QuantiFERON Gold blood test'],c:2,t:'single',r:'Skin test and IGRA show exposure; x-ray is suggestive. Sputum culture is the only one that CONFIRMS active disease. "Only/confirmatory" wording points to the definitive test.'},
{topic:'blood',hot:true,q:'Which is the BEST nursing response when a transfusion reaction is suspected?',o:['Stop the blood, keep NS running, and notify the provider','Document the findings and reassess in about 30 minutes','Slow the transfusion and keep watching for more symptoms','Give acetaminophen and continue the unit as prescribed'],c:0,t:'single',r:'Slowing it down (A) is the tempting "partial" answer, but the BEST/safest action is to STOP the blood entirely while maintaining IV access with NS, then notify. Don\'t keep infusing a possible reaction.'},
{topic:'clinical',hot:true,q:'Which patient should the nurse assess FIRST?',o:['Suddenly confused and restless with new-onset dyspnea','COPD patient with an oxygen saturation of 90 percent','Asking about discharge instructions for later today','Pneumonia patient with a temperature of 100.6 degrees'],c:0,t:'single',r:'Three are stable/expected; one is acute, unstable, unexpected. New confusion + restlessness + dyspnea = possible hypoxia/sepsis = see first. "First" questions reward acute-over-chronic thinking.'},
{topic:'blood',hot:false,q:'Which statement about blood transfusion timing is correct?',o:['Blood can sit at the bedside for up to 2 hours before starting','You may store blood in the unit refrigerator','A unit must be started within 30 minutes of leaving the blood bank','A unit may infuse over 6 hours'],c:2,t:'single',r:'The only correct statement: start within 30 minutes of pickup. A unit finishes within 4 hours (not 6), blood never sits warming at the bedside, and it\'s never stored in a regular unit fridge.'},
{topic:'resp',hot:true,q:'Which is NOT a true statement about ARDS?',o:['PEEP is used to keep alveoli open','High-flow oxygen alone usually corrects the hypoxemia','Chest x-ray shows bilateral infiltrates','The hallmark is hypoxemia refractory to oxygen'],c:1,t:'single',r:'The whole point of ARDS is that oxygen does NOT fix it — so B is the false statement the "NOT" wants. A, C, and D are all true.'},
{topic:'copd',hot:true,q:'Which of the following is NOT an appropriate intervention for a COPD patient?',o:['Pursed-lip breathing','Energy-conservation techniques','Routine high-flow 100% oxygen','Tripod positioning'],c:2,t:'single',r:'Routine 100% oxygen can suppress the hypoxic drive in COPD — the inappropriate action. Pursed-lip breathing, tripod position, and energy conservation are all correct.'},
{topic:'airway',hot:false,q:'Which is the ONLY scenario below where you would EXPECT continuous bubbling and consider it normal?',o:['Continuous bubbling right after the chest tube is dislodged','Continuous bubbling accompanied by worsening dyspnea and pain','Continuous bubbling in the water-seal chamber during quiet breathing','Continuous bubbling in the suction-control chamber on wall suction'],c:3,t:'single',r:'Continuous bubbling is expected ONLY in the suction-control chamber when on wall suction. In the water seal it means a leak. Combining "only" + "expect normal" narrows you to the suction chamber.'},
{topic:'tb',hot:true,q:'All of the following require AIRBORNE precautions EXCEPT:',o:['Tuberculosis, which requires a negative-pressure room','Measles, which spreads on small airborne particles','Varicella, which stays suspended in room air','Bacterial pneumonia, which requires droplet precautions'],c:3,t:'single',r:'TB, measles, and varicella are airborne ("My Chicken Hez TB"). Bacterial pneumonia is generally droplet, not airborne — the EXCEPT. Watch for the one that uses a different precaution type.'},
{topic:'blood',hot:false,q:'Which action by a new nurse during a transfusion would require the charge nurse to INTERVENE (i.e., which is WRONG)?',o:['Taking baseline vitals before starting','Priming the line with D5W','Verifying the patient with a second nurse','Staying with the patient for the first 15 minutes'],c:1,t:'single',r:'"Requires you to intervene" = spot the unsafe/wrong action. Priming with D5W will hemolyze the cells — only NS is used. The other three are all correct practice.'},
{topic:'resp',hot:true,q:'Which is the BEST first action for a patient who becomes dyspneic with new crackles during an IV infusion?',o:['Lay the patient flat to improve venous return quickly','Increase the IV rate to flush the line and clear it','Slow or stop the infusion and raise the head of the bed','Give the next scheduled antibiotic dose and reassess'],c:2,t:'single',r:'New crackles + dyspnea = fluid overload. BEST first action: reduce the fluid going in and sit them up to ease breathing. Lying flat or increasing the rate makes it worse.'},
{topic:'copd',hot:false,q:'Of the following, which is the LEAST likely to indicate that a patient is deteriorating?',o:['A sudden silent chest','An SpO₂ of 90% in a COPD patient','A rising/"normalizing" CO₂ in a tiring asthmatic','New restlessness and confusion'],c:1,t:'single',r:'"LEAST likely" flips the search — three are red flags, one is acceptable. 88–92% is the GOAL in COPD, so 90% is fine. Negative-direction words like LEAST work just like NOT/EXCEPT.'},
{topic:'clinical',hot:false,q:'After identifying fluid overload, the nurse slows the infusion and raises the head of the bed. These actions represent which step?',o:['Evaluation','Implementation','Assessment','Planning'],c:1,t:'single',r:'Performing the interventions (slowing the IV, repositioning) is IMPLEMENTATION — the "doing" step. This is the step your professor is emphasizing.'},
{topic:'clinical',hot:false,q:'A nurse writes: "Patient will maintain SpO₂ ≥ 92% throughout the shift." This is an example of which step?',o:['Evaluation','Assessment','Implementation','Planning'],c:3,t:'single',r:'A measurable, time-bound expected outcome is PLANNING (goal-setting). The intervention to achieve it (apply O₂) would be implementation.'},
{topic:'clinical',hot:false,q:'One hour after applying oxygen, the nurse rechecks the SpO₂ to see if it reached the goal. This is which step?',o:['Assessment','Diagnosis','Evaluation','Implementation'],c:2,t:'single',r:'Rechecking against the goal after an intervention is EVALUATION (did it work?). The first check before acting was assessment; the recheck to judge effectiveness is evaluation.'},
{topic:'clinical',hot:true,q:'A patient is dyspneic with an SpO₂ of 85%. Which action should the nurse take FIRST?',o:['Document the oxygen saturation','Notify the provider','Review the chart for the O₂ order history','Apply oxygen and reposition the patient'],c:3,t:'single',r:'This is a true emergency, so you ACT (implementation) rather than gather more data first. An SpO₂ of 85% with dyspnea needs immediate oxygen and repositioning — then notify/document.'},
{topic:'clinical',hot:true,q:'A patient reports new shortness of breath. There is no emergency apparent yet. What should the nurse do FIRST?',o:['Assess the patient (lung sounds, vitals, SpO₂)','Call respiratory therapy','Raise the head of the bed and leave the room','Administer a PRN bronchodilator'],c:0,t:'single',r:'When it is not an obvious emergency, ASSESS before acting. You gather data (lung sounds, vitals, SpO₂) before choosing an intervention. "Assess before act" is the most-tested ADPIE rule.'},
{topic:'clinical',hot:false,q:'The nurse determines that a patient has "Impaired gas exchange related to retained secretions." This statement is which step?',o:['Planning','Assessment','Diagnosis','Implementation'],c:2,t:'single',r:'Naming the problem after analyzing the data is DIAGNOSIS. It comes from assessment data and drives the plan and interventions.'},
{topic:'clinical',hot:true,q:'Place these in the correct ADPIE order: the nurse should do which FIRST when starting care for a new patient?',o:['Implement interventions','Evaluate outcomes','Set goals for the patient','Perform a head-to-toe assessment'],c:3,t:'single',r:'Assessment is always first — you cannot diagnose, plan, implement, or evaluate without data. Out-of-order options are a classic trap.'},
{topic:'pneumonia',hot:false,q:'Which of the following is an IMPLEMENTATION action for a patient with pneumonia? (Select all that apply)',o:['Reposition and assist with incentive spirometry','Auscultate breath sounds to gather data','Set a goal of "clear breath sounds by discharge"','Administer the prescribed antibiotic','Encourage 2–3 L of fluid per day'],c:[0,3,4],t:'multi',r:'Implementation = actions you perform: giving the antibiotic, encouraging fluids, repositioning/IS coaching. Auscultating is assessment; setting a goal is planning.'},
{topic:'blood',hot:false,q:'During a blood transfusion the patient develops chills and back pain. The nurse stops the blood and keeps NS running. Which step does stopping the blood represent?',o:['Diagnosis','Planning','Implementation','Assessment'],c:2,t:'single',r:'Stopping the blood is an IMPLEMENTATION action (a nursing intervention) — and the correct emergency one. Recognizing the chills/back pain as a reaction was the assessment that triggered it.'},
{topic:'clinical',hot:false,q:'Which statement is an appropriately written PLANNING outcome?',o:['"Patient will ambulate 50 feet without dyspnea by day 2"','"Administer albuterol by nebulizer as ordered"','"Auscultate the lung sounds every 4 hours this shift"','"Patient has crackles in both posterior lung bases"'],c:0,t:'single',r:'A good outcome is patient-centered, measurable, and time-bound — option C. A is an intervention (implementation), B is assessment data, and D is also an intervention/monitoring action.'},
{topic:'clinical',hot:false,q:'A nurse notes a patient\'s urine output rose from 15 mL/hr to 40 mL/hr after fluid resuscitation. Documenting that the fluid-deficit goal was MET is which step?',o:['Implementation','Diagnosis','Assessment','Evaluation'],c:3,t:'single',r:'Comparing the result to the goal and judging it "met" is EVALUATION. (Note: the urine rose because of the fluid resuscitation — deficit alone lowers urine; the treatment is what brought it back up.) This closes the loop — if the goal were not met, the nurse would revise the plan.'},
{topic:'airway',hot:false,q:'For a patient with a chest tube that becomes dislodged, applying petroleum gauze taped on 3 sides is which step of the nursing process?',o:['Assessment','Planning','Implementation','Evaluation'],c:2,t:'single',r:'Performing the emergency dressing is IMPLEMENTATION. Noticing the tube was out was assessment; watching for tension pneumothorax afterward would be evaluation.'},
{topic:'airway',hot:false,q:'A nurse is caring for a ventilated patient. Which IMPLEMENTATION actions help prevent VAP? (Select all that apply)',o:['Note the diagnosis of "risk for infection"','Provide daily sedation interruption per protocol','Perform oral care with chlorhexidine','Document the ventilator settings','Elevate the head of the bed 30–45°'],c:[1,2,4],t:'multi',r:'The interventions you DO (HOB up, chlorhexidine care, sedation vacation) are implementation. Documenting settings is closer to assessment/recording; writing the diagnosis is the D step.'},
{topic:'clinical',hot:false,q:'The nurse asks the patient to rate their dyspnea and records it. Which step is this?',o:['Implementation of the plan','Evaluation of the response','Planning the expected outcomes','Assessment, gathering subjective data'],c:3,t:'single',r:'Collecting the patient\'s reported experience is ASSESSMENT — specifically subjective data. Assessment includes BOTH what you observe (objective) and what the patient tells you (subjective).'},
{topic:'copd',hot:false,q:'A COPD patient\'s SpO₂ is 90%. The nurse\'s plan targets 88–92%. The nurse documents the target is being met and continues monitoring. This is which step?',o:['Evaluation','Implementation','Diagnosis','Assessment'],c:0,t:'single',r:'Comparing the current value (90%) against the goal (88–92%) and judging it met is EVALUATION. Note: don\'t "fix" a 90% in COPD — it\'s within the target.'},
{topic:'clinical',hot:true,q:'Which option is the BEST example of the IMPLEMENTATION step for a patient with thick respiratory secretions?',o:['Encourage fluids, do chest physiotherapy, assist with coughing','"Patient will expectorate secretions by the end of shift"','"Ineffective airway clearance related to thick secretions"','Auscultate the lungs for adventitious breath sounds'],c:0,t:'single',r:'The hands-on actions (fluids, CPT, coughing help) are IMPLEMENTATION. A is the diagnosis, C is the planning outcome, and D is assessment.'},
{topic:'copd',hot:false,q:'A nurse teaches a newly diagnosed asthma patient how to use a peak flow meter. Patient teaching is part of which step?',o:['Assessment','Implementation','Planning','Evaluation'],c:1,t:'single',r:'Patient education is an IMPLEMENTATION action — it\'s an intervention you carry out. Checking whether the patient can correctly demonstrate it afterward would be evaluation.'},
{topic:'clinical',hot:false,q:'Which sequence correctly reflects the nursing process for a patient with new hypoxia?',o:['Apply O₂ → assess lung sounds → set a goal → evaluate','Set a goal → apply O₂ → assess → diagnose','Assess','Diagnose → evaluate → assess → implement'],c:2,t:'single',r:'Correct ADPIE flow: Assess → Diagnose → Plan → Implement → Evaluate. The other sequences scramble the order, which is the trap in process-order questions.'},
{topic:'clinical',hot:false,q:'Which of these is an EVALUATION statement?',o:['"Fluid volume excess related to heart failure and sodium load"','"Patient is short of breath with crackles in both lung bases"','"Administer furosemide 40 mg IV as prescribed this morning"','"After diuretics, lung sounds are clear and weight is down 2 kg"'],c:3,t:'single',r:'Option C compares the outcome to the goal after an intervention — that\'s EVALUATION. A is assessment data, B is implementation, D is the nursing diagnosis.'},
{topic:'clinical',hot:true,q:'A nurse suspects a patient is deteriorating but the situation is not yet an emergency. Per the nursing process, what should the nurse do FIRST?',o:['Begin documenting the concern in the record','Administer the PRN medications that are ordered','Complete a focused assessment of the patient','Notify the rapid response team right away'],c:2,t:'single',r:'When it isn\'t a clear emergency, gather data first — a focused ASSESSMENT guides what to do next. Acting or escalating before assessing skips a step (unless the patient is in obvious crisis).'},
{topic:'pneumonia',hot:false,q:'The nurse plans care for a patient with pneumonia and lists "improved airway clearance" as a goal. Prioritizing this goal is part of which step?',o:['Assessment','Evaluation','Implementation','Planning'],c:3,t:'single',r:'Setting and prioritizing goals/outcomes is PLANNING. The interventions chosen to reach the goal (suction, CPT, fluids) are implementation.'},
{topic:'copd',hot:false,q:'During implementation, a nurse gives a bronchodilator BEFORE the inhaled corticosteroid and teaches the patient to rinse afterward. Which best describes these actions?',o:['They are planning outcomes written for the care plan','They are correctly performed implementation actions','They are evaluation steps measuring the response','They are assessment activities that gather baseline data'],c:1,t:'single',r:'Administering meds in the correct order and teaching are IMPLEMENTATION — and these are done correctly (bronchodilator first opens airways; rinsing prevents thrush).'},
{topic:'clinical',hot:false,q:'Which nursing action during ADPIE can be DELEGATED to assistive personnel, leaving the nurse to handle the steps that require judgment?',o:['Evaluating whether the expected outcomes were met','Formulating the nursing diagnosis from the assessment','Recording intake and output and reporting the values','Performing the admission assessment on a new patient'],c:2,t:'single',r:'Assessment, diagnosis, and evaluation require nursing judgment and cannot be delegated. Routine data-collection tasks like measuring/recording I&O can be delegated to AP.'},
{topic:'airway',hot:false,q:'CAUSE — What is the underlying problem in asthma?',o:['Infectious fluid filling and consolidating the alveoli','Air trapped in the pleural space compressing the lung','Irreversible destruction of the alveolar walls','Reversible airway inflammation and bronchoconstriction'],c:3,t:'single',r:'Asthma = REVERSIBLE inflammation + bronchoconstriction + mucus in hyperreactive airways. (Irreversible destruction = emphysema; alveolar fluid = pneumonia/ARDS; pleural air = pneumothorax.)'},
{topic:'copd',hot:true,q:'MANIFESTS — During a severe asthma attack, which finding is the MOST alarming?',o:['Loud expiratory wheezing','Prolonged expiration','A sudden silent chest','Coughing'],c:2,t:'single',r:'A silent chest means almost no air is moving — impending respiratory failure. Loud wheezing at least means air movement. Knowing how it MANIFESTS tells you which sign is the emergency.'},
{topic:'copd',hot:true,q:'TREATMENT — A patient is mid-asthma attack with audible wheezing and dyspnea. Which medication is the FIRST-line treatment?',o:['Short-acting beta agonist (albuterol)','Leukotriene receptor blocker','Inhaled corticosteroid daily','Long-acting beta agonist (salmeterol)'],c:0,t:'single',r:'A SABA (albuterol) is the rescue med — it bronchodilates fast. Inhaled steroids and LABAs are controllers, not rescue. Knowing the treatment lets you pick first-line vs maintenance.'},
{topic:'copd',hot:false,q:'CAUSE — What most commonly causes COPD?',o:['Long-term cigarette smoking','A bacterial infection','A genetic clotting disorder','An allergic reaction'],c:0,t:'single',r:'COPD is chronic, largely irreversible airflow limitation usually from long-term smoking. Cause drives everything: air trapping → barrel chest → CO₂ retention.'},
{topic:'copd',hot:false,q:'MANIFESTS — Which physical finding is classic for chronic COPD?',o:['A positive Trousseau sign on inflation','Tracheal deviation toward the good side','Rust-colored sputum on the morning specimen','Barrel chest with prolonged expiration'],c:3,t:'single',r:'Chronic air trapping enlarges the AP diameter → barrel chest, plus prolonged expiration and pursed-lip breathing. (Tracheal deviation = tension pneumo; rust sputum = pneumonia; Trousseau = hypocalcemia.)'},
{topic:'copd',hot:false,q:'TREATMENT — What is the appropriate oxygen goal for most COPD patients?',o:['100%','Below 85%','88–92%','95–100%'],c:2,t:'single',r:'Target 88–92% to oxygenate without blunting the hypoxic drive. This is a treatment fact that flows from the cause (chronic CO₂ retention).'},
{topic:'pneumonia',hot:false,q:'CAUSE — What is physically happening to the alveoli in pneumonia?',o:['They collapse because surfactant production has stopped','They are compressed by air trapped in the pleural space','They fill with inflammatory fluid and exudate from infection','They over-inflate and trap air behind narrowed airways'],c:2,t:'single',r:'Infection inflames the alveoli and fills them with fluid/exudate, blocking gas exchange. That cause explains the crackles, dullness, and hypoxia you see.'},
{topic:'pneumonia',hot:false,q:'MANIFESTS — Which sputum color is classically associated with pneumococcal pneumonia?',o:['Rust-colored','Clear','Black','White and frothy'],c:0,t:'single',r:'Rust-colored sputum is the classic clue for Streptococcus pneumoniae. (Frothy/pink = pulmonary edema.) Manifestations point you to the cause.'},
{topic:'pneumonia',hot:false,q:'MANIFESTS — In an older adult, which may be the EARLIEST sign of pneumonia?',o:['New confusion','A high fever','Weight gain','Clubbing of the fingers'],c:0,t:'single',r:'Older adults often show new confusion before classic fever/cough — a key manifestation to recognize and never dismiss.'},
{topic:'pneumonia',hot:false,q:'TREATMENT — Which nursing interventions are appropriate for pneumonia? (Select all that apply)',o:['Encourage 2–3 L of fluid per day','Keep the patient flat and still','Incentive spirometry and coughing/deep breathing','Reposition regularly','Administer antibiotics after cultures are obtained'],c:[0,2,3,4],t:'multi',r:'Fluids, lung expansion, antibiotics (after cultures), and repositioning all treat pneumonia. Keeping the patient flat worsens secretions and gas exchange.'},
{topic:'tb',hot:false,q:'CAUSE — How is tuberculosis transmitted?',o:['Contaminated food','Bloodborne contact','Skin-to-skin contact','Airborne droplet nuclei'],c:3,t:'single',r:'TB is airborne — which directly dictates the treatment/precaution (negative-pressure room, N95). Cause → intervention.'},
{topic:'airway',hot:false,q:'MANIFESTS — Which set of symptoms suggests active TB?',o:['Peaked T waves with muscle weakness and abdominal cramping','Productive cough over 3 weeks, hemoptysis, night sweats','Sudden chest pain with tracheal deviation and absent sounds','Barrel chest with prolonged expiration and pursed-lip breathing'],c:1,t:'single',r:'Chronic cough, hemoptysis, night sweats, and weight loss are the hallmark TB manifestations. The other sets point to pneumothorax, COPD, and hyperkalemia.'},
{topic:'tb',hot:false,q:'TREATMENT — A patient on rifampin should be taught that the drug commonly:',o:['Raises potassium','Causes hearing loss','Turns body fluids orange','Causes a barrel chest'],c:2,t:'single',r:'Rifampin harmlessly turns urine/sweat/tears orange (and stains soft contacts). Knowing treatment side effects answers a whole class of questions.'},
{topic:'resp',hot:false,q:'CAUSE — What makes ARDS different from ordinary hypoxia?',o:['The hypoxemia improves quickly once oxygen is applied','The hypoxemia is refractory and does not improve with oxygen','It affects only one lung rather than both lung fields','It is caused by airway narrowing rather than alveolar injury'],c:1,t:'single',r:'ARDS hallmark = refractory hypoxemia from flooded alveoli + surfactant washout. That cause is WHY oxygen alone fails and PEEP/prone positioning are needed.'},
{topic:'resp',hot:false,q:'TREATMENT — Which intervention is specific to improving oxygenation in ARDS?',o:['High-flow oxygen alone','Keeping the patient supine at all times','Prone positioning about every 12 hours','Fluid boluses'],c:2,t:'single',r:'Prone positioning ~q12h improves oxygenation in ARDS. Oxygen alone won\'t fix refractory hypoxemia — that ties back to the cause.'},
{topic:'pneumonia',hot:false,q:'CAUSE — What causes atelectasis in a post-op patient?',o:['Alveolar collapse from shallow breathing, pain, or secretions','Infectious exudate filling and consolidating the alveoli','Bronchospasm narrowing the small airways during expiration','Air entering the pleural space and compressing the lung'],c:0,t:'single',r:'Post-op shallow breathing/pain/immobility collapses alveoli = atelectasis. Cause points directly to the fix (deep breathing, IS, ambulation).'},
{topic:'pneumonia',hot:true,q:'TREATMENT — Which is the priority nursing intervention to prevent and treat atelectasis?',o:['Chest physiotherapy postponed until the fever resolves','Incentive spirometry, coughing, and early ambulation','Fluid restriction with humidified oxygen by face mask','Strict bed rest with the head of the bed kept flat'],c:1,t:'single',r:'Lung-expansion measures (IS with a 3-second hold, coughing/deep breathing, ambulation) reopen alveoli. Pain control matters so the patient CAN breathe deeply.'},
{topic:'airway',hot:false,q:'MANIFESTS — Which findings indicate a TENSION pneumothorax? (Select all that apply)',o:['Tracheal deviation away from the affected side','Absent breath sounds on the affected side','Jugular vein distention','Rust-colored sputum','Severe respiratory distress and hypotension'],c:[0,1,2,4],t:'multi',r:'Tension pneumothorax: tracheal deviation, absent breath sounds, distress/hypotension, and JVD from compressed great vessels. Rust sputum belongs to pneumonia.'},
{topic:'airway',hot:false,q:'TREATMENT — A chest tube patient suddenly has continuous bubbling in the water-seal chamber. What does this mean and what is the concern?',o:['The lung has fully re-expanded around the chest tube','An air leak that can progress to a tension pneumothorax','Normal water-seal function that needs no intervention','The wall suction pressure is set too low for the order'],c:1,t:'single',r:'Continuous water-seal bubbling = air leak; with worsening status, suspect a developing tension pneumothorax. (Tidaling, by contrast, is normal.)'},
{topic:'resp',hot:false,q:'Crackles heard on auscultation most often indicate:',o:['Narrowed airways','Upper airway obstruction','Fluid in the alveoli','Pleural friction'],c:2,t:'single',r:'Crackles = fluid in alveoli (CHF, pneumonia).'},
{topic:'resp',hot:true,q:'Which adventitious sound is a medical emergency?',o:['Rhonchi','Wheezes','Stridor','Fine crackles'],c:2,t:'single',r:'Stridor = upper airway obstruction, an emergency.'},
{topic:'resp',hot:false,q:'Clubbing of the fingers is a sign of:',o:['Dehydration','Acute infection','Hyperkalemia','Chronic hypoxia'],c:3,t:'single',r:'Clubbing reflects chronic hypoxia (lung/cardiac disease).'},
{topic:'resp',hot:false,q:'A barrel chest is most associated with:',o:['COPD/emphysema','Pneumonia','Pleural effusion','Asthma'],c:0,t:'single',r:'Increased AP diameter (barrel chest) is classic for COPD/emphysema.'},
{topic:'resp',hot:false,q:'The most common type of atelectasis is:',o:['Chronic','Nonobstructive','Obstructive','Compression'],c:2,t:'single',r:'Obstructive atelectasis (blockage → gas reabsorption → collapse) is most common.'},
{topic:'resp',hot:false,q:'Which interventions PREVENT atelectasis in a post-op patient? (Select all that apply)',o:['Turning every 2 hours','Early ambulation','Deep breathing and coughing','Incentive spirometry','Bed rest in supine position'],c:[0,1,2,3],t:'multi',r:'Lung expansion + mobility prevent atelectasis. Prolonged supine bed rest worsens it.'},
{topic:'resp',hot:false,q:'The hallmark of ARDS is:',o:['A loud productive cough','Expiratory wheezing throughout','Bradycardia with hypotension','Hypoxemia refractory to oxygen'],c:3,t:'single',r:'Refractory hypoxemia (O₂ doesn\'t help) + bilateral infiltrates = ARDS.'},
{topic:'resp',hot:false,q:'Which ventilator strategy is used in ARDS?',o:['No humidification','Low FiO₂ only','Routine extubation','PEEP'],c:3,t:'single',r:'PEEP keeps alveoli open to improve oxygenation in ARDS.'},
{topic:'resp',hot:false,q:'The earliest sign of hypoxia is:',o:['Bradycardia','Restlessness','Cyanosis','Coma'],c:1,t:'single',r:'Restlessness/anxiety appears first; cyanosis is late.'},
{topic:'resp',hot:false,q:'A patient with acute tracheobronchitis should AVOID which medication?',o:['Antibiotics','Antipyretics','Analgesics','Antihistamines'],c:3,t:'single',r:'Antihistamines dry secretions, making them harder to clear.'},
{topic:'resp',hot:false,q:'Which statement about ventilation and perfusion is correct?',o:['Ventilation is blood flow','Perfusion means air movement','They are unrelated','A V/Q mismatch impairs gas exchange'],c:3,t:'single',r:'Ventilation (air) and perfusion (blood) must match; a mismatch impairs gas exchange.'},
{topic:'resp',hot:false,q:'Cyanosis is best described as:',o:['An early sign of hypoxia','A late sign of hypoxia','Normal in older adults','A sign of fluid overload'],c:1,t:'single',r:'Cyanosis is a LATE indicator of hypoxia.'},
{topic:'resp',hot:false,q:'Which symptoms suggest acute respiratory failure is progressing to a LATE/critical stage? (Select all that apply)',o:['Restlessness only','Central cyanosis','Diaphoresis','Confusion','Lethargy'],c:[1,2,3,4],t:'multi',r:'Confusion, cyanosis, diaphoresis, and lethargy are late/progressive signs. Isolated restlessness is early.'},
{topic:'resp',hot:false,q:'A patient on mechanical ventilation suddenly desaturates. The nurse should first:',o:['Increase the rate of the continuous tube feeding','Assess the patient and check the airway and tubing','Document the reading and wait for the next check','Lower the head of the bed to improve circulation'],c:1,t:'single',r:'Always assess the patient and check airway/equipment first (DOPE: Displacement, Obstruction, Pneumothorax, Equipment).'},
{topic:'resp',hot:false,q:'Incentive spirometry technique should instruct the patient to:',o:['Use it once daily','Breathe rapidly and shallowly','Inhale slowly and hold for 3 seconds','Exhale forcefully into the device'],c:2,t:'single',r:'Slow deep inhalation with a 3-second hold maximizes alveolar expansion.'},
{topic:'resp',hot:false,q:'Tidal volume is best defined as:',o:['Air moved in and out with each normal breath','The total capacity of both lungs combined','The maximum volume that can be exhaled','Air remaining in the lungs after exhalation'],c:0,t:'single',r:'Tidal volume = the air moved with each normal breath.'},
{topic:'resp',hot:false,q:'A patient with restlessness, tachycardia, and air hunger but pink skin is showing ____ signs of respiratory compromise.',o:['early','late','terminal','no'],c:0,t:'single',r:'These are early/compensatory signs — intervene now, before cyanosis appears.'},
{topic:'pneumonia',hot:false,q:'The most common bacterial cause of community-acquired pneumonia is:',o:['MRSA colonization','Streptococcus pneumoniae','Pseudomonas species','Klebsiella pneumoniae'],c:1,t:'single',r:'S. pneumoniae is the leading CAP organism.'},
{topic:'pneumonia',hot:false,q:'Hospital-acquired pneumonia (HAP) is defined as developing:',o:['Before admission','48 hours or more after admission','Only in the ICU','Within 24 hours of admission'],c:1,t:'single',r:'HAP develops ≥48 hours after admission and was not incubating at admit.'},
{topic:'pneumonia',hot:false,q:'Which assessment findings are expected in pneumonia? (Select all that apply)',o:['Hyperresonance to percussion','Crackles','Pleuritic chest pain','Dullness to percussion','Purulent productive cough'],c:[1,2,3,4],t:'multi',r:'Consolidation produces crackles and DULLNESS (not hyperresonance), plus purulent cough and pleuritic pain.'},
{topic:'pneumonia',hot:false,q:'Aspiration pneumonia most commonly affects the:',o:['Right lung','Pleural space','Left upper lobe','Left lower lobe'],c:0,t:'single',r:'The right mainstem bronchus is straighter and wider → aspiration favors the right.'},
{topic:'pneumonia',hot:false,q:'Which interventions are part of the VAP bundle? (Select all that apply)',o:['Sedation vacations','HOB elevated 30-45°','DVT prophylaxis','Keeping patient supine and flat','Daily oral care with chlorhexidine'],c:[0,1,2,4],t:'multi',r:'The VAP bundle includes HOB elevation, oral chlorhexidine, sedation vacations, DVT and stress ulcer prophylaxis. Flat positioning increases aspiration.'},
{topic:'pneumonia',hot:false,q:'An older adult with pneumonia may present atypically with:',o:['Severe chest pain only','No symptoms ever','Confusion and weakness','High spiking fevers only'],c:2,t:'single',r:'Elderly patients often show confusion, weakness, and anorexia rather than classic fever.'},
{topic:'pneumonia',hot:false,q:'Rusty or blood-tinged sputum is most associated with:',o:['Pulmonary edema','Viral bronchitis','Lung abscess','Pneumococcal pneumonia'],c:3,t:'single',r:'Rusty sputum classically suggests pneumococcal pneumonia.'},
{topic:'pneumonia',hot:false,q:'Foul-smelling sputum suggests:',o:['Viral upper respiratory tract infection','Lung abscess or anaerobic infection','Asthma with a superimposed viral cold','Pulmonary edema from left-sided failure'],c:1,t:'single',r:'Foul-smelling sputum points to lung abscess/anaerobic or bronchiectasis.'},
{topic:'pneumonia',hot:false,q:'The recommended fluid intake for a patient with pneumonia (no contraindication) is:',o:['500 mL/day','Restrict to 1 L/day','2-3 L/day','NPO'],c:2,t:'single',r:'2-3 L/day thins and mobilizes secretions.'},
{topic:'pneumonia',hot:false,q:'Safe endotracheal tube cuff pressure is:',o:['30-35 mmHg','10-15 mmHg','40-45 mmHg','20-25 mmHg'],c:3,t:'single',r:'20-25 mmHg; too high causes necrosis, too low allows aspiration.'},
{topic:'pneumonia',hot:false,q:'Which items must be kept at the bedside of a patient with a tracheostomy? (Select all that apply)',o:['Suction equipment','Smaller-size spare trach','Obturator','Same-size spare trach','Oral airway only'],c:[0,1,2,3],t:'multi',r:'Obturator, both spare trachs, and suction equipment must be at the bedside.'},
{topic:'pneumonia',hot:false,q:'A late complication of tracheostomy is:',o:['Tracheal stenosis','Pneumothorax','Tube dislodgement','Bleeding'],c:0,t:'single',r:'Tracheal stenosis is a late complication; bleeding and pneumothorax are early.'},
{topic:'pneumonia',hot:false,q:'The treatment for a pleural effusion to remove fluid is:',o:['Intubation','Spirometry','Bronchoscopy','Thoracentesis'],c:3,t:'single',r:'Thoracentesis drains pleural fluid; sit the patient upright and watch for pneumothorax after.'},
{topic:'pneumonia',hot:false,q:'Signs of septic shock (a pneumonia complication) include: (Select all that apply)',o:['Fatigue','Hypotension','Bradycardia with hypertension','Weak, thready, rapid pulse','Respiratory failure'],c:[0,1,3,4],t:'multi',r:'Septic shock = hypotension, weak/thready tachycardic pulse, fatigue, respiratory failure.'},
{topic:'copd',hot:false,q:'Continuous bubbling in the WATER SEAL chamber of a chest tube indicates:',o:['Suction is off','Normal function','An air leak','Lung re-expansion'],c:2,t:'single',r:'Continuous water-seal bubbling = air leak; notify the provider.'},
{topic:'copd',hot:false,q:'If a chest tube is accidentally pulled out, the nurse should:',o:['Cover the site with gauze taped down on all four sides','Cover with occlusive gauze taped on three sides only','Clamp the chest tube and notify the provider immediately','Reinsert the tube using sterile technique at the bedside'],c:1,t:'single',r:'Tape gauze on 3 sides — air escapes, none enters, preventing tension pneumothorax.'},
{topic:'copd',hot:false,q:'Which chest tube practices are correct? (Select all that apply)',o:['Submerge end in sterile water if it disconnects','Keep gauze at bedside','Routinely milk/strip the tubing','Tidaling in water seal is normal','Keep system below chest level'],c:[0,1,3,4],t:'multi',r:'Keep below chest level, gauze ready, expect tidaling, and re-establish a water seal if disconnected. Do NOT routinely milk/strip tubing.'},
{topic:'copd',hot:false,q:'The oxygen saturation goal for a patient with COPD is:',o:['75-80%','100%','88-92%','95-99%'],c:2,t:'single',r:'88-92% avoids suppressing the hypoxic drive.'},
{topic:'copd',hot:false,q:'During a severe asthma attack, the sudden ABSENCE of wheezing indicates:',o:['Impending respiratory failure','Less oxygen is now needed','The attack has fully resolved','Improvement in air movement'],c:0,t:'single',r:'A silent chest = no air moving = impending respiratory failure.'},
{topic:'copd',hot:false,q:'Which manifestations are characteristic of asthma? (Select all that apply)',o:['Wheezing','Cough','Chest tightness','Reversible obstruction','Permanent alveolar destruction'],c:[0,1,2,3],t:'multi',r:'Asthma = wheezing, tightness, cough, and REVERSIBLE obstruction. Alveolar destruction is emphysema.'},
{topic:'copd',hot:false,q:'A patient using an inhaled corticosteroid should be taught to:',o:['Use it before the bronchodilator','Rinse the mouth after use','Hold breath for 30 seconds','Use it for acute attacks'],c:1,t:'single',r:'Rinse the mouth to prevent oral candidiasis (thrush). Bronchodilator goes first, steroid second.'},
{topic:'copd',hot:false,q:'The confirmatory diagnostic test for active TB is:',o:['CBC','Sputum culture','Chest x-ray','Mantoux skin test'],c:1,t:'single',r:'Sputum culture for acid-fast bacilli confirms active TB.'},
{topic:'copd',hot:false,q:'A Mantoux (PPD) test is read in 48-72 hours by measuring:',o:['The wheal','Warmth','Redness','Induration'],c:3,t:'single',r:'Measure the induration (raised firm area), not redness.'},
{topic:'copd',hot:false,q:'Which precautions and teaching apply to a patient on RIPE therapy for TB? (Select all that apply)',o:['Report vision changes with ethambutol','Stop meds once feeling better','Airborne isolation with N95','Rifampin turns body fluids orange','Adherence for the full 6-12 months'],c:[0,2,3,4],t:'multi',r:'Airborne precautions, expect orange fluids (rifampin), report visual changes (ethambutol = optic neuritis), and complete the full course. Stopping early causes resistance.'},
{topic:'copd',hot:false,q:'Before initiating a blood transfusion, the nurse must: (Select all that apply)',o:['Obtain baseline vital signs','Verify informed consent','Establish a patent IV with normal saline','Prime tubing with D5W','Confirm type and cross-match'],c:[0,1,2,4],t:'multi',r:'Consent, type/cross, patent IV with NS, baseline vitals, and two-nurse verification. Never use dextrose (hemolyzes RBCs).'},
{topic:'copd',hot:true,q:'A patient develops chills, fever, and back pain 10 minutes into a transfusion. The nurse\'s FIRST action is to:',o:['Administer acetaminophen and keep infusing','Slow the infusion rate and continue to watch','Document the reaction and finish the unit','Stop the blood and keep the NS line open'],c:3,t:'single',r:'STOP the blood immediately and maintain IV access with NS, then notify the provider.'},
{topic:'resp',hot:false,q:'While auscultating, the nurse hears a high-pitched, musical sound on expiration. This is documented as:',o:['Crackles (rales)','Pleural friction rub','Stridor','Wheezes'],c:3,t:'single',r:'Wheezes are high-pitched musical sounds from narrowed airways, often on expiration (asthma, COPD).'},
{topic:'resp',hot:false,q:'A barrel-shaped chest with an increased anteroposterior diameter is a classic finding in:',o:['Asthma','Chronic COPD/emphysema','Pneumonia','Pleural effusion'],c:1,t:'single',r:'Chronic air trapping in COPD/emphysema produces the barrel chest (increased AP diameter).'},
{topic:'resp',hot:false,q:'Which finding is the EARLIEST sign of hypoxia?',o:['Restlessness/anxiety','Clubbing of fingers','Bradycardia','Cyanosis'],c:0,t:'single',r:'Restlessness and anxiety are early hypoxia signs. Cyanosis is late; clubbing reflects chronic hypoxia.'},
{topic:'resp',hot:true,q:'A post-op patient refuses to deep breathe due to pain and develops diminished breath sounds at the right base. The priority is to prevent:',o:['Pneumothorax','Pleural effusion','Pulmonary embolism','Atelectasis'],c:3,t:'single',r:'Shallow breathing collapses alveoli → atelectasis. Encourage incentive spirometry, coughing, deep breathing.'},
{topic:'resp',hot:false,q:'Which are diagnostic criteria/hallmarks of acute respiratory failure? (Select all that apply)',o:['PaCO₂ greater than 50 mmHg','pH greater than 7.50','PaO₂ less than 60 mmHg','pH less than 7.35','SpO₂ of 99%'],c:[0,2,3],t:'multi',r:'ARF: PaO₂ under 60, PaCO₂ over 50, and pH under 7.35. SpO₂ 99% and alkalotic pH do not fit.'},
{topic:'resp',hot:false,q:'The hallmark of acute respiratory distress syndrome (ARDS) is:',o:['A high PaO2 with a normal alveolar-arterial gradient','Hypoxemia that improves quickly with supplemental oxygen','A productive green cough with focal consolidation','Refractory hypoxemia that does not improve with oxygen'],c:3,t:'single',r:'ARDS is defined by refractory hypoxemia — low O₂ that stays low despite high supplemental oxygen.'},
{topic:'pneumonia',hot:false,q:'A patient develops a fever, productive cough, and an infiltrate 72 hours after admission. This is classified as:',o:['Fungal pneumonia','Community-acquired pneumonia','Aspiration pneumonia','Hospital-acquired pneumonia'],c:3,t:'single',r:'Pneumonia developing 48+ hours after admission = hospital-acquired (nosocomial).'},
{topic:'pneumonia',hot:false,q:'Which interventions are part of the ventilator-associated pneumonia (VAP) bundle? (Select all that apply)',o:['Keep the patient flat','DVT and peptic ulcer prophylaxis','Daily sedation interruption/readiness to wean','Oral care with chlorhexidine','Elevate head of bed 30-45 degrees'],c:[1,2,3,4],t:'multi',r:'VAP bundle: HOB elevated, daily sedation vacation/wean assessment, oral chlorhexidine care, and DVT/PUD prophylaxis. Keeping flat increases aspiration risk.'},
{topic:'pneumonia',hot:false,q:'Aspiration pneumonia most commonly affects which area of the lungs?',o:['Both apices affected about equally','The left upper lobe most commonly','The pleural space rather than lung','Right lung, via the right main bronchus'],c:3,t:'single',r:'The right main bronchus is wider and more vertical, so aspirated material tends to go right.'},
{topic:'pneumonia',hot:false,q:'Rust-colored sputum is most classically associated with:',o:['A viral pneumonia syndrome','Streptococcus pneumoniae','Mycobacterium tuberculosis','Pseudomonas aeruginosa'],c:1,t:'single',r:'Rust-colored sputum classically suggests pneumococcal (Strep pneumoniae) pneumonia.'},
{topic:'airway',hot:false,q:'The recommended cuff pressure for an endotracheal or tracheostomy tube is:',o:['20-25 mmHg','50 mmHg','30-40 mmHg','5-10 mmHg'],c:0,t:'single',r:'Keep cuff pressure 20-25 mmHg — high enough to seal, low enough to avoid tracheal necrosis.'},
{topic:'airway',hot:false,q:'Which items should be kept at the bedside of a patient with a new tracheostomy? (Select all that apply)',o:['A scalpel','Resuscitation bag','Spare trach tube (same size and one smaller)','Obturator','Suction equipment'],c:[1,2,3,4],t:'multi',r:'Keep obturator, spare trach tubes (same and smaller), suction, and a manual resuscitation bag. A scalpel is not standard bedside trach equipment.'},
{topic:'airway',hot:false,q:'The nurse notes continuous bubbling in the WATER SEAL chamber of a chest drainage system. This indicates:',o:['The lung has re-expanded','Normal functioning','An air leak in the system','The suction is too low'],c:2,t:'single',r:'Continuous bubbling in the water-seal chamber signals an air leak — assess connections; persistent leak with worsening status can mean tension pneumothorax.'},
{topic:'airway',hot:false,q:'Which actions are correct for chest tube management? (Select all that apply)',o:['Routinely clamp the tube during transport','Tape connections securely','Keep an occlusive dressing and clamp at the bedside','Keep the drainage system below chest level','If the tube is dislodged, cover with petroleum gauze taped on 3 sides'],c:[1,2,3,4],t:'multi',r:'System below chest, secure taped connections, 3-sided dressing if dislodged (lets air escape, prevents tension pneumo), and emergency supplies at bedside. Routine clamping is dangerous — it can cause tension pneumothorax.'},
{topic:'airway',hot:false,q:'Gentle tidaling (fluid moving with respiration) in the water-seal chamber means:',o:['The tube is clotted','Normal functioning','An air leak','Tension pneumothorax'],c:1,t:'single',r:'Tidaling is normal and reflects pressure changes with breathing. Absence of tidaling may mean an obstruction or re-expanded lung.'},
{topic:'copd',hot:false,q:'The target oxygen saturation for most patients with COPD is:',o:['100%','95-100%','Below 85%','88-92%'],c:3,t:'single',r:'In COPD, aim for 88-92% to avoid blunting the hypoxic drive while still oxygenating.'},
{topic:'copd',hot:false,q:'A patient in status asthmaticus suddenly has a "silent chest" with no audible wheezing. This indicates:',o:['A good response to the bronchodilator that was just given','The attack is resolving and the airways are opening up','Severe airway obstruction and impending respiratory failure','A developing pneumothorax on the affected side of the chest'],c:2,t:'single',r:'A silent chest means almost no air movement — an emergency sign of impending respiratory failure, not improvement.'},
{topic:'copd',hot:false,q:'Which teaching points are correct for inhaler use? (Select all that apply)',o:['Use a spacer to improve delivery','Use the bronchodilator before the corticosteroid','Rinse mouth after the corticosteroid','Wait about 1 minute between puffs','Use a short-acting beta agonist as a daily controller'],c:[0,1,2,3],t:'multi',r:'Bronchodilator first, rinse after steroid, wait between puffs, use a spacer. SABAs are rescue meds, NOT daily controllers.'},
{topic:'tb',hot:false,q:'Airborne precautions for tuberculosis require which type of respirator/room?',o:['Gown and gloves with a regular semi-private room','Positive-pressure room with standard precautions','Surgical mask in any available private room','N95 respirator with a negative-pressure room'],c:3,t:'single',r:'TB is airborne — use an N95 (or higher) and a negative-pressure (airborne isolation) room.'},
{topic:'tb',hot:false,q:'A patient on rifampin should be taught that the medication may:',o:['Cause blue-gray skin','Stain teeth permanently','Cause hearing loss','Turn body fluids orange'],c:3,t:'single',r:'Rifampin harmlessly turns urine, sweat, and tears orange and can stain soft contact lenses.'},
{topic:'tb',hot:false,q:'Which statement by a patient indicates correct understanding of TB treatment?',o:['"I can stop the medicine as soon as I start feeling better."','"One medication should be enough to clear this infection."','"I must take all the medicines for the full 6 to 12 months."','"I only need the treatment while I still have a cough."'],c:2,t:'single',r:'Full adherence to the multi-drug regimen for the entire course prevents resistance and relapse.'},
{topic:'blood',hot:false,q:'The maximum time a unit of blood should hang/infuse is:',o:['6 hours','2 hours','4 hours','8 hours'],c:2,t:'single',r:'A unit must be completed within 4 hours to prevent bacterial growth.'},
{topic:'blood',hot:false,q:'The nurse should remain with the patient and monitor most closely during which part of a transfusion?',o:['The first 15 minutes','Hourly throughout only','Only at the end','The last 15 minutes'],c:0,t:'single',r:'Most severe reactions occur early — stay and monitor closely for the first 15 minutes.'},
{topic:'blood',hot:false,q:'Which IV solution is the ONLY fluid compatible with blood products?',o:['D5W','0.45% NS','Lactated Ringer\'s','0.9% Normal Saline'],c:3,t:'single',r:'Only 0.9% normal saline is hung with blood. Dextrose hemolyzes RBCs; LR\'s calcium promotes clotting.'},

<h2 class="sec-title"><span class="sec-emoji">🩺</span> Priority Decoder</h2>
<p class="intro-line">His priority stems hand you four real problems. This is the table that ranks them.</p>

<div class="card" style="border-color:var(--teal)">
  <h3>The ranking rule</h3>
  <p class="why-chain">Do not rank by how abnormal a value looks. Rank by <b>how fast it kills</b>. Airway beats breathing, breathing beats circulation, and an acute change beats a stable abnormal number every time.</p>
  <ul class="clean">
    <li><b>Minutes:</b> airway obstruction, stridor, silent chest, tension pneumothorax, acute hemolytic transfusion reaction, hyperkalemia with a widening QRS, laryngospasm from hypocalcemia.</li>
    <li><b>Hours:</b> new confusion, refractory hypoxemia, a rising CO2 in a tiring asthmatic, urine output under 30 mL/hr, an air leak in the water seal.</li>
    <li><b>Days:</b> wound infection, poor intake, deconditioning, mild electrolyte drift.</li>
    <li><b>Not a priority now:</b> expected findings, stable chronic values, a patient asking about discharge.</li>
  </ul>
</div>

<div class="card">

    <tr><td>Fever, chills, back pain 10 min into a transfusion</td><td><b>Acute hemolytic reaction</b> — stop the blood</td><td>Minutes</td></tr>
    <tr><td>Peaked T waves with a widening QRS</td><td><b>Hyperkalemia</b> — calcium gluconate first</td><td>Minutes</td></tr>

document.getElementById('sec-tricks').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🎯</span> Trick Questions</h2>
<p class="intro-line">First the keyword patterns, then the twelve specific traps he sets in this unit. Read this the night before.</p>

<div class="card" style="border-color:var(--red)">
  <h3>⚠️ Rule zero: find the key word before you read the options</h3>
  <ul class="clean">
    <li>Underline the word that controls the question: <b>NOT • EXCEPT • BEST • FIRST • ONLY • MOST • LEAST • INITIAL • PRIORITY</b>.</li>
    <li>Negative words flip the task. Now three options are TRUE and one is false, and the true ones feel correct. That is the trap.</li>
    <li>Cover the options, answer in your head, then look. Much harder to be led.</li>
  </ul>
  <div class="mnem"><div class="tag">🧠 Mnemonic</div><div class="big">"Read it twice, key word slice."</div></div>
</div>

<div class="card" style="border-color:var(--red)"><h3>1. The comfort option that delays the emergency</h3>
<p>A transfusion reaction with "give acetaminophen" or "slow the rate" offered.</p>
<div class="trap"><span class="tag">Why it is wrong</span><b>Stop the blood first.</b> Everything else happens after the infusion is off and saline is running through new tubing.</div></div>

<div class="card" style="border-color:var(--red)"><h3>2. The normal number that is not reassuring</h3>
<p>An asthmatic whose PaCO₂ climbed from 28 to 41.</p>
<div class="trap"><span class="tag">Why it is wrong</span>A normalizing CO₂ in a hyperventilating patient means the muscles are <b>failing</b>. Next stop is respiratory acidosis.</div></div>

<div class="card" style="border-color:var(--red)"><h3>3. Silence read as improvement</h3>
<p>Wheezing disappears during a severe asthma attack.</p>
<div class="trap"><span class="tag">Why it is wrong</span>A wheeze needs airflow to exist. No sound means <b>almost no air is moving</b>.</div></div>

<div class="card" style="border-color:var(--red)"><h3>4. Sealing the leak you need open</h3>
<p>A dislodged chest tube with "tape on all four sides" offered.</p>
<div class="trap"><span class="tag">Why it is wrong</span>Three sides makes a <b>flutter valve</b>. Four sides traps air and causes a tension pneumothorax.</div></div>

<div class="card" style="border-color:var(--red)"><h3>5. The right finding in the wrong chamber</h3>
<p>Continuous bubbling in a chest drainage system.</p>
<div class="trap"><span class="tag">Why it is wrong</span>The <b>chamber</b> is the question. Water-seal = air leak. Suction-control on wall suction = normal.</div></div>

<div class="card" style="border-color:var(--red)"><h3>6. Hypotonic fluid to "replace water"</h3>
<p>A hypotensive dehydrated patient with 0.45% saline as an option.</p>
<div class="trap"><span class="tag">Why it is wrong</span>Hypotonic fluid moves water <b>into cells</b> and drops the BP further. Volume problem = isotonic.</div></div>

<div class="card" style="border-color:var(--red)"><h3>7. Edema read as overload</h3>
<p>A swollen patient with a BP of 90/56 and a heart rate of 118.</p>
<div class="trap"><span class="tag">Why it is wrong</span><b>Third spacing.</b> Fluid left the vessel. Swollen outside, empty inside.</div></div>

<div class="card" style="border-color:var(--red)"><h3>8. The calcium lists swapped</h3>
<p>Hypocalcemia with "constipation, kidney stones, lethargy" offered.</p>
<div class="trap"><span class="tag">Why it is wrong</span>That is the <b>hyper</b>calcemia list. Low calcium makes things <b>fire</b>: tetany, tingling, laryngospasm, seizures.</div></div>

<div class="card" style="border-color:var(--red)"><h3>9. Hyperkalemia treatments in the wrong order</h3>
<p>All four options are real hyperkalemia drugs.</p>
<div class="trap"><span class="tag">Why it is wrong</span>Sequence is the question: <b>protect</b> (calcium gluconate) → <b>shift</b> (insulin/dextrose, albuterol) → <b>remove</b> (kayexalate, dialysis).</div></div>

<div class="card" style="border-color:var(--red)"><h3>10. Confusion attributed to age</h3>
<p>An 82-year-old, newly confused, afebrile.</p>
<div class="trap"><span class="tag">Why it is wrong</span>"Normal aging," "sundowning," and "anxiety" all appear. Acute mental status change <b>is</b> the infection presentation.</div></div>

<div class="card" style="border-color:var(--red)"><h3>11. Withholding the thing that fixes the mechanism</h3>
<p>A post-op patient who will not cough because of pain, with an option to hold the opioid.</p>
<div class="trap"><span class="tag">Why it is wrong</span>Pain is what is <b>causing</b> the atelectasis. Medicate first, then pulmonary hygiene.</div></div>

<div class="card" style="border-color:var(--red)"><h3>12. Droplet where airborne belongs</h3>
<p>"All of the following require airborne precautions EXCEPT..."</p>
<div class="trap"><span class="tag">Why it is wrong</span>TB, measles, and varicella are <b>airborne</b>. Bacterial pneumonia is <b>droplet</b>. The EXCEPT wording means the odd one out is the answer.</div></div>

<div id="q-tricks"></div>`;
renderFilteredQuiz('q-tricks', secQ(EXAM.filter(q=>q.topic==='clinical'||q.hot)), 'Trap practice', 'Trick Questions');

<h2 class="sec-title"><span class="sec-emoji">🧠</span> Why Engine</h2>
<p class="intro-line">Casteel does not test the fact. He tests the <b>because</b>. Walk the chain forward and you can derive the sign, the priority, and the intervention even when the stem is worded in a way you have never seen.</p>

<div class="tipbar">📖 Read a chain, then say it out loud without looking. If you can only say step 1 and the last step, you memorized the fact and skipped the mechanism, which is exactly the gap his distractors are built to catch.</div>











<div class="card">
  <h3>😮‍💨 Why a rising CO2 in an asthma attack is the worst sign in the room</h3>
  <ol class="chainlist">
    <li><b>1.</b> An asthmatic in distress hyperventilates, blowing off CO2 → the early gas shows a <b>LOW</b> PaCO2 (respiratory alkalosis).</li>
    <li><b>2.</b> As the attack continues, the respiratory muscles <b>fatigue</b>.</li>
    <li><b>3.</b> Ventilation falls, so CO2 stops being blown off and starts climbing back toward normal.</li>
    <li><b>4.</b> A "normal" PaCO2 of 41 in a patient who was at 28 does not mean improvement. It means the patient <b>can no longer keep up</b>.</li>
    <li><b>5.</b> The next step is respiratory acidosis, then arrest. This patient needs intervention <b>now</b>.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>"The CO2 is normalizing — the patient is improving" is written to sound reassuring and reasonable. In a tiring asthmatic it is the wrong reading of a normal number.</div>
</div>

<div class="card">
  <h3>🌬️ Why a silent chest is worse than loud wheezing</h3>
  <ol class="chainlist">
    <li><b>1.</b> A wheeze is made by <b>air moving turbulently through a narrowed airway</b>.</li>
    <li><b>2.</b> Making that sound requires enough airflow to vibrate the airway walls.</li>
    <li><b>3.</b> As obstruction worsens, airflow drops below the amount needed to make any sound.</li>
    <li><b>4.</b> So the chest goes <b>silent</b> — not because the airways opened, but because almost nothing is moving.</li>
    <li><b>5.</b> Silent chest = <b>impending respiratory failure</b>. It is an emergency, not a sign of resolution.</li>
  </ol>
</div>

<div class="card">
  <h3>🦠 Why pneumonia looks like confusion in an older adult</h3>
  <ol class="chainlist">
    <li><b>1.</b> Alveoli fill with <b>inflammatory exudate</b>, so the gas exchange surface is blocked.</li>
    <li><b>2.</b> Hypoxia develops, and the aging brain has the <b>least physiologic reserve</b> of any organ.</li>
    <li><b>3.</b> The aging hypothalamus also mounts a <b>blunted febrile response</b>, so the temperature may stay normal.</li>
    <li><b>4.</b> The first system to visibly fail is therefore the brain → <b>acute confusion, weakness, falling appetite</b>.</li>
    <li><b>5.</b> So in an older adult, <b>mental status change IS the pneumonia presentation</b>, and "afebrile" rules out nothing.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>The distractors are "normal aging," "sundowning," and "anxiety." All three are things a real nurse might say, and all three delay the workup.</div>
</div>

<div class="card">
  <h3>🧯 Why a chest tube is taped on only three sides</h3>
  <ol class="chainlist">
    <li><b>1.</b> The pleural space is normally a <b>closed system at negative pressure</b>, which is what keeps the lung expanded.</li>
    <li><b>2.</b> When the tube comes out, that space is open to the atmosphere and air rushes IN.</li>
    <li><b>3.</b> Air accumulating with no way out builds pressure → the lung collapses → the mediastinum shifts → <b>tension pneumothorax</b>.</li>
    <li><b>4.</b> Gauze taped on <b>three sides</b> makes a <b>one-way flutter valve</b>: air can escape on expiration but cannot enter on inspiration.</li>
    <li><b>5.</b> Taping all four sides seals it completely, which is exactly how you <b>cause</b> the tension pneumothorax.</li>
  </ol>
  <div class="hy"><span class="tag">Same logic</span>This is also why you almost never clamp a chest tube. Clamping traps air with no escape route.</div>
</div>

<div class="card">
  <h3>💨 Why bubbling means different things in different chambers</h3>
  <ol class="chainlist">
    <li><b>1.</b> The <b>water-seal chamber</b> is a one-way valve. Air only passes through it if air is <b>escaping the patient's chest</b>.</li>
    <li><b>2.</b> So continuous bubbling there means <b>air is leaking</b> — from the lung, the tubing, or a loose connection.</li>
    <li><b>3.</b> The <b>suction-control chamber</b> bubbles because <b>wall suction is pulling room air through it</b>. That has nothing to do with the patient.</li>
    <li><b>4.</b> So bubbling there is <b>expected and normal</b> whenever suction is running.</li>
    <li><b>5.</b> <b>Tidaling</b> (fluid rising and falling with breathing) in the water seal is normal and shows the system is patent. It stopping means the lung re-expanded OR the tube is blocked.</li>
  </ol>
</div>

<div class="card">
  <h3>🩸 Why only normal saline hangs with blood</h3>
  <ol class="chainlist">
    <li><b>1.</b> <b>Dextrose solutions are hypotonic once the sugar is metabolized</b>, so water rushes into the red cells and <b>lyses</b> them.</li>
    <li><b>2.</b> <b>Lactated Ringer contains calcium</b>, and calcium is a clotting factor — it reverses the citrate anticoagulant in the bag and causes <b>clot formation</b>.</li>
    <li><b>3.</b> Only <b>0.9% normal saline</b> is isotonic and calcium-free.</li>
    <li><b>4.</b> The same logic drives the timing rules: start within <b>30 minutes</b> of leaving the bank (uncontrolled temperature) and finish within <b>4 hours</b> (bacterial growth).</li>
    <li><b>5.</b> And it is why you stay for the <b>first 15 minutes</b> running slowly — a hemolytic reaction shows up while very little blood has been given.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>In a reaction question, "give acetaminophen," "slow the rate," and "notify the provider" all appear. <b>Stop the blood first.</b> Everything else happens after the infusion is off and the saline is running through new tubing.</div>
</div>

<div class="card">
  <h3>🫁 Why oxygen is capped in some COPD patients</h3>
  <ol class="chainlist">
    <li><b>1.</b> Normally the drive to breathe comes from <b>rising CO2</b>.</li>
    <li><b>2.</b> A chronic retainer has lived with a high CO2 for years, so the central chemoreceptors have <b>reset</b> and stopped responding to it.</li>
    <li><b>3.</b> Their remaining stimulus is a <b>low oxygen level</b> sensed by peripheral chemoreceptors.</li>
    <li><b>4.</b> Flooding them with high-flow oxygen removes that stimulus and <b>ventilation falls</b>, so CO2 climbs further.</li>
    <li><b>5.</b> So the target is <b>SpO2 88 to 92%</b> with a controlled device like a <b>Venturi mask</b> — enough oxygen to perfuse, not enough to erase the drive.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>This never means withholding oxygen from a hypoxic patient. If a COPD patient is in true respiratory distress, you oxygenate. The rule is about <b>controlled</b> delivery and monitoring, not rationing.</div>
</div>

<div class="hy">🧠 <b>Self-test:</b> pick a question you missed and ask which link in the chain you did not know. If you cannot name the link, you were guessing from recognition. Go back to that chain before answering more questions.</div>

<div id="whyQuiz"></div>`;

<script>
/* ===== CLASS NOTES ===== */
let notesList=[], noteTopic='other', noteFilter='keep';
const NOTE_TOPICS=['upper','resp','acute','pneumonia','airway','copd','tb','other'];
const NOTE_LABEL={upper:'Upper Resp',resp:'Resp Assessment',acute:'Acute Resp',pneumonia:'Pneumonia',airway:'Airway/Tubes',copd:'COPD/Asthma',tb:'TB',other:'Other'};
(function restoreNotes(){ try{ const r=localStorage.getItem('nur256u2_notes'); if(r) notesList=JSON.parse(r); }catch(e){} })();
function saveNotes(){ try{ localStorage.setItem('nur256u2_notes', JSON.stringify(notesList)); }catch(e){} }
function escN(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
let noteDraft='', noteDraftStar=false;
function captureDraft(){ const el=document.getElementById('noteInput'); if(el) noteDraft=el.value; const c=document.getElementById('noteStar'); if(c) noteDraftStar=c.checked; }
function setNoteTopic(t){ captureDraft(); noteTopic=t; renderNotes(); }
function setNoteFilter(f){ captureDraft(); noteFilter=f; renderNotes(); }
function addNote(){
  const el=document.getElementById('noteInput'); if(!el)return;
  const t=el.value.trim(); if(!t){ toast('Nothing to save'); return; }
  const star=document.getElementById('noteStar').checked;
  notesList.unshift({id:Date.now()+''+Math.floor(Math.random()*999),t,topic:noteTopic,star,ts:Date.now()});
  saveNotes(); noteDraft=''; noteDraftStar=false; noteFilter = star?'keep':'inbox'; renderNotes();
  toast(star?'Saved to Keep':'Saved to Inbox');
}
function toggleStar(id){ captureDraft(); const n=notesList.find(x=>x.id===id); if(n){ n.star=!n.star; saveNotes(); renderNotes(); } }
function delNote(id){ captureDraft(); notesList=notesList.filter(x=>x.id!==id); saveNotes(); renderNotes(); toast('Deleted'); }
function clearInbox(){
  const n=notesList.filter(x=>!x.star).length;
  if(!n){ toast('Inbox already empty'); return; }
  if(confirm('Delete '+n+' unsorted note'+(n===1?'':'s')+'? Anything starred stays.')){
    notesList=notesList.filter(x=>x.star); saveNotes(); renderNotes(); toast('Inbox cleared');
  }
}
function copyNotes(){
  const list=notesList.filter(x=>x.star);
  if(!list.length){ toast('Nothing starred yet'); return; }
  const txt=list.map(n=>'['+NOTE_LABEL[n.topic]+'] '+n.t).join('\n');
  const done=()=>toast('Copied '+list.length+' notes');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,cb){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast('Copy failed'); }
  document.body.removeChild(ta);
}
function renderNotes(){
  const host=document.getElementById('sec-notes'); if(!host)return;
  const keep=notesList.filter(n=>n.star), inbox=notesList.filter(n=>!n.star);
  const shown = noteFilter==='keep'?keep:inbox;
  const chips=NOTE_TOPICS.map(t=>`<button class="chip ${noteTopic===t?'on':''}" onclick="setNoteTopic('${t}')">${NOTE_LABEL[t]}</button>`).join('');
  const rows = shown.length ? shown.map(n=>`
    <div class="notecard">
      <div class="noterow">
        <span class="notetag">${NOTE_LABEL[n.topic]}</span><span class="notespacer"></span>
        <button class="mini ${n.star?'on':''}" onclick="toggleStar('${n.id}')">${n.star?'★ Keep':'☆ Keep'}</button>
        <button class="mini danger" onclick="delNote('${n.id}')">Delete</button>
      </div>
      <div class="notetext">${escN(n.t)}</div>
    </div>`).join('')
    : `<div class="card" style="text-align:center;color:var(--muted)">${noteFilter==='keep'?'Nothing starred yet. Star a note when Casteel signals it is testable.':'Inbox is empty. Everything you wrote has been sorted or cleared.'}</div>`;
  host.innerHTML=`
  <h2 class="sec-title"><span class="sec-emoji">✍️</span> Class Notes</h2>
  <p class="intro-line">Type fast during lecture. Sort later. Saves on this device only.</p>

  <div class="card">
    <textarea id="noteInput" class="noteinput" rows="3" placeholder="Type a keyword, a phrase he repeated, a question he asked the room...">${escN(noteDraft)}</textarea>
    <div class="chiprow">${chips}</div>
    <label class="starline"><input type="checkbox" id="noteStar" ${noteDraftStar?"checked":""}> <b>Star it</b> — he signaled this is on the test</label>
    <button class="btn wide" onclick="addNote()">Save note</button>
  </div>

  <div class="hy"><span class="tag">Keep this small on purpose</span>Not everything said in class is testable, and a page of notes you never reread is just extra weight. Star only what he flags, questions he asks out loud, and anything that contradicts what you already believed. Everything else drops to <b>Inbox</b>, and you clear the inbox at the end of the week without guilt.</div>

  <div class="card">
    <div class="chiprow">
      <button class="chip ${noteFilter==='keep'?'on':''}" onclick="setNoteFilter('keep')">★ Keep (${keep.length})</button>
      <button class="chip ${noteFilter==='inbox'?'on':''}" onclick="setNoteFilter('inbox')">Inbox (${inbox.length})</button>
    </div>
    ${keep.length>25&&noteFilter==='keep'?`<div class="trap"><span class="tag">Getting heavy</span>You have ${keep.length} starred notes. Past about 25 you are collecting, not studying. Reread them and unstar anything you already know cold.</div>`:''}
    ${rows}
    <div class="chiprow" style="margin-top:12px">
      <button class="mini" onclick="copyNotes()">Copy starred notes</button>
      <button class="mini danger" onclick="clearInbox()">Clear inbox</button>
    </div>
  </div>`;
}
renderNotes();

</script>

<h2 class="sec-title"><span class="sec-emoji">🚨</span> Acute Respiratory Disorders</h2>
