<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>NUR 256 — Unit 2 Study Lab</title>
<style>
:root{
  color-scheme: light;
  --bg:#e6f4ee; --bg2:#fbfffd;
  --ink:#0d2620; --muted:#4a6b61;
  --card:#fbfffd; --card-border:#b3ddcd;
  --pink:#0f766e; --pink-soft:#d6f0ec;
  --purple:#047857; --purple-soft:#d3f2e3;
  --teal:#0891b2; --teal-soft:#d3f0f7;
  --green:#15803d; --green-soft:#dcf7e3;
  --red:#be123c; --red-soft:#fce4ea;
  --amber:#b45309; --amber-soft:#fbeed6;
  --blue:#0e7490; --blue-soft:#d6eef5;
}
[data-theme="night"]{
  color-scheme: dark;
  --bg:#08150f; --bg2:#0e1f18;
  --ink:#e8f7f0; --muted:#93b8a9;
  --card:#12261d; --card-border:#28453a;
  --pink:#2dd4bf; --pink-soft:#0e2b28;
  --purple:#34d399; --purple-soft:#0f2b21;
  --teal:#22d3ee; --teal-soft:#0c2a31;
  --green:#4ade80; --green-soft:#12301d;
  --red:#fb7185; --red-soft:#2e1319;
  --amber:#fbbf24; --amber-soft:#2e2411;
  --blue:#38bdf8; --blue-soft:#0c2431;
}

html{background:var(--bg)}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  transition:background .3s,color .3s;padding-bottom:80px;
}
/* BIG TEXT mode */
body.mobile-mode{font-size:1.18rem;line-height:1.7}
body.mobile-mode .grid2,body.mobile-mode .grid3{grid-template-columns:1fr!important;gap:18px}
body.mobile-mode .content{padding:16px}
body.mobile-mode .card{padding:20px 18px;margin-bottom:18px}
body.mobile-mode .card h3{font-size:1.3rem;line-height:1.4}
body.mobile-mode .sec-title{font-size:1.55rem;line-height:1.35}
body.mobile-mode p,body.mobile-mode li,body.mobile-mode td,body.mobile-mode th{font-size:1.12rem;line-height:1.7}
body.mobile-mode .clean li{margin-bottom:12px}
body.mobile-mode .opt{font-size:1.12rem;padding:16px;min-height:54px;line-height:1.5}
body.mobile-mode .q-text{font-size:1.18rem;line-height:1.55}
body.mobile-mode .btn,body.mobile-mode .tbtn{font-size:1.1rem;padding:14px 18px}
body.mobile-mode .nav button{font-size:1.05rem;padding:12px 14px}
body.mobile-mode .rationale{font-size:1.08rem;line-height:1.6}
body.mobile-mode .mnem .big{font-size:1.15rem}
body.mobile-mode .hy{font-size:1.1rem;line-height:1.6;padding:16px}
body.mobile-mode table.lab{font-size:.9rem}
body.mobile-mode .lab td,body.mobile-mode .lab th{padding:9px 7px;font-size:.92rem!important}

/* TOP BAR */
.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(90deg,var(--pink),var(--purple));
  color:#fff;padding:12px 16px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex-wrap:wrap;
  box-shadow:0 2px 14px rgba(0,0,0,.18);
}
.topbar h1{font-size:1.2rem;margin:0;font-weight:800;letter-spacing:.3px}
.topbar .sub{font-size:.72rem;opacity:.9;font-weight:500;display:block}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{border:none;background:rgba(255,255,255,.25);color:#fff;padding:9px 14px;border-radius:30px;font-weight:700;font-size:.85rem;cursor:pointer;backdrop-filter:blur(4px)}
.tbtn:active{transform:scale(.95)}

.progwrap{padding:10px 16px;background:var(--bg2)}
.progbar-bg{background:var(--card-border);border-radius:20px;height:14px;overflow:hidden}
.progbar{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:20px;transition:width .5s}
.progtext{font-size:.72rem;color:var(--muted);text-align:center;margin-top:4px;font-weight:600}

/* NAV TABS */
.nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;-webkit-overflow-scrolling:touch;background:var(--bg)}
.nav button{flex:0 0 auto;border:2px solid var(--card-border);background:var(--card);color:var(--ink);padding:9px 15px;border-radius:30px;font-weight:700;font-size:.82rem;cursor:pointer;transition:.2s;white-space:nowrap}
.nav button.active{background:var(--purple);color:#fff;border-color:var(--purple);transform:scale(1.04)}

.content{max-width:920px;margin:0 auto;padding:18px;background:var(--bg)}
.section{display:none;animation:fade .4s;scroll-margin-top:12px}
.section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.sec-title{font-size:1.5rem;font-weight:800;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.sec-emoji{font-size:1.6rem}
.intro-line{color:var(--muted);margin:0 0 16px;font-size:.95rem}

.card{background:var(--card);border:2px solid var(--card-border);border-radius:16px;padding:16px 18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card h3{margin:0 0 10px;font-size:1.15rem}
.clean{list-style:none;padding:0;margin:8px 0}
.clean li{padding:6px 0 6px 22px;position:relative}
.clean li:before{content:"▸";position:absolute;left:0;color:var(--purple);font-weight:800}
.pill{display:inline-block;background:var(--purple-soft);color:var(--purple);padding:2px 10px;border-radius:20px;font-size:.7rem;font-weight:800;margin-left:6px}

.hy{background:var(--amber-soft);border-left:5px solid var(--amber);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.9rem}
.why-chain{background:var(--teal-soft);border-left:4px solid var(--teal);border-radius:10px;padding:12px 14px;margin:10px 0;line-height:1.7}
.mnem{background:var(--purple-soft);border-radius:12px;padding:10px 14px;margin:10px 0}
.mnem .tag{font-size:.68rem;font-weight:800;color:var(--purple);text-transform:uppercase;letter-spacing:.5px}
.mnem .big{font-size:1.05rem;font-weight:800;margin:3px 0}
.mnem .exp{font-size:.85rem;color:var(--muted)}
.profnote{background:var(--teal-soft);border-left:5px solid var(--teal);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.9rem}
.profnote .tag{font-size:.68rem;font-weight:800;color:var(--teal);text-transform:uppercase;letter-spacing:.5px}

table.lab{width:100%;border-collapse:collapse;margin:10px 0;font-size:.88rem;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(min-width:640px){table.lab{display:table}}
table.lab th{background:var(--purple);color:#fff;padding:8px;text-align:left;font-size:.8rem}
table.lab td{padding:8px;border-bottom:1px solid var(--card-border);min-width:80px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}

/* QUIZ */
.quiz-card{background:var(--card);border:2px solid var(--card-border);border-radius:14px;padding:16px;margin:12px 0}
.q-text{font-weight:700;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--card-border);background:var(--bg2);color:var(--ink);padding:11px 14px;border-radius:10px;cursor:pointer;font-size:.92rem;transition:.15s}
.opt:hover{border-color:var(--purple)}
.opt.correct{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.opt.sel-multi{border-color:var(--purple);background:var(--purple-soft)}
.opt.disabled{pointer-events:none;opacity:.85}
.rationale{margin-top:10px;padding:10px 12px;background:var(--blue-soft);border-radius:10px;font-size:.86rem;display:none}
.rationale.show{display:block}
.submit-multi{margin-top:8px;background:linear-gradient(90deg,var(--teal),var(--green));color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:800;cursor:pointer}
.center{text-align:center}
.btn{background:var(--purple);color:#fff;border:none;padding:11px 20px;border-radius:12px;font-weight:800;cursor:pointer;font-size:.95rem}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--card-border)}
.tipbar{background:var(--teal-soft);border-radius:12px;padding:10px 14px;font-size:.85rem;margin:10px 0}
.kbd{background:var(--card);border:1px solid var(--card-border);border-radius:6px;padding:1px 7px;font-weight:700;font-size:.8rem}
.quiz-score{font-size:1.15rem;font-weight:800;text-align:center;padding:16px;background:var(--purple-soft);border-radius:14px;margin:12px 0}

/* flash game */
.flash-progress{text-align:center;font-size:.85rem;color:var(--muted);margin-bottom:10px;font-weight:700}
.flash-card{background:var(--card);border:3px solid var(--purple);border-radius:20px;padding:34px 22px;min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.12rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow,0 4px 18px rgba(0,0,0,.12));transition:transform .15s,background .2s,border-color .2s}
.flash-card:active{transform:scale(.97)}
.flash-card.flipped{border-color:var(--teal);background:var(--teal-soft)}
.flash-label{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px;display:block}
.flash-btns{display:flex;gap:10px;margin-top:14px}
.flash-btn{flex:1;padding:14px;border-radius:14px;border:none;font-weight:800;cursor:pointer;font-size:.92rem}
.flash-btn.learning{background:var(--amber-soft);color:var(--amber);border:2px solid var(--amber)}
.flash-btn.gotit{background:var(--green-soft);color:var(--green);border:2px solid var(--green)}

/* wrong answer vault */
.vault-empty{text-align:center;padding:30px 16px;font-size:1rem}
.vault-tag{display:inline-block;background:var(--purple-soft);color:var(--purple);font-size:.72rem;font-weight:800;border-radius:20px;padding:2px 10px;margin-bottom:8px}
.vault-solved{background:var(--green-soft);border:2px solid var(--green);color:var(--green);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:.85rem;font-weight:700;text-align:center}

/* match game */
.match-stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-weight:800;font-size:.88rem;margin:10px 0;color:var(--ink)}
.match-wrap{position:relative}
.match-svg{display:block;position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.match-columns{display:flex;gap:10px;position:relative;z-index:2}
.match-col{flex:1 1 0;display:flex;flex-direction:column;gap:9px;min-width:0}
.match-item{width:100%;box-sizing:border-box;background:var(--card);border:2px solid var(--card-border);border-radius:12px;padding:11px 8px;font-size:.74rem;font-weight:700;cursor:pointer;text-align:left;transition:border-color .15s,background .15s,transform .1s;line-height:1.3;word-break:break-word;overflow-wrap:anywhere;white-space:normal}
.match-item:active{transform:scale(.98)}
.match-item.selected{border-color:var(--purple);background:var(--purple-soft)}
.match-item.matched{border-color:var(--green);background:var(--green-soft);color:var(--green);cursor:default;opacity:.75}
.match-item.shake{border-color:var(--red);background:var(--red-soft);animation:matchshake .35s}
@keyframes matchshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
body.mobile-mode .match-item{font-size:.95rem}
body.mobile-mode .match-stats{font-size:1rem}

/* exam: dropdown-match type */
.dm-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card);border:2px solid var(--card-border);border-radius:12px;margin-bottom:8px;flex-wrap:wrap}
.dm-term{font-weight:800;flex:1 1 140px;min-width:120px}
.dm-select{flex:1 1 200px;padding:9px;border-radius:10px;border:2px solid var(--card-border);background:var(--bg2);color:var(--ink);font-size:.85rem}
.dm-row.dm-correct{border-color:var(--green);background:var(--green-soft)}
.dm-row.dm-wrong{border-color:var(--red);background:var(--red-soft)}

/* exam: order/sequence type (NCLEX-style drag-and-drop, tap-to-sequence) */
.order-pool{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.order-chip{background:var(--card);border:2px solid var(--card-border);border-radius:12px;padding:11px 12px;font-size:.85rem;font-weight:700;cursor:pointer;text-align:left}
.order-chip:disabled{opacity:.35;cursor:default}
.order-answer{display:flex;flex-direction:column;gap:6px;margin:10px 0;min-height:40px;padding:8px;border:2px dashed var(--card-border);border-radius:12px}
.order-answer-item{display:flex;align-items:center;gap:8px;background:var(--purple-soft);border:2px solid var(--purple);border-radius:10px;padding:8px 10px;font-size:.82rem;font-weight:700}
.order-answer-item .num{background:var(--purple);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0}
.order-answer-item.order-correct{background:var(--green-soft);border-color:var(--green)}
.order-answer-item.order-wrong{background:var(--red-soft);border-color:var(--red)}

/* drill */
.drill-top{display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;margin-bottom:6px}
.drill-bar{height:8px;background:var(--card-border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.drill-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));transition:.3s}
.drill-final{font-size:1.6rem;font-weight:800;color:var(--purple);margin:10px 0}

/* exam */
.exam-mode-toggle{display:flex;gap:10px;margin:12px 0;justify-content:center}
.mode-btn{flex:1;max-width:220px;padding:12px 16px;border-radius:14px;border:2px solid var(--card-border);background:var(--card);color:var(--ink);font-weight:800;font-size:.95rem;cursor:pointer}
.mode-btn.active{background:linear-gradient(90deg,var(--purple),var(--pink));color:#fff;border-color:transparent}
.exam-q{background:var(--card);border:2px solid var(--card-border);border-radius:14px;padding:16px;margin:10px 0}
.qnum{font-size:.7rem;font-weight:800;color:var(--purple);text-transform:uppercase}
.qtype{font-size:.64rem;font-weight:800;padding:2px 8px;border-radius:20px;background:var(--blue-soft);color:var(--blue);margin-left:6px}
.qtext{font-weight:700;margin:8px 0 12px}
.exam-nav{position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--card-border);padding:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:14px 14px 0 0;margin-top:10px}
.exam-dots{display:flex;flex-wrap:wrap;gap:4px;max-width:60%}
.dot{width:13px;height:13px;border-radius:50%;background:var(--card-border);cursor:pointer}
.dot.answered{background:var(--teal)}
.dot.current{background:var(--pink);transform:scale(1.3)}
.dot.dot-correct{background:var(--green)}
.dot.dot-wrong{background:var(--red)}

/* ---- Unit 2 additions ---- */
.trap{background:var(--red-soft);border-left:5px solid var(--red);border-radius:10px;padding:11px 14px;margin:10px 0;font-size:.9rem}
.trap .tag{font-size:.68rem;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px}
.hy .tag{font-size:.68rem;font-weight:800;color:var(--amber);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px}
.chainlist{list-style:none;padding:0;margin:8px 0}
.chainlist li{padding:9px 0;border-bottom:1px solid var(--card-border);line-height:1.65}
.chainlist li:last-child{border-bottom:none}
.noteinput{width:100%;font-family:inherit;font-size:1rem;padding:13px;border-radius:12px;border:2px solid var(--card-border);background:var(--bg2);color:var(--ink);resize:vertical;line-height:1.5}
.noteinput:focus{outline:none;border-color:var(--purple)}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.chip{font-family:inherit;font-size:.8rem;font-weight:700;padding:8px 13px;border-radius:999px;border:2px solid var(--card-border);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
.starline{display:flex;align-items:center;gap:9px;margin:10px 0 14px;font-size:.93rem}
.starline input{width:20px;height:20px;accent-color:var(--purple)}
.notecard{border:2px solid var(--card-border);border-radius:12px;padding:11px 13px;margin:9px 0;background:var(--bg2)}
.noterow{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.notespacer{flex:1}
.notetag{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--purple);background:var(--purple-soft);padding:3px 9px;border-radius:999px}
.notetext{white-space:pre-wrap;line-height:1.55;font-size:.96rem}
.mini{font-family:inherit;font-size:.76rem;font-weight:700;padding:6px 12px;border-radius:999px;border:2px solid var(--card-border);background:var(--card);color:var(--ink);cursor:pointer}
.mini.on{background:var(--amber);border-color:var(--amber);color:#fff}
.mini.danger{color:var(--red);border-color:var(--red-soft)}
.btn.wide{width:100%}
.opt:focus{outline:none}
.opt:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.exam-dots{max-height:56px;overflow-y:auto;align-content:flex-start;padding:2px}
.dot{width:11px;height:11px;flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg2);padding:11px 20px;border-radius:30px;font-weight:700;font-size:.88rem;opacity:0;pointer-events:none;transition:.25s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#backToTopBtn{position:fixed;bottom:84px;right:16px;z-index:999;width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-size:1.25rem;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .25s,transform .15s;padding:0}
#backToTopBtn.show{display:flex;opacity:1}
#backToTopBtn:active{transform:scale(.9)}
#backToTopBtn:focus{outline:none}
#backToTopBtn:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
@media(min-width:940px){#backToTopBtn{right:calc(50vw - 470px)}}
#listenFab{position:fixed;bottom:140px;right:16px;z-index:999;width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--teal),var(--purple));color:#fff;font-size:1.2rem;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#listenFab:active{transform:scale(.9)}
#listenFab:focus{outline:none}
#listenFab:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
@media(min-width:940px){#listenFab{right:calc(50vw - 470px)}}
#listenBar{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--card);border-top:3px solid var(--purple);box-shadow:0 -4px 20px rgba(0,0,0,.18);padding:10px 12px calc(10px + env(safe-area-inset-bottom));font-family:inherit}
.lb-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lb-lab{flex:1;font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-x{background:none;border:none;color:var(--muted);font-size:1.05rem;cursor:pointer;padding:4px 8px;font-family:inherit}
.lb-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lb-btn{font-family:inherit;font-size:1.05rem;padding:9px 14px;border-radius:12px;border:2px solid var(--card-border);background:var(--bg2);color:var(--ink);cursor:pointer;line-height:1}
.lb-main{background:var(--purple);border-color:var(--purple);color:#fff;min-width:62px}
.lb-sp{display:flex;gap:5px}
.lb-rate{font-family:inherit;font-size:.75rem;font-weight:700;padding:7px 10px;border-radius:999px;border:2px solid var(--card-border);background:var(--card);color:var(--ink);cursor:pointer}
.lb-rate.on{background:var(--teal);border-color:var(--teal);color:#fff}
.listen-now{outline:3px solid var(--purple);outline-offset:4px;border-radius:14px}
body:has(#listenBar) footer{padding-bottom:120px}
.grphead{border-top:3px solid var(--purple);margin:26px 0 12px;padding-top:12px}
.grphead:first-of-type{border-top:none;margin-top:4px;padding-top:0}
.grphead h3{font-size:1.16rem;color:var(--purple);margin:0 0 3px;letter-spacing:-.01em}
.grp-sub{font-size:.88rem;color:var(--muted);margin:0;line-height:1.45}
.jumpbar{font-size:.82rem;color:var(--muted);margin:10px 0 4px;line-height:2}
.jumpbar a{display:inline-block;background:var(--purple-soft);color:var(--purple);font-weight:700;padding:5px 11px;border-radius:999px;text-decoration:none;margin-right:5px}
.jumpbar a:active{opacity:.7}
</style>
</head>
<body data-theme="day">

<div class="topbar">
  <div>
    <h1>🫁 NUR 256 — Unit 2 Study Lab</h1>

let answeredQs=new Set(); let totalTrackable=0;
(function restoreProgress(){ try{ const r=localStorage.getItem('nur256u2_progress'); if(r){ JSON.parse(r).forEach(id=>answeredQs.add(id)); } }catch(e){} })();
function saveProgress(){ try{ localStorage.setItem('nur256u2_progress', JSON.stringify([...answeredQs])); }catch(e){} }
function resetAllProgress(){ if(!confirm('Reset all saved progress (quiz progress + saved exam + vault + flash game + match games)? This cannot be undone.'))return; answeredQs=new Set(); try{ localStorage.removeItem('nur256u2_progress'); }catch(e){} updateProg(); try{ localStorage.removeItem('nur256u2_exam'); }catch(e){} examState={};examIdx=0;examChecked={};examSubmitted=false;examMode='study';quizSet=[]; if(typeof setExamMode==='function'){ try{ setExamMode('study'); localStorage.removeItem('nur256u2_exam'); }catch(e){} } try{ wrongVault=[]; localStorage.removeItem('nur256u2_vault'); const b=document.getElementById('vaultCount'); if(b)b.textContent='0'; if(typeof renderVaultSection==='function') renderVaultSection(); }catch(e){} try{ flashMastered=new Set(); localStorage.removeItem('nur256u2_flashmastered'); if(typeof buildFlashQueue==='function'){ buildFlashQueue(); drawFlashCard(); } }catch(e){} try{ matchProgress={}; localStorage.removeItem('nur256u2_matchprogress'); localStorage.removeItem('nur256u2_matchbest_lyte'); localStorage.removeItem('nur256u2_matchbest_resp'); }catch(e){} try{ notesList=[]; localStorage.removeItem('nur256u2_notes'); if(typeof renderNotes==='function') renderNotes(); }catch(e){} alert('Progress reset. Fresh start!'); }
function bumpProgress(id){ if(!answeredQs.has(id)){answeredQs.add(id);saveProgress();updateProg();} }

}

/* ===== WRONG ANSWER VAULT ===== */
let wrongVault=[];
(function restoreVault(){ try{ const r=localStorage.getItem('nur256u2_vault'); if(r) wrongVault=JSON.parse(r); }catch(e){} })();
(function initVaultBadge(){ const b=document.getElementById('vaultCount'); if(b) b.textContent=wrongVault.length; })();
function saveVault(){ try{ localStorage.setItem('nur256u2_vault', JSON.stringify(wrongVault)); }catch(e){} }
function addToVault(entry){
  const idx=wrongVault.findIndex(v=>v.id===entry.id);
  if(idx>=0) wrongVault[idx]=entry; else wrongVault.push(entry);
  saveVault();
  const badge=document.getElementById('vaultCount'); if(badge) badge.textContent=wrongVault.length;
}
function removeFromVault(id){
  wrongVault=wrongVault.filter(v=>v.id!==id);
  saveVault();
  const badge=document.getElementById('vaultCount'); if(badge) badge.textContent=wrongVault.length;
}

function stripLabel(text){ return text.replace(/^[A-Za-z]\.\s*/,''); }
function relabel(optsArr){
  const L=['A','B','C','D','E','F'];
  return optsArr.map((o,i)=>L[i]+'. '+stripLabel(o));
}
function prepareQuestion(qOrig){
  let opts=qOrig.opts.slice();
  let correct=qOrig.type==='multi'?qOrig.correct.slice():qOrig.correct;
  if(shuffleAnswers){
    const order=shuffle(opts.map((_,i)=>i));
    const newOpts=order.map(i=>opts[i]);
    if(qOrig.type==='multi'){
      const correctSet=new Set(correct);
      correct=order.map((origIdx,newIdx)=>correctSet.has(origIdx)?newIdx:null).filter(x=>x!==null);
    } else {
      correct=order.indexOf(correct);
    }
    opts=newOpts;
  }
  return {...qOrig, opts:relabel(opts), correct};
}
let quizTotalCounted=new Set();
function renderQuiz(containerId, questions, title, source, indexMap){
  const host=document.getElementById(containerId);
  if(!host)return;
  host.innerHTML='';
  const wrap=document.createElement('div');
  if(title){ const h=document.createElement('h3'); h.textContent='📝 '+title; h.style.color='var(--pink)'; wrap.appendChild(h); }
  questions.forEach((qOrig,localIdx)=>{
    const qi = indexMap ? indexMap[localIdx] : localIdx;
    const q=prepareQuestion(qOrig);
    const qid=containerId+'-'+qi;
    if(!quizTotalCounted.has(qid)){ quizTotalCounted.add(qid); totalTrackable++; }
    const card=document.createElement('div'); card.className='quiz-card';
    const qt=document.createElement('div'); qt.className='q-text'; qt.textContent=(qi+1)+'. '+q.q; card.appendChild(qt);
    const opts=document.createElement('div'); opts.className='opts'; card.appendChild(opts);
    const rat=document.createElement('div'); rat.className='rationale'; rat.innerHTML='<b>Rationale:</b> '+q.rat;
    if(q.type==='multi'){
      const chosen=new Set();
      q.opts.forEach((o,i)=>{
        const btn=document.createElement('button'); btn.className='opt'; btn.innerHTML=o;
        btn.onclick=()=>{ if(chosen.has(i)){chosen.delete(i);btn.classList.remove('sel-multi');}else{chosen.add(i);btn.classList.add('sel-multi');} };
        opts.appendChild(btn);
      });
      const sub=document.createElement('button'); sub.className='submit-multi'; sub.textContent='Check Answer';
      sub.onclick=()=>{
        const correct=new Set(q.correct);
        let allRight=chosen.size===correct.size;
        opts.querySelectorAll('.opt').forEach((b,i)=>{
          b.classList.add('disabled');
          if(correct.has(i))b.classList.add('correct');
          else if(chosen.has(i)){b.classList.add('wrong');allRight=false;}
        });
        if(!allRight){ addToVault({id:qid,q:q.q,opts:q.opts,type:'multi',correct:q.correct,rat:q.rat,source:source||title||''}); }
        rat.classList.add('show'); sub.style.display='none'; bumpProgress(qid);
      };
      card.appendChild(sub);
    } else {
      q.opts.forEach((o,i)=>{
        const btn=document.createElement('button'); btn.className='opt'; btn.innerHTML=o;
        btn.onclick=()=>{
          opts.querySelectorAll('.opt').forEach(b=>b.classList.add('disabled'));
          if(i===q.correct)btn.classList.add('correct');
          else{
            btn.classList.add('wrong'); opts.querySelectorAll('.opt')[q.correct].classList.add('correct');
            addToVault({id:qid,q:q.q,opts:q.opts,type:'single',correct:q.correct,rat:q.rat,source:source||title||''});
          }
          rat.classList.add('show'); bumpProgress(qid);
        };
        opts.appendChild(btn);
      });
    }
    card.appendChild(rat);
    wrap.appendChild(card);
  });
  host.appendChild(wrap);
}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);}

/* ===== VISION-ONLY FILTER ENGINE ===== */
let hotOnlyGlobal=false;
let quizFilterState={};
(function restoreVisionOnly(){ try{ if(localStorage.getItem('nur256u2_hotonly')==='1') hotOnlyGlobal=true; }catch(e){} })();
const SECTION_QUIZ_CAP = 18;
const SEC_FULL = {};
function secSampleCap(pool, cap){
  if(pool.length <= cap) return pool.slice();
  const hot  = shuffle(pool.filter(q=>q.hot));
  const rest = shuffle(pool.filter(q=>!q.hot));
  const hotWant = Math.min(hot.length, Math.max(1, Math.round(cap*0.6)));
  let out = hot.slice(0, hotWant).concat(rest.slice(0, cap - hotWant));
  if(out.length < cap){
    const used = new Set(out);
    out = out.concat(hot.concat(rest).filter(q=>!used.has(q)).slice(0, cap-out.length));
  }
  return shuffle(out);
}
function refreshSecQuiz(id){
  const p = SEC_FULL[id];
  if(!p) return;
  const note = document.getElementById(id+'-poolnote');
  if(note) note.remove();
  renderFilteredQuiz(id, p.pool, p.title, p.source);
  const host = document.getElementById(id);
  if(host) host.scrollIntoView({behavior:'smooth', block:'start'});
  if(typeof toast==='function') toast('Fresh set of '+Math.min(SECTION_QUIZ_CAP, p.pool.length));
}
function renderFilteredQuiz(containerId, allQuestions, title, source){
  SEC_FULL[containerId] = {pool: allQuestions, title: title, source: source};
  const total = allQuestions.length;
  const NO_CAP = (containerId === 'q-hisquiz');   /* his 27 show in full, in his order */
  const shown = NO_CAP ? allQuestions.slice() : secSampleCap(allQuestions, SECTION_QUIZ_CAP);
  const host0 = document.getElementById(containerId);
  const old = document.getElementById(containerId+'-poolnote');
  if(old) old.remove();
  if(host0 && total > shown.length){
    const note=document.createElement('div');
    note.className='tipbar'; note.id=containerId+'-poolnote';
    note.innerHTML='\uD83D\uDCDD <b>'+shown.length+' questions</b>, freshly drawn from a pool of <b>'+total+'</b> on this topic. '
      + '<button class="mini" style="margin-left:6px" onclick="refreshSecQuiz(\''+containerId+'\')">\uD83D\uDD04 New '+shown.length+'</button>'
      + '<br><span style="font-size:.85em">Each draw mixes high-yield items with ones you may not have seen yet.</span>';
    host0.parentNode.insertBefore(note, host0);
  }
  allQuestions = shown;
  quizFilterState[containerId]={allQuestions,title,source};
  applyQuizFilter(containerId);
}
function applyQuizFilter(containerId){
  const state=quizFilterState[containerId];
  if(!state)return;
  const filtered=[], indices=[];
  state.allQuestions.forEach((q,i)=>{
    if(!hotOnlyGlobal || q.hot){ filtered.push(q); indices.push(i); }
  });
  if(filtered.length===0){
    const host=document.getElementById(containerId);
    if(host) host.innerHTML='<div class="card" style="text-align:center;color:var(--muted)">No high-yield questions in this set yet.</div>';
    return;
  }
  renderQuiz(containerId, filtered, state.title, state.source, indices);
}
function toggleHotOnly(){
  hotOnlyGlobal=!hotOnlyGlobal;
  try{ localStorage.setItem('nur256u2_hotonly', hotOnlyGlobal?'1':'0'); }catch(e){}
  Object.keys(quizFilterState).forEach(applyQuizFilter);
  updateHotToggleButtons();
  if(typeof examMode!=='undefined' && typeof buildQuizSet==='function'){ buildQuizSet(examMode); examIdx=0; saveExam(); drawExamQ(); }
  if(typeof startDrill==='function' && document.getElementById('drillBody')) startDrill();
  if(typeof renderPicker==='function') renderPicker();
  setTimeout(updateHotToggleButtons,0);
}
function updateHotToggleButtons(){
  document.querySelectorAll('.vision-toggle-btn').forEach(b=>{ b.textContent = hotOnlyGlobal ? '🔥 High-Yield Only: ON' : '🔥 High-Yield Only: OFF'; });
}

function toast(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800)}
function secQ(list){return list.map(x=>({q:x.q,opts:x.o.slice(),correct:(x.t==='multi'?x.c.slice():x.c),type:(x.t==='multi'?'multi':'single'),rat:x.r,hot:!!x.hot,topic:x.topic}))}

(function(){
  const btn=document.getElementById('backToTopBtn');

  const sync=()=>{ if(window.scrollY>400) btn.classList.add('show'); else btn.classList.remove('show'); };
  window.addEventListener('scroll', sync, {passive:true});
  sync();
})();
function jumpTo(e,id){ if(e) e.preventDefault(); const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

</script>

{topic:'copd',hot:false,q:'During implementation, a nurse gives a bronchodilator BEFORE the inhaled corticosteroid and teaches the patient to rinse afterward. Which best describes these actions?',o:['They are planning outcomes written for the care plan','They are correctly performed implementation actions','They are evaluation steps measuring the response','They are assessment activities that gather baseline data'],c:1,t:'single',r:'Administering meds in the correct order and teaching are IMPLEMENTATION — and these are done correctly (bronchodilator first opens airways; rinsing prevents thrush).'},
{topic:'airway',hot:false,q:'Gentle tidaling (fluid moving with respiration) in the water-seal chamber means:',o:['The tube is clotted','Normal functioning','An air leak','Tension pneumothorax'],c:1,t:'single',r:'Tidaling is normal and reflects pressure changes with breathing. Absence of tidaling may mean an obstruction or re-expanded lung.'},
{topic:'lytes',hot:false,q:'A patient with severe hyponatremia is corrected too rapidly. Which complication does the nurse monitor for?',o:['Deep vein thrombosis','Metabolic alkalosis','Osmotic demyelination syndrome','Hyperkalemia'],c:2,t:'single',r:'Correcting sodium <b>too quickly</b> causes <b>osmotic demyelination syndrome</b>. Correcting hypernatremia too quickly causes <b>cerebral edema</b>. Either direction, the rule is the same: <b>correct slowly</b>.'},
{topic:'copd',hot:false,q:'A nurse is caring for a patient with COPD. Which oxygen saturation goal is appropriate?',o:['95–100%','100% always','88–92%','80–85%'],c:2,t:'single',r:'COPD patients are chronic CO₂ retainers; the target is <b>88–92%</b>. Over-oxygenating can suppress their hypoxic drive to breathe.'},
{topic:'resp',hot:false,q:'A patient with restlessness, tachycardia, and air hunger but pink skin is showing ____ signs of respiratory compromise.',o:['early','late','terminal','no'],c:0,t:'single',r:'These are early/compensatory signs — intervene now, before cyanosis appears.'},
{topic:'copd',hot:false,q:'Which chest tube practices are correct? (Select all that apply)',o:['Submerge end in sterile water if it disconnects','Keep gauze at bedside','Routinely milk/strip the tubing','Tidaling in water seal is normal','Keep system below chest level'],c:[0,1,3,4],t:'multi',r:'Keep below chest level, gauze ready, expect tidaling, and re-establish a water seal if disconnected. Do NOT routinely milk/strip tubing.'},
{topic:'resp',hot:false,q:'A nurse auscultates fine crackles at the lung bases of a patient with heart failure. What do crackles most likely indicate?',o:['Upper airway obstruction','Narrowed airways','Fluid in the alveoli','Pleural inflammation'],c:2,t:'single',r:'<b>Crackles</b> = fluid in the alveoli, classic for CHF and pneumonia. Narrowed airways = wheezes; upper-airway obstruction = stridor.'},
{topic:'resp',hot:false,q:'The hallmark of ARDS is:',o:['A loud productive cough','Expiratory wheezing throughout','Bradycardia with hypotension','Hypoxemia refractory to oxygen'],c:3,t:'single',r:'Refractory hypoxemia (O₂ doesn\'t help) + bilateral infiltrates = ARDS.'},
{topic:'upper',hot:true,q:'A child is 4 hours post-tonsillectomy. Which finding requires immediate action?',o:['A low-grade temperature of 99.8F','Refusal to drink cold fluids','Frequent swallowing','A sore throat rated 4 of 10'],c:2,t:'single',r:'<b>Frequent swallowing is the earliest sign of postoperative hemorrhage</b> — blood is trickling down the back of the throat. Also watch for restlessness and tachycardia. Sore throat and reluctance to drink are expected.'},
{topic:'fluids',hot:true,q:'Which is the BEST indicator of a patient\'s fluid status?',o:['Blood pressure','Daily weight','Thirst','Skin turgor'],c:1,t:'single',r:'"Best indicator" = most reliable/specific. Daily weight is the gold standard (1 kg ≈ 1 L). The others are useful but less precise — classic "they\'re all assessments, pick the strongest" trap.'},
{topic:'fluids',hot:false,q:'An older adult presents with poor skin turgor, dry mucous membranes, postural hypotension, and a urine specific gravity of 1.035. The nurse recognizes this as:',o:['Hyponatremia','Fluid volume excess','SIADH','Fluid volume deficit'],c:3,t:'single',r:'Concentrated urine (high specific gravity) + hypotension + dry membranes = fluid volume deficit.'},
{topic:'pneumonia',hot:true,q:'A patient with pneumonia who was alert this morning is now confused and pulling at the sheets. The family says "that\'s not like him." What is the nurse\'s priority interpretation?',o:['Sundowning that can safely be ignored overnight','Normal aging that explains the change in behavior','A possible sign of worsening hypoxia or sepsis','Boredom from being confined to the room all day'],c:2,t:'single',r:'A NEW change in mental status — especially in an older adult with pneumonia — is a red flag for hypoxia, sepsis, or deterioration. Assess oxygenation and perfusion; don\'t dismiss it as expected.'},
{topic:'airway',hot:true,q:'A nurse notes CONTINUOUS bubbling in the water-seal chamber of a patient\'s chest drainage system. The patient\'s breathing is becoming labored. What is the priority concern?',o:['The lung has fully re-expanded and the tube can be removed','The wall suction is set too low for the ordered pressure','An air leak that could progress to a tension pneumothorax','Normal functioning of the water-seal chamber during breathing'],c:2,t:'single',r:'Continuous water-seal bubbling = air leak. Combined with worsening respiratory status, suspect a developing tension pneumothorax — assess connections and the patient, and notify the provider.'},
{topic:'fluids',hot:true,q:'Which findings indicate fluid volume overload? Select all that apply.',o:['Specific gravity above 1.030','Rapid weight gain','Jugular venous distention','Increased hematocrit and BUN','Serum osmolality below 270','Moist crackles and increased work of breathing'],c:[1,2,4,5],t:'multi',r:'Overload <b>dilutes</b>: osmolality under 270, dilutional hyponatremia, and <b>decreased</b> protein, albumin, BUN, Hgb, and Hct from hemodilution. High specific gravity and rising Hct/BUN are <b>deficit</b> findings.'},
{topic:'tb',hot:true,q:'A patient is admitted with suspected TB. Which action is the priority?',o:['Private room on airborne precautions with negative pressure','Draw blood cultures from two sites before any isolation','Standard precautions with a surgical mask for all visitors','Semi-private room with the door kept closed at all times'],c:0,t:'single',r:'TB is airborne — the FIRST priority is protecting others by placing the patient in a negative-pressure room with airborne precautions (staff in N95s). Diagnostics and care follow once isolation is set.'},
{topic:'blood',hot:true,q:'A patient receiving blood develops fever, chills, and low back pain 10 minutes into the transfusion. What is the nurse\'s FIRST action?',o:['Stop the blood and keep the saline line open','Continue the transfusion and document the findings','Slow the transfusion rate and recheck in 15 minutes','Give acetaminophen and continue the transfusion'],c:0,t:'single',r:'These are signs of a transfusion reaction. <b>STOP the blood immediately</b>, keep the NS line open (to maintain access and support BP), then notify the provider and stay with the patient.'},
{topic:'abg',hot:true,q:'A patient with end-stage kidney disease has an arterial blood gas drawn. Before reading the values, the nurse anticipates which type of imbalance?',o:['Metabolic, because the kidneys regulate bicarbonate','Respiratory, because the kidneys regulate carbon dioxide','Respiratory, because uremia depresses the respiratory drive','Mixed, because kidney disease affects both systems equally'],c:0,t:'single',r:'The organ names the type. <b>Kidneys regulate bicarbonate, the base, so a kidney problem is metabolic.</b> Lungs regulate CO2, the acid, so a lung problem is respiratory. In failure the kidney cannot excrete hydrogen ions or regenerate bicarbonate, so the expected gas is <b>metabolic acidosis</b>.'},
{topic:'abg',hot:false,q:'A patient with a severe asthma attack has been working hard to breathe for hours. ABG shows a rising PaCO₂ toward normal after being low. This change most likely indicates:',o:['The patient is improving','Metabolic compensation','Respiratory alkalosis worsening','Impending respiratory failure/fatigue'],c:3,t:'single',r:'A "normalizing" or rising CO₂ in a tiring asthmatic is an ominous sign of fatigue and impending respiratory failure — not improvement.'},
{topic:'lytes',hot:true,q:'A patient with a serum potassium of 6.8 mEq/L shows peaked T waves on the monitor. After calcium gluconate, which is the next priority intervention?',o:['Hold all IV fluids','Encourage high-potassium foods','Give a potassium supplement','Administer IV insulin with dextrose'],c:3,t:'single',r:'After stabilizing the heart with calcium, insulin+dextrose drives potassium back into the cells.'},
{topic:'abg',hot:false,q:'A patient with severe asthma has been working hard to breathe. The latest ABG shows the PaCO₂ has risen from 28 to 41 (now "normal"). How should the nurse interpret this?',o:['The patient has developed a metabolic alkalosis','No action is needed since the value is now normal','The patient is improving as the CO2 normalizes','The patient is tiring and heading toward failure'],c:3,t:'single',r:'In a tiring asthmatic who was hyperventilating (low CO₂), a "normalizing" or rising CO₂ is an ominous sign of fatigue and impending respiratory failure — escalate, don\'t relax.'},
{topic:'abg',hot:false,q:'ABG: pH 7.49, PaCO₂ 40, HCO₃ 30. Interpret:',o:['Respiratory alkalosis, fully compensated','Respiratory acidosis, uncompensated','Metabolic acidosis, partly compensated','Metabolic alkalosis, uncompensated'],c:3,t:'single',r:'pH high + HCO₃ high (same direction = metabolic) + CO₂ normal = uncompensated metabolic alkalosis. Think vomiting/NG suction.'},
{topic:'clinical',hot:true,q:'Four patients need attention. Based on priority, who does the nurse see FIRST?',o:['Stable post-op patient requesting pain medication for a 6 of 10','Asking detailed questions about discharge teaching and follow-up','Due for scheduled oral antibiotics that are now 20 minutes late','Pulse oximetry just dropped to 84% with increased work of breathing'],c:3,t:'single',r:'A falling O₂ sat with increased work of breathing is an airway/breathing emergency — see this patient first. The others are important but stable and non-urgent.'},
{topic:'resp',hot:true,q:'A post-operative patient has decreased breath sounds in the right base, SpO₂ 89%, and shallow breathing due to incisional pain. Which is the priority nursing action to prevent atelectasis?',o:['Restrict oral fluids to reduce pulmonary congestion','Administer the ordered cough suppressant for comfort','Encourage incentive spirometer use and deep breathing','Position the patient flat and limit movement in bed'],c:2,t:'single',r:'Atelectasis is prevented by <b>lung expansion</b>: incentive spirometry, deep breathing, coughing, turning q2h, and early ambulation. Lying flat and suppressing cough would worsen collapse.'},
{topic:'pneumonia',hot:false,q:'The treatment for a pleural effusion to remove fluid is:',o:['Intubation','Spirometry','Bronchoscopy','Thoracentesis'],c:3,t:'single',r:'Thoracentesis drains pleural fluid; sit the patient upright and watch for pneumothorax after.'},
{topic:'copd',hot:true,q:'Which statement about oxygen in COPD is the BEST guidance?',o:['Keep SpO₂ at 100% at all times','Always give 100% oxygen to maximize saturation','Oxygen is never given to COPD patients','Target an SpO₂ of 88–92%'],c:3,t:'single',r:'Absolute-word traps: "always 100%," "never," and "100% at all times" are all false. The BEST guidance is the controlled target of 88–92% to avoid blunting the hypoxic drive.'},
{topic:'pneumonia',hot:false,q:'Aspiration pneumonia most commonly affects the:',o:['Right lung','Pleural space','Left upper lobe','Left lower lobe'],c:0,t:'single',r:'The right mainstem bronchus is straighter and wider → aspiration favors the right.'},
{topic:'clinical',hot:true,q:'Which option is the BEST example of the IMPLEMENTATION step for a patient with thick respiratory secretions?',o:['Encourage fluids, do chest physiotherapy, assist with coughing','"Patient will expectorate secretions by the end of shift"','"Ineffective airway clearance related to thick secretions"','Auscultate the lungs for adventitious breath sounds'],c:0,t:'single',r:'The hands-on actions (fluids, CPT, coughing help) are IMPLEMENTATION. A is the diagnosis, C is the planning outcome, and D is assessment.'},
{topic:'abg',hot:false,q:'A patient hyperventilating from anxiety would develop which acid-base imbalance?',o:['Metabolic alkalosis','Respiratory acidosis','Respiratory alkalosis','Metabolic acidosis'],c:2,t:'single',r:'Blowing off CO₂ raises pH → respiratory alkalosis.'},
{topic:'pneumonia',hot:false,q:'Which assessment findings are expected in pneumonia? (Select all that apply)',o:['Hyperresonance to percussion','Crackles','Pleuritic chest pain','Dullness to percussion','Purulent productive cough'],c:[1,2,3,4],t:'multi',r:'Consolidation produces crackles and DULLNESS (not hyperresonance), plus purulent cough and pleuritic pain.'},
{topic:'upper',hot:true,q:'A patient reports hoarseness that has lasted three weeks. What is the nurse\'s priority action?',o:['Reassure the patient that laryngitis is self-limiting','Suggest over-the-counter throat lozenges','Recommend voice rest and reassess in one month','Facilitate evaluation for possible laryngeal cancer'],c:3,t:'single',r:'<b>Hoarseness persisting beyond 2 weeks is the earliest sign of laryngeal cancer</b> and requires evaluation. Reassurance or watchful waiting delays diagnosis.'},
{topic:'tb',hot:false,q:'CAUSE — How is tuberculosis transmitted?',o:['Contaminated food','Bloodborne contact','Skin-to-skin contact','Airborne droplet nuclei'],c:3,t:'single',r:'TB is airborne — which directly dictates the treatment/precaution (negative-pressure room, N95). Cause → intervention.'},
{topic:'fluids',hot:false,q:'Which action belongs to the ASSESSMENT step for a patient with suspected fluid volume deficit?',o:['Set a measurable goal for adequate hydration within 24 hours','Check skin turgor, mucous membranes, and urine specific gravity','Document that the hydration goal was met by the end of shift','Administer the prescribed isotonic IV fluid at the ordered rate'],c:1,t:'single',r:'Collecting data — skin turgor, mucous membranes, specific gravity — is ASSESSMENT. The others are implementation, planning, and evaluation respectively.'},
{topic:'fluids',hot:true,q:'A patient with a serum sodium of 116 mEq/L is having seizures. Which IV solution does the nurse anticipate?',o:['3% normal saline','0.45% normal saline','D5W','Lactated Ringer'],c:0,t:'single',r:'<b>3% NS is hypertonic</b> and is reserved for <b>severe symptomatic hyponatremia and cerebral edema</b>. It pulls water out of swollen cells. Hypotonic fluids and D5W would drive more water into the cells and worsen the seizures.'},
{topic:'clinical',hot:true,q:'A patient is dyspneic with an SpO₂ of 85%. Which action should the nurse take FIRST?',o:['Document the oxygen saturation','Notify the provider','Review the chart for the O₂ order history','Apply oxygen and reposition the patient'],c:3,t:'single',r:'This is a true emergency, so you ACT (implementation) rather than gather more data first. An SpO₂ of 85% with dyspnea needs immediate oxygen and repositioning — then notify/document.'},
{topic:'copd',hot:false,q:'CAUSE — What most commonly causes COPD?',o:['Long-term cigarette smoking','A bacterial infection','A genetic clotting disorder','An allergic reaction'],c:0,t:'single',r:'COPD is chronic, largely irreversible airflow limitation usually from long-term smoking. Cause drives everything: air trapping → barrel chest → CO₂ retention.'},
{topic:'lytes',hot:false,q:'A nurse reviews orders for a patient with fluid volume EXCESS from heart failure. Which order should the nurse question?',o:['Sodium restriction','Daily weights','Administer the prescribed loop diuretic','Infuse 1 L of 0.9% normal saline over 1 hour'],c:3,t:'single',r:'A patient already fluid-overloaded should not get a rapid isotonic bolus — that would worsen the overload. Daily weights, sodium restriction, and diuretics are all appropriate; question the saline bolus.'},
{topic:'clinical',hot:true,q:'Place these in the correct ADPIE order: the nurse should do which FIRST when starting care for a new patient?',o:['Implement interventions','Evaluate outcomes','Set goals for the patient','Perform a head-to-toe assessment'],c:3,t:'single',r:'Assessment is always first — you cannot diagnose, plan, implement, or evaluate without data. Out-of-order options are a classic trap.'},
{topic:'blood',hot:false,q:'Which actions must the nurse complete BEFORE starting a blood transfusion? (Select all that apply)',o:['Obtain baseline vital signs','Confirm type and cross-match','Ensure a patent IV with normal saline','Verify informed consent','Prime the tubing with lactated Ringer\'s'],c:[0,1,2,3],t:'multi',r:'Before transfusion: <b>consent, type & cross-match, patent IV primed with NORMAL SALINE, and baseline vitals</b> (plus two-nurse verification). <b>Never use LR</b> — its calcium can cause clotting.'},
{topic:'upper',hot:true,q:'A patient with obstructive sleep apnea is admitted after surgery. Which order should the nurse question?',o:['Continuous pulse oximetry throughout the night','Head of bed elevated 30 degrees while sleeping','Bringing the patient\'s home CPAP to the bedside','Hydromorphone PCA with a continuous basal rate'],c:3,t:'single',r:'Patients with OSA are <b>highly sensitive to opioids and sedatives</b>. A continuous basal opioid infusion in an OSA patient markedly raises the risk of respiratory arrest. The other three orders are protective.'},
{topic:'clinical',hot:false,q:'After identifying fluid overload, the nurse slows the infusion and raises the head of the bed. These actions represent which step?',o:['Evaluation','Implementation','Assessment','Planning'],c:1,t:'single',r:'Performing the interventions (slowing the IV, repositioning) is IMPLEMENTATION — the "doing" step. This is the step your professor is emphasizing.'},
{topic:'resp',hot:false,q:'A barrel chest is most associated with:',o:['COPD/emphysema','Pneumonia','Pleural effusion','Asthma'],c:0,t:'single',r:'Increased AP diameter (barrel chest) is classic for COPD/emphysema.'},
{topic:'abg',hot:false,q:'A patient with metabolic acidosis from DKA is breathing deeply and rapidly (Kussmaul respirations). What does the nurse understand about this finding?',o:['It is the body compensating by blowing off CO₂','It is a sign the patient is panicking and needs sedation','It indicates respiratory alkalosis','It should be suppressed with oxygen'],c:0,t:'single',r:'Kussmaul respirations are a compensatory response — the lungs blow off CO₂ (acid) to raise the pH. Suppressing or sedating this would worsen the acidosis. Treat the underlying DKA.'},
{topic:'airway',hot:true,q:'A patient with a chest tube accidentally pulls the tube out of their chest. What should the nurse do FIRST?',o:['Reinsert the chest tube','Lay the patient flat and call radiology','Clamp the drainage tubing','Cover the site with sterile occlusive'],c:3,t:'single',r:'For a dislodged chest tube, immediately cover the insertion site with petroleum/occlusive gauze taped on THREE sides — this lets air escape but prevents air from re-entering and causing a tension pneumothorax. Then notify the provider.'},
{topic:'fluids',hot:true,q:'Which of the following is NOT a sign of fluid volume deficit?',o:['Poor skin turgor and dry lips','Concentrated, low-volume urine','Tachycardia with hypotension','Bounding pulse with crackles'],c:3,t:'single',r:'Trap: A, B, and D are all TRUE signs of deficit, so they feel right. The impostor is C — a bounding pulse with crackles is fluid volume EXCESS. When you see "NOT," hunt the one that does not belong.'},
{topic:'airway',hot:false,q:'MANIFESTS — Which findings indicate a TENSION pneumothorax? (Select all that apply)',o:['Tracheal deviation away from the affected side','Absent breath sounds on the affected side','Jugular vein distention','Rust-colored sputum','Severe respiratory distress and hypotension'],c:[0,1,2,4],t:'multi',r:'Tension pneumothorax: tracheal deviation, absent breath sounds, distress/hypotension, and JVD from compressed great vessels. Rust sputum belongs to pneumonia.'},
{topic:'tb',hot:false,q:'The TB skin test (Mantoux) is read by measuring which of the following — and which is the WRONG thing to measure?',o:['Measure the wheal size at injection','Measure induration; redness is the wrong thing to measure','Measure redness; induration is the wrong thing to measure','Measure warmth'],c:1,t:'single',r:'You measure INDURATION (the raised firm area), not redness — measuring redness is the classic trap. This is a "what\'s right vs. what\'s wrong" combo he likes.'},
{topic:'pneumonia',hot:false,q:'Safe endotracheal tube cuff pressure is:',o:['30-35 mmHg','10-15 mmHg','40-45 mmHg','20-25 mmHg'],c:3,t:'single',r:'20-25 mmHg; too high causes necrosis, too low allows aspiration.'},
{topic:'pneumonia',hot:false,q:'Hospital-acquired pneumonia (HAP) is defined as developing:',o:['Before admission','48 hours or more after admission','Only in the ICU','Within 24 hours of admission'],c:1,t:'single',r:'HAP develops ≥48 hours after admission and was not incubating at admit.'},
{topic:'resp',hot:false,q:'Tidal volume is best defined as:',o:['Air moved in and out with each normal breath','The total capacity of both lungs combined','The maximum volume that can be exhaled','Air remaining in the lungs after exhalation'],c:0,t:'single',r:'Tidal volume = the air moved with each normal breath.'},
{topic:'fluids',hot:true,q:'All of the following IV fluids are isotonic EXCEPT:',o:['D5W (in the bag)','0.9% Normal Saline','Lactated Ringer\'s','0.45% Normal Saline'],c:3,t:'single',r:'"EXCEPT" = find the odd one out. NS, LR, and in-bag D5W are isotonic; 0.45% NS is HYPOtonic. Three belong together — the loner is your answer.'},
{topic:'fluids',hot:false,q:'The nurse is monitoring a patient with heart failure. Which findings indicate FLUID VOLUME EXCESS? (Select all that apply)',o:['Bounding pulse','Crackles in the lungs','Jugular vein distention','Poor skin turgor','Weight gain of 2 kg overnight'],c:[0,1,2,4],t:'multi',r:'JVD, crackles, bounding pulse, and rapid weight gain are all "WET" signs of <b>hypervolemia</b>. Poor skin turgor is a "DRY" sign of <b>deficit</b>, not excess.'},
{topic:'fluids',hot:false,q:'A nurse reviews labs: Na 122 mEq/L. Which findings does the nurse expect? (Select all that apply)',o:['Extreme thirst with flushed skin','Muscle cramps','Headache','Seizures if severe','Confusion'],c:[1,2,3,4],t:'multi',r:'Hyponatremia causes neuro changes: confusion, cramps, headache, seizures. Flushed skin + extreme thirst is hypernatremia.'},
{topic:'airway',hot:true,q:'A patient with a new tracheostomy suddenly has difficulty breathing and the tube appears dislodged. Which items at the bedside are MOST important right now? (Select all that apply)',o:['A box of oral medications','Spare trach tube (same size and one size smaller)','Obturator','Suction equipment','A manual resuscitation bag'],c:[1,2,3,4],t:'multi',r:'For an airway emergency you need the obturator, spare trach tubes (same + smaller), a resuscitation bag, and suction. Oral meds are irrelevant to the immediate airway threat.'},
{topic:'lytes',hot:false,q:'Which clinical findings would the nurse expect in a patient with HYPOcalcemia? (Select all that apply)',o:['Positive Trousseau sign','Constipation','Tetany','Kidney stones','Positive Chvostek sign'],c:[0,2,4],t:'multi',r:'Hypocalcemia causes neuromuscular irritability: positive <b>Trousseau</b> (hand spasm with BP cuff), positive <b>Chvostek</b> (facial twitch), and <b>tetany</b>. Constipation and kidney stones are signs of HYPERcalcemia.'},
{topic:'pneumonia',hot:false,q:'Which interventions are part of the VAP bundle? (Select all that apply)',o:['Sedation vacations','HOB elevated 30-45°','DVT prophylaxis','Keeping patient supine and flat','Daily oral care with chlorhexidine'],c:[0,1,2,4],t:'multi',r:'The VAP bundle includes HOB elevation, oral chlorhexidine, sedation vacations, DVT and stress ulcer prophylaxis. Flat positioning increases aspiration.'},
{topic:'blood',hot:true,q:'Which action should the nurse take FIRST before starting a blood transfusion?',o:['Take a full set of baseline vital signs on the patient','Verify informed consent and the type and cross-match','Retrieve the unit of blood from the blood bank','Prime the transfusion tubing with normal saline'],c:1,t:'single',r:'All four happen — but "first" matters. Confirm consent and type & cross BEFORE retrieving blood (you don\'t pull blood you\'re not cleared to give). Order traps reward knowing the sequence, not just the steps.'},
{topic:'blood',hot:false,q:'Which statement about blood transfusion timing is correct?',o:['Blood can sit at the bedside for up to 2 hours before starting','You may store blood in the unit refrigerator','A unit must be started within 30 minutes of leaving the blood bank','A unit may infuse over 6 hours'],c:2,t:'single',r:'The only correct statement: start within 30 minutes of pickup. A unit finishes within 4 hours (not 6), blood never sits warming at the bedside, and it\'s never stored in a regular unit fridge.'},
{topic:'airway',hot:true,q:'A patient\'s chest tube is accidentally pulled out. What is the nurse\'s priority action?',o:['Cover the site with sterile occlusive gauze taped on three sides','Lay the patient flat and apply firm pressure over the site','Reinsert the chest tube immediately using sterile technique','Apply a tight occlusive dressing taped down on all four sides'],c:0,t:'single',r:'Cover with <b>sterile occlusive gauze taped on THREE sides</b> — this lets trapped air escape while preventing air from being sucked in, avoiding a tension pneumothorax. Taping all four sides could trap air.'},
{topic:'fluids',hot:true,q:'A patient receiving IV fluids develops a new cough, dyspnea, and crackles. The nurse should FIRST:',o:['Give the next scheduled dose of the ordered antibiotic','Slow or stop the infusion and raise the head of the bed','Lay the patient flat and apply a warm blanket','Increase the IV rate to push the fluid through faster'],c:1,t:'single',r:'These are signs of fluid overload/pulmonary edema — slow the infusion and sit the patient up to ease breathing.'},
{topic:'fluids',hot:false,q:'Best indicator of a patient\'s daily fluid status?',o:['Daily weight','BP','Skin turgor','Heart rate'],c:0,t:'single',r:'Daily weight — 1 kg ≈ 1 L of fluid.'},
{topic:'fluids',hot:true,q:'Which is the best indicator of fluid volume change in a patient?',o:['Skin turgor','Urine color','Daily weight','Intake and output totals'],c:2,t:'single',r:'<b>Changes in weight are the best indicator of fluid volume change.</b> One kilogram equals about one liter. I&amp;O and clinical signs are considered alongside it, but weight is the most reliable and quantifiable.'},
{topic:'fluids',hot:true,q:'Which laboratory pattern is consistent with fluid volume deficit?',o:['Decreased sodium with an elevated albumin','Normal labs with an elevated white count','Increased hematocrit, BUN, and sodium with osmolality above 300','Decreased hematocrit, BUN, and sodium with osmolality below 270'],c:2,t:'single',r:'Deficit <b>concentrates</b> the blood: ↑Hct, ↑Hgb, ↑BUN, ↑Na, <b>osmolality over 300</b>, and <b>specific gravity over 1.030</b>. Overload does the mirror image — <b>everything dilutes</b>.'},
{topic:'abg',hot:false,q:'Which patient situation should lead the nurse to anticipate a respiratory rather than a metabolic acid-base disturbance?',o:['Oversedation from an opioid, which slows ventilation','Prolonged diarrhea with significant bicarbonate loss','Acute kidney injury with a rising creatinine level','Diabetic ketoacidosis with ketones in the urine'],c:0,t:'single',r:'Lungs own CO2, so anything that changes ventilation is <b>respiratory</b>. Oversedation causes hypoventilation, CO2 is retained, and the result is respiratory acidosis. Diarrhea loses bicarbonate, kidney injury retains acid, and DKA produces fixed acid \u2014 all three are <b>metabolic</b>.'},
{topic:'lytes',hot:true,q:'Which assessment finding is the hallmark of hypermagnesemia?',o:['Muscle tetany','Hyperactive reflexes','Positive Chvostek sign','Absence of deep tendon reflexes'],c:3,t:'single',r:'<b>Loss of deep tendon reflexes is the first and defining sign of hypermagnesemia</b>, along with decreased consciousness, confusion, muscle weakness, hypotension, and bradycardia. The antidote is <b>calcium gluconate</b>. Chvostek and tetany belong to <b>hypo</b>calcemia and hypomagnesemia.'},
{topic:'clinical',hot:true,q:'A nurse suspects a patient is deteriorating but the situation is not yet an emergency. Per the nursing process, what should the nurse do FIRST?',o:['Begin documenting the concern in the record','Administer the PRN medications that are ordered','Complete a focused assessment of the patient','Notify the rapid response team right away'],c:2,t:'single',r:'When it isn\'t a clear emergency, gather data first — a focused ASSESSMENT guides what to do next. Acting or escalating before assessing skips a step (unless the patient is in obvious crisis).'},
{topic:'copd',hot:false,q:'Continuous bubbling in the WATER SEAL chamber of a chest tube indicates:',o:['Suction is off','Normal function','An air leak','Lung re-expansion'],c:2,t:'single',r:'Continuous water-seal bubbling = air leak; notify the provider.'},
{topic:'abg',hot:false,q:'ABG: pH 7.30, PaCO₂ 55, HCO₃ 24. The interpretation is:',o:['Partly compensated metabolic acidosis','Partly compensated metabolic alkalosis','Uncompensated respiratory alkalosis','Uncompensated respiratory acidosis'],c:3,t:'single',r:'Low pH, high CO₂ (opposite), normal HCO₃ = uncompensated respiratory acidosis.'},
{topic:'lytes',hot:true,q:'A nurse is starting an IV potassium infusion and the patient reports burning at the site. The nurse should FIRST:',o:['Stop the infusion and assess the site for infiltration','Apply a warm compress to the site and keep the infusion going','Document the complaint and reassess the site in one hour','Slow the rate by half and continue while watching the site'],c:0,t:'single',r:'Potassium is a vesicant — burning suggests infiltration/extravasation, which can cause tissue damage. Stop the infusion and assess the site immediately. Never IV-push potassium, and never keep running a painful vesicant.'},
{topic:'tb',hot:false,q:'A patient\'s Mantoux test is being read. When should the nurse assess the result, and what is measured?',o:['1 week; measure redness','Immediately; measure the wheal','24 hours; measure redness','48–72 hours; measure induration'],c:3,t:'single',r:'Read the Mantoux at <b>48–72 hours</b> and measure the <b>induration</b> (the raised, hardened area), not the redness.'},
{topic:'resp',hot:true,q:'Which adventitious sound is a medical emergency?',o:['Rhonchi','Wheezes','Stridor','Fine crackles'],c:2,t:'single',r:'Stridor = upper airway obstruction, an emergency.'},
{topic:'tb',hot:false,q:'TREATMENT — A patient on rifampin should be taught that the drug commonly:',o:['Raises potassium','Causes hearing loss','Turns body fluids orange','Causes a barrel chest'],c:2,t:'single',r:'Rifampin harmlessly turns urine/sweat/tears orange (and stains soft contacts). Knowing treatment side effects answers a whole class of questions.'},
{topic:'copd',hot:false,q:'During a severe asthma attack, the nurse notes that the patient\'s previously loud wheezing has suddenly stopped. What does this indicate?',o:['The attack is resolving','The medication worked','Impending respiratory failure','The patient needs less oxygen'],c:2,t:'single',r:'A <b>silent chest</b> during a severe attack means almost no air is moving — a sign of <b>impending respiratory failure</b>. This is an emergency requiring immediate intervention, NOT a sign of improvement.'},
{topic:'lytes',hot:true,q:'MANIFESTS → TREATMENT — A patient with hyperkalemia shows peaked T waves. What is given FIRST and why?',o:['Insulin with dextrose, to shift K into cells','A potassium supplement','Calcium gluconate, to protect/stabilize the heart','A beta blocker'],c:2,t:'single',r:'Peaked T waves = cardiac threat. Calcium gluconate stabilizes the myocardium FIRST (it doesn\'t lower K). Insulin+dextrose then shifts K into cells. Manifestation drives the priority treatment.'},
{topic:'resp',hot:false,q:'A patient with acute tracheobronchitis should AVOID which medication?',o:['Antibiotics','Antipyretics','Analgesics','Antihistamines'],c:3,t:'single',r:'Antihistamines dry secretions, making them harder to clear.'},
{topic:'pneumonia',hot:false,q:'Rusty or blood-tinged sputum is most associated with:',o:['Pulmonary edema','Viral bronchitis','Lung abscess','Pneumococcal pneumonia'],c:3,t:'single',r:'Rusty sputum classically suggests pneumococcal pneumonia.'},
{topic:'tb',hot:false,q:'Which statement by a patient indicates correct understanding of TB treatment?',o:['"I can stop the medicine as soon as I start feeling better."','"One medication should be enough to clear this infection."','"I must take all the medicines for the full 6 to 12 months."','"I only need the treatment while I still have a cough."'],c:2,t:'single',r:'Full adherence to the multi-drug regimen for the entire course prevents resistance and relapse.'},
{topic:'airway',hot:false,q:'A nurse observes continuous, vigorous bubbling in the WATER SEAL chamber of a chest drainage system. What does this indicate?',o:['The lung has fully re-expanded','An air leak in the system','The suction is too low','Normal functioning'],c:1,t:'single',r:'<b>Continuous bubbling in the water seal chamber signals an air leak</b> — check connections and notify the provider; it can lead to tension pneumothorax. Intermittent bubbling/tidaling is normal.'},
{topic:'abg',hot:false,q:'ABG: pH 7.29, PaCO₂ 38, HCO₃ 16. This indicates:',o:['Metabolic alkalosis','Metabolic acidosis','Respiratory acidosis','Respiratory alkalosis'],c:1,t:'single',r:'Low pH matches low HCO₃ (same direction) = metabolic acidosis (DKA, diarrhea).'},
{topic:'abg',hot:true,q:'An ABG shows pH 7.30, PaCO₂ 58, HCO₃ 26 in a patient with a COPD exacerbation. Which intervention is the priority?',o:['Administer high-flow 100% oxygen by non-rebreather','Encourage the patient to breathe into a paper bag','Give IV sodium bicarbonate','Improve ventilation'],c:3,t:'single',r:'This is respiratory acidosis from hypoventilation. The fix is improving ventilation and giving controlled oxygen (target 88–92% in COPD). Slamming 100% O₂ can blunt the hypoxic drive; bicarb and rebreathing don\'t address the trapped CO₂.'},
{topic:'resp',hot:true,q:'Which is the BEST first action for a patient who becomes dyspneic with new crackles during an IV infusion?',o:['Lay the patient flat to improve venous return quickly','Increase the IV rate to flush the line and clear it','Slow or stop the infusion and raise the head of the bed','Give the next scheduled antibiotic dose and reassess'],c:2,t:'single',r:'New crackles + dyspnea = fluid overload. BEST first action: reduce the fluid going in and sit them up to ease breathing. Lying flat or increasing the rate makes it worse.'},
{topic:'airway',hot:false,q:'The nurse is checking an endotracheal tube cuff. Which pressure is within the safe range?',o:['10 mmHg','35 mmHg','22 mmHg','45 mmHg'],c:2,t:'single',r:'Safe cuff pressure is <b>20–25 mmHg</b>. Below that risks aspiration; above 25 risks tracheal ischemia and necrosis.'},
{topic:'tb',hot:false,q:'Airborne precautions for tuberculosis require which type of respirator/room?',o:['Gown and gloves with a regular semi-private room','Positive-pressure room with standard precautions','Surgical mask in any available private room','N95 respirator with a negative-pressure room'],c:3,t:'single',r:'TB is airborne — use an N95 (or higher) and a negative-pressure (airborne isolation) room.'},
{topic:'blood',hot:false,q:'A nurse retrieves a unit of blood from the blood bank. Within what time frame must the infusion be STARTED?',o:['Within 1 hour','Within 15 minutes','Within 4 hours','Within 30 minutes'],c:3,t:'single',r:'Blood must be started within 30 minutes of retrieval from the blood bank; if it cannot be started, return it rather than letting it warm at the bedside.'},
{topic:'fluids',hot:false,q:'A patient with cerebral edema is ordered a hypertonic solution. Which is hypertonic?',o:['Lactated Ringer\'s','0.9% Normal Saline','0.45% Normal Saline','3% Saline'],c:3,t:'single',r:'3% saline is hypertonic — it pulls fluid out of swollen cells, useful for cerebral edema. Monitor closely.'},
{topic:'airway',hot:false,q:'Which items should be kept at the bedside of a patient with a new tracheostomy? (Select all that apply)',o:['A scalpel','Resuscitation bag','Spare trach tube (same size and one smaller)','Obturator','Suction equipment'],c:[1,2,3,4],t:'multi',r:'Keep obturator, spare trach tubes (same and smaller), suction, and a manual resuscitation bag. A scalpel is not standard bedside trach equipment.'},
{topic:'pneumonia',hot:false,q:'MANIFESTS — In an older adult, which may be the EARLIEST sign of pneumonia?',o:['New confusion','A high fever','Weight gain','Clubbing of the fingers'],c:0,t:'single',r:'Older adults often show new confusion before classic fever/cough — a key manifestation to recognize and never dismiss.'},
{topic:'abg',hot:false,q:'ABG: pH 7.30, PaCO₂ 52, HCO₃ 24. How does the nurse interpret this?',o:['Metabolic acidosis','Metabolic alkalosis, compensated','Respiratory acidosis, uncompensated','Respiratory alkalosis'],c:2,t:'single',r:'pH is low (acidosis). CO₂ is high and moves OPPOSITE the pH → respiratory. HCO₃ is normal → no compensation yet. = <b>uncompensated respiratory acidosis</b> (think COPD, opioids).'},
{topic:'airway',hot:false,q:'Continuous bubbling in the water seal chamber means?',o:['Lung re-expanded','Suction too high','Air leak','Normal'],c:2,t:'single',r:'Continuous water-seal bubbling = air leak; notify provider.'},
{topic:'fluids',hot:true,q:'Which is the MOST reliable indicator that a patient with fluid volume DEFICIT is improving?',o:['Urine output rising toward 30+ mL/hr','Heart rate is unchanged','Skin looks slightly less dry','The patient reports feeling less thirsty'],c:0,t:'single',r:'"Most reliable" = the objective, measurable one. Improving urine output reflects restored perfusion. Thirst and skin appearance are softer/subjective; an unchanged HR shows no improvement.'},
{topic:'tb',hot:true,q:'All of the following require AIRBORNE precautions EXCEPT:',o:['Tuberculosis, which requires a negative-pressure room','Measles, which spreads on small airborne particles','Varicella, which stays suspended in room air','Bacterial pneumonia, which requires droplet precautions'],c:3,t:'single',r:'TB, measles, and varicella are airborne ("My Chicken Hez TB"). Bacterial pneumonia is generally droplet, not airborne — the EXCEPT. Watch for the one that uses a different precaution type.'},
{topic:'copd',hot:false,q:'A nurse teaches a newly diagnosed asthma patient how to use a peak flow meter. Patient teaching is part of which step?',o:['Assessment','Implementation','Planning','Evaluation'],c:1,t:'single',r:'Patient education is an IMPLEMENTATION action — it\'s an intervention you carry out. Checking whether the patient can correctly demonstrate it afterward would be evaluation.'},
{topic:'pneumonia',hot:false,q:'A patient develops a fever, productive cough, and an infiltrate 72 hours after admission. This is classified as:',o:['Fungal pneumonia','Community-acquired pneumonia','Aspiration pneumonia','Hospital-acquired pneumonia'],c:3,t:'single',r:'Pneumonia developing 48+ hours after admission = hospital-acquired (nosocomial).'},
{topic:'abg',hot:false,q:'ABG: pH 7.37, PaCO₂ 55, HCO₃ 31. This represents:',o:['Fully compensated respiratory acidosis','Uncompensated respiratory acidosis','Metabolic alkalosis','Normal'],c:0,t:'single',r:'Normal pH on the acidic side with both CO₂ and HCO₃ abnormal = fully compensated respiratory acidosis.'},
{topic:'upper',hot:false,q:'Which patient with pharyngitis most likely has a streptococcal infection?',o:['Sore throat with sneezing and itchy watery eyes','Sudden sore throat with fever, exudate, tender nodes, and no cough','Gradual sore throat with a cough and runny nose','Mild sore throat with hoarseness and no fever'],c:1,t:'single',r:'Strep features <b>sudden onset, fever, tonsillar exudate, tender anterior nodes, and the absence of cough</b>. A cough and coryza point toward a viral cause.'},
{topic:'copd',hot:false,q:'MANIFESTS — Which physical finding is classic for chronic COPD?',o:['A positive Trousseau sign on inflation','Tracheal deviation toward the good side','Rust-colored sputum on the morning specimen','Barrel chest with prolonged expiration'],c:3,t:'single',r:'Chronic air trapping enlarges the AP diameter → barrel chest, plus prolonged expiration and pursed-lip breathing. (Tracheal deviation = tension pneumo; rust sputum = pneumonia; Trousseau = hypocalcemia.)'},
{topic:'tb',hot:false,q:'Which is the ONLY confirmatory test for active TB?',o:['Mantoux skin test','Chest x-ray','Sputum culture (acid-fast bacilli)','QuantiFERON Gold blood test'],c:2,t:'single',r:'Skin test and IGRA show exposure; x-ray is suggestive. Sputum culture is the only one that CONFIRMS active disease. "Only/confirmatory" wording points to the definitive test.'},
{topic:'copd',hot:true,q:'In a severe asthma attack, which assessment finding is the MOST concerning?',o:['Audible wheezing throughout expiration','A sudden "silent chest" with no wheezing','Use of the rescue inhaler twice today','A respiratory rate of 24 breaths a minute'],c:1,t:'single',r:'Trap: wheezing "sounds worse," so people pick A. But a silent chest = no air movement = impending respiratory failure, the MOST concerning. Loud wheezing at least means air is moving.'},
{topic:'pneumonia',hot:false,q:'A patient recovering from a stroke with dysphagia is at high risk for aspiration pneumonia. Which intervention best reduces this risk?',o:['Feed quickly with larger bites to reduce mealtime fatigue','Position the patient flat during meals to slow the swallow','Offer all liquids through a straw to improve bolus control','Keep HOB elevated 30-45 degrees and get a swallow evaluation'],c:3,t:'single',r:'Aspiration prevention = <b>HOB elevated 30–45°, swallow evaluation, upright positioning, small bites, and avoiding straws</b>. Lying flat or rushing increases aspiration risk.'},
{topic:'fluids',hot:false,q:'A patient in diabetic ketoacidosis is started on IV fluids. Which is given initially?',o:['0.9% normal saline','D5W','Lactated Ringer','3% saline'],c:0,t:'single',r:'<b>0.9% NS initially</b> to expand intravascular volume. Subsequent fluid choice depends on the <b>sodium level and glucose</b>, and dextrose is added once glucose falls to about 200 to prevent a rapid drop.'},
{topic:'lytes',hot:true,q:'A patient\'s potassium remains low despite repeated replacement. Which electrolyte should the nurse check?',o:['Magnesium','Bicarbonate','Chloride','Phosphorus'],c:0,t:'single',r:'<b>Hypomagnesemia is associated with hypokalemia.</b> Magnesium is required for the cell to hold onto potassium, so potassium will not correct until magnesium is replaced. This is the classic stubborn-potassium stem.'},
{topic:'upper',hot:false,q:'Which instructions should the nurse give a patient after an episode of epistaxis? Select all that apply.',o:['Avoid heavy lifting and straining','Blow the nose to clear remaining clots','Use a humidifier at home','Avoid blowing the nose forcefully','Avoid aspirin and NSAIDs unless approved','Tilt the head back if bleeding recurs'],c:[0,2,3,4],t:'multi',r:'After epistaxis, avoid anything that raises pressure or disrupts the clot: <b>no forceful blowing, no straining or heavy lifting</b>, and no aspirin or NSAIDs. Humidification prevents drying and recurrence. Tilting back is always wrong.'},
{topic:'resp',hot:false,q:'While auscultating, the nurse hears a high-pitched, musical sound on expiration. This is documented as:',o:['Crackles (rales)','Pleural friction rub','Stridor','Wheezes'],c:3,t:'single',r:'Wheezes are high-pitched musical sounds from narrowed airways, often on expiration (asthma, COPD).'},
{topic:'fluids',hot:false,q:'Which statement about dextrose in IV solutions is accurate?',o:['It is contraindicated in all diabetic patients','It provides calories then metabolizes, leaving an isotonic or hypotonic solution','It replaces sodium and chloride losses','It remains hypertonic in the body indefinitely'],c:1,t:'single',r:'<b>Dextrose provides energy and assists with protein breakdown, then metabolizes quickly and disappears.</b> So a solution that is hypertonic in the bag becomes <b>isotonic or hypotonic in the patient</b>. Both descriptions are true, which is why he offers both.'},
{topic:'fluids',hot:false,q:'A nurse auscultates crackles in a patient receiving IV fluids. Which step of the nursing process is this?',o:['Assessment','Diagnosis','Implementation','Evaluation'],c:0,t:'single',r:'Auscultating (collecting objective data) is ASSESSMENT. Naming "fluid overload" would be diagnosis; slowing the IV would be implementation; rechecking the lungs afterward would be evaluation.'},
{topic:'fluids',hot:true,q:'Which assessment is the BEST indicator of a patient\'s daily fluid status?',o:['Urine color','Daily weight','Blood pressure','Skin turgor'],c:1,t:'single',r:'<b>Daily weight</b> is the single most reliable indicator of fluid status — a gain or loss of 1 kg equals roughly 1 liter of fluid. Take it at the same time, same scale, same clothing.'},
{topic:'abg',hot:false,q:'ABG: pH 7.30, PaCO₂ 52, HCO₃ 25. Interpret:',o:['Metabolic alkalosis, fully compensated','Metabolic acidosis, partly compensated','Respiratory alkalosis, uncompensated','Respiratory acidosis, uncompensated'],c:3,t:'single',r:'pH low + CO₂ high (opposite directions = respiratory) + HCO₃ normal = uncompensated respiratory acidosis.'},
{topic:'blood',hot:false,q:'The maximum time a unit of blood should hang/infuse is:',o:['6 hours','2 hours','4 hours','8 hours'],c:2,t:'single',r:'A unit must be completed within 4 hours to prevent bacterial growth.'},
{topic:'lytes',hot:true,q:'A potassium level of 6.8 mEq/L with peaked T waves requires which FIRST intervention?',o:['Potassium chloride','Encourage bananas','Calcium gluconate','Furosemide'],c:2,t:'single',r:'Calcium gluconate stabilizes the cardiac membrane immediately.'},
{topic:'copd',hot:true,q:'Which of the following is NOT an appropriate intervention for a COPD patient?',o:['Pursed-lip breathing','Energy-conservation techniques','Routine high-flow 100% oxygen','Tripod positioning'],c:2,t:'single',r:'Routine 100% oxygen can suppress the hypoxic drive in COPD — the inappropriate action. Pursed-lip breathing, tripod position, and energy conservation are all correct.'},
{topic:'lytes',hot:true,q:'A nurse is caring for a patient with hyperkalemia. Which action is the BEST FIRST priority?',o:['Give insulin with dextrose','Teach the patient about low-potassium foods','Administer IV calcium gluconate','Restrict dietary potassium'],c:2,t:'single',r:'Several answers are correct things to do — but "best first" = address the biggest threat. Calcium gluconate protects the heart NOW (it doesn\'t lower K, but it stabilizes the myocardium). Insulin+dextrose comes next; teaching/diet are low priority.'},
{topic:'abg',hot:true,q:'Which is NOT a function regulated by the respiratory system?',o:['Acid–base balance (CO₂ regulation)','Oxygen transport','Gas exchange','Bicarbonate regulation'],c:3,t:'single',r:'The lungs handle O₂, gas exchange, and CO₂ (acid). Bicarbonate is regulated by the KIDNEYS — the impostor in a "NOT" question that lists three lung jobs and one kidney job.'},
{topic:'blood',hot:true,q:'Which patient finding during a transfusion is the MOST concerning and requires immediate action?',o:['The patient feels a little cold and asks for a blanket','The patient is anxious about needles','New crackles, dyspnea, and a jump in blood pressure','The IV site is slightly cool to touch'],c:2,t:'single',r:'New crackles + dyspnea + rising BP signal circulatory/fluid overload (TACO). Slow or stop the infusion and sit the patient up. The other findings are minor or non-urgent.'},
