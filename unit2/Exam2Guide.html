document.getElementById('sec-respchronic').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🌬️</span> Chronic Pulmonary</h2>
<p class="intro-line">Chapter 21 — COPD, asthma, bronchiectasis, and tuberculosis. The long-haul conditions.</p>

<div class="jumpbar">In this section: <a href="#respchronic-copdasthma" onclick="jumpTo(event,'respchronic-copdasthma')">COPD & Asthma</a> <a href="#respchronic-tuberculos" onclick="jumpTo(event,'respchronic-tuberculos')">Tuberculosis</a></div>

<div class="grphead" id="respchronic-copdasthma"><h3>COPD &amp; Asthma</h3>
<div class="card" style="border-color:var(--amber)">
  <h3>🚬 COPD — the master chain</h3>
  <p class="why-chain"><b>Airflow limitation that is progressive and NOT fully reversible.</b> That one word — irreversible — separates it from asthma and drives every decision.</p>
  <ol class="chainlist">
    <li><b>1.</b> Chronic irritant exposure, usually <b>smoking</b>, inflames the airways.</li>
    <li><b>2.</b> Inflammation causes <b>mucus hypersecretion, airway wall thickening, and destruction of alveolar walls</b>.</li>
    <li><b>3.</b> Destroyed alveolar walls mean <b>lost elastic recoil</b> — the passive force that normally pushes air OUT.</li>
    <li><b>4.</b> Air gets in but <b>cannot get out</b>. This is <b>air trapping</b>.</li>
    <li><b>5.</b> Trapped air <b>raises residual volume</b>, <b>increases compliance</b> (floppy lungs), and <b>flattens the diaphragm</b> → the <b>barrel chest</b>.</li>
    <li><b>6.</b> A flattened diaphragm is mechanically inefficient, so <b>accessory muscles</b> get recruited and the work of breathing climbs.</li>
    <li><b>7.</b> Chronic hypoxia causes <b>pulmonary vasoconstriction</b> → pulmonary hypertension → right ventricular strain → <b>cor pulmonale</b>.</li>
  </ol>
  <div class="mnem"><div class="tag">The whole disease in one line</div><div class="big">Air gets IN. Air can't get OUT.</div><div class="exp">Barrel chest, prolonged expiration, pursed-lip breathing, high residual volume, increased compliance — all of it comes from that.</div></div>
</div>

<div class="card">
  <h3>🐦 Chronic Bronchitis vs. Emphysema</h3>
  <table class="lab">
    <tr><th></th><th>CHRONIC BRONCHITIS — "Blue Bloater"</th><th>EMPHYSEMA — "Pink Puffer"</th></tr>
    <tr><td><b>Definition</b></td><td><b>Productive cough 3 months in each of 2 consecutive years</b> — clinical definition</td><td><b>Destruction of alveolar walls</b> with loss of elastic recoil — structural definition</td></tr>
    <tr><td><b>Core problem</b></td><td><b>Mucus.</b> Hypertrophied mucus glands, inflamed airways</td><td><b>Lost surface area and recoil.</b> Alveoli merge into large inefficient sacs</td></tr>
    <tr><td><b>Appearance</b></td><td><b>Cyanotic, overweight, edematous</b></td><td><b>Pink, thin, barrel-chested</b>, often cachectic</td></tr>
    <tr><td><b>Cough</b></td><td><b>Chronic, productive, copious sputum</b></td><td>Minimal, often dry</td></tr>
    <tr><td><b>Dyspnea</b></td><td>Comes <b>later</b></td><td>Comes <b>early</b> and dominates</td></tr>
    <tr><td><b>Blood gases</b></td><td><b>Hypoxemia and hypercapnia early</b> — CO₂ retainers</td><td>Relatively normal until late — they hyperventilate to compensate</td></tr>
    <tr><td><b>Right heart failure</b></td><td><b>Early</b> — hence the edema and cyanosis</td><td><b>Late</b></td></tr>
    <tr><td><b>Posture</b></td><td>—</td><td><b>Tripod</b>, <b>pursed-lip breathing</b>, accessory muscle use</td></tr>
  </table>
  <div class="hy"><span class="tag">Why the nicknames work</span><b>Blue bloater:</b> mucus blocks airways → poor oxygenation → <b>cyanosis</b>, plus early right heart failure → <b>edema</b>. <b>Pink puffer:</b> they compensate by hyperventilating so oxygenation stays adequate — <b>pink</b> — and forcing air out through pursed lips is the <b>puffing</b>.</div>
  <div class="trap"><span class="tag">Where he turns the screw</span>Most real patients have <b>features of both</b>. He gives you the appearance and asks which predominates, or swaps the gas findings — offering a "pink puffer" with early CO₂ retention.</div>
</div>

<div class="card">
  <h3>COPD — manifestations and diagnostics</h3>
  <table class="lab">
    <tr><th>Finding</th><th>Why it happens</th></tr>
    <tr><td><b>Progressive dyspnea</b>, worse with exertion</td><td>Air trapping and inefficient mechanics</td></tr>
    <tr><td><b>Chronic cough with sputum</b></td><td>Mucus hypersecretion</td></tr>
    <tr><td><b>Prolonged expiratory phase</b>, wheezing</td><td>Air cannot escape quickly</td></tr>
    <tr><td><b>Barrel chest</b> (increased AP diameter)</td><td>Chronic air trapping</td></tr>
    <tr><td><b>Pursed-lip breathing</b></td><td>Self-taught. Creates back-pressure that <b>keeps small airways open</b> so air can leave</td></tr>
    <tr><td><b>Tripod positioning</b></td><td>Anchors the shoulder girdle so accessory muscles can assist</td></tr>
    <tr><td><b>Hyperresonant percussion, diminished breath sounds</b></td><td>Trapped air</td></tr>
    <tr><td><b>Clubbing</b></td><td>Chronic hypoxemia</td></tr>
    <tr><td><b>Weight loss and muscle wasting</b></td><td>The work of breathing burns enormous calories</td></tr>
  </table>
  <ul class="clean">
    <li><b>Spirometry is diagnostic:</b> post-bronchodilator <b>FEV₁/FVC below 0.70</b> confirms persistent airflow limitation. Severity by FEV₁: ≥80% mild · 50–79% moderate · 30–49% severe · &lt;30% very severe.</li>
    <li><b>ABG:</b> classically <b>fully compensated respiratory acidosis</b> — pH normal on the acid side, CO₂ high, bicarbonate high.</li>
    <li>Chest x-ray: <b>hyperinflation, flattened diaphragm</b>. CBC may show <b>polycythemia</b> from chronic hypoxia — which raises clotting risk.</li>
    <li><b>Alpha-1 antitrypsin level</b> if young, a nonsmoker, or strong family history.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>COPD — management and nursing care</h3>
  <table class="lab">
    <tr><th>Area</th><th>What matters</th></tr>
    <tr><td><b>⭐ Oxygen</b></td><td><b>He said target low-flow, around 2 L.</b> Keep saturation <b>88–92%</b> with controlled delivery, usually 1–3 L nasal cannula. High flow can blunt the hypoxic drive in a retainer — but <b>this never means withholding oxygen from a patient in real distress</b></td></tr>
    <tr><td><b>Smoking cessation</b></td><td><b>The single most effective intervention.</b> The only thing shown to slow the decline in lung function, at any stage</td></tr>
    <tr><td><b>Bronchodilators</b></td><td>Short-acting (albuterol, ipratropium) for rescue · long-acting (salmeterol, tiotropium) for maintenance</td></tr>
    <tr><td><b>Inhaled corticosteroids</b></td><td>For frequent exacerbations. <b>Rinse the mouth</b> — thrush</td></tr>
    <tr><td><b>Breathing retraining</b></td><td><b>Pursed-lip:</b> inhale through the nose 2 counts, exhale through pursed lips 4 counts. <b>Diaphragmatic:</b> hand on the abdomen, breathe so it rises</td></tr>
    <tr><td><b>Positioning</b></td><td><b>High Fowler or tripod</b>, leaning forward with arms supported on a table</td></tr>
    <tr><td><b>Nutrition</b></td><td><b>High-calorie, high-protein, small frequent meals.</b> Rest before eating. <b>Avoid gas-forming foods</b> — distention pushes on a flattened diaphragm</td></tr>
    <tr><td><b>Hydration</b></td><td>2–3 L daily unless contraindicated — thins secretions</td></tr>
    <tr><td><b>Vaccination</b></td><td><b>Annual influenza and pneumococcal.</b> Exacerbations are usually triggered by infection</td></tr>
    <tr><td><b>Pulmonary rehab</b></td><td>Improves exercise tolerance and quality of life. Does <b>not</b> reverse the disease</td></tr>
    <tr><td><b>Energy conservation</b></td><td>Pace activity, sit to do tasks, exhale during exertion, cluster care</td></tr>
  </table>
  <div class="hy"><span class="tag">Signs of an exacerbation</span>Increased dyspnea, increased sputum <b>volume</b>, and change in sputum <b>color or thickness</b>. Also confusion or somnolence — which signals <b>rising CO₂</b>, not fatigue.</div>
  <div class="hy"><span class="tag">Complications</span><b>Cor pulmonale</b>, <b>acute respiratory failure</b>, <b>spontaneous pneumothorax</b> from a ruptured bleb, pneumonia, and <b>polycythemia</b> with its clotting risk.</div>
</div>

<div class="card" style="border-color:var(--blue)">
  <h3>💨 Asthma — chronic inflammation with REVERSIBLE obstruction</h3>
  <p class="why-chain">Asthma is an <b>inflammatory</b> disease, not just a spasm. That is why steroids are the controller and why treating only the bronchospasm fails.</p>
  <div class="mnem"><div class="tag">Three things happening at once</div><div class="big">1. Bronchoconstriction · 2. Inflammation and edema · 3. Mucus plugging</div><div class="exp">A bronchodilator fixes only the first. The steroid treats the second. That is the entire logic of rescue vs controller.</div></div>
  <table class="lab">
    <tr><th>Triggers</th><th>Manifestations</th></tr>
    <tr><td>Allergens (dust mites, pollen, dander, mold) · <b>respiratory infection</b> · <b>exercise</b> · cold air · smoke and strong odors · stress · <b>NSAIDs, aspirin, beta blockers</b> · GERD</td><td><b>Expiratory wheezing</b> · chest tightness · cough, worse at night or early morning · dyspnea · prolonged expiration · accessory muscle use · anxiety · tachypnea and tachycardia</td></tr>
  </table>
  <ul class="clean">
    <li><b>Diagnosis:</b> spirometry showing <b>reversible</b> obstruction — FEV₁ improves <b>12% or more after a bronchodilator</b>. That reversibility is what separates it from COPD.</li>
    <li><b>⭐ Peak flow zones</b> against the patient's <b>personal best</b>:<br>
      <b>GREEN 80–100%</b> — good control, continue the plan.<br>
      <b>YELLOW 50–79%</b> — caution, use the rescue inhaler and follow the action plan.<br>
      <b>RED under 50%</b> — <b>medical emergency</b>. Rescue inhaler and seek care now.</li>
    <li>Every patient needs a written <b>asthma action plan</b> and a <b>symptom and peak flow diary</b> to identify triggers.</li>
  </ul>
  <div class="trap"><span class="tag">Beta blockers in asthma</span><b>Non-selective</b> agents (propranolol) block beta-2 in the lungs and cause <b>bronchospasm</b>. Question any option giving one to an asthmatic.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🆘 Status Asthmaticus — the emergency</h3>
  <p class="why-chain">A <b>severe, prolonged attack that does not respond to standard treatment</b>. The patient tires, ventilation fails, and it becomes life-threatening.</p>
  <table class="lab">
    <tr><th>Sign</th><th>What it actually means</th></tr>
    <tr><td><b>⭐ Silent chest — wheezing STOPS</b></td><td><b>Air is no longer moving.</b> Not improvement — impending respiratory arrest</td></tr>
    <tr><td><b>⭐ CO₂ rising into the normal range</b></td><td>They were blowing CO₂ off. A "normalizing" CO₂ means <b>they are tiring out</b></td></tr>
    <tr><td>Cannot speak in full sentences</td><td>Not enough air for phonation</td></tr>
    <tr><td>Accessory muscle use, retractions, tripod</td><td>Maximal work of breathing</td></tr>
    <tr><td>Diaphoresis, agitation, then <b>somnolence</b></td><td>Somnolence means <b>CO₂ narcosis</b> — late and ominous</td></tr>
    <tr><td>Peak flow <b>under 50%</b> of personal best</td><td>Red zone</td></tr>
  </table>
  <ul class="clean">
    <li><b>Treatment:</b> high-dose <b>short-acting beta-2 agonist</b> continuously or every 20 minutes, <b>ipratropium</b>, <b>systemic corticosteroids</b>, <b>oxygen</b>, <b>IV magnesium sulfate</b> for severe cases, IV fluids, and <b>prepare for intubation</b>.</li>
    <li><b>Nursing:</b> stay with the patient, high Fowler, continuous monitoring, calm reassurance — anxiety worsens the work of breathing.</li>
  </ul>
</div>

<div class="card">
  <h3>💊 Respiratory drugs — rescue vs. controller</h3>
  <table class="lab">
    <tr><th>Drug</th><th>Class</th><th>Role</th><th>Key point</th></tr>
    <tr><td><b>Albuterol</b></td><td>Short-acting beta-2 agonist</td><td><b>RESCUE</b></td><td>Onset in minutes. Expect <b>tremor, tachycardia, nervousness</b> — beta-1 crossover, not an allergy</td></tr>
    <tr><td><b>Salmeterol</b></td><td>Long-acting beta-2 agonist</td><td><b>MAINTENANCE</b></td><td><b>Never during an attack.</b> Always paired with an inhaled steroid</td></tr>
    <tr><td><b>Ipratropium</b></td><td>Short-acting anticholinergic</td><td>Rescue, often with albuterol</td><td>Dry mouth. Caution in <b>glaucoma and BPH</b></td></tr>
    <tr><td><b>Tiotropium</b></td><td>Long-acting anticholinergic</td><td>MAINTENANCE, COPD</td><td>Once daily</td></tr>
    <tr><td><b>Fluticasone, budesonide</b></td><td>Inhaled corticosteroid</td><td>MAINTENANCE</td><td><b>Rinse the mouth</b> — thrush. Takes days to weeks</td></tr>
    <tr><td><b>Prednisone</b></td><td>Systemic corticosteroid</td><td>Exacerbation burst</td><td>↑glucose, ↑infection risk, <b>taper — never stop abruptly</b></td></tr>
    <tr><td><b>Montelukast</b></td><td>Leukotriene modifier</td><td>MAINTENANCE</td><td>Oral, at night. Watch <b>mood and behavior changes</b></td></tr>
    <tr><td><b>Theophylline</b></td><td>Methylxanthine</td><td>MAINTENANCE, rare</td><td><b>Narrow range 10–20.</b> Toxicity: tachycardia, restlessness, seizures. <b>No caffeine</b></td></tr>
    <tr><td><b>Magnesium sulfate IV</b></td><td>Smooth muscle relaxant</td><td>Severe attack</td><td>Watch for loss of deep tendon reflexes</td></tr>
  </table>
  <div class="mnem"><div class="tag">Inhaler order</div><div class="big">Bronchodilator FIRST · wait · then the steroid · then RINSE</div><div class="exp">Open the airway so the steroid reaches the small airways. Steroid left in the mouth grows <b>Candida</b>.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on COPD and asthma</h3>
  <div class="trap"><span class="tag">Trap 1 — the silent chest</span>A wheezing asthmatic who goes <b>quiet</b> is <b>worse</b>. No air is moving.</div>
  <div class="trap"><span class="tag">Trap 2 — the "improving" CO₂</span>A CO₂ rising into the normal range in a hyperventilating asthmatic means <b>they are tiring out</b>. Impending respiratory failure, not resolution.</div>
  <div class="trap"><span class="tag">Trap 3 — withholding oxygen from a COPD patient</span>The target is <b>88–92% with controlled delivery</b>. That is not refusing oxygen to someone in distress.</div>
  <div class="trap"><span class="tag">Trap 4 — salmeterol during an attack</span>Same <b>-terol</b> ending as albuterol, opposite use. Rescue is <b>albuterol</b>.</div>
  <div class="trap"><span class="tag">Trap 5 — reversed inhaler order</span>Steroid first is the common distractor. <b>Bronchodilator opens the road</b>, then the steroid travels it, then rinse.</div>
  <div class="trap"><span class="tag">Trap 6 — emphysema compliance</span>Emphysema <b>increases</b> compliance — easy in, hard out. "Decreased compliance" belongs to ARDS and fibrosis.</div>
  <div class="trap"><span class="tag">Trap 7 — tachycardia after albuterol called an allergy</span>Expected <b>beta-1 crossover</b>. Teach it, do not stop the drug.</div>
  <div class="trap"><span class="tag">Trap 8 — gas-forming foods and large meals</span>Distention pushes on an already <b>flattened diaphragm</b>. Small, frequent, high-calorie meals with rest beforehand.</div>
  <div class="trap"><span class="tag">Trap 9 — somnolence read as rest</span>A drowsy COPD or asthma patient is <b>retaining CO₂</b>, not finally comfortable.</div>
  <div class="trap"><span class="tag">Trap 10 — COPD called reversible</span>COPD is <b>not fully reversible</b>; asthma <b>is</b>. Goal is to <b>slow progression and manage symptoms</b>.</div>
</div>

<div class="card">
  <h3>Causes and risk factors in COPD</h3>
  <ul class="clean">
    <li><b>Smoking is the leading cause</b> — and the single most important modifiable factor. Cessation slows progression at any stage.</li>
    <li><b>Alpha-1 antitrypsin deficiency</b> — an inherited cause. Suspect it in a patient with <b>emphysema who is young, never smoked, or has a strong family history</b>. Alpha-1 antitrypsin normally protects lung tissue from enzymes that break it down; without it, alveoli are destroyed early.</li>
    <li>Occupational dusts and chemicals, indoor and outdoor air pollution, and repeated childhood respiratory infections.</li>
  </ul>
  <div class="hy"><span class="tag">The stem that signals it</span>A <b>40-year-old nonsmoker with emphysema</b> is not a random detail. That is the alpha-1 antitrypsin question.</div>
</div>


<div class="grphead" id="respchronic-tuberculos"><h3>Tuberculosis</h3>
<div class="card" style="border-color:var(--teal)">
  <h3>🦠 TB — the basics and how it spreads</h3>
  <ul class="clean">
    <li><b>Organism:</b> <i>Mycobacterium tuberculosis</i> — an acid-fast bacillus with a waxy coat that resists destruction, which is why treatment takes months.</li>
    <li><b>Transmission: AIRBORNE.</b> Tiny droplet nuclei stay suspended in air for hours and travel on air currents. Spread by talking, coughing, sneezing, singing.</li>
    <li><b>Not spread</b> by handshakes, shared food or dishes, toilet seats, or bed linens. Patients and families ask this.</li>
    <li><b>Primary infection:</b> bacilli reach the alveoli, the immune system walls them off in a <b>caseating granuloma</b> (Ghon focus). Most people never develop active disease.</li>
    <li><b>Reactivation</b> occurs when immunity drops — HIV, steroids, chemotherapy, malnutrition, aging, diabetes.</li>
  </ul>
  <div class="mnem"><div class="tag">⭐ Isolation</div><div class="big">Negative-pressure room · N95 on STAFF · surgical mask on the PATIENT</div><div class="exp">Door closed. Limit transport. The direction of the masks is what students reverse.</div></div>
</div>

<div class="card">
  <h3>🧪 TB — testing and diagnosis</h3>
  <table class="lab">
    <tr><th>Test</th><th>What it tells you</th><th>Nursing detail</th></tr>
    <tr><td><b>Mantoux (PPD) skin test</b></td><td><b>Exposure</b>, not active disease</td><td>Inject <b>intradermally</b> to form a wheal. <b>Read at 48–72 hours.</b> Measure <b>INDURATION</b> (the raised firm area), <b>not redness</b></td></tr>
    <tr><td><b>Induration thresholds</b></td><td>Positive depends on risk</td><td><b>≥5 mm</b> — HIV, immunosuppressed, recent contact, or x-ray changes<br><b>≥10 mm</b> — recent immigrants, IV drug use, health care workers, congregate settings<br><b>≥15 mm</b> — no known risk factors</td></tr>
    <tr><td><b>IGRA blood tests</b></td><td>Exposure</td><td>QuantiFERON-TB Gold, T-SPOT. <b>Not affected by prior BCG vaccination</b> — a single blood draw, no return visit</td></tr>
    <tr><td><b>⭐ Sputum culture (AFB)</b></td><td><b>CONFIRMS active disease</b></td><td>Usually <b>3 early-morning specimens on separate days</b>. Culture is definitive but takes weeks; smear gives a faster preliminary answer</td></tr>
    <tr><td><b>Chest x-ray</b></td><td>Supports the diagnosis</td><td><b>Upper lobe infiltrates, cavitation</b>, or calcified granulomas. Cannot distinguish active from old disease alone</td></tr>
  </table>
  <div class="trap"><span class="tag">The distinction he tests</span><b>A positive skin test means EXPOSURE.</b> It does not mean active disease, it does not mean infectious, and it never goes back to negative — so <b>never repeat a skin test on someone with a documented positive</b>. Use chest x-ray and sputum instead.</div>
  <div class="hy"><span class="tag">Prior BCG vaccination</span>Common outside the US. It can cause a <b>false-positive skin test</b>, which is exactly why <b>IGRA blood tests</b> are preferred in those patients.</div>
</div>

<div class="card">
  <h3>💊 TB — RIPE therapy</h3>
  <table class="lab">
    <tr><th>Drug</th><th>Key adverse effects</th><th>Teaching and monitoring</th></tr>
    <tr><td><b>R</b>ifampin</td><td><b>Orange-red urine, sweat, and tears</b> (harmless) · hepatotoxicity · many drug interactions</td><td><b>Permanently stains soft contact lenses.</b> <b>Reduces oral contraceptive effectiveness</b> — use a backup method. Monitor LFTs</td></tr>
    <tr><td><b>I</b>soniazid (INH)</td><td><b>Hepatotoxicity</b> · <b>peripheral neuropathy</b></td><td><b>Give vitamin B6 (pyridoxine)</b> to prevent neuropathy. Report numbness and tingling. <b>No alcohol.</b> Monitor LFTs</td></tr>
    <tr><td><b>P</b>yrazinamide</td><td><b>Hepatotoxicity</b> · <b>raises uric acid</b> (gout)</td><td>Increase fluids. Report joint pain. Monitor LFTs and uric acid</td></tr>
    <tr><td><b>E</b>thambutol</td><td><b>Optic neuritis</b> — decreased acuity and red-green color discrimination</td><td><b>Baseline and periodic vision testing. Report ANY vision or color change immediately</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">Recall it fast</div><div class="big">RIPE · "Rifampin turns pee oRange" · "Eyes on Ethambutol"</div><div class="exp">And <b>all four are hepatotoxic</b> — that is the shared thread, and why no alcohol and serial LFTs apply to the whole regimen.</div></div>
  <ul class="clean">
    <li><b>Duration: 6 to 12 months.</b> Typically all four drugs for the first 2 months, then rifampin and INH for 4 or more.</li>
    <li><b>Report immediately:</b> jaundice, dark urine, right upper quadrant pain, persistent nausea, unusual fatigue — all point to <b>liver injury</b>.</li>
    <li><b>No longer infectious</b> after clinical improvement, adequate therapy, and <b>three consecutive negative sputum cultures</b> on separate days.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ TB — signs and symptoms in detail</h3>
  <p class="why-chain">TB is <b>insidious</b>. Symptoms build over weeks to months, which is why patients present late and why he asks about the pattern rather than one finding.</p>
  <table class="lab">
    <tr><th>Symptom</th><th>Detail</th></tr>
    <tr><td><b>Cough over 3 weeks</b></td><td>Initially dry, becomes productive. <b>The cardinal sign</b> — any cough lasting more than 3 weeks warrants TB screening</td></tr>
    <tr><td><b>Hemoptysis</b></td><td>Blood-streaked sputum. A <b>late</b> finding as the lesion erodes into vessels</td></tr>
    <tr><td><b>⭐ Night sweats</b></td><td>Drenching, requiring a change of clothes or bedding. Highly characteristic</td></tr>
    <tr><td><b>Low-grade afternoon fever</b></td><td>Often under 101°F, classically rising later in the day</td></tr>
    <tr><td><b>Unintentional weight loss and anorexia</b></td><td>The reason it was historically called <b>"consumption"</b></td></tr>
    <tr><td><b>Fatigue and malaise</b></td><td>Persistent, out of proportion to activity</td></tr>
    <tr><td><b>Pleuritic chest pain</b></td><td>If the pleura is involved</td></tr>
    <tr><td><b>Older adults</b></td><td>May present <b>atypically</b> — confusion, weight loss, and low-grade fever without the classic cough</td></tr>
  </table>
  <div class="hy"><span class="tag">Latent vs active</span><b>Latent TB:</b> positive skin test or IGRA, <b>no symptoms, normal chest x-ray, NOT infectious</b>. Treated to prevent reactivation, often with INH alone. <b>Active TB:</b> symptoms, abnormal chest x-ray, <b>positive sputum culture, IS infectious</b>. Needs full RIPE therapy.</div>
  <div class="hy"><span class="tag">Highest risk</span>Immunocompromised (especially <b>HIV</b>), homeless or incarcerated populations, recent immigrants from high-prevalence countries, IV drug use, malnutrition, health care workers, crowded living conditions, and long-term care residents.</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ TB — nursing management</h3>
  <table class="lab">
    <tr><th>Focus</th><th>What the nurse does</th></tr>
    <tr><td><b>Airborne precautions</b></td><td><b>Negative-pressure room</b> with the door closed · <b>N95 respirator (fit-tested) on staff</b> · <b>surgical mask on the PATIENT</b> during transport · limit transport · teach covering coughs and disposing of tissues properly</td></tr>
    <tr><td><b>⭐ Adherence</b></td><td>The single biggest nursing problem. <b>Directly observed therapy (DOT)</b> — a health worker watches each dose — is the standard when adherence is a concern. Stopping early breeds <b>multidrug-resistant TB</b></td></tr>
    <tr><td><b>Medication teaching</b></td><td>Take <b>all</b> drugs for the <b>full 6 to 12 months</b> even after feeling better · <b>rifampin turns urine, sweat, and tears orange</b> and <b>permanently stains soft contact lenses</b> · rifampin <b>reduces oral contraceptive effectiveness</b> — use a backup method · <b>take INH with vitamin B6</b> · <b>report vision or color changes</b> (ethambutol) · <b>no alcohol</b> — all RIPE drugs are hepatotoxic · report jaundice, dark urine, RUQ pain, or unusual fatigue</td></tr>
    <tr><td><b>Nutrition</b></td><td><b>High-calorie, high-protein</b> diet in small frequent amounts. Monitor weight — weight gain is a marker of response</td></tr>
    <tr><td><b>Monitoring</b></td><td><b>Baseline and serial liver function tests</b> · serial <b>sputum cultures</b> · vision baseline for ethambutol · uric acid for pyrazinamide</td></tr>
    <tr><td><b>Contact tracing</b></td><td>Report to public health. <b>Household and close contacts are screened</b> and treated for latent infection if positive</td></tr>
    <tr><td><b>Psychosocial</b></td><td>Isolation is <b>lonely and stigmatizing</b>. Address fear, provide contact, and involve social work for housing, transport, and cost barriers — those are the real reasons adherence fails</td></tr>
    <tr><td><b>When is isolation over?</b></td><td>Clinical improvement, adequate therapy, and <b>three consecutive negative sputum cultures</b> collected on different days</td></tr>
  </table>
  <div class="trap"><span class="tag">The adherence question</span>When the stem is a patient who <b>stopped taking their medication because they felt better</b>, the answer is not scolding or simply re-teaching. It is <b>exploring the barrier and arranging DOT</b> — that is what actually prevents resistant TB.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — droplet versus airborne</span>TB is <b>airborne</b>: negative pressure and an N95. Bacterial pneumonia is <b>droplet</b>. The EXCEPT version of this question shows up constantly.</div>
  <div class="trap"><span class="tag">Trap 2 — orange urine as a problem</span>Rifampin turning fluids orange is <b>expected and harmless</b>. "Stop the medication" and "this indicates kidney failure" are the traps.</div>
  <div class="trap"><span class="tag">Trap 3 — reading the Mantoux</span>Measure <b>induration</b>, not redness, at 48 to 72 hours. And a positive test means <b>exposure</b>, not active disease.</div>
  <div class="trap"><span class="tag">Trap 4 — stopping treatment early</span>Any patient statement about stopping when symptoms improve is wrong. The full <b>6 to 12 months</b> prevents drug-resistant TB.</div>
</div>
<div class="card">
  <h3>Pleurisy (pleuritis)</h3>
  <p class="why-chain"><b>Inflammation of the pleura.</b> The visceral pleura covers the lung, the parietal pleura lines the chest wall, and normally a few mL of fluid lets them glide. When inflamed, the two surfaces grate against each other with every breath.</p>
  <table class="lab">
    <tr><th>Feature</th><th>Detail</th></tr>
    <tr><td><b>Hallmark pain</b></td><td><b>Sharp, knife-like, worse with inspiration, coughing, or movement.</b> Relieved by holding the breath or splinting. Usually one-sided and well localized</td></tr>
    <tr><td><b>Classic sign</b></td><td><b>Pleural friction rub</b> — a grating or leathery sound, loudest at the end of inspiration and beginning of expiration. <b>Does not clear with coughing</b>, which is how you separate it from crackles</td></tr>
    <tr><td><b>Causes</b></td><td>Pneumonia, viral infection, <b>pulmonary embolism</b>, TB, chest trauma, autoimmune disease (lupus, rheumatoid arthritis), malignancy</td></tr>
    <tr><td><b>Breathing pattern</b></td><td><b>Rapid and shallow</b> — deep breaths hurt, so the patient avoids them. That is exactly what causes <b>atelectasis</b></td></tr>
    <tr><td><b>Treatment</b></td><td><b>Treat the underlying cause.</b> Analgesics and NSAIDs, sometimes an intercostal nerve block for severe pain</td></tr>
    <tr><td><b>Nursing</b></td><td><b>Splint the chest with a pillow when coughing</b> · <b>lie on the affected side</b> to limit motion of that pleura · <b>medicate for pain so deep breathing is possible</b> · turn and reposition frequently</td></tr>
  </table>
  <div class="trap"><span class="tag">⭐ When the pain stops</span>The pain <b>disappears if an effusion develops</b>, because fluid separates the inflamed surfaces. <b>Pain relief here is not necessarily improvement</b> — reassess breath sounds. Diminished sounds with dullness on that side means the effusion formed.</div>
  <div class="hy"><span class="tag">Why pain control is a respiratory intervention</span>Shallow guarded breathing collapses alveoli. Medicating the pain lets the patient breathe deeply and cough — the same principle as postoperative pulmonary hygiene.</div>
</div>


<div class="card">
  <h3>Sarcoidosis</h3>
  <ul class="clean">
    <li><b>Pathophysiology:</b> a <b>hypersensitivity response to exogenous agents</b> — bacteria, fungi, viruses, chemicals. Forms <b>noncaseating granulomas</b> that may cause <b>fibrosis and reduced lung volumes</b>.</li>
    <li><b>Manifestations:</b> <b>insidious onset with a lack of prominent symptoms.</b> Dyspnea, cough, hemoptysis, congestion. Also <b>uveitis, joint pain, fever</b>. Multisystem: fatigue, fever, anorexia, weight loss.</li>
    <li><b>Diagnosis:</b> chest x-ray and CT show <b>hilar adenopathy</b> with miliary or nodular lesions. <b>Confirmed by biopsy showing noncaseating granulomas.</b> PFTs show restriction; ABG may show hypoxemia and hypercapnia.</li>
    <li><b>Management:</b> <b>many achieve remission without treatment.</b> <b>Prednisone</b> for symptom relief, tapered over about <b>12 months</b>. Immune modulators (methotrexate, azathioprine) if the response is inadequate.</li>
  </ul>
  <div class="trap"><span class="tag">The word that matters</span><b>NONcaseating</b> granulomas are sarcoidosis. <b>Caseating</b> granulomas are <b>tuberculosis</b>. One word separates the two, and he can build a whole question on it.</div>
</div>

<div class="card">
  <h3>Bronchiectasis</h3>
  <ul class="clean">
    <li><b>Chronic, irreversible dilation of the bronchi</b> from repeated infection and inflammation destroying the airway wall.</li>
    <li><b>Hallmark:</b> chronic cough with <b>copious purulent sputum</b>, plus hemoptysis and clubbing.</li>
    <li><b>Diagnosis:</b> <b>high-resolution CT</b> is the study of choice.</li>
    <li><b>Management:</b> <b>postural drainage and chest physiotherapy</b>, bronchodilators, antibiotics for exacerbations, hydration to thin secretions, vaccination, smoking cessation.</li>
    <li>Because it is <b>irreversible</b>, the goal is secretion clearance and infection prevention, not cure.</li>
  </ul>
  <div class="hy"><span class="tag">Distinguish it</span><b>Bronchiectasis</b> = irreversible airway dilation with copious purulent sputum. <b>Chronic bronchitis</b> = productive cough <b>3 months in each of 2 consecutive years</b>. Both produce sputum; the structural damage is what differs.</div>
</div>

<div class="card" style="border-color:var(--blue)">

<div class="card" style="border-color:var(--teal)">
  <h3>💧 Fluid and electrolyte drugs — matched to the imbalance</h3>
  <table class="lab">
    <tr><th>Drug</th><th>Class</th><th>Given for</th><th>Must know</th></tr>
    <tr><td><b>Furosemide</b></td><td>Loop diuretic</td><td><b>Fluid overload</b>, pulmonary edema, <b>hypercalcemia</b></td><td><b>WASTES potassium</b> → hypokalemia. Also wastes Mg and Ca. <b>Ototoxic if pushed fast.</b> Daily weights, monitor K⁺</td></tr>

    <tr><td><b>Calcium gluconate</b></td><td>Electrolyte / antidote</td><td><b>Hypocalcemia</b> · <b>HYPERkalemia</b> (protects the heart) · <b>hypermagnesemia</b> (antagonist)</td><td><b>Give SLOWLY.</b> The one drug with three different jobs — know which one the stem is asking about</td></tr>
    <tr><td><b>Magnesium sulfate</b></td><td>Electrolyte replacement</td><td><b>Hypomagnesemia</b>, severe asthma</td><td><b>Give SLOWLY.</b> Monitor <b>deep tendon reflexes</b> — losing them means toxicity. Antidote is <b>calcium gluconate</b></td></tr>
    <tr><td><b>Insulin + D50</b></td><td>Shifting agent</td><td><b>Hyperkalemia</b></td><td><b>Shifts K⁺ INTO cells — does not remove it.</b> Temporary. Monitor glucose</td></tr>
    <tr><td><b>Sodium polystyrene (Kayexalate)</b></td><td>Cation exchange resin</td><td><b>Hyperkalemia</b></td><td><b>Actually REMOVES potassium</b> through the stool. Slow. Expect diarrhea</td></tr>
    <tr><td><b>Albuterol (nebulized)</b></td><td>Beta-2 agonist</td><td><b>Hyperkalemia</b> — a second job</td><td>Also <b>shifts K⁺ into cells</b>. Same drug as the rescue inhaler</td></tr>
    <tr><td><b>Sodium bicarbonate</b></td><td>Alkalinizing agent</td><td><b>Severe metabolic acidosis</b></td><td>Shifts K⁺ into cells as a side effect. Watch for overshoot alkalosis</td></tr>
    <tr><td><b>Calcitonin, bisphosphonates</b></td><td>Bone resorption inhibitors</td><td><b>Hypercalcemia</b> of malignancy</td><td><b>Saline hydration FIRST</b>, then the bisphosphonate</td></tr>
    <tr><td><b>Phosphate binders</b> (calcium carbonate)</td><td>Binder</td><td><b>Hyperphosphatemia</b></td><td><b>Give WITH meals</b> — they bind the phosphorus in the food</td></tr>
    <tr><td><b>Albumin</b></td><td>Colloid / volume expander</td><td><b>Third spacing</b>, hypoalbuminemia, ascites</td><td><b>Pulls fluid INTO the vessel.</b> Monitor for <b>fluid overload</b> — lung sounds, BP, urine output</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⭐ The easy way to remember — group by what the drug DOES</h3>
  <table class="lab">
    <tr><th>If the drug...</th><th>Then it treats...</th><th>Examples</th></tr>
    <tr><td><b>Opens the airway</b></td><td>Bronchospasm — asthma, COPD</td><td>albuterol, ipratropium, salmeterol, tiotropium, theophylline, magnesium</td></tr>
    <tr><td><b>Calms inflammation</b></td><td>Chronic airway disease</td><td>fluticasone, budesonide, prednisone, montelukast</td></tr>
    <tr><td><b>Thins or clears mucus</b></td><td>Retained secretions</td><td>guaifenesin, acetylcysteine, hydration</td></tr>
    <tr><td><b>Kills the organism</b></td><td>Pneumonia, TB</td><td>azithromycin, ceftriaxone, levofloxacin, vancomycin, RIPE</td></tr>
    <tr><td><b>Removes fluid</b></td><td>Fluid volume EXCESS</td><td>furosemide, HCTZ, mannitol</td></tr>
    <tr><td><b>Adds or holds fluid</b></td><td>Fluid volume DEFICIT, third spacing</td><td>IV crystalloids, albumin</td></tr>
    <tr><td><b>Replaces a missing electrolyte</b></td><td>The matching "hypo"</td><td>KCl, calcium gluconate, magnesium sulfate</td></tr>
    <tr><td><b>Shifts or removes an excess electrolyte</b></td><td>The matching "hyper"</td><td>insulin+D50, albuterol, Kayexalate, bisphosphonates, phosphate binders</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The potassium direction trap</div><div class="big">LOOP and THIAZIDE waste K⁺. SPIRONOLACTONE keeps it.</div><div class="exp">Three diuretics, and one moves potassium the opposite way from the other two. He will give you a patient on spironolactone with a rising potassium and ask what happened.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on drugs</h3>
  <div class="trap"><span class="tag">Trap 1 — rescue vs maintenance</span><b>Salmeterol during an attack.</b> Same <b>-terol</b> ending as albuterol, opposite job. Short-acting rescues, long-acting maintains.</div>
  <div class="trap"><span class="tag">Trap 2 — the inhaler order reversed</span><b>Bronchodilator FIRST</b>, wait, then the steroid, then <b>rinse</b>. Steroid-first is the common distractor, and skipping the rinse causes thrush.</div>
  <div class="trap"><span class="tag">Trap 3 — calcium gluconate's three jobs</span>It treats <b>hypocalcemia</b>, protects the heart in <b>hyperkalemia</b>, and antagonizes <b>hypermagnesemia</b>. Read which problem the stem describes before deciding it is the answer.</div>
  <div class="trap"><span class="tag">Trap 4 — insulin "treats" hyperkalemia</span>Insulin and albuterol only <b>SHIFT</b> potassium into cells. <b>Kayexalate and dialysis REMOVE it.</b> If the question asks what actually lowers total body potassium, shifting agents are wrong.</div>
  <div class="trap"><span class="tag">Trap 5 — the diuretic that raises potassium</span>Two diuretics waste potassium and one keeps it. <b>Spironolactone causes hyperkalemia</b>, and so do ACE inhibitors and ARBs, because they all block aldosterone.</div>
  <div class="trap"><span class="tag">Trap 6 — potassium given the wrong way</span><b>Never IV push. Never without urine output. Never faster than ordered.</b> Any option that speeds it up "to correct faster" is fatal.</div>
  <div class="trap"><span class="tag">Trap 7 — suppressing a productive cough</span>Antitussives are for a <b>dry, nonproductive</b> cough. Suppressing a productive one traps the secretions they need to clear.</div>
  <div class="trap"><span class="tag">Trap 8 — the nasal spray used too long</span><b>Oxymetazoline beyond 3 days causes REBOUND congestion.</b> The patient reports it is "not working anymore" and uses more.</div>
  <div class="trap"><span class="tag">Trap 9 — albuterol side effects called an allergy</span><b>Tremor and tachycardia are expected beta-1 crossover.</b> Teach it, do not stop the drug.</div>
  <div class="trap"><span class="tag">Trap 10 — stopping prednisone abruptly</span>Systemic steroids are <b>tapered</b>. Abrupt discontinuation risks adrenal insufficiency.</div>
  <div class="trap"><span class="tag">Trap 11 — phosphate binders taken between meals</span>They bind phosphorus <b>in food</b>, so they are given <b>WITH meals</b>. Between meals they do nothing.</div>
  <div class="trap"><span class="tag">Trap 12 — vancomycin pushed fast</span>Rapid infusion causes a flushing reaction. <b>Infuse slowly</b>, monitor the trough and renal function.</div>
</div>

<div id="q-drugs"></div>`;
renderFilteredQuiz('q-drugs', secQ(EXAM.filter(q=>q.topic==='drugs'||q.topic==='copd')), 'Drug practice', 'Drug Match');

</script>
<script>














document.getElementById('sec-blood').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🩸</span> Blood Transfusion & IV Therapy</h2>
<p class="intro-line">"What to do BEFORE a blood transfusion" is a named test key point. Free points if you know the steps.</p>

<div class="card" style="border-color:var(--purple)">
  <h3>🩸 Blood products — what each one is for</h3>
  <table class="lab">
    <tr><th>Product</th><th>Contains</th><th>Given for</th><th>Time to infuse</th></tr>
    <tr><td><b>Packed RBCs</b></td><td>Red cells, most plasma removed</td><td><b>Symptomatic anemia, acute blood loss.</b> One unit raises hemoglobin about <b>1 g/dL</b> and hematocrit about <b>3%</b></td><td>2–4 hours. <b>Never more than 4</b></td></tr>
    <tr><td><b>Platelets</b></td><td>Platelets</td><td><b>Thrombocytopenia with bleeding</b>, or counts below about 10,000–20,000</td><td>15–30 minutes — <b>infuse rapidly</b></td></tr>
    <tr><td><b>Fresh frozen plasma (FFP)</b></td><td>All clotting factors</td><td><b>Coagulopathy, warfarin reversal, massive transfusion</b></td><td>Rapidly, within 30–60 min once thawed</td></tr>
    <tr><td><b>Cryoprecipitate</b></td><td><b>Fibrinogen</b>, factor VIII, von Willebrand factor</td><td><b>DIC</b>, low fibrinogen, hemophilia A</td><td>Rapidly</td></tr>
    <tr><td><b>Albumin</b></td><td>Plasma protein — a <b>colloid</b></td><td><b>Volume expansion, hypoalbuminemia, third spacing, ascites</b></td><td>Per order; watch for <b>overload</b></td></tr>
    <tr><td><b>Whole blood</b></td><td>Everything</td><td>Rare — massive hemorrhage</td><td>2–4 hours</td></tr>
  </table>
  <div class="hy"><span class="tag">Compatibility</span><b>O negative is the universal donor</b> (no A, B, or Rh antigens to react against). <b>AB positive is the universal recipient</b> (no antibodies). In an emergency before a crossmatch returns, <b>O negative</b> is what gets hung.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>✅ BEFORE you hang blood</h3>
  <ol class="chainlist">
    <li><b>1. Verify the order</b> — product, number of units, rate, and any premedication.</li>
    <li><b>2. Confirm type and crossmatch</b> is current (usually valid 72 hours).</li>
    <li><b>3. Confirm informed consent</b> is signed and on the chart.</li>
    <li><b>4. Large-bore IV access</b> — <b>18 to 20 gauge</b>. Smaller catheters cause <b>hemolysis</b> as cells are forced through.</li>
    <li><b>5. Y-type blood tubing with an in-line filter</b>, primed with <b>0.9% normal saline ONLY</b>.</li>
    <li><b>6. ⭐ Baseline vital signs including temperature</b> — you cannot recognize a febrile reaction without a baseline.</li>
    <li><b>7. ⭐ Two-person bedside verification</b> — two licensed staff check the patient's name and date of birth against the armband, the blood bank tag, the unit label, the ABO and Rh type, and the unit expiration. <b>At the bedside, with the patient.</b></li>
    <li><b>8. Assess</b> for a history of prior reactions and teach the patient what to report.</li>
  </ol>
  <div class="trap"><span class="tag">⭐ Why saline only</span><b>Dextrose lyses red cells.</b> <b>Lactated Ringer's contains calcium, which promotes clotting</b> in the tubing. No medication of any kind is ever added to blood or run through the same line.</div>
</div>

<div class="card">
  <h3>⏱️ Starting and monitoring the transfusion</h3>
  <table class="lab">
    <tr><th>When</th><th>What you do</th></tr>
    <tr><td><b>⭐ Within 30 minutes of release</b></td><td>Blood must be <b>started within 30 minutes</b> of leaving the blood bank. If it can't be, <b>return it</b> — never store it in a unit refrigerator</td></tr>
    <tr><td><b>⭐ First 15 minutes</b></td><td><b>Run slowly — about 2 mL/min</b> — and <b>STAY WITH THE PATIENT.</b> Most severe reactions appear in this window</td></tr>
    <tr><td><b>At 15 minutes</b></td><td><b>Recheck vital signs.</b> If stable, increase to the ordered rate</td></tr>
    <tr><td><b>During</b></td><td>Vital signs per policy. Watch for fever, chills, itching, rash, back or flank pain, dyspnea, or anxiety</td></tr>
    <tr><td><b>⭐ Complete within 4 hours</b></td><td>Beyond 4 hours at room temperature, <b>bacterial growth risk</b> rises. If the patient can't tolerate that rate, ask for the unit to be <b>split</b></td></tr>
    <tr><td><b>After</b></td><td>Vital signs, flush with normal saline, dispose of the bag per policy, document, and <b>recheck the hemoglobin and hematocrit</b> as ordered</td></tr>
  </table>
  <div class="hy"><span class="tag">A feeling of impending doom</span>Anxiety or a sense that something is very wrong, along with <b>back or flank pain</b>, is a classic early sign of an <b>acute hemolytic reaction</b>. Take it seriously — do not reassure and continue.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🚨 Transfusion reactions — recognize the type</h3>
  <table class="lab">
    <tr><th>Reaction</th><th>Signs</th><th>Key detail</th></tr>
    <tr><td><b>⭐ Acute hemolytic</b></td><td><b>Fever, chills, low back or flank pain, hypotension, tachycardia, dark or red urine, a sense of impending doom</b>. May progress to <b>DIC and acute kidney injury</b></td><td><b>The most dangerous.</b> Caused by <b>ABO incompatibility</b> — usually a clerical or identification error. Occurs within minutes</td></tr>
    <tr><td><b>Febrile nonhemolytic</b></td><td><b>Fever, chills, headache</b> without hemolysis</td><td><b>The most COMMON reaction.</b> A response to donor white cells. Prevented with <b>leukocyte-reduced</b> products and premedication with an antipyretic</td></tr>
    <tr><td><b>Mild allergic</b></td><td><b>Urticaria, itching, flushing</b> without fever</td><td>Antihistamine. May be able to <b>restart after treatment if ordered</b> — the only reaction where that is sometimes true</td></tr>
    <tr><td><b>Anaphylactic</b></td><td>Hypotension, <b>bronchospasm, stridor, angioedema, shock</b></td><td>Often <b>IgA-deficient</b> recipients. Epinephrine, airway support. <b>Never restart</b></td></tr>
    <tr><td><b>⭐ TACO</b> (circulatory overload)</td><td><b>Dyspnea, crackles, JVD, hypertension, headache</b>, rapid weight gain</td><td><b>Too much volume too fast.</b> Highest risk in older adults, heart failure, and renal disease. Slow or stop, <b>sit them upright</b>, oxygen, diuretic</td></tr>
    <tr><td><b>⭐ TRALI</b> (acute lung injury)</td><td><b>Sudden dyspnea and hypoxemia with bilateral infiltrates within 6 hours</b>, often with <b>fever and HYPOtension</b></td><td>Looks like ARDS. <b>The leading cause of transfusion-related death</b>. Distinguished from TACO by <b>hypotension and no JVD</b></td></tr>
    <tr><td><b>Septic</b></td><td><b>High fever, rigors, hypotension, vomiting</b> soon after starting</td><td>Bacterially contaminated product. Cultures and antibiotics</td></tr>
    <tr><td><b>Delayed hemolytic</b></td><td>Falling hemoglobin, low-grade fever, jaundice <b>days to weeks later</b></td><td>Often missed. Suspect it when the hemoglobin drops without bleeding</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ TACO vs TRALI</div><div class="big">TACO = HYPERtension and JVD. TRALI = HYPOtension and fever.</div><div class="exp">Both cause sudden dyspnea with infiltrates. <b>The blood pressure direction is the discriminator.</b> TACO is too much volume; TRALI is an immune lung injury.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ If a reaction occurs — the exact sequence</h3>
  <ol class="chainlist">
    <li><b>1. STOP THE TRANSFUSION IMMEDIATELY.</b> This is always the first action.</li>
    <li><b>2. Keep the IV line open with 0.9% normal saline using NEW tubing.</b> Do not flush the blood in the existing tubing into the patient — that delivers more of the offending product.</li>
    <li><b>3. Assess and stay with the patient.</b> Vital signs, respiratory status, level of consciousness.</li>
    <li><b>4. Notify the provider and the blood bank.</b></li>
    <li><b>5. Return the blood bag, tubing, and attached labels to the blood bank.</b></li>
    <li><b>6. Obtain the ordered samples</b> — blood from the opposite arm and the <b>first voided urine</b> to check for hemolysis.</li>
    <li><b>7. Treat as ordered</b> and document the reaction, times, findings, and interventions.</li>
    <li><b>8. Complete the transfusion reaction report</b> per policy.</li>
  </ol>
  <div class="trap"><span class="tag">The ordering trap</span>He will offer "notify the provider" as the first action. <b>Stopping the transfusion comes first</b> — you remove the cause before you make the call. And keeping the line open requires <b>new tubing</b>, not the blood tubing already primed with the product.</div>
</div>

<div class="card">
  <h3>Massive transfusion — the metabolic consequences</h3>
  <ul class="clean">
    <li><b>Hypocalcemia</b> — stored blood contains <b>citrate</b> as a preservative, which <b>binds calcium</b>. Watch for tingling, tetany, Chvostek and Trousseau signs, and dysrhythmias.</li>
    <li><b>Hyperkalemia</b> — potassium leaks out of stored cells over time. Monitor the ECG.</li>
    <li><b>Hypothermia</b> — refrigerated blood given rapidly drops core temperature and worsens coagulopathy. Use a <b>blood warmer</b> for massive or rapid transfusion.</li>
    <li><b>Coagulopathy</b> — packed cells contain no platelets or clotting factors, so massive replacement dilutes them. FFP and platelets are given alongside.</li>
    <li><b>Iron overload</b> in chronically transfused patients.</li>
  </ul>
  <div class="hy"><span class="tag">The citrate chain</span>Citrate binds calcium → <b>ionized calcium falls</b> → neuromuscular excitability rises. That is why the classic post-massive-transfusion finding is <b>perioral tingling and tetany</b>, and why calcium may be given.</div>
</div>

<div class="card">
  <h3>💉 IV therapy and access</h3>
  <table class="lab">
    <tr><th>Topic</th><th>Detail</th></tr>
    <tr><td><b>Gauge selection</b></td><td><b>18–20 g</b> for blood, surgery, and rapid volume · <b>22–24 g</b> for routine fluids, older adults, and fragile veins. <b>Larger number = smaller catheter</b></td></tr>
    <tr><td><b>Site selection</b></td><td><b>Non-dominant arm</b>, forearm preferred. <b>Avoid</b> areas of flexion, the affected side after mastectomy or with a dialysis fistula, and extremities with lymphedema or paralysis. Start <b>distal and work proximal</b></td></tr>
    <tr><td><b>Infiltration</b></td><td>Non-vesicant fluid into tissue. <b>Cool, pale, swollen, slowed rate.</b> Stop, remove, elevate, warm or cool compress</td></tr>
    <tr><td><b>⭐ Extravasation</b></td><td>A <b>vesicant</b> into tissue → <b>necrosis</b>. <b>STOP the infusion, LEAVE the catheter in</b>, aspirate residual drug, notify, give the antidote if there is one</td></tr>
    <tr><td><b>Phlebitis</b></td><td><b>Red, warm, tender, a palpable cord</b> along the vein. Discontinue, warm compress, restart elsewhere</td></tr>
    <tr><td><b>Infection</b></td><td>Redness, drainage, fever. Sterile technique, scrub the hub, change dressings and tubing per policy</td></tr>
    <tr><td><b>⭐ Air embolism</b></td><td><b>Sudden dyspnea, chest pain, hypotension, altered mental status.</b> <b>Clamp the line, place the patient on the LEFT SIDE in Trendelenburg</b>, give oxygen, notify</td></tr>
    <tr><td><b>Central access</b></td><td>PICC, tunneled, implanted port, non-tunneled central line. Required for <b>vesicants, TPN, and hypertonic solutions</b>. Confirm tip placement by <b>x-ray before use</b></td></tr>
    <tr><td><b>Speed shock</b></td><td>Too-rapid infusion. Flushing, headache, chest tightness, irregular pulse. Slow or stop</td></tr>
  </table>
  <div class="hy"><span class="tag">Why left side and head down for air embolism</span>It traps the air in the <b>right atrium and apex of the right ventricle</b>, away from the pulmonary outflow tract, so it can be absorbed gradually instead of obstructing blood flow to the lungs.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on transfusion and IV therapy</h3>
  <div class="trap"><span class="tag">Trap 1 — notify before stopping</span>On any reaction, <b>STOP the transfusion first</b>. Notifying comes after you have removed the cause.</div>
  <div class="trap"><span class="tag">Trap 2 — flushing the blood tubing</span>Keep the line open with saline through <b>NEW tubing</b>. Using the blood tubing pushes more of the offending product in.</div>
  <div class="trap"><span class="tag">Trap 3 — the wrong solution</span><b>0.9% NS only.</b> Dextrose lyses cells; LR's calcium clots the line. Never add medication to blood.</div>
  <div class="trap"><span class="tag">Trap 4 — TACO vs TRALI</span>Both cause sudden dyspnea. <b>TACO: hypertension and JVD. TRALI: hypotension and fever.</b></div>
  <div class="trap"><span class="tag">Trap 5 — leaving the patient in the first 15 minutes</span><b>Stay with the patient</b> and run slowly. That is when severe reactions appear.</div>
  <div class="trap"><span class="tag">Trap 6 — hanging a unit past 4 hours</span>Ask for a <b>split unit</b> rather than slowing a single unit beyond 4 hours.</div>
  <div class="trap"><span class="tag">Trap 7 — the small-gauge catheter</span>A 24 g for packed cells causes <b>hemolysis</b>. Blood needs <b>18–20 g</b>.</div>
  <div class="trap"><span class="tag">Trap 8 — removing the IV in extravasation</span><b>Stop but leave the catheter in</b> so residual drug can be aspirated. That applies to chemo and to any vesicant.</div>
  <div class="trap"><span class="tag">Trap 9 — verification away from the bedside</span>The two-person check is done <b>at the bedside with the patient</b>, not at the nurses' station.</div>
  <div class="trap"><span class="tag">Trap 10 — back pain treated as positioning</span><b>Low back or flank pain during a transfusion is an acute hemolytic reaction</b> until proven otherwise.</div>
</div>

<div id="q-blood"></div>`;
renderFilteredQuiz('q-blood', secQ(EXAM.filter(q=>q.topic==='blood')), 'Transfusion practice', 'Transfusion');

</script>

const ROUND_SIZE=6;
let currentMatchGame=null, matchRoundPairs=[], matchLeftOrder=[], matchRightOrder=[], matchSelectedLeft=null, matchMatchedCount=0, matchStartTime=0, matchTimerInt=null, matchBestTime=null, matchProgress={};
(function restoreMatchProgress(){ try{ const r=localStorage.getItem('nur256u2_matchprogress'); if(r) matchProgress=JSON.parse(r); }catch(e){ matchProgress={}; } })();
function saveMatchProgress(){ try{ localStorage.setItem('nur256u2_matchprogress', JSON.stringify(matchProgress)); }catch(e){} }
function buildCycleOrder(pairs){
  const hasTiers = pairs.some(p=>typeof p.tier==='number');
  if(!hasTiers) return shuffle(pairs.map((_,i)=>i));
  const tiers=[...new Set(pairs.map(p=>p.tier))].sort((a,b)=>a-b);
  let order=[];
  tiers.forEach(t=>{
    const idxs=pairs.map((p,i)=>({p,i})).filter(x=>x.p.tier===t).map(x=>x.i);
    order=order.concat(shuffle(idxs));
  });
  return order;
}
function difficultyLabel(gameId, roundIdx){
  const pairs=MATCH_GAMES[gameId].pairs;
  if(!pairs.some(p=>typeof p.tier==='number')) return '';
  const roundsPerTier = Math.ceil(pairs.length/ROUND_SIZE/3) || 1;
  const tierIdx = Math.min(2, Math.floor(roundIdx/roundsPerTier));
  return ['🟢 Easier','🟡 Medium','🔴 Hardest'][tierIdx];
}
function startMatchGame(gameId){
  currentMatchGame = MATCH_GAMES[gameId];
  currentMatchGame.sectionId = gameId;
  try{ const r=localStorage.getItem(currentMatchGame.bestKey); matchBestTime = r?parseFloat(r):null; }catch(e){ matchBestTime=null; }
  const totalPairs=currentMatchGame.pairs.length;
  const totalRounds=Math.ceil(totalPairs/ROUND_SIZE);
  let prog=matchProgress[gameId];
  if(!prog || !prog.cycleOrder || prog.roundIdx>=totalRounds || prog.cycleOrder.length!==totalPairs){
    prog={ cycleOrder: buildCycleOrder(currentMatchGame.pairs), roundIdx:0 };
  }
  matchProgress[gameId]=prog; saveMatchProgress();
  const startIdx=prog.roundIdx*ROUND_SIZE;
  const idxSlice=prog.cycleOrder.slice(startIdx, startIdx+ROUND_SIZE);
  matchRoundPairs = idxSlice.map(i=>currentMatchGame.pairs[i]);
  matchLeftOrder = shuffle(matchRoundPairs.map((p,i)=>i));
  matchRightOrder = shuffle(matchRoundPairs.map((p,i)=>i));
  matchSelectedLeft=null; matchMatchedCount=0; matchStartTime=Date.now();
  drawMatchGame(totalRounds);
  if(matchTimerInt) clearInterval(matchTimerInt);
  matchTimerInt=setInterval(updateMatchTimer,200);
}
function updateMatchTimer(){
  const el=document.getElementById('matchTimer');
  if(!el){ clearInterval(matchTimerInt); return; }
  el.textContent='⏱️ '+((Date.now()-matchStartTime)/1000).toFixed(1)+'s';
}
function drawMatchGame(totalRounds){
  const host=document.getElementById('sec-'+currentMatchGame.sectionId);
  const bestTxt = matchBestTime ? matchBestTime.toFixed(1)+'s' : '—';
  const prog=matchProgress[currentMatchGame.sectionId];
  const diff=difficultyLabel(currentMatchGame.sectionId, prog.roundIdx);
  host.innerHTML=`
  <h2 class="sec-title"><span class="sec-emoji">${currentMatchGame.emoji}</span> ${currentMatchGame.title}</h2>
  <p class="intro-line">${currentMatchGame.intro}</p>
  <div class="match-stats">
    <span>📍 Round ${prog.roundIdx+1} of ${totalRounds}</span>
    ${diff?`<span>${diff}</span>`:''}
    <span id="matchTimer">⏱️ 0.0s</span>
    <span>✅ <span id="matchCount">0</span> / ${matchRoundPairs.length}</span>
    <span>🏆 Best round: ${bestTxt}</span>
  </div>
  <p class="intro-line" style="text-align:center;margin-top:0">Tap a term on the left, then tap its match on the right — a line connects them.</p>
  <div class="match-wrap" id="matchWrap">
    <svg class="match-svg" id="matchSvg"></svg>
    <div class="match-columns">
      <div class="match-col" id="matchColLeft"></div>
      <div class="match-col" id="matchColRight"></div>
    </div>
  </div>
  <div class="center" style="margin-top:12px"><button class="btn" style="background:var(--purple)" onclick="startMatchGame('${currentMatchGame.sectionId}')">🔀 Replay This Round</button></div>
  <div id="matchWin"></div>
  `;
  const colL=document.getElementById('matchColLeft'), colR=document.getElementById('matchColRight');
  matchLeftOrder.forEach(pairIdx=>{
    const btn=document.createElement('button'); btn.className='match-item'; btn.textContent=matchRoundPairs[pairIdx].a;
    btn.dataset.pair=pairIdx; btn.dataset.side='left';
    btn.onclick=()=>matchPickLeft(pairIdx, btn);
    colL.appendChild(btn);
  });
  matchRightOrder.forEach(pairIdx=>{
    const btn=document.createElement('button'); btn.className='match-item'; btn.textContent=matchRoundPairs[pairIdx].b;
    btn.dataset.pair=pairIdx; btn.dataset.side='right';
    btn.onclick=()=>matchPickRight(pairIdx, btn);
    colR.appendChild(btn);
  });
}
function matchPickLeft(pairIdx, el){
  if(el.classList.contains('matched'))return;
  document.querySelectorAll('#matchColLeft .match-item').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  matchSelectedLeft={pairIdx, el};
}
function matchPickRight(pairIdx, el){
  if(el.classList.contains('matched')||!matchSelectedLeft)return;
  const leftEl=matchSelectedLeft.el;
  if(matchSelectedLeft.pairIdx===pairIdx){
    leftEl.classList.remove('selected'); leftEl.classList.add('matched');
    el.classList.add('matched');
    drawMatchLine(leftEl, el);
    matchMatchedCount++;
    document.getElementById('matchCount').textContent=matchMatchedCount;
    matchSelectedLeft=null;
    if(matchMatchedCount===matchRoundPairs.length){ matchFinish(); }
  } else {
    leftEl.classList.add('shake'); el.classList.add('shake');
    setTimeout(()=>{
      leftEl.classList.remove('selected','shake'); el.classList.remove('shake');
    },500);
    matchSelectedLeft=null;
  }
}
function drawMatchLine(leftEl, rightEl){
  const svg=document.getElementById('matchSvg'), wrap=document.getElementById('matchWrap');
  if(!svg||!wrap)return;
  const wrapRect=wrap.getBoundingClientRect();
  const lr=leftEl.getBoundingClientRect(), rr=rightEl.getBoundingClientRect();
  const x1=lr.right-wrapRect.left, y1=lr.top-wrapRect.top+lr.height/2;
  const x2=rr.left-wrapRect.left, y2=rr.top-wrapRect.top+rr.height/2;
  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',x1); line.setAttribute('y1',y1); line.setAttribute('x2',x2); line.setAttribute('y2',y2);
  line.style.stroke='var(--green)'; line.style.strokeWidth='3'; line.style.strokeLinecap='round';
  svg.appendChild(line);
}
function matchFinish(){
  clearInterval(matchTimerInt);
  const elapsed=(Date.now()-matchStartTime)/1000;
  let isNewBest=false;
  if(!matchBestTime || elapsed<matchBestTime){ matchBestTime=elapsed; isNewBest=true; try{ localStorage.setItem(currentMatchGame.bestKey, elapsed.toFixed(2)); }catch(e){} }
  const prog=matchProgress[currentMatchGame.sectionId];
  const totalRounds=Math.ceil(currentMatchGame.pairs.length/ROUND_SIZE);
  prog.roundIdx++;
  saveMatchProgress();
  const cycleDone = prog.roundIdx>=totalRounds;
  document.getElementById('matchWin').innerHTML=`<div class="quiz-score">🎉 Matched all ${matchRoundPairs.length} pairs in ${elapsed.toFixed(1)}s!${isNewBest?' <br>🏆 New best round time!':''}
    <br><br>${cycleDone
      ? "✅ That's every pair in this deck! Nice — full cycle complete."
      : `Round ${prog.roundIdx} of ${totalRounds} done.`}
    <br><button class="btn" style="background:var(--green);margin-top:10px" onclick="startMatchGame('${currentMatchGame.sectionId}')">${cycleDone? '🔄 Start a New Cycle (reshuffled)' : '➡️ Next Round'}</button>
  </div>`;
}
document.getElementById('sec-lytematch').innerHTML=`<p class="intro-line">Loading match game...</p>`;
document.getElementById('sec-respmatch').innerHTML=`<p class="intro-line">Loading match game...</p>`;
</script>

    </div>`;
  });

          }
        };
        optsHost.appendChild(btn);
      });
    }
  });
}

{topic:'lytes',front:'Why is IV potassium never pushed?',back:'IV push potassium causes fatal cardiac dysrhythmias. Always dilute and infuse on a pump.'},
{topic:'lytes',front:'Emergency treatment sequence for hyperkalemia?',back:'Calcium gluconate to protect the heart, then insulin with dextrose plus albuterol to shift K into cells, then kayexalate or dialysis to remove it.'},
{topic:'lytes',front:'Signs of hypocalcemia?',back:'Positive Chvostek and Trousseau signs, perioral tingling, tetany, laryngospasm, seizures.'},
{topic:'lytes',front:'Chvostek vs Trousseau?',back:'Chvostek: tap the facial nerve, cheek twitches. Trousseau: inflate the BP cuff, hand spasms. Both indicate hypocalcemia.'},
{topic:'lytes',front:'Signs of hypercalcemia?',back:'Lethargy, confusion, constipation, muscle weakness, kidney stones, bone pain.'},
{topic:'lytes',front:'Hyponatremia — main danger?',back:'Water moves into brain cells. Cerebral edema causing confusion, headache, seizures.'},
{topic:'lytes',front:'Hypernatremia — main sign?',back:'Intense thirst with dry sticky mucous membranes. Cells shrink.'},
{topic:'lytes',front:'Hypomagnesemia is linked to which other electrolyte?',back:'Hypokalemia. You cannot correct the potassium until the magnesium is replaced.'},
{topic:'lytes',front:'Potassium-rich foods?',back:'Banana, spinach, potato, avocado, orange, tomato, cantaloupe.'},
{topic:'abg',front:'What does ROME stand for?',back:'Respiratory Opposite, Metabolic Equal. pH and CO2 move opposite in respiratory; pH and bicarb move together in metabolic.'},
{topic:'abg',front:'Normal pH, PaCO2, HCO3?',back:'pH 7.35 to 7.45 • PaCO2 35 to 45 mmHg • HCO3 22 to 26 mEq/L'},
{topic:'abg',front:'Which system is the acid and which is the base?',back:'CO2 is the acid, controlled by the LUNGS. Bicarbonate is the base, controlled by the KIDNEYS.'},
{topic:'abg',front:'Uncompensated vs partially vs fully compensated?',back:'Uncompensated: pH abnormal, one system abnormal. Partially: pH abnormal, both abnormal. Fully: pH normal, both abnormal.'},
{topic:'abg',front:'Which compensates faster, lungs or kidneys?',back:'Lungs, in minutes. Kidneys take hours to days.'},
{topic:'abg',front:'Causes of respiratory acidosis?',back:'Anything that retains CO2: COPD, oversedation, atelectasis, pneumonia, hypoventilation, neuromuscular weakness.'},
{topic:'abg',front:'Causes of respiratory alkalosis?',back:'Hyperventilation: anxiety, pain, fever, early PE, high altitude, mechanical over-ventilation.'},
{topic:'abg',front:'Causes of metabolic acidosis?',back:'DKA, renal failure, lactic acidosis from shock, prolonged diarrhea (loses bicarbonate).'},
{topic:'abg',front:'Causes of metabolic alkalosis?',back:'Vomiting or NG suction (loses acid), excess antacids, diuretics, hypokalemia.'},
{topic:'abg',front:'Asthma patient whose PaCO2 rises from 28 to 41 — what is happening?',back:'Not improvement. They are tiring and heading toward respiratory failure. A "normalizing" CO2 in a hyperventilating patient is an ominous sign.'},
{topic:'abg',front:'ABG target for a COPD patient?',back:'SpO2 88 to 92 percent with controlled oxygen. Chronic CO2 retention means their gas is a compensated respiratory acidosis at baseline.'},
{topic:'abg',front:'Something is wrong with the kidneys \u2014 the imbalance is automatically what?',back:'METABOLIC. Kidneys regulate bicarbonate (the base). Lungs regulate CO2 (the acid), so a lung problem is respiratory.'},
{topic:'abg',front:'What gas does kidney failure specifically produce?',back:'Metabolic acidosis. The kidney cannot excrete hydrogen ions or regenerate bicarbonate, so acid builds and bicarb falls.'},
{topic:'abg',front:'Why does a COPD patient with kidney disease show an uncompensated gas?',back:'The kidneys are the compensator for a respiratory problem. If they are failing, they cannot retain the bicarbonate needed to compensate.'},
{topic:'abg',front:'Renal metabolic acidosis travels with which electrolyte problem?',back:'Hyperkalemia. Acidosis shifts potassium out of cells AND the failing kidney cannot excrete it. Check the potassium and the ECG.'},

let drillList=[], drillIdx=0, drillScore=0, drillStreak=0, drillBest=0, drillAnswered=false;

function startDrill(){

  drillList=shuffle(pool.slice()).slice(0,Math.min(DRILL_ROUND,pool.length));

function renderDrillQ(){

  if(shuffleAnswers){

    q={...qRaw, o:order.map(i=>qRaw.o[i]), c:order.indexOf(qRaw.c)};
  }
  drillList[drillIdx]=q;
  drillAnswered=false;
  let opts=q.o.map((o,i)=>`<button class="opt" onclick="answerDrill(${i})">${o}</button>`).join('');
  host.innerHTML=`
    <div class="drill-top"><span>Q ${drillIdx+1} / ${drillList.length}</span><span>✅ ${drillScore} 🔥 ${drillStreak}</span></div>

function answerDrill(i){

    b.classList.add('disabled');
    if(idx===q.c)b.classList.add('correct');

function nextDrill(){ drillIdx++; renderDrillQ(); }

function drawExamMatchQ(qi,q,body){
