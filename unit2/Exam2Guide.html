<h2 class="sec-title"><span class="sec-emoji">⚡</span> Electrolytes</h2>
<p class="intro-line">Chapter 10, second half. Learn the normal range, the ECG or neuro sign, and the one intervention that kills if you get it wrong.</p>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ Normal ranges — from the sheet he sent</h3>
  <table class="lab">
    <tr><th>Electrolyte</th><th>Range</th><th>Low mnemonic</th><th>High mnemonic</th><th>ECG clue</th></tr>
    <tr><td><b>Na⁺</b></td><td><b>135–145 mEq/L</b></td><td><b>SALT LOSS</b></td><td><b>FRIED</b></td><td>—</td></tr>
    <tr><td><b>K⁺</b></td><td><b>3.5–5.0 mEq/L</b></td><td><b>6 L's</b></td><td><b>MURDER</b></td><td><b>Low: flat T. High: peaked T</b></td></tr>
    <tr><td><b>Ca²⁺</b></td><td><b>8.5–10.5 mg/dL</b></td><td><b>CATS go numb</b></td><td><b>Bones, Stones, Groans, Moans</b></td><td><b>Low: long QT. High: short QT</b></td></tr>
    <tr><td><b>Mg²⁺</b></td><td><b>1.5–2.5 mEq/L</b></td><td><b>STARVED</b></td><td><b>RENAL</b></td><td><b>Low: torsades. High: prolonged PR</b></td></tr>
    <tr><td><b>PO₄</b></td><td><b>2.5–4.5 mg/dL</b></td><td>—</td><td>—</td><td><b>Inverse to calcium</b></td></tr>
    <tr><td><b>Cl⁻</b></td><td><b>96–106 mEq/L</b></td><td>—</td><td>—</td><td><b>Follows sodium</b></td></tr>
  </table>
  <div class="hy"><span class="tag">Note on two of these</span>His sheet lists <b>calcium 8.5–10.5</b> and <b>magnesium 1.5–2.5 mEq/L</b>. Some textbooks use 8.6–10.2 and 1.3–2.3 mg/dL. <b>Use his numbers on his exam.</b></div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ The mnemonics, unpacked</h3>
  <table class="lab">
    <tr><th>Mnemonic</th><th>What each letter is</th></tr>
    <tr><td><b>HYPOnatremia<br>"SALT LOSS"</b></td><td><b>S</b>eizures · <b>A</b>norexia · <b>L</b>ethargy · <b>T</b>endon reflexes decreased · <b>L</b>imp muscles · <b>O</b>rthostatic hypotension · <b>S</b>tomach cramping · <b>S</b>tupor/coma<br><i>The most common electrolyte imbalance.</i> Causes: SIADH, water intoxication, diuretics</td></tr>
    <tr><td><b>HYPERnatremia<br>"FRIED"</b></td><td><b>F</b>ever · <b>R</b>estlessness · <b>I</b>ncreased fluid retention/edema · <b>E</b>xtreme thirst · <b>D</b>ecreased urine output<br><i>Cells shrink — crenation.</i> Causes: dehydration, diabetes insipidus, excess Na⁺ intake</td></tr>
    <tr><td><b>HYPOkalemia<br>"6 L's"</b></td><td><b>L</b>eg cramps · <b>L</b>imp muscles · <b>L</b>ow/shallow respirations · <b>L</b>ethargy · <b>L</b>ots of urine (polyuria) · <b>L</b>ow blood pressure<br>Causes: diuretics, vomiting, NG suction</td></tr>
    <tr><td><b>HYPERkalemia<br>"MURDER"</b></td><td><b>M</b>uscle weakness · <b>U</b>rine output decreased · <b>R</b>espiratory failure · <b>D</b>ecreased cardiac contractility · <b>E</b>CG changes (peaked T) · <b>R</b>eflexes decreased<br>Causes: renal failure, ACE inhibitors, K⁺-sparing diuretics</td></tr>
    <tr><td><b>HYPOcalcemia<br>"CATS go numb"</b></td><td><b>C</b>onvulsions · <b>A</b>rrhythmias · <b>T</b>etany · <b>S</b>pasms/stridor · <b>numb</b>ness<br>Signs: <b>Trousseau</b> (BP cuff → hand spasm), <b>Chvostek</b> (tap nerve → twitch). <b>Seizure precautions</b></td></tr>
    <tr><td><b>HYPERcalcemia<br>"Bones, Stones, Groans, Moans"</b></td><td><b>Bone</b> pain · kidney <b>Stones</b> · abdominal <b>Groaning</b> (constipation, nausea) · <b>Moans</b> (confusion, lethargy)<br>Causes: hyperparathyroidism (#1), malignancy, immobility</td></tr>
    <tr><td><b>HYPOmagnesemia<br>"STARVED"</b></td><td><b>S</b>eizures · <b>T</b>etany · <b>A</b>norexia · <b>R</b>apid heart rate · <b>V</b>omiting · <b>E</b>motional lability · <b>D</b>eep tendon reflexes <b>INCREASED</b><br>Causes: alcohol use (#1), malnutrition, diuretics, diarrhea</td></tr>
    <tr><td><b>HYPERmagnesemia<br>"RENAL"</b></td><td><b>R</b>eflexes decreased (<b>first sign</b>) · <b>E</b>CG changes (prolonged PR) · <b>N</b>ausea · <b>A</b>ppearance flushed · <b>L</b>ethargy/drowsiness<br><i>Almost always renal failure plus Mg antacids or laxatives</i></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Why STARVED and RENAL are opposites</div><div class="big">Low Mg → reflexes UP. High Mg → reflexes DOWN.</div><div class="exp">The <b>D</b> in STARVED is deep tendon reflexes <b>increased</b>. The <b>R</b> in RENAL is reflexes <b>decreased</b>, and it is the <b>first sign</b>. That is the pair he can flip in a single option.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ The critical rules on his sheet</h3>
  <table class="lab">
    <tr><th>Rule</th><th>Why</th></tr>
    <tr><td><b>Replace MAGNESIUM FIRST</b> — before potassium or calcium will correct</td><td>Magnesium is required for the cell to hold potassium. A hypokalemia that will not budge means the magnesium is low</td></tr>
    <tr><td><b>Do NOT correct sodium faster than 12 mEq/L per 24 hours</b></td><td>Rapid correction of hypernatremia causes <b>cerebral edema</b>; rapid correction of hyponatremia causes <b>osmotic demyelination</b></td></tr>
    <tr><td><b>NEVER IV push potassium — always dilute, always on a pump</b></td><td>IV push potassium is fatal</td></tr>
    <tr><td><b>Hypokalemia increases digoxin toxicity</b></td><td>Low potassium lets digoxin bind more — watch for nausea, visual halos, dysrhythmias</td></tr>
    <tr><td><b>Corrected calcium:</b> add <b>0.8 mg/dL</b> for every <b>1 g/dL</b> the albumin sits below 4</td><td>Most serum calcium is bound to albumin, so a low albumin makes the total calcium read falsely low</td></tr>
    <tr><td><b>Give IV calcium gluconate SLOWLY</b> · <b>IV magnesium sulfate SLOWLY</b></td><td>Rapid infusion causes hypotension and cardiac effects</td></tr>
    <tr><td><b>Hyponatremia: dilutional vs depletional</b></td><td><b>Dilutional → restrict fluids.</b> <b>Depletional → replace sodium.</b> Same lab value, opposite treatment</td></tr>
  </table>
</div>

<div class="card">
  <h3>Phosphorus and chloride — the two that follow someone else</h3>
  <table class="lab">
    <tr><th></th><th>Low</th><th>High</th></tr>
    <tr><td><b>Phosphorus</b><br><i>Inverse to calcium — when one goes up the other goes down</i></td><td><b>Muscle weakness, respiratory failure, confusion, seizures.</b> Causes: <b>refeeding syndrome</b>, alcohol use, antacids. Often missed in the ICU</td><td><b>Asymptomatic until the calcium drops</b>, then tetany and seizures. Causes: renal failure, <b>chemotherapy (tumor lysis)</b>. Treat with <b>phosphate binders (calcium carbonate) with meals</b></td></tr>
    <tr><td><b>Chloride</b><br><i>Follows sodium — if Na⁺ is low, Cl⁻ usually is too</i></td><td><b>Hypochloremia → METABOLIC ALKALOSIS.</b> From loss of HCl through <b>vomiting or NG suction</b></td><td><b>Hyperchloremia → METABOLIC ACIDOSIS.</b> From excess normal saline infusion or renal failure</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ Chloride is an acid-base clue</div><div class="big">Low chloride = alkalosis. High chloride = acidosis.</div><div class="exp">Chloride travels with hydrogen. Lose HCl by vomiting and you lose both — low Cl⁻ and alkalosis together. Flood someone with saline and you add both — high Cl⁻ and acidosis. <b>If he gives you a chloride value, it is telling you the acid-base answer.</b></div></div>
</div>

<div class="card">
  <h3>Sodium — the water electrolyte</h3>
  <table class="lab">
    <tr><th></th><th>Hyponatremia (&lt;135)</th><th>Hypernatremia (&gt;145)</th></tr>
    <tr><td><b>Causes</b></td><td>Vomiting, diarrhea, diuretics, SIADH, excess water intake, adrenal insufficiency</td><td>Water loss, poor intake, diabetes insipidus, hypertonic feeds, excess sodium</td></tr>
    <tr><td><b>Cells</b></td><td>Water moves IN → cells <b>swell</b></td><td>Water moves OUT → cells <b>shrink</b></td></tr>
    <tr><td><b>Signs</b></td><td>Headache, confusion, lethargy, muscle cramps, <b>seizures from cerebral edema</b></td><td><b>Intense thirst</b>, dry sticky mucous membranes, restlessness, weakness, seizures if severe</td></tr>
    <tr><td><b>Treatment</b></td><td>Fluid restriction; hypertonic saline only if severe and symptomatic, corrected <b>slowly</b></td><td>Hypotonic fluid or D5W slowly, free water, treat the cause</td></tr>
  </table>
  <div class="trap"><span class="tag">Why "slowly" matters both ways</span>Correcting sodium too fast causes <b>osmotic demyelination</b> going up and <b>cerebral edema</b> coming down. "Rapidly normalize the sodium" is never the answer.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>Potassium — the one that kills</h3>
  <table class="lab">
    <tr><th></th><th>Hypokalemia (&lt;3.5)</th><th>Hyperkalemia (&gt;5.0)</th></tr>
    <tr><td><b>Causes</b></td><td>Diuretics, vomiting, NG suction, diarrhea, insulin, alkalosis, poor intake</td><td>Kidney failure, ACE inhibitors/ARBs, spironolactone, acidosis, cell lysis, over-replacement</td></tr>
    <tr><td><b>ECG</b></td><td><b>Flat T waves, U wave</b>, ST depression</td><td><b>Peaked narrow T waves</b> → widened QRS → asystole</td></tr>
    <tr><td><b>Other signs</b></td><td>Muscle weakness, leg cramps, <b>ileus</b>, shallow respirations, digoxin toxicity risk</td><td>Muscle weakness, paresthesias, <b>abdominal cramping and diarrhea</b>, dysrhythmias</td></tr>
    <tr><td><b>Treatment</b></td><td>Oral or diluted IV potassium <b>on a pump</b>; replace <b>magnesium</b> too; potassium-rich foods</td><td><b>Calcium gluconate</b> → insulin+dextrose and albuterol → kayexalate or dialysis</td></tr>
  </table>
  <div class="mnem"><div class="tag">Hyperkalemia sequence</div><div class="big">PROTECT → SHIFT → REMOVE</div><div class="exp">Calcium gluconate protects the myocardium. Insulin/dextrose and albuterol shift K into cells. Kayexalate or dialysis actually removes it.</div></div>
  <div class="trap"><span class="tag">Never</span><b>IV push potassium is fatal.</b> Always dilute and infuse on a pump. Never give it to a patient with no urine output. Never exceed the ordered rate to "catch up."</div>
  <div class="hy"><span class="tag">Potassium-rich foods</span>Banana, spinach, potato, avocado, orange, tomato, cantaloupe, dried fruit, legumes.</div>
</div>

<div class="card">
  <h3>Calcium — the nerve stabilizer</h3>
  <table class="lab">
    <tr><th></th><th>Hypocalcemia (&lt;8.6)</th><th>Hypercalcemia (&gt;10.2)</th></tr>
    <tr><td><b>Causes</b></td><td>Thyroid/parathyroid surgery, vitamin D deficiency, pancreatitis, massive transfusion, alkalosis</td><td>Malignancy with bone metastasis, hyperparathyroidism, immobility, thiazides, excess vitamin D</td></tr>
    <tr><td><b>Direction</b></td><td>Things <b>FIRE</b></td><td>Things <b>SLOW DOWN</b></td></tr>
    <tr><td><b>Signs</b></td><td><b>Chvostek</b> (tap the facial nerve, cheek twitches), <b>Trousseau</b> (BP cuff, hand spasms), perioral tingling, tetany, <b>laryngospasm</b>, seizures</td><td>Lethargy, confusion, <b>constipation</b>, muscle weakness, bone pain, kidney stones, polyuria</td></tr>
    <tr><td><b>Treatment</b></td><td>Calcium gluconate IV for severe; oral calcium with vitamin D; <b>seizure and airway precautions</b></td><td><b>Isotonic saline</b> to promote urinary excretion, then a <b>bisphosphonate</b>; mobilize; increase fluids</td></tr>
  </table>
  <div class="mnem"><div class="tag">Keep them straight</div><div class="big">LOW calcium = things fire. HIGH calcium = things slow.</div><div class="exp">"Stones, bones, groans, and psychiatric overtones" is the HIGH side.</div></div>
</div>

<div class="card">
  <h3>Magnesium and phosphorus</h3>
  <table class="lab">
    <tr><th></th><th>Low</th><th>High</th></tr>
    <tr><td><b>Magnesium</b></td><td>Alcohol use, malabsorption, diuretics. Signs mirror <b>hypocalcemia</b>: tremor, tetany, positive Chvostek/Trousseau, dysrhythmias. Give IV magnesium slowly.</td><td>Kidney failure, magnesium-containing antacids/laxatives. <b>Loss of deep tendon reflexes</b>, hypotension, bradycardia, respiratory depression. Antidote: <b>calcium gluconate</b>.</td></tr>
    <tr><td><b>Phosphorus</b></td><td>Refeeding syndrome, alcohol use, antacids. Muscle weakness, confusion, respiratory failure.</td><td>Kidney failure, tumor lysis. Symptoms are mostly from the resulting <b>hypocalcemia</b>. Phosphate binders with meals.</td></tr>
  </table>
  <div class="hy"><span class="tag">The pairings that get tested</span><b>Calcium and phosphorus move opposite.</b> <b>Magnesium and calcium move together</b> in their signs. And <b>you cannot correct hypokalemia until magnesium is replaced</b>, because magnesium is required for the cell to hold potassium.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the hyperkalemia order</span>All four options are real hyperkalemia treatments. The question is the <b>sequence</b>. Calcium gluconate first, because it protects the heart while the other drugs take time to work.</div>
  <div class="trap"><span class="tag">Trap 2 — the calcium lists swapped</span>Hypocalcemia stems offered with "constipation, kidney stones, lethargy." That is the <b>hyper</b> list. Low calcium fires: tetany, tingling, laryngospasm, seizures.</div>
  <div class="trap"><span class="tag">Trap 3 — the stubborn potassium</span>A hypokalemia that will not correct despite replacement. The answer is not more potassium, it is <b>replacing magnesium first</b>.</div>
  <div class="trap"><span class="tag">Trap 4 — potassium and urine output</span>Any option giving potassium to a patient with poor urine output is wrong, no matter how low the level is. Check the output first.</div>
  <div class="trap"><span class="tag">Trap 5 — priority among four abnormal labs</span>He gives you four out-of-range electrolytes. Rank by <b>what kills fastest</b>: potassium (dysrhythmia) and calcium (laryngospasm) beat sodium drift and phosphorus every time.</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⚡ Electrolyte imbalance symptoms at a glance</h3>
  <table class="lab">
    <tr><th>Electrolyte</th><th>HYPO ↓</th><th>HYPER ↑</th></tr>
    <tr><td><b>Na⁺</b></td><td>Headaches, confusion, nausea · disrupted attention, disordered speech, <b>hallucinations</b> · <b>osmotic demyelination and cerebral edema</b></td><td><b>Agitation, unable to rest or sleep</b> · tachycardia or tachypnea</td></tr>
    <tr><td><b>K⁺</b></td><td>Weakness and cramping · <b>arrhythmias</b> · <b>constipation</b></td><td>Weakness and cramping · <b>arrhythmias</b> · <b>abdominal pain or diarrhea</b></td></tr>
    <tr><td><b>Ca²⁺</b></td><td>Weakness, nausea, cramping · <b>Trousseau sign</b> (BP cuff → hand spasm) · <b>Chvostek sign</b> (tap the cheek → twitch)</td><td>Weakness, nausea, <b>cramping</b></td></tr>
    <tr><td><b>Mg²⁺</b></td><td><b>Tremor or personality changes</b></td><td>Decreased consciousness, confusion, muscle weakness, <b>ABSENCE of reflexes</b></td></tr>
    <tr><td><b>PO₄³⁻</b></td><td>Muscle cramps, weakness, numbness · <b>↓bone density</b></td><td>Muscle cramps, weakness, numbness · <b>↓bone density</b></td></tr>
    <tr><td><b>Cl⁻</b></td><td><b>Lack of symptoms</b> · extreme: confusion and swelling</td><td><b>Lack of symptoms</b> · extreme: confusion and swelling</td></tr>
    <tr><td><b>HCO₃⁻</b></td><td>Headaches, fatigue, acid-base imbalance symptoms</td><td>Headaches, fatigue, acid-base imbalance symptoms</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The pairing he tests</div><div class="big">Hypomagnesemia is associated with hypokalemia.</div><div class="exp">A potassium that will not correct despite replacement usually means the <b>magnesium is low</b>. Magnesium is required for the cell to hold onto potassium — replace it first.</div></div>
  <div class="trap"><span class="tag">⭐ Magnesium and reflexes — get the direction right</span><b>LOW magnesium → HYPERreflexia.</b> Nerves fire too easily: tremor, tetany, positive Chvostek and Trousseau, seizures — the same picture as low calcium. <b>HIGH magnesium → LOSS of deep tendon reflexes</b>, and that absence is the <b>first sign</b>, followed by hypotension, bradycardia, and respiratory depression. Antidote for magnesium toxicity is <b>calcium gluconate</b>.</div>
  <div class="trap"><span class="tag">Two directions worth noticing</span><b>Potassium looks similar high and low</b> — weakness, cramping, arrhythmias either way. The GI clue separates them: <b>low K constipates, high K causes abdominal pain and diarrhea</b>. And <b>hypermagnesemia is defined by the ABSENCE of reflexes</b>, which is the first thing you check.</div>
</div>

<div id="q-lytes"></div>`;
renderFilteredQuiz('q-lytes', secQ(EXAM.filter(q=>q.topic==='lytes')), 'Electrolyte practice', 'Electrolytes');


document.getElementById('sec-abg').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🫁</span> Acid-Base & ABGs</h2>
<p class="intro-line">Chapter 10, final section. Three numbers, one rule, and you can name any gas he writes.</p>

<div class="card" style="border-color:var(--teal)">
  <h3>The three numbers</h3>
  <table class="lab">
    <tr><th>Value</th><th>Normal</th><th>Controlled by</th></tr>
    <tr><td><b>pH</b></td><td>7.35 – 7.45</td><td>The net result</td></tr>
    <tr><td><b>PaCO₂</b> (the acid)</td><td>35 – 45 mmHg</td><td><b>Lungs</b> — minutes</td></tr>
    <tr><td><b>HCO₃</b> (the base)</td><td>22 – 26 mEq/L</td><td><b>Kidneys</b> — hours to days</td></tr>
    <tr><td>PaO₂</td><td>80 – 100 mmHg</td><td>Oxygenation, not acid-base</td></tr>
  </table>
  <div class="mnem"><div class="tag">The whole method</div><div class="big">ROME — Respiratory Opposite, Metabolic Equal</div><div class="exp">pH and CO₂ moving in <b>opposite</b> directions = respiratory. pH and bicarb moving in the <b>same</b> direction = metabolic.</div></div>
  <div class="mnem" style="border-color:var(--gold)"><div class="tag">⭐ He asks this out loud</div><div class="big">Kidney problem → automatically METABOLIC. Lung problem → automatically RESPIRATORY.</div><div class="exp">The kidneys own bicarbonate and the lungs own CO₂. Name the broken organ and you have already named half the gas.</div></div>
</div>

<div class="card" style="border-color:var(--gold)">
  <h3>⭐ The organ shortcut</h3>
  <p class="why-chain">If the stem tells you which organ is failing, you do not have to derive the type — the organ names it. <b>Kidneys regulate bicarbonate (the base), so a kidney problem is metabolic. Lungs regulate CO₂ (the acid), so a lung problem is respiratory.</b></p>
  <ol class="chainlist">
    <li><b>1.</b> Healthy kidneys excrete hydrogen ions and regenerate bicarbonate, which is how the body dumps fixed acid.</li>
    <li><b>2.</b> In kidney failure both jobs stop. Acid accumulates and bicarbonate falls.</li>
    <li><b>3.</b> pH down + bicarb down = same direction = <b>metabolic acidosis</b>. That is the default gas for a renal patient.</li>
    <li><b>4.</b> The kidneys are also the <b>compensator</b> for respiratory problems. If they are failing, they cannot compensate — so expect an <b>uncompensated or only partially compensated</b> respiratory gas in a patient with renal disease.</li>
    <li><b>5.</b> And renal metabolic acidosis travels with <b>hyperkalemia</b>: acidosis shifts potassium out of cells, and the failing kidney cannot excrete it either. Low pH in a renal patient → check the potassium and the ECG.</li>
  </ol>
  <div class="mnem"><div class="tag">⭐ How he actually asks it</div><div class="big">"If something is wrong with the kidneys, then it's automatically what?"</div><div class="exp"><b>METABOLIC.</b> He asks it in that exact shape — organ first, then "automatically what." Same question in reverse: <b>lungs → automatically RESPIRATORY</b>. Answer from the organ, not from the numbers.</div></div>
  <div class="hy"><span class="tag">Same logic, other direction</span>Chronic <b>lung</b> disease → respiratory acidosis, and the healthy kidney compensates by retaining bicarbonate over days. That is why a stable COPD gas reads <b>fully compensated respiratory acidosis</b> — pH normal on the acid side, CO₂ high, bicarb high.</div>
  <div class="trap"><span class="tag">Where he turns the screw</span>A dialysis or CKD patient with a low pH and options offering respiratory causes. The organ already told you the answer. Equally, do not force "metabolic" onto a patient whose only problem is hypoventilation — the shortcut runs organ → type, not backwards.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ The five values — from your card</h3>
  <table class="lab">
    <tr><th>Value</th><th>Normal</th><th>What it is</th><th>Who controls it</th></tr>
    <tr><td><b>pH</b></td><td><b>7.35 – 7.45</b></td><td>← acidosis · alkalosis →</td><td>The result of the other two</td></tr>
    <tr><td><b>PaCO₂</b></td><td><b>35 – 45 mmHg</b></td><td>Carbon dioxide — <b>RESPIRATORY</b></td><td><b>LUNGS.</b> ← alkalosis · acidosis →</td></tr>
    <tr><td><b>HCO₃⁻</b></td><td><b>22 – 26 mEq/L</b></td><td>Bicarbonate — <b>METABOLIC</b></td><td><b>KIDNEYS.</b> ← acidosis · alkalosis →</td></tr>
    <tr><td><b>PaO₂</b></td><td><b>80 – 100 mmHg</b></td><td>Oxygenation</td><td>Not part of the acid-base call</td></tr>
    <tr><td><b>SaO₂</b></td><td><b>95 – 100%</b></td><td>Oxygen saturation</td><td>Not part of the acid-base call</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ ROME</div><div class="big">Respiratory = OPPOSITE · Metabolic = EQUAL</div><div class="exp"><b>Respiratory:</b> pH ↑ with CO₂ ↓ = alkalosis. pH ↓ with CO₂ ↑ = acidosis. They move <b>opposite</b> ways.<br><b>Metabolic:</b> pH ↓ with HCO₃ ↓ = acidosis. pH ↑ with HCO₃ ↑ = alkalosis. They move <b>together</b>.</div></div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ The compensation trick — just count the abnormal values</h3>
  <table class="lab">
    <tr><th>Status</th><th>How to spot it</th></tr>
    <tr><td><b>UNcompensated</b></td><td><b>pH abnormal</b> and <b>only ONE</b> of PaCO₂ / HCO₃ is abnormal. The other system has not started helping yet</td></tr>
    <tr><td><b>PARTIALLY compensated</b></td><td><b>pH still abnormal</b>, but <b>BOTH</b> PaCO₂ and HCO₃ are abnormal. Help has started but has not finished</td></tr>
    <tr><td><b>FULLY compensated</b></td><td><b>pH is NORMAL</b> (leaning acidic or basic) and <b>BOTH</b> PaCO₂ and HCO₃ are abnormal. The other system caught all the way up</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The three-second version</div><div class="big">ONE abnormal = none · BOTH abnormal + bad pH = partial · BOTH abnormal + normal pH = full</div><div class="exp">You never have to reason about it. <b>Count how many of the two are abnormal, then look at the pH.</b></div></div>
  <div class="hy"><span class="tag">Who compensates for whom</span><b>Respiratory problem → the KIDNEYS compensate</b> by retaining or excreting bicarbonate. Slow, takes <b>days</b>.<br><b>Metabolic problem → the LUNGS compensate</b> by changing rate and depth to blow off or retain CO₂. Fast, takes <b>minutes</b>.</div>
  <div class="trap"><span class="tag">Why the speed difference matters</span>An <b>acute</b> problem cannot already be fully compensated, because the kidneys need days. If a stem describes something sudden and shows you a fully compensated gas, that option is wrong. Conversely a <b>chronic</b> COPD patient at baseline should look fully compensated.</div>
  <div class="hy"><span class="tag">Reading a normal pH</span><b>7.35 to 7.39 is the ACID side.</b> <b>7.41 to 7.45 is the BASE side.</b> In a fully compensated gas, the side the pH leans toward tells you what the <b>original</b> problem was.</div>
</div>

<div class="card" style="border-color:var(--blue)">
  <h3>🫁 Respiratory Acidosis — "CAN'T BREATHE"</h3>
  <p class="why-chain"><b>CO₂ retention.</b> They are not moving enough air, so acid builds up.</p>
  <table class="lab">
    <tr><td><b>Causes</b></td><td><b>HYPOventilation</b> — COPD, pneumonia, asthma exacerbation · <b>drug overdose</b> (opioids, sedatives) · <b>neuromuscular disease</b> or head injury · <b>airway obstruction</b> or chest wall disorders</td></tr>
    <tr><td><b>ABG pattern</b></td><td><b>↓pH · ↑PaCO₂ · HCO₃ normal or ↑</b></td></tr>
    <tr><td><b>RN priority</b></td><td><b>IMPROVE VENTILATION.</b> Position upright and open the airway · oxygen as ordered · bronchodilators and suction PRN · treat the underlying cause · <b>monitor ABG, vital signs, and LOC</b></td></tr>
    <tr><td><b>Compensation</b></td><td><b>Kidneys RETAIN bicarbonate</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ CAN'T BREATHE</div><div class="big">B reathless · R estlessness · E levated CO₂ · A ltered mental status · T achy · H eadache · E xhausted</div><div class="exp"><b>Restlessness and altered mental status come first.</b> The CO₂ is climbing and the brain shows it before anything else does.</div></div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>💨 Respiratory Alkalosis — "BREATHING TOO MUCH"</h3>
  <table class="lab">
    <tr><td><b>Causes</b></td><td><b>HYPERventilation</b> — anxiety, pain, fever · <b>pregnancy</b> · <b>mechanical ventilation</b> set too high · sepsis, hypoxemia, pneumonia</td></tr>
    <tr><td><b>ABG pattern</b></td><td><b>↑pH · ↓PaCO₂ · HCO₃ normal or ↓</b></td></tr>
    <tr><td><b>Classic signs</b></td><td><b>Circumoral numbness</b> · <b>tingling fingers and toes</b> · muscle spasms · <b>carpopedal spasm</b></td></tr>
    <tr><td><b>RN priority</b></td><td><b>Slow the breathing</b> — relaxation techniques · adjust ventilator settings · oxygen if hypoxic · <b>treat the anxiety, pain, or fever</b> · monitor ABG and electrolytes</td></tr>
    <tr><td><b>Compensation</b></td><td><b>Kidneys EXCRETE bicarbonate</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ LIGHT + A</div><div class="big">L ightheaded · I ncreased respiration · G iddiness · H and tingling · T etany · + A nxiety</div><div class="exp">The tingling and spasms happen because <b>alkalosis lowers ionized calcium</b>. Same neuromuscular picture as hypocalcemia, which is why <b>Chvostek and Trousseau can be positive</b> here too.</div></div>
</div>

<div class="card" style="border-color:var(--green)">
  <h3>🧪 Metabolic Acidosis — too much acid or lost base</h3>
  <table class="lab">
    <tr><td><b>Causes</b></td><td><b>DKA</b> · <b>diarrhea</b> · <b>kidney failure</b> · <b>lactic acidosis</b> · salicylate overdose</td></tr>
    <tr><td><b>ABG pattern</b></td><td><b>↓pH · ↓HCO₃ · PaCO₂ normal or ↓</b></td></tr>
    <tr><td><b>Classic signs</b></td><td><b>#1 KUSSMAUL RESPIRATIONS</b> — deep, rapid breathing · confusion · fatigue · headache · weakness · dehydration · nausea</td></tr>
    <tr><td><b>RN priority</b></td><td>Treat the underlying cause · <b>insulin for DKA</b> · IV fluids · <b>sodium bicarbonate if severe</b> · monitor electrolytes, ABG, and I&amp;O</td></tr>
    <tr><td><b>Compensation</b></td><td><b>Lungs BLOW OFF CO₂</b> — the body is trying to blow off acid</td></tr>
  </table>
  <div class="hy"><span class="tag">⭐ Kussmaul IS the compensation</span>Those deep rapid breaths are not a separate symptom — they are the <b>lungs compensating</b>. That is why the CO₂ comes back <b>low</b> in a metabolic acidosis gas even though the lungs are healthy.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>🧃 Metabolic Alkalosis — "BASIC"</h3>
  <table class="lab">
    <tr><td><b>Causes</b></td><td><b>Vomiting</b> (loss of HCl) · <b>NG suction</b> · <b>diuretics</b> (loop, thiazide) · excess bicarbonate or antacids · <b>hypokalemia</b></td></tr>
    <tr><td><b>ABG pattern</b></td><td><b>↑pH · ↑HCO₃ · PaCO₂ normal or ↑</b></td></tr>
    <tr><td><b>RN priority</b></td><td>Treat the underlying cause · <b>stop the vomiting or NG suction if possible</b> · <b>replace K⁺ and Cl⁻</b> · monitor ABG, vital signs, I&amp;O · administer fluids as prescribed</td></tr>
    <tr><td><b>Compensation</b></td><td><b>Lungs RETAIN CO₂ by breathing SLOWER</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ BASIC</div><div class="big">B reathing depressed · A rrhythmias · S eizures · I rritability · C onfusion and muscle CRAMPS</div><div class="exp">Also <b>hypoventilation, muscle twitching, tetany, and positive Chvostek or Trousseau if the calcium drops</b>. Alkalosis lowers ionized calcium regardless of which kind it is.</div></div>
  <div class="trap"><span class="tag">Why you replace potassium AND chloride</span>Vomiting and NG suction lose <b>hydrogen, potassium, and chloride together</b>. The alkalosis will not fully correct until the <b>chloride</b> is replaced, and the low potassium keeps it going. That is why the intervention names both.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ How he asks ABGs — BACKWARDS</h3>
  <p class="why-chain">Most practice questions hand you a gas and ask you to name it. <b>He does the opposite.</b> The stem gives you a <b>disease, a disease process, or the patient's symptoms</b>, and the four answer choices are <b>sets of ABG values</b>. Your job is to decide which set of numbers fits the picture he described.</p>
  <div class="mnem"><div class="tag">⭐ What the question looks like</div><div class="big">Stem = the patient. Options = four gases. Pick the gas that matches the patient.</div><div class="exp">You never get handed the numbers to interpret. You have to <b>predict</b> them.</div></div>
  <h4 style="margin:14px 0 6px">Work it in this order</h4>
  <ol class="chainlist">
    <li><b>1. Name the organ.</b> Is the problem in the <b>LUNG</b> or somewhere else? Lung → <b>respiratory</b>. Anything else — kidney, gut, metabolism — → <b>metabolic</b>.</li>
    <li><b>2. Decide the direction.</b> Are they <b>keeping acid or losing it</b>?<br>
      • <b>Not breathing enough</b> → CO₂ builds → <b>acidosis</b><br>
      • <b>Breathing too much</b> → CO₂ blown off → <b>alkalosis</b><br>
      • <b>Making or keeping acid</b> (ketones, lactate, renal failure) → <b>acidosis</b><br>
      • <b>Losing acid</b> (vomiting, NG suction) → <b>alkalosis</b></li>
    <li><b>3. Predict the pH.</b> Acidosis → pH <b>below 7.35</b>. Alkalosis → pH <b>above 7.45</b>.</li>
    <li><b>4. Predict the culprit value.</b> Respiratory → <b>CO₂</b> moved. Metabolic → <b>bicarb</b> moved. And it moved the direction that explains the pH.</li>
    <li><b>5. Scan the options for the set that has BOTH.</b> Right pH direction AND the right value moved. Usually only one option has both — the rest change the wrong number or move it the wrong way.</li>
    <li><b>6. Then check compensation.</b> <b>Acute or sudden</b> → expect the other value <b>normal</b> (uncompensated). <b>Chronic or long-standing</b> → expect the other value <b>abnormal in the same direction</b> (compensated), sometimes with a pH back inside normal.</li>
  </ol>
  <div class="hy"><span class="tag">⭐ The reference values you're matching against</span>
  <b>Normal:</b> pH 7.35–7.45 · CO₂ 35–45 · HCO₃ 22–26<br>
  <b>Respiratory acidosis:</b> pH ↓ · <b>CO₂ ↑</b> · HCO₃ normal (acute) or ↑ (chronic)<br>
  <b>Respiratory alkalosis:</b> pH ↑ · <b>CO₂ ↓</b> · HCO₃ normal or ↓<br>
  <b>Metabolic acidosis:</b> pH ↓ · <b>HCO₃ ↓</b> · CO₂ normal or ↓ (blowing it off to compensate)<br>
  <b>Metabolic alkalosis:</b> pH ↑ · <b>HCO₃ ↑</b> · CO₂ normal or ↑</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Condition → expected gas — the table to memorize</h3>
  <p class="intro-line" style="margin-top:0">If he names any of these, you already know which set of numbers to hunt for.</p>
  <table class="lab">
    <tr><th>He describes...</th><th>Because...</th><th>Expected gas</th></tr>
    <tr><td colspan="3" style="background:var(--bg2);font-weight:700">RESPIRATORY ACIDOSIS — ↓pH, ↑CO₂</td></tr>
    <tr><td><b>COPD exacerbation</b>, chronic bronchitis, emphysema</td><td>Air trapped, CO₂ cannot leave</td><td>↓pH · <b>↑CO₂</b> · ↑HCO₃ if chronic</td></tr>
    <tr><td><b>Opioid overdose</b>, oversedation, anesthesia</td><td>Respiratory drive suppressed</td><td>↓pH · <b>↑CO₂</b> · normal HCO₃</td></tr>
    <tr><td>Somnolence, shallow breathing, RR under 10</td><td>Hypoventilation</td><td>↓pH · <b>↑CO₂</b></td></tr>
    <tr><td>Neuromuscular disease, chest trauma, flail chest</td><td>Cannot move air mechanically</td><td>↓pH · <b>↑CO₂</b></td></tr>
    <tr><td>Airway obstruction, severe atelectasis, status asthmaticus <b>late</b></td><td>Ventilation failing</td><td>↓pH · <b>↑CO₂</b></td></tr>
    <tr><td colspan="3" style="background:var(--bg2);font-weight:700">RESPIRATORY ALKALOSIS — ↑pH, ↓CO₂</td></tr>
    <tr><td><b>Anxiety or panic attack</b>, hyperventilation</td><td>Blowing CO₂ off</td><td>↑pH · <b>↓CO₂</b> · normal HCO₃</td></tr>
    <tr><td><b>Pulmonary embolism early</b>, pain, fever, early sepsis</td><td>Tachypnea from the drive to breathe</td><td>↑pH · <b>↓CO₂</b></td></tr>
    <tr><td>High altitude, mechanical over-ventilation</td><td>Too many breaths</td><td>↑pH · <b>↓CO₂</b></td></tr>
    <tr><td>Tingling around the mouth and fingers, carpal spasm</td><td>Alkalosis lowers ionized calcium</td><td>↑pH · <b>↓CO₂</b></td></tr>
    <tr><td colspan="3" style="background:var(--bg2);font-weight:700">METABOLIC ACIDOSIS — ↓pH, ↓HCO₃</td></tr>
    <tr><td><b>DKA</b>, Kussmaul respirations, fruity breath</td><td>Ketones are acid</td><td>↓pH · <b>↓HCO₃</b> · ↓CO₂ (Kussmaul is the compensation)</td></tr>
    <tr><td><b>Shock, sepsis, cardiac arrest</b></td><td>Lactic acid from anaerobic metabolism</td><td>↓pH · <b>↓HCO₃</b></td></tr>
    <tr><td><b>Kidney failure</b>, CKD, dialysis patient</td><td>Cannot excrete acid or regenerate bicarb</td><td>↓pH · <b>↓HCO₃</b> · often ↑K⁺</td></tr>
    <tr><td><b>Severe or prolonged DIARRHEA</b>, intestinal fistula</td><td><b>Bicarbonate is lost from the gut</b></td><td>↓pH · <b>↓HCO₃</b></td></tr>
    <tr><td>Starvation, prolonged fasting, salicylate toxicity late</td><td>Acid accumulates</td><td>↓pH · <b>↓HCO₃</b></td></tr>
    <tr><td colspan="3" style="background:var(--bg2);font-weight:700">METABOLIC ALKALOSIS — ↑pH, ↑HCO₃</td></tr>
    <tr><td><b>Prolonged VOMITING</b>, <b>NG suction</b></td><td><b>Stomach acid is lost</b></td><td>↑pH · <b>↑HCO₃</b> · often ↓K⁺ and ↓Cl⁻</td></tr>
    <tr><td>Overuse of antacids or bicarbonate</td><td>Base added</td><td>↑pH · <b>↑HCO₃</b></td></tr>
    <tr><td><b>Loop or thiazide diuretics</b></td><td>Hydrogen and potassium lost in urine</td><td>↑pH · <b>↑HCO₃</b> · ↓K⁺</td></tr>
    <tr><td>Hypokalemia</td><td>Potassium shifts out, hydrogen shifts into cells</td><td>↑pH · <b>↑HCO₃</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The GI pair he loves</div><div class="big">VOMIT acid → ALKALOSIS. POOP base → ACIDOSIS.</div><div class="exp">Stomach contents are <b>acidic</b>, so losing them leaves you alkalotic. Intestinal contents are <b>alkaline</b> (bicarbonate), so losing them leaves you acidotic. <b>Top of the gut = alkalosis. Bottom of the gut = acidosis.</b></div></div>
  <div class="trap"><span class="tag">Where he turns the screw in this format</span>
  • <b>The right direction, wrong value.</b> An option with a low pH and a low CO₂ for a COPD patient — acidotic, but the CO₂ moved the wrong way.<br>
  • <b>The right value, wrong direction.</b> High CO₂ paired with a high pH. CO₂ is acid; more of it cannot raise the pH.<br>
  • <b>Compensation mismatch.</b> A <b>sudden</b> event with a fully compensated gas. Kidneys take <b>days</b> — an acute problem cannot already be compensated.<br>
  • <b>The normal gas.</b> One option is always within normal limits, there for the patient you decided has no acid-base problem. Rarely the answer when he described a sick patient.</div>
</div>

<div class="card">
  <h3>Read it in three steps</h3>
  <ul class="clean">
    <li><b>0. Check whether the stem names a failing organ.</b> Kidneys = metabolic. Lungs = respiratory. If it does, you already know the type.</li>
    <li><b>1. Look at the pH.</b> Below 7.35 = acidosis. Above 7.45 = alkalosis. If it is 7.35–7.45, it is normal or fully compensated.</li>
    <li><b>2. Find the culprit.</b> Which value moved the way that explains the pH? CO₂ opposite = respiratory. Bicarb same = metabolic.</li>
    <li><b>3. Check compensation.</b> pH abnormal + one value abnormal = <b>uncompensated</b>. pH abnormal + both abnormal = <b>partially compensated</b>. pH <b>normal</b> + both abnormal = <b>fully compensated</b>.</li>
  </ul>
  <div class="hy"><span class="tag">Which side of normal</span>In full compensation the pH tells you the original problem. <b>7.35–7.39 = the acid side.</b> <b>7.41–7.45 = the alkalotic side.</b> That is how you name a gas whose pH looks normal.</div>
</div>

<div class="card">
  <h3>Causes by type</h3>
  <table class="lab">
    <tr><th>Disorder</th><th>Causes</th><th>Signs</th></tr>
    <tr><td><b>Respiratory acidosis</b><br>↓pH ↑CO₂</td><td>Anything that retains CO₂: COPD, oversedation, opioid overdose, atelectasis, pneumonia, chest trauma, neuromuscular weakness</td><td>Drowsiness, headache, confusion, ↑HR, dysrhythmias</td></tr>
    <tr><td><b>Respiratory alkalosis</b><br>↑pH ↓CO₂</td><td>Hyperventilation: anxiety, pain, fever, early PE, high altitude, over-ventilation</td><td>Lightheaded, <b>tingling of fingers and around the mouth</b>, dizziness, tetany</td></tr>
    <tr><td><b>Metabolic acidosis</b><br>↓pH ↓HCO₃</td><td>DKA, kidney failure, lactic acidosis from shock, prolonged diarrhea (loses bicarbonate)</td><td><b>Kussmaul respirations</b> (deep and rapid to blow off acid), headache, confusion, hyperkalemia</td></tr>
    <tr><td><b>Metabolic alkalosis</b><br>↑pH ↑HCO₃</td><td>Vomiting or NG suction (loses acid), excess antacids, diuretics, hypokalemia</td><td>Tingling, dizziness, <b>hypoventilation</b> to retain CO₂, hypokalemia</td></tr>
  </table>
</div>

<div class="card">
  <h3>Practice reading</h3>
  <table class="lab">
    <tr><th>pH</th><th>PaCO₂</th><th>HCO₃</th><th>Interpretation</th></tr>
    <tr><td>7.30</td><td>52</td><td>24</td><td>Uncompensated <b>respiratory acidosis</b></td></tr>
    <tr><td>7.49</td><td>40</td><td>30</td><td>Uncompensated <b>metabolic alkalosis</b></td></tr>
    <tr><td>7.25</td><td>36</td><td>16</td><td>Uncompensated <b>metabolic acidosis</b></td></tr>
    <tr><td>7.52</td><td>28</td><td>23</td><td>Uncompensated <b>respiratory alkalosis</b></td></tr>
    <tr><td>7.32</td><td>58</td><td>30</td><td>Partially compensated <b>respiratory acidosis</b></td></tr>
    <tr><td>7.37</td><td>58</td><td>32</td><td><b>Fully compensated respiratory acidosis</b> — classic chronic COPD</td></tr>
    <tr><td>7.43</td><td>30</td><td>20</td><td><b>Fully compensated respiratory alkalosis</b></td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — a normal pH that is not normal</span>Fully compensated means <b>pH normal, both systems abnormal</b>. Stop at the pH and you will call a chronic COPD gas "normal."</div>
  <div class="trap"><span class="tag">Trap 2 — which side of 7.40</span>In full compensation, 7.37 is the <b>acid</b> side and 7.43 is the <b>alkalotic</b> side. That single digit names the disorder.</div>
  <div class="trap"><span class="tag">Trap 3 — treating the number</span>"Give sodium bicarbonate" and "apply 100% oxygen" get offered as fixes. Treat the <b>cause</b>: ventilation, perfusion, or the metabolic problem driving it.</div>
  <div class="trap"><span class="tag">Trap 4 — vomiting vs diarrhea</span><b>Vomiting and NG suction lose acid</b> → metabolic <b>alkalosis</b>. <b>Diarrhea loses bicarbonate</b> → metabolic <b>acidosis</b>. He puts both in the same question.</div>
  <div class="trap"><span class="tag">Trap 5 — ignoring the organ he handed you</span>A renal failure or dialysis patient with an abnormal pH, and respiratory options mixed in. <b>Kidneys = metabolic.</b> He tells you the organ precisely so he can see who uses it.</div>
  <div class="trap"><span class="tag">Trap 6 — hyperventilation assumed to be anxiety</span>Respiratory alkalosis from hyperventilation can be anxiety, but it can also be an early <b>PE</b>, sepsis, or fever. Sedating that patient is how you miss the emergency.</div>
</div>

<div id="q-abg"></div>`;

<h2 class="sec-title"><span class="sec-emoji">👃</span> Upper & Assessment</h2>
<p class="intro-line">Chapters 17 and 18 — how the lungs work, how you assess them, and everything above the trachea.</p>

<div class="jumpbar">In this section: <a href="#respupper-assessment" onclick="jumpTo(event,'respupper-assessment')">Assessment</a> <a href="#respupper-uppertract" onclick="jumpTo(event,'respupper-uppertract')">Upper Tract</a></div>

<div class="grphead" id="respupper-assessment"><h3>Assessment of Respiratory Function</h3><p class="grp-sub">The "how the lungs work + what you hear/see" chapter (Ch 17).</p></div>
<div class="card">
  <h3>🌬️ Key Definitions</h3>
  <ul class="clean">
    <li><b>Ventilation:</b> air moving in/out (mechanics — diaphragm, chest cage). <i>Inspiration = active/energy; expiration = passive.</i></li>
    <li><b>Respiration:</b> the whole gas-exchange process.</li>
    <li><b>Diffusion:</b> O₂/CO₂ swap at the alveolar–capillary membrane.</li>
    <li><b>Perfusion:</b> blood flow through pulmonary vessels (right ventricle → pulmonary artery).</li>
    <li><b>Hypoxia</b> = low O₂ in tissues. <b>Hypoxemia</b> = low O₂ in the blood.</li>
    <li><b>Hemoglobin</b> = the RBC protein that carries O₂.</li>
  </ul>
  <div class="prof"><span class="tag">📌 Slide note</span>Humans are <b>negative-pressure breathers</b> — the chest expands, pressure drops, air rushes in. Also <b>know tidal volume</b> (air in/out per normal breath).</div>
  <div class="hy">⭐ Ventilation & perfusion must be <b>matched (V/Q)</b> to live. A <b>V/Q mismatch</b> = the root problem in pneumonia, ARDS, PE.</div>
</div>

<div class="card">
  <h3>🚩 Symptoms of respiratory disease — what each one tells you</h3>
  <table class="lab">
    <tr><th>Symptom</th><th>What to assess and what it suggests</th></tr>
    <tr><td><b>Dyspnea</b></td><td>Sudden onset → <b>PE, pneumothorax, anaphylaxis</b>. Gradual → COPD, heart failure, effusion. Ask what makes it better or worse and <b>how many pillows</b> they sleep on</td></tr>
    <tr><td><b>Orthopnea</b></td><td>Dyspnea <b>lying flat</b>, relieved by sitting up. Heart failure, severe COPD</td></tr>
    <tr><td><b>Paroxysmal nocturnal dyspnea</b></td><td>Waking suddenly breathless hours into sleep. Classic heart failure</td></tr>
    <tr><td><b>Cough</b></td><td><b>Dry</b> → irritation, ACE inhibitors, early tracheobronchitis. <b>Productive</b> → infection, COPD, bronchiectasis. <b>Over 3 weeks</b> → screen for <b>TB</b>. Worse at night → asthma, GERD, postnasal drip</td></tr>
    <tr><td><b>Sputum</b></td><td><b>Clear or white</b> normal · <b>yellow or green</b> infection · <b>rust-colored</b> pneumococcal pneumonia · <b>pink and frothy</b> pulmonary edema · <b>copious and purulent</b> bronchiectasis · <b>foul-smelling</b> lung abscess</td></tr>
    <tr><td><b>Hemoptysis</b></td><td>Blood from the lungs — <b>bright red, frothy, alkaline</b>, with a cough. Distinguish from hematemesis: <b>dark, coffee-ground, acidic</b>, with vomiting. Causes: TB, cancer, bronchiectasis, PE</td></tr>
    <tr><td><b>Chest pain</b></td><td><b>Pleuritic</b> — sharp, worse on inspiration → pleurisy, PE, pneumonia. Constant and pressure-like → cardiac</td></tr>
    <tr><td><b>Wheezing</b></td><td>Narrowed airways. <b>Expiratory</b> → asthma, COPD. <b>Inspiratory (stridor)</b> → <b>upper</b> airway obstruction — an emergency</td></tr>
    <tr><td><b>Clubbing</b></td><td><b>Chronic</b> hypoxia only. Never acute. COPD, bronchiectasis, cystic fibrosis, lung cancer, cardiac disease</td></tr>
    <tr><td><b>Cyanosis</b></td><td><b>Very late.</b> Requires about <b>5 g/dL of unoxygenated hemoglobin</b> — so an <b>anemic patient may never show it</b> even when severely hypoxic</td></tr>
    <tr><td><b>⭐ Restlessness</b></td><td><b>The earliest sign of hypoxia.</b> Before saturation drops, before cyanosis</td></tr>
  </table>
</div>

<div class="card">
  <h3>🎵 Breath sounds — normal and adventitious</h3>
  <table class="lab">
    <tr><th>Normal sound</th><th>Where</th><th>Character</th></tr>
    <tr><td><b>Vesicular</b></td><td>Most of the lung fields</td><td>Soft, low-pitched. Inspiration longer than expiration</td></tr>
    <tr><td><b>Bronchovesicular</b></td><td>Around the sternum, between scapulae</td><td>Medium pitch. Inspiration equals expiration</td></tr>
    <tr><td><b>Bronchial</b></td><td>Over the trachea</td><td>Loud, high-pitched. Expiration longer</td></tr>
  </table>
  <div class="trap"><span class="tag">The one students miss</span><b>Bronchial breath sounds heard out in the PERIPHERY are abnormal</b> — they mean <b>consolidation</b> conducting central sounds outward. The sound itself is normal; hearing it in the wrong place is the finding.</div>
  <table class="lab">
    <tr><th>Adventitious sound</th><th>What it is</th><th>Think</th></tr>
    <tr><td><b>Fine crackles (rales)</b></td><td>Brief, high-pitched popping at <b>end-inspiration</b> — collapsed alveoli snapping open</td><td><b>Pulmonary edema, pneumonia, atelectasis, fibrosis</b></td></tr>
    <tr><td><b>Coarse crackles</b></td><td>Louder, lower, bubbling — air through <b>secretions</b></td><td>Bronchitis, pneumonia with secretions, heart failure</td></tr>
    <tr><td><b>Wheezes</b></td><td>High-pitched musical, usually <b>expiratory</b> — narrowed small airways</td><td><b>Asthma, COPD, bronchospasm</b></td></tr>
    <tr><td><b>Rhonchi</b></td><td>Low-pitched snoring or gurgling in larger airways. <b>May clear with coughing</b></td><td>Secretions — encourage coughing and reassess</td></tr>
    <tr><td><b>⭐ Stridor</b></td><td><b>Loud, high-pitched crowing on INSPIRATION</b>, often audible without a stethoscope</td><td><b>UPPER airway obstruction — EMERGENCY.</b> Croup, epiglottitis, laryngeal edema, foreign body, post-extubation swelling</td></tr>
    <tr><td><b>Pleural friction rub</b></td><td>Grating, leathery. <b>Does NOT clear with coughing</b></td><td>Pleurisy, pleural inflammation</td></tr>
    <tr><td><b>Absent or diminished</b></td><td>No air movement in that area</td><td><b>Pneumothorax, effusion, atelectasis, severe obstruction, silent chest</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">Two that separate quickly</div><div class="big">Rhonchi CLEAR with coughing. A friction rub does NOT.</div><div class="exp">And <b>stridor is inspiratory and upper airway</b>, while <b>wheezing is expiratory and lower airway</b>. Stridor always outranks wheezing for priority.</div></div>
</div>

<div class="card">
  <h3>🫳 Physical assessment technique and findings</h3>
  <table class="lab">
    <tr><th>Technique</th><th>What you're looking for</th></tr>
    <tr><td><b>Inspection</b></td><td>Rate, rhythm, depth, effort · <b>accessory muscle use, retractions, nasal flaring</b> · <b>barrel chest</b> (AP:lateral approaching 1:1) · <b>tripod positioning</b> · pursed-lip breathing · clubbing · cyanosis · symmetry of chest expansion</td></tr>
    <tr><td><b>Palpation</b></td><td><b>Tactile fremitus</b> — have them say "ninety-nine." <b>INCREASED over consolidation</b> (solid conducts better), <b>DECREASED over effusion, pneumothorax, or emphysema</b> (air and fluid block it). Also feel for <b>tracheal position</b>, chest expansion, tenderness, and <b>subcutaneous emphysema</b> (crackling under the skin)</td></tr>
    <tr><td><b>Percussion</b></td><td><b>Resonant</b> = normal · <b>DULL</b> = fluid or solid (effusion, consolidation, tumor, hemothorax) · <b>HYPERRESONANT</b> = too much air (emphysema, pneumothorax) · flat = large effusion</td></tr>
    <tr><td><b>Auscultation</b></td><td><b>Apex to base, side to side comparing left and right</b>, on <b>skin not clothing</b>, patient <b>sitting upright breathing through an open mouth</b>. Listen a full cycle at each spot</td></tr>
    <tr><td><b>Voice sounds</b></td><td><b>Egophony</b> — "E" sounds like "A" · <b>bronchophony</b> — spoken words unusually clear · <b>whispered pectoriloquy</b> — whispered words clear. <b>All three indicate consolidation</b></td></tr>
    <tr><td><b>Tracheal position</b></td><td><b>Deviates TOWARD</b> atelectasis or pneumonectomy (lost volume pulls). <b>Deviates AWAY</b> from tension pneumothorax or a large effusion (pressure pushes)</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The discriminator he uses most</div><div class="big">Consolidation and effusion are BOTH dull. Fremitus decides.</div><div class="exp"><b>Consolidation: dull + INCREASED fremitus + egophony.</b> <b>Effusion: dull + DECREASED fremitus + no egophony.</b></div></div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Glasgow Coma Scale — he covered this</h3>
  <p class="why-chain">The standardized way to score level of consciousness. It matters in respiratory because <b>the brain is the first organ to show oxygen deprivation</b> — restlessness and confusion appear before any number changes.</p>
  <table class="lab">
    <tr><th>Component</th><th>Scoring</th></tr>
    <tr><td><b>Eye opening</b> (4)</td><td>4 spontaneous · 3 to speech · 2 to pain · 1 none</td></tr>
    <tr><td><b>Verbal response</b> (5)</td><td>5 oriented · 4 confused · 3 inappropriate words · 2 incomprehensible sounds · 1 none</td></tr>
    <tr><td><b>Motor response</b> (6)</td><td>6 obeys commands · 5 localizes pain · 4 withdraws · 3 abnormal flexion · 2 abnormal extension · 1 none</td></tr>
  </table>
  <div class="mnem"><div class="tag">⭐ The number he gave</div><div class="big">Total 3 to 15 · A score BELOW 9 means severe CNS depression</div><div class="exp">Under 9 the patient <b>cannot protect their own airway</b> — that is the threshold where intubation is considered. 15 is fully alert; 3 is the lowest possible score, not zero.</div></div>
  <div class="trap"><span class="tag">Why it belongs in a respiratory unit</span>A falling GCS in a patient with respiratory distress means <b>rising CO₂ or worsening hypoxia</b>, not that they are finally resting. <b>Assess the patient, not the monitor</b> — he said that directly.</div>
</div>

<div class="card">
  <h3>🔬 Respiratory diagnostics</h3>
  <table class="lab">
    <tr><th>Test</th><th>Purpose and nursing care</th></tr>
    <tr><td><b>Pulse oximetry</b></td><td>Noninvasive saturation. <b>Unreliable</b> with poor perfusion, hypothermia, motion, nail polish, or <b>carbon monoxide poisoning</b> (reads falsely normal)</td></tr>
    <tr><td><b>ABG</b></td><td>Gold standard for gas exchange and acid-base. <b>Apply pressure 5 minutes after the draw</b> (longer if anticoagulated), place on ice, note the FiO₂</td></tr>
    <tr><td><b>Pulmonary function tests</b></td><td>Distinguishes <b>obstructive</b> (low FEV₁/FVC, high residual volume) from <b>restrictive</b> (low volumes, normal ratio). <b>Hold bronchodilators</b> before testing per order; no smoking beforehand</td></tr>
    <tr><td><b>Chest x-ray</b></td><td>First-line imaging. Remove metal. Ask about pregnancy</td></tr>
    <tr><td><b>CT / CT angiography</b></td><td>Detail; <b>CTA confirms PE</b>. Check <b>renal function and contrast allergy</b>; hydrate afterward</td></tr>
    <tr><td><b>Bronchoscopy</b></td><td>Visualize airways, biopsy, remove secretions or foreign bodies. <b>NPO before</b> · consent · sedation · <b>NPO AFTER until the gag reflex returns</b> · watch for bleeding, laryngospasm, and pneumothorax</td></tr>
    <tr><td><b>Thoracentesis</b></td><td>Removes and samples pleural fluid. <b>Sit upright leaning over a bedside table</b> · do not remove more than <b>1,000–1,500 mL at once</b> · <b>chest x-ray afterward</b> to rule out pneumothorax</td></tr>
    <tr><td><b>Sputum culture</b></td><td><b>Early morning, before eating, after rinsing the mouth with water</b> (not mouthwash). Deep cough from the lungs — saliva is not a specimen. <b>Collect before antibiotics</b></td></tr>
    <tr><td><b>V/Q scan</b></td><td>Ventilation-perfusion mismatch when CT contrast is contraindicated</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — cyanosis as the "hypoxia" answer</span>Cyanosis is <b>late</b>. The earliest sign is <b>restlessness and anxiety</b>, which is easy to dismiss as the patient just being upset.</div>
  <div class="trap"><span class="tag">Trap 2 — restlessness treated as a psych problem</span>"Give the PRN sedative" and "call for a psych consult" both appear. Sedating a hypoxic patient is how you lose them.</div>
  <div class="trap"><span class="tag">Trap 3 — the oxygen device question</span>Non-rebreather delivers the <b>most</b> oxygen. Venturi delivers the <b>most precise</b> oxygen. Read which one the stem is asking for.</div>
</div>
<div class="card" style="border-color:var(--teal)">
  <h3>Lung volumes and capacities</h3>
  <table class="lab">
    <tr><th>Term</th><th>Definition</th><th>Note</th></tr>
    <tr><td><b>⭐ Tidal volume (TV)</b></td><td>Air moved in or out with each <b>normal</b> breath</td><td><b>He said "know tidal volume."</b> About 500 mL in an adult</td></tr>
    <tr><td><b>Residual volume (RV)</b></td><td>Air <b>remaining after maximal exhalation</b> — you can never blow it out</td><td><b>Increases with aging and with COPD</b> from air trapping</td></tr>
    <tr><td><b>Vital capacity (VC)</b></td><td>Maximum air exhaled after a maximum inhalation</td><td>Falls in restrictive disease</td></tr>
    <tr><td>Inspiratory reserve volume</td><td>Extra air inhaled beyond a normal breath</td><td></td></tr>
    <tr><td>Expiratory reserve volume</td><td>Extra air exhaled beyond a normal breath</td><td></td></tr>
    <tr><td>Total lung capacity</td><td>Everything the lungs hold at maximum inflation</td><td>VC + RV</td></tr>
    <tr><td>Functional residual capacity</td><td>Air left after a <b>normal</b> exhalation</td><td></td></tr>
  </table>
  <div class="hy"><span class="tag">Why residual volume matters</span>COPD is an <b>obstructive</b> problem — air gets in but cannot get out. Trapped air <b>raises residual volume</b>, flattens the diaphragm, and produces the <b>barrel chest</b>.</div>
</div>

<div class="card">
  <h3>Compliance, resistance, and the work of breathing</h3>
  <table class="lab">
    <tr><th>Concept</th><th>What it means</th><th>When it goes wrong</th></tr>
    <tr><td><b>Compliance</b></td><td><b>How easily the lungs stretch.</b> Distensibility</td><td><b>Decreased</b> in ARDS, fibrosis, pneumonia, pulmonary edema — stiff lungs. <b>Increased</b> in emphysema — floppy lungs that will not recoil</td></tr>
    <tr><td><b>Airway resistance</b></td><td><b>Opposition to airflow</b> through the airways</td><td><b>Increased</b> by bronchoconstriction, secretions, edema, tumor. Higher resistance means more work of breathing</td></tr>
    <tr><td><b>Air pressure variance</b></td><td>Air flows high pressure to low. The diaphragm drops, pressure falls, air moves in</td><td>Loss of negative pressure, as in pneumothorax, collapses the lung</td></tr>
  </table>
  <div class="trap"><span class="tag">The counterintuitive one</span>Emphysema <b>increases</b> compliance. Easy to inflate, hard to deflate — the elastic recoil that normally pushes air out is destroyed. Students assume diseased lung means low compliance and get it backwards.</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>Ventilation-perfusion (V/Q)</h3>
  <ul class="clean">
    <li><b>Ventilation</b> = air reaching the alveoli. <b>Perfusion</b> = blood reaching the capillaries. <b>Gas exchange needs both.</b></li>
    <li><b>Pulmonary diffusion:</b> exchange of O₂ and CO₂ at the <b>alveolar-capillary membrane</b>. A <b>thin membrane and large surface area</b> make it work.</li>
    <li><b>Pulmonary perfusion:</b> blood pumped by the <b>right ventricle through the pulmonary artery</b>. Influenced by <b>pulmonary artery pressure, gravity, and alveolar pressure</b>.</li>
    <li><b>Shunted blood does not participate in gas exchange.</b></li>
  </ul>
  <table class="lab">
    <tr><th>Pattern</th><th>What is happening</th><th>Classic cause</th></tr>
    <tr><td><b>Low V/Q — SHUNT</b></td><td><b>Perfusion without ventilation.</b> Blood passes alveoli with no air</td><td><b>Pneumonia, atelectasis, pulmonary edema, ARDS</b></td></tr>
    <tr><td><b>High V/Q — DEAD SPACE</b></td><td><b>Ventilation without perfusion.</b> Air reaches alveoli with no blood</td><td><b>Pulmonary embolism</b> — the clot blocks blood, not air</td></tr>
    <tr><td><b>Silent unit</b></td><td><b>Neither</b> ventilation nor perfusion</td><td>Pneumothorax, severe ARDS</td></tr>
  </table>
  <div class="mnem"><div class="tag">Keep them straight</div><div class="big">SHUNT = blood but no air (pneumonia). DEAD SPACE = air but no blood (PE).</div><div class="exp">A shunt does <b>not</b> improve much with supplemental oxygen — the oxygen cannot reach blood bypassing filled alveoli. That is why <b>refractory hypoxemia means ARDS</b>.</div></div>
</div>

<div class="card">
  <h3>Assessment findings worth naming</h3>
  <table class="lab">
    <tr><th>Finding</th><th>Meaning</th></tr>
    <tr><td><b>Orthopnea</b></td><td>Dyspnea <b>lying flat</b>, relieved by sitting up. Heart failure and severe COPD. Ask how many pillows they sleep on</td></tr>
    <tr><td><b>Paroxysmal nocturnal dyspnea</b></td><td>Waking suddenly breathless a few hours into sleep</td></tr>
    <tr><td><b>Egophony</b></td><td>Patient says "E," it sounds like <b>"A"</b> — indicates <b>consolidation</b> (pneumonia)</td></tr>
    <tr><td><b>Bronchophony / whispered pectoriloquy</b></td><td>Spoken or whispered words heard <b>unusually clearly</b> — also consolidation</td></tr>
    <tr><td><b>Tactile fremitus</b></td><td><b>Increased</b> over consolidation, <b>decreased</b> over effusion or pneumothorax</td></tr>
    <tr><td><b>Percussion</b></td><td><b>Dull</b> over fluid or consolidation. <b>Hyperresonant</b> over trapped air</td></tr>
  </table>
  <div class="mnem"><div class="tag">Consolidation vs effusion</div><div class="big">Consolidation: dull, INCREASED fremitus, egophony. Effusion: dull, DECREASED fremitus, no egophony.</div><div class="exp">Both are dull — fremitus is what separates them.</div></div>
</div>


<div class="grphead" id="respupper-uppertract"><h3>Upper Respiratory Tract Disorders</h3><p class="grp-sub">Chapter 18. Everything above the trachea. This is the section that was missing from the old guide entirely.</p></div>
<div class="card">
  <h3>Infections and inflammation</h3>
  <table class="lab">
    <tr><th>Condition</th><th>Key features</th><th>Nursing focus</th></tr>
    <tr><td><b>Rhinitis</b></td><td>Allergic or viral. Sneezing, congestion, clear drainage, itchy eyes</td><td>Antihistamines, nasal steroids, allergen avoidance. <b>Rebound congestion</b> from decongestant sprays used over 3 days</td></tr>
    <tr><td><b>Acute rhinosinusitis</b></td><td>Facial pain and pressure, purulent drainage, congestion over 7-10 days</td><td>Most are viral. Antibiotics only if symptoms persist or worsen. Humidification, fluids, warm compresses</td></tr>
    <tr><td><b>Pharyngitis</b></td><td>Sore throat. Strep: sudden onset, fever, exudate, tender nodes, <b>no cough</b></td><td>Rapid strep test. Full antibiotic course prevents <b>rheumatic fever and glomerulonephritis</b>. Warm saline gargles</td></tr>
    <tr><td><b>Tonsillitis / adenoiditis</b></td><td>Sore throat, dysphagia, mouth breathing, snoring</td><td>Post-tonsillectomy: watch for <b>frequent swallowing</b> — the earliest sign of bleeding</td></tr>
    <tr><td><b>Peritonsillar abscess</b></td><td>Severe unilateral pain, "hot potato" voice, trismus, deviated uvula</td><td>Airway threat. Drainage plus antibiotics</td></tr>
    <tr><td><b>Laryngitis</b></td><td>Hoarseness or voice loss</td><td><b>Voice rest</b>, humidification, no whispering (it strains more than speaking)</td></tr>
  </table>
  <div class="hy"><span class="tag">Post-tonsillectomy priority</span><b>Frequent swallowing</b> is the earliest hemorrhage sign — blood trickling down the throat. Also restlessness and tachycardia. Avoid coughing, clearing the throat, straws, and red or brown fluids that mask blood.</div>
</div>

<div class="card">
  <h3>🤧 Rhinitis, sinusitis, and pharyngitis</h3>
  <table class="lab">
    <tr><th>Condition</th><th>Key points</th></tr>
    <tr><td><b>Allergic rhinitis</b></td><td><b>Clear watery drainage, sneezing, itchy eyes and nose</b>, pale boggy turbinates. Antihistamines, intranasal steroids, allergen avoidance</td></tr>
    <tr><td><b>Viral rhinitis</b> (common cold)</td><td>Self-limiting. Rest, fluids, humidification. <b>Antibiotics do nothing</b> — that is a teaching point he can test</td></tr>
    <tr><td><b>Acute rhinosinusitis</b></td><td><b>Facial pain and pressure worse when bending forward</b>, purulent drainage, nasal congestion, headache, tooth pain. Under 4 weeks. Most are <b>viral</b> — antibiotics only if symptoms persist beyond 10 days, worsen after improving, or are severe</td></tr>
    <tr><td><b>Chronic rhinosinusitis</b></td><td><b>12 weeks or more.</b> May need imaging or surgery</td></tr>
    <tr><td><b>Pharyngitis</b></td><td><b>Viral</b> — gradual, with cough and coryza. <b>Streptococcal</b> — <b>sudden sore throat, fever, exudate, tender nodes, and NO cough</b>. Rapid strep and culture. <b>Untreated strep risks rheumatic fever and glomerulonephritis</b> — complete the full antibiotic course</td></tr>
    <tr><td><b>Tonsillitis</b></td><td>Sore throat, dysphagia, fever, enlarged tonsils with exudate. Tonsillectomy for recurrent infection or obstruction</td></tr>
    <tr><td><b>Laryngitis</b></td><td><b>Hoarseness</b> from inflamed vocal cords. <b>Voice rest</b>, humidification, fluids. Whispering strains the cords more than speaking softly</td></tr>
  </table>
  <div class="trap"><span class="tag">⭐ After tonsillectomy</span><b>FREQUENT SWALLOWING is the earliest sign of bleeding</b> — the patient is swallowing blood trickling down the back of the throat. Also restlessness and rising pulse. <b>Position on the side or prone</b> to let secretions drain · <b>ice collar</b> · <b>cool liquids, avoid red or brown fluids</b> (they mimic blood) · <b>NO straws, no coughing, no throat clearing, no gargling</b> · avoid milk products early (they thicken secretions) · <b>bleeding risk is highest in the first 24 hours and again 5–10 days out</b> when the scab sloughs.</div>
</div>

<div class="card">
  <h3>🩸 Epistaxis (nosebleed)</h3>
  <ul class="clean">
    <li><b>⭐ Positioning: sit upright and lean FORWARD.</b> Tilting the head <b>back</b> lets blood run down the throat — it obscures how much is lost, causes nausea and vomiting, and risks aspiration.</li>
    <li><b>Pinch the SOFT part of the nose</b> (not the bony bridge) firmly for <b>5 to 10 minutes without releasing to check</b>.</li>
    <li>Apply <b>ice or a cold compress</b> to the bridge and encourage breathing through the mouth.</li>
    <li>If it continues: <b>topical vasoconstrictor, cautery, anterior or posterior packing, or balloon tamponade</b>.</li>
    <li><b>Posterior packing</b> patients need close monitoring — <b>airway obstruction, hypoxia, and vagal response</b> are real risks. Keep them monitored.</li>
    <li><b>Causes:</b> dry air, trauma or nose-picking, <b>hypertension</b>, anticoagulants, aspirin, cocaine use, clotting disorders.</li>
    <li><b>Teaching afterward:</b> humidify, water-soluble lubricant to the nares, <b>no forceful nose blowing, straining, or heavy lifting</b> for several days.</li>
  </ul>
</div>

<div class="card">
  <h3>😴 Obstructive sleep apnea</h3>
  <ul class="clean">
    <li><b>Repeated airway collapse during sleep</b> causing apneic episodes of <b>10 seconds or longer</b>, with oxygen desaturation and arousal.</li>
    <li><b>Signs:</b> <b>loud snoring, witnessed apnea, gasping or choking arousals</b>, unrefreshing sleep, <b>excessive daytime sleepiness</b>, morning headache, irritability, difficulty concentrating, and decreased libido.</li>
    <li><b>Risk factors:</b> <b>obesity</b>, thick neck, male sex, older age, large tonsils or adenoids, retrognathia, alcohol and sedatives at bedtime, smoking.</li>
    <li><b>Diagnosis: polysomnography (sleep study)</b> is definitive.</li>
    <li><b>Treatment:</b> <b>CPAP is first-line</b> · weight loss · <b>avoid alcohol and sedatives</b>, which relax the airway further · <b>side-sleeping</b> rather than supine · oral appliances · surgery (UPPP) in selected patients.</li>
    <li><b>Untreated consequences:</b> <b>hypertension, dysrhythmias, right heart failure, stroke, type 2 diabetes</b>, and motor vehicle accidents from daytime sleepiness.</li>
  </ul>
  <div class="trap"><span class="tag">The perioperative angle</span>OSA patients are <b>highly sensitive to opioids and sedatives</b>. Postoperatively they need <b>close respiratory monitoring, and their own CPAP brought in and used</b>. An option that gives an unmonitored opioid to a patient with OSA is the wrong answer.</div>
</div>

<div class="card">
  <h3>🗣️ Laryngeal cancer</h3>
  <ul class="clean">
    <li><b>⭐ Hallmark: HOARSENESS lasting more than 2 weeks.</b> Any persistent voice change warrants evaluation — that is the single most testable fact here.</li>
    <li><b>Other signs:</b> persistent sore throat, <b>dysphagia</b>, a lump in the throat or neck, ear pain, chronic cough, <b>hemoptysis</b>, unintentional weight loss, and later <b>stridor</b> from obstruction.</li>
    <li><b>Risk factors:</b> <b>smoking and alcohol together are synergistic</b> — far more than either alone. Also HPV, occupational exposures, GERD.</li>
    <li><b>Diagnosis:</b> laryngoscopy with <b>biopsy</b>, CT or MRI for staging.</li>
    <li><b>Treatment:</b> radiation, chemotherapy, partial or <b>total laryngectomy</b>.</li>
  </ul>
  <div class="hy"><span class="tag">After a total laryngectomy</span><b>The patient breathes through a permanent stoma and can no longer speak normally.</b> There is <b>no connection between the nose/mouth and the lungs</b> — so no nose-blowing, and CPR is given <b>through the stoma</b>. Teach: <b>cover the stoma when coughing</b>, humidify (the nose no longer warms or filters air), <b>no swimming</b>, shower with care, wear a stoma cover, and carry medical identification. Arrange <b>speech therapy</b> for esophageal speech, an electrolarynx, or a tracheoesophageal puncture. Address <b>body image and communication</b> — establish a signaling method before surgery.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — head back for a nosebleed</span>Lean <b>forward</b>. Tilting back causes aspiration and hides blood loss.</div>
  <div class="trap"><span class="tag">Trap 2 — the quiet post-tonsillectomy child</span>Frequent <b>swallowing</b> is the earliest bleeding sign, not vomiting blood. A quiet swallowing patient is the emergency.</div>
  <div class="trap"><span class="tag">Trap 3 — hoarseness dismissed</span>Hoarseness over <b>2 weeks</b> is a laryngeal cancer warning, not laryngitis. "Rest the voice and recheck in a month" is the trap.</div>
  <div class="trap"><span class="tag">Trap 4 — the decongestant spray</span>Over 3 days causes <b>rebound congestion</b>, so the patient uses more and gets worse. Any teaching option allowing prolonged use is wrong.</div>
  <div class="trap"><span class="tag">Trap 5 — whispering to rest the voice</span>Whispering strains the vocal cords <b>more</b> than normal speech. True voice rest means not speaking.</div>
  <div class="trap"><span class="tag">Trap 6 — stopping strep antibiotics early</span>The full course prevents <b>rheumatic fever and glomerulonephritis</b>, not just symptom return.</div>
</div>


<div id="q-respupper"></div>`;
