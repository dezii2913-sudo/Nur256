<script>
document.getElementById('sec-resp-assess').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🔍</span> Respiratory Assessment</h2>
<p class="intro-line">The "how the lungs work + what you hear/see" chapter (Ch 17).</p>

<div class="card">
  <h3>🌬️ Key Definitions</h3>
  <ul class="clean">
    <li><b>Ventilation:</b> air moving in/out (mechanics — diaphragm, chest cage). <i>Inspiration = active/energy; expiration = passive.</i></li>
    <li><b>Respiration:</b> the whole gas-exchange process.</li>
    <li><b>Diffusion:</b> O₂/CO₂ swap at the alveolar–capillary membrane.</li>
    <li><b>Perfusion:</b> blood flow through pulmonary vessels (right ventricle → pulmonary artery).</li>
    <li><b>Hypoxia</b> = low O₂ in tissues. <b>Hypoxemia</b> = low O₂ in the blood.</li>
    <li><b>Hemoglobin</b> = the RBC protein that carries O₂.</li>
  </ul>
  <div class="prof"><span class="tag">📌 Slide note</span>Humans are <b>negative-pressure breathers</b> — the chest expands, pressure drops, air rushes in. Also <b>know tidal volume</b> (air in/out per normal breath).</div>
  <div class="hy">⭐ Ventilation & perfusion must be <b>matched (V/Q)</b> to live. A <b>V/Q mismatch</b> = the root problem in pneumonia, ARDS, PE.</div>
</div>

<div class="card">
  <h3>🚩 Common Symptoms of Respiratory Disease</h3>
  <span class="pill p-purple">Dyspnea</span><span class="pill p-purple">Cough</span><span class="pill p-purple">Sputum</span>
  <span class="pill p-purple">Chest pain</span><span class="pill p-purple">Wheezing</span><span class="pill p-purple">Hemoptysis</span>
  <p style="margin-top:8px"><b>Chest pain</b> often signals obstruction. <b>Hemoptysis</b> = coughing up blood.</p>
  <div class="hy">⭐ <b>Cyanosis is a LATE sign</b> of hypoxia. Bluish in lighter skin, grayish in darker skin. Central (lips/tongue) is worse than peripheral (fingers/toes/earlobes).</div>
</div>

<div class="card">
  <h3>🎵 Adventitious (abnormal) Breath Sounds — KNOW THESE</h3>
  <table class="lab">
    <tr><th>Sound</th><th>Means</th><th>Seen in</th></tr>
    <tr><td><b>Crackles</b> (rales)</td><td>Fluid in alveoli</td><td>CHF, pneumonia, pulmonary edema</td></tr>
    <tr><td><b>Wheezes</b></td><td>Narrowed airways</td><td>Asthma, COPD</td></tr>
    <tr><td><b>Rhonchi</b></td><td>Secretions in larger airways</td><td>Bronchitis, pneumonia</td></tr>
    <tr><td><b>Stridor</b> 🚨</td><td>Upper-airway obstruction</td><td>EMERGENCY — croup, foreign body, anaphylaxis</td></tr>
  </table>
  <div class="mnem"><div class="tag">🧠 Mnemonic</div><div class="big">"Crackles = wet • Wheeze = tight • Stridor = scary"</div></div>
</div>

<div class="card">
  <h3>🫳 Other Assessment Pearls</h3>
  <ul class="clean">
    <li><b>Clubbing</b> of fingers = chronic hypoxia (lung disease, congenital heart disease).</li>
    <li><b>Barrel chest</b> (↑ AP diameter, normal ratio is 1:2) = <b>classic COPD/emphysema</b> (slide note!).</li>
    <li>Normal RR = <b>12–20/min</b>. Pulse ox normal = <b>95–100%</b>.</li>
    <li><b>ABGs = gold standard</b> for respiratory failure.</li>
  </ul>
</div>



<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — cyanosis as the "hypoxia" answer</span>Cyanosis is <b>late</b>. The earliest sign is <b>restlessness and anxiety</b>, which is easy to dismiss as the patient just being upset.</div>
  <div class="trap"><span class="tag">Trap 2 — restlessness treated as a psych problem</span>"Give the PRN sedative" and "call for a psych consult" both appear. Sedating a hypoxic patient is how you lose them.</div>
  <div class="trap"><span class="tag">Trap 3 — the oxygen device question</span>Non-rebreather delivers the <b>most</b> oxygen. Venturi delivers the <b>most precise</b> oxygen. Read which one the stem is asking for.</div>
</div>
<div class="card" style="border-color:var(--teal)">
  <h3>Lung volumes and capacities</h3>
  <table class="lab">
    <tr><th>Term</th><th>Definition</th><th>Note</th></tr>
    <tr><td><b>⭐ Tidal volume (TV)</b></td><td>Air moved in or out with each <b>normal</b> breath</td><td><b>He said "know tidal volume."</b> About 500 mL in an adult</td></tr>
    <tr><td><b>Residual volume (RV)</b></td><td>Air <b>remaining after maximal exhalation</b> — you can never blow it out</td><td><b>Increases with aging and with COPD</b> from air trapping</td></tr>
    <tr><td><b>Vital capacity (VC)</b></td><td>Maximum air exhaled after a maximum inhalation</td><td>Falls in restrictive disease</td></tr>
    <tr><td>Inspiratory reserve volume</td><td>Extra air inhaled beyond a normal breath</td><td></td></tr>
    <tr><td>Expiratory reserve volume</td><td>Extra air exhaled beyond a normal breath</td><td></td></tr>
    <tr><td>Total lung capacity</td><td>Everything the lungs hold at maximum inflation</td><td>VC + RV</td></tr>
    <tr><td>Functional residual capacity</td><td>Air left after a <b>normal</b> exhalation</td><td></td></tr>
  </table>
  <div class="hy"><span class="tag">Why residual volume matters</span>COPD is an <b>obstructive</b> problem — air gets in but cannot get out. Trapped air <b>raises residual volume</b>, flattens the diaphragm, and produces the <b>barrel chest</b>.</div>
</div>

<div class="card">
  <h3>Compliance, resistance, and the work of breathing</h3>
  <table class="lab">
    <tr><th>Concept</th><th>What it means</th><th>When it goes wrong</th></tr>
    <tr><td><b>Compliance</b></td><td><b>How easily the lungs stretch.</b> Distensibility</td><td><b>Decreased</b> in ARDS, fibrosis, pneumonia, pulmonary edema — stiff lungs. <b>Increased</b> in emphysema — floppy lungs that will not recoil</td></tr>
    <tr><td><b>Airway resistance</b></td><td><b>Opposition to airflow</b> through the airways</td><td><b>Increased</b> by bronchoconstriction, secretions, edema, tumor. Higher resistance means more work of breathing</td></tr>
    <tr><td><b>Air pressure variance</b></td><td>Air flows high pressure to low. The diaphragm drops, pressure falls, air moves in</td><td>Loss of negative pressure, as in pneumothorax, collapses the lung</td></tr>
  </table>
  <div class="trap"><span class="tag">The counterintuitive one</span>Emphysema <b>increases</b> compliance. Easy to inflate, hard to deflate — the elastic recoil that normally pushes air out is destroyed. Students assume diseased lung means low compliance and get it backwards.</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>Ventilation-perfusion (V/Q)</h3>
  <ul class="clean">
    <li><b>Ventilation</b> = air reaching the alveoli. <b>Perfusion</b> = blood reaching the capillaries. <b>Gas exchange needs both.</b></li>
    <li><b>Pulmonary diffusion:</b> exchange of O₂ and CO₂ at the <b>alveolar-capillary membrane</b>. A <b>thin membrane and large surface area</b> make it work.</li>
    <li><b>Pulmonary perfusion:</b> blood pumped by the <b>right ventricle through the pulmonary artery</b>. Influenced by <b>pulmonary artery pressure, gravity, and alveolar pressure</b>.</li>
    <li><b>Shunted blood does not participate in gas exchange.</b></li>
  </ul>
  <table class="lab">
    <tr><th>Pattern</th><th>What is happening</th><th>Classic cause</th></tr>
    <tr><td><b>Low V/Q — SHUNT</b></td><td><b>Perfusion without ventilation.</b> Blood passes alveoli with no air</td><td><b>Pneumonia, atelectasis, pulmonary edema, ARDS</b></td></tr>
    <tr><td><b>High V/Q — DEAD SPACE</b></td><td><b>Ventilation without perfusion.</b> Air reaches alveoli with no blood</td><td><b>Pulmonary embolism</b> — the clot blocks blood, not air</td></tr>
    <tr><td><b>Silent unit</b></td><td><b>Neither</b> ventilation nor perfusion</td><td>Pneumothorax, severe ARDS</td></tr>
  </table>
  <div class="mnem"><div class="tag">Keep them straight</div><div class="big">SHUNT = blood but no air (pneumonia). DEAD SPACE = air but no blood (PE).</div><div class="exp">A shunt does <b>not</b> improve much with supplemental oxygen — the oxygen cannot reach blood bypassing filled alveoli. That is why <b>refractory hypoxemia means ARDS</b>.</div></div>
</div>

<div class="card">
  <h3>Assessment findings worth naming</h3>
  <table class="lab">
    <tr><th>Finding</th><th>Meaning</th></tr>
    <tr><td><b>Orthopnea</b></td><td>Dyspnea <b>lying flat</b>, relieved by sitting up. Heart failure and severe COPD. Ask how many pillows they sleep on</td></tr>
    <tr><td><b>Paroxysmal nocturnal dyspnea</b></td><td>Waking suddenly breathless a few hours into sleep</td></tr>
    <tr><td><b>Egophony</b></td><td>Patient says "E," it sounds like <b>"A"</b> — indicates <b>consolidation</b> (pneumonia)</td></tr>
    <tr><td><b>Bronchophony / whispered pectoriloquy</b></td><td>Spoken or whispered words heard <b>unusually clearly</b> — also consolidation</td></tr>
    <tr><td><b>Tactile fremitus</b></td><td><b>Increased</b> over consolidation, <b>decreased</b> over effusion or pneumothorax</td></tr>
    <tr><td><b>Percussion</b></td><td><b>Dull</b> over fluid or consolidation. <b>Hyperresonant</b> over trapped air</td></tr>
  </table>
  <div class="mnem"><div class="tag">Consolidation vs effusion</div><div class="big">Consolidation: dull, INCREASED fremitus, egophony. Effusion: dull, DECREASED fremitus, no egophony.</div><div class="exp">Both are dull — fremitus is what separates them.</div></div>
</div>

<div id="q-resp-assess"></div>`;
renderFilteredQuiz('q-resp-assess', secQ(EXAM.filter(q=>q.topic==='resp')), 'Respiratory assessment practice', 'Resp Assessment');

document.getElementById('sec-acute').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🚨</span> Acute Respiratory Disorders</h2>
<p class="intro-line">Atelectasis, Acute Tracheobronchitis, Acute Respiratory Failure & ARDS.</p>

<div class="card">
  <h3>🎈 Atelectasis — collapsed alveoli</h3>
  <p><b>Most common type = OBSTRUCTIVE</b> (blockage → trapped air absorbed → collapse). Most common timing = post-op.</p>
  <p><b>Causes:</b> post-op, mucus plugs, shallow breathing, pain, prolonged supine/bedrest, foreign body, tumors.</p>
  <p><b>Signs:</b> ↑work of breathing, dyspnea, ↑HR, ↑RR, ↓breath sounds + crackles over the area, SpO₂ &lt;92%, patchy/white on CXR.</p>
  <p><b>Prevention/Tx:</b> <b>turn q2h</b>, early ambulation, deep breathing/coughing, <b>incentive spirometer</b> (inhale deep, hold 3 sec, keep float in "best" zone), pulmonary toilet.</p>
  <div class="mnem"><div class="tag">🧠 IS technique</div><div class="big">Incentive Spirometer = "Sip slow, hold, keep the ball UP"</div></div>
</div>

<div class="card">
  <h3>🗣️ Acute Tracheobronchitis</h3>
  <p>Inflammation of trachea + bronchi, usually <b>follows a viral URI</b> that travels down. Can progress to pneumonia.</p>
  <p><b>Signs:</b> dry irritating cough (→ later purulent sputum), fever, chills, night sweats, headache, malaise, stridor/wheeze.</p>
  <p><b>Tx:</b> antibiotics if bacterial (per culture), <b>↑ fluids to thin secretions</b>, cool vapor/steam, mild analgesics, rest. <b>AVOID antihistamines</b> (dry out secretions) and avoid cough suppressants (you need to clear secretions).</p>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🆘 Acute Respiratory Failure (ARF)</h3>
  <p>Sudden, life-threatening failure of gas exchange.</p>
  <div class="hy">⭐ <b>CRITERIA (memorize):</b> PaO₂ &lt; 60 mmHg AND/OR PaCO₂ &gt; 50 mmHg with pH &lt; 7.35.</div>
  <p><b>Causes:</b> overdose, chest trauma, neuromuscular (myasthenia gravis), COPD exacerbation, asthma, airway obstruction.</p>
  <ul class="clean">
    <li><b>EARLY:</b> restlessness, fatigue, headache, air hunger, ↑HR, ↑BP (compensating).</li>
    <li><b>LATE:</b> confusion, lethargy, tachypnea, cyanosis, diaphoresis → respiratory arrest.</li>
  </ul>
  <p><b>Tx:</b> O₂, intubation + mechanical ventilation, treat the cause.</p>
  <div class="prof"><span class="tag">📌 Slide note</span>Respiratory arrest → cardiac arrest = "the body just gives up." Catch the EARLY signs.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>💥 ARDS — Acute Respiratory Distress Syndrome</h3>
  <p>Severe inflammatory lung injury → <b>noncardiogenic pulmonary edema</b>, diffuse alveolar damage, surfactant dysfunction.</p>
  <div class="hy">⭐ <b>HALLMARK: hypoxemia REFRACTORY to oxygen</b> (O₂ doesn't fix it) + <b>bilateral infiltrates</b> on CXR. Rapid onset (within ~72h of trigger).</div>
  <p><b>Causes:</b> sepsis, trauma, aspiration, pancreatitis, severe pneumonia.</p>
  <p><b>Tx:</b> mechanical ventilation with <b>PEEP</b> (keeps alveoli open), treat underlying cause. <b>Prone positioning ~every 12 hours</b> improves oxygenation (esp. COVID-19). Nutritional support <b>35–45 kcal/kg/day</b> (enteral preferred). BNP helps rule out a cardiac cause. Mortality 27–50%.</p>
  <p><b>Why it happens:</b> inflammation opens capillaries → fluid + WBCs flood lung tissue; <b>surfactant (which normally keeps alveoli open) is washed out</b> → alveolar collapse + severe shunting.</p>
  <div class="mnem"><div class="tag">🧠 Tell ARDS apart</div><div class="big">"O₂ won't fix it + both lungs white = ARDS"</div></div>
</div>



<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — ARDS defined by the wrong feature</span>The hallmark is <b>refractory hypoxemia</b> — it does not improve with oxygen. "Hypoxemia that improves with oxygen" is offered as the near-miss.</div>
  <div class="trap"><span class="tag">Trap 2 — the direction of tracheal deviation</span>In a <b>tension</b> pneumothorax the trachea deviates <b>AWAY</b> from the affected side. Both directions appear as options.</div>
  <div class="trap"><span class="tag">Trap 3 — first action versus first finding</span>Suspected PE: "obtain a CT" and "assess the calf" are both correct eventually. The <b>first action</b> is the independent one you can do now — raise the head of the bed and oxygenate.</div>
  <div class="trap"><span class="tag">Trap 4 — post-op fever timing</span>Fever in the first 24 to 48 hours is <b>atelectasis</b>. Infection fevers arrive after day 3.</div>
</div>
<div id="q-acute"></div>`;
renderFilteredQuiz('q-acute', secQ(EXAM.filter(q=>q.topic==='resp')), 'Acute respiratory practice', 'Acute Respiratory');

document.getElementById('sec-pneumonia').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🦠</span> Pneumonia</h2>
<p class="intro-line">Your professor flagged "pneumonia assessment findings" as a guaranteed test point. Plus the VAP bundle.</p>

<div class="card">
  <h3>📚 The 4 Types (the 48-hour rule)</h3>
  <table class="lab">
    <tr><th>Type</th><th>Definition</th></tr>
    <tr><td><b>CAP</b> (community)</td><td>In community OR within first 48h of admission</td></tr>
    <tr><td><b>HCAP</b> (healthcare)</td><td>Recent healthcare contact — often MDROs</td></tr>
    <tr><td><b>HAP</b> (hospital)</td><td>≥48h AFTER admission (not incubating at admit)</td></tr>
    <tr><td><b>VAP</b> (ventilator)</td><td>≥48h after intubation/mechanical ventilation</td></tr>
  </table>
  <div class="hy">⭐ Most common bacterial cause of CAP = <b>Streptococcus pneumoniae</b>. HAP/VAP often = multidrug-resistant (MDROs): Pseudomonas, MRSA, Klebsiella.</div>
</div>

<div class="card">
  <h3>🔎 Assessment Findings (HIGH YIELD)</h3>
  <ul class="clean">
    <li>Fever, chills, night sweats</li>
    <li><b>Pleuritic chest pain</b></li>
    <li><b>Productive cough</b> (purulent sputum)</li>
    <li><b>Crackles</b> (air moving over wet areas)</li>
    <li>Dyspnea, tachypnea, tachycardia</li>
    <li><b>Dullness on percussion</b> + ↑ tactile fremitus (consolidation)</li>
    <li>In <b>elderly</b>: may be atypical — confusion, weakness, ↓appetite (watch mental status!)</li>
  </ul>
  <div class="prof"><span class="tag">📌 Sputum colors (know these!)</span>Rusty/blood-tinged = pneumococcal • purulent (yellow/green) = bacterial • thin/mucoid = viral • frothy pink = pulmonary edema • foul-smelling = lung abscess/anaerobic.</div>
</div>

<div class="card">
  <h3>🩺 Diagnosis & Treatment</h3>
  <p><b>Diagnosis:</b> chest x-ray, sputum culture, blood cultures, CBC, physical exam, bronchoscopy (severe).</p>
  <p><b>Treatment:</b> antibiotics (pathogen-specific; viral = supportive only), <b>hydration 2–3 L/day</b>, O₂, pulmonary toilet/CPT, incentive spirometry, rest, nutrition (small frequent meals), vaccines (pneumococcal, COVID, RSV, flu).</p>
  <div class="prof"><span class="tag">📌 Slide note</span><b>CPT = "gorilla pat the patient's chest"</b> (chest physiotherapy loosens secretions). Patients respond to antibiotics in <b>24–48 hours</b>.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🛡️ The VAP Bundle (your prof said KNOW THIS)</h3>
  <p>How to prevent Ventilator-Associated Pneumonia:</p>
  <ul class="clean">
    <li><b>H</b>ead of bed elevated 30–45°</li>
    <li><b>O</b>ral care with chlorhexidine (q4h)</li>
    <li><b>B</b> — sedation vacations (daily wean readiness)</li>
    <li>Peptic ulcer (stress ulcer) prophylaxis</li>
    <li>DVT prophylaxis</li>
  </ul>
  <div class="mnem"><div class="tag">🧠 Mnemonic</div><div class="big">"Heads up, Clean mouth, Wake up, Protect gut & legs"</div></div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>🫗 Aspiration Pneumonia</h3>
  <p>Inhaling foreign material (gastric contents, food). Gastric acid damages cilia → impaired clearance → inflammation → hypoxemia.</p>
  <div class="hy">⭐ <b>MORE COMMON IN THE RIGHT LUNG</b> — the right mainstem bronchus is straighter & wider (slide note!).</div>
  <p><b>Risk factors:</b> stroke, dysphagia, ↓LOC, sedation, CNS depressants (alcohol, drugs), NG tube / ET tube (epiglottis can't fully close), tube feeding.</p>
  <p><b>Prevention:</b> HOB 30–45°, swallow eval, upright for meals, verify feeding tube placement, minimize sedation.</p>
</div>

<div class="card">
  <h3>⚠️ Complications</h3>
  <p><b>Septic shock:</b> hypotension + tachycardia (<b>weak, thready, fast pulse</b>), fatigue, respiratory failure (slide note).</p>
  <p><b>Pleural effusion:</b> fluid in pleural space compresses lung → <b>decreased breath sounds, dull percussion, dyspnea</b>. Tx = <b>thoracentesis</b> (sit patient upright, watch for pneumothorax after) or chest tube. Empyema (pus) needs 4–6 weeks antibiotics.</p>
</div>



<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the afebrile older adult</span>New confusion with no fever. "Normal aging," "sundowning," and "anxiety" are all offered and all sound like something a nurse would say. Mental status change <b>is</b> the presentation.</div>
  <div class="trap"><span class="tag">Trap 2 — pain relief withheld</span>A post-op patient who will not cough because of pain, with an option to hold the opioid. Pain is what is <b>causing</b> the atelectasis. Medicate first, then do pulmonary hygiene.</div>
  <div class="trap"><span class="tag">Trap 3 — sputum color as the whole answer</span><b>Rust-colored</b> points to strep pneumoniae, <b>foul-smelling</b> to anaerobes or abscess. He mixes the two.</div>
  <div class="trap"><span class="tag">Trap 4 — which finding to report</span>Yellow sputum and a 100.6 temp are expected in pneumonia. A <b>weak thready pulse with a falling BP</b> is sepsis. Rank by what kills fastest.</div>
</div>
<div id="q-pneumonia"></div>`;
renderFilteredQuiz('q-pneumonia', secQ(EXAM.filter(q=>q.topic==='pneumonia')), 'Pneumonia practice', 'Pneumonia');

document.getElementById('sec-airway').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🩺</span> Airway: ET Tubes & Tracheostomy</h2>
<p class="intro-line">Cuff pressures, positioning, and what to keep at the bedside.</p>

<div class="card">
  <h3>🫁 Endotracheal (ET) Tube</h3>
  <p>Passed through mouth (preferred) or nose into trachea. Used for airway protection, suctioning, and mechanical ventilation.</p>
  <div class="hy">⭐ <b>CUFF PRESSURE = 20–25 mmHg.</b> Too HIGH → tracheal ischemia/necrosis. Too LOW → aspiration risk.</div>
  <p><b>Care:</b> suction PRN, warmed humidified O₂, oral care, semi-Fowler position. Downsides: can't talk, ↓cough reflex, thick secretions.</p>
</div>

<div class="card">
  <h3>🔵 Tracheostomy</h3>
  <p>Surgical airway for long-term ventilation, airway obstruction, or aspiration prevention.</p>
  <div class="grid2">
    <div><b>EARLY complications:</b> bleeding, pneumothorax, tube dislodgement, air embolism, subcutaneous emphysema.</div>
    <div><b>LATE complications:</b> infection, tracheal stenosis, tracheoesophageal fistula, tracheal necrosis.</div>
  </div>
  <div class="hy">⭐ <b>KEEP AT BEDSIDE:</b> obturator, an extra trach (same size), an extra trach (one size smaller), and suction equipment. If the trach comes out: stay with patient, call for help, replace if trained.</div>
</div>



<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the desaturating vent patient</span>"Increase the tube feeding," "lower the head of the bed," and "document and wait" all appear. <b>Assess the patient and the airway</b> first — DOPE: Displacement, Obstruction, Pneumothorax, Equipment.</div>
  <div class="trap"><span class="tag">Trap 2 — suction technique</span>Suction only on <b>withdrawal</b>, 10 to 15 seconds max, hyperoxygenate before and after. Options that suction on insertion or for 30 seconds are the near-misses.</div>
  <div class="trap"><span class="tag">Trap 3 — trach bedside equipment</span>The obturator and a spare tube of the <b>same size and one size smaller</b>. Options listing only one of those are incomplete.</div>
</div>
<div id="q-airway"></div>`;
renderFilteredQuiz('q-airway', secQ(EXAM.filter(q=>q.topic==='airway')), 'Airway practice', 'Airway');

document.getElementById('sec-chesttube').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🧯</span> Chest Tube Management</h2>
<p class="intro-line">Your professor's speaker notes went DEEP here — that means it's coming. This is "easy points" if you know the chambers.</p>

<div class="card" style="border-color:var(--pink)">
  <h3>🫧 The 3 Chambers (the whole game)</h3>
  <table class="lab">
    <tr><th>Chamber</th><th>What it does</th><th>Bubbling rule</th></tr>
    <tr><td><b>1. Drainage/collection</b></td><td>Collects blood & pus</td><td>Measure every few hours, mark the level</td></tr>
    <tr><td><b>2. Water seal</b></td><td>One-way valve (air out, not in)</td><td>🚨 <b>Continuous bubbling = AIR LEAK</b> → notify MD. Intermittent/tidaling = NORMAL.</td></tr>
    <tr><td><b>3. Suction control</b></td><td>Controls suction strength</td><td><b>Continuous gentle bubbling = NORMAL</b> when on wall suction.</td></tr>
  </table>
  <div class="hy">⭐ The #1 tested distinction: <b>Continuous bubbling in the WATER SEAL chamber = leak (BAD, call MD, possible tension pneumothorax).</b> Continuous bubbling in the SUCTION chamber = expected.</div>
</div>

<div class="card">
  <h3>🛏️ Safety Rules (straight from your prof's notes)</h3>
  <ul class="clean">
    <li><b>Keep the drainage system BELOW chest level — NEVER above.</b></li>
    <li>Keep <b>occlusive gauze + tape at the bedside</b> in case the tube comes out.</li>
    <li>If the tube is <b>pulled out of the patient:</b> cover with sterile occlusive (petroleum) gauze taped on <b>3 sides</b> (lets air escape, prevents air entering → avoids tension pneumothorax).</li>
    <li>If the tube <b>disconnects from the system:</b> submerge the end in sterile water (re-establish water seal).</li>
    <li>Do NOT routinely clamp or "milk/strip" the tube (can cause tension pneumothorax).</li>
    <li><b>Tidaling</b> (fluid rises/falls with breathing) in the water seal = normal, good sign.</li>
  </ul>
  <div class="mnem"><div class="tag">🧠 Mnemonic</div><div class="big">"3 sides taped = air out, none in"</div><div class="exp">Taping all 4 sides could trap air → tension pneumothorax.</div></div>
</div>

<div class="card">
  <h3>❓ Why a chest tube + a few finer points</h3>
  <ul class="clean">
    <li><b>Purpose:</b> remove air or fluid/blood from the pleural space (e.g., pneumothorax, hemothorax) so the lung can re-expand and negative pressure is restored.</li>
    <li><b>Normal pleural pressure is negative</b> (subatmospheric); a breach lets in atmospheric pressure and collapses the lung.</li>
    <li>The <b>suction chamber holds water to atmospheric pressure to maintain the seal</b>. When it's connected to <b>wall suction, you get more suction to pull off more fluid/air</b>.</li>
    <li><b>Measure and mark drainage every few hours</b> (note color and amount). Report sudden large or bright-red output.</li>
    <li>Typical suction setting is around <b>−20 cm H₂O</b>.</li>
  </ul>
</div>



<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — which chamber is bubbling</span>The whole question is the <b>chamber</b>. Water-seal bubbling = air leak. Suction-control bubbling on wall suction = normal. He writes both versions.</div>
  <div class="trap"><span class="tag">Trap 2 — the four-sided dressing</span>A dislodged tube gets gauze on <b>three</b> sides so air can escape. Taping all four sides seals the leak in and <b>causes</b> a tension pneumothorax.</div>
  <div class="trap"><span class="tag">Trap 3 — clamping as a reflex</span>"Clamp the tube" appears in almost every chest tube stem. You almost never clamp, because it traps air.</div>
  <div class="trap"><span class="tag">Trap 4 — tidaling read as a problem</span>Tidaling is <b>normal</b>. Absent tidaling means the lung re-expanded or the tube is obstructed.</div>
</div>
<div id="q-chesttube"></div>`;
renderFilteredQuiz('q-chesttube', secQ(EXAM.filter(q=>q.topic==='airway')), 'Chest tube practice', 'Chest Tubes');

document.getElementById('sec-copd').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🌬️</span> COPD & Asthma</h2>
<p class="intro-line">Your professor specifically listed COPD + asthma manifestations + drugs as test points.</p>

<div class="card">
  <h3>🚬 COPD — progressive, IRREVERSIBLE airflow obstruction</h3>
  <p>Includes <b>chronic bronchitis + emphysema</b>. #1 risk factor = <b>cigarette smoking</b>.</p>
  <p><b>Manifestations:</b> chronic cough, sputum, dyspnea, <b>barrel chest</b>, weight loss, hypoxemia, hypercapnia.</p>
  <div class="hy">⭐ <b>O₂ GOAL FOR COPD = 88–92%</b> (NOT 95-100%!). COPD patients are chronic CO₂ retainers — too much O₂ can suppress their drive to breathe.</div>
  <p><b>Diagnostics:</b> spirometry. <b>Complications:</b> respiratory failure, pneumonia, cor pulmonale, pneumothorax.</p>
  <p><b>Interventions:</b> <b>pursed-lip breathing</b>, tripod position, smoking cessation, energy conservation, bronchodilators, inhaled steroids, O₂.</p>
</div>

<div class="card">
  <h3>🐦 Chronic Bronchitis vs Emphysema</h3>
  <table class="lab">
    <tr><th>Chronic Bronchitis</th><th>Emphysema</th></tr>
    <tr><td>"Blue Bloater"</td><td>"Pink Puffer"</td></tr>
    <tr><td>Productive cough, excess mucus</td><td>Dyspnea, alveolar destruction</td></tr>
    <tr><td>Cyanosis common</td><td>Thin, barrel chest</td></tr>
  </table>
  <div class="mnem"><div class="tag">🧠 Mnemonic</div><div class="big">"Blue Bloater Bronchitis • Pink Puffer emPhysema"</div></div>
</div>

<div class="card">
  <h3>💨 Asthma — chronic inflammation with REVERSIBLE obstruction</h3>
  <p><b>Manifestations:</b> wheezing, cough, chest tightness, dyspnea, prolonged expiration.</p>
  <p><b>Triggers:</b> smoke, allergens, exercise, cold air, infection.</p>
  <p><b>Peak flow zones:</b> 🟢 Green = good control • 🟡 Yellow = caution • 🔴 Red = medical alert.</p>
  <div class="hy">🚨 <b>CRITICAL NCLEX SIGN:</b> In a severe asthma attack, if <b>wheezing suddenly DISAPPEARS</b> → that's <b>impending respiratory failure</b> (no air is moving!). Not improvement — emergency!</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🆘 Status Asthmaticus</h3>
  <p>Life-threatening asthma attack not responding to routine therapy.</p>
  <p><b>ABGs:</b> EARLY = respiratory ALKALosis (hyperventilating). LATE = respiratory ACIDosis (tiring out, retaining CO₂) → danger.</p>
  <p><b>Tx:</b> O₂, albuterol, corticosteroids, intubation if needed.</p>
</div>

<div class="card">
  <h3>💊 Respiratory & Asthma Drugs (test point!)</h3>
  <table class="lab">
    <tr><th>Drug class</th><th>Use</th><th>Examples</th></tr>
    <tr><td><b>SABA</b> (quick relief)</td><td>Acute attack — RESCUE</td><td>Albuterol</td></tr>
    <tr><td><b>LABA</b> (long-acting)</td><td>Maintenance (never alone)</td><td>Salmeterol</td></tr>
    <tr><td><b>Inhaled corticosteroids</b></td><td>Long-term control (rinse mouth!)</td><td>Fluticasone, budesonide</td></tr>
    <tr><td><b>Leukotriene modifiers</b></td><td>Long-term control</td><td>Montelukast</td></tr>
    <tr><td><b>Anticholinergic</b></td><td>COPD bronchodilation</td><td>Ipratropium</td></tr>
  </table>
  <div class="hy">⭐ Inhaler order: <b>bronchodilator FIRST, wait, then steroid.</b> Always <b>rinse mouth after inhaled steroids</b> (prevents oral thrush). Albuterol = rescue; if used &gt;2x/week, asthma is poorly controlled.</div>
</div>



<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the silent chest</span>"Improvement," "the medication worked," and "needs less oxygen" all get offered. A silent chest is <b>impending respiratory failure</b>: too little air moving to make a sound.</div>
  <div class="trap"><span class="tag">Trap 2 — asthma versus emphysema</span>Asthma is <b>reversible</b> inflammation and bronchoconstriction. Emphysema is <b>irreversible</b> alveolar destruction. That one word separates them.</div>
  <div class="trap"><span class="tag">Trap 3 — inhaler order</span>Bronchodilator <b>first</b>, then the corticosteroid, then rinse. Reversed order is the most common distractor.</div>
  <div class="trap"><span class="tag">Trap 4 — oxygen misread as withholding</span>The 88 to 92% target is about <b>controlled delivery</b>, not rationing. Any option that withholds oxygen from a patient in true distress is wrong.</div>
</div>
<div id="q-copd"></div>`;
renderFilteredQuiz('q-copd', secQ(EXAM.filter(q=>q.topic==='copd')), 'COPD and asthma practice', 'COPD/Asthma');

document.getElementById('sec-tb').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🔬</span> Tuberculosis (TB)</h2>
<p class="intro-line">Test & treatment specifically flagged by your professor.</p>

<div class="card">
  <h3>🦠 The Basics</h3>
  <p>Organism = <b>Mycobacterium tuberculosis</b>. Transmission = <b>AIRBORNE droplets</b>.</p>
  <p><b>Symptoms:</b> chronic cough, <b>night sweats</b>, <b>weight loss</b>, fatigue, low-grade fever, <b>hemoptysis</b>.</p>
  <div class="hy">⭐ <b>Isolation = AIRBORNE.</b> Negative-pressure room + <b>N95 mask</b> for staff. Patient wears a surgical mask if transported.</div>
</div>

<div class="card">
  <h3>🧪 Testing & Diagnosis</h3>
  <ul class="clean">
    <li><b>Mantoux (PPD) skin test:</b> read in <b>48–72 hours</b>. Measure <b>induration</b> (raised area), not redness.</li>
    <li><b>IGRA blood tests:</b> QuantiFERON Gold, T-SPOT.</li>
    <li><b>Confirmatory test = sputum culture</b> (acid-fast bacilli).</li>
  </ul>
  <div class="hy">⭐ A positive skin test = <b>exposure</b>, not active disease. Confirm active TB with sputum culture + chest x-ray.</div>
</div>

<div class="card">
  <h3>💊 Treatment — RIPE Therapy</h3>
  <table class="lab">
    <tr><th>Drug</th><th>Watch for</th></tr>
    <tr><td><b>R</b>ifampin</td><td>Orange/red body fluids (harmless), ↑ liver enzymes</td></tr>
    <tr><td><b>I</b>soniazid (INH)</td><td>Hepatotoxicity, peripheral neuropathy (give B6/pyridoxine)</td></tr>
    <tr><td><b>P</b>yrazinamide</td><td>Hepatotoxicity, ↑ uric acid (gout)</td></tr>
    <tr><td><b>E</b>thambutol</td><td>Optic neuritis (vision changes — report!)</td></tr>
  </table>
  <div class="hy">⭐ Treatment lasts <b>6–12 months</b> — adherence is everything. Patient is <b>no longer infectious after 3 consecutive negative sputum cultures.</b> Watch all RIPE drugs for liver toxicity.</div>
  <div class="mnem"><div class="tag">🧠 Mnemonic</div><div class="big">RIPE = the 4 TB drugs • "Rifampin turns pee oRange"</div></div>
</div>



<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — droplet versus airborne</span>TB is <b>airborne</b>: negative pressure and an N95. Bacterial pneumonia is <b>droplet</b>. The EXCEPT version of this question shows up constantly.</div>
  <div class="trap"><span class="tag">Trap 2 — orange urine as a problem</span>Rifampin turning fluids orange is <b>expected and harmless</b>. "Stop the medication" and "this indicates kidney failure" are the traps.</div>
  <div class="trap"><span class="tag">Trap 3 — reading the Mantoux</span>Measure <b>induration</b>, not redness, at 48 to 72 hours. And a positive test means <b>exposure</b>, not active disease.</div>
  <div class="trap"><span class="tag">Trap 4 — stopping treatment early</span>Any patient statement about stopping when symptoms improve is wrong. The full <b>6 to 12 months</b> prevents drug-resistant TB.</div>
</div>
<div class="card">
  <h3>Pleurisy (pleuritis)</h3>
  <ul class="clean">
    <li><b>Inflammation of the pleura</b> — visceral covers the lungs, parietal lines the chest wall.</li>
    <li><b>Hallmark:</b> sharp, <b>knife-like pain worse with inspiration, coughing, or movement</b>, relieved by holding the breath or splinting.</li>
    <li><b>Pleural friction rub</b> — a grating sound on auscultation.</li>
    <li><b>Treatment:</b> treat the cause, analgesics and NSAIDs, <b>splint the chest with a pillow when coughing</b>, lie on the affected side to limit motion.</li>
    <li>The pain <b>disappears if an effusion develops</b> because fluid separates the inflamed surfaces — so pain relief is not always improvement.</li>
  </ul>
</div>

<div class="card">
  <h3>Sarcoidosis</h3>
  <ul class="clean">
    <li><b>Pathophysiology:</b> a <b>hypersensitivity response to exogenous agents</b> — bacteria, fungi, viruses, chemicals. Forms <b>noncaseating granulomas</b> that may cause <b>fibrosis and reduced lung volumes</b>.</li>
    <li><b>Manifestations:</b> <b>insidious onset with a lack of prominent symptoms.</b> Dyspnea, cough, hemoptysis, congestion. Also <b>uveitis, joint pain, fever</b>. Multisystem: fatigue, fever, anorexia, weight loss.</li>
    <li><b>Diagnosis:</b> chest x-ray and CT show <b>hilar adenopathy</b> with miliary or nodular lesions. <b>Confirmed by biopsy showing noncaseating granulomas.</b> PFTs show restriction; ABG may show hypoxemia and hypercapnia.</li>
    <li><b>Management:</b> <b>many achieve remission without treatment.</b> <b>Prednisone</b> for symptom relief, tapered over about <b>12 months</b>. Immune modulators (methotrexate, azathioprine) if the response is inadequate.</li>
  </ul>
  <div class="trap"><span class="tag">The word that matters</span><b>NONcaseating</b> granulomas are sarcoidosis. <b>Caseating</b> granulomas are <b>tuberculosis</b>. One word separates the two, and he can build a whole question on it.</div>
</div>

<div class="card">
  <h3>Bronchiectasis</h3>
  <ul class="clean">
    <li><b>Chronic, irreversible dilation of the bronchi</b> from repeated infection and inflammation destroying the airway wall.</li>
    <li><b>Hallmark:</b> chronic cough with <b>copious purulent sputum</b>, plus hemoptysis and clubbing.</li>
    <li><b>Diagnosis:</b> <b>high-resolution CT</b> is the study of choice.</li>
    <li><b>Management:</b> <b>postural drainage and chest physiotherapy</b>, bronchodilators, antibiotics for exacerbations, hydration to thin secretions, vaccination, smoking cessation.</li>
    <li>Because it is <b>irreversible</b>, the goal is secretion clearance and infection prevention, not cure.</li>
  </ul>
  <div class="hy"><span class="tag">Distinguish it</span><b>Bronchiectasis</b> = irreversible airway dilation with copious purulent sputum. <b>Chronic bronchitis</b> = productive cough <b>3 months in each of 2 consecutive years</b>. Both produce sputum; the structural damage is what differs.</div>
</div>

<div id="q-tb"></div>`;

<h2 class="sec-title"><span class="sec-emoji">🩸</span> Blood Transfusion & IV Therapy</h2>
<p class="intro-line">"What to do BEFORE a blood transfusion" is a named test key point. Free points if you know the steps.</p>

<div class="card" style="border-color:var(--red)">
  <h3>✅ BEFORE you hang blood</h3>
  <ul class="clean">
    <li><b>Informed consent</b> signed.</li>
    <li><b>Type & cross-match</b> completed.</li>
    <li>A <b>working, large-bore IV</b> (18–20 gauge).</li>
    <li>Baseline <b>vital signs</b>.</li>
    <li><b>Two-nurse verification</b> of patient ID + blood product.</li>
    <li>Prime the line with <b>0.9% Normal Saline ONLY</b> (never LR or dextrose).</li>
  </ul>
</div>

<div class="card">
  <h3>🩸 Getting & starting the blood (exact sequence)</h3>
  <ul class="clean">
    <li><b>Spike the bag with Normal Saline FIRST, flush the IV, THEN get the blood</b> from the blood bank.</li>
    <li><b>⏰ You have only 30 MINUTES from the time you pick up blood from the blood bank to START the infusion.</b> If you can't start in time, return it — don't let it sit warming at the bedside.</li>
    <li>Start <b>slowly</b> for the first 15 minutes.</li>
  </ul>
  <div class="hy">⭐ <b>Two key clocks, don't mix them up:</b> <b>30 minutes</b> = max time from blood-bank pickup to START the infusion. <b>4 hours</b> = max time to FINISH infusing one unit (bacterial growth risk after that).</div>
</div>

<div class="card">
  <h3>⏱️ DURING the transfusion</h3>
  <ul class="clean">
    <li><b>Stay with the patient for the first 15 minutes</b> — most reactions happen early. Run slowly at first.</li>
    <li>After the first 15 min, <b>monitor frequently (every 30 min to 1 hour)</b> until complete, taking vital signs.</li>
    <li>Each unit must <b>finish within 4 hours</b> (infection risk after that).</li>
    <li>Monitor for reaction: fever, chills, back/flank pain, hypotension, dyspnea, itching/hives, confusion, dizziness, dark urine.</li>
    <li>Also watch for <b>fluid overload</b>: swelling, weight gain, shortness of breath (especially heart/kidney patients).</li>
  </ul>
  <div class="mnem"><div class="tag">🧠 Mnemonic</div><div class="big">"Consent • Cross-match • Catheter • Check vitals • Companion (stay 15 min)"</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🚨 Reaction: mild vs. severe</h3>
  <ul class="clean">
    <li><b>Severe (hemolytic/anaphylactic):</b> chills, fever, back pain, hypotension, dyspnea, dark urine → <b>STOP the blood, clamp the line, open the Normal Saline, notify provider, stay with the patient.</b></li>
    <li><b>Mild (urticaria/hives only):</b> may be treated with <b>antihistamines</b> per provider order; sometimes resumed slowly. Follow facility policy.</li>
  </ul>
  <div class="hy">⭐ The FIRST action for any suspected reaction is always to <b>STOP the blood</b> while keeping IV access open with NS.</div>
</div>

<div class="card">
  <h3>💉 IV Therapy & Access</h3>
  <ul class="clean">
    <li><b>Aseptic technique</b> for IV insertion, central lines, and dressing changes. Wear gloves; clean injection ports before use.</li>
    <li><b>Irritating/vesicant meds</b> (iron, potassium, chemo, TPN, vasopressors) → central line preferred; always check the site for problems.</li>
    <li><b>Peripheral IV</b> = short-term. Assess for redness, swelling, infiltration, phlebitis.</li>
    <li><b>Central lines</b> (PICC, tunneled, port) = long-term, TPN, vesicants. Complication = <b>CLABSI</b> (prevent with sterile technique + chlorhexidine prep).</li>
    <li><b>Dressing changes:</b> weekly, or sooner if soiled/loose/peeling.</li>
    <li><b>NEVER IV push potassium.</b></li>
  </ul>
  <div class="hy">⭐ <b>Infiltration vs. Extravasation:</b> <b>Infiltration</b> = a <b>non-vesicant</b> fluid/med leaks into surrounding tissue. <b>Extravasation</b> = a <b>vesicant</b> (tissue-damaging) med leaks into tissue (e.g., chemo, potassium). Both need <b>frequent site checks</b> — stop the infusion immediately if suspected.</div>
</div>



<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the reaction sequence</span>"Give acetaminophen," "slow the rate," and "notify the provider" all appear and are all things that eventually happen. <b>Stop the blood first</b>, keep NS running through new tubing.</div>
  <div class="trap"><span class="tag">Trap 2 — the wrong companion fluid</span>Only <b>0.9% normal saline</b>. Dextrose lyses cells, LR's calcium promotes clotting. Both are offered.</div>
  <div class="trap"><span class="tag">Trap 3 — storing the blood</span>Never in a unit refrigerator, never at the bedside waiting. If it cannot start within <b>30 minutes</b>, it goes back to the bank.</div>
  <div class="trap"><span class="tag">Trap 4 — TACO versus TRALI</span>Both cause dyspnea during transfusion. <b>TACO</b> adds JVD and hypertension (overload). <b>TRALI</b> comes with hypotension and no overload signs.</div>
</div>
<div id="q-blood"></div>`;

const ROUND_SIZE=6;

(function restoreMatchProgress(){ try{ const r=localStorage.getItem('nur256u2_matchprogress'); if(r) matchProgress=JSON.parse(r); }catch(e){ matchProgress={}; } })();
function saveMatchProgress(){ try{ localStorage.setItem('nur256u2_matchprogress', JSON.stringify(matchProgress)); }catch(e){} }
function buildCycleOrder(pairs){
  const hasTiers = pairs.some(p=>typeof p.tier==='number');
  if(!hasTiers) return shuffle(pairs.map((_,i)=>i));
  const tiers=[...new Set(pairs.map(p=>p.tier))].sort((a,b)=>a-b);
  let order=[];
  tiers.forEach(t=>{
    const idxs=pairs.map((p,i)=>({p,i})).filter(x=>x.p.tier===t).map(x=>x.i);
    order=order.concat(shuffle(idxs));
  });
  return order;
}
function difficultyLabel(gameId, roundIdx){
  const pairs=MATCH_GAMES[gameId].pairs;
  if(!pairs.some(p=>typeof p.tier==='number')) return '';
  const roundsPerTier = Math.ceil(pairs.length/ROUND_SIZE/3) || 1;
  const tierIdx = Math.min(2, Math.floor(roundIdx/roundsPerTier));
  return ['🟢 Easier','🟡 Medium','🔴 Hardest'][tierIdx];
}

let drillList=[], drillIdx=0, drillScore=0, drillStreak=0, drillBest=0, drillAnswered=false;
const DRILL_ROUND=20;
function startDrill(){
  const pool = hotOnlyGlobal ? DRILL_POOL.filter(q=>['lytes','abg','upper','copd','chesttube'].includes(q.topic)) : DRILL_POOL;
  drillList=shuffle(pool.slice()).slice(0,Math.min(DRILL_ROUND,pool.length));
  drillIdx=0; drillScore=0; drillStreak=0; drillAnswered=false;
  renderDrillQ();
}
function renderDrillQ(){
  const host=document.getElementById('drillBody');
  if(drillIdx>=drillList.length){ return drillFinish(); }
  const qRaw=drillList[drillIdx];
  let q=qRaw;
  if(shuffleAnswers){
    const order=shuffle(qRaw.o.map((_,i)=>i));
    q={...qRaw, o:order.map(i=>qRaw.o[i]), c:order.indexOf(qRaw.c)};
  }
  drillList[drillIdx]=q;
  drillAnswered=false;
  let opts=q.o.map((o,i)=>`<button class="opt" onclick="answerDrill(${i})">${o}</button>`).join('');
  host.innerHTML=`
    <div class="drill-top"><span>Q ${drillIdx+1} / ${drillList.length}</span><span>✅ ${drillScore} 🔥 ${drillStreak}</span></div>
    <div class="drill-bar"><div class="drill-bar-fill" style="width:${(drillIdx/drillList.length)*100}%"></div></div>
    <div class="quiz-card"><div class="q-text">${q.q}</div><div class="opts" id="drillOpts">${opts}</div><div class="rationale" id="drillRat"></div></div>
    <div class="center"><button class="btn ghost" id="drillNextBtn" style="display:none" onclick="nextDrill()">Next ➡️</button></div>`;
}
function answerDrill(i){
  if(drillAnswered)return; drillAnswered=true;
  const q=drillList[drillIdx];
  document.querySelectorAll('#drillOpts .opt').forEach((b,idx)=>{
    b.classList.add('disabled');
    if(idx===q.c)b.classList.add('correct');
    if(idx===i&&i!==q.c)b.classList.add('wrong');
  });
  const rat=document.getElementById('drillRat');
  if(i===q.c){drillScore++;drillStreak++;if(drillStreak>drillBest)drillBest=drillStreak;rat.innerHTML='✅ <b>Correct!</b> '+q.r;}
  else{drillStreak=0;rat.innerHTML='❌ <b>Not quite.</b> '+q.r;}
  rat.classList.add('show'); bumpProgress('drill-'+drillIdx);
  document.getElementById('drillNextBtn').style.display='inline-block';
}
function nextDrill(){ drillIdx++; renderDrillQ(); }
function drillFinish(){
  const pct=Math.round(drillScore/drillList.length*100);
  let msg=pct>=90?'🌟 Outstanding!':pct>=75?'💪 Test-ready zone!':pct>=60?'📈 Getting there — run it again.':'🌱 Keep drilling.';
  document.getElementById('drillBody').innerHTML=`
    <div class="card center" style="border-color:var(--teal)">
      <h2 style="margin-top:0">Round Complete!</h2>
      <div class="drill-final">${drillScore} / ${drillList.length} (${pct}%)</div>
      <p>Best streak: 🔥 ${drillBest}</p><p>${msg}</p>
      <button class="btn" onclick="startDrill()" style="background:linear-gradient(90deg,var(--teal),var(--green))">🔀 New Shuffled Round</button>
    </div>`;
}
document.getElementById('sec-drill').innerHTML=`

  <div id="drillBody"></div>`;

    const defs=defOrder.map(i=>base.items[i].def);
    return {q:base.q, r:base.r, t:'match', items:base.items, defs, defOrder};
  }
  if(base.t==='order'){
    if(!examShuffleMap[qi]){
      const order=shuffleAnswers?shuffle(base.steps.map((_,i)=>i)):base.steps.map((_,i)=>i);
      examShuffleMap[qi]=order;
    }
    const order=examShuffleMap[qi];
    const steps=order.map(i=>base.steps[i]);
    return {q:base.q, r:base.r, t:'order', steps, displayOrder:order};
  }
  if(!examShuffleMap[qi]){
    const order=shuffleAnswers?shuffle(base.o.map((_,i)=>i)):base.o.map((_,i)=>i);
    examShuffleMap[qi]=order;
  }
  const order=examShuffleMap[qi];
  const opts=relabel(order.map(i=>base.o[i]));

    const cset=new Set(base.c);
    correct=order.map((origIdx,newIdx)=>cset.has(origIdx)?newIdx:null).filter(x=>x!==null);

    correct=order.indexOf(base.c);
  }

<script>
/* ===== LISTEN MODE — hands-free audio study ===== */
(function(){
if(!('speechSynthesis' in window)) return;

let lsQueue=[], lsIdx=0, lsPlaying=false, lsRate=1, lsVoice=null, lsWake=null, lsUtter=null, lsAuto=true;
try{ lsRate=parseFloat(localStorage.getItem('listen_rate')||'1')||1; }catch(e){}
try{ lsAuto=localStorage.getItem('listen_auto')!=='0'; }catch(e){}

/* ---- turn a card into speakable prose ---- */
function speakable(el){
  const parts=[];
  const walk=(node)=>{
    if(node.nodeType===3){ const t=node.textContent.replace(/\s+/g,' '); if(t.trim()) parts.push(t); return; }
    if(node.nodeType!==1) return;
    const tag=node.tagName;
    if(tag==='BUTTON'||tag==='INPUT'||tag==='TEXTAREA'||tag==='SCRIPT'||tag==='STYLE') return;
    if(node.classList && node.classList.contains('listen-skip')) return;
    if(tag==='TABLE'){
      const rows=[...node.querySelectorAll('tr')];
      let heads=[];
      rows.forEach((r,ri)=>{
        const th=[...r.querySelectorAll('th')];
        if(th.length){ heads=th.map(c=>clean(c.textContent)); return; }
        const tds=[...r.querySelectorAll('td')].map(c=>clean(c.textContent));
        if(!tds.length) return;
        if(tds.length===1){ parts.push(tds[0]+'. '); return; }
        if(heads.length>=2 && tds.length===heads.length){
          parts.push(tds[0]+'. ');
          for(let i=1;i<tds.length;i++) if(tds[i]) parts.push(heads[i]+': '+tds[i]+'. ');
        } else {
          parts.push(tds[0]+'. ');
          for(let i=1;i<tds.length;i++) if(tds[i]) parts.push(tds[i]+'. ');
        }
      });
      parts.push(' ');
      return;
    }
    if(tag==='LI'){ [...node.childNodes].forEach(walk); parts.push('. '); return; }
    if(tag==='H2'||tag==='H3'||tag==='H4'||tag==='P'||tag==='DIV'){
      [...node.childNodes].forEach(walk); parts.push('. '); return;
    }
    [...node.childNodes].forEach(walk);
  };
  walk(el);
  return clean(parts.join(' '));
}
function clean(s){
  return s
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}]/gu,' ')
    .replace(/\u2192/g,' leads to ')
    .replace(/\u2191/g,' increased ').replace(/\u2193/g,' decreased ')
    .replace(/\u2265/g,' greater than or equal to ').replace(/\u2264/g,' less than or equal to ')
    .replace(/&gt;|>/g,' greater than ').replace(/&lt;|</g,' less than ')
    .replace(/\u00b7/g,'. ').replace(/\u2014|\u2013/g,', ')
    .replace(/(\s*\.){2,}/g,'.').replace(/\(\s+/g,'(').replace(/\s+\)/g,')')
    .replace(/\s+/g,' ')
    .replace(/\s+([.,;:])/g,'$1')
    .trim();
}

/* ---- build the playlist from the visible section ---- */
function buildQueue(){
  const sec=document.querySelector('.section.active') || document.querySelector('[id^="sec-"]:not([style*="none"])');
  if(!sec) return [];
  const out=[];
  const title=sec.querySelector('.sec-title');
  const intro=sec.querySelector('.intro-line');
  let opener='';
  if(title) opener+=clean(title.textContent)+'. ';
  if(intro) opener+=clean(intro.textContent);
  if(opener.trim()) out.push({el:title||sec, text:opener, label:'Introduction'});
  sec.querySelectorAll(':scope > .card, :scope > .tipbar, :scope > .hy, :scope > .mnem').forEach(c=>{
    const t=speakable(c);
    if(t && t.length>25){
      const h=c.querySelector('h3');
      out.push({el:c, text:t, label:h?clean(h.textContent).slice(0,44):'Note'});
    }
  });
  return out;
}

/* ---- speech ---- */
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  if(!vs.length) return null;
  let saved=null; try{ saved=localStorage.getItem('listen_voice'); }catch(e){}
  return vs.find(v=>v.name===saved)
      || vs.find(v=>/Samantha|Karen|Moira|Google US English|Microsoft Aria/i.test(v.name))
      || vs.find(v=>v.localService) || vs[0];
}
function chunk(text){
  const out=[]; let buf='';
  text.split(/(?<=[.!?])\s+/).forEach(s=>{
    if((buf+' '+s).length>190){ if(buf) out.push(buf.trim()); buf=s; } else buf+=' '+s;
  });
  if(buf.trim()) out.push(buf.trim());
  return out.length?out:[text];
}
function speakItem(i){
  speechSynthesis.cancel();
  if(i<0||i>=lsQueue.length){ stop(); return; }
  lsIdx=i;
  highlight();
  renderBar();
  const pieces=chunk(lsQueue[i].text);
  let p=0;
  const next=()=>{
    if(!lsPlaying) return;
    if(p>=pieces.length){
      if(lsAuto && lsIdx+1<lsQueue.length) return speakItem(lsIdx+1);
      stop(true); return;
    }
    const u=new SpeechSynthesisUtterance(pieces[p++]);
    try{ u.rate=lsRate; }catch(e){}
    try{ if(lsVoice) u.voice=lsVoice; }catch(e){ lsVoice=null; }
    u.onend=next;
    u.onerror=()=>{ if(lsPlaying) next(); };
    lsUtter=u;
    try{ speechSynthesis.speak(u); }catch(e){ next(); }
  };
  next();
}
function highlight(){
  document.querySelectorAll('.listen-now').forEach(e=>e.classList.remove('listen-now'));
  const el=lsQueue[lsIdx] && lsQueue[lsIdx].el;
  if(el){ el.classList.add('listen-now'); el.scrollIntoView({behavior:'smooth',block:'center'}); }
}
async function wakeOn(){
  try{ if('wakeLock' in navigator && !lsWake) lsWake=await navigator.wakeLock.request('screen'); }catch(e){}
}
function wakeOff(){ try{ if(lsWake){ lsWake.release(); lsWake=null; } }catch(e){} }

function start(){
  lsQueue=buildQueue();
  if(!lsQueue.length){ if(typeof toast==='function') toast('Nothing to read in this section'); return; }
  lsVoice=pickVoice();
  lsPlaying=true; wakeOn(); openBar(); speakItem(0);
}
function stop(finished){
  lsPlaying=false; speechSynthesis.cancel(); wakeOff();
  document.querySelectorAll('.listen-now').forEach(e=>e.classList.remove('listen-now'));
  if(finished && typeof toast==='function') toast('Section finished');
  renderBar();
}
function toggle(){
  if(!lsPlaying){
    if(!lsQueue.length) return start();
    lsPlaying=true; wakeOn(); speakItem(lsIdx);
  } else stop();
}
function jump(d){
  const n=lsIdx+d;
  if(n<0||n>=lsQueue.length) return;
  if(!lsPlaying){ lsPlaying=true; wakeOn(); }
  speakItem(n);
}
function setRate(r){
  lsRate=r; try{ localStorage.setItem('listen_rate',String(r)); }catch(e){}
  if(lsPlaying) speakItem(lsIdx); else renderBar();
}
function toggleAuto(){
  lsAuto=!lsAuto; try{ localStorage.setItem('listen_auto', lsAuto?'1':'0'); }catch(e){}
  renderBar();
}

/* ---- UI ---- */
function openBar(){
  if(document.getElementById('listenBar')) return renderBar();
  const bar=document.createElement('div');
  bar.id='listenBar';
  document.body.appendChild(bar);
  renderBar();
}
function closeBar(){ stop(); const b=document.getElementById('listenBar'); if(b) b.remove(); lsQueue=[]; lsIdx=0; }
function renderBar(){
  const bar=document.getElementById('listenBar'); if(!bar) return;
  const cur=lsQueue[lsIdx];
  bar.innerHTML=
    '<div class="lb-top"><span class="lb-lab">'+(cur?('<b>'+(lsIdx+1)+' of '+lsQueue.length+'</b> \u00b7 '+cur.label):'Ready')+'</span>'
    +'<button class="lb-x" onclick="listenClose()" aria-label="Close listen mode">\u2715</button></div>'
    +'<div class="lb-row">'
    +'<button class="lb-btn" onclick="listenJump(-1)" aria-label="Previous">\u23ee</button>'
    +'<button class="lb-btn lb-main" onclick="listenToggle()" aria-label="Play or pause">'+(lsPlaying?'\u23f8':'\u25b6')+'</button>'
    +'<button class="lb-btn" onclick="listenJump(1)" aria-label="Next">\u23ed</button>'
    +'<span class="lb-sp">'
      +[0.8,1,1.25,1.5].map(r=>'<button class="lb-rate'+(Math.abs(lsRate-r)<0.01?' on':'')+'" onclick="listenRate('+r+')">'+r+'\u00d7</button>').join('')
    +'</span>'
    +'<button class="lb-rate'+(lsAuto?' on':'')+'" onclick="listenAuto()" title="Continue to the next card automatically">Auto</button>'
    +'</div>';
}
window.listenStart=start; window.listenToggle=toggle; window.listenJump=jump;
window.listenRate=setRate; window.listenClose=closeBar; window.listenAuto=toggleAuto;

if(speechSynthesis.onvoiceschanged!==undefined)
  speechSynthesis.onvoiceschanged=()=>{ lsVoice=pickVoice(); };

/* stop cleanly when the section changes */
const origShow=window.showSection;
if(typeof origShow==='function'){
  window.showSection=function(id){ if(lsPlaying) stop(); origShow(id); };
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden && lsPlaying) speechSynthesis.pause(); else if(!document.hidden && lsPlaying) speechSynthesis.resume(); });
})();

</script>
