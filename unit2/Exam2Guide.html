  <p><b>Tx:</b> mechanical ventilation with <b>PEEP</b> (keeps alveoli open), treat underlying cause. <b>Prone positioning ~every 12 hours</b> improves oxygenation (esp. COVID-19). Nutritional support <b>35–45 kcal/kg/day</b> (enteral preferred). BNP helps rule out a cardiac cause. Mortality 27–50%.</p>
  <p><b>Why it happens:</b> inflammation opens capillaries → fluid + WBCs flood lung tissue; <b>surfactant (which normally keeps alveoli open) is washed out</b> → alveolar collapse + severe shunting.</p>
  <div class="mnem"><div class="tag">🧠 Tell ARDS apart</div><div class="big">"O₂ won't fix it + both lungs white = ARDS"</div></div>
</div>



<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — ARDS defined by the wrong feature</span>The hallmark is <b>refractory hypoxemia</b> — it does not improve with oxygen. "Hypoxemia that improves with oxygen" is offered as the near-miss.</div>
  <div class="trap"><span class="tag">Trap 2 — the direction of tracheal deviation</span>In a <b>tension</b> pneumothorax the trachea deviates <b>AWAY</b> from the affected side. Both directions appear as options.</div>
  <div class="trap"><span class="tag">Trap 3 — first action versus first finding</span>Suspected PE: "obtain a CT" and "assess the calf" are both correct eventually. The <b>first action</b> is the independent one you can do now — raise the head of the bed and oxygenate.</div>
  <div class="trap"><span class="tag">Trap 4 — post-op fever timing</span>Fever in the first 24 to 48 hours is <b>atelectasis</b>. Infection fevers arrive after day 3.</div>
</div>
<div id="q-acute"></div>`;
renderFilteredQuiz('q-acute', secQ(EXAM.filter(q=>q.topic==='resp')), 'Acute respiratory practice', 'Acute Respiratory');

document.getElementById('sec-pneumonia').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🦠</span> Pneumonia</h2>
<p class="intro-line">Your professor flagged "pneumonia assessment findings" as a guaranteed test point. Plus the VAP bundle.</p>

<div class="card">
  <h3>📚 The 4 Types (the 48-hour rule)</h3>
  <table class="lab">
    <tr><th>Type</th><th>Definition</th></tr>
    <tr><td><b>CAP</b> (community)</td><td>In community OR within first 48h of admission</td></tr>
    <tr><td><b>HCAP</b> (healthcare)</td><td>Recent healthcare contact — often MDROs</td></tr>
    <tr><td><b>HAP</b> (hospital)</td><td>≥48h AFTER admission (not incubating at admit)</td></tr>
    <tr><td><b>VAP</b> (ventilator)</td><td>≥48h after intubation/mechanical ventilation</td></tr>
  </table>
  <div class="hy">⭐ Most common bacterial cause of CAP = <b>Streptococcus pneumoniae</b>. HAP/VAP often = multidrug-resistant (MDROs): Pseudomonas, MRSA, Klebsiella.</div>
</div>

<div class="card">
  <h3>🔎 Assessment Findings (HIGH YIELD)</h3>
  <ul class="clean">
    <li>Fever, chills, night sweats</li>
    <li><b>Pleuritic chest pain</b></li>
    <li><b>Productive cough</b> (purulent sputum)</li>
    <li><b>Crackles</b> (air moving over wet areas)</li>
    <li>Dyspnea, tachypnea, tachycardia</li>
    <li><b>Dullness on percussion</b> + ↑ tactile fremitus (consolidation)</li>
    <li>In <b>elderly</b>: may be atypical — confusion, weakness, ↓appetite (watch mental status!)</li>
  </ul>
  <div class="prof"><span class="tag">📌 Sputum colors (know these!)</span>Rusty/blood-tinged = pneumococcal • purulent (yellow/green) = bacterial • thin/mucoid = viral • frothy pink = pulmonary edema • foul-smelling = lung abscess/anaerobic.</div>
</div>

<div class="card">
  <h3>🩺 Diagnosis & Treatment</h3>
  <p><b>Diagnosis:</b> chest x-ray, sputum culture, blood cultures, CBC, physical exam, bronchoscopy (severe).</p>
  <p><b>Treatment:</b> antibiotics (pathogen-specific; viral = supportive only), <b>hydration 2–3 L/day</b>, O₂, pulmonary toilet/CPT, incentive spirometry, rest, nutrition (small frequent meals), vaccines (pneumococcal, COVID, RSV, flu).</p>
  <div class="prof"><span class="tag">📌 Slide note</span><b>CPT = "gorilla pat the patient's chest"</b> (chest physiotherapy loosens secretions). Patients respond to antibiotics in <b>24–48 hours</b>.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🛡️ The VAP Bundle (your prof said KNOW THIS)</h3>
  <p>How to prevent Ventilator-Associated Pneumonia:</p>
  <ul class="clean">
    <li><b>H</b>ead of bed elevated 30–45°</li>
    <li><b>O</b>ral care with chlorhexidine (q4h)</li>
    <li><b>B</b> — sedation vacations (daily wean readiness)</li>
    <li>Peptic ulcer (stress ulcer) prophylaxis</li>
    <li>DVT prophylaxis</li>
  </ul>
  <div class="mnem"><div class="tag">🧠 Mnemonic</div><div class="big">"Heads up, Clean mouth, Wake up, Protect gut & legs"</div></div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>🫗 Aspiration Pneumonia</h3>
  <p>Inhaling foreign material (gastric contents, food). Gastric acid damages cilia → impaired clearance → inflammation → hypoxemia.</p>
  <div class="hy">⭐ <b>MORE COMMON IN THE RIGHT LUNG</b> — the right mainstem bronchus is straighter & wider (slide note!).</div>
  <p><b>Risk factors:</b> stroke, dysphagia, ↓LOC, sedation, CNS depressants (alcohol, drugs), NG tube / ET tube (epiglottis can't fully close), tube feeding.</p>
  <p><b>Prevention:</b> HOB 30–45°, swallow eval, upright for meals, verify feeding tube placement, minimize sedation.</p>
</div>

<div class="card">
  <h3>⚠️ Complications</h3>
  <p><b>Septic shock:</b> hypotension + tachycardia (<b>weak, thready, fast pulse</b>), fatigue, respiratory failure (slide note).</p>
  <p><b>Pleural effusion:</b> fluid in pleural space compresses lung → <b>decreased breath sounds, dull percussion, dyspnea</b>. Tx = <b>thoracentesis</b> (sit patient upright, watch for pneumothorax after) or chest tube. Empyema (pus) needs 4–6 weeks antibiotics.</p>
</div>



<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the afebrile older adult</span>New confusion with no fever. "Normal aging," "sundowning," and "anxiety" are all offered and all sound like something a nurse would say. Mental status change <b>is</b> the presentation.</div>
  <div class="trap"><span class="tag">Trap 2 — pain relief withheld</span>A post-op patient who will not cough because of pain, with an option to hold the opioid. Pain is what is <b>causing</b> the atelectasis. Medicate first, then do pulmonary hygiene.</div>
  <div class="trap"><span class="tag">Trap 3 — sputum color as the whole answer</span><b>Rust-colored</b> points to strep pneumoniae, <b>foul-smelling</b> to anaerobes or abscess. He mixes the two.</div>
  <div class="trap"><span class="tag">Trap 4 — which finding to report</span>Yellow sputum and a 100.6 temp are expected in pneumonia. A <b>weak thready pulse with a falling BP</b> is sepsis. Rank by what kills fastest.</div>
</div>
<div id="q-pneumonia"></div>`;
renderFilteredQuiz('q-pneumonia', secQ(EXAM.filter(q=>q.topic==='pneumonia')), 'Pneumonia practice', 'Pneumonia');

<h2 class="sec-title"><span class="sec-emoji">🩺</span> Airway: ET Tubes & Tracheostomy</h2>

<div class="card">

  </div>

</div>



<div class="card" style="border-color:var(--red)">

document.getElementById('sec-chesttube').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🧯</span> Chest Tube Management</h2>
<p class="intro-line">Your professor's speaker notes went DEEP here — that means it's coming. This is "easy points" if you know the chambers.</p>

<div class="card" style="border-color:var(--pink)">
  <h3>🫧 The 3 Chambers (the whole game)</h3>
  <table class="lab">
    <tr><th>Chamber</th><th>What it does</th><th>Bubbling rule</th></tr>
    <tr><td><b>1. Drainage/collection</b></td><td>Collects blood & pus</td><td>Measure every few hours, mark the level</td></tr>
    <tr><td><b>2. Water seal</b></td><td>One-way valve (air out, not in)</td><td>🚨 <b>Continuous bubbling = AIR LEAK</b> → notify MD. Intermittent/tidaling = NORMAL.</td></tr>
    <tr><td><b>3. Suction control</b></td><td>Controls suction strength</td><td><b>Continuous gentle bubbling = NORMAL</b> when on wall suction.</td></tr>
  </table>
  <div class="hy">⭐ The #1 tested distinction: <b>Continuous bubbling in the WATER SEAL chamber = leak (BAD, call MD, possible tension pneumothorax).</b> Continuous bubbling in the SUCTION chamber = expected.</div>
</div>

<div class="card">
  <h3>🛏️ Safety Rules (straight from your prof's notes)</h3>
  <ul class="clean">
    <li><b>Keep the drainage system BELOW chest level — NEVER above.</b></li>
    <li>Keep <b>occlusive gauze + tape at the bedside</b> in case the tube comes out.</li>
    <li>If the tube is <b>pulled out of the patient:</b> cover with sterile occlusive (petroleum) gauze taped on <b>3 sides</b> (lets air escape, prevents air entering → avoids tension pneumothorax).</li>
    <li>If the tube <b>disconnects from the system:</b> submerge the end in sterile water (re-establish water seal).</li>
    <li>Do NOT routinely clamp or "milk/strip" the tube (can cause tension pneumothorax).</li>
    <li><b>Tidaling</b> (fluid rises/falls with breathing) in the water seal = normal, good sign.</li>
  </ul>
  <div class="mnem"><div class="tag">🧠 Mnemonic</div><div class="big">"3 sides taped = air out, none in"</div><div class="exp">Taping all 4 sides could trap air → tension pneumothorax.</div></div>
</div>

<div class="card">
  <h3>❓ Why a chest tube + a few finer points</h3>
  <ul class="clean">
    <li><b>Purpose:</b> remove air or fluid/blood from the pleural space (e.g., pneumothorax, hemothorax) so the lung can re-expand and negative pressure is restored.</li>
    <li><b>Normal pleural pressure is negative</b> (subatmospheric); a breach lets in atmospheric pressure and collapses the lung.</li>
    <li>The <b>suction chamber holds water to atmospheric pressure to maintain the seal</b>. When it's connected to <b>wall suction, you get more suction to pull off more fluid/air</b>.</li>
    <li><b>Measure and mark drainage every few hours</b> (note color and amount). Report sudden large or bright-red output.</li>
    <li>Typical suction setting is around <b>−20 cm H₂O</b>.</li>
  </ul>
</div>



<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — which chamber is bubbling</span>The whole question is the <b>chamber</b>. Water-seal bubbling = air leak. Suction-control bubbling on wall suction = normal. He writes both versions.</div>
  <div class="trap"><span class="tag">Trap 2 — the four-sided dressing</span>A dislodged tube gets gauze on <b>three</b> sides so air can escape. Taping all four sides seals the leak in and <b>causes</b> a tension pneumothorax.</div>
  <div class="trap"><span class="tag">Trap 3 — clamping as a reflex</span>"Clamp the tube" appears in almost every chest tube stem. You almost never clamp, because it traps air.</div>
  <div class="trap"><span class="tag">Trap 4 — tidaling read as a problem</span>Tidaling is <b>normal</b>. Absent tidaling means the lung re-expanded or the tube is obstructed.</div>
</div>
<div id="q-chesttube"></div>`;
renderFilteredQuiz('q-chesttube', secQ(EXAM.filter(q=>q.topic==='airway')), 'Chest tube practice', 'Chest Tubes');

document.getElementById('sec-copd').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🌬️</span> COPD & Asthma</h2>
<p class="intro-line">Your professor specifically listed COPD + asthma manifestations + drugs as test points.</p>

<div class="card">
  <h3>🚬 COPD — progressive, IRREVERSIBLE airflow obstruction</h3>
  <p>Includes <b>chronic bronchitis + emphysema</b>. #1 risk factor = <b>cigarette smoking</b>.</p>
  <p><b>Manifestations:</b> chronic cough, sputum, dyspnea, <b>barrel chest</b>, weight loss, hypoxemia, hypercapnia.</p>
  <div class="hy">⭐ <b>O₂ GOAL FOR COPD = 88–92%</b> (NOT 95-100%!). COPD patients are chronic CO₂ retainers — too much O₂ can suppress their drive to breathe.</div>
  <p><b>Diagnostics:</b> spirometry. <b>Complications:</b> respiratory failure, pneumonia, cor pulmonale, pneumothorax.</p>
  <p><b>Interventions:</b> <b>pursed-lip breathing</b>, tripod position, smoking cessation, energy conservation, bronchodilators, inhaled steroids, O₂.</p>
</div>

<div class="card">
  <h3>🐦 Chronic Bronchitis vs Emphysema</h3>
  <table class="lab">
    <tr><th>Chronic Bronchitis</th><th>Emphysema</th></tr>
    <tr><td>"Blue Bloater"</td><td>"Pink Puffer"</td></tr>
    <tr><td>Productive cough, excess mucus</td><td>Dyspnea, alveolar destruction</td></tr>
    <tr><td>Cyanosis common</td><td>Thin, barrel chest</td></tr>
  </table>
  <div class="mnem"><div class="tag">🧠 Mnemonic</div><div class="big">"Blue Bloater Bronchitis • Pink Puffer emPhysema"</div></div>
</div>

<div class="card">
  <h3>💨 Asthma — chronic inflammation with REVERSIBLE obstruction</h3>
  <p><b>Manifestations:</b> wheezing, cough, chest tightness, dyspnea, prolonged expiration.</p>
  <p><b>Triggers:</b> smoke, allergens, exercise, cold air, infection.</p>
  <p><b>Peak flow zones:</b> 🟢 Green = good control • 🟡 Yellow = caution • 🔴 Red = medical alert.</p>
  <div class="hy">🚨 <b>CRITICAL NCLEX SIGN:</b> In a severe asthma attack, if <b>wheezing suddenly DISAPPEARS</b> → that's <b>impending respiratory failure</b> (no air is moving!). Not improvement — emergency!</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🆘 Status Asthmaticus</h3>
  <p>Life-threatening asthma attack not responding to routine therapy.</p>
  <p><b>ABGs:</b> EARLY = respiratory ALKALosis (hyperventilating). LATE = respiratory ACIDosis (tiring out, retaining CO₂) → danger.</p>
  <p><b>Tx:</b> O₂, albuterol, corticosteroids, intubation if needed.</p>
</div>

<div class="card">
  <h3>💊 Respiratory & Asthma Drugs (test point!)</h3>
  <table class="lab">
    <tr><th>Drug class</th><th>Use</th><th>Examples</th></tr>
    <tr><td><b>SABA</b> (quick relief)</td><td>Acute attack — RESCUE</td><td>Albuterol</td></tr>
    <tr><td><b>LABA</b> (long-acting)</td><td>Maintenance (never alone)</td><td>Salmeterol</td></tr>
    <tr><td><b>Inhaled corticosteroids</b></td><td>Long-term control (rinse mouth!)</td><td>Fluticasone, budesonide</td></tr>
    <tr><td><b>Leukotriene modifiers</b></td><td>Long-term control</td><td>Montelukast</td></tr>
    <tr><td><b>Anticholinergic</b></td><td>COPD bronchodilation</td><td>Ipratropium</td></tr>
  </table>
  <div class="hy">⭐ Inhaler order: <b>bronchodilator FIRST, wait, then steroid.</b> Always <b>rinse mouth after inhaled steroids</b> (prevents oral thrush). Albuterol = rescue; if used &gt;2x/week, asthma is poorly controlled.</div>
</div>



<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the silent chest</span>"Improvement," "the medication worked," and "needs less oxygen" all get offered. A silent chest is <b>impending respiratory failure</b>: too little air moving to make a sound.</div>
  <div class="trap"><span class="tag">Trap 2 — asthma versus emphysema</span>Asthma is <b>reversible</b> inflammation and bronchoconstriction. Emphysema is <b>irreversible</b> alveolar destruction. That one word separates them.</div>
  <div class="trap"><span class="tag">Trap 3 — inhaler order</span>Bronchodilator <b>first</b>, then the corticosteroid, then rinse. Reversed order is the most common distractor.</div>
  <div class="trap"><span class="tag">Trap 4 — oxygen misread as withholding</span>The 88 to 92% target is about <b>controlled delivery</b>, not rationing. Any option that withholds oxygen from a patient in true distress is wrong.</div>
</div>
<div id="q-copd"></div>`;

document.getElementById('sec-tb').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🔬</span> Tuberculosis (TB)</h2>
<p class="intro-line">Test & treatment specifically flagged by your professor.</p>

<div class="card">
  <h3>🦠 The Basics</h3>
  <p>Organism = <b>Mycobacterium tuberculosis</b>. Transmission = <b>AIRBORNE droplets</b>.</p>
  <p><b>Symptoms:</b> chronic cough, <b>night sweats</b>, <b>weight loss</b>, fatigue, low-grade fever, <b>hemoptysis</b>.</p>
  <div class="hy">⭐ <b>Isolation = AIRBORNE.</b> Negative-pressure room + <b>N95 mask</b> for staff. Patient wears a surgical mask if transported.</div>
</div>

<div class="card">
  <h3>🧪 Testing & Diagnosis</h3>
  <ul class="clean">
    <li><b>Mantoux (PPD) skin test:</b> read in <b>48–72 hours</b>. Measure <b>induration</b> (raised area), not redness.</li>
    <li><b>IGRA blood tests:</b> QuantiFERON Gold, T-SPOT.</li>
    <li><b>Confirmatory test = sputum culture</b> (acid-fast bacilli).</li>
  </ul>
  <div class="hy">⭐ A positive skin test = <b>exposure</b>, not active disease. Confirm active TB with sputum culture + chest x-ray.</div>
</div>

<div class="card">
  <h3>💊 Treatment — RIPE Therapy</h3>
  <table class="lab">
    <tr><th>Drug</th><th>Watch for</th></tr>
    <tr><td><b>R</b>ifampin</td><td>Orange/red body fluids (harmless), ↑ liver enzymes</td></tr>
    <tr><td><b>I</b>soniazid (INH)</td><td>Hepatotoxicity, peripheral neuropathy (give B6/pyridoxine)</td></tr>
    <tr><td><b>P</b>yrazinamide</td><td>Hepatotoxicity, ↑ uric acid (gout)</td></tr>
    <tr><td><b>E</b>thambutol</td><td>Optic neuritis (vision changes — report!)</td></tr>
  </table>
  <div class="hy">⭐ Treatment lasts <b>6–12 months</b> — adherence is everything. Patient is <b>no longer infectious after 3 consecutive negative sputum cultures.</b> Watch all RIPE drugs for liver toxicity.</div>
  <div class="mnem"><div class="tag">🧠 Mnemonic</div><div class="big">RIPE = the 4 TB drugs • "Rifampin turns pee oRange"</div></div>
</div>



<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — droplet versus airborne</span>TB is <b>airborne</b>: negative pressure and an N95. Bacterial pneumonia is <b>droplet</b>. The EXCEPT version of this question shows up constantly.</div>
  <div class="trap"><span class="tag">Trap 2 — orange urine as a problem</span>Rifampin turning fluids orange is <b>expected and harmless</b>. "Stop the medication" and "this indicates kidney failure" are the traps.</div>
  <div class="trap"><span class="tag">Trap 3 — reading the Mantoux</span>Measure <b>induration</b>, not redness, at 48 to 72 hours. And a positive test means <b>exposure</b>, not active disease.</div>
  <div class="trap"><span class="tag">Trap 4 — stopping treatment early</span>Any patient statement about stopping when symptoms improve is wrong. The full <b>6 to 12 months</b> prevents drug-resistant TB.</div>
</div>
<div id="q-tb"></div>`;
renderFilteredQuiz('q-tb', secQ(EXAM.filter(q=>q.topic==='tb')), 'TB practice', 'Tuberculosis');

document.getElementById('sec-blood').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🩸</span> Blood Transfusion & IV Therapy</h2>
<p class="intro-line">"What to do BEFORE a blood transfusion" is a named test key point. Free points if you know the steps.</p>

<div class="card" style="border-color:var(--red)">
  <h3>✅ BEFORE you hang blood</h3>
  <ul class="clean">
    <li><b>Informed consent</b> signed.</li>
    <li><b>Type & cross-match</b> completed.</li>
    <li>A <b>working, large-bore IV</b> (18–20 gauge).</li>
    <li>Baseline <b>vital signs</b>.</li>
    <li><b>Two-nurse verification</b> of patient ID + blood product.</li>
    <li>Prime the line with <b>0.9% Normal Saline ONLY</b> (never LR or dextrose).</li>
  </ul>
</div>

<div class="card">
  <h3>🩸 Getting & starting the blood (exact sequence)</h3>
  <ul class="clean">
    <li><b>Spike the bag with Normal Saline FIRST, flush the IV, THEN get the blood</b> from the blood bank.</li>
    <li><b>⏰ You have only 30 MINUTES from the time you pick up blood from the blood bank to START the infusion.</b> If you can't start in time, return it — don't let it sit warming at the bedside.</li>
    <li>Start <b>slowly</b> for the first 15 minutes.</li>
  </ul>
  <div class="hy">⭐ <b>Two key clocks, don't mix them up:</b> <b>30 minutes</b> = max time from blood-bank pickup to START the infusion. <b>4 hours</b> = max time to FINISH infusing one unit (bacterial growth risk after that).</div>
</div>

<div class="card">
  <h3>⏱️ DURING the transfusion</h3>
  <ul class="clean">
    <li><b>Stay with the patient for the first 15 minutes</b> — most reactions happen early. Run slowly at first.</li>
    <li>After the first 15 min, <b>monitor frequently (every 30 min to 1 hour)</b> until complete, taking vital signs.</li>
    <li>Each unit must <b>finish within 4 hours</b> (infection risk after that).</li>
    <li>Monitor for reaction: fever, chills, back/flank pain, hypotension, dyspnea, itching/hives, confusion, dizziness, dark urine.</li>
    <li>Also watch for <b>fluid overload</b>: swelling, weight gain, shortness of breath (especially heart/kidney patients).</li>
  </ul>
  <div class="mnem"><div class="tag">🧠 Mnemonic</div><div class="big">"Consent • Cross-match • Catheter • Check vitals • Companion (stay 15 min)"</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🚨 Reaction: mild vs. severe</h3>
  <ul class="clean">
    <li><b>Severe (hemolytic/anaphylactic):</b> chills, fever, back pain, hypotension, dyspnea, dark urine → <b>STOP the blood, clamp the line, open the Normal Saline, notify provider, stay with the patient.</b></li>
    <li><b>Mild (urticaria/hives only):</b> may be treated with <b>antihistamines</b> per provider order; sometimes resumed slowly. Follow facility policy.</li>
  </ul>
  <div class="hy">⭐ The FIRST action for any suspected reaction is always to <b>STOP the blood</b> while keeping IV access open with NS.</div>
</div>

<div class="card">
  <h3>💉 IV Therapy & Access</h3>
  <ul class="clean">
    <li><b>Aseptic technique</b> for IV insertion, central lines, and dressing changes. Wear gloves; clean injection ports before use.</li>
    <li><b>Irritating/vesicant meds</b> (iron, potassium, chemo, TPN, vasopressors) → central line preferred; always check the site for problems.</li>
    <li><b>Peripheral IV</b> = short-term. Assess for redness, swelling, infiltration, phlebitis.</li>
    <li><b>Central lines</b> (PICC, tunneled, port) = long-term, TPN, vesicants. Complication = <b>CLABSI</b> (prevent with sterile technique + chlorhexidine prep).</li>
    <li><b>Dressing changes:</b> weekly, or sooner if soiled/loose/peeling.</li>
    <li><b>NEVER IV push potassium.</b></li>
  </ul>
  <div class="hy">⭐ <b>Infiltration vs. Extravasation:</b> <b>Infiltration</b> = a <b>non-vesicant</b> fluid/med leaks into surrounding tissue. <b>Extravasation</b> = a <b>vesicant</b> (tissue-damaging) med leaks into tissue (e.g., chemo, potassium). Both need <b>frequent site checks</b> — stop the infusion immediately if suspected.</div>
</div>



<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the reaction sequence</span>"Give acetaminophen," "slow the rate," and "notify the provider" all appear and are all things that eventually happen. <b>Stop the blood first</b>, keep NS running through new tubing.</div>
  <div class="trap"><span class="tag">Trap 2 — the wrong companion fluid</span>Only <b>0.9% normal saline</b>. Dextrose lyses cells, LR's calcium promotes clotting. Both are offered.</div>

</div>
<div id="q-blood"></div>`;

const ROUND_SIZE=6;
let currentMatchGame=null, matchRoundPairs=[], matchLeftOrder=[], matchRightOrder=[], matchSelectedLeft=null, matchMatchedCount=0, matchStartTime=0, matchTimerInt=null, matchBestTime=null, matchProgress={};
(function restoreMatchProgress(){ try{ const r=localStorage.getItem('nur256u2_matchprogress'); if(r) matchProgress=JSON.parse(r); }catch(e){ matchProgress={}; } })();
function saveMatchProgress(){ try{ localStorage.setItem('nur256u2_matchprogress', JSON.stringify(matchProgress)); }catch(e){} }
function buildCycleOrder(pairs){
  const hasTiers = pairs.some(p=>typeof p.tier==='number');
  if(!hasTiers) return shuffle(pairs.map((_,i)=>i));
  const tiers=[...new Set(pairs.map(p=>p.tier))].sort((a,b)=>a-b);
  let order=[];
  tiers.forEach(t=>{
    const idxs=pairs.map((p,i)=>({p,i})).filter(x=>x.p.tier===t).map(x=>x.i);
    order=order.concat(shuffle(idxs));
  });
  return order;
}
function difficultyLabel(gameId, roundIdx){
  const pairs=MATCH_GAMES[gameId].pairs;
  if(!pairs.some(p=>typeof p.tier==='number')) return '';
  const roundsPerTier = Math.ceil(pairs.length/ROUND_SIZE/3) || 1;
  const tierIdx = Math.min(2, Math.floor(roundIdx/roundsPerTier));
  return ['🟢 Easier','🟡 Medium','🔴 Hardest'][tierIdx];
}
function startMatchGame(gameId){
  currentMatchGame = MATCH_GAMES[gameId];
  currentMatchGame.sectionId = gameId;
  try{ const r=localStorage.getItem(currentMatchGame.bestKey); matchBestTime = r?parseFloat(r):null; }catch(e){ matchBestTime=null; }
  const totalPairs=currentMatchGame.pairs.length;
  const totalRounds=Math.ceil(totalPairs/ROUND_SIZE);
  let prog=matchProgress[gameId];
  if(!prog || !prog.cycleOrder || prog.roundIdx>=totalRounds || prog.cycleOrder.length!==totalPairs){
    prog={ cycleOrder: buildCycleOrder(currentMatchGame.pairs), roundIdx:0 };
  }
  matchProgress[gameId]=prog; saveMatchProgress();
  const startIdx=prog.roundIdx*ROUND_SIZE;
  const idxSlice=prog.cycleOrder.slice(startIdx, startIdx+ROUND_SIZE);
  matchRoundPairs = idxSlice.map(i=>currentMatchGame.pairs[i]);
  matchLeftOrder = shuffle(matchRoundPairs.map((p,i)=>i));
  matchRightOrder = shuffle(matchRoundPairs.map((p,i)=>i));
  matchSelectedLeft=null; matchMatchedCount=0; matchStartTime=Date.now();

}
function updateMatchTimer(){

function drawMatchGame(totalRounds){

function matchPickRight(pairIdx, el){
  if(el.classList.contains('matched')||!matchSelectedLeft)return;

  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',x1); line.setAttribute('y1',y1); line.setAttribute('x2',x2); line.setAttribute('y2',y2);

  svg.appendChild(line);
}
function matchFinish(){

  if(!matchBestTime || elapsed<matchBestTime){ matchBestTime=elapsed; isNewBest=true; try{ localStorage.setItem(currentMatchGame.bestKey, elapsed.toFixed(2)); }catch(e){} }
  const prog=matchProgress[currentMatchGame.sectionId];

  const cycleDone = prog.roundIdx>=totalRounds;
  document.getElementById('matchWin').innerHTML=`<div class="quiz-score">🎉 Matched all ${matchRoundPairs.length} pairs in ${elapsed.toFixed(1)}s!${isNewBest?' <br>🏆 New best round time!':''}

    <br><button class="btn" style="background:var(--green);margin-top:10px" onclick="startMatchGame('${currentMatchGame.sectionId}')">${cycleDone? '🔄 Start a New Cycle (reshuffled)' : '➡️ Next Round'}</button>
  </div>`;
}
document.getElementById('sec-lytematch').innerHTML=`<p class="intro-line">Loading match game...</p>`;

{topic:'lytes',front:'Hyponatremia — main danger?',back:'Water moves into brain cells. Cerebral edema causing confusion, headache, seizures.'},
{topic:'lytes',front:'Hypernatremia — main sign?',back:'Intense thirst with dry sticky mucous membranes. Cells shrink.'},
{topic:'lytes',front:'Hypomagnesemia is linked to which other electrolyte?',back:'Hypokalemia. You cannot correct the potassium until the magnesium is replaced.'},
{topic:'lytes',front:'Potassium-rich foods?',back:'Banana, spinach, potato, avocado, orange, tomato, cantaloupe.'},

{topic:'abg',front:'What does ROME stand for?',back:'Respiratory Opposite, Metabolic Equal. pH and CO2 move opposite in respiratory; pH and bicarb move together in metabolic.'},
{topic:'abg',front:'Normal pH, PaCO2, HCO3?',back:'pH 7.35 to 7.45 • PaCO2 35 to 45 mmHg • HCO3 22 to 26 mEq/L'},
{topic:'abg',front:'Which system is the acid and which is the base?',back:'CO2 is the acid, controlled by the LUNGS. Bicarbonate is the base, controlled by the KIDNEYS.'},
{topic:'abg',front:'Uncompensated vs partially vs fully compensated?',back:'Uncompensated: pH abnormal, one system abnormal. Partially: pH abnormal, both abnormal. Fully: pH normal, both abnormal.'},
{topic:'abg',front:'Which compensates faster, lungs or kidneys?',back:'Lungs, in minutes. Kidneys take hours to days.'},
{topic:'abg',front:'Causes of respiratory acidosis?',back:'Anything that retains CO2: COPD, oversedation, atelectasis, pneumonia, hypoventilation, neuromuscular weakness.'},
{topic:'abg',front:'Causes of respiratory alkalosis?',back:'Hyperventilation: anxiety, pain, fever, early PE, high altitude, mechanical over-ventilation.'},
{topic:'abg',front:'Causes of metabolic acidosis?',back:'DKA, renal failure, lactic acidosis from shock, prolonged diarrhea (loses bicarbonate).'},
{topic:'abg',front:'Causes of metabolic alkalosis?',back:'Vomiting or NG suction (loses acid), excess antacids, diuretics, hypokalemia.'},
{topic:'abg',front:'Asthma patient whose PaCO2 rises from 28 to 41 — what is happening?',back:'Not improvement. They are tiring and heading toward respiratory failure. A "normalizing" CO2 in a hyperventilating patient is an ominous sign.'},
{topic:'abg',front:'ABG target for a COPD patient?',back:'SpO2 88 to 92 percent with controlled oxygen. Chronic CO2 retention means their gas is a compensated respiratory acidosis at baseline.'},

{topic:'resp',front:'Crackles mean what?',back:'Fluid or secretions in the small airways and alveoli. Heard in pneumonia, heart failure, pulmonary edema.'},
{topic:'resp',front:'Wheezes mean what?',back:'Narrowed airways. Asthma, COPD, bronchospasm.'},
{topic:'resp',front:'Stridor means what?',back:'Upper airway obstruction. This is an emergency.'},
{topic:'resp',front:'What is the earliest sign of hypoxia?',back:'Restlessness, anxiety, and confusion. Cyanosis is a LATE sign.'},
{topic:'resp',front:'Oxygen delivery — nasal cannula range?',back:'1 to 6 L/min, roughly 24 to 44 percent FiO2.'},
{topic:'resp',front:'Which mask gives the most precise FiO2?',back:'Venturi mask. Best choice for a COPD patient who needs a controlled concentration.'},
{topic:'resp',front:'Non-rebreather delivers what?',back:'Up to about 95 percent FiO2 at 10 to 15 L/min. The reservoir bag must stay inflated.'},
{topic:'resp',front:'Best position for a dyspneic patient?',back:'High-Fowler, upright. Tripod position for COPD.'},

{topic:'acute',front:'Hallmark of ARDS?',back:'Refractory hypoxemia — it does NOT improve with supplemental oxygen. Bilateral infiltrates on chest film.'},
{topic:'acute',front:'Classic PE presentation?',back:'Sudden dyspnea, pleuritic chest pain, tachycardia, anxiety, and hypoxia. Often after immobility or surgery.'},
{topic:'acute',front:'Criteria for acute respiratory failure?',back:'PaO2 below 60 and/or PaCO2 above 50 with a pH below 7.35.'},
{topic:'acute',front:'Most common cause of post-op low-grade fever in the first 48 hours?',back:'Atelectasis. Treat with incentive spirometry, coughing, deep breathing, and early ambulation.'},
{topic:'acute',front:'Tension pneumothorax signs?',back:'Tracheal deviation AWAY from the affected side, absent breath sounds, JVD, hypotension. Needle decompression.'},

{topic:'pneumonia',front:'What physically happens in pneumonia?',back:'Alveoli fill with inflammatory fluid and exudate, blocking gas exchange.'},
{topic:'pneumonia',front:'Most common bacterial cause of CAP?',back:'Streptococcus pneumoniae.'},
{topic:'pneumonia',front:'Rust-colored sputum suggests?',back:'Streptococcus pneumoniae.'},
{topic:'pneumonia',front:'Foul-smelling sputum suggests?',back:'Lung abscess or anaerobic infection.'},
{topic:'pneumonia',front:'How does pneumonia present in an older adult?',back:'Confusion and functional decline, often WITHOUT fever. Mental status change is the presentation.'},
{topic:'pneumonia',front:'Aspiration pneumonia most often affects which lung?',back:'The right lung, because the right main bronchus is wider and more vertical.'},
{topic:'pneumonia',front:'Key aspiration prevention for a dysphagia patient?',back:'Head of bed 30 to 45 degrees, swallow evaluation, thickened liquids, chin-tuck, no straws.'},

{topic:'airway',front:'Suctioning — how long per pass?',back:'No more than 10 to 15 seconds. Hyperoxygenate before and after. Suction only on withdrawal.'},
{topic:'airway',front:'Tracheostomy emergency equipment at the bedside?',back:'Obturator, a spare trach of the same size, a size smaller, and suction equipment.'},
{topic:'airway',front:'Ventilated patient suddenly desaturates — first action?',back:'Assess the patient and the airway and tubing. Do not silence the alarm and document.'},
{topic:'airway',front:'DOPE mnemonic for a ventilated patient in distress?',back:'Displacement, Obstruction, Pneumothorax, Equipment failure.'},

{topic:'chesttube',front:'Continuous bubbling in the WATER-SEAL chamber means?',back:'An air leak, which can progress to a tension pneumothorax. Not normal.'},
{topic:'chesttube',front:'Continuous bubbling in the SUCTION-CONTROL chamber means?',back:'Normal, when connected to wall suction. This is the one place continuous bubbling is expected.'},
{topic:'chesttube',front:'Tidaling in the water seal means?',back:'Normal. Fluid rises and falls with respiration. It stops when the lung has re-expanded or the tube is blocked.'},
{topic:'chesttube',front:'Chest tube accidentally pulled out — what do you do?',back:'Cover the site with sterile occlusive gauze taped on THREE sides, creating a flutter valve. Notify the provider.'},
{topic:'chesttube',front:'Chest drainage system falls over or disconnects?',back:'Submerge the tube end in sterile water or saline to restore the seal, then get a new system.'},
{topic:'chesttube',front:'When do you clamp a chest tube?',back:'Almost never. Only briefly to change the system or to check for an air leak, on order. Clamping can cause a tension pneumothorax.'},

{topic:'copd',front:'Physical hallmark of chronic COPD?',back:'Barrel chest with prolonged expiration. Also pursed-lip breathing and the tripod position.'},
{topic:'copd',front:'Underlying problem in asthma?',back:'Reversible airway inflammation and bronchoconstriction.'},
{topic:'copd',front:'Underlying problem in emphysema?',back:'Irreversible destruction of alveolar walls, losing surface area and elastic recoil.'},
{topic:'copd',front:'Sudden silent chest during an asthma attack means?',back:'Severe obstruction and impending respiratory failure. Air is not moving enough to make a sound.'},
{topic:'copd',front:'First-line medication mid-asthma attack?',back:'Short-acting beta agonist, albuterol.'},
{topic:'copd',front:'Order of inhalers?',back:'Bronchodilator FIRST, then the corticosteroid. Rinse the mouth after the steroid to prevent thrush.'},
{topic:'copd',front:'Why is high-flow oxygen risky in some COPD patients?',back:'Chronic CO2 retainers can lose their hypoxic drive. Target SpO2 88 to 92 percent with controlled delivery.'},

{topic:'tb',front:'TB precautions?',back:'Airborne. Negative-pressure room, N95 respirator for staff, surgical mask on the patient if transported.'},
{topic:'tb',front:'Classic TB symptoms?',back:'Productive cough over 3 weeks, hemoptysis, night sweats, unexplained weight loss, low-grade afternoon fever.'},
{topic:'tb',front:'What does RIPE stand for?',back:'Rifampin, Isoniazid, Pyrazinamide, Ethambutol.'},
{topic:'tb',front:'Rifampin key teaching?',back:'Turns urine, sweat, and tears orange. Harmless and expected. It also reduces oral contraceptive effectiveness.'},
{topic:'tb',front:'Isoniazid key teaching?',back:'Give vitamin B6 (pyridoxine) to prevent peripheral neuropathy. Watch for hepatotoxicity, avoid alcohol.'},
{topic:'tb',front:'Ethambutol key teaching?',back:'Watch for optic neuritis. Report any change in vision or color discrimination.'},
{topic:'tb',front:'How is a Mantoux read?',back:'Measure INDURATION, not redness, at 48 to 72 hours. A positive test means exposure, not active disease.'},
{topic:'tb',front:'Why must TB treatment run the full course?',back:'6 to 12 months. Stopping early breeds drug-resistant TB.'},

{topic:'blood',front:'First action before starting a transfusion?',back:'Verify informed consent and the type and cross-match, with two licensed personnel checking at the bedside.'},
{topic:'blood',front:'Which fluid can hang with blood?',back:'Only 0.9% normal saline. Dextrose lyses cells; LR contains calcium and can cause clotting.'},
{topic:'blood',front:'How long can blood sit before it must be started?',back:'30 minutes from leaving the blood bank. Never store it in a unit refrigerator.'},
{topic:'blood',front:'How long does a unit have to infuse in?',back:'Within 4 hours, because of bacterial growth risk.'},
{topic:'blood',front:'When do you stay with the patient?',back:'The first 15 minutes and stay for the first 15 minutes, running slowly. Most reactions occur early.'},
{topic:'blood',front:'Acute hemolytic reaction — signs and action?',back:'Fever, chills, low back pain, hypotension, dark urine. STOP the blood, keep NS running with new tubing, notify provider and blood bank.'},
{topic:'blood',front:'Febrile nonhemolytic reaction?',back:'The most common reaction. Fever and chills without hemolysis. Stop, evaluate, and use leukocyte-reduced blood next time.'},
{topic:'blood',front:'TACO vs TRALI?',back:'TACO is circulatory overload — dyspnea, JVD, hypertension. TRALI is acute lung injury — dyspnea with hypotension and no overload.'},
];

function drawFlashCard(){

  const scopeIds = flashTopic==='all' ? FLASH_DECK.map((_,i)=>i) : FLASH_DECK.map((c,i)=>({c,i})).filter(x=>x.c.topic===flashTopic).map(x=>x.i);
  const total=scopeIds.length;

  prog.textContent=`${totalMastered} / ${total} mastered • ${flashQueue.length} left this round`;

    </div>`;
}
function flipFlashCard(){
  flashShowingBack=!flashShowingBack;
  const el=document.getElementById('flashCardEl'), c=flashQueue[0];
  if(!el||!c)return;
  el.classList.toggle('flipped', flashShowingBack);
  document.getElementById('flashLabel').textContent = flashShowingBack ? 'Answer' : 'Question — tap to flip';
  document.getElementById('flashText').textContent = flashShowingBack ? c.back : c.front;
}
function answerFlash(gotIt){
  const c=flashQueue.shift(); if(!c)return;
  if(gotIt){ flashMastered.add(c.id); saveFlashMastered(); } else { flashQueue.push(c); }
  drawFlashCard();
}

let drillList=[], drillIdx=0, drillScore=0, drillStreak=0, drillBest=0, drillAnswered=false;
const DRILL_ROUND=20;
function startDrill(){
  const pool = hotOnlyGlobal ? DRILL_POOL.filter(q=>['upper','copd','chesttube','pneumonia','acute'].includes(q.topic)) : DRILL_POOL;
  drillList=shuffle(pool.slice()).slice(0,Math.min(DRILL_ROUND,pool.length));
  drillIdx=0; drillScore=0; drillStreak=0; drillAnswered=false;
  renderDrillQ();
}
function renderDrillQ(){
  const host=document.getElementById('drillBody');
  if(drillIdx>=drillList.length){ return drillFinish(); }
  const qRaw=drillList[drillIdx];
  let q=qRaw;
  if(shuffleAnswers){
    const order=shuffle(qRaw.o.map((_,i)=>i));
    q={...qRaw, o:order.map(i=>qRaw.o[i]), c:order.indexOf(qRaw.c)};
  }
  drillList[drillIdx]=q;
  drillAnswered=false;
  let opts=q.o.map((o,i)=>`<button class="opt" onclick="answerDrill(${i})">${o}</button>`).join('');
  host.innerHTML=`
    <div class="drill-top"><span>Q ${drillIdx+1} / ${drillList.length}</span><span>✅ ${drillScore} 🔥 ${drillStreak}</span></div>
    <div class="drill-bar"><div class="drill-bar-fill" style="width:${(drillIdx/drillList.length)*100}%"></div></div>
    <div class="quiz-card"><div class="q-text">${q.q}</div><div class="opts" id="drillOpts">${opts}</div><div class="rationale" id="drillRat"></div></div>
    <div class="center"><button class="btn ghost" id="drillNextBtn" style="display:none" onclick="nextDrill()">Next ➡️</button></div>`;
}
function answerDrill(i){
  if(drillAnswered)return; drillAnswered=true;
  const q=drillList[drillIdx];
  document.querySelectorAll('#drillOpts .opt').forEach((b,idx)=>{
    b.classList.add('disabled');
    if(idx===q.c)b.classList.add('correct');
    if(idx===i&&i!==q.c)b.classList.add('wrong');
  });
  const rat=document.getElementById('drillRat');
  if(i===q.c){drillScore++;drillStreak++;if(drillStreak>drillBest)drillBest=drillStreak;rat.innerHTML='✅ <b>Correct!</b> '+q.r;}
  else{drillStreak=0;rat.innerHTML='❌ <b>Not quite.</b> '+q.r;}
  rat.classList.add('show'); bumpProgress('drill-'+drillIdx);
  document.getElementById('drillNextBtn').style.display='inline-block';
}
function nextDrill(){ drillIdx++; renderDrillQ(); }
function drillFinish(){
  const pct=Math.round(drillScore/drillList.length*100);
  let msg=pct>=90?'🌟 Outstanding!':pct>=75?'💪 Test-ready zone!':pct>=60?'📈 Getting there — run it again.':'🌱 Keep drilling.';
  document.getElementById('drillBody').innerHTML=`
    <div class="card center" style="border-color:var(--teal)">
      <h2 style="margin-top:0">Round Complete!</h2>
      <div class="drill-final">${drillScore} / ${drillList.length} (${pct}%)</div>
      <p>Best streak: 🔥 ${drillBest}</p><p>${msg}</p>
      <button class="btn" onclick="startDrill()" style="background:linear-gradient(90deg,var(--teal),var(--green))">🔀 New Shuffled Round</button>
    </div>`;
}
document.getElementById('sec-drill').innerHTML=`
  <h2 class="sec-title"><span class="sec-emoji">⚡</span> Rapid Drill</h2>
  <p class="intro-line">A fresh, reshuffled ${DRILL_ROUND}-question round every time — instant feedback, score, and streak. Quick reps between study blocks.</p>
  <div class="tipbar">⚡ Answer fast, read the rationale on every one, chase your streak. Hit "New Shuffled Round" as many times as you want.</div>
  <div class="center" style="margin:10px 0"><button class="btn vision-toggle-btn" onclick="toggleHotOnly()" style="background:var(--purple)">🔥 High-Yield Only: OFF</button></div>
  <div id="drillBody"></div>`;
startDrill();

<script>
/* ===== EXAM BANK ===== */

/* ===== EXAM ENGINE (Study Mode + Test Mode 50-scramble + persistence) ===== */
let examState={}, examIdx=0, examSubmitted=false, examMode='study', examChecked={};
let quizSet=[], examShuffleMap={};
/* ---- topic + length picker ---- */
const EXAM_TOPICS=[
  {id:'upper',    label:'\uD83D\uDC43 Upper Resp'},
  {id:'resp',     label:'\uD83D\uDD0D Resp Assessment'},
  {id:'pneumonia',label:'\uD83E\uDDA0 Pneumonia'},
  {id:'airway',   label:'\uD83E\uDE7A Airway & Tubes'},
  {id:'copd',     label:'\uD83C\uDF2C\uFE0F COPD & Asthma'},
  {id:'tb',       label:'\uD83D\uDD2C TB'},
  {id:'clinical', label:'\uD83E\uDDE0 Clinical Judgment'},
  {id:'blood',    label:'\uD83E\uDE78 Transfusion (ref)'}
];
const MAX_TOPICS=3;
let examTopics=[];      /* empty = all topics */
let examLen='all';      /* 25 | 50 | 'all' */
(function restorePicker(){ try{
  const r=localStorage.getItem('nur256u2_picker');
  if(r){ const p=JSON.parse(r); if(Array.isArray(p.topics)) examTopics=p.topics.slice(0,MAX_TOPICS); if(p.len) examLen=p.len; }
}catch(e){} })();
function savePicker(){ try{ localStorage.setItem('nur256u2_picker', JSON.stringify({topics:examTopics,len:examLen})); }catch(e){} }
function topicCount(id){ return EXAM.filter(q=>q.topic===id && (!hotOnlyGlobal||q.hot)).length; }
function pickedPool(){
  let all=EXAM.map((_,i)=>i);
  if(hotOnlyGlobal) all=all.filter(i=>EXAM[i].hot);
  if(examTopics.length) all=all.filter(i=>examTopics.includes(EXAM[i].topic));
  return all;
}
function poolSize(){ return pickedPool().length; }
function toggleExamTopic(id){
  const i=examTopics.indexOf(id);
  if(i>=0){ examTopics.splice(i,1); }
  else {
    if(examTopics.length>=MAX_TOPICS){ toast('Pick up to '+MAX_TOPICS+' topics, or use All topics'); return; }
    examTopics.push(id);
  }
  savePicker(); renderPicker();
}
function setAllTopics(){ examTopics=[]; savePicker(); renderPicker(); }
function setExamLen(n){ examLen=n; savePicker(); renderPicker(); }
function renderPicker(){
  const host=document.getElementById('examPicker'); if(!host)return;
  const chips=EXAM_TOPICS.map(t=>{
    const n=topicCount(t.id);
    const on=examTopics.includes(t.id);
    return `<button class="chip ${on?'on':''}" onclick="toggleExamTopic('${t.id}')" ${n===0?'disabled style="opacity:.4"':''}>${t.label} (${n})</button>`;
  }).join('');
  const total=poolSize();

    const dis = n!=='all' && total<n;

  }).join('');
  const picked = examTopics.length
    ? examTopics.map(id=>(EXAM_TOPICS.find(t=>t.id===id)||{}).label).join(' + ')
    : 'All topics';
  const count = examLen==='all' ? total : Math.min(examLen,total);
  host.innerHTML=`
    <div class="card" style="border-color:var(--teal)">
      <h3>\uD83C\uDFAF Build your set</h3>
      <p style="margin:0 0 6px;font-size:.86rem;color:var(--muted)">Pick up to ${MAX_TOPICS} topics, or leave it on All topics.</p>
      <div class="chiprow">
        <button class="chip ${examTopics.length===0?'on':''}" onclick="setAllTopics()">\u2728 All topics</button>
        ${chips}
      </div>
      <p style="margin:12px 0 6px;font-size:.86rem;color:var(--muted)">How many questions?</p>
      <div class="chiprow">${lens}</div>
      <div class="hy" style="margin-top:12px"><b>${picked}</b> \u2192 <b>${count} question${count===1?'':'s'}</b>, shuffled fresh each time you start.</div>
      <button class="btn wide" onclick="startPickedSet()">\u25B6\uFE0F Start this set</button>
    </div>`;
}
function startPickedSet(){
  if(poolSize()===0){ toast('No questions match that selection'); return; }
  examChecked={}; examState={}; examIdx=0; examSubmitted=false; examShuffleMap={};
  const r=document.getElementById('examResult'); if(r)r.innerHTML='';
  buildQuizSet(examMode); applyModeUI(examMode); saveExam(); drawExamQ();
  const b=document.getElementById('examBody'); if(b&&b.scrollIntoView)b.scrollIntoView({behavior:'smooth',block:'start'});
  toast('New set: '+quizSet.length+' questions');
}
function getExamQ(qi){
  const base=EXAM[qi];
  if(base.t==='match'){
    if(!examShuffleMap[qi]){
      const order=shuffleAnswers?shuffle(base.items.map((_,i)=>i)):base.items.map((_,i)=>i);
      examShuffleMap[qi]=order;
    }
    const defOrder=examShuffleMap[qi];
    const defs=defOrder.map(i=>base.items[i].def);
    return {q:base.q, r:base.r, t:'match', items:base.items, defs, defOrder};
  }
  if(base.t==='order'){
    if(!examShuffleMap[qi]){
      const order=shuffleAnswers?shuffle(base.steps.map((_,i)=>i)):base.steps.map((_,i)=>i);
      examShuffleMap[qi]=order;
    }
    const order=examShuffleMap[qi];
    const steps=order.map(i=>base.steps[i]);
    return {q:base.q, r:base.r, t:'order', steps, displayOrder:order};
  }
  if(!examShuffleMap[qi]){
    const order=shuffleAnswers?shuffle(base.o.map((_,i)=>i)):base.o.map((_,i)=>i);
    examShuffleMap[qi]=order;
  }
  const order=examShuffleMap[qi];
  const opts=relabel(order.map(i=>base.o[i]));
  let correct;
  if(base.t==='multi'){
    const cset=new Set(base.c);
    correct=order.map((origIdx,newIdx)=>cset.has(origIdx)?newIdx:null).filter(x=>x!==null);
  } else {
    correct=order.indexOf(base.c);
  }
  return {q:base.q, r:base.r, t:base.t, o:opts, c:correct};
}
function saveExam(){ try{ localStorage.setItem('nur256u2_exam', JSON.stringify({mode:examMode,set:quizSet,state:examState,checked:examChecked,idx:examIdx,submitted:examSubmitted,shuffle:examShuffleMap})); }catch(e){} }
function loadExam(){ try{ const r=localStorage.getItem('nur256u2_exam'); return r?JSON.parse(r):null; }catch(e){ return null; } }
function clearExamSave(){ try{ localStorage.removeItem('nur256u2_exam'); }catch(e){} }
function shuffleArr(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);}
function renderExam(){
  const c=document.getElementById('sec-exam');
  c.innerHTML=`
    <h2 class="sec-title"><span class="sec-emoji">📝</span> Practice Exam <span style="font-size:.6em;opacity:.7">(${EXAM.length}-question bank)</span></h2>
    <p class="intro-line">NextGen NCLEX style — multiple choice + Select All That Apply.</p>
    <div class="exam-mode-toggle">
      <button class="mode-btn" id="modeStudyBtn" onclick="setExamMode('study')">📖 Study Mode</button>
      <button class="mode-btn" id="modeTestBtn" onclick="setExamMode('test')">📝 Test Mode</button>
    </div>
    <div class="center" style="margin:8px 0">
      <button class="btn vision-toggle-btn" onclick="toggleHotOnly()" style="background:var(--purple)">🔥 High-Yield Only: OFF</button>
    </div>
    <div id="examPicker"></div>
    <div class="tipbar" id="examModeTip"></div>
    <div id="examBody"></div>
    <div class="exam-nav">
      <button class="btn ghost" onclick="examPrev()">⬅️ Prev</button>
      <div class="exam-dots" id="examDots"></div>
      <button class="btn" onclick="examNext()">Next ➡️</button>
    </div>
    <div class="center" id="submitWrap" style="margin-top:14px"><button class="btn" onclick="submitExam()" style="background:linear-gradient(90deg,var(--teal),var(--green))">✅ Submit Exam & See Score</button></div>
    <div id="examResult"></div>`;
  const saved=loadExam();
  if(saved && saved.set && saved.set.length){
    examMode=saved.mode||'study'; quizSet=saved.set; examState=saved.state||{}; examChecked=saved.checked||{}; examIdx=saved.idx||0; examSubmitted=saved.submitted||false; examShuffleMap=saved.shuffle||{};
    renderPicker(); applyModeUI(examMode); drawExamQ();
  } else { renderPicker(); setExamMode(examMode); }
}
function buildQuizSet(m){
  let all=pickedPool();
  if(examLen!=='all'){ quizSet=shuffleArr(all).slice(0,Math.min(examLen,all.length)); }
  else { quizSet = m==='test' ? shuffleArr(all) : all; }
}
function applyModeUI(m){
  const sb=document.getElementById('modeStudyBtn'), tb=document.getElementById('modeTestBtn');
  sb.classList.toggle('active',m==='study'); tb.classList.toggle('active',m==='test');
  const tip=document.getElementById('examModeTip'); const submitWrap=document.getElementById('submitWrap');

  if(m==='study'){
    tip.innerHTML='\uD83D\uDCD6 <b>Study Mode:</b> '+n+' questions from <b>'+scope+'</b>. Tap an answer to instantly see right/wrong + rationale. SATA uses Check Answer. Progress saves automatically.';
    submitWrap.style.display='none';
  } else {
    tip.innerHTML='\uD83D\uDCDD <b>Test Mode:</b> '+n+' scrambled questions from <b>'+scope+'</b> \u2014 like the real exam. No feedback until you submit. Tap \u25B6\uFE0F Start this set for a fresh shuffle.';
    submitWrap.style.display='block';
  }
}

function setExamMode(m){

}
function drawExamQ(){
  if(!quizSet.length)buildQuizSet(examMode);
  const qi=quizSet[examIdx]; const q=getExamQ(qi);
  const body=document.getElementById('examBody');
  if(q.t==='match'){ drawExamMatchQ(qi,q,body); drawDots(); return; }
  if(q.t==='order'){ drawExamOrderQ(qi,q,body); drawDots(); return; }
  const typeLabel=q.t==='multi'?'Select All That Apply':'Multiple Choice';
  const checked = examMode==='study' && examChecked[qi];
  let html=`<div class="exam-q"><div><span class="qnum">QUESTION ${examIdx+1} of ${quizSet.length}</span><span class="qtype">${typeLabel}</span></div><div class="qtext">${q.q}</div>`;
  q.o.forEach((opt,i)=>{
    const letter=String.fromCharCode(65+i);
    let cls='opt'; const cur=examState[qi];
    const isSel = q.t==='multi' ? (cur&&cur.includes(i)) : (cur===i);
    if(isSel)cls+=' sel-multi';
    if(checked){ const isCorrectOpt = q.t==='multi'?q.c.includes(i):q.c===i; if(isCorrectOpt)cls+=' correct'; else if(isSel)cls+=' wrong'; }
    html+=`<button class="${cls}" ${checked?'disabled':''} onclick="examPick(${i})">${opt}</button>`;
  });
  html+=`</div>`;
  if(examMode==='study'){
    if(q.t==='multi' && !checked){ html+=`<div class="center"><button class="btn" onclick="checkExamQ()" style="background:linear-gradient(90deg,var(--teal),var(--green))">✓ Check Answer</button></div>`; }
    if(checked){
      const ans=examState[qi]; const isCorrect = q.t==='multi'?arrEq(ans,q.c):ans===q.c;
      const correctTxt = q.t==='multi'?q.c.map(x=>String.fromCharCode(65+x)).sort().join(', '):String.fromCharCode(65+q.c);
      html+=`<div class="rationale show" style="border-color:${isCorrect?'var(--green)':'var(--red)'}">${isCorrect?'✅ <b>Correct!</b>':'❌ <b>Not quite.</b> Correct: <b>'+correctTxt+'</b>'}<br><b>Rationale:</b> ${q.r}</div>`;
    }
  }
  body.innerHTML=html; drawDots();
}
function drawExamMatchQ(qi,q,body){
  const checked = examMode==='study' && examChecked[qi];
  const cur = examState[qi] || [];
  let html=`<div class="exam-q"><div><span class="qnum">QUESTION ${examIdx+1} of ${quizSet.length}</span><span class="qtype">Dropdown Match</span></div><div class="qtext">${q.q}</div>`;
  q.items.forEach((item,itemIdx)=>{
    const selectedPos = cur[itemIdx];
    let rowCls='dm-row';
    if(checked){
      const isCorrect = selectedPos!==undefined && q.defOrder[selectedPos]===itemIdx;
      rowCls += isCorrect ? ' dm-correct' : ' dm-wrong';
    }
    html+=`<div class="${rowCls}"><div class="dm-term">${item.term}</div><select class="dm-select" ${checked?'disabled':''} onchange="examMatchPick(${itemIdx}, this.value)">`;
    html+=`<option value="" ${selectedPos===undefined?'selected':''}>— choose a definition —</option>`;
    q.defs.forEach((d,pos)=>{ html+=`<option value="${pos}" ${selectedPos===pos?'selected':''}>${d}</option>`; });
    html+=`</select></div>`;
  });
  html+=`</div>`;
  if(examMode==='study'){
    const allAnswered = q.items.every((_,i)=>cur[i]!==undefined);
    if(!checked){ html+=`<div class="center"><button class="btn" onclick="checkExamMatch()" style="background:linear-gradient(90deg,var(--teal),var(--green))" ${allAnswered?'':'disabled'}>✓ Check Answers</button></div>`; }
    if(checked){
      const isCorrect = q.items.every((_,i)=>cur[i]!==undefined && q.defOrder[cur[i]]===i);
      html+=`<div class="rationale show" style="border-color:${isCorrect?'var(--green)':'var(--red)'}">${isCorrect?'✅ <b>All correct!</b>':'❌ <b>Some matches were off</b> — check the highlighted rows above.'}<br><b>Rationale:</b> ${q.r}</div>`;
    }
  }
  body.innerHTML=html;
}
function examMatchPick(itemIdx, val){
  const qi=quizSet[examIdx];
  if(examMode==='study' && examChecked[qi])return;
  if(!examState[qi])examState[qi]=[];
  examState[qi][itemIdx] = val===''? undefined : parseInt(val,10);
  saveExam(); drawExamQ();
}
function checkExamMatch(){
  const qi=quizSet[examIdx];
  examChecked[qi]=true; bumpProgress('exam-'+qi); drawExamQ(); saveExam();
}
function drawExamOrderQ(qi,q,body){
  const checked = examMode==='study' && examChecked[qi];
  const cur = examState[qi] || [];
  let html=`<div class="exam-q"><div><span class="qnum">QUESTION ${examIdx+1} of ${quizSet.length}</span><span class="qtype">Ordered Response (Drag &amp; Drop style)</span></div><div class="qtext">${q.q}</div>`;
  html+=`<p style="font-size:.82rem;color:var(--muted);margin:4px 0 10px">Tap each step below in the correct order — it will move into your answer list.</p>`;
  html+=`<div class="order-answer" id="orderAnswerList">`;
  cur.forEach((origIdx,pos)=>{
    let itemCls='order-answer-item';
    if(checked){ itemCls += origIdx===pos ? ' order-correct' : ' order-wrong'; }
    html+=`<div class="${itemCls}"><span class="num">${pos+1}</span><span>${q.steps[q.displayOrder.indexOf(origIdx)]}</span></div>`;
  });
  html+=`</div>`;
  if(!checked){
    html+=`<div class="order-pool">`;
    q.steps.forEach((step,displayPos)=>{
      const origIdx=q.displayOrder[displayPos];
      const used = cur.includes(origIdx);
      html+=`<button class="order-chip" ${used?'disabled':''} onclick="examOrderPick(${origIdx})">${step}</button>`;
    });
    html+=`</div>`;
    html+=`<div class="center" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">`;
    html+=`<button class="btn ghost" onclick="examOrderUndo()">↺ Undo Last</button>`;
    if(examMode==='study' && cur.length===q.steps.length){ html+=`<button class="btn" onclick="checkExamOrder()" style="background:linear-gradient(90deg,var(--teal),var(--green))">✓ Check Order</button>`; }
    html+=`</div>`;
  }
  html+=`</div>`;
  if(examMode==='study' && checked){
    const isCorrect = cur.length===q.steps.length && cur.every((v,i)=>v===i);
    html+=`<div class="rationale show" style="border-color:${isCorrect?'var(--green)':'var(--red)'}">${isCorrect?'✅ <b>Correct order!</b>':'❌ <b>Not quite the right order</b> — see highlighted steps above.'}<br><b>Rationale:</b> ${q.r}</div>`;
  }
  body.innerHTML=html;
}
function examOrderPick(origIdx){
  const qi=quizSet[examIdx];
  if(examMode==='study' && examChecked[qi])return;
  if(!examState[qi])examState[qi]=[];
  if(!examState[qi].includes(origIdx)) examState[qi].push(origIdx);
  saveExam(); drawExamQ();
}
function examOrderUndo(){
  const qi=quizSet[examIdx];
  if(examMode==='study' && examChecked[qi])return;
  if(examState[qi] && examState[qi].length){ examState[qi].pop(); saveExam(); drawExamQ(); }
}
function checkExamOrder(){
  const qi=quizSet[examIdx];
  examChecked[qi]=true; bumpProgress('exam-'+qi); drawExamQ(); saveExam();
}
function isExamCorrect(q, ans){
  if(q.t==='multi') return arrEq(ans,q.c);
  if(q.t==='match') return q.items.every((_,i)=>ans && ans[i]!==undefined && q.defOrder[ans[i]]===i);
  if(q.t==='order') return ans && ans.length===q.steps.length && ans.every((v,i)=>v===i);
  return ans===q.c;
}
function isExamAnswered(qi){
  const ans=examState[qi];
  if(ans===undefined)return false;
  if(Array.isArray(ans))return ans.length>0 && !ans.includes(undefined);
  return true;
}
function drawDots(){
  const d=document.getElementById('examDots'); d.innerHTML='';
  quizSet.forEach((qi,pos)=>{
    const dot=document.createElement('div'); dot.className='dot';
    const answered = isExamAnswered(qi);
    if(examMode==='study'){ if(examChecked[qi]){ const eq=getExamQ(qi); dot.classList.add(isExamCorrect(eq,examState[qi])?'dot-correct':'dot-wrong'); } }
    else { if(answered)dot.classList.add('answered'); }
    if(pos===examIdx)dot.classList.add('current');
    dot.onclick=()=>{examIdx=pos;drawExamQ();saveExam();};
    d.appendChild(dot);
  });
}
function examPick(i){
  const qi=quizSet[examIdx]; const q=getExamQ(qi);
  if(examMode==='study' && examChecked[qi]) return;
  if(q.t==='multi'){
    if(!examState[qi])examState[qi]=[]; const arr=examState[qi]; const idx=arr.indexOf(i);
    if(idx>-1)arr.splice(idx,1); else arr.push(i); drawExamQ();
  } else { examState[qi]=i; if(examMode==='study'){ examChecked[qi]=true; bumpProgress('exam-'+qi); } drawExamQ(); }
  saveExam();
}
function checkExamQ(){
  const qi=quizSet[examIdx]; const ans=examState[qi];
  if(ans===undefined||(Array.isArray(ans)&&ans.length===0))return;
  examChecked[qi]=true; bumpProgress('exam-'+qi); drawExamQ(); saveExam();
}
function examNext(){ if(examIdx<quizSet.length-1){examIdx++;drawExamQ();saveExam();window.scrollTo({top:0,behavior:'smooth'});} }
function examPrev(){ if(examIdx>0){examIdx--;drawExamQ();saveExam();window.scrollTo({top:0,behavior:'smooth'});} }
function arrEq(a,b){if(!a||!b)return false;a=[...a].sort();b=[...b].sort();return a.length===b.length&&a.every((v,i)=>v===b[i]);}
function examAnswerSummary(q, ans){
  if(ans===undefined||(Array.isArray(ans)&&ans.length===0))return {your:'(no answer)', correct:'—'};
  if(q.t==='multi') return {your:ans.map(x=>String.fromCharCode(65+x)).sort().join(', '), correct:q.c.map(x=>String.fromCharCode(65+x)).sort().join(', ')};
  if(q.t==='match') return {your:q.items.map((it,i)=>it.term+'→'+(ans[i]!==undefined?q.defs[ans[i]]:'(blank)')).join('; '), correct:q.items.map(it=>it.term+'→'+it.def).join('; ')};
  if(q.t==='order'){
    const yourTxt = ans.map(origIdx=>q.steps[q.displayOrder.indexOf(origIdx)]).join(' → ');
    const correctTxt = q.steps.map((_,i)=>q.steps[q.displayOrder.indexOf(i)]).join(' → ');
    return {your:yourTxt, correct:correctTxt};
  }
  return {your:String.fromCharCode(65+ans), correct:String.fromCharCode(65+q.c)};
}
function submitExam(){
  let correct=0;
  quizSet.forEach(qi=>{ const q=getExamQ(qi); if(isExamCorrect(q, examState[qi]))correct++; });
  const total=quizSet.length; const pct=Math.round(correct/total*100);
  examSubmitted=true; saveExam();
  let msg = pct>=85?'🌟 Outstanding — exam-ready!':pct>=75?'✅ Passing! Polish the misses.':pct>=60?'💪 Getting there — review and retake.':'📚 Keep grinding — revisit the sections.';
  let html=`<div class="quiz-score">You scored ${correct} / ${total} (${pct}%)<br>${msg}</div><h3 style="color:var(--pink)">📖 Full Review</h3>`;
  quizSet.forEach((qi,pos)=>{
    const q=getExamQ(qi); const ans=examState[qi]; const isCorrect=isExamCorrect(q,ans);
    const sum=examAnswerSummary(q,ans);
    html+=`<div class="exam-q" style="border-color:${isCorrect?'var(--green)':'var(--red)'}"><div class="qnum">Q${pos+1} ${isCorrect?'✅':'❌'}</div><div class="qtext" style="font-size:.92rem">${q.q}</div><div style="font-size:.85rem"><b>Your answer:</b> ${sum.your} &nbsp;|&nbsp; <b>Correct:</b> ${sum.correct}</div><div class="rationale show" style="margin-top:8px"><b>Rationale:</b> ${q.r}</div></div>`;
  });
  html+=`<div class="center"><button class="btn" onclick="resetExam()">🔄 New Test (fresh 50)</button></div>`;
  document.getElementById('examResult').innerHTML=html;
  const _er=document.getElementById('examResult'); if(_er.scrollIntoView)_er.scrollIntoView({behavior:'smooth'});
}
function resetExam(){ examState={}; examIdx=0; examSubmitted=false; examChecked={}; examShuffleMap={}; document.getElementById('examResult').innerHTML=''; buildQuizSet(examMode); saveExam(); drawExamQ(); window.scrollTo({top:0,behavior:'smooth'}); }
renderExam();
updateHotToggleButtons();
renderPicker();
updateProg();

</script>
