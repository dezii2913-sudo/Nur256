<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>NUR 256 — Unit 1 Study Lab</title>
<style>
:root{
  color-scheme: light;
  --bg:#f2efe6; --bg2:#fffdf8;
  --ink:#2a2118; --muted:#6f6153;
  --card:#fffdf8; --card-border:#e0d2bd;
  --pink:#b45309; --pink-soft:#fdf0dc;
  --purple:#9a3412; --purple-soft:#fceee4;
  --teal:#0f766e; --teal-soft:#d8f2ee;
  --green:#15803d; --green-soft:#dcf7e3;
  --red:#b91c1c; --red-soft:#fbe3e1;
  --amber:#a16207; --amber-soft:#faf0d2;
  --blue:#7c2d12; --blue-soft:#fbeade;
}
[data-theme="night"]{
  color-scheme: dark;
  --bg:#171310; --bg2:#1f1a15;
  --ink:#f5ede1; --muted:#b4a494;
  --card:#241d17; --card-border:#43362a;
  --pink:#f59e0b; --pink-soft:#332514;
  --purple:#fb923c; --purple-soft:#35241a;
  --teal:#2dd4bf; --teal-soft:#122b29;
  --green:#4ade80; --green-soft:#14301d;
  --red:#f87171; --red-soft:#331a1a;
  --amber:#fbbf24; --amber-soft:#332711;
  --blue:#fdba74; --blue-soft:#33241a;
}

html{background:var(--bg)}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  transition:background .3s,color .3s;padding-bottom:80px;
}
/* BIG TEXT mode */
body.mobile-mode{font-size:1.18rem;line-height:1.7}
body.mobile-mode .grid2,body.mobile-mode .grid3{grid-template-columns:1fr!important;gap:18px}
body.mobile-mode .content{padding:16px}
body.mobile-mode .card{padding:20px 18px;margin-bottom:18px}
body.mobile-mode .card h3{font-size:1.3rem;line-height:1.4}
body.mobile-mode .sec-title{font-size:1.55rem;line-height:1.35}
body.mobile-mode p,body.mobile-mode li,body.mobile-mode td,body.mobile-mode th{font-size:1.12rem;line-height:1.7}
body.mobile-mode .clean li{margin-bottom:12px}
body.mobile-mode .opt{font-size:1.12rem;padding:16px;min-height:54px;line-height:1.5}
body.mobile-mode .q-text{font-size:1.18rem;line-height:1.55}
body.mobile-mode .btn,body.mobile-mode .tbtn{font-size:1.1rem;padding:14px 18px}
body.mobile-mode .nav button{font-size:1.05rem;padding:12px 14px}
body.mobile-mode .rationale{font-size:1.08rem;line-height:1.6}
body.mobile-mode .mnem .big{font-size:1.15rem}
body.mobile-mode .hy{font-size:1.1rem;line-height:1.6;padding:16px}
body.mobile-mode table.lab{font-size:.9rem}
body.mobile-mode .lab td,body.mobile-mode .lab th{padding:9px 7px;font-size:.92rem!important}

/* TOP BAR */
.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(90deg,var(--pink),var(--purple));
  color:#fff;padding:12px 16px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex-wrap:wrap;
  box-shadow:0 2px 14px rgba(0,0,0,.18);
}
.topbar h1{font-size:1.2rem;margin:0;font-weight:800;letter-spacing:.3px}
.topbar .sub{font-size:.72rem;opacity:.9;font-weight:500;display:block}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{border:none;background:rgba(255,255,255,.25);color:#fff;padding:9px 14px;border-radius:30px;font-weight:700;font-size:.85rem;cursor:pointer;backdrop-filter:blur(4px)}
.tbtn:active{transform:scale(.95)}

.progwrap{padding:10px 16px;background:var(--bg2)}
.progbar-bg{background:var(--card-border);border-radius:20px;height:14px;overflow:hidden}
.progbar{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:20px;transition:width .5s}
.progtext{font-size:.72rem;color:var(--muted);text-align:center;margin-top:4px;font-weight:600}

/* NAV TABS */
.nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;-webkit-overflow-scrolling:touch;background:var(--bg)}
.nav button{flex:0 0 auto;border:2px solid var(--card-border);background:var(--card);color:var(--ink);padding:9px 15px;border-radius:30px;font-weight:700;font-size:.82rem;cursor:pointer;transition:.2s;white-space:nowrap}
.nav button.active{background:var(--purple);color:#fff;border-color:var(--purple);transform:scale(1.04)}

.content{max-width:920px;margin:0 auto;padding:18px;background:var(--bg)}
.section{display:none;animation:fade .4s;scroll-margin-top:12px}
.section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.sec-title{font-size:1.5rem;font-weight:800;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.sec-emoji{font-size:1.6rem}
.intro-line{color:var(--muted);margin:0 0 16px;font-size:.95rem}

.card{background:var(--card);border:2px solid var(--card-border);border-radius:16px;padding:16px 18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card h3{margin:0 0 10px;font-size:1.15rem}
.clean{list-style:none;padding:0;margin:8px 0}
.clean li{padding:6px 0 6px 22px;position:relative}
.clean li:before{content:"▸";position:absolute;left:0;color:var(--purple);font-weight:800}
.pill{display:inline-block;background:var(--purple-soft);color:var(--purple);padding:2px 10px;border-radius:20px;font-size:.7rem;font-weight:800;margin-left:6px}

.hy{background:var(--amber-soft);border-left:5px solid var(--amber);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.9rem}
.why-chain{background:var(--teal-soft);border-left:4px solid var(--teal);border-radius:10px;padding:12px 14px;margin:10px 0;line-height:1.7}
.mnem{background:var(--purple-soft);border-radius:12px;padding:10px 14px;margin:10px 0}
.mnem .tag{font-size:.68rem;font-weight:800;color:var(--purple);text-transform:uppercase;letter-spacing:.5px}
.mnem .big{font-size:1.05rem;font-weight:800;margin:3px 0}
.mnem .exp{font-size:.85rem;color:var(--muted)}
.profnote{background:var(--teal-soft);border-left:5px solid var(--teal);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.9rem}
.profnote .tag{font-size:.68rem;font-weight:800;color:var(--teal);text-transform:uppercase;letter-spacing:.5px}

table.lab{width:100%;border-collapse:collapse;margin:10px 0;font-size:.88rem;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(min-width:640px){table.lab{display:table}}
table.lab th{background:var(--purple);color:#fff;padding:8px;text-align:left;font-size:.8rem}
table.lab td{padding:8px;border-bottom:1px solid var(--card-border);min-width:80px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}

/* QUIZ */
.quiz-card{background:var(--card);border:2px solid var(--card-border);border-radius:14px;padding:16px;margin:12px 0}
.q-text{font-weight:700;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--card-border);background:var(--bg2);color:var(--ink);padding:11px 14px;border-radius:10px;cursor:pointer;font-size:.92rem;transition:.15s}
.opt:hover{border-color:var(--purple)}
.opt.correct{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.opt.sel-multi{border-color:var(--purple);background:var(--purple-soft)}
.opt.disabled{pointer-events:none;opacity:.85}
.rationale{margin-top:10px;padding:10px 12px;background:var(--blue-soft);border-radius:10px;font-size:.86rem;display:none}
.rationale.show{display:block}
.submit-multi{margin-top:8px;background:linear-gradient(90deg,var(--teal),var(--green));color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:800;cursor:pointer}
.center{text-align:center}
.btn{background:var(--purple);color:#fff;border:none;padding:11px 20px;border-radius:12px;font-weight:800;cursor:pointer;font-size:.95rem}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--card-border)}
.tipbar{background:var(--teal-soft);border-radius:12px;padding:10px 14px;font-size:.85rem;margin:10px 0}
.kbd{background:var(--card);border:1px solid var(--card-border);border-radius:6px;padding:1px 7px;font-weight:700;font-size:.8rem}
.quiz-score{font-size:1.15rem;font-weight:800;text-align:center;padding:16px;background:var(--purple-soft);border-radius:14px;margin:12px 0}

/* flash game */
.flash-progress{text-align:center;font-size:.85rem;color:var(--muted);margin-bottom:10px;font-weight:700}
.flash-card{background:var(--card);border:3px solid var(--purple);border-radius:20px;padding:34px 22px;min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.12rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow,0 4px 18px rgba(0,0,0,.12));transition:transform .15s,background .2s,border-color .2s}
.flash-card:active{transform:scale(.97)}
.flash-card.flipped{border-color:var(--teal);background:var(--teal-soft)}
.flash-label{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px;display:block}
.flash-btns{display:flex;gap:10px;margin-top:14px}
.flash-btn{flex:1;padding:14px;border-radius:14px;border:none;font-weight:800;cursor:pointer;font-size:.92rem}
.flash-btn.learning{background:var(--amber-soft);color:var(--amber);border:2px solid var(--amber)}
.flash-btn.gotit{background:var(--green-soft);color:var(--green);border:2px solid var(--green)}

/* wrong answer vault */
.vault-empty{text-align:center;padding:30px 16px;font-size:1rem}
.vault-tag{display:inline-block;background:var(--purple-soft);color:var(--purple);font-size:.72rem;font-weight:800;border-radius:20px;padding:2px 10px;margin-bottom:8px}
.vault-solved{background:var(--green-soft);border:2px solid var(--green);color:var(--green);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:.85rem;font-weight:700;text-align:center}

/* match game */
.match-stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-weight:800;font-size:.88rem;margin:10px 0;color:var(--ink)}
.match-wrap{position:relative}
.match-svg{display:block;position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.match-columns{display:flex;gap:10px;position:relative;z-index:2}
.match-col{flex:1 1 0;display:flex;flex-direction:column;gap:9px;min-width:0}
.match-item{width:100%;box-sizing:border-box;background:var(--card);border:2px solid var(--card-border);border-radius:12px;padding:11px 8px;font-size:.74rem;font-weight:700;cursor:pointer;text-align:left;transition:border-color .15s,background .15s,transform .1s;line-height:1.3;word-break:break-word;overflow-wrap:anywhere;white-space:normal}
.match-item:active{transform:scale(.98)}
.match-item.selected{border-color:var(--purple);background:var(--purple-soft)}
.match-item.matched{border-color:var(--green);background:var(--green-soft);color:var(--green);cursor:default;opacity:.75}
.match-item.shake{border-color:var(--red);background:var(--red-soft);animation:matchshake .35s}
@keyframes matchshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
body.mobile-mode .match-item{font-size:.95rem}
body.mobile-mode .match-stats{font-size:1rem}

/* exam: dropdown-match type */
.dm-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card);border:2px solid var(--card-border);border-radius:12px;margin-bottom:8px;flex-wrap:wrap}
.dm-term{font-weight:800;flex:1 1 140px;min-width:120px}
.dm-select{flex:1 1 200px;padding:9px;border-radius:10px;border:2px solid var(--card-border);background:var(--bg2);color:var(--ink);font-size:.85rem}
.dm-row.dm-correct{border-color:var(--green);background:var(--green-soft)}
.dm-row.dm-wrong{border-color:var(--red);background:var(--red-soft)}

/* exam: order/sequence type (NCLEX-style drag-and-drop, tap-to-sequence) */
.order-pool{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.order-chip{background:var(--card);border:2px solid var(--card-border);border-radius:12px;padding:11px 12px;font-size:.85rem;font-weight:700;cursor:pointer;text-align:left}
.order-chip:disabled{opacity:.35;cursor:default}
.order-answer{display:flex;flex-direction:column;gap:6px;margin:10px 0;min-height:40px;padding:8px;border:2px dashed var(--card-border);border-radius:12px}
.order-answer-item{display:flex;align-items:center;gap:8px;background:var(--purple-soft);border:2px solid var(--purple);border-radius:10px;padding:8px 10px;font-size:.82rem;font-weight:700}
.order-answer-item .num{background:var(--purple);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0}
.order-answer-item.order-correct{background:var(--green-soft);border-color:var(--green)}
.order-answer-item.order-wrong{background:var(--red-soft);border-color:var(--red)}

/* drill */
.drill-top{display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;margin-bottom:6px}
.drill-bar{height:8px;background:var(--card-border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.drill-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));transition:.3s}
.drill-final{font-size:1.6rem;font-weight:800;color:var(--purple);margin:10px 0}

/* exam */
.exam-mode-toggle{display:flex;gap:10px;margin:12px 0;justify-content:center}
.mode-btn{flex:1;max-width:220px;padding:12px 16px;border-radius:14px;border:2px solid var(--card-border);background:var(--card);color:var(--ink);font-weight:800;font-size:.95rem;cursor:pointer}
.mode-btn.active{background:linear-gradient(90deg,var(--purple),var(--pink));color:#fff;border-color:transparent}
.exam-q{background:var(--card);border:2px solid var(--card-border);border-radius:14px;padding:16px;margin:10px 0}
.qnum{font-size:.7rem;font-weight:800;color:var(--purple);text-transform:uppercase}
.qtype{font-size:.64rem;font-weight:800;padding:2px 8px;border-radius:20px;background:var(--blue-soft);color:var(--blue);margin-left:6px}
.qtext{font-weight:700;margin:8px 0 12px}
.exam-nav{position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--card-border);padding:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:14px 14px 0 0;margin-top:10px}
.exam-dots{display:flex;flex-wrap:wrap;gap:4px;max-width:56%;max-height:56px;overflow-y:auto;align-content:flex-start;padding:2px}
.exam-nav{flex-wrap:nowrap}
.dot{width:11px;height:11px;border-radius:50%;background:var(--card-border);cursor:pointer;flex:0 0 auto}
.dot.answered{background:var(--teal)}
.dot.current{background:var(--pink);transform:scale(1.3)}
.dot.dot-correct{background:var(--green)}
.dot.dot-wrong{background:var(--red)}

/* ---- Unit 1 additions ---- */
.trap{background:var(--red-soft);border-left:5px solid var(--red);border-radius:10px;padding:11px 14px;margin:10px 0;font-size:.9rem}
.trap .tag{font-size:.68rem;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px}
.hy .tag{font-size:.68rem;font-weight:800;color:var(--amber);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px}
.chainlist{list-style:none;padding:0;margin:8px 0}
.chainlist li{padding:9px 0;border-bottom:1px solid var(--card-border);line-height:1.65}
.chainlist li:last-child{border-bottom:none}
.noteinput{width:100%;font-family:inherit;font-size:1rem;padding:13px;border-radius:12px;border:2px solid var(--card-border);background:var(--bg2);color:var(--ink);resize:vertical;line-height:1.5}
.noteinput:focus{outline:none;border-color:var(--purple)}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.chip{font-family:inherit;font-size:.8rem;font-weight:700;padding:8px 13px;border-radius:999px;border:2px solid var(--card-border);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
.starline{display:flex;align-items:center;gap:9px;margin:10px 0 14px;font-size:.93rem}
.starline input{width:20px;height:20px;accent-color:var(--purple)}
.notecard{border:2px solid var(--card-border);border-radius:12px;padding:11px 13px;margin:9px 0;background:var(--bg2)}
.noterow{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.notespacer{flex:1}
.notetag{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--purple);background:var(--purple-soft);padding:3px 9px;border-radius:999px}
.notetext{white-space:pre-wrap;line-height:1.55;font-size:.96rem}
.mini{font-family:inherit;font-size:.76rem;font-weight:700;padding:6px 12px;border-radius:999px;border:2px solid var(--card-border);background:var(--card);color:var(--ink);cursor:pointer}
.mini.on{background:var(--amber);border-color:var(--amber);color:#fff}
.mini.danger{color:var(--red);border-color:var(--red-soft)}
.btn.wide{width:100%}
.opt:focus{outline:none}
.opt:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg2);padding:11px 20px;border-radius:30px;font-weight:700;font-size:.88rem;opacity:0;pointer-events:none;transition:.25s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#backToTopBtn{position:fixed;bottom:84px;right:16px;z-index:999;width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-size:1.25rem;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .25s,transform .15s;padding:0}
#backToTopBtn.show{display:flex;opacity:1}
#backToTopBtn:active{transform:scale(.9)}
#backToTopBtn:focus{outline:none}
#backToTopBtn:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
@media(min-width:940px){#backToTopBtn{right:calc(50vw - 470px)}}
#listenFab{position:fixed;bottom:140px;right:16px;z-index:999;width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--teal),var(--purple));color:#fff;font-size:1.2rem;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#listenFab:active{transform:scale(.9)}
#listenFab:focus{outline:none}
#listenFab:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
@media(min-width:940px){#listenFab{right:calc(50vw - 470px)}}
#listenBar{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--card);border-top:3px solid var(--purple);box-shadow:0 -4px 20px rgba(0,0,0,.18);padding:10px 12px calc(10px + env(safe-area-inset-bottom));font-family:inherit}
.lb-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lb-lab{flex:1;font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-x{background:none;border:none;color:var(--muted);font-size:1.05rem;cursor:pointer;padding:4px 8px;font-family:inherit}
.lb-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lb-btn{font-family:inherit;font-size:1.05rem;padding:9px 14px;border-radius:12px;border:2px solid var(--card-border);background:var(--bg2);color:var(--ink);cursor:pointer;line-height:1}
.lb-main{background:var(--purple);border-color:var(--purple);color:#fff;min-width:62px}
.lb-sp{display:flex;gap:5px}
.lb-rate{font-family:inherit;font-size:.75rem;font-weight:700;padding:7px 10px;border-radius:999px;border:2px solid var(--card-border);background:var(--card);color:var(--ink);cursor:pointer}
.lb-rate.on{background:var(--teal);border-color:var(--teal);color:#fff}
.listen-now{outline:3px solid var(--purple);outline-offset:4px;border-radius:14px}
body:has(#listenBar) footer{padding-bottom:120px}
</style>
</head>
<body data-theme="day">

<div class="topbar">
  <div>
    <h1>🧪 NUR 256 — Unit 1 Study Lab</h1>
    <span class="sub">Aging • Chronic Illness • Cancer • Perioperative • End-of-Life</span>
  </div>
  <div class="toggles">
    <button class="tbtn" id="themeBtn" onclick="toggleTheme()">🌙 Night</button>
    <button class="tbtn" id="mobileBtn" onclick="toggleMobile()">🔍 Big Text</button>
    <button class="tbtn" id="shuffleBtn" onclick="toggleShuffle()">🔀 Shuffle: ON</button>
  </div>
</div>

<div class="progwrap">
  <div class="progbar-bg"><div class="progbar" id="progbar"></div></div>
  <div class="progtext" id="progtext">0 quiz questions answered • Let's go! 💪</div>
  <div style="text-align:center;margin-top:6px"><button onclick="resetAllProgress()" style="background:none;border:none;color:var(--muted);font-size:.68rem;text-decoration:underline;cursor:pointer">↺ reset my saved progress</button></div>

function saveProgress(){ try{ localStorage.setItem('nur256u1_progress', JSON.stringify([...answeredQs])); }catch(e){} }
function resetAllProgress(){ if(!confirm('Reset all saved progress (quiz progress + saved exam + vault + flash game + match games)? This cannot be undone.'))return; answeredQs=new Set(); try{ localStorage.removeItem('nur256u1_progress'); }catch(e){} updateProg(); try{ localStorage.removeItem('nur256u1_exam'); }catch(e){} examState={};examIdx=0;examChecked={};examSubmitted=false;examMode='study';quizSet=[]; if(typeof setExamMode==='function'){ try{ setExamMode('study'); localStorage.removeItem('nur256u1_exam'); }catch(e){} } try{ wrongVault=[]; localStorage.removeItem('nur256u1_vault'); const b=document.getElementById('vaultCount'); if(b)b.textContent='0'; if(typeof renderVaultSection==='function') renderVaultSection(); }catch(e){} try{ flashMastered=new Set(); localStorage.removeItem('nur256u1_flashmastered'); if(typeof buildFlashQueue==='function'){ buildFlashQueue(); drawFlashCard(); } }catch(e){} try{ matchProgress={}; localStorage.removeItem('nur256u1_matchprogress'); localStorage.removeItem('nur256u1_matchbest_meds'); localStorage.removeItem('nur256u1_matchbest_prio'); }catch(e){} try{ notesList=[]; localStorage.removeItem('nur256u1_notes'); if(typeof renderNotes==='function') renderNotes(); }catch(e){} alert('Progress reset. Fresh start!'); }

}

/* ===== WRONG ANSWER VAULT ===== */
let wrongVault=[];
(function restoreVault(){ try{ const r=localStorage.getItem('nur256u1_vault'); if(r) wrongVault=JSON.parse(r); }catch(e){} })();
(function initVaultBadge(){ const b=document.getElementById('vaultCount'); if(b) b.textContent=wrongVault.length; })();
function saveVault(){ try{ localStorage.setItem('nur256u1_vault', JSON.stringify(wrongVault)); }catch(e){} }
function addToVault(entry){
  const idx=wrongVault.findIndex(v=>v.id===entry.id);
  if(idx>=0) wrongVault[idx]=entry; else wrongVault.push(entry);
  saveVault();
  const badge=document.getElementById('vaultCount'); if(badge) badge.textContent=wrongVault.length;
}
function removeFromVault(id){
  wrongVault=wrongVault.filter(v=>v.id!==id);
  saveVault();
  const badge=document.getElementById('vaultCount'); if(badge) badge.textContent=wrongVault.length;
}

function stripLabel(text){ return text.replace(/^[A-Za-z]\.\s*/,''); }
function relabel(optsArr){
  const L=['A','B','C','D','E','F'];
  return optsArr.map((o,i)=>L[i]+'. '+stripLabel(o));
}
function prepareQuestion(qOrig){
  let opts=qOrig.opts.slice();
  let correct=qOrig.type==='multi'?qOrig.correct.slice():qOrig.correct;
  if(shuffleAnswers){
    const order=shuffle(opts.map((_,i)=>i));
    const newOpts=order.map(i=>opts[i]);
    if(qOrig.type==='multi'){
      const correctSet=new Set(correct);
      correct=order.map((origIdx,newIdx)=>correctSet.has(origIdx)?newIdx:null).filter(x=>x!==null);
    } else {
      correct=order.indexOf(correct);
    }
    opts=newOpts;
  }
  return {...qOrig, opts:relabel(opts), correct};
}
let quizTotalCounted=new Set();
function renderQuiz(containerId, questions, title, source, indexMap){
  const host=document.getElementById(containerId);
  if(!host)return;
  host.innerHTML='';
  const wrap=document.createElement('div');
  if(title){ const h=document.createElement('h3'); h.textContent='📝 '+title; h.style.color='var(--pink)'; wrap.appendChild(h); }
  questions.forEach((qOrig,localIdx)=>{
    const qi = indexMap ? indexMap[localIdx] : localIdx;
    const q=prepareQuestion(qOrig);
    const qid=containerId+'-'+qi;
    if(!quizTotalCounted.has(qid)){ quizTotalCounted.add(qid); totalTrackable++; }
    const card=document.createElement('div'); card.className='quiz-card';
    const qt=document.createElement('div'); qt.className='q-text'; qt.textContent=(qi+1)+'. '+q.q; card.appendChild(qt);
    const opts=document.createElement('div'); opts.className='opts'; card.appendChild(opts);
    const rat=document.createElement('div'); rat.className='rationale'; rat.innerHTML='<b>Rationale:</b> '+q.rat;
    if(q.type==='multi'){
      const chosen=new Set();
      q.opts.forEach((o,i)=>{
        const btn=document.createElement('button'); btn.className='opt'; btn.innerHTML=o;
        btn.onclick=()=>{ if(chosen.has(i)){chosen.delete(i);btn.classList.remove('sel-multi');}else{chosen.add(i);btn.classList.add('sel-multi');} };
        opts.appendChild(btn);
      });
      const sub=document.createElement('button'); sub.className='submit-multi'; sub.textContent='Check Answer';
      sub.onclick=()=>{
        const correct=new Set(q.correct);
        let allRight=chosen.size===correct.size;
        opts.querySelectorAll('.opt').forEach((b,i)=>{
          b.classList.add('disabled');
          if(correct.has(i))b.classList.add('correct');
          else if(chosen.has(i)){b.classList.add('wrong');allRight=false;}
        });
        if(!allRight){ addToVault({id:qid,q:q.q,opts:q.opts,type:'multi',correct:q.correct,rat:q.rat,source:source||title||''}); }
        rat.classList.add('show'); sub.style.display='none'; bumpProgress(qid);
      };
      card.appendChild(sub);
    } else {
      q.opts.forEach((o,i)=>{
        const btn=document.createElement('button'); btn.className='opt'; btn.innerHTML=o;
        btn.onclick=()=>{
          opts.querySelectorAll('.opt').forEach(b=>b.classList.add('disabled'));
          if(i===q.correct)btn.classList.add('correct');
          else{
            btn.classList.add('wrong'); opts.querySelectorAll('.opt')[q.correct].classList.add('correct');
            addToVault({id:qid,q:q.q,opts:q.opts,type:'single',correct:q.correct,rat:q.rat,source:source||title||''});
          }
          rat.classList.add('show'); bumpProgress(qid);
        };
        opts.appendChild(btn);
      });
    }
    card.appendChild(rat);
    wrap.appendChild(card);
  });
  host.appendChild(wrap);
}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);}

/* ===== VISION-ONLY FILTER ENGINE ===== */
let hotOnlyGlobal=false;
let quizFilterState={};
(function restoreVisionOnly(){ try{ if(localStorage.getItem('nur256u1_hotonly')==='1') hotOnlyGlobal=true; }catch(e){} })();
function renderFilteredQuiz(containerId, allQuestions, title, source, total){
  const host0=document.getElementById(containerId);
  if(host0 && total && total>allQuestions.length){
    const note=document.createElement('div');
    note.className='tipbar'; note.id=containerId+'-poolnote';
    note.innerHTML='\uD83D\uDCDD <b>'+allQuestions.length+' questions</b>, freshly drawn from a pool of <b>'+total+'</b> on this topic. '
      + '<button class="mini" style="margin-left:6px" onclick="refreshSecQuiz(\''+containerId+'\')">\uD83D\uDD04 New '+allQuestions.length+'</button>'
      + '<br><span style="font-size:.85em">Each draw mixes high-yield items with ones you may not have seen yet, so repeat rounds are not the same set reshuffled.</span>';
    host0.parentNode.insertBefore(note, host0);
  }
  quizFilterState[containerId]={allQuestions,title,source};
  applyQuizFilter(containerId);
}
function applyQuizFilter(containerId){
  const state=quizFilterState[containerId];
  if(!state)return;
  const filtered=[], indices=[];
  state.allQuestions.forEach((q,i)=>{
    if(!hotOnlyGlobal || q.hot){ filtered.push(q); indices.push(i); }
  });
  if(filtered.length===0){
    const host=document.getElementById(containerId);
    if(host) host.innerHTML='<div class="card" style="text-align:center;color:var(--muted)">No high-yield questions in this set yet.</div>';
    return;
  }
  renderQuiz(containerId, filtered, state.title, state.source, indices);
}
function toggleHotOnly(){
  hotOnlyGlobal=!hotOnlyGlobal;
  try{ localStorage.setItem('nur256u1_hotonly', hotOnlyGlobal?'1':'0'); }catch(e){}
  Object.keys(quizFilterState).forEach(applyQuizFilter);
  updateHotToggleButtons();
  if(typeof examMode!=='undefined' && typeof buildQuizSet==='function'){ buildQuizSet(examMode); examIdx=0; saveExam(); drawExamQ(); }
  if(typeof startDrill==='function' && document.getElementById('drillBody')) startDrill();
  if(typeof renderPicker==='function') renderPicker();
  setTimeout(updateHotToggleButtons,0);
}
function updateHotToggleButtons(){
  document.querySelectorAll('.vision-toggle-btn').forEach(b=>{ b.textContent = hotOnlyGlobal ? '🔥 High-Yield Only: ON' : '🔥 High-Yield Only: OFF'; });
}

function toast(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800)}

/* map EXAM-shaped items into the section-quiz shape the quiz engine expects */
const SECTION_QUIZ_SIZE = 18;
const SEC_POOLS = {};
function secMap(list){
  return list.map(x=>({q:x.q,opts:x.o.slice(),correct:(x.t==='multi'?x.c.slice():x.c),type:(x.t==='multi'?'multi':'single'),rat:x.r,hot:!!x.hot,topic:x.topic}));
}
function secSample(mapped, cap){
  if(mapped.length <= cap) return mapped;
  /* Guarantee a majority of high-yield items, but always leave room for the rest
     of the pool so repeat rounds surface questions you have not seen. */
  const hot  = shuffle(mapped.filter(q=>q.hot));
  const rest = shuffle(mapped.filter(q=>!q.hot));
  const hotWant = Math.min(hot.length, Math.max(1, Math.round(cap*0.6)));
  let out = hot.slice(0, hotWant).concat(rest.slice(0, cap - hotWant));
  if(out.length < cap){                      /* pool was short on one side */
    const used = new Set(out);
    out = out.concat(hot.concat(rest).filter(q=>!used.has(q)).slice(0, cap-out.length));
  }
  return shuffle(out);
}
function secQ(list, n){ return secSample(secMap(list), n || SECTION_QUIZ_SIZE); }
function secQTotal(list){ return list.length; }
function refreshSecQuiz(id){
  const p = SEC_POOLS[id];
  if(!p) return;
  const note = document.getElementById(id+'-poolnote');
  if(note) note.remove();
  renderFilteredQuiz(id, secSample(p.mapped, p.cap), p.title, p.source, p.mapped.length);
  const host = document.getElementById(id);
  if(host) host.scrollIntoView({behavior:'smooth', block:'start'});
  if(typeof toast==='function') toast('Fresh set of '+Math.min(p.cap,p.mapped.length));
}

  window.addEventListener('scroll', sync, {passive:true});
  sync();
})();

{topic:'chronic',hot:true,q:'A patient with multiple chronic conditions sees several specialists. What is the nurse\'s most important role in coordinating this care?',o:['Coordinate across specialists, reconcile medications, and catch duplication','Direct each specialist to manage their own condition without cross-consultation','Have the patient choose one condition to prioritize so the plan stays simple','Schedule the appointments and let each provider manage their own order set'],c:0,t:'single',r:'With multiple chronic conditions the nurse\'s key role is <b>coordination</b> — reconciling meds, spotting conflicting or duplicate therapy, and connecting the specialists\' plans. Letting specialists work in silos, making the patient drop a condition, or just booking visits all leave the patient to navigate fragmented care alone, which drives errors and avoidable hospitalizations. The distractors are realistic but passive.'},
{topic:'resp',hot:false,q:'CAUSE — What is the underlying problem in asthma?',o:['Infectious fluid filling and consolidating the alveoli','Air trapped in the pleural space compressing the lung','Irreversible destruction of the alveolar walls','Reversible airway inflammation and bronchoconstriction'],c:3,t:'single',r:'Asthma = REVERSIBLE inflammation + bronchoconstriction + mucus in hyperreactive airways. (Irreversible destruction = emphysema; alveolar fluid = pneumonia/ARDS; pleural air = pneumothorax.)'},
{topic:'meds',hot:false,q:'An older adult on several medications, including one cleared by the liver, asks why the provider started a low dose. The nurse\'s best explanation is that:',o:['Older adults need higher doses to achieve a therapeutic serum level','Reduced hepatic and renal clearance allows the drug to accumulate','Low doses are chosen because they do not produce adverse effects','The pharmacy was unable to supply the standard strength today'],c:1,t:'single',r:'Because aging <b>slows hepatic metabolism and renal excretion</b>, standard doses can accumulate to toxic levels, so providers \'start low and go slow.\' Low doses still can cause effects (just less risk), older adults generally need the SAME or LOWER doses (not higher), and the explanation is physiologic, not a supply issue.'},

{topic:'aging',hot:true,q:'Why do geriatric syndromes require a multidisciplinary approach?',o:['They resolve without intervention in most cases','They are caused by a single treatable organ failure','They only occur in patients over age 90','They have multiple contributing causes across body systems'],c:3,t:'single',r:'Geriatric syndromes do not map to one organ system. Because the causes are <b>multifactorial</b>, they need a <b>multidisciplinary and comprehensive assessment</b> — nursing, PT, OT, dietitian, pharmacy, social work. Sending the patient to one specialist and stopping there is incomplete.'},
{topic:'cancer',hot:true,q:'NGN — Cancer prevention levels. A nurse plans community cancer programs. Match the action to the correct prevention level by selecting the PRIMARY-prevention activities. Select all that apply.',o:['Teaching tobacco cessation and healthy diet','HBV vaccination to prevent liver cancer','Screening mammography to find early cancer','Administering the HPV vaccine','Monitoring a survivor for a second cancer'],c:[0,1,3],t:'multi',r:'<b>Primary</b> = prevent cancer before it starts: HPV/HBV vaccines, tobacco cessation, diet/activity. <b>Secondary</b> = screening/early detection (mammography, colonoscopy, Pap). <b>Tertiary</b> = monitoring survivors for recurrence/second cancers.'},

{topic:'resp',hot:true,q:'A nurse notes CONTINUOUS bubbling in the water-seal chamber of a patient\'s chest drainage system. The patient\'s breathing is becoming labored. What is the priority concern?',o:['The lung has fully re-expanded and the tube can be removed','The wall suction is set too low for the ordered pressure','An air leak that could progress to a tension pneumothorax','Normal functioning of the water-seal chamber during breathing'],c:2,t:'single',r:'Continuous water-seal bubbling = air leak. Combined with worsening respiratory status, suspect a developing tension pneumothorax — assess connections and the patient, and notify the provider.'},
{topic:'resp',hot:false,q:'A patient recovering from a stroke with dysphagia is at high risk for aspiration pneumonia. Which intervention best reduces this risk?',o:['Feed quickly with larger bites to reduce mealtime fatigue','Position the patient flat during meals to slow the swallow','Offer all liquids through a straw to improve bolus control','Keep HOB elevated 30-45 degrees and get a swallow evaluation'],c:3,t:'single',r:'Aspiration prevention = <b>HOB elevated 30–45°, swallow evaluation, upright positioning, small bites, and avoiding straws</b>. Lying flat or rushing increases aspiration risk.'},

{topic:'eol',hot:false,q:'A family is distressed that their dying mother has stopped eating. What is the nurse\'s best response?',o:['Decreased appetite is expected; offer food without forcing it','Encourage her to finish each meal to prevent weakness','Request an order for appetite stimulants immediately','Insert a feeding tube to maintain her strength'],c:0,t:'single',r:'<b>Anorexia is expected and normal</b> as death approaches. Artificial nutrition at this stage does not extend life or improve comfort, and forcing intake causes aspiration and distress. Offer, do not force.'},
{topic:'pre',hot:false,q:'Immediate preoperative interventions the nurse completes before transport to the OR include: Select all that apply.',o:['Verify the surgical site is marked','Have the patient void and remove dentures/jewelry/nail polish','Confirm patient identity and allergies','Give a large breakfast','Ensure consent is signed'],c:[0,1,2,4],t:'multi',r:'Immediate preop: verify ID/allergies, signed consent, void, remove dentures/jewelry/polish (airway and assessment safety), and confirm site marking. <b>A large breakfast violates NPO</b> and risks aspiration — patients are NPO before surgery.'},
{topic:'eol',hot:true,q:'A patient with advanced cancer has constant pain. Which approach is best?',o:['Long-acting analgesics scheduled around the clock with breakthrough doses','Withholding opioids until the pain becomes severe','Non-pharmacologic measures alone to avoid dependence','PRN short-acting analgesics only when the patient requests them'],c:0,t:'single',r:'Advanced cancer care emphasizes <b>prevention and management of pain</b> using <b>long-acting analgesic agents</b> scheduled around the clock, with breakthrough doses on top. Chasing pain that has already escalated requires higher doses for less relief.'},
{topic:'cancer',hot:true,q:'Which statement correctly distinguishes a MALIGNANT tumor from a benign one?',o:['Localized cells that displace tissue but rarely lead to patient death','Slow-growing cells that produce no systemic effects on the host at all','Undifferentiated cells that invade nearby tissue and metastasize','Well-differentiated encapsulated cells confined to their tissue of origin'],c:2,t:'single',r:'<b>Malignant</b> cells are <b>undifferentiated</b> (little resemblance to origin tissue), overcome contact inhibition to <b>invade/infiltrate</b>, and <b>metastasize</b> via blood/lymph, often causing systemic effects (anemia, weight loss, CACS) and, untreated, death. Well-differentiated, encapsulated, slow-growing, localized, and non-systemic all describe BENIGN tumors.'},
{topic:'post',hot:true,q:'The nurse is caring for a patient reporting pain of 8/10. The nurse gives the prescribed pain medication. One hour later the patient still reports 8/10. Which action is appropriate now?',o:['Report to the health-care provider by telephone','Increase the dosage of the medication','Include in the nursing report that the medication is ineffective','Wait for the provider to make rounds to report the problem'],c:0,t:'single',r:'The medication didn\'t work, so the nurse <b>evaluates and escalates now</b> — notify the provider by phone (use SBAR). Waiting for rounds delays relief; the nurse cannot independently increase a dose; just charting it isn\'t enough. This is the evaluation step driving action.'},
{topic:'chronic',hot:false,q:'Which finding in a patient with a chronic illness most suggests the nurse should reassess the self-management plan?',o:['The patient asks the nurse to review the action plan again','The patient\'s spouse attends appointments and takes notes','The patient reports occasional frustration with the daily routine','The patient can name the medications but not what each one treats'],c:3,t:'single',r:'Naming a drug without knowing its purpose means the regimen is being followed <b>by rote</b>, which collapses the moment something changes: a missed dose, a new symptom, an illness day. Frustration is normal, requesting review is engagement, and family involvement is a strength.'},
{topic:'pre',hot:true,q:'During the preoperative systems review, a patient reveals a history of renal disease. Which labs would need to be evaluated?',o:['BUN, creatinine, electrolytes','White blood cell count with PT/INR','Fasting lipid panel and hemoglobin A1c','H&H, liver function tests, and albumin'],c:0,t:'single',r:'Renal function is assessed with <b>BUN, serum creatinine, and electrolytes</b>. Kidneys clear anesthetics and drugs and balance fluids/electrolytes — impaired function raises surgical risk. (LFTs assess liver; PT/INR assess clotting.)'},
{topic:'cancer',hot:false,q:'Which medical management is used for tumor lysis syndrome?',o:['Vertebral augmentation and steroids','Anticoagulation and radiation therapy','Bisphosphonate therapy and calcitonin','Fluid hydration, diuresis, and allopurinol therapy'],c:3,t:'single',r:'TLS is managed with <b>fluid hydration, diuresis, and allopurinol</b> (or rasburicase) to lower uric acid, plus treatment of hyperkalemia and dialysis if severe. Prevention is <b>hydration and allopurinol started before chemotherapy</b>.'},
{topic:'eol',hot:false,q:'A dying patient\'s family asks why the nurse keeps repositioning and giving mouth care if the patient is \'not going to make it.\' The nurse explains that these comfort measures:',o:['Can still reverse the patient\'s decline if performed consistently','Protect the family from experiencing guilt after the patient dies','Are mandated by facility policy regardless of the patient\'s wishes','Maintain comfort and dignity when cure is no longer possible'],c:3,t:'single',r:'At end of life, comfort measures (repositioning, mouth care, symptom relief) exist to preserve <b>comfort and dignity</b> — not to reverse decline or prolong life. They are guided by the patient\'s goals/wishes, not blanket policy, and although they do comfort the family, their purpose is the PATIENT\'s wellbeing. The distractors each contain a kernel of truth, which is what makes them tempting.'},
{topic:'chronic',hot:false,q:'Which are structural barriers to health care for people with disabilities?',o:['Stairs, lack of ramps, narrow doorways, inaccessible restrooms','Limited appointment availability','Insurance copayments and deductibles','Provider attitudes and assumptions'],c:0,t:'single',r:'<b>Structural barriers</b> are physical features of the environment: stairs, no ramps, narrow doorways, inaccessible restroom facilities, and exam tables that do not lower. Attitudinal and financial barriers are real too, but they are separate categories.'},
{topic:'chronic',hot:false,q:'A male veteran age 68 is admitted. Which chronic conditions should the nurse anticipate screening for?',o:['Multiple sclerosis and lupus','Coronary artery disease and cancer','Type 1 diabetes and cystic fibrosis','Sickle cell disease and hemophilia'],c:1,t:'single',r:'Veterans have a <b>higher prevalence of multiple chronic conditions</b>. Male veterans commonly have hypertension, arthritis, and COPD; those <b>65 and older</b> add <b>coronary artery disease and cancer</b>. Female veterans commonly have arthritis, hypertension, and asthma.'},
{topic:'chronic',hot:false,q:'NGN — The nurse begins caring for a newly admitted patient with heart failure. Which action represents the ASSESSMENT step of the nursing process? Select all that apply.',o:['Administering the prescribed diuretic','Setting a goal of \'clear lung sounds by discharge\'','Auscultating lung sounds and weighing the patient','Measuring oxygen saturation and edema','Reviewing the patient\'s reported shortness of breath'],c:[2,3,4],t:'multi',r:'<b>Assessment</b> = collecting subjective and objective data: lung sounds, weight, reported symptoms, O2 sat, edema. Setting a goal is <b>planning</b>; giving the diuretic is <b>implementation</b>. Knowing which step an action belongs to is a classic NGN format.'},
{topic:'intra',hot:true,q:'NGN — Malignant hyperthermia. Minutes after induction with a volatile anesthetic and succinylcholine, a patient develops HR 168, rising end-tidal CO2, and jaw rigidity. Select ALL appropriate nursing actions/recognitions.',o:['Expect a rapid rise in temperature as a LATE sign','Initiate cooling measures and 100% oxygen','Anticipate giving dantrolene','Recognize this as malignant hyperthermia','Continue the triggering anesthetic'],c:[0,1,2,3],t:'multi',r:'MH is a genetic hypermetabolic crisis triggered by <b>volatile anesthetics + succinylcholine</b>. EARLY signs: tachycardia, rising EtCO2 (hypercapnia), masseter/jaw rigidity. <b>Temperature spike is a LATE sign.</b> Treatment: STOP the trigger, give <b>dantrolene</b>, cool the patient, 100% O2, correct acidosis/electrolytes. Continuing the trigger would be fatal.'},
{topic:'cancer',hot:true,q:'A patient is discharged after receiving chemotherapy. Which home instruction is essential?',o:['Flush the toilet twice with the lid closed for 48 hours','Wash contaminated linens with the family laundry','Resume sharing all household facilities immediately','Crush pills that are difficult to swallow'],c:0,t:'single',r:'Cytotoxic drugs are excreted in urine, stool, vomit, and sweat for about <b>48 hours</b>. <b>Double flush with the lid closed</b>, use a <b>separate bathroom</b> when possible, wash contaminated laundry separately and twice, and wear gloves handling body fluids. <b>Chemotherapy drugs are never crushed.</b>'},
{topic:'resp',hot:false,q:'Which instructions should the nurse give a patient after an episode of epistaxis? Select all that apply.',o:['Avoid heavy lifting and straining','Blow the nose to clear remaining clots','Use a humidifier at home','Avoid blowing the nose forcefully','Avoid aspirin and NSAIDs unless approved','Tilt the head back if bleeding recurs'],c:[0,2,3,4],t:'multi',r:'After epistaxis, avoid anything that raises pressure or disrupts the clot: <b>no forceful blowing, no straining or heavy lifting</b>, and no aspirin or NSAIDs. Humidification prevents drying and recurrence. Tilting back is always wrong.'},
{topic:'pre',hot:false,q:'A diabetic patient is scheduled for surgery. Which preoperative goal is a priority to reduce complications?',o:['Maintain near-normal glucose to lower infection risk','Hold all insulin and oral agents for 24 hours before the procedure','Give the full usual insulin dose even though the patient is NPO','Allow glucose to run high to prevent intraoperative hypoglycemia'],c:0,t:'single',r:'The preop goal is <b>controlled, near-normal glucose</b> — hyperglycemia impairs wound healing and raises SSI risk. \'Run it high to avoid lows\' overshoots and harms healing; holding everything for 24 h risks DKA in type 1; giving the FULL usual insulin dose while NPO risks dangerous hypoglycemia. Real practice adjusts the dose (often a reduced basal) — both extremes are wrong, which is the trap.'},
{topic:'resp',hot:true,q:'Which statement about oxygen in COPD is the BEST guidance?',o:['Keep SpO₂ at 100% at all times','Always give 100% oxygen to maximize saturation','Oxygen is never given to COPD patients','Target an SpO₂ of 88–92%'],c:3,t:'single',r:'Absolute-word traps: "always 100%," "never," and "100% at all times" are all false. The BEST guidance is the controlled target of 88–92% to avoid blunting the hypoxic drive.'},
{topic:'cancer',hot:true,q:'A 62-year-old on day 10 of a chemotherapy cycle presents with temperature 100.8F, HR 112, BP 96/58, RR 22, and ANC 240/mm3. The site of a peripheral IV placed yesterday looks normal. Which actions should the nurse take? Select all that apply.',o:['Initiate broad-spectrum IV antibiotics within one hour','Begin isotonic IV fluid resuscitation for the hypotension','Reassure the patient that a normal-appearing IV site rules out infection','Place the patient on protective (neutropenic) precautions','Wait for the fever to reach 101F before notifying the provider','Obtain blood cultures from two sites before starting antibiotics'],c:[0,1,3,5],t:'multi',r:'This is <b>neutropenic sepsis</b>. Fever plus ANC under 500 is an emergency: cultures, antibiotics within 60 minutes, fluids for the hypotension, and protective precautions. Waiting for a higher fever is fatal reasoning because a neutropenic patient may never mount one. A normal-looking site proves nothing, since <b>without neutrophils there is no inflammation to see</b>.'},
{topic:'resp',hot:false,q:'Which are diagnostic criteria/hallmarks of acute respiratory failure? (Select all that apply)',o:['PaCO₂ greater than 50 mmHg','pH greater than 7.50','PaO₂ less than 60 mmHg','pH less than 7.35','SpO₂ of 99%'],c:[0,2,3],t:'multi',r:'ARF: PaO₂ under 60, PaCO₂ over 50, and pH under 7.35. SpO₂ 99% and alkalotic pH do not fit.'},
{topic:'intra',hot:false,q:'During surgery the patient develops sudden hypotension, bronchospasm, and urticaria after a medication is given. The nurse suspects:',o:['Hypothermia','Anaphylaxis','Malignant hyperthermia','Anesthesia awareness'],c:1,t:'single',r:'<b>Anaphylaxis</b>: rapid hypotension, bronchospasm, and urticaria after an allergen (drug, latex). Remove the cause and treat emergently. MH shows tachycardia/rising EtCO2/rigidity/late temp spike; hypothermia is low temperature; anesthesia awareness is intraoperative consciousness — none match the allergic triad.'},
{topic:'cancer',hot:true,q:'Which tissues are most affected by chemotherapy? Select all that apply.',o:['Gastrointestinal epithelium','Bone marrow','Hair follicles','Articular cartilage','Skeletal muscle','Cortical brain tissue'],c:[0,1,2],t:'multi',r:'Chemotherapy kills <b>rapidly dividing</b> cells. The fastest-dividing normal tissues are <b>bone marrow, GI epithelium, and hair follicles</b>. Muscle, brain, and cartilage divide slowly and are largely spared — they appear as distractors every time.'},
{topic:'cancer',hot:true,q:'A patient reports fatigue that does not improve with sleep. Which response is best?',o:['Increase caffeine to maintain alertness','Stop all activity until counts recover','Remain in bed until the fatigue resolves','Plan rest before exhaustion and include light activity'],c:3,t:'single',r:'<b>Cancer-related fatigue is the most common side effect and is not relieved by sleep.</b> Energy conservation plus <b>light activity</b> helps; complete inactivity worsens deconditioning and fatigue.'},
{topic:'aging',hot:false,q:'The \'geriatric triad\' the nurse focuses on preventing during hospitalization includes changes in cognition, incontinence, and:',o:['Falls','Malnutrition','Pressure injuries','Polypharmacy'],c:0,t:'single',r:'The classic <b>geriatric triad</b> is cognitive changes, <b>falls</b>, and incontinence. Pressure injuries, polypharmacy, and malnutrition are all real geriatric concerns and common distractors, but they are not the three that define the named triad — falls completes it.'},
{topic:'pre',hot:false,q:'An adult is scheduled for elective surgery in the morning. NPO teaching based on ERAS/guidelines is:',o:['NPO for all food and fluids for a full 24 hours before the scheduled time','Fast 8 hr after fatty food, 6 hr after a light meal, clear liquids to 2 hr','NPO after midnight for everything, with no exception made for clear liquids','Hold solids after midnight but allow milk and pulp-free juice until arrival'],c:1,t:'single',r:'Current ERAS guidance: ~8 hr after fatty/fried food, 6 hr after a light meal or milk, and <b>clear liquids up to 2 hr</b> before elective surgery — this prevents aspiration without unnecessary dehydration. \'24 hours NPO\' over-restricts; milk/juice are NOT clear liquids and need 6 hr; the rigid \'NPO after midnight, no exceptions\' is the outdated practice ERAS replaced. The distractors are all old or near-miss rules.'},
{topic:'eol',hot:false,q:'A patient with advanced cancer has intractable pain unrelieved by medication. Which intervention may be considered?',o:['Discontinuing all analgesics to reset tolerance','Increasing activity to distract from the pain','Restricting fluids to reduce tissue pressure','Percutaneous nerve block or cordotomy'],c:3,t:'single',r:'For intractable pain, <b>percutaneous nerve block and cordotomy</b> are options, as are <b>radiation therapy or surgical intervention</b> for symptom relief. Discontinuing analgesics or restricting fluids would worsen suffering.'},
{topic:'resp',hot:true,q:'A child is 4 hours post-tonsillectomy. Which finding requires immediate action?',o:['A low-grade temperature of 99.8F','Refusal to drink cold fluids','Frequent swallowing','A sore throat rated 4 of 10'],c:2,t:'single',r:'<b>Frequent swallowing is the earliest sign of postoperative hemorrhage</b> — blood is trickling down the back of the throat. Also watch for restlessness and tachycardia. Sore throat and reluctance to drink are expected.'},
{topic:'aging',hot:true,q:'An older adult is admitted for a hip fracture. Which integumentary change most increases the risk of injury during care?',o:['Thinner dermis with reduced elastic fibers and less subcutaneous fat','Increased subcutaneous fat improving padding','Accelerated epidermal proliferation and faster healing','Thicker epidermis with increased collagen elasticity'],c:0,t:'single',r:'Aging skin has <b>decreased epidermal proliferation, a thinner dermis, reduced elastic fibers, stiffer collagen, and less subcutaneous fat</b>. That means impaired <b>temperature regulation</b> and greater susceptibility to <b>burns, injury, and infection</b>.'},
{topic:'aging',hot:true,q:'Which are NORMAL age-related (head-to-toe) changes the nurse expects in a healthy older adult? Select all that apply.',o:['Decreased aerobic capacity (~10% per decade)','Decreased kidney mass and filtration rate','Decreased gastric motility and slower absorption','Decreased skin elasticity and thinner dermis','Sudden confusion and severe memory loss'],c:[0,1,2,3],t:'multi',r:'Normal aging: lungs lose aerobic capacity, skin thins/loses elasticity, kidneys lose nephrons and GFR, GI motility slows. <b>Sudden confusion is NOT normal aging</b> — it signals delirium, infection, or another acute problem and must be reported.'},
{topic:'cancer',hot:false,q:'Which nursing actions apply to a patient with chemotherapy-induced mucositis? Select all that apply.',o:['Rinse with normal saline every 2 to 4 hours','Use lemon-glycerin swabs for freshness','Provide a topical anesthetic before meals','Offer soft, bland, room-temperature foods','Encourage citrus juices to stimulate saliva','Assess the oral cavity every shift'],c:[0,2,3,5],t:'multi',r:'Mucositis care protects fragile ulcerated tissue: <b>saline or bicarbonate rinses, soft bland room-temperature foods, shift assessments, and topical anesthetic before meals</b>. <b>Lemon-glycerin swabs dry and irritate</b>, and <b>acidic citrus burns</b> open ulcers.'},
{topic:'resp',hot:true,q:'A post-op patient refuses to deep breathe due to pain and develops diminished breath sounds at the right base. The priority is to prevent:',o:['Pneumothorax','Pleural effusion','Pulmonary embolism','Atelectasis'],c:3,t:'single',r:'Shallow breathing collapses alveoli → atelectasis. Encourage incentive spirometry, coughing, deep breathing.'},
{topic:'resp',hot:true,q:'Which is the BEST first action for a patient who becomes dyspneic with new crackles during an IV infusion?',o:['Lay the patient flat to improve venous return quickly','Increase the IV rate to flush the line and clear it','Slow or stop the infusion and raise the head of the bed','Give the next scheduled antibiotic dose and reassess'],c:2,t:'single',r:'New crackles + dyspnea = fluid overload. BEST first action: reduce the fluid going in and sit them up to ease breathing. Lying flat or increasing the rate makes it worse.'},
{topic:'pre',hot:false,q:'A patient with type 2 diabetes is scheduled for surgery at 0730 and is NPO. Which preoperative order should the nurse question?',o:['Start a maintenance IV of dextrose-containing solution','Check a fingerstick glucose on arrival to the preop area','Hold the metformin dose on the morning of surgery','Administer the usual full morning dose of regular insulin'],c:3,t:'single',r:'A <b>full mealtime insulin dose in an NPO patient</b> produces hypoglycemia under anesthesia, where the symptoms are masked. Typically basal insulin is reduced and short-acting mealtime insulin is held. Checking glucose, holding metformin, and running dextrose are all appropriate.'},
{topic:'cancer',hot:true,q:'The mnemonic CAUTION helps identify the seven warning signs of cancer. Which finding fits the \'U\' in CAUTION?',o:['Unilateral weakness or numbness','Unusual bleeding or discharge','Unexplained fatigue lasting several weeks','Uncontrolled high blood pressure'],c:1,t:'single',r:'In <b>CAUTION</b>, U = <b>Unusual bleeding or discharge</b>. The full mnemonic: Change in bowel/bladder habits, A sore that won\'t heal, Unusual bleeding/discharge, Thickening or lump, Indigestion/difficulty swallowing, Obvious change in a wart/mole, Nagging cough/hoarseness. Fatigue, focal weakness, and hypertension are real concerns but aren\'t the classic CAUTION warning signs.'},
{topic:'resp',hot:false,q:'A nurse is caring for a patient with COPD. Which oxygen saturation goal is appropriate?',o:['95–100%','100% always','88–92%','80–85%'],c:2,t:'single',r:'COPD patients are chronic CO₂ retainers; the target is <b>88–92%</b>. Over-oxygenating can suppress their hypoxic drive to breathe.'},
{topic:'cancer',hot:true,q:'Which personal protective equipment is required when handling chemotherapy?',o:['A cloth gown and standard surgical mask','Gloves only when a spill occurs','Double powder-free gloves, disposable gown, N-95 respirator, eye protection','A single pair of examination gloves'],c:2,t:'single',r:'Handling requires a <b>double layer of powder-free gloves</b>, a <b>long-sleeve disposable gown</b>, a <b>surgical N-95 respirator</b>, and <b>eye and face protection</b>. Gloves must be powder-free because <b>powder aerosolizes drug particles</b>.'},
{topic:'chronic',hot:true,q:'The nurse is applying the nursing process. What is the correct order of its steps (ADPIE)?',o:['Planning → Assessment → Diagnosis → Evaluation → Implementation','Implementation → Evaluation → Assessment → Diagnosis → Planning','Diagnosis → Assessment → Implementation → Planning → Evaluation','Assessment → Diagnosis → Planning → Implementation → Evaluation'],c:3,t:'single',r:'<b>ADPIE</b>: <b>A</b>ssessment (collect data) → <b>D</b>iagnosis (analyze) → <b>P</b>lanning (set goals/outcomes) → <b>I</b>mplementation (act) → <b>E</b>valuation (did it work?). Always assess first; evaluate last. If a step is missing or out of order, it\'s wrong.'},
{topic:'aging',hot:true,q:'Which interventions help prevent geriatric syndromes during hospitalization? Select all that apply.',o:['Keep the bed low with the call light within reach','Use a sedative-hypnotic nightly to ensure rest','Reposition on a schedule and assess skin','Review the medication list for Beers-criteria drugs','Insert a urinary catheter to manage incontinence','Cluster care to protect sleep at night'],c:[0,2,3,5],t:'multi',r:'Prevention targets the <b>modifiable hospital risks</b>: fall precautions, protected sleep, medication review, and skin care. <b>Sedative-hypnotics worsen confusion and falls</b>, and an unnecessary <b>catheter</b> causes infection and immobility — both create the syndromes you are trying to prevent.'},
{topic:'cancer',hot:true,q:'Which findings should the nurse expect in superior vena cava syndrome? Select all that apply.',o:['Dyspnea','Distended neck veins','Serum calcium above 10.4 mg/dL','Cough','Sudden severe back pain','Facial swelling'],c:[0,1,3,5],t:'multi',r:'SVCS presents with <b>dyspnea, cough, facial swelling</b>, periorbital and upper extremity edema, and distended neck and chest veins. Back pain belongs to <b>spinal cord compression</b>; an elevated calcium belongs to <b>hypercalcemia of malignancy</b>.'},
{topic:'pre',hot:false,q:'A preoperative patient signed the consent form yesterday and today says, \'I have decided I do not want the surgery.\' What should the nurse do?',o:['Ask the family to help the patient reconsider the decision','Explain the risks of cancelling and confirm the patient still refuses','Document the statement and continue the preoperative preparation','Stop preparations and notify the surgeon of the patient\'s decision'],c:3,t:'single',r:'<b>Consent is revocable at any time</b>, including after signing and up to the moment of incision. The nurse stops and notifies the surgeon. Persuading, proceeding, or recruiting the family to change the patient\'s mind all violate autonomy. This one punishes anyone who reads \'already signed\' as binding.'},
{topic:'chronic',hot:false,q:'A patient with a new spinal cord injury qualifies for federal assistance. Which program is available specifically to people 65+, those with permanent kidney failure, or qualifying disability?',o:['COBRA continuation coverage','Medicare','Supplemental Security Income (SSI)','Medicaid'],c:1,t:'single',r:'<b>Medicare</b> eligibility = age 65+, permanent kidney failure (ESRD), or qualifying long-term disability — exactly the criteria described. Medicaid is <b>need-based</b> (low income/resources); SSI provides cash assistance, not the health coverage tied to these criteria; COBRA temporarily continues an employer plan after job loss. The distractors are all real assistance programs — match the eligibility wording to Medicare.'},
{topic:'cancer',hot:true,q:'A chemotherapy patient develops a vesicant extravasation at the IV site. What is the nurse\'s FIRST action?',o:['Flush the line with saline','Stop the infusion immediately','Increase the infusion rate','Apply heat and continue the infusion'],c:1,t:'single',r:'<b>Stop the infusion immediately</b> — a vesicant leaking into tissue causes severe necrosis, so halting exposure comes first, then follow the antidote/protocol. Flushing pushes more vesicant into tissue, continuing (with heat or faster rate) worsens the injury. This is an oncologic emergency.'},
{topic:'aging',hot:true,q:'Which three findings make up the geriatric triad?',o:['Constipation, dry skin, and hearing loss','Weight loss, anemia, and fatigue','Hypertension, arthritis, and COPD','Changes in cognitive status, falls, and incontinence'],c:3,t:'single',r:'The <b>geriatric triad</b> is <b>cognitive status change, falls, and urinary incontinence</b>. They cluster and feed each other — confusion causes falls, incontinence causes rushing to the bathroom, and so on. If a stem names one, look for the other two.'},
{topic:'resp',hot:true,q:'A patient develops chills, fever, and back pain 10 minutes into a transfusion. The nurse\'s FIRST action is to:',o:['Administer acetaminophen and keep infusing','Slow the infusion rate and continue to watch','Document the reaction and finish the unit','Stop the blood and keep the NS line open'],c:3,t:'single',r:'STOP the blood immediately and maintain IV access with NS, then notify the provider.'},
{topic:'cancer',hot:true,q:'Which pattern of cellular growth do cancerous cells demonstrate?',o:['Hypertrophy','Metaplasia','Hyperplasia','Neoplasia'],c:3,t:'single',r:'<b>Neoplasia</b> is new, uncontrolled, purposeless growth — the pattern cancer cells show. Atrophy, hypertrophy, hyperplasia, and metaplasia are <b>adaptations</b> to a stress. <b>Dysplasia is precancerous</b>, not cancer.'},
{topic:'chronic',hot:false,q:'Approximately how many Americans live with multiple chronic conditions?',o:['Fewer than five percent','About three quarters','About one tenth','About one third'],c:3,t:'single',r:'<b>One third of Americans have multiple chronic conditions.</b> MCCs carry the risk of <b>conflicting medical advice</b> from different specialists and <b>preventable hospitalizations</b>.'},
{topic:'resp',hot:false,q:'A patient recovering from laryngitis asks how to rest their voice. What should the nurse teach?',o:['Whisper instead of speaking normally','Speak only in short quiet sentences','Hum instead of talking to exercise the cords','Avoid speaking entirely rather than whispering'],c:3,t:'single',r:'<b>Whispering strains the vocal cords more than normal speech</b> because it requires more forceful air movement across tensed cords. True voice rest means not vocalizing.'},
{topic:'resp',hot:true,q:'TREATMENT — A patient is mid-asthma attack with audible wheezing and dyspnea. Which medication is the FIRST-line treatment?',o:['Short-acting beta agonist (albuterol)','Leukotriene receptor blocker','Inhaled corticosteroid daily','Long-acting beta agonist (salmeterol)'],c:0,t:'single',r:'A SABA (albuterol) is the rescue med — it bronchodilates fast. Inhaled steroids and LABAs are controllers, not rescue. Knowing the treatment lets you pick first-line vs maintenance.'},
{topic:'aging',hot:false,q:'Which conditions are considered geriatric syndromes? Select all that apply.',o:['Sleep disturbances','A surgical wound infection','Poor nutrition','Cognitive impairment','Falls','Skin impairment'],c:[0,2,3,4,5],t:'multi',r:'The named geriatric syndromes are <b>skin impairment, poor nutrition, falls, urinary incontinence, cognitive impairment, and sleep disturbances</b>. A surgical wound infection has a single identifiable cause and is not a syndrome in this sense.'},
{topic:'meds',hot:true,q:'Which medication that starts with \'A\' is given to reverse opioid-induced slowing of the bowel (postoperative ileus) by blocking opioid effects in the gut?',o:['Acetaminophen','Atropine','Alvimopan','Allopurinol'],c:2,t:'single',r:'<b>Alvimopan</b> is a peripherally-acting opioid antagonist used for <b>opioid-induced postoperative ileus</b> — it blocks opioids in the gut to restore bowel function without reversing pain control. (Allopurinol → uric acid/tumor lysis; acetaminophen → opioid-sparing pain control; atropine → bradycardia.)'},
{topic:'resp',hot:true,q:'A patient with a chest tube accidentally pulls the tube out of their chest. What should the nurse do FIRST?',o:['Reinsert the chest tube','Lay the patient flat and call radiology','Clamp the drainage tubing','Cover the site with sterile occlusive'],c:3,t:'single',r:'For a dislodged chest tube, immediately cover the insertion site with petroleum/occlusive gauze taped on THREE sides — this lets air escape but prevents air from re-entering and causing a tension pneumothorax. Then notify the provider.'},
{topic:'cancer',hot:false,q:'A patient has a platelet count of 19,000/mm3. Which instruction is appropriate?',o:['Floss twice daily to prevent gum infection','Use a rectal suppository for constipation','Take aspirin for headaches as needed','Use an electric razor and a soft toothbrush without flossing'],c:3,t:'single',r:'<b>Thrombocytopenia precautions</b> prevent any breach of skin or mucosa: electric razor, soft brush, <b>no flossing</b>, no rectal temps or suppositories, no aspirin or NSAIDs, no IM injections.'},
{topic:'chronic',hot:true,q:'U.S. veterans have a higher prevalence of multiple chronic conditions. Which combination is specifically noted as common in male veterans?',o:['Type 1 diabetes, epilepsy, and migraines','Anxiety, IBS, and chronic sinusitis','Asthma, eczema, and seasonal allergies','Hypertension, arthritis, and COPD'],c:3,t:'single',r:'Male veterans most commonly carry <b>hypertension, arthritis, and COPD</b> (with CAD/cancer rising after 65). The other clusters are all real chronic conditions, but they are not the combination specifically noted as most prevalent in male veterans — the MCC pattern reflects age, service exposures, and cardiopulmonary risk.'},
{topic:'cancer',hot:true,q:'A patient on chemotherapy has an oral assessment showing red, ulcerated buccal mucosa. Which mouth care is appropriate?',o:['Soft-bristled brush with normal saline or sodium bicarbonate rinses','Lemon-glycerin swabs every 4 hours','Firm brushing with a whitening toothpaste','Alcohol-based antiseptic mouthwash twice daily'],c:0,t:'single',r:'<b>Stomatitis/mucositis</b> appears 5–14 days after treatment. Care is a <b>soft brush or foam swab with saline or sodium bicarbonate rinses every 2–4 hours</b>. <b>Lemon-glycerin swabs and alcohol-based mouthwash both dry and burn</b> already ulcerated tissue — and both are offered as options.'},
{topic:'intra',hot:true,q:'All nurses, especially perioperative nurses, must screen for and prevent reactions to which common OR allergen?',o:['Povidone-iodine prep','Chlorhexidine skin prep','Adhesive tape','Latex'],c:3,t:'single',r:'<b>Latex</b> is the OR allergen every nurse must screen for and prevent (gloves, tubing, tourniquets) — reactions range from contact dermatitis to anaphylaxis. Chlorhexidine, iodine prep, and adhesives CAN cause reactions too, which makes them tempting, but latex is the classic, high-risk perioperative allergen with formal at-risk groups and latex-free protocols.'},
{topic:'cancer',hot:false,q:'According to cancer prevention guidelines, how many cups of vegetables and fruits should a person eat daily?',o:['At least 1 cup','At least 2.5 cups','At least 8 cups','At least 5 cups'],c:1,t:'single',r:'<b>At least 2.5 cups of vegetables and fruits daily.</b> The full guideline set: maintain a healthy weight, emphasize plant sources, <b>limit processed and red meats</b>, choose whole grains over processed, and limit alcohol.'},
{topic:'resp',hot:true,q:'Which adventitious sound is a medical emergency?',o:['Rhonchi','Wheezes','Stridor','Fine crackles'],c:2,t:'single',r:'Stridor = upper airway obstruction, an emergency.'},
{topic:'cancer',hot:true,q:'A patient with metastatic breast cancer reports new back pain and leg weakness. What is the priority?',o:['Schedule physical therapy for the weakness','Administer the ordered PRN analgesic and reassess','Facilitate urgent imaging for spinal cord compression','Apply heat and encourage rest for muscle strain'],c:2,t:'single',r:'<b>Back or neck pain is the earliest and most common sign of spinal cord compression</b>, followed by motor loss and bladder dysfunction. <b>MRI</b> is the study of choice. Damage occurring before treatment is <b>permanent</b>, so this is a neurologic emergency, not a comfort issue.'},
{topic:'resp',hot:false,q:'A patient\'s Mantoux test is being read. When should the nurse assess the result, and what is measured?',o:['1 week; measure redness','Immediately; measure the wheal','24 hours; measure redness','48–72 hours; measure induration'],c:3,t:'single',r:'Read the Mantoux at <b>48–72 hours</b> and measure the <b>induration</b> (the raised, hardened area), not the redness.'},
{topic:'cancer',hot:false,q:'Which factors are known to induce carcinogenesis? Select all that apply.',o:['Hormones, endogenous or exogenous','Genetic or familial factors','Chemicals such as tobacco','Adequate sleep and hydration','Physical agents such as radiation','Viruses and bacteria such as H. pylori'],c:[0,1,2,4,5],t:'multi',r:'The named categories are <b>viruses and bacteria, physical agents, chemicals, genetic or familial factors, lifestyle factors, and hormones</b>. <b>Cigarette smoking is the major modifiable risk factor</b>, and lifestyle factors account for about <b>16% of cases</b>.'},
{topic:'cancer',hot:true,q:'A patient is diagnosed with superior vena cava syndrome. Which nursing action is essential?',o:['Keep the patient flat to reduce facial pressure','Apply a blood pressure cuff to the affected arm hourly','Obtain all blood samples from the right arm','Avoid venipuncture in the upper extremities'],c:3,t:'single',r:'<b>Avoid upper extremity venipuncture, IVs, and blood pressures.</b> Drainage above the obstruction is already impaired, so sticking or squeezing that arm worsens swelling and gives unreliable readings. Also <b>raise the head of the bed</b> — never lay this patient flat.'},
{topic:'resp',hot:true,q:'In a severe asthma attack, which assessment finding is the MOST concerning?',o:['Audible wheezing throughout expiration','A sudden "silent chest" with no wheezing','Use of the rescue inhaler twice today','A respiratory rate of 24 breaths a minute'],c:1,t:'single',r:'Trap: wheezing "sounds worse," so people pick A. But a silent chest = no air movement = impending respiratory failure, the MOST concerning. Loud wheezing at least means air is moving.'},
{topic:'resp',hot:false,q:'A positive PPD (Mantoux) is read by measuring?',o:['Induration','Redness','The wheal size','Warmth'],c:0,t:'single',r:'Measure induration (raised hardened area) at 48-72 hours.'},
{topic:'post',hot:true,q:'NGN — A patient is 4 hours post-op. Which assessment findings require IMMEDIATE nursing action? Select all that apply.',o:['Saturated dressing with bright-red blood','Urine output 15 mL over the last 2 hours','Pain rated 3/10, relieved by repositioning','Restlessness and cool, clammy skin','BP trending down 120/80 → 94/56 with HR rising to 118'],c:[0,1,3,4],t:'multi',r:'Falling BP with rising HR, frank bleeding, oliguria (<30 mL/hr), and cool/clammy restlessness all point to <b>hemorrhage/hypovolemic shock</b> — act and escalate now. <b>Pain 3/10 relieved by repositioning is expected and stable</b>, so it does not require immediate action.'},
{topic:'aging',hot:false,q:'Which respiratory change is expected in an older adult?',o:['Improved aerobic capacity with age','Decreased residual volume with stronger muscles','Increased residual volume with a weaker chest wall','Increased lung mass and elasticity'],c:2,t:'single',r:'Aging causes <b>calcification and weakening of the chest wall muscles</b>, <b>decreased lung mass</b>, and <b>increased residual volume</b>. Aerobic capacity falls roughly 10% per decade.'},
{topic:'cancer',hot:true,q:'After receiving the hand-off report, which patient would the oncology nurse see FIRST?',o:['Patient scheduled for radiation therapy today','Patient who is neutropenic and in protective isolation','Patient who is afebrile with a heart rate of 108 beats/min','Older patient on chemotherapy with mental status changes'],c:3,t:'single',r:'<b>New mental status changes</b> in an older chemo patient signal something acute (infection/sepsis, metabolic, oncologic emergency) and take priority. The neutropenic isolation patient and the scheduled radiation patient are stable; HR 108 while afebrile is the least urgent. Acute change in condition beats a chronic/stable finding.'},
{topic:'eol',hot:true,q:'A dying patient has increasing dyspnea. Which intervention is first-line?',o:['Deep suctioning to clear the airway','Low-dose opioids to relieve air hunger','A bronchodilator nebulizer treatment','High-flow oxygen by non-rebreather'],c:1,t:'single',r:'<b>Low-dose opioids are first-line for dyspnea at end of life</b> — they blunt the sensation of air hunger. Oxygen is used if it helps the <b>patient</b>, not to correct a number. Deep suctioning is traumatic.'},
{topic:'aging',hot:false,q:'Which cellular change accumulates with aging and reflects declining cellular efficiency?',o:['Excess collagen synthesis','Lipofuscin pigment','Increased elastin production','Accelerated red blood cell formation'],c:1,t:'single',r:'<b>Lipofuscin</b> accumulates inside aging cells. Aging also brings <b>degradation of elastin and collagen</b> and hematopoietic changes that reduce RBC production, which is why <b>rates of anemia increase</b> with age.'},
{topic:'aging',hot:true,q:'A nursing student asks the difference between arteriosclerosis and atherosclerosis. The best explanation is:',o:['Arteriosclerosis affects only coronary vessels while atherosclerosis affects only the legs','Arteriosclerosis is general arterial hardening; atherosclerosis is plaque inside the lumen','Both terms describe venous wall thickening and both reverse fully with statin therapy','Atherosclerosis is the umbrella term and arteriosclerosis is its plaque-forming subtype'],c:1,t:'single',r:'<b>Arteriosclerosis</b> = the broad term for <b>hardening and thickening</b> of arterial walls (loss of elasticity). <b>Atherosclerosis</b> is a <b>specific subtype</b> where fatty <b>plaque (atheroma)</b> builds up inside the lumen, narrowing it and risking clot/MI/stroke. The relationship is reversed in the \'atherosclerosis is the general term\' option — atherosclerosis is the subtype, not the umbrella — and both involve arteries, not veins.'},
{topic:'cancer',hot:false,q:'Which treatments are used for superior vena cava syndrome?',o:['Radiation therapy, chemotherapy, and anticoagulant therapy','Bisphosphonates and calcitonin','Allopurinol and aggressive diuresis','Vertebral augmentation and corticosteroids'],c:0,t:'single',r:'SVCS is managed with <b>radiation therapy, chemotherapy, and anticoagulant therapy</b>, sometimes with stenting. Bisphosphonates treat hypercalcemia, allopurinol treats TLS, and vertebral augmentation is for spinal cord compression.'},
{topic:'intra',hot:true,q:'Thirty minutes into a general anesthetic the end-tidal CO2 is climbing and the heart rate has risen from 78 to 132 with no blood loss. What is the priority action?',o:['Increase the ventilator rate to lower the carbon dioxide','Draw an arterial blood gas and a serum potassium','Obtain a core temperature and apply cooling blankets','Discontinue the triggering agent and prepare dantrolene'],c:3,t:'single',r:'This is <b>malignant hyperthermia</b> presenting with its earliest signs. Stop the trigger and give <b>dantrolene</b> immediately; every minute of delay raises mortality. Cooling, labs, and hyperventilation are all part of the protocol but they are <b>supportive</b>. Treating the CO2 with ventilator changes alone treats the number, not the disease.'},
{topic:'intra',hot:false,q:'Which early sign would alert the nurse to malignant hyperthermia FIRST?',o:['Unexplained tachycardia with a rising end-tidal CO2','Bradycardia with progressive hypothermia and cool, dry skin','A sudden temperature spike to 107F as the earliest change','An isolated drop in blood pressure with no other vital sign change'],c:0,t:'single',r:'The <b>earliest</b> signs are unexplained <b>tachycardia and hypercapnia (rising EtCO2)</b>, often with jaw rigidity. The dramatic temperature rise is a <b>late</b> sign — waiting for it costs critical time.'},
{topic:'intra',hot:true,q:'To prevent perioperative POSITIONING injury, the nurse should: Select all that apply.',o:['Pad bony prominences','Compress arteries to reduce bleeding','Avoid hyperextending joints','Protect nerves from pressure','Maintain correct anatomic alignment'],c:[0,2,3,4],t:'multi',r:'Proper positioning prevents <b>nerve, skin, and circulatory injury</b>: pad bony prominences, keep alignment, avoid hyperextension, and protect nerves/vessels. You would <b>never</b> compress arteries — that causes ischemia.'},
{topic:'resp',hot:true,q:'A patient\'s chest tube is accidentally pulled out. What is the nurse\'s priority action?',o:['Cover the site with sterile occlusive gauze taped on three sides','Lay the patient flat and apply firm pressure over the site','Reinsert the chest tube immediately using sterile technique','Apply a tight occlusive dressing taped down on all four sides'],c:0,t:'single',r:'Cover with <b>sterile occlusive gauze taped on THREE sides</b> — this lets trapped air escape while preventing air from being sucked in, avoiding a tension pneumothorax. Taping all four sides could trap air.'},
{topic:'cancer',hot:false,q:'A patient receiving external beam radiation asks whether visitors need to limit their time. What is the nurse\'s response?',o:['Visitors should stay no longer than 30 minutes','Pregnant visitors and children must not enter','You are not radioactive, so visitors have no restrictions','Visitors must remain behind a lead shield'],c:2,t:'single',r:'<b>External beam radiation leaves no radioactivity in the patient.</b> Time, distance, shielding, and restrictions on pregnant visitors and children apply to <b>brachytherapy (internal implants)</b>, where the patient IS a source.'},
