{topic:'intra',hot:true,q:'The OR team performs a \'time-out\' before incision. The primary purpose is to:',o:['Introduce each surgical team member by name and role to the room','Verify the correct patient, procedure, and surgical site','Confirm the instrument and sponge counts are correct before closing','Review the anesthesia plan and confirm airway rescue equipment'],c:1,t:'single',r:'The <b>time-out</b> (just before incision) verifies <b>correct patient, procedure, and site</b> — the National Patient Safety Goal against wrong-site/wrong-patient surgery. Counts, anesthesia readiness, and team introductions are all genuine parts of the broader surgical safety checklist (often the \'sign-in\'/\'briefing\'), but the TIME-OUT specifically is the final patient/procedure/site verification.'},
{topic:'intra',hot:false,q:'During surgery the patient develops sudden hypotension, bronchospasm, and urticaria after a medication is given. The nurse suspects:',o:['Hypothermia','Anaphylaxis','Malignant hyperthermia','Anesthesia awareness'],c:1,t:'single',r:'<b>Anaphylaxis</b>: rapid hypotension, bronchospasm, and urticaria after an allergen (drug, latex). Remove the cause and treat emergently. MH shows tachycardia/rising EtCO2/rigidity/late temp spike; hypothermia is low temperature; anesthesia awareness is intraoperative consciousness — none match the allergic triad.'},
{topic:'intra',hot:false,q:'Which actions help prevent an operating room fire? Select all that apply.',o:['Store anesthetic gases near ignition sources','Conduct annual fire drills','Complete a fire-risk assessment during the time-out','Manage oxygen concentration near electrocautery/lasers','Allow alcohol-based prep to dry fully before draping'],c:[1,2,3,4],t:'multi',r:'Fire prevention controls the triangle (oxygen + ignition + fuel): risk assessment at time-out, let alcohol prep dry (fuel/vapor), limit O2 buildup near cautery/lasers (ignition), and drill annually. <b>Storing gases near ignition sources</b> is the opposite — it creates fire risk.'},
{topic:'post',hot:true,q:'A patient is 2 days postoperative and suddenly reports sharp chest pain, dyspnea, and anxiety with a drop in SpO2. The nurse suspects which complication?',o:['Atelectasis','Pulmonary embolism','Myocardial infarction','Pneumonia'],c:1,t:'single',r:'<b>Pulmonary embolism</b>: SUDDEN sharp chest pain, dyspnea, anxiety, tachycardia, and a dropping SpO2 a few days postop — classic for a DVT that traveled to the lung. Atelectasis is gradual with diminished bases; an MI gives chest pain but usually with ECG/troponin changes and not a sudden SpO2 drop; pneumonia builds over days with fever and productive cough. All four are real postop chest complaints — the SUDDEN onset + hypoxia points to PE.'},
{topic:'post',hot:false,q:'Which finding in a postoperative patient most indicates a surgical site infection (SSI)?',o:['Serosanguineous drainage during the first 24 hours after surgery','Mild incisional tenderness on the first postoperative day','A dry, intact dressing with no strikethrough noted','Purulent drainage, redness, warmth, fever','Pink, well-approximated wound edges on day three'],c:3,t:'single',r:'SSI signs: <b>purulent drainage, spreading redness/warmth, increasing pain, and fever</b>, usually after postop day 3–5. Pink approximated edges and a dry dressing are normal healing; mild day-1 pain is expected; light serosanguineous drainage early on is normal, not infection.'},
{topic:'post',hot:true,q:'NGN — A patient is 4 hours post-op. Which assessment findings require IMMEDIATE nursing action? Select all that apply.',o:['Saturated dressing with bright-red blood','Urine output 15 mL over the last 2 hours','Pain rated 3/10, relieved by repositioning','Restlessness and cool, clammy skin','BP trending down 120/80 → 94/56 with HR rising to 118'],c:[0,1,3,4],t:'multi',r:'Falling BP with rising HR, frank bleeding, oliguria (<30 mL/hr), and cool/clammy restlessness all point to <b>hemorrhage/hypovolemic shock</b> — act and escalate now. <b>Pain 3/10 relieved by repositioning is expected and stable</b>, so it does not require immediate action.'},
{topic:'post',hot:true,q:'A nurse is teaching a client about antiembolism stockings. The nurse explains that the stockings help prevent deep vein thrombosis (DVT) by:',o:['Encouraging early ambulation, which prevents venous stasis','Providing warmth that dilates the vessels and speeds return','Forcing blood from the superficial into the deep veins','Elevating the extremity so venous blood cannot pool distally'],c:2,t:'single',r:'Antiembolism stockings use <b>graduated compression</b> (tightest at the ankle) to push blood out of the superficial veins and <b>into the deep venous system</b>, improving venous return and reducing stasis. They don\'t elevate the limb, they aren\'t a form of ambulation, and warmth isn\'t the mechanism — the compression gradient is what prevents DVT.'},
{topic:'post',hot:true,q:'A nurse is prioritizing postoperative nursing problems. Which sequence correctly orders them from HIGHEST to LOWEST priority?',o:['Impaired Gas Exchange → Fluid Volume Deficit → Altered Comfort → Anxiety → Risk for Infection','Fluid Volume Deficit → Impaired Gas Exchange → Altered Comfort → Anxiety → Risk for Infection','Impaired Gas Exchange → Altered Comfort → Fluid Volume Deficit → Risk for Infection → Anxiety','Risk for Infection → Impaired Gas Exchange → Fluid Volume Deficit → Anxiety → Altered Comfort'],c:0,t:'single',r:'Use <b>ABCs + Maslow</b>: <b>Impaired Gas Exchange</b> (airway/breathing) is always first, then <b>Fluid Volume Deficit</b> (circulation), then <b>Altered Comfort</b> (pain — physiologic but not immediately life-threatening), then <b>Anxiety</b> (psychosocial), and finally <b>Risk for Infection</b> (a \'risk\'/potential problem ranks below actual problems). Oxygenation beats circulation, and an actual problem beats a potential one.'},
{topic:'post',hot:false,q:'When a surgeon performs a routine, non-ruptured appendectomy, the nurse recognizes that the surgical wound classification is:',o:['Clean-contaminated','Dirty','Contaminated','Clean'],c:0,t:'single',r:'A routine appendectomy is <b>clean-contaminated</b>: it\'s a controlled entry into the GI tract (which normally harbors bacteria) without unusual spillage. <b>Clean</b> = no entry into GI/respiratory/GU tracts; <b>contaminated</b> = major break in technique or gross GI spillage; <b>dirty</b> = a ruptured/perforated appendix with established infection/peritonitis. The intact GI entry is the key detail.'},
{topic:'post',hot:true,q:'A client is at risk for acute respiratory distress syndrome (ARDS) after an extensive surgical procedure. The nurse assesses for which MOST COMMON early sign of ARDS?',o:['Diffuse bilateral expiratory wheezing on auscultation','Rapid onset of severe dyspnea and refractory hypoxemia','Central cyanosis of the lips and nail beds','Fine inspiratory crackles heard at both lung bases'],c:1,t:'single',r:'<b>Rapid onset of severe dyspnea</b> is the earliest and most common presenting sign of ARDS, usually within 24–48 hours of the precipitating event. <b>Cyanosis</b> and <b>crackles</b> are later findings that reflect more advanced hypoxemia, and <b>wheezing</b> points more toward bronchospasm/asthma than ARDS. Early dyspnea + refractory hypoxemia is the classic clue.'},
{topic:'post',hot:false,q:'Which clinical manifestation MOST increases a postoperative client\'s risk for wound evisceration?',o:['Dependent edema of the lower extremities on day two','Hypovolemia from insensible intraoperative fluid losses','Valsalva maneuver during straining or coughing','Transient hypoxia corrected with supplemental oxygen'],c:2,t:'single',r:'The <b>Valsalva maneuver</b> (straining, coughing, bearing down) sharply raises <b>intra-abdominal pressure</b>, placing direct mechanical stress on the incision and risking dehiscence/evisceration — which is why patients are taught to <b>splint the incision</b> when coughing or moving. Edema, hypoxia, and hypovolemia impair healing over time but don\'t apply the sudden mechanical force that pops a wound open.'},
{topic:'post',hot:true,q:'Which factor STIMULATES (promotes) the wound healing process in a postoperative client?',o:['Sufficient oxygenation','Hemorrhage','Nutritional deficiencies','Immobility'],c:0,t:'single',r:'<b>Sufficient oxygenation</b> drives wound healing — oxygen is required for collagen synthesis, cellular energy production, immune cell function, and angiogenesis. <b>Hemorrhage</b> (blood/volume loss), <b>immobility</b> (poor perfusion), and <b>nutritional deficiencies</b> (no protein/vitamin C/zinc building blocks) all IMPAIR healing. The question asks what helps, not what harms — read the stem carefully.'},
{topic:'post',hot:true,q:'To prevent pneumonia and protect the pulmonary system, which postoperative nursing intervention is MOST essential?',o:['Ambulate the client as soon as possible','Assist with incentive spirometry every 6 hours','Position the client supine','Assess breath sounds at least every 2 hours'],c:0,t:'single',r:'<b>Early ambulation</b> is the single most effective postop pulmonary intervention — it promotes full lung expansion, mobilizes secretions, and improves circulation. Incentive spirometry is important but should be done every <b>1–2 hours</b> (not every 6); assessing breath sounds <b>monitors</b> but doesn\'t prevent complications; and a <b>supine</b> position restricts lung expansion (semi-Fowler\'s is better). Each distractor is a real intervention that\'s either mistimed, passive, or counterproductive.'},
{topic:'eol',hot:false,q:'A dying patient\'s family asks why the nurse keeps repositioning and giving mouth care if the patient is \'not going to make it.\' The nurse explains that these comfort measures:',o:['Can still reverse the patient\'s decline if performed consistently','Protect the family from experiencing guilt after the patient dies','Are mandated by facility policy regardless of the patient\'s wishes','Maintain comfort and dignity when cure is no longer possible'],c:3,t:'single',r:'At end of life, comfort measures (repositioning, mouth care, symptom relief) exist to preserve <b>comfort and dignity</b> — not to reverse decline or prolong life. They are guided by the patient\'s goals/wishes, not blanket policy, and although they do comfort the family, their purpose is the PATIENT\'s wellbeing. The distractors each contain a kernel of truth, which is what makes them tempting.'},
{topic:'eol',hot:true,q:'A patient with terminal cancer says, \'I just hope I can make it to my daughter\'s wedding next month.\' What is the nurse\'s most therapeutic response?',o:['\'You should focus your energy on getting stronger first.\'','\'It\'s unlikely you\'ll still be here by next month.\'','\'Tell me more about what that day means to you.\'','\'Let\'s talk about something happier than that today.\''],c:2,t:'single',r:'<b>Exploring meaning</b> (\'tell me more...\') supports realistic hope and honors the patient\'s goals — the heart of palliative communication. Crushing the hope, shutting down the conversation, and giving false reassurance about \'getting better\' all block therapeutic communication and ignore the patient\'s needs.'},
{topic:'cancer',hot:true,q:'The mnemonic CAUTION helps identify the seven warning signs of cancer. Which finding fits the \'U\' in CAUTION?',o:['Unilateral weakness or numbness','Unusual bleeding or discharge','Unexplained fatigue lasting several weeks','Uncontrolled high blood pressure'],c:1,t:'single',r:'In <b>CAUTION</b>, U = <b>Unusual bleeding or discharge</b>. The full mnemonic: Change in bowel/bladder habits, A sore that won\'t heal, Unusual bleeding/discharge, Thickening or lump, Indigestion/difficulty swallowing, Obvious change in a wart/mole, Nagging cough/hoarseness. Fatigue, focal weakness, and hypertension are real concerns but aren\'t the classic CAUTION warning signs.'},
{topic:'cancer',hot:true,q:'Using the CAUTION (UP) warning signs of cancer, which findings should prompt the nurse to recommend further evaluation? Select all that apply.',o:['A nagging cough or persistent hoarseness','Obvious change in a wart or mole','A sore that does not heal','Mild seasonal nasal congestion that resolves with antihistamines','A change in bowel or bladder habits'],c:[0,1,2,4],t:'multi',r:'CAUTION + UP warning signs: <b>C</b>hange in bowel/bladder, <b>A</b> sore that won\'t heal, <b>U</b>nusual bleeding/discharge, <b>T</b>hickening/lump, <b>I</b>ndigestion/dysphagia, <b>O</b>bvious wart/mole change, <b>N</b>agging cough/hoarseness — plus <b>U</b>nexplained weight loss and <b>P</b>ernicious anemia. Seasonal congestion that resolves with antihistamines is a benign, self-limiting symptom — not a red flag.'},
{topic:'cancer',hot:false,q:'A patient reports an 18-lb weight loss over two months without trying, plus fatigue and new anemia. Applying cancer warning-sign knowledge, the nurse recognizes this as:',o:['Possible cancer warning signs requiring diagnostic evaluation','Iron-deficiency anemia that will resolve with oral supplementation','Expected age-related change in appetite and lean body mass','Normal seasonal appetite variation seen during the winter months'],c:0,t:'single',r:'<b>Unexplained weight loss and pernicious anemia</b> extend the CAUTION mnemonic (\'UP\') and are red flags warranting workup. Significant unintentional weight loss is never just \'aging\' or seasonal appetite, and reflexively giving iron without evaluating the cause could delay a cancer diagnosis. Investigate the underlying cause first.'},
{topic:'cancer',hot:true,q:'A patient with cancer is at risk for several complications from BOTH the disease and its treatment. Which set correctly groups the major complications the nurse monitors for?',o:['Allergies, heartburn, and muscle cramps','Pain, infection, and altered nutrition','Constipation, insomnia, and dry skin','Hypertension, hyperlipidemia, and gout'],c:1,t:'single',r:'Cancer and its treatment threaten the patient with <b>pain, infection, and altered nutrition (anorexia–cachexia)</b> — the big three to monitor. The other clusters list real but minor or unrelated issues; they aren\'t the priority cancer complications driven by tumor growth, marrow suppression, and GI/metabolic effects.'},
{topic:'cancer',hot:true,q:'Why is a neutropenic cancer patient at risk of having a serious infection go unnoticed?',o:['Prophylactic antibiotics suppress every early symptom of infection','Too few neutrophils to mount inflammation, so infection hides','Neutropenia itself confers temporary immunity to bacterial invasion','A persistently high fever masks the more localized signs of infection'],c:1,t:'single',r:'With treatment-induced neutropenia the patient lacks the white cells that create the usual inflammatory signs, so <b>infection can be present while the patient appears almost asymptomatic</b> — a low-grade fever may be the ONLY clue. They are MORE vulnerable, not immune, and antibiotics treat infection rather than hide it. This is why any temperature elevation is treated as an emergency.'},
{topic:'cancer',hot:false,q:'A nurse teaches a neutropenic patient how to prevent infection at home. Which instructions are appropriate? Select all that apply.',o:['Avoid crowds and people with infections','Practice safe food handling and avoid raw/undercooked foods','Strict hand washing and meticulous hygiene/skin care','Garden daily to stay active and boost mood','Monitor temperature daily and report any fever immediately'],c:[0,1,2,4],t:'multi',r:'Neutropenic precautions: rigorous hand washing/skin care, avoid crowds and sick contacts, safe food practices (no raw/undercooked or unwashed foods), and check temperature daily — report any fever at once. <b>Gardening exposes the patient to soil-borne fungi and bacteria</b>, a real infection risk for the immunocompromised, so it\'s discouraged during neutropenia.'},
{topic:'cancer',hot:false,q:'A cancer patient develops anorexia–cachexia. Which lab values does the nurse monitor to evaluate nutritional status, and which foods are recommended?',o:['Albumin and prealbumin; high-calorie, high-protein soft foods','Sodium and potassium; clear liquids advanced only as tolerated','BUN and creatinine; restricted protein with low-calorie portions','Hemoglobin A1c; low-fat, high-fiber meals with fluid restriction'],c:0,t:'single',r:'Nutritional status is tracked with <b>albumin and prealbumin</b> (protein stores), and patients are encouraged to eat <b>soft, nonirritating, high-calorie, high-protein</b> foods, with antiemetics/appetite stimulants and enteral or parenteral nutrition as needed. BUN/creatinine assess kidneys; A1c tracks glucose — neither measures nutritional protein status, and low-calorie/clear-liquid diets worsen cachexia.'},
{topic:'cancer',hot:false,q:'Which nursing actions are appropriate for managing cancer-related PAIN? Select all that apply.',o:['Perform a comprehensive pain assessment and set management goals with the patient','Use pharmacologic options: NSAIDs, opioids, and adjuvants such as corticosteroids','Withhold opioids to avoid addiction even when pain is severe','Refer to a pain management or palliative care specialist when needed','Add non-pharmacologic measures: guided imagery, relaxation breathing, distraction, massage'],c:[0,1,3,4],t:'multi',r:'Cancer pain care: assess thoroughly and set goals, combine pharmacologic (NSAIDs, opioids, adjuvant corticosteroids) with non-pharmacologic methods (imagery, relaxation, distraction, massage, acupuncture), and refer to pain/palliative specialists. <b>Withholding needed opioids over addiction fears is undertreatment</b> — fear of addiction should not deny a cancer patient effective pain relief.'},
{topic:'cancer',hot:true,q:'Which statement correctly distinguishes a MALIGNANT tumor from a benign one?',o:['Localized cells that displace tissue but rarely lead to patient death','Slow-growing cells that produce no systemic effects on the host at all','Undifferentiated cells that invade nearby tissue and metastasize','Well-differentiated encapsulated cells confined to their tissue of origin'],c:2,t:'single',r:'<b>Malignant</b> cells are <b>undifferentiated</b> (little resemblance to origin tissue), overcome contact inhibition to <b>invade/infiltrate</b>, and <b>metastasize</b> via blood/lymph, often causing systemic effects (anemia, weight loss, CACS) and, untreated, death. Well-differentiated, encapsulated, slow-growing, localized, and non-systemic all describe BENIGN tumors.'},
{topic:'cancer',hot:false,q:'A nurse provides psychosocial nursing care to a newly diagnosed cancer patient. Which approach best reflects appropriate care?',o:['Limit discussion of the diagnosis so the patient is not overwhelmed','Focus on physical treatment and refer all emotional needs to the family','Offer active listening, honest information, and an open relationship','Encourage the patient to stay positive and avoid dwelling on questions'],c:2,t:'single',r:'Psychosocial cancer care means building an <b>open, honest relationship</b>, maintaining realistic hope, and offering <b>active listening, reassurance, and accurate information</b> about the cancer and treatment. Avoiding the diagnosis, dismissing questions with forced positivity, or ignoring emotions all undermine trust and the patient\'s coping.'},
{topic:'meds',hot:true,q:'A patient takes acetaminophen for pain and also drinks alcohol regularly. The nurse is most concerned about which adverse effect, and what is the antidote?',o:['Cardiotoxicity; the antidote is dantrolene sodium infusion','Hepatotoxicity; the antidote is acetylcysteine','Ototoxicity; the antidote is intravenous calcium gluconate','Nephrotoxicity; the antidote is IV sodium bicarbonate'],c:1,t:'single',r:'Acetaminophen in excess — and especially combined with alcohol — causes <b>hepatotoxicity</b> (liver damage); the antidote is <b>acetylcysteine (Mucomyst)</b>. Stay within the daily limit and assess liver function. Sodium bicarbonate, calcium gluconate, and dantrolene treat unrelated problems (acidosis/aspirin, hyperkalemia/hypocalcemia, malignant hyperthermia).'},
{topic:'meds',hot:true,q:'A patient is started on a medication known to be hepatotoxic. Which nursing actions are appropriate? Select all that apply.',o:['Review the full medication and herbal list for other liver-stressing agents','Monitor liver function tests (AST, ALT, bilirubin)','Encourage extra acetaminophen for any discomfort','Assess for jaundice, dark urine, and right-upper-quadrant pain','Teach the patient to avoid or limit alcohol'],c:[0,1,3,4],t:'multi',r:'For a hepatotoxic drug: monitor <b>LFTs (AST, ALT, bilirubin)</b>, limit alcohol, watch for <b>jaundice, dark urine, RUQ pain, fatigue</b>, and reconcile other liver-stressing meds/herbs. <b>Encouraging extra acetaminophen is wrong</b> — it adds more hepatotoxic load. Stacking liver-toxic agents compounds the damage.'},
{topic:'aging',hot:true,q:'The nurse understands that as a person ages, drugs tend to remain active in the body longer and reach higher levels. The primary reason is:',o:['Declining liver metabolism and kidney excretion slow elimination','Gastric emptying accelerates, so drugs are absorbed more completely','Cytochrome P450 enzyme activity rises steadily with advancing age','Total body water increases, raising the volume of distribution'],c:0,t:'single',r:'With aging, <b>liver metabolism slows and kidney excretion declines</b>, so drugs are broken down and cleared more slowly — levels rise and effects last longer, increasing toxicity and adverse-reaction risk. This is the pharmacokinetic basis for \'start low, go slow.\' Aging actually <b>decreases</b> total body water and tends to slow (not speed) hepatic enzymes.'},
{topic:'aging',hot:true,q:'A nursing student asks the difference between arteriosclerosis and atherosclerosis. The best explanation is:',o:['Arteriosclerosis affects only coronary vessels while atherosclerosis affects only the legs','Arteriosclerosis is general arterial hardening; atherosclerosis is plaque inside the lumen','Both terms describe venous wall thickening and both reverse fully with statin therapy','Atherosclerosis is the umbrella term and arteriosclerosis is its plaque-forming subtype'],c:1,t:'single',r:'<b>Arteriosclerosis</b> = the broad term for <b>hardening and thickening</b> of arterial walls (loss of elasticity). <b>Atherosclerosis</b> is a <b>specific subtype</b> where fatty <b>plaque (atheroma)</b> builds up inside the lumen, narrowing it and risking clot/MI/stroke. The relationship is reversed in the \'atherosclerosis is the general term\' option — atherosclerosis is the subtype, not the umbrella — and both involve arteries, not veins.'},
{topic:'aging',hot:false,q:'Which finding is the hallmark that distinguishes ATHEROSCLEROSIS specifically from general arteriosclerosis?',o:['A widened pulse pressure from a rising systolic reading','Generalized loss of elastic recoil with arterial stiffening','Age-related thickening of the medial arterial wall layer','Fatty lipid plaque deposited inside the vessel lumen'],c:3,t:'single',r:'The defining feature of <b>atherosclerosis</b> is <b>lipid/cholesterol plaque (atheroma) inside the lumen</b>, which narrows the vessel and can rupture to form clots. Loss of elasticity, wall thickening, and rising systolic BP occur in arteriosclerosis broadly (and with normal vascular aging) — they don\'t specifically require the fatty plaque that defines atherosclerosis.'},
{topic:'aging',hot:false,q:'A patient has atherosclerosis. Which modifiable risk factors should the nurse target in teaching? Select all that apply.',o:['Sedentary lifestyle and obesity','Elevated LDL and low HDL cholesterol','Family history of heart disease','Hypertension and diabetes','Cigarette smoking'],c:[0,1,3,4],t:'multi',r:'Atherosclerosis is driven by <b>modifiable</b> factors: high LDL/low HDL, smoking, hypertension, diabetes, inactivity, and obesity — all targets for teaching and prevention. <b>Family history is a real risk factor but is NON-modifiable</b>, so it can\'t be changed through teaching; the question asks specifically for modifiable factors.'},
{topic:'aging',hot:false,q:'Which age-related changes increase an older adult\'s risk of drug toxicity? Select all that apply.',o:['Decreased liver mass and blood flow (slower metabolism)','Increased serum albumin that binds more drug','Increased body fat that stores fat-soluble drugs longer','Decreased total body water concentrating water-soluble drugs','Decreased kidney function (slower excretion)'],c:[0,2,3,4],t:'multi',r:'Aging raises toxicity risk through: slower <b>hepatic metabolism</b>, reduced <b>renal excretion</b>, more body fat (prolongs fat-soluble drug effect), and less body water (higher concentration of water-soluble drugs). The trap is the last option: serum <b>albumin DECREASES</b> with age/illness, leaving MORE free (active) drug — not more bound — which also raises toxicity.'},
{topic:'meds',hot:false,q:'An older adult on several medications, including one cleared by the liver, asks why the provider started a low dose. The nurse\'s best explanation is that:',o:['Older adults need higher doses to achieve a therapeutic serum level','Reduced hepatic and renal clearance allows the drug to accumulate','Low doses are chosen because they do not produce adverse effects','The pharmacy was unable to supply the standard strength today'],c:1,t:'single',r:'Because aging <b>slows hepatic metabolism and renal excretion</b>, standard doses can accumulate to toxic levels, so providers \'start low and go slow.\' Low doses still can cause effects (just less risk), older adults generally need the SAME or LOWER doses (not higher), and the explanation is physiologic, not a supply issue.'},
{topic:'aging',hot:true,q:'An 82-year-old with a creatinine of 2.1 mg/dL is admitted after a fall. Which prescription should the nurse question FIRST?',o:['Vitamin D 1000 units PO daily','Diphenhydramine 50 mg PO at bedtime for sleep','Docusate sodium 100 mg PO twice daily','Acetaminophen 650 mg PO every 6 hours as needed'],c:1,t:'single',r:'Diphenhydramine is a <b>Beers-criteria</b> anticholinergic: sedation, confusion, urinary retention, and falls in an older adult who has already fallen. The others are appropriate. Acetaminophen at this dose is the safest analgesic here; docusate and vitamin D carry no fall risk.'},
{topic:'cancer',hot:true,q:'A patient with an ANC of 300/mm3 is admitted for fever of 100.6F. Which prescription should the nurse question?',o:['Acetaminophen 650 mg PO now for the fever','Piperacillin-tazobactam IV to begin within 60 minutes','Strict protective isolation with no fresh flowers','Blood cultures from two sites before antibiotics'],c:0,t:'single',r:'Antipyretics <b>mask the only sign a neutropenic patient can produce</b>. Fever here is the trigger for the entire sepsis pathway; blunting it hides deterioration. Cultures first, broad-spectrum antibiotics within the hour, and protective isolation are all correct. This is the classic Casteel inversion: the harmless-looking comfort order is the dangerous one.'},
{topic:'post',hot:true,q:'A patient is 6 hours post-op from an open abdominal procedure with a nasogastric tube to low intermittent suction. Which order should the nurse question?',o:['Ice chips as tolerated once bowel sounds return','Incentive spirometer 10 breaths every hour while awake','Sequential compression devices bilaterally while in bed','Irrigate the NG tube with sterile water every 4 hours'],c:3,t:'single',r:'NG irrigation is normally done with <b>normal saline</b>. Repeated sterile-water irrigation of a suctioned stomach washes out electrolytes and can produce <b>hypokalemia and hyponatremia</b>. The rest are standard. Note the order is not absurd, it is subtly wrong, which is how he writes them.'},
{topic:'eol',hot:false,q:'A hospice patient with escalating cancer pain is on scheduled morphine. Which new order should the nurse question?',o:['Increase the morphine dose for uncontrolled pain','Add a scheduled stimulant laxative with the morphine','Hold morphine if the respiratory rate is below 12','Provide oral care every 2 hours for dry mouth'],c:2,t:'single',r:'In hospice, the goal is comfort, and <b>tolerance to respiratory depression develops</b> while tolerance to analgesia lags. A rigid hold parameter on a scheduled opioid undertreats pain and is inconsistent with the plan of care. Opioids always need a bowel regimen, oral care is standard, and titrating upward for uncontrolled pain is appropriate.'},
{topic:'pre',hot:false,q:'A patient with type 2 diabetes is scheduled for surgery at 0730 and is NPO. Which preoperative order should the nurse question?',o:['Start a maintenance IV of dextrose-containing solution','Check a fingerstick glucose on arrival to the preop area','Hold the metformin dose on the morning of surgery','Administer the usual full morning dose of regular insulin'],c:3,t:'single',r:'A <b>full mealtime insulin dose in an NPO patient</b> produces hypoglycemia under anesthesia, where the symptoms are masked. Typically basal insulin is reduced and short-acting mealtime insulin is held. Checking glucose, holding metformin, and running dextrose are all appropriate.'},
{topic:'intra',hot:false,q:'A patient with a documented latex allergy is going to the OR. Which order requires clarification before proceeding?',o:['Have epinephrine and emergency airway equipment available','Schedule the case as the last procedure of the day','Post latex precaution signage on the OR door','Use only latex-free gloves and equipment in the room'],c:1,t:'single',r:'Latex-allergic patients are scheduled <b>FIRST</b>, not last, so airborne latex particles from prior cases have been cleared from the room. Everything else is correct latex precaution practice. The distractor works because scheduling last is right for <i>infection</i> isolation, and he counts on you transferring that rule.'},
{topic:'chronic',hot:false,q:'An older adult with heart failure and chronic kidney disease is admitted. Which admission order should the nurse question?',o:['Ibuprofen 600 mg PO every 8 hours for arthritis pain','Furosemide 40 mg IV once now','Fluid restriction of 1500 mL per day','Daily weights on the same scale each morning'],c:0,t:'single',r:'NSAIDs cause <b>renal vasoconstriction and sodium/water retention</b>, worsening both the kidney disease and the heart failure, and they blunt the diuretic. In an older adult they also raise GI bleeding risk. The other three orders are standard heart failure management.'},
{topic:'meds',hot:false,q:'A patient received IV midazolam (Versed) for a bedside procedure and is now drowsy with a respiratory rate of 8. Which order should the nurse question?',o:['Administer naloxone 0.4 mg IV push now','Have flumazenil available at the bedside','Continuous pulse oximetry and capnography monitoring','Apply supplemental oxygen and stimulate the patient'],c:0,t:'single',r:'<b>Naloxone reverses opioids, not benzodiazepines.</b> The reversal agent for midazolam is <b>flumazenil</b>. This is his single favorite Versed distractor. Oxygen, stimulation, and continuous monitoring are all appropriate first steps.'},
{topic:'post',hot:true,q:'The nurse receives four postoperative patients in report. Which patient should the nurse assess FIRST?',o:['A patient 4 hours post-op who is restless with an oxygen saturation of 90%','A patient 1 day post-op with a temperature of 100.2F and clear lungs','A patient 2 days post-op reporting incisional pain rated 7 of 10','A patient 6 hours post-op with 40 mL of serosanguineous drainage'],c:0,t:'single',r:'<b>Restlessness is the earliest sign of hypoxia</b>, and combined with a saturation of 90% it signals a failing airway or gas exchange. A low-grade temp in the first 24 hours is usually atelectasis, pain of 7 needs treatment but not first, and serosanguineous drainage in that volume is expected. All four are real findings; rank them by how fast each one kills.'},
{topic:'cancer',hot:true,q:'A nurse is caring for four oncology patients. Which one requires immediate intervention?',o:['A patient on chemotherapy with a platelet count of 18,000/mm3 and a new headache','A patient with an ANC of 900/mm3 who wants to walk in the hallway','A patient with alopecia who is tearful about her appearance','A patient reporting mouth soreness who is refusing acidic juices'],c:0,t:'single',r:'Platelets under 20,000 with a <b>new headache</b> suggests <b>intracranial hemorrhage</b> until proven otherwise. That is the only life-threatening finding here. An ANC of 900 is mild neutropenia and hallway walking with a mask is reasonable, mucositis management is correct as described, and the psychosocial distress is real but not immediately life-threatening.'},
{topic:'aging',hot:true,q:'An older adult on the medical unit becomes acutely confused at 2200. What should the nurse do FIRST?',o:['Reorient the patient and turn on a night light in the room','Apply a bed alarm and move the patient closer to the nurses station','Notify the provider to request an order for a sedative','Check vital signs, oxygen saturation, and a fingerstick glucose'],c:3,t:'single',r:'Delirium is a <b>symptom of an underlying physiologic problem</b>, so the first step is to find the cause: hypoxia, hypoglycemia, infection, pain, or drug effect. Safety measures and reorientation come next, and sedatives typically <b>worsen</b> delirium. All four options get done eventually, which is the difficulty.'},
{topic:'intra',hot:true,q:'Thirty minutes into a general anesthetic the end-tidal CO2 is climbing and the heart rate has risen from 78 to 132 with no blood loss. What is the priority action?',o:['Increase the ventilator rate to lower the carbon dioxide','Draw an arterial blood gas and a serum potassium','Obtain a core temperature and apply cooling blankets','Discontinue the triggering agent and prepare dantrolene'],c:3,t:'single',r:'This is <b>malignant hyperthermia</b> presenting with its earliest signs. Stop the trigger and give <b>dantrolene</b> immediately; every minute of delay raises mortality. Cooling, labs, and hyperventilation are all part of the protocol but they are <b>supportive</b>. Treating the CO2 with ventilator changes alone treats the number, not the disease.'},
{topic:'post',hot:false,q:'A patient 2 days post-op from a total hip replacement suddenly reports chest pain and shortness of breath. What is the nurse\'s FIRST action?',o:['Assess the calf for redness, warmth, and swelling','Notify the surgeon and prepare for a spiral CT scan','Obtain a 12-lead ECG and draw cardiac enzymes','Raise the head of the bed and apply supplemental oxygen'],c:3,t:'single',r:'Suspected <b>pulmonary embolism</b>: the nurse\'s first action is one she can perform independently and immediately to support oxygenation. Diagnostics and notification follow. Assessing the calf confirms a source but does nothing for the hypoxia happening right now. First action questions ask what you do, not what you find out.'},
{topic:'eol',hot:false,q:'A family asks the nurse to stop the morphine for their actively dying father because they are afraid it will hasten his death. What is the nurse\'s priority response?',o:['Explore their fear and explain that titrated opioids relieve dyspnea and pain','Contact the provider to request a palliative care consultation','Reduce the dose by half and reassess the patient in one hour','Explain that the plan of care cannot be changed by the family'],c:0,t:'single',r:'Address the <b>fear driving the request</b> and teach the principle of double effect: doses titrated to comfort relieve suffering and do not hasten death. Arbitrarily halving the dose abandons the patient to symptoms, a flat refusal shuts down communication, and a consult delays a conversation the nurse can have now.'},
{topic:'chronic',hot:false,q:'A patient with COPD, diabetes, and depression says he has stopped taking most of his medications because he cannot keep track of them. What is the nurse\'s best initial action?',o:['Refer him to a case manager for medication management support','Set up a weekly pill organizer and teach him to fill it','Ask him to describe how he currently takes each medication at home','Provide a written schedule with times and pictures of each pill'],c:2,t:'single',r:'<b>Assess before you intervene.</b> Every other option is a reasonable intervention, but choosing one before you know whether the barrier is cost, cognition, side effects, or complexity means you may solve the wrong problem. Casteel loads priority stems with good interventions to see whether you skip assessment.'},
{topic:'post',hot:false,q:'Which postoperative task can the nurse appropriately delegate to unlicensed assistive personnel?',o:['Evaluating whether the PCA is controlling the patient\'s pain','Assessing the surgical incision during the morning dressing change','Reapplying antiembolism stockings after the patient\'s morning bath','Reinforcing incentive spirometer teaching for a new post-op patient'],c:2,t:'single',r:'UAP may perform <b>standard, unchanging procedures on stable patients</b>. Reapplying stockings qualifies. Teaching, assessment, and evaluation of a response to therapy cannot be delegated because they require nursing judgment. The verb in the option tells you the answer.'},
{topic:'aging',hot:false,q:'A nurse is caring for a group of older adults with an experienced UAP. Which assignment is appropriate?',o:['Feed a patient who was just started on a dysphagia diet','Assist a stable patient with dementia to ambulate to the bathroom','Check whether a newly confused patient\'s confusion is improving','Take vital signs on a patient one hour after a new antihypertensive'],c:1,t:'single',r:'Ambulating a <b>stable</b> patient with chronic dementia is routine care. Judging whether confusion is improving is assessment. A patient <b>newly</b> placed on a dysphagia diet needs a nurse to evaluate swallowing safety. Vitals after a first dose of a new antihypertensive are being used for clinical decision-making, so the nurse should obtain them.'},
{topic:'cancer',hot:true,q:'A patient receiving radiation to the neck asks why he must avoid applying lotion before treatment. The nurse\'s explanation is based on which principle?',o:['Fragrances in lotion trigger nausea during the treatment session','Moisture on the skin reduces the accuracy of the positioning tattoos','Topical products can alter the surface dose delivered to the tissue','Lotion softens the skin and increases the risk of tearing during setup'],c:2,t:'single',r:'Creams, powders, and metallic products on the field act as a <b>bolus</b>, changing where the dose deposits and increasing surface skin reaction. The teaching point is dose distribution, not comfort. Marks are not removed and the field is not washed with harsh soap, but the mechanism tested here is the altered dose.'},
{topic:'cancer',hot:false,q:'A patient with newly diagnosed cancer has a serum calcium of 13.2 mg/dL, is lethargic, and reports constipation. What does the nurse anticipate?',o:['Immediate calcium gluconate IV push for neuromuscular protection','Oral calcium supplementation and increased dietary intake','Aggressive isotonic IV fluids followed by a bisphosphonate','Fluid restriction with a loop diuretic and potassium replacement'],c:2,t:'single',r:'This is <b>hypercalcemia of malignancy</b>, an oncologic emergency. Treatment is <b>volume expansion with isotonic saline</b> to promote urinary calcium excretion, then a bisphosphonate to block bone resorption. Supplementing calcium worsens it, restricting fluid worsens it, and calcium gluconate treats <b>hypo</b>calcemia.'},
{topic:'cancer',hot:false,q:'Which patient statement indicates the nurse\'s teaching about secondary cancer prevention was effective?',o:['\'I got the HPV vaccine series to lower my risk of cervical cancer.\'','\'I will get my scheduled colonoscopy even though I feel fine.\'','\'I have quit smoking and started exercising four days a week.\'','\'I will attend the survivorship clinic to watch for recurrence.\''],c:1,t:'single',r:'<b>Secondary</b> prevention is <b>screening and early detection in an asymptomatic person</b>. Smoking cessation and vaccination are <b>primary</b> (risk reduction). Monitoring for recurrence after a known cancer is <b>tertiary</b>. He tests this by making all four statements correct health behaviors, so only the level classification separates them.'},
{topic:'post',hot:true,q:'A patient 3 days post-op reports that something \'gave way\' in the abdominal incision while coughing. The nurse finds the wound edges separated with the fascia intact and no viscera visible. This is:',o:['A seroma, which should be cultured and managed with a pressure dressing','Normal separation of the epidermal layer expected at this stage of healing','Evisceration, requiring saline gauze and immediate surgical intervention','Dehiscence, requiring the surgeon to be notified and the patient kept NPO'],c:3,t:'single',r:'<b>Dehiscence</b> is separation of the wound layers without protrusion of viscera. <b>Evisceration</b> is dehiscence <b>plus</b> organ protrusion. The nursing response overlaps, but the terminology question is the point, and \'something gave way\' during coughing is the classic stem.'},
{topic:'pre',hot:false,q:'A preoperative patient signed the consent form yesterday and today says, \'I have decided I do not want the surgery.\' What should the nurse do?',o:['Ask the family to help the patient reconsider the decision','Explain the risks of cancelling and confirm the patient still refuses','Document the statement and continue the preoperative preparation','Stop preparations and notify the surgeon of the patient\'s decision'],c:3,t:'single',r:'<b>Consent is revocable at any time</b>, including after signing and up to the moment of incision. The nurse stops and notifies the surgeon. Persuading, proceeding, or recruiting the family to change the patient\'s mind all violate autonomy. This one punishes anyone who reads \'already signed\' as binding.'},
{topic:'aging',hot:false,q:'An 88-year-old is admitted with dehydration. The nurse notes poor skin turgor over the forearm. How should the nurse interpret this finding?',o:['It should be rechecked on the lower extremity for a more accurate result','It confirms moderate dehydration and warrants immediate fluid resuscitation','It is unreliable in older adults because skin elasticity is already reduced','It rules out dehydration because turgor is preserved in true volume loss'],c:2,t:'single',r:'Age-related <b>loss of dermal elasticity</b> makes forearm turgor a poor hydration indicator in older adults. Better indicators are the <b>sternum or forehead</b>, plus mucous membranes, urine output and concentration, and orthostatic vitals. Lower extremities are worse, not better, because of dependent edema.'},
{topic:'chronic',hot:false,q:'Which finding in a patient with a chronic illness most suggests the nurse should reassess the self-management plan?',o:['The patient asks the nurse to review the action plan again','The patient\'s spouse attends appointments and takes notes','The patient reports occasional frustration with the daily routine','The patient can name the medications but not what each one treats'],c:3,t:'single',r:'Naming a drug without knowing its purpose means the regimen is being followed <b>by rote</b>, which collapses the moment something changes: a missed dose, a new symptom, an illness day. Frustration is normal, requesting review is engagement, and family involvement is a strength.'},
{topic:'eol',hot:false,q:'A patient in the final hours of life develops loud, gurgling respirations. The family is distressed. What is the nurse\'s priority intervention?',o:['Increase the oxygen flow rate and apply a nonrebreather mask','Explain that nothing can be done and offer emotional support','Perform deep oropharyngeal suctioning to clear the secretions','Reposition the patient laterally and reduce parenteral fluids'],c:3,t:'single',r:'The <b>death rattle</b> comes from pooled oropharyngeal secretions the patient can no longer clear. <b>Repositioning and reducing fluids</b> help, and an antimuscarinic may be ordered. Deep suctioning is traumatic and stimulates more secretion. Oxygen does not move secretions. Telling the family nothing can be done is both false and abandoning.'},
{topic:'meds',hot:false,q:'A patient receiving a first dose of IV vancomycin develops flushing of the face and neck with a mild drop in blood pressure. What is the nurse\'s priority action?',o:['Administer epinephrine intramuscularly and call the rapid response team','Continue the infusion and give diphenhydramine for the flushing','Stop the infusion and prepare to restart it at a slower rate','Document the finding as an expected reaction and monitor closely'],c:2,t:'single',r:'This is <b>infusion-related (red man) syndrome</b>, a rate-dependent histamine release, <b>not</b> an IgE-mediated allergy. Stopping and restarting more slowly, often with an antihistamine, is the management. Epinephrine treats anaphylaxis, which would include airway involvement and urticaria. Continuing at the same rate worsens it.'},
{topic:'intra',hot:false,q:'The surgical count is incorrect at the end of a procedure. What is the appropriate action?',o:['Have the circulating nurse recount alone to confirm the number','Recount, notify the surgeon, and obtain an intraoperative radiograph','Report the discrepancy to the charge nurse after the case ends','Complete the closure and document the discrepancy in the record'],c:1,t:'single',r:'An incorrect count means a <b>retained surgical item until proven otherwise</b>. The surgeon is notified immediately, the count is repeated, and imaging is obtained before the patient leaves the room. Closing first, counting alone, or delaying the report all risk a sentinel event.'},
{topic:'pre',hot:false,q:'A patient scheduled for surgery in one week takes several agents. Which one most requires specific preoperative instruction about timing?',o:['A daily multivitamin, which has no bearing on surgical bleeding','Omeprazole, which may be continued through the morning of surgery','Warfarin, which is typically held about five days before the procedure','Levothyroxine, which is continued on the usual daily schedule'],c:2,t:'single',r:'<b>Warfarin</b> has a long half-life and requires roughly five days off, sometimes with bridging, to normalize the INR. Levothyroxine is continued, a multivitamin is not the concern here, and a PPI is generally continued. Note that herbal supplements (garlic, ginkgo, ginger, ginseng) also raise bleeding risk and are stopped about two weeks out.'},
{topic:'aging',hot:true,q:'A nurse is assessing an 84-year-old admitted from home. Which findings require follow-up rather than being attributed to normal aging? Select all that apply.',o:['A resting heart rate of 68 beats per minute','Slightly decreased high-frequency hearing','Reports of new difficulty swallowing solid food','New onset of confusion over the past two days','Unintentional weight loss of 12 pounds in three months','Bruising in various stages of healing on both upper arms'],c:[2,3,4,5],t:'multi',r:'Normal aging: stable resting heart rate and gradual high-frequency hearing loss (presbycusis). <b>Requires follow-up:</b> acute confusion (delirium), unintentional weight loss (malignancy, malnutrition, depression), <b>bruising in different stages of healing on the upper arms</b> (a grip-pattern injury suggesting abuse), and new dysphagia (stroke, mass, neuromuscular disease). Note that only one option raises a safety-reporting duty.'},
{topic:'cancer',hot:true,q:'A patient is receiving chemotherapy with a platelet count of 22,000/mm3. Which nursing actions are indicated? Select all that apply.',o:['Avoid rectal temperatures, suppositories, and enemas','Use an electric razor rather than a blade for shaving','Encourage vigorous nose blowing to clear congestion','Administer prescribed aspirin for a reported headache','Hold pressure on venipuncture sites for at least 5 minutes','Provide a soft-bristled toothbrush and skip flossing'],c:[0,1,4,5],t:'multi',r:'Thrombocytopenia precautions prevent <b>any breach of mucosa or skin</b>. Aspirin is contraindicated because it inhibits platelet aggregation on top of an already low count. Vigorous nose blowing provokes epistaxis. The others are standard bleeding precautions. Watch that the incorrect options are both things a patient would plausibly ask for.'},
{topic:'post',hot:false,q:'Which findings in the immediate postoperative period require the nurse to intervene? Select all that apply.',o:['Serosanguineous drainage saturating the dressing within 1 hour','Blood pressure of 118/72 in a patient whose baseline is 120/76','Snoring respirations with sternal retraction','Pain rated 3 of 10 relieved by repositioning','Temperature of 96.4F with shivering','Urine output of 20 mL over the past 2 hours'],c:[0,2,4,5],t:'multi',r:'Snoring with retraction is <b>partial airway obstruction</b>. Under 30 mL/hr of urine signals hypovolemia or renal hypoperfusion. Hypothermia with shivering raises oxygen consumption and must be treated. Saturating a dressing within an hour is excessive bleeding. A BP at baseline and mild pain relieved by repositioning are expected.'},
{topic:'eol',hot:false,q:'Which statements about advance directives are accurate? Select all that apply.',o:['Advance directives can be revoked or changed by a competent patient at any time','A living will documents which treatments the patient would want','A DNR order means comfort measures and routine care are also withheld','A living will functions as a medical order that staff may act on directly','A durable power of attorney names a person to decide if the patient cannot','A POLST is a set of provider-signed portable medical orders'],c:[0,1,4,5],t:'multi',r:'A DNR addresses <b>resuscitation only</b>; all other care continues, which is one of his most-tested distinctions. A living will states <b>preferences</b> and is not itself an actionable order, which is exactly the gap POLST was created to fill. Everything else listed is accurate.'},
{topic:'cancer',hot:true,q:'A 62-year-old on day 10 of a chemotherapy cycle presents with temperature 100.8F, HR 112, BP 96/58, RR 22, and ANC 240/mm3. The site of a peripheral IV placed yesterday looks normal. Which actions should the nurse take? Select all that apply.',o:['Initiate broad-spectrum IV antibiotics within one hour','Begin isotonic IV fluid resuscitation for the hypotension','Reassure the patient that a normal-appearing IV site rules out infection','Place the patient on protective (neutropenic) precautions','Wait for the fever to reach 101F before notifying the provider','Obtain blood cultures from two sites before starting antibiotics'],c:[0,1,3,5],t:'multi',r:'This is <b>neutropenic sepsis</b>. Fever plus ANC under 500 is an emergency: cultures, antibiotics within 60 minutes, fluids for the hypotension, and protective precautions. Waiting for a higher fever is fatal reasoning because a neutropenic patient may never mount one. A normal-looking site proves nothing, since <b>without neutrophils there is no inflammation to see</b>.'},
{topic:'post',hot:true,q:'A patient is 8 hours post-op from an open cholecystectomy. Findings: RR 26 and shallow, SpO2 89% on room air, temperature 100.4F, refusing to cough because of pain, diminished breath sounds at both bases. Which actions are appropriate? Select all that apply.',o:['Assist the patient to splint the incision while coughing','Apply supplemental oxygen and reposition to high-Fowler','Have the patient use the incentive spirometer hourly while awake','Withhold opioids because the respiratory rate is elevated','Restrict ambulation until the oxygen saturation is above 95%','Medicate for pain before pulmonary hygiene'],c:[0,1,2,5],t:'multi',r:'This is <b>atelectasis</b>, the most common cause of a low-grade fever in the first 24 to 48 hours. The chain: pain blocks deep breathing, alveoli collapse, shunt develops, saturation falls, fever follows. Treat the pain <b>so that</b> pulmonary hygiene is possible. Withholding opioids and restricting ambulation both worsen the exact mechanism causing the problem.'},
{topic:'aging',hot:false,q:'A home health nurse visits an 80-year-old cared for by an exhausted adult daughter. Findings: 14-pound weight loss in two months, a stage 2 sacral pressure injury, three expired prescriptions, a strong urine odor in the home, and the daughter saying \'I cannot do this anymore.\' Which actions should the nurse take? Select all that apply.',o:['Assess the patient separately from the caregiver','Report the suspected neglect according to state requirements','Confront the daughter about failing to provide adequate care','Wait for a second visit to confirm the pattern before reporting','Evaluate caregiver strain and offer respite resources','Document objective findings using direct quotations'],c:[0,1,4,5],t:'multi',r:'This picture is <b>neglect</b>: failure to provide necessities, whether or not it is intentional. Reporting is a legal duty and does <b>not</b> require proof or a second visit. Interview the patient alone, assess caregiver strain (the leading risk factor), and document objectively. Confronting the caregiver risks escalation and further isolation of the patient. Note that reporting and supporting the caregiver are not in conflict.'},

/* ===== Ch 10: Fluid, Electrolyte, Acid-Base, IV Therapy (moved from Unit 2) ===== */
{topic:'fluids',hot:true,q:'A post-op patient has BP 88/56, HR 118, dry mucous membranes, and urine output of 18 mL/hr. Which IV fluid does the nurse anticipate FIRST?',o:['0.45% Normal Saline','3% Saline','D5W','0.9% Normal Saline'],c:3,t:'single',r:'This is hypovolemia/hypotension. The first-line fluid is an <b>isotonic crystalloid (0.9% NS or LR)</b> to expand intravascular volume. Hypotonic (0.45%, D5W) would worsen low BP; 3% is hypertonic and reserved for severe hyponatremia.'},
{topic:'fluids',hot:false,q:'The nurse is monitoring a patient with heart failure. Which findings indicate FLUID VOLUME EXCESS? (Select all that apply)',o:['Bounding pulse','Crackles in the lungs','Jugular vein distention','Poor skin turgor','Weight gain of 2 kg overnight'],c:[0,1,2,4],t:'multi',r:'JVD, crackles, bounding pulse, and rapid weight gain are all "WET" signs of <b>hypervolemia</b>. Poor skin turgor is a "DRY" sign of <b>deficit</b>, not excess.'},
{topic:'fluids',hot:true,q:'Which assessment is the BEST indicator of a patient\'s daily fluid status?',o:['Urine color','Daily weight','Blood pressure','Skin turgor'],c:1,t:'single',r:'<b>Daily weight</b> is the single most reliable indicator of fluid status — a gain or loss of 1 kg equals roughly 1 liter of fluid. Take it at the same time, same scale, same clothing.'},
{topic:'lytes',hot:true,q:'A patient with chronic kidney disease has a potassium of 6.8 mEq/L and peaked T waves on the monitor. Which medication should the nurse prepare FIRST?',o:['Sodium bicarbonate','Potassium chloride','Calcium gluconate','Furosemide (Lasix)'],c:2,t:'single',r:'<b>Calcium gluconate</b> is given first to stabilize/protect the cardiac membrane from the dysrhythmia risk. It does NOT lower potassium — insulin+D50, bicarb, and dialysis do that — but protecting the heart is the immediate priority.'},
{topic:'lytes',hot:false,q:'Which clinical findings would the nurse expect in a patient with HYPOcalcemia? (Select all that apply)',o:['Positive Trousseau sign','Constipation','Tetany','Kidney stones','Positive Chvostek sign'],c:[0,2,4],t:'multi',r:'Hypocalcemia causes neuromuscular irritability: positive <b>Trousseau</b> (hand spasm with BP cuff), positive <b>Chvostek</b> (facial twitch), and <b>tetany</b>. Constipation and kidney stones are signs of HYPERcalcemia.'},
{topic:'lytes',hot:true,q:'A patient is admitted with a sodium level of 122 mEq/L. Which is the priority nursing intervention?',o:['Encourage extra free water','Restrict potassium intake','Apply warm compresses','Institute seizure precautions'],c:3,t:'single',r:'Severe hyponatremia causes the brain to swell, leading to confusion and <b>seizures</b>. Seizure precautions and neuro checks are the priority. Adding free water would dilute sodium further and worsen it.'},
{topic:'lytes',hot:false,q:'A patient on a loop diuretic reports muscle weakness and leg cramps. The nurse notes a flattened T wave and a U wave on the ECG. Which electrolyte imbalance is most likely?',o:['Hypermagnesemia','Hypocalcemia','Hyperkalemia','Hypokalemia'],c:3,t:'single',r:'Loop diuretics waste potassium. <b>Hypokalemia</b> classically shows weakness, cramps, a <b>flat T wave and a U wave</b>. Peaked T waves would indicate hyperkalemia.'},
{topic:'fluids',hot:true,q:'A patient with severe hyponatremia (Na 118) and seizure activity is prescribed 3% saline. Which is the priority nursing assessment during infusion?',o:['Pupil size and reactivity to light every hour','Lung sounds for signs of fluid overload','Blood glucose before and after the infusion','Bowel sounds in all four abdominal quadrants'],c:1,t:'single',r:'3% saline is <b>hypertonic</b> — it pulls water into the vasculature and can rapidly cause <b>fluid overload and pulmonary edema</b>. Monitor lung sounds closely and infuse slowly.'},
{topic:'fluids',hot:false,q:'Which IV solutions are ISOTONIC? (Select all that apply)',o:['0.9% Normal Saline','D5W (in the bag, before metabolism)','0.45% Normal Saline','3% Saline','Lactated Ringer\'s'],c:[0,4],t:'multi',r:'<b>0.9% NS and Lactated Ringer\'s</b> are isotonic. 0.45% is hypotonic, 3% is hypertonic. D5W is isotonic in the bag but acts hypotonic once dextrose is metabolized — for exam "match the classic answer," NS and LR are the safest isotonic choices.'},
{topic:'fluids',hot:false,q:'A nurse is preparing to administer a blood transfusion. Which IV fluid must be used to prime the line?',o:['0.9% Normal Saline','0.45% Normal Saline','Lactated Ringer\'s','D5W'],c:0,t:'single',r:'<b>Only 0.9% Normal Saline</b> is compatible with blood. LR contains calcium which can cause clotting; dextrose solutions cause hemolysis (RBCs swell and burst).'},
{topic:'abg',hot:false,q:'ABG: pH 7.30, PaCO₂ 52, HCO₃ 24. How does the nurse interpret this?',o:['Metabolic acidosis','Metabolic alkalosis, compensated','Respiratory acidosis, uncompensated','Respiratory alkalosis'],c:2,t:'single',r:'pH is low (acidosis). CO₂ is high and moves OPPOSITE the pH → respiratory. HCO₃ is normal → no compensation yet. = <b>uncompensated respiratory acidosis</b> (think COPD, opioids).'},
{topic:'abg',hot:false,q:'ABG: pH 7.50, PaCO₂ 40, HCO₃ 30. Which conditions could cause this? (Select all that apply)',o:['Nasogastric suction','Prolonged vomiting','Excessive antacid use','Diabetic ketoacidosis','Diarrhea'],c:[0,1,2],t:'multi',r:'pH high + HCO₃ high (same direction) = <b>metabolic alkalosis</b>. Vomiting, NG suction (losing stomach acid) and antacids all cause it. Diarrhea and DKA cause metabolic ACIDosis.'},
{topic:'abg',hot:false,q:'ABG: pH 7.37, PaCO₂ 30, HCO₃ 17. This represents:',o:['Uncompensated respiratory alkalosis','Partially compensated respiratory acidosis','Normal ABG','Fully compensated metabolic acidosis'],c:3,t:'single',r:'pH is normal but on the <b>acidic side</b> (7.37). HCO₃ is low (metabolic acidosis) and the lungs have blown off CO₂ (low CO₂) to compensate. Both abnormal + normal pH = <b>fully compensated metabolic acidosis</b>.'},
{topic:'abg',hot:false,q:'A patient with vomiting for 3 days has ABG pH 7.49, PaCO₂ 41, HCO₃ 30. Interpretation?',o:['Metabolic alkalosis','Respiratory alkalosis','Respiratory acidosis','Metabolic acidosis'],c:0,t:'single',r:'pH high + HCO₃ high (same direction) = metabolic alkalosis. Vomiting loses stomach acid.'},
{topic:'lytes',hot:true,q:'Which is the priority for a patient with potassium of 6.9?',o:['Restrict fluids','Prepare calcium gluconate','Encourage bananas','Give a potassium supplement'],c:1,t:'single',r:'Calcium gluconate protects the heart in hyperkalemia. Never add more potassium.'},
{topic:'lytes',hot:false,q:'Which is the only IV fluid compatible with blood?',o:['D5W','0.9% NS','LR','0.45% NS'],c:1,t:'single',r:'Only 0.9% Normal Saline — LR has calcium (clots), dextrose hemolyzes RBCs.'},
{topic:'fluids',hot:false,q:'Best indicator of a patient\'s daily fluid status?',o:['Daily weight','BP','Skin turgor','Heart rate'],c:0,t:'single',r:'Daily weight — 1 kg ≈ 1 L of fluid.'},
{topic:'abg',hot:true,q:'An ABG shows pH 7.30, PaCO₂ 58, HCO₃ 26 in a patient with a COPD exacerbation. Which intervention is the priority?',o:['Administer high-flow 100% oxygen by non-rebreather','Encourage the patient to breathe into a paper bag','Give IV sodium bicarbonate','Improve ventilation'],c:3,t:'single',r:'This is respiratory acidosis from hypoventilation. The fix is improving ventilation and giving controlled oxygen (target 88–92% in COPD). Slamming 100% O₂ can blunt the hypoxic drive; bicarb and rebreathing don\'t address the trapped CO₂.'},
{topic:'lytes',hot:false,q:'A patient with a potassium of 6.9 mEq/L has peaked T waves on the monitor. Which prescribed order should the nurse question/clarify?',o:['IV calcium gluconate','IV insulin with dextrose','Prepare for possible dialysis','A potassium-sparing diuretic'],c:3,t:'single',r:'In hyperkalemia you want to lower potassium. A potassium-SPARING diuretic would make it worse and should be questioned. Calcium gluconate (heart protection), insulin+dextrose (shifts K into cells), and dialysis are all appropriate.'},
{topic:'lytes',hot:true,q:'A nurse is starting an IV potassium infusion and the patient reports burning at the site. The nurse should FIRST:',o:['Stop the infusion and assess the site for infiltration','Apply a warm compress to the site and keep the infusion going','Document the complaint and reassess the site in one hour','Slow the rate by half and continue while watching the site'],c:0,t:'single',r:'Potassium is a vesicant — burning suggests infiltration/extravasation, which can cause tissue damage. Stop the infusion and assess the site immediately. Never IV-push potassium, and never keep running a painful vesicant.'},
{topic:'fluids',hot:false,q:'A patient with fluid volume deficit is RECEIVING IV fluid replacement. Which finding tells the nurse the patient is responding to the treatment? (Remember: deficit itself LOWERS urine — a rise means the fluids are working.)',o:['Heart rate increases from 90 to 120','Urine specific gravity rises to 1.035','Blood pressure drops further when standing','Urine output increases from 15 mL/hr to 40 mL/hr'],c:3,t:'single',r:'Key word = RESPONDING TO TREATMENT. Hypovolemia by itself DECREASES urine (the body conserves water → output <30 mL/hr, concentrated, high specific gravity). But because this patient is getting IV fluids, urine climbing 15→40 mL/hr means perfusion is restored — the treatment is working. Rising specific gravity, climbing HR, and a worsening orthostatic drop would all mean the deficit is continuing.'},
{topic:'abg',hot:false,q:'A patient with severe asthma has been working hard to breathe. The latest ABG shows the PaCO₂ has risen from 28 to 41 (now "normal"). How should the nurse interpret this?',o:['The patient has developed a metabolic alkalosis','No action is needed since the value is now normal','The patient is improving as the CO2 normalizes','The patient is tiring and heading toward failure'],c:3,t:'single',r:'In a tiring asthmatic who was hyperventilating (low CO₂), a "normalizing" or rising CO₂ is an ominous sign of fatigue and impending respiratory failure — escalate, don\'t relax.'},
{topic:'abg',hot:false,q:'A patient with metabolic acidosis from DKA is breathing deeply and rapidly (Kussmaul respirations). What does the nurse understand about this finding?',o:['It is the body compensating by blowing off CO₂','It is a sign the patient is panicking and needs sedation','It indicates respiratory alkalosis','It should be suppressed with oxygen'],c:0,t:'single',r:'Kussmaul respirations are a compensatory response — the lungs blow off CO₂ (acid) to raise the pH. Suppressing or sedating this would worsen the acidosis. Treat the underlying DKA.'},
{topic:'lytes',hot:true,q:'A patient with hypocalcemia has a positive Trousseau sign and reports tingling around the mouth. What is the priority nursing concern?',o:['Constipation and abdominal distension from slowed motility','Airway compromise from laryngospasm and seizure risk','Kidney stones from calcium precipitating in the tubules','Hypertension from increased vascular smooth muscle tone'],c:1,t:'single',r:'Hypocalcemia increases neuromuscular excitability — the priority is airway (laryngospasm) and seizure risk. Institute seizure precautions and monitor the airway. Stones/constipation are HYPERcalcemia.'},
{topic:'lytes',hot:false,q:'A nurse is about to hang blood and sees the only available IV fluid running is D5½NS. What should the nurse do?',o:['Use lactated Ringer\'s instead','Use the D5½NS to prime the line','Obtain 0.9% normal saline','Run the blood without any priming fluid'],c:2,t:'single',r:'Only 0.9% normal saline is hung with blood. Dextrose solutions hemolyze RBCs and LR\'s calcium can promote clotting. Get NS before proceeding.'},
{topic:'fluids',hot:false,q:'A patient receiving IV fluids for dehydration develops a cough, dyspnea, and crackles. After slowing the infusion and sitting the patient up, what should the nurse do NEXT?',o:['Resume the original infusion rate and document the episode','Discontinue all IV access and hold the remaining fluid orders','Lay the patient flat to redistribute the excess fluid volume','Notify the provider and continue monitoring respiratory status'],c:3,t:'single',r:'After the immediate actions (slow infusion, high-Fowler), notify the provider and keep monitoring. Resuming the rate or lying flat would worsen overload; pulling all access is unnecessary.'},
{topic:'lytes',hot:false,q:'A nurse reviews orders for a patient with fluid volume EXCESS from heart failure. Which order should the nurse question?',o:['Sodium restriction','Daily weights','Administer the prescribed loop diuretic','Infuse 1 L of 0.9% normal saline over 1 hour'],c:3,t:'single',r:'A patient already fluid-overloaded should not get a rapid isotonic bolus — that would worsen the overload. Daily weights, sodium restriction, and diuretics are all appropriate; question the saline bolus.'},
{topic:'abg',hot:false,q:'A patient\'s ABG: pH 7.34, PaCO₂ 60, HCO₃ 31. The nurse recognizes this as which state, and what does it tell you about the patient?',o:['Fully compensated respiratory acidosis, likely chronic COPD','Metabolic alkalosis from vomiting or diuretic therapy','Respiratory alkalosis from anxiety-driven hyperventilation','Uncompensated respiratory acidosis from an acute event'],c:0,t:'single',r:'pH is near-normal but on the acidic side, with BOTH CO₂ and HCO₃ elevated — the kidneys have retained bicarb to compensate. This pattern fits a chronic CO₂ retainer (COPD) rather than an acute crisis.'},
{topic:'fluids',hot:true,q:'Which of the following is NOT a sign of fluid volume deficit?',o:['Poor skin turgor and dry lips','Concentrated, low-volume urine','Tachycardia with hypotension','Bounding pulse with crackles'],c:3,t:'single',r:'Trap: A, B, and D are all TRUE signs of deficit, so they feel right. The impostor is C — a bounding pulse with crackles is fluid volume EXCESS. When you see "NOT," hunt the one that does not belong.'},
{topic:'fluids',hot:true,q:'All of the following IV fluids are isotonic EXCEPT:',o:['D5W (in the bag)','0.9% Normal Saline','Lactated Ringer\'s','0.45% Normal Saline'],c:3,t:'single',r:'"EXCEPT" = find the odd one out. NS, LR, and in-bag D5W are isotonic; 0.45% NS is HYPOtonic. Three belong together — the loner is your answer.'},
{topic:'lytes',hot:false,q:'Which statement about potassium administration is correct?',o:['Potassium is NEVER given by IV push','Oral potassium should be given on an empty stomach','Potassium may be given by rapid IV push in an emergency','Potassium-sparing diuretics are safe in hyperkalemia'],c:0,t:'single',r:'"Never" is a true absolute here: IV-push potassium can cause fatal arrhythmias. The trap is that absolutes are often false — but this one is a hard safety rule. A, C, and D are all dangerous/false.'},
{topic:'lytes',hot:true,q:'A nurse is caring for a patient with hyperkalemia. Which action is the BEST FIRST priority?',o:['Give insulin with dextrose','Teach the patient about low-potassium foods','Administer IV calcium gluconate','Restrict dietary potassium'],c:2,t:'single',r:'Several answers are correct things to do — but "best first" = address the biggest threat. Calcium gluconate protects the heart NOW (it doesn\'t lower K, but it stabilizes the myocardium). Insulin+dextrose comes next; teaching/diet are low priority.'},
{topic:'fluids',hot:true,q:'Which is the BEST indicator of a patient\'s fluid status?',o:['Blood pressure','Daily weight','Thirst','Skin turgor'],c:1,t:'single',r:'"Best indicator" = most reliable/specific. Daily weight is the gold standard (1 kg ≈ 1 L). The others are useful but less precise — classic "they\'re all assessments, pick the strongest" trap.'},
{topic:'lytes',hot:true,q:'All of the following are signs of hypocalcemia EXCEPT:',o:['Positive Trousseau sign','Constipation and kidney stones','Tingling around the mouth','Positive Chvostek sign'],c:1,t:'single',r:'Chvostek, Trousseau, and perioral tingling are hypoCALCEMIA (excitable). "Stones, bones, groans" (constipation, stones) is HYPERcalcemia — the EXCEPT impostor.'},
{topic:'fluids',hot:true,q:'Which is the MOST reliable indicator that a patient with fluid volume DEFICIT is improving?',o:['Urine output rising toward 30+ mL/hr','Heart rate is unchanged','Skin looks slightly less dry','The patient reports feeling less thirsty'],c:0,t:'single',r:'"Most reliable" = the objective, measurable one. Improving urine output reflects restored perfusion. Thirst and skin appearance are softer/subjective; an unchanged HR shows no improvement.'},
{topic:'abg',hot:true,q:'A patient with metabolic alkalosis from vomiting is breathing slowly. Which statement BEST explains this?',o:['The lungs are slowing to RETAIN CO₂ and lower the pH','This is an abnormal, dangerous response that must be stopped','The patient is having a respiratory arrest','The kidneys are dumping bicarb'],c:0,t:'single',r:'Slow breathing here is compensation — retaining CO₂ (acid) to pull the alkalotic pH back down. The "BEST explains" framing rewards understanding the mechanism, not memorizing a fact.'},
{topic:'abg',hot:true,q:'Which is NOT a function regulated by the respiratory system?',o:['Acid–base balance (CO₂ regulation)','Oxygen transport','Gas exchange','Bicarbonate regulation'],c:3,t:'single',r:'The lungs handle O₂, gas exchange, and CO₂ (acid). Bicarbonate is regulated by the KIDNEYS — the impostor in a "NOT" question that lists three lung jobs and one kidney job.'},
{topic:'fluids',hot:false,q:'A nurse auscultates crackles in a patient receiving IV fluids. Which step of the nursing process is this?',o:['Assessment','Diagnosis','Implementation','Evaluation'],c:0,t:'single',r:'Auscultating (collecting objective data) is ASSESSMENT. Naming "fluid overload" would be diagnosis; slowing the IV would be implementation; rechecking the lungs afterward would be evaluation.'},
{topic:'lytes',hot:false,q:'A nurse reassesses a patient\'s potassium level after treating hyperkalemia to see if it dropped. This is which step?',o:['Assessment','Planning','Evaluation','Implementation'],c:2,t:'single',r:'Checking a result against the expected outcome after an intervention is EVALUATION. The trap is that it "looks like" assessment — but its purpose is judging effectiveness.'},
{topic:'fluids',hot:false,q:'Which action belongs to the ASSESSMENT step for a patient with suspected fluid volume deficit?',o:['Set a measurable goal for adequate hydration within 24 hours','Check skin turgor, mucous membranes, and urine specific gravity','Document that the hydration goal was met by the end of shift','Administer the prescribed isotonic IV fluid at the ordered rate'],c:1,t:'single',r:'Collecting data — skin turgor, mucous membranes, specific gravity — is ASSESSMENT. The others are implementation, planning, and evaluation respectively.'},
{topic:'lytes',hot:false,q:'A patient with hypocalcemia has a positive Trousseau sign. Instituting seizure precautions and monitoring the airway are which step?',o:['Diagnosis','Assessment','Implementation','Planning'],c:2,t:'single',r:'Putting safety measures in place (seizure precautions, airway monitoring setup) is IMPLEMENTATION. Eliciting the Trousseau sign was the assessment that identified the risk.'},
{topic:'abg',hot:false,q:'After teaching, the nurse asks the patient to demonstrate using the incentive spirometer correctly. This "teach-back" is which step?',o:['Assessment','Planning','Evaluation','Implementation'],c:2,t:'single',r:'Checking whether teaching was effective (can the patient do it right?) is EVALUATION. The teaching itself was implementation; the return-demonstration evaluates the outcome.'},
{topic:'abg',hot:false,q:'PUTTING IT TOGETHER — A patient with COPD is admitted with increased dyspnea. Using cause→manifest→treatment, which ABG and O₂ plan fit?',o:['Metabolic acidosis; give sodium bicarbonate and recheck the gas','Compensated respiratory acidosis; controlled O2 to keep SpO2 88-92%','Respiratory alkalosis; apply 100% oxygen by non-rebreather mask','Metabolic alkalosis; restrict fluids and hold the diuretic dose'],c:1,t:'single',r:'COPD cause = chronic CO₂ retention → compensated respiratory acidosis. Treatment = controlled O₂ (88–92%), not 100%. The framework links the three together.'},
{topic:'fluids',hot:true,q:'CAUSE — Fluid volume deficit is BEST described as resulting from:',o:['Excess dietary sodium pulling water into the vascular space','Too much IV fluid infused faster than the kidneys clear it','Fluid retention from heart failure backing up into tissue','Loss of fluid from vomiting, diarrhea, or poor intake'],c:3,t:'single',r:'Deficit = loss or inadequate intake. That cause explains the manifestations (↑HR, ↓BP, concentrated urine) and the treatment (isotonic fluids).'},
{topic:'lytes',hot:true,q:'MANIFESTS → TREATMENT — A patient with hyperkalemia shows peaked T waves. What is given FIRST and why?',o:['Insulin with dextrose, to shift K into cells','A potassium supplement','Calcium gluconate, to protect/stabilize the heart','A beta blocker'],c:2,t:'single',r:'Peaked T waves = cardiac threat. Calcium gluconate stabilizes the myocardium FIRST (it doesn\'t lower K). Insulin+dextrose then shifts K into cells. Manifestation drives the priority treatment.'},
{topic:'lytes',hot:false,q:'A patient is admitted with severe dehydration. Which IV fluid does the nurse anticipate administering first?',o:['D5W with 20 mEq KCl','0.45% Normal Saline','0.9% Normal Saline','D10W by slow infusion'],c:2,t:'single',r:'Isotonic 0.9% NS expands intravascular volume first-line for hypovolemia.'},
{topic:'lytes',hot:false,q:'Which ion is the most abundant in the intracellular fluid?',o:['Calcium','Potassium','Sodium','Chloride'],c:1,t:'single',r:'Potassium is the principal ICF cation; sodium dominates the ECF.'},
{topic:'lytes',hot:true,q:'A nurse identifies which finding as the BEST indicator of fluid balance?',o:['Daily weight','Urine color','Blood pressure','Skin turgor'],c:0,t:'single',r:'Daily weight is most reliable; 1 kg ≈ 1 L of fluid.'},
{topic:'lytes',hot:false,q:'A patient with a BUN:creatinine ratio of 25:1, increased hematocrit, and dry mucous membranes most likely has:',o:['Metabolic alkalosis','Fluid volume deficit','Hyperkalemia','Fluid volume excess'],c:1,t:'single',r:'A ratio >20:1 with hemoconcentration indicates fluid volume deficit.'},
{topic:'lytes',hot:false,q:'Which signs indicate fluid volume EXCESS? (Select all that apply)',o:['Poor skin turgor','Crackles','JVD','Bounding pulse','Weight gain'],c:[1,2,3,4],t:'multi',r:'Crackles, JVD, bounding pulse, and weight gain are "WET" signs. Poor turgor = deficit.'},
{topic:'lytes',hot:false,q:'Albumin, a colloid produced by the liver, primarily functions to:',o:['Buffer metabolic acids in the bloodstream','Excrete excess potassium via the kidneys','Pull water into the intravascular space','Move sodium from the blood into the cells'],c:2,t:'single',r:'Albumin exerts oncotic pressure pulling water into vessels; low albumin → edema.'},
{topic:'lytes',hot:true,q:'A potassium level of 6.8 mEq/L with peaked T waves requires which FIRST intervention?',o:['Potassium chloride','Encourage bananas','Calcium gluconate','Furosemide'],c:2,t:'single',r:'Calcium gluconate stabilizes the cardiac membrane immediately.'},
{topic:'lytes',hot:false,q:'Which interventions are correct for hyperkalemia? (Select all that apply)',o:['Sodium bicarbonate','Calcium gluconate','Salt substitutes','Insulin with dextrose','Dialysis if severe'],c:[0,1,3,4],t:'multi',r:'Insulin+dextrose drives K into cells, calcium protects the heart, bicarb shifts K, dialysis removes it. Salt substitutes CONTAIN potassium — avoid.'},
{topic:'lytes',hot:false,q:'A patient with a sodium of 121 mEq/L is at greatest risk for:',o:['Hypertension','Constipation','Kidney stones','Seizures'],c:3,t:'single',r:',o:['},
{topic:'lytes',hot:false,q:'A nurse notes a positive Trousseau sign. This indicates:',o:['Hyperkalemia','Hypocalcemia','Hypercalcemia','Hypernatremia'],c:1,t:'single',r:'Carpal spasm with BP cuff (Trousseau) signals hypocalcemia/tetany.'},
{topic:'lytes',hot:false,q:'Which foods should the nurse recommend to a patient with hypokalemia? (Select all that apply)',o:['Bananas','Potatoes','Oranges','Avocados','White rice'],c:[0,1,2,3],t:'multi',r:'Bananas, potatoes, oranges, and avocados are potassium-rich.'},
{topic:'lytes',hot:false,q:'A magnesium level of 1.0 mEq/L would most likely produce:',o:['Respiratory depression','Hyporeflexia','Bradycardia','Tremors and seizures'],c:3,t:'single',r:'LOW magnesium causes HYPER-excitability: tremors, hyperreflexia, seizures.'},
{topic:'lytes',hot:false,q:'Which IV solution would the nurse use cautiously in a patient with heart failure due to fluid overload risk?',o:['0.225% NS','3% Saline','D5W','0.45% NS'],c:1,t:'single',r:'Hypertonic 3% saline pulls fluid into vessels and can overload the heart.'},
{topic:'lytes',hot:false,q:'A hypotonic solution such as 0.45% NS causes water to move:',o:['Into cells','Out of the body','Into the vasculature only','Out of cells'],c:0,t:'single',r:'Hypotonic fluids shift water INTO cells (raisins → grapes). Watch for cerebral edema.'},
{topic:'lytes',hot:false,q:'Which assessment finding indicates hypernatremia?',o:['Seizures caused by cerebral swelling','Peaked T waves on the cardiac monitor','Carpopedal spasm on cuff inflation','Intense thirst with dry mucous membranes'],c:3,t:'single',r:'Hypernatremia draws water out of cells → thirst, dry membranes, agitation.'},
{topic:'lytes',hot:false,q:'Why must potassium NEVER be administered by IV push?',o:['It causes a sudden drop in the blood glucose','It can cause fatal cardiac dysrhythmias','It is too viscous to push through a small IV','It permanently stains the surrounding skin'],c:1,t:'single',r:'Rapid IV potassium can cause cardiac arrest; always dilute and infuse slowly.'},
