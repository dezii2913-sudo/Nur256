<script>
document.getElementById('sec-fluids').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">💧</span> Fluid Balance & IV Therapy</h2>
<p class="intro-line">Chapter 10, first half. Water follows solute. Every fluid answer on this exam traces back to that one sentence.</p>

<div class="card" style="border-color:var(--teal)">
  <h3>The compartments</h3>
  <ul class="clean">
    <li>Total body water is about <b>60% of body weight</b> in an adult, lower in older adults and in obesity.</li>
    <li><b>Intracellular (ICF)</b> ≈ two thirds. Principal cation is <b>potassium</b>.</li>
    <li><b>Extracellular (ECF)</b> ≈ one third, split into interstitial and intravascular. Principal cation is <b>sodium</b>.</li>
    <li><b>Osmosis</b> moves water toward the higher solute concentration. <b>Diffusion</b> moves solute from high to low. <b>Filtration</b> is driven by hydrostatic pressure.</li>
    <li><b>Oncotic pressure</b> comes from albumin and holds water inside the vessel. <b>Hydrostatic pressure</b> pushes it out.</li>
  </ul>
</div>

<div class="card">
  <h3>Who regulates fluid</h3>
  <table class="lab">
    <tr><th>Organ / hormone</th><th>What it does</th></tr>
    <tr><td><b>Kidneys</b></td><td>Regulate ECF volume and osmolality, excrete waste, activate vitamin D, balance acid-base</td></tr>
    <tr><td><b>Heart and vessels</b></td><td>Pump blood to the kidney so filtration can happen; baroreceptors sense pressure</td></tr>
    <tr><td><b>Lungs</b></td><td>Remove about 300 mL of water daily as vapor; regulate CO₂ (acid)</td></tr>
    <tr><td><b>ADH (pituitary)</b></td><td>Retains <b>water</b>. Released when osmolality rises or volume falls. "Anti-diuretic = hold water."</td></tr>
    <tr><td><b>Aldosterone (adrenal)</b></td><td>Retains <b>sodium and water</b>, excretes potassium</td></tr>
    <tr><td><b>RAAS</b></td><td>Low BP → renin → angiotensin II (vasoconstriction) → aldosterone → volume up</td></tr>
    <tr><td><b>Natriuretic peptides (ANP/BNP)</b></td><td>Released when the heart stretches. Promote sodium and water <b>loss</b> — the body's counter to RAAS. High BNP suggests overload or heart failure.</td></tr>
    <tr><td><b>PTH (parathyroid)</b></td><td>Raises serum calcium, lowers phosphorus</td></tr>
  </table>
  <div class="mnem"><div class="tag">Fast recall</div><div class="big">ADH holds Water. Aldosterone holds Salt and water. Natriuretic peptides dump both.</div></div>
</div>

<div class="card">
  <h3>Fluid volume deficit vs. excess</h3>
  <table class="lab">
    <tr><th></th><th>Deficit (hypovolemia)</th><th>Excess (hypervolemia)</th></tr>
    <tr><td><b>Cause</b></td><td>Vomiting, diarrhea, hemorrhage, diuresis, third spacing, poor intake</td><td>Heart failure, kidney failure, cirrhosis, excess sodium or IV fluid</td></tr>
    <tr><td><b>Vitals</b></td><td>↑HR, ↓BP, orthostatic drop, weak thready pulse</td><td>Bounding pulse, ↑BP, ↑CVP</td></tr>
    <tr><td><b>Exam</b></td><td>Poor turgor, dry mucous membranes, flat neck veins, ↓urine output</td><td>Crackles, edema, JVD, dyspnea</td></tr>
    <tr><td><b>Labs</b></td><td>↑BUN:creatinine ratio, ↑hematocrit, ↑urine specific gravity</td><td>↓hematocrit and ↓BUN from dilution, ↓urine specific gravity</td></tr>
    <tr><td><b>Weight</b></td><td>Rapid loss</td><td>Rapid gain</td></tr>
    <tr><td><b>Treatment</b></td><td>Isotonic IV fluid, treat the cause, oral rehydration if tolerated</td><td>Diuretics, sodium and fluid restriction, daily weights, semi-Fowler</td></tr>
  </table>
  <div class="hy"><span class="tag">Best indicator</span><b>Daily weight on the same scale, same time, same clothing.</b> 1 kg ≈ 1 L. It beats intake and output because I&O misses insensible losses and charting gaps.</div>
</div>

<div class="card">
  <h3>Third spacing</h3>
  <p class="why-chain">Low albumin or a damaged capillary wall drops oncotic pressure → hydrostatic pressure wins → fluid leaves the vessel for the interstitium or a body cavity. The patient looks <b>edematous</b> and is simultaneously <b>intravascularly dry</b>.</p>
  <ul class="clean">
    <li>Seen in burns, sepsis, liver failure, hypoalbuminemia, major surgery, ascites.</li>
    <li>Watch the perfusion numbers, not the ankles: falling BP, rising heart rate, falling urine output.</li>
    <li>The fluid returns to the vasculature later — watch for <b>overload during the mobilization phase</b>.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>IV solutions by tonicity</h3>
  <table class="lab">
    <tr><th>Type</th><th>Examples</th><th>Where water goes</th><th>Used for / risk</th></tr>
    <tr><td><b>Isotonic</b></td><td>0.9% NS, lactated Ringer, D5W (in the bag)</td><td>Stays in the vessel</td><td>Hypovolemia, blood loss. Risk: fluid overload</td></tr>
    <tr><td><b>Hypotonic</b></td><td>0.45% NS, 0.33% NS, D5W (once dextrose is metabolized)</td><td>Moves INTO cells</td><td>Cellular dehydration, hypernatremia. Risk: <b>cerebral edema</b>, ↓BP</td></tr>
    <tr><td><b>Hypertonic</b></td><td>3% NS, 5% NS, D10W, D5NS, D5LR</td><td>Pulls water OUT of cells</td><td>Severe symptomatic hyponatremia, cerebral edema. Risk: overload, phlebitis</td></tr>
  </table>
  <ul class="clean">
    <li><b>D5W is isotonic in the bag and hypotonic in the patient.</b> Both descriptions are true and both appear as options.</li>
    <li><b>Lactated Ringer contains calcium and potassium.</b> Avoid in liver failure (can't metabolize lactate) and never hang it with blood.</li>
    <li><b>3% saline is high-alert.</b> Correct sodium slowly — too fast causes osmotic demyelination. Monitor lung sounds and neuro status.</li>
  </ul>
</div>

<div class="card">
  <h3>IV complications</h3>
  <table class="lab">
    <tr><th>Complication</th><th>Signs</th><th>Action</th></tr>
    <tr><td><b>Infiltration</b></td><td><b>Cool</b>, swollen, pale, taut; slowed rate</td><td>Stop, remove catheter, elevate, warm or cool compress per policy</td></tr>
    <tr><td><b>Extravasation</b></td><td>Same, but with a <b>vesicant</b> — tissue necrosis risk</td><td>Stop, leave catheter, aspirate residual, notify provider</td></tr>
    <tr><td><b>Phlebitis</b></td><td><b>Warm</b>, red, tender, palpable cord</td><td>Discontinue, restart in a new site, warm compress</td></tr>
    <tr><td><b>Fluid overload</b></td><td>Crackles, dyspnea, cough, JVD, ↑BP</td><td><b>Slow or stop</b>, raise the head of the bed, oxygen, notify provider</td></tr>
    <tr><td><b>Air embolism</b></td><td>Sudden dyspnea, chest pain, hypotension, altered LOC</td><td>Clamp the line, <b>left side with head down</b>, oxygen, notify provider</td></tr>
    <tr><td><b>Infection</b></td><td>Redness and drainage at the site, fever, chills</td><td>Discontinue, culture, aseptic technique on restart</td></tr>
  </table>
  <div class="mnem"><div class="tag">Cool vs warm</div><div class="big">Infiltration is COOL. Phlebitis is WARM.</div><div class="exp">That one word separates them in almost every stem he writes.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — hypotonic fluid to "replace water"</span>A hypotensive dehydrated patient with <b>0.45% saline</b> offered. It sounds like replacing water. It moves water into cells and drops the BP further. An <b>intravascular volume</b> problem takes <b>isotonic</b> fluid.</div>
  <div class="trap"><span class="tag">Trap 2 — edema read as overload</span>A swollen patient with a falling BP and rising heart rate. That is <b>third spacing</b>, so the vessel is dry. Diuresing them makes it worse.</div>
  <div class="trap"><span class="tag">Trap 3 — the "best indicator" question</span>Blood pressure, skin turgor, and urine color all appear and all are real assessments. <b>Daily weight</b> wins because it is the most reliable and quantifiable.</div>
  <div class="trap"><span class="tag">Trap 4 — the burning or aching IV site</span>"Slow the rate and continue" and "apply a warm compress" both sound caring. <b>Stop the infusion</b> and assess first.</div>
  <div class="trap"><span class="tag">Trap 5 — turgor in an older adult</span>Age-related loss of skin elasticity makes forearm turgor unreliable. Check the <b>sternum or forehead</b>, plus mucous membranes and urine concentration.</div>
</div>

<div id="q-fluids"></div>`;
renderFilteredQuiz('q-fluids', secQ(EXAM.filter(q=>q.topic==='fluids')), 'Fluids & IV practice', 'Fluids');


document.getElementById('sec-lytes').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">⚡</span> Electrolytes</h2>
<p class="intro-line">Chapter 10, second half. Learn the normal range, the ECG or neuro sign, and the one intervention that kills if you get it wrong.</p>

<div class="card" style="border-color:var(--teal)">
  <h3>Normal ranges — memorize these cold</h3>
  <table class="lab">
    <tr><th>Electrolyte</th><th>Normal range</th></tr>
    <tr><td><b>Sodium</b></td><td>135 – 145 mEq/L</td></tr>
    <tr><td><b>Potassium</b></td><td>3.5 – 5.0 mEq/L</td></tr>
    <tr><td><b>Calcium (total)</b></td><td>8.6 – 10.2 mg/dL</td></tr>
    <tr><td><b>Magnesium</b></td><td>1.3 – 2.3 mg/dL</td></tr>
    <tr><td><b>Phosphorus</b></td><td>2.5 – 4.5 mg/dL</td></tr>
    <tr><td><b>Chloride</b></td><td>97 – 107 mEq/L</td></tr>
  </table>
</div>

<div class="card">
  <h3>Sodium — the water electrolyte</h3>
  <table class="lab">
    <tr><th></th><th>Hyponatremia (&lt;135)</th><th>Hypernatremia (&gt;145)</th></tr>
    <tr><td><b>Causes</b></td><td>Vomiting, diarrhea, diuretics, SIADH, excess water intake, adrenal insufficiency</td><td>Water loss, poor intake, diabetes insipidus, hypertonic feeds, excess sodium</td></tr>
    <tr><td><b>Cells</b></td><td>Water moves IN → cells <b>swell</b></td><td>Water moves OUT → cells <b>shrink</b></td></tr>
    <tr><td><b>Signs</b></td><td>Headache, confusion, lethargy, muscle cramps, <b>seizures from cerebral edema</b></td><td><b>Intense thirst</b>, dry sticky mucous membranes, restlessness, weakness, seizures if severe</td></tr>
    <tr><td><b>Treatment</b></td><td>Fluid restriction; hypertonic saline only if severe and symptomatic, corrected <b>slowly</b></td><td>Hypotonic fluid or D5W slowly, free water, treat the cause</td></tr>
  </table>
  <div class="trap"><span class="tag">Why "slowly" matters both ways</span>Correcting sodium too fast causes <b>osmotic demyelination</b> going up and <b>cerebral edema</b> coming down. "Rapidly normalize the sodium" is never the answer.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>Potassium — the one that kills</h3>
  <table class="lab">
    <tr><th></th><th>Hypokalemia (&lt;3.5)</th><th>Hyperkalemia (&gt;5.0)</th></tr>
    <tr><td><b>Causes</b></td><td>Diuretics, vomiting, NG suction, diarrhea, insulin, alkalosis, poor intake</td><td>Kidney failure, ACE inhibitors/ARBs, spironolactone, acidosis, cell lysis, over-replacement</td></tr>
    <tr><td><b>ECG</b></td><td><b>Flat T waves, U wave</b>, ST depression</td><td><b>Peaked narrow T waves</b> → widened QRS → asystole</td></tr>
    <tr><td><b>Other signs</b></td><td>Muscle weakness, leg cramps, <b>ileus</b>, shallow respirations, digoxin toxicity risk</td><td>Muscle weakness, paresthesias, <b>abdominal cramping and diarrhea</b>, dysrhythmias</td></tr>
    <tr><td><b>Treatment</b></td><td>Oral or diluted IV potassium <b>on a pump</b>; replace <b>magnesium</b> too; potassium-rich foods</td><td><b>Calcium gluconate</b> → insulin+dextrose and albuterol → kayexalate or dialysis</td></tr>
  </table>
  <div class="mnem"><div class="tag">Hyperkalemia sequence</div><div class="big">PROTECT → SHIFT → REMOVE</div><div class="exp">Calcium gluconate protects the myocardium. Insulin/dextrose and albuterol shift K into cells. Kayexalate or dialysis actually removes it.</div></div>
  <div class="trap"><span class="tag">Never</span><b>IV push potassium is fatal.</b> Always dilute and infuse on a pump. Never give it to a patient with no urine output. Never exceed the ordered rate to "catch up."</div>
  <div class="hy"><span class="tag">Potassium-rich foods</span>Banana, spinach, potato, avocado, orange, tomato, cantaloupe, dried fruit, legumes.</div>
</div>

<div class="card">
  <h3>Calcium — the nerve stabilizer</h3>
  <table class="lab">
    <tr><th></th><th>Hypocalcemia (&lt;8.6)</th><th>Hypercalcemia (&gt;10.2)</th></tr>
    <tr><td><b>Causes</b></td><td>Thyroid/parathyroid surgery, vitamin D deficiency, pancreatitis, massive transfusion, alkalosis</td><td>Malignancy with bone metastasis, hyperparathyroidism, immobility, thiazides, excess vitamin D</td></tr>
    <tr><td><b>Direction</b></td><td>Things <b>FIRE</b></td><td>Things <b>SLOW DOWN</b></td></tr>
    <tr><td><b>Signs</b></td><td><b>Chvostek</b> (tap the facial nerve, cheek twitches), <b>Trousseau</b> (BP cuff, hand spasms), perioral tingling, tetany, <b>laryngospasm</b>, seizures</td><td>Lethargy, confusion, <b>constipation</b>, muscle weakness, bone pain, kidney stones, polyuria</td></tr>
    <tr><td><b>Treatment</b></td><td>Calcium gluconate IV for severe; oral calcium with vitamin D; <b>seizure and airway precautions</b></td><td><b>Isotonic saline</b> to promote urinary excretion, then a <b>bisphosphonate</b>; mobilize; increase fluids</td></tr>
  </table>
  <div class="mnem"><div class="tag">Keep them straight</div><div class="big">LOW calcium = things fire. HIGH calcium = things slow.</div><div class="exp">"Stones, bones, groans, and psychiatric overtones" is the HIGH side.</div></div>
</div>

<div class="card">
  <h3>Magnesium and phosphorus</h3>
  <table class="lab">
    <tr><th></th><th>Low</th><th>High</th></tr>
    <tr><td><b>Magnesium</b></td><td>Alcohol use, malabsorption, diuretics. Signs mirror <b>hypocalcemia</b>: tremor, tetany, positive Chvostek/Trousseau, dysrhythmias. Give IV magnesium slowly.</td><td>Kidney failure, magnesium-containing antacids/laxatives. <b>Loss of deep tendon reflexes</b>, hypotension, bradycardia, respiratory depression. Antidote: <b>calcium gluconate</b>.</td></tr>
    <tr><td><b>Phosphorus</b></td><td>Refeeding syndrome, alcohol use, antacids. Muscle weakness, confusion, respiratory failure.</td><td>Kidney failure, tumor lysis. Symptoms are mostly from the resulting <b>hypocalcemia</b>. Phosphate binders with meals.</td></tr>
  </table>
  <div class="hy"><span class="tag">The pairings that get tested</span><b>Calcium and phosphorus move opposite.</b> <b>Magnesium and calcium move together</b> in their signs. And <b>you cannot correct hypokalemia until magnesium is replaced</b>, because magnesium is required for the cell to hold potassium.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the hyperkalemia order</span>All four options are real hyperkalemia treatments. The question is the <b>sequence</b>. Calcium gluconate first, because it protects the heart while the other drugs take time to work.</div>
  <div class="trap"><span class="tag">Trap 2 — the calcium lists swapped</span>Hypocalcemia stems offered with "constipation, kidney stones, lethargy." That is the <b>hyper</b> list. Low calcium fires: tetany, tingling, laryngospasm, seizures.</div>
  <div class="trap"><span class="tag">Trap 3 — the stubborn potassium</span>A hypokalemia that will not correct despite replacement. The answer is not more potassium, it is <b>replacing magnesium first</b>.</div>
  <div class="trap"><span class="tag">Trap 4 — potassium and urine output</span>Any option giving potassium to a patient with poor urine output is wrong, no matter how low the level is. Check the output first.</div>
  <div class="trap"><span class="tag">Trap 5 — priority among four abnormal labs</span>He gives you four out-of-range electrolytes. Rank by <b>what kills fastest</b>: potassium (dysrhythmia) and calcium (laryngospasm) beat sodium drift and phosphorus every time.</div>
</div>

<div id="q-lytes"></div>`;
renderFilteredQuiz('q-lytes', secQ(EXAM.filter(q=>q.topic==='lytes')), 'Electrolyte practice', 'Electrolytes');


document.getElementById('sec-abg').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🫁</span> Acid-Base & ABGs</h2>
<p class="intro-line">Chapter 10, final section. Three numbers, one rule, and you can name any gas he writes.</p>

<div class="card" style="border-color:var(--teal)">
  <h3>The three numbers</h3>
  <table class="lab">
    <tr><th>Value</th><th>Normal</th><th>Controlled by</th></tr>
    <tr><td><b>pH</b></td><td>7.35 – 7.45</td><td>The net result</td></tr>
    <tr><td><b>PaCO₂</b> (the acid)</td><td>35 – 45 mmHg</td><td><b>Lungs</b> — minutes</td></tr>
    <tr><td><b>HCO₃</b> (the base)</td><td>22 – 26 mEq/L</td><td><b>Kidneys</b> — hours to days</td></tr>
    <tr><td>PaO₂</td><td>80 – 100 mmHg</td><td>Oxygenation, not acid-base</td></tr>
  </table>
  <div class="mnem"><div class="tag">The whole method</div><div class="big">ROME — Respiratory Opposite, Metabolic Equal</div><div class="exp">pH and CO₂ moving in <b>opposite</b> directions = respiratory. pH and bicarb moving in the <b>same</b> direction = metabolic.</div></div>
  <div class="mnem" style="border-color:var(--gold)"><div class="tag">⭐ He asks this out loud</div><div class="big">Kidney problem → automatically METABOLIC. Lung problem → automatically RESPIRATORY.</div><div class="exp">The kidneys own bicarbonate and the lungs own CO₂. Name the broken organ and you have already named half the gas.</div></div>
</div>

<div class="card" style="border-color:var(--gold)">
  <h3>⭐ The organ shortcut</h3>
  <p class="why-chain">If the stem tells you which organ is failing, you do not have to derive the type — the organ names it. <b>Kidneys regulate bicarbonate (the base), so a kidney problem is metabolic. Lungs regulate CO₂ (the acid), so a lung problem is respiratory.</b></p>
  <ol class="chainlist">
    <li><b>1.</b> Healthy kidneys excrete hydrogen ions and regenerate bicarbonate, which is how the body dumps fixed acid.</li>
    <li><b>2.</b> In kidney failure both jobs stop. Acid accumulates and bicarbonate falls.</li>
    <li><b>3.</b> pH down + bicarb down = same direction = <b>metabolic acidosis</b>. That is the default gas for a renal patient.</li>
    <li><b>4.</b> The kidneys are also the <b>compensator</b> for respiratory problems. If they are failing, they cannot compensate — so expect an <b>uncompensated or only partially compensated</b> respiratory gas in a patient with renal disease.</li>
    <li><b>5.</b> And renal metabolic acidosis travels with <b>hyperkalemia</b>: acidosis shifts potassium out of cells, and the failing kidney cannot excrete it either. Low pH in a renal patient → check the potassium and the ECG.</li>
  </ol>
  <div class="hy"><span class="tag">Same logic, other direction</span>Chronic <b>lung</b> disease → respiratory acidosis, and the healthy kidney compensates by retaining bicarbonate over days. That is why a stable COPD gas reads <b>fully compensated respiratory acidosis</b> — pH normal on the acid side, CO₂ high, bicarb high.</div>
  <div class="trap"><span class="tag">Where he turns the screw</span>A dialysis or CKD patient with a low pH and options offering respiratory causes. The organ already told you the answer. Equally, do not force "metabolic" onto a patient whose only problem is hypoventilation — the shortcut runs organ → type, not backwards.</div>
</div>

<div class="card">
  <h3>Read it in three steps</h3>
  <ul class="clean">
    <li><b>0. Check whether the stem names a failing organ.</b> Kidneys = metabolic. Lungs = respiratory. If it does, you already know the type.</li>
    <li><b>1. Look at the pH.</b> Below 7.35 = acidosis. Above 7.45 = alkalosis. If it is 7.35–7.45, it is normal or fully compensated.</li>
    <li><b>2. Find the culprit.</b> Which value moved the way that explains the pH? CO₂ opposite = respiratory. Bicarb same = metabolic.</li>
    <li><b>3. Check compensation.</b> pH abnormal + one value abnormal = <b>uncompensated</b>. pH abnormal + both abnormal = <b>partially compensated</b>. pH <b>normal</b> + both abnormal = <b>fully compensated</b>.</li>
  </ul>
  <div class="hy"><span class="tag">Which side of normal</span>In full compensation the pH tells you the original problem. <b>7.35–7.39 = the acid side.</b> <b>7.41–7.45 = the alkalotic side.</b> That is how you name a gas whose pH looks normal.</div>
</div>

<div class="card">
  <h3>Causes by type</h3>
  <table class="lab">
    <tr><th>Disorder</th><th>Causes</th><th>Signs</th></tr>
    <tr><td><b>Respiratory acidosis</b><br>↓pH ↑CO₂</td><td>Anything that retains CO₂: COPD, oversedation, opioid overdose, atelectasis, pneumonia, chest trauma, neuromuscular weakness</td><td>Drowsiness, headache, confusion, ↑HR, dysrhythmias</td></tr>
    <tr><td><b>Respiratory alkalosis</b><br>↑pH ↓CO₂</td><td>Hyperventilation: anxiety, pain, fever, early PE, high altitude, over-ventilation</td><td>Lightheaded, <b>tingling of fingers and around the mouth</b>, dizziness, tetany</td></tr>
    <tr><td><b>Metabolic acidosis</b><br>↓pH ↓HCO₃</td><td>DKA, kidney failure, lactic acidosis from shock, prolonged diarrhea (loses bicarbonate)</td><td><b>Kussmaul respirations</b> (deep and rapid to blow off acid), headache, confusion, hyperkalemia</td></tr>
    <tr><td><b>Metabolic alkalosis</b><br>↑pH ↑HCO₃</td><td>Vomiting or NG suction (loses acid), excess antacids, diuretics, hypokalemia</td><td>Tingling, dizziness, <b>hypoventilation</b> to retain CO₂, hypokalemia</td></tr>
  </table>
</div>

<div class="card">
  <h3>Practice reading</h3>
  <table class="lab">
    <tr><th>pH</th><th>PaCO₂</th><th>HCO₃</th><th>Interpretation</th></tr>
    <tr><td>7.30</td><td>52</td><td>24</td><td>Uncompensated <b>respiratory acidosis</b></td></tr>
    <tr><td>7.49</td><td>40</td><td>30</td><td>Uncompensated <b>metabolic alkalosis</b></td></tr>
    <tr><td>7.25</td><td>36</td><td>16</td><td>Uncompensated <b>metabolic acidosis</b></td></tr>
    <tr><td>7.52</td><td>28</td><td>23</td><td>Uncompensated <b>respiratory alkalosis</b></td></tr>
    <tr><td>7.32</td><td>58</td><td>30</td><td>Partially compensated <b>respiratory acidosis</b></td></tr>
    <tr><td>7.37</td><td>58</td><td>32</td><td><b>Fully compensated respiratory acidosis</b> — classic chronic COPD</td></tr>
    <tr><td>7.43</td><td>30</td><td>20</td><td><b>Fully compensated respiratory alkalosis</b></td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — a normal pH that is not normal</span>Fully compensated means <b>pH normal, both systems abnormal</b>. Stop at the pH and you will call a chronic COPD gas "normal."</div>
  <div class="trap"><span class="tag">Trap 2 — which side of 7.40</span>In full compensation, 7.37 is the <b>acid</b> side and 7.43 is the <b>alkalotic</b> side. That single digit names the disorder.</div>
  <div class="trap"><span class="tag">Trap 3 — treating the number</span>"Give sodium bicarbonate" and "apply 100% oxygen" get offered as fixes. Treat the <b>cause</b>: ventilation, perfusion, or the metabolic problem driving it.</div>
  <div class="trap"><span class="tag">Trap 4 — vomiting vs diarrhea</span><b>Vomiting and NG suction lose acid</b> → metabolic <b>alkalosis</b>. <b>Diarrhea loses bicarbonate</b> → metabolic <b>acidosis</b>. He puts both in the same question.</div>
  <div class="trap"><span class="tag">Trap 5 — ignoring the organ he handed you</span>A renal failure or dialysis patient with an abnormal pH, and respiratory options mixed in. <b>Kidneys = metabolic.</b> He tells you the organ precisely so he can see who uses it.</div>
  <div class="trap"><span class="tag">Trap 6 — hyperventilation assumed to be anxiety</span>Respiratory alkalosis from hyperventilation can be anxiety, but it can also be an early <b>PE</b>, sepsis, or fever. Sedating that patient is how you miss the emergency.</div>
</div>

<div id="q-abg"></div>`;
renderFilteredQuiz('q-abg', secQ(EXAM.filter(q=>q.topic==='abg')), 'ABG practice', 'Acid-Base');

</script>
<script>
document.getElementById('sec-cancer').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🎗️</span> Cancer — Mechanism and Care</h2>
<p class="intro-line">One sentence generates every side effect on this exam: treatment kills rapidly dividing cells and cannot tell cancer from normal tissue.</p>

<div class="card">
  <h3>Benign vs. Malignant</h3>
  <table class="lab">
    <tr><th>Characteristic</th><th>Benign</th><th>Malignant</th></tr>
    <tr><td><b>Differentiation</b></td><td>Well-differentiated, resembles parent tissue</td><td>Undifferentiated, cells vary in size and shape</td></tr>
    <tr><td><b>Mode of growth</b></td><td>Expands and displaces, encapsulated</td><td>Infiltrates and invades surrounding tissue</td></tr>
    <tr><td><b>Rate of growth</b></td><td>Slow, may stop or regress</td><td>Variable, generally rapid</td></tr>
    <tr><td><b>Metastasis</b></td><td>Never</td><td>Common, via blood, lymph, and seeding</td></tr>
    <tr><td><b>Systemic effects</b></td><td>Rare</td><td>Common — anemia, weakness, weight loss</td></tr>
    <tr><td><b>Tissue destruction</b></td><td>Usually none</td><td>Ulceration, necrosis, secondary infection</td></tr>
    <tr><td><b>Lethality</b></td><td>Rare, unless it compresses a vital structure</td><td>Usually fatal untreated</td></tr>
  </table>
  <div class="mnem"><div class="tag">Fast recall</div><div class="big">Benign Behaves. Malignant Migrates.</div></div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⚠️ CAUTION UP — the seven warning signs</h3>
  <ul class="clean">
    <li><b>C</b>hange in bowel or bladder habits</li>
    <li><b>A</b> sore that does not heal</li>
    <li><b>U</b>nusual bleeding or discharge</li>
    <li><b>T</b>hickening or a lump in the breast or elsewhere</li>
    <li><b>I</b>ndigestion or difficulty swallowing</li>
    <li><b>O</b>bvious change in a wart or mole</li>
    <li><b>N</b>agging cough or hoarseness</li>
    <li><b>U</b>nexplained weight loss</li>
    <li><b>P</b>ernicious anemia</li>
  </ul>
</div>

<div class="card">
  <h3>Levels of prevention</h3>
  <table class="lab">
    <tr><th>Level</th><th>What it is</th><th>Examples</th></tr>
    <tr><td><b>Primary</b></td><td>Risk reduction and health promotion before disease exists</td><td>HPV vaccine, smoking cessation, sunscreen, diet</td></tr>
    <tr><td><b>Secondary</b></td><td>Screening and early detection in an asymptomatic person</td><td>Colonoscopy, mammogram, Pap, PSA, self-exam</td></tr>
    <tr><td><b>Tertiary</b></td><td>Monitoring and preventing recurrence after a known cancer</td><td>Survivorship clinic, surveillance imaging, rehab</td></tr>
  </table>
  <div class="trap"><span class="tag">His favorite version</span>He makes all four options correct health behaviors. Only the classification level separates them. Vaccination is primary even though it prevents cancer.</div>
</div>

<div class="card">
  <h3>Staging and grading</h3>
  <ul class="clean">
    <li><b>Grading</b> = how abnormal the cells look. Grade 1 well-differentiated through Grade 4 undifferentiated.</li>
    <li><b>Staging</b> = how far it has spread. <b>TNM</b>: <b>T</b>umor size and extent, regional lymph <b>N</b>odes, distant <b>M</b>etastasis.</li>
    <li>Metastasis routes: <b>lymphatic</b> spread, <b>hematogenous</b> spread, and <b>direct seeding</b> into a body cavity.</li>
    <li>Common metastasis sites: bone, brain, liver, lung.</li>
  </ul>
  <div class="mnem"><div class="tag">Keep them apart</div><div class="big">Grading = the cells. Staging = the spread.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>How treatment affects normal cells</h3>
  <table class="lab">
    <tr><th>Cell line hit</th><th>Result</th><th>Nursing focus</th></tr>
    <tr><td><b>RBC</b></td><td>Anemia, fatigue, pallor, dyspnea</td><td>Rest periods, monitor H&H, transfuse as ordered</td></tr>
    <tr><td><b>WBC (neutrophils)</b></td><td>Cannot fight infection</td><td><b>Neutropenic precautions</b>, no fresh flowers or raw produce, hand hygiene</td></tr>
    <tr><td><b>Platelets</b></td><td>Bleeding risk</td><td>Electric razor, soft toothbrush, no rectal temps or suppositories, no aspirin or NSAIDs</td></tr>
    <tr><td><b>Hair follicles</b></td><td>Alopecia (reversible)</td><td>Pre-plan wigs and scarves BEFORE hair loss</td></tr>
    <tr><td><b>GI epithelium</b></td><td>Mucositis, ulcers, nausea, diarrhea</td><td>Soft bland foods, saline rinses, antiemetics</td></tr>
  </table>
  <div class="hy"><span class="tag">Nadir</div>The lowest blood counts occur about <b>7 to 14 days</b> after a chemo dose. That is the window of highest infection and bleeding risk.</div>
</div>

<div class="card">
  <h3>Complications of cancer</h3>
  <ul class="clean">
    <li><b>Pain</b> — whatever the patient says it is, occurring whenever they say it does. Around-the-clock dosing for constant pain, breakthrough dosing on top.</li>
    <li><b>Infection</b> — neutropenia makes it look asymptomatic. A low-grade fever may be the only sign.</li>
    <li><b>Altered nutrition</b> — deficient intake → malnutrition → <b>cachexia</b>. Follow <b>albumin and prealbumin</b>; feed high-calorie, high-protein, soft, nonirritating foods in small frequent amounts.</li>
    <li><b>Psychosocial</b> — anxiety, altered body image, role loss, fear of recurrence. Build an open honest relationship, listen actively, give accurate information.</li>
  </ul>
  <div class="why-chain"><b>Albumin comes from the liver.</b> Liver cancer or metastasis drops albumin → oncotic pressure falls → fluid leaves the vessel → <b>third spacing</b>. The patient is edematous and intravascularly dry at the same time.</div>
</div>

<div class="card">
  <h3>Radiation and chemo safety</h3>
  <ul class="clean">
    <li><b>External beam radiation:</b> do not wash off skin markings, no lotions, powders, or metallic products on the field before treatment (they alter surface dose), mild soap and water, no direct sun, no heating pads.</li>
    <li><b>Internal (brachytherapy):</b> time, distance, shielding. No pregnant staff or visitors, no children. Keep long-handled forceps and a lead container in the room.</li>
    <li><b>Chemo extravasation:</b> STOP the infusion immediately, leave the catheter in place, aspirate residual drug, notify the provider.</li>
  </ul>
</div>

<div id="cancerQuiz"></div>`;
renderFilteredQuiz('cancerQuiz', secQ(EXAM.filter(q=>q.topic==='cancer')), 'Cancer practice', 'Cancer');


document.getElementById('sec-oncoemerg').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🚨</span> Oncologic Emergencies</h2>
<p class="intro-line">Four emergencies that turn a stable oncology patient into a priority question.</p>

<div class="card" style="border-color:var(--red)">
  <h3>Neutropenic sepsis</h3>
  <ul class="clean">
    <li><b>Trigger:</b> ANC under 500 plus a temperature of 100.4°F or higher, or 100.0°F sustained an hour.</li>
    <li><b>Why it hides:</b> no neutrophils means no pus, no redness, no swelling. A normal-looking IV site proves nothing.</li>
    <li><b>Actions:</b> blood cultures from two sites → <b>broad-spectrum antibiotics within 60 minutes</b> → isotonic fluids for hypotension → protective isolation.</li>
    <li><b>Question the order:</b> an antipyretic before the workup, because fever is the only sign the patient can still produce.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>Tumor lysis syndrome</h3>
  <ul class="clean">
    <li><b>Mechanism:</b> rapid tumor cell death dumps intracellular contents into the blood.</li>
    <li><b>Labs:</b> ↑ potassium, ↑ phosphate, ↑ uric acid, <b>↓ calcium</b> (phosphate binds it).</li>
    <li><b>Treatment:</b> aggressive IV hydration, <b>allopurinol or rasburicase</b> for uric acid, manage hyperkalemia separately.</li>
    <li><b>Watch for:</b> arrhythmia from the potassium, acute kidney injury from the uric acid.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>Hypercalcemia of malignancy</h3>
  <ul class="clean">
    <li><b>Mechanism:</b> bone metastasis or tumor-secreted PTH-related peptide releases calcium from bone.</li>
    <li><b>Signs:</b> lethargy, confusion, constipation, muscle weakness, polyuria, nausea. "Stones, bones, groans, and psychiatric overtones."</li>
    <li><b>Treatment:</b> <b>isotonic saline first</b> to promote urinary calcium excretion, then a <b>bisphosphonate</b> to block resorption.</li>
    <li><b>Never:</b> supplement calcium or restrict fluids.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>Superior vena cava syndrome and spinal cord compression</h3>
  <ul class="clean">
    <li><b>SVC syndrome:</b> tumor compresses the SVC → facial and upper body edema, distended neck veins, dyspnea, "shirt collar feels tight." Raise the head of the bed, oxygen, urgent radiation or stenting.</li>
    <li><b>Spinal cord compression:</b> back pain is the earliest and most common symptom, then motor weakness, sensory loss, and finally bowel or bladder changes. <b>Treat before the deficits become permanent</b> — steroids and radiation.</li>
  </ul>
  <div class="hy"><span class="tag">Priority logic</span>New back pain in a patient with known metastatic cancer is not a comfort issue. It is a neurologic emergency until imaging says otherwise.</div>
</div>

<div id="oncoQuiz"></div>`;
renderFilteredQuiz('oncoQuiz', secQ(EXAM.filter(q=>q.topic==='meds')), 'Emergency and drug practice', 'Oncologic emergencies');

</script>
<script>
document.getElementById('sec-pre').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🔵</span> Preoperative — Prepare the Patient</h2>
<p class="intro-line">Goal: optimize the patient physically and psychologically before surgery. Everything else is a task inside that goal.</p>

<div class="card">
  <h3>Preoperative assessment priorities</h3>
  <ul class="clean">
    <li><b>Allergies</b> — especially latex, iodine, eggs and soy (propofol), and prior anesthesia reactions.</li>
    <li><b>Family history of anesthesia problems</b> — this is how malignant hyperthermia gets caught before it happens.</li>
    <li><b>Medications</b> — anticoagulants, antiplatelets, insulin, steroids, and herbals.</li>
    <li><b>Substance use</b> — alcohol and tobacco change anesthesia needs and healing.</li>
    <li><b>Nutrition and hydration</b> — obesity and malnutrition both raise complication risk.</li>
    <li><b>Comorbidities</b> — cardiac, respiratory, renal, hepatic, and diabetes.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>NPO guidelines — the reason, not the clock</h3>
  <table class="lab">
    <tr><th>Intake</th><th>Fast before surgery</th></tr>
    <tr><td>Clear liquids</td><td><b>2 hours</b></td></tr>
    <tr><td>Breast milk</td><td>4 hours</td></tr>
    <tr><td>Light meal, infant formula, milk</td><td><b>6 hours</b></td></tr>
    <tr><td>Fatty or fried meal, meat</td><td><b>8 hours</b></td></tr>
  </table>
  <div class="why-chain">Anesthesia abolishes the gag reflex and relaxes the lower esophageal sphincter, so anything still in the stomach can reflux and be aspirated. The interval is set by <b>gastric emptying time</b>, which is why clear liquids are allowed last.</div>
  <div class="trap"><span class="tag">Outdated distractor</span>"NPO after midnight for everything, no exceptions." He uses it because it is what most students were taught.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>Informed consent — who does what</h3>
  <ul class="clean">
    <li><b>The surgeon</b> obtains consent and explains risks, benefits, and alternatives.</li>
    <li><b>The nurse</b> witnesses the signature and verifies the patient understands. If the patient cannot explain the procedure, <b>stop and call the surgeon</b>.</li>
    <li>Consent must be voluntary, from a competent adult, and obtained <b>before</b> sedating medication.</li>
    <li><b>Consent is revocable at any time</b>, including after signing and up to the moment of incision.</li>
    <li>Emergency exception: implied consent when the patient cannot consent and delay would be life-threatening.</li>
  </ul>
</div>

<div class="card">
  <h3>Preop teaching and immediate prep</h3>
  <ul class="clean">
    <li>Teach <b>before</b> the day of surgery when possible: deep breathing, incentive spirometry, splinting, ankle pumps, pain scale, and what to expect in PACU.</li>
    <li>Immediate prep: verify ID and allergies, confirm signed consent, have the patient void, remove dentures, jewelry, prosthetics, and nail polish, and confirm site marking.</li>
    <li><b>Diabetic patients:</b> hold metformin, reduce or hold mealtime insulin while NPO, check glucose on arrival. Near-normal glucose lowers infection risk and improves healing.</li>
    <li><b>Anticoagulants:</b> warfarin held about 5 days; herbals (garlic, ginkgo, ginger, ginseng) stopped about 2 weeks out.</li>
    <li><b>Latex allergy:</b> schedule the case <b>first</b>, latex-free supplies, signage, emergency equipment available.</li>
  </ul>
</div>

<div id="preQuiz"></div>`;
renderFilteredQuiz('preQuiz', secQ(EXAM.filter(q=>q.topic==='pre')), 'Preoperative practice', 'Preoperative');


document.getElementById('sec-intra').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🟢</span> Intraoperative — Safety, Roles, MH, Fire</h2>
<p class="intro-line">Everything in the OR is a safety system. Know which role owns which safety job.</p>

<div class="card">
  <h3>Surgical team roles</h3>
  <table class="lab">
    <tr><th>Role</th><th>Owns</th></tr>
    <tr><td><b>Circulating nurse</b></td><td>Coordinates the room: positioning, counts, asepsis monitoring, documentation, specimen handling, verifying patient and site at the time-out. <b>Not sterile.</b></td></tr>
    <tr><td><b>Scrub nurse / tech</b></td><td>Sets up and maintains the sterile field, passes instruments, participates in counts. <b>Sterile.</b></td></tr>
    <tr><td><b>Anesthesia provider</b></td><td>Airway, vital signs, titrating anesthetic, fluid and blood management</td></tr>
    <tr><td><b>Surgeon</b></td><td>Performs the procedure, obtains consent</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>The surgical safety checklist</h3>
  <ul class="clean">
    <li><b>Sign-in</b> (before anesthesia): ID, site, consent, allergies, airway risk, blood availability.</li>
    <li><b>Time-out</b> (immediately before incision): <b>correct patient, correct procedure, correct site.</b> Everyone stops.</li>
    <li><b>Sign-out</b> (before leaving the room): counts correct, specimens labeled, equipment issues noted.</li>
  </ul>
  <div class="trap"><span class="tag">Distractor</span>Counts, anesthesia readiness, and team introductions are all real parts of the broader checklist. The <b>time-out</b> specifically is patient, procedure, site.</div>
  <div class="hy"><span class="tag">Incorrect count</span>A retained surgical item until proven otherwise. Notify the surgeon, recount, and image <b>before the patient leaves the room</b>.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🔥 Malignant hyperthermia</h3>
  <p class="why-chain">A susceptible patient gets a trigger → defective ryanodine receptors dump calcium out of the sarcoplasmic reticulum → uncontrolled muscle contraction → massive hypermetabolism → CO2 produced faster than ventilation clears it.</p>
  <ul class="clean">
    <li><b>Triggers:</b> succinylcholine and volatile inhalation anesthetics.</li>
    <li><b>Signs in order:</b> ↑ end-tidal CO2 → tachycardia → masseter and generalized rigidity → acidosis → hyperkalemia → <b>temperature spike last</b> → rhabdomyolysis and dark urine.</li>
    <li><b>Treatment:</b> STOP the trigger → <b>dantrolene</b> → 100% oxygen → cool the patient → correct acidosis and electrolytes → monitor for hyperkalemia and myoglobinuria.</li>
  </ul>
  <div class="mnem"><div class="tag">The whole trick</div><div class="big">The disease is named after its LAST sign.</div><div class="exp">If you picked the temperature, you picked the sign that appears after the patient is already in trouble.</div></div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>Other intraoperative risks</h3>
  <ul class="clean">
    <li><b>Fire triangle:</b> oxidizer (oxygen and nitrous oxide) + ignition source (electrosurgery, laser) + <b>fuel</b> (drapes, alcohol-based prep, gases). Let prep dry completely.</li>
    <li><b>Anaphylaxis:</b> sudden hypotension, bronchospasm, urticaria after a drug. Stop the agent, epinephrine, airway support.</li>
    <li><b>Positioning injuries:</b> nerve compression, pressure injury, and joint strain. Pad bony prominences and maintain alignment.</li>
    <li><b>Hypothermia:</b> cold room, exposed viscera, cold fluids. Raises infection risk and impairs coagulation. Use warming devices.</li>
    <li><b>Venous thromboembolism:</b> immobility on the table. SCDs on before induction.</li>
  </ul>
</div>

<div id="intraQuiz"></div>`;
renderFilteredQuiz('intraQuiz', secQ(EXAM.filter(q=>q.topic==='intra')), 'Intraoperative practice', 'Intraoperative');

</script>
<script>
document.getElementById('sec-post').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🟣</span> Postoperative — PACU to Discharge</h2>
<p class="intro-line">Rank every finding by how fast it kills. That is what ABC actually means.</p>

<div class="card" style="border-color:var(--red)">
  <h3>PACU priorities in order</h3>
  <ul class="clean">
    <li><b>1. Airway</b> — patency first. Residual anesthetic relaxes the tongue against the posterior pharynx. Snoring with retractions is partial obstruction.</li>
    <li><b>2. Breathing</b> — rate, depth, oxygen saturation, breath sounds.</li>
    <li><b>3. Circulation</b> — BP, heart rate, rhythm, bleeding, perfusion.</li>
    <li><b>4.</b> Level of consciousness, temperature, pain, nausea, dressing, drains, and urine output.</li>
  </ul>
  <div class="why-chain">No airway → no gas exchange → arrest in minutes. Every other problem takes longer to kill the patient. That is why ABC is a ranking, not a slogan.</div>
</div>

<div class="card">
  <h3>Postoperative complications by system</h3>
  <table class="lab">
    <tr><th>Complication</th><th>Key signs</th><th>Prevention / action</th></tr>
    <tr><td><b>Atelectasis</b></td><td>Low SpO2, shallow breathing, diminished bases, low-grade fever in first 24-48 hr</td><td>Medicate for pain FIRST, then spirometry, deep breathing, splinted cough, ambulate</td></tr>
    <tr><td><b>Pneumonia</b></td><td>Fever after day 3, productive cough, crackles, infiltrate</td><td>Same pulmonary hygiene, oral care, head of bed elevated</td></tr>
    <tr><td><b>Hemorrhage / hypovolemic shock</b></td><td><b>↓BP with ↑HR</b>, cool clammy skin, ↓urine output, bright red drainage</td><td>Trend the vitals, apply pressure, notify surgeon, fluids and blood</td></tr>
    <tr><td><b>DVT</b></td><td>Unilateral calf pain, swelling, warmth</td><td>Early ambulation, ankle pumps, SCDs, antiembolism stockings, prophylactic anticoagulant</td></tr>
    <tr><td><b>Pulmonary embolism</b></td><td>Sudden dyspnea, chest pain, tachycardia, anxiety</td><td>Raise head of bed, oxygen, then notify and prepare for CT</td></tr>
    <tr><td><b>Paralytic ileus</b></td><td>Absent bowel sounds, distension, no flatus</td><td>Ambulate, NPO or NG decompression, alvimopan for opioid-induced</td></tr>
    <tr><td><b>Urinary retention</b></td><td>No void within 6-8 hr, distension, small frequent voids</td><td>Assist to normal position, privacy, bladder scan, then catheterize</td></tr>
    <tr><td><b>Surgical site infection</b></td><td>Purulent drainage, redness, warmth, fever after day 3</td><td>Aseptic dressing changes, glucose control, nutrition</td></tr>
    <tr><td><b>Dehiscence</b></td><td>Wound layers separate, "something gave way," often while coughing</td><td>Notify surgeon, NPO, splint incisions when coughing</td></tr>
    <tr><td><b>Evisceration</b></td><td>Viscera protrude through the incision</td><td><b>Saline-moistened sterile gauze, low-Fowler with knees flexed, NPO, call surgeon.</b> Never push organs back in.</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>Wound healing and dressing basics</h3>
  <ul class="clean">
    <li><b>Phases:</b> hemostasis → inflammatory → proliferative → maturation/remodeling.</li>
    <li><b>Intentions:</b> primary (clean edges approximated), secondary (left open, granulates in), tertiary (delayed closure after contamination clears).</li>
    <li><b>Drainage:</b> serous (clear), serosanguineous (pink, expected first 24 hr), sanguineous (bright red, active bleeding), purulent (infection).</li>
    <li><b>Wound classes:</b> clean, clean-contaminated (planned entry into GI/respiratory/GU, e.g. routine appendectomy), contaminated, dirty/infected.</li>
  </ul>
</div>

<div class="card">
  <h3>Pain management after surgery</h3>
  <ul class="clean">
    <li><b>Multimodal / ERAS:</b> pair opioids with acetaminophen and NSAIDs to lower the opioid dose and its risks.</li>
    <li><b>PCA:</b> <b>only the patient</b> presses the button. That is the built-in safety feature — an over-sedated patient cannot press it.</li>
    <li>Pain still 8 of 10 an hour after medication? <b>Evaluate and escalate</b> — call the provider with SBAR. Do not wait for rounds and do not adjust the dose yourself.</li>
    <li>Uncontrolled pain is not just a comfort issue: it blocks deep breathing and ambulation, which is what causes atelectasis and DVT.</li>
  </ul>
  <div class="hy"><span class="tag">Best breathing position</span><b>High-Fowler,</b> upright about 90 degrees. It drops the diaphragm and maximizes lung expansion.</div>
</div>

<div class="card">
  <h3>Delegation to UAP</h3>
  <ul class="clean">
    <li><b>Can delegate:</b> standard unchanging procedures on stable patients — vital signs, ambulation, hygiene, positioning, reapplying stockings, intake and output, feeding a patient on an established diet.</li>
    <li><b>Cannot delegate:</b> <b>assessment, teaching, evaluation, judgment,</b> or care of an unstable patient.</li>
  </ul>
  <div class="mnem"><div class="tag">Shortcut</div><div class="big">The verb tells you the answer.</div><div class="exp">Assess, teach, evaluate, plan → nurse. Assist, reapply, transport, measure → UAP.</div></div>
</div>

<div id="postQuiz"></div>`;
renderFilteredQuiz('postQuiz', secQ(EXAM.filter(q=>q.topic==='post')), 'Postoperative practice', 'Postoperative');


document.getElementById('sec-eol').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">⚫</span> Palliative & End-of-Life Care</h2>
<p class="intro-line">Definitions matter here more than interventions. He tests the boundary between the terms.</p>

<div class="card" style="border-color:var(--teal)">
  <h3>Palliative vs. Hospice vs. DNR</h3>
  <table class="lab">
    <tr><th></th><th>Palliative</th><th>Hospice</th><th>DNR</th></tr>
    <tr><td><b>Defined by</b></td><td>The goal — comfort and support</td><td>The prognosis — about 6 months or less</td><td>A single order about resuscitation</td></tr>
    <tr><td><b>When</b></td><td>Any stage, from diagnosis on</td><td>After curative treatment stops</td><td>Any time the patient chooses</td></tr>
    <tr><td><b>Curative treatment</b></td><td><b>Can continue alongside</b></td><td>Discontinued</td><td>Unaffected</td></tr>
    <tr><td><b>Other care</b></td><td>Full</td><td>Full comfort care</td><td><b>Everything except CPR continues</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">One line</div><div class="big">All hospice care is palliative. Most palliative care is not hospice.</div></div>
</div>

<div class="card">
  <h3>Advance directives</h3>
  <ul class="clean">
    <li><b>Living will</b> — documents which treatments the patient would or would not want. States <b>preferences</b>, not orders.</li>
    <li><b>Durable power of attorney for healthcare</b> — names the person who decides if the patient cannot.</li>
    <li><b>POLST</b> — <b>provider-signed portable medical orders</b> that travel across care settings. This is what fills the gap a living will leaves.</li>
    <li>Any competent patient can revoke or change a directive at any time.</li>
  </ul>
</div>

<div class="card">
  <h3>Signs of approaching death and comfort care</h3>
  <ul class="clean">
    <li><b>Respiratory:</b> Cheyne-Stokes breathing, apneic periods, <b>death rattle</b> from pooled secretions.</li>
    <li><b>Circulatory:</b> cool mottled extremities, weak thready pulse, falling BP.</li>
    <li><b>Neurologic:</b> decreasing responsiveness, withdrawal. <b>Hearing is believed to be the last sense to go</b> — keep speaking to the patient.</li>
    <li><b>GI/GU:</b> decreased intake, decreased urine output, incontinence.</li>
    <li><b>Death rattle:</b> reposition laterally, reduce parenteral fluids, antimuscarinic if ordered. <b>Do not deep suction</b> — it is traumatic and increases secretions.</li>
    <li><b>Double effect:</b> opioids titrated to comfort relieve suffering and do not hasten death.</li>
  </ul>
</div>

<div class="card">
  <h3>Grief, hope, and communication</h3>
  <ul class="clean">
    <li><b>Kübler-Ross stages:</b> Denial, Anger, Bargaining, Depression, Acceptance. Nonlinear in real life.</li>

const ROUND_SIZE=6;

function buildCycleOrder(pairs){
  const hasTiers = pairs.some(p=>typeof p.tier==='number');
  if(!hasTiers) return shuffle(pairs.map((_,i)=>i));
  const tiers=[...new Set(pairs.map(p=>p.tier))].sort((a,b)=>a-b);
  let order=[];
  tiers.forEach(t=>{
    const idxs=pairs.map((p,i)=>({p,i})).filter(x=>x.p.tier===t).map(x=>x.i);

<div class="card" style="border-color:var(--amber)">
  <h3>Assess or act?</h3>
  <ul class="clean">
    <li><b>Act first</b> when the patient is unstable or the cause is already obvious — airway, hemorrhage, MH, anaphylaxis.</li>
    <li><b>Assess first</b> when the finding is new but the cause is unknown — new confusion, nonadherence, a change in pain pattern.</li>
    <li><b>First action</b> questions ask what you <i>do</i>, not what you find out. Choose the independent nursing action you can perform immediately.</li>
    <li>When two options are both assessments, pick the one that gathers the data that changes the next decision.</li>
  </ul>
</div>

document.getElementById('sec-tricks').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🎯</span> Trick Questions</h2>
<p class="intro-line">The specific traps he sets, with the reasoning that defuses each one. Read these the night before.</p>

<div class="card" style="border-color:var(--red)">
  <h3>1. The comfort order that is actually dangerous</h3>
  <p>A neutropenic patient spikes a fever and one of the orders is acetaminophen. Every instinct says give it.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Fever is the <b>only sign a neutropenic patient can still produce</b>. Blunting it hides deterioration. Cultures first, antibiotics within the hour.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>2. The disease named after its last sign</h3>
  <p>Malignant hyperthermia. The name says hyperthermia, so the temperature option looks obvious.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Temperature spike is <b>late</b>. Rising end-tidal CO2 and tachycardia come first, because hypermetabolism outruns ventilation before it outruns thermoregulation.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>3. The rule transferred from the wrong context</h3>
  <p>A latex-allergic patient is scheduled last, the way an infectious patient would be.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Latex-allergic patients go <b>first</b>, so airborne latex particles from earlier cases have cleared the room. He counts on you transferring the isolation rule.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>4. Absence of signs read as reassurance</h3>
  <p>"The IV site looks normal, no redness or drainage."</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Without neutrophils there is <b>no inflammation to see</b>. A clean-looking site in a neutropenic patient proves nothing at all.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>5. The kind-sounding option</h3>
  <p>"Reassure the patient that a new treatment may still cure them." Or "encourage her to stay positive."</p>
  <div class="trap"><span class="tag">Why it is wrong</span>False reassurance sets a goal that will fail, and redirecting shuts down communication. Therapeutic responses <b>explore</b>.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>6. Edema read as fluid overload</h3>
  <p>A swollen patient with ascites, a BP of 92/58, and a heart rate of 112.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Third spacing means fluid <b>left the vessel</b>. The patient is edematous outside and hypovolemic inside. Restricting fluid makes it worse.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>7. Treating the number instead of the disease</h3>
  <p>End-tidal CO2 is climbing, so increase the ventilator rate.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Hyperventilation is supportive. <b>Stopping the trigger and giving dantrolene</b> is the treatment. The CO2 is a readout, not the problem.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>8. Withholding the thing that fixes the mechanism</h3>
  <p>A postop patient with a respiratory rate of 26 and a SpO2 of 89% who refuses to cough because of pain. One option holds the opioid.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Pain is what is <b>blocking</b> the deep breathing that causes the atelectasis. Medicate first, then do pulmonary hygiene.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>9. "Already signed" read as binding</h3>
  <p>A patient signed consent yesterday and now says they do not want the surgery.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Consent is <b>revocable at any time</b>, up to the moment of incision. Stop and notify the surgeon.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>10. All four options are correct behaviors</h3>
  <p>Which statement shows understanding of secondary prevention? Every option is a good health behavior.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Only the <b>classification</b> separates them. Screening is secondary. Vaccination and cessation are primary. Recurrence monitoring is tertiary.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>11. The rate reaction mistaken for anaphylaxis</h3>
  <p>Flushing of the face and neck during a first vancomycin dose.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Red man syndrome is <b>rate-related histamine release</b>, not an IgE allergy. Stop and restart slower. Epinephrine treats anaphylaxis, which includes airway involvement.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>12. Terminology that overlaps in management</h3>
  <p>"Something gave way" while coughing, wound edges separated, fascia intact, no viscera visible.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>That is <b>dehiscence</b>. Evisceration requires protruding viscera. The nursing response overlaps, so the terminology is the whole question.</div>
</div>

<div id="tricksQuiz"></div>`;

  const lens=[25,50,'all'].map(n=>{
    const dis = n!=='all' && total<n;
    const lbl = n==='all' ? `All (${total})` : n+' questions';
    return `<button class="chip ${examLen===n?'on':''}" onclick="setExamLen(${n==='all'?"'all'":n})" ${dis?'disabled style="opacity:.4"':''}>${lbl}</button>`;
  }).join('');
  const picked = examTopics.length
    ? examTopics.map(id=>(EXAM_TOPICS.find(t=>t.id===id)||{}).label).join(' + ')
    : 'All topics';
  const count = examLen==='all' ? total : Math.min(examLen,total);
  host.innerHTML=`
    <div class="card" style="border-color:var(--teal)">
      <h3>\uD83C\uDFAF Build your set</h3>
      <p style="margin:0 0 6px;font-size:.86rem;color:var(--muted)">Pick up to ${MAX_TOPICS} topics, or leave it on All topics.</p>
      <div class="chiprow">
        <button class="chip ${examTopics.length===0?'on':''}" onclick="setAllTopics()">\u2728 All topics</button>
        ${chips}
      </div>
      <p style="margin:12px 0 6px;font-size:.86rem;color:var(--muted)">How many questions?</p>
      <div class="chiprow">${lens}</div>
      <div class="hy" style="margin-top:12px"><b>${picked}</b> \u2192 <b>${count} question${count===1?'':'s'}</b>, shuffled fresh each time you start.</div>
      <button class="btn wide" onclick="startPickedSet()">\u25B6\uFE0F Start this set</button>
    </div>`;
}
function startPickedSet(){
  if(poolSize()===0){ toast('No questions match that selection'); return; }
  examChecked={}; examState={}; examIdx=0; examSubmitted=false; examShuffleMap={};
  const r=document.getElementById('examResult'); if(r)r.innerHTML='';
  buildQuizSet(examMode); applyModeUI(examMode); saveExam(); drawExamQ();
  const b=document.getElementById('examBody'); if(b&&b.scrollIntoView)b.scrollIntoView({behavior:'smooth',block:'start'});
  toast('New set: '+quizSet.length+' questions');
}
function getExamQ(qi){
  const base=EXAM[qi];
  if(base.t==='match'){
    if(!examShuffleMap[qi]){
      const order=shuffleAnswers?shuffle(base.items.map((_,i)=>i)):base.items.map((_,i)=>i);
      examShuffleMap[qi]=order;
    }
    const defOrder=examShuffleMap[qi];
    const defs=defOrder.map(i=>base.items[i].def);
    return {q:base.q, r:base.r, t:'match', items:base.items, defs, defOrder};
  }
  if(base.t==='order'){
    if(!examShuffleMap[qi]){
      const order=shuffleAnswers?shuffle(base.steps.map((_,i)=>i)):base.steps.map((_,i)=>i);
      examShuffleMap[qi]=order;
    }
    const order=examShuffleMap[qi];
    const steps=order.map(i=>base.steps[i]);
    return {q:base.q, r:base.r, t:'order', steps, displayOrder:order};
  }
  if(!examShuffleMap[qi]){
    const order=shuffleAnswers?shuffle(base.o.map((_,i)=>i)):base.o.map((_,i)=>i);
    examShuffleMap[qi]=order;
  }
  const order=examShuffleMap[qi];
  const opts=relabel(order.map(i=>base.o[i]));
  let correct;
  if(base.t==='multi'){
    const cset=new Set(base.c);
    correct=order.map((origIdx,newIdx)=>cset.has(origIdx)?newIdx:null).filter(x=>x!==null);
  } else {
    correct=order.indexOf(base.c);
  }
  return {q:base.q, r:base.r, t:base.t, o:opts, c:correct};
}
function saveExam(){ try{ localStorage.setItem('nur256u1_exam', JSON.stringify({mode:examMode,set:quizSet,state:examState,checked:examChecked,idx:examIdx,submitted:examSubmitted,shuffle:examShuffleMap})); }catch(e){} }
function loadExam(){ try{ const r=localStorage.getItem('nur256u1_exam'); return r?JSON.parse(r):null; }catch(e){ return null; } }
function clearExamSave(){ try{ localStorage.removeItem('nur256u1_exam'); }catch(e){} }
function shuffleArr(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);}
function renderExam(){
  const c=document.getElementById('sec-exam');
  c.innerHTML=`
    <h2 class="sec-title"><span class="sec-emoji">📝</span> Practice Exam <span style="font-size:.6em;opacity:.7">(${EXAM.length}-question bank)</span></h2>
    <p class="intro-line">NextGen NCLEX style — multiple choice + Select All That Apply.</p>
    <div class="exam-mode-toggle">
      <button class="mode-btn" id="modeStudyBtn" onclick="setExamMode('study')">📖 Study Mode</button>
      <button class="mode-btn" id="modeTestBtn" onclick="setExamMode('test')">📝 Test Mode</button>
    </div>
    <div class="center" style="margin:8px 0">
      <button class="btn vision-toggle-btn" onclick="toggleHotOnly()" style="background:var(--purple)">🔥 High-Yield Only: OFF</button>
    </div>
    <div id="examPicker"></div>
    <div class="tipbar" id="examModeTip"></div>
    <div id="examBody"></div>
    <div class="exam-nav">
      <button class="btn ghost" onclick="examPrev()">⬅️ Prev</button>
      <div class="exam-dots" id="examDots"></div>
      <button class="btn" onclick="examNext()">Next ➡️</button>
    </div>
    <div class="center" id="submitWrap" style="margin-top:14px"><button class="btn" onclick="submitExam()" style="background:linear-gradient(90deg,var(--teal),var(--green))">✅ Submit Exam & See Score</button></div>
    <div id="examResult"></div>`;
  const saved=loadExam();
  if(saved && saved.set && saved.set.length){
    examMode=saved.mode||'study'; quizSet=saved.set; examState=saved.state||{}; examChecked=saved.checked||{}; examIdx=saved.idx||0; examSubmitted=saved.submitted||false; examShuffleMap=saved.shuffle||{};
    renderPicker(); applyModeUI(examMode); drawExamQ();
  } else { renderPicker(); setExamMode(examMode); }
}
function buildQuizSet(m){
  let all=pickedPool();
  if(examLen!=='all'){ quizSet=shuffleArr(all).slice(0,Math.min(examLen,all.length)); }
  else { quizSet = m==='test' ? shuffleArr(all) : all; }
}
function applyModeUI(m){
  const sb=document.getElementById('modeStudyBtn'), tb=document.getElementById('modeTestBtn');
  sb.classList.toggle('active',m==='study'); tb.classList.toggle('active',m==='test');
  const tip=document.getElementById('examModeTip'); const submitWrap=document.getElementById('submitWrap');
  const n=quizSet.length||poolSize();
  const scope = examTopics.length ? examTopics.map(id=>(EXAM_TOPICS.find(t=>t.id===id)||{}).label).join(' + ') : 'all topics';
  if(m==='study'){
    tip.innerHTML='\uD83D\uDCD6 <b>Study Mode:</b> '+n+' questions from <b>'+scope+'</b>. Tap an answer to instantly see right/wrong + rationale. SATA uses Check Answer. Progress saves automatically.';
    submitWrap.style.display='none';
  } else {
    tip.innerHTML='\uD83D\uDCDD <b>Test Mode:</b> '+n+' scrambled questions from <b>'+scope+'</b> \u2014 like the real exam. No feedback until you submit. Tap \u25B6\uFE0F Start this set for a fresh shuffle.';
    submitWrap.style.display='block';
  }
}

function setExamMode(m){
  examMode=m; examChecked={}; examState={}; examIdx=0; examSubmitted=false; examShuffleMap={};
  document.getElementById('examResult').innerHTML='';
  buildQuizSet(m); applyModeUI(m); saveExam(); drawExamQ();
}
function drawExamQ(){
  if(!quizSet.length)buildQuizSet(examMode);
  const qi=quizSet[examIdx]; const q=getExamQ(qi);
  const body=document.getElementById('examBody');
  if(q.t==='match'){ drawExamMatchQ(qi,q,body); drawDots(); return; }
  if(q.t==='order'){ drawExamOrderQ(qi,q,body); drawDots(); return; }
  const typeLabel=q.t==='multi'?'Select All That Apply':'Multiple Choice';
  const checked = examMode==='study' && examChecked[qi];
  let html=`<div class="exam-q"><div><span class="qnum">QUESTION ${examIdx+1} of ${quizSet.length}</span><span class="qtype">${typeLabel}</span></div><div class="qtext">${q.q}</div>`;
  q.o.forEach((opt,i)=>{
    const letter=String.fromCharCode(65+i);
    let cls='opt'; const cur=examState[qi];
    const isSel = q.t==='multi' ? (cur&&cur.includes(i)) : (cur===i);
    if(isSel)cls+=' sel-multi';
    if(checked){ const isCorrectOpt = q.t==='multi'?q.c.includes(i):q.c===i; if(isCorrectOpt)cls+=' correct'; else if(isSel)cls+=' wrong'; }
    html+=`<button class="${cls}" ${checked?'disabled':''} onclick="examPick(${i})">${opt}</button>`;
  });
  html+=`</div>`;
  if(examMode==='study'){
    if(q.t==='multi' && !checked){ html+=`<div class="center"><button class="btn" onclick="checkExamQ()" style="background:linear-gradient(90deg,var(--teal),var(--green))">✓ Check Answer</button></div>`; }
    if(checked){
      const ans=examState[qi]; const isCorrect = q.t==='multi'?arrEq(ans,q.c):ans===q.c;
      const correctTxt = q.t==='multi'?q.c.map(x=>String.fromCharCode(65+x)).sort().join(', '):String.fromCharCode(65+q.c);
      html+=`<div class="rationale show" style="border-color:${isCorrect?'var(--green)':'var(--red)'}">${isCorrect?'✅ <b>Correct!</b>':'❌ <b>Not quite.</b> Correct: <b>'+correctTxt+'</b>'}<br><b>Rationale:</b> ${q.r}</div>`;
    }
  }
  body.innerHTML=html; drawDots();
}
function drawExamMatchQ(qi,q,body){
  const checked = examMode==='study' && examChecked[qi];
  const cur = examState[qi] || [];
  let html=`<div class="exam-q"><div><span class="qnum">QUESTION ${examIdx+1} of ${quizSet.length}</span><span class="qtype">Dropdown Match</span></div><div class="qtext">${q.q}</div>`;
  q.items.forEach((item,itemIdx)=>{
    const selectedPos = cur[itemIdx];
    let rowCls='dm-row';
    if(checked){
      const isCorrect = selectedPos!==undefined && q.defOrder[selectedPos]===itemIdx;
      rowCls += isCorrect ? ' dm-correct' : ' dm-wrong';
    }
    html+=`<div class="${rowCls}"><div class="dm-term">${item.term}</div><select class="dm-select" ${checked?'disabled':''} onchange="examMatchPick(${itemIdx}, this.value)">`;
    html+=`<option value="" ${selectedPos===undefined?'selected':''}>— choose a definition —</option>`;
    q.defs.forEach((d,pos)=>{ html+=`<option value="${pos}" ${selectedPos===pos?'selected':''}>${d}</option>`; });
    html+=`</select></div>`;
  });
  html+=`</div>`;
  if(examMode==='study'){
    const allAnswered = q.items.every((_,i)=>cur[i]!==undefined);
    if(!checked){ html+=`<div class="center"><button class="btn" onclick="checkExamMatch()" style="background:linear-gradient(90deg,var(--teal),var(--green))" ${allAnswered?'':'disabled'}>✓ Check Answers</button></div>`; }
    if(checked){
      const isCorrect = q.items.every((_,i)=>cur[i]!==undefined && q.defOrder[cur[i]]===i);
      html+=`<div class="rationale show" style="border-color:${isCorrect?'var(--green)':'var(--red)'}">${isCorrect?'✅ <b>All correct!</b>':'❌ <b>Some matches were off</b> — check the highlighted rows above.'}<br><b>Rationale:</b> ${q.r}</div>`;
    }
  }
  body.innerHTML=html;
}
function examMatchPick(itemIdx, val){
  const qi=quizSet[examIdx];
  if(examMode==='study' && examChecked[qi])return;
  if(!examState[qi])examState[qi]=[];
  examState[qi][itemIdx] = val===''? undefined : parseInt(val,10);
  saveExam(); drawExamQ();
}
function checkExamMatch(){
  const qi=quizSet[examIdx];
  examChecked[qi]=true; bumpProgress('exam-'+qi); drawExamQ(); saveExam();
}
function drawExamOrderQ(qi,q,body){
  const checked = examMode==='study' && examChecked[qi];
  const cur = examState[qi] || [];
  let html=`<div class="exam-q"><div><span class="qnum">QUESTION ${examIdx+1} of ${quizSet.length}</span><span class="qtype">Ordered Response (Drag &amp; Drop style)</span></div><div class="qtext">${q.q}</div>`;
  html+=`<p style="font-size:.82rem;color:var(--muted);margin:4px 0 10px">Tap each step below in the correct order — it will move into your answer list.</p>`;
  html+=`<div class="order-answer" id="orderAnswerList">`;
  cur.forEach((origIdx,pos)=>{
    let itemCls='order-answer-item';
    if(checked){ itemCls += origIdx===pos ? ' order-correct' : ' order-wrong'; }
    html+=`<div class="${itemCls}"><span class="num">${pos+1}</span><span>${q.steps[q.displayOrder.indexOf(origIdx)]}</span></div>`;
  });
  html+=`</div>`;
  if(!checked){
    html+=`<div class="order-pool">`;
    q.steps.forEach((step,displayPos)=>{
      const origIdx=q.displayOrder[displayPos];
      const used = cur.includes(origIdx);
      html+=`<button class="order-chip" ${used?'disabled':''} onclick="examOrderPick(${origIdx})">${step}</button>`;
    });
    html+=`</div>`;
    html+=`<div class="center" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">`;
    html+=`<button class="btn ghost" onclick="examOrderUndo()">↺ Undo Last</button>`;
    if(examMode==='study' && cur.length===q.steps.length){ html+=`<button class="btn" onclick="checkExamOrder()" style="background:linear-gradient(90deg,var(--teal),var(--green))">✓ Check Order</button>`; }
    html+=`</div>`;
  }
  html+=`</div>`;
  if(examMode==='study' && checked){
    const isCorrect = cur.length===q.steps.length && cur.every((v,i)=>v===i);
    html+=`<div class="rationale show" style="border-color:${isCorrect?'var(--green)':'var(--red)'}">${isCorrect?'✅ <b>Correct order!</b>':'❌ <b>Not quite the right order</b> — see highlighted steps above.'}<br><b>Rationale:</b> ${q.r}</div>`;
  }
  body.innerHTML=html;
}
function examOrderPick(origIdx){
  const qi=quizSet[examIdx];
  if(examMode==='study' && examChecked[qi])return;
  if(!examState[qi])examState[qi]=[];
  if(!examState[qi].includes(origIdx)) examState[qi].push(origIdx);
  saveExam(); drawExamQ();
}
function examOrderUndo(){
  const qi=quizSet[examIdx];
  if(examMode==='study' && examChecked[qi])return;
  if(examState[qi] && examState[qi].length){ examState[qi].pop(); saveExam(); drawExamQ(); }
}
function checkExamOrder(){
  const qi=quizSet[examIdx];
  examChecked[qi]=true; bumpProgress('exam-'+qi); drawExamQ(); saveExam();
}
function isExamCorrect(q, ans){
  if(q.t==='multi') return arrEq(ans,q.c);
  if(q.t==='match') return q.items.every((_,i)=>ans && ans[i]!==undefined && q.defOrder[ans[i]]===i);
  if(q.t==='order') return ans && ans.length===q.steps.length && ans.every((v,i)=>v===i);
  return ans===q.c;
}
function isExamAnswered(qi){
  const ans=examState[qi];
  if(ans===undefined)return false;
  if(Array.isArray(ans))return ans.length>0 && !ans.includes(undefined);
  return true;
}
function drawDots(){
  const d=document.getElementById('examDots'); d.innerHTML='';
  quizSet.forEach((qi,pos)=>{
    const dot=document.createElement('div'); dot.className='dot';
    const answered = isExamAnswered(qi);
    if(examMode==='study'){ if(examChecked[qi]){ const eq=getExamQ(qi); dot.classList.add(isExamCorrect(eq,examState[qi])?'dot-correct':'dot-wrong'); } }
    else { if(answered)dot.classList.add('answered'); }
    if(pos===examIdx)dot.classList.add('current');
    dot.onclick=()=>{examIdx=pos;drawExamQ();saveExam();};
    d.appendChild(dot);
  });
}
function examPick(i){
  const qi=quizSet[examIdx]; const q=getExamQ(qi);
  if(examMode==='study' && examChecked[qi]) return;
  if(q.t==='multi'){
    if(!examState[qi])examState[qi]=[]; const arr=examState[qi]; const idx=arr.indexOf(i);
    if(idx>-1)arr.splice(idx,1); else arr.push(i); drawExamQ();
  } else { examState[qi]=i; if(examMode==='study'){ examChecked[qi]=true; bumpProgress('exam-'+qi); } drawExamQ(); }
  saveExam();
}
function checkExamQ(){
  const qi=quizSet[examIdx]; const ans=examState[qi];
  if(ans===undefined||(Array.isArray(ans)&&ans.length===0))return;
  examChecked[qi]=true; bumpProgress('exam-'+qi); drawExamQ(); saveExam();
}
function examNext(){ if(examIdx<quizSet.length-1){examIdx++;drawExamQ();saveExam();window.scrollTo({top:0,behavior:'smooth'});} }
function examPrev(){ if(examIdx>0){examIdx--;drawExamQ();saveExam();window.scrollTo({top:0,behavior:'smooth'});} }
function arrEq(a,b){if(!a||!b)return false;a=[...a].sort();b=[...b].sort();return a.length===b.length&&a.every((v,i)=>v===b[i]);}
function examAnswerSummary(q, ans){
  if(ans===undefined||(Array.isArray(ans)&&ans.length===0))return {your:'(no answer)', correct:'—'};
  if(q.t==='multi') return {your:ans.map(x=>String.fromCharCode(65+x)).sort().join(', '), correct:q.c.map(x=>String.fromCharCode(65+x)).sort().join(', ')};
  if(q.t==='match') return {your:q.items.map((it,i)=>it.term+'→'+(ans[i]!==undefined?q.defs[ans[i]]:'(blank)')).join('; '), correct:q.items.map(it=>it.term+'→'+it.def).join('; ')};
  if(q.t==='order'){
    const yourTxt = ans.map(origIdx=>q.steps[q.displayOrder.indexOf(origIdx)]).join(' → ');
    const correctTxt = q.steps.map((_,i)=>q.steps[q.displayOrder.indexOf(i)]).join(' → ');
    return {your:yourTxt, correct:correctTxt};
  }
  return {your:String.fromCharCode(65+ans), correct:String.fromCharCode(65+q.c)};
}
function submitExam(){
  let correct=0;
  quizSet.forEach(qi=>{ const q=getExamQ(qi); if(isExamCorrect(q, examState[qi]))correct++; });
  const total=quizSet.length; const pct=Math.round(correct/total*100);
  examSubmitted=true; saveExam();
  let msg = pct>=85?'🌟 Outstanding — exam-ready!':pct>=75?'✅ Passing! Polish the misses.':pct>=60?'💪 Getting there — review and retake.':'📚 Keep grinding — revisit the sections.';
  let html=`<div class="quiz-score">You scored ${correct} / ${total} (${pct}%)<br>${msg}</div><h3 style="color:var(--pink)">📖 Full Review</h3>`;
  quizSet.forEach((qi,pos)=>{
    const q=getExamQ(qi); const ans=examState[qi]; const isCorrect=isExamCorrect(q,ans);
    const sum=examAnswerSummary(q,ans);
    html+=`<div class="exam-q" style="border-color:${isCorrect?'var(--green)':'var(--red)'}"><div class="qnum">Q${pos+1} ${isCorrect?'✅':'❌'}</div><div class="qtext" style="font-size:.92rem">${q.q}</div><div style="font-size:.85rem"><b>Your answer:</b> ${sum.your} &nbsp;|&nbsp; <b>Correct:</b> ${sum.correct}</div><div class="rationale show" style="margin-top:8px"><b>Rationale:</b> ${q.r}</div></div>`;
  });
  html+=`<div class="center"><button class="btn" onclick="resetExam()">🔄 New Test (fresh 50)</button></div>`;
  document.getElementById('examResult').innerHTML=html;
  const _er=document.getElementById('examResult'); if(_er.scrollIntoView)_er.scrollIntoView({behavior:'smooth'});
}
function resetExam(){ examState={}; examIdx=0; examSubmitted=false; examChecked={}; examShuffleMap={}; document.getElementById('examResult').innerHTML=''; buildQuizSet(examMode); saveExam(); drawExamQ(); window.scrollTo({top:0,behavior:'smooth'}); }
renderExam();
updateProg();
updateHotToggleButtons();
renderPicker();

</script>
