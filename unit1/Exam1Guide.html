<h2 class="sec-title"><span class="sec-emoji">🎗️</span> Cancer — Mechanism and Care</h2>
<p class="intro-line">One sentence generates every side effect on this exam: treatment kills rapidly dividing cells and cannot tell cancer from normal tissue.</p>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Carcinogenesis — the three-step process</h3>
  <p class="intro-line" style="margin-top:0">Cancer does not happen in one event. It takes three, and only the middle one is reversible.</p>
  <ol class="chainlist">
    <li><b>1. INITIATION</b> — <b>Carcinogens cause DNA mutations.</b> Normally this is reversed by <b>DNA repair</b> or the cell self-destructs through <b>apoptosis</b>. If neither happens, the mutation is locked in. <b>Irreversible.</b></li>
    <li><b>2. PROMOTION</b> — <b>Repeated exposure to promoting agents</b> causes <b>proliferation of the initiated cells</b>. <b>Reversible if the substance is removed.</b> This is the entire reason smoking cessation and lifestyle change work.</li>
    <li><b>3. PROGRESSION</b> — The altered cells now <b>exhibit malignant behavior</b>: they <b>stimulate angiogenesis</b> (grow their own blood supply), <b>invade tissues, and metastasize</b>. <b>Irreversible.</b></li>
  </ol>
  <div class="mnem"><div class="tag">⭐ The one that matters</div><div class="big">Only PROMOTION is reversible.</div><div class="exp">Initiation and progression are not. That single fact is why prevention targets the promotion stage — remove the promoting agent and the process can still stop.</div></div>
  <div class="trap"><span class="tag">Where he turns the screw</span>He will ask which stage is reversible, or offer "initiation is reversible with DNA repair." Careful: <b>DNA repair prevents initiation from completing</b>; once the mutation is fixed in the cell, initiation itself is <b>not</b> reversible.</div>
</div>

<div class="card">
  <h3>Patterns of cellular adaptation — and where cancer sits</h3>
  <table class="lab">
    <tr><th>Pattern</th><th>What happens</th><th>Example</th></tr>
    <tr><td><b>Atrophy</b></td><td><b>Decrease</b> in cell size</td><td>Muscle wasting from disuse or bed rest</td></tr>
    <tr><td><b>Hypertrophy</b></td><td><b>Increase</b> in cell size</td><td>Cardiac muscle in hypertension; skeletal muscle with exercise</td></tr>
    <tr><td><b>Hyperplasia</b></td><td><b>Increase in the number</b> of cells</td><td>Benign prostatic hyperplasia; callus formation</td></tr>
    <tr><td><b>Metaplasia</b></td><td>One <b>mature cell type is replaced by another</b></td><td>Respiratory epithelium replaced in smokers</td></tr>
    <tr><td><b>Dysplasia</b></td><td><b>Disordered, abnormal</b> cell growth. <b>Precancerous</b></td><td>Cervical dysplasia on a Pap</td></tr>
    <tr><td><b>⭐ NEOPLASIA</b></td><td><b>New, uncontrolled, purposeless growth.</b> This is what cancerous cells demonstrate</td><td>Any malignant tumor</td></tr>
  </table>
  <div class="hy"><span class="tag">⭐ He said "know neoplasia"</span><b>Neoplasia is the only one on this list that is cancer.</b> The other five are <b>adaptations</b> — the cell responding to a stress. Neoplasia is growth that serves no purpose and does not respond to normal controls. Dysplasia is the closest, and it is <b>precancerous, not cancer</b>.</div>
</div>

<div class="card">
  <h3>Factors that induce carcinogenesis</h3>
  <table class="lab">
    <tr><th>Factor</th><th>Detail</th></tr>
    <tr><td><b>Viruses and bacteria</b></td><td><b>H. pylori</b> (gastric), HPV (cervical, head and neck), hepatitis B and C (liver), EBV, HIV</td></tr>
    <tr><td><b>Physical agents</b></td><td>Radiation, UV/sun exposure, chronic irritation</td></tr>
    <tr><td><b>Chemicals</b></td><td>Tobacco, asbestos, benzene, industrial exposures</td></tr>
    <tr><td><b>Genetic / familial</b></td><td>BRCA, family history, inherited syndromes</td></tr>
    <tr><td><b>Lifestyle</b></td><td>Diet, alcohol, physical inactivity, obesity</td></tr>
    <tr><td><b>Hormones</b></td><td>Endogenous or exogenous</td></tr>
  </table>
  <ul class="clean">
    <li><b>Cigarette smoking is the major modifiable risk factor.</b></li>
    <li><b>Additional lifestyle factors account for 16% of cancer cases</b> — alcohol intake, poor diet, physical inactivity.</li>
    <li><b>Long-term ingestion of carcinogens</b> raises risk: <b>fats, alcohol, processed meats, nitrates</b>.</li>
    <li><b>Obesity is linked to 13 different cancers</b> — breast, thyroid, liver, colon, and others.</li>
    <li><b>Sedentary lifestyle and lack of exercise</b> are independently linked to cancer development.</li>
  </ul>
  <div class="hy"><span class="tag">Hormones and cancer</span>Tumor growth is promoted by <b>hormonal imbalance</b>, endogenous or exogenous. <b>Hormone-dependent cancers: breast, prostate, ovaries, endometrium.</b> Reproductive-cycle factors that raise risk: <b>early menses, delayed menopause, nulliparity, delayed childbirth</b>. <b>Estrogen replacement therapy</b> is linked to breast and endometrial cancer risk, and <b>prenatal DES exposure</b> to clear cell adenocarcinoma.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>Immune surveillance — why we don't all have cancer</h3>
  <ol class="chainlist">
    <li><b>1.</b> <b>Transformed cells arise regularly</b> in everyone — but they are normally <b>destroyed by immune surveillance</b>.</li>
    <li><b>2.</b> Surveillance <b>recognizes and combats</b> cancer cells using <b>innate, humoral, and cellular</b> components.</li>
    <li><b>3.</b> Cancer cells carry <b>tumor-associated antigens (TAAs)</b> on their membranes.</li>
    <li><b>4.</b> TAAs are processed by <b>antigen-presenting cells (APCs)</b>.</li>
    <li><b>5.</b> <b>T lymphocytes recognize the TAAs as foreign</b>.</li>
    <li><b>6.</b> T cells <b>release cytokines</b> to destroy the cancer cells and <b>recruit additional immune cells</b> for destruction.</li>
  </ol>
  <div class="hy"><span class="tag">Connect it to treatment</span>This is exactly what <b>immunotherapy</b> exploits, and it is why the <b>goal of chemotherapy</b> is to eradicate <i>enough</i> tumor cells for the immune system to finish the job — not to kill every last cell directly.</div>
</div>

<div class="card">
  <h3>Benign vs. Malignant</h3>
  <table class="lab">
    <tr><th>Characteristic</th><th>Benign</th><th>Malignant</th></tr>
    <tr><td><b>Differentiation</b></td><td>Well-differentiated, resembles parent tissue</td><td>Undifferentiated, cells vary in size and shape</td></tr>
    <tr><td><b>Mode of growth</b></td><td>Expands and displaces, encapsulated</td><td>Infiltrates and invades surrounding tissue</td></tr>
    <tr><td><b>Rate of growth</b></td><td>Slow, may stop or regress</td><td>Variable, generally rapid</td></tr>
    <tr><td><b>Metastasis</b></td><td>Never</td><td>Common, via blood, lymph, and seeding</td></tr>
    <tr><td><b>Systemic effects</b></td><td>Rare</td><td>Common — anemia, weakness, weight loss</td></tr>
    <tr><td><b>Tissue destruction</b></td><td>Usually none</td><td>Ulceration, necrosis, secondary infection</td></tr>
    <tr><td><b>Lethality</b></td><td>Rare, unless it compresses a vital structure</td><td>Usually fatal untreated</td></tr>
  </table>
  <div class="mnem"><div class="tag">Fast recall</div><div class="big">Benign Behaves. Malignant Migrates.</div></div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>⚠️ CAUTION UP — the seven warning signs</h3>
  <ul class="clean">
    <li><b>C</b>hange in bowel or bladder habits</li>
    <li><b>A</b> sore that does not heal</li>
    <li><b>U</b>nusual bleeding or discharge</li>
    <li><b>T</b>hickening or a lump in the breast or elsewhere</li>
    <li><b>I</b>ndigestion or difficulty swallowing</li>
    <li><b>O</b>bvious change in a wart or mole</li>
    <li><b>N</b>agging cough or hoarseness</li>
    <li><b>U</b>nexplained weight loss</li>
    <li><b>P</b>ernicious anemia</li>
  </ul>
</div>

<div class="card" style="border-color:var(--green)">
  <h3>Levels of prevention</h3>
  <table class="lab">
    <tr><th>Level</th><th>What it is</th><th>Examples</th></tr>
    <tr><td><b>Primary</b></td><td><b>Risk reduction and health promotion BEFORE disease exists</b></td><td>HPV and hepatitis B vaccine, smoking cessation, sunscreen, healthy diet and weight, exercise, limiting alcohol, avoiding carcinogens</td></tr>
    <tr><td><b>Secondary</b></td><td><b>Screening and early detection in an ASYMPTOMATIC person</b></td><td>Colonoscopy, mammogram, Pap, PSA, low-dose CT for smokers, self-exam</td></tr>
    <tr><td><b>Tertiary</b></td><td><b>Monitoring and preventing recurrence AFTER a known cancer</b></td><td>Survivorship clinic, surveillance imaging, rehabilitation, screening for second primaries</td></tr>
  </table>
  <div class="trap"><span class="tag">His favorite version</span>He makes <b>all four options correct health behaviors</b> so only the <b>classification level</b> separates them. Vaccination is <b>primary</b> even though it prevents cancer. Watching for recurrence in a survivor is <b>tertiary</b>, not secondary — secondary requires the person to be <b>asymptomatic and undiagnosed</b>.</div>
</div>

<div class="card" style="border-color:var(--green)">
  <h3>🥗 Nutrition and physical activity for cancer prevention</h3>
  <ul class="clean">
    <li><b>Achieve and maintain a healthy weight throughout life.</b></li>
    <li><b>Consume a healthy diet with emphasis on plant sources.</b></li>
    <li><b>Limit processed meat and red meats.</b></li>
    <li><b>Eat at least 2.5 cups of vegetables and fruits each day.</b></li>
    <li><b>Choose whole grains instead of processed grains.</b></li>
    <li><b>Limit alcohol consumption.</b></li>
    <li>Be physically active — sedentary lifestyle is an independent risk factor.</li>
  </ul>
  <div class="mnem"><div class="tag">⭐ The one-liner he gave</div><div class="big">No carcinogenic foods · no smoked meats · more plant based</div></div>
  <div class="hy"><span class="tag">The number to remember</span><b>2.5 cups of vegetables and fruits daily.</b> That is the specific figure, and specific figures get tested.</div>
  <div class="hy"><span class="tag">Why this is primary prevention</span>Every item on this list acts on the <b>promotion</b> stage of carcinogenesis — the only reversible one. Remove the promoting agent and proliferation of initiated cells can still stop.</div>
</div>

<div class="card">
  <h3>Staging and grading</h3>
  <ul class="clean">
    <li><b>Grading</b> = how abnormal the cells look. Grade 1 well-differentiated through Grade 4 undifferentiated.</li>
    <li><b>Staging</b> = how far it has spread. <b>TNM</b>: <b>T</b>umor size and extent, regional lymph <b>N</b>odes, distant <b>M</b>etastasis.</li>
    <li>Metastasis routes: <b>lymphatic</b> spread, <b>hematogenous</b> spread, and <b>direct seeding</b> into a body cavity.</li>
    <li>Common metastasis sites: bone, brain, liver, lung.</li>
  </ul>
  <div class="mnem"><div class="tag">Keep them apart</div><div class="big">Grading = the cells. Staging = the spread.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⚠️ How treatment kills normal cells — the master mechanism</h3>
  <p class="why-chain">Chemotherapy and radiation kill cells that are <b>actively dividing</b>. They cannot tell a cancer cell from a normal one. So the normal tissues that divide fastest take the damage: <b>bone marrow, GI epithelium (mouth to anus), and hair follicles</b>. Every side effect on this exam derives from that one sentence.</p>
  <div class="mnem"><div class="tag">Derive it, don't memorize it</div><div class="big">Fast-dividing tissue = damaged. Slow-dividing tissue = spared.</div><div class="exp">Muscle, brain, bone, cartilage, and nerve are slow-dividing. When he offers those as the affected tissue, they are wrong.</div></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🩸 Bone marrow — myelosuppression</h3>
  <p><b>Myelosuppression</b> is the umbrella term for marrow suppression. Three cell lines, three separate problems.</p>
  <table class="lab">
    <tr><th>Cell line</th><th>Result</th><th>Signs</th><th>Nursing care</th></tr>
    <tr><td><b>↓ RBC</b></td><td><b>Anemia</b></td><td>Fatigue, pallor, dyspnea on exertion, tachycardia, dizziness</td><td>Cluster care and rest periods, monitor H&amp;H, iron/EPO or transfusion as ordered, slow position changes</td></tr>
    <tr><td><b>↓ WBC (neutrophils)</b></td><td><b>Neutropenia → infection</b></td><td>Often <b>no visible signs</b>. A low-grade fever may be the only one</td><td><b>Neutropenic precautions.</b> Hand hygiene, private room, no fresh flowers or plants, no raw fruits/vegetables, no crowds, no live vaccines, no rectal temps or suppositories</td></tr>
    <tr><td><b>↓ Platelets</b></td><td><b>Thrombocytopenia → bleeding</b></td><td>Petechiae, ecchymosis, bleeding gums, epistaxis, melena, hematuria</td><td><b>Bleeding precautions.</b> Electric razor, soft toothbrush, no flossing, no rectal temps or suppositories, no aspirin or NSAIDs, avoid contact sports and IM injections</td></tr>
  </table>
  <div class="hy"><span class="tag">⭐ Nadir</span>The <b>lowest point of the blood counts</b>, usually <b>7 to 14 days after a chemotherapy dose</b>. This is the window of highest infection and bleeding risk, and it is when he sets his questions.</div>
  <div class="hy"><span class="tag">ANC — the number that decides everything</span>
  <b>ANC = WBC × (% segs + % bands) ÷ 100</b><br>
  Above 1500 = normal · 1000–1500 = mild · 500–1000 = moderate · <b>under 500 = severe neutropenia</b><br>
  At an ANC under 500, a temperature of <b>100.4°F (38°C)</b> is a <b>medical emergency</b>, not a watch-and-see.</div>
  <div class="trap"><span class="tag">The reasoning that kills</span>Neutrophils are the cells that <b>make</b> pus, redness, swelling, and heat. Without them the infection is still there but <b>cannot produce visible signs</b>. A clean-looking IV site or a wound with no drainage proves <b>nothing</b> in a neutropenic patient.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>👄 GI epithelium — mouth to anus</h3>
  <p>The entire GI tract is lined with rapidly dividing epithelium, so it is damaged along its whole length.</p>
  <table class="lab">
    <tr><th>Problem</th><th>What it is</th><th>Nursing care</th></tr>
    <tr><td><b>Stomatitis / mucositis</b></td><td>Inflammation and <b>ulceration of the oral mucosa</b>. Appears about <b>5 to 14 days</b> after treatment. Painful, and a portal for infection</td><td><b>Soft-bristled toothbrush</b> or foam swabs · rinse with <b>normal saline or sodium bicarbonate</b> every 2–4 hours · <b>no alcohol-based mouthwash</b> · <b>no lemon-glycerin swabs</b> · keep lips moist · remove dentures if painful</td></tr>
    <tr><td><b>Oral ulcers</b></td><td>Open lesions on the tongue, gums, and buccal mucosa</td><td>Topical anesthetic before meals · <b>soft, bland, room-temperature</b> foods · avoid acidic, spicy, rough, and very hot or cold foods · assess the mouth <b>every shift</b></td></tr>
    <tr><td><b>Xerostomia</b></td><td>Dry mouth, especially with head and neck radiation. Often permanent</td><td>Frequent sips of water, artificial saliva, sugar-free gum, meticulous dental care (caries risk rises sharply)</td></tr>
    <tr><td><b>Esophagitis</b></td><td>Ulceration further down; painful swallowing</td><td>Soft foods, small frequent meals, upright positioning</td></tr>
    <tr><td><b>Nausea and vomiting</b></td><td><b>Anticipatory</b> (before treatment, learned), <b>acute</b> (within 24 hr), <b>delayed</b> (after 24 hr)</td><td>Antiemetics <b>scheduled before</b> chemo, not PRN after · small frequent meals · avoid strong odors · ondansetron, prochlorperazine, dexamethasone</td></tr>
    <tr><td><b>Diarrhea</b></td><td>Damaged intestinal lining cannot absorb</td><td>Low-fiber, low-residue diet · replace fluids and electrolytes · monitor potassium · perianal skin care</td></tr>
    <tr><td><b>Constipation</b></td><td>From opioids, vincristine, antiemetics, immobility</td><td>Stool softener plus stimulant, fluids, activity as tolerated</td></tr>
    <tr><td><b>Anorexia and taste changes</b></td><td>Metallic taste, food aversions</td><td>Plastic utensils, cold or room-temp foods, tart flavors if no mucositis, high-calorie high-protein supplements</td></tr>
  </table>
  <div class="trap"><span class="tag">Mouth care traps</span><b>Lemon-glycerin swabs and alcohol-based mouthwash both dry and irritate</b> already ulcerated tissue — and both get offered. Correct answers use <b>saline or sodium bicarbonate rinses and a soft brush</b>. Also: no flossing if platelets are low.</div>
</div>

<div class="card">
  <h3>🦱 Hair follicles and skin</h3>
  <ul class="clean">
    <li><b>Alopecia</b> begins about <b>2 weeks</b> after treatment starts and is <b>reversible</b> — the follicle stem cells survive. Regrowth may differ in color and texture.</li>
    <li>Hair loss is <b>not just scalp</b>: eyebrows, eyelashes, and body hair are affected.</li>
    <li><b>Plan wigs, scarves, and head coverings BEFORE the hair falls out</b>, while it can still be matched. Body image is a nursing priority, not a soft add-on.</li>
    <li>Avoid harsh shampoos, dye, perms, blow dryers, and curling irons. Protect the scalp from sun and cold.</li>
    <li><b>Radiation skin reactions:</b> dry then moist desquamation in the treatment field. Mild soap and water, pat dry, <b>no lotions or powders before treatment</b>, no heating pads or ice, loose cotton clothing, no sun.</li>
  </ul>
</div>

<div class="card">
  <h3>😴 Fatigue and other systemic effects</h3>
  <ul class="clean">
    <li><b>Cancer-related fatigue is the most common side effect</b> and is not relieved by sleep. Cluster care, prioritize activities, plan rest before rather than after exhaustion, encourage light activity — which paradoxically helps.</li>
    <li><b>Peripheral neuropathy</b> from vincristine, cisplatin, and taxanes: numbness and tingling in a stocking-glove pattern. Safety teaching — test water temperature, inspect feet, watch for falls.</li>
    <li><b>Nephrotoxicity</b> from cisplatin and methotrexate — hydrate aggressively, monitor creatinine.</li>
    <li><b>Cardiotoxicity</b> from doxorubicin — lifetime cumulative dose limit, baseline ejection fraction.</li>
    <li><b>Reproductive effects</b> — discuss <b>fertility preservation before treatment begins</b>, not after.</li>
  </ul>
</div>

<div class="card">
  <h3>Complications of cancer itself</h3>
  <ul class="clean">
    <li><b>Pain</b> — whatever the patient says it is, occurring whenever they say it does. <b>Around-the-clock dosing</b> for constant pain with breakthrough doses on top. Fear of addiction is not a reason to undertreat.</li>
    <li><b>Infection</b> — from neutropenia, and it presents without the usual signs.</li>
    <li><b>Altered nutrition</b> — deficient intake → malnutrition → <b>cachexia</b>. Follow <b>albumin and prealbumin</b>; prealbumin changes earliest because its half-life is short. Feed high-calorie, high-protein, soft, nonirritating food in small frequent amounts.</li>
    <li><b>Psychosocial</b> — anxiety, altered body image, role loss, fear of recurrence. Active listening, honest information, an open relationship.</li>
  </ul>
  <div class="why-chain"><b>Albumin comes from the liver.</b> Liver cancer or metastasis drops albumin → oncotic pressure falls → fluid leaves the vessel → <b>third spacing</b>. The patient is edematous and intravascularly dry at the same time.</div>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>Treatment goals — name the goal before the modality</h3>
  <table class="lab">
    <tr><th>Goal</th><th>Meaning</th></tr>
    <tr><td><b>Cure</b></td><td><b>Complete eradication</b> of malignant disease</td></tr>
    <tr><td><b>Control</b></td><td><b>Prolonged survival and containment</b> of cancer cell growth</td></tr>
    <tr><td><b>Palliation</b></td><td><b>Relief of symptoms and improvement of quality of life</b></td></tr>
  </table>
  <div class="hy"><span class="tag">How treatment is chosen</span>Options are based on the <b>goal</b> plus the specific <b>type, stage, and grade</b> of the cancer. The same drug can be given with any of the three goals — the goal is what the plan is built around, not the drug.</div>
</div>

<div class="card">
  <h3>The six modalities</h3>
  <table class="lab">
    <tr><th>Modality</th><th>Key nursing point</th></tr>
    <tr><td><b>Surgery</b></td><td>See the five types below</td></tr>
    <tr><td><b>Radiation therapy</b></td><td>Local. External beam patient is not radioactive; brachytherapy patient IS a source</td></tr>
    <tr><td><b>Chemotherapy</b></td><td>Systemic — reaches metastases. Given in <b>cycles</b> so normal cells recover</td></tr>
    <tr><td><b>Hematopoietic stem cell transplant (HSCT)</b></td><td>Rescue after high-dose therapy. Profound prolonged neutropenia; watch for graft-versus-host disease</td></tr>
    <tr><td><b>Immunotherapy</b></td><td>Uses the immune system. Flu-like symptoms, infusion reactions, autoimmune effects</td></tr>
    <tr><td><b>Targeted therapy</b></td><td>Directed at specific molecular features of the tumor</td></tr>
  </table>
</div>

<div class="card">
  <h3>🔪 The five types of cancer surgery</h3>
  <table class="lab">
    <tr><th>Type</th><th>Purpose</th></tr>
    <tr><td><b>Diagnostic</b></td><td><b>Obtaining tissue to identify cellular characteristics</b> — biopsy</td></tr>
    <tr><td><b>Primary treatment</b></td><td><b>Removing the entire tumor</b> or as much as feasible</td></tr>
    <tr><td><b>Prophylactic</b></td><td><b>Removing nonvital tissues at increased risk</b> of developing cancer</td></tr>
    <tr><td><b>Palliative</b></td><td><b>Relieving symptoms and improving quality of life</b> — not curative</td></tr>
    <tr><td><b>Reconstructive</b></td><td><b>Improving function or obtaining a more desirable cosmetic effect</b></td></tr>
  </table>
  <div class="trap"><span class="tag">The distinction he tests</span><b>Prophylactic</b> removes healthy tissue in a high-risk patient — a mastectomy in a BRCA carrier with no cancer. <b>Palliative</b> is done in someone who has cancer, purely for symptoms, with no expectation of cure.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>☢️ Radiation therapy — sensitivity and toxicities</h3>
  <p class="why-chain"><b>Tissues undergoing frequent cell division are most sensitive to radiation.</b> Same principle as chemo: <b>bone marrow, lymphatic tissue, GI tract epithelium, hair follicles, and gonads</b>.</p>
  <ul class="clean">
    <li><b>Acute or early toxicities begin within 2 weeks</b> of starting treatment.</li>
    <li><b>Tissues affected:</b> skin, gastrointestinal tract, bone marrow.</li>
    <li><b>Common reactions:</b> radiodermatitis, stomatitis, mucositis, esophagitis, anorexia, nausea, vomiting, diarrhea, <b>anemia, leukopenia, thrombocytopenia</b>.</li>
    <li><b>Systemic side effects:</b> fatigue, malaise, anorexia.</li>
    <li>Collaborate with other providers to manage symptoms and promote healing, comfort, and quality of life.</li>
    <li>Consider factors predictive of <b>radiation toxicity or radiosensitivity</b>; assess <b>skin, nutritional status, and general well-being</b>; use <b>evidence-based protocols</b>.</li>
  </ul>
  <div class="hy"><span class="tag">Protecting caregivers</span><b>Time, distance, shielding.</b> Applies to <b>brachytherapy</b> — no pregnant staff or visitors, no children, long-handled forceps and a lead container in the room. <b>External beam patients need none of this.</b></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>💉 Chemotherapy — goal and toxicity</h3>
  <div class="mnem"><div class="tag">⭐ The goal of chemotherapy</div><div class="big">Eradicate ENOUGH tumor cells for the immune system to destroy the rest</div><div class="exp">Not to kill every cell directly. That is why it works with immune surveillance rather than replacing it.</div></div>
  <ul class="clean">
    <li><b>Actively proliferating cells are most sensitive.</b></li>
    <li><b>Nondividing cells are least sensitive and potentially dangerous</b> — they survive treatment and can re-enter the cell cycle later.</li>
    <li><b>Acute and chronic toxicity</b> affects rapidly growing cells: epithelium and bone marrow.</li>
    <li><b>Body systems impacted:</b> gastrointestinal, hematopoietic, renal, cardiopulmonary, reproductive, neurologic.</li>
    <li><b>Common side effects:</b> nausea, vomiting, <b>myelosuppression</b>, nephrotoxicity, cardiotoxicity.</li>
  </ul>
  <div class="trap"><span class="tag">⚠️ Extravasation — irritant vs vesicant</span>
  <b>Leakage of IV chemotherapy into surrounding tissue.</b><br>
  • <b>Irritants</b> cause a <b>localized inflammatory reaction</b>.<br>
  • <b>Vesicants</b> cause <b>inflammation, tissue damage, and necrosis</b>.<br>
  <b>STOP the infusion — do NOT remove the IV.</b> Aspirate residual drug through the catheter, then notify the provider. Pulling the line or flushing it first spreads the drug.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>☣️ Safety in handling chemotherapy</h3>
  <div class="mnem"><div class="tag">⭐ He called this out</div><div class="big">The DOUBLE FLUSH · Do not share restrooms</div><div class="exp">Cytotoxic drugs are excreted in urine, stool, vomit, and sweat for about <b>48 hours</b> after a dose. Flush the toilet <b>twice with the lid closed</b>, and the patient uses a <b>separate bathroom</b> from the rest of the household when possible.</div></div>
  <table class="lab">
    <tr><th>Category</th><th>Requirements</th></tr>
    <tr><td><b>Safety equipment for preparing</b></td><td><b>Class II or III biologic safety cabinet (BSC)</b> · <b>closed-system transfer devices</b> · <b>puncture- and leak-proof containers and IV bags</b> · <b>needleless systems</b></td></tr>
    <tr><td><b>Personal protection for handling</b></td><td><b>Double layer of powder-free gloves</b> · <b>long-sleeve disposable gown</b> · <b>surgical N-95 respirator</b> · <b>eye and face protection</b></td></tr>
    <tr><td><b>Disposal of contaminated materials</b></td><td><b>Closed-system, puncture- and leak-proof containers</b> labeled <b>"hazardous: chemotherapy contaminated waste"</b></td></tr>
    <tr><td><b>Quality improvement program</b></td><td><b>Standard operating policies and procedures</b> · <b>competency-based education and training</b> · <b>medical monitoring program</b> · <b>root cause analysis for spills and exposure incidents</b></td></tr>
  </table>
  <ul class="clean">
    <li><b>Double gloves must be powder-free</b> — powder aerosolizes drug particles.</li>
    <li>Handle <b>linens, body fluids, and waste</b> from a chemo patient with gloves and gown for <b>48 hours</b> after treatment.</li>
    <li><b>Pregnant, breastfeeding, or trying-to-conceive staff</b> should not handle these agents.</li>
    <li>Chemotherapy drugs are <b>never crushed</b> — aerosolized particles are a staff exposure.</li>
  </ul>
  <div class="trap"><span class="tag">Where he turns the screw</span>The home teaching questions. <b>Double flush with the lid down, separate bathroom, wash contaminated laundry separately and twice, wear gloves handling body fluids for 48 hours.</b> Options that treat the patient as non-hazardous after discharge are wrong.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>Potential long-term complications of cancer treatment</h3>
  <table class="lab">
    <tr><th>System</th><th>Complications</th></tr>
    <tr><td><b>Sensory</b></td><td>Abnormalities in the senses of <b>taste, smell, and touch</b></td></tr>
    <tr><td><b>Cardiovascular</b></td><td><b>Cardiovascular toxicity</b> — coronary artery disease, myocardial infarction. <b>Pericarditis</b>, acute or chronic</td></tr>
    <tr><td><b>Pulmonary</b></td><td><b>Pneumonitis</b>, acute or chronic. <b>Dyspnea on exertion</b></td></tr>
    <tr><td><b>Endocrine / reproductive</b></td><td><b>Hypothyroidism</b> · <b>infertility</b> · <b>decreased libido</b> · <b>growth delay in children</b> · <b>osteoporosis</b></td></tr>
    <tr><td><b>GI / oral</b></td><td><b>Dental caries</b> · <b>dry mouth</b> · <b>dysphagia</b></td></tr>
    <tr><td><b>Immune / infectious</b></td><td><b>Immune dysfunction</b> · <b>herpes infections (zoster and varicella)</b> · <b>pneumococcal sepsis</b></td></tr>
    <tr><td><b>Secondary malignancy</b></td><td><b>Secondary cancers</b> — acute myeloid leukemia, myelodysplastic syndromes</td></tr>
  </table>
  <div class="hy"><span class="tag">Why survivorship care exists</span>These are the reason <b>tertiary prevention</b> is a real level of care. A cured patient still needs lifelong surveillance for <b>secondary cancers</b>, cardiac function, thyroid function, and bone density.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🍽️ Consequences of impaired nutrition</h3>
  <p class="intro-line" style="margin-top:0">Nutrition is not a comfort issue in cancer care. It changes outcomes.</p>
  <ul class="clean">
    <li><b>Anemia</b></li>
    <li><b>Decreased capacity to continue antineoplastic therapy</b> — treatment gets delayed or stopped</li>
    <li><b>Decreased survival</b></li>
    <li><b>Delayed tissue and wound healing</b></li>
    <li><b>Diminished functional ability</b></li>
    <li><b>Fatigue</b></li>
    <li><b>Immune incompetence and increased incidence of infection</b></li>
    <li><b>Impaired psychosocial functioning</b></li>
    <li><b>Increased hospital admissions</b> and <b>increased length of stay</b></li>
  </ul>
  <div class="trap"><span class="tag">The exam angle</span>When a stem offers "encourage a regular diet" versus a real nutrition intervention, remember that poor nutrition <b>stops the chemotherapy</b> and <b>shortens survival</b>. Follow <b>albumin and prealbumin</b>; feed <b>high-calorie, high-protein, soft, nonirritating</b> foods in small frequent amounts.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the wrong tissue</span>He asks which cells chemo damages and offers <b>muscle, brain, bone, or cartilage</b>. Those are slow-dividing and spared. The answer is always <b>marrow, GI lining, hair follicles</b>. Derive it — do not recall a list.</div>
  <div class="trap"><span class="tag">Trap 2 — absence of signs read as reassurance</span>"No redness, no drainage, so no infection." In a neutropenic patient there are <b>no neutrophils to make those signs</b>. Absence of inflammation is expected, not comforting.</div>
  <div class="trap"><span class="tag">Trap 3 — the antipyretic</span>Giving acetaminophen for a fever in a neutropenic patient <b>masks the only sign they can produce</b>. Cultures first, antibiotics within the hour.</div>
  <div class="trap"><span class="tag">Trap 4 — lemon-glycerin swabs and alcohol mouthwash</span>Both offered for mucositis, both <b>dry and burn</b> ulcerated tissue. Use <b>saline or sodium bicarbonate</b> rinses with a soft brush.</div>
  <div class="trap"><span class="tag">Trap 5 — antiemetics given after the nausea</span>They are <b>scheduled before</b> chemotherapy, not PRN once vomiting starts. Anticipatory nausea is learned and is far harder to break than to prevent.</div>
  <div class="trap"><span class="tag">Trap 6 — wig planning after hair loss</span>Head coverings are arranged <b>before</b> the hair falls out, while color and texture can still be matched.</div>
  <div class="trap"><span class="tag">Trap 7 — external vs internal radiation</span>An <b>external beam</b> patient is <b>not radioactive</b> and needs no shielding precautions. A <b>brachytherapy</b> patient is a source — time, distance, shielding, no pregnant staff or children.</div>
  <div class="trap"><span class="tag">Trap 8 — pulling the line on extravasation</span>Stop the infusion but <b>leave the catheter in</b> so residual drug can be aspirated. Flushing it or removing it first spreads the vesicant.</div>
  <div class="trap"><span class="tag">Trap 9 — prevention levels with all-correct options</span>All four options are good health behaviors. Only the <b>classification</b> separates them: vaccination and cessation are <b>primary</b>, screening is <b>secondary</b>, recurrence surveillance is <b>tertiary</b>.</div>
  <div class="trap"><span class="tag">Trap 10 — edema read as fluid overload</span>Low albumin from liver involvement causes <b>third spacing</b>. The patient looks swollen and is intravascularly <b>dry</b>. Check the BP and heart rate, not the ankles.</div>
  <div class="trap"><span class="tag">Trap 11 — grading vs staging</span><b>Grading is the cells</b> (how abnormal they look). <b>Staging is the spread</b> (TNM). He swaps the definitions.</div>
  <div class="trap"><span class="tag">Trap 12 — fatigue treated with rest alone</span>Cancer-related fatigue is <b>not relieved by sleep</b>. Light activity and energy conservation both help; "stay in bed until it passes" is wrong.</div>
  <div class="trap"><span class="tag">Trap 13 — which carcinogenesis stage is reversible</span>Only <b>PROMOTION</b>. Initiation and progression are irreversible. He will offer initiation as reversible "because of DNA repair" — repair prevents initiation from completing, it does not undo it.</div>
  <div class="trap"><span class="tag">Trap 14 — dysplasia called cancer</span><b>Dysplasia is precancerous</b>, not cancer. <b>Neoplasia</b> is the pattern cancerous cells demonstrate. The other four — atrophy, hypertrophy, hyperplasia, metaplasia — are <b>adaptations</b>.</div>
  <div class="trap"><span class="tag">Trap 15 — the discharged chemo patient treated as safe</span><b>Double flush with the lid down, separate bathroom, gloves for body fluids, 48 hours.</b> Options that drop precautions at discharge are wrong.</div>
  <div class="trap"><span class="tag">Trap 16 — prophylactic vs palliative surgery</span><b>Prophylactic removes healthy tissue in a high-risk patient with no cancer.</b> <b>Palliative treats symptoms in someone who has cancer</b>, with no expectation of cure.</div>
  <div class="trap"><span class="tag">Trap 17 — nutrition framed as optional</span>Impaired nutrition causes <b>decreased survival and an inability to continue therapy</b>. It is never the "address later" answer.</div>
</div>

<div id="cancerQuiz"></div>`;
SEC_POOLS['cancerQuiz']={mapped:secMap(EXAM.filter(q=>q.topic==='cancer')),cap:SECTION_QUIZ_SIZE,title:'Cancer practice',source:'Cancer'};
renderFilteredQuiz('cancerQuiz', secSample(SEC_POOLS['cancerQuiz'].mapped, SECTION_QUIZ_SIZE), 'Cancer practice', 'Cancer', SEC_POOLS['cancerQuiz'].mapped.length);


document.getElementById('sec-oncoemerg').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🚨</span> Oncologic Emergencies</h2>
<p class="intro-line">Laid out the way Casteel teaches them — <b>clinical manifestations → diagnostic findings → medical management → nursing management</b>. He flagged <b>SVCS</b> and <b>TLS</b> as the two to know cold.</p>

<div class="card" style="border-color:var(--red);background:var(--red-soft)">
  <h3>❗ Superior Vena Cava Syndrome (SVCS) — he emphasized this</h3>
  <p class="why-chain">A tumor or thrombus <b>compresses or obstructs the superior vena cava</b>, so blood cannot drain from the head, neck, and upper extremities. Everything backs up above the blockage.</p>
  <table class="lab">
    <tr><td><b>Clinical manifestations</b></td><td><b>Dyspnea, cough, facial swelling.</b> Also periorbital and upper extremity edema, distended neck and chest veins, a "tight shirt collar" feeling, hoarseness</td></tr>
    <tr><td><b>Diagnostic findings</b></td><td><b>Chest x-ray</b> and <b>thoracic CT scan</b></td></tr>
    <tr><td><b>Medical management</b></td><td><b>Radiation therapy, chemotherapy, anticoagulant therapy.</b> Stenting in some cases</td></tr>
    <tr><td><b>Nursing management</b></td><td><b>Monitor cardiopulmonary status.</b> <b>Avoid upper extremity venipuncture</b> — use lower extremity or a site below the obstruction. Raise the head of the bed, oxygen, avoid anything constricting the neck or arms</td></tr>
  </table>
  <div class="trap"><span class="tag">The nursing action he will ask for</span><b>No upper extremity venipuncture, IVs, or blood pressures.</b> Drainage above the obstruction is already impaired — sticking or squeezing that arm worsens swelling and gives unreliable readings. Also never lay this patient flat.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>Spinal Cord Compression</h3>
  <p class="why-chain">Tumor in the vertebral column or epidural space <b>presses on the cord</b>. Damage that occurs before treatment is <b>permanent</b>, so timing is the whole issue.</p>
  <table class="lab">
    <tr><td><b>Clinical manifestations</b></td><td><b>Back or neck pain</b> (earliest and most common), <b>motor loss</b> or weakness, <b>bladder dysfunction</b>. Sensory changes. Bowel and bladder changes are <b>late</b></td></tr>
    <tr><td><b>Diagnostic findings</b></td><td><b>MRI</b> (study of choice) and <b>x-rays</b></td></tr>
    <tr><td><b>Medical management</b></td><td><b>Radiation therapy, surgery, vertebral augmentation.</b> Corticosteroids to reduce cord edema</td></tr>
    <tr><td><b>Nursing management</b></td><td><b>Control pain</b> and <b>prevent complications of immobility</b> — skin, DVT, pneumonia, constipation. Frequent neuro checks, log-roll, bladder assessment</td></tr>
  </table>
  <div class="trap"><span class="tag">Why the pain matters</span>New back pain in a patient with known cancer is a <b>neurologic emergency until imaging says otherwise</b>, not a comfort issue. By the time bowel and bladder function change, deficits are often permanent.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>Hypercalcemia of Malignancy</h3>
  <p class="why-chain">Bone metastasis or tumor-secreted PTH-related peptide <b>releases calcium from bone</b> into the blood.</p>
  <table class="lab">
    <tr><td><b>Clinical manifestations</b></td><td><b>Fatigue, weakness, confusion.</b> Also lethargy, constipation, nausea, polyuria, muscle weakness, bone pain. High calcium <b>slows things down</b></td></tr>
    <tr><td><b>Diagnostic findings</b></td><td><b>Serum calcium above 10.4 mg/dL</b></td></tr>
    <tr><td><b>Medical management</b></td><td><b>Hydration</b> (isotonic saline) then <b>bisphosphonate therapy</b>. Calcitonin for rapid lowering</td></tr>
    <tr><td><b>Nursing management</b></td><td><b>Monitor mental status and fluid balance.</b> Strict I&amp;O, daily weights, fall and seizure precautions, encourage mobility, watch for dysrhythmias</td></tr>
  </table>
  <div class="hy"><span class="tag">Order of treatment</span><b>Fluids first, bisphosphonate second.</b> Saline drives urinary calcium excretion; the bisphosphonate stops the bone from releasing more. Giving calcium, restricting fluids, or pushing calcium gluconate are all wrong — <b>calcium gluconate treats HYPOcalcemia</b>.</div>
  <div class="hy"><span class="tag">Note on the number</span>He gave <b>&gt;10.4 mg/dL</b>. Some references list the upper limit at 10.2. <b>Use his number on his exam.</b></div>
</div>

<div class="card" style="border-color:var(--red);background:var(--red-soft)">
  <h3>❗ Tumor Lysis Syndrome (TLS) — he emphasized this</h3>
  <p class="why-chain"><b>Caused by the byproducts of breaking down the cancer.</b> Rapid tumor cell death spills intracellular contents into the bloodstream faster than the kidneys can clear them. It is a <b>treatment</b> complication, not a tumor complication — it appears <b>after</b> chemo begins, usually within 24 to 72 hours.</p>
  <table class="lab">
    <tr><td><b>Clinical manifestations</b></td><td><b>Fatigue, muscle cramps, arrhythmias.</b> Also nausea, vomiting, diarrhea, tetany, seizures, decreased urine output</td></tr>
    <tr><td><b>Diagnostic findings</b></td><td><b>Electrolyte imbalances</b> and <b>electrocardiogram</b> changes</td></tr>
    <tr><td><b>Medical management</b></td><td><b>Fluid hydration, diuresis, allopurinol therapy.</b> Rasburicase for high uric acid; treat hyperkalemia; dialysis if severe</td></tr>
    <tr><td><b>Nursing management</b></td><td><b>Monitor vital signs</b> and <b>educate patients about risk factors.</b> Strict I&amp;O, cardiac monitoring, watch for the tetany of low calcium</td></tr>
  </table>
  <div class="mnem"><div class="tag">The lab pattern — three up, one down</div><div class="big">↑ Potassium · ↑ Phosphate · ↑ Uric acid · ↓ CALCIUM</div><div class="exp">Cells release K, phosphate, and nucleic acids (which become uric acid). The <b>phosphate binds calcium</b>, so calcium falls. That is why calcium goes the opposite direction from everything else.</div></div>
  <div class="trap"><span class="tag">Where he turns the screw</span>He puts <b>"elevated calcium"</b> in the TLS lab set. Calcium goes <b>DOWN</b> in TLS — the opposite of hypercalcemia of malignancy. Two oncologic emergencies, opposite calcium directions, and he will put them in the same exam.</div>
  <div class="hy"><span class="tag">Highest risk</span>Large tumor burden, high cell turnover — leukemias and lymphomas especially — and the <b>first cycle</b> of treatment. Prevention is <b>aggressive hydration and allopurinol started before chemo</b>.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>Neutropenic Sepsis</h3>
  <table class="lab">
    <tr><td><b>Clinical manifestations</b></td><td>Fever of <b>100.4°F</b> or higher with an <b>ANC under 500</b>. Often <b>no other signs</b> — no redness, no pus, no swelling. May progress to hypotension and tachycardia</td></tr>
    <tr><td><b>Diagnostic findings</b></td><td>CBC with differential and ANC, <b>blood cultures from two sites</b>, lactate</td></tr>
    <tr><td><b>Medical management</b></td><td><b>Broad-spectrum IV antibiotics within 60 minutes</b>, isotonic fluid resuscitation, growth factors</td></tr>
    <tr><td><b>Nursing management</b></td><td><b>Cultures before antibiotics</b>, protective isolation, frequent vital signs, no antipyretic before the workup</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the calcium direction, flipped</span>The single most likely trap here. <b>Hypercalcemia of malignancy: calcium UP. Tumor lysis syndrome: calcium DOWN.</b> Both are oncologic emergencies and both will appear.</div>
  <div class="trap"><span class="tag">Trap 2 — upper extremity access in SVCS</span>Any option starting an IV, drawing blood, or taking a BP in the <b>upper extremity</b> of an SVCS patient is wrong. Drainage there is already obstructed.</div>
  <div class="trap"><span class="tag">Trap 3 — SVCS positioned flat</span>Facial swelling with distended neck veins needs the <b>head of the bed raised</b>. Lying flat worsens the obstruction.</div>
  <div class="trap"><span class="tag">Trap 4 — back pain treated as comfort</span>New back pain in known cancer is <b>spinal cord compression until proven otherwise</b>. A PRN analgesic answer misses the emergency, and the deficits that follow are permanent.</div>
  <div class="trap"><span class="tag">Trap 5 — supplementing calcium in hypercalcemia</span><b>Isotonic saline first, then a bisphosphonate.</b> Calcium gluconate treats <b>hypo</b>calcemia. Fluid restriction makes it worse.</div>
  <div class="trap"><span class="tag">Trap 6 — TLS blamed on the tumor</span>TLS is a <b>treatment</b> complication from the <b>byproducts of cell breakdown</b>, appearing 24–72 hours after chemo starts. Options attributing it to tumor growth are wrong.</div>
  <div class="trap"><span class="tag">Trap 7 — waiting for a higher fever</span>At an ANC under 500, <b>100.4°F is the emergency</b>. A neutropenic patient may never mount a higher fever, and an antipyretic masks the only sign they have.</div>
  <div class="trap"><span class="tag">Trap 8 — antibiotics before cultures</span><b>Cultures from two sites first</b>, then antibiotics within 60 minutes. Cultures drawn after the first dose may not grow the organism.</div>
</div>

<div id="oncoQuiz"></div>`;
