<script>
document.getElementById('sec-resp').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🫁</span> Respiratory</h2>
<p class="intro-line">Casteel confirmed respiratory is also on this exam. Chapters 17–21 condensed to what he tests. The full treatment lives in the Unit 2 guide — this is the exam-focused version.</p>

<div class="tipbar">🎯 If you are short on time, read the <b>V/Q</b> card, the <b>pneumonia</b> card, and the <b>COPD vs asthma</b> card. Those carry the most questions.</div>

<div class="card" style="border-color:var(--teal)">
  <h3>The mechanics you need</h3>
  <table class="lab">
    <tr><th>Term</th><th>What it is</th></tr>
    <tr><td><b>⭐ Tidal volume</b></td><td>Air moved with each <b>normal</b> breath, about 500 mL. He said know this one</td></tr>
    <tr><td><b>Residual volume</b></td><td>Air left after <b>maximal</b> exhalation. <b>Rises with aging and COPD</b> from air trapping</td></tr>
    <tr><td><b>Vital capacity</b></td><td>Max exhaled after a max inhalation. Falls in restrictive disease</td></tr>
    <tr><td><b>Compliance</b></td><td>How easily the lungs <b>stretch</b>. <b>Down</b> in ARDS, fibrosis, pneumonia. <b>Up</b> in emphysema — floppy lungs that will not recoil</td></tr>
    <tr><td><b>Airway resistance</b></td><td>Opposition to airflow. Raised by bronchoconstriction, secretions, edema. More resistance = more work of breathing</td></tr>
    <tr><td><b>Diffusion</b></td><td>Gas exchange at the <b>alveolar-capillary membrane</b>. Needs a thin membrane and large surface area</td></tr>
    <tr><td><b>Perfusion</b></td><td>Blood from the <b>right ventricle through the pulmonary artery</b>. Affected by pulmonary artery pressure, gravity, alveolar pressure</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>⭐ Ventilation-perfusion (V/Q)</h3>
  <table class="lab">
    <tr><th>Pattern</th><th>What is happening</th><th>Classic cause</th></tr>
    <tr><td><b>SHUNT (low V/Q)</b></td><td><b>Blood but no air.</b> Perfusion without ventilation</td><td><b>Pneumonia, atelectasis, pulmonary edema, ARDS</b></td></tr>
    <tr><td><b>DEAD SPACE (high V/Q)</b></td><td><b>Air but no blood.</b> Ventilation without perfusion</td><td><b>Pulmonary embolism</b> — the clot blocks blood, not air</td></tr>
    <tr><td><b>Silent unit</b></td><td>Neither</td><td>Pneumothorax, severe ARDS</td></tr>
  </table>
  <div class="mnem"><div class="tag">One line</div><div class="big">SHUNT = blood, no air. DEAD SPACE = air, no blood.</div><div class="exp">Shunted blood does not participate in gas exchange, and <b>oxygen cannot fix it</b> — the O₂ never reaches blood bypassing filled alveoli. That is why <b>refractory hypoxemia means ARDS</b>.</div></div>
</div>

<div class="card">
  <h3>Assessment — the findings he uses</h3>
  <table class="lab">
    <tr><th>Finding</th><th>Meaning</th></tr>
    <tr><td><b>⭐ Restlessness</b></td><td><b>Earliest sign of hypoxia.</b> Before any number changes</td></tr>
    <tr><td><b>Cyanosis</b></td><td><b>Very late.</b> Needs ~5 g/dL unoxygenated hemoglobin, so an anemic patient may never show it</td></tr>
    <tr><td><b>Clubbing</b></td><td><b>Chronic</b> hypoxia. Never acute</td></tr>
    <tr><td><b>Orthopnea</b></td><td>Dyspnea lying flat. Ask how many pillows they sleep on</td></tr>
    <tr><td><b>Egophony</b></td><td>"E" sounds like <b>"A"</b> — <b>consolidation</b></td></tr>
    <tr><td><b>Tactile fremitus</b></td><td><b>Up</b> over consolidation, <b>down</b> over effusion or pneumothorax</td></tr>
    <tr><td><b>Percussion</b></td><td><b>Dull</b> over fluid or consolidation, <b>hyperresonant</b> over trapped air</td></tr>
    <tr><td><b>Barrel chest</b></td><td>Air trapping — COPD</td></tr>
  </table>
  <div class="mnem"><div class="tag">Consolidation vs effusion</div><div class="big">Both dull. Consolidation raises fremitus. Effusion lowers it.</div></div>
</div>

<div class="card">
  <h3>Atelectasis — the postoperative link</h3>
  <ul class="clean">
    <li><b>Collapse of alveoli</b> from hypoventilation, retained secretions, or compression.</li>
    <li><b>The most common cause of fever in the first 24–48 hours after surgery.</b> That timing is how he separates it from infection, which arrives after day 3.</li>
    <li><b>Signs:</b> ↑RR and HR, dyspnea, cough, ↓breath sounds and crackles over the area, ↓oxygen saturation.</li>
    <li><b>Prevention is the answer:</b> <b>incentive spirometer</b>, turn-cough-deep-breathe, early ambulation, splinting the incision, adequate pain control so they will actually do it.</li>
    <li>Secretion management: hydration, positioning, chest physiotherapy, suctioning if needed.</li>
  </ul>
  <div class="hy"><span class="tag">Why this connects to your Postop section</span>The reason we medicate pain <b>before</b> pulmonary hygiene is that pain is what prevents deep breathing, and shallow breathing is what collapses the alveoli.</div>
</div>

<div class="card">
  <h3>Pneumonia</h3>
  <table class="lab">
    <tr><th>Type</th><th>Key point</th></tr>
    <tr><td><b>Community-acquired (CAP)</b></td><td>Onset outside the hospital or within 48 hours of admission</td></tr>
    <tr><td><b>Hospital-acquired (HAP)</b></td><td>Onset <b>48 hours or more after admission</b>. More resistant organisms</td></tr>
    <tr><td><b>Ventilator-associated (VAP)</b></td><td>After 48 hours of intubation. Prevented by the <b>VAP bundle</b>: head of bed 30–45°, daily sedation interruption and extubation readiness, oral care with chlorhexidine, DVT and ulcer prophylaxis</td></tr>
    <tr><td><b>Aspiration</b></td><td>Risk: impaired swallow, decreased LOC, tube feeding, sedation. Prevent with upright positioning and swallow evaluation</td></tr>
    <tr><td><b>Immunocompromised</b></td><td>Opportunistic organisms; may present with almost no signs</td></tr>
  </table>
  <ul class="clean">
    <li><b>Signs:</b> fever, chills, productive cough, pleuritic chest pain, dyspnea, crackles, <b>dull percussion and increased fremitus</b> over consolidation.</li>
    <li><b>⭐ Gerontologic:</b> an older adult may present with <b>confusion and no fever</b>. That is the tested version.</li>
    <li><b>Prevention:</b> pneumococcal and influenza vaccination, smoking cessation, hand hygiene, mobility.</li>
    <li><b>Management:</b> antibiotics after cultures, oxygen, hydration to thin secretions, incentive spirometry, positioning.</li>
  </ul>
  <div class="trap"><span class="tag">The classic stem</span>An 80-year-old brought in for "new confusion" with no fever. <b>Suspect pneumonia or UTI</b>, not dementia. Aging blunts the febrile response.</div>
</div>

<div class="card">
  <h3>COPD vs. asthma</h3>
  <table class="lab">
    <tr><th></th><th>COPD</th><th>Asthma</th></tr>
    <tr><td><b>Reversibility</b></td><td><b>Not fully reversible</b>, progressive</td><td><b>Reversible</b> airflow obstruction</td></tr>
    <tr><td><b>Cause</b></td><td>Smoking; alpha-1 antitrypsin deficiency</td><td>Hypersensitivity, triggers, inflammation</td></tr>
    <tr><td><b>Findings</b></td><td>Barrel chest, prolonged expiration, pursed-lip breathing, clubbing, ↑residual volume, tripod position</td><td>Wheezing, cough, chest tightness, episodic</td></tr>
    <tr><td><b>Oxygen</b></td><td><b>Target 88–92%</b> with controlled delivery</td><td>Titrate to normal saturation</td></tr>
    <tr><td><b>Worst sign</b></td><td>Rising CO₂ with somnolence</td><td><b>Silent chest</b> and a <b>normalizing CO₂</b></td></tr>
  </table>
  <div class="trap"><span class="tag">⭐ The two that look like improvement</span>In an asthma attack, a <b>quiet chest means air is no longer moving</b> — worse, not better. A <b>CO₂ rising into the normal range</b> in a hyperventilating asthmatic means they are tiring out. Both are impending respiratory failure.</div>
  <div class="hy"><span class="tag">Inhaler order</span><b>Bronchodilator first, then the steroid, then rinse.</b> Albuterol is rescue; salmeterol is maintenance and never used during an attack.</div>
  <div class="hy"><span class="tag">Peak flow zones</span><b>Green</b> 80–100% of personal best = good control. <b>Yellow</b> 50–80% = caution, use the rescue plan. <b>Red</b> under 50% = emergency.</div>
</div>

<div class="card">
  <h3>Tuberculosis — the essentials</h3>
  <ul class="clean">
    <li><b>Airborne.</b> Negative-pressure room, <b>N95 for staff</b>, surgical mask on the <b>patient</b> during transport.</li>
    <li><b>Signs:</b> low-grade fever, <b>night sweats</b>, weight loss, fatigue, cough over 3 weeks, hemoptysis.</li>
    <li><b>Mantoux:</b> read at <b>48–72 hours</b>, measure <b>induration</b> not redness. A positive test means <b>exposure</b>, not active disease.</li>
    <li><b>Sputum culture is the confirmation.</b> QuantiFERON-TB Gold and T-SPOT are blood tests unaffected by prior BCG.</li>
    <li><b>RIPE:</b> Rifampin (orange fluids), Isoniazid (give B6, hepatotoxic), Pyrazinamide (hepatotoxic), Ethambutol (optic neuritis — report vision changes).</li>
    <li><b>Full course 6–12 months</b> even after symptoms resolve. Stopping early breeds resistance.</li>
  </ul>
  <div class="hy"><span class="tag">Granuloma word</span>TB forms <b>caseating</b> granulomas. <b>Sarcoidosis forms NONcaseating</b> granulomas. One word.</div>
</div>

<div class="card">
  <h3>Other conditions to recognize</h3>
  <table class="lab">
    <tr><th>Condition</th><th>The one thing</th></tr>
    <tr><td><b>Pulmonary embolism</b></td><td><b>Sudden</b> dyspnea, pleuritic pain, tachycardia, anxiety. <b>Dead space</b> — air without blood. D-dimer is nonspecific; CT angiography confirms</td></tr>
    <tr><td><b>ARDS</b></td><td><b>Refractory hypoxemia</b> — does not improve with oxygen. Stiff, low-compliance lungs</td></tr>
    <tr><td><b>Pleural effusion</b></td><td>Fluid in the pleural space. <b>Dull percussion, decreased fremitus and breath sounds.</b> Thoracentesis</td></tr>
    <tr><td><b>Pleurisy</b></td><td><b>Sharp knife-like pain worse with inspiration</b>, friction rub. Splint with a pillow when coughing</td></tr>
    <tr><td><b>Pneumothorax</b></td><td>Absent breath sounds, hyperresonance. <b>Tension:</b> tracheal deviation <b>away</b>, hypotension — emergency</td></tr>
    <tr><td><b>Bronchiectasis</b></td><td><b>Irreversible</b> bronchial dilation with <b>copious purulent sputum</b>. Postural drainage</td></tr>
    <tr><td><b>Sarcoidosis</b></td><td><b>Noncaseating</b> granulomas, hilar adenopathy, insidious onset. Many remit untreated; prednisone if needed</td></tr>
    <tr><td><b>Lung abscess</b></td><td>Foul-smelling sputum, often after aspiration</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the silent chest</span>A wheezing asthmatic who goes quiet is <b>worse</b>, not better. No air is moving. Same with a <b>CO₂ that normalizes</b> in someone who was hyperventilating.</div>
  <div class="trap"><span class="tag">Trap 2 — restlessness sedated</span><b>Restlessness is the earliest sign of hypoxia.</b> Any option that sedates or reassures that patient is wrong.</div>
  <div class="trap"><span class="tag">Trap 3 — withholding oxygen from a COPD patient</span>The target is <b>88–92% with controlled delivery</b>. That is not the same as withholding oxygen from someone in real distress. Options that refuse oxygen entirely are wrong.</div>
  <div class="trap"><span class="tag">Trap 4 — shunt vs dead space reversed</span><b>Pneumonia = shunt</b> (blood, no air). <b>PE = dead space</b> (air, no blood). He swaps them.</div>
  <div class="trap"><span class="tag">Trap 5 — confusion blamed on age</span>New confusion without fever in an older adult is <b>pneumonia or UTI</b> until proven otherwise.</div>
  <div class="trap"><span class="tag">Trap 6 — salmeterol during an attack</span>Same <b>-terol</b> ending as albuterol, opposite use. Rescue is <b>albuterol</b>.</div>
  <div class="trap"><span class="tag">Trap 7 — reading the Mantoux as redness</span>Measure <b>induration</b>, at <b>48–72 hours</b>. And a positive test is <b>exposure</b>, not active disease — sputum culture confirms.</div>
  <div class="trap"><span class="tag">Trap 8 — emphysema compliance</span>Emphysema <b>increases</b> compliance. Easy in, hard out. "Decreased compliance" is the intuitive wrong answer.</div>
  <div class="trap"><span class="tag">Trap 9 — atelectasis fever misdated</span><b>First 24–48 hours = atelectasis.</b> Infection fevers come <b>after day 3</b>.</div>
  <div class="trap"><span class="tag">Trap 10 — D-dimer treated as proof</span>It is a <b>nonspecific</b> marker of clot breakdown. Elevated means image it, not diagnose it.</div>
</div>

<div id="q-resp"></div>`;
SEC_POOLS['q-resp']={mapped:secMap(EXAM.filter(q=>q.topic==='resp')),cap:SECTION_QUIZ_SIZE,title:'Respiratory practice',source:'Respiratory'};
renderFilteredQuiz('q-resp', secSample(SEC_POOLS['q-resp'].mapped, SECTION_QUIZ_SIZE), 'Respiratory practice', 'Respiratory', SEC_POOLS['q-resp'].mapped.length);

</script>
<script>
document.getElementById('sec-pre').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🔵</span> Preoperative — Prepare the Patient</h2>
<p class="intro-line">Goal: optimize the patient physically and psychologically before surgery. Everything else is a task inside that goal.</p>

<div class="card">
  <h3>Preoperative assessment priorities</h3>
  <ul class="clean">
    <li><b>Allergies</b> — especially latex, iodine, eggs and soy (propofol), and prior anesthesia reactions.</li>
    <li><b>Family history of anesthesia problems</b> — this is how malignant hyperthermia gets caught before it happens.</li>
    <li><b>Medications</b> — anticoagulants, antiplatelets, insulin, steroids, and herbals.</li>
    <li><b>Substance use</b> — alcohol and tobacco change anesthesia needs and healing.</li>
    <li><b>Nutrition and hydration</b> — obesity and malnutrition both raise complication risk.</li>
    <li><b>Comorbidities</b> — cardiac, respiratory, renal, hepatic, and diabetes.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>NPO guidelines — the reason, not the clock</h3>
  <table class="lab">
    <tr><th>Intake</th><th>Fast before surgery</th></tr>
    <tr><td>Clear liquids</td><td><b>2 hours</b></td></tr>
    <tr><td>Breast milk</td><td>4 hours</td></tr>
    <tr><td>Light meal, infant formula, milk</td><td><b>6 hours</b></td></tr>
    <tr><td>Fatty or fried meal, meat</td><td><b>8 hours</b></td></tr>
  </table>
  <div class="why-chain">Anesthesia abolishes the gag reflex and relaxes the lower esophageal sphincter, so anything still in the stomach can reflux and be aspirated. The interval is set by <b>gastric emptying time</b>, which is why clear liquids are allowed last.</div>
  <div class="trap"><span class="tag">Outdated distractor</span>"NPO after midnight for everything, no exceptions." He uses it because it is what most students were taught.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>Informed consent — who does what</h3>
  <ul class="clean">
    <li><b>The surgeon</b> obtains consent and explains risks, benefits, and alternatives.</li>
    <li><b>The nurse</b> witnesses the signature and verifies the patient understands. If the patient cannot explain the procedure, <b>stop and call the surgeon</b>.</li>
    <li>Consent must be voluntary, from a competent adult, and obtained <b>before</b> sedating medication.</li>
    <li><b>Consent is revocable at any time</b>, including after signing and up to the moment of incision.</li>
    <li>Emergency exception: implied consent when the patient cannot consent and delay would be life-threatening.</li>
  </ul>
</div>

<div class="card">
  <h3>Preop teaching and immediate prep</h3>
  <ul class="clean">
    <li>Teach <b>before</b> the day of surgery when possible: deep breathing, incentive spirometry, splinting, ankle pumps, pain scale, and what to expect in PACU.</li>
    <li>Immediate prep: verify ID and allergies, confirm signed consent, have the patient void, remove dentures, jewelry, prosthetics, and nail polish, and confirm site marking.</li>
    <li><b>Diabetic patients:</b> hold metformin, reduce or hold mealtime insulin while NPO, check glucose on arrival. Near-normal glucose lowers infection risk and improves healing.</li>
    <li><b>Anticoagulants:</b> warfarin held about 5 days; herbals (garlic, ginkgo, ginger, ginseng) stopped about 2 weeks out.</li>
    <li><b>Latex allergy:</b> schedule the case <b>first</b>, latex-free supplies, signage, emergency equipment available.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — "NPO after midnight"</span>The outdated blanket answer. The interval is set by <b>gastric emptying time</b>: clear liquids 2 hr, light meal 6 hr, fatty meal 8 hr.</div>
  <div class="trap"><span class="tag">Trap 2 — consent treated as binding once signed</span><b>Consent is revocable at any time</b>, up to the incision. Stop and notify the surgeon. Persuading, proceeding, or recruiting family all violate autonomy.</div>
  <div class="trap"><span class="tag">Trap 3 — the nurse obtaining consent</span>The <b>surgeon</b> explains risks, benefits, and alternatives. The <b>nurse witnesses the signature and verifies understanding</b>. If the patient cannot explain the procedure, stop and call the surgeon.</div>
  <div class="trap"><span class="tag">Trap 4 — latex patient scheduled last</span>Latex-allergic patients go <b>FIRST</b>, so airborne particles from earlier cases have cleared. Scheduling last is right for <i>infection</i> isolation, and he counts on you transferring that rule.</div>
  <div class="trap"><span class="tag">Trap 5 — full insulin dose while NPO</span>A mealtime dose with no intake causes hypoglycemia under anesthesia, where the signs are masked. Basal is usually reduced, mealtime held, metformin held.</div>
  <div class="trap"><span class="tag">Trap 6 — herbals treated as harmless</span>Garlic, ginkgo, ginger, and ginseng all raise bleeding risk and stop about <b>2 weeks</b> out. Warfarin is held about 5 days.</div>
</div>

<div id="preQuiz"></div>`;
SEC_POOLS['preQuiz']={mapped:secMap(EXAM.filter(q=>q.topic==='pre')),cap:SECTION_QUIZ_SIZE,title:'Preoperative practice',source:'Preoperative'};
renderFilteredQuiz('preQuiz', secSample(SEC_POOLS['preQuiz'].mapped, SECTION_QUIZ_SIZE), 'Preoperative practice', 'Preoperative', SEC_POOLS['preQuiz'].mapped.length);


document.getElementById('sec-intra').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🟢</span> Intraoperative — Safety, Roles, MH, Fire</h2>
<p class="intro-line">Everything in the OR is a safety system. Know which role owns which safety job.</p>

<div class="card">
  <h3>Surgical team roles</h3>
  <table class="lab">
    <tr><th>Role</th><th>Owns</th></tr>
    <tr><td><b>Circulating nurse</b></td><td>Coordinates the room: positioning, counts, asepsis monitoring, documentation, specimen handling, verifying patient and site at the time-out. <b>Not sterile.</b></td></tr>
    <tr><td><b>Scrub nurse / tech</b></td><td>Sets up and maintains the sterile field, passes instruments, participates in counts. <b>Sterile.</b></td></tr>
    <tr><td><b>Anesthesia provider</b></td><td>Airway, vital signs, titrating anesthetic, fluid and blood management</td></tr>
    <tr><td><b>Surgeon</b></td><td>Performs the procedure, obtains consent</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>The surgical safety checklist</h3>
  <ul class="clean">
    <li><b>Sign-in</b> (before anesthesia): ID, site, consent, allergies, airway risk, blood availability.</li>
    <li><b>Time-out</b> (immediately before incision): <b>correct patient, correct procedure, correct site.</b> Everyone stops.</li>
    <li><b>Sign-out</b> (before leaving the room): counts correct, specimens labeled, equipment issues noted.</li>
  </ul>
  <div class="trap"><span class="tag">Distractor</span>Counts, anesthesia readiness, and team introductions are all real parts of the broader checklist. The <b>time-out</b> specifically is patient, procedure, site.</div>
  <div class="hy"><span class="tag">Incorrect count</span>A retained surgical item until proven otherwise. Notify the surgeon, recount, and image <b>before the patient leaves the room</b>.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🔥 Malignant hyperthermia</h3>
  <p class="why-chain">A susceptible patient gets a trigger → defective ryanodine receptors dump calcium out of the sarcoplasmic reticulum → uncontrolled muscle contraction → massive hypermetabolism → CO2 produced faster than ventilation clears it.</p>
  <ul class="clean">
    <li><b>Triggers:</b> succinylcholine and volatile inhalation anesthetics.</li>
    <li><b>Signs in order:</b> ↑ end-tidal CO2 → tachycardia → masseter and generalized rigidity → acidosis → hyperkalemia → <b>temperature spike last</b> → rhabdomyolysis and dark urine.</li>
    <li><b>Treatment:</b> STOP the trigger → <b>dantrolene</b> → 100% oxygen → cool the patient → correct acidosis and electrolytes → monitor for hyperkalemia and myoglobinuria.</li>
  </ul>
  <div class="mnem"><div class="tag">The whole trick</div><div class="big">The disease is named after its LAST sign.</div><div class="exp">If you picked the temperature, you picked the sign that appears after the patient is already in trouble.</div></div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>Other intraoperative risks</h3>
  <ul class="clean">
    <li><b>Fire triangle:</b> oxidizer (oxygen and nitrous oxide) + ignition source (electrosurgery, laser) + <b>fuel</b> (drapes, alcohol-based prep, gases). Let prep dry completely.</li>
    <li><b>Anaphylaxis:</b> sudden hypotension, bronchospasm, urticaria after a drug. Stop the agent, epinephrine, airway support.</li>
    <li><b>Positioning injuries:</b> nerve compression, pressure injury, and joint strain. Pad bony prominences and maintain alignment.</li>
    <li><b>Hypothermia:</b> cold room, exposed viscera, cold fluids. Raises infection risk and impairs coagulation. Use warming devices.</li>
    <li><b>Venous thromboembolism:</b> immobility on the table. SCDs on before induction.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — the temperature in MH</span>Malignant hyperthermia is <b>named after its last sign</b>. The earliest are <b>rising end-tidal CO₂ and tachycardia</b>. Picking the temperature means picking the sign that appears after the patient is already in trouble.</div>
  <div class="trap"><span class="tag">Trap 2 — treating the CO₂ instead of the disease</span>"Increase the ventilator rate" is supportive. <b>Stop the trigger and give dantrolene</b> is the treatment. The CO₂ is a readout, not the problem.</div>
  <div class="trap"><span class="tag">Trap 3 — the time-out contents</span>The time-out verifies <b>correct patient, procedure, and site</b>. Counts, anesthesia readiness, and team introductions are real parts of the broader checklist but are not the time-out.</div>
  <div class="trap"><span class="tag">Trap 4 — closing on an incorrect count</span>An incorrect count is a <b>retained surgical item until proven otherwise</b>. Notify the surgeon, recount, and image <b>before the patient leaves the room</b>.</div>
  <div class="trap"><span class="tag">Trap 5 — the circulating vs scrub role</span><b>Circulating is not sterile</b> — room coordination, positioning, counts, documentation, specimens. <b>Scrub is sterile</b> — the field and the instruments.</div>
  <div class="trap"><span class="tag">Trap 6 — the fire triangle</span>Fuel is <b>drapes, alcohol-based prep, and gases</b>, not friction or body heat. Let the prep dry completely before drawing.</div>
</div>

<div id="intraQuiz"></div>`;
SEC_POOLS['intraQuiz']={mapped:secMap(EXAM.filter(q=>q.topic==='intra')),cap:SECTION_QUIZ_SIZE,title:'Intraoperative practice',source:'Intraoperative'};
renderFilteredQuiz('intraQuiz', secSample(SEC_POOLS['intraQuiz'].mapped, SECTION_QUIZ_SIZE), 'Intraoperative practice', 'Intraoperative', SEC_POOLS['intraQuiz'].mapped.length);

</script>
<script>
document.getElementById('sec-case').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🧩</span> Unfolding Case: Mr. Egan</h2>
<p class="intro-line">The perioperative case study from your materials, worked all the way through. Case-based items are where he hides the "question inside the question" — one patient, and every phase asks something different.</p>

<div class="card" style="border-color:var(--purple)">
  <h3>The patient</h3>
  <p><b>John Egan, 53.</b> History of <b>type 1 diabetes</b>, <b>40 pack-year</b> smoking history, <b>CAD</b>, and <b>PVD</b>.</p>
  <p>Six weeks ago he developed a <b>left heel wound</b>, 4 cm × 2 cm. Despite IV antibiotics and chemical debridement it developed a <b>gangrenous infection</b>. He is scheduled for a <b>left BKA tomorrow at 10:00</b>.</p>
  <p><b>Medications:</b> daily insulin, <b>aspirin 325 mg/day</b>, <b>Pletal (cilostazol) 100 mg BID</b>. He has an <b>advance directive</b> and <b>NKDA</b>.</p>
  <div class="hy"><span class="tag">Read the history as a risk list</span>Every item in that paragraph is a testable risk. <b>T1DM</b> → poor healing, infection, glucose swings while NPO. <b>40 pack-years</b> → the single biggest respiratory complication risk. <b>CAD</b> → cardiac events under anesthesia. <b>PVD</b> → why the wound never healed and why the other leg is also at risk.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ Medication reconciliation — which orders concern you?</h3>
  <table class="lab">
    <tr><th>Order</th><th>Concern</th></tr>
    <tr><td><b>Insulin 6 u regular with 15 u NPH subcut q AM</b></td><td>He will be <b>NPO</b>. A full morning dose with no breakfast causes <b>hypoglycemia under anesthesia</b>, where the warning signs are masked. Clarify the perioperative insulin plan</td></tr>
    <tr><td><b>Aspirin 325 mg PO daily</b></td><td><b>Antiplatelet</b> — irreversibly inhibits platelets for their 7–10 day lifespan. Raises surgical bleeding risk. Should have been addressed days ago</td></tr>
    <tr><td><b>Cilostazol (Pletal) 100 mg PO BID</b></td><td>Also <b>antiplatelet</b> plus vasodilator, used for PVD claudication. <b>Second bleeding risk stacked on the first</b></td></tr>
    <tr><td><b>Lorazepam 0.5 mg IVP on call to OR</b></td><td>Reasonable as a preop anxiolytic — but once given, <b>the side rails go up and he does not get out of bed</b>. Consent must be signed <b>before</b> sedation</td></tr>
  </table>
  <div class="trap"><span class="tag">The question inside the question</span>"Which order causes concern?" is really <b>which order will harm THIS patient given what I just told you about him.</b> Two antiplatelets before surgery and a full insulin dose in an NPO diabetic. The lorazepam is fine as a drug — the concern is <b>sequence</b>.</div>
</div>

<div class="card">
  <h3>Preoperative — what has to happen before he can go safely</h3>
  <ul class="clean">
    <li><b>Labs:</b> CBC, electrolytes, BUN/creatinine, glucose and A1C, coagulation studies, type and screen.</li>
    <li><b>Cardiac:</b> ECG and cardiac clearance given CAD. Chest x-ray given 40 pack-years.</li>
    <li><b>Baseline:</b> vital signs, oxygen saturation, <b>neurovascular checks of both legs</b>, weight, skin.</li>
    <li><b>NPO status</b> confirmed and the insulin plan clarified.</li>
    <li><b>Consent, site marking, and the advance directive</b> addressed.</li>
    <li><b>Teaching before sedation:</b> turn-cough-deep-breathe, incentive spirometer, splinting, leg exercises, pain plan, what he will wake up to.</li>
  </ul>
</div>

<div class="card">
  <h3>Informed consent — who does what</h3>
  <ul class="clean">
    <li><b>The surgeon</b> explains the procedure, risks, benefits, and alternatives. <b>Dr. Damon</b> obtains consent for the BKA; <b>Dr. Riley</b> discusses anesthesia.</li>
    <li><b>The nurse witnesses the signature and verifies understanding</b> — that he is voluntarily consenting, is not sedated, and can explain the procedure in his own words.</li>
    <li>He must consent to <b>the specific procedure and site</b> — left BKA — and separately to <b>anesthesia</b>.</li>
    <li>If he cannot explain what is being done, <b>stop and call the surgeon back</b>. Do not fill in the explanation yourself.</li>
    <li><b>Consent is revocable at any time</b>, right up to the incision.</li>
  </ul>
  <div class="trap"><span class="tag">Sequence trap</span>Consent <b>before</b> the lorazepam. A sedated patient cannot give informed consent, and a signature obtained after premedication is not valid.</div>
</div>

<div class="card">
  <h3>The advance directive</h3>
  <ul class="clean">
    <li>It documents <b>his wishes</b> for care if he cannot speak for himself, and may name a health care proxy.</li>
    <li><b>An advance directive is not automatically a DNR</b>, and a DNR is <b>not automatically suspended</b> in the OR.</li>
    <li>If he has resuscitation limits, they must be <b>reviewed and explicitly addressed before surgery</b> — required reconsideration. Anesthesia routinely does things that look like resuscitation.</li>
    <li>The decision is <b>documented</b> and communicated to the whole surgical team.</li>
  </ul>
  <div class="hy"><span class="tag">Why he asks this</span>Students assume the directive gets set aside for surgery. It does not. It gets <b>discussed and clarified</b>, and whatever is decided is written down and handed off.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>Latex allergy screening</h3>
  <p class="why-chain">Latex is everywhere in an OR — gloves, catheters, tourniquets, tubing, blood pressure cuffs. An unrecognized latex allergy can produce <b>intraoperative anaphylaxis</b> in a patient who cannot report symptoms.</p>
  <ul class="clean">
    <li><b>Ask about:</b> reactions to gloves, balloons, condoms, dental dams, rubber bands, adhesive tape, elastic in clothing.</li>
    <li><b>Cross-reactive foods:</b> <b>banana, avocado, kiwi, chestnut</b>, papaya, tomato, potato.</li>
    <li><b>Symptoms to ask about:</b> contact dermatitis, itching, hives, rhinitis, watery eyes, wheezing, swelling of lips or tongue.</li>
    <li>Also screen occupational exposure — health care and rubber industry workers have higher rates.</li>
    <li><b>NKDA does not mean no latex allergy.</b> Latex sensitivity is asked about separately.</li>
  </ul>
  <div class="trap"><span class="tag">⭐ Scheduling</span>A latex-allergic patient is scheduled <b>FIRST case of the day</b>, so airborne latex particles from prior cases have settled and cleared. He counts on you transferring the "infection isolation goes last" rule and getting it backwards.</div>
</div>

<div class="card">
  <h3>Handoff to the holding area — SBAR</h3>
  <table class="lab">
    <tr><td><b>S — Situation</b></td><td>John Egan, 53, here for a left BKA. Consent signed, site marked left lower extremity</td></tr>
    <tr><td><b>B — Background</b></td><td>Type 1 diabetes, 40 pack-year smoker, CAD, PVD. Six-week gangrenous left heel wound. Advance directive on chart, resuscitation status addressed. NKDA, latex screening negative</td></tr>
    <tr><td><b>A — Assessment</b></td><td>Current vitals, last glucose and time, NPO since when, insulin held, last aspirin and Pletal doses, pedal pulses, preop checklist complete, lorazepam given at what time</td></tr>
    <tr><td><b>R — Recommendation</b></td><td>Monitor glucose intraoperatively, watch for bleeding given dual antiplatelet therapy, confirm the advance directive plan with the team</td></tr>
  </table>
  <div class="hy"><span class="tag">What makes a handoff safe</span><b>Face to face, uninterrupted, with a chance to ask questions and read back.</b> A handoff that is one-directional is not a handoff.</div>
</div>

<div class="card">
  <h3>Final safety checks in the holding area</h3>
  <ul class="clean">
    <li><b>Two patient identifiers</b> — name and date of birth.</li>
    <li><b>Site marking by the surgeon</b>, visible after prep and draping, confirmed with the patient while awake.</li>
    <li><b>Consent verified</b> — correct procedure, correct side, signed and witnessed.</li>
    <li><b>The Time-Out</b> immediately before incision, with the whole team stopped: <b>correct patient, correct procedure, correct site</b>.</li>
    <li>Allergies, NPO status, antibiotic prophylaxis timing, implants and equipment available.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>Postoperative — the saturated dressing</h3>
  <p><i>Checking the surgical site, the nurse notices sanguineous drainage saturating the dressing. What now?</i></p>
  <ol class="chainlist">
    <li><b>1.</b> <b>Assess</b> — vital signs, the amount and rate of drainage, and mark the edge of the saturation with the time so change is measurable.</li>
    <li><b>2.</b> <b>Reinforce the dressing.</b> Do not remove the original — the first dressing is changed by the surgeon after an amputation.</li>
    <li><b>3.</b> <b>Apply pressure</b> and elevate the residual limb per order.</li>
    <li><b>4.</b> <b>Notify the surgeon</b> — this patient is on <b>two antiplatelet drugs</b>.</li>
    <li><b>5.</b> Keep a <b>tourniquet at the bedside</b> after an amputation in case of hemorrhage.</li>
    <li><b>6.</b> Monitor for hypovolemic shock: rising heart rate, falling BP, <b>restlessness</b>, cool clammy skin, falling urine output.</li>
  </ol>
  <div class="trap"><span class="tag">The trap here</span>"Remove the dressing to inspect the wound" and "document and recheck in an hour." Neither is right. <b>Reinforce, assess, notify.</b> And sanguineous drainage that is <b>saturating</b> is not the expected small amount.</div>
</div>

<div class="card">
  <h3>Complications to anticipate — read his history back</h3>
  <table class="lab">
    <tr><th>Risk factor</th><th>What it sets him up for</th></tr>
    <tr><td><b>40 pack-year smoker</b></td><td><b>Atelectasis, pneumonia,</b> retained secretions, delayed healing</td></tr>
    <tr><td><b>CAD</b></td><td>Myocardial ischemia or infarction, dysrhythmia</td></tr>
    <tr><td><b>Type 1 diabetes</b></td><td><b>Hypo- and hyperglycemia, poor wound healing, infection</b></td></tr>
    <tr><td><b>PVD</b></td><td>Poor perfusion to the residual limb, <b>risk to the remaining leg</b>, delayed healing</td></tr>
    <tr><td><b>Immobility + amputation</b></td><td><b>DVT and PE</b>, pressure injury, contractures</td></tr>
    <tr><td><b>General anesthesia</b></td><td>Airway compromise, hypoventilation, ileus, urinary retention</td></tr>
    <tr><td><b>Amputation specifically</b></td><td><b>Hemorrhage, phantom limb pain, contracture</b> (hip flexion), body image disturbance</td></tr>
  </table>
</div>

<div class="card">
  <h3>Preventing respiratory and DVT complications</h3>
  <table class="lab">
    <tr><th>Respiratory</th><th>DVT</th></tr>
    <tr><td><b>Turn, cough, deep breathe</b> every 1–2 hours \u00b7 <b>incentive spirometer</b> \u00b7 splint with a pillow \u00b7 <b>early ambulation</b> \u00b7 adequate pain control so he will actually do it \u00b7 hydration to thin secretions \u00b7 head of bed elevated</td><td><b>Leg exercises</b> to prevent venous stasis \u00b7 <b>out of bed to chair early and often</b> \u00b7 change position frequently on bed rest \u00b7 <b>exercises on the non-operative side: dorsiflex, rotate the ankle</b> \u00b7 SCDs \u00b7 prophylactic anticoagulation \u00b7 hydration</td></tr>
  </table>
  <div class="hy"><span class="tag">The connection he wants</span>Pain control is a <b>respiratory</b> intervention. He will not deep breathe, cough, or get out of bed if it hurts too much — and shallow breathing plus immobility is exactly how you get atelectasis and DVT. <b>Medicate first, then do the pulmonary hygiene.</b></div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on case studies</h3>
  <div class="trap"><span class="tag">Trap 1 — ignoring the history</span>The history paragraph is not scenery. Every complication question is answered from it. Smoker → respiratory. CAD → cardiac. Diabetic → glucose and healing.</div>
  <div class="trap"><span class="tag">Trap 2 — one drug at a time</span>Aspirin alone is a concern. Aspirin <b>plus Pletal</b> is two antiplatelets stacked. Read the med list as a whole, not line by line.</div>
  <div class="trap"><span class="tag">Trap 3 — consent after sedation</span>Order matters. Consent, then premedicate, then side rails up.</div>
  <div class="trap"><span class="tag">Trap 4 — latex scheduled last</span><b>First case of the day.</b> The opposite of infection isolation.</div>
  <div class="trap"><span class="tag">Trap 5 — NKDA read as no latex allergy</span>They are screened <b>separately</b>. Ask about bananas, avocado, kiwi, and chestnut.</div>
  <div class="trap"><span class="tag">Trap 6 — removing the first dressing</span>After an amputation the <b>surgeon</b> does the first change. Reinforce and notify.</div>
  <div class="trap"><span class="tag">Trap 7 — the advance directive assumed suspended</span>It is <b>reviewed and clarified</b> before surgery, not set aside.</div>
</div>

<div id="caseQuiz"></div>`;
SEC_POOLS['caseQuiz']={mapped:secMap(EXAM.filter(q=>q.topic==='pre'||q.topic==='intra'||q.topic==='post')),cap:SECTION_QUIZ_SIZE,title:'Perioperative case practice',source:'Case Study'};
renderFilteredQuiz('caseQuiz', secSample(SEC_POOLS['caseQuiz'].mapped, SECTION_QUIZ_SIZE), 'Perioperative case practice', 'Case Study', SEC_POOLS['caseQuiz'].mapped.length);

</script>
<script>
document.getElementById('sec-post').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🟣</span> Postoperative — PACU to Discharge</h2>
<p class="intro-line">Rank every finding by how fast it kills. That is what ABC actually means.</p>

<div class="card" style="border-color:var(--red)">
  <h3>PACU priorities in order</h3>
  <ul class="clean">
    <li><b>1. Airway</b> — patency first. Residual anesthetic relaxes the tongue against the posterior pharynx. Snoring with retractions is partial obstruction.</li>
    <li><b>2. Breathing</b> — rate, depth, oxygen saturation, breath sounds.</li>
    <li><b>3. Circulation</b> — BP, heart rate, rhythm, bleeding, perfusion.</li>
    <li><b>4.</b> Level of consciousness, temperature, pain, nausea, dressing, drains, and urine output.</li>
  </ul>
  <div class="why-chain">No airway → no gas exchange → arrest in minutes. Every other problem takes longer to kill the patient. That is why ABC is a ranking, not a slogan.</div>
</div>

<div class="card">
  <h3>Postoperative complications by system</h3>
  <table class="lab">
    <tr><th>Complication</th><th>Key signs</th><th>Prevention / action</th></tr>
    <tr><td><b>Atelectasis</b></td><td>Low SpO2, shallow breathing, diminished bases, low-grade fever in first 24-48 hr</td><td>Medicate for pain FIRST, then spirometry, deep breathing, splinted cough, ambulate</td></tr>
    <tr><td><b>Pneumonia</b></td><td>Fever after day 3, productive cough, crackles, infiltrate</td><td>Same pulmonary hygiene, oral care, head of bed elevated</td></tr>
    <tr><td><b>Hemorrhage / hypovolemic shock</b></td><td><b>↓BP with ↑HR</b>, cool clammy skin, ↓urine output, bright red drainage</td><td>Trend the vitals, apply pressure, notify surgeon, fluids and blood</td></tr>
    <tr><td><b>DVT</b></td><td>Unilateral calf pain, swelling, warmth</td><td>Early ambulation, ankle pumps, SCDs, antiembolism stockings, prophylactic anticoagulant</td></tr>
    <tr><td><b>Pulmonary embolism</b></td><td>Sudden dyspnea, chest pain, tachycardia, anxiety</td><td>Raise head of bed, oxygen, then notify and prepare for CT</td></tr>
    <tr><td><b>Paralytic ileus</b></td><td>Absent bowel sounds, distension, no flatus</td><td>Ambulate, NPO or NG decompression, alvimopan for opioid-induced</td></tr>
    <tr><td><b>Urinary retention</b></td><td>No void within 6-8 hr, distension, small frequent voids</td><td>Assist to normal position, privacy, bladder scan, then catheterize</td></tr>
    <tr><td><b>Surgical site infection</b></td><td>Purulent drainage, redness, warmth, fever after day 3</td><td>Aseptic dressing changes, glucose control, nutrition</td></tr>
    <tr><td><b>Dehiscence</b></td><td>Wound layers separate, "something gave way," often while coughing</td><td>Notify surgeon, NPO, splint incisions when coughing</td></tr>
    <tr><td><b>Evisceration</b></td><td>Viscera protrude through the incision</td><td><b>Saline-moistened sterile gauze, low-Fowler with knees flexed, NPO, call surgeon.</b> Never push organs back in.</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>Wound healing and dressing basics</h3>
  <ul class="clean">
    <li><b>Phases:</b> hemostasis → inflammatory → proliferative → maturation/remodeling.</li>
    <li><b>Intentions:</b> primary (clean edges approximated), secondary (left open, granulates in), tertiary (delayed closure after contamination clears).</li>
    <li><b>Drainage:</b> serous (clear), serosanguineous (pink, expected first 24 hr), sanguineous (bright red, active bleeding), purulent (infection).</li>
    <li><b>Wound classes:</b> clean, clean-contaminated (planned entry into GI/respiratory/GU, e.g. routine appendectomy), contaminated, dirty/infected.</li>
  </ul>
</div>

<div class="card">
  <h3>Pain management after surgery</h3>
  <ul class="clean">
    <li><b>Multimodal / ERAS:</b> pair opioids with acetaminophen and NSAIDs to lower the opioid dose and its risks.</li>
    <li><b>PCA:</b> <b>only the patient</b> presses the button. That is the built-in safety feature — an over-sedated patient cannot press it.</li>
    <li>Pain still 8 of 10 an hour after medication? <b>Evaluate and escalate</b> — call the provider with SBAR. Do not wait for rounds and do not adjust the dose yourself.</li>
    <li>Uncontrolled pain is not just a comfort issue: it blocks deep breathing and ambulation, which is what causes atelectasis and DVT.</li>
  </ul>
  <div class="hy"><span class="tag">Best breathing position</span><b>High-Fowler,</b> upright about 90 degrees. It drops the diaphragm and maximizes lung expansion.</div>
</div>

<div class="card">
  <h3>Delegation to UAP</h3>
  <ul class="clean">
    <li><b>Can delegate:</b> standard unchanging procedures on stable patients — vital signs, ambulation, hygiene, positioning, reapplying stockings, intake and output, feeding a patient on an established diet.</li>
    <li><b>Cannot delegate:</b> <b>assessment, teaching, evaluation, judgment,</b> or care of an unstable patient.</li>
  </ul>
  <div class="mnem"><div class="tag">Shortcut</div><div class="big">The verb tells you the answer.</div><div class="exp">Assess, teach, evaluate, plan → nurse. Assist, reapply, transport, measure → UAP.</div></div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>Caring for patients with advanced cancer</h3>
  <table class="lab">
    <tr><th>Problem</th><th>Detail</th></tr>
    <tr><td><b>Common symptoms</b></td><td><b>Pain, anorexia, weight loss, CACS</b> (cancer anorexia-cachexia syndrome), <b>fatigue</b></td></tr>
    <tr><td><b>Also expect</b></td><td><b>Depressive symptoms, skin breakdown, fluid and electrolyte imbalances, infection</b></td></tr>
    <tr><td><b>Pharmacologic support</b></td><td><b>Sedatives, tranquilizers, muscle relaxants, antiemetics</b> alongside analgesics</td></tr>
    <tr><td><b>Procedural symptom relief</b></td><td><b>Radiation therapy or surgical intervention</b> for symptom relief · <b>percutaneous nerve block</b> · <b>cordotomy</b> for intractable pain</td></tr>
  </table>
  <div class="hy"><span class="tag">Pain management priorities</span><b>Emphasis on prevention and management of pain</b> using <b>long-acting analgesic agents</b> scheduled around the clock, with breakthrough doses on top. Prevention beats chasing pain that has already escalated.</div>
  <ul class="clean">
    <li><b>Prevent complications</b> from altered sensation, immobility, and changes in bowel and bladder function.</li>
    <li><b>Promote comfort and realistic goals</b> with the patient and family.</li>
    <li>Teach <b>energy conservation methods</b>.</li>
    <li><b>Provide control and independence with support</b> — the patient decides what matters as long as they are able.</li>
  </ul>
  <div class="hy"><span class="tag">CACS</span>Cancer anorexia-cachexia syndrome is <b>not simple starvation</b> — it is a metabolic syndrome driven by the tumor, so feeding alone does not reverse it. That is why forcing intake at end of life does not help.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — four real problems, one priority</span>He gives four postop patients who all have something wrong. Rank by <b>how fast each one kills</b>, not by how abnormal it looks. <b>Restlessness with a low saturation beats pain of 7, a low-grade temp, and expected drainage.</b></div>
  <div class="trap"><span class="tag">Trap 2 — restlessness read as anxiety</span>It is the <b>earliest sign of hypoxia</b>. Sedating that patient is how you lose them. Cyanosis is late.</div>
  <div class="trap"><span class="tag">Trap 3 — withholding the opioid</span>A patient who will not cough because of pain, with an option to hold the opioid. <b>Pain is what is causing the atelectasis.</b> Medicate first, then do pulmonary hygiene.</div>
  <div class="trap"><span class="tag">Trap 4 — fever timing</span>First <b>24 to 48 hours = atelectasis</b>. Infection fevers arrive <b>after day 3</b>. He uses the timing to separate them.</div>
  <div class="trap"><span class="tag">Trap 5 — dehiscence vs evisceration</span>"Something gave way" while coughing with the fascia intact is <b>dehiscence</b>. <b>Evisceration adds protruding viscera.</b> The management overlaps, so the terminology is the whole question.</div>
  <div class="trap"><span class="tag">Trap 6 — pushing the bowel back in</span>Never. Cover with <b>saline-moistened sterile gauze, low-Fowler with knees flexed, NPO</b>, call the surgeon. Anything that raises intra-abdominal pressure makes it worse.</div>
  <div class="trap"><span class="tag">Trap 7 — the family pressing the PCA</span><b>Only the patient presses the button.</b> An over-sedated patient cannot press it — that is the entire safety feature.</div>
  <div class="trap"><span class="tag">Trap 8 — the delegation verb</span><b>Assess, teach, evaluate, plan → nurse.</b> Assist, reapply, transport, measure → UAP. The verb in the option tells you the answer.</div>
  <div class="trap"><span class="tag">Trap 9 — first action vs first finding</span>"First action" asks what you <b>do</b>, not what you find out. Pick the independent nursing action you can perform right now — raise the head of the bed and oxygenate before ordering the CT.</div>
  <div class="trap"><span class="tag">Trap 10 — expected findings offered as problems</span>Serosanguineous drainage in the first 24 hours, a BP at baseline, and mild pain relieved by repositioning are all <b>expected</b>. They are there to pull you away from the real one.</div>
</div>

<div id="postQuiz"></div>`;

document.getElementById('sec-eol').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">⚫</span> Palliative & End-of-Life Care</h2>
<p class="intro-line">Definitions matter here more than interventions. He tests the boundary between the terms.</p>

<div class="card" style="border-color:var(--teal)">
  <h3>⭐ Palliative vs. Hospice — side by side</h3>
  <table class="lab">
    <tr><th></th><th>Palliative Care</th><th>Hospice Care</th></tr>
    <tr><td><b>Purpose</b></td><td>Easing <b>pain and discomfort</b>, reducing stress, and helping people have the <b>highest quality of life possible</b></td><td>Quality of life <b>when a cure is no longer possible</b></td></tr>
    <tr><td><b>Who can receive it</b></td><td><b>Anyone living with a serious illness</b></td><td>If doctors think they have <b>fewer than six months to live</b></td></tr>
    <tr><td><b>Can I still get treatment for my illness?</b></td><td><b>Yes</b> — palliative care runs <b>alongside curative and therapeutic care</b></td><td><b>No curative treatment</b>, but medicine that enhances quality of life — such as treatment for high blood pressure or anxiety</td></tr>
    <tr><td><b>What does it include?</b></td><td>Pain and symptom management, care coordination, help developing the plan of care, help with insurance forms and options for care and housing, help with advance directives, spiritual care</td><td>Pain and symptom management, emotional support, medications and medical supplies, coaching for caregivers, grief support. <b>Short-term inpatient care</b> when symptoms are too difficult to manage at home or caregivers need <b>respite</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">The two-line version</div><div class="big">Palliative is defined by the GOAL. Hospice is defined by the PROGNOSIS.</div><div class="exp">Palliative can start at diagnosis and run alongside chemo. Hospice requires a prognosis under six months and stopping curative treatment.</div></div>
  <div class="trap"><span class="tag">The third thing people confuse in</span>A <b>DNR is neither.</b> It is an order about <b>resuscitation only</b> — every other treatment continues. A patient can be full code and on hospice, or DNR and receiving aggressive curative care.</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>Hospice — what it actually is</h3>
  <ul class="clean">
    <li>A <b>comprehensive interdisciplinary specialty program</b>.</li>
    <li><b>Focus on quality of life</b> and <b>palliation of symptoms</b>.</li>
    <li><b>Physical, psychosocial, and spiritual support</b> — all three, for patient and family.</li>
    <li><b>Coordination of specialty services</b> across <b>hospitals, home care programs, and the community</b>.</li>
    <li><b>Timely referral matters.</b> Late referral is the most common problem — patients get days of benefit from a program designed for months.</li>
    <li>Addresses <b>complex patient and family needs</b>, including bereavement follow-up after the death.</li>
  </ul>
</div>


<div class="card" style="border-color:var(--teal)">
  <h3>Palliative vs. Hospice vs. DNR</h3>
  <table class="lab">
    <tr><th></th><th>Palliative</th><th>Hospice</th><th>DNR</th></tr>
    <tr><td><b>Defined by</b></td><td>The goal — comfort and support</td><td>The prognosis — about 6 months or less</td><td>A single order about resuscitation</td></tr>
    <tr><td><b>When</b></td><td>Any stage, from diagnosis on</td><td>After curative treatment stops</td><td>Any time the patient chooses</td></tr>
    <tr><td><b>Curative treatment</b></td><td><b>Can continue alongside</b></td><td>Discontinued</td><td>Unaffected</td></tr>
    <tr><td><b>Other care</b></td><td>Full</td><td>Full comfort care</td><td><b>Everything except CPR continues</b></td></tr>
  </table>
  <div class="mnem"><div class="tag">One line</div><div class="big">All hospice care is palliative. Most palliative care is not hospice.</div></div>
</div>

<div class="card">
  <h3>Advance directives</h3>
  <ul class="clean">
    <li><b>Living will</b> — documents which treatments the patient would or would not want. States <b>preferences</b>, not orders.</li>
    <li><b>Durable power of attorney for healthcare</b> — names the person who decides if the patient cannot.</li>
    <li><b>POLST</b> — <b>provider-signed portable medical orders</b> that travel across care settings. This is what fills the gap a living will leaves.</li>
    <li>Any competent patient can revoke or change a directive at any time.</li>
  </ul>
</div>

<div class="card">
  <h3>Signs of approaching death and comfort care</h3>
  <ul class="clean">
    <li><b>Respiratory:</b> Cheyne-Stokes breathing, apneic periods, <b>death rattle</b> from pooled secretions.</li>
    <li><b>Circulatory:</b> cool mottled extremities, weak thready pulse, falling BP.</li>
    <li><b>Neurologic:</b> decreasing responsiveness, withdrawal. <b>Hearing is believed to be the last sense to go</b> — keep speaking to the patient.</li>
    <li><b>GI/GU:</b> decreased intake, decreased urine output, incontinence.</li>
    <li><b>Death rattle:</b> reposition laterally, reduce parenteral fluids, antimuscarinic if ordered. <b>Do not deep suction</b> — it is traumatic and increases secretions.</li>
    <li><b>Double effect:</b> opioids titrated to comfort relieve suffering and do not hasten death.</li>
  </ul>
</div>

<div class="card">
  <h3>Grief, hope, and communication</h3>
  <ul class="clean">
    <li><b>Kübler-Ross stages:</b> Denial, Anger, Bargaining, Depression, Acceptance. Nonlinear in real life.</li>
    <li><b>Anticipatory grief</b> begins before the death. <b>Complicated grief</b> is prolonged and disabling.</li>
    <li><b>FICA spiritual assessment:</b> Faith, Importance, Community, Address in care.</li>
    <li><b>Therapeutic responses</b> explore. They do not redirect, reassure falsely, or change the subject.</li>
    <li><b>Hope</b> is supported by pain control plus achievable short-term goals, not by promising a cure.</li>
    <li><b>Postmortem care:</b> confirm pronouncement, honor cultural and religious practices, position the body naturally, remove tubes per policy unless the case is a coroner's case, allow family time.</li>
  </ul>
</div>

<div class="card">
  <h3>Symptom management at end of life</h3>
  <table class="lab">
    <tr><th>Symptom</th><th>Management</th></tr>
    <tr><td><b>Pain</b></td><td><b>Around-the-clock</b> dosing with breakthrough doses. No ceiling on opioids titrated to comfort. <b>Double effect:</b> relieving suffering is the intent, and titrated doses do not hasten death</td></tr>
    <tr><td><b>Dyspnea</b></td><td><b>Low-dose opioids are first-line</b> — they blunt air hunger. Fan to the face, upright position, oxygen if it helps the patient (not the numbers)</td></tr>
    <tr><td><b>Death rattle</b></td><td>Reposition laterally, <b>reduce parenteral fluids</b>, antimuscarinic if ordered. <b>Do not deep suction</b> — traumatic and stimulates more secretion</td></tr>
    <tr><td><b>Restlessness / terminal delirium</b></td><td>Rule out reversible causes (pain, retention, constipation, hypoxia) first, then treat. Calm environment, familiar voices</td></tr>
    <tr><td><b>Nausea</b></td><td>Scheduled antiemetics; treat constipation and obstruction as causes</td></tr>
    <tr><td><b>Anorexia</b></td><td><b>Expected and normal</b> at end of life. Offer, do not force. Artificial nutrition does not extend life or comfort at this stage</td></tr>
    <tr><td><b>Dry mouth</b></td><td>Oral care every 1–2 hours, ice chips, lip balm, artificial saliva</td></tr>
  </table>
</div>

<div class="card">
  <h3>Communication and family support</h3>
  <ul class="clean">
    <li><b>Therapeutic responses explore.</b> They do not redirect, falsely reassure, or change the subject.</li>
    <li>Answer honestly at the level the patient asks. Do not volunteer more than they want, and do not withhold what they ask for.</li>
    <li>Silence and presence are interventions. So is sitting down.</li>
    <li><b>Hearing is believed to be the last sense to go</b> — keep speaking to the patient and tell the family to.</li>
    <li>Support the family's need to be present, and normalize what they are seeing as the body shuts down.</li>
    <li><b>Cultural and religious practices</b> around death vary widely. Ask rather than assume.</li>
    <li><b>Bereavement follow-up</b> is part of hospice care and continues after the death.</li>
  </ul>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>🎯 How he tricks you on this topic</h3>
  <div class="trap"><span class="tag">Trap 1 — palliative equated with hospice or DNR</span><b>Palliative is defined by the goal</b> and can run alongside curative treatment from diagnosis on. <b>Hospice is defined by prognosis</b> plus stopping curative therapy. <b>A DNR is an order about resuscitation only</b> — all other care continues.</div>

  <div class="trap"><span class="tag">Trap 3 — holding opioids to protect respirations</span>A rigid hold parameter on a scheduled opioid in a dying patient <b>undertreats suffering</b>. Tolerance to respiratory depression develops while tolerance to analgesia lags.</div>
  <div class="trap"><span class="tag">Trap 4 — deep suctioning the death rattle</span>It is traumatic and <b>increases</b> secretion. Reposition and reduce fluids instead.</div>
  <div class="trap"><span class="tag">Trap 5 — a living will treated as an order</span>A living will states <b>preferences</b>. <b>POLST</b> is the provider-signed portable <b>order set</b> staff can act on directly.</div>
  <div class="trap"><span class="tag">Trap 6 — forcing intake</span>Decreased appetite is <b>expected</b> as death approaches. Pushing food or fluids causes aspiration and discomfort without extending life.</div>
  <div class="trap"><span class="tag">Trap 7 — shutting down the family</span>When family asks to stop the morphine out of fear, the answer <b>explores the fear and teaches</b>. Flatly refusing, or halving the dose to appease them, both abandon the patient.</div>
</div>

<div id="eolQuiz"></div>`;

  const leftEl=matchSelectedLeft.el;
  if(matchSelectedLeft.pairIdx===pairIdx){
    leftEl.classList.remove('selected'); leftEl.classList.add('matched');
    el.classList.add('matched');
    drawMatchLine(leftEl, el);
    matchMatchedCount++;
    document.getElementById('matchCount').textContent=matchMatchedCount;
    matchSelectedLeft=null;
    if(matchMatchedCount===matchRoundPairs.length){ matchFinish(); }
  } else {
    leftEl.classList.add('shake'); el.classList.add('shake');
    setTimeout(()=>{
      leftEl.classList.remove('selected','shake'); el.classList.remove('shake');
    },500);
    matchSelectedLeft=null;
  }
}
function drawMatchLine(leftEl, rightEl){
  const svg=document.getElementById('matchSvg'), wrap=document.getElementById('matchWrap');
  if(!svg||!wrap)return;
  const wrapRect=wrap.getBoundingClientRect();
  const lr=leftEl.getBoundingClientRect(), rr=rightEl.getBoundingClientRect();
  const x1=lr.right-wrapRect.left, y1=lr.top-wrapRect.top+lr.height/2;
  const x2=rr.left-wrapRect.left, y2=rr.top-wrapRect.top+rr.height/2;
  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',x1); line.setAttribute('y1',y1); line.setAttribute('x2',x2); line.setAttribute('y2',y2);
  line.style.stroke='var(--green)'; line.style.strokeWidth='3'; line.style.strokeLinecap='round';
  svg.appendChild(line);
}
function matchFinish(){
  clearInterval(matchTimerInt);
  const elapsed=(Date.now()-matchStartTime)/1000;
  let isNewBest=false;
  if(!matchBestTime || elapsed<matchBestTime){ matchBestTime=elapsed; isNewBest=true; try{ localStorage.setItem(currentMatchGame.bestKey, elapsed.toFixed(2)); }catch(e){} }
  const prog=matchProgress[currentMatchGame.sectionId];
  const totalRounds=Math.ceil(currentMatchGame.pairs.length/ROUND_SIZE);
  prog.roundIdx++;
  saveMatchProgress();
  const cycleDone = prog.roundIdx>=totalRounds;
  document.getElementById('matchWin').innerHTML=`<div class="quiz-score">🎉 Matched all ${matchRoundPairs.length} pairs in ${elapsed.toFixed(1)}s!${isNewBest?' <br>🏆 New best round time!':''}
    <br><br>${cycleDone
      ? "✅ That's every pair in this deck! Nice — full cycle complete."
      : `Round ${prog.roundIdx} of ${totalRounds} done.`}
    <br><button class="btn" style="background:var(--green);margin-top:10px" onclick="startMatchGame('${currentMatchGame.sectionId}')">${cycleDone? '🔄 Start a New Cycle (reshuffled)' : '➡️ Next Round'}</button>
  </div>`;
}
document.getElementById('sec-medsmatch').innerHTML=`<p class="intro-line">Loading match game...</p>`;
document.getElementById('sec-priomatch').innerHTML=`<p class="intro-line">Loading match game...</p>`;

<h2 class="sec-title"><span class="sec-emoji">🎯</span> Trick Questions</h2>
<p class="intro-line">The specific traps he sets, with the reasoning that defuses each one. Read these the night before.</p>

<div class="card" style="border-color:var(--red)">
  <h3>1. The comfort order that is actually dangerous</h3>
  <p>A neutropenic patient spikes a fever and one of the orders is acetaminophen. Every instinct says give it.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Fever is the <b>only sign a neutropenic patient can still produce</b>. Blunting it hides deterioration. Cultures first, antibiotics within the hour.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>2. The disease named after its last sign</h3>
  <p>Malignant hyperthermia. The name says hyperthermia, so the temperature option looks obvious.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Temperature spike is <b>late</b>. Rising end-tidal CO2 and tachycardia come first, because hypermetabolism outruns ventilation before it outruns thermoregulation.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>3. The rule transferred from the wrong context</h3>
  <p>A latex-allergic patient is scheduled last, the way an infectious patient would be.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Latex-allergic patients go <b>first</b>, so airborne latex particles from earlier cases have cleared the room. He counts on you transferring the isolation rule.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>4. Absence of signs read as reassurance</h3>
  <p>"The IV site looks normal, no redness or drainage."</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Without neutrophils there is <b>no inflammation to see</b>. A clean-looking site in a neutropenic patient proves nothing at all.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>5. The kind-sounding option</h3>
  <p>"Reassure the patient that a new treatment may still cure them." Or "encourage her to stay positive."</p>
  <div class="trap"><span class="tag">Why it is wrong</span>False reassurance sets a goal that will fail, and redirecting shuts down communication. Therapeutic responses <b>explore</b>.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>6. Edema read as fluid overload</h3>
  <p>A swollen patient with ascites, a BP of 92/58, and a heart rate of 112.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Third spacing means fluid <b>left the vessel</b>. The patient is edematous outside and hypovolemic inside. Restricting fluid makes it worse.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>7. Treating the number instead of the disease</h3>
  <p>End-tidal CO2 is climbing, so increase the ventilator rate.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Hyperventilation is supportive. <b>Stopping the trigger and giving dantrolene</b> is the treatment. The CO2 is a readout, not the problem.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>8. Withholding the thing that fixes the mechanism</h3>
  <p>A postop patient with a respiratory rate of 26 and a SpO2 of 89% who refuses to cough because of pain. One option holds the opioid.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Pain is what is <b>blocking</b> the deep breathing that causes the atelectasis. Medicate first, then do pulmonary hygiene.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>9. "Already signed" read as binding</h3>
  <p>A patient signed consent yesterday and now says they do not want the surgery.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Consent is <b>revocable at any time</b>, up to the moment of incision. Stop and notify the surgeon.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>10. All four options are correct behaviors</h3>
  <p>Which statement shows understanding of secondary prevention? Every option is a good health behavior.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Only the <b>classification</b> separates them. Screening is secondary. Vaccination and cessation are primary. Recurrence monitoring is tertiary.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>11. The rate reaction mistaken for anaphylaxis</h3>
  <p>Flushing of the face and neck during a first vancomycin dose.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>Red man syndrome is <b>rate-related histamine release</b>, not an IgE allergy. Stop and restart slower. Epinephrine treats anaphylaxis, which includes airway involvement.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>12. Terminology that overlaps in management</h3>
  <p>"Something gave way" while coughing, wound edges separated, fascia intact, no viscera visible.</p>
  <div class="trap"><span class="tag">Why it is wrong</span>That is <b>dehiscence</b>. Evisceration requires protruding viscera. The nursing response overlaps, so the terminology is the whole question.</div>
</div>

<div id="tricksQuiz"></div>`;
