{topic:'meds',front:'Opioid-sparing \'A\' drug (ERAS)',back:'<b>Acetaminophen</b> — paired with opioids/NSAIDs to lower the opioid dose needed. Its OD antidote = acetylcysteine.'},
{topic:'post',front:'Preventable postoperative complications (the list)',back:'Pain, hemorrhage, hypovolemic shock, thrombophlebitis/DVT, pulmonary embolus, fluid overload, atelectasis, pneumonia, airway obstruction, surgical site infection (SSI).'},
{topic:'post',front:'Hypovolemic shock — key signs',back:'<b>↓BP + ↑HR</b> (e.g., 90/60, HR 120), cool/pale/clammy skin, ↓urine output. NOT warm/dry skin or bradycardia.'},
{topic:'post',front:'Atelectasis presentation',back:'Low SpO2, shallow respirations, <b>diminished breath sounds at the bases</b>. Fix: incentive spirometry, deep breathing, cough, ambulate.'},
{topic:'post',front:'Pain still 8/10 one hour after meds — do what?',back:'Evaluate + escalate: <b>notify the provider by phone (SBAR)</b>. Don\'t wait for rounds, don\'t change the dose yourself, don\'t just chart it.'},
{topic:'post',front:'DVT prevention bundle',back:'Early OOB, ankle pumps/dorsiflexion (non-op leg), TED hose + compression boots, prophylactic SC heparin BID. Avoid still bed rest.'},
{topic:'cancer',front:'Alopecia — best psychosocial help',back:'<b>Pre-plan</b> (wigs, scarves, support) before hair loss — gives control. Don\'t just say \'it\'s temporary.\''},
{topic:'cancer',front:'Oncology hand-off: see who first?',back:'<b>Chemo patient with new mental status changes</b> — acute change beats stable findings (neutropenic isolation, scheduled radiation, afebrile HR 108).'},
{topic:'aging',front:'Why older adults need smaller drug doses',back:'Decreased <b>liver (metabolism) and kidney (excretion)</b> function → drugs accumulate. Basis for \'start low, go slow.\''},
{topic:'aging',front:'Elder abuse most likely when…',back:'<b>Caregiver stress is overwhelming.</b> Nurses must assess strain, provide respite resources, and report suspected abuse.'},
{topic:'peri',front:'AORN safe hand-off communication',back:'<b>SBAR + read-back</b>, one speaker at a time, one patient, minimal distractions, documentation, questions. Tools: SURPASS checklist.'},
{topic:'peri',front:'Latex allergy — at-risk groups',back:'Spina bifida, multiple surgeries, urogenital/spinal cord issues, allergies/asthma, health care workers. S&S → up to circulatory collapse & death.'},
{topic:'peri',front:'Preop renal disease — which labs?',back:'<b>BUN, creatinine, electrolytes.</b> Kidneys clear drugs/anesthetics & balance fluids.'},
{topic:'aging',front:'Which pigment accumulates in aging cells?',back:'Lipofuscin. Aging also degrades elastin and collagen, and hematopoietic changes raise anemia rates.'},
{topic:'aging',front:'Cardiovascular changes of aging?',back:'Valve stenosis, fewer pacemaker cells, increased arterial resistance, calcium and fat deposits, myocardial hypertrophy affecting the left ventricle.'},
{topic:'aging',front:'Respiratory changes of aging?',back:'Calcification and weakening of chest wall muscles, decreased lung mass, INCREASED residual volume.'},
{topic:'aging',front:'Integumentary changes of aging?',back:'Decreased epidermal proliferation, thinner dermis, fewer elastic fibers, stiffer collagen, less subcutaneous fat. Impaired temperature regulation, more burns and infection.'},
{topic:'aging',front:'Female reproductive changes of aging?',back:'Thinning of the vaginal wall, decreased secretions, uterine atrophy.'},
{topic:'aging',front:'Male reproductive changes of aging?',back:'Less firm testes, decreased testosterone production.'},
{topic:'aging',front:'Is sexual activity expected to stop with age?',back:'No. It remains important. Decline usually relates to loss of a partner or health issues, not age.'},
{topic:'aging',front:'Which vitamin supports mental function in older adults?',back:'Vitamin B12. Deficiency can look like dementia.'},
{topic:'aging',front:'How does sensory stimulation help older adults?',back:'Colors, textures, tastes, and sounds enhance well-being. Assistive devices improve functional ability.'},
{topic:'aging',front:'GI changes of aging and the teaching?',back:'Gastric motility slows, so constipation and aspiration risk rise. Teach high fiber, adequate fluids, regular dental care.'},
{topic:'chronic',front:'Definition of chronic illness?',back:'3 months or more, no cure, management only. Episodic, continuous, or progressive.'},
{topic:'chronic',front:'Symptoms common across chronic conditions?',back:'Pain, fatigue, and sleep disturbances.'},
{topic:'chronic',front:'Correct disability language?',back:'A PERSON WITH A DISABILITY. Never a disabled person. Person-first.'},
{topic:'chronic',front:'Should the disability be the focus of care?',back:'No. Comprehensive assessment including a complete physical exam. Health promotion is neglected in this population.'},
{topic:'chronic',front:'Structural barriers to health care?',back:'Stairs, lack of ramps, narrow doorways, inaccessible restrooms.'},
{topic:'chronic',front:'Modifiable risk factors for chronic disease?',back:'Tobacco, second-hand smoke, low fruit and vegetable intake, high sodium, inactivity, excessive alcohol.'},
{topic:'chronic',front:'What fraction of Americans have multiple chronic conditions?',back:'One third. MCCs risk conflicting medical advice and preventable hospitalizations.'},
{topic:'chronic',front:'Common chronic conditions in male veterans?',back:'Hypertension, arthritis, COPD. Ages 65+ add coronary artery disease and cancer.'},
{topic:'chronic',front:'Common chronic conditions in female veterans?',back:'Arthritis, hypertension, asthma.'},
{topic:'chronic',front:'What comes before teaching a newly diagnosed patient?',back:'Assess the impact of the diagnosis on THIS patient, then tailor the education to their needs.'},
{topic:'chronic',front:'Healthy People 2030 goal?',back:'Promote health and well-being for all.'},
{topic:'aging',front:'What is the geriatric triad?',back:'Changes in cognitive status, falls, and incontinence. They cluster and feed each other.'},
{topic:'aging',front:'Name the geriatric syndromes',back:'Skin impairment, poor nutrition, falls, urinary incontinence, cognitive impairment, sleep disturbances.'},
{topic:'aging',front:'Why do geriatric syndromes need a multidisciplinary approach?',back:'They have multiple contributing causes across body systems. No single specialist or test covers them.'},
{topic:'aging',front:'What is the nursing emphasis for geriatric syndromes in the hospital?',back:'PREVENTION during hospitalization. The hospital itself is the risk: new drugs, immobility, unfamiliar setting, disrupted sleep.'},
{topic:'aging',front:'Is new incontinence a normal age change?',back:'No. It is a geriatric syndrome with multiple causes and it is preventable or treatable. Never accept it as inevitable.'},
{topic:'cancer',front:'Which three tissues does chemo damage most?',back:'Bone marrow, GI epithelium (mouth to anus), hair follicles. The fastest-dividing normal tissues.'},
{topic:'cancer',front:'What is myelosuppression?',back:'Marrow suppression. Low RBC = anemia, low WBC = infection risk, low platelets = bleeding risk.'},
{topic:'cancer',front:'When is the nadir?',back:'7 to 14 days after a chemo dose. Lowest counts, highest infection and bleeding risk.'},
{topic:'cancer',front:'ANC formula and the danger threshold?',back:'ANC = WBC x (% segs + % bands) / 100. Under 500 = severe neutropenia. Temp 100.4F is then an emergency.'},
{topic:'cancer',front:'Mucositis mouth care?',back:'Soft brush or foam swab, saline or sodium bicarbonate rinses q2-4h. NO lemon-glycerin swabs, NO alcohol mouthwash.'},
{topic:'cancer',front:'When are antiemetics given for chemo?',back:'SCHEDULED BEFORE the infusion. Anticipatory nausea is learned and hard to reverse once established.'},
{topic:'cancer',front:'Extravasation of a vesicant — first action?',back:'STOP the infusion but LEAVE the catheter in place, aspirate residual drug, notify the provider. Do not flush or pull the line.'},
{topic:'cancer',front:'External beam vs brachytherapy precautions?',back:'External beam: patient is NOT radioactive, no restrictions. Brachytherapy: patient IS a source — time, distance, shielding, no pregnant staff or children.'},
{topic:'cancer',front:'When to plan a wig?',back:'BEFORE hair falls out, while color and texture can be matched. Alopecia starts about 2 weeks in and is reversible.'},
{topic:'cancer',front:'Cancer-related fatigue — what helps?',back:'It is NOT relieved by sleep. Energy conservation plus light activity. Complete rest makes it worse.'},
{topic:'eol',front:'First-line for dyspnea at end of life?',back:'Low-dose opioids. They blunt air hunger. Oxygen if it helps the patient, not the numbers.'},
{topic:'eol',front:'Is decreased appetite normal when dying?',back:'Yes, expected. Offer without forcing. Artificial nutrition does not extend life or add comfort at this stage.'},
{topic:'cancer',front:'SVCS — clinical manifestations?',back:'Dyspnea, cough, facial swelling. Plus periorbital and upper extremity edema, distended neck veins.'},
{topic:'cancer',front:'SVCS — diagnostics and treatment?',back:'Chest x-ray and thoracic CT. Radiation, chemotherapy, anticoagulant therapy.'},
{topic:'cancer',front:'SVCS — key nursing action?',back:'Monitor cardiopulmonary status and AVOID UPPER EXTREMITY VENIPUNCTURE. Raise the head of the bed, never flat.'},
{topic:'cancer',front:'Spinal cord compression — earliest sign?',back:'Back or neck pain. Then motor loss, then bladder dysfunction. MRI is the study of choice.'},
{topic:'cancer',front:'Spinal cord compression — treatment?',back:'Radiation therapy, surgery, vertebral augmentation, plus steroids for cord edema. Nursing: control pain, prevent immobility complications.'},
{topic:'cancer',front:'Hypercalcemia of malignancy — signs and threshold?',back:'Fatigue, weakness, confusion. Serum calcium above 10.4 mg/dL. High calcium slows things down.'},
{topic:'cancer',front:'Hypercalcemia of malignancy — treatment order?',back:'Hydration with isotonic saline FIRST, then a bisphosphonate. Monitor mental status and fluid balance.'},
{topic:'cancer',front:'What causes tumor lysis syndrome?',back:'The byproducts of breaking down the cancer. Appears 24-72 hours AFTER chemo starts. A treatment complication, not a tumor one.'},
{topic:'cancer',front:'TLS — clinical manifestations?',back:'Fatigue, muscle cramps, arrhythmias. Diagnosed by electrolyte imbalances and ECG changes.'},
{topic:'cancer',front:'TLS lab pattern?',back:'THREE UP, ONE DOWN. High potassium, high phosphate, high uric acid, LOW CALCIUM. Phosphate binds the calcium.'},
{topic:'cancer',front:'TLS — treatment?',back:'Fluid hydration, diuresis, allopurinol. Rasburicase for high uric acid. Prevention is hydration plus allopurinol before chemo.'},
{topic:'cancer',front:'Which two oncologic emergencies have OPPOSITE calcium directions?',back:'Hypercalcemia of malignancy (calcium UP) vs tumor lysis syndrome (calcium DOWN). Both will be on the exam.'},
{topic:'resp',front:'Suctioning — how long per pass?',back:'No more than 10 to 15 seconds. Hyperoxygenate before and after. Suction only on withdrawal.'},
{topic:'resp',front:'Why is high-flow oxygen risky in some COPD patients?',back:'Chronic CO2 retainers can lose their hypoxic drive. Target SpO2 88 to 92 percent with controlled delivery.'},
{topic:'resp',front:'Underlying problem in emphysema?',back:'Irreversible destruction of alveolar walls, losing surface area and elastic recoil.'},
{topic:'resp',front:'How long can a decongestant nasal spray be used?',back:'No more than 3 days. Beyond that causes rebound congestion (rhinitis medicamentosa).'},
{topic:'resp',front:'How does pneumonia present in an older adult?',back:'Confusion and functional decline, often WITHOUT fever. Mental status change is the presentation.'},
{topic:'resp',front:'Strep pharyngitis features?',back:'Sudden sore throat, fever, tonsillar exudate, tender nodes, and NO cough. Full antibiotic course prevents rheumatic fever.'},
{topic:'resp',front:'Oxygen delivery — nasal cannula range?',back:'1 to 6 L/min, roughly 24 to 44 percent FiO2.'},
{topic:'resp',front:'Best position for a dyspneic patient?',back:'High-Fowler, upright. Tripod position for COPD.'},
{topic:'resp',front:'Rifampin key teaching?',back:'Turns urine, sweat, and tears orange. Harmless and expected. It also reduces oral contraceptive effectiveness.'},
{topic:'resp',front:'Physical hallmark of chronic COPD?',back:'Barrel chest with prolonged expiration. Also pursed-lip breathing and the tripod position.'},
{topic:'resp',front:'Chest drainage system falls over or disconnects?',back:'Submerge the tube end in sterile water or saline to restore the seal, then get a new system.'},
{topic:'resp',front:'What is the earliest sign of hypoxia?',back:'Restlessness, anxiety, and confusion. Cyanosis is a LATE sign.'},
{topic:'resp',front:'Non-rebreather delivers what?',back:'Up to about 95 percent FiO2 at 10 to 15 L/min. The reservoir bag must stay inflated.'},
{topic:'resp',front:'Crackles mean what?',back:'Fluid or secretions in the small airways and alveoli. Heard in pneumonia, heart failure, pulmonary edema.'},
{topic:'resp',front:'Key aspiration prevention for a dysphagia patient?',back:'Head of bed 30 to 45 degrees, swallow evaluation, thickened liquids, chin-tuck, no straws.'},
{topic:'resp',front:'Position for an active nosebleed?',back:'Sit upright and lean FORWARD. Pinch the soft part of the nose 5-10 minutes. Never tilt the head back.'},
{topic:'resp',front:'Wheezes mean what?',back:'Narrowed airways. Asthma, COPD, bronchospasm.'},
{topic:'resp',front:'TB precautions?',back:'Airborne. Negative-pressure room, N95 respirator for staff, surgical mask on the patient if transported.'},
{topic:'resp',front:'Life change after total laryngectomy?',back:'Permanent neck stoma. The nose no longer humidifies air. Protect the stoma from water. They can never swim.'},
{topic:'resp',front:'Earliest sign of post-tonsillectomy hemorrhage?',back:'Frequent swallowing. Blood is trickling down the throat. Also restlessness and tachycardia.'},
{topic:'resp',front:'Isoniazid key teaching?',back:'Give vitamin B6 (pyridoxine) to prevent peripheral neuropathy. Watch for hepatotoxicity, avoid alcohol.'},
{topic:'resp',front:'When do you clamp a chest tube?',back:'Almost never. Only briefly to change the system or to check for an air leak, on order. Clamping can cause a tension pneumothorax.'},
{topic:'resp',front:'How is a Mantoux read?',back:'Measure INDURATION, not redness, at 48 to 72 hours. A positive test means exposure, not active disease.'},
{topic:'resp',front:'Ventilated patient suddenly desaturates — first action?',back:'Assess the patient and the airway and tubing. Do not silence the alarm and document.'},
{topic:'resp',front:'Stridor means what?',back:'Upper airway obstruction. This is an emergency.'},
{topic:'resp',front:'Criteria for acute respiratory failure?',back:'PaO2 below 60 and/or PaCO2 above 50 with a pH below 7.35.'},
{topic:'resp',front:'Aspiration pneumonia most often affects which lung?',back:'The right lung, because the right main bronchus is wider and more vertical.'},
{topic:'resp',front:'Chest tube accidentally pulled out — what do you do?',back:'Cover the site with sterile occlusive gauze taped on THREE sides, creating a flutter valve. Notify the provider.'},
{topic:'resp',front:'What does RIPE stand for?',back:'Rifampin, Isoniazid, Pyrazinamide, Ethambutol.'},
{topic:'resp',front:'Tracheostomy emergency equipment at the bedside?',back:'Obturator, a spare trach of the same size, a size smaller, and suction equipment.'},

let drillList=[], drillIdx=0, drillScore=0, drillStreak=0, drillBest=0, drillAnswered=false;
const DRILL_ROUND=20;
function startDrill(){
  const pool = hotOnlyGlobal ? DRILL_POOL.filter(q=>['aging','cancer','post','intra'].includes(q.topic)) : DRILL_POOL;
  drillList=shuffle(pool.slice()).slice(0,Math.min(DRILL_ROUND,pool.length));
  drillIdx=0; drillScore=0; drillStreak=0; drillAnswered=false;
  renderDrillQ();
}
function renderDrillQ(){
  const host=document.getElementById('drillBody');
  if(drillIdx>=drillList.length){ return drillFinish(); }
  const qRaw=drillList[drillIdx];
  let q=qRaw;
  if(shuffleAnswers){
    const order=shuffle(qRaw.o.map((_,i)=>i));
    q={...qRaw, o:order.map(i=>qRaw.o[i]), c:order.indexOf(qRaw.c)};
  }
  drillList[drillIdx]=q;
  drillAnswered=false;
  let opts=q.o.map((o,i)=>`<button class="opt" onclick="answerDrill(${i})">${o}</button>`).join('');
  host.innerHTML=`
    <div class="drill-top"><span>Q ${drillIdx+1} / ${drillList.length}</span><span>✅ ${drillScore} 🔥 ${drillStreak}</span></div>
    <div class="drill-bar"><div class="drill-bar-fill" style="width:${(drillIdx/drillList.length)*100}%"></div></div>
    <div class="quiz-card"><div class="q-text">${q.q}</div><div class="opts" id="drillOpts">${opts}</div><div class="rationale" id="drillRat"></div></div>
    <div class="center"><button class="btn ghost" id="drillNextBtn" style="display:none" onclick="nextDrill()">Next ➡️</button></div>`;
}
function answerDrill(i){
  if(drillAnswered)return; drillAnswered=true;
  const q=drillList[drillIdx];
  document.querySelectorAll('#drillOpts .opt').forEach((b,idx)=>{
    b.classList.add('disabled');
    if(idx===q.c)b.classList.add('correct');
    if(idx===i&&i!==q.c)b.classList.add('wrong');
  });
  const rat=document.getElementById('drillRat');
  if(i===q.c){drillScore++;drillStreak++;if(drillStreak>drillBest)drillBest=drillStreak;rat.innerHTML='✅ <b>Correct!</b> '+q.r;}
  else{drillStreak=0;rat.innerHTML='❌ <b>Not quite.</b> '+q.r;}
  rat.classList.add('show'); bumpProgress('drill-'+drillIdx);
  document.getElementById('drillNextBtn').style.display='inline-block';
}
function nextDrill(){ drillIdx++; renderDrillQ(); }
function drillFinish(){
  const pct=Math.round(drillScore/drillList.length*100);
  let msg=pct>=90?'🌟 Outstanding!':pct>=75?'💪 Test-ready zone!':pct>=60?'📈 Getting there — run it again.':'🌱 Keep drilling.';
  document.getElementById('drillBody').innerHTML=`
    <div class="card center" style="border-color:var(--teal)">
      <h2 style="margin-top:0">Round Complete!</h2>
      <div class="drill-final">${drillScore} / ${drillList.length} (${pct}%)</div>
      <p>Best streak: 🔥 ${drillBest}</p><p>${msg}</p>
      <button class="btn" onclick="startDrill()" style="background:linear-gradient(90deg,var(--teal),var(--green))">🔀 New Shuffled Round</button>
    </div>`;
}
document.getElementById('sec-drill').innerHTML=`

  <div id="drillBody"></div>`;
startDrill();

    examTopics.push(id);

}
function setAllTopics(){ examTopics=[]; savePicker(); renderPicker(); }

function startPickedSet(){

  toast('New set: '+quizSet.length+' questions');
}
function getExamQ(qi){
  const base=EXAM[qi];
  if(base.t==='match'){
    if(!examShuffleMap[qi]){
      const order=shuffleAnswers?shuffle(base.items.map((_,i)=>i)):base.items.map((_,i)=>i);
      examShuffleMap[qi]=order;
    }
    const defOrder=examShuffleMap[qi];
    const defs=defOrder.map(i=>base.items[i].def);
    return {q:base.q, r:base.r, t:'match', items:base.items, defs, defOrder};
  }
  if(base.t==='order'){
    if(!examShuffleMap[qi]){
      const order=shuffleAnswers?shuffle(base.steps.map((_,i)=>i)):base.steps.map((_,i)=>i);
      examShuffleMap[qi]=order;
    }
    const order=examShuffleMap[qi];
    const steps=order.map(i=>base.steps[i]);
    return {q:base.q, r:base.r, t:'order', steps, displayOrder:order};
  }
  if(!examShuffleMap[qi]){
    const order=shuffleAnswers?shuffle(base.o.map((_,i)=>i)):base.o.map((_,i)=>i);
    examShuffleMap[qi]=order;
  }
  const order=examShuffleMap[qi];
  const opts=relabel(order.map(i=>base.o[i]));
  let correct;
  if(base.t==='multi'){
    const cset=new Set(base.c);
    correct=order.map((origIdx,newIdx)=>cset.has(origIdx)?newIdx:null).filter(x=>x!==null);
  } else {
    correct=order.indexOf(base.c);
  }
  return {q:base.q, r:base.r, t:base.t, o:opts, c:correct};
}
function saveExam(){ try{ localStorage.setItem('nur256u1_exam', JSON.stringify({mode:examMode,set:quizSet,state:examState,checked:examChecked,idx:examIdx,submitted:examSubmitted,shuffle:examShuffleMap})); }catch(e){} }
function loadExam(){ try{ const r=localStorage.getItem('nur256u1_exam'); return r?JSON.parse(r):null; }catch(e){ return null; } }
function clearExamSave(){ try{ localStorage.removeItem('nur256u1_exam'); }catch(e){} }
function shuffleArr(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);}
function renderExam(){
  const c=document.getElementById('sec-exam');

function buildQuizSet(m){

function setExamMode(m){

function drawExamQ(){
  if(!quizSet.length)buildQuizSet(examMode);
  const qi=quizSet[examIdx]; const q=getExamQ(qi);
  const body=document.getElementById('examBody');
  if(q.t==='match'){ drawExamMatchQ(qi,q,body); drawDots(); return; }
  if(q.t==='order'){ drawExamOrderQ(qi,q,body); drawDots(); return; }
  const typeLabel=q.t==='multi'?'Select All That Apply':'Multiple Choice';
  const checked = examMode==='study' && examChecked[qi];
  let html=`<div class="exam-q"><div><span class="qnum">QUESTION ${examIdx+1} of ${quizSet.length}</span><span class="qtype">${typeLabel}</span></div><div class="qtext">${q.q}</div>`;
  q.o.forEach((opt,i)=>{
    const letter=String.fromCharCode(65+i);
    let cls='opt'; const cur=examState[qi];
    const isSel = q.t==='multi' ? (cur&&cur.includes(i)) : (cur===i);
    if(isSel)cls+=' sel-multi';
    if(checked){ const isCorrectOpt = q.t==='multi'?q.c.includes(i):q.c===i; if(isCorrectOpt)cls+=' correct'; else if(isSel)cls+=' wrong'; }
    html+=`<button class="${cls}" ${checked?'disabled':''} onclick="examPick(${i})">${opt}</button>`;
  });
  html+=`</div>`;
  if(examMode==='study'){
    if(q.t==='multi' && !checked){ html+=`<div class="center"><button class="btn" onclick="checkExamQ()" style="background:linear-gradient(90deg,var(--teal),var(--green))">✓ Check Answer</button></div>`; }
    if(checked){
      const ans=examState[qi]; const isCorrect = q.t==='multi'?arrEq(ans,q.c):ans===q.c;
      const correctTxt = q.t==='multi'?q.c.map(x=>String.fromCharCode(65+x)).sort().join(', '):String.fromCharCode(65+q.c);
      html+=`<div class="rationale show" style="border-color:${isCorrect?'var(--green)':'var(--red)'}">${isCorrect?'✅ <b>Correct!</b>':'❌ <b>Not quite.</b> Correct: <b>'+correctTxt+'</b>'}<br><b>Rationale:</b> ${q.r}</div>`;
    }
  }
  body.innerHTML=html; drawDots();
}
function drawExamMatchQ(qi,q,body){
  const checked = examMode==='study' && examChecked[qi];
  const cur = examState[qi] || [];
  let html=`<div class="exam-q"><div><span class="qnum">QUESTION ${examIdx+1} of ${quizSet.length}</span><span class="qtype">Dropdown Match</span></div><div class="qtext">${q.q}</div>`;
  q.items.forEach((item,itemIdx)=>{
    const selectedPos = cur[itemIdx];
    let rowCls='dm-row';
    if(checked){
      const isCorrect = selectedPos!==undefined && q.defOrder[selectedPos]===itemIdx;
      rowCls += isCorrect ? ' dm-correct' : ' dm-wrong';
    }
    html+=`<div class="${rowCls}"><div class="dm-term">${item.term}</div><select class="dm-select" ${checked?'disabled':''} onchange="examMatchPick(${itemIdx}, this.value)">`;
    html+=`<option value="" ${selectedPos===undefined?'selected':''}>— choose a definition —</option>`;
    q.defs.forEach((d,pos)=>{ html+=`<option value="${pos}" ${selectedPos===pos?'selected':''}>${d}</option>`; });
    html+=`</select></div>`;
  });
  html+=`</div>`;
  if(examMode==='study'){
    const allAnswered = q.items.every((_,i)=>cur[i]!==undefined);
    if(!checked){ html+=`<div class="center"><button class="btn" onclick="checkExamMatch()" style="background:linear-gradient(90deg,var(--teal),var(--green))" ${allAnswered?'':'disabled'}>✓ Check Answers</button></div>`; }
    if(checked){
      const isCorrect = q.items.every((_,i)=>cur[i]!==undefined && q.defOrder[cur[i]]===i);
      html+=`<div class="rationale show" style="border-color:${isCorrect?'var(--green)':'var(--red)'}">${isCorrect?'✅ <b>All correct!</b>':'❌ <b>Some matches were off</b> — check the highlighted rows above.'}<br><b>Rationale:</b> ${q.r}</div>`;
    }
  }
  body.innerHTML=html;
}
function examMatchPick(itemIdx, val){
  const qi=quizSet[examIdx];

function checkExamMatch(){

function drawExamOrderQ(qi,q,body){
  const checked = examMode==='study' && examChecked[qi];
  const cur = examState[qi] || [];
  let html=`<div class="exam-q"><div><span class="qnum">QUESTION ${examIdx+1} of ${quizSet.length}</span><span class="qtype">Ordered Response (Drag &amp; Drop style)</span></div><div class="qtext">${q.q}</div>`;
  html+=`<p style="font-size:.82rem;color:var(--muted);margin:4px 0 10px">Tap each step below in the correct order — it will move into your answer list.</p>`;
  html+=`<div class="order-answer" id="orderAnswerList">`;
  cur.forEach((origIdx,pos)=>{
    let itemCls='order-answer-item';
    if(checked){ itemCls += origIdx===pos ? ' order-correct' : ' order-wrong'; }
    html+=`<div class="${itemCls}"><span class="num">${pos+1}</span><span>${q.steps[q.displayOrder.indexOf(origIdx)]}</span></div>`;
  });

    q.steps.forEach((step,displayPos)=>{
      const origIdx=q.displayOrder[displayPos];

    });
    html+=`</div>`;
    html+=`<div class="center" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">`;
    html+=`<button class="btn ghost" onclick="examOrderUndo()">↺ Undo Last</button>`;
    if(examMode==='study' && cur.length===q.steps.length){ html+=`<button class="btn" onclick="checkExamOrder()" style="background:linear-gradient(90deg,var(--teal),var(--green))">✓ Check Order</button>`; }
    html+=`</div>`;
  }
  html+=`</div>`;
  if(examMode==='study' && checked){
    const isCorrect = cur.length===q.steps.length && cur.every((v,i)=>v===i);
    html+=`<div class="rationale show" style="border-color:${isCorrect?'var(--green)':'var(--red)'}">${isCorrect?'✅ <b>Correct order!</b>':'❌ <b>Not quite the right order</b> — see highlighted steps above.'}<br><b>Rationale:</b> ${q.r}</div>`;
  }

function examOrderPick(origIdx){
  const qi=quizSet[examIdx];

function examOrderUndo(){

function checkExamOrder(){
  const qi=quizSet[examIdx];
  examChecked[qi]=true; bumpProgress('exam-'+qi); drawExamQ(); saveExam();
}
function isExamCorrect(q, ans){
  if(q.t==='multi') return arrEq(ans,q.c);
  if(q.t==='match') return q.items.every((_,i)=>ans && ans[i]!==undefined && q.defOrder[ans[i]]===i);
  if(q.t==='order') return ans && ans.length===q.steps.length && ans.every((v,i)=>v===i);
  return ans===q.c;
}
function isExamAnswered(qi){
  const ans=examState[qi];
  if(ans===undefined)return false;
  if(Array.isArray(ans))return ans.length>0 && !ans.includes(undefined);
  return true;
}
function drawDots(){
  const d=document.getElementById('examDots'); d.innerHTML='';
  quizSet.forEach((qi,pos)=>{
    const dot=document.createElement('div'); dot.className='dot';
    const answered = isExamAnswered(qi);

    if(pos===examIdx)dot.classList.add('current');
    dot.onclick=()=>{examIdx=pos;drawExamQ();saveExam();};
    d.appendChild(dot);
  });
}
function examPick(i){
  const qi=quizSet[examIdx]; const q=getExamQ(qi);
  if(examMode==='study' && examChecked[qi]) return;
  if(q.t==='multi'){
    if(!examState[qi])examState[qi]=[]; const arr=examState[qi]; const idx=arr.indexOf(i);
    if(idx>-1)arr.splice(idx,1); else arr.push(i); drawExamQ();
  } else { examState[qi]=i; if(examMode==='study'){ examChecked[qi]=true; bumpProgress('exam-'+qi); } drawExamQ(); }
  saveExam();
}
function checkExamQ(){
  const qi=quizSet[examIdx]; const ans=examState[qi];
  if(ans===undefined||(Array.isArray(ans)&&ans.length===0))return;
  examChecked[qi]=true; bumpProgress('exam-'+qi); drawExamQ(); saveExam();
}
function examNext(){ if(examIdx<quizSet.length-1){examIdx++;drawExamQ();saveExam();window.scrollTo({top:0,behavior:'smooth'});} }
function examPrev(){ if(examIdx>0){examIdx--;drawExamQ();saveExam();window.scrollTo({top:0,behavior:'smooth'});} }
function arrEq(a,b){if(!a||!b)return false;a=[...a].sort();b=[...b].sort();return a.length===b.length&&a.every((v,i)=>v===b[i]);}
function examAnswerSummary(q, ans){
  if(ans===undefined||(Array.isArray(ans)&&ans.length===0))return {your:'(no answer)', correct:'—'};
  if(q.t==='multi') return {your:ans.map(x=>String.fromCharCode(65+x)).sort().join(', '), correct:q.c.map(x=>String.fromCharCode(65+x)).sort().join(', ')};
  if(q.t==='match') return {your:q.items.map((it,i)=>it.term+'→'+(ans[i]!==undefined?q.defs[ans[i]]:'(blank)')).join('; '), correct:q.items.map(it=>it.term+'→'+it.def).join('; ')};
  if(q.t==='order'){
    const yourTxt = ans.map(origIdx=>q.steps[q.displayOrder.indexOf(origIdx)]).join(' → ');
    const correctTxt = q.steps.map((_,i)=>q.steps[q.displayOrder.indexOf(i)]).join(' → ');
    return {your:yourTxt, correct:correctTxt};
  }
  return {your:String.fromCharCode(65+ans), correct:String.fromCharCode(65+q.c)};
}
function submitExam(){
  let correct=0;
  quizSet.forEach(qi=>{ const q=getExamQ(qi); if(isExamCorrect(q, examState[qi]))correct++; });
  const total=quizSet.length; const pct=Math.round(correct/total*100);
  examSubmitted=true; saveExam();
  let msg = pct>=85?'🌟 Outstanding — exam-ready!':pct>=75?'✅ Passing! Polish the misses.':pct>=60?'💪 Getting there — review and retake.':'📚 Keep grinding — revisit the sections.';
  let html=`<div class="quiz-score">You scored ${correct} / ${total} (${pct}%)<br>${msg}</div><h3 style="color:var(--pink)">📖 Full Review</h3>`;
  quizSet.forEach((qi,pos)=>{
    const q=getExamQ(qi); const ans=examState[qi]; const isCorrect=isExamCorrect(q,ans);
    const sum=examAnswerSummary(q,ans);
    html+=`<div class="exam-q" style="border-color:${isCorrect?'var(--green)':'var(--red)'}"><div class="qnum">Q${pos+1} ${isCorrect?'✅':'❌'}</div><div class="qtext" style="font-size:.92rem">${q.q}</div><div style="font-size:.85rem"><b>Your answer:</b> ${sum.your} &nbsp;|&nbsp; <b>Correct:</b> ${sum.correct}</div><div class="rationale show" style="margin-top:8px"><b>Rationale:</b> ${q.r}</div></div>`;
  });
  html+=`<div class="center"><button class="btn" onclick="resetExam()">🔄 New Test (fresh 50)</button></div>`;
  document.getElementById('examResult').innerHTML=html;
  const _er=document.getElementById('examResult'); if(_er.scrollIntoView)_er.scrollIntoView({behavior:'smooth'});

function resetExam(){ examState={}; examIdx=0; examSubmitted=false; examChecked={}; examShuffleMap={}; document.getElementById('examResult').innerHTML=''; buildQuizSet(examMode); saveExam(); drawExamQ(); window.scrollTo({top:0,behavior:'smooth'}); }
renderExam();
updateProg();
updateHotToggleButtons();

<script>
/* ===== LISTEN MODE — hands-free audio study ===== */
(function(){
if(!('speechSynthesis' in window)) return;

let lsQueue=[], lsIdx=0, lsPlaying=false, lsRate=1, lsVoice=null, lsWake=null, lsUtter=null, lsAuto=true;
try{ lsRate=parseFloat(localStorage.getItem('listen_rate')||'1')||1; }catch(e){}
try{ lsAuto=localStorage.getItem('listen_auto')!=='0'; }catch(e){}

/* ---- turn a card into speakable prose ---- */
function speakable(el){
  const parts=[];
  const walk=(node)=>{
    if(node.nodeType===3){ const t=node.textContent.replace(/\s+/g,' '); if(t.trim()) parts.push(t); return; }
    if(node.nodeType!==1) return;
    const tag=node.tagName;
    if(tag==='BUTTON'||tag==='INPUT'||tag==='TEXTAREA'||tag==='SCRIPT'||tag==='STYLE') return;
    if(node.classList && node.classList.contains('listen-skip')) return;
    if(tag==='TABLE'){
      const rows=[...node.querySelectorAll('tr')];
      let heads=[];
      rows.forEach((r,ri)=>{
        const th=[...r.querySelectorAll('th')];
        if(th.length){ heads=th.map(c=>clean(c.textContent)); return; }
        const tds=[...r.querySelectorAll('td')].map(c=>clean(c.textContent));
        if(!tds.length) return;
        if(tds.length===1){ parts.push(tds[0]+'. '); return; }
        if(heads.length>=2 && tds.length===heads.length){
          parts.push(tds[0]+'. ');
          for(let i=1;i<tds.length;i++) if(tds[i]) parts.push(heads[i]+': '+tds[i]+'. ');
        } else {
          parts.push(tds[0]+'. ');
          for(let i=1;i<tds.length;i++) if(tds[i]) parts.push(tds[i]+'. ');
        }
      });
      parts.push(' ');
      return;
    }
    if(tag==='LI'){ [...node.childNodes].forEach(walk); parts.push('. '); return; }
    if(tag==='H2'||tag==='H3'||tag==='H4'||tag==='P'||tag==='DIV'){
      [...node.childNodes].forEach(walk); parts.push('. '); return;
    }
    [...node.childNodes].forEach(walk);
  };
  walk(el);
  return clean(parts.join(' '));
}
function clean(s){
  return s
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}]/gu,' ')
    .replace(/\u2192/g,' leads to ')
    .replace(/\u2191/g,' increased ').replace(/\u2193/g,' decreased ')
    .replace(/\u2265/g,' greater than or equal to ').replace(/\u2264/g,' less than or equal to ')
    .replace(/&gt;|>/g,' greater than ').replace(/&lt;|</g,' less than ')
    .replace(/\u00b7/g,'. ').replace(/\u2014|\u2013/g,', ')
    .replace(/(\s*\.){2,}/g,'.').replace(/\(\s+/g,'(').replace(/\s+\)/g,')')
    .replace(/\s+/g,' ')
    .replace(/\s+([.,;:])/g,'$1')
    .trim();
}

/* ---- build the playlist from the visible section ---- */
function buildQueue(){
  const sec=document.querySelector('.section.active') || document.querySelector('[id^="sec-"]:not([style*="none"])');
  if(!sec) return [];
  const out=[];
  const title=sec.querySelector('.sec-title');
  const intro=sec.querySelector('.intro-line');
  let opener='';
  if(title) opener+=clean(title.textContent)+'. ';
  if(intro) opener+=clean(intro.textContent);
  if(opener.trim()) out.push({el:title||sec, text:opener, label:'Introduction'});
  sec.querySelectorAll(':scope > .card, :scope > .tipbar, :scope > .hy, :scope > .mnem').forEach(c=>{
    const t=speakable(c);
    if(t && t.length>25){
      const h=c.querySelector('h3');
      out.push({el:c, text:t, label:h?clean(h.textContent).slice(0,44):'Note'});
    }
  });
  return out;
}

/* ---- speech ---- */
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  if(!vs.length) return null;
  let saved=null; try{ saved=localStorage.getItem('listen_voice'); }catch(e){}
  return vs.find(v=>v.name===saved)
      || vs.find(v=>/Samantha|Karen|Moira|Google US English|Microsoft Aria/i.test(v.name))
      || vs.find(v=>v.localService) || vs[0];
}
function chunk(text){
  const out=[]; let buf='';
  text.split(/(?<=[.!?])\s+/).forEach(s=>{
    if((buf+' '+s).length>190){ if(buf) out.push(buf.trim()); buf=s; } else buf+=' '+s;
  });
  if(buf.trim()) out.push(buf.trim());
  return out.length?out:[text];
}
function speakItem(i){
  speechSynthesis.cancel();
  if(i<0||i>=lsQueue.length){ stop(); return; }
  lsIdx=i;
  highlight();
  renderBar();
  const pieces=chunk(lsQueue[i].text);
  let p=0;
  const next=()=>{
    if(!lsPlaying) return;
    if(p>=pieces.length){
      if(lsAuto && lsIdx+1<lsQueue.length) return speakItem(lsIdx+1);
      stop(true); return;
    }
    const u=new SpeechSynthesisUtterance(pieces[p++]);
    try{ u.rate=lsRate; }catch(e){}
    try{ if(lsVoice) u.voice=lsVoice; }catch(e){ lsVoice=null; }
    u.onend=next;
    u.onerror=()=>{ if(lsPlaying) next(); };
    lsUtter=u;
    try{ speechSynthesis.speak(u); }catch(e){ next(); }
  };
  next();
}
function highlight(){
  document.querySelectorAll('.listen-now').forEach(e=>e.classList.remove('listen-now'));
  const el=lsQueue[lsIdx] && lsQueue[lsIdx].el;
  if(el){ el.classList.add('listen-now'); el.scrollIntoView({behavior:'smooth',block:'center'}); }
}
async function wakeOn(){
  try{ if('wakeLock' in navigator && !lsWake) lsWake=await navigator.wakeLock.request('screen'); }catch(e){}
}
function wakeOff(){ try{ if(lsWake){ lsWake.release(); lsWake=null; } }catch(e){} }

function start(){
  lsQueue=buildQueue();
  if(!lsQueue.length){ if(typeof toast==='function') toast('Nothing to read in this section'); return; }
  lsVoice=pickVoice();
  lsPlaying=true; wakeOn(); openBar(); speakItem(0);
}
function stop(finished){
  lsPlaying=false; speechSynthesis.cancel(); wakeOff();
  document.querySelectorAll('.listen-now').forEach(e=>e.classList.remove('listen-now'));
  if(finished && typeof toast==='function') toast('Section finished');
  renderBar();
}
function toggle(){
  if(!lsPlaying){
    if(!lsQueue.length) return start();
    lsPlaying=true; wakeOn(); speakItem(lsIdx);
  } else stop();
}
function jump(d){
  const n=lsIdx+d;
  if(n<0||n>=lsQueue.length) return;
  if(!lsPlaying){ lsPlaying=true; wakeOn(); }
  speakItem(n);
}
function setRate(r){
  lsRate=r; try{ localStorage.setItem('listen_rate',String(r)); }catch(e){}
  if(lsPlaying) speakItem(lsIdx); else renderBar();
}
function toggleAuto(){
  lsAuto=!lsAuto; try{ localStorage.setItem('listen_auto', lsAuto?'1':'0'); }catch(e){}
  renderBar();
}

/* ---- UI ---- */
function openBar(){
  if(document.getElementById('listenBar')) return renderBar();
  const bar=document.createElement('div');
  bar.id='listenBar';
  document.body.appendChild(bar);
  renderBar();
}
function closeBar(){ stop(); const b=document.getElementById('listenBar'); if(b) b.remove(); lsQueue=[]; lsIdx=0; }
function renderBar(){
  const bar=document.getElementById('listenBar'); if(!bar) return;
  const cur=lsQueue[lsIdx];
  bar.innerHTML=
    '<div class="lb-top"><span class="lb-lab">'+(cur?('<b>'+(lsIdx+1)+' of '+lsQueue.length+'</b> \u00b7 '+cur.label):'Ready')+'</span>'
    +'<button class="lb-x" onclick="listenClose()" aria-label="Close listen mode">\u2715</button></div>'
    +'<div class="lb-row">'
    +'<button class="lb-btn" onclick="listenJump(-1)" aria-label="Previous">\u23ee</button>'
    +'<button class="lb-btn lb-main" onclick="listenToggle()" aria-label="Play or pause">'+(lsPlaying?'\u23f8':'\u25b6')+'</button>'
    +'<button class="lb-btn" onclick="listenJump(1)" aria-label="Next">\u23ed</button>'
    +'<span class="lb-sp">'
      +[0.8,1,1.25,1.5].map(r=>'<button class="lb-rate'+(Math.abs(lsRate-r)<0.01?' on':'')+'" onclick="listenRate('+r+')">'+r+'\u00d7</button>').join('')
    +'</span>'
    +'<button class="lb-rate'+(lsAuto?' on':'')+'" onclick="listenAuto()" title="Continue to the next card automatically">Auto</button>'
    +'</div>';
}
window.listenStart=start; window.listenToggle=toggle; window.listenJump=jump;
window.listenRate=setRate; window.listenClose=closeBar; window.listenAuto=toggleAuto;

if(speechSynthesis.onvoiceschanged!==undefined)
  speechSynthesis.onvoiceschanged=()=>{ lsVoice=pickVoice(); };

/* stop cleanly when the section changes */
const origShow=window.showSection;
if(typeof origShow==='function'){
  window.showSection=function(id){ if(lsPlaying) stop(); origShow(id); };
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden && lsPlaying) speechSynthesis.pause(); else if(!document.hidden && lsPlaying) speechSynthesis.resume(); });
})();

</script>
