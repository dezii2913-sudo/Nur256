<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>NUR 256 — Unit 1 Study Lab</title>
<style>
:root{
  color-scheme: light;
  --bg:#f2efe6; --bg2:#fffdf8;
  --ink:#2a2118; --muted:#6f6153;
  --card:#fffdf8; --card-border:#e0d2bd;
  --pink:#b45309; --pink-soft:#fdf0dc;
  --purple:#9a3412; --purple-soft:#fceee4;
  --teal:#0f766e; --teal-soft:#d8f2ee;
  --green:#15803d; --green-soft:#dcf7e3;
  --red:#b91c1c; --red-soft:#fbe3e1;
  --amber:#a16207; --amber-soft:#faf0d2;
  --blue:#7c2d12; --blue-soft:#fbeade;
}
[data-theme="night"]{
  color-scheme: dark;
  --bg:#171310; --bg2:#1f1a15;
  --ink:#f5ede1; --muted:#b4a494;
  --card:#241d17; --card-border:#43362a;
  --pink:#f59e0b; --pink-soft:#332514;
  --purple:#fb923c; --purple-soft:#35241a;
  --teal:#2dd4bf; --teal-soft:#122b29;
  --green:#4ade80; --green-soft:#14301d;
  --red:#f87171; --red-soft:#331a1a;
  --amber:#fbbf24; --amber-soft:#332711;
  --blue:#fdba74; --blue-soft:#33241a;
}

html{background:var(--bg)}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  transition:background .3s,color .3s;padding-bottom:80px;
}
/* BIG TEXT mode */
body.mobile-mode{font-size:1.18rem;line-height:1.7}
body.mobile-mode .grid2,body.mobile-mode .grid3{grid-template-columns:1fr!important;gap:18px}
body.mobile-mode .content{padding:16px}
body.mobile-mode .card{padding:20px 18px;margin-bottom:18px}
body.mobile-mode .card h3{font-size:1.3rem;line-height:1.4}
body.mobile-mode .sec-title{font-size:1.55rem;line-height:1.35}
body.mobile-mode p,body.mobile-mode li,body.mobile-mode td,body.mobile-mode th{font-size:1.12rem;line-height:1.7}
body.mobile-mode .clean li{margin-bottom:12px}
body.mobile-mode .opt{font-size:1.12rem;padding:16px;min-height:54px;line-height:1.5}
body.mobile-mode .q-text{font-size:1.18rem;line-height:1.55}
body.mobile-mode .btn,body.mobile-mode .tbtn{font-size:1.1rem;padding:14px 18px}
body.mobile-mode .nav button{font-size:1.05rem;padding:12px 14px}
body.mobile-mode .rationale{font-size:1.08rem;line-height:1.6}
body.mobile-mode .mnem .big{font-size:1.15rem}
body.mobile-mode .hy{font-size:1.1rem;line-height:1.6;padding:16px}
body.mobile-mode table.lab{font-size:.9rem}
body.mobile-mode .lab td,body.mobile-mode .lab th{padding:9px 7px;font-size:.92rem!important}

/* TOP BAR */
.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(90deg,var(--pink),var(--purple));
  color:#fff;padding:12px 16px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex-wrap:wrap;
  box-shadow:0 2px 14px rgba(0,0,0,.18);
}
.topbar h1{font-size:1.2rem;margin:0;font-weight:800;letter-spacing:.3px}
.topbar .sub{font-size:.72rem;opacity:.9;font-weight:500;display:block}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{border:none;background:rgba(255,255,255,.25);color:#fff;padding:9px 14px;border-radius:30px;font-weight:700;font-size:.85rem;cursor:pointer;backdrop-filter:blur(4px)}
.tbtn:active{transform:scale(.95)}

.progwrap{padding:10px 16px;background:var(--bg2)}
.progbar-bg{background:var(--card-border);border-radius:20px;height:14px;overflow:hidden}
.progbar{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:20px;transition:width .5s}
.progtext{font-size:.72rem;color:var(--muted);text-align:center;margin-top:4px;font-weight:600}

/* NAV TABS */
.nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;-webkit-overflow-scrolling:touch;background:var(--bg)}
.nav button{flex:0 0 auto;border:2px solid var(--card-border);background:var(--card);color:var(--ink);padding:9px 15px;border-radius:30px;font-weight:700;font-size:.82rem;cursor:pointer;transition:.2s;white-space:nowrap}
.nav button.active{background:var(--purple);color:#fff;border-color:var(--purple);transform:scale(1.04)}

.content{max-width:920px;margin:0 auto;padding:18px;background:var(--bg)}
.section{display:none;animation:fade .4s;scroll-margin-top:12px}
.section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.sec-title{font-size:1.5rem;font-weight:800;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.sec-emoji{font-size:1.6rem}
.intro-line{color:var(--muted);margin:0 0 16px;font-size:.95rem}

.card{background:var(--card);border:2px solid var(--card-border);border-radius:16px;padding:16px 18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card h3{margin:0 0 10px;font-size:1.15rem}
.clean{list-style:none;padding:0;margin:8px 0}
.clean li{padding:6px 0 6px 22px;position:relative}
.clean li:before{content:"▸";position:absolute;left:0;color:var(--purple);font-weight:800}
.pill{display:inline-block;background:var(--purple-soft);color:var(--purple);padding:2px 10px;border-radius:20px;font-size:.7rem;font-weight:800;margin-left:6px}

.hy{background:var(--amber-soft);border-left:5px solid var(--amber);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.9rem}
.why-chain{background:var(--teal-soft);border-left:4px solid var(--teal);border-radius:10px;padding:12px 14px;margin:10px 0;line-height:1.7}
.mnem{background:var(--purple-soft);border-radius:12px;padding:10px 14px;margin:10px 0}
.mnem .tag{font-size:.68rem;font-weight:800;color:var(--purple);text-transform:uppercase;letter-spacing:.5px}
.mnem .big{font-size:1.05rem;font-weight:800;margin:3px 0}
.mnem .exp{font-size:.85rem;color:var(--muted)}
.profnote{background:var(--teal-soft);border-left:5px solid var(--teal);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.9rem}
.profnote .tag{font-size:.68rem;font-weight:800;color:var(--teal);text-transform:uppercase;letter-spacing:.5px}

table.lab{width:100%;border-collapse:collapse;margin:10px 0;font-size:.88rem;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(min-width:640px){table.lab{display:table}}
table.lab th{background:var(--purple);color:#fff;padding:8px;text-align:left;font-size:.8rem}
table.lab td{padding:8px;border-bottom:1px solid var(--card-border);min-width:80px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}

/* QUIZ */
.quiz-card{background:var(--card);border:2px solid var(--card-border);border-radius:14px;padding:16px;margin:12px 0}
.q-text{font-weight:700;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--card-border);background:var(--bg2);color:var(--ink);padding:11px 14px;border-radius:10px;cursor:pointer;font-size:.92rem;transition:.15s}
.opt:hover{border-color:var(--purple)}
.opt.correct{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.opt.sel-multi{border-color:var(--purple);background:var(--purple-soft)}
.opt.disabled{pointer-events:none;opacity:.85}
.rationale{margin-top:10px;padding:10px 12px;background:var(--blue-soft);border-radius:10px;font-size:.86rem;display:none}
.rationale.show{display:block}
.submit-multi{margin-top:8px;background:linear-gradient(90deg,var(--teal),var(--green));color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:800;cursor:pointer}
.center{text-align:center}
.btn{background:var(--purple);color:#fff;border:none;padding:11px 20px;border-radius:12px;font-weight:800;cursor:pointer;font-size:.95rem}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--card-border)}
.tipbar{background:var(--teal-soft);border-radius:12px;padding:10px 14px;font-size:.85rem;margin:10px 0}
.kbd{background:var(--card);border:1px solid var(--card-border);border-radius:6px;padding:1px 7px;font-weight:700;font-size:.8rem}
.quiz-score{font-size:1.15rem;font-weight:800;text-align:center;padding:16px;background:var(--purple-soft);border-radius:14px;margin:12px 0}

/* flash game */
.flash-progress{text-align:center;font-size:.85rem;color:var(--muted);margin-bottom:10px;font-weight:700}
.flash-card{background:var(--card);border:3px solid var(--purple);border-radius:20px;padding:34px 22px;min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.12rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow,0 4px 18px rgba(0,0,0,.12));transition:transform .15s,background .2s,border-color .2s}
.flash-card:active{transform:scale(.97)}
.flash-card.flipped{border-color:var(--teal);background:var(--teal-soft)}
.flash-label{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px;display:block}
.flash-btns{display:flex;gap:10px;margin-top:14px}
.flash-btn{flex:1;padding:14px;border-radius:14px;border:none;font-weight:800;cursor:pointer;font-size:.92rem}
.flash-btn.learning{background:var(--amber-soft);color:var(--amber);border:2px solid var(--amber)}
.flash-btn.gotit{background:var(--green-soft);color:var(--green);border:2px solid var(--green)}

/* wrong answer vault */
.vault-empty{text-align:center;padding:30px 16px;font-size:1rem}
.vault-tag{display:inline-block;background:var(--purple-soft);color:var(--purple);font-size:.72rem;font-weight:800;border-radius:20px;padding:2px 10px;margin-bottom:8px}
.vault-solved{background:var(--green-soft);border:2px solid var(--green);color:var(--green);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:.85rem;font-weight:700;text-align:center}

/* match game */
.match-stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-weight:800;font-size:.88rem;margin:10px 0;color:var(--ink)}
.match-wrap{position:relative}
.match-svg{display:block;position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.match-columns{display:flex;gap:10px;position:relative;z-index:2}
.match-col{flex:1 1 0;display:flex;flex-direction:column;gap:9px;min-width:0}
.match-item{width:100%;box-sizing:border-box;background:var(--card);border:2px solid var(--card-border);border-radius:12px;padding:11px 8px;font-size:.74rem;font-weight:700;cursor:pointer;text-align:left;transition:border-color .15s,background .15s,transform .1s;line-height:1.3;word-break:break-word;overflow-wrap:anywhere;white-space:normal}
.match-item:active{transform:scale(.98)}
.match-item.selected{border-color:var(--purple);background:var(--purple-soft)}
.match-item.matched{border-color:var(--green);background:var(--green-soft);color:var(--green);cursor:default;opacity:.75}
.match-item.shake{border-color:var(--red);background:var(--red-soft);animation:matchshake .35s}
@keyframes matchshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
body.mobile-mode .match-item{font-size:.95rem}
body.mobile-mode .match-stats{font-size:1rem}

/* exam: dropdown-match type */
.dm-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card);border:2px solid var(--card-border);border-radius:12px;margin-bottom:8px;flex-wrap:wrap}
.dm-term{font-weight:800;flex:1 1 140px;min-width:120px}
.dm-select{flex:1 1 200px;padding:9px;border-radius:10px;border:2px solid var(--card-border);background:var(--bg2);color:var(--ink);font-size:.85rem}
.dm-row.dm-correct{border-color:var(--green);background:var(--green-soft)}
.dm-row.dm-wrong{border-color:var(--red);background:var(--red-soft)}

/* exam: order/sequence type (NCLEX-style drag-and-drop, tap-to-sequence) */
.order-pool{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.order-chip{background:var(--card);border:2px solid var(--card-border);border-radius:12px;padding:11px 12px;font-size:.85rem;font-weight:700;cursor:pointer;text-align:left}
.order-chip:disabled{opacity:.35;cursor:default}
.order-answer{display:flex;flex-direction:column;gap:6px;margin:10px 0;min-height:40px;padding:8px;border:2px dashed var(--card-border);border-radius:12px}
.order-answer-item{display:flex;align-items:center;gap:8px;background:var(--purple-soft);border:2px solid var(--purple);border-radius:10px;padding:8px 10px;font-size:.82rem;font-weight:700}
.order-answer-item .num{background:var(--purple);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0}
.order-answer-item.order-correct{background:var(--green-soft);border-color:var(--green)}
.order-answer-item.order-wrong{background:var(--red-soft);border-color:var(--red)}

/* drill */
.drill-top{display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;margin-bottom:6px}
.drill-bar{height:8px;background:var(--card-border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.drill-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));transition:.3s}
.drill-final{font-size:1.6rem;font-weight:800;color:var(--purple);margin:10px 0}

/* exam */
.exam-mode-toggle{display:flex;gap:10px;margin:12px 0;justify-content:center}
.mode-btn{flex:1;max-width:220px;padding:12px 16px;border-radius:14px;border:2px solid var(--card-border);background:var(--card);color:var(--ink);font-weight:800;font-size:.95rem;cursor:pointer}
.mode-btn.active{background:linear-gradient(90deg,var(--purple),var(--pink));color:#fff;border-color:transparent}
.exam-q{background:var(--card);border:2px solid var(--card-border);border-radius:14px;padding:16px;margin:10px 0}
.qnum{font-size:.7rem;font-weight:800;color:var(--purple);text-transform:uppercase}
.qtype{font-size:.64rem;font-weight:800;padding:2px 8px;border-radius:20px;background:var(--blue-soft);color:var(--blue);margin-left:6px}
.qtext{font-weight:700;margin:8px 0 12px}
.exam-nav{position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--card-border);padding:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:14px 14px 0 0;margin-top:10px}
.exam-dots{display:flex;flex-wrap:wrap;gap:4px;max-width:56%;max-height:56px;overflow-y:auto;align-content:flex-start;padding:2px}
.exam-nav{flex-wrap:nowrap}
.dot{width:11px;height:11px;border-radius:50%;background:var(--card-border);cursor:pointer;flex:0 0 auto}
.dot.answered{background:var(--teal)}
.dot.current{background:var(--pink);transform:scale(1.3)}
.dot.dot-correct{background:var(--green)}
.dot.dot-wrong{background:var(--red)}

/* ---- Unit 1 additions ---- */
.trap{background:var(--red-soft);border-left:5px solid var(--red);border-radius:10px;padding:11px 14px;margin:10px 0;font-size:.9rem}
.trap .tag{font-size:.68rem;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px}
.hy .tag{font-size:.68rem;font-weight:800;color:var(--amber);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px}
.chainlist{list-style:none;padding:0;margin:8px 0}
.chainlist li{padding:9px 0;border-bottom:1px solid var(--card-border);line-height:1.65}
.chainlist li:last-child{border-bottom:none}
.noteinput{width:100%;font-family:inherit;font-size:1rem;padding:13px;border-radius:12px;border:2px solid var(--card-border);background:var(--bg2);color:var(--ink);resize:vertical;line-height:1.5}
.noteinput:focus{outline:none;border-color:var(--purple)}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.chip{font-family:inherit;font-size:.8rem;font-weight:700;padding:8px 13px;border-radius:999px;border:2px solid var(--card-border);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
.starline{display:flex;align-items:center;gap:9px;margin:10px 0 14px;font-size:.93rem}
.starline input{width:20px;height:20px;accent-color:var(--purple)}
.notecard{border:2px solid var(--card-border);border-radius:12px;padding:11px 13px;margin:9px 0;background:var(--bg2)}
.noterow{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.notespacer{flex:1}
.notetag{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--purple);background:var(--purple-soft);padding:3px 9px;border-radius:999px}
.notetext{white-space:pre-wrap;line-height:1.55;font-size:.96rem}
.mini{font-family:inherit;font-size:.76rem;font-weight:700;padding:6px 12px;border-radius:999px;border:2px solid var(--card-border);background:var(--card);color:var(--ink);cursor:pointer}
.mini.on{background:var(--amber);border-color:var(--amber);color:#fff}
.mini.danger{color:var(--red);border-color:var(--red-soft)}
.btn.wide{width:100%}
.opt:focus{outline:none}
.opt:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg2);padding:11px 20px;border-radius:30px;font-weight:700;font-size:.88rem;opacity:0;pointer-events:none;transition:.25s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#backToTopBtn{position:fixed;bottom:84px;right:16px;z-index:999;width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-size:1.25rem;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .25s,transform .15s;padding:0}
#backToTopBtn.show{display:flex;opacity:1}
#backToTopBtn:active{transform:scale(.9)}
#backToTopBtn:focus{outline:none}
#backToTopBtn:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
@media(min-width:940px){#backToTopBtn{right:calc(50vw - 470px)}}
</style>
</head>
<body data-theme="day">

<div class="topbar">
  <div>
    <h1>🧪 NUR 256 — Unit 1 Study Lab</h1>
    <span class="sub">Aging • Chronic Illness • Cancer • Perioperative • End-of-Life</span>
  </div>
  <div class="toggles">
    <button class="tbtn" id="themeBtn" onclick="toggleTheme()">🌙 Night</button>
    <button class="tbtn" id="mobileBtn" onclick="toggleMobile()">🔍 Big Text</button>
    <button class="tbtn" id="shuffleBtn" onclick="toggleShuffle()">🔀 Shuffle: ON</button>
  </div>
</div>

<div class="progwrap">
  <div class="progbar-bg"><div class="progbar" id="progbar"></div></div>
  <div class="progtext" id="progtext">0 quiz questions answered • Let's go! 💪</div>
  <div style="text-align:center;margin-top:6px"><button onclick="resetAllProgress()" style="background:none;border:none;color:var(--muted);font-size:.68rem;text-decoration:underline;cursor:pointer">↺ reset my saved progress</button></div>
</div>

<div class="nav" id="nav"></div>
<div class="content" id="content"></div>
<div class="toast" id="toast"></div>
<button id="backToTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top" aria-label="Back to top">⬆️</button>


<script>
/* ===== THEME + BIG TEXT + SHUFFLE (persisted) ===== */
let shuffleAnswers=true;
function toggleShuffle(){
  shuffleAnswers=!shuffleAnswers;
  const b=document.getElementById('shuffleBtn'); if(b)b.textContent='🔀 Shuffle: '+(shuffleAnswers?'ON':'OFF');
  try{ localStorage.setItem('nur256u1_shuffle', shuffleAnswers?'1':'0'); }catch(e){}
}
function toggleTheme(){
  const b=document.body;
  const night = b.getAttribute('data-theme')!=='night';
  b.setAttribute('data-theme', night?'night':'day');
  const t1=document.getElementById('themeBtn'); if(t1)t1.textContent=night?'☀️ Day':'🌙 Night';
  try{ localStorage.setItem('nur256u1_theme', night?'night':'day'); }catch(e){}
}
function toggleMobile(){
  const b=document.body;
  b.classList.toggle('mobile-mode');
  const on=b.classList.contains('mobile-mode');
  const m1=document.getElementById('mobileBtn'); if(m1)m1.textContent=on?'🔍 Normal Text':'🔍 Big Text';
  try{ localStorage.setItem('nur256u1_bigtext', on?'1':'0'); }catch(e){}
}
(function restorePrefs(){
  try{
    if(localStorage.getItem('nur256u1_theme')==='night'){ document.body.setAttribute('data-theme','night');
      var t1=document.getElementById('themeBtn'); if(t1)t1.textContent='☀️ Day'; }
    if(localStorage.getItem('nur256u1_bigtext')==='1'){ document.body.classList.add('mobile-mode');
      var m1=document.getElementById('mobileBtn'); if(m1)m1.textContent='🔍 Normal Text'; }
    const sh=localStorage.getItem('nur256u1_shuffle');
    if(sh==='0'){ shuffleAnswers=false; var s1=document.getElementById('shuffleBtn'); if(s1)s1.textContent='🔀 Shuffle: OFF'; }
  }catch(e){}
})();

/* ===== PROGRESS (persisted) ===== */

function stripLabel(text){ return text.replace(/^[A-Za-z]\.\s*/,''); }
function relabel(optsArr){
  const L=['A','B','C','D','E','F'];
  return optsArr.map((o,i)=>L[i]+'. '+stripLabel(o));
}
function prepareQuestion(qOrig){
  let opts=qOrig.opts.slice();
  let correct=qOrig.type==='multi'?qOrig.correct.slice():qOrig.correct;
  if(shuffleAnswers){
    const order=shuffle(opts.map((_,i)=>i));
    const newOpts=order.map(i=>opts[i]);
    if(qOrig.type==='multi'){
      const correctSet=new Set(correct);
      correct=order.map((origIdx,newIdx)=>correctSet.has(origIdx)?newIdx:null).filter(x=>x!==null);
    } else {
      correct=order.indexOf(correct);
    }
    opts=newOpts;
  }
  return {...qOrig, opts:relabel(opts), correct};
}
let quizTotalCounted=new Set();
function renderQuiz(containerId, questions, title, source, indexMap){
  const host=document.getElementById(containerId);
  if(!host)return;
  host.innerHTML='';
  const wrap=document.createElement('div');
  if(title){ const h=document.createElement('h3'); h.textContent='📝 '+title; h.style.color='var(--pink)'; wrap.appendChild(h); }
  questions.forEach((qOrig,localIdx)=>{
    const qi = indexMap ? indexMap[localIdx] : localIdx;
    const q=prepareQuestion(qOrig);
    const qid=containerId+'-'+qi;
    if(!quizTotalCounted.has(qid)){ quizTotalCounted.add(qid); totalTrackable++; }
    const card=document.createElement('div'); card.className='quiz-card';
    const qt=document.createElement('div'); qt.className='q-text'; qt.textContent=(qi+1)+'. '+q.q; card.appendChild(qt);
    const opts=document.createElement('div'); opts.className='opts'; card.appendChild(opts);
    const rat=document.createElement('div'); rat.className='rationale'; rat.innerHTML='<b>Rationale:</b> '+q.rat;
    if(q.type==='multi'){
      const chosen=new Set();
      q.opts.forEach((o,i)=>{
        const btn=document.createElement('button'); btn.className='opt'; btn.innerHTML=o;
        btn.onclick=()=>{ if(chosen.has(i)){chosen.delete(i);btn.classList.remove('sel-multi');}else{chosen.add(i);btn.classList.add('sel-multi');} };
        opts.appendChild(btn);
      });
      const sub=document.createElement('button'); sub.className='submit-multi'; sub.textContent='Check Answer';
      sub.onclick=()=>{
        const correct=new Set(q.correct);
        let allRight=chosen.size===correct.size;
        opts.querySelectorAll('.opt').forEach((b,i)=>{
          b.classList.add('disabled');
          if(correct.has(i))b.classList.add('correct');
          else if(chosen.has(i)){b.classList.add('wrong');allRight=false;}
        });
        if(!allRight){ addToVault({id:qid,q:q.q,opts:q.opts,type:'multi',correct:q.correct,rat:q.rat,source:source||title||''}); }
        rat.classList.add('show'); sub.style.display='none'; bumpProgress(qid);
      };
      card.appendChild(sub);
    } else {
      q.opts.forEach((o,i)=>{
        const btn=document.createElement('button'); btn.className='opt'; btn.innerHTML=o;
        btn.onclick=()=>{
          opts.querySelectorAll('.opt').forEach(b=>b.classList.add('disabled'));
          if(i===q.correct)btn.classList.add('correct');
          else{
            btn.classList.add('wrong'); opts.querySelectorAll('.opt')[q.correct].classList.add('correct');
            addToVault({id:qid,q:q.q,opts:q.opts,type:'single',correct:q.correct,rat:q.rat,source:source||title||''});
          }
          rat.classList.add('show'); bumpProgress(qid);
        };
        opts.appendChild(btn);
      });
    }
    card.appendChild(rat);
    wrap.appendChild(card);
  });
  host.appendChild(wrap);
}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);}

let hotOnlyGlobal=false;
let quizFilterState={};
(function restoreVisionOnly(){ try{ if(localStorage.getItem('nur256u1_hotonly')==='1') hotOnlyGlobal=true; }catch(e){} })();
function renderFilteredQuiz(containerId, allQuestions, title, source){
  quizFilterState[containerId]={allQuestions,title,source};
  applyQuizFilter(containerId);
}
function applyQuizFilter(containerId){
  const state=quizFilterState[containerId];
  if(!state)return;
  const filtered=[], indices=[];
  state.allQuestions.forEach((q,i)=>{
    if(!hotOnlyGlobal || q.hot){ filtered.push(q); indices.push(i); }
  });
  if(filtered.length===0){
    const host=document.getElementById(containerId);
    if(host) host.innerHTML='<div class="card" style="text-align:center;color:var(--muted)">No high-yield questions in this set yet.</div>';
    return;
  }
  renderQuiz(containerId, filtered, state.title, state.source, indices);
}
function toggleHotOnly(){
  hotOnlyGlobal=!hotOnlyGlobal;
  try{ localStorage.setItem('nur256u1_hotonly', hotOnlyGlobal?'1':'0'); }catch(e){}
  Object.keys(quizFilterState).forEach(applyQuizFilter);
  updateHotToggleButtons();
  if(typeof examMode!=='undefined' && typeof buildQuizSet==='function'){ buildQuizSet(examMode); examIdx=0; saveExam(); drawExamQ(); }
  if(typeof startDrill==='function' && document.getElementById('drillBody')) startDrill();
  if(typeof renderPicker==='function') renderPicker();
  setTimeout(updateHotToggleButtons,0);
}
function updateHotToggleButtons(){
  document.querySelectorAll('.vision-toggle-btn').forEach(b=>{ b.textContent = hotOnlyGlobal ? '🔥 High-Yield Only: ON' : '🔥 High-Yield Only: OFF'; });
}

function toast(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800)}

/* map EXAM-shaped items into the section-quiz shape the quiz engine expects */
function secQ(list){return list.map(x=>({q:x.q,opts:x.o.slice(),correct:(x.t==='multi'?x.c.slice():x.c),type:(x.t==='multi'?'multi':'single'),rat:x.r,hot:!!x.hot,topic:x.topic}))}

<script>
const EXAM=[
{topic:'aging',hot:true,q:'The master principle that explains why older adults tolerate illness, surgery, and medications poorly is that aging reduces:',o:['The total number of chronic diseases already present','The overall need for prescription medication therapy','Physiologic reserve across every body system','Baseline intelligence and short-term memory capacity'],c:2,t:'single',r:'Aging = <b>less physiologic reserve</b>. Each system still works at rest but has little extra capacity to handle stress (surgery, infection, blood loss, new drugs). This single idea drives nearly every geriatric exam answer.'},
{topic:'aging',hot:true,q:'Which are NORMAL age-related (head-to-toe) changes the nurse expects in a healthy older adult? Select all that apply.',o:['Decreased aerobic capacity (~10% per decade)','Decreased kidney mass and filtration rate','Decreased gastric motility and slower absorption','Decreased skin elasticity and thinner dermis','Sudden confusion and severe memory loss'],c:[0,1,2,3],t:'multi',r:'Normal aging: lungs lose aerobic capacity, skin thins/loses elasticity, kidneys lose nephrons and GFR, GI motility slows. <b>Sudden confusion is NOT normal aging</b> — it signals delirium, infection, or another acute problem and must be reported.'},
{topic:'aging',hot:true,q:'An 80-year-old is admitted with a UTI. The family says \'she was fine yesterday, now she\'s confused and agitated.\' The nurse recognizes this new confusion as:',o:['An indication that restraints are needed for her own safety','A normal adjustment reaction to an unfamiliar hospital setting','Expected dementia consistent with her advanced age','Possible delirium - report as an emergency'],c:3,t:'single',r:'New, acute confusion = <b>delirium</b>, which is reversible but a medical emergency. In older adults, infection often presents as confusion rather than fever. Delirium is acute/fluctuating; dementia is chronic/gradual. Report immediately and find the cause.'},
{topic:'aging',hot:false,q:'When administering medications to an older adult, the safest guiding principle is:',o:['Start low and go slow','Start high to ensure effect','Give all medications at the same time','Avoid assessing kidney/liver function'],c:0,t:'single',r:'Altered pharmacokinetics (less body water, more fat, lower liver/kidney function) means drugs last longer and accumulate. <b>Start low, go slow</b>, simplify the regimen, and watch for polypharmacy and Beers-criteria drugs.'},
{topic:'aging',hot:false,q:'The \'geriatric triad\' the nurse focuses on preventing during hospitalization includes changes in cognition, incontinence, and:',o:['Falls','Malnutrition','Pressure injuries','Polypharmacy'],c:0,t:'single',r:'The classic <b>geriatric triad</b> is cognitive changes, <b>falls</b>, and incontinence. Pressure injuries, polypharmacy, and malnutrition are all real geriatric concerns and common distractors, but they are not the three that define the named triad — falls completes it.'},
{topic:'chronic',hot:true,q:'A patient newly diagnosed with type 2 diabetes asks, \'When will this be cured?\' The nurse\'s most accurate response reflects that a chronic illness is:',o:['A condition controlled by medication alone without lifestyle change','A condition that fully resolves once blood glucose normalizes','Ongoing and incurable, managed to prevent complications','A temporary illness that becomes acute only during periodic flare-ups'],c:2,t:'single',r:'<b>Chronic = incurable</b> (CDC: lasts 1+ year, needs ongoing care). Normalizing glucose controls but does not cure it; medication alone is not enough — diet, activity, and self-management matter; and a chronic illness is not \'temporary\' even though it can have acute flares. The goal is managing symptoms and preventing complications.'},
{topic:'chronic',hot:false,q:'Which statement uses correct people-first language?',o:['The patient with diabetes in room 4','The diabetes patient in room 4','The patient suffering from diabetes in room 4','The diabetic patient in room 4'],c:0,t:'single',r:'<b>People-first language</b> puts the person before the condition: \'patient WITH diabetes.\' \'Diabetic patient\' and \'diabetes patient\' still lead with the disease as a label, and \'suffering from\' adds a negative, pity-based framing. The differences are subtle on purpose — people-first phrasing is specifically \'person with [condition].\' Always honor individual preference.'},
{topic:'chronic',hot:false,q:'Which are modifiable risk factors for chronic disease the nurse targets in teaching? Select all that apply.',o:['Tobacco use','Diet low in fruits/vegetables, high in sodium','Physical inactivity','Excessive alcohol use','Family genetics'],c:[0,1,2,3],t:'multi',r:'Modifiable: tobacco, poor diet/high sodium, inactivity, excess alcohol. <b>Genetics is non-modifiable.</b> Health promotion focuses on what the patient can change.'},
{topic:'chronic',hot:true,q:'U.S. veterans have a higher prevalence of multiple chronic conditions. Which combination is specifically noted as common in male veterans?',o:['Type 1 diabetes, epilepsy, and migraines','Anxiety, IBS, and chronic sinusitis','Asthma, eczema, and seasonal allergies','Hypertension, arthritis, and COPD'],c:3,t:'single',r:'Male veterans most commonly carry <b>hypertension, arthritis, and COPD</b> (with CAD/cancer rising after 65). The other clusters are all real chronic conditions, but they are not the combination specifically noted as most prevalent in male veterans — the MCC pattern reflects age, service exposures, and cardiopulmonary risk.'},
{topic:'cancer',hot:true,q:'Carcinogenesis (how a normal cell becomes cancer) occurs in three steps. The correct order is:',o:['Initiation → promotion → progression','Metastasis → initiation → promotion','Progression → promotion → initiation','Promotion → initiation → progression'],c:0,t:'single',r:'<b>Initiation</b> (DNA mutation) → <b>promotion</b> (repeated exposure makes mutated cells proliferate; reversible if agent removed) → <b>progression</b> (cells become malignant, grow blood supply via angiogenesis, invade, and metastasize).'},
{topic:'cancer',hot:true,q:'How does cancer harm the body? Select all that apply.',o:['Spreads (metastasizes) via blood and lymph','Remains encapsulated within a fibrous capsule','Invades and destroys surrounding normal tissue','Competes for nutrients, causing cachexia/weight loss','Uncontrolled cell growth with no physiologic demand'],c:[0,2,3,4],t:'multi',r:'Malignant cells grow without control, invade and destroy tissue, metastasize via blood/lymph, and drain nutrition (cachexia). The trap is <b>\'remains encapsulated within a fibrous capsule\'</b> — that describes a BENIGN tumor; malignant tumors are non-encapsulated and infiltrate surrounding tissue. Read this one carefully, because the distractor uses correct-sounding pathology terms.'},
{topic:'cancer',hot:true,q:'Chemotherapy and radiation damage normal cells that divide rapidly. Which tissues are therefore most affected (and most sensitive on the exam)?',o:['Bone marrow, GI lining, hair follicles','Tendon, ligament, and dense connective tissue','Compact bone and articular cartilage surfaces','Skeletal muscle fibers and cortical brain tissue'],c:0,t:'single',r:'Rapidly dividing tissues take the hit: <b>bone marrow</b> (→ anemia, neutropenia, thrombocytopenia), <b>GI lining</b> (→ nausea, mucositis, diarrhea), and <b>hair follicles</b> (→ alopecia). Muscle/brain are slow-dividing and radioresistant.'},
{topic:'cancer',hot:false,q:'The TNM staging system describes a solid tumor. What does each letter stand for?',o:['Tumor grade, Number of nodes involved, Mitotic rate','Tumor location, Nuclear features, Metastatic risk','Tumor size and extent, regional Nodes, Metastasis','Tissue of origin, Necrosis level, Malignancy score'],c:2,t:'single',r:'<b>T</b> = primary tumor size/extent · <b>N</b> = regional lymph Nodes · <b>M</b> = distant Metastasis. The distractors mix in real oncology words (grade, mitotic rate, necrosis, nuclear features) that belong to <b>grading</b>, not staging — staging (TNM) describes how far cancer has spread, while grading describes how abnormal the cells look. Don\'t confuse the two.'},
{topic:'cancer',hot:true,q:'NGN — Cancer prevention levels. A nurse plans community cancer programs. Match the action to the correct prevention level by selecting the PRIMARY-prevention activities. Select all that apply.',o:['Teaching tobacco cessation and healthy diet','HBV vaccination to prevent liver cancer','Screening mammography to find early cancer','Administering the HPV vaccine','Monitoring a survivor for a second cancer'],c:[0,1,3],t:'multi',r:'<b>Primary</b> = prevent cancer before it starts: HPV/HBV vaccines, tobacco cessation, diet/activity. <b>Secondary</b> = screening/early detection (mammography, colonoscopy, Pap). <b>Tertiary</b> = monitoring survivors for recurrence/second cancers.'},
{topic:'cancer',hot:false,q:'Which is an example of SECONDARY cancer prevention?',o:['Survivorship surveillance for recurrence','HPV vaccination','A low-dose CT lung screening in a smoker','Removing a high-risk colon prophylactically'],c:2,t:'single',r:'Secondary prevention = <b>screening and early detection</b> (mammography, colonoscopy, Pap/HPV testing, low-dose CT for smokers). Vaccination is primary; survivorship monitoring is tertiary.'},
{topic:'cancer',hot:true,q:'Surgery is used for cancer in several ways. Match the TYPE of cancer surgery to its purpose — select all that are correctly paired.',o:['Prophylactic: remove high-risk tissue before cancer develops','Diagnostic: biopsy to obtain tissue for analysis','Palliative: relieve symptoms (obstruction, pain) without cure','Curative surgery means the tumor can never recur','Reconstructive: restore function or appearance'],c:[0,1,2,4],t:'multi',r:'<b>Diagnostic</b> = biopsy (excisional/incisional/needle, SLNB). <b>Prophylactic</b> = remove high-risk tissue (e.g., mastectomy/colectomy with BRCA or FAP). <b>Palliative</b> = comfort, e.g., debulking, colostomy for obstruction. <b>Reconstructive</b> = function/cosmetic. \'Curative\' removes all visible tumor but does not guarantee no recurrence.'},
{topic:'cancer',hot:true,q:'The patient\'s absolute neutrophil count (ANC) is 450/mm³ after chemotherapy. The nurse\'s priority is to:',o:['Start neutropenic precautions and monitor for any sign of infection','Transfuse packed red blood cells to correct the depressed cell count','Place the patient in airborne isolation with N95 respirators for staff','Give a prophylactic broad-spectrum antibiotic before cultures return'],c:0,t:'single',r:'<b>ANC < 500 = severe neutropenia</b> (nadir ~7–14 days post-chemo). Priority is <b>protective/neutropenic precautions</b> + watching for infection (fever may be the only sign). Airborne isolation/N95 protects against airborne pathogens, not the patient\'s own low immunity. Antibiotics are given for actual infection/per protocol, not reflexively. RBC transfusion treats anemia (low H&H), not neutropenia — neutrophils are white cells. The tempting wrong answers all \'sound\' like infection care.'},
{topic:'pre',hot:true,q:'The overall GOAL of preoperative nursing is to:',o:['Optimize the patient physically and psychologically before surgery','Begin discharge teaching and arrange the home care referral early','Establish IV access and hang the prophylactic antibiotic on time','Obtain the consent signature and verify the chart is fully assembled'],c:0,t:'single',r:'The overall GOAL of preop nursing is to <b>prepare the patient (body and mind) and make them as healthy/low-risk as possible</b> before surgery. The others are real preop NURSING TASKS that fall under that goal — witnessing consent, discharge planning, IV access/antibiotics — but they are specific actions, not the overarching goal. Watch for \'goal\' vs. \'task\' wording.'},
{topic:'pre',hot:true,q:'Regarding informed consent, the nurse\'s role is to:',o:['Obtain a family member\'s signature when the patient is anxious','Provide a detailed explanation of the procedure, risks, and alternatives','Have the patient sign before giving the preoperative sedative, then proceed regardless of questions','Witness the voluntary signature and verify understanding, notifying the surgeon if there are gaps'],c:3,t:'single',r:'The <b>surgeon explains</b> procedure/risks/alternatives; the <b>nurse witnesses</b> the signature and verifies understanding, alerting the surgeon to any gaps. The \'sign before sedation\' option is half-right (consent IS signed before psychoactive meds) but wrong because the nurse must NOT proceed if the patient still has questions. A family member signs only if the patient is legally unable to consent — not merely anxious. The plausible half-truths are the trap.'},
{topic:'pre',hot:false,q:'Preoperative teaching to prevent postoperative complications includes which of the following? Select all that apply.',o:['Turning and repositioning','Deep breathing and incentive spirometer use','Coughing and splinting the incision','Early ambulation and leg exercises','Holding all breathing exercises until pain-free'],c:[0,1,2,3],t:'multi',r:'Teach <b>deep breathing + incentive spirometry</b> (prevents atelectasis/pneumonia), <b>coughing with splinting</b>, <b>leg exercises + early ambulation</b> (prevents VTE/stasis), and turning. Waiting until pain-free would let complications develop.'},
{topic:'pre',hot:false,q:'An adult is scheduled for elective surgery in the morning. NPO teaching based on ERAS/guidelines is:',o:['NPO for all food and fluids for a full 24 hours before the scheduled time','Fast 8 hr after fatty food, 6 hr after a light meal, clear liquids to 2 hr','NPO after midnight for everything, with no exception made for clear liquids','Hold solids after midnight but allow milk and pulp-free juice until arrival'],c:1,t:'single',r:'Current ERAS guidance: ~8 hr after fatty/fried food, 6 hr after a light meal or milk, and <b>clear liquids up to 2 hr</b> before elective surgery — this prevents aspiration without unnecessary dehydration. \'24 hours NPO\' over-restricts; milk/juice are NOT clear liquids and need 6 hr; the rigid \'NPO after midnight, no exceptions\' is the outdated practice ERAS replaced. The distractors are all old or near-miss rules.'},
{topic:'pre',hot:false,q:'During medication reconciliation, the nurse notes the patient takes daily aspirin. The expected preoperative instruction is to:',o:['Switch the aspirin to an NSAID until the day of surgery','Stop aspirin/antiplatelets about 7–10 days before surgery','Continue aspirin through surgery since it is over-the-counter','Hold the aspirin only on the morning of surgery'],c:1,t:'single',r:'Aspirin irreversibly inhibits platelets for their ~7–10 day lifespan, so it is <b>stopped about 7–10 days pre-op</b> — not just the morning of (too late to recover platelet function). \'OTC so continue\' is a trap: being non-prescription doesn\'t make it safe before surgery. Switching to an NSAID also impairs platelets/raises bleeding risk. Always reconcile and report the full med/herbal list.'},
{topic:'intra',hot:true,q:'The circulating nurse\'s intraoperative priorities center on patient SAFETY. Which is a key responsibility?',o:['Labeling and handling tissue specimens directly at the sterile field','Monitoring vital signs continuously and titrating the anesthetic agent','Coordinating the room: positioning, counts, asepsis, and the time-out','Setting up the sterile field and passing instruments to the surgeon'],c:2,t:'single',r:'The <b>circulating nurse</b> manages the whole room from outside the sterile field — positioning, sponge/needle/instrument counts, asepsis, and time-out verification. Setting up the sterile field and passing instruments is the <b>scrub</b> role; monitoring/titrating anesthesia is the <b>CRNA/anesthesiologist</b>; specimen handling is shared but is a task, not the circulator\'s central safety role. Each distractor is a real OR job assigned to the wrong person.'},
{topic:'intra',hot:true,q:'To prevent perioperative POSITIONING injury, the nurse should: Select all that apply.',o:['Pad bony prominences','Compress arteries to reduce bleeding','Avoid hyperextending joints','Protect nerves from pressure','Maintain correct anatomic alignment'],c:[0,2,3,4],t:'multi',r:'Proper positioning prevents <b>nerve, skin, and circulatory injury</b>: pad bony prominences, keep alignment, avoid hyperextension, and protect nerves/vessels. You would <b>never</b> compress arteries — that causes ischemia.'},
{topic:'intra',hot:true,q:'The OR is a high fire-risk environment. The fire triangle the team controls consists of an oxidizer (oxygen), an ignition source, and:',o:['Static electricity discharged from the metal OR table','Fuel such as drapes, alcohol-based prep, and gases','Friction created between metal surgical instruments in use','Heat generated by the patient\'s own body during a long case'],c:1,t:'single',r:'The fire triangle = oxidizer (oxygen/nitrous), ignition source (laser/electrocautery), and <b>fuel</b> (drapes, alcohol-based prep, GI/airway gases). Static, body heat, and friction sound fire-related but are not the controllable \'fuel\' leg — the team manages fuel by letting alcohol prep dry and keeping drapes clear of ignition sources.'},
{topic:'intra',hot:true,q:'NGN — Malignant hyperthermia. Minutes after induction with a volatile anesthetic and succinylcholine, a patient develops HR 168, rising end-tidal CO2, and jaw rigidity. Select ALL appropriate nursing actions/recognitions.',o:['Expect a rapid rise in temperature as a LATE sign','Initiate cooling measures and 100% oxygen','Anticipate giving dantrolene','Recognize this as malignant hyperthermia','Continue the triggering anesthetic'],c:[0,1,2,3],t:'multi',r:'MH is a genetic hypermetabolic crisis triggered by <b>volatile anesthetics + succinylcholine</b>. EARLY signs: tachycardia, rising EtCO2 (hypercapnia), masseter/jaw rigidity. <b>Temperature spike is a LATE sign.</b> Treatment: STOP the trigger, give <b>dantrolene</b>, cool the patient, 100% O2, correct acidosis/electrolytes. Continuing the trigger would be fatal.'},
{topic:'intra',hot:false,q:'Which early sign would alert the nurse to malignant hyperthermia FIRST?',o:['Unexplained tachycardia with a rising end-tidal CO2','Bradycardia with progressive hypothermia and cool, dry skin','A sudden temperature spike to 107F as the earliest change','An isolated drop in blood pressure with no other vital sign change'],c:0,t:'single',r:'The <b>earliest</b> signs are unexplained <b>tachycardia and hypercapnia (rising EtCO2)</b>, often with jaw rigidity. The dramatic temperature rise is a <b>late</b> sign — waiting for it costs critical time.'},
{topic:'intra',hot:true,q:'All nurses, especially perioperative nurses, must screen for and prevent reactions to which common OR allergen?',o:['Povidone-iodine prep','Chlorhexidine skin prep','Adhesive tape','Latex'],c:3,t:'single',r:'<b>Latex</b> is the OR allergen every nurse must screen for and prevent (gloves, tubing, tourniquets) — reactions range from contact dermatitis to anaphylaxis. Chlorhexidine, iodine prep, and adhesives CAN cause reactions too, which makes them tempting, but latex is the classic, high-risk perioperative allergen with formal at-risk groups and latex-free protocols.'},
{topic:'post',hot:true,q:'On admission to the PACU, the nurse\'s FIRST priority assessment is:',o:['Pain level and last analgesic given','Level of consciousness and orientation','Surgical site, dressing, and drainage','Airway patency, breathing, and circulation'],c:3,t:'single',r:'PACU priority is always <b>ABCs</b> — anesthesia depresses airway reflexes and respiration, so a patent airway/oxygenation comes first. LOC, pain, and the surgical site are all genuinely assessed in PACU (not throwaways), but they come AFTER you\'ve confirmed the patient is breathing and perfusing. Use the airway-first rule when options are all real assessments.'},
{topic:'post',hot:true,q:'NGN — A patient is 6 hours post-abdominal surgery. BP has trended 118/76 → 96/58, HR 88 → 122, urine output is dropping, and the dressing has increasing bright-red drainage. Select ALL appropriate nursing actions.',o:['Assess the wound and apply pressure as indicated','Recognize signs of hypovolemic/hemorrhagic shock','Document and recheck in 4 hours only','Notify the surgeon/escalate through the chain of command','Increase monitoring of vital signs and output'],c:[0,1,3,4],t:'multi',r:'Falling BP + rising HR + falling urine output + bright-red drainage = <b>hemorrhage/hypovolemic shock</b>. Act now: recognize the trend, increase monitoring, assess/apply pressure to the wound, and <b>escalate up the chain of command</b>. Waiting 4 hours could be fatal — trends matter more than a single value.'},
{topic:'post',hot:true,q:'The most common respiratory complication after surgery, which incentive spirometry helps prevent, is:',o:['Aspiration','Atelectasis','Pneumonia','Pulmonary embolism'],c:1,t:'single',r:'<b>Atelectasis</b> (alveolar collapse from shallow breathing/anesthesia) is the MOST COMMON postop respiratory complication and the one incentive spirometry directly targets. Pneumonia often FOLLOWS untreated atelectasis; PE and aspiration are serious but far less common. All four are real postop respiratory problems, so this tests \'most common,\' not recognition.'},
{topic:'post',hot:false,q:'A patient has a PCA (patient-controlled analgesia) pump. Which instruction is correct?',o:['Encourage pressing the button before activity even without pain','The nurse should press the button on a fixed schedule for steady relief','A family member may press the button if the patient is too sedated to do so','Only the patient presses the button, never a family member'],c:3,t:'single',r:'<b>Only the patient</b> presses the PCA button — that is the built-in overdose safeguard, since an over-sedated patient physically can\'t press it. \'PCA by proxy\' (family or nurse pressing) defeats the safety and is prohibited. Pre-emptively dosing \'before activity without pain\' risks oversedation. The distractors all sound caring/helpful, which is the trap.'},
{topic:'post',hot:false,q:'A postoperative patient\'s abdominal wound edges separate and a loop of bowel protrudes. This is evisceration. The nurse\'s immediate action is to:',o:['Cover with saline-moistened sterile gauze, low-Fowler, knees flexed','Cover with dry sterile gauze and reassess at the next scheduled rounding','Apply a dry pressure dressing and continue the ordered diet as tolerated','Reduce the bowel gently back into the abdomen and reinforce the dressing'],c:0,t:'single',r:'For evisceration: <b>cover with sterile SALINE-MOISTENED gauze</b> (keeps tissue viable), low-Fowler with knees bent (reduces tension), NPO (likely return to OR), monitor for shock, and notify the surgeon NOW. Never push organs back in (infection/damage). A DRY dressing lets tissue dry out and die, and \'continue diet/reassess later\' dangerously delays. The wrong answers are near-misses (dry vs. moist, delay vs. act).'},
{topic:'post',hot:true,q:'A patient is short of breath. To maximize breathing capacity and lung expansion, the nurse positions the patient in:',o:['Supine and flat to reduce the work of breathing','High-Fowler, upright at about 90 degrees','Trendelenburg with the head lowered below the feet','Prone, which recruits the posterior lung segments'],c:1,t:'single',r:'<b>High-Fowler\'s (upright sitting)</b> is the best position to enhance breathing — it drops the diaphragm, increases lung expansion and chest excursion, and eases the work of breathing. Flat/Trendelenburg positions push abdominal contents against the diaphragm and worsen dyspnea.'},
{topic:'chronic',hot:true,q:'Using Maslow\'s hierarchy to prioritize, which patient need does the nurse address FIRST?',o:['A patient anxious about losing independence after surgery','A patient with an oxygen saturation of 86% on room air','A patient asking for help completing advance-directive paperwork','A patient crying because family hasn\'t visited'],c:1,t:'single',r:'By <b>Maslow</b>, physiologic survival needs (airway/breathing/circulation) outrank safety and all psychosocial needs. The <b>O2 sat of 86%</b> is a physiologic emergency, so it comes first. The other three are genuine needs (belonging, esteem, self-actualization) a nurse addresses — just not before oxygenation. None are labeled with their level here, so you have to classify them yourself.'},
{topic:'chronic',hot:true,q:'The nurse is applying the nursing process. What is the correct order of its steps (ADPIE)?',o:['Planning → Assessment → Diagnosis → Evaluation → Implementation','Implementation → Evaluation → Assessment → Diagnosis → Planning','Diagnosis → Assessment → Implementation → Planning → Evaluation','Assessment → Diagnosis → Planning → Implementation → Evaluation'],c:3,t:'single',r:'<b>ADPIE</b>: <b>A</b>ssessment (collect data) → <b>D</b>iagnosis (analyze) → <b>P</b>lanning (set goals/outcomes) → <b>I</b>mplementation (act) → <b>E</b>valuation (did it work?). Always assess first; evaluate last. If a step is missing or out of order, it\'s wrong.'},
{topic:'chronic',hot:false,q:'NGN — The nurse begins caring for a newly admitted patient with heart failure. Which action represents the ASSESSMENT step of the nursing process? Select all that apply.',o:['Administering the prescribed diuretic','Setting a goal of \'clear lung sounds by discharge\'','Auscultating lung sounds and weighing the patient','Measuring oxygen saturation and edema','Reviewing the patient\'s reported shortness of breath'],c:[2,3,4],t:'multi',r:'<b>Assessment</b> = collecting subjective and objective data: lung sounds, weight, reported symptoms, O2 sat, edema. Setting a goal is <b>planning</b>; giving the diuretic is <b>implementation</b>. Knowing which step an action belongs to is a classic NGN format.'},
{topic:'eol',hot:true,q:'A patient asks the difference between palliative care and hospice. The nurse correctly explains that palliative care:',o:['Is a legal document directing which life-sustaining treatments may be withheld later','Is reserved for the final six months once all curative treatment has been stopped','Requires a signed DNR order plus a prognosis certified by two separate physicians','Focuses on comfort and quality of life and may run alongside curative treatment'],c:3,t:'single',r:'<b>Palliative care</b> = comfort and quality of life, appropriate at <b>any age or stage</b> and given alongside curative treatment. <b>Hospice</b> is a subset of palliative care for terminal illness (prognosis ~6 months) when the focus shifts fully to comfort.'},
{topic:'eol',hot:false,q:'Which document translates a seriously ill patient\'s wishes into portable medical orders signed by a provider?',o:['A durable power of attorney naming a healthcare decision maker','The admission packet documenting the patient\'s code status choice','POLST, a set of provider-signed portable medical orders','A living will, which states preferences but is not an order set'],c:2,t:'single',r:'<b>POLST</b> converts patient preferences into actionable medical orders that transfer across care settings, signed by patient/surrogate and provider. Advance directives also include the living will and durable power of attorney for health care.'},
{topic:'eol',hot:false,q:'According to Kübler-Ross, which are recognized stages of grief? Select all that apply.',o:['Denial','Bargaining','Acceptance','Anger','Depression'],c:[0,1,2,3,4],t:'multi',r:'Kübler-Ross stages: <b>denial, anger, bargaining, depression, acceptance</b>. Newer models recognize grief is nonlinear and people oscillate between loss- and restoration-oriented coping (Dual Process Model).'},
{topic:'eol',hot:false,q:'When using the FICA spiritual assessment, the \'F\' stands for:',o:['Faith and belief','Feelings about death','Family support system','Final wishes'],c:0,t:'single',r:'In <b>FICA</b>, F = <b>Faith and belief</b> (\'Do you consider yourself spiritual/religious? What gives your life meaning?\'). The distractors are all genuinely part of a holistic end-of-life assessment — family, feelings about dying, final wishes — which makes them tempting, but the FICA acronym specifically begins with Faith (then Importance, Community, Address in care).'},
{topic:'eol',hot:true,q:'Which nursing action best supports HOPE for a terminally ill patient?',o:['Encourage the family to stay upbeat and conceal their own grief','Control pain and help set achievable short-term goals','Reassure the patient that a new treatment may still cure the disease','Keep conversations positive and steer away from talk about dying'],c:1,t:'single',r:'Realistic hope at end of life comes from <b>symptom control, dignity, connection, and achievable goals</b> (e.g., a comfortable day, a visit) — not cure. False reassurance about a \'cure\' sets up distrust; steering away from death and masking grief block the honest, therapeutic communication dying patients and families need. The wrong answers look kind but are subtly harmful — that\'s the test.'},
{topic:'meds',hot:true,q:'Versed (midazolam) is given for moderate sedation before a procedure. The nurse understands its PURPOSE and disease connection is:',o:['Deep general anesthesia with skeletal muscle paralysis for surgery','Sedation and amnesia without analgesia; reversed by flumazenil','An antisialagogue that blunts the gag reflex and dries secretions','A potent opioid analgesic used for procedural pain control alone'],c:1,t:'single',r:'<b>Versed (midazolam)</b> is a benzodiazepine for <b>moderate sedation + amnesia</b> — NOT general anesthesia, NOT analgesia. Reversal = <b>flumazenil</b>; #1 risk = respiratory depression. It does not paralyze (that\'s neuromuscular blockers), it\'s not an opioid (opioids handle pain), and drying secretions is anticholinergics like atropine. Every distractor is a real periop drug effect — assigned to the wrong drug.'},
{topic:'meds',hot:true,q:'A patient with malignant hyperthermia needs emergency drug therapy. Which medication treats the condition?',o:['Dantrolene','Epinephrine','Flumazenil','Naloxone'],c:0,t:'single',r:'<b>Dantrolene</b> is the antidote for <b>malignant hyperthermia</b> — it\'s a skeletal muscle relaxant that stops the hypermetabolic calcium release. (Naloxone→opioids, flumazenil→benzodiazepines.)'},
{topic:'meds',hot:true,q:'A postoperative patient on opioid analgesia has a respiratory rate of 8 and pinpoint pupils. Which drug does the nurse anticipate?',o:['Ondansetron','Flumazenil','Dantrolene','Naloxone'],c:3,t:'single',r:'<b>Naloxone</b> reverses <b>opioid</b> overdose/respiratory depression (RR < 12, pinpoint pupils, sedation). Match the reversal agent to the drug class: opioids→naloxone, benzodiazepines→flumazenil, MH→dantrolene.'},
{topic:'meds',hot:false,q:'Ondansetron (Zofran) is frequently given to oncology and postoperative patients. Its purpose connects to which problem?',o:['Procedural anxiety and anticipatory restlessness before surgery','Chemotherapy-induced diarrhea and abdominal cramping','Nausea and vomiting (PONV and chemo-induced)','Mucositis and painful oral ulceration from radiation therapy'],c:2,t:'single',r:'<b>Ondansetron</b> (5-HT3 antagonist) targets <b>nausea and vomiting</b> — postop and chemo-induced. The distractors are all real chemo/postop GI problems (diarrhea, mucositis) or periop symptoms (anxiety), which is what makes them tempting, but ondansetron specifically blocks the vomiting reflex; it doesn\'t treat diarrhea, anxiety, or mucositis.'},
{topic:'meds',hot:false,q:'A chemotherapy patient develops tumor lysis syndrome. Which drug is used to lower uric acid?',o:['Sodium bicarbonate','Sodium polystyrene sulfonate','Calcium gluconate','Allopurinol'],c:3,t:'single',r:'<b>Allopurinol</b> (with IV hydration) lowers <b>uric acid</b> in tumor lysis syndrome by blocking its production. The distractors are all genuinely used in TLS but for OTHER derangements: sodium polystyrene and calcium gluconate manage the HYPERKALEMIA, and bicarbonate was historically used to alkalinize urine. The question asks specifically about uric acid — that\'s allopurinol (or rasburicase).'},
{topic:'meds',hot:false,q:'Match each reversal/antidote to the right emergency. Select the correctly paired statements.',o:['Naloxone reverses Versed','Allopurinol lowers uric acid in tumor lysis syndrome','Flumazenil reverses benzodiazepines (e.g., Versed)','Dantrolene treats malignant hyperthermia','Naloxone reverses opioids'],c:[1,2,3,4],t:'multi',r:'Correct pairs: flumazenil→benzodiazepines, naloxone→opioids, dantrolene→MH, allopurinol→tumor lysis. <b>Naloxone does NOT reverse Versed</b> — that\'s a classic distractor; benzodiazepines need flumazenil.'},
{topic:'meds',hot:false,q:'A patient at risk for postoperative venous thromboembolism (VTE) is prescribed an anticoagulant. Which drug class connects to this prevention goal?',o:['Anticoagulants such as enoxaparin or low-dose heparin','Vasodilators such as nitroglycerin, which improve venous return','Antiplatelets such as clopidogrel, which target arterial thrombi','Thrombolytics such as alteplase, which lyse an established clot'],c:0,t:'single',r:'Postop VTE PROPHYLAXIS uses <b>anticoagulants</b> — most often <b>enoxaparin (LMWH)</b> or low-dose heparin — plus ambulation and SCDs. Antiplatelets work on arterial clots (not the venous stasis behind DVT); thrombolytics DISSOLVE an existing clot (treatment of a large PE, not routine prevention, and they raise bleeding risk); vasodilators don\'t prevent clots. The distractors are all real cardiovascular drug classes used in the wrong situation.'},
{topic:'cancer',hot:true,q:'A nurse working with patients who experience alopecia knows that which is the BEST method of helping patients manage the psychosocial impact of this problem?',o:['Reassuring the patient that alopecia is temporary','Assisting the patient to pre-plan for this event','Teaching the patient ways to protect the scalp','Telling the patient that there are worse side effects'],c:1,t:'single',r:'<b>Pre-planning</b> (wigs, scarves, hats, support resources before hair loss starts) gives the patient control and best addresses the <b>psychosocial</b> impact. Scalp protection is physical care; \'it\'s temporary\' and \'there are worse effects\' dismiss the patient\'s feelings.'},
{topic:'cancer',hot:true,q:'After receiving the hand-off report, which patient would the oncology nurse see FIRST?',o:['Patient scheduled for radiation therapy today','Patient who is neutropenic and in protective isolation','Patient who is afebrile with a heart rate of 108 beats/min','Older patient on chemotherapy with mental status changes'],c:3,t:'single',r:'<b>New mental status changes</b> in an older chemo patient signal something acute (infection/sepsis, metabolic, oncologic emergency) and take priority. The neutropenic isolation patient and the scheduled radiation patient are stable; HR 108 while afebrile is the least urgent. Acute change in condition beats a chronic/stable finding.'},
{topic:'post',hot:true,q:'The nurse is caring for a patient reporting pain of 8/10. The nurse gives the prescribed pain medication. One hour later the patient still reports 8/10. Which action is appropriate now?',o:['Report to the health-care provider by telephone','Increase the dosage of the medication','Include in the nursing report that the medication is ineffective','Wait for the provider to make rounds to report the problem'],c:0,t:'single',r:'The medication didn\'t work, so the nurse <b>evaluates and escalates now</b> — notify the provider by phone (use SBAR). Waiting for rounds delays relief; the nurse cannot independently increase a dose; just charting it isn\'t enough. This is the evaluation step driving action.'},
{topic:'post',hot:true,q:'A post-op patient has signs of hypovolemic shock. Which finding would indicate this complication?',o:['Warm, flushed, dry skin with a bounding pulse','Blood pressure 150/92 mmHg with a heart rate of 58 bpm','Blood pressure 90/60 mmHg with a heart rate of 120 bpm','Bradycardia with widening pulse pressure'],c:2,t:'single',r:'Hypovolemic shock = <b>falling BP + rising HR</b> (here 90/60, HR 120) with cool, pale, clammy skin and low urine output as the body compensates for lost volume. Warm/flushed/bounding describes early DISTRIBUTIVE (septic/neurogenic) shock; bradycardia with widening pulse pressure suggests neurogenic shock or rising ICP; high BP with bradycardia is essentially the opposite. All four are real hemodynamic patterns — match the pattern to the shock type.'},
{topic:'post',hot:true,q:'A new post-op patient presents with SpO2 90%, shallow respirations, and diminished breath sounds in the bases. What do you suspect this is?',o:['Pulmonary embolism','CHF','Pneumonia','Atelectasis'],c:3,t:'single',r:'<b>Atelectasis</b> (alveolar collapse) is the most common early postop respiratory complication: low SpO2, shallow breathing, and <b>diminished sounds at the bases</b>. Treat with incentive spirometry, deep breathing, coughing, and early ambulation. Pneumonia usually brings fever/productive cough; CHF brings crackles + fluid overload.'},
{topic:'pre',hot:true,q:'During the preoperative systems review, a patient reveals a history of renal disease. Which labs would need to be evaluated?',o:['BUN, creatinine, electrolytes','White blood cell count with PT/INR','Fasting lipid panel and hemoglobin A1c','H&H, liver function tests, and albumin'],c:0,t:'single',r:'Renal function is assessed with <b>BUN, serum creatinine, and electrolytes</b>. Kidneys clear anesthetics and drugs and balance fluids/electrolytes — impaired function raises surgical risk. (LFTs assess liver; PT/INR assess clotting.)'},
{topic:'aging',hot:true,q:'Older adults typically require smaller drug dosages than younger individuals because of the decreased function of the:',o:['Liver and kidneys','Lungs and heart','Pancreas and thyroid','Stomach and intestines'],c:0,t:'single',r:'The <b>liver</b> (metabolism) and <b>kidneys</b> (excretion) decline with age, so drugs are processed and cleared more slowly and can accumulate to toxic levels — hence lower doses. This is the pharmacokinetic basis for \'start low, go slow.\''},
{topic:'aging',hot:false,q:'The nurse assesses an older adult\'s living arrangements and care needs knowing that elder abuse often occurs in situations in which:',o:['There are several generations providing care','Stress in the caregiver is overwhelming','The elderly person is not appreciative of those who provide care','Programs for the elderly are not being utilized'],c:1,t:'single',r:'Elder abuse risk rises when <b>caregiver stress is overwhelming</b> — burnout, exhaustion, and lack of support. Nurses have a legal duty to report suspected abuse and should assess caregiver strain and connect families with respite and support resources.'},
{topic:'aging',hot:true,q:'NGN — You receive shift report on four older adult clients. Based on the assessment findings, which client should you assess FIRST?',o:['80-year-old with increased AP chest diameter, SpO2 92%, and a non-productive cough','82-year-old with type 2 diabetes, fasting glucose 160, frustrated about the meal schedule','78-year-old admitted for pneumonia who is confused, trying to get out of bed, RR 28 with audible secretions','74-year-old with heart failure: +2 pitting edema, crackles in lower bases, 3-lb weight gain this week'],c:[2],t:'multi',r:'Use ABCs + acute change. The <b>confused pneumonia patient with RR 28 and audible secretions</b> has an airway/breathing problem PLUS new confusion and a safety (fall) risk — assess first. The barrel chest with SpO2 92% is chronic/stable, the HF findings are concerning but expected and not immediately life-threatening, and the glucose of 160 with frustration is lowest priority.'},
{topic:'post',hot:true,q:'Which interventions help PREVENT deep vein thrombosis (DVT) in the postoperative patient? Select all that apply.',o:['Prophylactic subcutaneous heparin BID','TED hose and intermittent compression boots','Out of bed to chair early and often','Strict bed rest with legs still','Leg exercises on the non-operative side (dorsiflex, rotate ankle)'],c:[0,1,2,4],t:'multi',r:'DVT prevention = <b>movement + compression + anticoagulation</b>: early OOB, ankle pumps/dorsiflexion, TED hose and sequential compression devices, and prophylactic SC heparin. <b>Strict bed rest with still legs causes venous stasis</b> — the opposite of prevention.'},
{topic:'post',hot:false,q:'Which nursing interventions help prevent postoperative RESPIRATORY complications? Select all that apply.',o:['Coughing and early ambulation','Keeping the patient flat and still to rest the lungs','Monitoring responses to narcotic (opioid) analgesics','Deep breathing and incentive spirometry','Turning in bed and OOB to chair'],c:[0,2,3,4],t:'multi',r:'Prevent atelectasis/pneumonia with <b>deep breathing, incentive spirometry, coughing, ambulation, turning, and hydration</b>, and <b>monitor opioids</b> (they depress respirations). Lying flat and still promotes secretion pooling and atelectasis — avoid it; favor upright positioning.'},
{topic:'intra',hot:false,q:'Following AORN safe hand-off guidelines, which communication strategy should the nurse use during patient hand-off?',o:['Report only the abnormal findings to save the oncoming nurse time','SBAR with read-back, one speaker, few distractions','Hand off in the hallway so the oncoming nurse can keep moving','A quick verbal summary from memory to keep the hand-off brief'],c:1,t:'single',r:'AORN safe hand-off = <b>SBAR + read-back</b>, one speaker at a time, one patient, minimal distractions, supporting documentation, and time for questions. The distractors all sound efficient — from memory, on the move, abnormals-only — but each drops a safeguard (documentation, focus, completeness) that prevents the communication errors hand-offs are designed to catch.'},
{topic:'intra',hot:true,q:'Which patients are at increased risk for a latex allergy/sensitivity? Select all that apply.',o:['Patients allergic to shellfish or iodine contrast','Children with spina bifida','Patients with urogenital abnormalities or spinal cord injuries','Patients with a history of multiple surgeries','Health care workers and people with allergies or asthma'],c:[1,2,3,4],t:'multi',r:'Latex risk groups: <b>spina bifida, multiple surgeries, urogenital/spinal cord conditions, allergies/asthma, and health care workers</b> (repeated glove exposure). The trap is <b>shellfish/iodine allergy</b> — that\'s the old myth tied to iodinated CONTRAST, not latex. A true cross-reaction exists with certain foods (banana, avocado, kiwi — \'latex-fruit syndrome\'), not shellfish.'},
{topic:'pre',hot:false,q:'Which actions are priority preoperative care to maintain PATIENT SAFETY? Select all that apply.',o:['Verify and mark the correct surgical site','Complete preoperative teaching to prevent complications','Withhold anxiety information so the patient stays calm','Maintain normal glucose levels and confirm informed consent','Complete preoperative testing and preparation'],c:[0,1,3,4],t:'multi',r:'Priority preop safety: testing/prep, glucose control, informed consent, correct-site marking, infection prevention, and teaching — and addressing psychological comfort. The trap is <b>\'withhold anxiety information to keep the patient calm\'</b>: it sounds caring, but informed patients actually have LESS anxiety and fewer complications. Tailored teaching (not silence) reduces preop fear, postop pain, and anesthesia needs.'},
{topic:'meds',hot:true,q:'Which medication that starts with \'A\' is given to reverse opioid-induced slowing of the bowel (postoperative ileus) by blocking opioid effects in the gut?',o:['Acetaminophen','Atropine','Alvimopan','Allopurinol'],c:2,t:'single',r:'<b>Alvimopan</b> is a peripherally-acting opioid antagonist used for <b>opioid-induced postoperative ileus</b> — it blocks opioids in the gut to restore bowel function without reversing pain control. (Allopurinol → uric acid/tumor lysis; acetaminophen → opioid-sparing pain control; atropine → bradycardia.)'},
{topic:'meds',hot:false,q:'A multimodal (ERAS) pain plan pairs opioids with a non-opioid that starts with \'A\' to lower the opioid dose needed. Which drug is this?',o:['Amiodarone','Amlodipine','Acetaminophen','Albuterol'],c:2,t:'single',r:'<b>Acetaminophen</b> is a core opioid-sparing analgesic in multimodal/ERAS pathways — combined with NSAIDs it reduces opioid requirements and opioid-related risks (respiratory depression, ileus). Its own overdose antidote is acetylcysteine.'},
{topic:'aging',hot:true,q:'An older adult is admitted with pneumonia. Which assessment finding should the nurse expect that differs from a younger adult\'s typical presentation?',o:['A loud, severely productive cough with thick purulent sputum','A sustained fever of 103F with shaking chills and rigors','Sharp pleuritic chest pain that worsens sharply on inspiration','Confusion and functional decline rather than fever'],c:3,t:'single',r:'Older adults have blunted immune/temperature responses, so infection often shows as <b>new confusion, weakness, or falls instead of fever</b>. A 103°F fever, severe productive cough, and classic pleuritic pain are the typical younger-adult presentation the older adult may NOT mount — which is exactly why atypical signs are the answer.'},
{topic:'aging',hot:false,q:'Which nursing interventions reduce fall risk in the hospitalized older adult? Select all that apply.',o:['Ensure call light and personal items are within reach','Provide adequate lighting and non-slip footwear','Implement scheduled toileting','Use physical restraints routinely to prevent wandering','Keep the bed in low position with brakes locked'],c:[0,1,2,4],t:'multi',r:'Fall prevention = low bed, items/call light reachable, good lighting, non-slip footwear, and scheduled toileting (urgency causes falls). <b>Routine restraints are wrong</b> — they increase injury, agitation, and deconditioning, and are a last resort, not a prevention strategy. Use least-restrictive measures first.'},
{topic:'aging',hot:false,q:'The nurse reviews the medication list of an older adult taking 9 medications. This is an example of polypharmacy, which increases the risk of:',o:['More predictable drug levels because doses balance each other','Better symptom control with fewer side effects','Increased risk of adverse drug reactions, interactions, and falls','Reduced pill burden once a routine is established'],c:2,t:'single',r:'<b>Polypharmacy</b> (multiple meds) increases <b>adverse reactions, drug–drug interactions, and falls</b> — the AGS Beers Criteria flags high-risk drugs in older adults. The distractors sound reasonable (better control, balanced levels, easier routine) but polypharmacy actually makes levels LESS predictable, raises (not lowers) pill burden, and the interaction risk outweighs added \'control.\' Watch for optimistic-sounding wrong answers.'},
{topic:'chronic',hot:false,q:'A patient with a new spinal cord injury qualifies for federal assistance. Which program is available specifically to people 65+, those with permanent kidney failure, or qualifying disability?',o:['COBRA continuation coverage','Medicare','Supplemental Security Income (SSI)','Medicaid'],c:1,t:'single',r:'<b>Medicare</b> eligibility = age 65+, permanent kidney failure (ESRD), or qualifying long-term disability — exactly the criteria described. Medicaid is <b>need-based</b> (low income/resources); SSI provides cash assistance, not the health coverage tied to these criteria; COBRA temporarily continues an employer plan after job loss. The distractors are all real assistance programs — match the eligibility wording to Medicare.'},
{topic:'chronic',hot:true,q:'A patient with multiple chronic conditions sees several specialists. What is the nurse\'s most important role in coordinating this care?',o:['Coordinate across specialists, reconcile medications, and catch duplication','Direct each specialist to manage their own condition without cross-consultation','Have the patient choose one condition to prioritize so the plan stays simple','Schedule the appointments and let each provider manage their own order set'],c:0,t:'single',r:'With multiple chronic conditions the nurse\'s key role is <b>coordination</b> — reconciling meds, spotting conflicting or duplicate therapy, and connecting the specialists\' plans. Letting specialists work in silos, making the patient drop a condition, or just booking visits all leave the patient to navigate fragmented care alone, which drives errors and avoidable hospitalizations. The distractors are realistic but passive.'},
{topic:'cancer',hot:true,q:'A chemotherapy patient develops a vesicant extravasation at the IV site. What is the nurse\'s FIRST action?',o:['Flush the line with saline','Stop the infusion immediately','Increase the infusion rate','Apply heat and continue the infusion'],c:1,t:'single',r:'<b>Stop the infusion immediately</b> — a vesicant leaking into tissue causes severe necrosis, so halting exposure comes first, then follow the antidote/protocol. Flushing pushes more vesicant into tissue, continuing (with heat or faster rate) worsens the injury. This is an oncologic emergency.'},
{topic:'cancer',hot:false,q:'A neutropenic patient is on protective (neutropenic) precautions. Which actions are appropriate? Select all that apply.',o:['Strict hand hygiene by all staff and visitors','Monitor temperature for the earliest sign of infection','No fresh flowers or raw fruits/vegetables','Place the patient with a roommate who has a cold','Avoid invasive procedures when possible'],c:[0,1,2,4],t:'multi',r:'Neutropenic care: meticulous hand hygiene, no fresh flowers/raw produce (bacteria/fungi), monitor temp closely (fever may be the ONLY infection sign), and minimize invasive procedures. <b>A sick roommate is dangerous</b> — neutropenic patients need a private room and protection from anyone with an infection.'},
{topic:'cancer',hot:false,q:'A patient asks why chemotherapy is given in repeated cycles instead of one large dose. The nurse explains that each cycle:',o:['Each dose kills a fraction of the actively dividing cells','Repeated dosing guarantees every malignant cell is destroyed at once','Low repeated doses spare healthy rapidly dividing cells completely','Cycling removes the need for immune clearance of residual disease'],c:0,t:'single',r:'Chemo works by <b>cell-kill (fractional) kinetics</b> — each dose kills a percentage of actively dividing cells, so spaced cycles hit more cells across the cell cycle while letting normal tissue recover between doses. No regimen kills \'every cell at once,\' chemo still harms rapidly dividing healthy cells (marrow, GI, hair), and the goal is to reduce the burden enough for the immune system to finish — not bypass it. The distractors are all subtly wrong mechanisms.'},
{topic:'pre',hot:true,q:'The preoperative nurse is verifying the consent form. The patient says, \'I\'m not really sure what they\'re going to do.\' What is the nurse\'s best action?',o:['Have the patient sign anyway to avoid delay','Notify the surgeon to clarify before the patient signs','Explain the surgical procedure in detail','Witness the signature and proceed'],c:1,t:'single',r:'If the patient doesn\'t understand, consent is not informed — <b>notify the surgeon to clarify</b>, since the surgeon (not the nurse) explains the procedure/risks. The nurse cannot supply that explanation, must never have an uninformed patient sign, and cannot witness a signature for someone who doesn\'t understand.'},
{topic:'pre',hot:false,q:'A diabetic patient is scheduled for surgery. Which preoperative goal is a priority to reduce complications?',o:['Maintain near-normal glucose to lower infection risk','Hold all insulin and oral agents for 24 hours before the procedure','Give the full usual insulin dose even though the patient is NPO','Allow glucose to run high to prevent intraoperative hypoglycemia'],c:0,t:'single',r:'The preop goal is <b>controlled, near-normal glucose</b> — hyperglycemia impairs wound healing and raises SSI risk. \'Run it high to avoid lows\' overshoots and harms healing; holding everything for 24 h risks DKA in type 1; giving the FULL usual insulin dose while NPO risks dangerous hypoglycemia. Real practice adjusts the dose (often a reduced basal) — both extremes are wrong, which is the trap.'},
{topic:'pre',hot:false,q:'Immediate preoperative interventions the nurse completes before transport to the OR include: Select all that apply.',o:['Verify the surgical site is marked','Have the patient void and remove dentures/jewelry/nail polish','Confirm patient identity and allergies','Give a large breakfast','Ensure consent is signed'],c:[0,1,2,4],t:'multi',r:'Immediate preop: verify ID/allergies, signed consent, void, remove dentures/jewelry/polish (airway and assessment safety), and confirm site marking. <b>A large breakfast violates NPO</b> and risks aspiration — patients are NPO before surgery.'},
