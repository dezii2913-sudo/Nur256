{topic:'eol',hot:true,q:'A patient with terminal cancer says, \'I just hope I can make it to my daughter\'s wedding next month.\' What is the nurse\'s most therapeutic response?',o:['\'You should focus your energy on getting stronger first.\'','\'It\'s unlikely you\'ll still be here by next month.\'','\'Tell me more about what that day means to you.\'','\'Let\'s talk about something happier than that today.\''],c:2,t:'single',r:'<b>Exploring meaning</b> (\'tell me more...\') supports realistic hope and honors the patient\'s goals — the heart of palliative communication. Crushing the hope, shutting down the conversation, and giving false reassurance about \'getting better\' all block therapeutic communication and ignore the patient\'s needs.'},
{topic:'eol',hot:true,q:'A patient asks the difference between palliative care and hospice. The nurse correctly explains that palliative care:',o:['Is a legal document directing which life-sustaining treatments may be withheld later','Is reserved for the final six months once all curative treatment has been stopped','Requires a signed DNR order plus a prognosis certified by two separate physicians','Focuses on comfort and quality of life and may run alongside curative treatment'],c:3,t:'single',r:'<b>Palliative care</b> = comfort and quality of life, appropriate at <b>any age or stage</b> and given alongside curative treatment. <b>Hospice</b> is a subset of palliative care for terminal illness (prognosis ~6 months) when the focus shifts fully to comfort.'},
{topic:'resp',hot:false,q:'An 82-year-old is admitted with new-onset confusion, weakness, and decreased appetite but no fever. The nurse should suspect:',o:['Dehydration alone from the decreased intake','Pneumonia presenting atypically in an older adult','Normal aging changes in cognition and appetite','Anxiety related to the unfamiliar environment'],c:1,t:'single',r:'In <b>older adults, pneumonia often presents atypically</b> — confusion, weakness, anorexia, and altered mental status rather than classic fever. A change in mental status is an early red flag.'},
{topic:'meds',hot:true,q:'A patient takes acetaminophen for pain and also drinks alcohol regularly. The nurse is most concerned about which adverse effect, and what is the antidote?',o:['Cardiotoxicity; the antidote is dantrolene sodium infusion','Hepatotoxicity; the antidote is acetylcysteine','Ototoxicity; the antidote is intravenous calcium gluconate','Nephrotoxicity; the antidote is IV sodium bicarbonate'],c:1,t:'single',r:'Acetaminophen in excess — and especially combined with alcohol — causes <b>hepatotoxicity</b> (liver damage); the antidote is <b>acetylcysteine (Mucomyst)</b>. Stay within the daily limit and assess liver function. Sodium bicarbonate, calcium gluconate, and dantrolene treat unrelated problems (acidosis/aspirin, hyperkalemia/hypocalcemia, malignant hyperthermia).'},
{topic:'aging',hot:true,q:'Older adults typically require smaller drug dosages than younger individuals because of the decreased function of the:',o:['Liver and kidneys','Lungs and heart','Pancreas and thyroid','Stomach and intestines'],c:0,t:'single',r:'The <b>liver</b> (metabolism) and <b>kidneys</b> (excretion) decline with age, so drugs are processed and cleared more slowly and can accumulate to toxic levels — hence lower doses. This is the pharmacokinetic basis for \'start low, go slow.\''},
{topic:'post',hot:true,q:'NGN — A patient is 6 hours post-abdominal surgery. BP has trended 118/76 → 96/58, HR 88 → 122, urine output is dropping, and the dressing has increasing bright-red drainage. Select ALL appropriate nursing actions.',o:['Assess the wound and apply pressure as indicated','Recognize signs of hypovolemic/hemorrhagic shock','Document and recheck in 4 hours only','Notify the surgeon/escalate through the chain of command','Increase monitoring of vital signs and output'],c:[0,1,3,4],t:'multi',r:'Falling BP + rising HR + falling urine output + bright-red drainage = <b>hemorrhage/hypovolemic shock</b>. Act now: recognize the trend, increase monitoring, assess/apply pressure to the wound, and <b>escalate up the chain of command</b>. Waiting 4 hours could be fatal — trends matter more than a single value.'},
{topic:'cancer',hot:true,q:'A patient with bone metastases has a serum calcium of 12.8 mg/dL with fatigue, weakness, and confusion. Which treatment does the nurse anticipate first?',o:['Calcium gluconate IV push','Isotonic saline hydration followed by a bisphosphonate','Fluid restriction with a loop diuretic','Oral calcium supplementation with vitamin D'],c:1,t:'single',r:'Hypercalcemia of malignancy is diagnosed at a serum calcium <b>above 10.4 mg/dL</b>. Management is <b>hydration first</b> to drive urinary calcium excretion, <b>then a bisphosphonate</b> to stop bone resorption. Calcium gluconate treats <b>hypo</b>calcemia, and restricting fluids worsens the problem.'},
{topic:'aging',hot:true,q:'An 80-year-old is admitted with a UTI. The family says \'she was fine yesterday, now she\'s confused and agitated.\' The nurse recognizes this new confusion as:',o:['An indication that restraints are needed for her own safety','A normal adjustment reaction to an unfamiliar hospital setting','Expected dementia consistent with her advanced age','Possible delirium - report as an emergency'],c:3,t:'single',r:'New, acute confusion = <b>delirium</b>, which is reversible but a medical emergency. In older adults, infection often presents as confusion rather than fever. Delirium is acute/fluctuating; dementia is chronic/gradual. Report immediately and find the cause.'},
{topic:'aging',hot:true,q:'A nurse is assessing an 84-year-old admitted from home. Which findings require follow-up rather than being attributed to normal aging? Select all that apply.',o:['A resting heart rate of 68 beats per minute','Slightly decreased high-frequency hearing','Reports of new difficulty swallowing solid food','New onset of confusion over the past two days','Unintentional weight loss of 12 pounds in three months','Bruising in various stages of healing on both upper arms'],c:[2,3,4,5],t:'multi',r:'Normal aging: stable resting heart rate and gradual high-frequency hearing loss (presbycusis). <b>Requires follow-up:</b> acute confusion (delirium), unintentional weight loss (malignancy, malnutrition, depression), <b>bruising in different stages of healing on the upper arms</b> (a grip-pattern injury suggesting abuse), and new dysphagia (stroke, mass, neuromuscular disease). Note that only one option raises a safety-reporting duty.'},
{topic:'resp',hot:false,q:'A patient with acute rhinosinusitis asks why antibiotics were not prescribed. What is the best response?',o:['The infection is too advanced for antibiotics to help','Most cases are viral and improve with supportive care','Antibiotics are never used for sinus infections','Antibiotics would worsen the nasal congestion'],c:1,t:'single',r:'The majority of acute rhinosinusitis is <b>viral</b>. Antibiotics are reserved for symptoms that persist beyond about 10 days, worsen after initial improvement, or are severe. Supportive care is humidification, fluids, saline irrigation, and warm compresses.'},
{topic:'aging',hot:false,q:'Which nutrient does the nurse emphasize to support mental function in an older adult?',o:['Vitamin D only','Vitamin K','Sodium','Vitamin B12'],c:3,t:'single',r:'<b>Vitamin B12</b> intake supports mental function, and deficiency can mimic dementia. Proper nutrition generally protects cognition, and mental function may also be <b>threatened by stress</b>.'},
{topic:'meds',hot:true,q:'A postoperative patient on opioid analgesia has a respiratory rate of 8 and pinpoint pupils. Which drug does the nurse anticipate?',o:['Ondansetron','Flumazenil','Dantrolene','Naloxone'],c:3,t:'single',r:'<b>Naloxone</b> reverses <b>opioid</b> overdose/respiratory depression (RR < 12, pinpoint pupils, sedation). Match the reversal agent to the drug class: opioids→naloxone, benzodiazepines→flumazenil, MH→dantrolene.'},
{topic:'chronic',hot:false,q:'Which are demands that chronic illness places on patients and families? Select all that apply.',o:['Daily management of the condition','A one-time treatment plan that requires no adjustment','Time, social, and financial resources','Collaboration with health care professionals','Monitoring health and making lifestyle decisions','Care that is entirely directed by the provider'],c:[0,2,3,4],t:'multi',r:'Chronic illness demands <b>daily management</b>, real <b>time, social, and financial resources</b>, ongoing <b>collaboration</b>, adherence to treatment guidelines, and continuous <b>monitoring and lifestyle decisions</b> — while managing physical, psychological, and social well-being. The patient drives it, not the provider.'},
{topic:'eol',hot:false,q:'According to Kübler-Ross, which are recognized stages of grief? Select all that apply.',o:['Denial','Bargaining','Acceptance','Anger','Depression'],c:[0,1,2,3,4],t:'multi',r:'Kübler-Ross stages: <b>denial, anger, bargaining, depression, acceptance</b>. Newer models recognize grief is nonlinear and people oscillate between loss- and restoration-oriented coping (Dual Process Model).'},
{topic:'aging',hot:true,q:'A daughter says her 79-year-old mother\'s new incontinence is \'just part of getting older.\' What is the nurse\'s best response?',o:['Nothing can be done other than scheduled toileting','Incontinence is expected once mobility declines','Incontinence is not a normal age change and should be evaluated','She is correct, and it will likely continue to worsen'],c:2,t:'single',r:'<b>Incontinence is never normal aging.</b> It is a geriatric syndrome with multiple contributing causes — medications, mobility, infection, cognition, environment — and it is <b>preventable or treatable</b>. Accepting it as inevitable is the trap.'},
{topic:'chronic',hot:true,q:'A patient newly diagnosed with type 2 diabetes asks, \'When will this be cured?\' The nurse\'s most accurate response reflects that a chronic illness is:',o:['A condition controlled by medication alone without lifestyle change','A condition that fully resolves once blood glucose normalizes','Ongoing and incurable, managed to prevent complications','A temporary illness that becomes acute only during periodic flare-ups'],c:2,t:'single',r:'<b>Chronic = incurable</b> (CDC: lasts 1+ year, needs ongoing care). Normalizing glucose controls but does not cure it; medication alone is not enough — diet, activity, and self-management matter; and a chronic illness is not \'temporary\' even though it can have acute flares. The goal is managing symptoms and preventing complications.'},
{topic:'aging',hot:false,q:'An 88-year-old is admitted with dehydration. The nurse notes poor skin turgor over the forearm. How should the nurse interpret this finding?',o:['It should be rechecked on the lower extremity for a more accurate result','It confirms moderate dehydration and warrants immediate fluid resuscitation','It is unreliable in older adults because skin elasticity is already reduced','It rules out dehydration because turgor is preserved in true volume loss'],c:2,t:'single',r:'Age-related <b>loss of dermal elasticity</b> makes forearm turgor a poor hydration indicator in older adults. Better indicators are the <b>sternum or forehead</b>, plus mucous membranes, urine output and concentration, and orthostatic vitals. Lower extremities are worse, not better, because of dependent edema.'},
{topic:'intra',hot:true,q:'Which patients are at increased risk for a latex allergy/sensitivity? Select all that apply.',o:['Patients allergic to shellfish or iodine contrast','Children with spina bifida','Patients with urogenital abnormalities or spinal cord injuries','Patients with a history of multiple surgeries','Health care workers and people with allergies or asthma'],c:[1,2,3,4],t:'multi',r:'Latex risk groups: <b>spina bifida, multiple surgeries, urogenital/spinal cord conditions, allergies/asthma, and health care workers</b> (repeated glove exposure). The trap is <b>shellfish/iodine allergy</b> — that\'s the old myth tied to iodinated CONTRAST, not latex. A true cross-reaction exists with certain foods (banana, avocado, kiwi — \'latex-fruit syndrome\'), not shellfish.'},
{topic:'cancer',hot:false,q:'Where must chemotherapy be prepared?',o:['At the patient\'s bedside for accuracy','Any clean countertop in the medication room','In a standard laminar flow hood','A Class II or III biologic safety cabinet'],c:3,t:'single',r:'Preparation requires a <b>Class II or III biologic safety cabinet</b>, plus <b>closed-system transfer devices</b>, <b>needleless systems</b>, and <b>puncture- and leak-proof containers</b>. Waste goes in containers labeled <b>hazardous: chemotherapy contaminated waste</b>'},
{topic:'resp',hot:false,q:'Which interventions are part of the ventilator-associated pneumonia (VAP) bundle? (Select all that apply)',o:['Keep the patient flat','DVT and peptic ulcer prophylaxis','Daily sedation interruption/readiness to wean','Oral care with chlorhexidine','Elevate head of bed 30-45 degrees'],c:[1,2,3,4],t:'multi',r:'VAP bundle: HOB elevated, daily sedation vacation/wean assessment, oral chlorhexidine care, and DVT/PUD prophylaxis. Keeping flat increases aspiration risk.'},
{topic:'post',hot:true,q:'A nurse is prioritizing postoperative nursing problems. Which sequence correctly orders them from HIGHEST to LOWEST priority?',o:['Impaired Gas Exchange → Fluid Volume Deficit → Altered Comfort → Anxiety → Risk for Infection','Fluid Volume Deficit → Impaired Gas Exchange → Altered Comfort → Anxiety → Risk for Infection','Impaired Gas Exchange → Altered Comfort → Fluid Volume Deficit → Risk for Infection → Anxiety','Risk for Infection → Impaired Gas Exchange → Fluid Volume Deficit → Anxiety → Altered Comfort'],c:0,t:'single',r:'Use <b>ABCs + Maslow</b>: <b>Impaired Gas Exchange</b> (airway/breathing) is always first, then <b>Fluid Volume Deficit</b> (circulation), then <b>Altered Comfort</b> (pain — physiologic but not immediately life-threatening), then <b>Anxiety</b> (psychosocial), and finally <b>Risk for Infection</b> (a \'risk\'/potential problem ranks below actual problems). Oxygenation beats circulation, and an actual problem beats a potential one.'},
{topic:'resp',hot:false,q:'Which chest tube observations are NORMAL/expected? (Select all that apply)',o:['Gentle continuous bubbling in the suction control chamber','Occlusive gauze available at the bedside','Tidaling in the water seal chamber','Drainage system kept below chest level','Continuous bubbling in the water seal chamber'],c:[0,1,2,3],t:'multi',r:'Normal: <b>tidaling, gentle bubbling in the SUCTION chamber, system below chest level, bedside gauze ready</b>. Continuous bubbling in the WATER SEAL chamber is abnormal (air leak).'},
{topic:'chronic',hot:true,q:'A patient who uses a wheelchair is admitted for pneumonia. What should the nurse\'s assessment include?',o:['A limited exam that omits the pelvic examination','A comprehensive assessment including a complete physical examination','An assessment focused exclusively on the disability','Only the respiratory system, since that is the admitting problem'],c:1,t:'single',r:'<b>The disability should not be the exclusive focus.</b> Patients with disabilities need the same comprehensive care as anyone else, including a complete physical examination with a pelvic exam where indicated. <b>Health promotion and disease prevention are neglected in this population.</b>'},
{topic:'cancer',hot:false,q:'Which treatment goal describes prolonged survival and containment of cancer cell growth?',o:['Cure','Palliation','Prophylaxis','Control'],c:3,t:'single',r:'<b>Cure</b> is complete eradication of malignant disease. <b>Control</b> is prolonged survival and containment of growth. <b>Palliation</b> is relief of symptoms and improved quality of life. The goal is chosen with the type, stage, and grade.'},
{topic:'aging',hot:false,q:'Which nervous system change most directly increases fall risk in older adults?',o:['Thicker myelin improving conduction speed','Increased number of nerve cells in the cerebellum','Slower reaction times from fewer nerve cells and less neurotransmitter synthesis','Increased neurotransmitter synthesis speeding reflexes'],c:2,t:'single',r:'Aging affects the nervous system\'s <b>structure, chemistry, and function</b>. Fewer nerve cells and reduced neurotransmitter synthesis produce <b>slower reaction times and increased fall risk</b>.'},
{topic:'resp',hot:true,q:'MANIFESTS — During a severe asthma attack, which finding is the MOST alarming?',o:['Loud expiratory wheezing','Prolonged expiration','A sudden silent chest','Coughing'],c:2,t:'single',r:'A silent chest means almost no air is moving — impending respiratory failure. Loud wheezing at least means air movement. Knowing how it MANIFESTS tells you which sign is the emergency.'},
{topic:'resp',hot:true,q:'A patient is admitted with suspected TB. Which action is the priority?',o:['Private room on airborne precautions with negative pressure','Draw blood cultures from two sites before any isolation','Standard precautions with a surgical mask for all visitors','Semi-private room with the door kept closed at all times'],c:0,t:'single',r:'TB is airborne — the FIRST priority is protecting others by placing the patient in a negative-pressure room with airborne precautions (staff in N95s). Diagnostics and care follow once isolation is set.'},
{topic:'post',hot:true,q:'Which interventions help PREVENT deep vein thrombosis (DVT) in the postoperative patient? Select all that apply.',o:['Prophylactic subcutaneous heparin BID','TED hose and intermittent compression boots','Out of bed to chair early and often','Strict bed rest with legs still','Leg exercises on the non-operative side (dorsiflex, rotate ankle)'],c:[0,1,2,4],t:'multi',r:'DVT prevention = <b>movement + compression + anticoagulation</b>: early OOB, ankle pumps/dorsiflexion, TED hose and sequential compression devices, and prophylactic SC heparin. <b>Strict bed rest with still legs causes venous stasis</b> — the opposite of prevention.'},
{topic:'chronic',hot:false,q:'Which health promotion measure is a priority for an older adult with chronic illness?',o:['Influenza and pneumococcal vaccination','Avoiding routine dental care','Limiting fluid intake to reduce urination','Restricting all physical activity'],c:0,t:'single',r:'Older adults have an <b>increased risk of death from influenza and pneumonia</b>, and <b>effective vaccines exist</b>. Vaccination is a frontline health promotion intervention, not an optional extra.'},
{topic:'resp',hot:false,q:'A patient has used an over-the-counter nasal decongestant spray daily for two weeks and reports worsening congestion. What does the nurse recognize?',o:['Rebound congestion from prolonged use','An allergic reaction to the spray','A developing bacterial sinus infection','Normal seasonal worsening of symptoms'],c:0,t:'single',r:'Topical decongestants used beyond <b>3 days</b> cause <b>rhinitis medicamentosa</b> — rebound congestion. The patient uses more, gets worse, and the cycle continues. The spray must be stopped.'},
{topic:'eol',hot:false,q:'Which describes hospice care?',o:['A hospital unit for patients expected to recover','A comprehensive interdisciplinary program focused on quality of life','A service that begins only in the final 48 hours','A program that provides physical care but not spiritual support'],c:1,t:'single',r:'Hospice is a <b>comprehensive interdisciplinary specialty program</b> focused on <b>quality of life, palliation of symptoms, and physical, psychosocial, and spiritual support</b>, coordinated across hospitals, home care, and the community. <b>Timely referral</b> is essential — late referral is the common failure.'},
{topic:'cancer',hot:true,q:'What are consequences of impaired nutrition in a patient with cancer? Select all that apply.',o:['Increased incidence of infection','Delayed tissue and wound healing','Improved psychosocial functioning','Decreased capacity to continue antineoplastic therapy','Shortened hospital stays','Decreased survival'],c:[0,1,3,5],t:'multi',r:'Impaired nutrition causes <b>anemia, inability to continue therapy, decreased survival, delayed healing, diminished function, fatigue, immune incompetence with more infection, impaired psychosocial functioning, and increased hospital admissions and length of stay</b>. It makes stays <b>longer</b>, not shorter.'},
{topic:'chronic',hot:false,q:'Which symptoms are commonly shared across chronic conditions?',o:['Pain, fatigue, and sleep disturbances','Acute chest pain and diaphoresis','Fever, chills, and rigors','Sudden weight gain and hives'],c:0,t:'single',r:'<b>Pain, fatigue, and sleep disturbances</b> cut across chronic conditions regardless of the underlying diagnosis, which is why symptom management is part of every chronic care plan.'},
{topic:'aging',hot:true,q:'An 84-year-old is admitted for pneumonia. Which nursing focus best addresses geriatric syndrome risk?',o:['Prevention measures throughout the hospitalization','Deferring assessment until the pneumonia resolves','Limiting mobility to prevent any falls','Treating each syndrome only after it appears'],c:0,t:'single',r:'The emphasis is <b>prevention during hospitalization</b>. Hospitalization itself is the risk factor — unfamiliar environment, new medications, immobility, disrupted sleep. Immobilizing the patient to prevent falls causes deconditioning, pressure injury, and delirium.'},
{topic:'cancer',hot:true,q:'Surgery is used for cancer in several ways. Match the TYPE of cancer surgery to its purpose — select all that are correctly paired.',o:['Prophylactic: remove high-risk tissue before cancer develops','Diagnostic: biopsy to obtain tissue for analysis','Palliative: relieve symptoms (obstruction, pain) without cure','Curative surgery means the tumor can never recur','Reconstructive: restore function or appearance'],c:[0,1,2,4],t:'multi',r:'<b>Diagnostic</b> = biopsy (excisional/incisional/needle, SLNB). <b>Prophylactic</b> = remove high-risk tissue (e.g., mastectomy/colectomy with BRCA or FAP). <b>Palliative</b> = comfort, e.g., debulking, colostomy for obstruction. <b>Reconstructive</b> = function/cosmetic. \'Curative\' removes all visible tumor but does not guarantee no recurrence.'},
{topic:'post',hot:true,q:'The most common respiratory complication after surgery, which incentive spirometry helps prevent, is:',o:['Aspiration','Atelectasis','Pneumonia','Pulmonary embolism'],c:1,t:'single',r:'<b>Atelectasis</b> (alveolar collapse from shallow breathing/anesthesia) is the MOST COMMON postop respiratory complication and the one incentive spirometry directly targets. Pneumonia often FOLLOWS untreated atelectasis; PE and aspiration are serious but far less common. All four are real postop respiratory problems, so this tests \'most common,\' not recognition.'},
{topic:'chronic',hot:true,q:'Which statement best defines a chronic illness?',o:['A condition lasting 3 months or more with no cure, requiring ongoing management','Any condition that cannot be treated surgically','A condition lasting under 6 weeks that resolves with treatment','Any condition requiring daily medication'],c:0,t:'single',r:'Chronic means <b>3 months or more, no cure, management only</b>. It affects well-being and function over years, with an <b>episodic, continuous, or progressive</b> impact.'},
{topic:'cancer',hot:true,q:'A patient with cancer is at risk for several complications from BOTH the disease and its treatment. Which set correctly groups the major complications the nurse monitors for?',o:['Allergies, heartburn, and muscle cramps','Pain, infection, and altered nutrition','Constipation, insomnia, and dry skin','Hypertension, hyperlipidemia, and gout'],c:1,t:'single',r:'Cancer and its treatment threaten the patient with <b>pain, infection, and altered nutrition (anorexia–cachexia)</b> — the big three to monitor. The other clusters list real but minor or unrelated issues; they aren\'t the priority cancer complications driven by tumor growth, marrow suppression, and GI/metabolic effects.'},
{topic:'resp',hot:true,q:'A patient has an active nosebleed. Which position should the nurse use?',o:['Lying flat with the head turned to one side','Sitting upright leaning forward','Trendelenburg with the head lowered','Sitting upright with the head tilted back'],c:1,t:'single',r:'<b>Upright and leaning forward</b> lets blood drain out of the nose rather than down the throat. Tilting back causes swallowing of blood, nausea, aspiration risk, and hides how much has been lost.'},
{topic:'aging',hot:true,q:'An older adult is admitted with pneumonia. Which assessment finding should the nurse expect that differs from a younger adult\'s typical presentation?',o:['A loud, severely productive cough with thick purulent sputum','A sustained fever of 103F with shaking chills and rigors','Sharp pleuritic chest pain that worsens sharply on inspiration','Confusion and functional decline rather than fever'],c:3,t:'single',r:'Older adults have blunted immune/temperature responses, so infection often shows as <b>new confusion, weakness, or falls instead of fever</b>. A 103°F fever, severe productive cough, and classic pleuritic pain are the typical younger-adult presentation the older adult may NOT mount — which is exactly why atypical signs are the answer.'},
{topic:'chronic',hot:false,q:'Which are modifiable risk factors for chronic disease the nurse targets in teaching? Select all that apply.',o:['Tobacco use','Diet low in fruits/vegetables, high in sodium','Physical inactivity','Excessive alcohol use','Family genetics'],c:[0,1,2,3],t:'multi',r:'Modifiable: tobacco, poor diet/high sodium, inactivity, excess alcohol. <b>Genetics is non-modifiable.</b> Health promotion focuses on what the patient can change.'},
{topic:'cancer',hot:false,q:'A patient with BRCA1 and no cancer undergoes bilateral mastectomy. Which type of surgery is this?',o:['Palliative','Prophylactic','Reconstructive','Diagnostic'],c:1,t:'single',r:'<b>Prophylactic surgery removes nonvital tissues at increased risk</b> of developing cancer, in a patient who does not have cancer. <b>Palliative</b> relieves symptoms in someone who does have cancer, with no expectation of cure.'},
{topic:'chronic',hot:false,q:'Which statement uses correct people-first language?',o:['The patient with diabetes in room 4','The diabetes patient in room 4','The patient suffering from diabetes in room 4','The diabetic patient in room 4'],c:0,t:'single',r:'<b>People-first language</b> puts the person before the condition: \'patient WITH diabetes.\' \'Diabetic patient\' and \'diabetes patient\' still lead with the disease as a label, and \'suffering from\' adds a negative, pity-based framing. The differences are subtle on purpose — people-first phrasing is specifically \'person with [condition].\' Always honor individual preference.'},
{topic:'resp',hot:true,q:'TREATMENT — Which is the priority nursing intervention to prevent and treat atelectasis?',o:['Chest physiotherapy postponed until the fever resolves','Incentive spirometry, coughing, and early ambulation','Fluid restriction with humidified oxygen by face mask','Strict bed rest with the head of the bed kept flat'],c:1,t:'single',r:'Lung-expansion measures (IS with a 3-second hold, coughing/deep breathing, ambulation) reopen alveoli. Pain control matters so the patient CAN breathe deeply.'},
{topic:'cancer',hot:true,q:'Which stage of carcinogenesis is reversible?',o:['All three stages','Promotion','Initiation','Progression'],c:1,t:'single',r:'<b>Only promotion is reversible</b> — if the promoting substance is removed, proliferation of the initiated cells can stop. <b>Initiation</b> (the DNA mutation) and <b>progression</b> (malignant behavior, angiogenesis, invasion, metastasis) are <b>irreversible</b>. This is why smoking cessation and lifestyle change still help after years of exposure.'},
{topic:'aging',hot:true,q:'An older adult on the medical unit becomes acutely confused at 2200. What should the nurse do FIRST?',o:['Reorient the patient and turn on a night light in the room','Apply a bed alarm and move the patient closer to the nurses station','Notify the provider to request an order for a sedative','Check vital signs, oxygen saturation, and a fingerstick glucose'],c:3,t:'single',r:'Delirium is a <b>symptom of an underlying physiologic problem</b>, so the first step is to find the cause: hypoxia, hypoglycemia, infection, pain, or drug effect. Safety measures and reorientation come next, and sedatives typically <b>worsen</b> delirium. All four options get done eventually, which is the difficulty.'},
{topic:'eol',hot:false,q:'Which statements about advance directives are accurate? Select all that apply.',o:['Advance directives can be revoked or changed by a competent patient at any time','A living will documents which treatments the patient would want','A DNR order means comfort measures and routine care are also withheld','A living will functions as a medical order that staff may act on directly','A durable power of attorney names a person to decide if the patient cannot','A POLST is a set of provider-signed portable medical orders'],c:[0,1,4,5],t:'multi',r:'A DNR addresses <b>resuscitation only</b>; all other care continues, which is one of his most-tested distinctions. A living will states <b>preferences</b> and is not itself an actionable order, which is exactly the gap POLST was created to fill. Everything else listed is accurate.'},
{topic:'chronic',hot:true,q:'Which risk factors for chronic disease are modifiable?',o:['Ethnicity and genetic predisposition','Age, sex, and family history','Age at menarche and blood type','Tobacco use, high sodium intake, and physical inactivity'],c:3,t:'single',r:'<b>Modifiable:</b> tobacco use, second-hand smoke exposure, diets low in fruits and vegetables, diets high in sodium, lack of physical activity, and excessive alcohol use. Age, sex, family history, and ethnicity are <b>non-modifiable</b>.'},
{topic:'cancer',hot:true,q:'During a vesicant chemotherapy infusion the patient reports burning at the IV site and swelling is noted. What is the nurse\'s first action?',o:['Remove the catheter immediately and apply pressure','Stop the infusion but leave the catheter in place','Slow the rate and continue while monitoring','Flush the line with saline to clear the drug'],c:1,t:'single',r:'This is <b>extravasation</b>, which causes tissue necrosis. <b>Stop the infusion, leave the catheter in</b> so residual drug can be aspirated, then notify the provider. Flushing or pulling the line first spreads the vesicant.'},
{topic:'meds',hot:true,q:'Versed (midazolam) is given for moderate sedation before a procedure. The nurse understands its PURPOSE and disease connection is:',o:['Deep general anesthesia with skeletal muscle paralysis for surgery','Sedation and amnesia without analgesia; reversed by flumazenil','An antisialagogue that blunts the gag reflex and dries secretions','A potent opioid analgesic used for procedural pain control alone'],c:1,t:'single',r:'<b>Versed (midazolam)</b> is a benzodiazepine for <b>moderate sedation + amnesia</b> — NOT general anesthesia, NOT analgesia. Reversal = <b>flumazenil</b>; #1 risk = respiratory depression. It does not paralyze (that\'s neuromuscular blockers), it\'s not an opioid (opioids handle pain), and drying secretions is anticholinergics like atropine. Every distractor is a real periop drug effect — assigned to the wrong drug.'},
{topic:'chronic',hot:true,q:'Using Maslow\'s hierarchy to prioritize, which patient need does the nurse address FIRST?',o:['A patient anxious about losing independence after surgery','A patient with an oxygen saturation of 86% on room air','A patient asking for help completing advance-directive paperwork','A patient crying because family hasn\'t visited'],c:1,t:'single',r:'By <b>Maslow</b>, physiologic survival needs (airway/breathing/circulation) outrank safety and all psychosocial needs. The <b>O2 sat of 86%</b> is a physiologic emergency, so it comes first. The other three are genuine needs (belonging, esteem, self-actualization) a nurse addresses — just not before oxygenation. None are labeled with their level here, so you have to classify them yourself.'},
{topic:'pre',hot:false,q:'Which actions are priority preoperative care to maintain PATIENT SAFETY? Select all that apply.',o:['Verify and mark the correct surgical site','Complete preoperative teaching to prevent complications','Withhold anxiety information so the patient stays calm','Maintain normal glucose levels and confirm informed consent','Complete preoperative testing and preparation'],c:[0,1,3,4],t:'multi',r:'Priority preop safety: testing/prep, glucose control, informed consent, correct-site marking, infection prevention, and teaching — and addressing psychological comfort. The trap is <b>\'withhold anxiety information to keep the patient calm\'</b>: it sounds caring, but informed patients actually have LESS anxiety and fewer complications. Tailored teaching (not silence) reduces preop fear, postop pain, and anesthesia needs.'},
{topic:'aging',hot:true,q:'The nurse understands that as a person ages, drugs tend to remain active in the body longer and reach higher levels. The primary reason is:',o:['Declining liver metabolism and kidney excretion slow elimination','Gastric emptying accelerates, so drugs are absorbed more completely','Cytochrome P450 enzyme activity rises steadily with advancing age','Total body water increases, raising the volume of distribution'],c:0,t:'single',r:'With aging, <b>liver metabolism slows and kidney excretion declines</b>, so drugs are broken down and cleared more slowly — levels rise and effects last longer, increasing toxicity and adverse-reaction risk. This is the pharmacokinetic basis for \'start low, go slow.\' Aging actually <b>decreases</b> total body water and tends to slow (not speed) hepatic enzymes.'},
{topic:'intra',hot:true,q:'The OR is a high fire-risk environment. The fire triangle the team controls consists of an oxidizer (oxygen), an ignition source, and:',o:['Static electricity discharged from the metal OR table','Fuel such as drapes, alcohol-based prep, and gases','Friction created between metal surgical instruments in use','Heat generated by the patient\'s own body during a long case'],c:1,t:'single',r:'The fire triangle = oxidizer (oxygen/nitrous), ignition source (laser/electrocautery), and <b>fuel</b> (drapes, alcohol-based prep, GI/airway gases). Static, body heat, and friction sound fire-related but are not the controllable \'fuel\' leg — the team manages fuel by letting alcohol prep dry and keeping drapes clear of ignition sources.'},
{topic:'aging',hot:false,q:'Which cardiovascular changes are expected with normal aging?',o:['Reduced calcium deposits and improved valve motion','Increased pacemaker cells and more elastic vessels','Stenosis of valves and fewer pacemaker cells','Decreased arterial resistance and thinner ventricle walls'],c:2,t:'single',r:'Aging brings <b>valve stenosis, fewer pacemaker cells, increased arterial resistance, calcium and fat deposits in arterial walls, and myocardial hypertrophy</b> that affects left ventricular function. All of it reduces heart efficiency and reserve.'},
{topic:'cancer',hot:false,q:'Which infectious agent is associated with gastric cancer?',o:['Escherichia coli','Staphylococcus aureus','Clostridioides difficile','Helicobacter pylori'],c:3,t:'single',r:'<b>H. pylori</b> is the bacterial agent linked to gastric cancer. Other infectious carcinogens include <b>HPV</b> (cervical, head and neck), <b>hepatitis B and C</b> (liver), and EBV.'},
{topic:'aging',hot:false,q:'The nurse reviews the medication list of an older adult taking 9 medications. This is an example of polypharmacy, which increases the risk of:',o:['More predictable drug levels because doses balance each other','Better symptom control with fewer side effects','Increased risk of adverse drug reactions, interactions, and falls','Reduced pill burden once a routine is established'],c:2,t:'single',r:'<b>Polypharmacy</b> (multiple meds) increases <b>adverse reactions, drug–drug interactions, and falls</b> — the AGS Beers Criteria flags high-risk drugs in older adults. The distractors sound reasonable (better control, balanced levels, easier routine) but polypharmacy actually makes levels LESS predictable, raises (not lowers) pill burden, and the interaction risk outweighs added \'control.\' Watch for optimistic-sounding wrong answers.'},
{topic:'post',hot:true,q:'A nurse is teaching a client about antiembolism stockings. The nurse explains that the stockings help prevent deep vein thrombosis (DVT) by:',o:['Encouraging early ambulation, which prevents venous stasis','Providing warmth that dilates the vessels and speeds return','Forcing blood from the superficial into the deep veins','Elevating the extremity so venous blood cannot pool distally'],c:2,t:'single',r:'Antiembolism stockings use <b>graduated compression</b> (tightest at the ankle) to push blood out of the superficial veins and <b>into the deep venous system</b>, improving venous return and reducing stasis. They don\'t elevate the limb, they aren\'t a form of ambulation, and warmth isn\'t the mechanism — the compression gradient is what prevents DVT.'},
{topic:'resp',hot:false,q:'For a patient with a chest tube that becomes dislodged, applying petroleum gauze taped on 3 sides is which step of the nursing process?',o:['Assessment','Planning','Implementation','Evaluation'],c:2,t:'single',r:'Performing the emergency dressing is IMPLEMENTATION. Noticing the tube was out was assessment; watching for tension pneumothorax afterward would be evaluation.'},
{topic:'resp',hot:false,q:'Which ventilator strategy is used in ARDS?',o:['No humidification','Low FiO₂ only','Routine extubation','PEEP'],c:3,t:'single',r:'PEEP keeps alveoli open to improve oxygenation in ARDS.'},
{topic:'chronic',hot:true,q:'A patient is newly diagnosed with a chronic illness. What should the nurse do before beginning teaching?',o:['Assess what the diagnosis means to this patient','Provide the standard printed education packet','Schedule follow-up appointments with each specialist','Teach the full medication regimen immediately'],c:0,t:'single',r:'<b>Assess the impact of the new diagnosis first</b>, then <b>tailor the education to the patient\'s needs</b>. A standard packet ignores literacy, language, sensory ability, and readiness, and teaching before assessing may address the wrong thing entirely.'},
{topic:'resp',hot:true,q:'A nurse is caring for four patients. Who should the nurse assess FIRST?',o:['A pneumonia patient with a temp of 100.8°F','A patient with a chest tube and gentle tidaling in the water seal','An asthma patient whose wheezing has suddenly become a \'silent chest\'','A COPD patient with an O₂ sat of 90% on 2 L'],c:2,t:'single',r:'A silent chest = no air movement = impending respiratory failure. The COPD sat of 90% is acceptable (goal 88–92%), the low-grade fever is expected with pneumonia, and tidaling is normal. B is acute, unstable, and unexpected.'},
{topic:'resp',hot:true,q:'A patient with obstructive sleep apnea is admitted after surgery. Which order should the nurse question?',o:['Continuous pulse oximetry throughout the night','Head of bed elevated 30 degrees while sleeping','Bringing the patient\'s home CPAP to the bedside','Hydromorphone PCA with a continuous basal rate'],c:3,t:'single',r:'Patients with OSA are <b>highly sensitive to opioids and sedatives</b>. A continuous basal opioid infusion in an OSA patient markedly raises the risk of respiratory arrest. The other three orders are protective.'},
{topic:'post',hot:true,q:'A post-op patient has signs of hypovolemic shock. Which finding would indicate this complication?',o:['Warm, flushed, dry skin with a bounding pulse','Blood pressure 150/92 mmHg with a heart rate of 58 bpm','Blood pressure 90/60 mmHg with a heart rate of 120 bpm','Bradycardia with widening pulse pressure'],c:2,t:'single',r:'Hypovolemic shock = <b>falling BP + rising HR</b> (here 90/60, HR 120) with cool, pale, clammy skin and low urine output as the body compensates for lost volume. Warm/flushed/bounding describes early DISTRIBUTIVE (septic/neurogenic) shock; bradycardia with widening pulse pressure suggests neurogenic shock or rising ICP; high BP with bradycardia is essentially the opposite. All four are real hemodynamic patterns — match the pattern to the shock type.'},
{topic:'post',hot:true,q:'A patient is 6 hours post-op from an open abdominal procedure with a nasogastric tube to low intermittent suction. Which order should the nurse question?',o:['Ice chips as tolerated once bowel sounds return','Incentive spirometer 10 breaths every hour while awake','Sequential compression devices bilaterally while in bed','Irrigate the NG tube with sterile water every 4 hours'],c:3,t:'single',r:'NG irrigation is normally done with <b>normal saline</b>. Repeated sterile-water irrigation of a suctioned stomach washes out electrolytes and can produce <b>hypokalemia and hyponatremia</b>. The rest are standard. Note the order is not absurd, it is subtly wrong, which is how he writes them.'},
{topic:'cancer',hot:true,q:'Chemotherapy and radiation damage normal cells that divide rapidly. Which tissues are therefore most affected (and most sensitive on the exam)?',o:['Bone marrow, GI lining, hair follicles','Tendon, ligament, and dense connective tissue','Compact bone and articular cartilage surfaces','Skeletal muscle fibers and cortical brain tissue'],c:0,t:'single',r:'Rapidly dividing tissues take the hit: <b>bone marrow</b> (→ anemia, neutropenia, thrombocytopenia), <b>GI lining</b> (→ nausea, mucositis, diarrhea), and <b>hair follicles</b> (→ alopecia). Muscle/brain are slow-dividing and radioresistant.'},
{topic:'post',hot:true,q:'A patient is short of breath. To maximize breathing capacity and lung expansion, the nurse positions the patient in:',o:['Supine and flat to reduce the work of breathing','High-Fowler, upright at about 90 degrees','Trendelenburg with the head lowered below the feet','Prone, which recruits the posterior lung segments'],c:1,t:'single',r:'<b>High-Fowler\'s (upright sitting)</b> is the best position to enhance breathing — it drops the diaphragm, increases lung expansion and chest excursion, and eases the work of breathing. Flat/Trendelenburg positions push abdominal contents against the diaphragm and worsen dyspnea.'},
{topic:'resp',hot:false,q:'Which items must the nurse keep at the bedside of a patient with a new tracheostomy? (Select all that apply)',o:['A bottle of sterile water for drinking','Suction equipment','Obturator','Spare trach tube of the same size','Spare trach tube one size smaller'],c:[1,2,3,4],t:'multi',r:'Bedside essentials = <b>obturator, same-size spare trach, smaller-size spare trach, and suction equipment</b> — everything needed to reestablish the airway if the tube dislodges.'},
{topic:'resp',hot:true,q:'Which is NOT a true statement about ARDS?',o:['PEEP is used to keep alveoli open','High-flow oxygen alone usually corrects the hypoxemia','Chest x-ray shows bilateral infiltrates','The hallmark is hypoxemia refractory to oxygen'],c:1,t:'single',r:'The whole point of ARDS is that oxygen does NOT fix it — so B is the false statement the "NOT" wants. A, C, and D are all true.'},
{topic:'cancer',hot:true,q:'How does cancer harm the body? Select all that apply.',o:['Spreads (metastasizes) via blood and lymph','Remains encapsulated within a fibrous capsule','Invades and destroys surrounding normal tissue','Competes for nutrients, causing cachexia/weight loss','Uncontrolled cell growth with no physiologic demand'],c:[0,2,3,4],t:'multi',r:'Malignant cells grow without control, invade and destroy tissue, metastasize via blood/lymph, and drain nutrition (cachexia). The trap is <b>\'remains encapsulated within a fibrous capsule\'</b> — that describes a BENIGN tumor; malignant tumors are non-encapsulated and infiltrate surrounding tissue. Read this one carefully, because the distractor uses correct-sounding pathology terms.'},
{topic:'meds',hot:false,q:'A multimodal (ERAS) pain plan pairs opioids with a non-opioid that starts with \'A\' to lower the opioid dose needed. Which drug is this?',o:['Amiodarone','Amlodipine','Acetaminophen','Albuterol'],c:2,t:'single',r:'<b>Acetaminophen</b> is a core opioid-sparing analgesic in multimodal/ERAS pathways — combined with NSAIDs it reduces opioid requirements and opioid-related risks (respiratory depression, ileus). Its own overdose antidote is acetylcysteine.'},
{topic:'meds',hot:false,q:'A patient at risk for postoperative venous thromboembolism (VTE) is prescribed an anticoagulant. Which drug class connects to this prevention goal?',o:['Anticoagulants such as enoxaparin or low-dose heparin','Vasodilators such as nitroglycerin, which improve venous return','Antiplatelets such as clopidogrel, which target arterial thrombi','Thrombolytics such as alteplase, which lyse an established clot'],c:0,t:'single',r:'Postop VTE PROPHYLAXIS uses <b>anticoagulants</b> — most often <b>enoxaparin (LMWH)</b> or low-dose heparin — plus ambulation and SCDs. Antiplatelets work on arterial clots (not the venous stasis behind DVT); thrombolytics DISSOLVE an existing clot (treatment of a large PE, not routine prevention, and they raise bleeding risk); vasodilators don\'t prevent clots. The distractors are all real cardiovascular drug classes used in the wrong situation.'},
{topic:'aging',hot:true,q:'NGN — You receive shift report on four older adult clients. Based on the assessment findings, which client should you assess FIRST?',o:['80-year-old with increased AP chest diameter, SpO2 92%, and a non-productive cough','82-year-old with type 2 diabetes, fasting glucose 160, frustrated about the meal schedule','78-year-old admitted for pneumonia who is confused, trying to get out of bed, RR 28 with audible secretions','74-year-old with heart failure: +2 pitting edema, crackles in lower bases, 3-lb weight gain this week'],c:[2],t:'multi',r:'Use ABCs + acute change. The <b>confused pneumonia patient with RR 28 and audible secretions</b> has an airway/breathing problem PLUS new confusion and a safety (fall) risk — assess first. The barrel chest with SpO2 92% is chronic/stable, the HF findings are concerning but expected and not immediately life-threatening, and the glucose of 160 with frustration is lowest priority.'},
{topic:'post',hot:true,q:'A patient is 2 days postoperative and suddenly reports sharp chest pain, dyspnea, and anxiety with a drop in SpO2. The nurse suspects which complication?',o:['Atelectasis','Pulmonary embolism','Myocardial infarction','Pneumonia'],c:1,t:'single',r:'<b>Pulmonary embolism</b>: SUDDEN sharp chest pain, dyspnea, anxiety, tachycardia, and a dropping SpO2 a few days postop — classic for a DVT that traveled to the lung. Atelectasis is gradual with diminished bases; an MI gives chest pain but usually with ECG/troponin changes and not a sudden SpO2 drop; pneumonia builds over days with fever and productive cough. All four are real postop chest complaints — the SUDDEN onset + hypoxia points to PE.'},
{topic:'aging',hot:false,q:'Which teaching addresses the gastrointestinal changes of aging?',o:['Avoiding dental visits unless pain occurs','High-fiber diet, adequate fluids, and regular dental care','Lying flat after meals to aid digestion','Low-fiber diet with restricted fluids'],c:1,t:'single',r:'<b>Gastric motility slows</b>, reducing nutrient absorption and raising the risk of <b>constipation and aspiration</b>. Health promotion is regular dental care, high fiber, and adequate fluid intake.'},
{topic:'resp',hot:true,q:'Which of the following is NOT an appropriate intervention for a COPD patient?',o:['Pursed-lip breathing','Energy-conservation techniques','Routine high-flow 100% oxygen','Tripod positioning'],c:2,t:'single',r:'Routine 100% oxygen can suppress the hypoxic drive in COPD — the inappropriate action. Pursed-lip breathing, tripod position, and energy conservation are all correct.'},
{topic:'resp',hot:false,q:'Which assessment findings would the nurse expect in a patient with bacterial pneumonia? (Select all that apply)',o:['Pleuritic chest pain','Crackles over the affected lobe','Hyperresonance throughout','Productive cough with purulent sputum','Dullness to percussion'],c:[0,1,3,4],t:'multi',r:'Pneumonia produces <b>purulent cough, crackles, dullness to percussion</b> (consolidation = fluid-filled lung), and <b>pleuritic chest pain</b>. Hyperresonance is heard with air-trapping conditions like COPD/pneumothorax, not consolidation.'},
{topic:'cancer',hot:true,q:'A nurse is caring for four oncology patients. Which one requires immediate intervention?',o:['A patient on chemotherapy with a platelet count of 18,000/mm3 and a new headache','A patient with an ANC of 900/mm3 who wants to walk in the hallway','A patient with alopecia who is tearful about her appearance','A patient reporting mouth soreness who is refusing acidic juices'],c:0,t:'single',r:'Platelets under 20,000 with a <b>new headache</b> suggests <b>intracranial hemorrhage</b> until proven otherwise. That is the only life-threatening finding here. An ANC of 900 is mild neutropenia and hallway walking with a mask is reasonable, mucositis management is correct as described, and the psychosocial distress is real but not immediately life-threatening.'},
{topic:'resp',hot:false,q:'CAUSE — What is physically happening to the alveoli in pneumonia?',o:['They collapse because surfactant production has stopped','They are compressed by air trapped in the pleural space','They fill with inflammatory fluid and exudate from infection','They over-inflate and trap air behind narrowed airways'],c:2,t:'single',r:'Infection inflames the alveoli and fills them with fluid/exudate, blocking gas exchange. That cause explains the crackles, dullness, and hypoxia you see.'},
{topic:'post',hot:true,q:'A client is at risk for acute respiratory distress syndrome (ARDS) after an extensive surgical procedure. The nurse assesses for which MOST COMMON early sign of ARDS?',o:['Diffuse bilateral expiratory wheezing on auscultation','Rapid onset of severe dyspnea and refractory hypoxemia','Central cyanosis of the lips and nail beds','Fine inspiratory crackles heard at both lung bases'],c:1,t:'single',r:'<b>Rapid onset of severe dyspnea</b> is the earliest and most common presenting sign of ARDS, usually within 24–48 hours of the precipitating event. <b>Cyanosis</b> and <b>crackles</b> are later findings that reflect more advanced hypoxemia, and <b>wheezing</b> points more toward bronchospasm/asthma than ARDS. Early dyspnea + refractory hypoxemia is the classic clue.'},
{topic:'eol',hot:false,q:'A family asks the nurse to stop the morphine for their actively dying father because they are afraid it will hasten his death. What is the nurse\'s priority response?',o:['Explore their fear and explain that titrated opioids relieve dyspnea and pain','Contact the provider to request a palliative care consultation','Reduce the dose by half and reassess the patient in one hour','Explain that the plan of care cannot be changed by the family'],c:0,t:'single',r:'Address the <b>fear driving the request</b> and teach the principle of double effect: doses titrated to comfort relieve suffering and do not hasten death. Arbitrarily halving the dose abandons the patient to symptoms, a flat refusal shuts down communication, and a consult delays a conversation the nurse can have now.'},
{topic:'resp',hot:true,q:'All of the following are EARLY signs of hypoxia EXCEPT:',o:['Anxiety','Restlessness','Tachycardia','Cyanosis'],c:3,t:'single',r:'Trap: cyanosis "looks like" hypoxia so it feels right. But cyanosis is a LATE sign — the early ones are restlessness, anxiety, and tachycardia. The EXCEPT is asking for the one that doesn\'t fit "early."'},
{topic:'cancer',hot:true,q:'Using the CAUTION (UP) warning signs of cancer, which findings should prompt the nurse to recommend further evaluation? Select all that apply.',o:['A nagging cough or persistent hoarseness','Obvious change in a wart or mole','A sore that does not heal','Mild seasonal nasal congestion that resolves with antihistamines','A change in bowel or bladder habits'],c:[0,1,2,4],t:'multi',r:'CAUTION + UP warning signs: <b>C</b>hange in bowel/bladder, <b>A</b> sore that won\'t heal, <b>U</b>nusual bleeding/discharge, <b>T</b>hickening/lump, <b>I</b>ndigestion/dysphagia, <b>O</b>bvious wart/mole change, <b>N</b>agging cough/hoarseness — plus <b>U</b>nexplained weight loss and <b>P</b>ernicious anemia. Seasonal congestion that resolves with antihistamines is a benign, self-limiting symptom — not a red flag.'},
{topic:'chronic',hot:false,q:'A patient with COPD, diabetes, and depression says he has stopped taking most of his medications because he cannot keep track of them. What is the nurse\'s best initial action?',o:['Refer him to a case manager for medication management support','Set up a weekly pill organizer and teach him to fill it','Ask him to describe how he currently takes each medication at home','Provide a written schedule with times and pictures of each pill'],c:2,t:'single',r:'<b>Assess before you intervene.</b> Every other option is a reasonable intervention, but choosing one before you know whether the barrier is cost, cognition, side effects, or complexity means you may solve the wrong problem. Casteel loads priority stems with good interventions to see whether you skip assessment.'},
{topic:'aging',hot:true,q:'An 82-year-old with a creatinine of 2.1 mg/dL is admitted after a fall. Which prescription should the nurse question FIRST?',o:['Vitamin D 1000 units PO daily','Diphenhydramine 50 mg PO at bedtime for sleep','Docusate sodium 100 mg PO twice daily','Acetaminophen 650 mg PO every 6 hours as needed'],c:1,t:'single',r:'Diphenhydramine is a <b>Beers-criteria</b> anticholinergic: sedation, confusion, urinary retention, and falls in an older adult who has already fallen. The others are appropriate. Acetaminophen at this dose is the safest analgesic here; docusate and vitamin D carry no fall risk.'},
{topic:'post',hot:true,q:'A patient 3 days post-op reports that something \'gave way\' in the abdominal incision while coughing. The nurse finds the wound edges separated with the fascia intact and no viscera visible. This is:',o:['A seroma, which should be cultured and managed with a pressure dressing','Normal separation of the epidermal layer expected at this stage of healing','Evisceration, requiring saline gauze and immediate surgical intervention','Dehiscence, requiring the surgeon to be notified and the patient kept NPO'],c:3,t:'single',r:'<b>Dehiscence</b> is separation of the wound layers without protrusion of viscera. <b>Evisceration</b> is dehiscence <b>plus</b> organ protrusion. The nursing response overlaps, but the terminology question is the point, and \'something gave way\' during coughing is the classic stem.'},
{topic:'cancer',hot:true,q:'During initiation, what normally prevents a mutated cell from becoming cancerous?',o:['DNA repair or apoptosis','Release of tumor-associated antigens','Hyperplasia of surrounding tissue','Angiogenesis and invasion'],c:0,t:'single',r:'Carcinogens cause DNA mutations, which are <b>normally reversed by DNA repair</b> or eliminated when the cell undergoes <b>apoptosis</b>. If neither occurs, the mutation is locked in and initiation is complete.'},
{topic:'aging',hot:false,q:'Which of the following is an example of a geriatric syndrome?',o:['Urinary incontinence','A laceration requiring sutures','A fractured femur from a motor vehicle crash','Acute appendicitis'],c:0,t:'single',r:'Geriatric syndromes include <b>skin impairment, poor nutrition, falls, urinary incontinence, cognitive impairment, and sleep disturbances</b>. They are multifactorial conditions common in older adults, not single-cause acute injuries or illnesses.'},
{topic:'resp',hot:true,q:'All of the following require AIRBORNE precautions EXCEPT:',o:['Tuberculosis, which requires a negative-pressure room','Measles, which spreads on small airborne particles','Varicella, which stays suspended in room air','Bacterial pneumonia, which requires droplet precautions'],c:3,t:'single',r:'TB, measles, and varicella are airborne ("My Chicken Hez TB"). Bacterial pneumonia is generally droplet, not airborne — the EXCEPT. Watch for the one that uses a different precaution type.'},
{topic:'cancer',hot:false,q:'When do acute radiation toxicities typically begin?',o:['At about 6 months','Only after treatment is completed','Within 2 weeks of starting treatment','Immediately after the first session'],c:2,t:'single',r:'<b>Acute or early toxicities begin within 2 weeks</b> of treatment initiation, affecting <b>skin, GI tract, and bone marrow</b>: radiodermatitis, stomatitis, mucositis, esophagitis, anorexia, nausea, vomiting, diarrhea, anemia, leukopenia, thrombocytopenia. Systemic effects are fatigue, malaise, and anorexia.'},
{topic:'resp',hot:true,q:'Which is NOT an appropriate action for a dislodged chest tube?',o:['Tape an occlusive dressing on all 4 sides','Monitor for signs of tension pneumothorax','Notify the provider','Cover the site with petroleum gauze taped on 3 sides'],c:0,t:'single',r:'Taping all 4 sides traps air and can cause a tension pneumothorax — that\'s the wrong action the "NOT" is fishing for. Three sides lets air escape. The other options are all correct.'},
{topic:'post',hot:true,q:'The nurse receives four postoperative patients in report. Which patient should the nurse assess FIRST?',o:['A patient 4 hours post-op who is restless with an oxygen saturation of 90%','A patient 1 day post-op with a temperature of 100.2F and clear lungs','A patient 2 days post-op reporting incisional pain rated 7 of 10','A patient 6 hours post-op with 40 mL of serosanguineous drainage'],c:0,t:'single',r:'<b>Restlessness is the earliest sign of hypoxia</b>, and combined with a saturation of 90% it signals a failing airway or gas exchange. A low-grade temp in the first 24 hours is usually atelectasis, pain of 7 needs treatment but not first, and serosanguineous drainage in that volume is expected. All four are real findings; rank them by how fast each one kills.'},
{topic:'resp',hot:true,q:'A nurse must give morning meds, hang a new IV bag, ambulate a patient, and respond to a vent alarm. Which does the nurse address FIRST?',o:['Ambulation','Hanging the IV bag','Morning meds','The ventilator alarm'],c:3,t:'single',r:'A ventilator alarm is an airway/breathing issue and takes priority over routine tasks. ABCs first — always rule out a true emergency (disconnection, obstruction, distress) before scheduled care.'},
{topic:'resp',hot:true,q:'Which findings in a patient with obstructive sleep apnea should the nurse expect? Select all that apply.',o:['Bradycardia during the day','Excessive daytime sleepiness','Weight loss over recent months','Loud snoring with witnessed apneic periods','Morning headache','Difficulty staying asleep at night'],c:[1,3,4,5],t:'multi',r:'Repeated airway collapse causes <b>snoring, apnea, fragmented sleep, morning headache from CO2 retention, and daytime sleepiness</b>. Untreated OSA leads to hypertension and dysrhythmias, not daytime bradycardia. Obesity is a risk factor, so weight gain is more typical than loss.'},
{topic:'pre',hot:true,q:'Regarding informed consent, the nurse\'s role is to:',o:['Obtain a family member\'s signature when the patient is anxious','Provide a detailed explanation of the procedure, risks, and alternatives','Have the patient sign before giving the preoperative sedative, then proceed regardless of questions','Witness the voluntary signature and verify understanding, notifying the surgeon if there are gaps'],c:3,t:'single',r:'The <b>surgeon explains</b> procedure/risks/alternatives; the <b>nurse witnesses</b> the signature and verifies understanding, alerting the surgeon to any gaps. The \'sign before sedation\' option is half-right (consent IS signed before psychoactive meds) but wrong because the nurse must NOT proceed if the patient still has questions. A family member signs only if the patient is legally unable to consent — not merely anxious. The plausible half-truths are the trap.'},
{topic:'pre',hot:true,q:'The overall GOAL of preoperative nursing is to:',o:['Optimize the patient physically and psychologically before surgery','Begin discharge teaching and arrange the home care referral early','Establish IV access and hang the prophylactic antibiotic on time','Obtain the consent signature and verify the chart is fully assembled'],c:0,t:'single',r:'The overall GOAL of preop nursing is to <b>prepare the patient (body and mind) and make them as healthy/low-risk as possible</b> before surgery. The others are real preop NURSING TASKS that fall under that goal — witnessing consent, discharge planning, IV access/antibiotics — but they are specific actions, not the overarching goal. Watch for \'goal\' vs. \'task\' wording.'},
{topic:'chronic',hot:true,q:'Which phrasing reflects appropriate person-first language?',o:['A wheelchair-bound person','The handicapped patient','A disabled person','A person with a disability'],c:3,t:'single',r:'<b>Person-first language</b> names the person before the condition. The disability is something they <b>have</b>, not what they <b>are</b>. This is a stated expectation, not a stylistic preference.'},
{topic:'post',hot:true,q:'Which factor STIMULATES (promotes) the wound healing process in a postoperative client?',o:['Sufficient oxygenation','Hemorrhage','Nutritional deficiencies','Immobility'],c:0,t:'single',r:'<b>Sufficient oxygenation</b> drives wound healing — oxygen is required for collagen synthesis, cellular energy production, immune cell function, and angiogenesis. <b>Hemorrhage</b> (blood/volume loss), <b>immobility</b> (poor perfusion), and <b>nutritional deficiencies</b> (no protein/vitamin C/zinc building blocks) all IMPAIR healing. The question asks what helps, not what harms — read the stem carefully.'},
{topic:'aging',hot:true,q:'The master principle that explains why older adults tolerate illness, surgery, and medications poorly is that aging reduces:',o:['The total number of chronic diseases already present','The overall need for prescription medication therapy','Physiologic reserve across every body system','Baseline intelligence and short-term memory capacity'],c:2,t:'single',r:'Aging = <b>less physiologic reserve</b>. Each system still works at rest but has little extra capacity to handle stress (surgery, infection, blood loss, new drugs). This single idea drives nearly every geriatric exam answer.'},
{topic:'pre',hot:true,q:'The preoperative nurse is verifying the consent form. The patient says, \'I\'m not really sure what they\'re going to do.\' What is the nurse\'s best action?',o:['Have the patient sign anyway to avoid delay','Notify the surgeon to clarify before the patient signs','Explain the surgical procedure in detail','Witness the signature and proceed'],c:1,t:'single',r:'If the patient doesn\'t understand, consent is not informed — <b>notify the surgeon to clarify</b>, since the surgeon (not the nurse) explains the procedure/risks. The nurse cannot supply that explanation, must never have an uninformed patient sign, and cannot witness a signature for someone who doesn\'t understand.'},
{topic:'cancer',hot:false,q:'Which medical management is used for spinal cord compression?',o:['Radiation therapy, surgery, and vertebral augmentation','Isotonic saline followed by a bisphosphonate','Allopurinol with aggressive hydration','Anticoagulation and thoracic stenting'],c:0,t:'single',r:'Spinal cord compression is treated with <b>radiation therapy, surgery, and vertebral augmentation</b>, with corticosteroids to reduce cord edema. Nursing focuses on <b>pain control and preventing complications of immobility</b>.'},
{topic:'aging',hot:true,q:'An older adult\'s laboratory work shows a low hemoglobin. Which age-related change best explains the increased incidence of anemia?',o:['Increased gastric motility causes iron loss','Elastin production accelerates in the marrow','Kidney mass increases, raising erythropoietin','Hematopoietic changes reduce red blood cell production'],c:3,t:'single',r:'Aging alters the <b>hematopoietic system</b>, lowering RBC production. Kidney mass <b>decreases</b> with age, which also reduces erythropoietin. Gastric motility <b>slows</b>, it does not increase.'},
{topic:'eol',hot:false,q:'Which document translates a seriously ill patient\'s wishes into portable medical orders signed by a provider?',o:['A durable power of attorney naming a healthcare decision maker','The admission packet documenting the patient\'s code status choice','POLST, a set of provider-signed portable medical orders','A living will, which states preferences but is not an order set'],c:2,t:'single',r:'<b>POLST</b> converts patient preferences into actionable medical orders that transfer across care settings, signed by patient/surrogate and provider. Advance directives also include the living will and durable power of attorney for health care.'},
{topic:'resp',hot:true,q:'A patient reports hoarseness that has lasted three weeks. What is the nurse\'s priority action?',o:['Reassure the patient that laryngitis is self-limiting','Suggest over-the-counter throat lozenges','Recommend voice rest and reassess in one month','Facilitate evaluation for possible laryngeal cancer'],c:3,t:'single',r:'<b>Hoarseness persisting beyond 2 weeks is the earliest sign of laryngeal cancer</b> and requires evaluation. Reassurance or watchful waiting delays diagnosis.'},
{topic:'post',hot:true,q:'On admission to the PACU, the nurse\'s FIRST priority assessment is:',o:['Pain level and last analgesic given','Level of consciousness and orientation','Surgical site, dressing, and drainage','Airway patency, breathing, and circulation'],c:3,t:'single',r:'PACU priority is always <b>ABCs</b> — anesthesia depresses airway reflexes and respiration, so a patent airway/oxygenation comes first. LOC, pain, and the surgical site are all genuinely assessed in PACU (not throwaways), but they come AFTER you\'ve confirmed the patient is breathing and perfusing. Use the airway-first rule when options are all real assessments.'},
{topic:'intra',hot:true,q:'The circulating nurse\'s intraoperative priorities center on patient SAFETY. Which is a key responsibility?',o:['Labeling and handling tissue specimens directly at the sterile field','Monitoring vital signs continuously and titrating the anesthetic agent','Coordinating the room: positioning, counts, asepsis, and the time-out','Setting up the sterile field and passing instruments to the surgeon'],c:2,t:'single',r:'The <b>circulating nurse</b> manages the whole room from outside the sterile field — positioning, sponge/needle/instrument counts, asepsis, and time-out verification. Setting up the sterile field and passing instruments is the <b>scrub</b> role; monitoring/titrating anesthesia is the <b>CRNA/anesthesiologist</b>; specimen handling is shared but is a task, not the circulator\'s central safety role. Each distractor is a real OR job assigned to the wrong person.'},
{topic:'cancer',hot:true,q:'Which describes the difference between an irritant and a vesicant in extravasation?',o:['Both cause identical reactions of equal severity','Irritants cause necrosis; vesicants cause only redness','Neither requires stopping the infusion','Irritants cause localized inflammation; vesicants cause tissue damage and necrosis'],c:3,t:'single',r:'<b>Irritants cause a localized inflammatory reaction. Vesicants cause inflammation, tissue damage, and necrosis.</b> For either, <b>stop the infusion but do NOT remove the IV</b> — residual drug is aspirated through the catheter first.'},
{topic:'resp',hot:true,q:'A patient with pneumonia who was alert this morning is now confused and pulling at the sheets. The family says "that\'s not like him." What is the nurse\'s priority interpretation?',o:['Sundowning that can safely be ignored overnight','Normal aging that explains the change in behavior','A possible sign of worsening hypoxia or sepsis','Boredom from being confined to the room all day'],c:2,t:'single',r:'A NEW change in mental status — especially in an older adult with pneumonia — is a red flag for hypoxia, sepsis, or deterioration. Assess oxygenation and perfusion; don\'t dismiss it as expected.'},
{topic:'resp',hot:true,q:'Which breath sound is considered a medical EMERGENCY requiring immediate attention?',o:['Crackles','Stridor','Rhonchi','Wheezes'],c:1,t:'single',r:'<b>Stridor</b> signals upper-airway obstruction — a true emergency (anaphylaxis, foreign body, severe croup). Act on the airway immediately.'},
{topic:'resp',hot:true,q:'Which finding in a chest-tube patient is the ONLY one that signals an emergency requiring you to notify the provider?',o:['Continuous bubbling in the water-seal chamber','Gentle tidaling in the water seal','50 mL of serosanguineous drainage over a shift','Continuous bubbling in the suction chamber on wall suction'],c:0,t:'single',r:'Tidaling is normal, suction-chamber bubbling on wall suction is expected, and modest drainage is fine. Continuous WATER-SEAL bubbling = air leak / possible tension pneumothorax — the one true emergency here.'},
{topic:'cancer',hot:true,q:'Why is a neutropenic cancer patient at risk of having a serious infection go unnoticed?',o:['Prophylactic antibiotics suppress every early symptom of infection','Too few neutrophils to mount inflammation, so infection hides','Neutropenia itself confers temporary immunity to bacterial invasion','A persistently high fever masks the more localized signs of infection'],c:1,t:'single',r:'With treatment-induced neutropenia the patient lacks the white cells that create the usual inflammatory signs, so <b>infection can be present while the patient appears almost asymptomatic</b> — a low-grade fever may be the ONLY clue. They are MORE vulnerable, not immune, and antibiotics treat infection rather than hide it. This is why any temperature elevation is treated as an emergency.'},
{topic:'aging',hot:false,q:'Which findings represent normal age-related changes rather than problems requiring workup? Select all that apply.',o:['Slower reaction time','Sudden onset of confusion over two days','Decreased bone density','Unintentional 12-pound weight loss in three months','Increased residual lung volume','Thinning of the vaginal wall'],c:[0,2,4,5],t:'multi',r:'Normal aging: increased residual volume, decreased bone density and muscle mass, reproductive tissue changes, and slower reaction times. <b>Sudden confusion and unintentional weight loss are never normal aging</b> — both require assessment and reporting.'},
{topic:'post',hot:true,q:'To prevent pneumonia and protect the pulmonary system, which postoperative nursing intervention is MOST essential?',o:['Ambulate the client as soon as possible','Assist with incentive spirometry every 6 hours','Position the client supine','Assess breath sounds at least every 2 hours'],c:0,t:'single',r:'<b>Early ambulation</b> is the single most effective postop pulmonary intervention — it promotes full lung expansion, mobilizes secretions, and improves circulation. Incentive spirometry is important but should be done every <b>1–2 hours</b> (not every 6); assessing breath sounds <b>monitors</b> but doesn\'t prevent complications; and a <b>supine</b> position restricts lung expansion (semi-Fowler\'s is better). Each distractor is a real intervention that\'s either mistimed, passive, or counterproductive.'},
{topic:'aging',hot:false,q:'A nurse is caring for a group of older adults with an experienced UAP. Which assignment is appropriate?',o:['Feed a patient who was just started on a dysphagia diet','Assist a stable patient with dementia to ambulate to the bathroom','Check whether a newly confused patient\'s confusion is improving','Take vital signs on a patient one hour after a new antihypertensive'],c:1,t:'single',r:'Ambulating a <b>stable</b> patient with chronic dementia is routine care. Judging whether confusion is improving is assessment. A patient <b>newly</b> placed on a dysphagia diet needs a nurse to evaluate swallowing safety. Vitals after a first dose of a new antihypertensive are being used for clinical decision-making, so the nurse should obtain them.'},
{topic:'resp',hot:true,q:'A post-operative patient has decreased breath sounds in the right base, SpO₂ 89%, and shallow breathing due to incisional pain. Which is the priority nursing action to prevent atelectasis?',o:['Restrict oral fluids to reduce pulmonary congestion','Administer the ordered cough suppressant for comfort','Encourage incentive spirometer use and deep breathing','Position the patient flat and limit movement in bed'],c:2,t:'single',r:'Atelectasis is prevented by <b>lung expansion</b>: incentive spirometry, deep breathing, coughing, turning q2h, and early ambulation. Lying flat and suppressing cough would worsen collapse.'},
{topic:'cancer',hot:true,q:'What is the goal of chemotherapy?',o:['Stimulate tumor cells to differentiate into normal tissue','Eradicate enough tumor cells for the immune system to destroy the rest','Directly kill every malignant cell in the body','Prevent any normal cell from dividing'],c:1,t:'single',r:'Chemotherapy aims to <b>eradicate enough tumor cells that the immune system can destroy the remaining malignant cells</b>. <b>Actively proliferating cells are most sensitive; nondividing cells are least sensitive and potentially dangerous</b> because they survive and can re-enter the cell cycle.'},
{topic:'eol',hot:false,q:'A hospice patient with escalating cancer pain is on scheduled morphine. Which new order should the nurse question?',o:['Increase the morphine dose for uncontrolled pain','Add a scheduled stimulant laxative with the morphine','Hold morphine if the respiratory rate is below 12','Provide oral care every 2 hours for dry mouth'],c:2,t:'single',r:'In hospice, the goal is comfort, and <b>tolerance to respiratory depression develops</b> while tolerance to analgesia lags. A rigid hold parameter on a scheduled opioid undertreats pain and is inconsistent with the plan of care. Opioids always need a bowel regimen, oral care is standard, and titrating upward for uncontrolled pain is appropriate.'},
{topic:'meds',hot:false,q:'Ondansetron (Zofran) is frequently given to oncology and postoperative patients. Its purpose connects to which problem?',o:['Procedural anxiety and anticipatory restlessness before surgery','Chemotherapy-induced diarrhea and abdominal cramping','Nausea and vomiting (PONV and chemo-induced)','Mucositis and painful oral ulceration from radiation therapy'],c:2,t:'single',r:'<b>Ondansetron</b> (5-HT3 antagonist) targets <b>nausea and vomiting</b> — postop and chemo-induced. The distractors are all real chemo/postop GI problems (diarrhea, mucositis) or periop symptoms (anxiety), which is what makes them tempting, but ondansetron specifically blocks the vomiting reflex; it doesn\'t treat diarrhea, anxiety, or mucositis.'},
{topic:'post',hot:true,q:'A new post-op patient presents with SpO2 90%, shallow respirations, and diminished breath sounds in the bases. What do you suspect this is?',o:['Pulmonary embolism','CHF','Pneumonia','Atelectasis'],c:3,t:'single',r:'<b>Atelectasis</b> (alveolar collapse) is the most common early postop respiratory complication: low SpO2, shallow breathing, and <b>diminished sounds at the bases</b>. Treat with incentive spirometry, deep breathing, coughing, and early ambulation. Pneumonia usually brings fever/productive cough; CHF brings crackles + fluid overload.'},
{topic:'cancer',hot:true,q:'Which are potential long-term complications of cancer treatment? Select all that apply.',o:['Cardiovascular toxicity including myocardial infarction','Improved bone density','Hypothyroidism','Secondary cancers such as acute myeloid leukemia','Permanent cure of all chronic disease','Infertility and decreased libido'],c:[0,2,3,5],t:'multi',r:'Long-term complications include <b>hypothyroidism, secondary cancers (AML, myelodysplastic syndromes), cardiovascular toxicity, pericarditis, pneumonitis, infertility, decreased libido, osteoporosis, dental caries, dry mouth, dysphagia, immune dysfunction, and herpes zoster/varicella</b>. Treatment <b>reduces</b> bone density.'},
{topic:'meds',hot:true,q:'A patient is started on a medication known to be hepatotoxic. Which nursing actions are appropriate? Select all that apply.',o:['Review the full medication and herbal list for other liver-stressing agents','Monitor liver function tests (AST, ALT, bilirubin)','Encourage extra acetaminophen for any discomfort','Assess for jaundice, dark urine, and right-upper-quadrant pain','Teach the patient to avoid or limit alcohol'],c:[0,1,3,4],t:'multi',r:'For a hepatotoxic drug: monitor <b>LFTs (AST, ALT, bilirubin)</b>, limit alcohol, watch for <b>jaundice, dark urine, RUQ pain, fatigue</b>, and reconcile other liver-stressing meds/herbs. <b>Encouraging extra acetaminophen is wrong</b> — it adds more hepatotoxic load. Stacking liver-toxic agents compounds the damage.'},
{topic:'cancer',hot:false,q:'A Pap smear shows cervical dysplasia. How does the nurse describe this finding?',o:['Replacement of one mature cell type by another','Disordered abnormal growth that is precancerous','A normal adaptive response to inflammation','An invasive cancer requiring immediate surgery'],c:1,t:'single',r:'<b>Dysplasia is disordered, abnormal cell growth and is precancerous.</b> It is not yet cancer, which is why it is monitored and treated before progression. Replacement of one mature cell type by another is <b>metaplasia</b>.'},
{topic:'cancer',hot:true,q:'Carcinogenesis (how a normal cell becomes cancer) occurs in three steps. The correct order is:',o:['Initiation → promotion → progression','Metastasis → initiation → promotion','Progression → promotion → initiation','Promotion → initiation → progression'],c:0,t:'single',r:'<b>Initiation</b> (DNA mutation) → <b>promotion</b> (repeated exposure makes mutated cells proliferate; reversible if agent removed) → <b>progression</b> (cells become malignant, grow blood supply via angiogenesis, invade, and metastasize).'},
{topic:'resp',hot:true,q:'A patient with a new tracheostomy suddenly has difficulty breathing and the tube appears dislodged. Which items at the bedside are MOST important right now? (Select all that apply)',o:['A box of oral medications','Spare trach tube (same size and one size smaller)','Obturator','Suction equipment','A manual resuscitation bag'],c:[1,2,3,4],t:'multi',r:'For an airway emergency you need the obturator, spare trach tubes (same + smaller), a resuscitation bag, and suction. Oral meds are irrelevant to the immediate airway threat.'},
{topic:'aging',hot:true,q:'An 80-year-old asks the nurse about sexual activity. What is the most accurate response?',o:['Sexual activity remains important; decline usually relates to partner loss or health issues','Sexual concerns are not appropriate to discuss at this age','Sexual activity naturally ends in the eighth decade','Physical changes make sexual activity unsafe for older adults'],c:0,t:'single',r:'<b>Sexual activity remains important in older adulthood.</b> Decline is generally tied to <b>loss of a partner or health problems</b>, not to age itself. Female changes include thinning of the vaginal wall, decreased secretions, and uterine atrophy; male changes include less firm testes and decreased testosterone.'},
