{topic:'meds',hot:true,q:'A patient with malignant hyperthermia needs emergency drug therapy. Which medication treats the condition?',o:['Dantrolene','Epinephrine','Flumazenil','Naloxone'],c:0,t:'single',r:'<b>Dantrolene</b> is the antidote for <b>malignant hyperthermia</b> — it\'s a skeletal muscle relaxant that stops the hypermetabolic calcium release. (Naloxone→opioids, flumazenil→benzodiazepines.)'},
{topic:'resp',hot:true,q:'Which of the following is NOT part of the VAP bundle?',o:['Daily oral care with chlorhexidine','Elevate the head of the bed 30–45°','Keep the patient flat to promote rest','Daily sedation interruption / readiness-to-wean'],c:2,t:'single',r:'Three are real VAP-bundle elements. The impostor is B — keeping the patient flat INCREASES aspiration risk and is the opposite of the bundle. "NOT" questions hide one false action among true ones.'},
{topic:'cancer',hot:true,q:'A patient is receiving chemotherapy with a platelet count of 22,000/mm3. Which nursing actions are indicated? Select all that apply.',o:['Avoid rectal temperatures, suppositories, and enemas','Use an electric razor rather than a blade for shaving','Encourage vigorous nose blowing to clear congestion','Administer prescribed aspirin for a reported headache','Hold pressure on venipuncture sites for at least 5 minutes','Provide a soft-bristled toothbrush and skip flossing'],c:[0,1,4,5],t:'multi',r:'Thrombocytopenia precautions prevent <b>any breach of mucosa or skin</b>. Aspirin is contraindicated because it inhibits platelet aggregation on top of an already low count. Vigorous nose blowing provokes epistaxis. The others are standard bleeding precautions. Watch that the incorrect options are both things a patient would plausibly ask for.'},
{topic:'resp',hot:false,q:'Which statement about a permanent tracheostomy after total laryngectomy is accurate?',o:['Swimming is safe as long as the head stays above water','The patient can still breathe normally through the nose','The stoma will close on its own within several months','Air no longer passes through the nose, so it must be humidified'],c:3,t:'single',r:'The airway is <b>permanently rerouted to the neck stoma</b>. The nose no longer warms, filters, or humidifies air, so external humidification and stoma protection are essential. <b>These patients can never swim.</b>'},
{topic:'pre',hot:true,q:'A patient scheduled for a below-the-knee amputation takes aspirin 325 mg daily and cilostazol 100 mg twice daily. What is the nurse\'s primary concern?',o:['Neither drug affects the perioperative period','The combination will raise the blood pressure intraoperatively','Cilostazol counteracts the effect of aspirin','Two antiplatelet agents together increase surgical bleeding risk'],c:3,t:'single',r:'<b>Aspirin and cilostazol are both antiplatelet agents.</b> Stacked, they markedly increase bleeding risk. Aspirin inhibits platelets irreversibly for their 7 to 10 day lifespan. Read a medication list as a whole, not one line at a time.'},
{topic:'pre',hot:true,q:'A patient with type 1 diabetes is NPO for surgery at 10:00. The order reads insulin 6 units regular with 15 units NPH subcutaneously every morning. What should the nurse do?',o:['Hold both doses without notifying anyone','Give only the NPH and hold the regular','Clarify the perioperative insulin plan with the provider','Administer the full dose as ordered'],c:2,t:'single',r:'A <b>full mealtime dose with no intake causes hypoglycemia under anesthesia</b>, where the adrenergic warning signs are masked. The dose is usually adjusted, but the nurse <b>clarifies rather than unilaterally holding or modifying</b>.'},
{topic:'pre',hot:true,q:'A patient is scheduled for surgery and has an order for lorazepam on call to the OR. The consent has not yet been signed. What should the nurse do?',o:['Give the lorazepam then obtain the signature','Give the drug and document consent as implied','Have a family member sign in his place','Ensure consent is signed before giving the sedative'],c:3,t:'single',r:'<b>A sedated patient cannot give informed consent.</b> Consent must be obtained <b>before</b> premedication. A signature taken after sedation is not valid, and family cannot consent for a competent adult.'},
{topic:'pre',hot:false,q:'Which finding during preoperative screening suggests a possible latex allergy?',o:['Wheezing during cold weather','Itching and swelling after eating bananas, avocado, or kiwi','Nausea after receiving general anesthesia','A rash after taking penicillin as a child'],c:1,t:'single',r:'<b>Banana, avocado, kiwi, and chestnut cross-react with latex.</b> Also ask about reactions to gloves, balloons, condoms, adhesive tape, and elastic. <b>NKDA does not mean no latex allergy</b> — it is screened separately.'},
{topic:'pre',hot:true,q:'A patient with a documented latex allergy is scheduled for surgery. How should the case be scheduled?',o:['Any time, with latex-free gloves only','First case of the day','Only after the room is terminally cleaned mid-day','Last case of the day'],c:1,t:'single',r:'<b>Latex-allergic patients go FIRST</b> so airborne latex particles from earlier cases have settled and cleared. Scheduling <b>last</b> is correct for <b>infection</b> isolation, and transferring that rule here is the trap.'},
{topic:'pre',hot:false,q:'A patient with an advance directive is going to surgery. What is the nurse\'s responsibility?',o:['Ensure resuscitation wishes are reviewed and documented before surgery','Assume the directive is suspended during the procedure','Ask the family to revoke it for the operative period','Remove the directive from the chart until after surgery'],c:0,t:'single',r:'An advance directive is <b>not automatically suspended</b> in the OR, and it is <b>not automatically a DNR</b>. Any resuscitation limits require <b>reconsideration, explicit discussion, documentation, and communication to the whole team</b> before the procedure.'},
{topic:'pre',hot:false,q:'Which preoperative teaching is most important for a patient with a 40 pack-year smoking history?',o:['Avoid pain medication so breathing is not suppressed','Remain flat in bed for the first 24 hours','Turn, cough, deep breathe and use the incentive spirometer','Limit fluids after surgery to reduce secretions'],c:2,t:'single',r:'A heavy smoking history is the single largest risk for <b>atelectasis and pneumonia</b>. Teaching happens <b>before</b> surgery, while he is alert and not sedated. Restricting fluids thickens secretions, and withholding analgesia prevents the deep breathing that keeps alveoli open.'},
{topic:'pre',hot:false,q:'Which preoperative assessments are essential for a patient with diabetes, CAD, and PVD undergoing amputation? Select all that apply.',o:['Neurovascular check of both lower extremities','Pulmonary function testing on every patient','Coagulation studies and type and screen','ECG and cardiac clearance','Bone density scan','Blood glucose and A1C'],c:[0,2,3,5],t:'multi',r:'Assessment is driven by <b>his specific risk list</b>: diabetes needs glucose and A1C, CAD needs an ECG and clearance, PVD means checking <b>both</b> legs since the remaining limb is also at risk, and dual antiplatelet therapy needs coagulation studies and a type and screen.'},
{topic:'intra',hot:true,q:'What is verified during the surgical time-out?',o:['The anesthesiologist\'s credentials','Correct patient, correct procedure, correct site','The patient\'s insurance authorization','The instrument and sponge counts'],c:1,t:'single',r:'The <b>Time-Out</b> happens immediately before incision with the entire team stopped, and verifies <b>correct patient, correct procedure, correct site</b>. Counts and equipment checks are part of the broader safety checklist but are not the time-out itself.'},
{topic:'intra',hot:false,q:'During handoff to the holding area nurse, which SBAR element includes the patient\'s last insulin dose and NPO time?',o:['Recommendation','Situation','Assessment','Background'],c:2,t:'single',r:'<b>Assessment</b> carries the current clinical data: vital signs, last glucose, NPO time, medications held and given, and checklist status. <b>Situation</b> is why he is here, <b>Background</b> is his history, and <b>Recommendation</b> is what the receiving nurse should watch for.'},
{topic:'intra',hot:false,q:'A patient is being transferred to the OR holding area. What makes the handoff safe?',o:['A written note left in the chart','A verbal summary given while walking away','Reporting only the surgical site and allergies','Face-to-face report with opportunity to ask questions and read back'],c:3,t:'single',r:'A safe handoff is <b>face to face, uninterrupted, and two-directional</b>, with a chance to ask questions and confirm understanding. A one-directional report is not a handoff.'},
{topic:'post',hot:true,q:'Four hours after a below-the-knee amputation the nurse finds sanguineous drainage saturating the dressing. What is the priority action?',o:['Reinforce the dressing, apply pressure, and notify the surgeon','Document the finding and recheck in one hour','Remove the dressing to inspect the incision','Apply ice and elevate the limb without notifying anyone'],c:0,t:'single',r:'<b>Reinforce, do not remove</b> — the first dressing after an amputation is changed by the surgeon. Assess vital signs, <b>mark the saturation edge with the time</b> so change is measurable, apply pressure, and notify. This patient is on <b>two antiplatelet drugs</b>. Keep a <b>tourniquet at the bedside</b>.'},
{topic:'post',hot:true,q:'Which postoperative complication is this patient at highest risk for: 53-year-old, 40 pack-year smoker, s/p general anesthesia for BKA?',o:['Atelectasis and pneumonia','Wound dehiscence of the abdomen','Malignant hyperthermia','Hypoglycemia from the anesthetic agent'],c:0,t:'single',r:'A <b>40 pack-year history plus general anesthesia plus immobility</b> makes <b>atelectasis and pneumonia</b> the leading risk. Malignant hyperthermia is an intraoperative reaction to specific triggers, and abdominal dehiscence does not apply to a leg amputation.'},
{topic:'post',hot:false,q:'Which leg exercises should the nurse teach after a below-the-knee amputation to prevent venous stasis?',o:['Vigorous exercise of both legs immediately','No movement of either leg for 48 hours','Dorsiflexion and ankle rotation on the non-operative side','Only passive range of motion by staff'],c:2,t:'single',r:'Teach <b>dorsiflexion and ankle rotation on the non-operative side</b>, get him <b>out of bed to a chair early and often</b>, and change position frequently while on bed rest. Immobility is what causes the DVT.'},
{topic:'post',hot:false,q:'A patient refuses to use the incentive spirometer after surgery because of incisional pain. What should the nurse do first?',o:['Document the refusal and try again next shift','Explain that pain medication will suppress his breathing','Medicate for pain, then assist with splinted deep breathing','Notify the provider that the patient is noncompliant'],c:2,t:'single',r:'<b>Pain control is a respiratory intervention.</b> He will not breathe deeply, cough, or ambulate if it hurts too much, and shallow breathing plus immobility is exactly how atelectasis develops. Medicate first, then do the pulmonary hygiene with splinting.'},
{topic:'post',hot:true,q:'Which complications should the nurse anticipate after a below-the-knee amputation? Select all that apply.',o:['Malignant hyperthermia','Body image disturbance','Hemorrhage','Hip flexion contracture','Increased intracranial pressure','Phantom limb pain'],c:[1,2,3,5],t:'multi',r:'Amputation-specific risks are <b>hemorrhage</b> (keep a tourniquet at the bedside), <b>phantom limb pain</b> (real pain, treat it), <b>contracture</b> from prolonged hip flexion, and <b>body image disturbance</b>. MH is an intraoperative anesthetic reaction and ICP is unrelated.'},
{topic:'meds',hot:true,q:'Which analgesic class is NOT anti-inflammatory?',o:['Ibuprofen','Acetaminophen','Aspirin','Naproxen'],c:1,t:'single',r:'<b>Acetaminophen inhibits prostaglandin synthesis in the CNS</b>, so it reduces pain and fever but has <b>no anti-inflammatory effect</b>. NSAIDs and aspirin inhibit COX peripherally and do reduce inflammation.'},
{topic:'meds',hot:true,q:'A patient takes ibuprofen regularly. Which laboratory values should the nurse monitor?',o:['Amylase and lipase','TSH and free T4','BUN and creatinine','AST and ALT'],c:2,t:'single',r:'<b>NSAIDs are nephrotoxic</b> — monitor <b>BUN and creatinine</b>. <b>Acetaminophen is hepatotoxic</b> — that is the one requiring <b>AST and ALT</b>. He swaps the organ and the lab.'},
{topic:'meds',hot:false,q:'A parent asks about giving aspirin to a child with influenza. What is the nurse\'s response?',o:['Aspirin is safe if given with food','Aspirin should be given only at bedtime','Aspirin is avoided in children with viral infections due to Reye syndrome','Aspirin is preferred over acetaminophen for children'],c:2,t:'single',r:'<b>Reye syndrome</b> is why aspirin is avoided in children with a viral illness. Other aspirin-specific effects are <b>tinnitus</b> as an early toxicity sign and bleeding from <b>irreversible</b> platelet inhibition.'},
{topic:'meds',hot:false,q:'Which nursing intervention is essential for a patient on scheduled opioids?',o:['Encourage fluid and fiber intake to prevent constipation','Withhold the dose if the patient is sleeping comfortably','Restrict fluids to reduce sedation','Administer only after pain reaches 8 out of 10'],c:0,t:'single',r:'<b>Constipation is the opioid effect that never resolves with tolerance</b>, so fluids, fiber, and a bowel regimen start with the first dose. Also monitor respiratory rate and <b>hold if under 12/min</b>.'},
];

<h2 class="sec-title"><span class="sec-emoji">🔎</span> How to Answer His Questions</h2>
<p class="intro-line">Not content. Method. Read this before every exam — it is the same seven moves every time.</p>

<div class="tipbar">🧠 <b>Most wrong answers are reading errors, not knowledge errors.</b> You knew it. You answered a different question than the one on the screen.</div>

<div class="card" style="border-color:var(--purple)">
  <h3>The 5-step read</h3>
  <ol class="chainlist">
    <li><b>1. Find the actual question.</b> Cover the options. Read the last sentence first — that is what is being asked. The paragraph above it is setup.</li>
    <li><b>2. Answer it in your head</b> before looking at the options. If you have an answer already, the distractors cannot pull you.</li>
    <li><b>3. Circle the qualifier.</b> <b>First · Best · Priority · Most · Initial · Except · NOT · All but</b>. These flip the whole question.</li>
    <li><b>4. Eliminate on principle, not on feel.</b> Cross off anything that is unsafe, outside nursing scope, or factually wrong — regardless of how good it sounds.</li>
    <li><b>5. Between the last two, ask what makes them different.</b> There is exactly one difference. That difference is the question.</li>
  </ol>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>⭐ The question inside the question</h3>
  <p class="why-chain">Casteel rarely asks "what is X." He asks a question whose <b>real</b> question is hidden one layer down. Learn to name the hidden one.</p>
  <table class="lab">
    <tr><th>What it looks like</th><th>What he is actually asking</th></tr>
    <tr><td>Four patients, all with something wrong</td><td><b>Which one dies first if I do nothing?</b></td></tr>
    <tr><td>"Which action should the nurse take first?"</td><td><b>Which can I do myself, right now, without an order?</b></td></tr>
    <tr><td>"Which finding requires immediate follow-up?"</td><td><b>Which one is NOT expected for this situation?</b></td></tr>
    <tr><td>"Which statement indicates understanding?"</td><td><b>Which one is the correct teaching?</b> (three are wrong)</td></tr>
    <tr><td>"Which statement requires further teaching?"</td><td><b>Which one is the WRONG teaching?</b> (three are right)</td></tr>
    <tr><td>"Which order should the nurse question?"</td><td><b>Which order would harm THIS patient?</b> Match the drug to their condition</td></tr>
    <tr><td>"The nurse should assign which task to the UAP?"</td><td><b>Which task involves no assessment, teaching, evaluation, or judgment?</b></td></tr>
    <tr><td>A long backstory with one abnormal value</td><td><b>Do you know what that value means?</b> The story is padding</td></tr>
    <tr><td>"What is the nurse's best response?"</td><td><b>Which option explores instead of reassuring, redirecting, or fixing?</b></td></tr>
  </table>
  <div class="hy"><span class="tag">Do this out loud</span>Before you pick, say the hidden question to yourself in one sentence. If you cannot, you have not understood the item yet — reread the stem, not the options.</div>
</div>

<div class="card" style="border-color:var(--amber)">
  <h3>Wording that changes the answer</h3>
  <table class="lab">
    <tr><th>Word</th><th>What it demands</th></tr>
    <tr><td><b>FIRST / INITIAL</b></td><td>An action you can take <b>immediately and independently</b>. Not the best long-term plan</td></tr>
    <tr><td><b>BEST</b></td><td>The most complete and correct option, even if others are partly right</td></tr>
    <tr><td><b>PRIORITY / MOST IMPORTANT</b></td><td>What threatens life soonest. <b>ABC, then safety</b></td></tr>
    <tr><td><b>EXCEPT / NOT / ALL BUT</b></td><td>You are hunting the <b>ONE WRONG</b> answer. Three will be correct</td></tr>
    <tr><td><b>FURTHER TEACHING / NEEDS CORRECTION</b></td><td>Find the <b>wrong</b> statement</td></tr>
    <tr><td><b>INDICATES UNDERSTANDING / EFFECTIVE</b></td><td>Find the <b>right</b> statement</td></tr>
    <tr><td><b>EARLIEST / EARLY SIGN</b></td><td>The <b>subtle</b> one, not the dramatic one. Restlessness before cyanosis</td></tr>
    <tr><td><b>LATE SIGN</b></td><td>The dramatic one. Cyanosis, clubbing, bradycardia in ICP</td></tr>
    <tr><td><b>EXPECTED / NORMAL</b></td><td>He wants you to <b>leave it alone</b>. The trap is intervening on something normal</td></tr>
    <tr><td><b>UNEXPECTED / REQUIRES FOLLOW-UP</b></td><td>The abnormal one, buried among three expected findings</td></tr>
    <tr><td><b>SELECT ALL THAT APPLY</b></td><td>Judge <b>each option independently</b> as true or false. No partial credit — do not guess a count</td></tr>
  </table>
  <div class="trap"><span class="tag">The one that gets everyone</span><b>Missing a NOT or EXCEPT.</b> You answer perfectly and score zero. Slow down and mark the qualifier before you read a single option.</div>
</div>

<div class="card">
  <h3>Ranking when everything looks wrong</h3>
  <ol class="chainlist">
    <li><b>1. Airway</b> — obstruction, stridor, swelling, no gag, evisceration near the airway</li>
    <li><b>2. Breathing</b> — hypoxia, <b>restlessness</b>, silent chest, respiratory rate under 12 or over 30</li>
    <li><b>3. Circulation</b> — hemorrhage, shock, lethal dysrhythmia, potassium out of range</li>
    <li><b>4. Neuro change</b> — new confusion, decreasing LOC, new focal deficit</li>
    <li><b>5. Safety</b> — falls, wrong drug, allergy, infection risk</li>
    <li><b>6. Pain and comfort</b> — real, urgent, but rarely beats the four above</li>
    <li><b>7. Psychosocial and teaching</b> — matters, almost never the "first" answer in an unstable patient</li>
  </ol>
  <div class="hy"><span class="tag">The tiebreaker</span><b>Acute beats chronic. Unexpected beats expected. Unstable beats stable.</b> A patient whose problem is new and unexplained outranks one whose problem is severe but known and being treated.</div>
</div>

<div class="card">
  <h3>Assess or act?</h3>
  <table class="lab">
    <tr><th>Situation</th><th>Do this</th></tr>
    <tr><td>Patient is <b>stable</b>, data is incomplete</td><td><b>ASSESS.</b> Gather before you intervene</td></tr>
    <tr><td>Patient is <b>unstable</b> or in danger</td><td><b>ACT.</b> Reposition, oxygen, stop the infusion, hold the drug</td></tr>
    <tr><td>You already have the assessment data in the stem</td><td><b>ACT.</b> Reassessing what you were just told is stalling</td></tr>
    <tr><td>Options include both an assessment and calling the provider</td><td><b>Assess first</b> — you need something to report</td></tr>
  </table>
  <div class="trap"><span class="tag">The stalling answers</span><b>"Notify the provider," "document the finding," "continue to monitor," "reassess in one hour."</b> Occasionally correct, usually the safe-sounding option that does nothing. Ask: <i>is there something I can do right now that helps this patient?</i> If yes, that is the answer.</div>
</div>

<div class="card">
  <h3>Distractors he builds, and how to spot them</h3>
  <table class="lab">
    <tr><th>Type</th><th>How to catch it</th></tr>
    <tr><td><b>True but irrelevant</b></td><td>A correct fact that does not answer <i>this</i> question. Reread the stem</td></tr>
    <tr><td><b>Right action, wrong timing</b></td><td>Something you would do — later. Watch for FIRST</td></tr>
    <tr><td><b>Right action, wrong patient</b></td><td>Correct for a different condition. Match it to the stem's diagnosis</td></tr>
    <tr><td><b>The kind-sounding option</b></td><td>"Reassure her," "encourage him to stay positive," "let the family decide." Comforting, avoidant, wrong</td></tr>
    <tr><td><b>The intuitive-but-backwards</b></td><td>Head back for a nosebleed. Elevate an arterial leg. Rest for cancer fatigue</td></tr>
    <tr><td><b>The absolute</b></td><td><b>Always, never, all, none, only.</b> Usually wrong in nursing — but <b>not</b> for true absolutes: never IV push potassium, never crush an ER tablet, never give a drug on an allergy list</td></tr>
    <tr><td><b>The longest option</b></td><td>A real tell in many banks. <b>Not in this one</b> — I rebalanced it. Judge on content</td></tr>
  </table>
</div>

<div class="card" style="border-color:var(--teal)">
  <h3>🧠 Exam-day plan</h3>
  <ul class="clean">
    <li><b>The night before:</b> the <b>🎯 Trick Questions</b> section and one 25-question set. Not new content. Sleep beats cramming.</li>
    <li><b>Before you start:</b> two slow breaths. Remind yourself you are decoding questions, not recalling everything you know.</li>
    <li><b>One pass, steady pace.</b> Mark anything you are unsure of and move. Do not let one item eat your clock or your focus.</li>
    <li><b>Do not change answers</b> unless you find a qualifier you misread. First instinct on content is usually right; rereading the <i>qualifier</i> is the legitimate reason to switch.</li>
    <li><b>Reset ritual:</b> if you feel your focus scatter, stop, put the pen down, exhale once, then read the next stem's last sentence first. Ten seconds costs nothing and buys back the pace.</li>
    <li><b>You do not need every question.</b> You need to not lose the ones you already know to a misread qualifier. That is what this page protects.</li>
  </ul>
</div>

<script>
document.getElementById('sec-why').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🧠</span> Why Engine</h2>
<p class="intro-line">Casteel does not test the fact. He tests the <b>because</b>. Walk the chain forward and you can derive the sign, the priority, and the intervention even when the stem is worded in a way you have never seen.</p>

<div class="tipbar">📖 Read a chain, then close your eyes and say it out loud without looking. If you can only say step 1 and the last step, you memorized the fact and skipped the mechanism — which is exactly the gap his distractors are built to catch.</div>

<div class="card">
  <h3>🧓 Why an older adult crashes from something a 30-year-old shrugs off</h3>
  <ol class="chainlist">
    <li><b>1.</b> Every organ loses <b>reserve capacity</b> with age, so it works fine at rest but has nothing extra in the tank.</li>
    <li><b>2.</b> Surgery, infection, blood loss, or a new drug demands extra output from that organ.</li>
    <li><b>3.</b> The organ cannot deliver it <b>because</b> the reserve is already spent on baseline function.</li>
    <li><b>4.</b> The weakest system decompensates first — usually brain, kidney, or lung.</li>
    <li><b>5.</b> So the presentation is <b>confusion, falling urine output, or dyspnea</b> rather than the textbook symptom.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>He gives you a stem where the vital signs look almost normal and the only abnormal finding is new confusion. The normal vitals are the distractor. Reserve is gone, so the body cannot mount the fever or tachycardia a young patient would.</div>
</div>

<div class="card">
  <h3>💊 Why older adults need smaller drug doses</h3>
  <ol class="chainlist">
    <li><b>1.</b> <b>Less total body water</b> and <b>more body fat</b> change where the drug distributes.</li>
    <li><b>2.</b> Water-soluble drugs concentrate in a smaller water compartment, so serum levels run higher.</li>
    <li><b>3.</b> Fat-soluble drugs store in fat and release slowly, so the effect lingers.</li>
    <li><b>4.</b> <b>Liver mass and blood flow drop</b>, so metabolism slows and the drug is not broken down on schedule.</li>
    <li><b>5.</b> <b>Kidney mass and GFR drop</b>, so the metabolite is not excreted on schedule.</li>
    <li><b>6.</b> Drug accumulates → toxicity shows up as sedation, confusion, or a fall.</li>
  </ol>
  <div class="mnem"><div class="tag">Fast recall</div><div class="big">Start low, go slow — because of LIVER and KIDNEY</div><div class="exp">Not lungs and heart. Not stomach and intestines. Those are the distractors.</div></div>
</div>

<div class="card">
  <h3>🦠 Why a UTI presents as confusion</h3>
  <ol class="chainlist">
    <li><b>1.</b> Infection releases inflammatory cytokines into circulation.</li>
    <li><b>2.</b> The aging <b>blood-brain barrier is more permeable</b> and neuronal reserve is already reduced.</li>
    <li><b>3.</b> Cytokines plus dehydration plus any anticholinergic burden disrupt cerebral neurotransmission.</li>
    <li><b>4.</b> The brain, having the least reserve, fails first → <b>acute fluctuating confusion = delirium</b>.</li>
    <li><b>5.</b> Fever may be absent <b>because</b> the aging hypothalamus mounts a blunted febrile response.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>"Afebrile" in the stem does not rule out infection in an older adult. Acute change in mental status IS the infection presentation.</div>
</div>

<div class="card">
  <h3>♾️ Why chronic illness care is management, not cure</h3>
  <ol class="chainlist">
    <li><b>1.</b> The pathology is <b>permanent structural or functional change</b> — lost beta cells, remodeled airways, sclerosed nephrons.</li>
    <li><b>2.</b> Lost tissue does not regenerate, so the underlying defect cannot be removed.</li>
    <li><b>3.</b> The goal shifts to <b>controlling the variable that drives further damage</b> — glucose, BP, oxygenation.</li>
    <li><b>4.</b> Control requires daily patient behavior, not a single provider action.</li>
    <li><b>5.</b> So the nursing priority becomes <b>self-management teaching and adherence</b>, measured in complications prevented.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>Any option promising cure, resolution, or "once the labs normalize" is wrong by definition. He loves putting a hopeful, kind-sounding option in as a distractor.</div>
</div>

<div class="card">
  <h3>💊 Why polypharmacy is its own diagnosis</h3>
  <ol class="chainlist">
    <li><b>1.</b> Each chronic condition earns its own drug, often from its own specialist.</li>
    <li><b>2.</b> No one prescriber sees the full list <b>because</b> care is fragmented.</li>
    <li><b>3.</b> Interactions and duplicate therapeutic classes accumulate silently.</li>
    <li><b>4.</b> Aged liver and kidney clearance amplifies every one of those levels.</li>
    <li><b>5.</b> Result: an adverse drug event presenting as a fall, confusion, or GI bleed — which then gets treated with <b>another drug</b> (prescribing cascade).</li>
    <li><b>6.</b> So the highest-value nursing action is <b>medication reconciliation</b>, not adding an intervention.</li>
  </ol>
</div>












<div class="card">
  <h3>🎗️ Why chemo and radiation cause the exact symptoms they cause</h3>
  <ol class="chainlist">
    <li><b>1.</b> Both kill cells that are <b>actively dividing</b>. They cannot tell cancer from normal tissue.</li>
    <li><b>2.</b> The fastest-dividing normal tissues are <b>bone marrow, GI epithelium, and hair follicles</b>.</li>
    <li><b>3.</b> Marrow hit → ↓RBC = <b>anemia</b>, ↓WBC = <b>infection risk</b>, ↓platelets = <b>bleeding risk</b>.</li>
    <li><b>4.</b> GI epithelium hit → <b>mucositis, ulcers, nausea, diarrhea</b>.</li>
    <li><b>5.</b> Follicles hit → <b>alopecia</b>, reversible because stem cells survive.</li>
    <li><b>6.</b> So every side effect traces to one sentence: <b>rapidly dividing cells die first</b>.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>He asks which tissue is affected and offers muscle, brain, bone, or cartilage. Those are slow-dividing, so they are safe. Derive it — do not recall a list.</div>
</div>

<div class="card">
  <h3>🩸 Why neutropenia is deadlier than it looks</h3>
  <ol class="chainlist">
    <li><b>1.</b> Neutrophils are the cells that <b>produce the visible signs of infection</b>: pus, redness, swelling, heat.</li>
    <li><b>2.</b> Chemo drops the ANC, so there are too few neutrophils to generate that response.</li>
    <li><b>3.</b> The patient becomes infected but the classic signs <b>cannot form</b>.</li>
    <li><b>4.</b> A <b>low-grade fever may be the only sign</b>, and in an older adult even that can be absent.</li>
    <li><b>5.</b> Untreated, the infection seeds the bloodstream → sepsis → death within hours.</li>
    <li><b>6.</b> So 100.4°F in a neutropenic patient is an <b>emergency</b>, not a watch-and-see.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>The trap is any reassuring option: "no drainage or redness, so no infection." Absence of inflammation in a neutropenic patient is expected.</div>
</div>

<div class="card">
  <h3>💧 Why liver cancer causes swelling everywhere</h3>
  <ol class="chainlist">
    <li><b>1.</b> The liver synthesizes <b>albumin</b>.</li>
    <li><b>2.</b> Tumor replaces functioning hepatocytes, so albumin production falls.</li>
    <li><b>3.</b> Albumin generates <b>plasma oncotic pressure</b>, the force holding fluid inside the vessel.</li>
    <li><b>4.</b> With low albumin, oncotic pressure drops and hydrostatic pressure wins.</li>
    <li><b>5.</b> Fluid shifts into the interstitium = <b>third spacing</b> → ascites and edema.</li>
    <li><b>6.</b> Intravascular volume falls, so the patient is <b>edematous and hypovolemic at the same time</b>.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>Edematous does not mean fluid overloaded. He gives you a swollen patient with a low BP and rising heart rate and asks for the priority. The vascular space is dry.</div>
</div>

<div class="card">
  <h3>🍽️ Why cachexia is not just "not eating"</h3>
  <ol class="chainlist">
    <li><b>1.</b> Tumor burden drives a <b>hypermetabolic, pro-inflammatory state</b> (TNF, IL-6).</li>
    <li><b>2.</b> Resting energy expenditure rises even while intake falls from nausea, mucositis, and taste changes.</li>
    <li><b>3.</b> The body catabolizes <b>skeletal muscle and fat</b> to cover the deficit.</li>
    <li><b>4.</b> Protein stores drop → <b>albumin and prealbumin fall</b>, wound healing fails, immunity drops.</li>
    <li><b>5.</b> Calories alone do not fix it. The plan is <b>high-calorie, high-protein, soft, nonirritating</b> food in small frequent amounts.</li>
  </ol>
</div>

<div class="card">
  <h3>🔪 Why NPO before anesthesia</h3>
  <ol class="chainlist">
    <li><b>1.</b> Anesthesia <b>abolishes the gag and cough reflexes</b> and relaxes the lower esophageal sphincter.</li>
    <li><b>2.</b> Gastric contents can passively reflux with no protective reflex to stop them.</li>
    <li><b>3.</b> Aspirated acidic contents cause chemical pneumonitis and airway obstruction.</li>
    <li><b>4.</b> Emptying time differs by content: <b>clear liquids ~2 hr, light meal ~6 hr, fatty meal ~8 hr</b>.</li>
    <li><b>5.</b> So the fasting interval is set by <b>gastric emptying time</b>, which is why clear liquids are allowed latest.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>"NPO after midnight for everything" is the outdated answer he uses as a distractor. The rationale is emptying time, not the clock.</div>
</div>

<div class="card">
  <h3>🔥 Why malignant hyperthermia kills fast</h3>
  <ol class="chainlist">
    <li><b>1.</b> A susceptible patient receives a trigger — <b>succinylcholine</b> or a volatile anesthetic.</li>
    <li><b>2.</b> Defective ryanodine receptors dump <b>calcium out of the sarcoplasmic reticulum</b> and cannot pump it back.</li>
    <li><b>3.</b> Sustained intracellular calcium drives <b>uncontrolled muscle contraction</b> and massive ATP consumption.</li>
    <li><b>4.</b> Hypermetabolism makes CO2 faster than ventilation clears it → <b>rising end-tidal CO2 is the earliest sign</b>.</li>
    <li><b>5.</b> Then tachycardia, rigidity (masseter first), acidosis, hyperkalemia, rhabdomyolysis.</li>
    <li><b>6.</b> <b>Temperature spike is late.</b> Treat with <b>dantrolene</b>, which blocks the calcium release.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>The disease is named after its <b>last</b> sign. If you pick the temperature, you picked the sign that appears after the patient is already in trouble.</div>
</div>

<div class="card">
  <h3>🫁 Why the airway is the PACU first priority</h3>
  <ol class="chainlist">
    <li><b>1.</b> Residual anesthetic and paralytic depress respiratory drive and pharyngeal muscle tone.</li>
    <li><b>2.</b> A relaxed tongue falls back against the posterior pharynx — the most common early obstruction.</li>
    <li><b>3.</b> No airway → no gas exchange → hypoxia → arrest in minutes.</li>
    <li><b>4.</b> Circulation and every other problem take longer to kill the patient.</li>
    <li><b>5.</b> So <b>ABC is a time-to-death ranking</b>, and that is why airway is assessed first.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>He builds priority questions where three options are all real problems. Rank them by how fast each one kills, not by how abnormal each one looks.</div>
</div>

<div class="card">
  <h3>🩹 Why evisceration is positioned low-Fowler with knees flexed</h3>
  <ol class="chainlist">
    <li><b>1.</b> The wound has dehisced and viscera are outside the abdominal cavity.</li>
    <li><b>2.</b> Any position that <b>increases intra-abdominal pressure</b> pushes more bowel out.</li>
    <li><b>3.</b> Low-Fowler with knees bent <b>relaxes the abdominal wall</b> and reduces that pressure.</li>
    <li><b>4.</b> Saline-moistened sterile gauze keeps bowel from drying and necrosing.</li>
    <li><b>5.</b> NPO because the patient is going back to the OR.</li>
    <li><b>6.</b> Never push the bowel back in — that contaminates the peritoneum.</li>
  </ol>
  <div class="hy"><span class="tag">Connect it</span>Valsalva, coughing, straining, and vomiting all raise intra-abdominal pressure — which is why they are the risk factors AND the thing you prevent.</div>
</div>

<div class="card">
  <h3>⚫ Why palliative is not hospice</h3>
  <ol class="chainlist">
    <li><b>1.</b> <b>Palliative</b> is defined by the <b>goal</b> — symptom and psychosocial support — not by prognosis.</li>
    <li><b>2.</b> Because it is goal-defined, it can start at <b>diagnosis</b> and run <b>alongside curative treatment</b>.</li>
    <li><b>3.</b> <b>Hospice</b> is defined by <b>prognosis</b> (about six months or less) plus the decision to stop curative therapy.</li>
    <li><b>4.</b> So all hospice care is palliative, but most palliative care is not hospice.</li>
    <li><b>5.</b> Neither one is a DNR. A DNR is a separate order about resuscitation only.</li>
  </ol>
  <div class="trap"><span class="tag">Where he turns the screw</span>The distractor is always "palliative means stopping treatment" or "palliative equals a DNR." Both conflate a care philosophy with a legal order.</div>
</div>

<div class="card">
  <h3>🕊️ Why hope is supported by pain control, not reassurance</h3>
  <ol class="chainlist">
    <li><b>1.</b> False reassurance about cure sets a goal the patient cannot reach.</li>
    <li><b>2.</b> When that goal fails, trust is lost and hope collapses harder.</li>
    <li><b>3.</b> Uncontrolled pain narrows attention to the body and makes any goal feel impossible.</li>
    <li><b>4.</b> Controlling pain restores enough function to <b>engage with something meaningful</b>.</li>
    <li><b>5.</b> So hope is built on <b>achievable short-term goals</b> plus symptom control, not optimism.</li>
  </ol>
</div>

<div class="hy">🧠 <b>Self-test:</b> pick a question you missed and ask which link in the chain you did not know. If you cannot name the link, you were guessing from recognition. Go back to that chain before answering more questions.</div>

<div id="whyQuiz"></div>
`;

<script>
/* ===== CLASS NOTES ===== */
let notesList=[], noteTopic='other', noteFilter='keep';
const NOTE_TOPICS=['aging','chronic','cancer','resp','pre','intra','post','eol','meds','other'];
const NOTE_LABEL={aging:'Aging',chronic:'Chronic',cancer:'Cancer',resp:'Respiratory',pre:'Preop',intra:'Intraop',post:'Postop',eol:'End-of-life',meds:'Meds',other:'Other'};
(function restoreNotes(){ try{ const r=localStorage.getItem('nur256u1_notes'); if(r) notesList=JSON.parse(r); }catch(e){} })();
const NOTES_STORAGE_KEY='nur256u1_notes';
function saveNotes(){ try{ localStorage.setItem('nur256u1_notes', JSON.stringify(notesList)); }catch(e){} }
function escN(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
let noteDraft='', noteDraftStar=false;
function captureDraft(){ const el=document.getElementById('noteInput'); if(el) noteDraft=el.value; const c=document.getElementById('noteStar'); if(c) noteDraftStar=c.checked; }
function setNoteTopic(t){ captureDraft(); noteTopic=t; renderNotes(); }
function setNoteFilter(f){ captureDraft(); noteFilter=f; renderNotes(); }
function addNote(){
  const el=document.getElementById('noteInput'); if(!el)return;
  const t=el.value.trim(); if(!t){ toast('Nothing to save'); return; }
  const star=document.getElementById('noteStar').checked;
  notesList.unshift({id:Date.now()+''+Math.floor(Math.random()*999),t,topic:noteTopic,star,ts:Date.now()});
  saveNotes(); noteDraft=''; noteDraftStar=false; noteFilter = star?'keep':'inbox'; renderNotes();
  toast(star?'Saved to Keep':'Saved to Inbox');
}
function toggleStar(id){ captureDraft(); const n=notesList.find(x=>x.id===id); if(n){ n.star=!n.star; saveNotes(); renderNotes(); } }
function delNote(id){ captureDraft(); notesList=notesList.filter(x=>x.id!==id); saveNotes(); renderNotes(); toast('Deleted'); }
function clearInbox(){
  const n=notesList.filter(x=>!x.star).length;
  if(!n){ toast('Inbox already empty'); return; }
  if(confirm('Delete '+n+' unsorted note'+(n===1?'':'s')+'? Anything starred stays.')){
    notesList=notesList.filter(x=>x.star); saveNotes(); renderNotes(); toast('Inbox cleared');
  }
}
function copyNotes(){
  const list=notesList.filter(x=>x.star);
  if(!list.length){ toast('Nothing starred yet'); return; }
  const txt=list.map(n=>'['+NOTE_LABEL[n.topic]+'] '+n.t).join('\n');
  const done=()=>toast('Copied '+list.length+' notes');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,cb){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast('Copy failed'); }
  document.body.removeChild(ta);
}
/* ---- notes backup: export / import / copy-all ---- */
function notesKey(){ return NOTES_STORAGE_KEY; }
function exportNotes(){
  if(!notesList.length){ toast('No notes to export'); return; }
  const payload=JSON.stringify({v:1,key:notesKey(),saved:new Date().toISOString(),notes:notesList});
  showNotesBox('\u{1F4E6} Backup code', payload,
    'Copy this whole block and keep it somewhere safe \u2014 a note on your phone, an email to yourself, or paste it to Claude. Paste it into Import on any device to restore.');
}
function copyAllNotes(){
  if(!notesList.length){ toast('No notes yet'); return; }
  const txt=notesList.map(n=>(n.star?'\u2605 ':'\u25CB ')+'['+(NOTE_LABEL[n.topic]||n.topic)+'] '+n.t).join('\n');
  showNotesBox('\u{1F4CB} All notes as text', txt,
    'Readable format \u2014 good for pasting to Claude or into a document. \u2605 means starred.');
}
function showNotesBox(title, content, hint){
  const host=document.getElementById('notesBox'); if(!host)return;
  host.innerHTML=`<div class="card" style="border-color:var(--purple)">
    <h3>${title}</h3>
    <p style="font-size:.86rem;color:var(--muted);margin-top:0">${hint}</p>
    <textarea id="notesOut" class="noteinput" rows="7" readonly>${content.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</textarea>
    <div class="chiprow" style="margin-top:10px">
      <button class="mini" onclick="copyBoxText()">Copy to clipboard</button>
      <button class="mini" onclick="document.getElementById('notesBox').innerHTML=''">Close</button>
    </div>
  </div>`;
  const ta=document.getElementById('notesOut'); if(ta){ ta.focus(); ta.select(); ta.scrollIntoView({behavior:'smooth',block:'center'}); }
}
function copyBoxText(){
  const ta=document.getElementById('notesOut'); if(!ta)return;
  const done=()=>toast('Copied');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();try{document.execCommand('copy');done();}catch(e){toast('Select and copy manually');}}); }
  else { ta.select(); try{document.execCommand('copy'); done();}catch(e){ toast('Select and copy manually'); } }
}
function openImport(){
  const host=document.getElementById('notesBox'); if(!host)return;
  host.innerHTML=`<div class="card" style="border-color:var(--teal)">
    <h3>\u{1F4E5} Import notes</h3>
    <p style="font-size:.86rem;color:var(--muted);margin-top:0">Paste a backup code below. Existing notes are <b>kept</b> \u2014 this merges rather than replacing, and skips anything already here.</p>
    <textarea id="notesIn" class="noteinput" rows="6" placeholder="Paste your backup code here"></textarea>
    <div class="chiprow" style="margin-top:10px">
      <button class="mini on" onclick="doImport()">Import</button>
      <button class="mini" onclick="document.getElementById('notesBox').innerHTML=''">Cancel</button>
    </div>
  </div>`;
  const ta=document.getElementById('notesIn'); if(ta){ ta.focus(); ta.scrollIntoView({behavior:'smooth',block:'center'}); }
}
function doImport(){
  const ta=document.getElementById('notesIn'); if(!ta)return;
  const raw=(ta.value||'').trim();
  if(!raw){ toast('Paste a backup code first'); return; }
  let data;
  try{ data=JSON.parse(raw); }catch(e){ toast('That does not look like a backup code'); return; }
  const incoming = Array.isArray(data)?data:(data&&Array.isArray(data.notes)?data.notes:null);
  if(!incoming){ toast('No notes found in that code'); return; }
  const have=new Set(notesList.map(n=>n.id));
  const seen=new Set(notesList.map(n=>(n.t||'').trim()));
  let added=0, skipped=0;
  incoming.forEach(n=>{
    if(!n||typeof n.t!=='string'||!n.t.trim()) return;
    if(have.has(n.id) || seen.has(n.t.trim())){ skipped++; return; }
    notesList.push({ id: n.id || (Date.now()+''+Math.floor(Math.random()*999)),
      t: n.t, topic: (NOTE_LABEL[n.topic]?n.topic:'other'), star: !!n.star, ts: n.ts || Date.now() });
    have.add(n.id); seen.add(n.t.trim()); added++;
  });
  notesList.sort((a,b)=>(b.ts||0)-(a.ts||0));
  saveNotes();
  document.getElementById('notesBox').innerHTML='';
  renderNotes();
  toast(added+' note'+(added===1?'':'s')+' imported'+(skipped?', '+skipped+' already here':''));
}
function renderNotes(){
  const host=document.getElementById('sec-notes'); if(!host)return;
  const keep=notesList.filter(n=>n.star), inbox=notesList.filter(n=>!n.star);
  const shown = noteFilter==='keep'?keep:inbox;
  const chips=NOTE_TOPICS.map(t=>`<button class="chip ${noteTopic===t?'on':''}" onclick="setNoteTopic('${t}')">${NOTE_LABEL[t]}</button>`).join('');
  const rows = shown.length ? shown.map(n=>`
    <div class="notecard">
      <div class="noterow">
        <span class="notetag">${NOTE_LABEL[n.topic]}</span><span class="notespacer"></span>
        <button class="mini ${n.star?'on':''}" onclick="toggleStar('${n.id}')">${n.star?'★ Keep':'☆ Keep'}</button>
        <button class="mini danger" onclick="delNote('${n.id}')">Delete</button>
      </div>
      <div class="notetext">${escN(n.t)}</div>
    </div>`).join('')
    : `<div class="card" style="text-align:center;color:var(--muted)">${noteFilter==='keep'?'Nothing starred yet. Star a note when Casteel signals it is testable.':'Inbox is empty. Everything you wrote has been sorted or cleared.'}</div>`;
  host.innerHTML=`
  <h2 class="sec-title"><span class="sec-emoji">✍️</span> Class Notes</h2>
  <p class="intro-line">Type fast during lecture. Sort later. Saves on this device only.</p>

  <div class="card">
    <textarea id="noteInput" class="noteinput" rows="3" placeholder="Type a keyword, a phrase he repeated, a question he asked the room...">${escN(noteDraft)}</textarea>
    <div class="chiprow">${chips}</div>
    <label class="starline"><input type="checkbox" id="noteStar" ${noteDraftStar?"checked":""}> <b>Star it</b> — he signaled this is on the test</label>
    <button class="btn wide" onclick="addNote()">Save note</button>
  </div>

  <div class="hy"><span class="tag">Keep this small on purpose</span>Not everything said in class is testable, and a page of notes you never reread is just extra weight. Star only what he flags, questions he asks out loud, and anything that contradicts what you already believed. Everything else drops to <b>Inbox</b>, and you clear the inbox at the end of the week without guilt.</div>

  <div class="card">
    <div class="chiprow">
      <button class="chip ${noteFilter==='keep'?'on':''}" onclick="setNoteFilter('keep')">★ Keep (${keep.length})</button>
      <button class="chip ${noteFilter==='inbox'?'on':''}" onclick="setNoteFilter('inbox')">Inbox (${inbox.length})</button>
    </div>
    ${keep.length>25&&noteFilter==='keep'?`<div class="trap"><span class="tag">Getting heavy</span>You have ${keep.length} starred notes. Past about 25 you are collecting, not studying. Reread them and unstar anything you already know cold.</div>`:''}
    ${rows}
    <div class="hy"><span class="tag">Keeping your notes safe</span>
  Notes are stored by your <b>browser, for this website address</b>. Replacing the file at the same GitHub Pages URL <b>keeps them</b>. They will NOT follow you to a different browser, a different device, a private/incognito window, or a copy opened from your Downloads folder. Use <b>📦 Export backup</b> to move them anywhere — or to send them to Claude.</div>
  <div id="notesBox"></div>
    <div class="chiprow" style="margin-top:12px">
      <button class="mini" onclick="copyNotes()">Copy starred</button>
      <button class="mini" onclick="copyAllNotes()">Copy all as text</button>
      <button class="mini" onclick="exportNotes()">\u{1F4E6} Export backup</button>
      <button class="mini" onclick="openImport()">\u{1F4E5} Import</button>
      <button class="mini danger" onclick="clearInbox()">Clear inbox</button>
    </div>
  </div>`;
}
renderNotes();

</script>

document.getElementById('sec-aging').innerHTML=`
<h2 class="sec-title"><span class="sec-emoji">🧓</span> Aging — Head to Toe</h2>
<p class="intro-line">One principle drives almost every geriatric answer: aging means less physiologic reserve.</p>

<div class="card" style="border-color:var(--teal)">
  <h3>Master principle</h3>
  <p class="why-chain">Aging = <b>less physiologic reserve</b>. Each system still works at rest but has little extra capacity to handle stress — surgery, infection, blood loss, a new drug. That single idea is the answer key to most of this unit.</p>
</div>

<div class="card">
  <h3>Normal age changes by system — head to toe</h3>
  <table class="lab">
    <tr><th>System</th><th>Age-related change</th><th>Why it matters</th></tr>
    <tr><td><b>Cellular / extracellular</b></td><td>Accumulation of <b>lipofuscin</b> pigment; degradation of <b>elastin and collagen</b>; hematopoietic changes reduce RBC production</td><td>Homeostasis and organ efficiency fall. <b>Increased rates of anemia</b></td></tr>
    <tr><td><b>Cardiovascular</b></td><td><b>Stenosis of valves</b>, <b>fewer pacemaker cells</b>, ↑arterial resistance, calcium and fat deposits in arterial walls, <b>myocardial hypertrophy</b> affecting left ventricular function</td><td>Reduced heart efficiency and low reserve. Symptoms are often atypical — dyspnea or confusion instead of chest pain</td></tr>
    <tr><td><b>Respiratory</b></td><td><b>Calcification and weakening of chest wall muscles</b>, ↓lung mass, <b>↑residual volume</b>, ↓aerobic capacity ~10% per decade</td><td>Less able to compensate under stress. Smoking cessation is key</td></tr>
    <tr><td><b>Nervous</b></td><td>Aging affects <b>structure, chemistry, and function</b>. ↓nerve cells and ↓neurotransmitter synthesis</td><td><b>Slower reaction times → fall risk.</b> Mental function may be threatened by stress. <b>Sudden confusion signals an underlying problem</b></td></tr>
    <tr><td><b>Sensory</b></td><td>↓visual acuity and hearing ability</td><td>Sensory losses affect <b>quality of life</b>. Assistive devices compensate and improve functional ability</td></tr>
    <tr><td><b>Musculoskeletal</b></td><td>↓bone density and ↓muscle mass</td><td><b>Osteoarthritis and osteoporosis</b> are common. Weight-bearing exercise and calcium recommended</td></tr>
    <tr><td><b>Gastrointestinal</b></td><td><b>Gastric motility slows</b>, affecting nutrient absorption</td><td>↑<b>constipation and aspiration</b> risk. Promote dental care, high fiber, adequate fluids</td></tr>
    <tr><td><b>Integumentary</b></td><td>↓epidermal proliferation, <b>thinner dermis</b>, reduced elastic fibers, <b>stiffer collagen</b>, ↓subcutaneous fat</td><td>Impaired <b>temperature regulation</b>. ↑susceptibility to <b>burns, injury, and infection</b>. Turgor unreliable</td></tr>
    <tr><td><b>Genitourinary</b></td><td>↓kidney mass and GFR, ↑incontinence and UTI</td><td>Drugs clear slower; UTI often presents as confusion</td></tr>
    <tr><td><b>Reproductive</b></td><td><b>Female:</b> thinning vaginal wall, ↓secretions, uterine atrophy. <b>Male:</b> less firm testes, ↓testosterone production</td><td><b>Sexual activity remains important.</b> Decline is usually tied to loss of a partner or health issues, not age itself</td></tr>
  </table>
  <div class="hy"><span class="tag">Sensory stimulation</span>Beyond assistive devices, <b>sensory stimulation enhances well-being</b> — colors, textures, tastes, and sounds. This is an intervention, not a nicety.</div>
  <div class="hy"><span class="tag">Nutrition and the nervous system</span>Proper nutrition and <b>vitamin B12</b> intake matter for mental function. A B12 deficiency can look like dementia.</div>
  <div class="trap"><span class="tag">Don't get tricked</span><b>Sudden confusion, severe memory loss, and big mood swings are NOT normal aging.</b> Suspect delirium, infection, drug toxicity, or electrolyte change. Assess and report.</div>
</div>
</div>

<div class="card" style="border-color:var(--purple)">
  <h3>🧓 Geriatric Syndromes</h3>
  <p class="why-chain">Conditions that do not fit one organ system, have <b>multiple contributing causes</b>, and show up disproportionately in older adults. Because the causes are multifactorial, they require a <b>multidisciplinary and comprehensive assessment</b> — not a single specialist and not a single test.</p>
  <table class="lab">
    <tr><th>Syndrome</th><th>What to watch for</th><th>Prevention during hospitalization</th></tr>

  <div class="trap"><span class="tag">Where he turns the screw</span>Any option calling a geriatric syndrome an <b>expected part of aging</b> — "incontinence is normal at her age," "confusion is expected," "some falling is inevitable." None of these are normal aging. Each is multifactorial and each is <b>preventable or treatable</b>.</div>

</div>

<div class="card">
  <h3>Delirium vs. Dementia vs. Depression</h3>
  <table class="lab">
    <tr><th></th><th>Delirium</th><th>Dementia</th><th>Depression</th></tr>

    <tr><td><b>Course</b></td><td>Fluctuates, worse at night</td><td>Steady decline</td><td>Worse in the morning</td></tr>

    <tr><td><b>Nursing action</b></td><td><b>Medical emergency, report</b></td><td>Safety, routine, orientation</td><td>Screen and refer</td></tr>
  </table>
  <div class="mnem"><div class="tag">Fast recall</div><div class="big">Delirium = Deliver help NOW. Dementia = Decline over time.</div></div>
</div>

<div class="card">
  <h3>Medications in older adults</h3>
  <ul class="clean">
    <li><b>Start low, go slow.</b> Simplify the regimen wherever possible.</li>
    <li>Altered pharmacokinetics: less body water, more fat, ↓ liver metabolism, ↓ kidney excretion.</li>
    <li><b>Polypharmacy</b> = 5 or more medications. Raises adverse reactions, interactions, and falls.</li>
    <li><b>Beers criteria</b> drugs to flag: anticholinergics (diphenhydramine), benzodiazepines, first-generation antihistamines, long-acting sulfonylureas, NSAIDs in CKD.</li>
    <li><b>Prescribing cascade:</b> a side effect gets mistaken for a new disease and treated with another drug.</li>
  </ul>
  <div class="hy"><span class="tag">He tests this</span>Why smaller doses? <b>Liver (metabolism) and kidney (excretion).</b> Not lungs and heart. Not stomach and intestines.</div>
</div>

<div class="card" style="border-color:var(--red)">
  <h3>Abuse vs. Neglect — know the difference</h3>
  <table class="lab">
    <tr><th></th><th>Abuse</th><th>Neglect</th></tr>
    <tr><td><b>Definition</b></td><td>An intentional act causing harm</td><td>Failure to provide necessities, intentional or not</td></tr>
    <tr><td><b>Types</b></td><td>Physical, emotional, sexual, financial</td><td>Food, hydration, hygiene, medication, medical care</td></tr>
    <tr><td><b>Findings</b></td><td>Bruises in different stages, grip patterns, fearfulness, unexplained fractures</td><td>Weight loss, pressure injuries, dehydration, expired or unfilled prescriptions, poor hygiene</td></tr>

  <ul class="clean">
    <li><b>Leading risk factor:</b> overwhelming caregiver stress.</li>
    <li>Interview the patient <b>separately</b> from the caregiver.</li>
    <li>Reporting is a <b>legal duty</b> and does not require proof or a second visit.</li>
    <li>Document objectively with direct quotations. Do not confront the caregiver.</li>
  </ul>
</div>

<div class="card">
  <h3>Arteriosclerosis vs. Atherosclerosis</h3>
  <table class="lab">
    <tr><th>Term</th><th>What it is</th><th>Key point</th></tr>
    <tr><td><b>Arteriosclerosis</b></td><td>General hardening and stiffening of arterial walls</td><td>The umbrella term. Loss of elastic recoil.</td></tr>
    <tr><td><b>Atherosclerosis</b></td><td>A specific subtype with fatty lipid plaque inside the lumen</td><td>The plaque (atheroma) is the hallmark</td></tr>
  </table>
  <div class="mnem"><div class="tag">Memory hook</div><div class="big">Athero = Atheroma = A fatty plaque</div></div>
  <div class="trap"><span class="tag">Risk factor trap</span><b>Non-modifiable:</b> age, sex, family history, ethnicity. <b>Modifiable:</b> smoking, hypertension, diabetes, obesity, sedentary lifestyle, dyslipidemia.</div>
</div>

<div id="agingQuiz"></div>`;
